name: CI

# `consumer-install` installs with plain pip, no pixi, on each supported
# Python. `check` runs `pixi run check`, the same command contributors run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Conventional commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # A squash-merged pull request's title becomes the commit on main,
      # which Release Please reads to choose the next version.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  consumer-install:
    name: Consumer install, plain pip (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install with pip only
        run: pip install -e ".[dev]"

      - name: Import check
        run: python -c "import coralmap; print(coralmap.__version__)"

      - name: Verify the runtime dependency set has not grown
        # Runtime dependencies are limited to pydantic and pyyaml; adding one
        # means updating this list on purpose.
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import requires
          runtime = sorted(
              r.split(";")[0].split(">")[0].split("=")[0].split("[")[0].strip()
              for r in requires("coralmap") or []
              if "extra ==" not in r
          )
          expected = ["pydantic", "pyyaml"]
          print("runtime dependencies:", runtime)
          if runtime != expected:
              sys.exit(f"expected {expected}, got {runtime}")
          print("OK")
          PY

      - name: Test
        run: pytest

  check:
    name: Lint, types, schemas, tests (pixi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          # Fails on a stale pixi.lock instead of re-solving.
          locked: true
          cache: true

      - name: Check
        run: pixi run check

  notebooks:
    name: Tutorial notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          # Fails on a stale pixi.lock instead of re-solving.
          locked: true
          cache: true

      - name: Execute notebooks
        # Refuses saved outputs, then runs every cell without writing the notebooks.
        run: pixi run notebooks

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          locked: true
          cache: true

      - name: Build
        run: pixi run build

      - name: Verify entries are bundled into the wheel
        # A wheel without the force-included catalog still installs and only
        # fails at load(). The _bundled/ paths test the force-include.
        run: |
          python3 - <<'PY'
          import sys, zipfile, pathlib
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("no wheel was built")
          names = zipfile.ZipFile(wheels[-1]).namelist()
          print("\n".join(sorted(names)))
          required = (
              "coralmap/__init__.py",
              "coralmap/py.typed",
              "coralmap/_bundled/entries/README.md",
              "coralmap/_bundled/schema/README.md",
          )
          missing = [n for n in required if n not in names]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          print(f"\nOK: {wheels[-1].name}")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/
