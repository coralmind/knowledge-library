# LICENSE.md is the MIT text plus a short patent grant and stays as published.

[global]
exclude = [
    ".git",
    ".github",
    "node_modules",
    "vendor",
    "dist",
    "build",
    "CHANGELOG.md",
    "LICENSE.md",
]
respect-gitignore = true
disable = [
    "MD013", # line length
    "MD033", # inline HTML
    "MD041", # first line must be a heading
]

[MD003]
style = "consistent"

[MD004]
style = "consistent"

[MD049]
style = "consistent"

[MD050]
style = "consistent"

# Figures are loaded from viewer/content/, not from the markdown file's directory.
# A link figures/ingredients.svg in guide/ is viewer/content/figures/ingredients.svg.
[MD057]
search-paths = ["viewer/content"]

# {{entries(source)|about}} uses | as a template filter. The viewer skips that
# pipe when it splits a table row. rumdl treats every | as a cell boundary and
# has no setting for this, and its fix rewrites the cell.
[per-file-ignores]
"viewer/content/**/*.md" = ["MD056"]
# The home page title lives in front matter, and the hero heading is also level 1.
"viewer/content/introduction.md" = ["MD056", "MD025"]
