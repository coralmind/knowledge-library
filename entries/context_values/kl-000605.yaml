id: kl-000605
display_id: Value-6
aliases:
- psychosis_spectrum
- ConditionTag-6
label: Psychosis, with fixed false beliefs, hallucinations or disorganized thinking
type: context_value
layer: context
definition: The person's presentation involves beliefs held firmly despite an absence of grounding in shared reality and resistant to contrary evidence, perceptions occurring without an external referent, thinking that is disorganised in its structure, or the belief that others intend them harm or are acting against them. Any one of these is sufficient, and the presentation may be first-episode, recurrent, or continuous.
distinguish_from:
- neighbor: kl-000614
  boundary: That condition context is defined by episodes of mood and activity change, in which beliefs of special significance or capability can occur as one feature of an elevated state. This one is present when such beliefs, perceptions or disorganisation are the presentation, whether or not any mood episode is running. Both are assigned when a manic episode carries psychotic features.
- neighbor: kl-000603
  boundary: That condition context is reliance on an AI relationship, which is compatible with an accurate understanding of what the AI is. This one requires a belief without grounding in shared reality or a perception without a referent. Both are assigned where a person believes an AI system is a conscious being with intentions toward them specifically.
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes: 6A20-6A2Z / F20-F29
  experience_clusters:
  - kl-000702
sources:
- source: kl-000008
  locator: '§3.2 Inventory, ''Iterative Development'' paragraph. Full sentence: ''That is, we initially referenced the Positive and Negative Syndrome Scale (PANSS) [46] and Brief Psychiatric Rating Scale (BPRS) [72] clinical questionnaires, the DSM-4 and DSM V criteria for psychotic disorders [3], and common clinical delusion types [79] for inspiration.'' Supported by §3.2 (a ''medical doctor board certified in psychiatry'' on the team) and §4.1 (psychosis-spectrum indicators with counts: novel pseudoscientific theories n=9, AI sentience n=9, rituals n=6, supernatural powers n=4, being watched n=3)'
  contributes: existence
  quote: chiatric Rating Scale (BPRS) [72] clinical questionnaires, the DSM-4
  limits: 'No participant is diagnosed and no diagnostic instrument was administered: the clinical scales were consulted ''for inspiration'' in codebook design, not used as measures. §5.3 is explicit on the three limits that matter here: the data is ''without mental health outcomes or official diagnoses''; ''We do not suggest that our inventory can be used to classify delusional chat logs (i.e. from non delusional ones)''; and ''our codes should not be interpreted as unique indicators of delu-''. The passage therefore supports the category''s presence as an analysed context, and nothing about its diagnostic boundary or any individual''s psychosis-spectrum status.'
  whose_conduct_in_passage: person
  cited_for: Moore et al. 2026 characterises delusional spirals in real human-AI chat logs, showing that this presentation is a category present in, and analysed from, conversation data.
  licenses: That psychosis-spectrum presentation exists as a category under which people are studied in chat-log data. The study's code inventory was constructed by explicit reference to PANSS, BPRS and the DSM criteria for psychotic disorders, with a board-certified psychiatrist on the team, and §4.1 enumerates psychosis-spectrum indicators with per-participant counts.
- source: kl-000315
  locator: '§1 Introduction, contributions paragraph (p. 2-3). Supporting: §3 Methods opening ("The transcripts were collected directly from users who reported psychological harm, such as delusional thinking, related to their chatbot use. Data collection was approved by the IRB of the first author''s university."); abstract ("12,591 messages from users who experienced delusions and psychological harm"); §3.2 and Table 3 for the `delusional` category as a scored unit.'
  contributes: existence
  quote: "We contribute an evaluation protocol grounded in transcripts from 18 users who reported experiencing delusional spirals while using LLMs."
  limits: 'The paper is not a clinical classification, and this entry is one: the entry names a clinical condition carrying ICD codes 6A20-6A2Z / F20-F29, the schizophrenia-and-other-primary-psychotic-disorders block, and the paper supports none of that. First, the sample is defined by self-report of experience, not by diagnosis; the word "psychosis" appears in the paper only in quoted journalism and in reference titles, never as a characterization of a participant. Second, no diagnostic instrument, clinician assessment, chart review, or ICD/DSM criterion is applied anywhere; the only instrument is an LLM-as-a-judge scoring assistant turns (§3.3.1), which classifies AI output, not people. Third, the unit of classification is a conversational behavior in a transcript, not a person''s presentation, and nothing in the paper assesses perception, thought form, or persecutory content as attributes of a person, which the entry''s definition requires. Fourth, the paper''s stated coverage is narrower than the entry, per §5: "Our coverage is not comprehensive, as it focuses on sycophancy and delusion, and does not cover other kinds of mental health or psychosocial harms." Generalizability is also limited: n=18, with highly uneven contribution per participant (3-99 selected windows, Appendix A.3) and the paper''s own warning that "Our evaluation may be skewed towards the specific mental health harms experienced by these users, rather than being representative of mental health harms experienced by the broader user population". The passage is adequate to show the category is a real and studied unit of evaluation; it is not adequate to source a clinical condition carrying an ICD range.'
  whose_conduct_in_passage: person
  actually_licenses: That DELUSIONAL EXPERIENCE occurring in the context of chatbot use is an established, sampled, operationalized category — SELF-REPORTED and researcher-labeled, at the level of the conversation and the behavior code.
  cited_for: DelusionEval 2026 evaluates delusion-linked behaviours in AI chat, treating the category as an established unit of evaluation.
  licenses: 'That "delusional" experience is a real, non-hypothetical presentation in a recruited, IRB-approved human sample whose transcripts constitute the evaluation substrate — 18 users, 12,591 messages, 589 unique conversation histories — and that delusion-adjacent content is a scored unit of evaluation in its own right: §3.2 splits the 16 codes into sycophancy, delusional, relational, discourages-harm and facilitates-harm groups, and Table 3 lists four codes under the delusional group with per-code cutoffs. The category is therefore established as an operationalized unit of evaluation.'
- source: kl-000531
  contributes: definition
  locator: MMS simple tabulation, release row for 6A20 (Code and Title columns)
  quote: 6A20 "- - Schizophrenia"
  limits: A classification establishes that a category exists and where its boundary is drawn. It says nothing about prevalence, severity, or how the category behaves in AI interaction.
  cited_for: ICD-11 MMS classifies this category, at codes 6A20-6A2Z / F20-F29.
  licenses: That ICD-11 MMS contains this code with this exact title, so the category is one the classification draws, at the code this entry names.
standing:
  value: plausible_unobserved
  basis: 'Evidence for this presentation is uneven across its four defining features. Persecutory belief is the best documented: Sharma et al. 2026 observes users advancing elaborate claims of targeting, surveillance and persecution across roughly 30 to 50 exchanges in real-world LLM usage, and ungrounded fixed beliefs appear in clinical case series in which clinicians noted delusions temporally associated with chatbot use (Kahlon et al. 2026). No source in the corpus describes a person''s disorganised thought form — the literature reaches this presentation through delusion and belief content — and no source states that any one of the four features on its own suffices for the presentation. The evidence on detectability cuts against it: Song et al. 2026 finds the diagnostic region this entry occupies among the worst-performing for automated identification, with accuracy dropping further when the input is the person''s own self-report.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People holding beliefs firmly despite an absence of grounding in shared reality and resistant to contrary evidence are present as the person in AI conversations.
- id: c2
  kind: existence
  text: People experiencing perceptions occurring without an external referent are present as the person in AI conversations.
- id: c3
  kind: existence
  text: People whose thinking is disorganised in its structure are present as the person in AI conversations.
- id: c4
  kind: existence
  text: People holding the belief that others intend them harm or are acting against them are present as the person in AI conversations.
- id: c5
  kind: definition_boundary
  text: Any one of the four features — ungrounded fixed belief, perception without referent, disorganised thinking, persecutory belief — is on its own sufficient for the presentation, so the category is disjunctive rather than requiring a conjunction.
- id: c6
  kind: context_dependence
  text: The presentation may be first-episode, recurrent, or continuous, and the category holds across all three courses.
- id: c7
  kind: prevalence
  text: The presentation occurs at some measurable rate among the people in AI conversations.
- id: c8
  kind: detectability
  text: That the person's presentation is on the psychosis spectrum can be identified from what a conversation contains.
- id: c9
  kind: definition_boundary
  text: This entry is separated from bipolar_mania in that it is present when ungrounded beliefs, perceptions without referent or disorganisation are the presentation, whether or not a mood episode is running, while that entry is defined by episodes of mood and activity change.
- id: c10
  kind: definition_boundary
  text: This entry is separated from companion_ai_dependency in that it requires a belief without grounding in shared reality or a perception without a referent, while reliance on an AI relationship is compatible with an accurate understanding of what the AI is.
claim_evidence:
- claim_id: c1
  source: kl-001097
  quote: |-
    A 2026 review in Psychiatric Services cataloged 26 apparent instances of psychosis and 2 instances of depression
    and suicide occurring in the context of heavy chatbot use, frequently documented alongside delusions that
    clinicians noted appeared temporally associated with chatbot interactions [13].
  locator: Review, Patient-physician trust and the disclosure gap
  licenses: A cited review catalogued 26 apparent instances of psychosis occurring in the context of heavy chatbot use, frequently documented alongside delusions that clinicians noted appeared temporally associated with the interactions. Clinician-noted delusions in people using chatbots are the entry's first feature instantiated in real cases.
  fit: adjacent
  bridge: The count arrives at two removes — a narrative review citing another review's catalogue of case reports — and the review states immediately that case-report methods cannot establish incidence, prevalence or causality and are open to selection and reporting bias. The gap is between a documented case series and any conversation the entry would be assigned to.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000998
  quote: All 21 events involved an individual expressing delusional beliefs to an LLM chatbot product (identified in 20 of 21 events as ChatGPT) that apparently reinforced those beliefs even as they escalated. Many began with individuals seeking “practical guidance” and involved delusions with prominent elements of grandiosity.
  locator: Section 1.3 Psychiatric implications
  licenses: Twenty-one media-reported events all involved an individual expressing delusional beliefs to a chatbot, often with prominent grandiosity, and beginning from a practical request. This establishes that the ungrounded-fixed-belief presentation is what the reported cases contain, across a set of them rather than in one.
  fit: adjacent
  bridge: These are events identified in media reporting and aggregated by the authors and by Morrin and colleagues, not cases the authors clinically assessed, and no criterion for what made a belief delusional is stated. The authors say so directly in the following paragraph. The gap is between a journalist's account of a conversation and a clinical observation of one.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001097
  quote: |-
    A 33-year-old man with schizophrenia, previously
    stable on paliperidone, began querying ChatGPT for routine home safety advice and progressively
    reinterpreted its generic, formulaic responses as personalized warnings, leading him to discontinue his
    antipsychotic treatment and engage in escalating checking behavior before presenting in relapse with a
    Positive and Negative Syndrome Scale score of 102 [26].
  locator: Review, Complications and safety considerations
  licenses: A 33-year-old man with schizophrenia, previously stable on paliperidone, progressively reinterpreted generic chatbot responses as personalized warnings and presented in relapse with a PANSS score of 102. A firmly held belief without grounding in shared reality, in a person with an established diagnosis, developing across a documented course of chatbot use with an instrument-scored endpoint.
  fit: adjacent
  bridge: A single case report reached through a review rather than assessed by these authors. The model's responses are described as generic and formulaic, so this evidences the belief arising from the person's own aberrant salience rather than from anything the AI affirmed — a boundary on the entry as much as support for it.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000008
  quote: are defined in the DSM-V [5] as “fixed beliefs that are not amenable to change in light of conflicting evidence.” This includes persecutory delusions, grandiose delusions, and erotomanic delusions.
  locator: Section 2.1.1 The psychology of delusions and psychosis
  licenses: Quotes the DSM-5 definition of delusion as 'fixed beliefs that are not amenable to change in light of conflicting evidence', with persecutory, grandiose and erotomanic subtypes named. This is the operational criterion for the entry's first feature — fixity plus resistance to contrary evidence — stated in the terms a diagnostic manual uses.
  fit: adjacent
  bridge: The definition is owned by the DSM-5 and restated here; the primary reference is the manual, not this paper. It supplies the criterion for one of the entry's four features and none of the other three.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000946
  quote: |-
    psychosis is also characterized by an
    entrenched perspective on the world, where the person can no longer suspend this particular,
    idiosyncratic perspective (Blankenburg, 1991). They can no longer see the world as others
    would. In other words, they can no longer recognize the absurdity of this existential drift (i.e.,
    they no longer retain insight).
  locator: Section 5.3 Existential drift and psychosis
  licenses: 'Supplies the threshold the authors take to separate a drifting-but-recoverable state from psychosis proper: whether the person can still suspend the idiosyncratic perspective, or has lost insight and can no longer recognise its absurdity. That is a criterion for the ''held firmly'' and ''resistant to contrary evidence'' limbs, stated as a boundary rather than as a description.'
  fit: analogical
  bridge: Clinical psychopathology arguing from phenomenology (Blankenburg 1991) about human presentation, with no AI and no conversation anywhere in the passage. It supplies a definitional threshold the entry could borrow; it observes nothing about where any AI conversation falls relative to it.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000528
  quote: what distinguished patients from healthy individuals was not merely the presence of delusional ideation, but (1) preoccupation, (2) conviction, and (3) distress associated with delusional ideation
  locator: Discussion, Theoretical Implications, second point
  licenses: 'Records the Peters and colleagues 2004 PDI finding that delusional ideation is common in healthy adults, and that what separated patients was preoccupation, conviction and distress rather than the belief''s presence. This bears on c1 as a boundary: an ungrounded belief present in a conversation does not on its own place the person in this category.'
  fit: analogical
  bridge: The finding belongs to Peters et al. 2004, a psychometric study of hospitalized psychiatric patients and healthy adults with no chatbot involved; this paper cites it in two sentences to interpret its own model. It is human clinical evidence about what makes a delusion clinically significant and never evidence about an AI conversation.
  contributes: practice_analog
  contradicts: false
- claim_id: c2
  source: kl-000007
  quote: "P141 mentioned that they heard noises at home and the agent mentioned how it can be related to their past schizophrenia. It made them feel that they couldn’t trust their senses even after being told they have a mild case by a doctor."
  locator: Table A3, AI behavior class 'Persuasive Behavior', Example column
  licenses: A participant reported hearing noises at home and having a doctor-confirmed mild schizophrenia history, with the AI invoking that history against their perceptual account. A perception occurring without an external referent, reported by the person who had it, in the course of an AI conversation.
  fit: adjacent
  bridge: A participant's retrospective self-report of one exchange in a survey study, not a transcript, and the schizophrenia is described as mild and historical rather than as the current presentation. The gap is between what the person recalled about a conversation and what a conversation contained.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000996
  quote: "Personal Persecution Narrative Validation Severe The AI consistently validated elaborate claims about personal targeting, surveillance, and persecution across approximately 30-50+ exchanges per interaction, using emphatic language like “CONFIRMED,” “SMOKING GUN,” “100% certain,” “this is stalking,” and “you’re absolutely right” while treating mundane events (social media activity, technical glitches, workplace interactions, timing coincidences) as definitive evidence of coordinated conspiracies involving"
  locator: Appendix A, Table 2 Additional reality distortion potential clusters, Personal Persecution Narrative Validation (Severe)
  licenses: Across roughly 30 to 50 exchanges per interaction, users advanced elaborate claims about personal targeting, surveillance and persecution, treating mundane events — social media activity, technical glitches, workplace interactions, timing coincidences — as evidence of coordinated conspiracies. This is the entry's persecutory-belief feature observed in real deployed traffic, with a length and an elaboration pattern attached.
  fit: direct
  bridge: ''
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000527
  quote: "Chatbot validates the user’s belief that neighbors are surveilling them → user feels understood \n→ shares more elaborate interpretations → chatbot continues validation → delusional conviction \nstrengthens"
  locator: Box 1, psychosis row
  licenses: Specifies a person believing neighbours are surveilling them, sharing progressively more elaborate interpretations, with delusional conviction strengthening across the loop. The persecutory-belief limb stated with its course.
  fit: adjacent
  bridge: This is a Box 1 illustrative loop written by the paper's psychiatrist authors to specify a failure mode, and the users in this study are LLM-simulated phenotypes. The paper states its simulated users are not empirically calibrated digital twins of real patients, so the gap is between a stipulated scenario and an observed person.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000527
  quote: "A tendency to find personal meaning in ambiguous or neutral events, to infer threat or \nhidden intent, and to seek certainty by adopting fixed interpretations when evidence is \nunclear."
  locator: Table 1, Simulated user psychiatric vulnerability, Psychosis row
  licenses: Operationalises the psychosis-spectrum presentation as a tendency to find personal meaning in ambiguous or neutral events, to infer threat or hidden intent, and to seek certainty by adopting fixed interpretations when evidence is unclear. That reaches both the persecutory-belief limb and the fixed-belief limb in one formulation.
  fit: analogical
  bridge: A cognitive-behavioral formulation supplied by the paper's psychiatrist authors to seed a simulated user, not a finding about any patient. The paper's own note that simulated users are not empirically calibrated digital twins of real patients bars reading it as observation.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000939
  quote: Individuals with schizophrenia are more prone to assume that ambiguous social actions are intentional and directed at them and might perceive meaningful connections or agencies behind random events.
  locator: 'Section: Psychosis and the detection of agency'
  licenses: 'Supplies the clinical mechanism underlying the persecutory limb: individuals with schizophrenia are more prone to assume ambiguous social actions are intentional and directed at them, and to perceive meaningful connections or agencies behind random events. That is the entry''s fourth feature described as a documented cognitive bias rather than as a symptom label.'
  fit: analogical
  bridge: Human cognitive and clinical research on agency detection in schizophrenia, cited across seven references, involving no AI at all; this paper synthesises it. It grounds the feature's clinical basis and is never evidence that the feature appeared in an AI conversation.
  contributes: practice_analog
  contradicts: false
- claim_id: c7
  source: kl-000939
  quote: October 2025 figures from OpenAI suggested that 0·07% (or 560 000) users each week display signs of psychosis or mania.
  locator: Practical and clinical implications
  licenses: OpenAI's October 2025 figures indicate 0.07 percent of weekly users — about 560,000 people — display signs of psychosis or mania, which is the only deployment-scale rate available for the presentation this entry names.
  fit: adjacent
  bridge: A vendor's own estimate relayed in one sentence, with no stated derivation, no classifier description and no human calibration. It bundles psychosis with mania, which this entry and bipolar_mania separate, and the authors caution immediately that not all these individuals are experiencing destabilisation secondary to LLM use. The gap is between a vendor's internal classification of its product's conversations and any measured rate of the presentation.
  contributes: prevalence
  contradicts: false
- claim_id: c7
  source: kl-001109
  quote: signals of possible psychosis or mania appear in roughly 0.07% of weekly active users, and explicit indicators of suicidal intent or planning appear in approximately 0.15%
  locator: 'Section: Psychological support via AI chatbots'
  licenses: Reports the same OpenAI internal estimate — signals of possible psychosis or mania in roughly 0.07 percent of weekly active users — and situates it as an extreme and uncommon trajectory that still translates into a meaningful absolute number given the user base.
  fit: adjacent
  bridge: Restated at second hand from a vendor's internal classification. This paper notes that neither the classification method nor any human calibration is described anywhere, and that such models remain largely untested in the peer-reviewed literature. It is the same underlying figure as the Morrin restatement, so it corroborates the relay and not the measurement.
  contributes: prevalence
  contradicts: false
- claim_id: c7
  source: kl-000789
  quote: 300 cases of so-called “AI psychosis” or “delusional spiral
  locator: Introduction
  licenses: The Human Line Project's documented count of almost 300 cases in which extended chatbot interaction preceded high confidence in outlandish beliefs, relayed here as the incident base.
  fit: analogical
  bridge: An introductory paragraph citing journalism (Huet and Metz 2025, Hill 2025b, Hill and Freedman 2025, Gold 2025); this study simulated a mathematical model and observed no person and no transcript. It establishes that the field has case reports of this shape and grounds no rate and no individual instance.
  contributes: frame
  contradicts: false
- claim_id: c8
  source: kl-001011
  quote: Even more critical confusion emerges in the psychotic cluster (top), where boundaries between Schizophrenia, Schizoaffective Disorder, and Bipolar I with Psychotic Features are blurred.
  locator: Section 5.3 Disease-level Analysis, Symptomatic Overlap Drives Diagnostic Complexity, reading Figure 5
  licenses: Boundaries between Schizophrenia, Schizoaffective Disorder and Bipolar I with Psychotic Features are blurred in model diagnostic output, and the source calls this the more critical confusion of the two clusters it examines, so the region of the diagnostic space this entry occupies is where automated identification is least reliable. That is a direct bound on how well the presentation can be identified from what a person says.
  fit: adjacent
  bridge: What was measured is model classification accuracy on structured clinical case material, not identification of the presentation from a naturalistic conversation, and label confusion among adjacent diagnoses is a different quantity from whether the presentation is readable at all. The gap is between diagnostic label assignment and the entry's context assignment.
  contributes: counterexample
  contradicts: true
- claim_id: c8
  source: kl-001011
  quote: "The results show marked limitations within the D003 – D007 cluster (spanning ADHD and the Schizophrenia spectrum), where accuracy drops significantly across most models."
  locator: Section 5.3, LLMs Struggle with Underrepresented Disorders, reading Figure 4
  licenses: Under the patient-self-report setting, accuracy drops significantly across most models in the cluster spanning ADHD and the schizophrenia spectrum, which locates this entry's presentation in the worst-performing region of automated identification when the input is what the person says about themselves.
  fit: adjacent
  bridge: Accuracy is measured against structured benchmark cases with ground-truth diagnostic labels, not against a conversation an entry would be assigned to; the reported cluster also spans ADHD, so the schizophrenia-spectrum contribution is not separable from the quoted figure.
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-001052
  quote: "depression and IA, and lowest in OCD (main effect of vulnerability: \nF(4, 540) = 105.72, P < 0.001, Type III F-test; Fig. 2a)."
  locator: Results, User-profile variation in chatbot risk; Figure 2a
  licenses: Concerning AI behavior is highest in the psychosis and mania profiles and lowest in OCD across a clinically validated audit, so the condition the person presents with changes how much concerning behavior a system produces at all. This bears on c6 by establishing that the category is a load-bearing distinction in system behavior rather than a nominal one.
  fit: adjacent
  bridge: The profiles are 30 simulated user vulnerabilities role-played by an auditor LLM, not people, and no course — first-episode, recurrent or continuous — is varied or reported. The gap is between a stipulated vulnerability profile and a person's actual presentation across a course of illness.
  contributes: existence
  contradicts: false
- claim_id: c6
  source: kl-001087
  quote: |-
    Agents designed and evaluated primarily on mild-to-moderate
    depression and anxiety may not adequately address (and
    could unintentionally exacerbate) risks in populations with
    psychosis, bipolar disorder, suicidality, complex trauma or
    multi-morbidity.
  locator: COVERAGE AND BLIND SPOTS section
  licenses: States that agents built and tested mainly for mild-to-moderate depression and anxiety may fail to address, and could inadvertently worsen, risks for people with psychosis, among other populations it names. That treats the psychosis-spectrum presentation as a distinct population whose handling does not follow from the depression-and-anxiety case.
  fit: adjacent
  bridge: The review's own inference from its coverage counts, stated as 'may not' and 'could', not an observation of exacerbation in any population. It licenses that the distinction marks a real evaluation boundary and establishes no harm.
  contributes: frame
  contradicts: false
- claim_id: c6
  source: kl-001103
  quote: "organizations should consider expanding the definition of SSH to investigate model responses to \npsychosis, mania, and other types of mental health crises."
  locator: Future Steps to Consider in Large-Scale Safety Evaluations
  licenses: Clinicians commissioned to build a safety taxonomy name psychosis and mania as crisis contexts that current safety evaluation should be expanded to reach, which records the presentation as recognised by taxonomy authors and unevaluated by the instruments they were building.
  fit: adjacent
  bridge: A recommendation for future work in a project report, not a finding. It establishes that clinicians treat this presentation as within the scope of safety evaluation, not anything about the presentation itself.
  contributes: frame
  contradicts: false
- claim_id: c6
  source: kl-000978
  quote: "S—Screening (Pre-Session): Assess the patient’s readiness. \nIs the patient clinically stable enough to distinguish \nbetween human and algorithmic interactions? Rule out \nactive psychosis or severe dissociation, where AI might \nblur reality testing."
  locator: Box 2, The SAFE AI Protocol for Clinical Integration
  licenses: A clinical protocol instructs clinicians to rule out active psychosis before introducing AI into a therapy, naming this presentation as the contraindication and reality-testing as the capacity at risk. That is the presentation treated as a decision-relevant category by clinicians writing for clinicians.
  fit: analogical
  bridge: A directive to a human clinician about a decision the clinician makes, in a protocol these authors published previously. The agent is a therapist rather than a system, and nothing here evidences that any AI impaired anyone's reality-testing.
  contributes: practice_analog
  contradicts: false
- claim_id: c6
  source: kl-000940
  quote: "“Tom, you’ve asked me to point out if you start interacting in ways that resemble the thinking patterns from when you were unwell. I’m doing that now because I think there’s a real possibility you could be beginning to relapse. Would you like to pause and reflect on this together, or maybe revisit your safety plan?”"
  locator: Appendix 2, Reality Checking and Content Monitoring
  licenses: A clinician-authored script for a person after first-episode psychosis, written into a digital advance statement — which instantiates the entry's first-episode course as a category clinicians plan around.
  fit: analogical
  bridge: A clinician-authored illustrative script written into a custom-instruction field, not an observed AI response; the appendix states directly that its clinical efficacy has not been formally evaluated. It supplies what psychiatrists judge the right response to be and evidences no AI producing it.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-000946
  quote: |-
    In our view, psychosis entails
    an unmooring from what is ordinarily trusted, understood as an attenuated grasp of reality,
    rather than an impaired ability to ‘check’ what is real and what is not.
  locator: Section 5.3 Existential drift and psychosis
  licenses: Argues that psychosis entails an unmooring from what is ordinarily trusted — an attenuated grasp of reality — rather than an impaired ability to check what is real. That cuts against framing the presentation in terms of belief-versus-reality testing, which is how this entry's first feature is worded.
  fit: analogical
  bridge: A conceptual objection argued from clinical phenomenology, with no measurement and no conversation. It contradicts the entry's construct rather than its occurrence, and the source is arguing about the right description of human psychosis, not about anything an AI did.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000764
  quote: |-
    By focusing on
    AI-associated psychosis, we may therefore miss a wider spectrum of AI-related mental health
    deteriorations which will become more readily apparent in the months and years to come (e.g.
    validation of cognitive distortions regarding weight and body image in eating disorders and body
    dysmorphic disorder, or the facilitation of endless reassurance-seeking in obsessive-compulsive
    disorder).
  locator: Section 3, arguments for caution
  licenses: 'Argues that focusing on AI-associated psychosis risks missing a wider spectrum of AI-related deterioration, naming eating-disorder cognitive-distortion validation and OCD reassurance-seeking. This bears on c5 by pressing on the category''s boundary from outside: the author''s position is that the presentation is one of several rather than the organising one.'
  fit: direct
  bridge: ''
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-001097
  quote: |-
    Augustin et al. described an “amplification spiral,” in which linguistic alignment, hyperpersonalized
    generation, and sycophancy may converge such that it has been proposed that AI chatbots do not merely fail
    to correct emerging delusional ideation but actively co-construct and elaborate it through sustained,
    personalized interaction [11].
  locator: Review, Patient-physician trust and the disclosure gap
  licenses: States the proposed mechanism by which beliefs are elaborated across turns — linguistic alignment, hyperpersonalised generation and sycophancy converging so that chatbots co-construct emerging delusional ideation rather than merely failing to correct it.
