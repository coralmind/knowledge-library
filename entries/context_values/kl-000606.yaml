- claim_id: c5
  source: kl-001110
  quote: Significant positive correlation was determined between DOCS-T (r = 0.370, p < 0.001), AAQ-II (r = 0.261, p = 0.013), BDI (r = 0.235, p = 0.024) and BAI (r = 0.342, p = 0.001) scores and the FAS-PF.
  locator: Abstract, Results
  licenses: Establishes in a diagnosed sample that this presentation co-occurs with and covaries with anxiety (r = 0.342) and depression (r = 0.235), so a person carrying it is typically also carrying those — a fact about who a system encounters when it encounters this context.
  fit: adjacent
  bridge: Between-person correlations among instrument scores in 92 OCD outpatients with a family member as the accommodating party. Cross-sectional, so no direction, and nothing about AI.
  contributes: prevalence
  contradicts: false
- claim_id: c5
  source: kl-001110
  quote: In the regression analysis, only OCD disease severity predicted FA
  locator: Abstract, Results
  licenses: With anxiety, depression and psychological inflexibility entered together, only obsessive-compulsive severity retained a predictive relationship with accommodation, so demand for accommodation tracks this presentation specifically rather than general distress.
  fit: adjacent
  bridge: A cross-sectional regression on between-person variance in a 92-patient sample with human family members accommodating. 'Predicted' is statistical, not temporal or causal, and the accommodating party is not an AI.
  contributes: prevalence
  contradicts: false
- claim_id: c5
  source: kl-001110
  quote: When the relationship between OCD symptom subdimensions and FA was examined, we found that only the contamination subdimension predicted FA, in line with previous studies
  locator: Section 4, Discussion
  licenses: 'Cuts against treating this presentation as uniform: within it, only the contamination subdimension predicted accommodation while responsibility, unacceptable thoughts and symmetry did not, so a single tag covers subdimensions that behave differently on the variable of interest.'
  fit: adjacent
  bridge: Between-person regression in a clinical sample with human accommodators, and the authors attribute the contamination effect to cleaning compulsions occupying shared living space — a physical-cohabitation mechanism with no counterpart in a chat interface, so this ordering should not be assumed to carry over.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-001110
  quote: The FA scores in this Turkish sample were significantly higher than in two studies performed using FAS-PV in North American samples
  locator: Section 3, Results
  licenses: Establishes that the response this presentation draws from others varies substantially by cultural context at the same measured symptom level, with Turkish outpatients scoring significantly above two North American samples on the same instrument.
  fit: adjacent
  bridge: A between-sample comparison of family behaviour, single-centre, with the authors naming an alternative explanation they cannot exclude. It bears on how the presentation is met, not on its rate.
  contributes: existence
  contradicts: false
