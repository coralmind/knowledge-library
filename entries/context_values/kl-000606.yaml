  locator: Section 4, Discussion
  licenses: 'A null the entry should carry: anxiety, depression and psychological inflexibility each correlated with accommodation but none survived as a predictor once this presentation''s severity was in the model, and the authors note psychological inflexibility failed contrary to their expectation. It cuts against generalizing accommodation-shaped harm across distress presentations.'
  fit: adjacent
  bridge: A null in one 92-person cross-sectional sample with human accommodators, which is weak evidence and reads as a caution rather than a refutation.
  contributes: counterexample
  contradicts: true
