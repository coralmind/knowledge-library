# yaml-language-server: $schema=../../schema/context_value.schema.json
id: kl-000606
display_id: Value-7
aliases:
- ocd
- ConditionTag-7
label: Unwanted recurring thoughts and repeated acts to relieve them
type: context_value
layer: context
definition: The person experiences intrusive, unwanted and distressing thoughts, images or urges that recur, and acts in response to them in ways aimed at reducing the distress or preventing a feared outcome — repeated checking, washing, ordering, mental reviewing, or seeking assurance from others. The person characteristically recognises the response as excessive without being able to stop it, and the feared outcome is often one they judge unlikely and cannot dismiss.
distinguish_from:
- neighbor: kl-000608
  boundary: That condition context is excessive worry, fear, panic or phobic avoidance, in which the worry is typically about circumstances the person regards as realistically possible. This one requires intrusive unwanted mental content and acts undertaken in response to it, and the feared outcome is characteristically one the person judges unlikely. The two overlap in the cycle of seeking assurance and both are assigned where both are present.
- neighbor: kl-000321
  boundary: 'kl-000321 is an observation-layer symptom: a request to the AI addressed to a doubt, and a repeat of it after an answer was given. This entry is the clinical condition context in which such requests characteristically occur. The symptom is settled by reading the turns; the condition context is not, and either can be present without the other.'
- neighbor: kl-000609
  boundary: That condition context centres on eating, weight, shape and the person's body, and its rules and rituals are organised around those. This one is not restricted by content. Both are assigned where compulsive rituals extend beyond food and body.
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes: 6B20-6B2Z / F42
  experience_clusters:
  - kl-000703
  detection_note: 'A distinction that is central to reading this condition context, and which the source stated and this project has written down almost nowhere else: what the person seeks assurance about and what they need acknowledged are different things. A request for assurance addressed to the content of a doubt ("is it possible that X happened") is not the same as distress that needs recognising, and a response can meet one while feeding the other. Recorded here as a fact about what makes this condition context hard to read, NOT as a prescription — this entry does not say what a response should do, and the tag does not become a rule by carrying the distinction.'
sources:
- source: kl-000001
  locator: sample description
  contributes: existence
  limits: 'This category is not in this sample. Table 1''s ''Primary diagnosis'' rows are exhaustively four: ''Anxiety disorder'' (316, 48.4%), ''Anxiety and depression'' (92, 14.1%), ''Depression'' (66, 10.1%), ''Other'' (179, 27.4%). There is no obsessive-compulsive row, no OCD subgroup, and no participant count attributable to obsessive-compulsive presentation anywhere in the paper; the diagnostically-assessed subgroup (n = 189) was entirely social anxiety disorder. Whatever obsessive-compulsive presentations may be hidden inside the undifferentiated ''Other'' bucket is unknowable from the paper, and an unlabelled residual category cannot support a claim that a named category was under study. The paper''s only mention of the condition in the body text is someone else''s study, in the Discussion, p. 12: ''Furthermore, evidence from a clinical trial of obsessive-compulsive disorder indicates that 29% of the patients experienced novel symptoms [64], suggesting that other types of adverse and unwanted events may occur.'' That cites a different team''s OCD trial as background support for the symptoms factor and is not a description of this study''s population; the only other occurrence is in the reference list. Citing this paper for the condition would be citing it for a claim it makes only by relaying another paper. This is a clean negative rather than a judgement call: the assertion that the development sample included obsessive-compulsive presentations is a factual claim about the sample, and Table 1 falsifies it.'
  disposition: searched_no_support
  cited_for: Rozental et al. 2016 was examined for obsessive-compulsive presentations in its instrument-development sample. The sample contains no such subgroup, and the paper's only mention of the condition relays another team's clinical trial.
- source: kl-000531
  contributes: definition
  locator: MMS simple tabulation, release row for 6B20 (Code and Title columns)
  quote: 6B20 "- - Obsessive-compulsive disorder"
  limits: A classification establishes that a category exists and where its boundary is drawn. It says nothing about prevalence, severity, or how the category behaves in AI interaction.
  cited_for: ICD-11 MMS classifies this category, at codes 6B20-6B2Z / F42.
  licenses: That ICD-11 MMS contains this code with this exact title, so the category is one the classification draws, at the code this entry names.
standing:
  value: theorized
  basis: 'The category is drawn by ICD-11 at 6B20-6B2Z / F42, with a graded insight specifier (6B20.0, ''with fair to good insight''), and clinical instrument studies assign the label in assessed samples, where contamination obsessions (76.1%) and checking compulsions (78.3%) are the modal contents (kl-001110, Kuru et al. 2023). The compulsive-response and recognition features are observed in real deployed traffic: kl-000996 (Sharma et al. 2026) documents people cycling through repetitive variations of the same question across 10 to 200-plus exchanges despite consistent answers, continuing after promising to stop and acknowledging the compulsive nature with ''I can''t help it''. No source reaches the entry''s other two defining features directly: the recurring intrusive thoughts themselves are attested only through clinical formulation and through posts in which people bring intrusive thoughts to an AI to judge whether their fears are warranted (kl-000527, kl-001028), and no source states the person''s own judgment that the feared outcome is unlikely — the closest is a clinician-authored formulation naming intolerance of uncertainty as the driver (kl-000527). The insight specifier also bounds the recognition feature: insight is a graded dimension the classification requires to be recorded, so the recognition this entry calls characteristic is not universal.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
