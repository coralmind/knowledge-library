  locator: Results, RQ1a
  licenses: 'Gives a rate and a trend for the AI-context appearance of this presentation: discussion of AI reassurance for OCD intrusive thoughts rose from 2.6% to 7.1% of AI-related posts across half-year intervals in ten mental health communities. It establishes that the presentation is a growing and measurable share of AI-related mental health discussion.'
