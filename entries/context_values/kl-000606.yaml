  kind: existence
  text: People experience intrusive, unwanted and distressing thoughts, images or urges that recur.
- id: c2
  kind: existence
  text: People act in response to those intrusions in ways aimed at reducing the distress or preventing a feared outcome — repeated checking, washing, ordering, mental reviewing, or seeking assurance from others.
- id: c3
  kind: existence
  text: The person characteristically recognises the response as excessive without being able to stop it.
- id: c4
  kind: existence
  text: The feared outcome is often one the person judges unlikely and cannot dismiss.
- id: c5
  kind: prevalence
  text: This presentation occurs at some rate in an identifiable population.
- id: c6
  kind: definition_boundary
  text: This is distinguished from the anxiety condition context in that it requires intrusive unwanted mental content and acts undertaken in response to it, and its feared outcome is characteristically one the person judges unlikely, whereas anxiety's worry is typically about circumstances the person regards as realistically possible.
- id: c7
  kind: definition_boundary
  text: This is distinguished from kl-000321 in that this is the clinical condition context rather than the observation-layer symptom of a doubt-addressed request repeated after an answer, and either can be present without the other.
- id: c8
  kind: definition_boundary
  text: This is distinguished from the eating_disorders condition context in that this presentation's rituals are not restricted by content, whereas that one's are organised around eating, weight, shape and body.
