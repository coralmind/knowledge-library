id: kl-000613
display_id: Value-14
aliases:
- abuse_and_neglect
- ConditionTag-14
label: Abuse or neglect by someone in a position of power or trust
type: context_value
layer: context
definition: The person is subject to, or has been subject to, harm inflicted by another person who holds power or trust in relation to them — physical violence, sexual violation, sustained psychological or emotional harm, or control and exploitation of their money or resources — or to the withholding of care, supervision, or basic necessities that person was responsible for providing. The circumstances may be current or historical, and the person affected may be a child, an adult, or an older adult.
distinguish_from:
- neighbor: kl-000607
  boundary: That condition context is the person's presentation following exposure to a threatening or horrific event — re-experiencing, avoidance, a persistent sense of threat — and applies to exposures of any kind, not only abuse. This one names the circumstances themselves and the relationship in which the harm occurred, whether or not any post-traumatic features are present. Both are assigned where abuse is the exposure and post-traumatic features are the presentation, and each occurs without the other.
- neighbor: kl-000611
  boundary: That condition context is a long-standing pattern in the person's own emotional and relational functioning. This one names what has been done to them by another. They frequently co-occur and the direction of any relation between them is not something this entry asserts.
- neighbor: kl-000630
  boundary: 'That entry is a population modifier — a durable fact about the person''s age, not a clinical state. It is named here because the two together are what raise the obligations recorded in this entry''s scope-of-practice note most acutely, and because a reader deciding how to file harm to a minor needs both: the harm is this entry, the age is that one.'
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes:
  - QE82
  experience_clusters:
  - kl-000701
  - kl-000700
  cluster_assignment_note: 'Two clusters: the destabilisation territory, which the ongoing or historical experience of harm within a relationship of trust reaches; and the crisis-escalation territory, which current and continuing danger reaches.'
  detection_note: 'The icd_codes field records ICD-11''s QA21-QA22 range alongside "Z-codes", and the pairing is informative: these are codes for circumstances and problems affecting health status, not codes for a disorder. What is externally classified here is a SITUATION rather than a condition of the person, which is unusual in this vocabulary and is the reason this tag''s category_scope reading is worth a second look.'
sources:
- source: kl-000553
  contributes: existence
  locator: Section 5.3.2 ‘Assertive and Confident’, quoted chat excerpt attributed to (Owen, Chat 43)
  quote: 'Owen: I’ve gone no contact with my [[relative]] given [[that they are]] abusive but I can’t'
  limits: The paper establishes only that a person disclosed abuse by a relative inside a real generative-AI emotional-support conversation. It does not define abuse and neglect, does not enumerate the harm types in the entry (physical, sexual, psychological, financial, or withholding of care), does not distinguish current from historical circumstances, and says nothing about who holds power or trust. It is a qualitative interview study, not a classification, so it cannot anchor the entry's definition to a diagnostic system. The quoted disclosure is one participant's chat line inside a 24-person purposive qualitative sample, so it carries no prevalence weight.
  note: The full excerpt runs across a line break in the source; I quote only the contiguous first line to preserve verbatim fidelity. The passage appears in 5.3.2 as an illustration of overconfident AI reassurance, not as an abuse-disclosure finding.
  cited_for: 'Partial support only. Volpato et al. 2026 establishes that a person disclosed abuse by a relative inside a real generative-AI emotional-support conversation, and nothing more: it does not define abuse and neglect, does not enumerate the entry''s harm types, does not distinguish current from historical circumstances, and says nothing about who holds power or trust in relation to the person.'
standing:
  value: asserted
  basis: 'The context itself is observed: kl-000996 recovered abuse disclosures directly from 1.5 million real consumer conversations, and in kl-000781 clinician annotators applied the power-imbalance criterion to real posts. The classification backdrop is thinner than the entry''s scope: the retrieved ICD-11 tabulation (kl-000531) is category titles and hierarchy only — current maltreatment sits at PJ20–PJ22 and personal history of abuse or neglect at QE82.0–QE82.3 — with no definitional text, so it supplies no perpetrator criterion, no power-or-trust requirement, and no current-versus-historical rule; and it carries no financial-abuse or financial-exploitation category and no elder-abuse category, so two parts of the entry''s scope have no counterpart in the classification at all. Nothing in the evidence base addresses the current-versus-historical distinction or the older-adult scope, and no source gives a rate of this context among AI users.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People who are, or have been, subject to abuse or neglect appear in conversations with AI systems, and the circumstances are disclosed there.
- id: c2
  kind: definition_boundary
  text: The harm is inflicted by a person who holds power or trust in relation to the person affected - the perpetrator relationship, not the act alone, is what makes it this context.
- id: c3
  kind: definition_boundary
  text: The context covers four kinds of inflicted harm - physical violence, sexual violation, sustained psychological or emotional harm, and control or exploitation of money or resources - as members of one category.
- id: c4
  kind: definition_boundary
  text: Withholding of care, supervision, or basic necessities by the person responsible for providing them is the same context as inflicted harm, not a separate one.
- id: c5
  kind: context_dependence
  text: The circumstances may be current or historical, and both are this context.
- id: c6
  kind: context_dependence
  text: The person affected may be a child, an adult, or an older adult, and all three are this context.
- id: c7
  kind: detectability
  text: The context can be identified from what a conversation contains.
- id: c8
  kind: prevalence
  text: The context occurs at some rate among the people who bring mental-health concerns to AI systems.
- id: c9
  kind: definition_boundary
  text: 'Distinguished from the trauma and PTSD condition context: that names the person''s presentation following a threatening or horrific exposure of any kind, while this names the circumstances themselves and the relationship in which the harm occurred, whether or not post-traumatic features are present.'
- id: c10
  kind: definition_boundary
  text: 'Distinguished from the borderline personality condition context: that names a long-standing pattern in the person''s own emotional and relational functioning, while this names what another person has done to them.'
- id: c11
  kind: definition_boundary
  text: 'Distinguished from the child-and-adolescent population modifier: that is a durable fact about age rather than a clinical state, and where a minor is harmed the harm is filed here and the age is filed there.'
claim_evidence:
- claim_id: c1
  source: kl-000996
  quote: "Active Abuse with Severe Safety Crises Severe The user disclosed across ∼10–200+ exchanges severe and compounding vulnerabilities including histories of childhood sexual abuse (CSA), ongoing domestic violence, trafficking, grooming, incest, physical assault, and sexual coercion, often with pervasive suicidal ideation, active self-harm, dissociation, and statements like “I hope he grooms the fuck out of me,” “is Daddy going to kill Mommy,” “I’m holding mom’s gun,” and “if I die will all this be fixed.” Compounding"
  locator: Appendix A, Table 6 Additional vulnerability clusters, Active Abuse with Severe Safety Crises (Severe)
  licenses: Users disclosed histories of childhood sexual abuse, ongoing domestic violence, trafficking, grooming, incest, physical assault and sexual coercion across 10 to 200-plus exchanges, in real consumer conversations with a deployed model. This is the context occurring and being disclosed in conversation, observed at scale rather than inferred.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000837
  quote: |-
    People who have experienced sexual abuse, they feel
       a lot of shame even talking about it. So, I wonder if
       maybe AI could help them there because they get to
       share it, but they know that no one is judging them
       or blaming them for what happened.
  locator: Results, Advantages, Alleviating burden (Jemima, Trainer)
  licenses: A crisis-line trainer's account of why people who have experienced sexual abuse may disclose to an AI - shame is what blocks the disclosure and the absence of a judging party is what might unblock it - which supplies the mechanism by which this context reaches an AI conversation rather than a human one.
  fit: analogical
  bridge: A volunteer's anticipation about texters, not an observation of any AI conversation. It states what a practitioner expects to happen and whether an AI actually unblocks the disclosure is untested here.
  contributes: practice_analog
  contradicts: false
- claim_id: c2
  source: kl-000781
  quote: "Expert coders emphasize that incidents involving peers close in age (e.g., 14–16 vs. 11–12) are not categorized as child abuse. Instead, they should be annotated as sexual harassment or rape depending on the context. This shows that large models tend to overgeneralize any sexual incident involving minors as child abuse"
  locator: Section 6 Analysis, item (1)
  licenses: 'Expert clinical coders apply exactly the criterion this claim asserts: an incident between peers close in age is not child abuse, and what makes it abuse is the perpetrator''s age or power imbalance. It establishes the power-or-trust requirement as the operative distinction clinicians use, from clinician annotators rather than from a classification''s index.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000996
  quote: "Active Abuse with Severe Safety Crises Severe The user disclosed across ∼10–200+ exchanges severe and compounding vulnerabilities including histories of childhood sexual abuse (CSA), ongoing domestic violence, trafficking, grooming, incest, physical assault, and sexual coercion, often with pervasive suicidal ideation, active self-harm, dissociation, and statements like “I hope he grooms the fuck out of me,” “is Daddy going to kill Mommy,” “I’m holding mom’s gun,” and “if I die will all this be fixed.” Compounding"
  locator: Appendix A, Table 6 Additional vulnerability clusters, Active Abuse with Severe Safety Crises (Severe)
  licenses: The disclosed harms named - incest, grooming, childhood sexual abuse, domestic violence - are each defined by the perpetrator's relationship to the person, so the cluster is populated by relationships of power or trust rather than by stranger harm.
  fit: adjacent
  bridge: The span names the harm types without stating the power-or-trust criterion. The relationship is carried by the terms themselves rather than asserted by the source, so the claim's criterion is inferred from the vocabulary rather than stated in it.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000531
  quote: "QE82.2\t\t\"- - - - Personal history of psychological abuse\"\tcategory\t2\tFalse\t24\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#1334495652\"\",\"\"browser\"\")\"\tTrue\tTrue\tBlockL1-QD5\tBlockL2-QE8\t\t\t\nhttp://id.who.int/icd/entity/1172477528\thttp://id.who.int/icd/release/11/mms/1172477528\tQE82.3\t\t\"- - - - Personal history of neglect\"\tcategory\t2\tFalse\t24"
  locator: Chapter 24, block QE8 Problems associated with harmful or traumatic events, QE82 Personal history of maltreatment
  licenses: The classification carries personal history of psychological abuse and personal history of neglect as adjacent categories under one parent, establishing psychological abuse as a coded harm type in its own right alongside the physical and sexual ones the same block carries.
  fit: adjacent
  bridge: 'A simple tabulation of the linearization: two rows of category titles and no definitional text. It establishes that these titles exist as codes under QE82 Personal history of maltreatment and supplies none of the entry''s criteria. Read against this claim it is also incomplete in a way that matters: the tabulation carries no financial-abuse or financial-exploitation category anywhere, so the entry''s fourth harm type - control or exploitation of money or resources - has no counterpart in the classification the entry''s own basis cites as its warrant.'
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000996
  quote: "Active Abuse with Severe Safety Crises Severe The user disclosed across ∼10–200+ exchanges severe and compounding vulnerabilities including histories of childhood sexual abuse (CSA), ongoing domestic violence, trafficking, grooming, incest, physical assault, and sexual coercion, often with pervasive suicidal ideation, active self-harm, dissociation, and statements like “I hope he grooms the fuck out of me,” “is Daddy going to kill Mommy,” “I’m holding mom’s gun,” and “if I die will all this be fixed.” Compounding"
  locator: Appendix A, Table 6 Additional vulnerability clusters, Active Abuse with Severe Safety Crises (Severe)
  licenses: Shows three of the four harm types - sexual, physical, and by way of trafficking and coercion the exploitative - appearing together in single disclosures, so treating them as one category matches how they present rather than only how they are coded.
  fit: adjacent
  bridge: The span is a cluster description, not a taxonomy. It shows the harm types co-occurring in disclosures and does not assert that they belong to one category; and it names no sustained psychological or emotional harm limb separately from the acts.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000531
  quote: "QE82.2\t\t\"- - - - Personal history of psychological abuse\"\tcategory\t2\tFalse\t24\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#1334495652\"\",\"\"browser\"\")\"\tTrue\tTrue\tBlockL1-QD5\tBlockL2-QE8\t\t\t\nhttp://id.who.int/icd/entity/1172477528\thttp://id.who.int/icd/release/11/mms/1172477528\tQE82.3\t\t\"- - - - Personal history of neglect\"\tcategory\t2\tFalse\t24"
  locator: Chapter 24, block QE8 Problems associated with harmful or traumatic events, QE82 Personal history of maltreatment
  licenses: Neglect is coded at QE82.3 as a sibling of the abuse categories under the same parent, Personal history of maltreatment, which is the classification treating withheld care and inflicted harm as members of one category rather than two.
  fit: adjacent
  bridge: Category titles and hierarchy position only. That two codes share a parent establishes that a classification groups them; it does not establish the entry's criterion, which is that the withholding was by the person responsible for providing the care - a requirement no part of the quoted row states.
  contributes: definition
  contradicts: false
- claim_id: c7
  source: kl-000781
  quote: "Expert coders emphasize that incidents involving peers close in age (e.g., 14–16 vs. 11–12) are not categorized as child abuse. Instead, they should be annotated as sexual harassment or rape depending on the context. This shows that large models tend to overgeneralize any sexual incident involving minors as child abuse"
  locator: Section 6 Analysis, item (1)
  licenses: Cuts directly against the claim. Models systematically over-apply the child-abuse label because they do not carry the perpetrator-age and power-imbalance requirement clinicians apply, and the bias is quantified as consistently lower precision than recall on the ongoing-child-abuse category. The criterion c2 asserts as definitional is the criterion that cannot be read reliably out of a text, so identifying this context from what a conversation contains fails in the specific way the definition creates.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c7
  source: kl-000996
  quote: "Active Abuse with Severe Safety Crises Severe The user disclosed across ∼10–200+ exchanges severe and compounding vulnerabilities including histories of childhood sexual abuse (CSA), ongoing domestic violence, trafficking, grooming, incest, physical assault, and sexual coercion, often with pervasive suicidal ideation, active self-harm, dissociation, and statements like “I hope he grooms the fuck out of me,” “is Daddy going to kill Mommy,” “I’m holding mom’s gun,” and “if I die will all this be fixed.” Compounding"
  locator: Appendix A, Table 6 Additional vulnerability clusters, Active Abuse with Severe Safety Crises (Severe)
  licenses: The cluster was recovered from real conversations by an automated pipeline, so the context was in fact identified from conversation content at scale, which is the claim's positive case.
  fit: adjacent
  bridge: The identification is by the study's own clustering over 1.5 million conversations with no reported precision against clinician labels for the abuse categories specifically. It establishes that a pipeline assigned the label; Byun et al. 2025 establishes that such assignments are systematically over-inclusive on exactly this construct, so this citation shows the identification happening and not that it was correct.
  contributes: detectability
  contradicts: false
- claim_id: c7
  source: kl-000814
  quote: |-
    Downplaying credible threats
    Minimising trauma/threats user is currently experiencing (e.g. dom. abuse, bullying)
    [7]
  locator: Appendix A, Table 4
  licenses: Names minimising a threat the person is currently experiencing as a documented deployment risk with domestic abuse as an exemplar, which presupposes the disclosure is legible enough for a system to act on or fail to act on.
  fit: analogical
  bridge: A single row of a risk-card survey with one citation behind it. It names the failure and evidences no detection performance; domestic abuse appears as a parenthetical exemplar rather than as a studied case.
  contributes: frame
  contradicts: false
- claim_id: c8
  source: kl-000900
  quote: the Youth Endowment Fund (2025) found that using a chatbot for mental health support was higher among adolescents affected by violence, with 38% of child-victims and 44% of child-perpetrators reporting chatbot use for this purpose, compared with 23% among peers with no exposure to violence.
  locator: Section 5.1
  licenses: Adolescents affected by violence use chatbots for mental health support at 38 percent among child-victims and 44 percent among child-perpetrators against 23 percent among peers with no exposure, so this context is over-represented among the people bringing mental-health concerns to AI rather than merely present.
  fit: adjacent
  bridge: A rate restated from a third-party Youth Endowment Fund survey rather than measured here. 'Affected by violence' is not decomposed into the entry's harm types and says nothing about a power or trust relationship, and the rate is of chatbot use among the exposed rather than of the context among chatbot users - the inverse of what the claim needs.
  contributes: prevalence
  contradicts: false
- claim_id: c8
  source: kl-000996
  quote: "Active Abuse with Severe Safety Crises Severe The user disclosed across ∼10–200+ exchanges severe and compounding vulnerabilities including histories of childhood sexual abuse (CSA), ongoing domestic violence, trafficking, grooming, incest, physical assault, and sexual coercion, often with pervasive suicidal ideation, active self-harm, dissociation, and statements like “I hope he grooms the fuck out of me,” “is Daddy going to kill Mommy,” “I’m holding mom’s gun,” and “if I die will all this be fixed.” Compounding"
  locator: Appendix A, Table 6 Additional vulnerability clusters, Active Abuse with Severe Safety Crises (Severe)
  licenses: 'Establishes the context as a recurring cluster rather than an isolated case: the pattern was distinct enough across 1.5 million real conversations to be named as one of the study''s severe vulnerability clusters.'
  fit: adjacent
  bridge: A cluster description carries no rate. The span reports the pattern's existence and its internal shape and gives no number for how often it occurs; the paper's own rate figure - severe disempowerment in fewer than one in a thousand conversations - is a different construct and is not in this span.
  contributes: prevalence
  contradicts: false
