  licenses: 'The eating-disorder row gives 58 queries at 0.31 percent of the corpus. As a prevalence it is a count with its population - the health-AI evaluation corpus - and what it establishes is a bound on the entry rather than support: the standard evaluation corpus contains almost no test material for this presentation.'
