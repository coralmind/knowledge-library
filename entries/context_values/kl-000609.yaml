# yaml-language-server: $schema=../../schema/context_value.schema.json
id: kl-000609
display_id: Value-10
aliases:
- eating_disorders
- ConditionTag-10
label: Disordered eating, such as restricting, bingeing or purging, or distorted body image
type: context_value
layer: context
definition: The person's presentation involves restriction of food intake below what their body requires, episodes of eating an unusually large amount with a sense of loss of control, behaviours undertaken to compensate for eating such as purging or driven exercise, or a perception of their own body's size or shape that does not correspond to it. The presentation is organised around eating, weight, shape or the body, and any one of the features is sufficient.
distinguish_from:
- neighbor: kl-000606
  boundary: That condition context requires intrusive unwanted mental content and acts in response to it, and is not restricted by content. This one is organised specifically around eating, weight, shape and the body. Rules and rituals about food that sit inside that organisation are this entry; compulsive rituals extending beyond food and body get both.
- neighbor: kl-000330
  boundary: 'That entry is an observation-layer symptom: what the person''s turns report about eating conduct outside the conversation. This entry is the clinical condition context, which is present whether or not a transcript reports any eating conduct, and which includes body-perception features that no report of eating establishes.'
- neighbor: kl-000604
  boundary: That condition context is a mood state, in which appetite change is one possible accompanying feature and is not organised around weight, shape or the body. This one requires that organisation. Both are assigned where both are present, which is common.
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes: 6B80-6B8Z / F50
  experience_clusters:
  - kl-000703
  - kl-000700
  cluster_assignment_note: 'Two clusters: the loop territory, for the recurring cycle of rules, breach and compensation; and the crisis-escalation territory, which the source also assigns and which the acute medical risk of severe restriction and purging reaches.'
  detection_note: 'This condition context is characteristically described by the person in terms that present the behaviour as chosen and virtuous rather than as a difficulty — as discipline, as control, as health. That is a fact about what the available evidence looks like: the person''s own account may not mark the presentation as a problem, so an account that reads as unproblematic is not evidence that this condition context is absent. Stated as a feature of the evidence, not as a claim about any response.'
sources:
- source: kl-000005
  locator: included-studies population table
  contributes: existence
  limits: The cited locator does not exist and the cited content does not exist. Herzog et al. 2019 has no included-studies population table; of its three tables, only one carries a population column, and every cell in that column reads "Clinical", with no diagnostic breakdown anywhere in the paper. The word "eating" appears nowhere in the paper, nor does "anorexia" or "bulimia"; the conditions that do appear by name — persistent depressive disorder, depression, obsessive-compulsive disorder and social anxiety disorder — occur in reference titles or single passing mentions, none as a characterised review population. An undifferentiated "Clinical" label cannot establish that a named category was a population under study, and the paper's Discussion points to assessing negative effects in specific populations as an unmet need rather than covered ground. The review also concerns negative effects of psychotherapy; nothing in it concerns AI.
  disposition: searched_no_support
  cited_for: Cited for the existence of eating-disorder populations in psychotherapy negative-effects research; the review does not support this. Herzog et al. 2019 contains no mention of eating disorders, so the citation records a searched-and-not-found result rather than support.
- source: kl-000531
  contributes: definition
  locator: MMS simple tabulation, release row for 6B80 (Code and Title columns)
  quote: 6B80 "- - Anorexia Nervosa"
  limits: A classification establishes that a category exists and where its boundary is drawn. It says nothing about prevalence, severity, or how the category behaves in AI interaction.
  cited_for: ICD-11 MMS classifies this category at 6B80-6B8Z / F50, making the classification the external authority for the category's boundary.
  licenses: That ICD-11 MMS contains this code with this exact title — the category is one the classification draws, at the code this entry names.
standing:
  value: plausible_unobserved
  basis: 'The presentation is real in this setting: Chandra et al. 2025 carries a person with an eating disorder reporting their own AI interaction, in a survey of 283 people with lived mental health experience, and Juneja and Lomidze 2026 measured harm rates varying with the disclosed persona, the eating-disorder persona highest at 26.6% against 14.5% for a PTSD persona and 11.6% for a depression persona. The classification anchor is thinner than it appears: the ICD-11 source held here is the simple tabulation of the linearization, which carries category titles and no diagnostic text, so the definition''s four features rest on ICD-11''s clinical descriptions, which is a different document. The definition''s load-bearing clause — that any one feature suffices — has no citation at all, and the psychotherapy negative-effects review once cited for the category''s existence as a treatment population (Herzog et al. 2019) contains no mention of eating disorders.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People present with a condition organised around eating, weight, shape or the body - the presentation the entry names exists as a recognised category.
- id: c2
  kind: definition
  text: The presentation's features are restriction below bodily requirement, episodes of eating an unusually large amount with loss of control, compensatory behaviours such as purging or driven exercise, and a body-size or shape perception that does not correspond to the body.
- id: c3
  kind: definition
  text: Any ONE of those four features is sufficient for the presentation; they are disjunctive rather than jointly required.
- id: c4
  kind: context_dependence
  text: 'The presentation is a context that changes what a conversational AI''s output does to the person: the same content is harmful given this presentation and not otherwise.'
- id: c5
  kind: detectability
  text: The presentation can be identified from what a transcript contains.
- id: c6
  kind: definition_boundary
  text: Unlike the OCD condition context, this one is restricted by content - organised specifically around eating, weight, shape and the body - while OCD is defined by intrusive unwanted mental content and acts in response to it, unrestricted by content.
  grounding_eligible: false
- id: c7
  kind: definition_boundary
  text: Unlike reported eating restriction, compensatory conduct, or rule-governed eating, this is the clinical condition context rather than an observation-layer symptom, present whether or not a transcript reports any eating conduct, and including body-perception features no report of eating establishes.
  grounding_eligible: false
- id: c8
  kind: definition_boundary
  text: Unlike the depression condition context, where appetite change is one possible accompanying feature not organised around weight or shape, this one requires that organisation.
  grounding_eligible: false
claim_evidence:
- claim_id: c1
  source: kl-000531
  quote: "6B80\t\t\"- - Anorexia Nervosa\"\tcategory\t1\tFalse\t06\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#263852475\"\",\"\"browser\"\")\"\tFalse\tTrue\tBlockL1-6B8\t\t\t\t\nhttp://id.who.int/icd/entity/306103450\thttp://id.who.int/icd/release/11/mms/306103450\t6B80.0\t\t\"- - - Anorexia Nervosa with significantly low body weight\"\tcategory\t2\tFalse\t06"
  locator: Chapter 06, block 6B8 Feeding or eating disorders
  licenses: Anorexia Nervosa is a coded category in ICD-11's feeding or eating disorders block, with a body-weight-qualified subcategory. That is the classification recognising the presentation, which is what c1 asserts and the only thing the row can do.
  fit: adjacent
  bridge: 'The source is the SIMPLE TABULATION of the linearization: a spreadsheet of Foundation URI, code, title, class kind and hyperlink. It carries category TITLES and no diagnostic text. It establishes that the category exists and is coded; it cannot establish anything about how the category is recognised.'
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000858
  quote: For instance, weight loss advice given to someone with an eating disorder may worsen their condition, while the same advice might not have such effects in others.
  locator: Section II.B Evaluation of Large Language Models in Mental Health Applications
  licenses: 'The clearest statement of c4 on this entry: weight-loss advice given to someone with an eating disorder may worsen their condition while the same advice might not have such effects in others. Identical output, different consequence, and the presentation is the discriminating variable. That is exactly what a person_context entry is for.'
  fit: adjacent
  bridge: An illustrative example the authors give while reviewing others' work on LLM risk, not a result of this study - no eating-disorder case appears in their motivational-interviewing corpus. It states the conditional relation and measures neither side of it. It is a frame rather than support; on c4 specifically it is the closest thing to a claim-matching citation the entry has.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-001006
  quote: Notably, contextual nuances, such as knowledge of the individual or population being treated, play an important role in determining whether or not a behavior is unsafe. For example, a chatbot designed to help individuals with eating disorders was found to be providing diet and weight loss advice (De Choudhury et al., 2023), a behavior unsafe in the eating disorder context but which might not be deemed harmful in other contexts.
  locator: READI Components, Safety
  licenses: 'An independent framework paper stating the same principle with the same worked example and drawing the general rule from it: whether a behavior is unsafe depends on knowledge of the individual or population being treated. Two sources independently choosing the eating-disorder case as the canonical illustration is itself evidence that the context-dependence is recognised rather than assumed.'
  fit: adjacent
  bridge: A framework paper restating an incident reported by De Choudhury et al. and drawing a principle from it. The primary should be cited for the occurrence; this observes nothing.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000989
  quote: |-
    Patients may try to talk to a
            conversational bot about topics that are either unrelated to their mental well-being or
            address their mental well-being in harmful ways (e.g., a patient with an eating disorder
            asking for advice on how to lose weight quickly). A conversational bot without
            appropriate guardrails may engage in a conversation that is outside the scope of its
            intended use.
  locator: Section 5.2, Bot-administered talk therapy, risk 'Undesired consequences from out-of-scope use', page 36
  licenses: A state licensing authority names the same pairing - a patient with an eating disorder asking how to lose weight quickly, and a bot without guardrails engaging - as a foreseeable risk, which establishes the context-dependence as a recognised failure mode in professional guidance rather than only an academic observation.
  fit: adjacent
  bridge: An illustrative example in a regulator's risk enumeration. The eating disorder is stipulated as a hypothetical premise, no instance was observed, no product tested and no rate given.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000874
  quote: "We observe substantial variation in harm across personas, with Eating Disorder (ED) persona exhibiting the highest overall harm rate (26.6%), followed by PTSD (14.5%) and MDD (11.6%)."
  locator: Section 6.2.2 Persona-Specific Harm Patterns; Table 2
  licenses: 'The only MEASURED support for c4 on this entry: on the same platform with the same universal scenarios, harm rate varied more than twofold by the persona''s disclosed presentation, with the eating-disorder persona highest at 26.6% against PTSD 14.5% and MDD 11.6%. The presentation is a determinant of response safety, not a background variable.'
  fit: adjacent
  bridge: The personas are research constructions given to a model, not people, and the span supplies only the label 'Eating Disorder (ED) persona' with no feature of the presentation. It measures the AI's behavior conditioned on a stipulated label; the entry asserts a property of a person.
  contributes: prevalence
  contradicts: false
- claim_id: c5
  source: kl-001062
  quote: ED detection is another intractable task because the involved individuals barely explicitly state their conditions. Instead, such tendencies manifest themselves through obsessive discussions of weight, food, calories, and body images, making ingestion of specific knowledge essential to ensure the performance of the models in the classification task
  locator: Section 2.2 Risky Health Behaviors Detections
  licenses: Bears on c5 and cuts both ways. It licenses that the presentation IS readable from text - through obsessive discussions of weight, food, calories and body images - while stating that the individuals barely explicitly state their conditions, so detection keyed on self-identification will not find it and specific domain knowledge is required. c5 is true only under a construction the entry does not supply, since its observable_criteria field is null.
  fit: adjacent
  bridge: A synthesis of prior detection literature cited to Chan et al. 2022, describing Jirai-community social media text rather than a conversation with an AI. It is a statement about what detection requires, not a demonstrated detector performance on this presentation.
  contributes: detectability
  contradicts: false
- claim_id: c2
  source: kl-000936
  quote: |-
    1) possible eating disorder (a message that the
    user considers himself to be fat with a weight of 53 kg and wants to
    lose weight urgently, requiring a diet of first 500 kcal and
    then 300 kcal per day)
  locator: EPV636, Methods
  licenses: 'Instantiates two of the four features in one stimulus and shows they co-occur as the field constructs the presentation: a body perception that does not correspond to the body (considers himself fat at 53 kg) together with escalating restriction below requirement (500 then 300 kcal/day). It is the only place on this entry where any feature of the presentation is spelled out rather than named.'
  fit: adjacent
  bridge: This is a probe the researchers wrote to elicit chatbot responses, not a person's presentation. It shows what an audit study treats as the recognisable form of the presentation; it observes no person, and it reaches neither the binge nor the compensatory-behaviour feature.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000531
  quote: "MB29.0\t\t\"- - - Avoidant or restrictive eating\"\tcategory\t2\tFalse\t21\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#1517485083\"\",\"\"browser\"\")\"\tTrue\tTrue\tBlockL1-MB2\t\t\t\t\nhttp://id.who.int/icd/entity/1535148777\thttp://id.who.int/icd/release/11/mms/1535148777\tMB29.1\t\t\"- - - Binge eating\"\tcategory\t2\tFalse\t21"
  locator: Chapter 21, MB29 Symptoms or signs involving eating and related behaviour
  licenses: Avoidant or restrictive eating and binge eating are coded as separate signs in ICD-11's symptoms chapter, i.e. two of the entry's four features are classification-recognised as observables in their own right, apart from any eating-disorder diagnosis. That is the closest the source comes to c2, and it reaches two features of four.
  fit: adjacent
  bridge: 'Title-only tabulation rows again: the codes carry names and no criteria. The compensatory-behaviour and body-perception features exist as separate codes elsewhere in the same file (MB29.3 Purging behaviour, MB27.3 Disturbance of body image) and are likewise names only. Nothing here supplies the entry''s requirement that the presentation be ORGANISED around eating, weight or shape.'
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000007
  quote: P79 mentioned that the agent provided potentially harmful diet plans and calorie information to an individual already vulnerable due to overwhelming life circumstances and an eating disorder.
  locator: Table A3, AI behavior class 'Providing harmful suggestion', Example column
  licenses: A real person with an eating disorder, reporting their own AI interaction in a survey of 283 people with lived mental health experience. It is the only place on this entry where the presentation belongs to an actual person rather than to a persona, a probe, a policy category or a classification row.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000007
  quote: P79 mentioned that the agent provided potentially harmful diet plans and calorie information to an individual already vulnerable due to overwhelming life circumstances and an eating disorder.
  locator: Table A3, AI behavior class 'Providing harmful suggestion', Example column
  licenses: 'The same case supplies the only occurrence-level instance of c4''s mechanism: diet plans and calorie information supplied to a person the participant describes as already vulnerable due to an eating disorder, filed by the paper under ''Providing harmful suggestion''. The harm judgement is made in light of the presentation.'
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000974
  quote: "Bipolar Disorder 87 0.46% 85 (97.7%) 49 (56.3%) 30 (34.5%) 49 (56.3%) 8 (9.2%) Suicidal Ideation 77 0.41% 74 (96.1%) 76 (98.7%) 2 (2.6%) 66 (85.7%) 9 (11.7%) Eating Disorder 58 0.31% 57 (98.3%) 33 (56.9%) 24 (41.4%) 32 (55.2%) 2 (3.4%)"
