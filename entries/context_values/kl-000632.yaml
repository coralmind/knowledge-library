id: kl-000632
display_id: Value-21
aliases:
- lgbtq
- Population-3
label: Lesbian, gay, bisexual, transgender, queer or other sexual or gender minority
type: context_value
layer: context
definition: 'The person is lesbian, gay, bisexual, transgender, queer, or otherwise part of a sexual or gender minority. What follows for a conversation is that a set of assumptions ordinarily safe to make are not: that family is a source of support rather than of the distress; that a person''s relationships and household can be described in heterosexual and cisgender terms; that distress about identity is a symptom rather than a response to how others have treated them. Distress in this population also has a documented structural component — the chronic stress of belonging to a stigmatised group — that is not reducible to individual pathology.'
distinguish_from:
- neighbor: kl-000635
  boundary: 'Both are group memberships whose relevance runs partly through minority stress, and both concern assumptions that a response should not make. What differs is which assumptions: that entry concerns how distress is expressed and understood across cultural frameworks and whether a referral is culturally usable; this one concerns whether family is a resource, and whether the terms a response uses for relationships and gender fit the person. Both are assigned where both hold, and the modifiers are not substitutes for one another.'
- neighbor: kl-000600
  boundary: 'kl-000600 is a condition tag: the person is thinking about ending their own life. This entry is who the person is. They are named against each other because their combination is this vocabulary''s clearest case of a modifier inverting the value of an otherwise sound response — see body.example_failure — and a reader needs both entries to see it.'
- neighbor: kl-000617
  boundary: 'kl-000617 is a condition tag for neurodevelopmental conditions. It is named here because it is the vocabulary''s other case of a durable identity-shaped fact, and it sits in the condition type while this one sits here: the difference is that a kl-000617 is also diagnosable and has a clinical literature about its course, and this is not a clinical state at all.'
body:
  dimension: kl-000729
  rationale: Minority stress — the chronic strain of belonging to a stigmatised group — is a documented component of distress in this population and is not reducible to individual pathology. Family rejection functions as a risk factor here rather than as the protective factor a general-population response would assume, which inverts the value of the most standard available suggestion. Distress specifically about disclosing one's identity to others has its own shape and timing. And heteronormative and cisnormative assumptions in how a response is worded, and in which resources it names, make otherwise sound guidance unusable.
  example_failure: 'ILLUSTRATION ONLY, not part of what this entry defines and not a claim about any rate: an AI responds to an LGBTQ+ teenager''s suicidal ideation by suggesting they talk to a trusted family member, where the family is the source of the rejection and the distress. THIS EXAMPLE IS STRUCTURALLY IMPORTANT BEYOND THIS ENTRY and that is why it is preserved verbatim in substance: the suggested response is protective in the general case and harmful here, which is a valence flip produced by a fact about who the person is. The catalog holds exactly one pathway demonstrating that shape and its two moderators are both condition tags; this is a ready-made second demonstration and it would be the first with a population modifier as the moderator.'
  boundary_note: 'This modifier covers a wide range of positions whose relevance to a conversation differs substantially — a person''s sexual orientation, a person''s gender identity, and a person''s being questioning are grouped into one value. The rationale''s four components do not apply uniformly across them: the family-rejection inversion applies broadly, while which terms a response should use is much more specific to gender identity. The vocabulary has one value and the source offers no basis for splitting it.'
sources:
- source: kl-000547
  contributes: existence
  locator: Supplemental Table S1, Overview of VERA-MH User-Agent Profiles, row 5 (20yo, White, Non-Hispanic, he/they)
  quote: "20yo, White, Non-Hispanic, he/they College student, sexual minority identity stress; internalized stigma; family pressure; shame, anxiety, and depression; in therapy"
  limits: 'The profiles are a design choice about synthetic personas. The paper is not a source on family rejection as a risk factor, not a source on minority stress, and emphatically not evidence that AI responses differ in quality for LGBTQ+ people: it reports no results stratified by user-agent identity characteristics.'
  note: 'The quote gives the first two cells of the table row whole, in reading order: the profile''s demographic cell, then its description cell, which names the identity stressors.'
  cited_for: Partial support only. Bentley et al. 2026 show that the VERA-MH evaluation built a simulated user-agent profile carrying 'sexual minority identity stress' and 'internalized stigma', alongside a separate profile describing a 'trans woman'. The profiles attest that this population is treated as a relevant user context in the design of an AI safety evaluation, and nothing more.
standing:
  value: asserted
  basis: 'The evidence base treats this population as present and relevant without grounding the entry''s central assumption. Brewster et al. 2025 deliver a suicidal-ideation vignette naming same-gender attraction and bullying as the stated context of the hopelessness; Mansoor 2025 restates national survey figures placing LGBTQ+ adolescents in mental-health crisis at rates well above their peers; and Sobowale et al. 2025 report LGBTQ+ participants receiving culturally incongruent or harmful advice from generative-AI psychotherapy chatbots. None of this reaches the assumption at the entry''s centre, that family cannot be assumed to be a source of support rather than a source of the distress: no held source supplies the family-rejection or minority-stress literature, and two sources searched for it contain nothing on sexual or gender minority status at all. No source examines real conversation data for this population, and none shows AI response quality differing for it.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People who are lesbian, gay, bisexual, transgender, queer or otherwise a sexual or gender minority are among those present in the conversations and mental-health-support settings this vocabulary describes.
- id: c2
  kind: context_dependence
  text: For a person in this population, family cannot be assumed to be a source of support rather than a source of the distress.
- id: c3
  kind: context_dependence
  text: For a person in this population, the person's relationships and household cannot be assumed to be describable in heterosexual and cisgender terms, and a response worded on that assumption is unusable for them.
- id: c4
  kind: context_dependence
  text: For a person in this population, distress about identity cannot be assumed to be a symptom rather than a response to how others have treated them.
- id: c5
  kind: harm
  text: Distress in this population has a documented structural component - the chronic stress of belonging to a stigmatised group - that is not reducible to individual pathology.
- id: c6
  kind: definition_boundary
  text: 'This context is separated from kl-000635 (racial or ethnic minority group) by which assumptions are at issue: family as a resource and the terms used for relationships and gender here, versus how distress is framed and whether a referral is culturally usable there. INELIGIBLE: the neighbour is another catalog entry.'
- id: c7
  kind: definition_boundary
  text: 'This context is separated from kl-000600 (suicidal ideation) as an identity rather than a condition tag. INELIGIBLE: the neighbour is another catalog entry.'
- id: c8
  kind: definition_boundary
  text: 'This context is separated from kl-000617 (neurodevelopmental condition) in that a neurodevelopmental condition is diagnosable with a clinical literature about its course while this is not a clinical state at all. INELIGIBLE: the neighbour is another catalog entry.'
claim_evidence:
- claim_id: c1
  source: kl-000524
  quote: |-
    He has been struggling with feelings of
    isolation and hopelessness related to a same-gender attraction
    and bullying at school.
  locator: eTable 2, suicidal ideation vignette
  licenses: 'Establishes that sexual-minority identity is treated as a presenting person-context in adolescent crisis material: this audit''s suicidal-ideation vignette, delivered to 25 consumer chatbots, names same-gender attraction and bullying as the stated context of the hopelessness. It is a vignette specification written by the investigators, not an observed person, so it evidences that the context is taken as one that arises rather than that it did arise in any logged conversation.'
  fit: adjacent
  bridge: The span is a synthetic patient description authored for the audit's stimulus set, not a description of any person who used a chatbot. The claim asserts that people in this population are present in these settings; the source establishes only that investigators designing a safety audit of adolescent mental-health chatbots treated the identity as a case the systems must handle.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000933
  quote: "Disparities are stark, particularly for LGBTQ+ \nyouth, who report significantly higher rates of suicidal ideation (39%) and attempts (12%) \ncompared to their cisgender and heterosexual peers.5 Youth of color, including \nNative/Indigenous (24% attempted) and Black/African American (14% attempted) youth, also \nface disproportionately high rates.5"
  locator: Introduction, The Escalating Crisis of Adolescent Suicide
  licenses: Establishes, by restating national survey figures, that LGBTQ+ adolescents are a population present in mental-health crisis at rates well above their peers, so the context is not a rare or hypothetical one. The percentages belong to the cited survey (ref 5), not to this paper, whose own vignettes carried no demographic characteristics at all.
  fit: analogical
  bridge: A restatement of the Trevor Project survey figures in this paper's Introduction, about human adolescents in the general population, not about any AI conversation and not measured here. The claim concerns who is present in the settings this vocabulary describes; the source establishes elevated rates in the general adolescent population.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-001010
  quote: |-
    For example,
    young adults in India and LGBTQ+ (Lesbian, Gay, Bisexual,
    Transgender, Queer, Questioning Plus) participants reported
    culturally incongruent or harmful advice [6,80,81], such as
    quitting a job they financially rely on due to workplace
    homophobia or recommending interventions that do not align
    with non-Western family norms.
  locator: Discussion - Transparency
  licenses: 'Bears directly on the assertion that guidance which is sound in general becomes unusable when it does not fit the person''s situation: LGBTQ+ participants are reported as having received culturally incongruent or harmful advice from generative-AI psychotherapy chatbots, with the worked example being a recommendation to quit a job the person financially relies on because of workplace homophobia.'
  fit: adjacent
  bridge: This sentence is a Discussion-section restatement of findings from three cited studies [6,80,81], not this paper's own data; this paper's contribution was a rubric-based evaluation of chatbot content. It also concerns a workplace-homophobia scenario rather than the household-and-relationship wording c3 names. The bridge is that both are cases of advice that is standard in general and unusable for this person because the responder assumed a situation the person is not in.
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-000933
  quote: "Disparities are stark, particularly for LGBTQ+ \nyouth, who report significantly higher rates of suicidal ideation (39%) and attempts (12%) \ncompared to their cisgender and heterosexual peers.5 Youth of color, including \nNative/Indigenous (24% attempted) and Black/African American (14% attempted) youth, also \nface disproportionately high rates.5"
  locator: Introduction, The Escalating Crisis of Adolescent Suicide
  licenses: 'Gives an outcome disparity - ideation at 39% and attempts at 12% for LGBTQ+ youth against their cisgender and heterosexual peers - which is the observable that a structural account of distress predicts. It does not establish that the disparity is structural rather than individual: the span reports rates and names no mechanism, so it is consistent with but does not license the ''not reducible to individual pathology'' half of c5.'
  fit: analogical
  bridge: Survey percentages restated from ref 5 in this paper's Introduction, about human adolescents and not about AI conversation, and this paper measured neither. The claim asserts a structural cause; the source supplies only a disparity in rates, from which the cause does not follow.
  contributes: prevalence
  contradicts: false
- claim_id: c5
  source: kl-000531
  quote: "QE03\t\t\"- - - Social exclusion or rejection\"\tcategory\t1\tFalse\t24\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#292381213\"\",\"\"browser\"\")\"\tTrue\tTrue\tBlockL1-QD5\tBlockL2-QE0\t\t\t\nhttp://id.who.int/icd/entity/1948692361\thttp://id.who.int/icd/release/11/mms/1948692361\tQE04\t\t\"- - - Target of perceived adverse discrimination or persecution\"\tcategory\t1\tFalse\t24"
  locator: Chapter 24, block QE0 Problems associated with social or cultural environment
  licenses: Establishes that a diagnostic classification treats social exclusion or rejection, and being the target of perceived adverse discrimination or persecution, as codable factors influencing health status rather than as symptoms of the person. That is the general form of c5's 'not reducible to individual pathology' half, coded at the level of the environment. It names no sexual or gender minority, so it reaches the form of the claim and not its population.
  fit: analogical
  bridge: ICD-11 is a classification, not a study, and the quoted rows code exclusion and discrimination generically for any group. The claim is about this population specifically and about the chronic strain of stigmatised group membership; the source establishes only that a standard nosology places such experiences outside individual pathology.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000524
  quote: |-
    He has been struggling with feelings of
    isolation and hopelessness related to a same-gender attraction
    and bullying at school.
  locator: eTable 2, suicidal ideation vignette
  licenses: The vignette states the hopelessness as 'related to a same-gender attraction and bullying at school', which is the entry's structure - distress framed as a response to how others have treated the person rather than as a free-standing symptom - written into the stimulus. It licenses that the framing is available and is used in serious adolescent-safety work, not that any observed person's distress had that character.
  fit: adjacent
  bridge: An investigator-written vignette rather than an observation. The claim asserts something about real people in this population; the source shows the assertion being adopted as a design premise by clinicians constructing a chatbot safety audit.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000963
  quote: Non-exhaustive, non-mutually-exclusive description of patient archetypes found in the MINDEVAL patient backstories generated in this work.
  locator: Table 1 caption
  licenses: Non-licensing. Establishes only that a published AI mental-health benchmark treats this entry rejection as one of the axes along which a simulated patient's backstory is varied. The archetypes are generated design parameters and the caption itself says the list is non-exhaustive and non-mutually-exclusive, so it frames the context as one the field considers relevant and says nothing about any person.
  fit: analogical
  bridge: Design parameters for synthetic patient backstories, with no observed population behind them; the claim concerns people present in real settings.
  contributes: frame
  contradicts: false
