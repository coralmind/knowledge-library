id: kl-000615
display_id: Value-16
aliases:
- motivational_ambivalence
- ConditionTag-16
label: Mixed feelings about changing a behavior
type: context_value
layer: context
definition: The person holds reasons both for changing a behaviour and for continuing it, and has not resolved between them. Their account characteristically contains both — what the behaviour costs them and what it does for them — and may move between the two within a single conversation. The behaviour is most often substance use, and this condition context also covers other behaviours where the person's own stated position on changing is unsettled.
distinguish_from:
- neighbor: kl-000616
  boundary: That condition context is a pattern of substance use with impaired control, escalating priority over other activities, and physiological features, and it can carry acute medical risk — withdrawal, overdose. This one names the person's unresolved position about changing a behaviour and carries no claim about the behaviour's severity or any medical risk. The two share an ICD code range exactly and are distinguished by what they are about, not by diagnosis. Both are assigned where a person meeting the disorder criteria is also unresolved about changing.
- neighbor: kl-000604
  boundary: That condition context is a mood state with anhedonia and hopelessness. This one is a stance toward a specific behaviour and requires no mood feature. A person unresolved about changing their drinking may be in unremarkable mood.
- neighbor: kl-000602
  boundary: That value applies where no specific condition is the presenting concern. This one applies where the presenting concern is specifically the person's unresolved position about a behaviour, which is specific rather than residual even though it is not a diagnosis.
body:
  dimension: kl-000727
  category_scope: mental_health_state_pattern
  icd_codes: No formal category
  experience_clusters:
  - kl-000706
  detection_note: 'The icd_codes field on this entry records the substance-use disorder range, which this entry SHARES EXACTLY with substance use disorder despite the two being different things. That is a defect in what the field can express rather than a coincidence: ambivalence about change is not a classified condition at all, and the code recorded here is the code of the behaviour the ambivalence is most often about. Read the field as context, not as this entry''s classification — which is why the standing sits at the floor while the code range looks authoritative.'
sources: []
standing:
  value: asserted
  basis: 'No source observes a real person''s ambivalence in conversation with an AI: six of the nine cited sources describe the clinician''s conduct rather than the person''s state, and the one with an AI interlocutor, Steenstra et al. 2026, uses simulated patients. The motivational-interviewing literature is well represented, with Wu et al. 2022 stating client ambivalence about behaviour change as the field''s settled position and Glynn and Moyers 2012 showing change talk and counter-change talk as separately countable categories of real client speech, yet none of it reaches the entry''s most specific assertion, that a person moves between the two sides within a single conversation. Glynn and Moyers 2012 also cuts against identifiability as the entry defines it: the same utterance is change talk under one target behaviour and counter-change talk or neutral under another, so neither side is identifiable until the target behaviour is fixed. Evidence that substance use is the most common unresolved behaviour is weak and indirect, with Sun et al. 2024 naming substance abuse alongside health promotion as areas where the approach addressed to ambivalence has shown success, which is a statement about where a treatment has been studied rather than about the distribution of behaviours people are unresolved about.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People hold reasons both for changing a behaviour and for continuing it, and have not resolved between them.
- id: c2
  kind: detectability
  text: A person in this state characteristically voices both sides -- what the behaviour costs them and what it does for them -- so the state is identifiable from what their account contains.
- id: c3
  kind: detectability
  text: A person in this state may move between the two sides within a single conversation.
- id: c4
  kind: prevalence
  text: The behaviour the person is unresolved about is most often substance use.
- id: c5
  kind: definition
  text: The context also covers behaviours other than substance use, wherever the person's own stated position on changing is unsettled.
- id: c6
  kind: definition_boundary
  text: This entry is distinguished from the substance use disorder context by being about the person's unresolved position rather than about a pattern of use with impaired control, and it carries no claim about severity or medical risk; the two share an ICD code range exactly and both are assigned where a person meeting the disorder criteria is also unresolved.
- id: c7
  kind: definition_boundary
  text: This entry is distinguished from the depression context by being a stance toward a specific behaviour requiring no mood feature; a person unresolved about their drinking may be in unremarkable mood.
- id: c8
  kind: definition_boundary
  text: This entry is distinguished from the general mental health context (kl-000602) by being specific rather than residual, even though it is not a diagnosis.
claim_evidence:
- claim_id: c1
  source: kl-001056
  quote: "As pointed out in MI literature [1], clients are often ambivalent about positive behaviour change, and therefore a key goal of MI is for clients to convince themselves to change, if it is compatible with their personal values and aspirations."
  locator: Section 2.4.2, Client Talk Type
  licenses: States, as the settled position of the motivational-interviewing literature and as the justification for a label set applied to real counselling transcripts, that clients are often ambivalent about behaviour change. It establishes that the state exists and is common in behaviour-change conversations. The people it concerns are clients in human-delivered counselling, and the statement is a literature restatement rather than a result of this paper's own annotation.
  fit: adjacent
  bridge: The claim is about a person, and the source is about a person, but the conversational setting is human counselling rather than an AI conversation, and the tag exists to be assigned in the latter. The source also asserts the frequency at second hand, citing the MI literature rather than reporting its own count.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001104
  quote: "The sole purpose \nof the CLEAR is to classify and quantify client language that is either change talk (CT) or \ncounter-change talk (CCT). As such, CLEAR focuses upon the types of in-session client \nlanguage that have been predictive of future change (or non-change)."
  locator: Purpose, History, and What to Code, Purpose
  licenses: Establishes that the two directions of the state this claim asserts are separately countable categories of real client speech, coded by trained raters from recorded sessions, and that the field counts them because they predict whether the change happens. That an entire instrument exists to quantify both directions in the same person's language is strong evidence the state occurs. No AI conversation is involved and no rate is given here.
  fit: analogical
  bridge: A coding manual specifying how human raters classify human clients' speech in human-delivered motivational interviewing, from the Talking about Drinking study. The claim asserts a state of a person in an AI conversation. The instrument is evidence the state occurs in people and evidence about how it is measured; it is silent about the setting the tag is assigned in.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000552
  quote: "Ambivalence about Change Internal conflict between motivation to change vs. motivation to maintain status quo."
  locator: Table 2, Psychological Constructs (Warning Signs)
  licenses: 'Defines the state as internal conflict between motivation to change and motivation to maintain the status quo, which is the claim''s content, and shows it being treated as a tracked state in an AI-conversation evaluation framework -- the only source on this entry where the interlocutor is an AI. It is not evidence the state occurs in any person: the 15 patient personas are simulated agents, so the ambivalence in this framework is a parameter of a designed persona, not an observation.'
  fit: adjacent
  bridge: The construct is instantiated in simulated patient agents with dynamic cognitive-affective models, evaluated across 369 simulated sessions. The claim is about people. The gap is between a state designed into a persona and a state a person holds.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001104
  quote: "The sole purpose \nof the CLEAR is to classify and quantify client language that is either change talk (CT) or \ncounter-change talk (CCT). As such, CLEAR focuses upon the types of in-session client \nlanguage that have been predictive of future change (or non-change)."
  locator: Purpose, History, and What to Code, Purpose
  licenses: 'The strongest support on this entry for identifiability from an account: a published instrument classifies each client utterance as change talk or counter-change talk, and the manual''s later text reports the categories are codable without a session transcript. So the two sides are recognisable from speech by a trained human rater. What it does not establish is identifiability by a system, or from the kind of unstructured account a person gives an AI.'
  fit: analogical
  bridge: Rater-applied coding of audio-recorded human counselling sessions with a designated target behaviour. The claim is that the state is readable from what a person's account contains in the conversations this catalog is about. Both the rater and the setting differ.
  contributes: detectability
  contradicts: false
- claim_id: c2
  source: kl-001104
  quote: "In order to code CLEAR, it is crucial that the topic of the \nconversation—that is, the “target behavior” that is to be changed—is known before beginning \ncoding."
  locator: Coding, Target behavior
  licenses: Cuts against the claim by naming a precondition the claim does not carry. The same utterance is change talk under one target behaviour and counter-change talk or neutral under another, so neither side of the ambivalence is identifiable until the target behaviour is fixed, and the manual says it must be fixed by the project or setting before coding begins. In a naturalistic conversation nobody designates a target behaviour, so the identifiability the claim asserts requires an inference step this instrument explicitly places outside the coding.
  fit: analogical
  bridge: 'A coding requirement for structured human MI sessions where the setting supplies the target. The claim concerns identification in conversations where it is not supplied. The gap is exactly the thing that makes it counterevidence: the source''s method depends on a fact the claim''s setting does not provide.'
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-001022
  quote: "It addresses doubts or ambivalence about change and strengthens a person’s belief in their ability to make positive changes (Martins and McNeil, 2009). By fostering a supportive environment, MI helps individuals find their own reasons to change and has shown success in areas like health promotion and substance abuse"
  locator: Section 2.1 Motivational interviewing
  licenses: Names substance abuse alongside health promotion as the areas where the approach addressed to ambivalence has shown success, which is weak and indirect evidence for the claim's 'most often'. It is a statement about where a treatment has been studied, not about the distribution of behaviours people are ambivalent about, and it names a second area in the same breath.
  fit: analogical
  bridge: A literature summary in a dataset paper's background section, about where motivational interviewing has been applied. The claim asserts a distribution over the behaviours people are unresolved about. Where a method has been trialled is a fact about research attention, not about that distribution.
  contributes: prevalence
  contradicts: false
- claim_id: c5
  source: kl-001104
  quote: "In order to code CLEAR, it is crucial that the topic of the \nconversation—that is, the “target behavior” that is to be changed—is known before beginning \ncoding."
  locator: Coding, Target behavior
  licenses: Supports the claim's extension beyond substance use. The manual states the target behaviour is obvious in a substance-abuse-treatment setting but might be less so in others, and its surrounding text names controlling blood sugars, brushing and flossing, and increasing physical activity as target behaviours the same coding applies to. The construct is therefore not specific to substance use in the field that owns it.
  fit: analogical
  bridge: An instruction to human coders about which behaviour to fix before coding a human counselling session. The claim is about the scope of a condition tag. The bridge is that the instrument's own scope statement is the field's answer to whether the construct extends past substance use, and it does.
  contributes: definition
  contradicts: false
- claim_id: c6
  source: kl-000552
  quote: "Ambivalence about Change Internal conflict between motivation to change vs. motivation to maintain status quo."
  locator: Table 2, Psychological Constructs (Warning Signs)
  licenses: Attached to an ineligible boundary claim and carried rather than counted. In this framework's alcohol-use-disorder test case, Ambivalence about Change is one construct among several tracked separately -- alongside Substance Craving Intensity, Cognitive Preoccupation with Use and Self-Efficacy -- in the same simulated patients. Independent tracking of the ambivalence construct and the use-severity constructs in one cohort is external corroboration that they are different things, which is the boundary's direction.
  fit: adjacent
  bridge: The source separates constructs for measurement purposes in simulated patients; the claim separates two catalog condition tags. Measurement separation is not the same decision as tag separation, and no real patient is involved.
  contributes: definition
  contradicts: false
