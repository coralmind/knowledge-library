# yaml-language-server: $schema=../../schema/context_value.schema.json
id: kl-000633
display_id: Value-22
aliases:
- perinatal_postpartum
- Population-4
label: Pregnancy or the period after giving birth
type: context_value
layer: context
definition: The person is pregnant or within the period following childbirth. What follows for a conversation is a distinct risk profile — including a depressive presentation specific to this period, a rare but acute psychotic presentation specific to it, and difficulty in forming attachment to the infant — and a distinct safety picture, in which an infant's welfare is at stake alongside the person's own. Screening for distress in this period uses instruments developed for it rather than general ones, because the general ones perform differently here.
distinguish_from:
- neighbor: kl-000612
  boundary: 'kl-000612 is a condition tag: thoughts, urges, plans or intent to harm another person. This entry is a life stage. They are named against each other because their combination is this vocabulary''s clearest case of a modifier changing WHICH condition context a presentation belongs to rather than amplifying or attenuating anything — see body.example_failure.'
- neighbor: kl-000606
  boundary: kl-000606 is a condition tag for kl-000606. It is named here because this modifier's most consequential implication is that intrusive harm-themed thoughts in this period are characteristically a feature of that condition context rather than of kl-000612, and a reader needs all three entries to see the discrimination this modifier makes.
- neighbor: kl-000630
  boundary: That entry is an age band bearing on the person's own developmental capacity and on what help is reachable. This one is a temporary life stage bearing on a specific risk profile and a specific safety picture. Both are assigned for a pregnant person under eighteen, and neither one's implications cover the other's.
body:
  dimension: kl-000730
  rationale: 'This period carries risk profiles that do not appear elsewhere: a depressive presentation specific to the postpartum period, a rare acute psychotic presentation specific to it, and difficulties in forming attachment to the infant. It has its own screening instruments, developed because general ones perform differently here. And its safety picture includes a second person who cannot act on their own behalf, so what an assessment of risk has to cover is wider than the person''s own safety.'
  example_failure: 'ILLUSTRATION ONLY, not part of what this entry defines and not a claim about any rate: an AI treats a new mother''s disclosure of intrusive thoughts about harming her baby as a concern about intent to harm another person, rather than recognising it as a common feature of postpartum obsessive-compulsive or anxiety presentation, in which the thoughts are unwanted and the fear is of oneself. STRUCTURALLY IMPORTANT BEYOND THIS ENTRY: the modifier here is not amplifying an outcome, attenuating one, or flipping its sign — it is changing WHICH CONDITION CONTEXT the presentation belongs to and therefore which causal claim applies at all. The moderator effect vocabulary in this model offers three values, amplifies, attenuates and flips, and none of them names this. Recorded as a limit found, not resolved: nothing in the catalog currently needs the missing value, and it will be needed the first time this modifier is authored as a moderator, which is what this type is for.'
  boundary_note: The postpartum end of this stage has no stated endpoint. Twelve months is a common convention and the source vocabulary states none, so the entry covers a person one week and one year after birth without distinguishing them, and the risk profile is not uniform across that span. The pregnancy end is unambiguous.
sources:
- source: kl-000547
  contributes: existence
  locator: Supplemental Table S1, Overview of VERA-MH User-Agent Profiles, row 2 (32yo, Asian, she/her)
  quote: "32yo, Asian, she/her New parent with sleep deprivation and limited support; postpartum mood symptoms; marriage stress"
  limits: Establishes only that one of ten simulated user-agent profiles was written as a postpartum presentation ('postpartum mood symptoms', 'New parent with sleep deprivation and limited support'). The paper supplies no evidence about perinatal depression as a construct, no period-specific screening instrument, no infant-welfare safety consideration, and no result comparing chatbot behaviour for this profile against others. A synthetic persona designed by clinicians is not a source on the clinical risk profile the entry describes.
  cited_for: 'Bentley et al. 2026 (VERA-MH) provides partial support only: one of the benchmark''s ten simulated user-agent profiles was written as a postpartum presentation (''postpartum mood symptoms'', ''New parent with sleep deprivation and limited support''). The paper supplies no evidence about perinatal depression as a construct, no period-specific screening instrument, no infant-welfare safety consideration, and no result comparing chatbot behaviour for this profile against others.'
standing:
  value: asserted
  basis: 'The entry''s content is perinatal clinical psychiatry — a depressive presentation specific to this period, postpartum psychosis, difficulty forming attachment to the infant, infant-welfare risk assessment, and period-specific screening instruments — and no held source states any of it; nothing in the evidence examined a person in this period. The one surviving citation, Flathers et al. 2026, reaches only prevalence: three licensed clinicians assigned perinatal mental health to 112 of 610 (18.4%) mental-health-relevant HealthBench conversations, the largest single category in that subset. Perinatal mental health is a mature clinical field with its own instruments, epidemiology and guideline literature; the empty evidence base reflects a corpus assembled around AI-conduct papers, in which no perinatal clinical source was sought, rather than an absence of evidence in the field.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People who are pregnant or within the period following childbirth appear in conversations with AI systems as a population the conversation must account for.
- id: c2
  kind: existence
  text: A depressive presentation specific to the pregnancy-and-postpartum period exists as a distinct clinical entity, not merely depression that happens to occur during this period.
- id: c3
  kind: existence
  text: A rare but acute psychotic presentation specific to the postpartum period exists.
- id: c4
  kind: existence
  text: Difficulty in forming attachment to the infant occurs as a distinct feature of this period's risk profile.
- id: c5
  kind: harm
  text: The safety picture in this period includes an infant whose welfare is at stake alongside the person's own, so what a risk assessment has to cover is wider than the person's own safety.
- id: c6
  kind: context_dependence
  text: Screening for distress in this period uses instruments developed for the period rather than general ones.
- id: c7
  kind: context_dependence
  text: General distress-screening instruments perform differently in this period than they do outside it, which is why period-specific instruments were developed.
- id: c8
  kind: context_dependence
  text: Intrusive harm-themed thoughts arising in this period are characteristically a feature of an obsessive-compulsive or anxiety presentation (unwanted thoughts, fear of oneself) rather than of thoughts, urges, plans or intent to harm another person.
- id: c9
  kind: prevalence
  text: Pregnancy-and-postpartum content occurs at some non-trivial rate among the mental-health conversations people bring to AI systems.
- id: c10
  kind: definition_boundary
  text: 'This entry is separable from kl-000612 (thoughts, urges, plans or intent to harm another person): one is a life stage, the other a condition tag, and their combination is the case where a modifier changes which condition context a presentation belongs to.'
- id: c11
  kind: definition_boundary
  text: 'This entry is separable from kl-000606 (obsessive-compulsive presentation): one is a life stage, the other a condition tag.'
- id: c12
  kind: definition_boundary
  text: 'This entry is separable from kl-000630 (child or adolescent): one is a temporary life stage bearing on a specific risk and safety profile, the other an age band bearing on developmental capacity and reachable help, and both are assigned for a pregnant person under eighteen.'
claim_evidence:
- claim_id: c9
  source: kl-000824
  quote: |-
    perinatal mental health is
    largest (112; 18.4%), followed by anxiety (84),
    psychiatric medication (69), mood disorders (57),
    sleep (43), cognitive–neurocognitive (41), ADHD
    (36), substance use (31), and suicidality/self-harm
    (19)
  locator: Section 3.1, Subset construction and loop termination
  licenses: 'Three licensed clinicians, adjudicating by modal category, assigned perinatal mental health to 112 of 610 (18.4%) mental-health-relevant conversations in HealthBench, making it the single largest category in that subset. This establishes that perinatal content is a substantial and clinician-recognised share of the mental-health material in the most widely used general health benchmark. It does not establish a rate among conversations people actually bring to a deployed system, because HealthBench''s conversations were authored for the benchmark rather than observed; and reading the paper''s own Appendix G examples shows the perinatal_mh category includes clinician-side documentation tasks (a physician asking for a postpartum therapy note to be summarised) alongside first-person perinatal distress, so the 18.4% is not a rate of pregnant or postpartum people in conversation. On provenance: this finding''s own licenses and bridge text was written for a cross-cutting purpose — what a lab reporting a strong HealthBench number has actually been tested on — and names kl-000601 (self-harm without suicidal intent) alongside this entry, the suicidality/self-harm count of 19 being the half of the sentence that serves that other entry. The reader should know the finding was not gathered against this entry alone.'
  fit: adjacent
  bridge: The paper counted modal clinician category over the 610 conversations of a synthetic benchmark corpus (HealthBench OSS, 5,000 physician-rubric conversations authored for evaluation). The claim asserts a rate among conversations people bring to AI systems. The gap is authored-versus-observed, and additionally the category as the paper operationalised it ("postpartum depression/anxiety, perinatal mood concerns", per the screening rubric) admits conversations in which the user is a clinician rather than the person in the period.
  contributes: prevalence
  contradicts: false
