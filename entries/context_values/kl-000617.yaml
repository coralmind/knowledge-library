id: kl-000617
display_id: Value-18
aliases:
- neurodevelopmental
- ConditionTag-18
label: Lifelong differences in attention, social communication or sensory processing, such as autism
type: context_value
layer: context
definition: The person has a condition arising in the developmental period that shapes attention, executive function, social communication, or sensory processing — attention deficit hyperactivity presentations, autism spectrum presentations, and other conditions of the same kind. The features are lifelong and pervasive rather than episodic, and this condition context is assigned on the basis of the person's profile rather than on any current change in their state.
distinguish_from:
- neighbor: kl-000608
  boundary: 'That condition context is apprehension, fear, panic or avoidance as a presentation that can change and remit. This one is a lifelong profile. They co-occur at high rates and are frequently confused in practice: sensory overload and social exhaustion can present as avoidance, and avoidance can be read as phobic when it is a response to sensory load. Both are assigned when both are present, and the distinction is whether the feature is a developmental characteristic or a state that arose.'
- neighbor: kl-000606
  boundary: That condition context requires intrusive unwanted mental content and acts undertaken to reduce the distress it causes. This one includes repetitive behaviours and strong preferences for sameness that are not experienced as unwanted and do not serve to reduce distress about a feared outcome. The distinction is whether the person experiences the behaviour as imposed on them.
- neighbor: kl-000602
  boundary: That value applies where no specific condition is present. This one is specific, and its relevance to a conversation may be entirely about how information is best conveyed rather than about any distress at all — which is what makes its placement in this type contested. See contested.
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes: 6A00-6A0Z / F80-F98
  experience_clusters:
  - kl-000707
  detection_note: 'This condition context is one a person characteristically reports rather than displays: the profile is established by history and assessment, and what a conversation shows is at most features consistent with it. A literal reading of a figurative statement, or a request for explicit rather than implied information, is consistent with this profile and consistent with several other things.'
contested:
  summary: 'Whether this value belongs as a presentation, as a population modifier, or as two entries. Autism and attention-deficit presentations are diagnosable conditions with a clinical literature, which fits a presentation. But the stated reason for the value is a population-modifier argument: that the profile creates distinct interaction risks through literal interpretation, sensory load and executive function, so the same situation calls for a different response because of who the person is. A fact that changes the causal claim about the person''s clinical trajectory is a presentation; a fact that changes what counts as a correct response is a modifier. This fact does both, which argues for two entries. The modifier half has no entry, so this entry stands as the presentation half alone.'
sources: []
standing:
  value: asserted
  basis: 'The category''s clinical warrant is the ICD-11 neurodevelopmental-disorders block (6A00-6A0Z), which is not registered as a citable source here, and what the citations themselves carry is thinner. Song et al. 2025 records a person describing, in their own words, autism and ADHD operating in themselves at once, a first-person account rather than an external classification, and Song et al. 2026 confirms that one of the entry''s named presentations is carried as a distinct diagnostic category by an external instrument built on DSM-5. No cited source addresses course or persistence, so the claim that the features are lifelong and pervasive rather than episodic rests on nothing. The claim that this context is assigned on the person''s established profile rather than on current state draws only counterevidence: Weilnhammer et al. 2026 states that symptom expression is itself shaped by developmental factors alongside demographic, educational, linguistic and cultural ones.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: There is a coherent category of condition arising in the developmental period that shapes attention, executive function, social communication or sensory processing, comprising attention deficit hyperactivity presentations, autism spectrum presentations and conditions of the same kind.
- id: c2
  kind: context_dependence
  text: The features of this category are lifelong and pervasive rather than episodic.
- id: c3
  kind: detectability
  text: This context is assigned on the basis of the person's established profile rather than on any current change in their state.
- id: c4
  kind: definition_boundary
  text: This differs from the anxiety condition context in that anxiety is a presentation that can change and remit while this is a lifelong profile; both are assigned when both are present.
- id: c5
  kind: definition_boundary
  text: This differs from the ocd condition context in that OCD requires intrusive unwanted mental content and acts undertaken to reduce its distress, while this includes repetitive behaviours and preferences for sameness not experienced as imposed.
- id: c6
  kind: definition_boundary
  text: This differs from the general_mental_health context, which applies where no specific condition is present.
claim_evidence:
- claim_id: c1
  source: kl-001092
  quote: "I’ve spent a lot of effort and a lot of time in therapy working on how to regulate myself when I’m dysregulated. So ChatGPT hasn’t really provided a meaningful reason for me to interact with it when I’m dysregulated due to autism symptoms but for ADHD and task paralysis, ChatGPT is excellent."
  locator: Section 5.1.3 Mental Healthcare Alongside LLM Chatbots, quoting Ashwini
  licenses: A person carrying both presentations names them in their own words as two distinct things operating in themselves at once -- autism symptoms producing dysregulation, ADHD producing task paralysis. It establishes that the entry's two named presentations occur in people and are recognised as separate members of the same personal profile, which is c1's category claim at the level of a lived instance.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001011
  quote: "Our coverage encompasses Anxiety Disorders (e.g., GAD, Specific Phobia), Obsessive-Compulsive and Related Disorders (e.g., OCD, Body Dysmorphic Disorder), Trauma- and Stressor-Related Disorders (e.g., PTSD, Adjustment Disorder), Mood Disorders (e.g., MDD, BD I and II), the Schizophrenia Spectrum (e.g., Delusional Disorder, Schizophrenia), Feeding and Eating Disorders (e.g., Anorexia Nervosa, Binge-Eating Disorder), and Attention-Deficit/Hyperactivity Disorder (ADHD)."
  locator: Appendix A.1 Scope of Disorders, Scope of MENTALBENCH, with the full list in Table 2
  licenses: Confirms that one of the entry's two named presentations is carried as a distinct diagnostic category by an external instrument built on DSM-5, and that the categories the entry's boundary claims separate it from are separate categories there too.
  fit: adjacent
  bridge: A coverage list from a benchmark's scope section, naming ADHD as one of 23 DSM-5 disorders it evaluates. It establishes that a psychiatrist-validated instrument treats ADHD as a disorder requiring differentiation from anxiety, OCD, trauma, mood, schizophrenia-spectrum and eating presentations. It names one member of the entry's category and does not supply the developmental-period criterion, the four affected domains, or autism.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-001055
  quote: "Most LLMs, like physicians, \ninterpreted “the ability to live independently” and “basic life needs” \nprimarily in terms of biological requirements and self-care, including \neating, personal hygiene, dressing, mobility, and other activities of \ndaily living."
  locator: Conclusions
  licenses: Establishes that the category the entry names is one clinicians and models are asked to assess against, which is weak external corroboration that it is a recognised category and nothing more.
  fit: adjacent
  bridge: The population is a set of fictional disability-assessment vignettes scored by models and physicians, not people. What the quote establishes is that 'neurodevelopmental disorders' functions as an assessable category in a clinical decision context; it supplies no feature or criterion of the category, so it does not reach c1's four-domain definition.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001052
  quote: "simulated conversations are unlikely to capture the full heterogeneity of real-world psychiatric presentations, where symptom expression is shaped by demographic, developmental, educational, linguistic, cultural and other intersectional factors"
  locator: Discussion, limitations
  licenses: The authors state that symptom expression is itself shaped by developmental factors alongside demographic, educational, linguistic and cultural ones. That the developmental profile shows up in how the presentation expresses itself in the moment cuts against c3's claim that this context is assignable from profile alone and not from any current change in state -- the two are entangled in the source's own account.
  fit: adjacent
  bridge: The authors are describing the limits of their own 30 simulated profiles, not testing how a developmental context is assigned. What transfers is their statement that developmental factors shape symptom expression, which cuts against c3's separation of a fixed profile from current state.
  contributes: counterexample
  contradicts: true
