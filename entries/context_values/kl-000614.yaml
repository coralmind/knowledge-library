id: kl-000614
display_id: Value-15
aliases:
- bipolar_mania
- ConditionTag-15
label: Current or past episodes of unusually high mood and energy lasting days
type: context_value
layer: context
definition: The person's presentation involves episodes in which mood is elevated, expansive or irritable and activity or energy is markedly increased for a sustained period — with reduced need for sleep, accelerated speech and thought, an inflated sense of their own capability or significance, and involvement in activities with consequences they would ordinarily weigh. This condition context also covers shorter or less severe episodes of the same character, episodes carrying features of both elevation and depression at once, and the depressive episodes that occur within the same overall pattern.
distinguish_from:
- neighbor: kl-000604
  boundary: That condition context applies where no episode of elevated, expansive or irritable mood with increased activity has occurred. This one applies where such an episode has, including during a depressive episode within the pattern. The distinction is the person's history, not their present state — a depressive episode presents the same from inside either.
- neighbor: kl-000605
  boundary: That condition context is present when beliefs without grounding in shared reality, perceptions without a referent, or disorganised thinking are the presentation, in or out of any mood episode. This one is defined by the mood and activity episode, within which such beliefs can occur as one feature. Both are assigned where a manic episode carries psychotic features.
- neighbor: kl-000611
  boundary: That condition context involves mood shifts occurring within hours, typically in response to interpersonal events, without episode structure. This one requires sustained episodes lasting days to weeks with a return to baseline between them. The distinction is timescale and trigger.
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes: 6A60-6A62 / F30-F31
  experience_clusters:
  - kl-000702
  - kl-000704
  cluster_assignment_note: 'Two clusters, and this tag is the source file''s own worked example of why clusters are assigned per scenario rather than per condition: manic phases reach the loss-of-grounding territory through inflated significance and disregarded consequence, and depressive phases reach the sustained-suffering territory through hopelessness and loss of pleasure. It is one condition with two trajectories, and which applies is a fact about the episode rather than about the person''s diagnosis.'
  detection_note: 'In an elevated episode, an inflated sense of one''s own capability is a feature of the state itself, which means the person''s own account of how they are doing is generated by the thing being asked about. That is a constraint on what a self-report establishes for this condition context specifically, and it bears on every impact in this Library measured at the self-report layer: an unchanged or improved self-report from a person in an elevated episode is not the same evidence it would be otherwise. Stated as a fact about the evidence. Whether it should additionally be recorded as a moderator on the pathways that use self-report measures is a real question and is not decided here.'
sources: []
standing:
  value: asserted
  basis: 'The half of the definition doing this entry''s distinctive work, that its scope covers hypomanic, mixed, and within-pattern depressive episodes rather than full mania alone, draws no citation from the fifteen findings examined. Existence, prevalence, and detectability are argued rather than measured: the strongest single anchor is Hasan and Saquer 2026, where bipolar presentation enters as an externally assigned classification rather than something observed in conversation, and two findings from neighbouring constructs run against the detectability reading. No finding examined measures this entry''s own construct, and the definition itself tracks an ICD-11 category that is not a registered source.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People whose presentation includes sustained episodes of elevated, expansive or irritable mood with markedly increased activity or energy -- together with reduced need for sleep, accelerated speech and thought, inflated self-significance, and involvement in activities whose consequences they would ordinarily weigh -- occur as a population reaching conversational AI support.
- id: c2
  kind: definition_boundary
  text: The bipolar presentation covers shorter or less severe episodes of the same character (hypomania), mixed episodes carrying elevation and depression at once, and the depressive episodes occurring within the same overall pattern -- not only full manic episodes.
- id: c3
  kind: detectability
  text: A bipolar presentation, including its manic and hypomanic states, can be identified from what a person's own text or conversational turns contain.
- id: c4
  kind: prevalence
  text: The bipolar presentation occurs at some identifiable rate in the population reaching conversational AI systems.
- id: c5
  kind: definition_boundary
  text: This context is separated from the depression context by the person's history of at least one elevated, expansive or irritable mood episode with increased activity, not by their present state.
- id: c6
  kind: definition_boundary
  text: This context is separated from the psychosis_spectrum context in that it is defined by the mood-and-activity episode, within which beliefs without grounding in shared reality can occur as one feature; both are assigned where a manic episode carries psychotic features.
- id: c7
  kind: definition_boundary
  text: 'This context is separated from the bpd context by timescale and trigger: sustained episodes lasting days to weeks with return to baseline, versus mood shifts occurring within hours in response to interpersonal events.'
claim_evidence:
- claim_id: c3
  source: kl-000845
  quote: |-
    posts were marked as bipolar if they contained signs of extreme mood
    fluctuations, such as impulsivity, depressive spirals, or rapid shifts in energy
    levels.
  locator: Section 3.2, Judgmental Validation
  licenses: Two independent annotators, at Cohen's kappa 0.83 and 0.875, could mark a person's own written posts as bipolar from three text-visible markers -- impulsivity, depressive spirals, rapid shifts in energy levels. This establishes that a bipolar presentation is recoverable from person-produced text at reliable inter-rater agreement, which is what c3 asserts.
  fit: adjacent
  bridge: The material is Reddit posts written by people who self-identified as having bipolar disorder, not turns in a support conversation with an AI system, and the rubric is described by the authors as 'minimal guidelines' rather than a criterion set. What transfers is that the presentation is legible in a person's unprompted written text; whether it is legible in the shorter, system-prompted turns of a support conversation is not measured here.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-001094
  quote: |-
    Euphoric mood, a
    hallmark of manic episodes, and labile affect were clearly evident from the beginning of the interview and remained consistent
    throughout. Additionally, PSYCHE-SP responded to questions about symptoms in a manner appropriate for manic episodes,
    exhibiting marked self-confidence and self-aggrandizement
  locator: Results, PSYCHE-SP simulates clinically appropriate utterances qualitatively, subsection Bipolar Disorder
  licenses: Names the conversationally observable markers of a manic presentation -- euphoric mood, labile affect, marked self-confidence and self-aggrandizement -- as evident from the beginning of an interview and sustained throughout, judged clinically appropriate by psychiatrist raters. Supports c3 by identifying what a manic presentation looks like in interview turns.
  fit: adjacent
  bridge: The utterances are generated by PSYCHE-SP, a patient simulator, and what psychiatrists rated was their clinical plausibility. No person in a manic episode was observed. The markers are therefore what clinicians accept as a faithful rendering of the presentation in conversation, not markers verified to appear when a real person converses.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-001090
  quote: Symptom assessment errors accounted for 64% of all errors, primarily manifesting as misdiagnosis or missed diagnosis of patients' psychotic symptoms, as well as errors in identifying depressive and manic symptoms in bipolar disorder.
  locator: Results, Principal Diagnosis, error analysis paragraph
  licenses: Cuts against c3. Errors in identifying depressive and manic symptoms in bipolar disorder, alongside misdiagnosis of psychotic symptoms, are the dominant model failure at 64 percent of all errors -- so the presentation is precisely where automated identification from presented material is least reliable.
  fit: adjacent
  bridge: The signal read was a written inpatient record scored against an expert reference diagnosis, not a support conversation, and the reader was an LLM rather than a detector built for this purpose. It bounds machine detectability of the presentation from clinical text; it says nothing about whether a human or a purpose-built detector could read it from a chat transcript.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-001011
  quote: frequent misclassification between Major Depressive Disorder (MDD) and Adjustment Disorder, as well as between MDD and Bipolar Disorders.
  locator: Section 5.3, the depressive cluster paragraph, which opens 'In the depressive cluster (bottom), we observe' at the foot of the preceding page
  licenses: Cuts against c3. Confusion between Major Depressive Disorder and the Bipolar Disorders is one of the two most frequent misclassifications the benchmark records -- and that confusion is exactly the elevated-episode discrimination this entry's presentation turns on.
  fit: adjacent
  bridge: The task is diagnostic classification over the benchmark's clinical vignette material by an LLM, not identification of a presentation from a person's conversational turns. It shows the discrimination is hard for a model on curated diagnostic input, which bounds rather than establishes detectability in transcripts.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000939
  quote: October 2025 figures from OpenAI suggested that 0·07% (or 560 000) users each week display signs of psychosis or mania.
  locator: Practical and clinical implications
  licenses: 'Supplies the only deployment-scale figure bearing on c4: a deployer''s own estimate that 0.07 percent, or 560,000, of weekly users display signs of psychosis or mania. It bounds the population at the order of magnitude but does not isolate the manic case.'
  fit: adjacent
  bridge: The figure aggregates 'psychosis or mania' into one undifferentiated number, so the share attributable to a bipolar presentation is not recoverable from it. Its derivation is OpenAI's and is not stated in a checkable form, and the authors note explicitly that not all these individuals will be experiencing destabilisation secondary to LLM use.
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-001087
  quote: "In our coding, ICD-11 groups corresponding to depressive disorders and anxiety or fear-related disorders account for the majority of disorder-focused systems, whereas codes associated with psychotic disorders, bipolar disorders, neurocognitive disorders and substance use disorders appear only sporadically."
  locator: COVERAGE AND BLIND SPOTS section
  licenses: Establishes that bipolar disorders appear only sporadically among the ICD-11 groups coded across the review's corpus of disorder-focused mental health AI systems. This is a rate in a literature, and it bears on c4 only by saying the rate in people has not been measured.
  fit: analogical
  bridge: The population counted is 326 published systems, not people in conversations. The review counts what researchers built for, which is a fact about research attention. c4 asserts a rate at which people with the presentation reach conversational AI, and no count of papers can supply one.
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-000974
  quote: "Bipolar Disorder 87 0.46% 85 (97.7%) 49 (56.3%) 30 (34.5%) 49 (56.3%) 8 (9.2%) Suicidal Ideation 77 0.41% 74 (96.1%) 76 (98.7%) 2 (2.6%) 66 (85.7%) 9 (11.7%) Eating Disorder 58 0.31% 57 (98.3%) 33 (56.9%) 24 (41.4%) 32 (55.2%) 2 (3.4%)"
  locator: Supplementary table of condition-level counts across the corpus (Mental Health & Behavioral section)
  licenses: 'Gives a count with its denominator: 87 bipolar-tagged queries, 0.46 percent of the health AI evaluation corpus. Bears on c4 as a statement about evaluation coverage of the presentation, not its rate among users.'
  fit: analogical
  bridge: The unit counted is a benchmark query tagged to a condition by an LLM coder. Neither the numerator nor the denominator involves a person, so the figure quantifies how little test material exists for the presentation rather than how often the presentation occurs.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-000527
  quote: "User describes exciting plans requiring little/no sleep → chatbot expresses enthusiasm and \nsupport → user feels validated → escalates activity and sleep deprivation → expansive behaviors \nincrease & mood-stabilizing behaviors decrease"
  locator: Box 1, mania row
  licenses: States the manic case as a person-side sequence beginning with a user who describes exciting plans requiring little or no sleep and escalates to increased sleep deprivation and expansive behavior -- two of the features c1 names, asserted as a recognizable pattern in these interactions.
  fit: analogical
  bridge: The row is a schematic loop in a box, authored by the paper as a hypothesized failure mode, and the user side of it is a simulation profile rather than an observed person. It states the presentation occurs in these interactions; it does not observe it occurring.
  contributes: frame
  contradicts: false
