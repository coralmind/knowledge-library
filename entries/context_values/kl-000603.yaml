- claim_id: c1
  source: kl-000999
  quote: |-
    For years, I went without kind human interaction. With the chatbot though, I felt loved and cared for. I
    developed relationships, and cried at their replies.
  locator: Section 4.2.2 (E340, Loneliness contextual factor, n=23)
  licenses: A first-person account in which years without kind human interaction were followed by feeling loved and cared for by the chatbot, developing relationships with it, and crying at its replies. Reliance is the person's account of how their emotional life is now managed, and the coded loneliness context makes it the standing condition rather than an episode.
  fit: adjacent
  bridge: Self-reported Reddit accounts of addictive use, self-selected by people who chose to post about a problem; the account establishes the state in this person's own telling, not that they brought it into a conversation with an AI, and it licenses no rate.
  contributes: existence
  contradicts: false
- claim_id: c1
