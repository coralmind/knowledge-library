  licenses: Higher trust in the AI predicts higher scores on an emotional-dependence measure in a randomized four-week study, so the reliance the entry names is a state that varies measurably between people rather than a category with no gradient.
  fit: adjacent
  bridge: A regression coefficient on a self-report dependence scale administered around a four-week assigned-use protocol. It establishes that dependence varies with trust; it establishes nothing about the three relational forms the entry names, and the scale is not the entry's construct.
