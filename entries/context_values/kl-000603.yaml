- claim_id: c1
  source: kl-000944
  quote: Mental health support (4.1%, N=13) Teens rely on Character.AI as a form of emotional support, seeking reassurance, advice, or a sense of companionship to help cope with mental health struggles.
  locator: Table 1, Codebook for RQ1, 'Mental health support' code
  licenses: A codebook derived from 318 self-identified 13-to-17-year-old posts carries 'Teens rely on Character.AI as a form of emotional support' as a recurring coded pattern, so reliance on a companion chatbot to cope with mental-health difficulty is an observed and named class of case rather than a hypothetical one.
  fit: adjacent
  bridge: What was read is what teens wrote about their use in Reddit posts, not the conversations themselves; the code establishes that reliance for emotional support recurs, and does not establish for any of the 13 that the reliance had become central to how they manage their emotional life rather than one resource among several.
