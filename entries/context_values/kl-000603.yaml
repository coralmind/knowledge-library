    conversational AI, recruited from a Chinese-language community
    where human–AI romance is actively practiced and collectively
    negotiated.
  locator: Section 1 Introduction
  licenses: Thirty people recruited on the eligibility criterion of an ongoing romantic relationship with a conversational AI, from a community where the practice is collectively negotiated, establishes that a sustained AI relationship occupying a partner's place in a person's life is a population that can be found and recruited.
  fit: adjacent
