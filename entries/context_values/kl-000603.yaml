  locator: Appendix A, Table 7 Additional reliance and dependency clusters, Romantic Partnership Replacement and Exclusive Intimate Attachment (Severe)
  licenses: Real consumer conversations, read directly, in which reliance on the AI spanned emotional regulation, intimate and sexual needs, daily companionship and identity formation across 5 to 200+ interactions. Reliance across all of those domains at once is the centrality the entry names, observed in the conversations themselves rather than reported afterwards.
