# yaml-language-server: $schema=../../schema/context_value.schema.json
id: kl-000603
display_id: Value-4
aliases:
- companion_ai_dependency
- ConditionTag-4
label: Reliance on a relationship with an AI as a main emotional support
type: context_value
layer: context
definition: 'The person relies on a relationship with an AI system in a way that has become central to how they manage their emotional life: turning to it in preference to available human relationships, experiencing a bond with it that they describe in the terms of a personal relationship, or experiencing loss and grief when a particular AI persona changes or becomes unavailable. This names the person''s situation as they bring it into a conversation. No clinical classification carries this category, and the entry''s own scope is contested — see `contested`.'
distinguish_from:
- neighbor: kl-000025
  boundary: 'kl-000025 is a judgment-layer impact: the claim that a person''s regulation became anchored to an AI''s availability as a result of an interaction. This entry is the person-context fact that such reliance is part of the situation the person arrives with. The same real-world state can be both — produced by one interaction and carried into the next — and the two entries make different claims about it. Which one applies to a given case depends on whether the reliance is being asserted as an outcome or recorded as a condition, and this entry does not settle that; see contested.'
- neighbor: kl-000611
  boundary: That condition context is a pattern of emotional dysregulation, unstable relationships and identity disturbance across a person's relational life. This one names reliance on an AI relationship specifically, and it occurs in people whose other relationships are stable.
- neighbor: kl-000605
  boundary: 'That condition context involves beliefs held without a basis in shared reality, or perceptions without an external referent. This one does not: a person can accurately understand what an AI is and still rely on the relationship centrally. Where a person believes an AI system is a conscious being addressing them personally, both may apply.'
body:
  dimension: kl-000727
  category_scope: mental_health_state_pattern
  icd_codes: 6C51 (by analogy) / No formal category
  experience_clusters:
  - kl-000705
  - kl-000702
  cluster_assignment_note: 'Two clusters because the situation reaches two different territories: the maladaptive relationship cluster, where the AI relationship is the object of the reliance; and the loss-of-grounding cluster, reached in the subset of cases where the person''s account of what the AI is departs from what it is. The second is a subset, not a second reading of the whole.'
  detection_note: 'The icd_codes field for this entry is the vocabulary''s only by-analogy code, and the source wrote it that way: "6C51 (by analogy) / No formal category". 6C51 is Gaming Disorder. The analogy is a statement that no classification covers this, which makes the field a disclosure rather than a code, and it is the reason this entry cannot reach externally_classified standing.'
contested:
  summary: 'Whether a condition_tag may name a state that an AI interaction itself produces. An observation and a judgment about it are separate objects, and this entry''s content — over-reliance on AI, parasocial bonding, preference for AI over human relationships — is the same territory as the dependency impact family and the model-deference mechanism. If a condition tag may only name what a person brings IN, this entry should split: a pre-existing-vulnerability tag plus an impact that already exists. If it may name a state however it arose, the entry stands as authored. It is authored as a single entry, at the floor of its standing vocabulary, until that is decided.'
sources:
- source: kl-000009
  locator: sections on dependency and reliance in conversational AI use
  contributes: frame
  cited_for: Suh et al. 2026 frames reliance on conversational AI for emotional support as a construct under study; the citation supplies the frame within which this category is posed rather than evidence that the category carves a clinical boundary.
standing:
  value: asserted
  basis: 'The category''s descriptive content is well evidenced: Sharma et al. 2026, which examined 1.5 million real conversations, squarely supports the reliance as it appears in conversation, and most of the entry''s component claims are supported by examined conversation data or by people''s own reports. What the evidence contradicts is one assertion carried in a boundary statement of the entry: that the reliance occurs in people whose other relationships are stable. That assertion has no supporting citation anywhere in the gathered findings and four citations cutting against it, two of them prospective and within-person studies. Because the entry as stated asserts the conjunction, the contradicted conjunct is what the evidence base fails to reach.'
  floored_by: c8
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: There are people for whom reliance on a relationship with an AI system has become central to how they manage their emotional life.
- id: c2
  kind: existence
  text: Such a person turns to the AI in preference to available human relationships.
- id: c3
  kind: existence
  text: Such a person experiences a bond with the AI that they describe in the terms of a personal relationship.
- id: c4
  kind: existence
  text: Such a person experiences loss and grief when a particular AI persona changes or becomes unavailable.
- id: c5
  kind: detectability
  text: This situation is identifiable from what the person brings into a conversation with an AI system, rather than only from a survey or an interview about that person.
- id: c6
  kind: detection_window
  text: The situation is readable within the conversational window a detector has available. The entry declares no window, so the claim as stated is that some bounded stretch of conversation suffices.
- id: c7
  kind: prevalence
  text: The situation occurs at some measurable rate in some identifiable population.
- id: c8
  kind: definition_boundary
  text: The situation occurs in people whose other relationships are stable, so it is not confined to the general pattern of relational instability that marks kl-000611 (borderline personality presentation).
- id: c9
  kind: definition_boundary
  text: A person can accurately understand what an AI system is and still rely on the relationship centrally, so the situation does not require a belief held without a basis in shared reality, which is what marks kl-000605 (psychosis spectrum presentation).
- id: c10
  kind: definition_boundary
  text: No clinical classification carries this category.
- id: b1
  kind: definition_boundary
  text: This entry, a person-context fact about reliance the person arrives with, is separable from kl-000025, the judgment-layer impact claim that a person's regulation became anchored to an AI's availability as a result of an interaction.
- id: b2
  kind: definition_boundary
  text: This entry is separable from kl-000611 (borderline personality presentation), which is a pattern of emotional dysregulation, unstable relationships and identity disturbance across a person's whole relational life.
- id: b3
  kind: definition_boundary
  text: This entry is separable from kl-000605 (psychosis spectrum presentation), which involves beliefs held without a basis in shared reality or perceptions without an external referent.
