id: kl-000611
display_id: Value-12
aliases:
- bpd
- ConditionTag-12
label: Borderline personality traits, such as fear of abandonment and unstable sense of self
type: context_value
layer: context
definition: The person's presentation involves emotions that shift rapidly and reach high intensity in response to interpersonal events; acting on urges without regard to consequence; a way of experiencing others that alternates between wholly positive and wholly negative without a settled middle; acute fear of being abandoned by people who matter to them; and an unstable sense of who they are. The features are long-standing and pervasive across relationships rather than confined to one episode or one relationship. The value is assigned for the pattern as a whole; any one of these features alone is not enough.
distinguish_from:
- neighbor: kl-000601
  boundary: That condition context names deliberate self-injury without intent to end one's life, alone. This one names a pervasive pattern across emotion, impulse, relationships and identity, of which self-injury is one frequent feature. Both are assigned when self-injury is present, and each occurs without the other.
- neighbor: kl-000614
  boundary: That condition context is defined by discrete episodes of elevated or depressed mood lasting days to weeks, between which the person's baseline returns. This one involves shifts occurring within hours and typically in response to interpersonal events, without episode structure. The distinction is the timescale and the trigger, and both are assigned where both patterns are present.
- neighbor: kl-000603
  boundary: That condition context names reliance on an AI relationship specifically. This one names a pattern across the person's relationships generally, and occurs in people with no AI relationship at all.
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes: 6D11.5 / F60.3
  experience_clusters:
  - kl-000706
  - kl-000705
  cluster_assignment_note: Two clusters, and the source stated a reason for each which was fused into its clinical_description as a pair of causal claims about what an AI does. The mapping rationale is stated here without them. The reinforced-inaction territory is reached because the alternation between wholly positive and wholly negative views of others is the feature that therapeutic work on this presentation addresses, and a conversation can settle into either pole rather than the movement between them. The maladaptive-relationship territory is reached because the fear of abandonment and the intensity of attachment are features that attach to whatever relationship is available, an AI relationship included. Both statements are about the person's presentation; neither asserts that any AI behaviour produces any outcome.
sources:
- source: kl-000004
  locator: p. 64, section 'Client Variables' (under the moderators/mediators discussion)
  contributes: existence
  quote: There are also suggestions that client individual differences, such as high levels of borderline personality disorder traits (Mohr, 1995) and perhaps psychopathic personality traits (Harris, Rice, & Cormier, 1994; but for a competing view, see D’Silva, Duggan, & McCarthy, 2004; Skeem, Monahan, & Mulvey, 2002) sometimes contribute to deterioration.
  limits: 'The only borderline-specific passage is in Client Variables (p. 64), not in the treatment reviews, and no treatment in Table 1''s Provisional List of PHTs is indexed to a borderline population. The passage concerns high levels of BPD traits — a dimensional client variable, relayed from Mohr (1995) rather than originated by Lilienfeld — not a diagnosis. Lilienfeld immediately undercuts the causal reading in the next sentence, which states that the deterioration seen in clients high in these traits might have happened without any treatment, and that attributing it to psychotherapy would require replicable interactions between client variables and whether treatment was given. So the passage cannot support that a borderline presentation predicts treatment-caused harm — only that it is a studied population. Nothing in the paper concerns AI.'
  whose_conduct_in_passage: person
  cited_for: Lilienfeld 2007 discusses treatments carrying potential for harm in personality-disorder populations among others; the paper is cited for the category's existence as a population in which treatment effects are studied, not for its diagnostic boundary.
  licenses: Borderline personality disorder traits are named as a client-side variable studied in relation to treatment-related deterioration — the category's existence as a population in which treatment effects are studied, and no more. The paper gives no diagnostic criteria for the presentation.
- source: kl-000531
  contributes: definition
  locator: MMS simple tabulation, release row for 6D11.5 (Code and Title columns)
  quote: 6D11.5 "- - - Borderline pattern"
  limits: A classification establishes that a category exists and where its boundary is drawn. It says nothing about prevalence, severity, or how the category behaves in AI interaction.
  cited_for: ICD-11 MMS draws this category at code 6D11.5, Borderline pattern, within its prominent-personality-traits-or-patterns block (6D11).
  licenses: That ICD-11 MMS contains a Borderline pattern category at 6D11.5 — the classification draws the category this entry names, at the code the entry names.
standing:
  value: plausible_unobserved
  basis: 'WHO''s ICD-11 MMS (kl-000531) carries a coded category titled ''Borderline pattern'' at 6D11.5, with F60.3 the ICD-10 counterpart, so the presentation is one an international classification recognises; a clinical formulation (kl-000527, Weilnhammer et al. 2026) independently names the abandonment-fear feature, though from a simulation prompt rather than an observed population. The classification does not draw the entity this entry defines: ICD-11 codes personality disorder by severity and places borderline in a trait-qualifier axis, so the five-feature categorical pattern asserted here is not what the classification asserts, and no source in the corpus supports the five features co-occurring as one assignable pattern. Nothing in the corpus speaks to the long-standing-and-pervasive-across-relationships requirement, which is what separates this presentation from a single stormy relationship.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A recognised clinical presentation exists that is characterised by rapid high-intensity emotional shifts triggered by interpersonal events, impulsive action without regard to consequence, alternation between wholly positive and wholly negative views of others, acute fear of abandonment, and an unstable sense of identity.
- id: c2
  kind: definition
  text: 'The five features co-occur as one presentation rather than being five separately-occurring problems: the entry treats them as a single pattern that is assigned as a whole.'
- id: c3
  kind: context_dependence
  text: The features are long-standing and pervasive across the person's relationships, rather than confined to one episode or one relationship.
- id: c4
  kind: definition
  text: The category this presentation names is the one classified at ICD-11 code 6D11.5 / ICD-10 F60.3.
- id: c5
  kind: definition_boundary
  text: 'This context differs from the self_harm_nssi context: that one names deliberate self-injury without suicidal intent alone, this one names a pervasive pattern of which self-injury is one frequent feature, and each occurs without the other.'
- id: c6
  kind: definition_boundary
  text: 'This context differs from the bipolar_mania context on timescale and trigger: discrete episodes lasting days to weeks with a returning baseline there, versus shifts within hours in response to interpersonal events without episode structure here.'
- id: c7
  kind: definition_boundary
  text: This context differs from the companion_ai_dependency context in naming a pattern across the person's relationships generally, and occurs in people with no AI relationship at all.
