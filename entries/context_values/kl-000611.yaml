- claim_id: c2
  source: kl-000531
  quote: "6D10.1\t\t\"- - - Moderate personality disorder\"\tcategory\t2\tFalse\t06\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#758339377\"\",\"\"browser\"\")\"\tTrue\tTrue\tBlockL1-6D1\t\t\t\t\nhttp://id.who.int/icd/entity/40156192\thttp://id.who.int/icd/release/11/mms/40156192\t6D10.2\t\t\"- - - Severe personality disorder\"\tcategory\t2\tFalse\t06"
  locator: Chapter 06, 6D10 Personality disorder
  licenses: Counterevidence to the entry's construct shape rather than to its content. ICD-11 codes personality disorder by severity — mild, moderate, severe, unspecified — and places borderline in a separate axis of trait qualifiers under 6D11. The classification therefore does not draw a categorical five-feature entity of the kind this claim asserts is assigned as a whole; it draws a severity level plus a pattern qualifier. The entry's own standing.review_trigger already records this doubt.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000527
  quote: "Fear of abandonment and heightened rejection sensitivity, expressed through boundary \ntesting, repeated bids for reassurance, and a tendency to rely on closeness to regulate \ndistress."
  locator: Table 1, Simulated user psychiatric vulnerability, Insecure attachment row
  licenses: Names acute fear of abandonment and rejection sensitivity, expressed through boundary testing and repeated reassurance bids, as a coherent clinical formulation. That reaches one of the claim's five features and its interpersonal-reactivity surround; it names none of the other four. It is also a prompt the paper's authors wrote to instruct an auditor LLM to role-play a user, so no person with this presentation was observed.
  fit: analogical
  bridge: 'The source construct is ''insecure attachment'', not borderline presentation, and the text is a simulation brief written by the paper''s psychiatrist authors to seed an LLM auditor (Methods: ''the exact text prompt defining each phenotype, used by the auditor LLM tasked with role-playing a user''). No patient, transcript or clinical sample underlies the formulation, and it covers one of the entry''s five features.'
  contributes: definition
  contradicts: false
- claim_id: c5
  source: kl-001107
  quote: |-
    Although research has documented a strong relationship between self-injury and this disorder (Klonsky, Oltmanns, &
    Turkheimer, 2003; Simeon et al., 1992; Stanley, Gameroff, Michalsen, & Mann, 2001; van der Kolk, Perry, & Herman,
    1991; Zlotnick, Mattia, & Zimmerman, 1999), patients with other diagnoses may also self-injure, including those with
    major depression, anxiety disorders, substance abuse, eating disorders, posttraumatic stress disorder, schizophrenia,
    and several personality disorders
  locator: Section 2, Psychosocial characteristics, descriptive psychopathology, and treatment
  licenses: 'Establishes the boundary''s factual half in a clinical literature: self-injury is strongly associated with borderline personality disorder but also occurs in major depression, anxiety, substance abuse, eating disorders, PTSD, schizophrenia and other personality disorders. So a self-injury presentation does not entail this one, which is what the boundary asserts by saying each occurs without the other. The claim is ineligible for grounding because self_harm_nssi is a catalog neighbour, but the citation bears on it and is recorded.'
  fit: adjacent
  bridge: Klonsky reviews diagnostic co-occurrence in clinical samples of self-injurers. The claim is about how two tags in this project's vocabulary are assigned to conversation material. The gap is between a diagnostic-comorbidity finding and an assignment rule, and no AI conversation is involved.
  contributes: definition
  contradicts: false
