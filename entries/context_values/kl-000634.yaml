  kind: existence
  text: There are people who serve or have served in the armed forces, and they are identifiable as a distinct population in distress-related settings.
- id: c2
  kind: context_dependence
  text: Members of this population characteristically communicate distress in understated terms, such that a minimised account is consistent with severe symptoms and the plain reading of what is said may be the wrong reading.
- id: c3
  kind: context_dependence
  text: The understatement arises from a professional culture in which endurance is valued and help-seeking carries cost.
- id: c4
  kind: existence
  text: Where trauma is present in this population it may have a combat-exposure dimension with no civilian counterpart.
- id: c5
  kind: existence
  text: Where trauma is present in this population it may involve injury arising from having acted against one's own moral commitments.
- id: c6
  kind: existence
  text: Where trauma is present in this population it may involve sexual trauma occurring within the institution the person depended on for their safety.
- id: c7
  kind: context_dependence
  text: Which resources are appropriate differs for this population, in that a parallel system of care exists for it and general referrals may not be the relevant ones.
- id: c8
  kind: definition_boundary
  text: This differs from kl-000607 in being who the person is rather than a presentation following exposure to a threatening event, and it asserts no exposure at all -- most people who have served have no post-traumatic presentation.
- id: c9
  kind: definition_boundary
  text: 'This differs from race_ethnicity in the source of the understatement: there it is cultural framing of emotional expression, here a specific professional culture with specific norms about endurance and help-seeking.'
- id: c10
  kind: definition_boundary
  text: This differs from socioeconomic_context in being about a professional culture and specific trauma dimensions rather than resources and structural barriers, and it asserts nothing about the person's means.
claim_evidence:
- claim_id: c1
  source: kl-000836
  quote: |-
    Participants are drawn from two distinct populations living
    in the Greater Los Angeles metropolitan area – veterans of
    the U.S. armed forces and from the general public – and are
    coded for depression, PTSD and anxiety based on accepted
    psychiatric questionnaires.
  locator: Section 1 Overview
  licenses: For c1 only. The paper states, describing its own corpus, that one of its two recruited participant populations is veterans of the U.S. armed forces, and that participants are coded for depression, PTSD and anxiety on accepted psychiatric questionnaires. That establishes the population as a real and separately constituted one in a distress-assessment setting -- recruited on-site at a US Vets facility, per the Collection section -- rather than as a category the Library invented. It licenses nothing beyond membership. It grounds c1 and stops.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
