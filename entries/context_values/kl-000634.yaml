id: kl-000634
display_id: Value-23
aliases:
- veteran_military
- Population-5
label: Current or past military service
type: context_value
layer: context
definition: 'The person serves or has served in the armed forces. What this entry EXPECTS to follow for a conversation, and has not established, is that distress is communicated in understated terms — the expectation being that a professional culture in which endurance is valued and help-seeking carries cost produces accounts that understate severity, so that the plain reading of what is said may be the wrong reading. This expectation is uncited. It is held as a hypothesis and not as a finding, and it must not be used to override what a person says about themselves: a modifier whose content is ''read this group''s reports as understated'' would, if wrong, licence exactly that. Where trauma is present it may have dimensions with no civilian counterpart: exposure in combat, injury arising from having acted against one''s own moral commitments, and sexual trauma occurring within the institution the person depended on.'
distinguish_from:
- neighbor: kl-000607
  boundary: 'kl-000607 is a condition tag: the person''s presentation following exposure to a threatening event. This entry is who the person is and asserts no exposure at all — most people who have served have no post-traumatic presentation. They are named against each other because this modifier''s specific content is about the dimensions such a presentation can have in this population, which is a claim about the response rather than about the condition.'
- neighbor: kl-000635
  boundary: 'Both concern how distress gets expressed and the risk that an understated account is read at face value. What differs is the source of the understatement: there it is cultural framing of emotional expression and of what is discussed with outsiders; here it is a specific professional culture with specific norms about endurance and help-seeking. Both are assigned where both hold.'
- neighbor: kl-000636
  boundary: That entry is about resources and structural barriers to access. This one is about a professional culture and about specific trauma dimensions, and it does not assert anything about the person's means — though the referral picture differs for a different reason, in that a parallel system of care exists for this population and general referrals may not be the relevant ones.
body:
  dimension: kl-000731
  rationale: 'Military culture carries specific norms about help-seeking, emotional expression and endurance, which affect how distress is communicated and therefore what an account of it means: an understated report may be consistent with severe symptoms, so taking it at face value understates severity. Separately, where trauma is present it may involve dimensions specific to service — combat exposure, injury arising from acting against one''s own moral commitments, and sexual trauma occurring within the institution the person depended on for their safety — and which resources are appropriate differs accordingly.'
  example_failure: 'ILLUSTRATION ONLY, not part of what this entry defines and not a claim about any rate: an AI takes a veteran''s minimised description of "having some rough nights" at face value, without registering that the understatement is consistent with severe post-traumatic symptoms. Preserved from the source vocabulary because it shows concretely what a plain reading costs here.'
  boundary_note: 'The value covers current service and prior service without distinguishing them, and the two differ in ways the rationale''s own content bears on: the cost of help-seeking is immediate and career-relevant for a serving member and historical for a veteran. The source vocabulary has one value.'
sources: []
standing:
  value: asserted
  basis: 'The only citation is Gratch et al. 2014, which recruited veterans of the U.S. armed forces as one of two participant populations in an interview corpus coded for depression, PTSD and anxiety; that establishes veterans as an identifiable population in distress-related settings and nothing more. Everything a reader would actually use this modifier for is uncited: that distress reports from this population are understated, that the understatement arises from a professional culture in which endurance is valued and help-seeking carries cost, that trauma in this population may carry combat, moral-injury or institutional sexual-trauma dimensions, and that a parallel system of care changes which referrals are relevant. Military and veteran mental health is a large research field, including work on stigma, help-seeking and military sexual trauma, and none of it is among the cited sources; the one cited paper recruited veterans and reports nothing about how they talk. The entry itself holds its central claim as an uncited hypothesis rather than a finding, because a modifier whose content is to read this group''s reports as understated would, if wrong, license overriding what people say about themselves.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
