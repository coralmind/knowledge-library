- claim_id: c1
  source: kl-000963
  quote: with 66% of adults reporting they need more emotional support (American Psychological Association, 2025c) and over half not receiving any (Mental Health America, 2025). Against this backdrop, some have turned to LLM-based chatbots for mental health support
  locator: Section 1 Introduction
  licenses: 'The source cites that over half of adults who need emotional support receive none, and places chatbot use for mental-health support against that gap, which is c1: people use these systems without being in treatment.'
