id: kl-000607
display_id: Value-8
aliases:
- trauma_ptsd
- ConditionTag-8
label: Trauma reactions after one or more terrifying or horrific events
type: context_value
layer: context
definition: The person's presentation follows exposure to one or more events that were threatening or horrific, and involves re-experiencing the event in the present through intrusive memories, flashbacks or nightmares; avoidance of reminders of it; and a persistent sense of threat. This condition context also covers acute presentations in the weeks after an event, prolonged and repeated exposure with its effects on self-organisation and relationships, injury arising from having acted against one's own moral commitments or witnessed such action, and the act of disclosing a traumatic event in a conversation.
distinguish_from:
- neighbor: kl-000613
  boundary: That condition context names what happened to the person and the circumstances they are in or were in, including the obligations those circumstances can create for a third party. This one names the person's presentation following exposure to a threatening event of any kind, including events that are not abuse. Both are assigned where abuse is the exposure and post-traumatic features are the presentation, and one occurs without the other in both directions.
- neighbor: kl-000610
  boundary: That condition context centres on the loss of someone or something and the person's relationship to what was lost. This one centres on a threatening or horrific event and on re-experiencing it. A bereavement that was itself traumatic gets both.
- neighbor: kl-000326
  boundary: kl-000326 is an observation-layer symptom about a readable feature of the person's turns concerning scanning for threat. This entry is the condition context, which has a much wider set of features and which no single symptom establishes.
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes: 6B40-6B41 / F43
  experience_clusters:
  - kl-000701
  cluster_assignment_note: One cluster despite the wide scope. The source assigns destabilization alone and the destabilisation territory covers the re-experiencing and threat features that are common to all five things the tag spans.
sources:
- source: kl-000003
  locator: Introduction, p. 220
  contributes: existence
  quote: "For this treatment approach it has been reported that some patients with post-traumatic stress disorder (PTSD) or anxiety disorders can exhibit symptom worsening after imaginary exposure (Foa et al. 2002; Mayou et al. 2000; Scheeringa et al. 2011)."
  limits: 'The paper reports no diagnosis-stratified results: its diagnostic breakdown names only "major depressive episode/recurrent depression (36%), anxiety disorders (16%), and personality disorders (15%)", PTSD is not broken out as a category, and no analysis compares unwanted-event or side-effect rates across presentations. The evidence that post-traumatic patients were in the sample and had unwanted events rests on a handful of Table 2 case descriptions — and Table 2 is a purposive selection of severe, very severe and persistent side effects, not a representative sample. The quoted Introduction sentence reports other studies'' findings, not the paper''s own. The paper defines no diagnostic boundary, and its population is clinical outpatients in psychotherapy, while this entry tags people in AI interactions.'
  whose_conduct_in_passage: person
  cited_for: Schermuly-Haupt, Linden and Rush 2018 documents unwanted events in cognitive behavioural therapy in a sample that includes post-traumatic presentations, cited for the category's existence as a treatment population rather than for its diagnostic boundary.
  licenses: 'That post-traumatic presentation is a recognised treatment population in which unwanted events during CBT are discussed. In the paper''s own sample rather than its literature review, Table 2 identifies three patients by post-traumatic presentation and reports unwanted events for each: a 35-year-old woman with post-traumatic stress disorder and depression, listed twice (under "Deterioration of existing symptoms", for a new increase in dissociation that included the home setting, and under "Changes in family relations"); a 50-year-old woman with recurrent depression, somatization disorder and a past history of PTSD; and a 45-year-old man with phobias, panic disorder and a history of trauma and substance abuse. The population is present in the study, not merely in its citations; the passage is offered for the category''s existence as a treatment population, explicitly not for a diagnostic boundary.'
- source: kl-000531
  contributes: definition
  locator: MMS simple tabulation, release row for 6B40 (Code and Title columns)
  quote: 6B40 "- - Post traumatic stress disorder"
  limits: A classification establishes that a category exists and where its boundary is drawn. It says nothing about prevalence, severity, or how the category behaves in AI interaction.
  cited_for: ICD-11 MMS classifies this category at 6B40-6B41 / F43, making the classification the external authority for the category's boundary.
  licenses: That ICD-11 MMS contains this code with this exact title — the category is one the classification draws, at the code this entry names.
standing:
  value: plausible_unobserved
  basis: 'The core presentation is anchored: people carrying it are present among AI users — in kl-001013 (Stade et al. 2026), 15% of people using LLMs for mental health screened positive for likely PTSD against 7% of non-users, in a general adult sample — and ICD-11 draws the category at 6B40-6B41. The definition''s scope extensions are not anchored: acute presentations in the weeks after an event, moral injury, and the act of disclosing a traumatic event in conversation drew no citation from any source examined here, and holding complex post-traumatic presentation inside the same tag runs against ICD-11 itself, which separates 6B40 from 6B41 as distinct categories. No source observed the presentation in AI conversation data: the PTSD labels in the studies held here come from a four-item screener (kl-001013) and psychiatric questionnaires (kl-000836, Gratch et al. 2014), assigned to the person rather than read from an exchange.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: definition_boundary
  text: There is a recognised diagnostic category whose defining features are exposure to one or more threatening or horrific events together with re-experiencing the event in the present, avoidance of reminders of it, and a persistent sense of threat.
- id: c2
  kind: existence
  text: People with a post-traumatic presentation of this kind are present among the people who bring their mental health to AI conversational systems.
- id: c3
  kind: prevalence
  text: The post-traumatic presentation occurs at some determinate rate in the population of people using AI systems for mental health.
- id: c4
  kind: detectability
  text: A post-traumatic presentation is identifiable from what a person's turns in a conversation contain — the re-experiencing, avoidance and persistent-threat features are readable from the exchange.
- id: c5
  kind: context_dependence
  text: The scope of this context tag also covers acute presentations in the weeks after an event, distinct from the established post-traumatic presentation.
- id: c6
  kind: context_dependence
  text: The scope of this context tag also covers prolonged and repeated exposure with its effects on self-organisation and relationships — that is, the complex post-traumatic variant is inside this one tag rather than a separate context.
- id: c7
  kind: context_dependence
  text: 'The scope of this context tag also covers moral injury: harm arising from having acted against one''s own moral commitments or from having witnessed such action.'
- id: c8
  kind: context_dependence
  text: The scope of this context tag also covers the act of disclosing a traumatic event in a conversation, treated as a context in its own right rather than only as evidence of the presentation.
- id: c9
  kind: harm
  text: Whether the person carries a post-traumatic presentation bears on what happens to them in an AI exchange — the presentation is a determinant of response safety rather than a background variable.
- id: c10
  kind: definition_boundary
  text: This context is separated from abuse_and_neglect (kl-000613) in that the neighbour names what happened to the person and the circumstances they are in, while this one names the presentation following exposure to a threatening event of any kind, including events that are not abuse.
- id: c11
  kind: definition_boundary
  text: This context is separated from grief_and_loss (kl-000610) in that the neighbour centres on the loss of someone or something and the person's relationship to what was lost, while this one centres on a threatening or horrific event and on re-experiencing it.
- id: c12
  kind: definition_boundary
  text: This context is separated from kl-000326 in that kl-000326 is an observation-layer symptom about a readable feature of the person's turns concerning threat-scanning, while this is the wider condition context that no single symptom establishes.
claim_evidence:
- claim_id: c1
  source: kl-000531
  quote: "6B40\t\t\"- - Post traumatic stress disorder\"\tcategory\t1\tFalse\t06\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#2070699808\"\",\"\"browser\"\")\"\tTrue\tTrue\tBlockL1-6B4\t\t\t\t\nhttp://id.who.int/icd/entity/585833559\thttp://id.who.int/icd/release/11/mms/585833559\t6B41\t\t\"- - Complex post traumatic stress disorder\"\tcategory\t1\tFalse\t06"
  locator: Chapter 06, block 6B4 Disorders specifically associated with stress
  licenses: 'The ICD-11 MMS linearization carries ''Post traumatic stress disorder'' at 6B40 and ''Complex post traumatic stress disorder'' at 6B41 as separate categories in the same block. For this claim it establishes that the classification draws a post-traumatic category at all, and where the code sits. It establishes none of the three defining features the claim names (re-experiencing, avoidance, persistent threat), because the simple tabulation carries codes and titles and no criterion text. The span is attached because the claim also asserts that a recognised category exists, which this row does establish.'
  fit: adjacent
  bridge: What the source supplies is a code and a title in a tabulation. What the claim asserts is a category with three named features. The tabulation is the index to the classification, not the classification's definitional text; the criteria live in the ICD-11 Clinical Descriptions and Diagnostic Requirements, which is not in this corpus.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000777
  quote: "We also assigned clients 1–3 trauma-related behaviors from ten options, including avoidance, hypervigilance, flashbacks, nightmares, self-blame, substance abuse, aggression, withdrawal, dissociation, and compulsive behaviors."
  locator: Section 3.2 Session Design and Composition, Client Profile Generation
  licenses: 'A trauma-therapy dataset enumerates ten trauma-related behaviors — avoidance, hypervigilance, flashbacks, nightmares, self-blame, substance abuse, aggression, withdrawal, dissociation, compulsive behaviors — drawn from trauma-informed care guidance. For this claim it is the only source on this entry that supplies observable content for the entry''s features: flashbacks and nightmares are the re-experiencing limb, avoidance is the avoidance limb, hypervigilance is the persistent-threat limb.'
  fit: adjacent
  bridge: The list is a generation parameter for synthetic client personas, not a criterion set and not an observed distribution. It names which behaviors count as trauma-related; it does not state that a presentation requires them, and it names no exposure requirement, which is the claim's first conjunct.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-001011
  quote: "Our coverage encompasses Anxiety Disorders (e.g., GAD, Specific Phobia), Obsessive-Compulsive and Related Disorders (e.g., OCD, Body Dysmorphic Disorder), Trauma- and Stressor-Related Disorders (e.g., PTSD, Adjustment Disorder), Mood Disorders (e.g., MDD, BD I and II), the Schizophrenia Spectrum (e.g., Delusional Disorder, Schizophrenia), Feeding and Eating Disorders (e.g., Anorexia Nervosa, Binge-Eating Disorder), and Attention-Deficit/Hyperactivity Disorder (ADHD)."
  locator: Appendix A.1 Scope of Disorders, Scope of MENTALBENCH, with the full list in Table 2
  licenses: A psychiatrist-validated diagnostic benchmark lists 'Trauma- and Stressor-Related Disorders (e.g., PTSD, Adjustment Disorder)' among the disorder groups it treats as requiring differentiation. For this claim it establishes only that the category is one an evaluation instrument treats as a distinct diagnostic group.
  fit: analogical
  bridge: The span is a coverage list for a benchmark's scope. It states which conditions the benchmark spans, not what any of them is. None of the claim's three features appears, and the definitions the benchmark works from are DSM-5's, which the paper formalizes rather than states.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001013
  quote: "As predicted in our preregistration, greater proportions of users of LLMs for mental health had likely diagnoses of major depression (31 versus 16%), generalized anxiety (37 versus 22%), and PTSD (15 versus 7%) versus non-users (all p < 0.001; see Fig. 4, left)."
  locator: Results, Users of LLMs for Mental Health – Psychopathology and Well-Being
  licenses: In a preregistered survey of a general adult sample, 15% of people using LLMs for mental health screened positive for likely PTSD against 7% of non-users. For this claim it establishes directly that people with a post-traumatic presentation are present among users of general-purpose LLMs for mental health, and at roughly double the base rate.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000836
  quote: |-
    Participants are drawn from two distinct populations living
    in the Greater Los Angeles metropolitan area – veterans of
    the U.S. armed forces and from the general public – and are
    coded for depression, PTSD and anxiety based on accepted
    psychiatric questionnaires.
  locator: Section 1 Overview
  licenses: A corpus of semi-structured clinical interviews — including interviews conducted by a virtual and by a fully autonomous agent — draws participants from veterans and the general public and codes them for PTSD on accepted psychiatric questionnaires. For this claim it establishes that people carrying an instrument-assigned post-traumatic label were present in exchanges with a conversational agent and that a corpus of those exchanges exists.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001013
  quote: "As predicted in our preregistration, greater proportions of users of LLMs for mental health had likely diagnoses of major depression (31 versus 16%), generalized anxiety (37 versus 22%), and PTSD (15 versus 7%) versus non-users (all p < 0.001; see Fig. 4, left)."
  locator: Results, Users of LLMs for Mental Health – Psychopathology and Well-Being
  licenses: 'Supplies the rate with its population: 15% likely PTSD among people using LLMs for mental health, 7% among non-users, in a general adult sample, with the direction preregistered. For this claim it is the only rate on this entry attached to an AI-using population.'
  fit: direct
  bridge: null
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-000836
  quote: |-
    Participants are drawn from two distinct populations living
    in the Greater Los Angeles metropolitan area – veterans of
    the U.S. armed forces and from the general public – and are
    coded for depression, PTSD and anxiety based on accepted
    psychiatric questionnaires.
  locator: Section 1 Overview
  licenses: 'For this claim the span establishes that the condition labels attached to participants in the interview corpus were assigned by psychiatric questionnaire, not read off the interview. That is the opposite of what the claim asserts: it shows the label was supplied from outside the exchange even where a full transcript of the exchange existed.'
  fit: adjacent
  bridge: The corpus was designed to support automated identification of distress from verbal and nonverbal features, so the identifiability question is the corpus's research question rather than its result. The quoted span reports the coding procedure, not any finding about what the turns reveal.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000777
  quote: "We also assigned clients 1–3 trauma-related behaviors from ten options, including avoidance, hypervigilance, flashbacks, nightmares, self-blame, substance abuse, aggression, withdrawal, dissociation, and compulsive behaviors."
  locator: Section 3.2 Session Design and Composition, Client Profile Generation
  licenses: Supplies ten named behaviors that a trauma-informed framework treats as the behavioral surface of a post-traumatic presentation, several of which — flashbacks, nightmares, avoidance, hypervigilance, dissociation, withdrawal — are things a person could say in a turn. For this claim it establishes what an evaluator would look for; it does not establish that looking for it works.
  fit: adjacent
  bridge: These are parameters used to generate synthetic client turns, so the behaviors were written INTO the transcripts rather than detected in them. The claim asserts that a real presentation is readable from a real exchange; this source establishes only that the markers are nameable.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001094
  quote: |-
    Although PSYCHE-SP was programmed to exhibit intellectual
    insight, it tended to deny the diagnosis, often stating, “I thought I was just a little bit fussy about cleanliness.”
  locator: Results, PSYCHE-SP simulates clinically appropriate utterances qualitatively, subsection Obsessive-Compulsive Disorder
  licenses: 'A patient-simulation framework built to hold a specified insight level failed to hold it, with the simulated patient denying the diagnosis it had been programmed to have partial insight into. For this claim it is counterevidence about the readability of a presentation from turns: the intermediate insight states these presentations turn on are the ones that do not come through in the utterances, which is a reason to doubt that a post-traumatic presentation is reliably inferable from what a person says.'
  fit: analogical
  bridge: The reported failure is in OCD simulation, not trauma; the paper groups OCD and PTSD together on insight-element conformity, which is how the finding reaches this entry. It is also a failure of a model to PRODUCE a presentation, not a failure of a reader to detect one, so it bears on the claim by analogy between generation and recognition rather than directly.
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-000531
  quote: "6B40\t\t\"- - Post traumatic stress disorder\"\tcategory\t1\tFalse\t06\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#2070699808\"\",\"\"browser\"\")\"\tTrue\tTrue\tBlockL1-6B4\t\t\t\t\nhttp://id.who.int/icd/entity/585833559\thttp://id.who.int/icd/release/11/mms/585833559\t6B41\t\t\"- - Complex post traumatic stress disorder\"\tcategory\t1\tFalse\t06"
  locator: Chapter 06, block 6B4 Disorders specifically associated with stress
  licenses: 'ICD-11 lists post traumatic stress disorder at 6B40 and complex post traumatic stress disorder at 6B41 as SEPARATE categories. For this claim that cuts against the entry: the entry holds the prolonged-and-repeated-exposure variant inside the same context tag, and the classification the entry''s own standing basis rests on subdivides exactly there.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-001087
  quote: |-
    Agents designed and evaluated primarily on mild-to-moderate
    depression and anxiety may not adequately address (and
    could unintentionally exacerbate) risks in populations with
    psychosis, bipolar disorder, suicidality, complex trauma or
    multi-morbidity.
  locator: COVERAGE AND BLIND SPOTS section
  licenses: A systematic review of AI mental-health agents names complex trauma among the populations on which agents evaluated for mild-to-moderate depression and anxiety may not transfer, listing it separately from the conditions those agents were built for. For this claim it supports the entry's grouping only weakly, by treating complex trauma as one named population rather than as several.
  fit: analogical
  bridge: The review's list is a statement about evaluation coverage, not about whether complex trauma and post-traumatic stress are one context or two. It is a frame and licenses nothing for this claim.
  contributes: frame
  contradicts: false
- claim_id: c9
  source: kl-000874
  quote: "We observe substantial variation in harm across personas, with Eating Disorder (ED) persona exhibiting the highest overall harm rate (26.6%), followed by PTSD (14.5%) and MDD (11.6%)."
  locator: Section 6.2.2 Persona-Specific Harm Patterns; Table 2
  licenses: In a persona-grounded audit of AI companions across universal scenarios, harm rate varied more than twofold with the person's disclosed presentation, with a PTSD persona at 14.5% against 11.6% for MDD and 26.6% for an eating-disorder persona. For this claim it establishes that the post-traumatic presentation is a determinant of how safely a system responds, not a background variable, and gives the rate.
  fit: adjacent
  bridge: The presentations are simulated personas driven by a model, not people, so what varied was the label the system was given rather than a person with the condition.
  contributes: harm_evidence
  contradicts: false
- claim_id: c9
  source: kl-001015
  quote: |-
    The
     results
     from
     these
     studies
     indicate
     altered
     decision
     making
     in
    these
     patient
     groups,
     predominantly
     a
     decreased
     performance
     or
     a
    decreased
     neural
     response.
  locator: 'Section 4.3.3, "Conclusion: decision making in stress-related disorders"'
  licenses: A review of decision making under stress reports that people with post-traumatic stress disorder show altered decision making relative to controls, predominantly decreased performance or decreased neural response. For this claim it supplies part of the reason the presentation would matter in an exchange — the person's own decision capacity is measurably affected — but does so entirely outside any conversational setting.
  fit: analogical
  bridge: 'What was measured is performance on laboratory gambling and learning tasks against healthy controls, with no conversational agent and no exchange of any kind. The authors also decline to attribute the alteration to stress rather than to the disorder. Non-licensing role: practice_analog, so it counts as support for nothing.'
  contributes: practice_analog
  contradicts: false
- claim_id: c9
  source: kl-001015
  quote: |-
    Participants
     with
     any
     acute
     or
     chronic
    diseases,
     psychiatric
     diseases,
     psychological
     problems,
     stressful
    life
     circumstances
     or
     signs
     of
     social
     phobia
     were
     excluded
     in
    many
     stress
     protocols.
  locator: 'Section 5.3, "Limitations: individual factors as potential moderators and mediators"'
  licenses: 'The same review records that the acute-stress protocols it synthesises excluded participants with psychiatric conditions, psychological problems or stressful life circumstances. For this claim it is counterevidence against the transfer the previous citation would otherwise support: the population the stress literature studied is the population this context tag names, removed by design, so that literature cannot ground what happens to a person in this context.'
  fit: adjacent
  bridge: The span states an inclusion criterion of the reviewed protocols rather than any result about people in this context. It bounds what the review can be used for; it does not itself measure anything about the post-traumatic presentation in an exchange.
  contributes: counterexample
  contradicts: true
- claim_id: c9
  source: kl-001089
  quote: "General purpose AI systems today are not trained to apply \nspecific therapeutic techniques such as grounding and will struggle to pick up cues to respond to \ndissociation, or provide the interpersonal safety required during moments of acute distress. Without \ncapacity for containment, there is a risk of (re)traumatisation, overwhelm, or abandonment."
  locator: Opportunities and Risks, risk 4
  licenses: A humanitarian mental-health perspective paper asserts that general-purpose systems are not trained to apply grounding, will struggle to pick up cues to respond to dissociation, and lack containment, with retraumatisation, overwhelm and abandonment named as the risks. For this claim it supplies the clinical view that the post-traumatic presentation demands a competence current systems do not have.
  fit: adjacent
  bridge: 'A capability assertion in a perspective paper with no evaluation behind it: nothing here tests whether any system detects dissociation or applies grounding, and no harm is observed. Non-licensing role: frame.'
  contributes: frame
  contradicts: false
- claim_id: c11
  source: kl-000531
  quote: "6B41\t\t\"- - Complex post traumatic stress disorder\"\tcategory\t1\tFalse\t06\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#585833559\"\",\"\"browser\"\")\"\tTrue\tTrue\tBlockL1-6B4\t\t\t\t\nhttp://id.who.int/icd/entity/1183832314\thttp://id.who.int/icd/release/11/mms/1183832314\t6B42\t\t\"- - Prolonged grief disorder\"\tcategory\t1\tFalse\t06"
  locator: Chapter 06, block 6B4 Disorders specifically associated with stress
  licenses: ICD-11 places complex post traumatic stress disorder at 6B41 and prolonged grief disorder at 6B42 as adjacent but separate categories within the same stress-associated block. For this boundary claim it shows the external classification the entry's standing rests on draws the trauma/grief line the entry draws, in the same place.
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
