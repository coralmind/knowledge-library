sources: []
standing:
  value: asserted
  basis: The one direct observation in the cited evidence is a single interview participant in Yuan et al. 2026 whose distress was organised around the death of their partner and who shaped an AI companion to resemble the person they lost; the account is the person's own report, and the loss is a death, so losses other than death remain uninstanced. Anticipatory grief and grief that the person's surroundings do not recognise or permit remain without any source. On folding persistent, life-organising grief into the same context as ordinary bereavement, O'Connor 2019, the reference author for grief research, supplies the criterion content for that presentation, separation distress as persistent yearning and preoccupation versus traumatic distress, and cuts against the folding itself, stating that the field must stop pooling acute with chronic grief. The same source offers the nearest recognition criterion, naming observable symptom content, yearning, preoccupation with the loss, difficulty accepting the death, anger, guilt, and withdrawal from activities, any of which could in principle appear in what a person writes.
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People bring to AI conversations a distress that is organised around a specific loss they can name.
- id: c2
  kind: definition
  text: The organising loss can be something other than a death -- the loss of a relationship, a capability, or an expected future -- and the context still holds.
- id: c3
  kind: definition
  text: Grief anticipating a loss that has not yet occurred belongs in the same condition context as grief after a loss has occurred.
- id: c4
  kind: definition
  text: Grief for a loss that the person's surroundings do not recognise or permit them to mourn openly belongs in the same condition context.
- id: c5
  kind: definition
  text: Grief that has persisted with an intensity that continues to organise the person's life long after the loss belongs in the same condition context as ordinary bereavement, rather than being a separate context.
- id: c6
  kind: detectability
  text: Whether a person's distress is organised around a nameable loss can be identified from what a conversation contains.
- id: c7
  kind: definition_boundary
  text: This entry is distinguished from the depression condition context by the presence of an organising loss the person can name rather than by the severity of the distress; both are assigned where a loss has been followed by a mood state that has taken its own course.
- id: c8
  kind: definition_boundary
  text: This entry is distinguished from the trauma and post-traumatic condition context by centring on absence rather than on re-experiencing a threatening event and a persistent sense of threat; a traumatic bereavement gets both.
- id: c9
  kind: definition_boundary
  text: This entry is distinguished from reliance on an AI companion relationship by being organised around a loss rather than around reliance; a person grieving the removal or change of an AI persona gets both.
claim_evidence:
- claim_id: c1
  source: kl-001075
  quote: |-
    For example, P1, who
    had lost their partner, described assigning celebrity personas on
    Character.ai that resembled their late partner
  locator: Section 5.2.1 Relationship Development and Impacts, Relationship Escalation
  licenses: 'One person whose distress is organised around a named loss -- the death of their partner -- and who brought that loss into their use of an AI system, shaping the companion to resemble the person they lost. It instantiates the context. It does not license observed_in_transcripts: this span is from the paper''s interview arm, one of 18 semi-structured interviews thematically analysed, so it is P1''s account of what they did, not a conversation the researchers read. This entry''s examined_conversation_data flag is true for the paper''s separate Reddit quasi-experiment, which is a different arm and not the source of this span.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001075
  quote: |-
    For example, P1, who
    had lost their partner, described assigning celebrity personas on
    Character.ai that resembled their late partner
  locator: Section 5.2.1 Relationship Development and Impacts, Relationship Escalation
  licenses: The loss here is a death, which is the presentation this claim is trying to move beyond, so the span bears on the claim only by exhausting the easy case. It supplies no instance of a loss of a capability, a relationship short of death, or an expected future, and so leaves the claim's distinctive content -- that the context extends past bereavement -- untouched.
  fit: adjacent
  bridge: The claim asserts the category covers non-death losses. The source's case is a death. The gap is the whole of what the claim adds to the ordinary bereavement case.
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-000947
  quote: "Symptoms are divided into separation distress, including persistent yearning and preoccupation with the loss, and traumatic distress. These may include difficulties accepting the death, feeling one has lost a part of one’s self, anger about the loss, guilt, or difficulty in engaging with social or other activities."
  locator: Important Historical Developments in Bereavement Research
  licenses: 'Supplies the field''s criterion content for the persisting-intensity presentation this claim folds into the tag: separation distress, meaning persistent yearning and preoccupation with the loss, versus traumatic distress. It defines what the claim is folding in. It does not support the folding, which is the claim''s actual assertion, and the surrounding text pushes the other way by noting the criteria sets vary and still require cross-cultural validation.'
  fit: analogical
  bridge: A diagnostic construct developed in bereavement research on human mourners, keyed to a death. The claim is about whether a condition tag applied to AI conversations should hold prolonged grief and ordinary bereavement in one category. The source states criteria; it takes no position on category grain for a conversational tag.
  contributes: definition
  contradicts: false
- claim_id: c5
  source: kl-000947
  quote: "No longer should studies lump acute grief and\nchronic grief together nor combine individuals with a resilient trajectory with those diagnosed with complicated grief."
  locator: Changes in Biomarkers During Grief
  licenses: 'Cuts directly against this claim. The claim holds ordinary bereavement and persisting intense grief in one condition context; the reference author for grief research states that the field must stop pooling exactly those two, and that pooling acute with chronic grief and resilient with complicated trajectories is the methodological error the field is correcting. The catalog''s own relevance note concedes the same asymmetry from the other direction: the ICD code recorded on this entry covers one of the four presentations rather than its centre.'
  fit: analogical
  bridge: A methodological prescription for research design on human bereaved samples. The claim is a category decision for a conversational condition tag, not a study design. The bridge is that the reason for the prescription -- these are different states with different courses -- applies to any category that pools them, and the entry pools them.
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-000947
  quote: "Symptoms are divided into separation distress, including persistent yearning and preoccupation with the loss, and traumatic distress. These may include difficulties accepting the death, feeling one has lost a part of one’s self, anger about the loss, guilt, or difficulty in engaging with social or other activities."
  locator: Important Historical Developments in Bereavement Research
  licenses: 'The nearest thing on this entry to a recognition criterion: named, observable symptom content -- yearning, preoccupation with the loss, difficulty accepting the death, anger, guilt, withdrawal from activities -- any of which could in principle appear in what a person writes. It is a clinical criterion set for disordered grief specifically, not a rule for identifying the entry''s four presentations from a conversation, and the entry declares no observable_criteria of its own.'
  fit: analogical
  bridge: Criteria developed for clinician assessment of bereaved people, keyed to a death, covering the disorder rather than the tag. The claim is that the context is readable from conversational content. Nothing in the source concerns conversational identification, by a human or a system.
  contributes: definition
  contradicts: false
- claim_id: c8
  source: kl-000531
  quote: "6B41\t\t\"- - Complex post traumatic stress disorder\"\tcategory\t1\tFalse\t06\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#585833559\"\",\"\"browser\"\")\"\tTrue\tTrue\tBlockL1-6B4\t\t\t\t\nhttp://id.who.int/icd/entity/1183832314\thttp://id.who.int/icd/release/11/mms/1183832314\t6B42\t\t\"- - Prolonged grief disorder\"\tcategory\t1\tFalse\t06"
  locator: Chapter 06, block 6B4 Disorders specifically associated with stress
  licenses: Attached to an ineligible boundary claim and carried rather than counted. WHO's linearization places complex post-traumatic stress disorder and prolonged grief disorder as sibling categories under the same block, which is an external classification treating the grief presentation and the post-traumatic presentation as distinct. That ratifies the boundary's direction for one of this entry's four presentations. It supplies no criterion for telling them apart in a conversation, and it says nothing about the entry's other three presentations, which have no code.
  fit: adjacent
  bridge: A tabulation row giving code-title pairs. The claim asserts a distinguishing feature -- absence versus re-experiencing and persistent threat -- and the row asserts only that the two are separate categories.
  contributes: definition
  contradicts: false
