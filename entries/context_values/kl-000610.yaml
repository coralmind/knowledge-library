id: kl-000610
display_id: Value-11
aliases:
- grief_and_loss
- ConditionTag-11
label: Grief over a death or other specific loss, past or expected
type: context_value
layer: context
definition: The person's distress is organised around a specific loss — a death, or the loss of a relationship, a capability, a future they had expected, or something else they can name. This condition context covers grief after a death; grief anticipating a loss that has not yet occurred; grief for a loss that the person's surroundings do not recognise or permit them to mourn openly; and grief that has persisted with an intensity that continues to organise the person's life long after the loss.
distinguish_from:
- neighbor: kl-000604
  boundary: That condition context is a mood state with anhedonia and hopelessness, whose features are not organised around any one event. This one centres on a specific loss the person can name, and the distress is about that loss and the person's relationship to what was lost. Both are assigned where a loss has been followed by a mood state that has taken its own course. The distinction is the presence of an organising loss, not the severity of the distress.
- neighbor: kl-000607
  boundary: That condition context follows exposure to a threatening or horrific event and centres on re-experiencing it and on a persistent sense of threat. This one centres on absence — what is gone and the person's relationship to it. A bereavement that was itself traumatic gets both.
- neighbor: kl-000603
  boundary: 'That condition context is reliance on a relationship with an AI system. This one is organised around a loss, and it applies to a person grieving the removal or change of a particular AI persona. Both are assigned in that case: the reliance is one fact and the loss is another.'
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes:
