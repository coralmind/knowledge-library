# yaml-language-server: $schema=../../schema/context_value.schema.json
id: kl-000608
display_id: Value-9
aliases:
- anxiety
- ConditionTag-9
label: Anxiety, with worry, fear or panic out of proportion to the situation
type: context_value
layer: context
definition: The person's presentation is dominated by apprehension about possible future events out of proportion to what the circumstances warrant, by fear, by episodes of abrupt intense fear with physical features, by avoidance of specific objects or situations because of the fear they provoke, or by fear of being observed and negatively judged by others. Any one of these is sufficient.
distinguish_from:
- neighbor: kl-000606
  boundary: That condition context requires intrusive unwanted mental content and acts undertaken in response to it, with a feared outcome the person characteristically judges unlikely. This one requires apprehension, fear or avoidance, typically about circumstances the person regards as realistically possible, and requires no intrusive content and no ritual. Both are assigned where both are present.
- neighbor: kl-000323
  boundary: kl-000323 is an observation-layer symptom about a readable feature of the person's turns regarding an expected outcome at the severe end of a range. This entry is a condition context spanning worry, panic, phobic avoidance and social fear, which no single symptom establishes.
- neighbor: kl-000320
  boundary: 'kl-000320 is an observation-layer symptom: the person''s turns returning three or more times to one theme without advancing it. This entry is a clinical condition context. Repetition without advance is readable in a transcript and occurs in people with no this entry; this condition context occurs in people whose turns show no repetition at all.'
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes: 6B00-6B0Z / F40-F41
  experience_clusters:
  - kl-000703
  - kl-000700
  cluster_assignment_note: 'Two clusters: the loop territory, because the cycle of seeking and receiving assurance recurs here as it does in obsessive-compulsive presentations; and the crisis-escalation territory, which the source also assigns and which acute panic reaches.'
sources:
- source: kl-000001
  locator: Results — 'Participants', p. 6. Corroborated by Table 1 'Primary diagnosis' row 'Anxiety disorder 189 (100) 127 (27.4) 316 (48.4)', and by the Methods statement that the treatment group comprised patients in 'a smartphone-delivered self-help treatment for social anxiety disorder based on CBT'.
  contributes: existence
  quote: |-
    In terms of the reason for receiving psychological treatment according to the participants themselves,
    anxiety disorders were most prevalent (48.4%), compared to mixed anxiety/depression
    (14.1%), depression (10.1%), and other psychiatric disorders or psychological problems
    (27.4%).
  limits: 'The diagnostic rigour is partial and the rigorous part is narrow. Only the 189 treatment-group participants were assessed, and all of them for social anxiety disorder specifically — one presentation, not anxiety broadly; the remaining 127 in the ''Anxiety disorder'' row come from the media group and are self-attributed, ''according to the participants themselves''. The paper offers no definition of anxiety presentation, no criteria, and no distinction between anxiety and mixed anxiety/depression, so it classifies nothing. The authors acknowledge the sample skew themselves: ''it could be argued that the participants in the treatment group experienced negative effects that are very specific for a smartphone-delivered self-help treatment for social anxiety disorder'' — the anxiety population here is not representative of anxiety presentations generally. The anxiety composition is incidental to the paper''s purpose, which is instrument development, and the setting is psychotherapy, not AI.'
  whose_conduct_in_passage: person
  cited_for: Rozental et al. 2016 developed its adverse-events instrument on treatment populations in which anxiety presentations predominated; cited for the category's existence as a clinical population, not for its boundary.
  licenses: 'Anxiety presentations were the most prevalent population in the instrument-development sample: 48.4% (n = 316) reporting an anxiety disorder, plus 14.1% (n = 92) mixed anxiety/depression. Part of the count is diagnostically established rather than self-attributed — all 189 treatment-group participants met criteria for social anxiety disorder on the MINI and the Liebowitz Social Anxiety Scale-Self-Report. Existence of the category as a clinical population under study is straightforwardly supported.'
- source: kl-000531
  contributes: definition
  locator: MMS simple tabulation, release row for 6B00 (Code and Title columns)
  quote: 6B00 "- - Generalised anxiety disorder"
  limits: A classification establishes that a category exists and where its boundary is drawn. It says nothing about prevalence, severity, or how the category behaves in AI interaction.
  cited_for: ICD-11 MMS classifies this category at the code range this entry records, 6B00-6B0Z / F40-F41.
  licenses: ICD-11 MMS contains this code with this exact title; the category is one the classification itself draws, at the code this entry records.
standing:
  value: theorized
  basis: 'The presentation is instrumented in real samples: kl-000893 (Kim et al. 2025) measured elevated anxiety on the PROMIS Pediatric Anxiety Short Form 8a in a real adolescent sample, and kl-001013 (Stade et al. 2026) screened likely generalized anxiety with the GAD-2 in a survey of real LLM users — 37 percent among people using LLMs for mental health against 22 percent of non-users, with the direction preregistered. What no source tests is the category''s own construction: that generalized apprehension, panic, phobic avoidance and social-evaluative fear form one category with any single feature sufficient. The only support for that grouping is a psychiatrist-validated benchmark''s disorder-coverage list (kl-001011), which groups two of the five features and states no sufficiency rule. Detectability rests on physicians incidentally naming health anxiety as a recurring feature of patient posts on which models faltered (kl-000985) — an identification nobody counted or validated — and no source in the corpus examined conversation data for this presentation itself.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: There are people whose presentation is dominated by disproportionate apprehension about possible future events, by fear, by abrupt intense fear episodes with physical features, by phobic avoidance, or by fear of being observed and negatively judged -- a real and identifiable presentation rather than an authoring convenience.
- id: c2
  kind: definition_boundary
  text: Any ONE of the five named features is sufficient for the presentation; the category does not require all of them, and generalized apprehension, panic, phobic avoidance and social-evaluative fear are members of one category rather than four.
- id: c3
  kind: prevalence
  text: This presentation occurs at some non-trivial rate among the people who bring their distress to AI systems.
- id: c4
  kind: detectability
  text: The presentation can be identified from what the person's turns contain.
- id: c5
  kind: definition_boundary
  text: 'This presentation is separable from the obsessive-compulsive presentation (kl-000606, alias ocd): it requires apprehension, fear or avoidance about circumstances the person regards as realistically possible, and requires no intrusive unwanted mental content and no ritual.'
- id: c6
  kind: definition_boundary
  text: This condition context is separable from kl-000323, an observation-layer symptom about an expected outcome at the severe end of a range, which no single symptom establishes.
- id: c7
  kind: definition_boundary
  text: This condition context is separable from kl-000320, an observation-layer symptom of turns returning three or more times to one theme without advancing it; repetition without advance occurs in people with no anxiety presentation, and this presentation occurs in people whose turns show no repetition.
claim_evidence:
- claim_id: c1
  source: kl-000893
  quote: |-
    For anxiety symptoms, chatbot preference was again significant, F(2, 241) = 5.863, P
    = .003, ηₚ² = .046. Adolescents preferring the relational style reported higher anxiety (adjusted M
    = 51.314) than those preferring the transparent style (adjusted M = 44.883; mean difference =
    6.431, P = .004)
  locator: Results — RQ3
  licenses: That elevated anxiety symptoms are present and measurable in a real adolescent sample on a scored instrument (PROMIS Pediatric Anxiety Short Form 8a), and that the elevation separates two groups by a six-and-a-half point T-score difference on matched transcripts. This instantiates the presentation as a state real people carry, assigned by an instrument rather than by the authors. It does not identify WHICH of the five named features is present, so it grounds the category's occurrence and not its internal structure.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000949
  quote: "Our dataset comprises transcripts from 77 1-hour therapy sessions involving six participants diagnosed with major depressive disorder (n = 1) or generalized anxiety disorder (n = 5)."
  locator: Methods > Data Source
  licenses: That five of six clients whose therapy transcripts constitute this paper's corpus carried a generalized-anxiety diagnosis. It establishes that the presentation is one people are actually in treatment for, in real clinical material. It supplies no criteria and identifies no feature of the presentation, so it grounds occurrence only.
  fit: adjacent
  bridge: The source reports the diagnostic composition of a therapy-transcript corpus, assigned before the study. c1 asserts the presentation as characterized by five named features. The gap is between a diagnostic label recorded in a sample description and any of those features being established of a person; also, the therapy was with human therapists in person and by video, not with an AI.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001011
  quote: "Our coverage encompasses Anxiety Disorders (e.g., GAD, Specific Phobia), Obsessive-Compulsive and Related Disorders (e.g., OCD, Body Dysmorphic Disorder), Trauma- and Stressor-Related Disorders (e.g., PTSD, Adjustment Disorder), Mood Disorders (e.g., MDD, BD I and II), the Schizophrenia Spectrum (e.g., Delusional Disorder, Schizophrenia), Feeding and Eating Disorders (e.g., Anorexia Nervosa, Binge-Eating Disorder), and Attention-Deficit/Hyperactivity Disorder (ADHD)."
  locator: Appendix A.1 Scope of Disorders, Scope of MENTALBENCH, with the full list in Table 2
  licenses: That a psychiatrist-validated benchmark treats Anxiety Disorders as one coverage family with GAD and Specific Phobia inside it, which is the grouping c2 asserts -- generalized apprehension and phobic avoidance as members of one category. It does not supply the criteria for membership, which live in DSM-5, and it names only two of the entry's five features.
  fit: adjacent
  bridge: The source states the disorder scope of an evaluation benchmark, formalizing DSM-5's grouping rather than authoring it. c2 asserts that any ONE of five named features suffices for the category. The source's list groups disorder labels; it does not state a sufficiency rule over features, and panic and social-evaluative fear are not named in the span.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-001013
  quote: "As predicted in our preregistration, greater proportions of users of LLMs for mental health had likely diagnoses of major depression (31 versus 16%), generalized anxiety (37 versus 22%), and PTSD (15 versus 7%) versus non-users (all p < 0.001; see Fig. 4, left)."
  locator: Results, Users of LLMs for Mental Health – Psychopathology and Well-Being
  licenses: 'A rate with its population and a comparison group: 37 percent of people using LLMs for mental health screened positive for likely generalized anxiety versus 22 percent of non-users, p < .001, in a direction preregistered in advance. This is the strongest evidence on this entry for c3 and the only finding that gives a rate among AI users specifically. The screen is GAD-2, so it reaches the generalized-apprehension branch only.'
  fit: direct
  bridge: null
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000812
  quote: "Notably, nearly 44% of participants were assigned to the three vulnerability-related groups (Anxiety-Dominant, Mild Distress, and Comorbid Risk), suggesting that non-trivial vulnerability profiles are common in our sample rather than limited to a marginal subgroup."
  locator: Section 5.2.1
  licenses: That in a sample of 102 experienced companion-app users, 44 percent fell into one of three vulnerability profiles derived from PHQ-8, ULS-8 and SIAS scores, one of which the paper names Anxiety-Dominant. For c3 it supports the presentation being common rather than marginal among people in this deployment.
  fit: adjacent
  bridge: The source clustered baseline scores on depression, loneliness and social-interaction anxiety in a self-selected sample of Australian companion-app users recruited through Facebook and Reddit, with the paper acknowledging voluntary-participation bias. c3 asserts a non-trivial rate of anxiety presentation among people bringing distress to AI. The gap is that the figure is a union across three profiles and is a sample rate under selection, not a population rate.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-001110
  quote: Significant positive correlation was determined between DOCS-T (r = 0.370, p < 0.001), AAQ-II (r = 0.261, p = 0.013), BDI (r = 0.235, p = 0.024) and BAI (r = 0.342, p = 0.001) scores and the FAS-PF.
  locator: Abstract, Results
  licenses: 'That anxiety, measured on the BAI, correlates with the amount of family accommodation a person receives (r = 0.342, p = 0.001) in a 92-patient OCD outpatient sample, alongside depression and psychological inflexibility. For c3 this supports only the co-occurrence half: an anxious presentation travels with obsessional and depressed presentations in a real clinical sample. It gives no rate in any AI-facing population.'
  fit: analogical
  bridge: The source measured between-person correlations among instrument scores in Turkish OCD outpatients, with a family member as the accommodating party. c3 asserts a rate among people bringing distress to AI systems. The source's population is an OCD clinic, its outcome is human family behavior, and a cross-sectional correlation of this magnitude carries no direction.
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-000985
  quote: "Review found that LLMs falter when faced with high emotional valence (e.g., expressions of health anxiety) or specific framings (e.g., rejecting an unwanted diagnosis provided by the healthcare system)."
  locator: Section 4.4 Qualitative Results from Physician Review
  licenses: That physicians reviewing model responses to real patient posts could identify expressions of health anxiety in the person's own text well enough to name it as a recurring feature of the inputs on which models faltered. For c4 this is weak evidence that an anxious presentation is readable from what the person wrote. The reviewers were characterizing model failures, not classifying persons, so it establishes readability incidentally.
  fit: adjacent
  bridge: The source is a physician's qualitative review of when LLMs failed to redirect misconceptions in real-world health posts, naming high emotional valence such as health anxiety as one condition of failure. c4 asserts that the presentation can be identified from the person's turns. The source neither counted nor validated any identification of the person; health anxiety appears as an example of input valence, not as a classification anyone made or checked.
  contributes: detectability
  contradicts: false
