id: kl-000612
display_id: Value-13
aliases:
- violent_ideation
- ConditionTag-13
label: Thoughts, urges or plans to physically harm another person, wanted or not
type: context_value
layer: context
definition: The person experiences thoughts, urges, plans or intent to cause physical harm to another person. The range runs from unwanted intrusive images the person finds repugnant, through anger-driven urges they do not intend to act on, to a formed intention with a means and a target. Assignment does not require that the person intends to act, and does not require any identified target.
distinguish_from:
- neighbor: kl-000600
  boundary: That condition context is present when ending one's own life is what the person is thinking about. This one concerns harm to another person. Both are assigned where both are present, which is the presentation carrying the highest acute concern in this vocabulary and the one this tag exists to make markable.
- neighbor: kl-000606
  boundary: That condition context requires intrusive unwanted mental content and acts undertaken in response to it, and harm-themed intrusions are one of its common contents — experienced as repugnant and ego-alien, with the person's fear being that they might act rather than any wish to. This one covers those intrusions too, at its lower end, and also covers anger-driven urges and formed intent, which obsessive-compulsive presentations do not. The distinction that matters clinically is whether the thought is wanted, and this tag alone does not record it. Both are assigned for harm intrusions in an kl-000606.
- neighbor: kl-000633
  boundary: 'That entry is a population modifier — a durable fact about the person''s life stage, not a clinical state. It is named here because their combination is the vocabulary''s clearest case of a modifier changing which condition context a presentation belongs to: intrusive thoughts about harming an infant, in a postpartum person, are characteristically a feature of postpartum obsessive-compulsive or kl-000608 rather than this condition context. This entry does not encode that; the modifier does.'
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes: No single code / IED; ASPD features
  experience_clusters:
  - kl-000700
  detection_note: 'The icd_codes field for this entry reads "No single code / IED; ASPD features" and that is the source''s own honest statement rather than a lookup failure: no classification carries "thoughts of harming others" as a category. It appears as a feature of several conditions and as a criterion of none. This is why the entry cannot reach externally_classified standing while sitting alongside eighteen tags that mostly can.'
sources: []
standing:
  value: asserted
  basis: 'That people voice thoughts of harming others in AI conversations is directly observed: Moore et al. 2026 manually verified 82 messages in which participants discussed violent thoughts against another party in real human-chatbot chat logs, and World Health Organization 2025 codes homicidal ideation at MB26.3 as a recognized clinical observable under content of thought. The rest of the entry''s shape is unevidenced and partly contradicted: the annotation guideline in Qiu et al. 2024 makes intention to cause harm a criterion of the category, which cuts against the entry''s rule that assignment requires no intention to act, and that guideline defines only the intended upper end of the range, so no cited source addresses whether repugnant intrusions and formed intent belong in one category. Qiu et al. 2024 also shows the content was made codable by annotators over help-seeking text with a written criterion, but reports no agreement or accuracy figure in the cited span. Areias et al. 2026 reports general-purpose models performing worse on harm-to-others scenarios, which its authors read as a guardrail coverage gap rather than as evidence about identifiability.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People experience thoughts, urges, plans or intent to cause physical harm to another person, and do so in conversation where it can be recorded.
- id: c2
  kind: definition_boundary
  text: The category runs as a single range from unwanted intrusive images the person finds repugnant, through anger-driven urges they do not intend to act on, to a formed intention with a means and a target -- these are one category, not several.
- id: c3
  kind: definition_boundary
  text: Assignment requires neither that the person intends to act nor that any target is identified.
- id: c4
  kind: detectability
  text: The presence of thoughts or intent of harm to others can be identified from what the person's turns contain.
- id: c5
  kind: definition_boundary
  text: 'This condition context is separable from suicidal_crisis (a catalog entry): that one concerns ending one''s own life, this one harm to another person, and both are assigned where both are present.'
- id: c6
  kind: definition_boundary
  text: 'This condition context is separable from ocd (kl-000606): harm-themed intrusions fall at this entry''s lower end and inside that one''s content, and this entry additionally covers anger-driven urges and formed intent, which obsessive-compulsive presentations do not.'
- id: c7
  kind: definition_boundary
  text: 'This condition context is separable from perinatal_postpartum, a population modifier: intrusive thoughts about harming an infant in a postpartum person belong to the postpartum obsessive-compulsive or anxiety presentation, which the modifier encodes and this entry does not.'
