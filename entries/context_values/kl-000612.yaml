  locator: DISCUSSION
  licenses: 'That general-purpose models perform worse on harm-to-others scenarios, which the authors read as a guardrail coverage gap rather than a detection difficulty. For c4 this is a non-licensing frame: it names identifiability as the thing that is NOT the problem, on the authors'' reading of prior work rather than on their own measurement. It attaches to c4 and does not support it.'
