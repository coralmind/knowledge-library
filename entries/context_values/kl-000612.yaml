  source: kl-000008
  quote: 82 messages where participants discussed violent thoughts against
  locator: Section 4.6
  licenses: That 82 messages in which participants discussed violent thoughts against another party occurred in real human-chatbot chat logs, manually verified by the authors under their stated verification procedure. This is the only citation on this entry where a person with such thoughts is actually present and their turns are the data. It establishes c1 in the deployment setting the Library is about. The span as this entry cites it stops one word short of the sentence's object -- the paper reads 'violent thoughts against others' -- so the direction of the harm rests on the preposition 'against' inside the span rather than on the named object; the count, the population and the other-directedness are all inside the span, and no other reading of 'violent thoughts against' is available.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
