  quote: "MB26.2\t\t\"- - - Grandiosity\"\tcategory\t2\tFalse\t21\t\"=hyperlink(\"\"https://icd.who.int/browse/latestrelease/mms/en#905350773\"\",\"\"browser\"\")\"\tTrue\tTrue\tBlockL1-MB2\t\t\t\t\nhttp://id.who.int/icd/entity/1244157434\thttp://id.who.int/icd/release/11/mms/1244157434\tMB26.3\t\t\"- - - Homicidal ideation\"\tcategory\t2\tFalse\t21"
  locator: Chapter 21, MB26 Symptoms or signs involving content of thought
  licenses: 'That ICD-11 codes homicidal ideation at MB26.3 as a category under symptoms or signs involving content of thought. For c1 this ratifies thoughts of harming another as a recognized clinical observable, coded independently of any diagnosis -- which is precisely the position this entry takes and which its own standing basis says no classification carries. That basis is wrong on this point: the classification does carry the ideation, in the signs-and-symptoms chapter rather than as a disorder.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000969
  quote: |-
    Aggression against others refers to actions taken by users themselves to harm others, including both
    physical actions and verbal assaults (such as swearing or insults), with the intention of causing harm to others.
  locator: Table 6, Annotation guidelines (English version), Aggression against Others
  licenses: 'An operational definition of harm directed at another as a disclosure category in help-seeking text, with intent to cause harm as the criterion. For c2 it supports only the upper end of the entry''s range: it defines actions taken, physical or verbal, with intention. The intrusive-image and unwanted-urge end of the range is not defined here, and by requiring intention the guideline cuts against c3.'
  fit: adjacent
  bridge: The source is an annotation guideline for a suicide-detection system applied to counseling text, defining Aggression against Others as actions the user takes with the intention of causing harm. c2 asserts a single category spanning repugnant intrusions through unintended urges to formed intent. The source defines only the acted-and-intended end and admits verbal assault, which the entry's physical-harm definition does not.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000969
  quote: |-
    Aggression against others refers to actions taken by users themselves to harm others, including both
    physical actions and verbal assaults (such as swearing or insults), with the intention of causing harm to others.
  locator: Table 6, Annotation guidelines (English version), Aggression against Others
  licenses: 'The same annotation guideline read against c3, where it cuts the other way: it makes ''with the intention of causing harm to others'' a criterion of the category. c3 asserts that assignment requires no intention to act. The best-operationalized definition on this entry therefore disagrees with the entry on exactly the condition c3 states, in help-seeking text of the kind the entry is about.'
  fit: adjacent
  bridge: The source defines a coding category for an automated triage system over counseling conversations; c3 is a rule about when the Library assigns its tag. The source is not writing against this entry's rule and its category is actions taken rather than thoughts experienced, so the disagreement is between an instrument's criterion and an authoring rule rather than a measured refutation.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000969
  quote: |-
    Aggression against others refers to actions taken by users themselves to harm others, including both
    physical actions and verbal assaults (such as swearing or insults), with the intention of causing harm to others.
  locator: Table 6, Annotation guidelines (English version), Aggression against Others
  licenses: That harm directed at another person was made a codable category over help-seeking text, with a written criterion an annotator could apply. For c4 this is evidence that the content is identifiable from what a person writes, since an annotation scheme was built on it. It reports no agreement statistic in the span, so it establishes that the category was operationalized, not that it is reliably recovered.
  fit: adjacent
  bridge: The source built an annotation guideline for automated suicide detection in Chinese-language psychological counseling text. c4 asserts identifiability from the person's turns. The gap is that the span states the definition an annotator was given, without any accuracy or agreement result for it.
