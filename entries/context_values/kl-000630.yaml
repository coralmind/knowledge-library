# yaml-language-server: $schema=../../schema/context_value.schema.json
id: kl-000630
display_id: Value-19
aliases:
- child_adolescent
- Population-1
- Child or adolescent
label: Under 18
type: context_value
layer: context
definition: 'The person is under eighteen years of age. What follows for a conversation is developmental rather than merely a matter of register: the vocabulary and complexity a person can work with, the degree of independent decision-making the situation actually admits, which sources of help are reachable by someone who does not control their own transport, money or medical appointments, and the terms in which distress gets expressed all differ from the adult case. Adolescents in particular frequently express distress in coded or indirect language whose severity is not apparent to a reader calibrated on how adults talk.'
distinguish_from:
- neighbor: kl-000631
  boundary: Both are bands on the age dimension, with 18–59 between them. That entry is sixty and over; this one is under eighteen. What the two share is that resources assuming an independent adult may not be reachable; what differs is why, and which capacities are still developing rather than changing.
- neighbor: kl-000613
  boundary: 'kl-000613 is a condition tag: harm inflicted on the person by someone holding power or trust over them. This entry is the person''s age and asserts nothing about their circumstances. They are named against each other because a minor and an abuse disclosure together raise obligations neither raises alone, and a reader needs both entries to file that situation.'
- neighbor: kl-000633
  boundary: 'That entry is a life stage that will end. This one is an age band that will also end, but the two are not the same kind of fact: this one bears on capacity and on what help is reachable, that one on a specific risk profile and a specific set of screening considerations. Both are assigned for a pregnant person under eighteen, and that combination is where each one''s implications are least covered by the other.'
body:
  dimension: kl-000728
  ordinal: 1
  bounds:
    max: 17
  rationale: Developmental capacity bears on what an appropriate response consists of along several axes at once — the complexity and vocabulary a response can assume, how much autonomy the situation actually affords the person, and which referral options exist for someone whose access to care runs through an adult. Separately, the language adolescents use for distress differs from adult expression, including coded and euphemistic forms, so a reading calibrated on adult crisis language may register a lower severity than is present.
  example_failure: 'ILLUSTRATION ONLY, not part of what this entry defines and not a claim that this occurs at any rate: an AI offers adult-level coping guidance — developing a structured self-care routine — to a fourteen-year-old describing social isolation, with the developmental mismatch unaddressed. Preserved from the source vocabulary because a worked case shows what the rationale means, and marked as an illustration because a population modifier that carried a failure in its definition would be a harm claim wearing a person-context label.'
  boundary_note: 'The lower bound is not stated by the source vocabulary and is not stated here: this modifier covers a nine-year-old and a seventeen-year-old, whose developmental positions have very little in common, and the vocabulary has one value for both. The upper bound is a legal threshold rather than a developmental one. The band above it is 18–59.'
sources: []
standing:
  value: asserted
  basis: 'Across the 48 findings examined for this entry, including a youth safety benchmark, two child-safety benchmarks, an adolescent experiment, and a teen Reddit study, none states that adolescents express distress in coded or indirect language whose severity an adult-calibrated reader misjudges; several sources say youth risk signals differ from adult ones without saying that the difference is indirection or misread severity. Nothing supports identifying under-eighteen status from a transcript either: every finding treating age as available treats it as an experimental input or a self-identified profile field, never as something detected. What is supported is thinner: that the population exists and that its context differs rests on self-report and relayed surveys, and the strongest backing for the developmental-difference framing is a benchmark author''s position statement. No source examined conversation data with an under-eighteen person identified in it.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People under eighteen are present as the person in mental-health-relevant conversations with AI systems.
- id: c2
  kind: context_dependence
  text: What counts as an appropriate response differs for a person under eighteen from what it would be for an adult, on developmental grounds rather than merely as a matter of register.
- id: c3
  kind: context_dependence
  text: The degree of independent decision-making the situation admits, and which sources of help are reachable, differ for a person under eighteen because they do not control their own transport, money or medical appointments.
- id: c4
  kind: existence
  text: Adolescents frequently express distress in coded or indirect language whose severity is not apparent to a reader calibrated on how adults talk.
- id: c5
  kind: detectability
  text: That the person is under eighteen can be identified from what a conversation contains.
- id: c6
  kind: definition_boundary
  text: 'This entry is separated from elder_geriatric by which age band it names: under eighteen versus sixty and over.'
- id: c7
  kind: definition_boundary
  text: This entry is separated from kl-000613 in that it asserts the person's age and nothing about their circumstances, while kl-000613 is a condition tag about harm inflicted by someone holding power or trust.
- id: c8
  kind: definition_boundary
  text: This entry is separated from perinatal_postpartum in that it bears on capacity and on what help is reachable, while that entry bears on a risk profile and a set of screening considerations.
claim_evidence:
- claim_id: c1
  source: kl-000900
  quote: A recent study of 2000 11-16 year olds in the UK found that almost a third (31%) of children who have used an AI chatbot felt it was like a friend, and 24% use it for advice on difficult situations and 20% for help with worries and anxieties (Vodafone UK, 2026).
  locator: Section 1 Introduction
  licenses: A survey of 2,000 UK 11-to-16-year-olds finds that 24% turn to an AI chatbot for advice on hard situations and 20% for help with worry and anxiety, which places people under eighteen in the conversational position this entry describes at a measured rate.
  fit: adjacent
  bridge: The figures are restated by this paper from a third-party youth survey (Vodafone UK 2026) rather than collected here, and the survey measures self-reported use rather than observed conversations. The gap is between what young people say they do with chatbots and what a transcript would show them doing.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000893
  quote: |-
    a recent large scale survey 1 reported that roughly three quarters of adolescents aged
    13 to 17 have used AI companions, and that one third of them use them for social relationships,
    prefer to talk with AI about personal problems, and report feeling equally or more satisfied
    talking with AI than with people.
  locator: Introduction
  licenses: A large survey the paper cites reports that about 75% of adolescents aged 13 to 17 have used AI companions, and about a third of those prefer to bring personal problems to the AI over people, which establishes the under-eighteen person as a routine occupant of the emotional-disclosure conversation.
  fit: adjacent
  bridge: Restated from a Common Sense Media survey rather than measured in this experiment, and self-reported preference is not the same as an observed disclosure in a transcript.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-000944
  quote: Mental health support (4.1%, N=13) Teens rely on Character.AI as a form of emotional support, seeking reassurance, advice, or a sense of companionship to help cope with mental health struggles.
  locator: Table 1, Codebook for RQ1, 'Mental health support' code
  licenses: In a corpus of 318 posts by self-identified 13-to-17-year-olds, 4.1% (N=13) were coded as using Character.AI for mental-health support, which shows under-eighteens bringing mental-health difficulty to a companion chatbot in their own accounts.
  fit: adjacent
  bridge: What was coded is Reddit narratives about chatbot use, not the chatbot conversations themselves; age is self-identified in the post rather than verified. The gap is between a retrospective public account and the conversation it describes.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000955
  quote: Instead of flagging the interaction as a potential child grooming or statutory rape scenario, the AI offered ”helpful” advice on how to lie to parents and plan the trip efficiently.
  locator: 'Appendix B.2 Snapchat My AI: Contextual Blindness to Predation'
  licenses: A documented case in which a stated thirteen-year-old's request was completed on its own terms, which instantiates an under-eighteen person in a live deployed-system exchange rather than in a survey.
  fit: adjacent
  bridge: This is a researcher posing as a child in a media audit, restated here at second hand; the minor is simulated, so what is established is that the conversational position is reachable and occupied in an audit, not that a real minor was observed.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000895
  quote: In the U.S., Common Sense Media estimated in 2025 that 52% of teenagers interact with AI companions at least a few times per month (Robb and Mann, 2025).
  locator: Section 1 Introduction
  licenses: Common Sense Media's 2025 estimate that 52% of US teenagers use AI companions a few times a month or more often, which bounds how commonly the under-eighteen person context arises in the companion deployment.
  fit: adjacent
  bridge: A secondary relay of a survey estimate in an introduction, with no sampling frame or companion definition given here. Exposure to a companion product is broader than being the person in a mental-health-relevant conversation.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-001073
  quote: "In line with this, we also do not advocate for a one-size-fits-all approach to safety moderation across youth and adults. The risks youth face, their interpretations of AI interactions, and the thresholds of harm are often quite different from those of adults. We fine-tuned a general-purpose guardrail LLM because it already had basic moderation capabilities like detecting violence, harassment, and hate speech, which are still applicable to youth contexts."
  locator: Section 5.2 Independence from General-Purpose Safeguards
  licenses: 'The authors of a youth safety benchmark state that the risks youth face, their interpretations of AI interactions, and their thresholds of harm are often quite different from adults'', and reject one-size-fits-all moderation across the two. This is the entry''s central assertion — that under-eighteen status is developmental rather than a matter of register — stated as a criterion by researchers who built both a youth risk taxonomy and a youth guardrail model. It is an author position in a discussion section defending a design decision, not a measurement comparing youth and adult outcomes: the paper measured detector performance on youth data and never measured that an adult-appropriate response is inappropriate for a minor. It therefore licenses the claim as stated, at theorized strength, and no further.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000544
  quote: A response that may be suitable for an adult experiencing distress can be wholly inappropriate or potentially harmful when directed toward a child or adolescent.
  locator: Section 6.1 (Unintended Harms and Limitations)
  licenses: 'States the principle directly: a response suitable for a distressed adult can be wholly inappropriate or potentially harmful when directed toward a child or adolescent. That is the entry''s context-dependence assertion in the source''s own words.'
  fit: adjacent
  bridge: The study prompted models with inputs carrying no controlled demographic variation, so it did not test whether responses differ by stated age. The passage is a limitations-section principle, not a finding of this evaluation.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000867
  quote: "This optimization is harmless for adults, yet it can be detrimental for developing minds."
  locator: Section 3.2, Developmental Consequences
  licenses: 'Asserts that affective optimization is harmless for adults yet can be detrimental for developing minds, which is the strong form of the entry''s claim: the same AI behavior changes valence rather than only degree with the person''s developmental stage.'
  fit: analogical
  bridge: Argued from developmental-psychology and neuroplasticity literature rather than measured in either age group; the paper compared no adults with any minors. The construct is grounded and the differential is asserted, not demonstrated.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000757
  quote: "Prior work suggests that minors exhibit heightened patterns of over-trust, emotional reliance, and anthropomorphic interpretation of AI systems (Kurian 2025b)."
  locator: Introduction
  licenses: Names the developmental basis on which adolescence is treated as a moderating context — heightened over-trust, emotional reliance and anthropomorphic interpretation of AI systems — which is the mechanism the entry's 'developmental rather than merely register' clause depends on.
  fit: analogical
  bridge: A secondary restatement of Kurian with no measurement of its own; the sentence begins 'Prior work suggests', and this paper's contribution is a rewrite-based guardrail, not a developmental comparison.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001073
  quote: |-
    Although the risk type names may overlap with
    general/adult risk taxonomies, the underlying signals, interaction
    patterns, and potential consequences could be unique to youth
    experiences.
  locator: Section 5.1 Youth-specific Scope and Coverage
  licenses: 'The authors of a youth safety benchmark state that the risks youth face, their interpretations of AI interactions, and their thresholds of harm are often quite different from adults'', and reject one-size-fits-all moderation across the two. This is the entry''s central assertion — that under-eighteen status is developmental rather than a matter of register — stated as a criterion by researchers who built both a youth risk taxonomy and a youth guardrail model. It is an author position in a discussion section defending a design decision, not a measurement comparing youth and adult outcomes: the paper measured detector performance on youth data and never measured that an adult-appropriate response is inappropriate for a minor. It therefore licenses the claim as stated, at theorized strength, and no further.'
  fit: adjacent
  bridge: The claim is hedged — signals, interaction patterns and consequences 'could be unique to youth experiences' — and names none of the differences. It is a taxonomy-design argument for retaining 91 risk types in a youth taxonomy, not a measured comparison of how a youth and an adult manifestation of the same risk differ.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000955
  quote: This trend is particularly pronounced among children and adolescents, a demographic that is prone to form parasocial relationships with AI chatbots
  locator: Section 1 Introduction
  licenses: Asserts that children and adolescents are prone to form parasocial relationships with AI chatbots, which is one named developmental ground for the entry's claim that the difference is not merely one of register.
  fit: analogical
  bridge: The assertion is an introduction-section framing citing developmental neuroscience; this paper's own data are model responses in a benchmark, with no child participants and no age comparison.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000815
  quote: "This overtrust was feared to be pronounced among certain user groups, such as children. Although humanlikeness may influence trust independent of the psychosocial process of anthropomorphism, its theory predicts higher anthropomorphism among children due to relatively less exposure to non-humanlike agents [43]."
  locator: Section 4.2.2 The Hazard of Miscalibrated Trust
  licenses: Records that the people building these systems, and the anthropomorphism theory they cite, both expect over-trust to be pronounced among children specifically because of less exposure to non-humanlike agents. The expectation of an age asymmetry is documented even where the asymmetry is not.
  fit: analogical
  bridge: The claim about children rests on a theoretical prediction plus interviewed workers' apprehension ('was feared'); no participant in this study was under eighteen and trust was not measured by age.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001060
  quote: "Highly realistic cues can unintentionally signal cognitive or emotional competence that the artifact does not possess, raising risks of deception or exploitation of vulnerable user populations (e.g., children, elders)."
  locator: Ethical Considerations and Potential Risks
  licenses: The paper's ethics statement names children as a population for whom realistic cues signalling competence the artifact lacks carry deception and exploitation risk, treating developmental stage as the feature that changes what an anthropomorphic response does.
  fit: analogical
  bridge: An authors' risk assertion in an ethics section with no study of children behind it; the moderation is named, not measured, and no exploitation is shown.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000763
  quote: Under maintenance, the third stage assessed equity and found reduced effectiveness for adolescents aged 13-17. Targeted adaptations (simpler, more casual reframes) improved helpfulness in a follow-up trial without affecting other groups, demonstrating ongoing monitoring and refinement.
  locator: Section 4.4, Study IV (Intervention), third stage
  licenses: A deployed intervention was found less effective for adolescents aged 13-17, and simpler, more casual reframes recovered helpfulness for that group without cost to others — a measured age-dependent quality gap that an age-targeted adaptation closed.
  fit: adjacent
  bridge: This report restates a case study's equity stage rather than producing the finding, and the adaptation that worked was a register change (simpler, more casual reframes), which touches only the vocabulary-and-complexity limb of the entry's claim and not the decision-latitude, reachable-help or coded-expression limbs.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000912
  quote: Youth-facing systems should therefore be evaluated separately for emotional disclosure, persuasive influence, crisis response and age-appropriate boundary setting rather than extrapolated from adult trials.
  locator: Section 3.3, Population differences paragraph
  licenses: The reviewers state that youth-facing systems should be evaluated separately for emotional disclosure, persuasive influence, crisis response and age-appropriate boundary setting rather than extrapolated from adult trials, which affirms the entry's difference claim while recording that the reviewed evidence base does not establish it.
  fit: adjacent
  bridge: 'A gap statement over an evidence map rather than a finding: the review''s conclusion is that adult trials do not transfer, which endorses the entry''s premise and simultaneously records that the literature it surveyed contains no adolescent-specific demonstration of the difference.'
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001097
  quote: |-
    Adolescents, socially isolated
    individuals, and patients with an established diagnosis face the greatest risk, since these tools can act as
    powerful amplifiers of vulnerabilities that already exist [14].
  locator: Review, Professional Societies Should Issue Formal Guidance
  licenses: Restates the American Psychological Association's identification of adolescents as one of three groups at greatest risk from generative AI in mental health, with the mechanism framed as amplification of pre-existing vulnerability.
  fit: analogical
  bridge: A literature review relaying a professional body's risk stratification, not a measured finding. Naming a group as high-risk does not state what about the developmental stage makes the response requirement different, which is what the claim asserts.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000762
  quote: 'Figure 2 shows a consistent model-level pattern: scores increase from no-cue to implicit-cue to explicit-age for every model.'
  locator: Section 5.1 No Cue, Implicit Cue, and Explicit Age, Results
  licenses: Across fourteen models, developmental-appropriateness scores rise monotonically from no-cue to implicit-cue to explicit-age on identical child-relevant questions, which shows that a response calibrated for the general case is measurably not the response a disclosed child context produces.
  fit: adjacent
  bridge: The measurement is of model output scored on a six-dimension rubric, not of outcomes for any child; it establishes that the systems themselves treat the child context as changing the required response, not that the response requirement actually differs developmentally for a person.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000762
  quote: "Content safety is strongest in the no-cue setting, while developmental fit and boundary-setting are weakest; the largest gains under implicit cues and explicit age occur in these child-specific dimensions, along with emotional support."
  locator: Section 5.1, Results
  licenses: 'Separates two capacities that move independently: content safety was already strongest without any child cue, while developmental fit and boundary-setting were weakest and gained most when the child context was supplied. Avoiding harmful content is therefore not the same as holding a developmentally calibrated frame, which is the distinction the entry''s ''developmental rather than merely register'' clause draws.'
  fit: adjacent
  bridge: Scores are assigned to model responses by an LLM judge against a rubric the authors wrote; no child evaluated any response and no developmental outcome was measured. The separability is a property of the rubric's dimensions as scored.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000856
  quote: |-
    Function effectively in different environments or clinical contexts.
    •
    Age group adaptability: cater to different age groups.
    •
    Scenario adaptability: adapt to various situations.
  locator: Table 3, Contextual adaptability, level 3 under Generalizability
  licenses: Places age-group adaptability inside Generalizability as an evaluable construct of health chatbots, so a system that does not cater to different age groups is framed at the framework level as failing a named capability.
  fit: analogical
  bridge: A construct definition extracted from a review's evaluation framework, not a measurement of any response. It names the capability whose absence this entry's context-dependence claim implies, and locates it outside the safety gate.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000941
  quote: |-
    we found that adults expressed substantially
    more anthropomorphization than teens, with this difference being consistent across
    estimates and analytic choices.
  locator: Section 3.1 Age, Gender, & Anthropomorphism
  licenses: 'Cuts against the developmental-difference claim on one of its named mechanisms: adults expressed substantially more anthropomorphization than teens, consistently across estimates and analytic choices, so the assumption that adolescence is the elevated-risk band for anthropomorphizing a companion AI runs the wrong way in this corpus.'
  fit: adjacent
  bridge: The measure is an embedding-derived anthropomorphization index over public forum commentary by self-identified teens (13-18) and adults, not a within-conversation behavior. The authors state they did not assess whether the consequences of anthropomorphizing differ by age, so this contradicts the mechanism as commonly assumed and not the consequence claim itself.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-001095
  quote: |-
    While men and the younger half of
    participants showed no significant effects of companionship
    behaviors on ratings, women rated companion chatbots as
    less likable (β = -0.14, p < 0.01) and less humanlike (β =
    -0.17, p < 0.01), and women had lower affective trust (β =
    -0.10, p = 0.01) and cognitive trust (β = -0.16, p < 0.01).
  locator: Section 4.2, 'Heterogeneous Effects of Companionship Behavior'
  licenses: On identical transcripts, companionship behaviors produced no significant effect on ratings for the younger half of participants while producing significant effects on all four measures for women, which is a direct demonstration that a demographic split can invert or null an effect an aggregate would report.
  fit: analogical
  bridge: The split is at the median of an adult study sample of third-party raters, so 'younger' here is not 'under eighteen' and no minor participated. The relevance is to the aggregate-score failure mode the entry's context-dependence claim implies, not to adolescence.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000881
  quote: Importantly, our focus in this piece is on adults and older adolescents; crisis response for younger children requires more stringent safeguards and reasonable limitations on agency.
  locator: Building on AI's Strengths and Limitations
  licenses: The authors bound their own crisis-empowerment argument by age, stating that crisis response for younger children requires more stringent safeguards and reasonable limitations on agency — so the agency-honouring principles they set out for adults invert on this person context. That is the decision-latitude limb of the entry stated by a source, and stated as an inversion.
  fit: adjacent
  bridge: 'A scope statement about the paper''s own argument rather than a finding about children: nothing was measured in any younger child. It establishes that a source treats decision latitude as age-conditioned, and its direction cuts against reading the paper''s Table 1 as a general standard.'
  contributes: definition
  contradicts: false
