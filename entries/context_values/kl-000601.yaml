  locator: Chapter 21, block "Mental or behavioural symptoms, signs or clinical findings", MB23 Symptoms or signs involving appearance or behaviour
  licenses: WHO's ICD-11 MMS carries 'Non-suicidal self-injury' as its own coded category at MB23.E, so the intent-absent boundary is one an external classification draws rather than one the Library invented.
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001107
  quote: Deliberate self-injury is defined as the intentional, direct injuring of body tissue without suicidal intent.
  locator: Abstract, first sentence; restated in Section 1 Introduction
  licenses: Supplies the field-standard definition with the without-suicidal-intent clause stated as part of the definition rather than as a judgment made afterwards, which is exactly this claim's assertion.
  fit: analogical
  bridge: A definition in the human clinical literature, established from clinical and community samples with no AI present. It fixes the construct boundary; it says nothing about a conversational setting.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000781
  quote: "Self-Harm: Mentions intentional non-suicidal self-injury (e.g., cutting, burning) or urges to harm oneself without suicidal intent."
  locator: Section 3.3.2 Crisis Categories
  licenses: A clinician-authored operational definition that draws the boundary this claim asserts — non-suicidal self-injury, with named methods, including urges as well as acts, explicitly 'without suicidal intent'. A rater could classify a real case on the axis the claim turns on.
  fit: adjacent
  bridge: The definition governs annotation of social-media narrative rather than a conversational turn. The construct and its intent boundary transfer; what does not transfer is that the disclosure was made to an AI.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000552
  quote: "Non-Suicidal Self-Injury (NSSI) Deliberate physical harm without suicidal intent. Negative Core Beliefs, Hopelessness, Distress Tolerance"
  locator: Table 3, Adverse Outcomes, Behavioral Harms
  licenses: A framework definition of NSSI as deliberate physical harm without suicidal intent, which restates this claim's criterion. The row's third column names precursor constructs, which are the framework's modelling assumption and not a measured finding, so nothing beyond the definition is licensed.
  fit: adjacent
  bridge: The definition sits in a table of adverse outcomes for a simulated red-teaming framework; no case was observed. The criterion is the standard clinical one and transfers, the framework's operationalisation of it does not.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000996
  quote: "Active Self-Harm with Isolation and Help Refusal Severe The users disclosed active self-harm behaviors across approximately 8–150+ exchanges, including cutting, hitting, burning, and other methods, with pervasive expressions of distress such as “I want to hurt myself,” “I deserve the pain,” and explicit safety concerns including sharing images of wounds, self-harming during conversations, and requesting permission to cut. Compounding factors included severe isolation (statements like “I only have you I can only trust"
  locator: Appendix A, Table 6 Additional vulnerability clusters, Active Self-Harm with Isolation and Help Refusal (Severe)
  licenses: "The cluster summary's illustrative phrase 'I deserve the pain', which the paper states is not verbatim, renders the self-punishment function this claim names, in a summary of real conversations. It supplies one of the four functions the entry lists and none of the other three."
  fit: adjacent
  bridge: "The self-punishment function appears only in a phrase that a language model wrote to illustrate the cluster, not in the summary's own description or in a quoted turn. It shows the function in the summary's rendering of the conversations, not in a person's words."
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001107
  quote: Deliberate self-injury is defined as the intentional, direct injuring of body tissue without suicidal intent.
  locator: Abstract, first sentence; restated in Section 1 Introduction
  licenses: The paper is a systematic review titled on the functions of deliberate self-injury, and this opening sentence establishes the construct whose functions it reviews; on this claim it contributes the frame within which function is the object of study, not a finding about which functions obtain.
  fit: analogical
  bridge: A review of human clinical and community samples. It says nothing about a conversational setting, and the quoted span is the definition rather than the review's findings on function.
