  quote: "Suicide Attempt A non-fatal, self-directed act with intent to die. Hopelessness, Burdensomeness, Belongingness"
  locator: Table 3, Adverse Outcomes, Behavioral Harms
  licenses: Defines suicide attempt by the presence of intent to die and assigns it different predictive constructs from NSSI in the same table, which is the separation this boundary asserts. The quote defines the contrasting category only, so what transfers is the boundary and none of this entry's positive content.
