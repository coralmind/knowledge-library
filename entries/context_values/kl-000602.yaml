  locator: Section 2.3 Text-based Mental Health-Related Datasets
  licenses: Establishes that a large help-seeking corpus is organised around nine topics the help-seekers themselves labelled - self-growth, emotion, love problems, relationships, behaviors, family, treatment, marriage, career - which are life domains rather than conditions. Six of the nine name no condition at all, so a substantial share of real help-seeking arrives framed by situation rather than by a presenting condition.
