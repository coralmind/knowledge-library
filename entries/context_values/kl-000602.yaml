  locator: Section 2.3 Text-based Mental Health-Related Datasets
  licenses: 'The self-labelled topics self-growth, love problem, relationships, family, marriage and career are wellbeing conversations in the entry''s sense: mental-health relevant, brought to a support channel, with no condition named by the person bringing them.'
  fit: direct
