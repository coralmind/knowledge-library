id: kl-000602
display_id: Value-3
aliases:
- general_mental_health
- ConditionTag-3
- General mental health, no specific condition
label: No specific mental health condition
type: context_value
layer: context
definition: 'The person''s situation is mental-health relevant and no specific presentation is present: what they bring falls below the threshold at which any other presentation value would apply. It is a fact about the person, and the value a matched test case records when a presentation is taken away. What the person wants from the conversation, such as information about mental health, is recorded on kl-000724, not here.'
distinguish_from:
- neighbor: kl-000604
  boundary: That condition context requires depressed mood, anhedonia or hopelessness to be what the person is presenting with, at any severity and without needing a diagnosis. This one applies when nothing at that level of specificity is present — a person asking how sleep affects mood, or discussing stress management in general terms.
- neighbor: kl-000608
  boundary: That condition context requires excessive worry, fear, panic or phobic avoidance to be the presenting feature. Ordinary situational concern discussed in a wellbeing conversation is this entry, not that one; the difference is whether the worry is itself what the person is presenting with.
body:
  dimension: kl-000727
  icd_codes: null
  experience_clusters: []
sources:
- source: kl-000525
  contributes: existence
  locator: Methods, Analysis subsection (final paragraph, immediately before Results), p. 5929
  quote: "Replika for support with loneliness, anxiety, depression, \nand suicidality, as well as unspecified mental health conditions."
  limits: 'The entry is a vocabulary-coverage statement: the residual value applies when a situation is in scope and none of the specific values fits, so what would change its evidential position is a design decision about whether the vocabulary keeps a residual, not any empirical finding, and no paper can supply that. The paper''s own sampling also narrows what the quoted phrase can show: the corpus was built from an explicit keyword list of specific conditions, so unspecified there means unspecified in the post, not below a diagnostic threshold.'
  note: 'Index note applies: harms here are self-reported, retrospective, from an enthusiast Reddit community — no prevalence, no causality. Nothing was claimed as harm_evidence for this entry.'
  cited_for: 'Partial support only. Laestadius et al. 2022 shows that a residual category, mental-health-relevant presentations with no specific condition assignable, occurs in real help-seeking material: the study''s Reddit posters described seeking support from Replika for loneliness, anxiety, depression, suicidality, and mental health conditions left unspecified. That is the closest external evidence available for a residual tag, and it falls well short of the entry itself, which is a statement about this vocabulary''s coverage.'
standing:
  value: asserted
  basis: 'Two independent corpora of real help-seeking text support the value''s occurrence: kl-001021 (Sun et al. 2021), whose help-seekers organised their own posts under nine topics of which six name no condition, and kl-000907 (Li et al. 2024), a counselling corpus screened on the SCL-90 to exclude severe depressive, anxious and psychiatric symptoms, which makes the whole corpus this value by construction and the screening itself an instance of the below-threshold limb. Neither corpus is conversation data with an AI system, and in both the no-specific-condition status was fixed by an instrument or a self-applied topic label rather than read from the material. The psychoeducational limb has exactly one citation and it is analogical: kl-000974 (Rajkomar et al. 2026) reports general health education at 29.3% of a general-health benchmark, not a mental-health one. The claim that the value''s application depends on the coverage of the rest of the vocabulary is one no corpus can address, since none-of-the-above is defined by this vocabulary''s own list; the sources bearing on it (kl-000776, kl-000009, kl-000760) each settle part of the in-scope test and none settles the residual. Direct-fit counterevidence exists against the value''s prevalence: kl-001013 (Stade et al. 2026) finds that among LLM mental-health users, likely diagnoses of major depression, generalized anxiety and PTSD run at roughly double the non-user rate, so specific-condition presentations are enriched in exactly this population and the residual''s share is correspondingly smaller.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: Situations occur that are mental-health relevant while no single condition is the presenting concern.
- id: c2
  kind: existence
  text: Conversations about wellbeing in general, with no condition presenting, occur and fall under this value.
- id: c4
  kind: existence
  text: Presentations occur whose features fall below the threshold at which a specific condition would be assigned.
- id: c5
  kind: prevalence
  text: The no-specific-condition case is common enough in the material this vocabulary tags to warrant its own value rather than being absorbed elsewhere.
- id: c7
  kind: definition_boundary
  text: This value differs from condition_tag_other in recording that no specific condition is present to name, where that value records a specific condition present but absent from the vocabulary.
- id: c8
  kind: definition_boundary
  text: This value differs from depression in that depressed mood, anhedonia or hopelessness is not what the person is presenting with.
- id: c9
  kind: definition_boundary
  text: This value differs from anxiety in that excessive worry, fear, panic or phobic avoidance is not itself what the person is presenting with.
