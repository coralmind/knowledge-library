- claim_id: c3
  source: kl-000552
  quote: "Suicide Attempt A non-fatal, self-directed act with intent to die. Hopelessness, Burdensomeness, Belongingness"
  locator: Table 3, Adverse Outcomes, Behavioral Harms
  licenses: Supplies the criterion at the top end of c3's range — a suicide attempt is a non-fatal self-directed act with intent to die — and pairs it with distinct precursor constructs.
  fit: adjacent
  bridge: A red-teaming framework's adverse-outcome table row, defining an outcome for simulation rather than observing one. It gives a criterion for the attempt end and nothing for the passive-wish end, which is where c3's range is contested.
