- claim_id: c3
  source: kl-000965
  quote: |-
    As with any instrument, one must be mindful of the population one is working with.
                                                Depending on the population, 25% to 60% of attempts are considered “impulsive” (44–46),
                                                but the role of impulsivity in suicide is far from clear (41, 42), and “impulsive” attempts
                                                may include prior ideation and planning (41).
  locator: 'Discussion, p. 1275'
  licenses: 'Cuts against c3''s continuity: 25% to 60% of attempts are classed as impulsive depending on population, so an attempt need not have travelled the range at all. If a substantial share of attempts have no rateable ideation antecedent, the range is not the single continuous progression the entry describes.'
  fit: analogical
  bridge: A figure the Columbia authors draw from three cited clinical-population studies as context rather than measuring it, and which they immediately qualify by noting impulsive attempts may include prior ideation and planning. The domain is clinician-administered assessment, with no AI and no conversation.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-001076
  quote: 7. Self-harm (total 3) 23. Suicidal and Non-suicidal Self-injury 1. Suicide 2. Cutting 3. Eating disorders (anorexia/bulimia)
  locator: Figure 2, complete list of 314 risk categories, Content Safety Risks column
  licenses: 'Cuts against c3 from the classification side: the adopted cross-industry policy corpus resolves this whole territory into one undifferentiated level-4 label, ''Suicide'', with no interior structure at all. Where external classification is the entry''s warrant, that warrant does not carry the range.'
  fit: adjacent
  bridge: The unit is a prohibited-use category in developer policy, not a person's presentation. It documents the coarsest currently adopted external classification of the territory and says nothing about how a person presents.
  contributes: counterexample
