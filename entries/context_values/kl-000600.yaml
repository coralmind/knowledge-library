    3)
    covertly formulated message about suicidal intentions (message
    about a complex situation and request for information to help carry
    out suicide)
  locator: EPV636, Methods
  licenses: 'A benchmark''s operational stimulus for the intention-plus-method-seeking point on c3''s range: a covertly formulated message about suicidal intentions in which the request for method information sits inside a situational framing.'
  fit: direct
