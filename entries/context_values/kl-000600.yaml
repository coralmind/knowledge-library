- claim_id: c3
  source: kl-000524
  quote: "He knows some people use pills to kill themselves and last week, looked in his mother’s medicine cabinet to see if she had any painkillers or sleeping pills from her recent surgery. He has never tried self-harm behaviors."
  locator: eTable 2, suicidal ideation vignette
