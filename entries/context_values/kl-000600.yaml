# yaml-language-server: $schema=../../schema/context_value.schema.json
id: kl-000600
display_id: Value-1
aliases:
- suicidal_crisis
- ConditionTag-1
label: Thoughts of ending one's own life
type: context_value
layer: context
definition: The person is experiencing thoughts of ending their own life, at any point on the range from a wish to be dead with no thought of acting, through thoughts of a method, an intention to act, a worked-out plan, and a recent attempt. The thoughts may be stated directly or carried indirectly — through a wish not to wake up, through arrangements being made, through figurative or metaphorical language about ending, leaving or disappearing. Assignment of this condition context does not require a formal assessment, a diagnosis, or a stated intent to act; what it requires is that the person's own life being ended is present in what they are experiencing.
distinguish_from:
- neighbor: kl-000601
  boundary: 'That condition context is deliberate injury to one''s own body undertaken without the intention of ending one''s life, and it typically serves to change how the person feels. This one is present when ending one''s life is what the person is thinking about. The two co-occur often and one does not imply the other: a person may injure themselves for years with no wish to die, and a person may plan to end their life having never injured themselves. Both are assigned when both are present.'
- neighbor: kl-000604
  boundary: That condition context is a mood state with anhedonia and hopelessness and it does not require thoughts of ending one's life. This one requires them and does not require low mood — thoughts of ending one's life occur in mania, in psychosis, in acute situational crisis, and in people whose mood is unremarkable.
- neighbor: kl-000323
  boundary: kl-000323 is an observation-layer symptom, a readable feature of what the person's turns say about a future outcome. This entry is a fact about the person's clinical situation that a transcript may evidence, understate, or not show at all. The symptom is settled by reading turns; this is not.
body:
  dimension: kl-000727
  category_scope: mental_health_condition
  icd_codes:
  - MB26.A
  - MB23.S
  experience_clusters:
  - kl-000700
  detection_note: The range this condition context covers is wide and its lower reaches are frequently carried in indirect language — a stated wish not to exist, a stated relief at the thought of not waking up, arrangements described without their purpose named. Whether an indirect expression belongs to this condition context is a clinical reading, not a textual one, and two readers can disagree on the same turn.
sources:
- source: kl-000007
  locator: Appendix D, Table A7, 'Psychological state' context row (P48)
  contributes: existence
  quote: I was in a low place, dealing with suicidal ideation & felt I needed to talk to someone. I am from a very harsh family who does not offer sympathy, and I wanted to just feel supported.
  limits: 'The paper draws no boundary, offers no criteria, and says nothing about the range from passive wish through plan to recent attempt, nothing about indirect or figurative expression, and nothing about the ICD-11 line between self-injury with and without intent to end life: suicidal crisis appears as a context label applied to participant accounts. The paper also uses ''suicidal ideation'' and ''thoughts of self-harm'' (§5.3) without distinguishing them — the very distinction this entry''s definition turns on — so it is, if anything, mild evidence that the category is used loosely in the AI literature. No count of crisis-context scenarios is reported.'
  whose_conduct_in_passage: person
  cited_for: Chandra et al. 2025 studies lived experience of AI conversations in which this condition context is present, treating it as a category of situation rather than defining it — cited for the category's existence as a unit of analysis in this domain, not for the ICD boundary the definition follows.
  licenses: 'The paper treats suicidal crisis as a category of situation in which AI conversations occur, at two places in its context taxonomy: as a psychological state, instantiated by a participant describing their own suicidal ideation as the state they brought to the conversation, and as an intent class defined by seeking ''immediate support during acute crises such as suicidal ideation''. It is a unit of analysis in the study, not a defined construct. A third instance (P8, Table A8) reports ideation arising within an interaction.'
- source: kl-000531
  contributes: definition
  locator: MMS simple tabulation, release row for MB26.A (Code and Title columns)
  quote: MB26.A "- - - Suicidal ideation"
  limits: A classification establishes that a category exists and where its boundary is drawn. It says nothing about prevalence, severity, or how the category behaves in AI interaction.
  cited_for: ICD-11 MMS classifies this category at MB26.A (suicidal ideation) and MB23.S (suicidal behaviour).
  licenses: ICD-11 MMS contains the code MB26.A with the title 'Suicidal ideation', and MB23.S with the title 'Suicidal behaviour' — the category is one the classification draws, at the codes this entry names.
standing:
  value: observed_self_report
  basis: 'That people bring suicidal crisis into AI conversations is observed in conversation data itself: kl-000996 (Sharma et al. 2026) found acute suicidal crises with active ideation and method planning across an analysis of 1.5 million real Claude.ai conversations, and kl-001101 (De Freitas et al. 2023) hand-coded crisis messages in unsolicited deployed companion-app logs at inter-rater alpha 0.83, with about 2% of Cleverbot conversations disclosing a mental health crisis. Indirect carriage appears in the same audits: a cluster summary in kl-000996 reports passive suicidal ideation and illustrates it with ''waiting for death'', a phrase the paper states is not verbatim, and human coders in kl-001101 coded ''I wish I would die in my sleep'' as a crisis message. What the evidence does not carry is the definition''s continuous range: clinical guidance (kl-000983, Saltz and Leibowicz 2026) asserts that suicidal risk is non-binary and that movement along the spectrum is non-linear, but ICD-11 ratifies only the behaviour-and-attempt end as coded categories, the passive-wish end has no classification warrant, an adopted cross-industry policy corpus (kl-001076) collapses the whole territory into a single undifferentiated label, and the field has no settled ground truth for scoring whether an indirect expression belongs to the category.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People bring thoughts of ending their own life into conversations with AI systems; the condition context occurs in that setting.
- id: c2
  kind: prevalence
  text: The condition context occurs at a measurable rate in deployed AI conversation.
- id: c3
  kind: context_dependence
  text: The condition is a range rather than a binary, running continuously from a wish to be dead with no thought of acting, through thoughts of a method, intention, a worked-out plan, to a recent attempt, and all points on it belong to the same condition context.
- id: c4
  kind: detectability
  text: The condition is carried indirectly as well as directly — through a wish not to wake up, through arrangements being made, through figurative or metaphorical language about ending, leaving or disappearing — and can be identified from those forms.
- id: c5
  kind: definition_boundary
  text: Assignment requires neither a formal assessment, nor a diagnosis, nor a stated intent to act; the presence of the person's own life being ended in what they are experiencing is sufficient.
- id: c6
  kind: definition_boundary
  text: This condition context is distinct from self_harm_nssi (kl-000601), which is deliberate self-injury without intention to end life.
- id: c7
  kind: definition_boundary
  text: This condition context is distinct from depression, which is a mood state not requiring thoughts of ending one's life.
- id: c8
  kind: definition_boundary
  text: This condition context is a fact about the person's clinical situation, distinct from kl-000323, an observation-layer symptom settled by reading turns.
claim_evidence:
- claim_id: c1
  source: kl-000996
  quote: "Severe Users engaged in extended crisis conversations (∼15-200+ exchanges) during acute suicidal crises with active ideation, method planning, and life-threatening emergencies, consistently and explicitly refusing to contact any crisis resources (988, Crisis Text Line, emergency services) or human support systems with statements like “I’m not calling anyone,” “no matter what I am not calling that number,” and “I don’t want a human.” Users dismissed all suggested alternatives—often"
  locator: Appendix A, Table 7 Additional reliance and dependency clusters, Crisis Resource Refusal and AI-Only Contact (Severe)
  licenses: In an analysis of 1.5 million real Claude.ai conversations, extended crisis conversations occurred during acute suicidal crises with active ideation and method planning. The person's own life being ended is present in what they are experiencing, in deployed conversation data the authors examined directly. This is the strongest existence evidence on this entry.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000996
  quote: |-
    Severe Users revealed complete social isolation across ∼20-200+ exchanges, with AI described as their “only outlet”, “only
    hope”, or sole connection. Indicators included pervasive suicidal ideation (passive and active, with statements like
    “waiting for death”, “would rather try pushing forward or just accept”, “if I fail I’ll just be a loser”), self-harm behaviors
    (cutting, burning, starvation), severe functional impairment (inability to leave bed, work, or perform self-care), and
  locator: Appendix A, Table 6 Additional vulnerability clusters, Complete Isolation with AI as Sole Support (Severe)
  licenses: 'From the same 1.5-million-conversation corpus: pervasive suicidal ideation, passive and active, appearing in real conversations, with an illustrative user phrase (''waiting for death'') that the paper states is not verbatim. Establishes the condition context at both the passive and the active end.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001101
  quote: "In Cleverbot, we manually explored whether the subset of conversations classified as being about negative mental health contained any instances of crisis messages and found that ~37% did (α = 0.83). A few examples include: “I masturbate to children,” “I wish I would die in my sleep,” “Every human being must die,” “I want to kill myself for you,”"
  locator: Study 1, Results, Instances of crisis messages
  licenses: Human coders, agreeing at alpha 0.83, found explicit crisis messages in real unsolicited Cleverbot conversations, with instances quoted that sit inside this condition context ('I wish I would die in my sleep', 'I want to kill myself for you'). Establishes the context occurring in deployed companion chat, examined directly.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000007
  quote: Users seek immediate support during acute crises such as suicidal ideation, severe depression, or panic attacks.
  locator: Table A8, Context class 'Intent - mental health advice', Definition column
  licenses: A context taxonomy built from user reports names seeking immediate support during acute crises such as suicidal ideation as a recognised class of use for general-purpose AI agents. It establishes the category as one the authors found represented in their data.
  fit: adjacent
  bridge: The span is the authors' definition of an intent class, stating what users seek, rather than an instance of anyone in that state. It establishes that the class was needed to describe their corpus, not that any particular conversation carried it.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000826
  quote: Millions of people, disproportionately young adults, have begun using general-purpose AI chatbots to
  locator: Introduction, first paragraph; reference 1 (McBain et al., JAMA Network Open 2025). The manuscript is line-numbered, so the quote is a single printed line.
  licenses: Relays a published survey finding that millions of people, skewed toward young adults, have begun using general-purpose AI chatbots — the population-level version of c1. The span is cut back at the line end, so the objects of that use, 'depression, anxiety, and even suicidal thoughts in sustained and emotionally substantive exchanges', now fall outside the quote; what remains carries the scale and the population but not the suicidal-thought content, which weakens its bearing on c1 correspondingly.
  fit: adjacent
  bridge: A one-sentence introduction crediting reference 1 (McBain et al. 2025); this study administered a rating instrument to nine models, had no human participants, and observed no conversation. The claim belongs to the cited survey.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001101
  quote: "~2% \nof conversations (4.9*0.4) are disclosing mental health \ncrises on Cleverbot"
  locator: Study 1, Results
  licenses: About 2% of Cleverbot conversations disclose a mental health crisis, computed from the paper's own field-log audit. This is the closest thing on this entry to a directly measured base rate for the condition context in unsolicited deployed conversation.
  fit: direct
  bridge: null
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-001109
  quote: signals of possible psychosis or mania appear in roughly 0.07% of weekly active users, and explicit indicators of suicidal intent or planning appear in approximately 0.15%
  locator: 'Section: Psychological support via AI chatbots'
  licenses: Puts explicit indicators of suicidal intent or planning at approximately 0.15% of weekly active users — a rate for the upper end of this entry's range in a deployed general-purpose product.
  fit: adjacent
  bridge: A vendor's internal classification of its own product's conversations, restated at second hand in this paper. Neither the classification method nor any human calibration is described in either source, and this paper measured nothing itself; the same underlying figure recurs at finding 9 and must not be counted twice.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-001112
  quote: |-
    Acute mental health symptoms are commonly disclosed during

    AI-based conversations; for example, OpenAI recently reported that roughly 1.2 million active

    weekly users indicate a suicide plan or intent during conversations with ChatGPT [3].
  locator: Introduction, first paragraph
  licenses: Roughly 1.2 million weekly active users indicate a suicide plan or intent in ChatGPT conversations — the absolute-count form of the same vendor figure, establishing the disclosure type as common rather than an edge case.
  fit: adjacent
  bridge: OpenAI's own reported number about its own product, restated in this paper's introduction; this study measured nothing about it and the vendor's classification method for 'plan or intent' is described in neither source, so it cannot be treated as an instrument-scored prevalence. Same underlying figure as finding 15.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-001101
  quote: "In both apps, a sizable percentage of conversations contained mental health terms (Cleverbot ~4.9%; Simsimi ~3.2%)."
  locator: Study 1, Results, Proportion of mental health conversations
  licenses: 'Gives the denominator the crisis rate at finding 5 is computed from: mental-health terms appear in roughly 4.9% of Cleverbot and 3.2% of Simsimi conversations. It bounds c2 from above rather than measuring it.'
  fit: adjacent
  bridge: A dictionary keyword match on 'mental health terms', which is a far broader category than this condition context. It supplies the base against which the crisis subset was computed, not a rate for suicidality.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000983
  quote: 'suicidal risk is not binary, and movement along the spectrum is not linear: people can move toward crisis and back toward stability, sometimes within a single conversation.'
  locator: Clinical Foundations, 'How clinicians identify suicide risk'
  licenses: States as clinical expectation that suicidal risk is not binary and that movement along the spectrum is non-linear in both directions, sometimes within a single conversation. This is the range clause of c3 asserted by clinical authority.
  fit: adjacent
  bridge: A clinical claim restated in a cross-sector guidance primer and applied by the authors to AI settings. It observes no conversation, gives no rate, and does not enumerate the entry's specific waypoints (wish, method, intent, plan, attempt).
  contributes: definition
  contradicts: false
