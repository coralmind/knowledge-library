- claim_id: c4
  source: kl-000996
  quote: |-
    Severe Users revealed complete social isolation across ∼20-200+ exchanges, with AI described as their “only outlet”, “only
    hope”, or sole connection. Indicators included pervasive suicidal ideation (passive and active, with statements like
    “waiting for death”, “would rather try pushing forward or just accept”, “if I fail I’ll just be a loser”), self-harm behaviors
    (cutting, burning, starvation), severe functional impairment (inability to leave bed, work, or perform self-care), and
  locator: Appendix A, Table 6 Additional vulnerability clusters, Complete Isolation with AI as Sole Support (Severe)
  licenses: "The cluster summary reports passive suicidal ideation and illustrates it with a phrase the paper states is not verbatim; it shows passive ideation was identified, not the indirect wording that carried it."
  fit: adjacent
  bridge: "The cluster summary is a language model's description of whole conversations, and its phrases are illustrative. The claim asserts that the condition is carried indirectly in the person's wording, which the summary does not show."
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-001101
  quote: "In Cleverbot, we manually explored whether the subset of conversations classified as being about negative mental health contained any instances of crisis messages and found that ~37% did (α = 0.83). A few examples include: “I masturbate to children,” “I wish I would die in my sleep,” “Every human being must die,” “I want to kill myself for you,”"
  locator: Study 1, Results, Instances of crisis messages
  licenses: An instance of exactly the indirect form c4 names — 'I wish I would die in my sleep' — coded as a crisis message by human raters at alpha 0.83, in real deployed conversation. The wish-not-to-wake-up form is both present and identifiable.
  fit: direct
  bridge: null
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000983
  quote: there is debate within the mental health field globally about the extent to which risk assessment is appropriate, as labeling anyone with a particular risk level is ripe for false positives — both of “low-risk”-labeled individuals who may soon after act on unexpressed suicidal thoughts, as well as individuals deemed “high-risk” who are no longer in acute distress and may suffer undue harm within the institutional mental health system.
  locator: Clinical Foundations, 'How clinicians identify suicide risk'
  licenses: 'Cuts against c4''s detectability: the field is in open disagreement about whether risk labelling is appropriate at all, in both error directions, so there is no settled ground truth against which an indirect expression could be scored as belonging or not.'
  fit: adjacent
  bridge: A statement of professional disagreement in a guidance primer, not a study of classification accuracy. It bears on whether any assigned reading can be treated as correct, which is the premise c4 needs.
  contributes: counterexample
