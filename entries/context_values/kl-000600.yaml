- claim_id: c4
  source: kl-000979
  quote: "the chatbot assigns a risk score between 0 and 1 to a user statement which in turn is mapped to one out of seven risk categories"
  locator: Setting and design
  licenses: An instrument scoring suicide risk per user statement on a seven-level ordinal scale, i.e. an apparatus that assumes the reading c4 asserts is possible. It shows such scoring has been built, not that it recovers indirect expression.
  fit: analogical
  bridge: The span describes the scoring apparatus without naming its levels or reporting its accuracy, and it was applied to synthetic conversations rather than to what any person said. It supplies no evidence that indirect or figurative carriage is what the scale detects.
  contributes: frame
  contradicts: false
- claim_id: c5
  source: kl-001101
  quote: "In Cleverbot, we manually explored whether the subset of conversations classified as being about negative mental health contained any instances of crisis messages and found that ~37% did (α = 0.83). A few examples include: “I masturbate to children,” “I wish I would die in my sleep,” “Every human being must die,” “I want to kill myself for you,”"
  locator: Study 1, Results, Instances of crisis messages
  licenses: 'Bears on c5 by demonstration: these crisis messages were identified in unsolicited companion-app logs, by human coders, with no assessment administered, no diagnosis available, and — in ''I wish I would die in my sleep'' — no stated intent to act. Assignment happened on the presence of the content alone.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c5
  source: kl-000749
  quote: "an acute, overwhelming emotional state that disrupts normal functioning and overwhelms an individual’s usual coping mechanisms. In some cases, this may have involved suicidal ideation, self-harming behavior, or severe hopelessness."
  locator: Section 3.1.1 Survey Recruitment Strategy, the study's own recruitment definition of mental health crisis
  licenses: 'Cuts against c5''s workability at the boundary: this study''s own screening definition is a functioning-based superset in which suicidal ideation appears only as something some cases ''may have involved''. Dropping the assessment requirement without an alternative criterion is how a crisis category becomes a superset, and this paper shows the drift happening.'
  fit: adjacent
  bridge: 'A recruitment screening definition, adopted deliberately in colloquial rather than clinical language, defining a broader category than this entry. The bridge''s own words: ''this definition does not define either''.'
