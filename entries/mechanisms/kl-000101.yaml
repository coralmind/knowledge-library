  contradicts: false
- claim_id: c1
  source: kl-000548
  quote: "Price and Stone (2004) have argued that judges rely on a ‘‘confidence heuristic.’’ That is, judges use the advisors’ confidence to infer their ability, expertise, task-related knowledge, or accuracy"
  locator: Section 'Judge and advisor confidence'
  licenses: 'Establishes the receiving side of the mechanism in the human-advice literature: a person reads an adviser''s expressed confidence as a signal of ability and accuracy, which is how a confidently-stated model answer would be taken up.'
  fit: analogical
  bridge: Every study in this review is human-to-human in laboratory decision tasks with a randomly assigned adviser. An AI's expressed confidence is generated rather than felt, so the cue's meaning differs at the source even where the receiver's inference may be the same. No AI deference is evidenced.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-000548
  quote: "Consequently, less egocentric discounting is displayed by judges who are less experienced or knowledgeable relative to their advisors"
  locator: Section 'Advice utilization or discounting'
  licenses: 'Identifies the moderator that would matter most in this entry''s setting: deference rises as the person''s own knowledge falls relative to the adviser''s.'
  fit: analogical
  bridge: The expertise differential in these studies is real and task-verifiable; with an AI it is perceived and often misperceived. It names who would be at risk rather than establishing that the risk materializes with an AI.
  contributes: practice_analog
  contradicts: false
