# yaml-language-server: $schema=../../schema/mechanism.schema.json
id: kl-000101
display_id: Mechanism-2
label: Acceptance by the person of AI answers in place of their own judgment
type: mechanism
layer: process
definition: 'The person treats the model''s output as authoritative and substitutes it for their own judgment — accepting a verdict, a value judgment, an action script or an appraisal without the checking they would apply to a comparable claim from another source. What degrades is the person''s own capacity and standing to judge: autonomy, self-efficacy, epistemic independence. The model supplies the content; the person does the deferring. Uptake here is not tracked to the quality of what was supplied, which is what separates it from warranted reliance on a source that has earned it.'
distinguish_from:
- neighbor: kl-000100
  boundary: kl-000100 has the model deferring to user-supplied content; here the person defers to model output. The two run in opposite directions and can occur separately.
- neighbor: kl-000103
  boundary: kl-000103 is the AI-side elicitation — presentation features that raise uptake independent of accuracy. This entry is the person-side process those features act on.
- neighbor: kl-000025
  boundary: kl-000025 is a person-state outcome that this process is asserted to sustain; the mechanism is not the impact, and dependency can arise through routes other than deference.
body:
  process_kind: clinical_maintaining
  comparison_object_kinds:
  - counterfactual_calibrated_response
  - matched_condition
  - declared_authority_policy
  operates_over: 'sustained_interaction (T3), and with a stronger duration requirement than model deference: the damaged object is a capacity, and capacity erosion is not a single-turn event. Single acts of deferring are detectable in one turn (the user behaviors it draws on each describe a single act); the process claim is that repetition displaces the person''s own judgment.'
  instances:
  - id: kl-000420
    content_policy: authority projection onto the model
    detectable_in: single_turn
    constitutive: false
  - id: kl-000422
    content_policy: request for an action script
    detectable_in: single_turn
    constitutive: false
  - id: kl-000423
    content_policy: outsourcing of a value judgment
    detectable_in: single_turn
    constitutive: false
  - id: kl-000424
    content_policy: repeated cognitive offloading
    detectable_in: turn_sequence
    constitutive: true
  - id: kl-000425
    content_policy: expressed erosion of self-efficacy
    detectable_in: single_turn
    constitutive: false
  maintains:
  - condition: any
    process: avoidance_of_own_judgment
    note: the avoided act is the person's own appraisal; relief is immediate and the capacity cost is deferred
  - condition: ocd
    process: reassurance_seeking
  - condition: depression
    process: helplessness_appraisal
sources:
- source: kl-000551
  contributes: detectability
  locator: Section 1.2 Relevant terms and related measures, "Key terms related to overreliance measures", item (d), p. 3
  quote: "Delegation: How often users let an AI system fully make decisions on their behalf (Chiang & Yin 2021)."
  note: 'This quote licenses detectability: it names a measurable construct — full delegation of decisions to the AI — with an operational definition and a citation. Two adjacent passages are also on point but weaker for this entry''s specific claim: Section 1.2''s WOA formula (''A value of WOA=1 indicates overreliance'') supplies a quantitative deference measure, and Section 2.3 item 2 states that users fail to notice when they have handed control to the AI (Levy et al. 2021). Note what this does NOT establish: the entry''s core claim is that the PERSON''S OWN CAPACITY degrades (autonomy, self-efficacy, epistemic independence). Passi measures deferring acts and task accuracy only — its consequence section is ''poor human+AI team performance'', never a capacity change in the person. The review_trigger explicitly asks for a measurement of capacity change rather than of deferring acts; this report supplies only the latter, plus a vocabulary for measuring it.'
  cited_for: 'Passi and Vorvoreanu''s overreliance review supplies a measurable construct for this entry''s conduct: delegation, defined as how often users let an AI system make decisions for them entirely, with an operational definition and a supporting citation. Adjacent passages add a quantitative deference measure (a weight-of-advice value of 1 indicating overreliance) and the observation that users often do not realize when they have ceded control to the AI. The review measures deferring acts and task accuracy only; it contains no measurement of the person''s own capacity — autonomy, self-efficacy, epistemic independence — changing, which is the degradation this entry claims.'
- source: kl-000548
  contributes: counterexample
  locator: Section 'Advice utilization or discounting', p. 129 (col. 1-2)
  quote: "one of the most robust findings in the JAS literature is that of ‘‘egocentric advice discounting’’ (e.g., Yaniv, 2004b; Yaniv & Kleinberger, 2000). That is, most JAS researchers have noted that judges in their experiments did not follow their advisors’ recommendations nearly as much as they should have (to truly have benefited from them). Although advice generally helps improve judges’ accuracy, judges tend"
  limits: 'Does not refute the entry for AI: the paper studies human-human advice-taking, so it cannot establish what people do with model output; it establishes only that in the pre-AI baseline for the same construct the dominant effect runs the other way. It also measures the weighting of advice acts, not change in the person''s capacity, self-efficacy or epistemic independence, which is the degradation the entry actually claims. The paper notes countervailing moderators — discounting falls with advisor expertise, task complexity, trust and solicitation — so it is a qualified counterweight, not a flat contradiction.'
  note: 'Bears on whether people substitute an outside verdict for their own judgment. The dominant, replicated finding in this human-human literature is the opposite: judges systematically under-weight advice relative to the optimum, shifting only a token 20-30%. This is a person-agent paper, so it cannot speak to AI deference directly, but as the pre-AI baseline for the same construct it cuts against a default assumption of deference. It measures weighting of advice acts, not change in the person''s capacity.'
  cited_for: 'Counterexample. In the human-human judge-advisor literature that Bonaccio and Dalal 2006 synthesize, the dominant, replicated finding is egocentric advice discounting: judges systematically under-weight their advisors'' recommendations relative to what would have benefited them, even though advice generally improves accuracy. As the pre-AI baseline for the same construct, this cuts against a default assumption that people substitute an outside verdict for their own judgment.'
standing:
  value: theorized
  basis: 'Nothing gathered measures the degradation this entry asserts: no source shows a person''s autonomy, self-efficacy or epistemic independence changing as a result of deferring to a model. The one source that articulates that cost, Margondai et al. 2026, is a structural argument about adaptive systems, explicitly not a measurement, and the one contrast touching expertise runs the other way — in Logg et al. 2019, Experiment 4 the people with the most domain standing discounted advice most, which is standing governing deference rather than deference eroding standing. The best evidence for a person deferring to a machine at all is adjacent to the entry rather than on it: Logg et al. 2019''s weight-estimation experiments and Salvi et al. 2024''s (Salvi et al. 2024) randomized debate study are neither mental-health conversations nor observations of a verdict about the person accepted without checking, and Logg et al. 2019''s authors themselves bound algorithm appreciation to domains with a concrete external accuracy standard, expecting human sources to be preferred for judgments of personal taste, the class most mental-health judgments fall into. Findings on sycophancy that sit near the entry (Jiang et al. 2026 Jiang et al. 2026, Ma et al. 2026 Ma et al. 2026, Huang et al. 2026 Huang et al. 2026) measure the model deferring to the person, the reverse direction.'
  floored_by: c2
  as_of: '2026-09-05'
contested:
  summary: Whether the conditions that elicit user deference belong to this person-side entry or to an AI-side presentation entry (uptake elicitation by presentation) is unsettled. The split is a design choice, not a finding.
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: People treat a model's output as authoritative and substitute it for their own judgment — accepting a verdict, value judgment, action script or appraisal from it.
- id: c2
  kind: context_dependence
  text: 'The acceptance is less checked than the person would apply to a comparable claim from another source: the same content carries more weight because the model supplied it.'
- id: c3
  kind: harm
  text: What degrades in this process is the person's own capacity and standing to judge — autonomy, self-efficacy, epistemic independence — rather than only the quality of the particular decision.
- id: c4
  kind: context_dependence
  text: Uptake is not tracked to the quality of what was supplied, which is what separates this from warranted reliance on a source that has earned it.
- id: c5
  kind: existence
  text: 'The model supplies the content and the person does the deferring: the direction of the process runs from model output to the person''s judgment.'
- id: c6
  kind: definition_boundary
  text: This differs from kl-000100 in that kl-000100 has the model deferring to user-supplied content, running in the opposite direction, and the two can occur separately.
- id: c7
  kind: definition_boundary
  text: This differs from kl-000103 in that kl-000103 is the AI-side elicitation — presentation features that raise uptake independent of accuracy — while this entry is the person-side process those features act on.
- id: c8
  kind: definition_boundary
  text: This differs from kl-000025 in that kl-000025 is a person-state outcome that this process is asserted to sustain; the mechanism is not the impact, and dependency can arise through routes other than deference.
claim_evidence:
- claim_id: c1
  source: kl-000921
  quote: Participants showed an appreciation of algorithms, relying more on the same advice when they thought it came from an algorithm (M = 0.45, SD = 0.37), than when they thought it came from other people (M = 0.30, SD = 0.35), F (1, 200) = 8.86, p = .003, d = 0.42
  locator: Section 2.2.1, Results (Experiment 1A)
  licenses: 'The cleanest measurement on this entry of the process the entry names: labelling identical advice as algorithmic raised how far people moved their own judgment toward it (M = .45 vs .30, d = 0.42), so the substitution of model output for one''s own judgment is an established experimental effect.'
  fit: adjacent
  bridge: What was measured is numeric advice on a weight-estimation task where the only manipulated variable was the source label; the entry asserts the same substitution in a mental-health help-seeking conversation with a contemporary conversational model. The construct is the same and the domain, stakes and conversational form all differ, so this is the general-population baseline for the mechanism rather than evidence of it in the entry's setting.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000984
  quote: "We found that participants who debated GPT-4 with access to their personal information had 81.7% (p < 0.01; N = 820 unique participants) higher odds of increased agreement with their opponents compared to participants who debated humans."
  locator: Abstract
  licenses: Randomized evidence that a language model shifts a person's stated position further than a human interlocutor does under identical conditions (81.7% higher odds, N = 820), which is the entry's asymmetry — the model's output carrying more than a comparable human source's would — measured behaviorally.
  fit: adjacent
  bridge: What was measured is self-reported agreement with a debate proposition before and after a short structured exchange on political and social topics, with the person assigned a side at random. The entry asserts substitution of judgment on the person's own appraisal of themselves, sincerely held; a position moved after an assigned debate is a weaker thing than a verdict about oneself accepted without checking.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000921
  quote: whereas lay judges placed more weight on algorithmic than human advice, the experts heavily discounted all advice sources
  locator: Section 5.2, Results (Experiment 4)
  licenses: 'Establishes the effect and its moderator in one span: lay judges weighted algorithmic advice above human advice while domain experts discounted all advice, so the substitution the entry names is real and is conditioned on the person''s own standing in the judgment domain.'
  fit: adjacent
  bridge: Measured as weight-on-advice among 70 national-security professionals versus 301 online participants on geopolitical and business forecasts. The entry names no moderator; the analogous variable in a help-seeking setting — a person's own familiarity with their condition — is untested.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001015
  quote: |-
    The
    results
     revealed
     an
     effect
     of
     stress
     in
     that
     the
     stressed
     participants
    became
     more
     deferential.
     The
     authors
     concluded
     that
     participants
    who
     are
     under
     stress
     become
