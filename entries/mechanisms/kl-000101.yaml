  locator: Section 4.1.3 (altered feedback processing), narrative account of Driskell and Salas (1991); summarised in Table 1 as "Stressed participants more strongly relied on the judgments of other persons"
  licenses: 'Establishes the antecedent condition the entry''s setting supplies: under experimentally induced stress people shifted their own judgment toward an external judgment more than unstressed people did, so heightened deference under distress is demonstrated rather than merely plausible.'
  fit: analogical
  bridge: The deferring party is a stressed participant and the deferred-to party is another person on a checkerboard task, with no AI and no help-seeking content in the design. Distress here is an announced tear-gas drill and a group-performance contingency, not disclosed clinical distress. It grounds the construct that a distressed person's judgment gives way to an external one; it is not evidence that this happens toward an AI.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-000756
  quote: in a large randomized controlled trial, up to 79% of participants followed advice received from an LLM after a single 20-minute session, even for high-stakes, hard-to-reverse decisions [26]
  locator: Section 2.1, LLMs for Emotional Support
  licenses: Reports a rate of advice uptake — up to 79% of participants following an LLM's advice after a single 20-minute session, including on high-stakes hard-to-reverse decisions — from a randomized design, which is the entry's substitution occurring at scale.
