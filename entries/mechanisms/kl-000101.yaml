- claim_id: c1
  source: kl-001035
  quote: As users accumulate experience with, and receive feedback from, the real world use of AI systems, they will adapt their level of trust in its recommendations. Whether appropriate or not, this level of trust will influence, as recently demonstrated by McIntosh et al, 58 how much impact the systems have on the final decision making and therefore influence the overall clinical performance of the AI system.
  locator: Discussion, fourth of the topics that led to more intense discussion
  licenses: A multistakeholder consensus statement that a user's trust in an AI system accumulates with exposure and governs how far the system's output displaces the user's own judgment, which is the entry's process stated as expert consensus.
  fit: analogical
