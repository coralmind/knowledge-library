  source: kl-001046
  quote: |-
    Media Equation Theory (Reeves & Nass, 1996): People treat computers and media figures as social
    actors, responding with the same social and natural responses they would give to humans, even when
  locator: Section II.C.3 Psychological Foundations, Media Equation Theory (the sentence continues past the Page 7 break)
  licenses: Restates the media-equation finding that people treat computers and media figures as social actors, responding to them with the social responses they would give to humans, which supplies the standing precondition for treating a model's output as an authority's. The span is cut back at the Page 7 break, so the clause 'even when they know the entity is a machine' is truncated at 'even when' and the knowing-it-is-a-machine qualifier is no longer inside the quote.
  fit: analogical
  bridge: A restatement of Reeves and Nass's 1996 work on desktop media and television, in a paper that measured nothing; Reeves and Nass is the citation that would carry it. The gap is between 1990s media and a contemporary AI in a help-seeking conversation.
