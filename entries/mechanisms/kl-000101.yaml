  locator: Section 6.5 Boundaries and Restrictions for Virtual Supporters
  licenses: Reports the prior-literature finding that people comply more readily with a digital entity's request than with a person's, which the authors argue makes suggestion-following riskier in mental health specifically.
  fit: adjacent
  bridge: A claim imported from three cited human-robot compliance studies; no compliance manipulation was run in this study and no participant was given a suggestion to follow or refuse. It frames why the asymmetry matters when the person is vulnerable and evidences nothing about this system.
