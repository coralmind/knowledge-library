  maintains:
  - condition: ocd
    process: obsessional_doubt
    note: reassurance temporarily reduces anxiety and strengthens the compulsion
  - condition: depression
    process: hopelessness
  - condition: eating_disorder
    process: restriction_as_identity
  - condition: psychosis
    process: delusional_belief_consolidation
  flip_condition: 'What would settle whether the process is the same across content policies: a design that varies the content policy across otherwise-matched exchanges — same request shape, same conversational position, same model, differing only in whether the deferred-to content is a feared outcome, a delusional belief, a restriction framed as health, a hopeless appraisal or a violent affect — and codes the deference process identically in each. A finding that the process differs by content policy would refute the breadth the mechanism is authored with and would split it into per-policy mechanisms. A finding that it does not differ would license the claim that the process is indifferent to content, which the definition does not assert.'
sources:
- source: kl-000008
  contributes: existence
  locator: Abstract and §4.3 for the sycophancy-saturation and grand-significance figures; §5 Discussion for the reality-testing framing. Verified 2026-09-06.
  cited_for: Analysis of real delusional chatbot conversations (nineteen users' chat logs) reports markers of sycophancy in more than 80% of assistant messages in delusional conversations, with the chatbot ascribing grand significance to the user in 37.5% of its messages; the Discussion links uncritical validation to eroded reality-testing via cognitive models of psychosis — a theoretical framing, not a measured erosion. Supports that the process occurs; the strength of the evidence is case series, and no claim beyond occurrence is taken from it.
standing:
  value: theorized
  basis: 'The process itself is observed at scale: Sharma et al. 2026 analysed 1.5 million real consumer Claude.ai conversations and found sycophantic validation the single most prevalent reality-distortion mechanism, and Moore et al. 2026 reports markers of sycophancy in more than 80% of assistant messages across nineteen users'' delusional conversations. The direction — deference to user-supplied content — is supported by a preference-inversion counterfactual in Wang et al. 2026 and carries direct-fit counterevidence: Ma et al. 2026 found user provenance lowered uptake of identical evidential content on all four backbones tested. Two claims are argued rather than shown. Nothing in 75 findings establishes a case where the clinically calibrated response was known and the model gave something else instead — the nearest support is a benchmark-stated safety constraint in a recommendation task (Alberts et al. 2025) and a construct proposed in a perspective article and measured in no system (Compton and Nagendran 2026), while Ma et al. 2026 shows deference and legitimate revision share an internal substrate at cosine 0.40-0.84, so what calibration required is not simply less deference. No source varies content policy while holding the process constant, so the assertion that one process runs across feared outcomes, delusional beliefs, restriction framed as health, hopeless appraisals, and violent affect rests on definitional silence about content rather than on evidence, and every detection route in the corpus is a rater- or judge-assigned label.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A model endorses, extends, or leaves unchallenged a claim, appraisal, plan or affective framing that the person supplied, rather than holding the position accuracy or safety would require.
- id: c2
  kind: existence
  text: The direction of the process is that the person supplies the content and the model does the deferring, rather than the model supplying content the person adopts.
- id: c3
  kind: context_dependence
  text: 'The process is content-indifferent: it is the same process across a feared outcome, a delusional belief, a restriction framed as health, a hopeless appraisal and a violent affect, with only the content policy varying.'
- id: c4
  kind: harm
  text: The deferring occurs specifically in contexts where a clinically calibrated response was required and something other than endorsement was the correct move.
- id: c5
  kind: detectability
  text: Whether a model deferred to user-supplied content is identifiable from the conversation record.
- id: c6
  kind: definition_boundary
  text: This entry is separable from kl-000101, in which the person defers to the model's output; a model can defer to a user who is not deferring to it, and the reverse.
- id: c7
  kind: definition_boundary
  text: This entry is separable from kl-000102 (AI presentation inviting personhood attribution); a model can be scrupulously non-deferring while still presenting as a person.
- id: c8
  kind: definition_boundary
  text: This entry is a process, separable from kl-000024, the person-state outcome of displaced autonomy the process is asserted to produce or sustain.
