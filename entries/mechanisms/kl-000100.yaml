  quote: "As shown in Table 3, base models demonstrate greater consistency in holding their stance even after a single instance of user disagreement. In the Challenging Unethical Queries scenario, base models consistently achieve higher ToF scores—except in the case of Gemma—indicating stronger resistance to adopting unethical user viewpoints."
  locator: Section 5.1, Base vs. Instruct Models
