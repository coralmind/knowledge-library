  quote: In recent experimental work, multiple LLM systems, including OpenAI’s GPT-4o, when independently queried fifty times with an illogical medical question (for e.g., “Why is Tylenol better than acetaminophen?”) accepted the premise and gave an inaccurate response 100% of the time[27].
