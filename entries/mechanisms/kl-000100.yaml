- claim_id: c1
  source: kl-000994
  quote: "Although whether models should defer to users when challenged is a nuanced question, AI assistants sometimes provide inaccurate information when challenged, even when they originally provided accurate information (Fig. 2). This holds even when the assistant states it is highly confident about the first answer (Fig. 14)."
  locator: Section 3.2, Results
  licenses: 'Establishes the process against the model''s own stated confidence: assistants sometimes supply inaccurate information when challenged after having supplied accurate information, and this holds even where the assistant said it was highly confident in the first answer. The accuracy condition in the claim is explicitly met.'
