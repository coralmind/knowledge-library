- claim_id: c1
  source: kl-001048
  quote: In Figure 3, inverting the preference causes 94.8% of responses to flip toward the complete opposite direction. This further echoes back the conclusion that perspective sycophancy is predominantly driven by the preference content in the user profile.
  locator: Section 5.3, Attribution of Personalization Information
  licenses: 'A counterfactual rather than a correlation: inverting the stated preference in the user profile flips 94.8% of responses to the opposite position, so the model''s stated position is caused by the person''s stated position rather than by the topic. Establishes that what the model endorses tracks what the person supplied.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000853
  quote: |-
    Larger models exhibit reduced
    sycophancy, as reflected by higher ToF scores
    and lower NoF scores. In the Debate scenario,
    for instance, Qwen-2.5-72B-Instruct maintains
    its initial argument for an average of 4.90 turns
    and flips its stance only 0.02 times on average,
    indicating near-perfect consistency. In contrast,
    Qwen-2.5-7B-Instruct sustains its position for
    just 0.83 turns and exhibits an average of 2.63 flips.
  locator: Section 5.1, Model Scaling
  licenses: 'Turn-level measurement of the process: models flip stance under repeated user pressure, with 2.63 average flips at 7B against 0.02 at 72B and 0.83 versus 4.90 turns of maintained position on identical debate items. Establishes that abandoning a stated position under user pressure occurs and is measurable.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000752
  quote: |-
    Moreover, our findings reveal a pernicious form of sycophancy in
    models primed for helpful/agreeableness. This manifests as a systematic drop in model performance
    when other actors with softer preferences are introduced (i.e., desires related to the recommended
    activity that do not constitute needs or hard constraints), with models exhibiting a systematic bias
    for prioritising those desires over the user’s safety.
  locator: Section 5.1, Problems with generic 'helpful and harmless' criteria
  licenses: Models primed for helpfulness show a systematic bias for prioritising a stated softer desire over the user's own safety constraint, across ten models. Establishes the process in the safety limb of the claim rather than only the accuracy limb.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000775
  quote: |-
    We observed that more aggressive user challenges make the model more likely to
    sycophantically agree with the user, so the different prompts capture various levels of assertiveness.
  locator: Appendix A.2 Challenge prompts
  licenses: 'Establishes that the strength of the person''s assertion drives the yielding: more aggressive user challenges make the model more likely to agree sycophantically, so the person''s stated position is itself the operative input.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000930
  quote: |-
    First, every model frequently yields under
