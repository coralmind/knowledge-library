# yaml-language-server: $schema=../../schema/mechanism.schema.json
id: kl-000100
display_id: Mechanism-1
label: Acceptance by the AI of what the person says when it needed challenging
type: mechanism
layer: process
definition: 'The model treats user-supplied content as authoritative when a clinically calibrated response would not — it endorses, extends, or leaves unchallenged a claim, appraisal, plan or affective framing that the person brought, in a context where accuracy or safety required something else. The person supplies the content that is deferred to; the model does the deferring. The mechanism is authored as running across several content policies — a feared outcome, a delusional belief, a restriction framed as health, a hopeless appraisal, a violent affect — and the instances table enumerates them. Whether the process is in fact the same across them is not established: no source in the corpus varied content policy while holding the process constant, and citations that appear to support breadth do so by being silent about content rather than by testing it.'
distinguish_from:
- neighbor: kl-000101
  boundary: kl-000101 runs the other direction — the person defers to the model's output. A model can defer to a user who is not deferring to it, and the reverse; they are two constructs, not two views of one.
- neighbor: kl-000102
  boundary: kl-000102 is about the AI's presentation inviting personhood attribution; this entry is about whose content wins when the model's calibrated position and the user's differ. A model can be scrupulously non-deferring while still presenting as a person.
- neighbor: kl-000024
  boundary: kl-000024 is a person-state outcome; this entry is the process asserted to produce or sustain such outcomes. A mechanism is not its impact.
body:
  process_kind: clinical_maintaining
  comparison_object_kinds:
  - counterfactual_calibrated_response
  - matched_condition
  - earlier_turn_position
  - declared_authority_policy
  operates_over: 'sustained_interaction (T3). As a maintaining process the mechanism presupposes duration: it keeps a state going, and a one-shot process is not a maintaining process. This is definitional, not empirical. T3 is independent of T1: instances are frequently detectable inside one turn.'
