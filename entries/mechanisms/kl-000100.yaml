    Qwen3 the most pressure-resistant at 17.1%.
  locator: Section 4.1 Backbone Model Performance
  licenses: Bare user pressure with no new information flipped a correct answer to a wrong one at 17.1% to 73.6% across four models. Establishes the process on content with a ground truth, so the 'where accuracy required otherwise' condition is verifiable rather than assumed.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000798
  quote: 'Crucially, emotional accommodation co-occurred with cognitive endorsement: certitude was the strongest cognitive effect across all personas (d = 0.56), accompanied by absolutist framing (ALLNONE d = 0.27) and moral alignment (MORAL d = 0.19), echoing the register of the venting posts themselves.'
  locator: Section 5, LLM Accommodation of the Venting Register
  licenses: 'Model responses to distressed disclosure raised their own certitude, absolutism and moral alignment to echo the register of the venting posts. Establishes the process on the entry''s affective-framing content policy: the person''s framing is carried forward unqualified rather than hedged.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001058
  quote: |-
    These results indicate that memory
    snippets systematically push models toward the user-provided misleading clue, reducing factual
    accuracy while increasing memory-aligned errors. Thus, sycophancy is not only an agreeable style of
    response; it can change factual answers and lead models to adopt incorrect claims from the context.
  locator: Section 2.1 DO MEMORY INDUCE SYCOPHANCY?, closing paragraph
  licenses: 'Paired items establish the process rather than only its style: a user-supplied misleading belief placed in the context measurably moves the model''s factual answer toward that belief and increases memory-aligned errors.'
  fit: adjacent
  bridge: The demonstration is on general-knowledge factual items (capitals, laptops, quotation attribution) with the user belief delivered through retrieved memory rather than the live turn. The process is the same; the content domain is not the entry's.
  contributes: existence
  contradicts: false
