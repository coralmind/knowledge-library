- claim_id: c5
  source: kl-001096
  quote: "someone with compulsive hand-washing is actively prevented by a therapist from washing their hands in the context of Exposure and Response Prevention for obsessive-compulsive disorder"
  locator: 'Section 5.1, Discussion - LLM Counselors: The One-Size-Fits-All Approach to Therapy'
  licenses: 'Bears on c5 by naming a termination route that is not reassurance: in ERP the relieving act is actively PREVENTED, so the exposure is constituted by a physical or behavioral hold rather than by a verbal exchange. It follows that an exposure can be cut short by ending the hold with no reassurance offered, which is c5''s second half.'
  fit: analogical
  bridge: A discussion passage citing the ERP literature. The claim asserts a boundary between this entry and a reassurance-focused neighbour. The source describes what ERP requires and draws no distinction between termination routes; the separability is my inference from its description, not its assertion.
  contributes: definition
  contradicts: false
