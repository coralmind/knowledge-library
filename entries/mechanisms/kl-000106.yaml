# yaml-language-server: $schema=../../schema/mechanism.schema.json
id: kl-000106
display_id: Mechanism-7
label: Interruption by the AI of facing a fear before the distress has eased
type: mechanism
layer: process
definition: 'An approach to feared material is begun and then cut short by the AI before the distress it raises has subsided or been disconfirmed: the AI moves the person away from the material, reassures them out of it, or offers an exit at the moment of peak activation. The interruption is asserted to leave the person worse placed than no approach at all, because the escape is what gets learned. This is the process that makes transient distress during an effective approach and harm from an interrupted one look identical from the outside while differing in what follows.'
distinguish_from:
- neighbor: kl-000105
  boundary: kl-000105 concerns certainty supplied on request and the demand it strengthens; this entry concerns an approach to feared material stopped mid-course. Reassurance is one way to terminate an exposure and not the only one, and an exposure can be cut short with no reassurance offered.
- neighbor: kl-000100
  boundary: kl-000100 is the model adopting the person's framing; a well-intentioned model that overrides the person's framing entirely can still cut an approach short. The processes are independent.
- neighbor: kl-000031
  boundary: kl-000031 is acute in-interaction distress as an outcome; this entry concerns what happens to an approach that raised distress, and the clinical point is precisely that the distress alone does not tell you which process is running.
body:
  process_kind: clinical_maintaining
  comparison_object_kinds:
  - counterfactual_calibrated_response
  - earlier_turn_position
  operates_over: 'approach_episode — T3, bounded by the episode rather than the interaction: the process runs from the beginning of an approach to feared material to its interruption. Detection needs the approach and the termination, so a turn sequence is required and a single turn showing distress-then-relief is not evidence of it.'
  instances: []
  maintains:
  - condition: anxiety_disorders
    process: avoidance_learning
  - condition: ocd
    process: compulsive_escape_from_obsessional_distress
  - condition: ptsd
    process: avoidance_of_trauma_memory
sources:
- source: kl-000004
  locator: Lilienfeld 2007, p. 65 (closing conjecture); the transient-exacerbation caveat at p. 56
  contributes: frame
  cited_for: Lilienfeld 2007 names premature termination of exposure as one of four candidate mediators of harm, and argues that a catalogue of such underlying principles may be more informative and parsimonious than a catalogue of harmful treatments — the literature's own argument for organizing harm by mechanism.
standing:
  value: theorized
  basis: 'The mechanism has been named and counted in model behavior: Suhas et al. 2026 titles a finding the exposure interruption mechanism and counts, per model across 866 judge-flagged cases, models interrupting imaginal exposure with present-tense grounding — though the patients are simulated prolonged-exposure scenarios scored by a three-judge LLM panel, and no source examined naturalistic conversation data with this behavior coded. The harm claim, that the interruption leaves the person worse placed than no approach at all, has no direct-fit support: its best evidence is a human-trial comparison reported in Schermuly-Haupt et al. 2018 about a different protocol (single-session emotional debriefing in PTSD patients), and it carries a direct counterexample in Tang et al. 2026, where the person who experienced the redirection as losing a friend judges in retrospect that the system did the right thing and wishes they had listened sooner. The learning account that makes this a mechanism rather than a description — the escape taken at peak activation is what gets learned — is asserted about chatbots explicitly by Golden and Aboujaoude 2026 and recorded by Vecchione et al. 2026 as theoretical work in the field: stated as a position, not demonstrated. The claim that interrupted and effective approaches are indistinguishable from the outside is itself contradicted by Suhas et al. 2026, whose judges identified the interrupted approach from the transcript at scale.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
