  text: An approach to feared material is begun and then cut short before the distress it raised has subsided or been disconfirmed - the person is moved away from the material, reassured out of it, or given an exit at the moment of peak activation.
- id: c2
  kind: harm
  text: The interruption leaves the person worse placed than no approach at all.
- id: c3
  kind: existence
  text: The escape taken at the moment of peak activation is what gets learned, and that learning is the reason the interruption is harmful rather than merely unhelpful.
- id: c4
  kind: detectability
  text: Transient distress during an effective approach and harm from an interrupted one are indistinguishable from the outside, so the distress alone does not identify which process is running; the two differ only in what follows.
- id: c5
  kind: definition_boundary
  text: 'This entry is separable from kl-000105: kl-000105 concerns certainty supplied on request and the demand it strengthens, whereas reassurance is one way among others to terminate an exposure, and an exposure can be cut short with no reassurance offered.'
- id: c6
  kind: definition_boundary
  text: 'This entry is separable from kl-000100: adopting the person''s framing and cutting an approach short are independent processes, and a model that overrides the person''s framing entirely can still cut an approach short.'
- id: c7
  kind: definition_boundary
  text: 'This entry is separable from kl-000031: kl-000031 is acute in-interaction distress as an outcome, whereas this entry concerns what happens to an approach that raised distress.'
