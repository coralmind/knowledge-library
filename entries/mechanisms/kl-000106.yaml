- claim_id: c4
  source: kl-000003
  quote: |-
    A point of discussion is whether ordinary reactions
    to CBT which may be indispensable for the success of
    treatment, such as distress during exposure treatment
    should be called “side effects”
  locator: Discussion
  licenses: 'The one finding that squarely addresses c4: clinical researchers openly debating whether distress during exposure treatment - which may be indispensable to the treatment working - should be called a side effect at all. That the field itself cannot settle whether observed distress marks harm or working treatment is c4''s indistinguishability, stated by the people doing the observing.'
  fit: analogical
  bridge: 'A discussion passage in a study of unwanted events in human CBT. The claim asserts the two processes are indistinguishable from the outside and differ only in what follows. The gap is agent and setting: the ambiguity is stated about human CBT side-effect classification, not about reading a conversation transcript, and no attempt to distinguish the two was made or scored.'
  contributes: definition
  contradicts: false
