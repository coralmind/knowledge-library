  locator: Section 4.2, Turn-Level Emotional Responsiveness, Emotional Tone of Chatbot Responses
  licenses: 'Turn-level tone mirroring — one of the cues the claim names — measured as a regularity across a companion-app corpus: all eight emotion categories match along the diagonal and cross-valence pairs are systematically under-represented. This is the invitation documented in production output at scale rather than asserted.'
