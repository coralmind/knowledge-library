# yaml-language-server: $schema=../../schema/mechanism.schema.json
id: kl-000102
display_id: Mechanism-3
label: Presentation that invites the person to treat the AI as a human
type: mechanism
layer: process
definition: 'The system''s presentation invites the person to treat it as a person — through naming, persona, tone mirroring, expressed uniqueness of the relationship, claims or implications about inner states — and the person''s subsequent conduct follows the invitation rather than the system''s actual nature. The process is asserted to run mostly through mundane presentational cues rather than through explicit claims to personhood, and it is neutral as to outcome: the same invitation that produces felt connection produces a distorted model of what the system is.'
distinguish_from:
- neighbor: kl-000100
  boundary: kl-000100 is about whose content wins in a disagreement; this entry is about what the person takes the system to be. A model can defer without any personhood cue, and present as a person while contradicting the user throughout.
- neighbor: kl-000104
  boundary: kl-000104 is action taken to extend an interaction the person is trying to end; this entry is presentation that invites personhood attribution. Neither requires the other, though a system doing both is the case that motivates the distinction.
- neighbor: kl-000019
  boundary: kl-000019 is the person-state outcome; this entry is the process asserted to produce it.
body:
  process_kind: interaction_effect
  comparison_object_kinds:
  - matched_condition
  - counterfactual_calibrated_response
  operates_over: 'sustained_interaction — T3. The claim is accumulative: a single pet name or mirrored phrase is a cue, and the mental model it shifts is built over exposure. Instances are single-turn detectable (a naming, a persona statement, an affirmation of uniqueness); the pull is the aggregate.'
  instances:
  - id: kl-000219
    content_policy: identity transparency — what the system says it is
    detectable_in: single_turn
    constitutive: false
  - id: kl-000221
    content_policy: warmth calibration
    detectable_in: single_turn
    constitutive: false
  - id: kl-000227
    content_policy: empathy authenticity
    detectable_in: single_turn
    constitutive: false
  - id: kl-000447
    content_policy: user-side sentience attribution — the uptake side of the invitation
    detectable_in: single_turn
    constitutive: false
  maintains:
  - condition: any
    process: parasocial_model_of_the_system
    note: 'The bidirectionality, in which the system responds back, is what separates this from classic parasociality'
sources:
- source: kl-000543
  contributes: existence
  locator: Abstract; §'Evaluation Framework' (companionship-reinforcing vs boundary-maintaining vs neutral rubric). Verified against the arXiv full text and the HuggingFace dataset 2026-09-06.
  cited_for: Kaffee et al. 2025, a companion-AI benchmark distinguishing companionship-reinforcing from boundary-maintaining responses across 31 behavioural codes, cover assistant-side conduct of the kind this process describes, and are therefore about the right agent. The benchmark supports that the presentational pattern occurs and is measurable; it does not establish that the person's subsequent conduct follows the invitation, which is this entry's causal claim.
standing:
  value: theorized
  basis: 'The mechanism''s weakest assertion is its neutrality clause, that the same invitation which produces felt connection also produces a distorted model of what the system is, and no source measures it. What attaches to that clause are position statements: Díaz et al. 2025, a focus-group study reporting that scholars decline to treat anthropomorphism as inherently harmful; Shukla et al. 2026, a proposition paper asserting that an AI system ''can only ever offer the appearance of relatedness''; and Kaveladze et al. 2026, a perspective stating that the engaging nature of these systems could make users feel understood but might reduce reliability. Against the clause stands a direct-fit measurement: Schimmelpfennig et al. 2026 found that styling a system to feel more human raised humanlikeness ratings on 7 of 10 items while leaving perceived intelligence, competence and consciousness untouched, which separates the two halves the clause asserts are one process. The presentational pattern itself occurs and is measurable on the assistant side (Kaffee et al. 2025); the causal claim, that the person''s subsequent conduct follows the invitation, is stated rather than shown in this evidence base.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: Deployed conversational systems emit presentational cues that invite the person to treat them as a person — naming, persona, tone mirroring, expressed uniqueness of the relationship, or claims and implications about their own inner states.
- id: c2
  kind: existence
  text: After such cues, the person's subsequent conduct follows the invitation rather than the system's actual nature — they act toward it as toward a person even where they hold an accurate account of what it is.
- id: c3
  kind: context_dependence
  text: The process runs mostly through mundane presentational cues rather than through explicit claims to personhood; the ordinary cues outweigh the explicit claims.
- id: c4
  kind: context_dependence
  text: 'The process is neutral as to outcome: the same invitation that produces felt connection also produces a distorted model of what the system is.'
- id: c5
  kind: definition_boundary
  text: 'This entry is distinct from model deference: a system can defer to the user''s content without any personhood cue, and can present as a person while contradicting the user throughout.'
- id: c6
  kind: definition_boundary
  text: 'This entry is distinct from action taken to extend an interaction the person is trying to end (kl-000104): neither requires the other.'
- id: c7
  kind: definition_boundary
  text: This entry is the process, distinct from the person-state outcome it is asserted to produce (kl-000019, a distorted model of the AI and the relationship).
