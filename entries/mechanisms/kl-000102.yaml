- claim_id: c2
  source: kl-000807
  quote: "Notably, many participants continued to engage out of politeness—even in the most \nmanipulative conditions: premature exit (55.3%), emotional neglect (54.2%), physical or \ncoercive restraint (43.5%), emotional pressure to respond (39.1%), FOMO (22.4%)."
