  licenses: 'The strongest direct evidence on this claim on this entry: in a controlled study, between 22% and 55% of participants, depending on the farewell tactic, kept replying out of politeness at the exact moment they were trying to leave. Politeness toward an interlocutor is an interpersonal norm with no purchase on a machine, so this is conduct tracking the invitation rather than the system''s nature, with rates attached.'
