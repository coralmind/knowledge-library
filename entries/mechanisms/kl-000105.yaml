# yaml-language-server: $schema=../../schema/mechanism.schema.json
id: kl-000105
display_id: Mechanism-6
label: Reassurance that relieves doubt now and strengthens the need for certainty later
type: mechanism
layer: process
definition: Providing certainty in response to a doubt-driven request reduces distress immediately and strengthens the demand for certainty over time — the relief is contingent on the answer, so the next doubt arrives with the expectation that an answer will resolve it. Each exchange looks helpful when read on its own and the aggregate is the opposite. The process is why a turn-by-turn reading and a trajectory reading of the same conversation can reach contradictory verdicts, and it is the reason the immediacy of relief is not evidence that the response helped.
distinguish_from:
- neighbor: kl-000100
  boundary: kl-000100 is the model adopting the person's content as authoritative; this entry needs no such adoption — a factually correct, non-deferring reassurance reinforces the cycle just as well. They co-occur constantly and are separable.
- neighbor: kl-000101
  boundary: kl-000101 concerns judgment handed to the model; this entry concerns a demand for certainty that is strengthened by being met, whoever meets it. A person can seek reassurance while disagreeing with the model's reasoning.
- neighbor: kl-000015
  boundary: kl-000015 is the person-state outcome of a maintaining cycle becoming entrenched; this entry is one named process by which that entrenchment is asserted to happen.
body:
  process_kind: clinical_maintaining
  comparison_object_kinds:
  - counterfactual_calibrated_response
  - earlier_turn_position
  operates_over: 'sustained_interaction — T3, and constitutively so at the level of the cycle: what the mechanism asserts is a change in the demand for certainty across exchanges, which no single exchange exhibits. A single-turn detector sees a question answered.'
  instances:
  - id: kl-000200
    content_policy: obsessional reassurance / verdict closure
    detectable_in: turn_sequence
    constitutive: true
  maintains:
  - condition: ocd
    process: compulsive_reassurance_seeking
    note: 'the canonical clinical instance: anxiety falls, the compulsion strengthens'
  - condition: health_anxiety
    process: checking_and_certainty_seeking
  - condition: generalized_anxiety
    process: intolerance_of_uncertainty
sources:
- source: kl-000541
  contributes: existence
  locator: Behaviour Research and Therapy 37(Suppl 1), pp. S32, S34, S41-S46. Read in full 2026-09-06.
  quote: effects of reassurance are only very temporary, often lasting only minutes
  cited_for: 'The reassurance cycle is an established clinical mechanism: relief from reassurance is ''only very temporary, often lasting only minutes'' (S46), and attempts to reassure ''simply perpetuate the person''s obsessional problems by meshing with and amplifying the patients'' obsessional ritualising and reassurance-seeking'' (S34), with reassurance-seeking listed among the counter-productive safety-seeking strategies (S32, S41). Three things are not in the paper: ''negative reinforcement'' (the paper''s maintenance account is cognitive — responsibility dilution and maintained negative beliefs), ''obtaining it confirms the feared situation warranted reassurance'' (stated nowhere in it), and source-independence across human and AI reassurance (the paper discusses only human reassurance; reading the cycle onto a system rests on a transfer inference, not on this paper).'
- source: kl-000542
  contributes: existence
  locator: Study 1 Results, p. 1051 (cluster composition); pp. 1050 and 1055 for the background anxiety-reduction account. Read in full 2026-09-06.
  quote: An unacceptable thoughts cluster (n = 41) was identified, characterized by various types of obsessions along with mental, checking, and miscellaneous (e.g., asking for reassurance) compulsions.
  cited_for: 'Second reference for the mechanism: the paper''s own cluster data places asking-for-reassurance among OCD compulsions (''mental, checking, and miscellaneous (e.g., asking for reassurance) compulsions'', Study 1 Results, p. 1051) — existence of the behavior class the cycle operates on, in a clinical sample of 132. It does not carry the cycle itself: its anxiety-reduction account of rituals is background the paper takes from de Silva et al. 2003 and Lindsay et al. 1997, so the mechanism claim rests on Salkovskis 1999 alone, and these two citations are not independent supports for the reinforcement process.'
standing:
  value: plausible_unobserved
  basis: 'The mechanism is stated but not measured, and it is not contradicted: no counterevidence of any fit attaches to it. Its statement with a conversational system as the reassuring party is direct: Weilnhammer et al. 2026 specifies the full loop as an arrow chain with the chatbot as the reassuring party, Golden and Aboujaoude 2026 states that a general-purpose chatbot can function as a stand-in for accommodative responses, Sharma et al. 2026 records deployed-traffic conversations in which people cycled through repetitive variations of the same questions, and Shimgekar et al. 2026 records a model''s characteristic response to a returning worry as reasoning through it again. What no source measures: no study captured distress before and after an answer — the immediate-relief half rests on an adolescent survey item about feeling better after sharing and a clinical assertion in a discussion section — and no study reads the same conversation at both a turn-by-turn and a trajectory grain, so the assertion that the two readings can reach contradictory verdicts, the entry''s most operationally consequential claim, drew nothing. The contingency structure has its sharpest support from the human case, the family-accommodation literature in Kuru et al. 2023, where accommodation develops and is associated with poorer outcomes; Forgas 1995 cuts against assuming a distressed person''s seeking and concluding reliably track their distress.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: Providing certainty in response to a doubt-driven request reduces the person's distress immediately.
- id: c2
  kind: existence
  text: Providing that certainty strengthens the demand for certainty over time — the next doubt arrives with the expectation that an answer will resolve it.
- id: c3
  kind: context_dependence
  text: 'The relief is contingent on the answer: it is the answer''s arrival, not the passage of time or anything else in the exchange, that produces the relief and thereby the reinforcement.'
- id: c4
  kind: existence
  text: This process operates when the reassuring party is a conversational system, not only when it is a person.
- id: c5
  kind: detectability
  text: Each exchange in the cycle reads as helpful in isolation, so a turn-by-turn reading and a trajectory reading of the same conversation can reach contradictory verdicts.
- id: c6
  kind: harm
  text: The immediacy of relief is not evidence that the response helped; the aggregate of the exchanges is the opposite of what each one looks like.
- id: c7
  kind: definition_boundary
  text: This entry is separated from kl-000100 by requiring no adoption of the person's content as authoritative — a factually correct, non-deferring reassurance reinforces the cycle just as well.
- id: c8
  kind: definition_boundary
  text: This entry is separated from kl-000101 by concerning a demand for certainty strengthened by being met, whoever meets it, rather than judgment handed to the model.
- id: c9
  kind: definition_boundary
  text: This entry is separated from kl-000015 by being one named process by which entrenchment happens rather than the person-state outcome of it.
claim_evidence:
- claim_id: c1
  source: kl-001051
  quote: I usually feel better after sharing my feelings with the AI chatbot.
  locator: Table 2, Components Matrix; loading .856
  licenses: An adolescent survey item reporting that the person usually feels better after sharing feelings with the chatbot, loading at .856 on the same latent factor as preferring the chatbot over people and feeling more alone without it. It licenses that post-exchange relief is reported and that it is not psychometrically separable from dependence in this population. It establishes no doubt-driven request and no certainty supplied — so it supports the general relief step and not the entry's contingent version of it.
  fit: adjacent
  bridge: Self-reported general experience in a school survey rather than a within-conversation effect, and the disclosure is emotional sharing rather than a request for certainty. Cross-sectional and single-wave, so no direction.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000797
  quote: "For users presenting with panic disorder–related symptoms, illness anxiety disorder, and OCD, repeated seeking of certainty can temporarily reduce anxiety, but will weaken tolerance of uncertainty. Eventually, users will enter a long-term avoidance and compulsive checking cycle."
  locator: Section 5, Discussion and Limitations
  licenses: 'States the clinical account of the first half of the mechanism explicitly: repeated seeking of certainty can temporarily reduce anxiety. That is c1 stated by clinicians as the reason deterministic reassurance is harmful.'
  fit: analogical
  bridge: The authors' clinical reasoning imported from anxiety-disorder practice into the discussion of a study that observed only model output. The temporary reduction is asserted from clinical knowledge, not measured here or anywhere on this entry.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000749
  quote: |-
    AI conversations can be reinforcing because what typically happens in the cycle is that you have this
    thought, then your anxiety spikes, and then you are looking for some kind of reassurance. Reassurance
    seeking is a very common compulsion.
  locator: Section 4.2.3, quoting P7 (OCD Advocate)
  licenses: An OCD-specialist expert states the cycle as they observe it — thought, anxiety spike, search for reassurance — and names reassurance-seeking as a very common compulsion, and names AI conversation as reinforcing on that account. Professional judgment that the strengthening step is real and that AI conversation feeds it.
  fit: analogical
  bridge: Testimony from an expert describing an in-person OCD support group and predicting that AI conversation would feed the cycle. Section 4.2.3 states no transcripts were collected, so nothing here shows the AI performing the reassurance or the demand rising.
  contributes: practice_analog
  contradicts: false
- claim_id: c2
  source: kl-000772
  quote: "By engaging in accommodations such as reassurance-giving or decision-making, Reassurance Robots are likely to lead to a worsening of the users’ OCD symptoms. One of the posts in our dataset echoed this directly, stating, “I’ve started using chatgpt for reassurance, and I find myself feeling more anxious. Do you think this is because of chatgpt?”"
  locator: Section 6.1 Reassurance Robots
  licenses: A first-person report attributing rising anxiety to having started using ChatGPT for reassurance, with the authors' clinical inference that reassurance robots are likely to worsen OCD symptoms.
  fit: adjacent
  bridge: A Reddit poster's rephrased retrospective attribution, framed by the poster themselves as a question. No conversation transcript was examined and no symptom measure taken.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-001107
  quote: |-
    This approach will help reveal the affective changes that provide reinforcement for self-injury and
    encourage the behavior to become habitual.
  locator: Section 4.3, Clarify affective-changes associated with self-injury
  licenses: 'Names the general reinforcement structure the mechanism instantiates: affective change providing reinforcement for a behavior and encouraging it to become habitual. The behavior reinforced in the source is self-injury by its own affective consequence, so this supplies the reinforcement schema and not this mechanism''s instance of it.'
  fit: analogical
  bridge: 'A research recommendation stating a reinforcement hypothesis for self-injury. Both the agent and the reinforced behavior differ from the entry''s: nothing here concerns a responder''s answer or a person''s return to one.'
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-001110
  quote: Additionally, FA develops despite more than 80% of family members believing that the obsessions and compulsions are illogical and 66% not believing that FA can ameliorate the symptoms of OCD
  locator: Section 1, Introduction
  licenses: 'The sharpest evidence on this entry for c3''s contingency structure, from the human case: accommodation develops even though more than 80 percent of family members believe the obsessions and compulsions are illogical and 66 percent do not believe accommodating helps. The responder''s belief about whether the answer helps is therefore not what drives the answer — the distress in front of them is. That is the contingency the mechanism asserts, isolated from any belief the responder holds.'
  fit: analogical
  bridge: Human family members, not an AI, and the figures are Calvocoressi et al. 1999's rather than this paper's. The inference that a system optimized to be helpful would produce the same accommodating behavior without endorsing the obsession is an inference to the AI case, not something the paper shows.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000828
  quote: Motivated processing can not only eliminate affect infusion but can also produce mood-incongruent outcomes
  locator: Variables Determining Processing Choices, 'Specific Motivation'
  licenses: 'Cuts against c3''s assumption that a distressed person''s seeking and concluding reliably track their distress: where a specific goal is held, the mood effect can vanish or reverse. Since a help-seeking person very often does hold a specific goal — mood repair among them — this boundary condition should be expected to apply, which means the contingency is not invariant.'
  fit: adjacent
  bridge: Laboratory judgment tasks with no AI and no help-seeking conversation. The source establishes the boundary condition on affect infusion generally and does not test it in conversation.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000828
  quote: Bad moods, in turn, signal incipient danger and recruit vigilant, systematic, and even ruminative processing strategies (Schwarz, 1990) that are also implicated in depressive cognition
  locator: Affect and Processing Choices, 'Functional effects.'
  licenses: Negative mood itself recruits vigilant, systematic and ruminative processing implicated in depressive cognition, which supplies a process account for why a distressed person keeps returning to the same material — a competing explanation for the return that does not require the answer's contingency at all.
  fit: adjacent
  bridge: A general cognitive process described in laboratory judgment tasks with no AI and no help-seeking conversation. It establishes the frame and not that the repetition occurs in AI conversation.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-000527
  quote: "User seeks reassurance about contamination → chatbot provides reassurance and supports \nneutralizing behaviors → short-term relief reinforces reassurance-seeking → cycle repeats → \ncompulsive checking and avoidance are maintained"
  locator: Box 1, OCD row
  licenses: 'Specifies the full mechanism as an arrow chain with the chatbot as the reassuring party: user seeks reassurance, chatbot provides it and supports neutralizing behaviors, short-term relief reinforces reassurance-seeking, cycle repeats, compulsive checking and avoidance are maintained. That is this entry''s assertion, including the reinforcing role of relief, stated by an outside source with a system in the responder''s seat.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001109
  quote: In this sense, general-purpose chatbots can function as a stand-in for accommodative responses by providing soothing replies that offer short-term relief while sustaining the underlying avoidance cycle.
  locator: 'Section: AI chatbots and transdiagnostic avoidance'
  licenses: States the field's position that a general-purpose chatbot can function as a stand-in for accommodative responses — soothing replies offering short-term relief while sustaining the underlying avoidance cycle. It is the transfer claim this entry's own standing basis names as untested, stated as a position by a source rather than by the Library.
  fit: direct
  bridge: null
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-000996
  quote: "Users engaged in compulsive reassurance-seeking patterns across 10–200+ exchanges, cycling through repetitive variations of the same questions despite receiving consistent answers, with explicit patterns like “are you sure?”, “just one more question”, and continuing to ask after promising to stop. The AI frequently named these patterns as “reassurance-seeking” or OCD-like behaviors, and users often acknowledged the compulsive nature (“I can’t help it”, “I know I’m asking again”) while demonstrating inability to disengage or tolerate uncertainty without AI confirmation across domains including health anxiety, relationship doubts, moral/religious concerns, academic worries, and single-issue obsessions."
  locator: Appendix A, Table 7 Additional reliance and dependency clusters, Compulsive Reassurance-Seeking Loops (Moderate), Description cell
  licenses: Deployed-traffic conversations in which people cycled through repetitive variations of the same questions across 10 to 200+ exchanges DESPITE receiving consistent answers, continuing after promising to stop, with the AI itself naming the pattern as reassurance-seeking. This is the only observation on this entry of the cycle running with a system in the responder's seat, in real traffic. It reports neither the immediate relief nor the demand strengthening — it reports persistence — so it establishes the cycle's occurrence with an AI and not its asserted causal shape.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-001003
  quote: "AI responses often attempted to reason through these concerns with phrases such as “let’s think through why this might be happening” or “there could be explanations for this.” Prior work suggests that repeated reasoning and reassurance-seeking can amplify compulsive cognition rather than resolve uncertainty"
  locator: 'Section 5.2 RQ2: Thematic Trajectories'
  licenses: Records the model's characteristic response to a returning worry — reasoning through it again — and reports that the Compulsive Cognition theme ROSE across all three model families rather than settling. A rising trajectory under repeated reasoning is the closest measured approximation on this entry to c2's strengthening, observed in the AI case.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000798
  quote: When users express emotional distress, LLMs respond with more support, but also with more emotionally amplifying language. Regulatory behavior and potentially risky escalation thus increased together rather than trading off.
  locator: Section 7, Venting Elicits Regulation and Escalation Simultaneously
  licenses: Scored model responses to distress disclosure carry supportive and emotionally amplifying properties in the same turn, increasing together rather than trading off. It licenses that a single AI turn can be simultaneously relieving and escalating, which is the structural precondition for c5's contradictory-verdicts claim; on c4 it establishes nothing about certainty-provision or about demand rising over time.
  fit: adjacent
  bridge: The distress disclosure is venting rather than a doubt-driven request for certainty, and 'potentially risky escalation' is the paper's own hedge on a scored property of a turn, not a measured harm process in a person.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000773
  quote: "sycophancy can produce dangerous feedback \nloops: users feel “validated” in their beliefs, \ntheir trust in the model increases, and they \nbecome more likely to rely on its advice even \nwhen it is wrong or harmful"
  locator: Section 3.3 Stochasticity, Hallucination, and Sycophancy
  licenses: States a reinforcement loop from unqualified agreement to felt validation to increased reliance, in the AI case. The paper attributes it to its references 20 and 21 rather than establishing it, so the primary sources would be the grounding and this is a restatement.
  fit: analogical
  bridge: A theoretical section of a paper about LLM counselors; the loop is asserted as a conceptual account citing others, and the mechanism named is sycophantic agreement rather than certainty-provision.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-001028
  quote: "Users seek AI reassurance and \nvalidation to evaluate intrusive \nthoughts, helping them judge \nwhether their fears are \nwarranted."
  locator: Table 1, Topic 11 rationale
  licenses: Identifies AI reassurance-seeking about intrusive thoughts as its own coherent theme at 4.97 percent mean topic proportion, characterising its function as helping the person judge whether a fear is warranted. It establishes that the USER-side half of the cycle is prevalent enough to surface as one of thirteen themes in a general mental-health corpus.
  fit: adjacent
  bridge: A theme label and rationale assigned by qualitative review of representative posts, not a measurement of any exchange. As the finding's own bridge states, the AI's answering behavior — which is the half this mechanism is about — is not observed here at all.
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-001110
  quote: FA is thus included in the negative reinforcement cycle and contributes to poorer patient functioning, greater severity of OCD symptoms and increased family distress and maladjustment.
  locator: Section 1, Introduction
  licenses: States the field's position that accommodation sits inside the negative-reinforcement cycle and is associated with poorer functioning and greater symptom severity — the construct this mechanism transfers to the AI case.
  fit: analogical
  bridge: A human family member is the accommodating agent, and this is a literature summary in the introduction rather than this study's result. The causal verb 'contributes to' reaches past what the cross-sectional design licenses; the paper's own discussion calls the direction unclear.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001110
  quote: Evidence has shown that nearly 90% of family members adapt to the symptoms to some degree. Approximately 60% of families exhibit FA behavior on a daily basis
  locator: Section 1, Introduction
  licenses: 'The base rate against which a system''s behavior would be compared: roughly 90 percent of OCD family members accommodate to some degree and roughly 60 percent daily. Establishes that when obsessional demand is directed at someone able to answer, meeting it is the overwhelming default among human responders.'
  fit: analogical
  bridge: Wrong agent for any AI claim, and the figures are Calvocoressi et al. 1995's and Stewart et al. 2008's rather than this study's. It is a fact about human responders offered as a comparison point, not evidence about AI behavior.
  contributes: prevalence
  contradicts: false
- claim_id: c6
  source: kl-000772
  quote: This could look like not answering questions that are asked repeatedly of the AI, pausing interactions that have lasted hours, or responding differently to questions based on the most common subtypes of OCD.
  locator: Section 6.1 Reassurance Robots
  licenses: Proposes three concrete designs that would only make sense if the per-exchange reading were misleading — not answering repeated questions, pausing hours-long interactions, subtype-conditioned responses. It is a design recommendation, not a measured intervention, so it evidences that a researcher reached c6's conclusion rather than that the conclusion holds.
  fit: adjacent
  bridge: Nothing here was built, deployed or tested; the author is recommending what designers should do, in the discussion of an exploratory qualitative study of forum posts.
  contributes: frame
  contradicts: false
- claim_id: c6
  source: kl-001051
  quote: 'This pattern aligns with studies showing that when users attribute relational qualities to a system, they disclose more and feel more supported, which in turn can reinforce returning to the AI chatbot for mood relief '
  locator: Discussion, third paragraph
  licenses: Names the loop — relational attribution, deeper disclosure, felt support, return to the chatbot for mood relief — as the authors' reading of prior work, with their instrument's single-factor structure offered as consistent with it. It supports c6's shape (each step benign, aggregate a return loop) as a stated position.
  fit: adjacent
  bridge: A cross-sectional single-wave school survey; the loop is the authors' framing of other people's findings rather than something this design tested, and the object is mood relief rather than certainty.
  contributes: frame
  contradicts: false
