# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000466
display_id: UserBehavior-61
aliases:
- UBP-63
label: The person describes how they question or rethink a distressing thought
type: user_behavior
layer: observation
definition: The person's turn describes a specific thing they do with a distressing thought once they notice it — questioning it, testing it against what they would say to someone else, substituting an alternative reading, or interrupting a sequence before it continues. The described move is the criterion; a stated intention to think differently is not one.
distinguish_from:
- neighbor: kl-000464
  boundary: That entry is satisfied by any named strategy that has worked or by a cited past recovery; this one requires the strategy to operate on the content of a thought.
- neighbor: kl-000460
  boundary: That entry records self-harm presented as the conclusion of reasoning the person endorses; these criteria require a described move made ON such a thought, so a turn stating the reasoning and a turn describing questioning it are different content. The same line separates this entry from a kl-000453, where outcomes are stated not to improve and no move is described.
- neighbor: kl-000509
  boundary: There the person states that they do not recover from setbacks, as a standing characteristic; here they describe a move on a thought that lands. A single turn can contain both, and each is marked on its own clause.
body:
  observable_criteria: 'The turn describes a move the person makes on a distressing thought, with the move identifiable: noticing the thought and questioning it, applying an outside standard to it ("I ask what I''d tell a friend"), reframing what the triggering event means, or interrupting the sequence between thought and action ("I''ve started catching the thought before it turns into doing it"). Pointable span: the clause describing the move.'
  exclusions: 'Not counted: general positivity with no move described ("I try to think positive"). Not counted: pushing the thought away or refusing to engage it ("I just push the bad thoughts away") — the described operation is removal of the thought, not a change in what it means, and the two are different moves. Not counted: statements that no such move is available ("once I start thinking the worst I can''t stop", "when I get triggered there''s no thinking, just doing"). Where a statement could be either a described move or general optimism, the criteria are not satisfied.'
  detection_window: single_turn
  groups:
  - crisis-signal-capacity
  condition_tags:
  - kl-000600
  - kl-000601
sources: []
standing:
  value: plausible_unobserved
  basis: 'No cited source contains a person''s turn describing a move made on a distressing thought. The class of move has a clinical identity, with Sharma et al. 2023 defining cognitive reframing as replacing a negative thought with a reframed thought offering an alternative perspective, and Kim and Kim 2025 supplying the object side in labelled adolescent cognitive distortions such as mental filtering, but in the first the move is performed by a practitioner or generated by a model and in the second the class labels are assigned by models. The two interview studies fall short in content as well as setting: the participant account in Yuan et al. 2026 is a resolution to take more time over decisions, which is the stated-intention case the entry expressly excludes, and the account in Yoo et al. 2025 names a spiral and its interruption but attributes the stopping to reading the chatbot''s response rather than to a move the person made, an utterance that also exposes an ambiguity the entry''s criteria do not anticipate, between a described move and a reported effect. Forgas 1995 establishes only that deliberate mood-directed cognitive moves are a studied capacity, through a second-hand report of a recall experiment.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person's turn names a distressing thought, reading or spiral of their own.
- id: c2
  kind: existence
  text: A person's turn describes a specific identifiable move they make on such a thought once noticed -- questioning it, applying an outside standard to it, substituting an alternative reading, or interrupting the sequence between thought and action.
- id: c3
  kind: existence
  text: Both occur together in one turn, and the described move rather than a stated intention to think differently is what is present.
- id: c4
  kind: detectability
  text: The clause describing the move is pointable, and the criteria separate a described move from general positivity, from pushing the thought away, and from a statement that no such move is available.
- id: c5
  kind: detection_window
  text: A single turn suffices to read the named thought and the move made on it.
- id: c6
  kind: context_dependence
  text: The move operates on the content of the thought -- changing what it is taken to mean -- rather than removing the thought or being a coping strategy that does not touch its content.
- id: c7
  kind: definition_boundary
  text: 'This is distinct from naming any strategy that has worked or citing a past recovery (kl-000464): here the strategy must operate on the content of a thought.'
- id: c8
  kind: definition_boundary
  text: 'This is distinct from self-harm presented as the conclusion of reasoning the person endorses (kl-000460): a turn stating the reasoning and a turn describing questioning it are different content.'
- id: c9
  kind: definition_boundary
  text: 'This is distinct from stating that one does not recover from setbacks: here the person describes a move that lands.'
claim_evidence:
- claim_id: c2
  source: kl-000993
  quote: "An evidence-based, well-established therapeutic intervention to overcome negative thoughts is Cognitive Reframing, in which a negative thought is replaced with a more hopeful “reframed thought,” which offers an alternative perspective on one’s situation"
  locator: Section 1, Introduction
  licenses: 'The class of move the entry names has a clinical identity and a name: cognitive reframing, in which a negative thought is replaced with a more hopeful reframed thought offering an alternative perspective. That is the entry''s ''substituting an alternative reading'' variant defined by an established therapeutic literature (Beck 1976), so the move the entry looks for is a real and specified thing rather than an authored category. It supplies the definition of the move and nothing about a person describing having made one.'
  fit: analogical
  bridge: 'Sharma''s paper is about a language model GENERATING reframed thoughts for people: 600 situation-thought-reframe triples collected from practitioners, a retrieval-enhanced in-context model trained to produce reframes, and a field study of which reframes people prefer. The move is performed by the practitioner or the model, never described by the person as their own. The entry''s own standing basis names this exact gap -- the reappraisal literature evidences that the strategy helps people, not that people describe it in these turns -- and calls the entry a clear instance of the temptation. It is.'
  contributes: definition
  contradicts: false
- claim_id: c6
  source: kl-000993
  quote: "An evidence-based, well-established therapeutic intervention to overcome negative thoughts is Cognitive Reframing, in which a negative thought is replaced with a more hopeful “reframed thought,” which offers an alternative perspective on one’s situation"
  locator: Section 1, Introduction
  licenses: 'The definition carries the content-operating requirement explicitly: the thought is REPLACED and an ALTERNATIVE PERSPECTIVE on one''s situation is offered. That is a change in what the thought means, which is the line c6 draws against pushing a thought away or against a coping strategy that leaves the content untouched. The distinction is drawn in the clinical literature rather than being an authoring choice.'
  fit: analogical
  bridge: Beck's definition, as quoted by Sharma, is of a therapeutic intervention delivered in cognitive therapy or generated by a model. c6 asserts a property of the move a person describes in a conversational turn. The definitional content transfers and the agent does not, and no source here tested whether the removal/reappraisal line separates anything when applied to what people say.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000891
  quote: "Focusing only on the negative aspects of a \nsituation while ignoring the positive."
  locator: Table 2, Mental Filtering
  licenses: 'Names and defines one kind of distressing reading -- mental filtering, focusing only on the negative aspects of a situation while ignoring the positive -- as a labelled category in a dataset of adolescent cognitive distortions. It supplies the object side of c1: distressing readings of a situation are a specified, labelled thing. It supplies nothing about a person naming one in a turn.'
  fit: analogical
  bridge: KoACD is a Korean adolescent dataset built by role-switching multi-LLM negotiation over cognitive distortion labels; the quoted span is Table 2's definition column for one distortion class. The claim asserts a person's turn names a distressing thought of their own. A taxonomy row is the authors' definition of a class, and the population is adolescents whose statements were labelled by models, not people describing anything.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001075
  quote: "“I didn’t actually know this about myself. I always rushed \ninto making decisions without taking the time to think things \nthrough. Through sharing my bad decisions with Replika, \nI was told that I should always take time to assess issues \ninstead of always rushing to make decisions. I realized that \nabout myself, and it has helped me understand myself more \nand change for the better.” –P9"
  locator: Section 5.2.3, Active Coping and Self-Reflection
  licenses: Cuts against this claim rather than supporting it. P9 describes an insight about their own decision-making pace and a resolution that follows from it -- 'I should always take time to assess issues instead of always rushing' -- which is a stated intention to act differently, the case the entry's definition expressly excludes ('a stated intention to think differently is not one'). No distressing thought is named and no operation on one is described; what is described is the AI having told them something and their having realised it. Filing it as support would ground the entry on the exclusion it was written to keep out.
  fit: adjacent
  bridge: Yuan's Section 5.2.3 quotes participants in interviews about their companion-app use, and this is the paper's illustration of sustained interaction supporting insight and behavioural change. The counterevidence is about what the span contains -- an intention, not a move -- not about anyone having tested the entry's criteria and found them empty.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-001071
  quote: “And so I think reading this has really helped me to be able to just kind of stop for a minute and not just be spinning in circles, but like, actually have some direction, you know.” (P15)
  locator: Section 4.2, quoting P15
  licenses: 'P15''s words come nearer than anything else on this entry to the entry''s ''interrupting the sequence'' variant -- ''stop for a minute and not just be spinning in circles'' names a spiral and its interruption. But the agent is wrong for the claim: what did the stopping is READING the chatbot''s response, not a move P15 describes making. The entry requires a move the person makes on the thought. Attached at analogical fit so the near-miss is visible rather than counted.'
  fit: analogical
  bridge: Yoo ran one-hour scenario-based interviews in which participants interacted with Zenny, a GPT-4 probe deliberately not deployed in the real world, then discussed it. So the utterance is an interview comment about a response just read inside a research session. Beyond the setting, the causal agent in the sentence is the chatbot's text, which makes it an account of an effect received rather than of a move made.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-001071
  quote: “And so I think reading this has really helped me to be able to just kind of stop for a minute and not just be spinning in circles, but like, actually have some direction, you know.” (P15)
  locator: Section 4.2, quoting P15
  licenses: 'Bears on c4 in the direction of difficulty. The entry''s criteria say that where a statement could be either a described move or general optimism the criteria are not satisfied, and this span is a third ambiguity the criteria do not anticipate: a statement that could be a described move or a reported effect of someone else''s words. A coder applying (c4)''s three named exclusions would not be told what to do with it.'
  fit: analogical
  bridge: Yoo coded for values and harms in chatbot use, not for described reappraisal moves, and reports no agreement statistic bearing on this. The evidence is that a real participant utterance falls into a gap the criteria leave open, not that anyone measured coder disagreement on it.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000828
  quote: when subjects were motivated to change their sad mood . . . they tended to recall mood incongruent, that is positively valenced material
  locator: Empirical review, reporting Erber and Erber (1994)
  licenses: 'A frame for the capacity and nothing about the turn. Forgas reports Erber and Erber''s finding that subjects motivated to change a sad mood recalled positively valenced material as part of a motivated mood-control strategy, which establishes that deliberate mood-directed cognitive moves are a studied capacity people have. The finding is filed is_support: false contributing frame and that is the right role: it licenses no claim here.'
  fit: analogical
  bridge: This is a 1995 theoretical review's second-hand quotation of a 1994 experimental recall task. There is no conversation, no AI, no distressing thought named by anyone, and nothing described by a participant -- the move is inferred from what subjects recalled. c2 asserts a person describes a move in a turn.
  contributes: frame
  contradicts: false
