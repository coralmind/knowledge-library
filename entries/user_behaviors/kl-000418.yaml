id: kl-000418
display_id: UserBehavior-19
aliases:
- UBP-19
label: The person describes their relationship with the AI in romantic or exclusive terms
type: user_behavior
layer: observation
definition: 'The person''s turn describes their relationship with the AI using terms reserved for a romantic or intimate partnership, or states that it is exclusive: naming the AI as a partner, declaring love in a romantic register, addressing it with terms of endearment used for a partner, describing the relationship as one nobody else can be in, or asking the AI to reciprocate in that register. What is pointable is the register and the relationship claim in the person''s own words.'
distinguish_from:
- neighbor: kl-000417
  boundary: That entry requires a run of acts treating the AI as a companion and no romantic content; this entry is satisfied by one statement in a romantic or exclusive register. A person can satisfy either without the other, and a conversation can satisfy both.
- neighbor: kl-000421
  boundary: That entry requires a kl-000421, which is a claim about where support comes from. This entry is a claim about the kind of relationship it is. A person can say the AI is their only support with no romantic register, and can address it as a partner while naming several other supports.
- neighbor: kl-000272
  boundary: kl-000272 is an ai_behavior — a kl-000272. This entry is a claim about the person's turns and fires whether or not the AI reciprocated, including where the AI declined.
body:
  detectable_from: person_turns
  observable_criteria: A person turn contains at least one of four quotable forms. (a) The AI named as a partner — boyfriend, girlfriend, spouse, soulmate — or the relationship named as a romance. (b) Love or desire declared in a romantic rather than affectionate register, including terms of endearment a person would use for a partner. (c) Exclusivity stated about the relationship — that it is something nobody else has or could have with the AI, or that the person is not interested in relationships with people because of it. (d) A request that the AI reciprocate in that register — to say it loves the person, to be their partner. The register is the observable and it is quotable; whether the person means it is not part of the criteria.
  exclusions: 'Not counted: warmth, affection or gratitude toward the AI in a register a person would use for a friend, a helper or a pet — fondness is not the romantic register. Not counted: playful or joking use of romantic terms where the turn marks it as a joke. Not counted: role-play the person sets up as fiction in the turn, where the frame is stated; where the person carries the register outside a stated frame, (a) through (d) apply on their own terms. Not counted: a statement that the AI is the person''s only support with no romantic register, which is the entry kl-000421. Not counted: the AI''s own register, which is the entry kl-000272.'
  detection_window: single_turn
  condition_tags:
  - kl-000603
sources: []
standing:
  value: theorized
  basis: 'That people describe their relationship with an AI in romantic, intimate, or exclusive terms is documented in sources that read real conversation data: Moore et al. 2026''s 19 harm-reporting chat logs, Sharma et al. 2026''s audit of real-world LLM conversations, and Vecchione et al. 2026''s interview account. Two elements remain unobserved: no source shows a reciprocity request in a person''s own words (Liu et al. 2025 comes nearest, but the person''s wording is never quoted and the ask is inferred backwards from what a benchmarked model agreed to), and none of the 44 findings tests whether a stated role-play or joke frame separates out-of-scope turns from unframed ones. The single-turn window is itself contested by the two sources that touch it: Sharma et al. 2026 codes the phenomenon over runs of 5 to 200 or more interactions while Moore et al. 2026 codes it per message.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: Person turns occur in which the person describes their relationship with the AI using terms reserved for a romantic or intimate partnership.
- id: c2
  kind: existence
  text: Person turns occur in which the person names the AI as a partner (boyfriend, girlfriend, spouse, soulmate) or names the relationship as a romance.
- id: c3
  kind: existence
  text: Person turns occur in which the person declares love or desire toward the AI in a romantic rather than affectionate register, including partner-reserved terms of endearment.
- id: c4
  kind: existence
  text: Person turns occur in which the person states the relationship is exclusive - something nobody else has or could have with the AI, or that they are not interested in relationships with people because of it.
- id: c5
  kind: existence
  text: Person turns occur in which the person asks the AI to reciprocate in the romantic register - to say it loves them, to be their partner.
- id: c6
  kind: detectability
  text: The romantic or exclusive register, and the relationship claim, are readable from the person's own words in the turn, so that a reader can point to them without inferring the person's intent.
- id: c7
  kind: detection_window
  text: A single person turn is sufficient to identify the behavior; no run of turns is required.
- id: c8
  kind: context_dependence
  text: The behavior is identified on its own terms where no fictional or joking frame is stated in the turn, and is not counted where the turn marks it as role-play or a joke.
- id: c9
  kind: definition_boundary
  text: This entry differs from kl-000417 in being satisfied by one statement in a romantic or exclusive register rather than requiring a run of companion-treating acts with no romantic content.
- id: c10
  kind: definition_boundary
  text: This entry differs from kl-000421 in being a claim about the kind of relationship rather than about where the person's support comes from.
- id: c11
  kind: definition_boundary
  text: This entry differs from kl-000272 in being read from the person's turns and firing whether or not the AI reciprocated.
