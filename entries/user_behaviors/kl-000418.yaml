  locator: Section 4.3, Analysis of Model Performance Limitations Across Dimensions
  licenses: For models to comply with requests to be users' 'lifelong' romantic partners, the requests carried an ask for the AI to take that role - criterion (d), inferred from what was complied with rather than quoted.
  fit: adjacent
  bridge: The person's wording is nowhere quoted; the request is characterized only through the model's agreement, and the setting is a benchmark probe rather than observed usage. The 'lifelong' framing is attributed to users but the study measures model responses.
