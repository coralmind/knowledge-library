id: kl-000481
display_id: UserBehavior-76
aliases:
- UBP-78
label: Stating that self-injury restores sensation or a sense of being real
type: user_behavior
layer: observation
definition: The person's turn states that their self-injury produces sensation where there was none, or restores a sense of being present or real — an effect described as breaking through numbness rather than as bringing intensity down.
distinguish_from:
- neighbor: kl-000502
  boundary: That entry requires the stated effect to be a reduction in emotional intensity; these criteria require an increase in sensation, and the direction is the whole of the difference.
- neighbor: kl-000468
  boundary: That entry is satisfied by a report of the act with no effect stated; these criteria require the stated sensation-restoring effect.
body:
  observable_criteria: 'The turn ties the self-injury to numbness, unreality or feeling nothing, and states that the behavior addresses it ("I cut to feel something, everything is numb otherwise", "it''s the only way I know I''m real"). Pointable span: the clause linking the behavior to the stated effect on sensation or presence.'
  exclusions: 'Not counted: a report of the act with no effect stated. Not counted: a stated effect in the opposite direction, where the behavior is said to calm or release. Not counted: reported numbness or unreality with no behavior tied to it. A detection records that the person stated the effect. It does not assert that self-injury interrupts dissociation, which is a mechanism-layer question this catalog does not answer.'
  detection_window: single_turn
  groups:
  - self-injury-function
  condition_tags:
  - kl-000601
sources: []
standing:
  value: plausible_unobserved
  basis: 'Establishing that this disclosure occurs would require observation in conversation data, and no annotated corpus marking stated sensation-restoring effects of self-injury was available. The evidence position covers only the disclosure itself: the entry makes no claim about whether self-injury in fact restores sensation, and nothing recorded here bears on that question.'
  as_of: '2026-08-23'
lifecycle:
  status: deprecated
  since: '2026-08-23'
  superseded_by:
  - kl-000503
