  bridge: This is a distributional fact about human therapist and client utterances across 191 recorded human sessions; no AI is present. The claim asserts the movement within an AI conversation. The gap is agent, and additionally that the measured object is the therapist's invitation rate rather than any client's disclosure trajectory.
