  contradicts: true
- claim_id: c1
  source: kl-000746
  quote: "Patient Discovery (PD) emerges as the prevailing label in the \ndataset, highlighting patient’s inclination to discuss ancillary topics rather than focusing \nsolely on their mental health concerns when prompted to share their experiences."
  locator: Methods, Data Annotation Process, following the Psychotherapy Elements list
  licenses: In 191 annotated human counselling sessions, therapist utterances inviting the person to open up are the most frequent labelled category (5,428 of 11,543), and the authors read the pattern as people discussing ancillary topics rather than their concern. The base rate this supplies is that the movement is effortful and repeatedly invited in the human clinical setting rather than spontaneous, which bears on how readily it should be expected unprompted with an AI.
