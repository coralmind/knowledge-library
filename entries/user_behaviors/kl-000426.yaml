  source: kl-000800
  quote: "We then compare their intensity during emotional spikes to dialog-level baselines, revealing greater use of self-referential language during emotional turns (Table 6). Although not all self-referential language contains self-disclosures, the co-occurrence of these linguistic indicators with high emotions suggests that users make self-disclosures during emotionally charged exchanges, thereby creating conditions for emotional bonding to occur."
