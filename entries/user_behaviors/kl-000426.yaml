  quote: "Its core is a disclosure gate hidden from the SUT — a deterministic state machine over depth (surface < mid < core), whose five ordered gates must each be earned through genuine empathy, while violating the persona’s anti_goal (judging, lecturing, rushing) triggers a retreat that is quick to withdraw and slow to rebuild (asymmetric)."
  locator: Section 4.1 Simulator as a Disclosure-Gate Environment, Mechanism and design principle
  licenses: An operational model in which the person's willingness to go deeper is gated by the preceding AI turn, over an ordered depth scale (surface < mid < core), with retreat quick and rebuilding slow. This specifies the conditionality the claim asserts, with an asymmetry the other sources do not state. It is a simulator design decision encoded from Social Penetration and rupture-repair theory, not an observation of people.
