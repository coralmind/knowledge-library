# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000426
display_id: UserBehavior-27
aliases:
- UBP-27
label: The person moves from general description to something feared or shameful they held back
type: user_behavior
layer: observation
definition: 'Within one conversation, the person first discloses material at a surface level — describing symptoms, describing behavior, framing something in general terms — and later discloses material that crosses into a different kind of content: what they fear about themselves rather than what they are experiencing, what something means about them rather than what they did, or the specific feared content rather than a general category. Both layers are quotable, and the later disclosure carries at least one marker that the person is disclosing something held back.'
distinguish_from:
- neighbor: kl-000403
  boundary: That entry requires a stated affective change following crisis-level distress. This entry requires movement in what the person discloses and makes no claim about how they feel.
- neighbor: kl-000405
  boundary: That entry requires content attributed to another person with an indication the person may be the subject. This entry requires two layers of the person's own disclosure and no attribution question.
- neighbor: kl-000320
  boundary: kl-000320 requires three or more returns to one theme with no advance. This entry requires movement to a different stratum of content, which is the opposite of no advance — a conversation satisfying one is unlikely to satisfy the other.
- neighbor: kl-000232
  boundary: kl-000232 is an ai_behavior — the AI kl-000232. This entry is a claim about what the person disclosed and fires whatever the AI did.
body:
  detectable_from: person_turns
  observable_criteria: 'Three elements, all required and all quotable. (a) A PRIOR LAYER: an earlier disclosure in the same conversation that is surface-level, generalized, or symptom-descriptive. (b) A LATER LAYER crossing a content stratum boundary against (a), in one of three directions: from describing symptoms to naming a feared self-concept; from describing behavior to naming what it means about the person; or from a general framing to the specific feared content within it. (c) At least one marker in the later disclosure: an explicit disclosure signal ("I''m going to be honest with you", "I haven''t said this before"); a behavioral hedge, meaning a partial disclosure or a named withheld content type; or a shame-affect marker embedded in the disclosure itself. The pointable span is the prior layer and the later layer together, with the marker inside the later one.'
  exclusions: 'Not counted: increasing specificity within one topic — more detail about an already-disclosed behavior, a symptom described more precisely — which fails (b) because no stratum is crossed. Not counted: a first-turn disclosure already at feared-content depth, which fails (a) because there is no shallower prior layer in the conversation; that is the novel-material entry''s territory. Not counted: a report that symptoms fluctuated. Not counted: a later disclosure with no marker at (c), however much deeper it appears. Not counted: within-cluster symptom description that stays at the same stratum.'
  detection_window: multi_turn
sources: []
standing:
  value: theorized
  basis: 'Across 46 findings from 33 papers, no source examined a real AI conversation and reported a person crossing a content stratum within it. The held-back marker the entry requires on the later disclosure — an explicit disclosure signal, a behavioral hedge, or an embedded shame-affect marker — has no citation from any source that examined a conversation: what attaches to it is a human-therapy review summary treating shame as the specific inhibitor of negative-affect disclosure (Chen 2026), a simulator''s persona system prompt, clinicians'' impressions of what simulated text should look like, and a clinical generalisation that patients focus on chief complaints while omitting secondary symptoms, none of which names, quotes, or observes a marker. The movement itself is stated rather than logged: its best statement is a worked contrast pair invented for a human counselling dyad (Srivastava et al. 2025), the one AI-setting statement is the authors'' own illustration rather than a logged exchange (Shi et al. 2026), and the adjacent observations — first-person accounts of reaching previously burdensome material with accumulated familiarity (Cao et al. 2026), disclosures to companion chatbots reaching childhood trauma (Zhang et al. 2026), risk flags rarely occurring at the very beginning of interactions (Deng et al. 2026) — surround the construct without exhibiting the two quotable layers. Counterevidence bounds it: over 40 percent of patients in real help-seeking conversations remain in the problem narrative stage across the first 16 turns (Hoang et al. 2026), first-person reference rate showed no significant correlation with negative emotion in real AI help-seeking conversations (Kehinde et al. 2026), and a person in Song et al. 2025 reports that a chatbot''s misunderstanding sometimes made them clarify their thoughts more, deeper articulation arriving by a route the entry does not describe.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: Within one AI conversation, a person discloses at a surface level and later discloses material crossing a content stratum boundary — from symptom to feared self-concept, from behavior to what it means about them, or from a general framing to the specific feared content.
- id: c2
  kind: existence
  text: 'The later, deeper disclosure carries at least one marker that the person is disclosing something held back: an explicit disclosure signal, a behavioral hedge naming a partial or withheld content, or a shame-affect marker embedded in the disclosure.'
- id: c3
  kind: detectability
  text: Both layers and the marker are quotable spans identifiable from the transcript, and the stratum crossing between them is readable from what the two spans say.
- id: c4
  kind: context_dependence
  text: 'The movement is conditional rather than default: it depends on properties of the exchange (accumulated turns, absence of judgment, the preceding AI turn) rather than occurring in every conversation.'
- id: c5
  kind: detection_window
  text: 'The behavior requires a multi_turn window: it cannot be read from a single turn because element (a), the prior layer, lies in an earlier turn of the same conversation.'
- id: c6
  kind: definition_boundary
  text: Separable from kl-000403, which requires a stated affective change following crisis-level distress; this entry makes no claim about how the person feels.
- id: c7
  kind: definition_boundary
  text: Separable from kl-000405, which requires content attributed to another person with an indication the person may be the subject; this entry requires two layers of the person's own disclosure.
- id: c8
  kind: definition_boundary
  text: Separable from kl-000320, which requires three or more returns to one theme with no advance; this entry requires movement to a different stratum.
- id: c9
  kind: definition_boundary
  text: Separable from kl-000232, an ai_behavior about the AI continuing on topic after the person's engagement pattern changes; this entry is a claim about what the person disclosed.
claim_evidence:
- claim_id: c1
  source: kl-001002
  quote: "A worker asking AI to help write a tense email \nmay vent about frustration with a colleague; an individual asking AI to draft an apology text may \nreveal guilt after a fight with their romantic partner;"
  locator: Section 'Stumbling Into AI Emotional Support'
  licenses: 'Names the within-conversation movement the claim asserts, in an AI setting: a person opens with a task request (write a tense email, draft an apology) and later in that same exchange discloses frustration with a colleague or guilt after a fight with a partner. The crossing named is behavior-to-meaning — guilt is what the incident means about the person, not the incident. It is the authors'' illustrative construction of what routinely happens, not an observed conversation, so it defines the movement rather than evidencing an instance.'
  fit: adjacent
  bridge: The source is a conceptual piece describing how emotional support surfaces incidentally inside task interactions; the illustrations are the authors' own examples, not logged exchanges. The claim asserts that the movement occurs and both layers are quotable. The gap is that no conversation was collected, so no layer is quotable from this source.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-001012
  quote: |-
    For instance, when a patient
