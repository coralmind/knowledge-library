- claim_id: c4
  source: kl-000840
  quote: "GenAI was programmed to adhere to specific behavioral rules to create \na realistic training experience, including gradual self-disclosure and \nconstraints, such as not revealing suicidal ideation before the 10th turn \nof the conversation and not agreeing to seek help before the 20th turn. \nThis design required participants to actively apply their QPR skills."
  locator: 'Method, Phase 2: simulation with Ido'
  licenses: 'A turn-gated disclosure schedule implemented as a persona constraint: suicidal ideation withheld until turn 10, help refused until turn 20. It operationalises the claim''s conditionality as a controllable parameter with a concrete gating scheme, and by construction makes the movement dependent on accumulated turns. A scripted persona constraint in a training simulator, not an observation of a person.'
  fit: adjacent
  bridge: What is described is a behavioral rule programmed into a GenAI training character to create realistic QPR practice; the claim asserts that a real person's movement is conditional on the exchange. The gap is that the conditionality is authored rather than observed, and the gating is on turn index rather than on any property of what the interlocutor did.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000982
  quote: Srivastava et al. (2025) observed that in real counseling, positive trust transitions are frequent but small, while negative transitions are rarer but larger.
  locator: Section 3.3.4 Trust Dynamics
  licenses: In real counselling, positive trust transitions are frequent but small while negative ones are rarer but larger. This gives the shape of the conditional process the claim asserts — accrual in many small steps, loss in fewer large ones — and sets the cost of a single unrepaired turn. Observed in human counselling and reported here at one remove.
  fit: analogical
  bridge: The observation comes from expert annotation of real human counselling sessions, reported by a different paper and cited here without magnitudes; the claim concerns conditionality of disclosure movement in an AI conversation. The gap is agent, and the construct annotated is trust transition rather than disclosure stratum.
  contributes: practice_analog
  contradicts: false
- claim_id: c4
  source: kl-001092
  quote: |-
    Riley noted that chatbot misunderstandings sometimes prompted deeper reflection, explaining:
    "The chatbot misunderstood me, which was frustrating, but sometimes that made me clarify my
    thoughts more."
  locator: Appendix A, The talking cure, example 5
  licenses: A person reports that a chatbot's misunderstanding sometimes made them clarify their thoughts more. That is deeper articulation produced by a failed AI turn, which cuts against the conditionality account in which acknowledgment and validation are what open deeper disclosure. Recorded by the person it happened to.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000812
  quote: |-
    This suggests
    that risk flags rarely occur at the very beginning; instead, they tend to emerge after relational
    buildup and often persist into middle or late stages.
  locator: Section 5.2.4, item 2 (Position of risk flagged during 7 interaction days), Fig. 6
  licenses: 'Risk flags rarely occur at the very beginning; first flagged position falls between 13 and 46 percent of the daily interaction and last between 51 and 93 percent. That the deeper content is positioned after accumulated exchange rather than at the start is the empirical case for a multi_turn window: a single-turn read at the conversation''s opening would miss it.'
  fit: adjacent
  bridge: What was measured is the relative within-day position of automatically flagged risk content across seven interaction days in a role-play companion app; the claim is about the window a detector needs for the entry's three elements. The gap is that a risk flag's position is not a stratum crossing, and the unit measured is a day's interaction rather than a conversation.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-001101
  quote: "Wilcoxon signed-rank tests revealed that mental health-related conversations were more engaging than nonmental health ones in both Cleverbot and Simsimi, lasting more minutes, involving more turns, and spending more words (See Tables 1–4)."
  locator: Study 1, Results, Engagement of mental-health conversations
  licenses: Mental-health conversations in these apps ran significantly longer in minutes, turns and words than non-mental-health ones. The conversations in which the entry's behavior could occur are also the ones that reach the greatest turn depth, so a multi_turn window is where the relevant content lives. It is an aggregate engagement statistic with no turn content in it.
  fit: adjacent
  bridge: What was measured is conversation length in minutes, turns and words for mental-health versus other conversations in two chatbot apps; the claim is about the window in which the entry's elements are readable. The gap is that length establishes that multiple turns are available, not that the entry's prior layer lies in one of them.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-000785
  quote: |-
    Analysis of session duration across the week revealed a gradual increase in engagement
    over time. Session durations grew from an average of 3.07 minutes (SD=0.91) on Day 1 to 6.14
    minutes (SD=1.95) by Day 7.
  locator: Section 5.2.1 Evolving from Task to Trust
  licenses: Session duration roughly doubled from 3.07 to 6.14 minutes over seven days in the same fourteen people, giving behavioural rather than self-reported evidence of deepening engagement. It measures a series of sessions across days, which is a longer window than this entry's within-one-conversation multi_turn, and it contains no disclosure content.
  fit: adjacent
  bridge: 'What was measured is mean session duration across a seven-day series with a virtual supporter; the claim asserts a within-one-conversation window. The gap is unit: across-session growth is a different window from the entry''s, and duration carries no disclosure content at all.'
  contributes: detectability
  contradicts: false
