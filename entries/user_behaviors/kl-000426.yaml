- claim_id: c1
  source: kl-000851
  quote: |-
    Although all populations
    mostly start the conversation in the problem stage,
    real patients transition gradually, with over 40%
    remaining in this stage throughout the first 16 turns.
    In contrast, simulators quickly shift away from
  locator: Section 5.1 RQ1, Premature resolution of emotional narratives; Figure 2a
  licenses: 'Real help-seeking conversations show over 40 percent of patients remaining in the ''problem'' narrative stage across the first sixteen turns, against simulators leaving it by turn three. This is a population base rate bearing directly on the claim''s frequency: the movement, where it happens at all, is slow and often does not happen.'
  fit: adjacent
  bridge: What was measured is the population-level distribution of an LLM-assigned narrative-emotion stage label across turn index, over real online help-seeking dialogues; the claim is about an individual's movement within one conversation. The gap is that no individual's trajectory was tracked — a population curve is consistent with many people never moving and a few moving fast.
