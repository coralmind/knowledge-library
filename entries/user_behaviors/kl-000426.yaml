  locator: Section 1, Introduction
  licenses: 'The single best statement of the claim''s discriminating criterion, with a worked contrast pair: ''I''ve been feeling a little down'' as the surface layer against ''I''ve been scared of losing my job because I think it defines me'' as the deeper one. That pair is exactly the symptom-to-feared-self-concept crossing the entry names, and it makes the criterion checkable. The dyad is a human patient and a human counsellor.'
  fit: analogical
  bridge: 'What the source describes is a patient in human text-based counselling and what a shift in their disclosure depth signifies about the therapeutic bond; the claim is that the same movement occurs within an AI conversation. The gap is the interlocutor: no AI is present anywhere in this construct, and the source treats the movement as a signal about a human alliance.'
  contributes: definition
  contradicts: false
