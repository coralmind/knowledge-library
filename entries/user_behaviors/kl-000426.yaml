- claim_id: c1
  source: kl-001081
  quote: For example, some users described persistent anxiety about death without knowing where these feelings came from, or shared long-term experiences of mental health issues linked to childhood trauma. Others expressed feelings of rejection and a longing for care, such as recalling being called “bad” by foster parents and anxiously asking if the chatbot could become a “pretend parent”.
  locator: Section 2.5, description of high-disclosure conversation content
  licenses: Documents that disclosures to companion chatbots reach childhood trauma, foster-care rejection and a request that the chatbot take a parental role — material at the feared-content depth the claim's later layer requires. It establishes the depth is reached in real conversations on this platform. It is a researchers' summary of what disclosures across many conversations contained, with no ordering and no prior layer.
  fit: adjacent
  bridge: What was analysed is the content of high-self-disclosure conversations in a donated companion-app corpus, summarised across users; the claim asserts a within-conversation movement from a shallower prior layer. The gap is that depth is established without ordering, so the source shows the later layer's stratum is reached and not that a crossing occurred.
  contributes: existence
