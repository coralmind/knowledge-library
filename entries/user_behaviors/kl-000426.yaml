  quote: "Less realistic conversations were described as overly structured, polished, and cognitively organized. They resemble a “coherent story” rather than spontaneous distress, often featuring sophisticated vocabulary and lacking hesitation or disfluency. Annotators also noted that simulated patients are excessively self-reflective and articulate, which was considered implausible in early interactions where real patients tend to struggle with articulation."
