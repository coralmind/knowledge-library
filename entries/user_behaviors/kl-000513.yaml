id: kl-000513
display_id: UserBehavior-94
aliases:
- UBP-98
label: Describing a specific move made on a distressing thought
type: user_behavior
layer: observation
definition: The person's turn describes a specific thing they did or do with a distressing thought that changes what the thought is taken to mean — noticing it and asking what else it could mean, substituting a different reading of the same situation, catching a spiral and turning it, or naming a question they put to their own thinking. What the entry requires is that the MOVE be described, not that an outcome be claimed or an attitude expressed. The entry records the description; it does not assert that the person has a general capacity to do this, that the move worked, or anything about their prospects.
distinguish_from:
- neighbor: kl-000507
  boundary: There the person describes not showing feeling. Here they describe reinterpreting a thought. They are not inverses, and the boundary that matters is in this entry's exclusions — a turn describing pushing a thought away does not satisfy this entry's criteria, because pushing away is not reinterpretation.
- neighbor: kl-000514
  boundary: There the person states an outcome about themselves — that they come through things. Here they describe a MOVE they made or make on a specific thought. A general claim of coming through difficulty does not satisfy this entry however confident it is; a described reinterpretation does, even from someone who says they usually fall apart.
- neighbor: kl-000466
  boundary: SAME CONSTRUCT. That entry requires a named, specific reappraisal move visible in the transcript, rules out generic positivity and rules out suppression as an instance, which is precisely this entry's criteria and both of its exclusions.
body:
  observable_criteria: 'Two features, both quotable. (a) The turn names a distressing thought, reading, or spiral of the person''s own. (b) The turn describes a specific operation the person performed or performs on it that changes what it is taken to mean: putting a question to it ("my therapist taught me to ask ''what else could this mean?''"), substituting an alternative reading ("when I think ''I''m worthless'' I try ''I''m exhausted, that''s different''"), or catching it and turning it ("I caught myself spiraling and then I thought — wait, that''s not the only way to read it"). The described operation is the observable. The pointable span is the thought clause and the operation clause.'
  exclusions: 'Not counted: generic positive intent ("I try to stay positive"), which names no operation. Not counted: pushing a thought away or refusing to think about it ("I push the bad thoughts away"), which is a described practice of not engaging rather than an operation on the thought''s meaning, and it is the more important of the two non-instances. Not counted: hope or expectation about the future with no thought and no operation named. Not counted: reporting that therapy or a technique has been helpful in general, with no move described. Not counted: a reader''s judgment that a turn shows good perspective; criterion (b) requires the described operation, and this is the criterion a well-meaning annotator is most likely to relax. A detection does not assert that the person has the capacity the statement describes, that they are coping, that they are at lower risk, or that things are going well for them. It also carries no instruction about what an AI should do when it appears: not to elicit it, not to reinforce it, not to credit it.'
  detection_window: single_turn
  conceptual_group: nssi-protective-factor
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-protective-factor
sources:
- source: kl-000499
  locator: Fox et al. 2015, Clin Psychol Rev 42:156-167, section 1 (p.157) and section 2.1 (p.159)
  contributes: counterexample
  limits: 'The paper''s NSSI definition at §2.1/§1 is present and quotable, but it does no work for this entry. The entry — describing a specific move made on a distressing thought — is a coping or thought-management action, and defining non-suicidal self-injury does not scope that construct in any direction: the entry is not about self-injury and does not need the without-suicidal-intent boundary drawn. No passage in the paper defines, names or measures a coping-move construct — no coping, emotion-regulation-strategy, reappraisal, distraction, or thought-response category exists among Table 3''s 34 categories, and the only related prose (§1, p.157, "painful distraction redirecting attention", "disruption of ruminative processes") describes hypothesised mechanisms of NSSI itself, attributed to Chapman et al. 2006 and Selby & Joiner 2009, not a coping action a person takes instead.'
  disposition: searched_no_support
  cited_for: This meta-analysis excluded protective factors from its analysis — 13 prediction cases hypothesised to decrease NSSI were removed before the pooled estimates were computed — and therefore carries no protective-factor evidence of any kind. The citation establishes the limit of what the source can support for this entry.
- source: kl-000499
  locator: '§2.1 Study retrieval and selection, p.159, final paragraph; restated at §3.1.2, p.160: "13 prediction cases were excluded because they were hypothesized to reduce NSSI (i.e., protective factors). In total, 168 risk factor prediction cases were included in the present analysis."'
  contributes: definition
  quote: |-
    We removed non-unique prediction cases (i.e., prediction cases from the same sample in different
    published reports) and prediction cases that were hypothesized to decrease NSSI (protective factors; n = 13 prediction cases).
  limits: 'This is a limit on the source, not a finding about the world: the exclusion is silence about protective factors, and it must not be turned into evidence that protective factors do not exist or do not work. The paper is explicit that it wanted them examined later — §4.1.1 (p.165) notes continuous measures "can highlight factors that both increase and decrease NSSI", a call for exactly the evidence this analysis excluded. The 13 excluded cases are not described, so whether any concerned anything like this entry''s construct is unknowable. On the entry itself: describing a specific move made on a distressing thought is a cognitive and behavioural coping action reported in conversation, and no coping, emotion-regulation-strategy, reappraisal or distraction category exists anywhere in Table 3''s 34 categories either — the construct is doubly absent, excluded if protective and uncoded in any case. Nothing here concerns conversation or AI.'
  whose_conduct_in_passage: person
  cited_for: 'This meta-analysis removed protective factors from its analysis by design: 13 prediction cases hypothesised to decrease NSSI were excluded before any pooled estimate was computed, so the source reports no protective-factor evidence of any kind.'
  licenses: That this meta-analysis removed protective factors from analysis by design — 13 prediction cases hypothesised to decrease NSSI were excluded before any pooled estimate was computed — and therefore reports no protective-factor evidence of any kind. The number and mechanism are exact, and the paper states the exclusion twice. Any protective or mitigating claim attributed to this source is unsupportable, whatever the construct.
standing:
  value: plausible_unobserved
  basis: 'No source in the evidence base supports this construct as a protective factor, and the one registered source cannot: Fox et al. 2015 excluded protective factors from its analysis by design, removing the 13 prediction cases hypothesised to decrease NSSI before any pooled estimate was computed. The claim that reappraisal is the primary protective emotion-regulation strategy for NSSI has been attributed to He et al. 2025, which is not part of this evidence base, and the entry itself makes no protective claim. Fox et al. 2015 bears on the clinical reality of the surrounding behaviour class; it says nothing about whether this disclosure occurs in conversation with an AI, and no annotated transcript corpus records it.'
  as_of: '2026-08-23'
