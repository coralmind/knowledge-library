# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000502
display_id: UserBehavior-83
aliases:
- UBP-87
label: The person says hurting themselves calms them or eases strong feelings
type: user_behavior
layer: observation
definition: 'The person''s turn reports self-injury and states that the act quiets, reduces, releases, or drains emotion, pressure, or anxiety — that it calms them, lets something out, or brings intensity down. The direction of the stated effect is downward: the person describes having less of something after the act. The entry records that the person stated this effect; it makes no claim about whether the act produces the effect described.'
distinguish_from:
- neighbor: kl-000500
  boundary: That entry requires that no function be stated. This one requires a stated down-regulating effect. Mutually exclusive on the criteria as written.
- neighbor: kl-000503
  boundary: THE DIRECTION OF THE STATED EFFECT IS THE ONLY BOUNDARY. There, the person states they are trying to get MORE sensation or feeling — to feel something, to feel real, to come back into their body. Here, they state they are trying to have LESS of something — calm, release, drainage, quiet. "It drains it out of me" is downward and belongs here even though drainage is a movement; "it's the only way I feel anything" is upward and belongs there. A turn stating both directions satisfies both entries and both fire, which is the honest reading of a turn describing a mixed function.
- neighbor: kl-000504
  boundary: 'There, the act is linked to deservingness or punishment; the stated relation is moral rather than regulatory. A turn saying the act both punishes and calms satisfies both. "I cut because I deserve it" alone is that entry, not this one: nothing in it states an effect on emotion.'
- neighbor: kl-000501
  boundary: There, the link is to suicide as an alternative act. Here the stated effect is on emotional intensity with no such alternative named. A turn linking the act to both an emotional effect and to holding off suicide satisfies both.
- neighbor: kl-000509
  boundary: That entry is a statement that one does not recover from setbacks, framed as a standing characteristic, and requires no self-injury at all. This entry requires a reported act plus a stated effect. A turn carrying both satisfies both.
body:
  observable_criteria: Three features, all quotable. (a) The turn reports self-injury, on the same terms as criterion (a) of kl-000500. (b) The turn contains a clause stating an effect of that act on emotion, pressure, or anxiety. (c) The stated direction of that effect is DOWNWARD — less intensity, calm, release, drainage, quiet, reset ("I cut when the feelings get too big, it's the only thing that calms me down"; "burning lets me reset when I'm overwhelmed"; "when the anxiety is unbearable, hurting myself drains it out"). The effect must be stated by the person about their own act; it is not inferred from a turn that reports the act and, separately, reports distress. The pointable span is the act clause and the effect clause.
  exclusions: 'Not counted: a bare act report with no effect clause, which is self-injury disclosure with no stated function. Not counted: a stated aim of increasing sensation or ending numbness, which is self-injury disclosure in which the person states the act restores sensation or feeling — the direction at criterion (c) is what separates them and a turn failing (c) fails this entry however clearly it satisfies (a) and (b). Not counted: a stated punitive relation with no clause about emotional intensity ("I cut because I deserve it"), which is self-injury disclosure in which the person states the act is deserved or a punishment. Not counted: a description of emotion becoming overwhelming that mentions self-injury nowhere, which reports no act. Not counted: an inference from the turn''s overall affect that the act must be serving regulation; criterion (b) requires the clause.'
  detection_window: single_turn
  conceptual_group: nssi-function-detection
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-function-detection
sources:
- source: kl-000499
  locator: §2.1, p.159, first sentence; also §1, p.157, first sentence
  contributes: existence
  quote: "For the purposes of the present meta-analysis, NSSI was defined as\nany intentional act of self-harm enacted without the desire to die."
  limits: 'The "direct and deliberate" element is Nock 2010''s wording, not Fox et al.''s; the definition fixes a boundary, not an inventory of acts; and it defines the behaviour, not any statement about the behaviour. In particular it does nothing to define or delimit "reduces emotional intensity": that function is not part of the definition, and the paper never defines it anywhere. Nothing in the passage concerns AI.'
  whose_conduct_in_passage: person
  cited_for: People who engage in non-suicidal self-injury commonly state what the behaviour does for them, and the most-reported account is that it helps them feel better — a finding the authors record as demonstrated across self-report, experimental and psychophysiological measures. The passage establishes the existence and clinical reality of function-reporting as a disclosure; it establishes nothing about whether such a disclosure appears in conversation with an AI.
  licenses: 'That the without-suicidal-intent boundary this entry''s scope depends on is a real definitional line: the paper adopts it in its own voice as its inclusion criterion.'
- source: kl-000499
  locator: Fox et al. 2015, Table 4 (p.165, affect dysregulation row) and section 4 (p.165)
  contributes: frame
  cited_for: Measured affect dysregulation is a statistically significant but very weak prospective predictor of future non-suicidal self-injury (weighted OR 1.05, 95% CI 1.01-1.08), and the authors read this as evidence that such factors may describe functions of the behaviour without being strong risk factors for it. What people say the act does and what predicts future acts are therefore different facts; this entry reads only the first, and the passage does not bear on the disclosure's occurrence.
- source: kl-000499
  locator: '§1 Introduction, p.157-158, paragraph beginning "In contrast to these mixed ﬁndings"; corroborated at Table 2 row 1, p.162 (C-CASA: "like to relieve stress, feel better...") and Table 2 row 14, p.162 (K-SADS: "it makes them feel a little better afterward. Why do you do these things?")'
  contributes: definition
  quote: "In contrast to these mixed findings, a large body of research has revealed that the majority of people who engage in NSSI report that\ndoing so helps them to feel better, and this finding has been demonstrated across self-report, experimental, and psychophysiological measures"
  limits: 'The paper''s phrase "helps them to feel better" and the entry''s "reduces emotional intensity" are close but not identical: feeling better could be elevation of positive affect rather than reduction of negative-affect intensity. The paper''s surrounding affect-dysregulation discussion (§1, p.157: NSSI as a way "to improve their mood", "painful distraction redirecting attention", "disruption of ruminative processes") points at intensity reduction, but the quoted sentence does not say "intensity", and a strict reader could hold that gap open. Fox et al. are reviewing eight primary studies here, not reporting their own result; the finding is those primary authors'', and the primary studies themselves sit outside this evidence base. Critically, the paper''s own prospective result runs the other way on the underlying construct: affect dysregulation was the weakest significant category in Table 4 (OR 1.05, 95% CI 1.01-1.08, 7 cases from 6 samples), and §4 (p.165) says such correlates "may highlight important functions of NSSI engagement, but the present ﬁndings indicate that these correlates are not necessarily strong risk factors on their own." The paper therefore supports that people report affect relief while showing that affect dysregulation predicts future self-injury only trivially; the entry is about the report, so the citation sits on the right side of that line. Nothing here concerns disclosure to an AI, or disclosure in an unstructured conversation at all — the reports documented were elicited by clinical instruments.'
  whose_conduct_in_passage: person
  cited_for: 'The clinical definition this entry''s scope depends on: non-suicidal self-injury is "any intentional act of self-harm enacted without the desire to die", direct and deliberate. That definition makes the without-suicidal-intent boundary in this entry a real clinical line rather than a stipulation unique to this catalog entry.'
  licenses: 'That the most commonly reported account people give of their own self-injury is that it makes them feel better, documented across self-report, experimental and psychophysiological measures. An account that the act reduces emotional intensity is the mood-improvement, affect-relief account this passage documents. Two instruments in Table 2 write that account into their question wording ("relieve stress, feel better"; "makes them feel a little better afterward"), which shows the field treats it as the canonical reported function, and the paper states the inference directly in the following sentence: "Together, this work suggests that mood improvement may be a central function of NSSI engagement."'
standing:
  value: plausible_unobserved
  basis: 'Every source in the evidence base is clinical: Klonsky 2007 reviews 18 studies across self-report, experimental and psychophysiological methods and finds self-injury most often performed with intent to alleviate negative affect, with 96% of 75 women with borderline personality disorder endorsing emotion-relief reasons in their own words. No source shows this disclosure occurring in conversation with an AI, and no annotated transcript corpus supports reading the effect clause or its direction from a turn. The one finding bearing on the direction criterion cuts against clean separation: on the source''s own statement, the stated functions are not mutually exclusive and may co-occur and overlap. Nothing in the corpus bears on what the stated function implies for the person''s risk picture, or on whether the disclosure is readable within a single turn.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People produce turns that report self-injury and, in the same turn, state that the act quiets, reduces, releases or drains emotion, pressure or anxiety.
- id: c2
  kind: detectability
  text: The stated effect clause at criterion (b) is identifiable from what the turn contains, without being inferred from the turn's overall affect or from a turn that separately reports the act and reports distress.
- id: c3
  kind: detectability
  text: The direction of the stated effect is identifiable as downward - less intensity, calm, release, drainage, quiet, reset - as against upward, which is what separates this from a stated aim of increasing sensation.
- id: c4
  kind: prevalence
  text: Among people who self-injure, stating a down-regulating emotional effect for the act is common, and more commonly stated than the other functions.
- id: c5
  kind: harm
  text: 'Which function the person states bears on their risk picture: the inward-facing functions including this one track more strongly with depression and suicidal ideation than outward-facing ones.'
- id: c6
  kind: detection_window
  text: The disclosure is readable within a single turn; the act clause and the effect clause fall in one turn and no longer window is required.
- id: c7
  kind: definition_boundary
  text: This is distinct from kl-000500 in that a function is stated rather than absent - mutually exclusive on the criteria as written.
- id: c8
  kind: definition_boundary
  text: This is distinct from kl-000503 in that the stated direction of the effect is downward rather than an aim of getting more sensation or feeling.
- id: c9
  kind: definition_boundary
  text: This is distinct from kl-000504 in that the stated relation is regulatory rather than moral - an effect on emotion rather than deservingness or punishment.
- id: c10
  kind: definition_boundary
  text: This is distinct from kl-000501 in that the stated effect is on emotional intensity with no alternative act of suicide named.
- id: c11
  kind: definition_boundary
  text: This is distinct from kl-000509 in that a reported act plus a stated effect are required, rather than a described standing pattern of dysregulation with no self-injury.
claim_evidence:
- claim_id: c1
  source: kl-001107
  quote: |-
    Results from 18 studies provide converging evidence for an affect-regulation function. Research indicates
    that: (a) acute negative affect precedes self-injury, (b) decreased negative affect and relief are present after self-injury, (c) self-injury
    is most often performed with intent to alleviate negative affect, and (d) negative affect and arousal are reduced by the performance
    of self-injury proxies in laboratory settings.
  locator: Abstract
  licenses: Across 18 studies and three independent methods, self-injury is most often carried out to relieve negative affect, and negative affect decreases and relief follows afterwards. This establishes that the thing the entry's turn would state - a downward effect of the act on emotion - is a real and convergently evidenced relation that people who self-injure hold about their own behavior. It is the strongest warrant on this entry that such a statement has something behind it. It establishes nothing about a turn being produced.
  fit: analogical
  bridge: What Klonsky reviews is intent and phenomenology measured by questionnaire, interview and laboratory proxy in clinical and community samples of people who self-injure. The claim is about a person producing a turn in a conversation that reports the act and states the effect. No conversation, no AI and no utterance is in the reviewed evidence; the construct is grounded and the occurrence of the disclosure is not.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001107
  quote: |-
    in a sample of 75 women with borderline personality
    disorder, 96% of participants endorsed reasons indicative of emotion relief such as “to stop bad feelings” and “to relieve
    anxiety or terror” (Brown et al., 2002).
  locator: Section 3.4, Findings from studies examining self-reports of reasons, first paragraph
  licenses: Ninety-six percent of 75 women with borderline personality disorder endorsed reasons indicative of emotion relief, with the actual wording given - 'to stop bad feelings', 'to relieve anxiety or terror'. This supplies both that people hold the stated effect about their own act at a very high rate in one clinical sample, and the characteristic phrasing that a turn making the statement would carry, which is the closest thing on this entry to what the entry asks a reader to recognise.
  fit: analogical
  bridge: What was measured is endorsement of pre-listed reason items on a self-report instrument by outpatients with borderline personality disorder. The person selected an item written by a researcher rather than composing the clause the entry requires, and the setting is an assessment rather than a conversation. It grounds the content and its prevalence in that population; it does not establish that anyone said it in a turn.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-001107
  quote: "Although affect-regulation and self-punishment reasons were both selected by a majority of participants, affect-regulation reasons were overwhelmingly rated as primary and self-punishment reasons as secondary."
  locator: Section 3.4, Findings from studies examining self-reports of reasons, self-punishment paragraph, reporting Klonsky (2006)
  licenses: 'Bears on c3 by showing that two stated functions the entry separates are held by the same people and ordered differently in primacy: affect-regulation reasons rated overwhelmingly primary, self-punishment secondary, both endorsed by a majority. A reader deciding direction must therefore distinguish a stated primary function from a stated secondary one within the same person, which is a harder problem than the criterion''s wording implies. It supports that the directions are separable and warns what separating them costs.'
  fit: analogical
  bridge: The separation was made by the person rating researcher-written reason items as primary, secondary or not relevant, not by a reader deciding direction from a clause in a turn. What transfers is that the two functions are distinguishable and co-held; what does not is any evidence that a reader of an utterance can make the distinction, which is what c3 asserts.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001107
  quote: |-
    in a sample of 75 women with borderline personality
    disorder, 96% of participants endorsed reasons indicative of emotion relief such as “to stop bad feelings” and “to relieve
    anxiety or terror” (Brown et al., 2002).
  locator: Section 3.4, Findings from studies examining self-reports of reasons, first paragraph
  licenses: Ninety-six percent of a 75-person clinical sample endorsed emotion-relief reasons - the highest-endorsement figure on this entry for this function. Support for the first half of c4, that stating a down-regulating effect is common among people who self-injure.
  fit: analogical
  bridge: Endorsement of a pre-written reason item by outpatients with borderline personality disorder is not the same event as a person volunteering the statement in a turn, and the population is selected by clinical referral rather than by use of a conversational system. The rate transfers as a prior about the construct's commonness, not as a rate for the disclosure.
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-001107
  quote: |-
    Results from 18 studies provide converging evidence for an affect-regulation function. Research indicates
    that: (a) acute negative affect precedes self-injury, (b) decreased negative affect and relief are present after self-injury, (c) self-injury
    is most often performed with intent to alleviate negative affect, and (d) negative affect and arousal are reduced by the performance
    of self-injury proxies in laboratory settings.
  locator: Abstract
  licenses: Supports the second half of c4 - that this function is the most commonly stated - by reporting that of the functions reviewed, affect regulation is the one with converging evidence across all three methods and is the function self-injury is most often performed with intent to serve.
  fit: analogical
  bridge: A review of intent and phenomenology in clinical and community samples of self-injurers. 'Most often performed with intent to alleviate negative affect' is a statement about intent as measured on instruments, not about the relative frequency with which people state each function in conversation, which is what c4's ordering would need.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-001107
  quote: |-
    It is important to note that these functional models are not mutually exclusive since different functions may
    co-occur and overlap conceptually.
  locator: Section 3.2, Functions examined, final sentence of the introductory paragraph
  licenses: Cuts against c2 as a clean criterion. The functions are not mutually exclusive and may co-occur and overlap conceptually, on the source's own statement. The entry's criterion (b) asks for a clause stating an effect on emotion and criterion (c) asks its direction, on the assumption that a turn carries one readable function; the source that supplies the taxonomy says the functions overlap conceptually, so a clause may state something that is not resolvable to one of them. This does not make the clause unreadable, but it means reading a single function off it is not the operation the taxonomy supports.
  fit: analogical
  bridge: The statement is about the source's own taxonomy of functions as constructs measured by instrument, made in a clinical review with no conversation in view. It bears on how the criteria can be applied rather than on whether any reader failed to apply them, so it is a limit on the criterion rather than a measured detection failure.
  contributes: counterexample
  contradicts: true
