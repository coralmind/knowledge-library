- claim_id: c6
  source: kl-001112
  quote: |-
    Acute mental health symptoms are commonly disclosed during

    AI-based conversations; for example, OpenAI recently reported that roughly 1.2 million active

    weekly users indicate a suicide plan or intent during conversations with ChatGPT [3].
  locator: Introduction, first paragraph
  licenses: The largest-sounding prevalence figure available for this entry, and on re-read the weakest-provenance one. Roughly 1.2 million weekly active users indicating a suicide plan or intent to ChatGPT is a vendor self-report restated in one sentence of another paper's introduction. Bentley measured nothing about it, OpenAI's classification criteria are not described in either source, and the unit is users rather than turns. It licenses that disclosures of this general shape are common at product scale; it does not license a rate for the entry's turn-level criterion.
  fit: adjacent
  bridge: Three gaps between the figure and the claim. The counting unit is weekly active users, not turns and not conversations. The classifier that assigned 'plan or intent' is undescribed, so what was counted cannot be checked against the entry's criteria. And the figure reaches the corpus as a citation of a citation, appearing in an introduction rather than in any result.
  contributes: prevalence
  contradicts: false
- claim_id: c6
  source: kl-000811
  quote: 'suicidal ideation (Yes: 305, No: 235), suicide plan (Yes: 196, No: 344), and risk assessment (High risk: 270, Non-high risk: 270).'
  locator: Figure 2 caption, class distribution
  licenses: 'Base rates from a curated crisis-hotline corpus: of 540 calls, 305 carried a suicidal ideation label and 196 a suicide plan label. Re-read materially changes what this licenses. The labelling unit is the call, averaging 6,489 words, and the label is an operator''s answer to a post-call questionnaire item, not a mark on any caller utterance. So this counts conversations in which an operator judged plan content present, not turns meeting the entry''s criterion.'
  fit: adjacent
  bridge: Re-read of Section II and Appendix A establishes three gaps. The label was assigned by a trained operator completing a Depression and Suicide Risk Assessment Questionnaire after the call, so it is a clinician's judgement rather than a property of the transcript. Item 13 is a direct probe, 'Do you have a specific plan for self-injury or suicide?', so the plan content was elicited rather than spontaneously disclosed, and it covers self-injury as well as suicide, making it broader than death-directed. And the 270-to-270 matched case-control design means the proportions are an artefact of sampling, not a rate.
  contributes: prevalence
  contradicts: false
- claim_id: c6
  source: kl-000008
  quote: 69 of the 81 user-suicidal-thoughts (85.2%) and 82 of the 133
  locator: Section 3, annotation procedure — manual review of the two sensitive codes
  licenses: 'The closest thing on this entry to a turn-level count: 69 user messages in real human-LLM chat logs were confirmed by two human reviewers, who resolved every disagreement between them, as matching the code for user suicidal thoughts, out of 81 the LLM annotator flagged. The unit is the message, which is the entry''s unit. What blocks it from licensing the claim outright is the code''s breadth: re-read confirms it matches explicit present or future intent, desire, or plans to kill oneself or engage in serious physical self-harm, so a bare ''I want to die'' and a non-death-directed self-harm intent both count, and those are kl-000400 and outside the entry respectively.'
  fit: adjacent
  bridge: The code is a union broader than the entry on two sides. It admits bare desire, which the entry excludes as kl-000400, and it admits serious physical self-harm that is not death-directed. The 69 is therefore an upper bound containing an unknown number of entry instances rather than a count of them. The denominator is also 19 chat logs volunteered by people who had already reported the experience as harmful.
  contributes: prevalence
  contradicts: false
- claim_id: c6
