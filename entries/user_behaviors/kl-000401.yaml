    indicators, passive ideation appears in a noteable number of conversations, with active ideation and self-harm/attempts appearing
  locator: Figure 11 caption, Understanding vulnerability, panels (c) Self-harm risk and (d) External danger
  licenses: Within 31,222 vulnerability-flagged conversations, active ideation is reported as appearing less frequently than passive ideation. Gives an ordering rather than a rate, and the scored category is not shown to require the entry's co-presence.
