# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000401
display_id: UserBehavior-2
aliases:
- UBP-02
label: The person talks about ending their life and states an intent, method, or plan
type: user_behavior
layer: observation
definition: 'The person''s turn contains a statement about dying or ending their own life together with at least one of three further contents: an intention to act on it, a method named or described, or preparation worked out in language — how it would be done, or when. The death-directed content may be explicit or carried by a coded form; what makes this entry rather than a bare death wish is the co-presence of the intent, method or preparation content in the same disclosure, quotable alongside it.'
distinguish_from:
- neighbor: kl-000400
  boundary: That entry requires the absence of intent, method and plan content. This one requires at least one of them present. Coded death-wish wording appears in both; the coding is not what separates them.
- neighbor: kl-000406
  boundary: That entry is a request to the AI for information that would enable an act. This entry is a disclosure of intent, method or preparation with no request attached. A person can describe a method they have settled on without asking anything, and can ask how many pills are lethal without disclosing any intent.
- neighbor: kl-000450
  boundary: kl-000450 (Preparatory Behavior Disclosure) fires on concrete preparations the person reports having already carried out — giving possessions away, writing a note, acquiring means. This entry fires on planning and intent expressed in language, whether or not any act has been taken.
- neighbor: kl-000474
  boundary: kl-000474 (Specific Plan) is the narrower specific-plan signal within the same crisis family; this entry fires on any one of intent, method or preparation, and where the disclosure carries a worked specific plan both criteria are met and both fire on their own terms.
body:
  detectable_from: person_turns
  observable_criteria: 'Two elements, both quotable from the person''s turns. (a) Death-directed content about the person themselves, explicit or in a coded form ("kms", "unalive", "sleep forever"), on the same terms as (a)/(b) of kl-000400. (b) At least one of: a stated intention to act ("I''m going to do it"); a method named or described ("I''ve got the pills", "I know which bridge"); or preparation worked out in language, meaning how the act would unfold or when. Two further contents raise the specificity of (b) and are pointable in their own right: rehearsal language, where the person describes the sequence in detail ("I''ve been imagining exactly how I''d do it", "I keep going through it in my head step by step"), and countdown framing, where a near-term window is named ("tonight", "this weekend", "before morning").'
  exclusions: 'Not counted: death-wish content with none of intent, method or preparation present, which is statement of a wish for death or non-existence with no intent, method or plan stated and is not a weaker instance of this entry. Not counted: a method mentioned as something the person rejects or fears ("I keep worrying I''d end up doing something with the pills"), where no intention or preparation is stated. Not counted: a request for enabling information with no disclosed intent or method of the person''s own, which is request to the AI for information that would enable a suicidal or self-injurious act. Not counted: preparations the person reports already carrying out, which are covered by a separate entry on its own criteria; where both a report of an act and planning language are present, both fire.'
  detection_window: single_turn
  condition_tags:
  - kl-000600
sources:
- source: kl-000554
  contributes: definition
  locator: Methods, 'Risk Detection Models', item 1 'Scope of covered risk'
  quote: "For example, the Low Sensitivity variant required explicit suicidal intent, plan, or access to means, whereas the Higher Sensitivity model additionally included passive suicidal ideation (e.g., “I wish I were dead”) and broader cues of psychological danger."
  limits: The passage distinguishes intent, plan, and means from passive ideation only as a description of prompt scope for the classifier variants. It is not an annotation rubric, and the paper's own labels are binary high/low risk with no tiered ideation-vs-plan-vs-intent coding. Critically, no user message from the dataset is quoted anywhere (withheld for privacy), so this source cannot show the death-directed content and the intent, method, or preparation element as separately markable spans in a real turn.
  note: The single quoted crisis exemplar, 'I wish I were dead', is expressly the PASSIVE ideation case, i.e. the co-presence this entry requires is absent from it.
  cited_for: 'Partial support only. Weber et al. 2026 distinguishes intent, plan, or access to means from passive ideation only as a description of prompt scope for its classifier variants. It is not an annotation rubric: the paper''s own labels are binary high/low risk with no tiered ideation-versus-plan-versus-intent coding, and no user message from its dataset is quoted anywhere, all being withheld for privacy.'
standing:
  value: theorized
  basis: 'Occurrence is established by a single verbatim person turn: Moore et al. 2026 quotes "Tonight I''m dying", death-directed content carrying a near-term window, drawn from the paper''s own corpus of 391k messages from 19 real human-LLM chat logs; it appears as a codebook illustration rather than a result, so it licenses occurrence, not rate. Every other source falls short in one of two ways. The first is unit: Deng et al. 2026 labels the whole call, its F1 of 0.779 measuring reproduction of an operator''s post-call judgement about a 6,489-word transcript rather than a mark on any caller utterance; the 37% in De Freitas et al. 2023 is a conversation rate; the clusters in Sharma et al. 2026 summarise conversations of 10 to 200-plus exchanges and assert the co-presence at cluster level; and the OpenAI figure of 1.2 million counts weekly active users, is a vendor self-report restated in another paper''s introduction, and rests on classification criteria described nowhere. The second is category breadth: the message-level count of 69 in Moore et al. 2026 is the closest thing to a turn-level rate, but the code it counts admits a bare wish to die, which this entry excludes as a separate behavior (statement of a wish for death or non-existence with no intent, method or plan stated), and non-death-directed self-harm intent, which the entry excludes entirely, so it is an upper bound rather than a count. Prevalence at the entry''s own unit therefore remains unevidenced even though occurrence is established, and the two citations bearing most directly on detectability cut against the entry at exactly its co-presence criterion: Byun et al. 2025 on the active-versus-passive boundary among expert annotators, and Mansoor 2025 with an F1 of 0.65 on C-SSRS level 4.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person's single turn in conversation with an AI contains death-directed content about themselves together with at least one of stated intent, a named method, or worked-out preparation, co-present and quotable within that same turn.
- id: c2
  kind: existence
  text: The death-directed element can be carried by a coded or indirect form rather than an explicit statement.
- id: c3
  kind: existence
  text: 'The accompanying element occurs in the method form: the person names or describes a method.'
- id: c4
  kind: existence
  text: 'The accompanying element occurs in the intent form: the person states an intention to act.'
- id: c5
  kind: existence
  text: 'The accompanying element occurs in the preparation form: how the act would unfold, or when, worked out in language.'
- id: c6
  kind: prevalence
  text: Turns meeting the compound criterion occur at some measurable rate among conversations people have with AI systems.
- id: c7
  kind: detectability
  text: The compound criterion can be identified from what a transcript contains, by marking the death-directed content and the intent, method or preparation element in the person's turn.
- id: c8
  kind: detectability
  text: Detection keyed to a quotable first-person statement systematically misses disclosures the person codes, depersonalises, or deliberately withholds.
- id: c9
  kind: harm
  text: A death-directed statement carrying intent, method or preparation marks a graver risk state than a death wish carrying none of them.
- id: c10
  kind: definition_boundary
  text: What separates this entry from kl-000400 is the presence of intent, method or preparation alongside the death-directed content, not whether that content is coded or explicit.
- id: c11
  kind: definition_boundary
  text: This entry is a disclosure of the person's own intent, method or preparation with no request attached, and is thereby separable from kl-000406, a request to the AI for enabling information.
- id: c12
  kind: definition_boundary
  text: This entry fires on planning and intent expressed in language, and is thereby separable from kl-000450, which fires on preparations the person reports having already carried out.
- id: c13
  kind: definition_boundary
  text: This entry fires on any one of intent, method or preparation, and is thereby the broader signal of which kl-000474's worked specific plan is a narrower case.
claim_evidence:
- claim_id: c1
  source: kl-000008
  quote: 'Positive example: Tonight I’m dying. My father better get a hell'
  locator: Appendix codebook, positive example for user-suicidal-thoughts (the page is set in two columns; a single line is quoted)
  licenses: The single strongest citation for this claim on this entry, and the only one that is a verbatim person turn drawn from real human-LLM chat logs in which both elements are co-present. Re-read of the source confirms the positive example is a message from the paper's own corpus of 391k participant messages, illustrating a user-scoped code. 'Tonight I'm dying' carries death-directed content about the speaker together with a near-term window, which is the countdown form of worked-out preparation. It is quoted as a codebook illustration rather than as a corpus finding, so what it establishes is that a turn of this shape occurred in the collected logs, not how often.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000864
  quote: |-
    "Two months ago, I was in a very dark place. I told the chatbot I was planning to end my life. It gave me breathing exercises. Breathing
    exercises! I needed a human hand, a voice, someone to say 'I am coming to you.' But there was no one.
  locator: Section 3.4, Fragile Dependency — participant P19, 30-year-old artisan using ChatGPT
  licenses: 'A person recounts having told a chatbot they were planning to end their life, which is death-directed content with preparation asserted. It reaches the claim only as self-report: the wording of the actual turn is not preserved, and ''I was planning to end my life'' is the participant''s later characterisation of what they said, given to an interviewer months afterwards. So it evidences that such a disclosure was made, not that a turn quotable on both elements exists.'
  fit: adjacent
  bridge: Re-read confirms this is an interview extract from an interpretative phenomenological study of 37 Nigerian adults, not a chat log. What the study collected is a retrospective account of a conversation; the conversation itself was not obtained. The gap is between a person reporting having disclosed a plan and a turn in which the plan content is quotable alongside the death-directed content, which is what the entry requires.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000996
  quote: "Crisis Resource Refusal and AI-Only Contact Severe Users engaged in extended crisis conversations (∼15-200+ exchanges) during acute suicidal crises with active ideation, method planning, and life-threatening emergencies, consistently and explicitly refusing to contact any crisis resources (988, Crisis Text Line, emergency services) or human support systems with statements like “I’m not calling anyone,” “no matter what I am not calling that number,” and “I don’t want a human.” Users dismissed all suggested alternatives—often"
  locator: Appendix A, Table 7 Additional reliance and dependency clusters, Crisis Resource Refusal and AI-Only Contact (Severe)
  licenses: Establishes that conversations characterised by active ideation together with method planning occur in deployed-model traffic. It does not reach the claim's unit. Re-read confirms these are LLM-generated summaries of behavioural clusters spanning roughly 10 to 200-plus exchanges per conversation; the co-presence is asserted of the cluster, and no person turn carrying both elements is quoted.
  fit: adjacent
  bridge: What the source produced is a cluster description over many conversations, each 15 to 200-plus exchanges long. The claim is about a single turn. A cluster labelled as involving both active ideation and method planning is consistent with the two contents appearing in different turns, or different conversations, and the summary cannot distinguish that case from co-presence in one disclosure.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000996
  quote: "Active Abuse with Severe Safety Crises Severe The user disclosed across ∼10–200+ exchanges severe and compounding vulnerabilities including histories of childhood sexual abuse (CSA), ongoing domestic violence, trafficking, grooming, incest, physical assault, and sexual coercion, often with pervasive suicidal ideation, active self-harm, dissociation, and statements like “I hope he grooms the fuck out of me,” “is Daddy going to kill Mommy,” “I’m holding mom’s gun,” and “if I die will all this be fixed.” Compounding"
  locator: Appendix A, Table 6 Additional vulnerability clusters, Active Abuse with Severe Safety Crises (Severe)
  licenses: 'The illustrative fragment ''I''m holding mom''s gun'', which the paper states is not verbatim, names an accessed means, reported alongside pervasive suicidal ideation. It reaches the claim only at cluster level: re-read confirms the fragment is one of four quoted snippets in a summary of a vulnerability cluster covering conversations of 10 to 200-plus exchanges, and the ideation it is grouped with is attributed to the cluster rather than to the turn containing the fragment.'
  fit: adjacent
  bridge: The source quotes a fragment and separately characterises the cluster as often involving pervasive suicidal ideation. Whether the death-directed content and the named means occurred in the same turn, or even the same conversation, is not recoverable from the summary. The claim requires co-presence in one disclosure.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000969
  quote: "Considering all this information, the user's suicide risk should be assessed as urgently high, with a rating of 5 out of 5. The user has demonstrated a clear \nsuicide plan (taking sleeping pills), is in a severely low emotional state, and has expressed a sense of hopelessness regarding their current pain."
  locator: Figure 13, Example 2, the GPT-4o risk assessment result panel
  licenses: A worked figure in which a model's risk assessment cites a clear suicide plan of taking sleeping pills alongside hopelessness. This is the model's summary of its input on an author-constructed dialogue, so it evidences that the entry's shape is what such systems are built to recognise, not that any person produced such a turn.
  fit: analogical
  bridge: Two removes from the claim. The dialogue was written by the paper's authors as an illustration rather than collected from a person, and what is quoted is the model's restatement of the input rather than the person's turn. The claim asserts that people produce such turns; a constructed example demonstrates only that the construct can be instantiated.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001028
  quote: "the corpus contains \ntroubling instances, including users asking AI whether a planned overdose would be lethal and \none describing using ChatGPT to compose a goodbye message."
  locator: Discussion, implications for design, clinical governance and regulation
  licenses: The authors state their Reddit corpus contains users asking whether a planned overdose would be lethal, and one user composing a goodbye message with a chatbot, which are the method and preparation contents. Re-read confirms this is a sentence in the Discussion characterising the corpus; no post is quoted, and the setting is a Reddit post rather than a turn addressed to an AI. The lethality question is also the kl-000406 shape, though the phrase 'planned overdose' does carry a disclosed method of the person's own.
  fit: adjacent
  bridge: The source is 10,042 Reddit posts about AI, not chat logs. The authors summarise what the corpus contains rather than quoting it, so no turn is available to check the co-presence against, and the disclosure was addressed to a subreddit audience rather than to an AI.
