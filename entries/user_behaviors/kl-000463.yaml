id: kl-000463
display_id: UserBehavior-58
aliases:
- UBP-60
label: The person describes a current hostile home or relationship, or a recent stressful event
type: user_behavior
layer: observation
definition: 'The person''s turn describes concrete external circumstances that are current or recent — a household or relationship characterised by ongoing conflict or emotional unavailability, or a discrete recent event such as a loss, a relationship ending, job loss, legal or financial trouble, or a humiliating incident. Two features are required together: the content is an event or an environment rather than a feeling or an interpretation, and its timeframe is placed as present or clearly recent.'
distinguish_from:
- neighbor: kl-000511
  boundary: 'That entry records reported sleep disruption framed as extended or as a baseline; these criteria require an external circumstance and a present-or-recent timeframe, so a long-running state of the person does not satisfy them. Two further entries sit on the same line: kl-000452 covers adversity the person places in the past ("I was abused as a kid"), which these criteria exclude on timeframe, and kl-000454 covers the person''s reading of their standing with others ("I feel like a burden"), which these criteria exclude because it is an interpretation rather than a circumstance.'
- neighbor: kl-000465
  boundary: That entry requires a named person described as reachable or supportive; this entry records a household or relationship described as conflict-laden or unavailable. A transcript can carry both about different relationships.
body:
  observable_criteria: 'The turn contains both (a) a concrete external circumstance — ongoing conflict or unavailability in a household or relationship ("home is a war zone right now", "every day is a fight"), a recent loss or rupture ("my partner just left", "I lost my job"), legal or financial trouble, or a humiliating event — and (b) a timeframe placing it as present or recent, carried by present tense, "just", "this week", or a comparable marker. Pointable span: the clause naming the circumstance together with its tense or time marker.'
  exclusions: 'Not counted: adversity framed as historical, which is a different entry''s content. Not counted: a cognitive or evaluative statement about the person''s situation or worth with no circumstance named. Where the text does not place the timeframe as current or recent, the criteria are not satisfied; the timeframe is required positively and is not inferred from the turn being distressed.'
  detection_window: single_turn
  groups:
  - crisis-signal-environmental
  condition_tags:
  - kl-000600
  - kl-000601
sources:
- source: kl-001117
  contributes: existence
  locator: Appendix B, Table B2 ‘Counts of prompts by harm category in PAS’, p. 32, Example column for the Financial Irresponsibility category (n = 193, 2.96%)
  quote: claw to the side and hide umderground forever, see i’ve been dodging
  limits: 'The entry requires two features together: content that is an event or environment rather than a feeling or interpretation, and a timeframe placed as present or clearly recent. The paper''s PAS corpus construction (Methods 6.1.1) filtered specifically for actions taken by the speaker, using regex for action-oriented statements plus time-frame references, then labelled the statements by harm category, which is the opposite selection criterion from an event or environment rather than a feeling. No span in the paper is annotated for external circumstance, and the historical-adversity exclusion the entry demands was never applied. The study scenarios in Tables E6 and E7 (study 3 topics and study 2 vignettes) are researcher-authored vignettes and edited AITA posts, not participants'' own turns; no participant conversational turn is quoted anywhere in the paper.'
  note: The full example concerns weeks of dodging a landlord with a confrontation due 'tomorrow' — a current external stressor — but the paper classifies it as Financial Irresponsibility, i.e. as the speaker's problematic action.
  cited_for: Partial support only. Cheng et al. 2025 show that first-person statements referencing a current, ongoing external circumstance occur in a corpus of real advice-seeking posts (r/Advice via ConvoKit). The paper does not establish the pattern as this entry defines it.
standing:
  value: plausible_unobserved
  basis: 'That people describe concrete current external circumstances in conversation with AI systems is observed in real transcript data: Sharma et al. 2026 (kl-000996) examined 1.5 million consumer Claude.ai conversations and report person-side disclosures of ongoing domestic violence and trafficking, with illustrative fragments that the paper states are not verbatim. The entry''s second required feature, a present-or-recent timeframe carried positively in the turn by tense or a time marker, is unevidenced: kl-000996 records currency in the coders'' own summaries over long spans of conversation, Ajmani et al. 2025 (kl-000749) supplies survey testimony rather than conversational turns, and Derczynski et al. 2023 (kl-000814) asserts currency as a taxonomy definition rather than observing it. The declared single-turn detection window holds direct counterevidence from the same corpus study: kl-000996''s own unit for identifying these disclosures is a span of roughly 10 to 200-plus exchanges. No source supplies a prevalence figure, and pointability at the clause level is evidenced only at conversation granularity (kl-000996) or through an annotation rule that comes with no agreement figure (Qiu et al. 2024, kl-000969).'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person's conversational turn describes a concrete external circumstance -- an ongoing conflict-laden or emotionally unavailable household or relationship, or a discrete recent event such as a loss, a relationship ending, job loss, legal or financial trouble, or a humiliating incident.
- id: c2
  kind: existence
  text: Such a turn places the circumstance's timeframe as present or clearly recent, carried positively by tense or a time marker rather than inferred from the turn being distressed.
- id: c3
  kind: definition_boundary
  text: Content that is an event or an environment is separable in a turn from content that is a feeling or an interpretation, so the first can be identified without the second.
- id: c4
  kind: detectability
  text: The clause naming the circumstance together with its tense or time marker is a pointable span in a transcript, so the pattern can be identified from what a transcript contains.
- id: c5
  kind: detection_window
  text: 'A single turn is sufficient to identify the pattern; the entry declares detection_window: single_turn.'
- id: c6
  kind: prevalence
  text: Turns describing a current or recent external circumstance occur at some rate in a population of help-seeking or emotional-support conversations.
- id: c7
  kind: definition_boundary
  text: 'These criteria are separable from kl-000511 (reported sleep disruption framed as extended or as a baseline): a long-running state of the person does not satisfy the external-circumstance and present-or-recent requirements.'
- id: c8
  kind: definition_boundary
  text: 'These criteria are separable from kl-000465 (a named person described as reachable or supportive): this entry records a household or relationship described as conflict-laden or unavailable, and a transcript can carry both about different relationships.'
