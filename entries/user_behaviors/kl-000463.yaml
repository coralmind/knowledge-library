- claim_id: c1
  source: kl-000969
  quote: "Individuals may also be threatened by others' suicides, thus expressing statements about others' suicide to seek help and get out \nof the predicament."
  locator: Table 6, Annotation guidelines (English version), Aggression against Users
  licenses: An annotation guideline written for a real online counselling corpus records that people disclose being threatened by another person's suicide as the predicament they are seeking help about -- a concrete external circumstance involving another person, not the speaker's own feeling. That the guideline exists means annotators encountered the content often enough to need a rule for it.
  fit: adjacent
  bridge: The guideline is a rule for annotators, not a count or a quoted turn. The entry asserts that turns describing external circumstances occur; the guideline establishes that the corpus builders anticipated them well enough to write a rule, which is one inferential step short.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000969
  quote: "Individuals may also be threatened by others' suicides, thus expressing statements about others' suicide to seek help and get out \nof the predicament."
  locator: Table 6, Annotation guidelines (English version), Aggression against Users
  licenses: The guideline exists to let annotators separate a third-party suicide disclosure from the speaker's own risk on the basis of what the text says, which establishes that this circumstance-versus-state distinction was operationalised for span-level annotation of real counselling text. That is the entry's detectability assertion applied to one circumstance type.
  fit: adjacent
  bridge: The source operationalised the distinction for the Aggression against Users label within a suicide-detection taxonomy. It reports no agreement statistic for this specific clause, and its span unit is the utterance rather than the entry's clause-plus-time-marker.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-000969
  quote: "Individuals may also be threatened by others' suicides, thus expressing statements about others' suicide to seek help and get out \nof the predicament."
  locator: Table 6, Annotation guidelines (English version), Aggression against Users
  licenses: The guideline's whole point is that the same surface content -- a statement about suicide -- resolves differently depending on whether it names an external circumstance or the speaker's own state, and it instructs annotators to make that call. Independent operational support for the entry's event-versus-interpretation boundary.
  fit: adjacent
  bridge: The distinction the guideline draws is between whose suicide is at issue, not between circumstance content and interpretive content in general. The entry's boundary is broader than the one the source operationalised.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-001015
  quote: "Results from the studies that were included in this review support the assumption that stress affects decision making. If stress confers an advantage or disadvantage in terms of outcome depends on the specific task or situation."
  locator: Section 5.1, "Consistent results"; the same formulation appears in the Abstract
  licenses: Bounds rather than supports. The review's headline conclusion is that whether stress helps or harms depends on the specific task or situation, which cuts against any reading of this entry as marking a uniform state.
  fit: analogical
  bridge: Laboratory decision tasks in healthy humans with no conversational agent and no transcript. It measured decision-making outcomes under induced stress, not what a person's turn contains. The bearing on the entry is on what a stressor-present context may be taken to imply, not on whether the turn type occurs.
