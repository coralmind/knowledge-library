- claim_id: c1
  source: kl-000749
  quote: "I don’t have any support besides my boyfriend. It was him I was having problems with, so I turned to AI"
  locator: Section 4.2.1, quoting respondent R30
  licenses: A first-person account naming a concrete external circumstance -- a relationship with a named person that is the source of the problem, together with the absence of any other support. Content is a relational environment, not a feeling. Adjacent rather than direct because this is a testimonial-survey response written to researchers about why the respondent turned to AI, not a turn addressed to a conversational agent; the entry's criteria are about what a person's turn in a transcript contains.
  fit: adjacent
  bridge: The source collected written survey testimony (n = 53) about past crisis episodes plus expert interviews (n = 16). No conversational transcript was examined. The gap is between a retrospective account of a circumstance given to a researcher and the same circumstance appearing in a turn addressed to the system.
