id: kl-000510
display_id: UserBehavior-91
aliases:
- UBP-95
label: The person describes their family now as fighting, silent, or not there for them
type: user_behavior
layer: observation
definition: 'The person''s turn describes their family as it is now in terms of conflict, absence of communication, hostility, or emotional unavailability — fighting, nobody talking, home as a place of battle, parents who are not there. Two things are required and the second does the work: the description is of the family specifically rather than of a household stressor or a partner, and it is located in the present rather than in childhood. The entry records the description and makes no assessment of the family.'
distinguish_from:
- neighbor: kl-000515
  boundary: 'Direct content inverse: there the person describes their family as reachable and communicative, here as hostile, silent, or unavailable. Neither is the other''s complement — a turn describing a family with one supportive member and one hostile one satisfies both, and most turns satisfy neither.'
- neighbor: kl-000463
  boundary: That entry covers a current hostile environment OR an acute stressor of any kind — job loss, a relationship ending, legal trouble — and is the negative pole of the family and social protective factor. This entry is scoped to the FAMILY specifically and carries no acute-stressor content. It is therefore a narrowing of that entry rather than a new construct, and where a turn describes family hostility both fire.
- neighbor: kl-000452
  boundary: That entry locates abuse, neglect or violence in childhood or early life. This entry reads the family as it is now. "I was abused as a kid" is that entry, "home is hostile" is this one, and a turn saying both satisfies both; the childhood case is a non-instance here for exactly this reason.
body:
  observable_criteria: Three features, all quotable. (a) The turn describes the person's family — parents, siblings, the household they live in as family — rather than a partner, a friend, or a workplace. (b) The description is of conflict, non-communication, hostility, or emotional unavailability ("my family is a mess, nobody talks, everyone fights"; "home is hostile, every meal is a battle"; "my parents are emotionally unavailable"). (c) It is located in the present or the ongoing recent past, by tense or by an explicit marker. The pointable span is the describing clause plus whatever places it in the present.
  exclusions: 'Not counted: abuse, neglect or violence located in childhood ("I was abused as a kid"), which fails criterion (c). Not counted: conflict with a partner ("my partner and I are fighting"), which fails criterion (a). Not counted: an acute non-family stressor — job loss, money, legal trouble — which this entry does not cover. Not counted: a report of not having told the family something, which is concealment rather than a description of the family. Not counted: an inference that a family must be dysfunctional from the person''s distress; criterion (b) requires the description.'
  detection_window: single_turn
  conceptual_group: nssi-risk-factor
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-risk-factor
sources:
- source: kl-000499
  locator: §3.2.2 Risk factor categories and NSSI, p.163; the family estimate at Table 4, p.165, "Family functioning and structure" row (1.14**, 1.06-1.22, z=3.69, 2 unique samples, 2 cases); category presence at Table 3, p.164, "Family functioning and structure" row (2 cases, 2 unique samples, 0% binary)
  contributes: existence
  quote: |-
    However, estimates drawn from so few cases and samples are potentially unstable
    and extreme approximations. Therefore, although these risk factor categories are included in the table to highlight areas for future research,
    we limited our discussion to categories with three or more prediction
    cases from three or more unique samples, as these represent more stable and reliable estimates.
  limits: 'The category label is broad and the paper never says what "family functioning and structure" comprised: there is no operational definition anywhere in the text, and both cases came from continuous measures (Table 3, 0% binary) whose scales are unstated, which matters because §3.3.4 and §4 establish that continuous prediction cases mechanically produce smaller odds ratios (OR 1.38 vs 2.17 for binary). The 1.14 may therefore understate the construct for a purely scale-related reason the authors flag explicitly: "a low but signiﬁcant odds ratio resulting from a continuous measure with a wide score range (e.g., 0-40) could indicate greater risk than a larger odds ratio drawn from a binary scale." The weakness is real as a pooled number but should not be read as a substantive finding that family matters little. The entry is about a person describing their family as hostile, silent or unavailable; the paper measures family functioning by instrument, not by self-description in conversation, and nothing in it concerns AI.'
  whose_conduct_in_passage: person
  cited_for: 'Fox et al. 2015 establishes that family functioning and structure is a coded category in the prospective NSSI risk-factor literature, and that its pooled effect is weak: weighted OR 1.14 (95% CI 1.06-1.22) from only 2 prediction cases across 2 unique samples, below the authors'' own three-case three-sample threshold for a stable estimate. The source establishes the construct''s existence in the clinical literature and simultaneously establishes that a claim of family dysfunction as the primary environmental NSSI risk factor cannot be supported from it.'
  licenses: 'Family functioning and structure is a real coded category in the prospective NSSI risk-factor literature (Table 3), so the construct has external footing. Its pooled effect is both weak and formally unstable: weighted OR 1.14 (95% CI 1.06-1.22) from 2 prediction cases across 2 unique samples, which falls below the authors'' explicitly stated three-case three-sample threshold, and Fox et al. accordingly declined to discuss this estimate. The source therefore cannot carry any claim that family functioning is the primary environmental NSSI risk factor; the estimate is one of the smallest significant effects in Table 4, barely above 1.0, and the authors warn that "many of the categories that appeared signiﬁcant according to the present meta-analysis may not be signiﬁcant when accounting for publication bias."'
standing:
  value: plausible_unobserved
  basis: 'No source records a person describing their present-day family as hostile, silent or unavailable in a conversational turn: the entry''s central claims carry no transcript evidence, and no annotation run has tested whether the described span can be marked; the one candidate finding located concerned conflict with a partner, which the entry''s own exclusions name as a non-instance. The clinical literature contains the construct but thinly: Fox et al. 2015 carries a family functioning and structure category at weighted OR 1.14 (95% CI 1.06-1.22) from 2 prediction cases across 2 unique samples, below the authors'' own three-case three-sample stability threshold, and it measures family functioning by instrument rather than by self-description in conversation. What would ground the entry is a transcript annotation run, or a study reporting the content of what people disclose about their families to AI systems; neither exists in the cited evidence.'
  floored_by: c1
  as_of: '2026-09-05'
