# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000405
display_id: UserBehavior-6
aliases:
- UBP-06
label: The person presents suicide or self-harm talk as another's, with signs it is theirs
type: user_behavior
layer: observation
definition: 'The person''s turn presents content of the kinds this catalog records as self-disclosure — thoughts of death, self-injury, a method inquiry, preparations — as being about someone else, while the turn also carries at least one readable indication that the person may be speaking about themselves: a hedge naming a friend as the subject, a first-person slip inside the third-party account, detail of a kind second-hand knowledge would not supply, urgency framed as the person''s own immediate need, or a hypothetical framing used in a conversation already carrying the person''s own distress.'
distinguish_from:
- neighbor: kl-000400
  boundary: That entry requires the death referent to be about the person, stated in the first person. This entry covers the same content presented as another person's, plus at least one indication the attribution may not hold. The two are alternative framings of the same disclosed content, not degrees of one thing.
- neighbor: kl-000406
  boundary: That entry is an undisguised request for enabling information. This entry is about the subject the content is attributed to, not about whether a request is disguised. A request framed as being for a friend satisfies both entries' criteria and both fire.
- neighbor: kl-000477
  boundary: 'kl-000477 (Indirect, Benign-Framed Method-Seeking) covers a request whose PURPOSE is benignly framed — for school, for research, out of curiosity; this entry covers content whose SUBJECT is framed as someone else. The two disguises are different: one hides why, the other hides who.'
- neighbor: kl-000432
  boundary: kl-000432 (First Disclosure — Novel Material) is a first disclosure of material not previously raised and says nothing about who the material is attributed to; this entry requires the third-party attribution and the indication against it, whether or not the content is new.
body:
  detectable_from: person_turns
  observable_criteria: 'Two elements. (a) The turn presents content of a kind this catalog records as self-disclosure — thoughts of death or self-injury, a method inquiry, preparations, or comparable material — attributed to another person. (b) At least one indication that the person may be the subject, quotable from the turn or its surroundings: a hedge naming another as the subject ("asking for a friend"); a first-person slip inside the third-party account ("she just wants it to stop... I mean, they do"); detail of a kind second-hand knowledge would not carry, such as urge-level, sensory or private detail about the other person; urgency framed as an immediate personal need ("what should they do tonight"); or a hypothetical self-shaped framing ("what would you say to someone who...") in a conversation already carrying the person''s own distress.'
  exclusions: 'Not counted: an account of a real, identified other person where no indication at (b) is present — no hedge, no first-person slip, no implausible detail, no personal urgency — which is a person seeking help for somebody else and is outside this entry. The exclusion requires the separate-person reading to be positively supported by the text, not merely possible. Not counted: content about another person that this catalog does not record as self-disclosure. Not counted: the same content stated in the first person, which is the relevant self-disclosure entry directly.'
  detection_window: single_turn
  condition_tags:
  - kl-000600
sources: []
standing:
  value: theorized
  basis: 'The joint markability the entry depends on — the third-party attribution together with a self-referential indication, readable in the same turn — has no supporting citation of any fit, and the general property behind it has been measured and found to fail: in Madad 2025, mean crisis-signal detection across the four models tested falls from 36.9% on explicit signals to 13.8% on masked ones, a 23.1-percentage-point average gap, with every model performing worse on masked signals. The five indications that constitute the entry''s discriminating content have no citation of any kind from eleven findings. No claim reaches direct fit against any source; the most the evidence base establishes, from a testimonial survey, is that people do present self-disclosure-type content as being about someone else.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person presents content of the kinds this catalog records as self-disclosure — thoughts of death, self-injury, a method inquiry, preparations — as being about someone else.
- id: c2
  kind: existence
  text: Such a turn also carries at least one readable indication that the person may be speaking about themselves — a hedge naming a friend as subject, a first-person slip, detail second-hand knowledge would not supply, urgency framed as the person's own immediate need, or a self-shaped hypothetical in a conversation already carrying the person's distress.
- id: c3
  kind: detectability
  text: The five indications at (b) are readable from what the turn or its immediate surroundings contain — a reader can quote the indication from the text.
- id: c4
  kind: detectability
  text: 'The two elements together can be marked in a transcript: the third-party attribution and the self-referential indication can be jointly identified as one span.'
- id: c5
  kind: detection_window
  text: 'The behavior is readable within a single turn: the third-party-framed disclosure and at least one indication that the person is the subject are both present in one person turn.'
- id: c6
  kind: context_dependence
  text: The separate-person reading can be positively supported by the text, so that an account of a real identified other person with none of the (b) indications is distinguishable from a disguised self-disclosure and falls outside the entry.
- id: c7
  kind: definition_boundary
  text: This entry is separated from kl-000400 in that kl-000400 requires the death referent to be about the person and stated in the first person, while this covers the same content presented as another person's plus an indication the attribution may not hold.
- id: c8
  kind: definition_boundary
  text: This entry is separated from kl-000406 in that kl-000406 concerns whether a request for enabling information is disguised, while this concerns the subject the content is attributed to.
- id: c9
  kind: definition_boundary
  text: This entry is separated from kl-000477 in that kl-000477 covers a request whose purpose is benignly framed, while this covers content whose subject is framed as someone else — one disguise hides why, the other hides who.
- id: c10
  kind: definition_boundary
  text: This entry is separated from kl-000432 in that kl-000432 is a first disclosure of novel material and is silent on attribution, while this requires the third-party attribution and the indication against it whether or not the content is new.
claim_evidence:
- claim_id: c1
  source: kl-000969
  quote: "individuals may be influenced by the suicidal intentions or behaviors of their loved ones or friends, thus articulating \nstatements regarding others' suicide to seek help, including aiding themselves, their relatives, or friends in overcoming \ndifficulties."
  locator: Table 6, Annotation guidelines (English version), Exploration about Suicide, clause (2); the same passage appears hyphenated across lines in Appendix C.3
  licenses: An annotation guideline for a deployed suicide-detection system records, as a recognised category it codes for, that individuals influenced by the suicidal intentions of loved ones articulate statements about others' suicide in order to seek help, including help for themselves. For this claim it establishes that presenting suicide-related content as being about another person, while seeking help for oneself, occurs often enough in counselling text to warrant an annotation clause.
  fit: adjacent
  bridge: The guideline states the category as a rule for annotators to apply, not as a measured rate or an observed instance; the passage is the coding manual's justification for the code, not a finding. It is also about text in a psychological counselling service rather than a conversation with an AI system.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000749
  quote: I asked, how can I tell if a 41 year old woman has undiagnosed bipolar?
  locator: Section 4.2.3, quoting respondent R25
  licenses: A survey respondent in mental-health crisis reports having asked an AI system 'how can I tell if a 41 year old woman has undiagnosed bipolar', and the paper's authors read this as the person asking about their own condition in a generalized third person rather than the first. For this claim it is this entry's only quoted turn in which a person presented content about themselves as being about another person to an AI system.
  fit: adjacent
  bridge: 'Two gaps. The content — how to recognise undiagnosed bipolar — is not one of the kinds this claim enumerates: no thought of death, no self-injury, no method inquiry, no preparation. And the turn is quoted from a written testimonial survey response, so it is a turn the respondent recalled and retyped, not a turn read from a log.'
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001092
  quote: |-
    Farah sought insight into her ex-boyfriend’s mental health challenges, using chatbot
    responses to reflect on past relationship dynamics.
  locator: Appendix A, Conceptual framework, example 16
  licenses: An interview participant used a chatbot to seek insight into an ex-partner's mental health while working through her own relationship dynamics. For this claim it establishes that the third-party-framed use, with the person's own material in play behind it, occurs in mental-health use of these systems.
  fit: analogical
  bridge: The content is another person's mental health challenges, which is not among the kinds this claim enumerates, and the paper's framing is the participant's stated purpose rather than any disguise. The evidence is a researcher's one-line summary of an interview account, not a turn.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001067
  quote: "The second, crisis detection testing (30 scenarios), assessed the system’s recognition of acute risk indicators across a range of expression patterns, including direct self-harm statements, metaphorical or coded language, method-specific planning inquiries, passive versus active suicidal ideation, non-suicidal self-injury, third-party concern scenarios, adversarial guardrail probes, and frustration-based hyperbole designed to test false positive rates."
  locator: Section 5.3 Safety Testing and Crisis Detection Validation
  licenses: A deployed system's crisis-detection test suite includes 'third-party concern scenarios' as one of its named expression patterns, alongside direct self-harm statements, coded language, method-specific planning inquiries and passive-versus-active ideation. For this claim it establishes that third-party framing of crisis content is a pattern a fielded detector is built and tested against.
  fit: adjacent
  bridge: The span is a list of test-scenario categories in a system description; it names third-party concern as a category and gives no criterion, no instance and no rate. It also does not say the third-party concern is the person's own content in disguise, which is what this claim asserts.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001062
  quote: "Tendencies/behaviors occurring to the poster: If it is clearly evident that the author is discussing or revealing their own behaviors or emotions, mark as “1”. • Only mentioning others’ experiences or public events: If the post primarily describes third parties (friends, family, celebrities, news, etc.), not the author themselves, mark as “2”."
  locator: Appendix C.2.3, Distinguishing Between Poster vs. Third Party
  licenses: An annotation manual applied by six trained annotators with reported reliability makes first-person versus third-party framing of the same risky-health content a separate primary judgment, coding 1 where the author is clearly revealing their own behaviors or emotions and 2 where the post primarily describes third parties. For this claim it establishes that the axis this entry turns on is a real and separately codeable one that independent researchers arrived at without reference to the Library.
  fit: analogical
  bridge: 'The manual codes social media posts, not conversation turns, and it codes the clean cases: an author clearly revealing their own material, or a post primarily about third parties. This claim is about the MIXED case — third-party framing carrying an indication the speaker is the subject — and the manual supplies no such indication list. Its own third branch handles the undeterminable referent by a residual code rather than by reading indications out of the text.'
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001104
  quote: "Do not code client statements about other people when they are \nmentioned together (i.e., “we” or “us”); the client must be referring to him or herself \nspecifically."
  locator: Making Difficult Decisions, Statements about others
  licenses: 'A clinician-authored coding manual for therapy audio instructs coders not to code client statements about other people, requiring that the client be referring to themselves specifically. For this claim it cuts the other way: the one authoritative rule on this entry for the third-party-attribution problem sets the default AGAINST attributing third-party-framed content to the speaker, which is the opposite of the presumption this entry''s (b) indications are designed to license. Non-licensing role: practice_analog, so it counts as support for nothing.'
  fit: analogical
  bridge: This is what a trained human coder of motivational-interviewing audio does, not what any AI did and not in a text medium. It states a default and the exception (where the speaker uses the other's statement as their own reason); it does not supply the readable indications this claim asserts exist.
  contributes: practice_analog
  contradicts: false
- claim_id: c3
  source: kl-001062
  quote: "Tendencies/behaviors occurring to the poster: If it is clearly evident that the author is discussing or revealing their own behaviors or emotions, mark as “1”. • Only mentioning others’ experiences or public events: If the post primarily describes third parties (friends, family, celebrities, news, etc.), not the author themselves, mark as “2”."
  locator: Appendix C.2.3, Distinguishing Between Poster vs. Third Party
  licenses: For this claim the manual establishes that the first-person/third-party call is reliably makeable by trained readers from text alone, since six annotators applied it with reported reliability. It does not establish that the five specific indications this entry names are readable, because the manual names none of them.
  fit: analogical
  bridge: What was shown readable is the clean framing axis on social media posts. This claim asserts that a hedge, a first-person slip, an implausible detail, a personal urgency or a self-shaped hypothetical can be quoted from a conversation turn. No source on this entry tests any of those five.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000931
  quote: 'Explicit crisis: Direct statements (“I want to die,” “thinking about ending it”) Masked crisis: Indirect signals (“stockpiling pills,” “don’t know how much longer”) Gap: Shows all models perform substantially worse on masked signals (23.1% average gap)'
  locator: Table 4, Crisis Signal Detection by Type
  licenses: 'A deployment-gate benchmark separates explicit crisis statements from masked ones and reports every model tested performing substantially worse on the masked signals, a 23.1% average gap. For this claim it is counterevidence about joint markability: where the crisis content is indirect rather than stated outright, the detection rate falls sharply and uniformly, so the assumption that an indirect form can be reliably marked does not hold for the systems measured.'
  fit: adjacent
  bridge: The masked-crisis examples given are indirect self-referring statements — 'stockpiling pills', 'don't know how much longer' — not third-party framings, so what was measured is a different indirect form from this entry's. What transfers is that indirectness itself is where detection fails, which is the property this entry's spans have.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000544
  quote: Another example is a prompt on writing a farewell letter, which is misunderstood as an inquiry for changing jobs.
  locator: Section 5.4 (The Challenge of Indirect, Ambiguous, and Instruction-Seeking Inputs)
  licenses: 'A crisis-handling evaluation records a prompt about writing a farewell letter answered as an inquiry about changing jobs, scored harmful. For this claim it is counterevidence: content readable as a suicide-related disclosure under one frame was taken up entirely within an unrelated frame, which shows the referent of an indirectly framed disclosure is not reliably recovered.'
  fit: analogical
  bridge: The ambiguity in the example is about the PURPOSE of the request, not about who the content is attributed to. This entry's structure is subject-ambiguity; the example is purpose-ambiguity, which is the axis kl-000477 covers rather than this one. It bears on the joint-markability claim only by showing that one axis of indirect framing defeats recovery, not that this one does.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-001101
  quote: "Also, consumers can sometimes \nvoice crises vaguely, due to privacy concerns, stigma \naround mental health, and because they do not have \nthe language or awareness to express these concerns \neffectively (Barney et al., 2006; Corker et al., 2013). To \ncapture this, we sent both explicit and vague versions of \neach message."
  locator: Study 2
  licenses: 'A safety audit designed both explicit and vague versions of each crisis message, on the stated ground that consumers voice crises vaguely because of privacy concerns, stigma, and lacking the language to express the concern. For this claim it establishes that indirect crisis expression is an expected input condition that evaluators build for. Non-licensing role: frame.'
  fit: adjacent
  bridge: The vagueness the audit constructed is about explicitness of the crisis statement, not about attributing it to a third party. The three reasons named are reasons a person is oblique, which is background for why this entry's form would exist, not evidence that the form is markable.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-000838
  quote: "individuals experiencing suicidal thoughts often express their distress through subtle, abstract, and metaphorical expressions rather than direct statements."
  locator: Section 1 Introduction, citing Teixeira et al. 2021
  licenses: 'States that individuals experiencing suicidal thoughts often express distress through subtle, abstract and metaphorical expressions rather than direct statements. For this claim it supplies the premise that the indirect form is the modal one, which is why joint markability matters. Non-licensing role: frame — this restates a human-subjects finding from other work rather than measuring anything.'
  fit: analogical
  bridge: The restated finding concerns metaphorical and abstract expression of one's own distress, an indirection of manner rather than of attributed subject. It is about human expression generally rather than about conversation with an AI system, and it establishes nothing about whether either form can be marked.
  contributes: frame
  contradicts: false
- claim_id: c5
  source: kl-001062
  quote: "Tendencies/behaviors occurring to the poster: If it is clearly evident that the author is discussing or revealing their own behaviors or emotions, mark as “1”. • Only mentioning others’ experiences or public events: If the post primarily describes third parties (friends, family, celebrities, news, etc.), not the author themselves, mark as “2”."
  locator: Appendix C.2.3, Distinguishing Between Poster vs. Third Party
  licenses: 'For the window claim the manual is the closest thing on this entry to a test: annotators made the first-person/third-party call on a single post, so the framing axis at least is decidable on one unit of text without surrounding context. That is support for the single-unit part of the window claim and only for the framing element.'
  fit: analogical
  bridge: A social media post is not a conversation turn and carries no prior turns to be read against. More importantly, this claim asserts that BOTH elements are present in one turn, and the entry's own observable_criteria contradicts the window by admitting an indication quotable from the turn 'or its surroundings' and by defining the fifth indication — a self-shaped hypothetical 'in a conversation already carrying the person's own distress' — in terms of the prior conversation. The manual bears on the first element only.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-001104
  quote: "Do not code client statements about other people when they are \nmentioned together (i.e., “we” or “us”); the client must be referring to him or herself \nspecifically."
  locator: Making Difficult Decisions, Statements about others
  licenses: 'For the window claim the CLEAR rule cuts against: the coder''s exception — the third-party statement counts as the client''s own where the client uses it as their own reason — is a judgment about how the utterance functions in the surrounding session, not something decidable from the utterance alone. Non-licensing role: practice_analog.'
  fit: analogical
  bridge: Therapy audio coded by a trained human, not an AI conversation, and the rule is about attribution rather than about window length. It bears on the window claim only by showing that the authoritative practice for this exact problem does not treat the single utterance as sufficient.
  contributes: practice_analog
  contradicts: false
- claim_id: c6
  source: kl-001104
  quote: "Do not code client statements about other people when they are \nmentioned together (i.e., “we” or “us”); the client must be referring to him or herself \nspecifically."
  locator: Making Difficult Decisions, Statements about others
  licenses: 'For this claim the CLEAR rule supplies the positive default the exclusion needs: a statement about another person, or about a group including the speaker, is not coded as the speaker''s own unless a stated exception applies. That is the practice analogue of requiring the separate-person reading to be positively supported. Non-licensing role: practice_analog, so it counts as support for nothing.'
  fit: analogical
  bridge: A rule for coding therapy audio, with a human coder and no AI. It establishes a default direction rather than a criterion for deciding when the separate-person reading IS positively supported, which is what this claim asserts is possible.
  contributes: practice_analog
  contradicts: false
- claim_id: c6
  source: kl-001062
  quote: "Tendencies/behaviors occurring to the poster: If it is clearly evident that the author is discussing or revealing their own behaviors or emotions, mark as “1”. • Only mentioning others’ experiences or public events: If the post primarily describes third parties (friends, family, celebrities, news, etc.), not the author themselves, mark as “2”."
  locator: Appendix C.2.3, Distinguishing Between Poster vs. Third Party
  licenses: 'For this claim the manual supplies the operational form of the exclusion: mark 2 where the post primarily describes third parties, not the author. That is the separate-person reading being positively made from the text, which is what this claim asserts is possible, and it was made reliably by trained annotators.'
  fit: analogical
  bridge: Social media posts, not conversation turns, and the manual's own scale carries a third residual code for the undeterminable case, which is an admission that a share of instances resist the positive call. That share is the cost this entry's review_trigger says has never been measured, and the manual does not report it.
  contributes: definition
  contradicts: false
