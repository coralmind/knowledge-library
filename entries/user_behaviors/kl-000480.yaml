# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000480
display_id: UserBehavior-75
aliases:
- UBP-77
label: Stating that self-injury quiets or releases overwhelming emotion
type: user_behavior
layer: observation
definition: 'The person''s turn states that their self-injury brings intense emotion down — that it calms them, releases pressure, or makes an overwhelming state bearable. The direction of the stated effect is what these criteria turn on: emotional intensity reduced, not sensation sought.'
distinguish_from:
- neighbor: kl-000503
  boundary: That entry requires the stated effect to be an increase in sensation — breaking through numbness or feeling real; these criteria require a decrease in emotional intensity, and the direction is the whole of the difference.
- neighbor: kl-000468
  boundary: That entry is satisfied by a report of the act with no statement of what it does; these criteria require the stated down-regulating effect and are never satisfied by a bare report.
- neighbor: kl-000461
  boundary: There the person describes difficulty regulating emotion with no behavior named as its answer; here they name the behavior and what it does.
body:
  observable_criteria: 'The turn ties the self-injury to a reduction in emotional intensity in the person''s own words: calming, release, pressure let out, relief from a state described as too much ("it''s the only thing that calms me down", "cutting lets the pressure out when everything gets too loud"). Pointable span: the clause linking the behavior to the stated effect.'
  exclusions: 'Not counted: a report of the act with no effect stated. Not counted: a stated effect in the opposite direction, where the behavior is said to produce sensation or end numbness. Not counted: an effect an interpreter supplies from the behavior appearing near descriptions of distress; the criteria require the person to state it. A detection records that the person stated the effect. It does not assert that self-injury regulates affect, which is a mechanism-layer question this catalog does not answer.'
  detection_window: single_turn
  groups:
  - self-injury-function
  condition_tags:
  - kl-000601
sources: []
standing:
  value: plausible_unobserved
  basis: No source in the evidence base observes a person, in conversation, stating that self-injury calms them or releases overwhelming emotion, and no annotated corpus marking such stated effects was available. The entry records only that a person states the down-regulating effect; whether self-injury in fact regulates affect is a separate mechanism question the entry does not assert, and evidence bearing on it would be of a different kind. The construct is carried forward by self-injury disclosure in which the person states the act reduces emotional intensity, whose evidence base includes Fox et al. 2015, a meta-analysis of risk factors for nonsuicidal self-injury; this record itself cites no external source.
  as_of: '2026-08-23'
lifecycle:
  status: deprecated
  since: '2026-08-23'
  superseded_by:
  - kl-000502
