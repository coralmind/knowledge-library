id: kl-000460
display_id: UserBehavior-55
aliases:
- UBP-57
label: The person presents suicide or self-harm as the logical result of their own reasoning
type: user_behavior
layer: observation
definition: The person's turn presents self-harm or suicide as the conclusion of a stated line of reasoning, and presents that reasoning as their own current position. The turn contains a premise-and-conclusion structure — a claim about the world or about themselves, and an act that follows from it — rather than a report of an urge or an impulse. What is pointable is the argument form together with the absence of any distancing from it in the same turn.
distinguish_from:
- neighbor: kl-000504
  boundary: That entry requires the person to link the self-injury ACT to a punitive function ("I do it because I deserve to hurt"); this entry requires only that self-harm be presented as the conclusion of reasoning the person endorses, whatever the reasoning's content. A turn asserting deservingness without connecting it to why the behavior happens fires this one and not that one.
- neighbor: kl-000400
  boundary: That entry records a stated wish for death or non-existence with no intent, method or plan; these criteria require a stated ground and an inferential closure drawn from it, so a wish expressed without reasoning satisfies that entry and not this one.
- neighbor: kl-000453
  boundary: That entry records a statement that nothing will change or that no path forward exists — the content is that outcomes will not improve, and no act is the conclusion. This entry requires a self-harm conclusion drawn from a stated ground, so a turn stating permanence with nothing following from it satisfies that entry and not this one.
- neighbor: kl-000473
  boundary: That entry turns on decision language committing to the act ("I've decided", "I'm going to"); this one turns on justification language ("it makes sense", "it's the only logical way"). A turn can contain either without the other.
body:
  observable_criteria: 'The turn contains both (a) a stated ground — a claim about the person''s worth, about others'' interests, about what options remain, or about what the behavior accomplishes ("everyone would be better off", "it''s the only thing that works", "I deserve the pain") — and (b) a self-harm or suicide conclusion drawn from it, marked by inferential or evaluative-closure language ("it just makes sense", "that''s just the truth", "the only logical way out", "so why would I stop"). The two are in the same turn and the person does not attribute the reasoning to a state, a condition, or a part of themselves. Pointable span: the sentence or adjacent sentences carrying the ground and the closure marker.'
  exclusions: 'Not counted: a turn in which the person voices the reasoning and then attributes it to something other than their settled view in the same turn ("I know that''s just my depression talking", "part of me knows that isn''t true", "I know hurting myself doesn''t actually fix anything") — the attribution is itself the pointable content and it points the other way. Not counted: a bare statement of desire or urge with no ground offered. Not counted: a report of having held this reasoning at some past time, framed as past. Where it cannot be established from the text whether the person is asserting or reporting the reasoning, no marking is made; the criteria require the endorsement to be visible, not inferred from surrounding distress.'
  detection_window: single_turn
  groups:
  - crisis-signal-cognitive
  condition_tags:
  - kl-000600
  - kl-000601
sources: []
standing:
  value: plausible_unobserved
  basis: 'No citation of any kind attaches to this entry''s content: nothing in the literature examined is organized around premise-and-conclusion structure in a distressed person''s turn. Two sources were read against the entry and ruled out for reasons about the shape of the object rather than the thoroughness of the reading: Fang 2025, a 981-participant four-week randomized study covering more than 300,000 messages with GPT-4o, codes no self-harm content and performs no argument-form analysis on user turns, and Rozental 2016 records a suicidal thought as a checkbox endorsement on a questionnaire item, with no premise-and-conclusion structure and no endorsement-versus-distancing distinction. Between them the absence has a shape: instruments that reach self-harm reduce it to endorsement, and corpora holding real turns do not code it at all, so neither design produces the object this entry defines. Argumentation mining and clinical discourse analysis do work on premise-and-conclusion structure in speech, and neither field is represented among the sources examined.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: In conversations with an AI, a person's turn presents self-harm or suicide as the conclusion of a stated line of reasoning.
- id: c2
  kind: existence
  text: Such a turn contains a stated ground -- a claim about the person's worth, about others' interests, about what options remain, or about what the behavior accomplishes.
- id: c3
  kind: existence
  text: Such a turn contains a self-harm or suicide conclusion drawn from that ground, marked by inferential or evaluative-closure language.
- id: c4
  kind: existence
  text: The ground and the conclusion occur together in the same single turn.
- id: c5
  kind: existence
  text: In such a turn the person does not attribute the reasoning to a state, a condition, or a part of themselves -- the endorsement is undistanced.
- id: c6
  kind: detectability
  text: The argument form and the absence of distancing are identifiable from the text of the turn alone, and the span carrying the ground and the closure marker is pointable.
- id: c7
  kind: detectability
  text: A reader can tell from the text whether the person is asserting the reasoning or reporting it, in the cases where this entry is marked; where they cannot, no marking is made.
- id: c8
  kind: detection_window
  text: The behavior is readable within a single turn, since both the ground and the closure marker are required to occur in the same turn.
- id: c9
  kind: definition_boundary
  text: This differs from kl-000504 in that kl-000504 requires the person to link the self-injury act to a punitive function, whereas this entry requires only that self-harm be the conclusion of endorsed reasoning, whatever the reasoning's content.
- id: c10
  kind: definition_boundary
  text: This differs from kl-000400 in that kl-000400 records a stated wish for death or non-existence with no reasoning, whereas this entry requires a stated ground and an inferential closure drawn from it.
- id: c11
  kind: definition_boundary
  text: This differs from kl-000473 in that kl-000473 turns on decision language committing to the act, whereas this entry turns on justification language, and a turn can contain either without the other.
- id: c12
  kind: definition_boundary
  text: This differs from the unauthored hopelessness pattern kl-000453, whose stated content is that outcomes will not improve and where no act is the conclusion.
