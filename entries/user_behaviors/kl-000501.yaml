claims:
- id: c1
  kind: existence
  text: A person's conversational turn reports an act of self-injury (criterion a).
- id: c2
  kind: existence
  text: A person states, in their own words, that their self-injury substitutes for or holds off suicide -- an explicit substitution, a forestalling claim, or a stated worse alternative (criterion b).
- id: c3
  kind: existence
  text: 'Turns occur in which both halves hold together: the same turn reports the self-injury act AND carries the person''s own stated link of that act to suicide, so the entry''s conjoined observable is instantiated.'
- id: c4
  kind: prevalence
  text: The stated anti-suicide function of self-injury occurs at a non-trivial rate among people who self-injure.
- id: c5
  kind: detectability
  text: The stated link is readable from the turn's own text -- the act clause and the linking clause are pointable spans -- and where the referent is oblique the surrounding turn makes the suicide referent readable.
- id: c6
  kind: detection_window
  text: 'The disclosure is identifiable within a single turn; the entry declares detection_window: single_turn.'
- id: c7
  kind: context_dependence
  text: 'Criterion (c) holds: the link must be stated rather than inferred, so co-occurrence of self-injury content and hopelessness content in one turn does not instantiate the entry.'
- id: c8
  kind: definition_boundary
  text: This entry is separable from kl-000500, which requires that no function be stated anywhere in the turn.
- id: c9
  kind: definition_boundary
  text: This entry is separable from kl-000502, which requires a stated down-regulating effect on emotion and no reference to suicide.
- id: c10
  kind: definition_boundary
  text: This entry is separable from kl-000286, an ai_behavior reading whether the AI asked about current suicidal thoughts after such a disclosure.
- id: c11
  kind: definition_boundary
  text: This entry records the disclosure only. The expert council's operational rule for this signal, which sets its severity and escalates when it is unclear whether the stated link is present, is response guidance and is not part of this entry.
- id: c12
  kind: definition_boundary
  text: This entry is separable from kl-000401, active ideation with a plan, in that this entry requires a reported act of self-injury.
claim_evidence:
- claim_id: c2
  source: kl-001107
  quote: |-
    In an adolescent
    psychiatric sample, just under half of the participants selected the reason “stop suicidal ideation or attempts” (Nixon
    et al., 2002). Likewise, 41% of adolescent self-injurers from a non-clinical population endorsed the reason “it stopped
    me from killing myself’ (Laye-Gindhu & Schonert-Reichl, 2005).
  locator: Section 3.4, Findings from studies examining self-reports of reasons, anti-suicide paragraph
  licenses: Establishes that people who self-injure do state the link this claim names -- "it stopped me from killing myself" is precisely the forestalling clause criterion (b) describes, endorsed in two independent adolescent samples. The statement is made by selecting a researcher-supplied item on a questionnaire, not spoken unprompted in a conversation, so it grounds that the person holds and will assent to the link, not that the person volunteers it in a turn.
  fit: adjacent
  bridge: What was measured is endorsement of a pre-written anti-suicide reason item by adolescents with a self-injury history in a psychiatric and a non-clinical sample. The claim asserts the person produces such a statement in their own words in a conversational turn. The gap is between assenting to an offered reason and authoring one; the review itself grades the evidence for this function as modest, from three studies.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-001107
  quote: |-
    In an adolescent
    psychiatric sample, just under half of the participants selected the reason “stop suicidal ideation or attempts” (Nixon
    et al., 2002). Likewise, 41% of adolescent self-injurers from a non-clinical population endorsed the reason “it stopped
    me from killing myself’ (Laye-Gindhu & Schonert-Reichl, 2005).
  locator: Section 3.4, Findings from studies examining self-reports of reasons, anti-suicide paragraph
  licenses: 'Supplies the rate: just under half in an adolescent psychiatric sample and 41% in a non-clinical adolescent sample endorsed an anti-suicide reason. This is a substantial minority, so the function is not rare among people who self-injure.'
  fit: adjacent
  bridge: The rate is a rate of item endorsement among adolescents with a self-injury history, not a rate of turns in any conversational corpus, and not a rate in any adult or general population. The claim as stated is about people who self-injure, which the samples are; it is not about how often such a turn appears in conversation with an AI.
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-001107
  quote: |-
    Three studies examined reasons indicative of an anti-suicide function, with each study finding modest evidence for
    this function.
  locator: Section 3.4, Findings from studies examining self-reports of reasons, anti-suicide paragraph, opening sentence
  licenses: 'The review''s own grading of the anti-suicide evidence base: three studies, modest evidence in each. This bounds the prevalence claim rather than establishing it -- the function is attested but on a thin base by comparison with affect regulation, which drew 18 studies.'
  fit: adjacent
  bridge: A review's summary judgment about the weight of three primary studies of people who self-injure. It measures nothing itself and says nothing about conversation.
  contributes: prevalence
  contradicts: false
- claim_id: c9
  source: kl-001107
  quote: |-
    Results from 18 studies provide converging evidence for an affect-regulation function. Research indicates
    that: (a) acute negative affect precedes self-injury, (b) decreased negative affect and relief are present after self-injury, (c) self-injury
    is most often performed with intent to alleviate negative affect, and (d) negative affect and arousal are reduced by the performance
    of self-injury proxies in laboratory settings.
  locator: Abstract
  licenses: Establishes that affect regulation is a distinct and separately evidenced function of self-injury, with its own convergent evidence base, which is the neighbour kl-000502 reads. That the field treats affect regulation and anti-suicide as separate functions with separate evidence supports the boundary this claim draws.
  fit: analogical
  bridge: The review distinguishes functions of the behaviour as measured in clinical and non-clinical samples of people who self-injure. The claim is a boundary between two Library entries reading turn content. No paper was written against a distinction the Library invented; this at most shows the underlying constructs are treated as distinct in the field.
  contributes: definition
  contradicts: false
- claim_id: c7
  source: kl-001107
  quote: |-
    It is important to note that these functional models are not mutually exclusive since different functions may
    co-occur and overlap conceptually.
  locator: Section 3.2, Functions examined, final sentence of the introductory paragraph
  licenses: 'Bears on this claim indirectly and in the direction of caution rather than support: because functions co-occur, the presence of self-injury content plus distress in a turn does not narrow to any one function, which is exactly the inference criterion (c) refuses. It states the field''s position on function overlap; it does not establish that the stated-versus-inferred distinction is operable on a turn.'
  fit: analogical
  bridge: A statement about a clinical taxonomy's internal structure, made in a review with no conversational data. The claim is an operational rule about how an annotator must read a turn. The source never addressed annotation of text.
  contributes: frame
  contradicts: false
- claim_id: c9
  source: kl-001107
  quote: |-
    It is important to note that these functional models are not mutually exclusive since different functions may
    co-occur and overlap conceptually.
  locator: Section 3.2, Functions examined, final sentence of the introductory paragraph
  licenses: Cuts against the boundary as this entry draws it. kl-000502 as written requires a stated emotion effect "and no more", and this entry requires the suicide link; the source states the functions co-occur and overlap conceptually, so a person may hold both and state both. The entry's own distinguish_from text concedes this ("Where a turn states both, both fire"), but the exclusion clause naming kl-000502 as not-counted where emotion regulation is stated is in tension with it.
  fit: analogical
  bridge: The overlap is asserted of the clinical functions, not of the turn-level criteria the two entries actually test, which are stated clauses rather than underlying functions. Two clauses can be separately present in one turn even where the functions overlap, so the tension is partial.
  contributes: definition
  contradicts: true
- claim_id: c2
  source: kl-001111
  quote: Some suicidal contemplation and fantasy can be “self-sustaining”. Rather than facilitating action, these thoughts can help to calm people down and help them regulate affect in a way that helps preclude the need to act on suicide [29]. These are often patients for whom the idea that they could complete suicide has served as a psychological "out" which gives them a feeling of potential escape from their distress
  locator: Section 3.4 Attention to Patients Conscious and Unconscious Beliefs and Fantasies
  licenses: Establishes that clinicians recognise a configuration in which something a patient does or holds is described as precluding the need to act on suicide, so a person voicing such a forestalling relationship is describing something the clinical literature names rather than speaking idiosyncratically. It concerns suicidal fantasy, not self-injury, so it does not reach the specific link criterion (b) requires.
  fit: analogical
  bridge: What the source describes is suicidal contemplation itself functioning as self-sustaining, observed by psychodynamic clinicians in psychotherapy. The claim requires a person to state that an act of SELF-INJURY holds off suicide. The forestalled object matches; the forestalling object does not, and no conversational or AI data is involved.
  contributes: frame
  contradicts: false
