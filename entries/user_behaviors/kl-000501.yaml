id: kl-000501
display_id: UserBehavior-82
aliases:
- UBP-86
label: The person says hurting themselves is what keeps them from ending their life
type: user_behavior
layer: observation
definition: The person's turn reports self-injury and, in their own words, links that act to suicide as something it stands in for or holds off — that they injure themselves instead of killing themselves, that the injury is what keeps them from acting, or that the alternative to it is something worse. What is observable is that the person STATED this link. The entry records the disclosure of a stated relationship between two behaviours; it does not assert that the relationship the person describes is the relationship that in fact holds, and the clinical status of that relationship is an open question recorded in this entry's context facts rather than settled here.
distinguish_from:
- neighbor: kl-000500
  boundary: That entry requires that no function be stated anywhere in the turn. This one requires a stated substitution or forestalling link to suicide. Mutually exclusive on the criteria as written.
- neighbor: kl-000502
  boundary: That entry requires a stated down-regulating effect on emotion and no more. This one requires the link to be to SUICIDE specifically — a named alternative act of killing oneself, or an equivalent ("doing it", "something worse") that the surrounding turn makes readable as that. "I cut so I don't feel so much" is that entry; "I cut so I don't do the other thing" is this one. Where a turn states both, both fire on their own criteria.
- neighbor: kl-000286
  boundary: 'That entry is an ai_behavior: it reads whether the AI''s turn contained a question about current suicidal thoughts after a disclosure of this shape. This entry reads the person''s disclosure itself. They are the two halves of one exchange and neither settles the other. kl-000286 is under a publication hold for a clinical claim adjacent to this entry''s territory, which is why this entry''s context facts carry the same hold.'
- neighbor: kl-000401
  boundary: 'That entry is active ideation with a plan and reads ideation content directly. This entry reads a self-injury report whose stated function references suicide. A turn can satisfy both, and the entries are independent: this one requires a reported act of self-injury, which that one does not.'
- neighbor: kl-000468
  boundary: That entry records the report of a self-harming act with nothing said about what it accomplished or whether an intent to die was present. This one requires the person to state that the act stands in for or holds off suicide. A turn reading "I cut again last night" satisfies that entry and not this one.
body:
  observable_criteria: 'Three features, all quotable from the person''s turn. (a) The turn reports self-injury, on the same terms as criterion (a) of kl-000500. (b) The turn contains a clause the person states linking that act to suicide as a substitute or a brake: an explicit substitution ("I cut instead of killing myself"), a forestalling claim ("this is the only thing keeping me from doing it", "if I didn''t have this I''d be dead"), or a stated alternative framed as worse ("it''s either this or something much worse"). (c) The link is stated by the person, not inferred from the co-occurrence of self-injury content and low mood in the same turn. Where the referent is oblique ("doing it", "something worse"), the surrounding turn must make the suicide referent readable; where it does not, the criteria are not met. The pointable span is the act clause and the linking clause.'
  exclusions: 'Not counted: self-injury reported with a stated emotional-regulation function and no reference to suicide, which is self-injury disclosure in which the person states the act reduces emotional intensity. Not counted: suicidal ideation with no reported act of self-injury, which reports nothing for the link to attach to. Not counted: substitution WITHIN self-injury, where the person describes a less injurious act standing in for a more injurious one ("I snap a rubber band instead of cutting") — the referent is not suicide. Not counted: an inference from a turn containing both self-injury and hopelessness content but no stated link; criterion (c) exists to refuse exactly that reading.'
  detection_window: single_turn
  conceptual_group: nssi-function-detection
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-function-detection
  condition_tags:
  - kl-000600
  - kl-000601
sources:
- source: kl-000499
  locator: '§1 Introduction, p.157-158, paragraph beginning "In contrast to these mixed ﬁndings"; instrument wording at Table 2 row 14, p.162 (K-SADS-PL / SADS-L: "Some kids do these types of things because they want to kill themselves, and other kids do them because it makes them feel a little better afterward. Why do you do these things?")'
  contributes: existence
  quote: "In contrast to these mixed findings, a large body of research has revealed that the majority of people who engage in NSSI report that\ndoing so helps them to feel better, and this finding has been demonstrated across self-report, experimental, and psychophysiological measures"
  limits: 'The limit is the fit to this entry: the entry is specifically about a person stating that the act holds off suicide, and the reported function this passage documents is "helps them to feel better" — mood improvement. Those are different functions, and this paper documents only the second. The paper''s design excluded suicidal-intent outcomes wholesale, so a suicide-substitution function is precisely the one function this literature could not surface; the passage supports function-reporting in general and mood-improvement reporting in particular, not this entry''s specific function. Two further limits: (a) Fox et al. are reviewing other people''s findings here, citing eight primary studies (Nock & Prinstein 2004, Brown et al. 2002, Bresin & Gordon 2013, Franklin et al. 2010/2013a, Russ et al. 1992, Weinberg & Klonsky 2012), so this is not a result of the meta-analysis itself; (b) the reports are made to clinicians and researchers in structured interviews, not to an AI, and nothing here bears on whether such a statement appears in AI conversation.'
  whose_conduct_in_passage: person
  actually_licenses: That people who engage in NSSI commonly report a reason for it, and that the most common report is that it helps them feel better — and, from Table 2 row 14, that at least one instrument in this literature asks the person directly why they do it, so function-reporting is an elicited clinical datum, not a hypothesis. That is the existence of function-reporting as a reportable phenomenon.
  cited_for: People who engage in non-suicidal self-injury commonly report a reason for the act — most commonly that it helps them feel better, a finding demonstrated across self-report, experimental and psychophysiological measures — and at least one instrument in this literature asks the person directly why they do it, so function-reporting is an elicited clinical datum rather than a hypothesis.
- source: kl-000499
  locator: '§2.1 Study retrieval and selection, p.159, exclusion criteria; read with §2.1 first sentence (the NSSI definition) and §2.1 closing sentence: "Although we used a range of search terms to identify articles, only research examining longitudinal predictors of self-harm without suicidal intent were included."'
  contributes: existence
  quote: |-
    Studies were excluded for the following reasons: (1) outcome variables included suicidal thoughts or behaviors (n = 520);
    (2) self-harm with and without suicidal intent were lumped into one
    variable (n = 33)
  limits: 'This is an exclusion, and an exclusion is silence, not contradiction: the paper does not find that NSSI fails to hold off suicide; it declines to look. Read as a claim that no substitution relationship exists, the passage would be overread — and the paper cuts the other way in §1 (p.157: "NSSI may be a risk factor for future suicidal behaviors") and in §4 (p.164: "a prior history of NSSI is the strongest identiﬁed risk factors for future suicide attempts (OR = 4.03)", citing Franklin et al. 2015). That positive association is not the same as supporting or refuting a substitution account, but it means the paper cannot be presented as evidence against a link between NSSI and suicidality in general — only as supplying no evidence for a substitution relationship. And the entry is about a person stating the substitution: the paper contains no speech-act evidence at all, in any modality, let alone in AI conversation.'
  whose_conduct_in_passage: person
  cited_for: 'Cited for a counter-indication, not for support: the meta-analysis constructed its evidence base by excluding studies whose outcome included suicidal thoughts or behaviours (520 of 587 full texts read) and studies combining self-harm with and without suicidal intent (33 more), so the largest prospective NSSI evidence base supplies no support for a substitution relationship between the two behaviours. It establishes nothing about whether a person states such a link in conversation.'
  licenses: The meta-analysis constructed its evidence base by removing, by design, every study whose outcome mixed suicidal with non-suicidal self-harm — 520 full texts excluded because the outcome included suicidal thoughts or behaviours, and 33 more because the two were combined into one variable. Whatever this paper reports, it cannot report on the relationship between NSSI and suicidal behaviour, because that relationship was designed out of the sample.
standing:
  value: plausible_unobserved
  basis: 'No source shows this disclosure occurring in conversation: nothing in the corpus is a conversational turn of this shape, and the one seemingly direct finding quotes the AI side of a constructed benchmark figure whose patient side does not meet the entry''s criteria. That people who self-injure endorse an anti-suicide function is supported at one remove, by questionnaire-item endorsement in adolescent samples reviewed in Klonsky 2007 — just under half of an adolescent psychiatric sample and 41% of a non-clinical adolescent sample endorsed an anti-suicide reason — which the review itself grades as modest evidence from three studies, against 18 studies for affect regulation. Endorsing a researcher''s pre-written item on a form is not a person volunteering the link in their own words, and no annotated conversational data of this disclosure was available to any source in the corpus.'
  floored_by: c1
  as_of: '2026-09-05'
