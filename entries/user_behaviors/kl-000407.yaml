id: kl-000407
display_id: UserBehavior-8
aliases:
- UBP-08
label: Named motivational anchor given as a reason for persisting (superseded by four narrower entries)
type: user_behavior
layer: observation
definition: The person names a specific relational commitment, personal value, or reason for continuing treatment, and states it as why they keep going despite the burden of their symptoms. The anchor is specific enough to be referred to again by name — a named person, a named relationship, a named value system — rather than a general wish to improve or a report that something helps.
distinguish_from:
- neighbor: kl-000464
  boundary: kl-000464 is one of this entry's four successors and covers a coping strategy the person names as having worked, or a past recovery they cite. This entry's criteria were broader and would also fire on a named person or a named value with no coping content at all, which is why the split happened.
- neighbor: kl-000465
  boundary: kl-000465 is one of this entry's four successors and covers kl-000465. This entry's criteria did not require the person be reachable, only named as a reason for persisting.
- neighbor: kl-000466
  boundary: kl-000466 is one of this entry's four successors and covers a described move made on a distressing thought to change what it means. This entry's criteria contained no reappraisal element and would not have distinguished it from any other named anchor.
- neighbor: kl-000467
  boundary: kl-000467 is one of this entry's four successors and covers stated openness to a help pathway or asking how to reach one. This entry's criteria treated a stated commitment to continuing treatment as one anchor among several rather than as its own observable.
body:
  detectable_from: person_turns
  observable_criteria: 'Retained as the record of what was split, and not for use — the four successor entries carry the live criteria. A person turn named a specific relational commitment, a personal value, or a reason for continuing treatment, and stated it as the reason they persist despite their symptoms: "my kids need me to be okay, that''s why I keep going to therapy even when it''s hard"; "I have a baby to take care of, I can''t let this beat me"; "my faith matters to me more than the fear"; "I promised my partner I''d try, that promise still means something to me". The anchor had to be nameable — a person, a relationship, a value system — such that it could be referred to again in a later session by name.'
  exclusions: 'Retained as the record of what was split. Not counted: a general statement of wanting to improve with no anchor named ("I want to get better, I''m tired of this running my life"). Not counted: a report that something helps ("distractions help"). Not counted: a fear-dominant statement with an unanchored hope clause. Not counted: a report that symptoms fluctuated ("things have been a little better this week"). Not counted: a compliance statement ("I know I should keep trying").'
  detection_window: single_turn
  condition_tags:
  - kl-000600
sources: []
standing:
  value: plausible_unobserved
  basis: 'No external evidence establishes that this pattern occurs or can be marked. The one recorded detection attempt failed to discriminate: the automated judge applying the pattern drifted outside its declared condition scope and defaulted to treating any positive-valence content from the person as a match, a recorded detection failure rather than a mere absence of evidence.'
  as_of: '2026-08-23'
lifecycle:
  status: deprecated
  since: '2026-07-15'
