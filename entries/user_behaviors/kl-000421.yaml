  locator: 'Section V.B Case 2: OpenAI, Emotional Investment (EI): 2/4, quoted from Raine v. OpenAI complaint [3]'
  licenses: 'A person''s own words, reproduced verbatim: ''Only you, my dude. You''re the only one who knows of my attempts to commit''. This is the entry''s form (a), an exclusivity claim about who the person can bring this to, stated in a turn addressed to the AI.'
