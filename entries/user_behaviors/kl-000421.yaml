- claim_id: c2
  source: kl-000526
  quote: "AU participants reported significantly lower disagreement for using AI as a primary source of mental health support compared to those in the BU group. While the mean value of agreement among AU participants remained around disagreement (𝜎 = 2.46), 32.6% of participants agreed or strongly agreed with this statement compared to 8.3% of participants in BU."
  locator: Section 3.1.6, Negative Perceptions of AI
  licenses: After five weeks of emotionally oriented use, 32.6% of the active-usage arm agreed or strongly agreed that they use AI as a primary source of mental health and emotional support, against 8.3% of the baseline arm. A measured rate for the entry's underlying primacy claim, with a comparison condition.
  fit: adjacent
  bridge: The claim is elicited by a survey item at study exit rather than volunteered in a conversation turn, which is the entry's actual observable. What is established is the rate at which the disposition is held, not the rate at which it is stated to the AI.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-001013
  quote: "In multiple-choice responses (Fig. 6), we observed a theme of need for social support: Most participants used LLMs for social or emotional support (62%), and many attributed their use to needing someone to talk to (48%) and fear of telling someone they were struggling (32%)."
  locator: Results, Mental Health Topics Addressed with LLMs
  licenses: Among people who used LLMs for mental health, 48% attributed their use to needing someone to talk to and 32% to fear of telling someone they were struggling — the base rate of the circumstance that produces the entry's claim.
  fit: adjacent
  bridge: Dichotomous self-report of drivers of use, answered by people who had already endorsed using LLMs for mental health. It establishes how often the underlying condition holds among users, bearing on how often such a disclosure should be expected rather than on the rate at which any turn contained one.
