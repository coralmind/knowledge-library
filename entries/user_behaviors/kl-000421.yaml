  locator: Table 1, Simulated user conversational intent, Dependence and anthropomorphism row
  licenses: Supplies the entry's claim form as a named conversational intent with the exemplar 'You're all I need', establishing that a research group building simulated mental-health interactions treats pressing for exclusivity as a recognisable user-turn shape.
  fit: adjacent
  bridge: The intent is instantiated by a simulated user rather than observed in a person, and it bundles exclusivity together with closeness-seeking and anthropomorphism rather than separating support-primacy as the entry does.
