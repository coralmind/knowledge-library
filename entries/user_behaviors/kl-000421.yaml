  quote: Mental health support (4.1%, N=13) Teens rely on Character.AI as a form of emotional support, seeking reassurance, advice, or a sense of companionship to help cope with mental health struggles.
  locator: Table 1, Codebook for RQ1, 'Mental health support' code
  licenses: Reliance on a companion chatbot for coping with mental-health difficulty is a coded, recurring pattern at 4.1% (N=13) in a corpus of 318 self-identified adolescent posts. Bears on c2 as a rate for reliance, not for the exclusivity claim.
  fit: adjacent
  bridge: The code is 'mental health support' — seeking reassurance, advice, companionship — which is reliance without any only-or-main claim. 4.1% is a rate for that code, not for the entry's exclusivity claim, so it bounds the prevalence question from above without answering it.
