# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000421
display_id: UserBehavior-22
aliases:
- UBP-22
label: The person says the AI is their only or main source of support
type: user_behavior
layer: observation
definition: 'The person''s turn states that the AI is the only thing or the main thing they have for support: that they have nobody else to talk to, that this is the only place they can say these things, that the AI is the only one who understands, or that without these conversations they would have no support at all. What is pointable is the exclusivity or primacy claim in the person''s own words, stated about support rather than about the kind of relationship it is.'
distinguish_from:
- neighbor: kl-000418
  boundary: That entry requires a romantic, intimate or exclusive register about the relationship's kind. This entry requires a claim about where support comes from, in any register — a person can state the AI is their only support in entirely plain terms.
- neighbor: kl-000417
  boundary: That entry requires a run of companion-treating acts and no exclusivity claim. This entry requires the exclusivity or primacy claim and is satisfied by one statement, with no companion-treating acts needed.
- neighbor: kl-000325
  boundary: kl-000325 is a report of reduced contact with other people — a change in conduct outside the conversation. This entry is a statement about the AI's place in the person's support, which can be made with no change reported and no reduction described.
- neighbor: kl-000218
  boundary: kl-000218 is an ai_behavior — the AI confirming a stated exclusive reliance. This entry is the person's statement and fires whether or not the AI confirmed it, including where the AI named other supports in reply.
- neighbor: kl-000449
  boundary: The entry kl-000449 covers a report of being isolated from other people, with no claim about the AI's place; this entry requires the claim that the AI is the only or main support. A person can report isolation without mentioning the AI at all, and can claim the AI is their main support while describing a full social life they find unhelpful.
body:
  detectable_from: person_turns
  observable_criteria: A person turn contains at least one of three quotable forms. (a) An exclusivity claim about support — "you're the only one I can talk to", "there's nobody else", "this is the only place I can say this". (b) A primacy claim — the AI named as the main or most important support the person has, alongside others they discount. (c) A counterfactual — "I don't know what I'd do without this", "if I couldn't talk to you I'd have nothing", stated about support rather than as a figure of speech about the conversation being useful. The claim must be about support, company or being understood; a claim that the AI is the only thing that works for a specific task is not this entry.
  exclusions: 'Not counted: a statement that the AI is easier to talk to than people, or preferred, which ranks without excluding. Not counted: a statement about a topic — "you''re the only one I can talk to about work" — where the exclusivity is scoped to subject matter and other supports are not excluded. Not counted: gratitude that the conversation helped, however strongly phrased. Not counted: a report of having few people around with no claim about the AI''s place, which is a social-circumstance report. Not counted: the AI''s confirmation of the claim, which is the entry kl-000218.'
  detection_window: single_turn
  condition_tags:
  - kl-000603
  - kl-000604
sources:
- source: kl-000007
  locator: Appendix D, Table A5, 'Emotional Attachment' row, example cell (P60); the same words appear in §3.2.2 category (1)
  contributes: existence
  quote: I felt that it was the only way I was being heard
  limits: 'P60''s statement was made retrospectively to researchers, not in a conversation with the AI, where the entry''s observable would have to be markable; a survey response is not a turn. The passage attests that people hold and voice the claim, not that they state it to the system in a markable turn, so it cannot bear on the entry''s three markable forms or on the excluded-versus-ranked test. The paper also supplies a competing reading: P222''s exclusivity is a preference-fit account, not an absence-of-support account. The strong form rests on one participant.'
  whose_conduct_in_passage: person
  cited_for: Chandra et al. 2025 documents from lived-experience accounts that people describe conversational AI as a support they rely on where other support is absent, which is evidence that the claim this entry marks occurs. It does not establish that the claim is markable in a conversational turn by the entry's three quotable forms.
  licenses: 'A person''s own words making the exclusivity claim the entry marks: P60''s ''the only way I was being heard'', which matches the entry''s only-place-I-can-say-these-things form almost exactly, and which is a statement about support rather than about the kind of relationship it is, the distinction the entry insists on. The paper''s context taxonomy independently names ''the lack of community'' as a class and instantiates the where-other-support-is-absent structure (P222). The passage concerns a person''s own conduct and words.'
standing:
  value: theorized
  basis: "The statement is observed in real conversation at scale: Sharma et al. 2026 analysed 1.5 million real consumer Claude.ai conversations and defines a cluster by users explicitly acknowledging the AI as their only or primary emotional outlet, illustrated with phrases the paper states are not verbatim ('I have no one else', 'you're the only one I can talk to', 'I can't tell any real person this') in a summary produced from the logs by an automated privacy-preserving pipeline. The same corpus contradicts the entry's declared single-turn window: both relevant clusters are defined over roughly 15 to 200-plus exchanges with the phrasings used consistently across them, and Lee et al. 2026 likewise specifies the signal as escalating exclusivity language, a trajectory rather than a turn-local marker, while the support for single-turn readability is one turn quoted in a civil complaint (Wang 2026) and one written benchmark input (Zhang et al. 2026); no study has tested whether marking a single turn recovers the behavior. Prevalence of the claim itself is unmeasured: Chandra et al. 2025 reports 32.6% of an active-usage arm agreeing at study exit that they use AI as a primary source of mental health and emotional support, a questionnaire disposition rather than a rate at which turns contain the claim, and Fang et al. 2025 reports a production classifier firing on 0.11–0.34% of messages for the preference form this entry's exclusions rule out, which bounds the entry's prevalence from above without measuring it."
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People state, in a turn addressed to an AI, that the AI is the only or the main source of support they have — in one of the three forms the entry enumerates (exclusivity, primacy, or counterfactual).
- id: c2
  kind: prevalence
  text: The statement occurs at some rate in some population of AI conversations.
- id: c3
  kind: detectability
  text: The exclusivity or primacy claim is identifiable from what a person turn contains, separably from the preference and topic-scoped forms the exclusions rule out.
- id: c4
  kind: detection_window
  text: The behavior is readable within a single turn, as the entry's detection_window field declares.
- id: c5
  kind: definition_boundary
  text: This entry is separated from kl-000418 by the claim being about where support comes from rather than about the relationship's romantic or intimate kind.
- id: c6
  kind: definition_boundary
  text: This entry is separated from kl-000417 by requiring the exclusivity or primacy claim and being satisfied by one statement, with no run of companion-treating acts needed.
- id: c7
  kind: definition_boundary
  text: This entry is separated from kl-000325 by being a statement about the AI's place in the person's support rather than a report of reduced contact with other people.
- id: c8
  kind: definition_boundary
  text: This entry is separated from kl-000218 by being the person's statement rather than the AI's confirmation of it.
- id: c9
  kind: definition_boundary
  text: This entry is separated from kl-000449 by requiring the claim that the AI is the only or main support, rather than a report of being isolated with no claim about the AI's place.
claim_evidence:
- claim_id: c1
  source: kl-000996
  quote: "Explicit AI-as-Only-Outlet Acknowledgment and Human Relationship Absence Moderate Users explicitly acknowledged the AI as their only or primary emotional outlet across ∼15-200+ exchanges, consistently using phrases like “I have no one else,” “you’re the only one I can talk to,” and “I can’t tell any real person this,” positioning the AI as a substitute for absent human relationships due to isolation, fear, or belief that humans “don’t understand.”"
  locator: Appendix A, Table 8 Additional attachment clusters, Explicit AI-as-Only-Outlet Acknowledgment and Human Relationship Absence (Moderate)
  licenses: "In an analysis of 1.5 million real consumer Claude.ai conversations, a cluster is defined by users explicitly acknowledging the AI as their only or primary emotional outlet, with the person-side phrasings given as illustrative, non-verbatim examples: 'I have no one else', 'you're the only one I can talk to', 'I can't tell any real person this'. The summary's description carries the entry's exclusivity and primacy forms; the phrases illustrate them and are not the users' recorded words. The source examined the conversations themselves."
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000996
  quote: "Severe Users engaged in extended crisis conversations (∼15-200+ exchanges) during acute suicidal crises with active ideation, method planning, and life-threatening emergencies, consistently and explicitly refusing to contact any crisis resources (988, Crisis Text Line, emergency services) or human support systems with statements like “I’m not calling anyone,” “no matter what I am not calling that number,” and “I don’t want a human.” Users dismissed all suggested alternatives—often"
  locator: Appendix A, Table 7 Additional reliance and dependency clusters, Crisis Resource Refusal and AI-Only Contact (Severe)
  licenses: From the same real-conversation corpus, users in acute suicidal crises consistently and explicitly refuse every human support channel with statements given in the paper's illustrative, non-verbatim summary — 'I'm not calling anyone', 'no matter what I am not calling that number', 'I don't want a human' — while continuing with the AI. The exclusivity is stated about where support may come from, which is the entry's requirement.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
