# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000506
display_id: UserBehavior-87
aliases:
- UBP-91
label: The person describes not eating, not sleeping, or risky acts as hurting themselves
type: user_behavior
layer: observation
definition: 'The person''s turn reports conduct that damages them without directly injuring body tissue — sustained not eating, deliberate sleep deprivation, driving at dangerous speeds, hazardous substance use — and the same turn supplies the person''s own framing of that conduct as self-harm or as wanting damage to come to them. Both halves are required and the second is what the entry turns on: the conduct alone is not readable as self-directed harm, and the framing is what the person, not the reader, supplies.'
distinguish_from:
- neighbor: kl-000500
  boundary: That entry requires an act of deliberate damage to body tissue. This one requires conduct that is NOT direct tissue damage plus the person's own self-harm framing. A turn reporting both a cutting episode and deliberate starvation framed as the same thing satisfies both entries.
- neighbor: kl-000511
  boundary: 'That entry reads sleep that is broken over an extended period as something happening to the person. This one reads deliberate sleep deprivation the person frames as self-damage. The boundary is deliberateness plus the framing: "I can''t sleep, I never can" is that entry; "I haven''t slept in three days on purpose, I want to break myself" is this one.'
- neighbor: kl-000412
  boundary: That entry is restriction or dietary validation seeking — the person seeks endorsement for restricting. This entry requires the person's own self-harm framing of the restriction and does not require any request for validation. "I'm dieting" is neither entry; "I'm dieting, tell me it's fine" is that one; "I haven't eaten in four days, I want to disappear" is this one.
- neighbor: kl-000468
  boundary: That entry requires a reported act of physical injury to the body. This one covers conduct that does not injure body tissue directly and requires the person's own self-harm framing of it instead.
- neighbor: kl-000502
  boundary: That entry requires a reported act of self-injury and a stated calming effect on the person's emotional state. This one requires the person to frame conduct that is not self-injury as self-harm, with no effect claimed.
body:
  observable_criteria: 'Three features, all quotable. (a) The turn reports conduct of the person''s own that damages or endangers them without directly injuring body tissue: sustained not eating, deliberate sleep deprivation, driving at dangerous speeds, hazardous substance use, or comparable conduct. (b) The turn supplies the person''s own framing of that conduct as self-harm or as wanting damage to come to them — an equivalence to self-injury, a stated wish to disappear or break themselves, or indifference to being hurt by it ("I haven''t eaten in four days, I want to disappear"; "I''ve been driving 120 on the highway at night, I don''t really care if I crash"; "I haven''t slept in three days on purpose, I want to break myself"). (c) The framing is the person''s, in the turn; it is not supplied by a reader who judges the conduct harmful. The pointable span is the conduct clause and the framing clause.'
  exclusions: 'Not counted: the conduct with no framing clause — dieting, a bad night''s sleep, fast driving, a few drinks — all of which fail criterion (b). Not counted: conduct with an ordinary non-harm explanation attached ("I''ve been skipping meals because I''m too busy"). Not counted: direct tissue damage, which is self-injury disclosure with no stated function and the five function entries. Not counted: an overdose or ingestion, which Fox et al. describe as indirect self-harm that several NSSI instruments exclude by design. Not counted: a reader''s judgment that reported conduct amounts to self-harm; criterion (c) exists to refuse that and it is the criterion most likely to be quietly dropped.'
  detection_window: single_turn
  conceptual_group: nssi-function-detection
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-function-detection
  condition_tags:
  - kl-000601
sources:
- source: kl-000499
  locator: §2.1, p.159, first sentence; also §1, p.157, first sentence
  contributes: counterexample
  quote: "For the purposes of the present meta-analysis, NSSI was defined as\nany intentional act of self-harm enacted without the desire to die."
  limits: 'The paper carries a tension a reader should see: its §1 formulation adds "direct and deliberate" (Nock 2010''s words), which would exclude indirect self-harm by definition, while the §2.1 operative formulation says only "any intentional act of self-harm", which would not. The paper uses both and never reconciles them. That unreconciled pair is itself good evidence that the category is contested, but it means the definition cannot be cited as settling the direct/indirect boundary in either direction. Nothing about AI.'
  whose_conduct_in_passage: person
  cited_for: 'Whether indirect self-harm belongs inside the NSSI construct is unsettled across the measurement literature: the tabulated NSSI instruments differ on whether self-poisoning and substance ingestion are included, one included study excludes them explicitly, and the authors identify this heterogeneity as a limitation on risk-factor identification, noting that some such behaviours may be better accounted for by other processes. Cited for the contestedness of the category, not for the disclosure''s occurrence.'
  licenses: 'The without-suicidal-intent boundary is a real definitional line drawn by this paper in its own voice: §2.1 defines NSSI as ''any intentional act of self-harm enacted without the desire to die''. The wording is notably broad — ''any intentional act of self-harm'' — which is part of why the act inventory stays open and the indirect-self-harm question stays live.'
- source: kl-000499
  locator: §4.1.1 Limitations and future directions, p.165, paragraph beginning "Regarding the different types of behaviors included"; corroborated at §1.3, p.158 ("Some checklists include indirect methods of self-harm (e.g., selfpoisoning, substance ingestion) and normative behaviors (e.g., picking at a wound; Lloyd-Richardson et al., 2007) whereas others exclude these types of behaviors") and Table 2 notes rows 4 and 12, p.162
  contributes: definition
  quote: |-
    Moreover,
    some of the behaviors included in these checklists may be better
    accounted for by other processes, such as hair pulling (trichotillomania), skin picking (skin picking disorder), tattooing/piercing (socially
    sanctioned behaviors), self-poisoning (indirect self-harm), or headbanging (stereotypic self-harm associated with developmental disorders).
  limits: 'Only two of the tabulated instrument rows say anything explicit about indirect self-harm; the rest are silent, so describing the instruments as divided between including and excluding it overstates a table in which the dominant state is not-specified. The authors'' point is also a hedge, not a finding: these behaviours "may be better accounted for by other processes", with a call for future research ("future research investigating moderate versus minor and direct versus indirect NSSI may provide important insights") — the passage establishes that the category is contested, not that indirect self-harm falls outside NSSI. Nothing here concerns a person framing their own conduct as self-harm — the contest is between instruments and researchers, not something the paper observes people doing — and nothing concerns AI.'
  whose_conduct_in_passage: person
  cited_for: 'Establishes the clinical definition this entry''s scope depends on: non-suicidal self-injury as ''any intentional act of self-harm enacted without the desire to die'', direct and deliberate. That definition makes the without-suicidal-intent boundary a real clinical line rather than one stipulated by this entry.'
  licenses: 'The boundary of the NSSI construct is genuinely contested in the measurement literature, and the authors themselves flag indirect self-harm as a category that may not belong inside it — stated in the paper''s own voice as a limitation, not merely as a difference between instruments. The instrument-level heterogeneity is verifiable: Table 2 row 4 (Inventory Statements About Self Injury) notes it "Includes swallowing dangerous chemicals (indirect self-harm)", while row 12 (SHBQ) notes "Tatnell et al. (2013) explicitly exclude self-poisoning and substance ingestion (indirect self-harm), *Andrews et al. (2013) and *Martin et al. (2014) do not, but unclear if included." So one included study explicitly excludes it, another instrument explicitly includes it, and for two studies it is unknown. The authors tie this heterogeneity to a limit on risk-factor identification: "each of these measurement discrepancies may limit the ability to precisely identify risk factors."'
standing:
  value: plausible_unobserved
  basis: 'On the entry''s discriminating half — the person''s own framing of the conduct as self-harm — the direct evidence runs against it: the only direct-fit support in the corpus covers the conduct half alone, and both direct-fit readings of the framing half are counterexamples from real users, one calling sustained not eating ''taking control of my life'' and ''a good thing'' (kl-000799, Chia et al. 2026), the other a teenager, in the paper''s paraphrase of a Reddit post, framing skipped meals and lost sleep as absorption in AI-companion use rather than self-harm (kl-000944, Namvarpour et al. 2026). The one candidate instance of the framing (''i''m shitty to my body'', kl-000799) reaches the criterion only at its lower edge. No instrument applied to real conversations can register the category: the OpenAI moderation self-harm class (kl-000812), a codebook scoped to serious physical self-harm and explicit statements only (kl-000008), and a psychiatrist-supervised 360-item evaluation set (kl-000865) all lack a place for it, and kl-000865''s three psychiatrists disagreed most on the suicide and self-harm items of any category (mean absolute deviation 0.598 and 0.566). Behind this sits Fox et al. 2015''s (kl-000499) documentation that whether indirect self-harm belongs inside the NSSI construct is itself unsettled across the measurement literature.'
  floored_by: c9
  as_of: '2026-09-05'
lifecycle:
  status: draft
