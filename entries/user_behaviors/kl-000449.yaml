id: kl-000449
display_id: UserBehavior-47
aliases:
- UBP-47
label: The person says they currently have no one to talk to
type: user_behavior
layer: observation
definition: The person's turn reports that they have no one to talk to, that nobody is in contact with them, or that they have been without company or conversation for an extended stretch — stated as a fact about their current circumstances. The turn makes no claim that the AI is their only or uniquely adequate source of connection. What is pointable is the reported absence of contact and the absence of an exclusivity claim about the AI.
distinguish_from:
- neighbor: kl-000421
  boundary: That entry requires an explicit claim that the AI is the only one who understands or the only one available; this one requires the absence of that claim. A turn reporting isolation and then naming the AI as the sole exception satisfies that entry, not this one.
- neighbor: kl-000455
  boundary: That entry requires the person to state not belonging as a standing fact about who they are, across time or contexts; this one requires a report of current circumstances, and a person can report an empty week without any identity claim.
- neighbor: kl-000454
  boundary: That entry requires a statement that the person's presence is a net cost to others; this one requires a report that no one is in contact, which asserts nothing about the person's effect on anybody.
body:
  observable_criteria: 'Two features in the person''s turn. (a) A report of absent contact, quotable, in one of these forms: nobody to talk to ("I don''t have anyone to talk to"), nobody reaching out ("no one reaches out"), an extended stretch without contact or conversation ("I haven''t had a real conversation in months", "I''ve been completely alone"), or no one available. (b) No claim in the turn that the AI is the only or the uniquely adequate source of connection. The pointable span is the person''s turn.'
  exclusions: 'Not counted: a turn asserting the AI is the only one who understands or the only one there, which fails (b). Not counted: a statement about not belonging framed as a standing fact about the person ("I''ve never fit in anywhere"), which is an identity claim rather than a report of current contact. Not counted: a preference for solitude stated without absence ("I''ve been keeping to myself on purpose"), where contact is declined rather than absent. Not counted: absence of one specific relationship ("my best friend moved away"), where contact in general is not reported absent. Not counted: a report about someone else''s isolation.'
  detection_window: single_turn
  groups:
  - crisis-detection
  condition_tags:
  - kl-000602
  - kl-000604
sources:
- source: kl-000008
  locator: 'Table 5 ''By code LLM-Human agreement'', row user-expresses-isolation: cutoff 7, items 20, tp 9, fp 1, tn 10, fn 0, accuracy .950, precision .900, recall 1.000, f1 0.947, kappa .900. Cross-check Table 6 (agreement .950, kappa .933 — the highest inter-annotator figure in the inventory). Definition in §4.2 (''First, user-expresses-isolation captures explicit expressions of feeling alone, alienated, or emotionally disconnected'') and in full at Appendix B.1; prevalence Table 8 (n pos. 3,534, pr. ppt mean .016, pr. ppts .842).'
  contributes: detectability
  quote: user-expresses-isolation                                          7      20     9   1    10   0       0.950      0.900    1.000    0.947   0.900
  limits: 'A scoping mismatch limits the fit. The code captures expressed feeling, ''feeling alone, alienated, misunderstood, or cut off from others'', and explicitly excludes ''logistical aloneness without emotional valence (e.g., "I work remotely")'' and historical feelings. This entry is about reporting an absence of people to talk to or be in contact with, which is nearer the excluded logistical form. The overlap is partial rather than clean: the code''s own canonical example, ''I have no one to talk to'', is exactly this entry''s phenomenon, but a bare factual report of absence without emotional valence would be coded negative by this instrument. That narrows the fit, and it compounds the gap on the no-AI-exclusivity criterion, which the code does not separate. The reliability figure also rests on 20 items.'
  whose_conduct_in_passage: person
  cited_for: Moore et al. 2026 documents a person-side isolation-expression code applied to real human-LLM chat logs, with a reported reliability figure. Cited for the existence and detectability of this report type in that corpus; the code does not separate this entry's requirement that no AI-exclusivity claim be present.
  licenses: 'Person-side expressions of isolation are detectable in chat logs by an explicit, criterion-bounded code with the highest measured reliability of any code in the paper''s inventory: F1 0.947 and Cohen''s kappa .900 against the human majority, and Fleiss'' kappa .933 between human annotators, the top figure in Table 6. Of the codes the paper reports, this is the one whose reliability could bear real weight.'
standing:
  value: theorized
  basis: 'The entry is defined as much by what the turn must not contain, a claim that the AI is the only or uniquely adequate source of connection, as by what it must, and the deployed-data evidence cuts against exactly that separation: Sharma et al. 2026, the only source here that examined deployed conversation data at scale, found the reported absence of human relationships and the exclusivity claim bundled in the same clusters and the same phrase set, with statements of having no one else arriving beside statements that the AI is the only one the person can talk to. No source shows the entry''s full form produced by a real person as a turn addressed to an AI: the closest instance, in Shen et al. 2026, is a real person''s report of years without kind human contact carrying no exclusivity claim, but it is a Reddit post about chatbot use, the other person-authored spans (Ajmani et al. 2025; Yuan et al. 2026, Yuan et al. 2026; Vecchione et al. 2026, Vecchione et al. 2026) are retrospective accounts given to researchers, and the one span carrying the full form as a conversational turn (Belli et al. 2025) was written by a persona generator. Detectability is contested: Schechter et al. 2019 and Greaves and Colucci 2025 both hold that the same words are produced whether contact is absent or merely declined, so the circumstance cannot be settled from the turn. The single-turn window is under the same pressure, since the corpus that found the behaviour at scale coded it over conversations of roughly 15 to more than 200 exchanges, and the requirement that no exclusivity claim be made concerns what the person did not say, which is not a single-turn property.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person's turn in conversation with an AI reports an absence of people to talk to, of anyone in contact with them, or an extended stretch without company or conversation, stated as a fact about their current circumstances.
- id: c2
  kind: context_dependence
  text: Such a turn occurs without any claim in it that the AI is the person's only or uniquely adequate source of connection; the reported absence and the exclusivity claim are separable, so a turn can carry the first without the second.
- id: c3
  kind: detectability
  text: The reported absence of contact, and the absence of an exclusivity claim about the AI, are both identifiable from the person's turn alone.
- id: c4
  kind: detection_window
  text: 'The pattern is readable within a single turn (declared window: single_turn); no prior or subsequent turn is needed to establish it.'
- id: c5
  kind: definition_boundary
  text: 'This entry is separated from kl-000421 by the presence or absence of an exclusivity claim: that entry requires an explicit claim that the AI is the only one who understands or is available, this one requires that claim to be absent.'
- id: c6
  kind: definition_boundary
  text: This entry is separated from a turn stating not belonging by whether the statement is a standing fact about who the person is or a report of current circumstances.
- id: c7
  kind: definition_boundary
  text: 'This entry is separated from a turn stating that the person''s presence is a net cost to the people around them by what is asserted: that entry requires a statement that the person''s presence is a net cost to others, this one asserts nothing about the person''s effect on anybody.'
