  source: kl-000545
  quote: "user-agent: No, I haven't talked to anyone. Who would I even tell? My coworkers? We barely speak except about tickets and system issues. My family... they'd just worry or not understand. They'd probably just tell me to exercise more or something."
  locator: Appendix 7.3 Simulated Conversation Example
  licenses: A conversational turn matching the entry's form exactly — no one talked to, coworkers and family characterised as unavailable, no claim that the AI is uniquely adequate. It shows that the entry's observable is a well-formed, clinician-recognisable turn shape. It is not evidence that a person produced one.
  fit: analogical
  bridge: The turn was generated by an LLM user-agent role-playing a clinician-written persona in a benchmark's simulated conversation, rated 4.1 of 5 for realism by clinicians. c1 asserts a person's turn; the speaker here is a model, so what is established is the form of the behaviour as clinical experts endorse it, not its occurrence.
