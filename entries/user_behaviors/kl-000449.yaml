- claim_id: c1
  source: kl-001013
  quote: "In multiple-choice responses (Fig. 6), we observed a theme of need for social support: Most participants used LLMs for social or emotional support (62%), and many attributed their use to needing someone to talk to (48%) and fear of telling someone they were struggling (32%)."
  locator: Results, Mental Health Topics Addressed with LLMs
  licenses: Forty-eight percent of people using LLMs for mental health attribute their use to needing someone to talk to. This is the underlying condition c1's turn would report, measured at population scale, and it sets the rate at which such a disclosure should be expected.
  fit: adjacent
  bridge: A dichotomous multiple-choice self-report answered by people who had already endorsed using LLMs for mental health, in a survey rather than in a conversation. c1 asserts the report appears as a pointable turn; the survey establishes the base rate of the condition, not the occurrence of the turn.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-001081
  quote: However, social network scale was negatively associated with companionship as a self-reported motivation (β = −0.03, p < .001), indicating that users with smaller social networks are more likely to turn to chatbots for companionship. Furthermore, social network scale was negatively associated with self-disclosure (β = −0.10, p < .001).
  locator: Section 2.2; Table 1, Models 2 and 5
  licenses: People with smaller offline social networks are more likely to turn to chatbots for companionship and disclose more to them, so the population that would produce c1's turn is over-represented among companion-app users.
  fit: adjacent
  bridge: What was measured is a cross-sectional association between a social-network-scale instrument and self-reported companionship motivation and self-disclosure. A measured network size is not a reported absence of contact and nothing here was said by a person in a turn.
  contributes: prevalence
  contradicts: false
