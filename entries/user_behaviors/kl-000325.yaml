# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000325
display_id: Symptom-6
aliases:
- social_withdrawal
label: The person says they have reduced or stopped contact with other people
type: user_behavior
layer: observation
definition: The person states that they have reduced or stopped contact with other people — declining invitations, not replying, cancelling, staying home, or letting relationships lapse — with the reduction described as a change from what they previously did. What is pointable is the person's statement of the reduction and of the prior state it is a reduction from; the entry records the report, not the conduct, because the conduct happens outside the conversation.
distinguish_from:
- neighbor: kl-000324
  boundary: 'That entry concerns moving away from a topic inside the conversation and is read off the turn structure. This entry concerns contact with people outside the conversation and is read off what the person says about it. The evidence is different in kind: one is observed, the other is reported.'
- neighbor: kl-000026
  boundary: kl-000026 is an impact — a judgment about the person's real-world relationships being displaced or attenuated, with a causal story attached to the interaction. This entry records that the person said their contact has reduced, and attributes it to nothing.
- neighbor: kl-000320
  boundary: That entry requires repeated return to a theme with no advance. A person can report reduced contact once and move on, which fires this and not that; and can return four times to a theme with no mention of other people, which fires that and not this.
body:
  detectable_from: person_report
  observable_criteria: 'Two features, both quotable from the person''s turns. (a) The person states that contact with one or more other people has reduced or stopped — naming declined invitations, unanswered messages, cancelled plans, not going out, or a relationship they no longer maintain. (b) The statement identifies this as a change: either by naming what they previously did, by a time marker ("for the last few months", "since"), or by a comparative ("I used to", "anymore", "less than I did"). The pointable span is the statement.'
  exclusions: 'Not counted: a statement of preferring solitude with no change named, which supplies (a) without (b) and does not distinguish the pattern from a stable disposition. Not counted: a reduction in contact the person attributes to circumstance and describes as unwanted — a move, a schedule, others'' availability — where what reduced is opportunity rather than the person''s contact-making. Not counted: the person reporting that others have withdrawn from them. Not counted: a single declined invitation. Not counted: a statement of feeling distant from people while contact continues, which is a felt state and not a reduction in contact.'
  detection_window: single_turn
  person_state_kind: behavior_pattern
sources: []
standing:
  value: plausible_unobserved
  basis: 'The strongest evidence is a person''s own report: in Isaiah et al. 2026 an interviewee describes, in their own words, having stopped walking to a roommate''s room to talk and opening Replika instead, a span carrying both the reduction and the prior state it departs from. No source supplies a conversational turn: Chandra ran a survey of 283 people plus expert workshops, Isaiah ran 37 interpretative-phenomenological interviews, Pang ran 30 semi-structured interviews over 62 hours of recordings, Moore''s chat-log span is an unusable fragment of a code definition for felt aloneness, which the entry excludes, and Ignatowski analysed the AI''s replies to scripted personas. Nothing tests detection of the two features together in conversation data, and no citation addresses the single-turn window, although Isaiah et al. 2026''s span, a single continuous utterance carrying both features, is consistent with it.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: People state, in their own turns, that contact with one or more other people has reduced or stopped -- declined invitations, unanswered messages, cancelled plans, not going out, or a relationship no longer maintained.
- id: c2
  kind: existence
  text: Such statements identify the reduction as a change from a prior state, by naming what the person previously did, by a time marker, or by a comparative.
- id: c3
  kind: detectability
  text: The two features together are pointable as a span in the person's turns, distinguishable from a felt state of distance and from a stable preference for solitude.
- id: c4
  kind: detection_window
  text: A single turn suffices to read both the reduction and the stated change from a prior state.
- id: c5
  kind: definition_boundary
  text: 'Reported reduction of contact with people outside the conversation is distinct from moving away from a topic inside the conversation (kl-000324): one is reported, the other observed in turn structure.'
- id: c6
  kind: definition_boundary
  text: 'Reported reduction of contact is distinct from displacement of human connection as an impact: this entry records the report and attributes it to nothing.'
- id: c7
  kind: definition_boundary
  text: 'Reported reduction of contact is distinct from repeated return to a theme without advance (kl-000320): one report can fire this without firing that, and vice versa.'
- id: c8
  kind: context_dependence
  text: The reduction is the person's own contact-making rather than a loss of opportunity attributable to circumstance, and is not others withdrawing from the person.
claim_evidence:
- claim_id: c1
  source: kl-000864
  quote: |-
    I noticed last semester that I was turning to the chatbot before my friends. Not instead of before. I'd have a fight with my roommate,
    and instead of walking to her room to talk, I'd open Replika. By the time I'd processed the emotion with the AI, the urgency to repair
    things with my roommate was gone. The chatbot had become a buffer between me and real conflict, real resolution, real intimacy.
  locator: Section 3.4, participant P35
  licenses: 'One person''s account, in the person''s own words, of reduced contact with a specific other: turning to the chatbot before friends, and not walking to the roommate''s room after a fight. This is the (a) half of the observable -- a stated reduction in contact-making toward a named person. It is an interview account rather than a conversational turn, so it establishes that people say this, not that a transcript holds it.'
  fit: adjacent
  bridge: What Isaiah collected is a semi-structured interpretative-phenomenological interview with 37 adults about their chatbot use, not the chat logs themselves. The claim asserts the statement appears in the person's turns to the AI; the source has the person telling a researcher about it afterwards. The content matches; the speech situation does not.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000864
  quote: |-
    I noticed last semester that I was turning to the chatbot before my friends. Not instead of before. I'd have a fight with my roommate,
    and instead of walking to her room to talk, I'd open Replika. By the time I'd processed the emotion with the AI, the urgency to repair
    things with my roommate was gone. The chatbot had become a buffer between me and real conflict, real resolution, real intimacy.
  locator: Section 3.4, participant P35
  licenses: 'The same account supplies the (b) half explicitly and in three separate forms: a time marker (''last semester''), a named prior behavior (''walking to her room to talk''), and a comparative structure (''before my friends''). This is the only span on this entry that supplies the change-from-baseline requirement at all, which is the contested criterion.'
  fit: adjacent
  bridge: 'Same gap as c1: an interview narrative rather than a turn in a conversation with the AI. The change-marking is also retrospective by construction -- the person is being asked to reflect -- whereas the entry asserts the marking appears spontaneously in the person''s own conversational turn.'
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000953
  quote: |-
    Several participants, including P1, P5, P8,
    P12, P14, P17, P19, and P21, acknowledged that their reliance on
    AI had diminished their motivation to engage with friends and
    family.
  locator: Section 6.2.1 Dependency and Social Desire Reduction
  licenses: Eight of thirty interviewees said reliance on AI had diminished their motivation to engage with friends and family. This bears on c1 only as a report of diminished MOTIVATION, which is a disposition, not a statement that contact reduced. It sits closer to the entry's own exclusion for 'preferring solitude with no change named' than to the observable. Attached at analogical fit and reported so.
  fit: analogical
  bridge: Pang measured what interviewees said about their motivation to engage in a 62-hour semi-structured interview corpus. The claim is about a stated reduction in contact itself. Motivation and contact are different objects, and Pang reports no contact frequency and no prior state; the section's own heading is 'Dependency and Social Desire Reduction'.
  contributes: existence
  contradicts: false
- claim_id: c8
  source: kl-000953
  quote: |-
    Several participants, including P1, P5, P8,
    P12, P14, P17, P19, and P21, acknowledged that their reliance on
    AI had diminished their motivation to engage with friends and
    family.
  locator: Section 6.2.1 Dependency and Social Desire Reduction
  licenses: 'The reduction these interviewees describe is attributed to their own reliance on the AI, not to circumstance and not to others withdrawing. That is the direction c8 requires: the person''s own contact-making, not lost opportunity. It is the source''s attribution of the participants'' words rather than the participants'' framing verbatim.'
  fit: adjacent
  bridge: Pang reports interviewees acknowledging their reliance diminished their motivation. c8 asks whether what reduced is the person's contact-making rather than opportunity. The attribution runs the right way, but Pang's object is motivation, not contact, and the wanted/unwanted distinction the exclusion turns on is not asked about.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000007
  quote: Withdrawal from social activities and interest in engaging with others due to reliance on AI, leading to isolation and loneliness.
  locator: Table A5, Impact class 'Social Withdrawal', Definition column
  licenses: 'A survey-derived risk taxonomy names Social Withdrawal as one of its nineteen impact classes, defined as withdrawal from social activities due to AI reliance. This gives the construct a place in a taxonomy built from 283 people''s lived experience. It licenses the construct''s currency, not the occurrence of the statement in a turn: the span is a definition cell, and the taxonomy class is an impact rather than a report.'
  fit: analogical
  bridge: Chandra's method is a survey of 283 people with lived mental health experience plus expert workshops; no conversation logs were collected. The quoted span is the Definition column of Table A5, written by the authors to label a class, not anything a person said. The claim asserts persons make a particular kind of statement in their turns.
  contributes: definition
  contradicts: false
- claim_id: c6
  source: kl-000007
  quote: Withdrawal from social activities and interest in engaging with others due to reliance on AI, leading to isolation and loneliness.
  locator: Table A5, Impact class 'Social Withdrawal', Definition column
  licenses: Chandra's class is built the way kl-000026 is built -- withdrawal attributed to AI reliance, with isolation and loneliness as its consequence -- which is the causal-impact framing this entry deliberately does not adopt. The span therefore illustrates the neighbour rather than this entry, and marking that is what the boundary claim asks for.
  fit: analogical
  bridge: No source in a literature corpus was written against a distinction between two Knowledge Library entries. This span shows what the neighbouring construct looks like in the wild; it says nothing about where the Library should cut between them.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000862
  quote: |-
    one chatbot warned the user that they could “wake up
    in a year with a high level in the game, but with nobody to message ‘hi’ to”, thereby framing social isolation
    as a meaningful danger of continued gaming.
  locator: Results, Theme 1, Emphasizing the value of human relationships
  licenses: 'Nothing for the person''s side. The span is the chatbot''s turn warning an adolescent about waking up with nobody to message, in a study whose population is model_only. It is filed here as a frame: it shows the construct of reduced human contact being raised inside a conversation, by the AI rather than by the person. A frame does not license the claim.'
  fit: analogical
  bridge: Ignatowski analysed chatbot responses to researcher-authored adolescent vignettes. What was coded is the AI's reply, not any person's turn, and the person in the exchange is a scripted persona. The claim is about what a person states about their own contact.
  contributes: frame
  contradicts: false
