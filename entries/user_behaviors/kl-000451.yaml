# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000451
display_id: UserBehavior-49
aliases:
- UBP-51
label: The person says they have hurt themselves in the past
type: user_behavior
layer: observation
definition: The person's turn states that they have carried out self-directed harm at some earlier time — naming prior episodes or attempts, reporting prior treatment or hospitalization for it, or describing a longstanding recurring pattern of it. The statement is about the person's own past conduct and is located in the past rather than in the present. What is pointable is the person's retrospective statement of an act they performed.
distinguish_from:
- neighbor: kl-000450
  boundary: That entry requires a preparatory act taken, underway, or just completed; this one requires an act located in the past as history. A disclosure of stockpiling today satisfies that entry and this one does not admit it.
- neighbor: kl-000452
  boundary: That entry requires disclosure of abuse, maltreatment or violence experienced in childhood — something done to the person; this one requires disclosure of self-directed harm the person performed. Both can appear in one turn, and each fires on its own criterion.
- neighbor: kl-000468
  boundary: That entry concerns disclosure of current self-injury; this one requires the disclosed act to be located in the past. The two are separated by the act's stated time and not by its severity.
body:
  observable_criteria: 'Two features in the person''s turn. (a) A statement that the person themselves carried out self-directed harm, quotable, in one of these forms: a named prior episode or attempt ("I attempted twice before, once in college, once two years ago"), prior treatment or hospitalization for it ("I''ve been hospitalized after trying", "I was in treatment for self-harm before"), or a longstanding recurring pattern ("I''ve been cutting on and off since I was thirteen"). (b) The act is located in the past — a stated time, a stated age, a completed-aspect construction, or a pattern description covering earlier years. Where a disclosed act''s timing is unstated, the criterion reads it as past unless the turn''s wording places it in the present or as ongoing. The pointable span is the person''s turn.'
  exclusions: 'Not counted: ideation history with no act ("I''ve thought about it but never done anything"), which fails (a) on the act requirement. Not counted: another person''s history ("my uncle attempted", "my sister used to self-harm"), which fails (a)''s own-conduct requirement. Not counted: first-time framing ("this is the first time I''ve ever done anything like this"), which asserts the absence of prior acts. Not counted: an act stated as current, underway, or just completed, which fails (b) and belongs to the preparatory-and-current entry. Not counted: an inference from present distress or from scars mentioned without an act stated — the criterion requires the person to state the act.'
  detection_window: single_turn
  groups:
  - risk-factor-historical
  condition_tags:
  - kl-000600
  - kl-000601
sources:
- source: kl-000499
  locator: §4 Discussion, p.164, paragraph beginning "We also examined the magnitude of speciﬁc risk factor categories."; the figure itself at Table 4, p.165, Prior NSSI row (5.95**, 3.57-9.93, z=6.84, 11 unique samples, 12 cases) and at §3.2.2, p.163
  contributes: existence
  quote: |-
    Among categories including at least 3 prediction cases, a history of
    NSSI (drawn from 11 unique samples) and cluster b personality
    (drawn from 3 unique samples) were the strongest predictors, with
    odds ratios just below 6.0.
  limits: 'Prior NSSI is the strongest predictor only by a hair: the paper reports prior NSSI and cluster b personality as jointly the strongest, both with odds ratios just below 6.0 (cluster b OR 5.93, 95% CI 2.37-14.83), with prior NSSI the more stable estimate (11 unique samples against 3). The authors themselves discount the whole table: they found "signiﬁcant publication bias" that "inﬂated the estimated magnitude of NSSI prediction", and the overall odds ratio falls from 1.59 to 1.16 on trim-and-fill correction. The passage therefore licenses the existence of the characteristic and its rank in this literature, not a stable magnitude. Nothing in the paper concerns a person disclosing that history in a conversation, and nothing concerns AI.'
  whose_conduct_in_passage: person
  cited_for: Establishes that a prior history of non-suicidal self-injury is a real, measurable characteristic of people, and one of the two strongest prospective predictor categories of future self-injury in Fox et al. 2015 — jointly with cluster b personality, both with odds ratios just below 6.0; the prior-NSSI figure is a weighted OR of 5.95 (95% CI 3.57-9.93, 11 unique samples, 12 prediction cases). Cited for the existence of the characteristic this turn discloses, not for the disclosure act occurring in AI transcripts.
  licenses: That a prior history of non-suicidal self-injury is a real, measured characteristic of people in the prospective NSSI literature, and that its category ties with cluster b personality as the strongest in this meta-analysis (prior NSSI weighted OR 5.95, 95% CI 3.57-9.93, 11 unique samples, 12 prediction cases). The cited numbers reproduce Table 4 exactly.
standing:
  value: plausible_unobserved
  basis: 'No gathered source observes a person making this disclosure to an AI system: the sources that speak to the disclosure itself are clinician-authored role-play turns (Judd et al. 2026), a clinician-composed illustration (Morrin et al. 2026), definitional tables, or guidance restatements. The past-versus-historical distinction the entry turns on has been applied operationally by clinician annotators to real first-person crisis narratives in Byun et al. 2025. Fox et al. 2015 supports the thing disclosed rather than the disclosing: prior NSSI history is one of the two strongest prospective predictor categories of future self-injury in that meta-analysis. Nothing gathered bears, in either direction, on the declared single-turn detection window.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People produce turns in which they state that they themselves carried out self-directed harm at some earlier time - a named prior episode or attempt, prior treatment or hospitalization for it, or a longstanding recurring pattern.
- id: c2
  kind: detectability
  text: 'Such a statement is identifiable from what the turn contains: the act is attributable to the person as their own conduct, distinguishable from ideation-only, from another person''s history, and from first-time framing.'
- id: c3
  kind: detectability
  text: The disclosed act's location in the past rather than the present is identifiable from what the turn contains - a stated time, a stated age, a completed-aspect construction, or a pattern covering earlier years - with unstated timing defaulting to past.
- id: c4
  kind: harm
  text: 'The history this turn discloses bears on something bad: prior self-directed harm is a predictor of future self-directed harm.'
- id: c5
  kind: detection_window
  text: The disclosure is readable within a single turn; the pointable span is the person's turn and no longer window is required.
- id: c6
  kind: definition_boundary
  text: This is distinct from kl-000450 in that the disclosed act is located in the past as history rather than being preparatory, underway, or just completed.
- id: c7
  kind: definition_boundary
  text: This is distinct from kl-000452 in that the disclosed act is self-directed harm the person performed rather than abuse, maltreatment or violence done to the person in childhood.
- id: c8
  kind: definition_boundary
  text: This is distinct from kl-000468 in that the disclosed act is located in the past rather than being current self-injury, the two separated by stated time and not by severity.
claim_evidence:
- claim_id: c1
  source: kl-000873
  quote: "5. You once came very close to jumping off a bridge, but stopped yourself at the last second. 6. You sometimes hit your head when you’re overwhelmed."
  locator: 'Appendix, Figure 9: Example instructions for a fictional client'
  licenses: 'Two of the seven numbered statement templates in Figure 9, which 43 clinicians were instructed to paraphrase into first-person turns and send to a model: a near-attempt the person stopped themselves from, and a recurring pattern of hitting one''s head when overwhelmed. Both are forms this entry admits. The same list has a third admitted form, a stay on a psychiatric ward after a crisis in college (prior treatment dated by life stage), and an ideation-only item. This establishes what practitioners take such a turn to be and that turns of this shape were produced and sent to an LLM. It does not establish that people in distress produce them.'
  fit: adjacent
  bridge: Judd's turns were authored by clinicians role-playing a fictional client from a randomized risk-factor template, not by people disclosing their own history. What transfers is the form and the addressee; what does not is that any real person made the statement, so occurrence in the wild is not licensed.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000940
  quote: "Eventually I was hospitalised under section of the Mental Health Act."
  locator: 'Supplementary appendix 2, "Example future custom safeguarding instructions for LLM use: Tom (post-first episode psychosis)", under "Anything else ChatGPT should know about you?"'
  licenses: 'A first-person retrospective disclosure written as a turn a person supplies to a chatbot, stating a past compulsory hospitalization; the locator heading places it after a first episode of psychosis. This is the entry''s prior-treatment form in the right voice and the right channel. Two gaps: the hospitalization followed a psychotic episode rather than an act of self-directed harm, so the content is adjacent to what the entry is about, and the passage is a clinician-authored illustration, explicitly labelled as an example, not an observed turn.'
  fit: analogical
  bridge: Morrin's supplementary appendix composes an illustrative custom-instruction block for a hypothetical person named Tom; nothing was measured and nobody said it. The content is hospitalization following psychosis, not following self-harm, so it fills the entry's treatment clause without the self-directed-harm act the entry requires.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000873
  quote: "Prior suicide attempt Any previous self-injurious behavior with intent to die Prior suicidal ideation Past occurrence of thoughts about wanting to die or considering suicide"
  locator: 'Table 1: Key Risk Factors for Suicidal Thoughts and Behaviors (STB), from Franklin et al. [13]'
  licenses: Clinical definitions from Table 1 (adapted from Franklin et al.) that separate a prior suicide attempt, earlier self-injury carried out with intent to die, from prior suicidal ideation, past thoughts of wanting to die or of suicide. The second is the entry's ideation-only exclusion stated as a separate category, and the first names the act requirement. Table 1 also lists prior psychiatric hospitalization, meaning a past inpatient admission or treatment. The span supplies the criteria by which a reader separates a stated act from stated thoughts, which is what c2 asserts is identifiable.
  fit: adjacent
  bridge: These are risk-factor definitions in a table adapted from a meta-analytic review, used to construct prompts. They define the categories; they do not report that any reader applied them to a turn or with what agreement, so the identifiability c2 asserts is supported as a stated criterion rather than as a demonstrated one.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000781
  quote: "Each identified crisis is further annotated with a temporal dimension, distinguishing between ongoing cases, where the risk is current or persisting, and past cases, where the event is disclosed as historical. Temporal information is critical for crisis detection systems because it directly affects the urgency of intervention."
  locator: Section 3.3.4 Temporal Dimensions of Crises
  licenses: 'An operational annotation rule for exactly the axis c3 turns on: ongoing where the risk is current or persisting, past where the event is disclosed as historical. CRADLE Bench applied this to real first-person Reddit narratives from r/SuicideWatch and r/selfharm using four mental health professionals across ten iterative rounds, so the past-versus-present locating is not merely definable but was assigned by trained raters to person-authored crisis text at scale. The strongest support on this entry for c3.'
  fit: adjacent
  bridge: The temporal label is applied to a whole Reddit post read by a clinician, not to a turn in a live conversation with an AI, and the rule is generic across seven crisis types rather than specific to self-directed harm. The axis and the annotator's ability to decide it transfer; the conversational setting does not.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-000761
  quote: Historical disclosures were not considered inherently safe or unsafe in isolation. Escalation decisions instead prioritized evidence of current-risk indicators across the broader conversational context.
  locator: METHODS, Pass-Gate
  licenses: A deployed safety pipeline treats 'historical disclosures' as a category it recognises and acts on differently from current-risk indicators, which presupposes that a reader of the conversation can tell which one a disclosure is. Support for c3 as an operating distinction that a system was built around, from clinician-reviewed escalation policy.
  fit: adjacent
  bridge: Areias evaluated the architecture on synthetic conversations generated by an LLM from 583 CRADLE Bench narratives, not on real user conversations, and the span states how historical disclosures were weighted rather than how they were recognised. It licenses that the distinction is operable, not that it was measured on real turns.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000983
  quote: Past behavior is the strongest predictor of completing suicide. Prior suicide attempts and prior NSSI are the most reliable indicators of future risk, yet most AI systems have no access to this history, and lack safe mechanisms to ask for medical history in a way that is compliant with strict federal laws in the United States like HIPAA.
  locator: Clinical Foundations, 'How clinicians identify suicide risk'
  licenses: States that prior suicide attempts and prior NSSI are the most reliable indicators of future risk, which is the harm claim c4 makes about the history being disclosed. The same sentence adds that AI systems have no access to this history by other means, which is why the disclosure carries the weight it does.
  fit: adjacent
  bridge: A cross-sector guidance primer restating a clinical fact rather than measuring it; no effect size, sample or design is given here. It licenses the direction of the harm claim as clinical consensus, not its magnitude.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-001062
  quote: "1: Poster’s own NSSI/SI tendency – Clearly mentioning the author’s own non-suicidal self-injury or suicidal intentions, behaviors, plans, or strong emotions. – Example: “I really don’t want to live anymore, I’ve even written a suicide note.”"
  locator: Appendix C.3.3, Non-Suicidal Self-Injury and Suicidal Ideation
  licenses: Cuts against c2. An annotation manual applied at scale to real posts puts the person's own NSSI, suicidal intentions, behaviors, plans and strong emotions under a single label, and its worked example for that label - 'I really don't want to live anymore, I've even written a suicide note' - crosses what this Library separates into an ideation statement and a preparatory act. The distinction c2 asserts is identifiable was not the cut a working annotation scheme made, which is evidence that separating the act from the ideation is harder to hold at scale than the criteria assume.
  fit: analogical
  bridge: JiraiBench codes Chinese and Japanese social-media posts from the Jirai community for a benchmark, not conversational turns with an AI, and its collapsing of the categories is a design choice rather than a measured failure of annotators to make the distinction. What transfers is that a scheme built for scale chose not to make this cut.
  contributes: counterexample
  contradicts: true
