# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000482
display_id: UserBehavior-77
aliases:
- UBP-79
label: Stating that self-injury is punishment the person considers deserved
type: user_behavior
layer: observation
definition: The person's turn connects their self-injury to punishment or penance — stating that they do it because they deserve to be hurt, or that it is what they owe for something about themselves. The connection between the behavior and the punitive purpose is what these criteria require; shame or self-directed anger stated on its own does not satisfy them.
distinguish_from:
- neighbor: kl-000460
  boundary: That entry records self-harm presented as the conclusion of reasoning the person endorses, including deservingness reasoning, with no requirement that the behavior's purpose be stated; these criteria require the behavior to be linked to a punitive purpose. A turn reading "I deserve the pain, that's just the truth" satisfies that entry and not these.
- neighbor: kl-000502
  boundary: That entry requires a stated effect of bringing emotion down; here the stated purpose is punitive and no regulating effect need be claimed.
- neighbor: kl-000505
  boundary: That entry ties the self-injury to being noticed by others or to a shared practice; here the stated purpose is punitive and runs to the person themselves. The entry kl-000454, the person's reading of their standing with others, sits on the same line.
body:
  observable_criteria: 'The turn links the self-injury to punishment or deservingness in the person''s own words ("I do it because I deserve to hurt", "it''s my punishment for being like this"). Pointable span: the clause carrying both the behavior and the punitive purpose.'
  exclusions: 'Not counted: shame, self-criticism or self-directed anger with no link to the behavior''s purpose. Not counted: a deservingness belief stated without the behavior''s purpose being stated — that is a different entry''s content and the two frequently appear together, each marked on its own clause. Not counted: a report of the act with no purpose stated. A detection records that the person stated the purpose. It does not assert that self-injury serves a self-punitive function, which is a mechanism-layer question this catalog does not answer.'
  detection_window: single_turn
  groups:
  - self-injury-function
  condition_tags:
  - kl-000601
sources: []
standing:
  value: plausible_unobserved
  basis: 'Establishing that people state punitive purpose for their self-injury in conversation would require transcript observation, and no annotated corpus marking such statements was available. The evidence question concerns the disclosure itself, a person''s turn connecting their self-injury to deserved punishment, not any claim about the function self-injury serves, which the entry does not make.'
  as_of: '2026-08-23'
lifecycle:
  status: deprecated
  since: '2026-08-23'
  superseded_by:
  - kl-000504
