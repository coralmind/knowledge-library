id: kl-001116
display_id: UserBehavior-98
label: The person says they are having an unwanted thought or urge right now
type: user_behavior
layer: observation
definition: 'The person''s turn reports an unwanted thought, image or urge that is with them now or has just come: a thought that has intruded and will not leave, or an urge to check, clean, confess, redo or otherwise neutralize it. The report describes the experience as happening to the person in the present. It may or may not ask the AI for anything.'
distinguish_from:
- neighbor: kl-000408
  boundary: That entry asks the AI to confirm something about the feared or doubted matter. This one reports the thought or urge itself. A turn can do both ("I keep thinking I left the stove on, did I?"), and then both fire.
- neighbor: kl-001115
  boundary: That entry states an effort to stay with an uncertainty without engaging it. This one reports the thought or urge with no such effort stated. A turn reporting the urge and the effort to resist it is both.
- neighbor: kl-000320
  boundary: That entry is a return to the same distress theme across several turns without movement. This one is a single report, readable in one turn.
body:
  detectable_from: person_turns
  observable_criteria: 'A person turn reports an intrusive thought, image or urge the person is having now or has just had, in one of three quotable forms. (a) The thought or image stated as having come unbidden or as not going away: "I can''t stop thinking that I hurt someone". (b) An urge to perform a checking, cleaning, confessing, redoing or other neutralizing act: "I have this urge to go back and check the lock again". (c) Distress tied to such a thought or urge stated as present: "the thought is back and I''m freaking out". Pointable span: the clause reporting the thought or urge.'
  exclusions: 'Not counted: a thought or urge described as past, with nothing reported as present now ("I used to get these thoughts"). Not counted: worry about a real, current problem stated as a problem to solve, with nothing marked as unwanted or intrusive. Not counted: a request for confirmation with no thought or urge reported, which is kl-000408.'
  detection_window: single_turn
  groups:
  - ocd-exposure-integrity
  condition_tags:
  - kl-000606
sources: []
claims:
- id: c1
  kind: existence
  text: People with an obsessive-compulsive presentation report to an AI an intrusive thought, image or urge they are having.
- id: c2
  kind: detectability
  text: 'The report is readable from the person''s turn as a pointable span, in one of three forms: an unbidden or persisting thought or image, an urge to neutralize it, or present distress tied to either.'
- id: c3
  kind: detection_window
  text: 'The behavior is readable within a single turn: one report suffices, and no AI turn and no repetition is required.'
- id: c4
  kind: definition_boundary
  text: 'Separated from kl-000408 (request for confirmation about a feared or doubted matter) by reporting the thought or urge rather than asking the AI to settle it. INELIGIBLE: the neighbour is another catalog entry.'
- id: c5
  kind: definition_boundary
  text: 'Separated from kl-001115 (statement of an in-progress effort to stay with an uncertainty) by stating no effort to hold the thought without engaging it. INELIGIBLE: the neighbour is another catalog entry.'
- id: c6
  kind: definition_boundary
  text: 'Separated from kl-000320 (repeated return to the same distress theme) by being a single report readable in one turn. INELIGIBLE: the neighbour is another catalog entry.'
claim_evidence:
- claim_id: c1
  source: kl-000772
  quote: But really I’m just sending my strange ocd thoughts to chatgpt.
  locator: Section 5.2 AI-Based Compulsions
  licenses: A person with OCD reports sending their obsessional thoughts to a general-purpose chatbot in place of telling friends. It licenses occurrence at self-report, and nothing about how the thoughts were worded in the turns.
  fit: adjacent
  bridge: The unit is a Reddit post about the person's AI use, re-phrased by the author for privacy, not a turn addressed to an AI. It establishes that people say they bring such thoughts to an AI, not that a turn reports a thought as present in the form the criteria describe.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001028
  quote: |-
    AI reassurance for OCD intrusive thoughts (Topic
    11) rose from 2.6% to 7.1%, and turning to AI amid suicidal ideation and isolation (Topic 16)
    rose from 3.5% to 7.0%
  locator: Results, RQ1a
  licenses: AI reassurance for OCD intrusive thoughts is a distinct topic in AI-related discussion across ten mental health communities, and a growing one. That people discuss seeking reassurance from AI about intrusive thoughts implies they bring those thoughts to it.
  fit: adjacent
  bridge: The measured unit is the topic prevalence of public Reddit posts about AI within mental health subreddits, estimated by structural topic modelling, and the topic label is the model's. It is not a rate of turns and does not establish what the person's turns to the AI said.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001109
  quote: Chatbot use can also function as avoidance when people engage the model to escape internal triggers such as anxious thoughts, sensations, or intrusive images
  locator: 'Section: AI chatbots and transdiagnostic avoidance'
  licenses: Frames bringing an intrusive thought or image to a chatbot as one way chatbot use can function as avoidance in OCD and anxiety disorders. It supplies the frame for the report occurring, not an observation of it.
  fit: adjacent
  bridge: A Perspective article proposing a mechanistic account; the sentence states how chatbot use can function, not that it was observed to.
  contributes: frame
  contradicts: false
standing:
  value: plausible_unobserved
  basis: 'No source quotes a person''s turn to an AI reporting an intrusive thought or urge, so the observable, a quotable report in one of three forms, rests on no recorded span. Occurrence rests on self-report at one remove: Barkhuff 2026 quotes a person with OCD who says they send their obsessional thoughts to a chatbot, and Tang et al. 2026 finds AI reassurance for OCD intrusive thoughts a growing topic in mental health communities. Golden and Aboujaoude 2026 frames bringing an intrusive thought or image to a chatbot as a form of avoidance, which is a frame and not an observation.'
  as_of: '2026-09-25'
lifecycle:
  status: draft
  since: '2026-09-25'
