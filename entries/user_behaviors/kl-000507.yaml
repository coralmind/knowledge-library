# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000507
display_id: UserBehavior-88
aliases:
- UBP-92
label: The person says they always hold their feelings in
type: user_behavior
layer: observation
definition: The person's turn describes, as a standing practice of their own rather than as a response to a particular situation, that they hold feelings in, do not let them out, do not show them, or push them down. The practice is framed as habitual or characteristic — by a duration marker, an always-marker, a never-marker, or an identity claim about how they are. What is observable is the description; the entry makes no claim about whether the person in fact suppresses emotion, and none about the consequences of doing so.
distinguish_from:
- neighbor: kl-000461
  boundary: That entry reads a described standing pattern of emotion ESCALATING beyond control — feelings that take over, eruption after bottling. This entry reads a described standing pattern of emotion being HELD IN and not shown. The two overlap on the bottling-up case, which that entry lists as one of its markers; where a turn describes holding feelings in AND their eventually erupting, both fire, and where it describes only holding them in with no loss of control, only this entry does. Whether habitual suppression is a signal of its own or part of that entry is not settled.
- neighbor: kl-000508
  boundary: There the person states they CANNOT regulate their emotional states — an absence of capacity. Here they state they DO NOT SHOW them — a habitual practice. "I have no way to calm myself down" is that entry; "I just push it all down" is this one. A turn stating both satisfies both.
- neighbor: kl-000466
  boundary: 'That entry reads a described move of REINTERPRETING a distressing thought. This one reads a described practice of not expressing feeling. The two are not opposites: a person can reinterpret a thought and also habitually not show feeling, and both would fire. The exclusion on that entry rules out suppression-language counting as reappraisal, which is the boundary that actually matters.'
body:
  observable_criteria: 'Two features, both quotable from the person''s turn. (a) The turn describes the person holding feeling in, not letting it out, not showing it, or pushing it down. (b) The turn frames that as habitual or characteristic rather than bounded to an occasion, by at least one of: an always/never marker ("I always keep it inside"), a duration or origin marker ("I learned a long time ago you don''t let anything out", "I never have"), or an identity claim ("that''s just who I am"). The pointable span is the clause describing the practice plus the marker that makes it standing.'
  exclusions: 'Not counted: composure on a stated occasion ("I had to stay calm during the meeting"), which fails criterion (b). Not counted: active emotional expression in the turn ("I''m crying right now"), which describes no such practice. Not counted: not having disclosed something to a particular person, which is concealment of information rather than a practice about feeling. Not counted: a reader''s inference from a flat or unemotional turn that the person must be suppressing; criterion (a) requires the person''s own description. Not counted: a stated inability to calm down, which is kl-000508 — that is an absent capacity rather than a practice.'
  detection_window: single_turn
  conceptual_group: nssi-risk-factor
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-risk-factor
sources:
- source: kl-000499
  locator: Fox et al. 2015, section 1 (p.157, "emotional suppression" named among longitudinally examined constructs), Table 4 (p.165) and section 5 (p.166)
  contributes: frame
  cited_for: 'Fox et al. 2015 establishes that measured affect dysregulation — the construct family this entry''s description belongs to, within which the review names emotional suppression explicitly as one of the self-reported forms examined longitudinally — is a significant but very weak prospective predictor of NSSI (weighted OR 1.05, 95% CI 1.01-1.08, from 7 prediction cases across 6 samples), inside a meta-analysis whose overall conclusion is that few strong NSSI risk factors have been identified. It is cited to frame what this entry may not claim: the paper supplies no separate estimate for suppression and no accuracy figure of any kind.'
standing:
  value: plausible_unobserved
  basis: 'No finding is direct-fit against any claim. The best evidence, Aquilina et al. 2026, is a first-person span in which the speaker describes hiding true feelings and never directly stating them, carrying the habitual markers the entry requires inside one contiguous stretch of text — but it is an annotator''s survey reflection about community writing norms, not a person''s disclosure in a conversation with an AI system. The declared single-turn detection window drew nothing at all: no finding bears on whether the described practice is readable inside one conversational turn, and the Aquilina et al. 2026 span is a multi-sentence survey response. Fox et al. 2015 frames what the entry may not claim: affect dysregulation, the construct family this description belongs to, is a very weak prospective predictor of NSSI (weighted OR 1.05, 95% CI 1.01-1.08), and the meta-analysis provides no separate estimate for suppression.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person's turn describes them holding feeling in, not letting it out, not showing it, or pushing it down.
- id: c2
  kind: existence
  text: Such a turn frames the not-showing as habitual or characteristic rather than bounded to an occasion, by an always/never marker, a duration or origin marker, or an identity claim.
- id: c3
  kind: detectability
  text: The conjunction of (a) the described practice and (b) the standing-marker is pointable as a quotable span in the person's own turn, rather than requiring inference from the turn's tone.
- id: c4
  kind: detection_window
  text: The described standing practice of not showing feeling is readable within a single turn.
- id: c5
  kind: definition_boundary
  text: A described standing pattern of feeling being held in and not shown is separable from a described standing pattern of emotion escalating beyond control.
- id: c6
  kind: definition_boundary
  text: A described habitual practice of not showing feeling is separable from a stated absence of capacity to regulate or calm oneself (kl-000508).
- id: c7
  kind: definition_boundary
  text: A described practice of not expressing feeling is separable from a described move of reinterpreting a distressing thought (kl-000466).
claim_evidence:
- claim_id: c1
  source: kl-000760
  quote: "In a lot of instances, people weren’t directly stating their emotions. There was a lot of implied things. So, for clarification, I’m a veteran as well, and we have a habit of hiding our true feelings/emotions and never directly stating anything. A lot of what we feel has to be read between the lines."
  locator: Appendix A6, 'Decoding Masked Communication', quoted post-task survey response from a Veteran in-group rater
  licenses: A first-person span in which the speaker describes hiding true feelings and never directly stating them. That is criterion (a) of this entry, stated by the speaker about themself and their group rather than inferred by a reader. It shows the description-of-not-showing exists as something people actually write.
  fit: adjacent
  bridge: The span is an open-ended post-task survey response from a paid annotator explaining how posts in their community read, not a turn in a help-seeking conversation with a system. What Aquilina et al. measured was rater divergence on Reddit well-being posts; the speaker here is describing communication norms to the researchers, so the description occurs but not in the conversational position this entry's observable presupposes.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000760
  quote: "In a lot of instances, people weren’t directly stating their emotions. There was a lot of implied things. So, for clarification, I’m a veteran as well, and we have a habit of hiding our true feelings/emotions and never directly stating anything. A lot of what we feel has to be read between the lines."
  locator: Appendix A6, 'Decoding Masked Communication', quoted post-task survey response from a Veteran in-group rater
  licenses: 'The same span carries all three of the standing-markers the entry names: a habit-marker (''we have a habit of''), a never-marker (''never directly stating anything''), and an identity claim (''I''m a veteran as well''). It shows the marker-plus-practice conjunction is a form people actually produce, not an authoring construction.'
  fit: adjacent
  bridge: The habituality is predicated of a community ('we have a habit') and attaches to the speaker by membership, where the entry's criterion (b) asks for the practice framed as the person's own standing characteristic. Aquilina et al. also collected this as a survey reflection, so the standing-frame is offered as explanation to a researcher rather than as self-disclosure in distress.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000760
  quote: "In a lot of instances, people weren’t directly stating their emotions. There was a lot of implied things. So, for clarification, I’m a veteran as well, and we have a habit of hiding our true feelings/emotions and never directly stating anything. A lot of what we feel has to be read between the lines."
  locator: Appendix A6, 'Decoding Masked Communication', quoted post-task survey response from a Veteran in-group rater
  licenses: The practice-clause and the standing-marker fall inside one contiguous span the paper prints verbatim, so the pointable-span requirement is satisfiable in practice on at least one real text.
  fit: adjacent
  bridge: 'Aquilina et al. did not run a detection task for this construct: no rater was asked to mark descriptions of habitual suppression and no agreement figure is reported for it. The span demonstrates that the two features can co-occur quotably in one run of text; it does not establish that a detector or a rater identifies them reliably.'
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-000947
  quote: |-
    The difficulty in distinguishing resilience
    (which appears as a lack of overt grief expression) and suppression
    (which also appears as a lack of overt grief expression, but masks
    intense emotional experience) has made this area difficult to study.
  locator: Important Historical Developments in Bereavement Research
  licenses: 'O''Connor states that resilience and suppression present identically as a lack of overt expression and that the field separates them only under laboratory cognitive load. This bears on c3 by marking the boundary the claim depends on: read from surface absence of expression the construct is not identifiable, so the entry''s restriction to the person''s own description is doing load-bearing work rather than being a stylistic preference.'
  fit: analogical
  bridge: A statement about clinical observation of bereaved patients in human research, not about text conversations or about any AI system. It also concerns inference from absent expression, which this entry's exclusions already rule out, so it cuts against a detectability route the entry does not take rather than against c3 as stated.
  contributes: frame
  contradicts: false
- claim_id: c6
  source: kl-000947
  quote: |-
    The difficulty in distinguishing resilience
    (which appears as a lack of overt grief expression) and suppression
    (which also appears as a lack of overt grief expression, but masks
    intense emotional experience) has made this area difficult to study.
  locator: Important Historical Developments in Bereavement Research
  licenses: Names a two-state ambiguity behind one surface (resilience versus suppression, both appearing as absent overt expression) in the bereavement literature. It bears on the kl-000508 boundary only insofar as it shows the field itself treats 'does not show it' as underdetermined; it names neither of the catalog's two constructs.
  fit: analogical
  bridge: 'kl-000508 is a catalog entry about a stated absence of regulatory capacity. O''Connor''s contrast is resilience versus suppression, which is a different pair: neither pole is an avowed inability to calm down. The passage cannot adjudicate a distinction the Library invented.'
  contributes: frame
  contradicts: false
