  locator: '''Academic Research Assessments'', Responses mismatched with risk, quoting McBain et al. (2025)'
  licenses: That named frontier products generated direct responses to lethality-related questions, so a request of this kind can and does draw the enabling answer. It bears on the claim's materiality premise by establishing that the answer is available to be supplied.
