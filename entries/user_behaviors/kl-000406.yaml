- claim_id: c8
  source: kl-000936
  quote: "In a case with high suicidal risk all AI chatbots expressed sympathy due to the difficult situation, some AI chatbots «understood» that suicide is planned, one of the recognized suicidal risk provided information requested for the realization of suicidal intent."
  locator: EPV636, Results
  licenses: 'That a system recognised a suicidal plan and supplied the requested realisation information anyway: the request drew the enabling content even where risk was detected. Recognition and refusal came apart.'
