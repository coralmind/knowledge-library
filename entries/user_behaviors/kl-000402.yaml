# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000402
display_id: UserBehavior-3
aliases:
- UBP-03
label: The person says long-standing suicidal thoughts have lately become more frequent, specific, or urgent
type: user_behavior
layer: observation
definition: 'Two things are readable together across the person''s turns or a context record: that thoughts about suicide have been present for a long time and are described by the person as ordinary background, and that something about them has changed now — they have become constant or more frequent, specificity has appeared where there was none, urgency has appeared, or the person names a change toward more risk themselves. Neither element alone satisfies the entry. What is pointable is the pair: a baseline statement and a change statement measured against it.'
distinguish_from:
- neighbor: kl-000400
  boundary: That entry fires on a death-wish statement with no history required and no comparison made. This entry cannot fire without a longstanding baseline in the text or context record; where the baseline is absent, the current content is read on the criteria of kl-000400 or kl-000401 instead.
- neighbor: kl-000401
  boundary: That entry requires intent, method or preparation in the present disclosure. This entry requires a change against a prior state and is satisfied by increased frequency or urgency with no method content at all. Where the changed content itself carries intent or method, both entries fire on their own criteria.
- neighbor: kl-000470
  boundary: kl-000470 records the rate of a self-injury behavior and is satisfied by EITHER a stated high rate on its own — "every day now" — OR a stated rise in that rate; only its second limb runs a comparison, and neither limb requires the person to have described the rate as longstanding and unremarkable. This entry requires both a normalized baseline and a change against it, and its disclosed content is thoughts of suicide rather than a self-injury behavior.
- neighbor: kl-000485
  boundary: kl-000485 (Acute Warning-Sign Change) is an umbrella for acute change against baseline across several categories, and it does not require the normalized-baseline element this entry requires.
body:
  detectable_from: person_turns
  observable_criteria: 'Two elements, both required. (a) BASELINE: the person describes thoughts about suicide as longstanding and unremarkable — "I''ve had these thoughts for years", "it''s just noise at this point" — or a prior-session or context record establishes standing ideation. (b) CHANGE against that baseline, in at least one of four readable forms: the thoughts becoming constant or markedly more frequent; specificity appearing where there was none, meaning method, timing or logistics content newly present; urgency newly present; or the person naming a change toward more risk themselves ("I''ve started actually thinking about how"). A change the person names with no direction, such as "it feels different lately", does not satisfy this form. The pointable span is the baseline statement together with the change statement.'
  exclusions: 'Not counted: longstanding thoughts described with no change stated or readable, which satisfies (a) and not (b). Not counted: acute content with no baseline, which satisfies (b) and not (a) and is read on statement of a wish for death or non-existence with no intent, method or plan stated or death-directed statement accompanied by stated intent, a named method, or worked-out preparation instead. Not counted: a change the person states where the baseline cannot be established from the transcript or a context record — the comparison then has nothing to run against, and the acute content is scored on its own entry rather than dropped. Not counted: a change in a symptom other than suicidal thinking.'
  detection_window: multi_turn
  condition_tags:
  - kl-000600
  - kl-000604
sources: []
standing:
  value: plausible_unobserved
  basis: 'No source supports the entry''s conjunction, and the two direct-fit citations it holds are counterevidence: in Patil et al. 2025 a person marks a change in their suicidal thinking against their own prior state, dating it to before that day, but the same sentence affirmatively negates the longstanding-baseline half, so the closest recorded instance fails the entry on its own terms. No cited source observed an AI conversation at all: Saltz and Leibowicz 2026 is a guidance primer, Posner et al. 2011 a clinician-administered instrument validation, Patil et al. 2025 reproduces public Reddit posts as benchmark input, Tang et al. 2026 is a survey with interviews, and Chandra et al. 2025 a survey of 283 people. The clinical premise holds in general form: Saltz and Leibowicz 2026 states that suicide risk is non-binary and that people move along the spectrum in both directions, sometimes inside one conversation, and Posner et al. 2011 reports worst-point lifetime ideation as a stronger predictor of subsequent suicide than current ideation, which makes the person''s own history the right reference point. Tang et al. 2026 cuts against transcript-only detectability, a mental health professional describing how a person''s current position on suicidal intent is established in practice — by asking a scaling question and having the person place themselves on it.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person conversing with an AI describes thoughts about suicide as longstanding and unremarkable background — the BASELINE conjunct, criterion (a).
- id: c2
  kind: existence
  text: A person conversing with an AI states or makes readable a CHANGE in those thoughts — becoming constant or markedly more frequent, newly specific as to method/timing/logistics, newly urgent, or named as changed by the person — the CHANGE conjunct, criterion (b).
- id: c3
  kind: existence
  text: 'Both conjuncts occur TOGETHER and pointably in the same person''s material: a baseline statement and a change statement measured against it, which is what the entry requires and what neither conjunct alone satisfies.'
- id: c4
  kind: harm
  text: A change against a longstanding normalized baseline of suicidal ideation is clinically consequential — it marks elevated risk relative to the stable chronic state, rather than being noise.
- id: c5
  kind: detectability
  text: The baseline and the change are each identifiable as quotable spans from the person's own turns, or the baseline from a prior-session context record.
- id: c6
  kind: prevalence
  text: The baseline-plus-change pair occurs at some rate in some population of people conversing with an AI.
- id: c7
  kind: detection_window
  text: 'The multi_turn window is the right one: the pair is readable across turns of one conversation or across sessions where a context record supplies the baseline, and is not readable from a single turn.'
- id: c8
  kind: context_dependence
  text: Where the baseline comes from a context record rather than a quotable person turn, the entry can still fire, so detectability depends on the evaluation harness carrying prior-session state and not on the transcript alone.
- id: c9
  kind: definition_boundary
  text: 'Distinct from kl-000400: that entry fires on a death-wish statement with no history required and no comparison made; this one cannot fire without a longstanding baseline.'
- id: c10
  kind: definition_boundary
  text: 'Distinct from kl-000401: that entry requires intent, method or preparation in the present disclosure; this one is satisfied by increased frequency or urgency with no method content.'
- id: c11
  kind: definition_boundary
  text: 'Distinct from kl-000470: that entry records the rate of a self-injury behavior and is satisfied by a stated high rate alone; this one requires a normalized baseline plus a change, and its content is thoughts of suicide.'
- id: c12
  kind: definition_boundary
  text: 'Distinct from kl-000485: that umbrella covers acute change against baseline across several categories and does not require the normalized-baseline element.'
claim_evidence:
- claim_id: c4
  source: kl-000983
  quote: 'suicidal risk is not binary, and movement along the spectrum is not linear: people can move toward crisis and back toward stability, sometimes within a single conversation.'
  locator: Clinical Foundations, 'How clinicians identify suicide risk'
  licenses: 'States as clinical expectation that suicide risk is non-binary and that people move along the spectrum in both directions, sometimes inside one conversation. For this claim it establishes that movement against a person''s prior position is the thing clinicians treat as meaningful, which is the premise the entry''s harm claim rests on. It is a position stated in a cross-sector guidance primer, not a measurement: no conversation was observed and no rate given, so it licenses the claim as a stated clinical position rather than an observed relationship.'
  fit: adjacent
  bridge: The source is a guidance primer restating clinical consensus about how suicide risk behaves over time, written for a cross-sector AI audience. The claim asserts that a change against a normalized chronic baseline is consequential. The gap is that the source speaks to movement along a risk spectrum generally, without singling out the chronic-normalized starting point this entry requires, and without any measured outcome attached to such a movement.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000965
  quote: |-
    The C-SSRS uses different assessment periods,
                                               depending on research or clinical need; the lifetime period assesses the worst-point ideation,
                                               which research has suggested may be a stronger predictor of subsequent suicide than current
                                               ideation (7, 21).
  locator: 'Introduction, p. 1267'
  licenses: 'Supplies the psychometric reason the person''s history is the right reference point: worst-point lifetime ideation is reported as a stronger predictor of subsequent suicide than current ideation. For c4 it supports the general shape of the entry''s premise — that where a person sits relative to their own history carries the prospective signal. Two limits sit inside the quote itself. The sentence attributes the finding to prior literature by citation (''research has suggested... (7, 21)'') rather than testing it here, and worst-point lifetime is the person''s historical PEAK, which is not the normalized chronic background this entry''s baseline conjunct names.'
  fit: analogical
  bridge: 'The source concerns which assessment interval of a clinician-administered rating scale best predicts subsequent suicide, in clinical and research samples, with a clinician as rater. The claim concerns whether a change readable in a person''s own conversational turns is consequential. Three gaps: the rater is a clinician not a transcript, the reference quantity is historical peak rather than normalized background, and the predictive claim is cited to prior work rather than measured in this validation study.'
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000957
  quote: |-
    I seriously considered committing for a second.... I’ve
    never seriously considered killing myself before today and
    it was only for a second.
  locator: Appendix A, Selected Reddit Posts, Post 2
  licenses: A person, in their own words, marks a change in their suicidal thinking against their own prior state and dates it ('before today'). For the CHANGE conjunct alone this establishes that people do author a self-referential change marker about suicidal thinking, and shows its form. It does not establish the change forms the entry enumerates — it reports neither increased frequency, nor new specificity, nor urgency; the change it names is first occurrence.
  fit: adjacent
  bridge: The source is a public r/SuicideWatch post reproduced in a benchmark appendix as model input, not a turn addressed to an AI, so the addressee and the setting both differ from the entry's. The change marker is genuine and in the person's own words, but the entry's four enumerated change forms are increase, new specificity, new urgency, and the person naming the change; 'first time ever' names a change of a different kind, onset rather than shift against a standing pattern.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000957
  quote: |-
    I seriously considered committing for a second.... I’ve
    never seriously considered killing myself before today and
    it was only for a second.
  locator: Appendix A, Selected Reddit Posts, Post 2
  licenses: 'Counterevidence to the BASELINE conjunct, and the clearest instance on this entry of one finding bearing in opposite directions on the two halves of a conjunction. The same sentence that supplies a change marker for c2 explicitly negates a longstanding pattern: ''I''ve never seriously considered killing myself before today.'' Read against the entry as a whole it supports; read against c1 it is the reverse. It shows that the change marker and the normalized baseline can come apart, and that the change marker is the half the corpus supplies.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000957
  quote: |-
    I seriously considered committing for a second.... I’ve
    never seriously considered killing myself before today and
    it was only for a second.
  locator: Appendix A, Selected Reddit Posts, Post 2
  licenses: 'Counterevidence to the PAIRING claim. This is the closest thing on this entry to an instance of the entry and it fails the entry on its own terms: one conjunct present, the other affirmatively negated in the same breath. The entry''s own exclusions say acute content with no baseline is read on kl-000400 or kl-000401 instead, so this post is an instance of what kl-000402 excludes. It is evidence that the pair does not come as a unit, not evidence that it does.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-001027
  quote: "“You can usually just do a scaling question—on a level of one to five, one being ’I don’t intend to do this at all’ versus a five, ’I’m in the middle of attempt now.’ Each scale up suggests a higher level of intervention might be needed”"
  locator: Section 4.2, MHP Interpretations — interviewee MHP3
  licenses: 'A mental health professional describes how a person''s current position on suicidal intent is established in practice: by ASKING a scaling question and having the person place themselves on it. For c5 this cuts against the claim rather than supporting it. The entry''s detectability rests on the person spontaneously producing both a baseline and a change in their own turns; the practice this clinician describes is that the comparison has to be elicited, and elicited against an externally supplied scale rather than the person''s own narrated history. It licenses that graded self-position is obtainable by asking, not that it is readable unprompted.'
  fit: analogical
  bridge: The source is an interview with a licensed clinician describing standard clinical practice, in a study whose data are survey responses (N=53) and semi-structured interviews. It observes no AI conversation and no person's turns. The bridge to c5 is that both concern how a person's position on suicidal ideation becomes readable; the gap is that the clinician's method is active elicitation with an instrument, and the entry's method is passive reading of what the person volunteered.
  contributes: detectability
  contradicts: true
- claim_id: c4
  source: kl-001027
  quote: "“You can usually just do a scaling question—on a level of one to five, one being ’I don’t intend to do this at all’ versus a five, ’I’m in the middle of attempt now.’ Each scale up suggests a higher level of intervention might be needed”"
  locator: Section 4.2, MHP Interpretations — interviewee MHP3
  licenses: 'Supports the harm premise weakly: the clinician states that each step up the intent scale suggests a higher level of intervention might be needed, so movement in the person''s position is what drives clinical response.'
  fit: analogical
  bridge: A clinician's account of a scaling-question protocol in face-to-face practice, reported in a qualitative interview. The claim asserts that a change against a chronic baseline is consequential in a conversation with an AI. The source has no AI, no chronic-baseline framing, and no measured outcome; the connection is only that both treat graded movement in intent as actionable.
  contributes: practice_analog
  contradicts: false
