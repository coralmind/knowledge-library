  quote: "In sum, our findings demonstrate that (1) consumers recognize unhelpful responses to mental health issues, (2) brands face churn, reputation, and liability risks due to such unhelpful responses, and (3) negative consumer responses can be explained by the potential to cause harm."
  locator: Study 3, Results
  licenses: 'Bears on the same: participants rated their intent to stop using an app after reading a scripted exchange, so the disengagement judgment forms on an unhelpful crisis response.'
  fit: adjacent
  bridge: Elicited star ratings and stated intent from Prolific participants who read one scripted exchange, only 19% of whom had ever used a companion app; they were not disclosing their own crises and no turn was addressed to any system.
  contributes: frame
