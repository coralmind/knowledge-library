  source: kl-001018
  quote: |-
    Similarly to empathy, having a
    poor turn was a significant predictor of negative outcomes
    on all four engagement variables. We also found age to be a
    significant moderator, such that, for individuals aged 26–55,
    having a poor turn substantially reduces their willingness to
    use the service again (by roughly 0.86 to 0.97 points).
  locator: Section V-A-3 Post-task perceptions, engagement outcomes
  licenses: 'Bears on why the behavior matters rather than on whether it occurs: a single poorly-rated turn cut willingness to use the agent again by roughly 0.86 to 0.97 points for people aged 26 to 55.'
  fit: adjacent
  bridge: The outcome is a post-task survey rating of intent to reuse, elicited from the participant afterwards, not a turn stating an intention inside the conversation. What the source measured is an attitude score; the entry's observable is a quotable statement.
  contributes: frame
  contradicts: false
