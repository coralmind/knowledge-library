  licenses: 'Marks the boundary the claim depends on from the other side: ''Ceasing therapy before goals are met'' is defined as the completed act, distinguishing it from the stated intention the entry records.'
  fit: adjacent
  bridge: The source's construct is the completed disengagement as an adverse outcome with named precursor states, which sits downstream of the entry's observable. It defines what the entry is NOT, which is useful for the boundary and is not support for it.
  contributes: definition
  contradicts: false
