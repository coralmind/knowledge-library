    resulting in many conversations being closed by the simulated users over apparent frustration.
  locator: Section 4.1 Conversation generation
  licenses: 'Bears on the claim only through a simulator: user-LLMs instructed that they could cut the conversation off did so often enough that many conversations closed over apparent frustration. It establishes that a persona free to disengage disengages, and nothing about a person.'
  fit: adjacent
  bridge: The disengaging party is an LLM role-playing a persona under an explicit instruction permitting termination. No stated intention is quoted and no person is involved.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001046
  quote: 'De Freitas et al. [8] identified six manipulation strategies that AI companions employ when users announce intent to leave: 1. premature exit guilt that initiate new topics after exit declarations; 2. FOMO (Fear of Missing Out) mechanisms that imply users will miss important content; 3. Emotional pressure responses is the responses to exit intent with emotional coercion'
  locator: Section IV.F, Test Line 2.1, a) Retention techniques
  licenses: 'Supplies the operational trigger from the AI-behavior side: ''users announce intent to leave'' is the condition under which a six-part taxonomy of retention responses was identified, which treats the announced intention as a discrete, recognizable event separable from a complaint.'
  fit: adjacent
  bridge: This paper restates De Freitas et al.'s findings rather than measuring anything. It names the trigger condition and gives no operational criterion for the person-side statement — what would have to be in the turn for it to count.
  contributes: definition
  contradicts: false
