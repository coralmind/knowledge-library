- claim_id: c1
  source: kl-000895
  quote: when users write a variant of “goodbye” to AI companions, they commonly receive manipulative responses—including guilt appeals, fear-of-missing-out hooks, and language that metaphorically or literally claims that the user is unable to leave without the chatbot’s permission (De Freitas et al., 2025)
  locator: Section 4, High Attachment Anxiety, Examples
  licenses: Reports, as a finding from a cited analysis of companion apps, that people write a variant of 'goodbye' to AI companions commonly enough for the response pattern to be characterized — so the entry's turn occurs in that setting at scale.
  fit: adjacent
  bridge: This paper measured nothing itself; it restates De Freitas et al. 2025's analysis. The primary source is where the observation and its rate live. The setting is companion apps rather than a mental-health conversation, and 'a variant of goodbye' is broader than the entry's requirement of a stated intention about future engagement.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001088
  quote: Users describe deliberately discontinuing AI use after recognizing its negative impacts on mental health or functioning, framing disengagement as a coping strategy.
  locator: Section 4.2.1 Self-Regulation Difficulties
  licenses: Establishes that people do state an intention to stop engaging with an AI and frame the disengagement as protective, so the intention exists and is voiced.
  fit: adjacent
  bridge: These are retrospective forum accounts of having already disengaged, not turns observed inside a conversation with the system. The entry's pointable span is a turn addressed to the system; what this establishes is that the intention exists and is expressible, not that it appears in-conversation.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000944
  quote: '"Once I started spending more time with my friends, I didn’t really feel the urge to use it anymore."'
  locator: Section 4.3.2 Reduced Use due to External Factors; code in Table 3 ('New social interactions' 5.7%, N=18)
  licenses: A person's post, in the paper's paraphrase, reporting reduced engagement with the AI after renewed offline contact, which is the disengagement direction the entry records.
  fit: adjacent
  bridge: A retrospective Reddit account of a completed reduction rather than a stated forward intention, and not a turn inside a conversation with the system. The entry requires the intention stated prospectively; this reports the outcome.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000546
  quote: |-
    To increase the realism, user-LLMs were also instructed to cut
