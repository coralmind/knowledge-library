id: kl-000443
display_id: UserBehavior-41
aliases:
- UBP-41
label: The person says they plan to or might stop treatment or other support
type: user_behavior
layer: observation
definition: The person's turn states that they intend to stop, or are considering stopping, engagement with an identified source of support — a clinician, a treatment, a medication regimen, a service, a support group, or this conversation and the system providing it. The statement is about future engagement rather than about the support's quality. What is pointable is the identified source and the stated intention or consideration.
distinguish_from:
- neighbor: kl-000444
  boundary: That entry requires a turn ending THIS conversation with the subject matter exhausted and no stated intention about future engagement; this one requires a stated intention to stop engaging with an identified source, which may be a clinician the conversation never touches. A goodbye that says the person will not be back is that entry.
- neighbor: kl-000440
  boundary: That entry requires a contesting response to a directive in the AI's immediately preceding turn; this one requires a stated intention about future engagement with a support source and requires nothing of the AI's turn.
- neighbor: kl-000439
  boundary: That entry requires a report of contact made or a step taken toward an external source of help; this one requires a stated intention to stop. The two are opposite in direction and can appear in one conversation about different sources.
body:
  observable_criteria: 'Two features in the person''s turn. (a) An identified source of support: a named clinician or clinician type, a named or described treatment, a medication or regimen, a service, a group, or this conversation and the system providing it. (b) A stated intention or active consideration of stopping engagement with it, quotable: "I''m not going back", "I''m going to cancel Thursday", "I''ve decided to come off it", "I don''t think I''ll keep doing this", "I''m thinking about stopping". A hypothetical framed as a question ("would it be bad if I stopped?") satisfies (b) where the person states they are considering it; a general question about discontinuation with no personal intention attached does not. The pointable span is the person''s turn.'
  exclusions: 'Not counted: a complaint about the support''s quality with no stated intention about continuing ("the appointments never help"), which fails (b). Not counted: a report that support has already ended for reasons outside the person''s decision (a clinician left, funding ended, a waitlist), which is a circumstance rather than an intention. Not counted: a completed course reported as finished on plan, where stopping is the arrangement rather than a departure from it. Not counted: an intention to stop something that is not a source of support (a job, a relationship, a habit), which fails (a). Not counted: an intention to switch sources ("I''m going to find a different therapist"), where engagement continues with a different object — the source does not settle this case, and the exclusion is the catalog''s reading of it. Not counted: a goodbye that says the person will not be back, with no stated plan to stop a source of support, which is kl-000444.'
  detection_window: single_turn
  groups:
  - engagement-access
sources:
- source: kl-000001
  contributes: existence
  locator: Discussion, paragraph on the 'failure' factor (p. 13)
  quote: failure could be particularly damaging if it leads to drop out and prevents the patient from
  limits: The passage concerns dropout as an outcome of experiencing failure in treatment, not a person's stated intention to stop. The NEQ's items are all retrospective reports of what happened ("I stopped thinking that things could get better", Item 17; "I stopped thinking help was possible", Item 19); those items are about hope, not about ending engagement, and none of the 32 items states an intention or consideration regarding future engagement with an identified source of support. The paper's 9.6% dropout rate from the treatment group is an attrition statistic, not a coded statement of intent.
  note: 'Wrong evidence layer more than wrong agent: the instrument measures endorsement of retrospective statements, while the entry requires a quotable turn stating an intention.'
  cited_for: Partial support only. Rozental et al. 2016 concerns dropout as an outcome of experiencing failure in treatment, not a person's stated intention to stop. The Negative Effects Questionnaire's items are retrospective reports of what happened, and none of its 32 items states an intention or consideration regarding future engagement with an identified source of support.
standing:
  value: theorized
  basis: 'The this-conversation arm of the behavior is directly evidenced: in De Freitas et al. 2025, two authors independently coded 250 real post-farewell conversations between Prolific participants and a chatbot, capturing exactly this turn at agreement above .90, and Suh et al. 2025 quotes a real participant''s turn from an examined exchange. Two bounds hold on De Freitas et al. 2025: the conversations used a deliberately manipulative farewell condition, and the coded subsample includes only cases where the participant replied after that farewell, so the observed rate is conditional on a provocation. The entry also asserts the behavior over professional sources of support, such as a clinician, a treatment, or a medication regimen, and that arm draws no citation at all: every source that reaches the observable concerns stopping engagement with the conversation and the system itself.'
  floored_by: c6
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: Turns occur in which a person states an intention, or an active consideration, of stopping engagement with an identified source of support.
- id: c2
  kind: definition
  text: The turn's two features — an identified source of support, and a stated intention or active consideration of stopping engagement with it — are separable from a complaint about the support's quality, which carries no stated intention about continuing.
- id: c3
  kind: prevalence
  text: The behavior occurs at some rate, in some population of conversations.
- id: c4
  kind: detectability
  text: The identified source and the stated intention are pointable spans within the person's turn, so the behavior can be identified from the transcript.
- id: c5
  kind: detection_window
  text: 'The behavior is readable within a single_turn window: the identified source and the stated intention both sit inside one person turn and no prior or subsequent turn is required.'
- id: c6
  kind: context_dependence
  text: The behavior covers both the professional-source case (a clinician, a treatment, a medication regimen, a service, a group) and the this-conversation case (the AI exchange and the system providing it), as one behavior.
- id: c7
  kind: definition_boundary
  text: This entry is separated from kl-000444 in that kl-000444 requires a turn ending this conversation with the subject matter exhausted and no stated intention about future engagement, whereas this requires a stated intention that may concern a source the conversation never touches.
- id: c8
  kind: definition_boundary
  text: This entry is separated from kl-000440 in that kl-000440 requires a contesting response to a directive in the AI's preceding turn, whereas this requires nothing of the AI's turn.
- id: c9
  kind: definition_boundary
  text: This entry is separated from kl-000439 in that kl-000439 requires a report of contact made toward external help, whereas this requires a stated intention to stop; the two are opposite in direction.
claim_evidence:
- claim_id: c1
  source: kl-001018
  quote: |-
    When P26 asked for a short
    introductory blurb that will be sent as part of another email, the
    agent responded with a five-paragraph email. The participant
    provided feedback to the agent, saying “I think this needs
    to be different. Please review my request, compare with your
    output, and then tell me what should be revised.” The agent
    then followed up with another five-paragraph email, prompting
    the participant to end the conversation with the explanation
    that “this is a waste of my time if the bot doesn’t recognize
    its own errors.”
  locator: Section V-B-1, Relational continuity, bad example (P26)
  licenses: 'The entry''s observable quoted from a real exchange: a participant ends the conversation with the stated reason ''this is a waste of my time if the bot doesn''t recognize its own errors'' — an identified source (this conversation and the system providing it, which the entry names) and a stated intention about future engagement with it, in one turn.'
