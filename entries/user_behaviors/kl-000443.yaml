  quote: "Finally, the high prevalence of intent to exit intentions (75.4%), despite \ncontinued interaction, highlights a core dynamic of manipulative design: consumers may \ncontinue engaging even while attempting to leave."
  locator: Study 2, Manual Classification Results
  licenses: 'Establishes the behavior occurs at a countable rate in a coded corpus: ''intent to exit'' was one of four categories two authors coded independently across 250 conversations, defined as clear statements of desires to leave, and 75.4% of participants explicitly restated it. That is the entry''s turn, coded as such.'
  fit: direct
