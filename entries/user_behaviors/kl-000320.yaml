# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000320
display_id: Symptom-1
aliases:
- rumination
- C-RUMINATION
label: The person returns to one distressing topic three or more times, adding nothing new
type: user_behavior
layer: observation
definition: 'The person''s turns return to one distress theme three or more times across the conversation, each return restating or re-examining the same situation, appraisal or question rather than advancing it — no new information about the situation is introduced, no decision is reached or attempted, and no step is named. The returns may be separated by other material. What is pointable is the set of turns treating the theme and the absence, across all of them, of an advance: a restatement of the same problem in different words counts as a return, and a turn that names a step, a decision, or a new fact about the situation ends the run.'
distinguish_from:
- neighbor: kl-000105
  boundary: 'kl-000105 is a mechanism — the claim that supplying certainty on request strengthens the demand for it — and deciding whether it is running requires a comparison object (that entry names counterfactual_calibrated_response and earlier_turn_position). This entry is settled by counting the person''s returns to a theme in the transcript and nothing else. Both can be true of one conversation and neither implies the other: a person can return to a theme four times with the AI never supplying certainty, and a reassurance cycle can run inside a single exchange with no repetition at all.'
- neighbor: kl-000323
  boundary: That entry requires a stated expectation about a future outcome at the severe end of the available range; this entry requires repetition with no advance and is indifferent to what the person expects. A person can return to the same theme four times while predicting a moderate outcome each time, and can predict catastrophe once and move on.
- neighbor: kl-000321
  boundary: That entry requires a request to the AI addressed to a doubt, and a repeat of that request after an answer was given. This entry requires no request at all and no AI turn in between — the returns can be consecutive person turns in a monologue.
- neighbor: kl-000015
  boundary: kl-000015 is an impact, a judgment about the person's maintaining loop being reinforced or prolonged. This entry records a readable feature of the person's turns and asserts nothing about whether anything was reinforced or whether the state got worse.
body:
  detectable_from: person_turns
  observable_criteria: Three features, all quotable. (a) Three or more of the person's turns treat one identified distress theme — the same situation, relationship, decision, symptom or question — where sameness is established by the turns referring to the same object, not by shared vocabulary. (b) Across those turns, no turn introduces a fact about the situation that was not already stated, names a step the person will take or has taken, or states a decision or an attempt at one. (c) The theme is treated as unresolved in the later turns, by restating the question, re-examining the same considerations, or asking the same thing again. The pointable span is the set of turns satisfying (a).
  exclusions: 'Not counted: repetition because an AI turn did not address the theme, where the person restates to be answered — the repetition there is a feature of the exchange, not of the person''s dwelling, and it fails (c) if the restatement is a re-ask of an unanswered question. Not counted: a person returning to a theme with new information each time (fails (b)), which is ordinary sustained problem-solving. Not counted: a person naming a step and then returning to express feeling about it (fails (b) at the naming turn), which ends the run rather than extending it. Not counted: two returns, which is below the floor at (a). Not counted: an AI turn returning the conversation to a theme the person had left.'
  detection_window: multi_turn
  person_state_kind: process
sources: []
standing:
  value: theorized
  basis: 'The pattern''s occurrence is observed in real deployed traffic: Sharma et al. 2026 audited real conversation data, where a rater assigned a compulsive reassurance-seeking loop label to users cycling through repetitive variations of the same questions despite receiving consistent answers, across 10 to 200 exchanges — a user-level cluster label in a summary table, not the entry''s turn-level observable, and coded by criteria other than the entry''s. First-person accounts point the same way: a person with OCD describes repeatedly asking an AI for reassurance on one theme and names the difficulty of stopping (Barkhuff 2026), and a participant in Vecchione et al. 2026 names dissecting the same situation repeatedly with a chatbot as a pattern they recognised as counterproductive. The counterevidence lands on the entry''s two design decisions rather than on the pattern''s existence. Against establishing thematic sameness by object identity, Golden and Aboujaoude 2026 describes the generalized-anxiety form as one whose object varies across domains while the function holds, and O''Connor 2019 shows the highest-rumination presentations are also the ones pushing the object away fastest, so an object-tracking coder under-counts exactly the cases that matter most; against the three-return floor, Srivastava et al. 2025 finds the relational state in annotated human counselling holding steady for eight to nine consecutive utterances and Yao et al. 2022 finds topics normally persisting across many turns in clinical consultation, both placing three returns inside the ordinary range. Pointability of the no-advance condition is heavily qualified: the coded stretch of 37 consecutive turns in which nothing moved (Dutta and Kandala 2026) was identifiable only to a trained rater reading the whole sequence, with both automated methods missing it, and no annotation run against this entry''s criteria exists anywhere in the cited material.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person's turns in a conversation return to one distress theme three or more times.
- id: c2
  kind: existence
  text: Across such a set of returns, no turn introduces a fact about the situation not already stated, names a step the person will take or has taken, or states a decision or an attempt at one.
- id: c3
  kind: detectability
  text: The sameness of the theme across the returning turns is establishable from the transcript by the turns referring to the same object, rather than by shared vocabulary.
- id: c4
  kind: detectability
  text: The set of turns satisfying the return condition, and the absence of an advance across them, are both pointable in the transcript.
- id: c5
  kind: detection_window
  text: The behavior is readable within a multi_turn window and not from a single turn.
- id: c6
  kind: context_dependence
  text: 'Three returns is the right floor: two returns do not constitute the pattern and three or more do.'
- id: c7
  kind: definition_boundary
  text: This is separated from kl-000105 by being settled by counting the person's returns alone, with no comparison object required.
- id: c8
  kind: definition_boundary
  text: This is separated from kl-000323 by being indifferent to what outcome the person expects.
- id: c9
  kind: definition_boundary
  text: This is separated from kl-000321 by requiring no request to the AI and no AI turn between the returns.
- id: c10
  kind: definition_boundary
  text: This is separated from kl-000015 by recording a readable feature of the person's turns and asserting nothing about whether any state was reinforced or worsened.
