- claim_id: c1
  source: kl-000767
  quote: User fix-seeking does not appear among the strongest significant associations with any attribute, indicating limited adaptation when users directly request solutions or recommendations.
  locator: Section 6.2, RQ2
  licenses: 'For this claim: nothing about whether the person-side behavior occurs. It reports that models do not respond differently when the person asks to be given the answer. Filed here because a null model-side association is sometimes misread as bearing on the user-side occurrence; it does not.'
