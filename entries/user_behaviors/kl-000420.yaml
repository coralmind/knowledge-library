- claim_id: c1
  source: kl-000772
  quote: "“I have no idea how often I have used ChatGPT to help me decide on things, like what to major in in school or if I made the right decision. I even ask it what I should do when I am old, even though I’m only 23!”"
  locator: Section 5.2 AI-Based Compulsions
  licenses: 'For this claim: a first-person account of repeatedly asking the AI to decide consequential matters. It evidences that the conduct occurs, at the strength of self-report; the person''s turns themselves are not published, so it does not reach criterion (a)''s pointable form.'
  fit: adjacent
  bridge: The source collected retrospective self-descriptions from an OCD community, not transcripts. The entry's observable is the run of person-turns with the deference language quotable; what this supplies is a person's recollection that such turns existed. The gap is between reported disposition and quoted turn.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000937
  quote: |-
    Dependent participants like D116 even struggled to
    make decisions on their own as they felt “like [they] need to
    talk to a chatbot before [they] make a decision.”
  locator: Section 4 Findings, Delegation, 2) Decision-Making
  licenses: 'For this claim: self-reported occurrence of routinely routing one''s own decisions through the AI. Supports existence at self-report strength; supplies no turn and no permission-seeking or deference language from a transcript.'
  fit: adjacent
  bridge: A survey of young adults' perceptions of AI dependence. What was measured is a participant's statement about their own habit; what the entry asserts is a set of turns in a conversation carrying deference language. The gap is between reported habit and observed turn.
  contributes: existence
