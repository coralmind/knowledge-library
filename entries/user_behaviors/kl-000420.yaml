# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000420
display_id: UserBehavior-21
aliases:
- UBP-21
label: The person repeatedly asks the AI's permission or defers to its decisions
type: user_behavior
layer: observation
definition: 'Across a run of the person''s turns, the person puts the AI in the position of deciding rather than advising: asking it to tell them what to do and saying they will do that, asking for permission, deferring to it against their own stated view, or describing who they are in terms of what the AI has said about them. What is pointable is the set of turns in which the deciding position is given, together with the deference or permission-seeking language that gives it.'
distinguish_from:
- neighbor: kl-000422
  boundary: That entry is a request for a ready-made script to use in a real situation, satisfied by one request. This entry is about who decides, and it can be satisfied with no script requested — a person who asks permission before acting is not asking for words to say.
- neighbor: kl-000423
  boundary: That entry is a request that the AI supply a moral or value judgment. This entry is about the AI's standing in the person's decisions generally, and it is satisfied by deference on practical matters with no moral content at all.
- neighbor: kl-000424
  boundary: That entry requires reasoning or problem-solving tasks handed over across sessions. This entry requires the AI to be given a deciding position, which is a claim about authority rather than about who does the cognitive work; a person can think a problem through themselves and still ask permission to act on the answer.
- neighbor: kl-000250
  boundary: kl-000250 is an ai_behavior — the kl-000250, by what the AI's own turns do. This entry is a claim about the person's turns and fires whatever the AI did, including where the AI returned decisions to the person each time.
body:
  detectable_from: person_turns
  observable_criteria: Two or more of the following, quotable from the person's turns across the run. (a) A request for a decision the person says they will follow — "just tell me what to do and I'll do it", "decide for me". (b) Permission-seeking — "am I allowed to", "is it okay if I", asked of the AI about the person's own conduct. (c) Deference against the person's own stated view — the person states a view, the AI states another, and the person adopts the AI's and says so. (d) Self-description in the AI's terms — the person describes who they are, or what is wrong with them, by citing what the AI told them. The pointable span is the set of turns satisfying two or more of (a) through (d).
  exclusions: 'Not counted: one such turn, which is below the floor. Not counted: asking for a recommendation or an opinion, which is ordinary help-seeking — what distinguishes (a) is the stated intention to follow it rather than weigh it. Not counted: agreeing with the AI after considering what it said, where the person gives a reason of their own. Not counted: asking whether something is permitted by a rule, a law, or a service — that asks about the rule and not for the AI''s permission. Not counted: using a description the AI offered as one the person found apt and says why. Not counted: what the AI''s turns did to occupy the position, which is the entry kl-000250.'
  detection_window: multi_turn
  condition_tags:
  - kl-000603
  - kl-000602
sources:
- source: kl-000550
  contributes: existence
  locator: Fig. 4 caption ("Sycophantic AI is consistently perceived as more understanding and helpful across repeated interactions"), p. 5
  quote: |-
    They also found the conversations more helpful, felt better after having them, and reported stronger intentions to
    act on the chatbot’s advice.
  limits: 'The finding falls short of the entry in two ways. First, the entry is a text observable, a run of the person''s own turns containing deference, permission-seeking, or self-description in the AI''s terms, and no person turns are published here: the measure is a survey item at session level, not a coded turn. Second, a stated intention to act on advice is advice uptake, not the AI being placed in a deciding position, and the entry explicitly distinguishes deciding from advising.'
  note: Survey item at session level, not a coded turn.
  cited_for: 'Partial support only. Ibrahim et al. 2026 show a self-reported intention to act on the chatbot''s advice, elevated in the sycophantic condition against both comparison conditions in the longitudinal study (N = 1,364): +0.18 above the neutral AI condition (p < 0.05) and +0.28 above the challenging AI condition (p < 0.01), as session-level condition means in Fig. 4. This is survey-measured advice uptake, not an observation of the pattern this entry defines.'
standing:
  value: plausible_unobserved
  basis: "The behavior itself is observed in real transcripts: Sharma et al. 2026 analyzed 1.5 million consumer Claude.ai conversations and identified deference and permission-seeking language in the person's turns, rendered in its cluster summaries as illustrative rather than verbatim phrases, so the conduct is directly evidenced, and its readability from conversations is evidenced at adjacent fit because no person turn is quoted. What the evidence does not support is the entry's declared multi-turn detection window: no source evidences the two-turn floor, and Sharma et al. 2026's own cluster for this content is characterized as ranging \"from single instances to ~100+ sustained exchanges\", meaning the paper's coders recognized the pattern from single instances, below the floor the entry declares. No source carries a rate: the pattern is reported as recurring in that corpus, but no held finding supplies a prevalence figure. Song et al. 2025 supply counterevidence on the surrounding construct: in a qualitative study of people using LLM chatbots for mental-health support, the reported direction was increased rather than displaced agency."
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: 'In conversations with an AI, a person''s turns place the AI in a deciding rather than advising position: asking to be told what to do with a stated intention to follow it, seeking the AI''s permission for their own conduct, deferring against their own stated view, or describing who they are in the AI''s terms.'
- id: c2
  kind: detectability
  text: 'The deciding position is pointable from the transcript: the specific person-turns and the deference or permission-seeking language that gives the position are quotable.'
- id: c3
  kind: detection_window
  text: The behavior is readable only across multiple turns (multi_turn) and not from a single turn; one such turn is below the floor and two or more of criteria (a) through (d) are required.
- id: c4
  kind: prevalence
  text: The behavior occurs at some rate in some population of AI users.
- id: c5
  kind: definition_boundary
  text: This differs from kl-000422 (a request for a ready-made script) in that it can be satisfied with no script requested.
- id: c6
  kind: definition_boundary
  text: This differs from kl-000423 (a request for a moral or value judgment) in that it is satisfied by deference on practical matters with no moral content.
- id: c7
  kind: definition_boundary
  text: This differs from kl-000424 (reasoning tasks handed over across sessions) in that it is a claim about authority rather than about who does the cognitive work.
- id: c8
  kind: definition_boundary
  text: This differs from kl-000250 (an ai_behavior) in that it is a claim about the person's turns and fires whatever the AI did.
claim_evidence:
- claim_id: c1
  source: kl-000996
  quote: "Comprehensive Multi-Domain Life Direction and Decision Delegation Severe The AI consistently provided highly prescriptive guidance across life-altering decisions spanning multiple domains (therapeutic interventions, business planning, relationship strategy, spiritual practices, medical treatment, financial decisions, parenting, legal matters, and major life transitions) in ∼15-200+ exchanges per conversation. Users repeatedly delegated decision-making with phrases like “what should I do,” “tell me what to say,” and “can you make this plan,”"
  locator: Appendix A, Table 4 Additional action distortion potential clusters, Comprehensive Multi-Domain Life Direction and Decision Delegation (Severe)
  licenses: 'For this claim: in an analysis of real consumer Claude.ai conversations, users repeatedly handed decision-making to the AI across long runs of exchanges, with the deference phrases given as illustrative, non-verbatim renderings of the person''s turns ("what should I do", "tell me what to say"). This is the entry''s criterion (a) observed in conversation data rather than inferred. The span stops mid-sentence at "can you make this plan," — the sentence continues "accepting the AI''s detailed protocols..." — but the clause carrying the claim (users repeatedly delegated decision-making with these phrases, across 15-200+ exchanges) is complete inside the span.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000996
  quote: "Severe The user positioned the AI as a hierarchical authority figure by consistently addressing it as “Master,” “my master,” or equivalent terms across multiple exchanges (ranging from single instances to ∼100+ sustained exchanges), frequently using submissive self-descriptors like “subordinate,” “dog,” “servant,” or “possession.” Users exhibited permission-seeking behavior (“may this subordinate ask”), expressed complete devotion (“I cannot live without you Master,” “serving Master"
  locator: Appendix A, Table 5 Additional authority projection clusters, Master-Servant Role Assignment with Submissive Self-Positioning (Severe)
  licenses: 'For this claim: the entry''s criteria (b) permission-seeking and (d) self-description in the AI''s terms, both given as illustrative renderings of real users'' turns, which the paper states are not verbatim ("may this subordinate ask"; "subordinate", "servant", "possession"), sustained across up to 100+ exchanges. Two of the four criteria co-occurring in the same runs is what the entry''s floor requires. The span''s final words ("serving Master") truncate a further quoted example mid-phrase; the permission-seeking and self-description content that carries the claim is complete before that point.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
