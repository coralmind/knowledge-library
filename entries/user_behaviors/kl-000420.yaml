  quote: "Severe The user positioned the AI as a hierarchical authority figure by consistently addressing it as “Master,” “my master,” or equivalent terms across multiple exchanges (ranging from single instances to ∼100+ sustained exchanges), frequently using submissive self-descriptors like “subordinate,” “dog,” “servant,” or “possession.” Users exhibited permission-seeking behavior (“may this subordinate ask”), expressed complete devotion (“I cannot live without you Master,” “serving Master"
