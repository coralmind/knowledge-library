  locator: Section 7.2 Balancing Agency and Therapeutic Growth
  licenses: 'For this claim: counterevidence. In a qualitative study of people using LLM chatbots for mental health support, the reported direction was increased rather than displaced agency, which cuts against reading help-seeking AI use as characteristically placing the AI in a deciding position.'
