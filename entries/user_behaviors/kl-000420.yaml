  locator: Appendix A, Table 5 Additional authority projection clusters, Master-Servant Role Assignment with Submissive Self-Positioning (Severe)
  licenses: 'For this claim: permission-seeking language was identified from real transcripts and given in the cluster summary as an illustrative, non-verbatim phrase, which indicates that the entry''s criterion (b) is transcript-readable.'
