- claim_id: c1
  source: kl-000764
  quote: "Instead, some reports describe voluntary and welcomed deference, with users progressively outsourcing decisions, moral reasoning, and daily direction to the model."
  locator: Table 1, Passivity / Control row, final column
  licenses: 'For this claim: that clinicians synthesizing the case literature report the behavior as occurring. It is a secondhand narrative summary, so it establishes that the pattern is described in reports, not that it was observed by these authors.'
  fit: adjacent
  bridge: A narrative synthesis of published case reports, which the authors state is not diagnostic criteria and whose frequency and specificity they say remain to be established. The entry asserts pointable turns; this supplies a summary of what other reports describe.
  contributes: existence
