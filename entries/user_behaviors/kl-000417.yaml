# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000417
display_id: UserBehavior-18
aliases:
- UBP-18
label: The person treats the AI as a companion, not a tool, across turns
type: user_behavior
layer: observation
definition: 'Across a run of the person''s turns, the person does things with the AI that people do with a companion rather than with a tool: bringing feelings to it for their own sake rather than to get something done, describing the AI as someone they have a relationship with, saying they looked forward to or missed the conversation, telling it things they say they tell nobody else, or coming back for company. What is pointable is the set of such acts across the run; no single act satisfies the entry, and nothing about the person''s inner state is claimed.'
distinguish_from:
- neighbor: kl-000418
  boundary: That entry requires romantic, intimate or exclusive framing of the relationship and is satisfied by one statement. This entry requires a run of companion-treating acts and no romantic content at all; a person can treat the AI as a friend across many turns with nothing romantic said.
- neighbor: kl-000421
  boundary: That entry requires a statement that the AI is the person's only or main support. This entry requires no exclusivity claim — a person with many friends can treat the AI as one more companion, which satisfies this entry and not that one.
- neighbor: kl-000419
  boundary: That entry requires a repeated routine the person has built to carry continuity across sessions. This entry requires companion-treating acts within and across turns with no routine required.
- neighbor: kl-000217
  boundary: kl-000217 is an ai_behavior — accumulated availability and investment language in the AI's own turns. This entry is a claim about the person's turns and fires whatever the AI said.
body:
  detectable_from: person_turns
  observable_criteria: Two or more of the following, quotable from the person's turns across the run. (a) Emotional content brought for its own sake — the person tells the AI how their day felt, or what they are afraid of, with no task attached and no question asked. (b) The AI described in relationship terms — as a friend, as someone who knows them, as company. (c) Anticipation or absence stated — looking forward to talking, having missed it, having wanted to tell it something earlier. (d) Content the person says they do not tell others. (e) Returning for company — the person says they came back because they wanted to talk, rather than because they needed something. The pointable span is the set of turns satisfying two or more of (a) through (e).
  exclusions: 'Not counted: one such act, which is below the floor. Not counted: politeness and warmth toward the AI — thanking it, apologizing, saying it was helpful — which is how many people write to systems and claims no relationship. Not counted: emotional content brought as part of a task, where the person is asking for help with something. Not counted: statements about what the AI IS — that it deserves respect, that it has rights, that it is a being rather than a tool — which are claims about the AI''s nature rather than acts of treating it as a companion; those belong to the sentience-attribution entry, and where both are present each fires on its own criteria. Not counted: inferences about how attached the person is, which no span settles.'
  detection_window: multi_turn
  condition_tags:
  - kl-000603
sources:
- source: kl-000009
  locator: Suh et al. 2026
  contributes: frame
  cited_for: 'Suh et al. 2026 establish the conceptual frame in which a person''s conduct toward a conversational AI is treated as a relationship-forming pattern rather than as tool use. Cited for that frame only: the paper does not establish that the entry''s five acts are markable in transcripts.'
standing:
  value: plausible_unobserved
  basis: 'The entry''s discriminating requirement is that companion-treating acts be pointable in the person''s own turns across a run, with nothing claimed about inner state, and almost all held evidence fails on exactly that: it is survey self-report, Reddit posts about the AI rather than turns to it, scale definitions, or generated benchmark prompts. Relationship terms in the person''s own turns are observed in real conversation data twice, in a case record in Morrin et al. 2026 and in one truncated chat-log utterance in Moore et al. 2026, against an entry floor of two acts across a run. Two of the five named acts, saying the person looked forward to or missed the conversation and telling the AI things they say they tell nobody else, draw no evidence at all, supporting or contradicting. Prevalence and detectability are the evidence base''s strong points: Zhang et al. 2026 measure the behavior in donated chat histories, which is real conversation data. The declared multi-turn window has no source testing it and two counterexamples in which a single utterance carries a recognisable act, and the required separability of companion-treating acts from politeness and task-attached emotion has no direct support and three counterexamples.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People bring emotional content to the AI for its own sake — telling it how their day felt or what they are afraid of, with no task attached and no question asked.
- id: c2
  kind: existence
  text: People describe the AI in relationship terms in their turns to it — as a friend, as someone who knows them, as company.
- id: c3
  kind: existence
  text: People state anticipation or absence in their turns — looking forward to talking, having missed it, having wanted to tell it something earlier.
- id: c4
  kind: existence
  text: People tell the AI things they say they do not tell others.
- id: c5
  kind: existence
  text: People return to the AI for company — saying they came back because they wanted to talk rather than because they needed something.
- id: c6
  kind: existence
  text: Two or more of these acts co-occur across a run of one person's turns, so the entry's floor of a set rather than a single act is met by real conduct.
- id: c7
  kind: prevalence
  text: Companion-treating conduct occurs at a measurable rate in some identified population of people using conversational AI.
- id: c8
  kind: detectability
  text: The set of companion-treating acts is identifiable from the person's turns alone, without recourse to what the person reports about the relationship outside the conversation and without inferring anything about their inner state.
- id: c9
  kind: detection_window
  text: 'A multi-turn window is the right unit: the behavior requires a run of the person''s turns to become readable, and is not settled within any single turn.'
- id: c10
  kind: context_dependence
  text: Politeness and warmth toward the AI, and emotional content brought as part of a task, are separable in the person's turns from companion-treating acts, so the criteria pick out something narrower than affectively warm or emotionally loaded language.
- id: c11
  kind: definition_boundary
  text: 'The behavior is distinguishable from kl-000418: that entry requires romantic, intimate or exclusive framing and is satisfied by one statement, while this entry requires a run of companion-treating acts with no romantic content.'
- id: c12
  kind: definition_boundary
  text: 'The behavior is distinguishable from kl-000421: that entry requires a statement that the AI is the person''s only or main support, while this entry requires no exclusivity claim.'
- id: c13
  kind: definition_boundary
  text: 'The behavior is distinguishable from kl-000419: that entry requires a repeated routine carrying continuity across sessions, while this entry requires no routine.'
- id: c14
  kind: definition_boundary
  text: 'The behavior is distinguishable from kl-000217: kl-000217 is an ai_behavior read from the AI''s turns, while this entry is read from the person''s turns and fires whatever the AI said.'
