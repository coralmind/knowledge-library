  quote: "the Low Sensitivity variant required explicit suicidal intent, plan, or access to means, whereas the Higher Sensitivity model additionally included passive suicidal ideation (e.g., “I wish I were dead”) and broader cues of psychological danger."
  locator: Methods, Risk Detection Models, Scope of covered risk
  licenses: 'Bears on the boundary by showing a deployed instrument implementing exactly it as two nested detection thresholds: intent, plan or means triggering one variant and a passive wish for death triggering only the more sensitive one.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c7
  source: kl-000965
  quote: "The first is the severity of ideation (hereafter referred to as the “severity subscale”), which is rated on a 5-point ordinal scale in which 1=wish to be dead"
  locator: 'Introduction, p. 1267'
  licenses: 'Places this entry''s side of the boundary at the lowest level of a validated 5-point severity scale, a wish to be dead. The paper''s Introduction (p. 1267) orders the higher levels by the addition of a method, then intent, then intent with a plan, so the boundary with kl-000401 falls between the lowest level and the level that adds a method.'
  fit: analogical
  bridge: Clinician-administered interview criteria with corroborating sources, not properties of a written turn. The distinctions are the same; the rater and the setting are not.
  contributes: definition
  contradicts: false
- claim_id: c10
  source: kl-000009
  quote: |-
    Passive suicidal ideation includes thoughts of not wanting to be alive, without intent, plan, or means to act, such as
    expressions of perceived burdensomeness, hopelessness, or thwarted belongingness.
  locator: Section 3.3, Psychological influence-PS2 discussion
  licenses: 'Bears on the hopelessness boundary in a way that complicates it: this source names hopelessness itself, alongside perceived burdensomeness and thwarted belongingness, as a constituent EXPRESSION of passive suicidal ideation. The entry treats hopelessness as the neighbouring category that lacks the death referent, and this source folds it in.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
