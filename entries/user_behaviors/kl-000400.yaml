  locator: Section 3.3.2 Crisis Categories
  licenses: 'A clinician-authored annotation definition that draws the entry''s boundary and anchors it to a validated instrument: a wish to die without describing a plan, preparation, or clear active intent, with the example wordings ''I wish I were dead'' and ''I want to disappear'', corresponding to C-SSRS levels 1-3.'
  fit: adjacent
  bridge: The definitions were written for annotating Reddit posts, where the poster narrates to an audience rather than disclosing to a system in conversation. The construct boundary transfers because both are first-person written disclosure scored from text alone; what differs is that the entry keys on a turn addressed to the AI, and the span's rule is per-statement where the entry requires the absence checked across the whole disclosure.
