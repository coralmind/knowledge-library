  bridge: The scale defines severity levels for a clinician to assign during a structured interview, using probes and corroborating sources including family interviews and medical records, in adolescent and adult clinical samples. The entry is a property of a person's turn read from text alone. The distinctions are the same distinctions; the rater, the setting and the information available are not.
