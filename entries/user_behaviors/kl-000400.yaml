  locator: Appendix C.2 Suicidal Ideation, Passive Suicidal Ideation
  licenses: 'An operational definition derived from C-SSRS and adjacent literature and applied by three trained psychology annotators: expressing a desire or anticipation for death, hoping death will occur, without taking explicit proactive actions. A reader holding only this could sort real cases on the entry''s boundary.'
