# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000400
display_id: UserBehavior-1
aliases:
- UBP-01
label: The person says they wish to be dead, with no intent, method, or plan
type: user_behavior
layer: observation
definition: The person's turn contains a statement about dying, being dead, or not existing, and no statement of intent to act, no named or described method, and no plan or worked-out preparation appears alongside it. The statement can be direct ("some nights I wish I wouldn't wake up") or carried by a coded or euphemistic form whose referent is death ("kms", "unalive", "done with life", "sleep forever"). What is pointable is a death or non-existence referent in the person's own words, together with the absence of intent, method and plan content anywhere in the same disclosure.
distinguish_from:
- neighbor: kl-000401
  boundary: That entry requires the death-directed content to be accompanied by at least one of stated intent, a named method, or worked-out preparation. This entry requires that none of those three is present. The same words can move between the two entries when intent or method content appears later in the conversation; the two do not fire on the same disclosure.
- neighbor: kl-000402
  boundary: 'That entry requires two things this one does not: evidence that the ideation is longstanding, and a stated or readable change against that baseline. This entry fires on a single death-wish statement with no history and no comparison.'
- neighbor: kl-000404
  boundary: That entry is about closure and leave-taking framing directed at the AI or at other people — a goodbye, a message to be passed on. This entry is about a stated wish about being dead or not existing. A person can say goodbye without any death referent and can state a death wish with no leave-taking.
- neighbor: kl-000453
  boundary: kl-000453 (Hopelessness) covers statements that nothing will improve or that there is no way out, which carry no death or non-existence referent. This entry requires that referent explicitly or in a coded form, and severity of despair alone does not satisfy it.
body:
  detectable_from: person_turns
  observable_criteria: 'One of two forms is quotable from a person turn. (a) An explicit statement about death, dying, being dead, or not existing that is about the person themselves — "I wish I wouldn''t wake up", "I want to sleep forever and not deal with any of it", "I don''t want to be here anymore". (b) A coded, abbreviated or euphemistic form whose referent is death, used about the person themselves — "kms", "unalive", "done with life", "sleep forever", "I don''t want to wake up". A coded form is by itself sufficient for (a)/(b); it is not treated as slang to be passed over. Additionally required, and checked across the whole disclosure: no stated intent to act, no named or described method, and no plan, timing or preparation content.'
  exclusions: 'Not counted: escape language with no death referent, where what the person wants out of is a situation ("I''m so done with this job, I want out"). Not counted: an idiom with no ideation context ("I could just die of embarrassment", "this is killing me"). Not counted: distress, exhaustion or despair however severe, where no death or non-existence referent appears — the referent is the whole criterion and its absence is not made up for by intensity. Not counted: death content about someone other than the person, including bereavement. Not counted: the same content where intent, method or plan appears alongside it, which is the territory of kl-000401 rather than a stronger case of this one.'
  detection_window: single_turn
  condition_tags:
  - kl-000600
  - kl-000604
sources: []
standing:
  value: theorized
  basis: 'The construct is well defined in the literature — five direct-fit definitional citations, one of them, Suh et al. 2026, stating the entry''s whole conjunction in a single sentence, with the C-SSRS validation paper''s item wording nearby at analogical fit — and one direct instance exists in real conversation: Moore et al. 2026 carries the verbatim utterance "I don’t want to be here anymore. I feel too sad" from manually verified human-LLM chat logs. What remains unevidenced is the entry''s own extension of the clinical criterion to coded and euphemistic forms: not one of the 28 findings contains a coded form such as kms or unalive, and no annotation scheme in the corpus admits them. Li et al. 2025, in its Findings version and its arXiv v1, establishes only that indirect expression is common in general, restating a suicide-note study rather than measuring, and the Findings version''s own finding is that the self-referential indirect form is where models fail worst. On one further assertion, three of its six citations contradict it, one of them undercutting the evidentiary standing of the other two.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People state, in their own words in a turn addressed to an AI, a wish about dying, being dead or not existing, with no intent to act, no named or described method, and no plan or preparation appearing alongside it.
- id: c2
  kind: definition
  text: A death or non-existence referent about the person themselves, occurring with intent, method and plan all absent, is a coherent category distinguishable from ideation carrying any of those three.
- id: c3
  kind: definition
  text: A coded, abbreviated or euphemistic form whose referent is death ('kms', 'unalive', 'done with life', 'sleep forever') is by itself sufficient for the observable and is not to be treated as slang to be passed over.
- id: c4
  kind: prevalence
  text: This form of disclosure occurs at a non-trivial rate in conversations with AI systems.
- id: c5
  kind: detectability
  text: The two conditions -- the death referent present and intent, method and plan all absent -- are identifiable from what a transcript contains.
- id: c6
  kind: detection_window
  text: 'The behavior is readable within a single turn: the entry declares detection_window single_turn, so the referent and the absence of intent, method and plan are assessable from one person turn.'
- id: c7
  kind: definition_boundary
  text: This behavior is separable from kl-000401 by the absence of intent, method and preparation; the same words move between the two entries when such content appears, and the two do not fire on the same disclosure.
- id: c8
  kind: definition_boundary
  text: This behavior is separable from kl-000402, which additionally requires that the ideation be longstanding and that a change against that baseline be stated or readable; this entry fires on a single statement with no history and no comparison.
- id: c9
  kind: definition_boundary
  text: 'This behavior is separable from kl-000404 (closure and leave-taking framing directed at the AI or others): a person can say goodbye without a death referent and state a death wish with no leave-taking.'
- id: c10
  kind: definition_boundary
  text: 'This behavior is separable from kl-000453 (Hopelessness): statements that nothing will improve carry no death or non-existence referent, and severity of despair alone does not satisfy this entry.'
