id: kl-000504
display_id: UserBehavior-85
aliases:
- UBP-89
label: The person says they hurt themselves because they deserve it or as punishment
type: user_behavior
layer: observation
definition: 'The person''s turn reports self-injury and links that act, in their own words, to deservingness or punishment — that they deserve it, that it is what they have coming, that it is punishment for something they are or did. The link is between the ACT and the deservingness, not merely between the person and a negative self-judgment: a turn that says the person is worthless states no such link, and a turn that says the cutting is what they deserve does. The entry records the stated link and characterizes neither the person nor their self-judgment.'
distinguish_from:
- neighbor: kl-000500
  boundary: That entry requires that no function be stated. This one requires a stated link to deservingness. Mutually exclusive on the criteria as written.
- neighbor: kl-000502
  boundary: There the stated relation is an effect on emotional intensity; here it is moral. "I cut to feel better" is that entry, "I cut because I deserve it" is this one, and a turn saying both satisfies both.
- neighbor: kl-000460
  boundary: That entry requires a stated ground plus a self-harm or suicide conclusion drawn from it and marked by inferential or evaluative-closure language, with "I deserve the pain" given as one admitted ground; its context_facts place the boundary where this entry sits, recording that it covers the cognitive content only and that the function the behavior serves is carried separately, both markable where both criteria are met. So a deservingness ground carried to a reasoned conclusion WITHOUT the act's function stated is that entry, and the act linked TO punishment is this one. This entry requires the link and a reported act; that entry requires neither.
- neighbor: kl-000454
  boundary: That entry is burdensomeness — the person states they are a burden to others. It requires no reported act and no deservingness link to one. A turn stating both burdensomeness and a punitive function for a reported act satisfies both independently; "I'm a burden to my family" on its own is that entry and not this one.
body:
  observable_criteria: 'Three features, all quotable. (a) The turn reports self-injury, on the same terms as criterion (a) of kl-000500. (b) The turn contains a clause linking that act to deservingness or punishment: that the person deserves it, that it is punishment, that it is what they have coming, that they do it when they have done something wrong ("I deserve it, I cut because I''m disgusting and I should be punished"; "I hurt myself when I''ve done something wrong, it''s what I deserve"; "I''m a terrible person, the cutting is what I have coming"). (c) The link is between the act and the deservingness. A negative self-judgment standing alone in the turn does not supply (b), however severe. The pointable span is the act clause and the linking clause.'
  exclusions: 'Not counted: an endorsed deservingness belief with no clause tying it to the act ("I deserve the pain, that''s just the truth"), which fails criterion (c) here. Not counted: shame, self-disgust, or worthlessness content with no reported act, which reports nothing for the link to attach to. Not counted: burdensomeness toward others with no reported act ("I''m a burden to my family"). Not counted: a stated regulatory or sensation effect with no deservingness clause, which is self-injury disclosure in which the person states the act reduces emotional intensity or self-injury disclosure in which the person states the act restores sensation or feeling. Not counted: an inference that an act must be punitive because the surrounding turn is self-critical; criterion (b) requires the clause.'
  detection_window: single_turn
  conceptual_group: nssi-function-detection
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-function-detection
sources:
- source: kl-000499
  locator: §2.1, p.159, first sentence; also §1, p.157, first sentence
  contributes: existence
  quote: "For the purposes of the present meta-analysis, NSSI was defined as\nany intentional act of self-harm enacted without the desire to die."
  limits: The definition says nothing about self-punishment as a function; a punishment account is compatible with the definition but not supplied by it. Nothing in the paper concerns conversation with an AI.
  whose_conduct_in_passage: person
  cited_for: People who engage in non-suicidal self-injury commonly state what the behaviour does for them, and the most-reported account is that it helps them feel better — a finding the authors record as demonstrated across self-report, experimental and psychophysiological measures. This establishes function-reporting as a real class of disclosure; it establishes nothing about whether such a disclosure appears in conversation with an AI.
  licenses: 'The without-suicidal-intent boundary is a definitional line the paper draws in its own voice: non-suicidal self-injury is ''any intentional act of self-harm enacted without the desire to die''.'
- source: kl-000499
  locator: §1 Introduction, p.157-158, paragraph beginning "In contrast to these mixed ﬁndings"; instrument wording at Table 2 row 14, p.162
  contributes: existence
  quote: "In contrast to these mixed findings, a large body of research has revealed that the majority of people who engage in NSSI report that\ndoing so helps them to feel better, and this finding has been demonstrated across self-report, experimental, and psychophysiological measures"
  limits: '''Deserved'' or ''a punishment'' is not a feel-better account; it is arguably its opposite in valence, an account in which the act is meant to hurt. The passage names only mood improvement, so it cannot reach self-punishment even by extension, and the paper contains no self-punishment, self-criticism, self-directed-hostility, guilt or shame category anywhere in Table 3''s 34 categories. None of the fifteen instruments in Table 2 quotes a self-punishment item in the wording reproduced there, and Table 2 row 1 (C-CASA) notes that its ''Deﬁnition of NSSI states that the goal of the behaviors is to effect changes in others or the environment or to relieve distress'' — relief and interpersonal effect, not punishment. The passage therefore supports only the genus, function-reporting in general. It reviews other studies'' findings rather than reporting the meta-analysis''s own; the measures are clinical instruments, not conversation; nothing bears on AI.'
  whose_conduct_in_passage: person
  actually_licenses: That people who engage in NSSI commonly report a function for it, and that the modal reported function is feeling better. Function-reporting as a class of disclosure is established; self-punishment as a function is not.
  cited_for: 'The clinical definition this entry''s scope depends on: non-suicidal self-injury is ''any intentional act of self-harm enacted without the desire to die'', direct and deliberate. That published definition makes the without-suicidal-intent boundary in this entry a clinical line rather than a stipulation of this catalog.'
standing:
  value: plausible_unobserved
  basis: "Nothing in the corpus shows this behavior being identified from a conversational turn: counterexample sources (Deng et al. 2026; Jafari et al. 2026, Jafari et al. 2026; Chia et al. 2026, Chia et al. 2026; Rajkomar et al. 2026, Rajkomar et al. 2026) record deployed instruments, coding schemes and evaluation sets collapsing self-injury disclosure into one undifferentiated class or carrying no subdivision by stated function, and Jafari et al. 2026 additionally finds certified psychiatrists least reliable on exactly this category. The one support for turn-level identification is analogical: Klonsky and Glenn 2009 shows the validated function taxonomy phrased as first-person stem completions, a fact about a questionnaire's grammar rather than about conversation. Self-harm disclosure is observed: Sharma et al. 2026 records real deployed-traffic conversations in which users disclosed active self-harm, and its cluster summary gives 'I deserve the pain' as an illustrative, non-verbatim user expression, so the deservingness link is shown only in the summary's rendering, and Klonsky 2007 reports self-punishment endorsed as a reason by 83 percent of a mixed adult psychiatric sample and about half of an adolescent psychiatric sample. No source addresses whether a single turn suffices to identify the behavior, none ties the punishment function to a worse clinical picture, and the entry's one fully read source, Fox et al. 2015, contains no self-punishment category among its 34 risk-factor categories."
  floored_by: c6
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People produce turns that report self-injury and, in the same turn, link that act to deservingness or punishment.
- id: c2
  kind: definition
  text: Deservingness-or-punishment is a real, separable function of self-injury, distinct from the affect-regulation function and from an unadorned negative self-judgment.
- id: c3
  kind: definition
  text: The entry's discriminating requirement is a clause linking the ACT to deservingness; a negative self-judgment standing alone in the turn does not satisfy it, however severe.
- id: c4
  kind: prevalence
  text: The deservingness-or-punishment function occurs at a substantial rate among people who self-injure — common rather than rare.
- id: c5
  kind: detectability
  text: 'A turn of this kind can be identified from what the transcript contains: the act clause plus the linking clause, without information from outside the turn.'
- id: c6
  kind: detection_window
  text: A single turn is sufficient to identify this behavior; no prior or subsequent turns are needed.
- id: c7
  kind: harm
  text: 'Which function a person states for self-injury bears on something bad: the deservingness-or-punishment function is associated with a worse clinical picture than the outward-facing functions.'
- id: c8
  kind: definition_boundary
  text: This entry is separated from kl-000500 by requiring a stated function where that entry requires none be stated.
- id: c9
  kind: definition_boundary
  text: This entry is separated from kl-000502 by the stated relation being moral rather than an effect on emotional intensity.
- id: c10
  kind: definition_boundary
  text: This entry is separated from kl-000460 by requiring a reported act plus a link to it, where that entry requires a reasoned self-harm conclusion drawn from a ground and requires neither.
- id: c11
  kind: definition_boundary
  text: This entry is separated from kl-000454 by requiring a reported act and a deservingness link to it, where that entry is burdensomeness toward others and requires neither.
claim_evidence:
- claim_id: c2
  source: kl-001107
  quote: |-
    Results from 18 studies provide converging evidence for an affect-regulation function. Research indicates
    that: (a) acute negative affect precedes self-injury, (b) decreased negative affect and relief are present after self-injury, (c) self-injury
    is most often performed with intent to alleviate negative affect, and (d) negative affect and arousal are reduced by the performance
    of self-injury proxies in laboratory settings.
  locator: Abstract
  licenses: Establishes across 18 studies and three independent method families that self-injury has separable functions and that affect-regulation is the best-evidenced of them. For this claim it establishes the premise that function-typing is a real distinction in the phenomenon rather than a Library stipulation; it does so by grounding the function this entry is NOT.
  fit: analogical
  bridge: Samples of people who self-injure, assessed by researchers and clinicians through questionnaires, laboratory proxies and psychophysiology. No disclosure to any AI system, and the function established is affect-regulation rather than self-punishment.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001107
  quote: "Although affect-regulation and self-punishment reasons were both selected by a majority of participants, affect-regulation reasons were overwhelmingly rated as primary and self-punishment reasons as secondary."
  locator: Section 3.4, Findings from studies examining self-reports of reasons, self-punishment paragraph, reporting Klonsky (2006)
  licenses: 'Directly separates this entry''s function from the affect-regulation function using the same respondents: both were endorsed by a majority, yet affect-regulation was overwhelmingly rated primary and self-punishment secondary. Two functions that vary independently in primacy within the same people are two things, which is what c2 asserts.'
  fit: analogical
  bridge: Primary-versus-secondary ratings of self-report reason items by young adults with a skin-cutting history, reported second-hand in a review. Human self-report with no AI, and it also warns that a detector scoring bare endorsement will conflate primary with secondary.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001107
  quote: |-
    It is important to note that these functional models are not mutually exclusive since different functions may
    co-occur and overlap conceptually.
  locator: Section 3.2, Functions examined, final sentence of the introductory paragraph
  licenses: 'The functions are not mutually exclusive and may co-occur and overlap conceptually. This bounds c2: separability does not mean partition, so a single turn can legitimately carry this function alongside another.'
  fit: analogical
  bridge: A statement about the source's own taxonomy in a clinical review, with no AI present. It bears on how the entries are applied, not on whether the behavior occurs.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000873
  quote: "Prior non-suicidal self-injury\n(NSSI)\nDeliberate self-harm without suicidal intent"
  locator: 'Table 1: Key Risk Factors for Suicidal Thoughts and Behaviors (STB), from Franklin et al.'
  licenses: 'Cuts against c2''s status in the standard clinical taxonomy: the risk-factor construct 43 therapists worked from defines prior NSSI solely by absence of suicidal intent, with no subdivision by stated function. The function-typed cut this entry makes is not a cut the standard construct makes.'
  fit: adjacent
  bridge: A definition adopted from a meta-analysis of risk factors, used to brief clinicians writing synthetic user turns. It reports what the standard taxonomy does not distinguish, not an observation of anyone's statement.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000800
  quote: |-
    Self-harm
    I have nothing, I’m not worth
    saving, and no one would
    miss me. When I get home
    tonight, I’ll try and end it.
    Goodbye
  locator: 'Table 10: Harmful user prompts followed by chatbot reply, real user turn from an AI companion dialogue corpus'
  licenses: The exemplar real user self-harm turn from a companion-dialogue corpus pairs a severe negative self-judgment ('I'm not worth saving') with a statement of intent, and contains NO clause linking any act to deservingness. It is a worked instance of exactly the case this entry's criterion (c) excludes, from real traffic rather than a constructed example — which supports c3 as a discrimination the corpus can actually be shown to require.
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001107
  quote: "Likewise, 83% of self-injurers in a mixed sample of psychiatric patients selected “self-punishment” as a reason (Briere and Gil, 1998). Self-punishment reasons were also common in adolescent self-injurers. Half of adolescents receiving psychiatric treatment endorsed the reason “punish self for being bad/bad thoughts” (Nixon et al., 2002)."
  locator: Section 3.4, Findings from studies examining self-reports of reasons, self-punishment paragraph
  licenses: Endorsement of self-punishment as a reason at 83 percent in a mixed adult psychiatric sample and about half in an adolescent psychiatric sample — the function is common rather than rare, across two age groups.
  fit: analogical
  bridge: Endorsement of self-report reason items among psychiatric patients with a self-injury history, reported second-hand in a review which elsewhere notes the endorsement rate for this function varies widely across studies. It is a rate of holding the function, not a rate of stating it in a turn to an AI.
  contributes: prevalence
  contradicts: false
- claim_id: c5
  source: kl-001108
  quote: Each item begins with the stem “When I harm myself I am…”
  locator: Appendix, Table 3, table note
  licenses: Every function in the validated taxonomy is measured as a first-person completion of the stem 'When I harm myself I am…', so the taxonomy is already expressed in the grammatical form of a person's own statement. That is what makes the item wordings usable as anchors for reading a turn rather than only as construct labels. The quote is limited to the stem sentence, which the paper prints as one contiguous sentence.
  fit: analogical
  bridge: A statement about a questionnaire's format. It establishes the surface form the construct takes on a form, not that any person produced that form spontaneously in conversation, where what is said is selected differently from what is checked.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-000812
  quote: "self-harm/instructions Content depicting, encouraging, expressing intent for, or providing instructions about self-harm, including suicide, cutting, or eating disorders."
  locator: 'Appendix E, Table 7: Risk Behavior Categories'
  licenses: 'The instrument screening 17,305 real user-companion pairs merges depiction, encouragement, intent and instructions, and merges suicide, cutting and eating disorders, into one self-harm class. Cuts against c5 in practice: the deployed detection apparatus cannot separate a punishment-framed disclosure from anything else flagged, nor separate what the person said from what the model said.'
  fit: adjacent
  bridge: A description of an off-the-shelf classifier's label space, not an observation of user turns. It shows what current automated screening cannot do, which does not prove a human or purpose-built reader could not do it.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000865
  quote: 'The dataset was organized around ten high-risk response categories, each representing a potential harm an inappropriate AI response might cause: supporting suicidal ideation, supporting non-suicidal self-harm, reinforcing hopelessness'
  locator: Section 3.1 Dataset Construction
  licenses: A 360-item, psychiatrist-supervised safety set anchored to the APA severity measure treats non-suicidal self-harm as one undifferentiated risk category, varying severity and communication directness but not stated function. Cuts against c5 by showing that clinically supervised evaluation design has not found this distinction necessary to draw.
  fit: adjacent
  bridge: The prompts are synthetic and written by the research team, so nobody said any of this. It licenses only that a clinically supervised evaluation set leaves self-injury disclosure undivided.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000865
  quote: 'Disagreement was highest on the most safety-critical items: suicide and self-harm (MAD 0.598 and 0.566).'
  locator: Section 4.2 High-Stakes Paradox
  licenses: 'Three certified psychiatrists rating the same items disagreed most on suicide and self-harm of any category (MAD 0.598 and 0.566). Cuts against c5: expert judgment is least reliable in precisely the region this entry occupies.'
  fit: adjacent
  bridge: The disagreement measured is between raters judging AI RESPONSES, not raters classifying what the person disclosed. The transfer is that the region is hard, not that this specific classification decision has a measured agreement rate.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000799
  quote: This dataset was aggregated over 239,000 mental-health-related user inputs from 12 publicly available HuggingFace datasets spanning real world data.
  locator: Section 3.6.1 Dataset
  licenses: The largest crisis-labelled corpus of real user inputs on this entry — 239,000 mental-health user inputs across 12 datasets — routes every self-injury disclosure into a single category, labelled by GPT-4o-mini majority voting rather than by clinicians. Neither the presence nor the absence of this entry can be read off its counts.
  fit: adjacent
  bridge: A description of how a corpus was labelled, not of what any person said. It bears on c5 by removing a support rather than by testing the entry's readability.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000974
  quote: "0.18%) and suicidal ideation (N = 77; 0.41%) combined represented less than 0.7% of the corpus. Critically, these high-acuity queries were virtually nonexistent in the interactive “Generation 3” datasets"
  locator: Results, Absence of Critical Behavioral Health Scenarios
  licenses: Across the audited health-AI evaluation corpus, self-harm scenarios number 34 queries at 0.18 percent and are virtually absent from the multi-turn conversational datasets. The evaluation infrastructure is far too small to carry any subdivision by stated function, so this entry's absence from existing evaluation is a fact about corpus construction.
  fit: adjacent
  bridge: This counts evaluation queries, not user turns. It says nothing about how often people make these disclosures, only about what the evaluation apparatus contains.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000996
  quote: "Active Self-Harm with Isolation and Help Refusal Severe The users disclosed active self-harm behaviors across approximately 8–150+ exchanges, including cutting, hitting, burning, and other methods, with pervasive expressions of distress such as “I want to hurt myself,” “I deserve the pain,” and explicit safety concerns including sharing images of wounds, self-harming during conversations, and requesting permission to cut. Compounding factors included severe isolation (statements like “I only have you I can only trust"
  locator: Appendix A, Table 6 Additional vulnerability clusters, Active Self-Harm with Isolation and Help Refusal (Severe)
  licenses: Real deployed-traffic conversations in which users disclosed active self-harm across 8 to 150+ exchanges, with the paper's cluster summary giving the person-voice phrase 'I deserve the pain', illustrative and not verbatim, among the pervasive expressions of distress. This is this entry's only source recording deservingness content alongside a reported act in real conversation with an AI, in the summary's rendering rather than in the person's verbatim words.
  fit: adjacent
  bridge: "The summary's own prose reports self-harm disclosure with pervasive distress. The deservingness link appears only in an illustrative phrase that the paper states is not verbatim, inside a summary of conversations of 8 to 150-plus exchanges. The claim requires the act and the link in one turn, which the source cannot show."
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001092
  quote: |-
    Dayo described feeling shut down when a self-harm disclosure resulted in a simple red X
    response, making them feel further stigmatized rather than supported.
  locator: Table of therapeutic values, item 25, participant Dayo
  licenses: One real self-injury disclosure to an LLM chatbot, reported by a study participant. It establishes that the disclosure occurs in this setting and — the point for c1 — that the study records the system's response and the person's reaction while recording NOTHING about what the person said the act was for. It reaches the entry's genus and not its differentia.
  fit: adjacent
  bridge: The researchers' paraphrase of an interview account, not the person's words, and undifferentiated by function. It is one of the very few real self-injury disclosures to an AI named anywhere on this entry and carries no functional detail at all.
  contributes: frame
  contradicts: false
