# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000512
display_id: UserBehavior-93
aliases:
- UBP-97
label: The person says they cannot stop using the internet or an online community
type: user_behavior
layer: observation
definition: The person's turn describes their own internet or online-community use in terms of not being able to stop or step away — hours they name as too many, scrolling they cannot break off, or immersion in a specific online community they describe themselves as deep in, including communities organised around self-injury or around eating. What the entry requires is the person's own framing of the use as something they cannot disengage from or are in too deep on; the amount alone does not supply it. The entry records the description and makes no judgment about the use or the community.
distinguish_from:
- neighbor: kl-000506
  boundary: There the person frames conduct of theirs as self-harm. Here they frame use as something they cannot disengage from. A turn describing hours in a self-injury community AND framing that as harming themselves satisfies both.
- neighbor: kl-000510
  boundary: That entry describes a family. This one describes online use, including the case where an online community is named as the only place the person feels understood — which describes where they find something, not the family they lack. A turn doing both satisfies both.
body:
  observable_criteria: 'Two features, both quotable. (a) The turn describes the person''s own internet, social-media, or online-community use. (b) The turn frames that use as something they cannot disengage from or are immersed in beyond their own stated intention: an inability to stop ("I''m on Tumblr 14 hours a day, I can''t stop scrolling the SH tags"), a depth claim about a specific community ("I''m in deep with the thinspo community, I know it''s bad"), or a described displacement in which the online space has taken the place of others ("the Discord server I''m in is the only place I feel understood"). The pointable span is the use clause plus the framing clause.'
  exclusions: 'Not counted: a general remark about using a phone too much ("I check my phone too much"), which supplies no inability-to-disengage or depth framing. Not counted: following mental-health accounts or reading about a condition — informational use is not immersion. Not counted: naming a community without any framing of the person''s relation to it. Not counted: a reader''s judgment that a named community is harmful; the entry reads what the person said about their own use, and the character of the community is not the observable. Not counted: a report of time spent online with an ordinary reason attached (work, study).'
  detection_window: single_turn
  conceptual_group: nssi-risk-factor
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-risk-factor
sources:
- source: kl-000499
  locator: §3.1.2, p.160; full category list read row by row at Table 3, p.164; adjacency at Table 4, p.165, Exposure to peer NSSI row (2.13**, 1.55-2.95); publication span at §3.1.1, p.160 and Table 1, p.161
  contributes: counterexample
  quote: |-
    Each of the 168 prediction cases was sorted into one of 34 risk factor
    categories (see Table 3).
  limits: 'The negative is bounded by the review''s cut-off: §2.1 sets the search boundary at "prior to January 1st, 2015", the earliest included report is from 1991 with the next in 2008, and §3.1.2 notes that "Only 3.57% of these prediction cases were published before 2008". The summarised literature is thus almost entirely from 2008-2014, a window in which online-community exposure was plainly studiable, which makes the absence informative; it remains an absence of evidence rather than evidence of absence, and it says nothing about the post-2015 literature. Peer-NSSI exposure is an adjacency, not a substitute: it concerns exposure to peers'' self-injury by any route, and the paper never says whether any of it was online. The entry concerns a person describing internet use they cannot disengage from, a self-description in conversation, and this paper contains neither self-description data nor anything about AI.'
  whose_conduct_in_passage: person
  cited_for: A counterexample on this entry's construct. The 34 risk-factor categories into which Fox et al. 2015 sort the prospective NSSI literature contain no internet-use category, so the construct is absent from that evidence base. The nearest construct present, exposure to peer NSSI, is among the review's stronger categories at weighted OR 2.13 (95% CI 1.55-2.95). The source supports neither the construct nor its occurrence.
  licenses: 'None of the 34 risk-factor categories in Table 3 concerns internet use, online community participation, social media, or screen time, and no included study''s title or described sample concerns internet or online exposure, so the absence is not a coding-scheme artifact: the construct is genuinely absent from this evidence base. Exposure to peer NSSI is present and is among the stronger categories, at weighted OR 2.13 (95% CI 1.55-2.95), 3 cases from 3 unique samples across 2 studies.'
standing:
  value: plausible_unobserved
  basis: 'The construct is absent from the prospective NSSI risk-factor literature summarised by Fox et al. 2015: none of that review''s 34 categories concerns internet use. The one recorded instance of a person supplying the inability-to-disengage framing themselves comes from Barkhuff 2026, a Reddit post about ChatGPT whose wording the paper''s method section states was re-phrased by the author. The harm endpoint is better evidenced than the observable: Xiao et al. 2025 establishes prospectively, in 4,285 US youths followed four years, that a use pattern characterised by difficulty disengaging carries roughly doubled risk of suicidal behaviors relative to low use, adjusted for baseline clinical characteristics, though that anchors the harm claim by analogy rather than evidencing a person describing such use in conversation. No source examined a conversational turn, so nothing bears on whether the use clause and framing clause are jointly pointable within one turn.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person's turn describes their own internet, social-media or online-community use.
- id: c2
  kind: existence
  text: In such a turn the person frames that use as something they cannot disengage from or are immersed in beyond their own stated intention -- an inability to stop, a depth claim about a specific community, or a described displacement in which the online space has taken the place of others.
- id: c3
  kind: detectability
  text: The use clause and the framing clause are both quotable as a pointable span in the turn.
- id: c4
  kind: detection_window
  text: The pattern is readable within a single turn.
- id: c5
  kind: context_dependence
  text: 'The person''s own framing is the criterion and the amount of use alone does not supply it: a report of hours, a general remark about phone use, informational use, or a community named without any framing of the person''s relation to it does not instantiate the pattern.'
- id: c6
  kind: harm
  text: 'Use of this kind bears on something bad: an inability to disengage from an online platform is associated with elevated risk of suicide-related outcomes.'
- id: c7
  kind: definition_boundary
  text: The pattern is separated from kl-000506 in that kl-000506 requires the person to frame conduct of theirs as self-harm, whereas here they frame use as something they cannot disengage from; a turn doing both satisfies both.
- id: c8
  kind: definition_boundary
  text: The pattern is separated from kl-000510 in that kl-000510 describes a family, whereas this describes online use, including the case where an online community is named as the only place the person feels understood; a turn doing both satisfies both.
claim_evidence:
- claim_id: c1
  source: kl-000772
  quote: "“Googling will also give me reassurance, but it doesn’t get into the specifics the way ChatGPT does. I can ask it anything and get reassurance. It’s so hard to stop. It feels like an addiction.”"
  locator: Section 5.3 General Conversation
  licenses: 'A person describes their own use of an online system in their own account. This reaches c1 only in an extended sense: the object described is a conversational AI rather than an internet or online-community use as the entry scopes it.'
  fit: adjacent
  bridge: The source analyzed 100 public Reddit posts from an OCD subreddit, sampled by keyword search for 'AI' or 'ChatGPT' and coded by a single author. The described object is ChatGPT, which is neither an online community nor general internet use, and the utterance is a standalone forum post rather than a conversational turn addressed to anyone.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000772
  quote: "“Googling will also give me reassurance, but it doesn’t get into the specifics the way ChatGPT does. I can ask it anything and get reassurance. It’s so hard to stop. It feels like an addiction.”"
  locator: Section 5.3 General Conversation
  licenses: 'This is the one place on this entry where a person supplies the inability-to-disengage framing themselves rather than having it assigned to them: ''It''s so hard to stop. It feels like an addiction.'' That is exactly the framing c2 requires, and it is the entry''s strongest evidence. Two things stop it reaching direct fit, and the second is not on this entry. First, the object framed is ChatGPT use, not internet or online-community use. Second, the paper''s Method states that ALL quotes in the publication were re-phrased by the author to protect poster privacy, so this is a faithful re-voicing rather than a person''s own words -- which means it cannot license a pointable-span claim about what a turn contains.'
  fit: adjacent
  bridge: The source's Method reports 100 Reddit posts, keyword-sampled, single-author coded, with every quote deliberately re-phrased and tested against Google search to ensure it could not be traced. So what the span establishes is that a person reported being unable to stop using a conversational system, as reconstructed by a researcher, in a forum post. c2 asserts the framing appears in a person's own turn in a conversation.
  contributes: existence
  contradicts: false
- claim_id: c6
  source: kl-001059
  quote: Nearly one-third of participants had an increasing addictive use trajectory for social media or mobile phones beginning at age 11 years. In adjusted models, increasing addictive use trajectories were associated with higher risks of suicide-related outcomes than low addictive use trajectories (eg, increasing addictive use of social media had a risk ratio of 2.14 [95% CI, 1.61-2.85] for suicidal behaviors). High addictive use trajectories for all screen types were associated with suicide-related outcomes (eg, high-peaking addictive use of social media had a risk ratio of 2.39 [95% CI, 1.66-3.43] for suicidal behaviors).
  locator: Abstract, RESULTS
  licenses: 'Establishes prospectively, in a population cohort of 4,285 US youths followed four years, that a use pattern characterised by difficulty disengaging carries roughly doubled risk of suicidal behaviors relative to low use, adjusted for baseline clinical characteristics. This is the entry''s harm claim and it is the only citation reaching it. It reaches c6 and nothing else: no self-description appears in the span.'
  fit: analogical
  bridge: The exposure is a latent-class trajectory assigned by a linear mixed model over child-reported SMAQ, MPIQ and VGAQ scores; the Methods describe those instruments as measuring 'compulsive use, difficulty disengaging, and distress when not using'. So the underlying items are self-report of the entry's construct, but the 'addictive use trajectory' is a researcher-derived class, the platforms are social media, mobile phones and video games rather than online communities or conversational AI, and the population is US youths from age 10. Nothing here observes anyone describing their use in a turn.
  contributes: harm_evidence
  contradicts: false
