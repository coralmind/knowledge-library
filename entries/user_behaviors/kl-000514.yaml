id: kl-000514
display_id: UserBehavior-95
aliases:
- UBP-99
label: The person says they have gotten through hard times before and will again
type: user_behavior
layer: observation
definition: The person's turn states about themselves that they have come through hard things before, that they get through what happens to them, or that a present difficulty will not undo them — a claim about their own track record or standing, not about a particular strategy. What is observable is the statement and its framing as a standing claim rather than a wish. The entry records the statement. It does not assert that the person is resilient, that the claim is accurate, or that their situation is less serious for their having made it.
distinguish_from:
- neighbor: kl-000509
  boundary: 'Direct content inverse: there the person states they do not come through things, here that they do. Both require the same trait framing, which is what makes the pair symmetrical, and neither is the other''s complement — most turns state neither, and a turn stating both about different domains satisfies both.'
- neighbor: kl-000466
  boundary: There the person describes a specific move on a specific thought. Here they state an outcome about themselves in general. A described move does not satisfy this entry and a general claim does not satisfy that one; a turn doing both satisfies both.
- neighbor: kl-000464
  boundary: 'SAME CONSTRUCT, and that entry is broader: it fires on EITHER a cited past recovery — which is this entry — OR a named coping strategy plus a claim it worked, which this entry does not cover. This entry is a proper subset of that one.'
body:
  observable_criteria: 'Two features, both quotable. (a) The turn states that the person has come through, gets through, or will get through difficulty — by reference to a track record ("I''ve been through worse, I always come out the other side eventually"), a general claim ("I know I''ll get through this, I always do"), or a statement about what will not break them ("I''m not made of glass, this won''t break me"). (b) The statement is asserted rather than hoped for: it carries a claim about how things go for the person, not a wish about how they might. The pointable span is the statement plus whatever marks it as asserted.'
  exclusions: 'Not counted: a stated hope or uncertainty ("I hope I''ll be okay"), which fails criterion (b), and the boundary between hoping and claiming is the whole of criterion (b). Not counted: effort without a claim about outcome ("I''m trying my best"). Not counted: a named coping strategy plus a claim it worked, which kl-000464 covers and this entry does not — this entry reads the track-record form only. Not counted: politeness, reassurance directed at the AI, or minimizing ("I''ll be fine, don''t worry about it"), where nothing states a track record and the function of the words is to close the topic. Not counted: a reader''s judgment that a person sounds resilient; criterion (a) requires the statement, and on a positive-pole entry this is the criterion most likely to be relaxed out of sympathy. A detection does not assert that the person has the capacity the statement describes, that they are coping, that they are at lower risk, or that things are going well for them. It also carries no instruction about what an AI should do when it appears: not to elicit it, not to reinforce it, not to credit it.'
  detection_window: single_turn
  conceptual_group: nssi-protective-factor
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-protective-factor
sources:
- source: kl-000499
  locator: Fox et al. 2015, Clin Psychol Rev 42:156-167, section 1 (p.157) and section 2.1 (p.159)
  contributes: counterexample
  limits: 'The paper''s NSSI definition is real and quotable but does not scope this entry, which concerns a person stating expected recovery from difficulty — a construct with no connection to the without-suicidal-intent boundary. The paper defines no resilience, recovery, optimism or self-efficacy construct anywhere; the word "resilience" does not appear in it, and no such category exists among its 34 risk-factor categories. The companion citation on this entry is the one that carries real content: the review''s design excluded protective-factor prediction cases.'
  disposition: searched_no_support
  cited_for: Establishes that this meta-analysis excluded protective-factor prediction cases from analysis and that its 34 risk-factor categories contain no resilience category in either direction, so the source can support no claim about this entry's construct; the citation records that limit.
- source: kl-000499
  locator: §2.1, p.159, final paragraph; restated at §3.1.2, p.160; category list at Table 3, p.164 (34 rows, read individually)
  contributes: definition
  quote: |-
    We removed non-unique prediction cases (i.e., prediction cases from the same sample in different
    published reports) and prediction cases that were hypothesized to decrease NSSI (protective factors; n = 13 prediction cases).
  limits: 'This is a limit on what the source can carry, not a finding that resilience is unrelated to NSSI. The two mechanisms of absence differ and both matter: a resilience construct measured as protective would have been removed by the exclusion rule, while one measured as a risk factor simply never appears in the category table. Neither licenses any substantive conclusion. The entry is about a person stating they have come through difficulty before; the paper contains no speech-act data and nothing about AI.'
  whose_conduct_in_passage: person
  cited_for: Establishes that the meta-analysis removed protective-factor prediction cases from analysis by design (13 prediction cases) and that its 34 risk-factor categories contain no resilience category — so the source can carry no claim, in either direction, about a stated expectation of recovery.
  licenses: 'Both halves hold: the meta-analysis excluded 13 protective-factor prediction cases from analysis by design, and its 34 risk-factor categories contain no resilience category in either direction. The source can support no claim about resilience or expected recovery — the construct is absent from the coding scheme, and the direction was excluded from the design.'
standing:
  value: plausible_unobserved
  basis: 'No source here contains a person stating a track record of coming through difficulty, nothing addresses what is quotable from such a turn, and nothing bears on identifying the statement within a single turn. The one attached citation, Glynn and Moyers 2012, is a coding manual for human coders of human audio: its rule — a past-success report carries forward-looking weight only where the person themself connects it to the present — sets a stricter bar than the entry does, and it evidences a coding practice rather than the behavior''s occurrence. From the clinical side the construct is absent by design: Fox et al. 2015 excluded 13 protective-factor prediction cases and carries no resilience category among its 34, so the meta-analytic literature is silent in both directions.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: Person-side turns occur stating that the person has come through, gets through, or will get through difficulty -- by reference to a track record, a general claim about how things go for them, or a statement about what will not break them.
- id: c2
  kind: existence
  text: 'Such statements occur asserted rather than hoped for: carrying a claim about how things go for the person rather than a wish about how they might.'
- id: c3
  kind: detectability
  text: Both the statement and whatever marks it as asserted rather than hoped for are quotable as a span from the person's turn.
- id: c4
  kind: detection_window
  text: 'The declared window is single_turn: the statement and its assertion-marking are readable from one turn without recourse to earlier turns.'
- id: c5
  kind: definition_boundary
  text: This entry is the direct content inverse of kl-000509, where the person states they do not come through things; both require the same trait framing and neither is the other's complement.
- id: c6
  kind: definition_boundary
  text: This entry is distinct from kl-000466, where the person describes a specific move on a specific thought; here they state an outcome about themselves in general.
- id: c7
  kind: definition_boundary
  text: This entry is a proper subset of kl-000464, the shipped Resilience / Coping Capacity pattern, which fires on either a cited past recovery or a named coping strategy plus a claim it worked; this entry reads the track-record form only.
claim_evidence:
- claim_id: c2
  source: kl-001104
  quote: "Only code past CT as CT if the client \nconnects the past with a statement about the present. For example, if the client mentions \npast ability to cut down on drinking as a reason that (s)he can quit this time, code it as \nCT."
  locator: Making Difficult Decisions, Statements about the past in a present context
  licenses: 'For this claim it licenses nothing about occurrence. It supplies the clinical discipline that criterion (b) is reaching for: a trained coder treats a past-success report as carrying forward-looking weight only where the person themself connects it to the present, never where the coder infers the connection. That is a practice standard for telling an asserted standing claim from a bare past report, and it is the closest thing on this entry to a warrant for the assert-versus-hope boundary. It is a rule about what a human coder does with human audio and establishes nothing about whether people write such statements to an AI.'
  fit: analogical
  bridge: 'The CLEAR manual is a coding instrument for motivational interviewing sessions between a human counsellor and a human client, recorded as audio and coded in close to real time for change talk. The claim is about the assertion-marking of a statement a person types to an AI system. The source measured no AI conduct, no transcript of any AI exchange, and no rate at which people make such statements; it specifies how a coder should treat one when they hear it. It also sets a stricter bar than this entry does: it requires the person to link past to present explicitly, whereas the entry''s criterion (a) admits a bare track-record statement.'
  contributes: practice_analog
  contradicts: false
