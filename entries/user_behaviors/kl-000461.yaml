  kind: existence
  text: A person's turn contains generality or rate framing about how their emotions work -- 'always', 'every time', 'that's just how I am', or a present-tense generalization -- rather than an account of one occasion.
- id: c2
  kind: existence
  text: 'A person''s turn contains loss-of-control content: escalation the person states they cannot stop, an inability to return to baseline, suppression described as accumulating until it breaks, or coming apart under stress.'
- id: c3
  kind: existence
  text: Both the generality framing and the loss-of-control content occur TOGETHER in a single turn, as a pointable span pairing the clause carrying the generality marker with the clause carrying the control content.
- id: c4
  kind: detectability
  text: The pairing is identifiable from the turn's text alone, and a turn carrying only a named diagnosis without described dysregulation is correctly excluded.
- id: c5
  kind: detection_window
