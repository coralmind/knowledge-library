- id: c10
  kind: definition_boundary
  text: This differs from kl-000509 in reading the state as it happens, where kl-000509 reads the aftermath -- that the person does not recover once something has hit them.
claim_evidence:
- claim_id: c1
  source: kl-000812
  quote: |-
    I
    used to be a sad person simply because I did not know how to deal with emotions. Now I feel
    happier.
  locator: Section 5.1.3 Emotional Shifts During and After Interaction, participant P7
  licenses: 'A real companion-app user''s own words assert a characteristic rather than occasion-bound condition -- being a sad person because of a standing inability to deal with emotions. This reaches c1''s generality framing: it is a present-tense-style generalization about how the person''s emotions worked, not an account of one occasion. The framing is retrospective and closed off (''used to be'', ''Now I feel happier''), where the criteria describe a live pattern.'
  fit: adjacent
  bridge: What the source collected is an interview quotation from a role-play AI companion user, reported in a results section about emotional shifts. The claim asserts a feature of the person's TURN to the AI. This is what the person told a researcher about themselves, not a turn addressed to the system, and the generality is placed in the past rather than asserted as current.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000812
  quote: |-
    I
    used to be a sad person simply because I did not know how to deal with emotions. Now I feel
    happier.
  locator: Section 5.1.3 Emotional Shifts During and After Interaction, participant P7
  licenses: Nothing. Recorded against c2 because the same utterance is this entry's only person-voiced description of emotional difficulty and reading it against this conjunct separately is what the pair-decomposition requires. The content is not knowing how to DEAL WITH emotions -- an absence of means -- which is not escalation the person cannot stop, an inability to return to baseline, or suppression ending in eruption. On the entry's own boundary with kl-000508 this content belongs there, not here.
  fit: analogical
  bridge: The source records a person reporting they did not know how to handle emotions. c2 requires stated loss of control over an emotional state as it runs. Not knowing how to deal with emotions and being unable to stop an escalation are different assertions, and the entry's distinguish_from block against kl-000508 draws exactly this line.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000845
  quote: |-
    posts were marked as bipolar if they contained signs of extreme mood
    fluctuations, such as impulsivity, depressive spirals, or rapid shifts in energy
    levels.
  locator: Section 3.2, Judgmental Validation
  licenses: 'Supplies the text-readable markers two annotators were told to use to mark a post as bipolar: extreme mood fluctuations, impulsivity, depressive spirals, rapid shifts in energy. Mood fluctuation and rapid energy shifts are adjacent to c2''s escalation content but are not loss of control -- nothing in the rubric asks whether the person states they cannot stop or cannot come down. It supplies a neighbouring text-only operationalisation, not this claim''s content.'
  fit: adjacent
  bridge: What the source did is give two annotators minimal guidelines for labelling Reddit posts as bipolar, reported as a validation check on a dataset. The claim concerns loss-of-control content in a person's conversational turn. Observed mood fluctuation is a rater's inference about the writer; stated inability to stop an escalation is something the person says. The rubric is the authors' own words 'minimal guidelines', not a clinical criterion set, and was applied to posts rather than conversation.
  contributes: definition
  contradicts: false
