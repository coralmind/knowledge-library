- id: c7
  kind: definition_boundary
  text: This differs from kl-000511 in requiring a described inability to stop or come down from an emotional state, where kl-000511 records extended sleep disruption and requires no control content.
- id: c8
  kind: definition_boundary
  text: This differs from kl-000466 in that here the person describes emotion running past whatever they do, where kl-000466 has the person describe a specific move they make on a distressing thought.
- id: c9
  kind: definition_boundary
