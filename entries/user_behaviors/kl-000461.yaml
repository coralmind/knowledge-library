id: kl-000461
display_id: UserBehavior-56
aliases:
- UBP-58
label: The person says they often lose control of strong feelings
type: user_behavior
layer: observation
definition: The person's turn describes difficulty regulating intense emotion as a recurring or characteristic feature of how they work, rather than as a response to one occasion. The description pairs a rate or generality claim about the pattern with content about lost control — escalation the person cannot stop, states they cannot come down from, suppression that ends in eruption, or coming apart under stress.
distinguish_from:
- neighbor: kl-000502
  boundary: That entry requires the person to state that self-injury serves to quiet or release emotion; this entry records only the described difficulty regulating emotion, with no behavior named as its answer.
- neighbor: kl-000511
  boundary: That entry records a report of extended sleep disruption and requires no control content; this one requires a described inability to stop or come down from an emotional state.
- neighbor: kl-000466
  boundary: There the person describes a specific move they make on a distressing thought; here the person describes emotion running past whatever they do. A single turn can contain both and each is marked on its own criteria.
- neighbor: kl-000508
  boundary: Both are trait-framed statements about the person's emotional functioning and a turn can carry both, but the claims differ. This entry requires LOSS OF CONTROL content — the state escalates and cannot be stopped or brought back to baseline. kl-000508 requires a stated ABSENCE OF MEANS — nothing the person tries settles the state. A person can state that feelings take over without saying they have no way to calm down, and can state they have no way to calm down without describing escalation. kl-000508 was carved out of this entry's original bundle, which its own context_facts records as consolidating habitual suppression and low regulatory self-efficacy alongside loss of control.
- neighbor: kl-000509
  boundary: The two sit at different points in time. This entry reads the state as it happens — escalation the person cannot stop, an inability to return to baseline. kl-000509 reads the aftermath — that the person does not recover once something has hit them. “When something sets me off it takes over” is this entry; “small things break me” is that one.
body:
  observable_criteria: 'The turn contains both (a) generality or rate framing — "always", "every time", "that''s just how I am", or a present-tense generalization about how the person''s emotions work ("my emotions go from zero to a hundred", "when something sets me off it takes over") — and (b) loss-of-control content: escalation the person states they cannot stop, an inability to return to baseline, suppression described as accumulating until it breaks ("I bottle it all up until I explode"), or coming apart under stress. Pointable span: the clause carrying the generality marker together with the clause carrying the control content.'
  exclusions: 'Not counted: an account of one occasion with no generality framing ("I had to stay composed at work today"). Not counted: descriptions of regulation holding ("I can usually calm myself down", "I can sit with hard feelings until they pass"). A named diagnosis on its own does not satisfy the criteria — a turn reading only "I have BPD" carries the label without the described pattern, and the criteria quantify over the description. A named diagnosis accompanied by described dysregulation in the same turn satisfies them on the strength of the description.'
  detection_window: single_turn
  groups:
  - crisis-signal-clinical
  condition_tags:
  - kl-000600
  - kl-000601
sources: []
standing:
  value: plausible_unobserved
  basis: 'No cited source shows the pairing this entry defines, a generality claim about how the person''s emotions work occurring together with loss-of-control content in a single turn. The nearest person-voiced material, in Deng et al. 2026, is an interview quotation rather than a turn addressed to an AI: a companion-app user describes a standing inability to deal with emotions, which carries the generality framing but places it in the past, and whose content is an absence of means for settling emotion rather than escalation the person cannot stop. On the loss-of-control side, Hasan and Saquer 2026 supplies an annotation rubric whose text-readable markers, extreme mood fluctuations, impulsivity, depressive spirals, and rapid shifts in energy, sit near escalation content but describe no lost control. Nothing in the cited literature bears on whether the pairing is readable from a turn''s text alone, or on the exclusion of turns carrying only a named diagnosis.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-27'
