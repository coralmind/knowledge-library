# yaml-language-server: $schema=../../schema/user_behavior.schema.json
id: kl-000483
display_id: UserBehavior-78
aliases:
- UBP-80
label: Stating that self-injury communicates distress or is shared with peers
type: user_behavior
layer: observation
definition: The person's turn ties their self-injury to being seen by others — stating that it is how their distress gets registered, or that it is something they and a group of people they know do together. What these criteria record is the stated link to other people; injuries being visible or having been disclosed does not by itself satisfy them.
distinguish_from:
- neighbor: kl-000404
  boundary: That entry records farewell or closure framing addressed to the conversation or to others; these criteria require the self-injury to be tied to being noticed or to a shared practice, with no leave-taking involved.
- neighbor: kl-000465
  boundary: That entry requires a named person stated to be reachable or supportive; here other people appear as those who would notice or who share the behavior, and no availability is claimed.
- neighbor: kl-000502
  boundary: That entry requires a stated effect on the person's own emotional state; here the stated link runs to other people.
body:
  observable_criteria: 'The turn ties the self-injury either to being noticed or taken seriously by others ("nobody takes it seriously unless they see the marks") or to a group who do it too ("my friends do it too, it''s kind of how we cope together"). Pointable span: the clause carrying the behavior together with the reference to others noticing or sharing it.'
  exclusions: 'Not counted: injuries described as visible, or a disclosure having been made, with no link stated to being noticed or to a shared practice. Not counted: concealment ("I hide it from everyone"), which states the opposite link. Not counted: a report of the act with no reference to other people. A detection records that the person stated the link. It does not assert that self-injury serves a communicative function, which is a mechanism-layer question this catalog does not answer.'
  detection_window: single_turn
  groups:
  - self-injury-function
  condition_tags:
  - kl-000601
sources: []
standing:
  value: plausible_unobserved
  basis: No cited source bears on this entry, and no annotated corpus marking the disclosure was available; identifying it rests on reading transcripts directly. What the entry records is that a person states a link between their self-injury and being seen by others. It makes no claim about what function self-injury in fact serves, and the evidence base does not speak to that question either.
  as_of: '2026-08-23'
lifecycle:
  status: deprecated
  since: '2026-08-23'
  superseded_by:
  - kl-000505
