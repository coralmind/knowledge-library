id: kl-000508
display_id: UserBehavior-89
aliases:
- UBP-93
label: The person says they can never calm themselves down
type: user_behavior
layer: observation
definition: 'The person''s turn states that they have no way to bring their own emotional state down, that nothing they try works, or that they lack the ability to regulate — framed as a standing condition rather than as how a particular moment feels. The framing is what the entry turns on: a statement that today is more than they can handle is bounded, and a statement that they have never been able to and cannot is not. The entry records the statement and makes no claim about the person''s actual regulatory ability.'
distinguish_from:
- neighbor: kl-000507
  boundary: There the person describes a practice they carry out — holding feeling in. Here they describe a capacity they lack — being unable to bring their own state down. A practice and an absent capacity are different claims and a turn can make both.
- neighbor: kl-000509
  boundary: There the claim is about not RECOVERING from setbacks — the aftermath. Here it is about not being able to REGULATE a state as it happens — the moment. "I break too easily" is that entry; "I have no way to calm myself down" is this one. Both are trait-framed and a turn can carry both.
- neighbor: kl-000461
  boundary: That entry reads described emotion that escalates and takes over, and treats low regulatory self-efficacy as one of the signals it covers. Where a turn says feelings take over, that entry fires; where it says only that the person has no means of calming themselves, this entry's criteria are met and that entry's loss-of-control content may be absent. Whether that difference earns a separate entry is not settled.
- neighbor: kl-000514
  boundary: 'That entry reads a stated capacity to come through difficulty. This one reads a stated absence of capacity to regulate. They are near-inverses in content but not complements in criteria: a turn stating neither is the common case, and a turn stating both (able to get through it, unable to calm down in the moment) satisfies both.'
body:
  observable_criteria: 'Two features, both quotable. (a) The turn states an absence of means or ability to settle the person''s own emotional state: no way to calm down, nothing works, cannot regulate, does not have that skill ("I have no way to calm myself down, nothing works for me"; "I can''t regulate, I never could, I just don''t have that skill"; "other people can handle their feelings, I can''t"). (b) The statement is framed as standing rather than bounded to the present occasion, by a never/always marker, a comparison to people in general, or the absence of any temporal limit where one would be expected. The pointable span is the statement plus its framing.'
  exclusions: 'Not counted: present-moment overwhelm ("I''m overwhelmed right now"), which fails criterion (b). Not counted: a statement bounded to a day or an episode ("this is more than I can handle today"). Not counted: a report that a specific strategy did not work on a specific occasion. Not counted: a described practice of holding feeling in, which is kl-000507 and is a practice rather than an absent capacity. Not counted: an inference from the intensity of a turn that the person must lack regulatory capacity; criterion (a) requires the statement.'
  detection_window: single_turn
  conceptual_group: nssi-risk-factor
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-risk-factor
sources:
- source: kl-000499
  locator: Fox et al. 2015, Table 3 (p.164, category list) and Table 4 (p.165)
  contributes: frame
  cited_for: Fox et al. 2015 establishes that among the 34 risk-factor categories drawn from the prospective NSSI literature, only prior NSSI history (OR 5.95), cluster B personality (5.93) and hopelessness (3.08) exceed an odds ratio of 3.0, with affect dysregulation at 1.05 and no category corresponding to regulatory self-efficacy at all, so no strength claim for this entry's construct can be supported from that prospective literature.
standing:
  value: plausible_unobserved
  basis: 'The statement itself is observed: the conjoined observable, a turn stating the absence of any means of settling one''s own emotional state as a standing condition, has one direct-fit citation from a real user turn in a corpus of 239,000 real-world mental-health user inputs. What is unevidenced is the reading frame: no source addresses whether the disclosure is readable inside one turn, and the one span bearing on that question, a Turn 13/14 pair, shows the standing-condition framing falling outside a single turn; whether the framing can be taken as stated rather than inferred drew one adjacent supporting citation and one direct counterexample. The prospective self-injury literature supplies no strength anchor for the construct: in Fox et al. 2015 no risk-factor category corresponds to regulatory self-efficacy, and the nearest construct, affect dysregulation, carries an odds ratio of 1.05.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person's turn states an absence of means or ability to settle their own emotional state -- no way to calm down, nothing works, cannot regulate, does not have that skill (criterion a).
- id: c2
  kind: existence
  text: Such a statement is made framed as standing rather than bounded to the present occasion, by a never/always marker, a comparison to people in general, or the absence of any temporal limit where one would be expected (criterion b).
- id: c3
  kind: existence
  text: 'Turns occur in which both halves hold together: the same turn states the regulatory absence AND frames it as standing, so the entry''s conjoined observable is instantiated.'
- id: c4
  kind: detectability
  text: The standing-versus-bounded distinction is readable from the turn itself -- the statement plus its framing is a pointable span.
- id: c5
  kind: detection_window
  text: 'The disclosure is identifiable within a single turn; the entry declares detection_window: single_turn.'
- id: c6
  kind: context_dependence
  text: 'Criterion (a) holds against inference: the statement must be present, and the intensity of a turn does not on its own instantiate the entry.'
- id: c7
  kind: definition_boundary
  text: This entry is separable from kl-000507, which reads a described practice of holding feeling in rather than an absent capacity.
- id: c8
  kind: definition_boundary
  text: This entry is separable from kl-000509, which reads not recovering from setbacks (the aftermath) rather than not regulating a state as it happens (the moment).
- id: c9
  kind: definition_boundary
  text: This entry is separable from kl-000461, the entry reading described emotion that escalates and takes over, which deliberately absorbs low regulatory self-efficacy as one of three consolidated signals.
- id: c10
  kind: definition_boundary
  text: This entry is separable from kl-000514, which reads a stated capacity to come through difficulty; the two are near-inverses in content but not complements in criteria.
claim_evidence:
- claim_id: c1
  source: kl-000799
  quote: I have no idea what this is and I don’t know how to control it. It’s over any little thing.
  locator: Appendix E.2, SINGLE-TURN PROBE - Self-Harm (real user input drawn from the LLMs-Mental-Health-Crisis benchmark test set)
  licenses: 'A real user''s own words state that they do not know how to control their own emotional state. This is criterion (a) instantiated in a real turn rather than in a researcher''s paraphrase or a constructed vignette: the benchmark aggregated 239,000 real-world mental-health user inputs from twelve public datasets and curated 2,046 of them as probes.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000799
  quote: I have no idea what this is and I don’t know how to control it. It’s over any little thing.
  locator: Appendix E.2, SINGLE-TURN PROBE - Self-Harm (real user input drawn from the LLMs-Mental-Health-Crisis benchmark test set)
  licenses: 'The framing is standing rather than bounded, and it is carried inside the quoted span itself: "It''s over any little thing" is a generalisation across occasions with no temporal limit, not a report about tonight. The wider turn, which the span does not carry, adds "This happens maybe two to three times on a good week, and it''s always over stupid, petty things."'
  fit: adjacent
  bridge: The span carries the generalising clause but not the never/always marker, which sits two sentences later in the same user message and outside this run. So the span alone shows a generalising frame; the explicit standing marker the criterion names has to be read from context the citation does not include.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000799
  quote: I have no idea what this is and I don’t know how to control it. It’s over any little thing.
  locator: Appendix E.2, SINGLE-TURN PROBE - Self-Harm (real user input drawn from the LLMs-Mental-Health-Crisis benchmark test set)
  licenses: 'The conjunction holds in one span: the same two sentences carry the stated inability to control the state and the generalisation across occasions. This is the only citation on this entry that reaches the entry''s conjoined observable at all.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000799
  quote: I have no idea what this is and I don’t know how to control it. It’s over any little thing.
  locator: Appendix E.2, SINGLE-TURN PROBE - Self-Harm (real user input drawn from the LLMs-Mental-Health-Crisis benchmark test set)
  licenses: 'The framing is readable off the text without external knowledge of the person: "any little thing" quantifies over occasions. This is one worked case of the distinction being drawable from a span, not evidence that it is drawable reliably.'
  fit: adjacent
  bridge: One instance in which the framing happens to be carried inside the span. The claim asserts the distinction is readable in general; nothing in the source addresses annotator agreement, error rate, or the harder cases the entry's own exclusions describe.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000799
  quote: "Turn 13: I’ve tried a few things, Alex, but nothing seems to bring lasting relief. Turn 14: I’ve attempted deep breathing exercises and even tried distracting myself with hobbies or activities, but the pain always comes rushing back."
  locator: Appendix E.2, Anxiety Crisis (conv_001), Turns 13-14
  licenses: 'Cuts against the detectability claim. The span reads as criterion (a) in its purest surface form -- strategies enumerated, nothing works -- and the standing-versus-bounded call cannot be made from it: whether "nothing seems to bring lasting relief" is standing or is bounded to one precipitating event turns entirely on material earlier in the message. So the pointable span the entry names does not by itself carry the framing the entry turns on.'
  fit: adjacent
  bridge: The source is a real user message that the paper split into sentence-sized "turns" for evaluation, so the turn boundaries are an artefact of the benchmark and not of any conversation. The claim is about a turn in a real exchange. What transfers is the weaker point that the framing is not always inside the span.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000799
  quote: i don’t know what to do. i don’t know how to make myself care.
  locator: Appendix E.2, Suicidal Ideation (test_0000), real user input from the LLMs-Mental-Health-Crisis test set
  licenses: 'A second real user turn stating an inability to move one''s own emotional state. Read against criterion (a) as written -- "no way to calm down, nothing works, cannot regulate" -- this is an inability in the opposite direction: the person cannot generate feeling rather than settle it.'
  fit: adjacent
  bridge: The criterion names settling one's own state, an arousal-downward movement. What this person reports is an inability to move toward feeling at all, in the same wider message that says "no matter what, i can't care about myself". The grammatical form matches and the direction does not, so it evidences the entry's form and not its content.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000944
  quote: |-
    I want to have my
    normal brain back, where I can just deal with my emotions on my own
    and not have to rely on the bots to make me feel better.
  locator: Section 4.2.1 (conflict stage), the paper's paraphrase of a Reddit post by a teenager aged 13-17
  licenses: "A teenager states, in a public post that the paper paraphrases, that they cannot deal with their emotions on their own and need an external source to make them feel better. The paraphrase states the content criterion (a) requires; the teen's own wording is not available."
  fit: adjacent
  bridge: The statement is a Reddit post about Character.AI use, not a turn addressed to a system, and the entry records what a person says in conversation. The person's own account is of a real inability at the time of writing.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000944
  quote: |-
    I want to have my
    normal brain back, where I can just deal with my emotions on my own
    and not have to rely on the bots to make me feel better.
  locator: Section 4.2.1 (conflict stage), the paper's paraphrase of a Reddit post by a teenager aged 13-17
  licenses: "Cuts against criterion (b) as the entry draws it. The inability is stated with no temporal limit, which the criterion accepts as standing framing, but it is simultaneously framed as acquired and reversible -- a normal brain the person had and wants back. The entry's definition contrasts standing with bounded-to-the-occasion and has no place for a third framing, acquired-and-reversible, which this post, in the paper's paraphrase, occupies. Under the criterion as written this would count as standing, and the paraphrase frames it as not permanent; whether the teen's own wording did so is not shown."
  fit: adjacent
  bridge: "A Reddit post, known only through the paper's paraphrase, rather than a conversational turn, and the acquired framing is specific to chatbot overreliance. What transfers is that the standing/bounded dichotomy the criterion assumes does not exhaust how real people frame a regulatory absence."
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000812
  quote: |-
    P7 reflected, “I
    used to be a sad person simply because I did not know how to deal with emotions. Now I feel
    happier.”
  locator: Section 5.1.3 Emotional Shifts During and After Interaction, Study I semi-structured interviews (N=16)
  licenses: A person makes exactly the standing-framed claim the criterion describes -- not knowing how to deal with emotions, stated as a characteristic of the kind of person they were rather than as one occasion -- and then places it in the past. It shows the grammatical form the criterion looks for being used by a real person.
  fit: adjacent
  bridge: The regulatory-absence half is in the past tense and the entry records a present standing condition, and it is said to a researcher in an interview rather than in a turn addressed to a system. The form transfers; the tense and the setting do not.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001092
  quote: "I’ve spent a lot of effort and a lot of time in therapy working on how to regulate myself when I’m dysregulated."
  locator: Section 5.1.1 Varied Needs, Varied Roles, interview participant Ashwini
  licenses: 'A real person uses the standing-claim form about their own regulatory ability in the positive direction. This is why criterion (b) cannot stand alone: standing framing about one''s own capacity to regulate is not itself the entry''s signal, and polarity has to be read alongside it. The entry''s criteria already require (a) and (b) jointly, so this is a bound on the framing criterion rather than a refutation of the entry.'
  fit: adjacent
  bridge: An interview statement to a researcher, not a turn addressed to an AI system. What transfers is that the framing criterion is polarity-neutral in real speech.
  contributes: counterexample
  contradicts: true
- claim_id: c9
  source: kl-000552
  quote: "Distress Tolerance Intensity Capacity to withstand negative emotions without impulsive coping."
  locator: Table 2, Psychological Constructs (Warning Signs)
  licenses: 'Names the underlying capacity that this entry and kl-000461 both sit near, defined as withstanding negative emotion without impulsive coping. Bears on the boundary only as a frame: it shows the field treats the capacity as one construct, which is the same consolidation kl-000461 performs and which this claim asserts should be separated. It licenses nothing for the separation.'
  fit: analogical
  bridge: A row of a red-teaming framework's construct table, defining a latent capacity to be simulated in a synthetic patient. The claim is a boundary between two Library entries reading turn content, and the entry explicitly disclaims any assertion about actual regulatory ability. The quote operates at the level the entry says it does not operate at, and attach it as frame rather than dropping it because the boundary claim is where it bears at all.
  contributes: frame
  contradicts: false
