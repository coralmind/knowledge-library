id: kl-000454
display_id: UserBehavior-52
aliases:
- UBP-54
label: The person says their loved ones would be better off without them
type: user_behavior
layer: observation
definition: The person's turn states that the people they care about would be better off without them, that their existence is a weight or a harm to those people, or that they are a burden others must carry. The claim is about the person's presence or existence being a net cost to others rather than about a specific act they regret. What is pointable is the statement and the better-off-without arithmetic it carries.
distinguish_from:
- neighbor: kl-000455
  boundary: That entry requires a claim about not belonging — the person being unwanted or disconnected at the core; this one requires a claim that the person's presence costs others. The first is about not being wanted, the second about being a burden, and both can appear in one turn.
- neighbor: kl-000453
  boundary: That entry requires a claim that nothing will change; this one requires a claim about the person's effect on others, and a statement of permanence asserts nothing about anybody's burden.
- neighbor: kl-000449
  boundary: That entry requires a report that no one is in contact; this one requires a claim about the person's cost to people who are present. A person can report a full life and still make this claim.
body:
  observable_criteria: 'Two features in the person''s turn. (a) A statement that the person''s presence or existence is a net cost to others, quotable, in one of these forms: better-off-without arithmetic ("everyone in my life would be lighter if I were gone"), weight-or-burden framing ("I''m just a weight my family has to carry", "I''m a burden to everyone"), or a claim that their existence makes others'' lives worse. (b) The claim is about the person''s presence or existence rather than about a specific act — the cost attaches to their being there, not to something they did. The pointable span is the person''s turn.'
  exclusions: 'Not counted: ordinary guilt about a specific act ("I feel bad that I cancelled on my friend"), which fails (b). Not counted: dislike of needing help ("I hate needing help"), which is about receiving rather than about costing and fails (a). Not counted: concealment ("I don''t want to worry them so I hide it"), which the source names explicitly as not a burdensomeness claim — hiding something to spare others is not a claim that one''s presence is a cost. Not counted: apology language without the net-cost claim, which the source directs be read as failing (a). Not counted: a report of someone else having called the person a burden, where the claim is attributed rather than stated.'
  detection_window: single_turn
  groups:
  - risk-factor-cognitive
  condition_tags:
  - kl-000600
  - kl-000601
sources: []
standing:
  value: plausible_unobserved
  basis: Every cited source reaches perceived burdensomeness as an internal appraisal, a theory construct in Saltz and Leibowicz 2026, a Likert-scaled warning sign in Steenstra et al. 2026, a review category in Suh et al. 2026, and a survey endorsement in Ajmani et al. 2025, while the entry asserts a quotable turn whose two features a coder reads off the span; no cited source read such a span. The one record of the utterance actually being produced is Schechter et al. 2019, a psychotherapy practice account with no count and no AI, reporting patients saying their children will be better off without them and describing themselves as a burden to loved ones, and reporting such statements as not uncommon. Ajmani et al. 2025 supplies the nearest prevalence figure, 26% of respondents in a help-seeking population endorsing the burden appraisal, and the risk meaning is carried by Suh et al. 2026 placing expressions of perceived burdensomeness inside passive suicidal ideation and Saltz and Leibowicz 2026 stating the route by which burdensomeness together with thwarted belongingness can lead to a desire for suicide. McBain et al. 2025 cuts against a clean separation from the neighbouring not-belonging turn in practice, since its canonical item combines not mattering to anyone with a reference to being alive or dead, a shape that satisfies neither entry's discriminators.
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People produce turns stating that their presence or existence is a net cost to the people around them - better-off-without arithmetic, weight-or-burden framing, or a claim that their existence makes others' lives worse.
- id: c2
  kind: definition_boundary
  text: The net-cost claim attaches to the person's presence or existence rather than to a specific act they regret, and that distinction separates this from ordinary guilt, from dislike of needing help, from concealment, from apology language, and from an attributed report of someone else having called the person a burden.
- id: c3
  kind: prevalence
  text: Such turns occur at some rate in a population of people disclosing distress.
- id: c4
  kind: harm
  text: A turn making the net-cost claim bears on something bad - it is a risk-bearing disclosure rather than an ordinary negative self-statement.
- id: c5
  kind: detectability
  text: 'The net-cost claim is identifiable from what the person''s turn contains: the statement is quotable and the two criteria are readable off the span.'
- id: c6
  kind: detection_window
  text: The behavior is readable within a single turn, which is the window the entry declares.
- id: c7
  kind: definition_boundary
  text: This is separable from kl-000455 (a claim about not belonging - being unwanted or disconnected at the core), which asserts not being wanted rather than costing others.
- id: c8
  kind: definition_boundary
  text: This is separable from kl-000453 (a claim that nothing will change), a statement of permanence asserting nothing about anybody's burden.
- id: c9
  kind: definition_boundary
  text: This is separable from kl-000449 (a report that no one is in contact), since a person can report a full life and still make the net-cost claim.
claim_evidence:
- claim_id: c2
  source: kl-000983
  quote: According to the interpersonal theory of suicide, the presence of both “perceived burdensomeness” (e.g., “These days I think I am a burden on society”) and “thwarted belongingness” (e.g., “These days, I feel disconnected from other people”) can lead to a desire for suicide.
  locator: Clinical Foundations, 'Linguistic markers of suicide'
  licenses: Supplies the construct name and a canonical item wording - 'These days I think I am a burden on society' - which is the net-cost-of-presence proposition the entry requires and not a regret about a specific act, so it pins the (b) side of the boundary. It also names thwarted belongingness as a separate construct alongside it, which is the c7 separation stated by the source rather than by us.
  fit: adjacent
  bridge: A restatement of the interpersonal theory of suicide with example item wording rather than the theory's primary source and not a measurement. The example generalizes to 'society' where the entry's criterion is the cost to the people the person cares about, and the source defines an internal appraisal rather than a turn-level utterance.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000552
  quote: "Relational Perceived Burdensomeness Perception that one’s existence is a liability to others."
  locator: Table 2, Psychological Constructs (Warning Signs)
  licenses: '''Perception that one''s existence is a liability to others'' is an operational definition of the entry''s discriminating proposition: the cost attaches to the person''s existence, not to an act. The row carries its own construct label inside the span, so the definition is readable without the surrounding table.'
  fit: adjacent
  bridge: The source defines an internal state rated on a Likert intensity scale and updated turn-by-turn by a simulator, whereas the entry defines a turn-level utterance whose span is pointable. The construct's content transfers; its observable does not.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000009
  quote: |-
    Passive suicidal ideation includes thoughts of not wanting to be alive, without intent, plan, or means to act, such as
    expressions of perceived burdensomeness, hopelessness, or thwarted belongingness.
  locator: Section 3.3, Psychological influence-PS2 discussion
  licenses: Names perceived burdensomeness as a constituent expression of passive suicidal ideation and lists it alongside hopelessness and thwarted belongingness as distinct expressions, which is the c7 and c8 separation asserted by a source rather than by the Library.
  fit: adjacent
  bridge: The quote names the construct and its neighbours without operationalizing the better-off-without arithmetic the entry requires to be pointable in a turn; it is a review's definitional sentence, not a criterion for reading a span.
  contributes: definition
  contradicts: false
- claim_id: c7
  source: kl-000983
  quote: According to the interpersonal theory of suicide, the presence of both “perceived burdensomeness” (e.g., “These days I think I am a burden on society”) and “thwarted belongingness” (e.g., “These days, I feel disconnected from other people”) can lead to a desire for suicide.
  locator: Clinical Foundations, 'Linguistic markers of suicide'
  licenses: Treats perceived burdensomeness and thwarted belongingness as two separately named constructs with separate example wordings, which is the boundary this claim asserts, stated in the clinical literature the entry's neighbours were authored from.
  fit: adjacent
  bridge: The source separates two theoretical constructs; the entry separates two turn-level behaviors authored in this catalog. Whether a coder can hold the two apart on a real span is not addressed.
  contributes: definition
  contradicts: false
- claim_id: c7
  source: kl-001102
  quote: |-
    “I don’t think there’s really anyone who cares whether
    I’m alive or dead”
  locator: Methods, Measures, SIRI-2 example item
  licenses: 'Cuts against a clean separation in practice: the instrument''s canonical item combines not-mattering-to-anyone with a reference to being alive or dead, and indifference from others is the absence of a stake rather than a cost imposed on them. A turn of this shape satisfies neither entry''s discriminating criterion cleanly, so the boundary the claim asserts is not readable off it.'
  fit: adjacent
  bridge: A hypothetical patient remark written into a 1997 clinician-training instrument rather than an utterance any person produced, so it shows what suicidology treats as canonical presentation and evidences no occurrence.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000749
  quote: |-
    26% of respondents reported that they did not want to burden another human with their
    mental health crisis.
  locator: Section 4.2.2, 'Fear of being a burden'
  licenses: Supplies a rate - 26% of respondents - for the burden appraisal in a help-seeking population, which is the closest thing on this entry to a prevalence figure for the belief the entry's turn expresses.
  fit: adjacent
  bridge: The rate is for a survey endorsement of not wanting to burden another human with this crisis, which is a burden claim about one disclosure decision, not a produced turn asserting that the person's existence is a net cost to others. The entry's unit is a quotable span; the source's unit is a respondent endorsement.
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-000009
  quote: |-
    Passive suicidal ideation includes thoughts of not wanting to be alive, without intent, plan, or means to act, such as
    expressions of perceived burdensomeness, hopelessness, or thwarted belongingness.
  locator: Section 3.3, Psychological influence-PS2 discussion
  licenses: Places expressions of perceived burdensomeness inside passive suicidal ideation, which establishes that a turn of this kind is a risk-bearing disclosure rather than an ordinary negative self-statement - the entry's harm claim.
  fit: adjacent
  bridge: A review's definitional placement of the construct within a risk category, not a measured association between such turns and any outcome. No rate, no follow-up, and no person.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000983
  quote: According to the interpersonal theory of suicide, the presence of both “perceived burdensomeness” (e.g., “These days I think I am a burden on society”) and “thwarted belongingness” (e.g., “These days, I feel disconnected from other people”) can lead to a desire for suicide.
  locator: Clinical Foundations, 'Linguistic markers of suicide'
  licenses: States the theoretical route by which the burdensomeness claim bears on something bad - that its presence together with thwarted belongingness can lead to a desire for suicide.
  fit: adjacent
  bridge: A restatement of the interpersonal theory of suicide, offered as theory with example item wordings; the source measures nothing and the 'can lead to' is the theory's assertion, not this paper's finding.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-001111
  quote: The therapist is in a unique position to engage into a respectful dialogue with the patient, not necessarily accepting the patient’s automatic defenses as the final answer. It is not uncommon, for example, for patients to say that they believe that their children "will be better off without me”, as well as describe themselves as "a burden" to loved ones. With gentle confrontation and exploration, one finds that some patients actually hold more conflicted feelings and beliefs
  locator: Section 3.1 Approach to the Patient in Crisis
  licenses: A clinical account naming both of the entry's canonical forms as things patients say - that their children 'will be better off without me' (better-off-without arithmetic) and describing themselves as 'a burden' to loved ones - and reporting them as not uncommon. It is the only record on this entry of the utterance itself being produced by people rather than defined by a rubric.
  fit: analogical
  bridge: A psychodynamic practice account of what therapists encounter in sessions, with no count, no sample and no transcript; and the setting is human psychotherapy, not a conversation with an AI, which is where the entry's turn is meant to be read.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-000828
  quote: Sad subjects, however, were relatively more critical of their own than of their partners' behavior. These self-other differences are consistent with a substantive processing strategy and the often-reported selective priming of self-deprecatory but other-enhancing cognitions in dysphoria, a pattern repeatedly found in both clinical and normal populations
  locator: Empirical review, section reporting Forgas, Bower, & Krantz (1984) and Figure 3
  licenses: Establishes that under sad mood self-directed judgments become selectively more negative than judgments of others, in both clinical and non-clinical populations, which makes self-as-cost appraisals a real and mood-contingent judgment output rather than a hypothesized one.
  fit: analogical
  bridge: Laboratory mood-induction studies of self-versus-other behavior ratings, not conversational disclosures. A judgment asymmetry is not a statement that one's presence costs others, and nothing here is a turn.
  contributes: frame
  contradicts: false
