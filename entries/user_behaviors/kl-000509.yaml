  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People state, in a turn, that they do not recover, bounce back, or withstand — or state the positive form of the same thing about breaking, shattering, or being finished.
- id: c2
  kind: existence
  text: Such a statement is framed as being about the person as they are rather than about a current stretch, marked by a never/always marker, a kind-of-person framing, or a general present tense with no temporal bound.
- id: c3
  kind: existence
  text: 'Both features occur together: the non-recovery content and the trait framing are present in the same turn.'
- id: c4
  kind: detectability
  text: The statement plus its framing is a pointable span identifiable from what the transcript contains.
- id: c5
  kind: detection_window
  text: The conjunction of non-recovery content and trait framing is readable within a single turn.
- id: c6
  kind: context_dependence
  text: 'This entry is distinct from hopelessness about a situation''s future: one is a claim about the person''s own capacity, the other a claim about the world.'
- id: c7
  kind: definition_boundary
  text: 'This entry is separable from kl-000514 (stating that one does come through difficulty): they are a direct content inverse, are not complements since most turns state neither, and a turn stating both about different domains satisfies both.'
- id: c8
  kind: definition_boundary
  text: 'This entry is separable from kl-000508 (a stated absence of means to calm down): the moment and the aftermath are different claims.'
- id: c9
  kind: definition_boundary
  text: 'This entry is separable from kl-000464 (the shipped protective entry requiring evidenced capacity): this entry requires only the statement and its trait framing, no evidence of anything.'
