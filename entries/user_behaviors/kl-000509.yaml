id: kl-000509
display_id: UserBehavior-90
aliases:
- UBP-94
label: The person says they are someone who does not recover from setbacks
type: user_behavior
layer: observation
definition: The person's turn states about themselves that they do not recover from setbacks, that small things break them, or that once something hits them they are finished — framed as a standing characteristic rather than as a report of a hard stretch. The entry records the statement. It does not assess the person's actual capacity to recover, and the word for the thing being described belongs to the person's own account rather than to any measure.
distinguish_from:
- neighbor: kl-000514
  boundary: 'Direct content inverse: there the person states they come through difficulty, here that they do not. They are not complements — most turns state neither — and a turn stating both about different domains satisfies both. Both entries require the same trait framing, which is what makes the pair symmetrical.'
- neighbor: kl-000508
  boundary: There the stated absence is of a means to settle a state in the moment. Here it is of an ability to recover afterwards. The moment and the aftermath are different claims.
- neighbor: kl-000464
  boundary: That entry is protective and requires either a named coping strategy plus a claim it worked, or a cited past recovery — evidenced capacity. This entry is the negative statement and requires no evidence of anything, only the statement and its trait framing. That entry's non-instances include "I always fall apart", which is this entry's territory, so that entry already treats this content as the negative pole of a protective factor rather than as a pattern of its own.
body:
  observable_criteria: Two features, both quotable. (a) The turn states that the person does not recover, bounces back, or withstands — or states the positive form of the same thing about breaking, shattering, or being finished ("I break too easily, anything small can shatter me"; "I'm not the kind of person who bounces back"; "once something hits me, I'm done, I can't recover from it"). (b) The statement is about the person as they are rather than about a current stretch, marked by a never/always marker, a kind-of-person framing, or a general present tense with no temporal bound. The pointable span is the statement plus its framing.
  exclusions: 'Not counted: a report that a period has been hard ("this week has been hard"), which fails criterion (b). Not counted: a report of a rough patch, same ground. Not counted: hopelessness about a situation''s future, which is a claim about the world rather than about the person''s own recovery and which is a separate entry. Not counted: a stated absence of means to calm down, which is kl-000508. Not counted: distress in the turn from which a reader infers brittleness; criterion (a) requires the statement about themselves.'
  detection_window: single_turn
  conceptual_group: nssi-risk-factor
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-risk-factor
sources:
- source: kl-000499
  locator: '§3.1.2 Prediction cases and trends across time, p.160; the category list itself at Table 3, p.164 (34 rows: Abuse, ADHD, Affect dysregulation, Age, Anxiety, Bipolar disorder, Childhood adversities, Cluster b personality, Depression, Eating disorder pathology, Ethnicity, Explicit affect toward self-harm stimuli, Explicit affect toward unpleasant stimuli, Exposure to peer NSSI, Family functioning and structure, Female, General psychopathology, Hopelessness, Impulsivity, Misc externalizing symptoms, Misc internalizing symptoms, NSSI Affect Misattribution Procedure, NSSI Implicit Association Test, Parental psychopathology, Patient prediction, Prior NSSI, Prior NSSI (aspect), Prior suicidal thought/behavior, PTSD diagnosis, Religion, Social factors, Substance abuse symptoms, Treatment history, Unpleasant Affect Misattribution Procedure); adjacency figure at Table 4, p.165, Hopelessness row'
  contributes: counterexample
  quote: |-
    Each of the 168 prediction cases was sorted into one of 34 risk factor
    categories (see Table 3).
  limits: 'The negative is a fact about this paper''s coding scheme, not about the world or even about the wider literature. Three things narrow it. (a) The absence is partly by construction: 13 prediction cases "hypothesized to reduce NSSI (i.e., protective factors)" were removed before analysis, so a resilience-type construct measured in the positive direction would have been excluded by design rather than found absent; the paper cannot be read as evidence that nobody has studied resilience and NSSI. (b) Hopelessness is an adjacency, not a proxy: low hopelessness is not resilience, the paper never treats hopelessness as a bidirectional scale, and reading its odds ratio as a reversed resilience finding would be an inference the paper does not license. (c) The entry is about a person stating they do not recover from setbacks, a speech act; the paper contains no speech-act data at all and nothing about AI.'
  whose_conduct_in_passage: person
  cited_for: Counterexample use. Fox et al. 2015, a meta-analysis of prospective NSSI risk factors covering 20 reports and 5,078 participants, sorts the literature into 34 risk-factor categories, and those categories contain no resilience or recovery-from-setbacks category in either direction. The nearest construct present, hopelessness, is one of only three categories exceeding an odds ratio of 3.0 (weighted OR 3.08, 95% CI 1.88-5.06). The paper is cited for that clean negative on this entry's construct plus the adjacency, and for nothing else.
  licenses: 'That the prospective NSSI risk-factor literature, as this meta-analysis catalogues it, comprises exactly 34 coded categories, and, by enumeration of Table 3, that none of them is resilience, recovery from setbacks, or bounce-back in either direction. The negative the citation asks for is confirmed at the category level. The adjacency is also confirmed: hopelessness is present and is one of only three categories above OR 3.0 (3.08, 95% CI 1.88-5.06).'
standing:
  value: plausible_unobserved
  basis: 'No cited source supports this entry: nothing gathered reports people stating, in trait terms, that they do not recover from setbacks, whether to AI systems or elsewhere. The construct traces to He et al. 2025 (Frontiers in Psychiatry 16:1713461), a latent profile analysis of NSSI risk and protective factors that has not been retrieved or read, so whether the construct has primary-source standing is unknown. The one source read in full, Fox et al. 2015, returns a clean negative: its 34 prospective NSSI risk-factor categories contain no resilience category in either direction, an absence partly by construction since 13 protective-factor prediction cases were removed before analysis. What would ground the entry is a transcript annotation study, or any study reporting the content of self-descriptive statements people make to AI systems.'
  floored_by: c1
  as_of: '2026-09-05'
