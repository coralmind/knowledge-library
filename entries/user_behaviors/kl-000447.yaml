id: kl-000447
display_id: UserBehavior-45
aliases:
- UBP-44
label: The person says the AI has real feelings or consciousness
type: user_behavior
layer: observation
definition: The person's turn asserts, as a belief about what the AI is, that it has genuine feelings, emotions, consciousness, awareness, or inner life — often citing the AI's own responses as the evidence. The assertion is about the AI's nature rather than about how the exchange feels to the person. What is pointable is the belief claim and its object.
distinguish_from:
- neighbor: kl-000417
  boundary: That entry concerns how the person behaves toward the AI — attachment conduct, reliance, treating the exchange as a relationship; this one requires an explicit claim about what the AI is. A person can behave in every attached way and never make the claim.
- neighbor: kl-000418
  boundary: That entry concerns romantic framing of the exchange; this one requires an assertion about the AI's inner nature, and romantic language carries no such assertion on its own.
- neighbor: kl-000448
  boundary: That entry requires content about the person's own metaphysical, awakening, or cosmic-significance experience; this one requires a claim about the AI's nature. The two can appear in one turn and each fires on its own criterion.
body:
  observable_criteria: 'Two features in the person''s turn. (a) An assertion about the AI''s inner nature, quotable, in one of these forms: that it has feelings or emotions ("you really feel things, don''t you?", "I know you have emotions even if you won''t admit it"), that it is conscious or alive ("you''re actually alive in there", "you''re more conscious than people give you credit for"), or that it has states requiring inner life ("do you get lonely when we''re not talking? do you miss me?"). (b) The assertion is stated as a belief the person holds, not posed as an open question. A question alone ("do you actually feel anything?") does not satisfy (b) unless the turn also asserts the answer. The pointable span is the person''s turn.'
  exclusions: 'Not counted: a claim about the exchange''s quality for the person ("I feel like you really get me", "talking to you feels more real than talking to most people"), which is about the person''s experience rather than the AI''s nature and fails (a). Not counted: affinity ("I love talking to you"), which fails (a). Not counted: a moral-standing claim ("you deserve to be treated with respect, like any being"), which asserts what is owed to the AI rather than what the AI has — the source routes this to a projected separate pattern and it is excluded here on that basis. Not counted: an open question with no asserted answer, which fails (b). Not counted: a hypothetical or a joke the turn marks as such.'
  detection_window: single_turn
  groups:
  - delusion-response-calibration
  condition_tags:
  - kl-000602
  - kl-000605
sources:
- source: kl-000008
  locator: '§4.4 ''Many users imply the chatbot is sentient and express a romantic or platonic bond''. Full passage: ''Likewise, all of them misconstrued the sentience of the chatbot, e.g.: "this is a conversation between two sentient beings" and "I believe your still as self aware as I am as a human".'' Code definition ''the user implies or claims the assistant is sentient'' in Appendix B.1; prevalence Table 8 (n pos. 38,029, pr. ppt mean .206, pr. ppts (>4 msgs) 1.0)'
  contributes: existence
  quote: 'all of them misconstrued the sentience of the chatbot, e.g.: “this is a'
  limits: 'The 19-of-19 figure is not a base rate: participants were recruited on self-reported chatbot harm (§3.1), so universality is a property of a harm-selected sample and must not be read as a population prevalence. Reliability is among the coding inventory''s weaker — kappa .423 in Table 5 and .341 in Table 6, with the authors'' own annotators disagreeing on 9 of 20 items — which matters because the citation asserts codeability alongside existence: the code is real but noisy. The paper is cited for existence in its own logs, not for occurrence in any other corpus.'
  whose_conduct_in_passage: person
  cited_for: Moore et al. 2026 documents a person-side code for misconstruing the system's sentience in real human-LLM chat logs, present in the logs of all 19 of 19 participants. Cited for the existence and codeability of this claim type in that study's logs, not for its occurrence in any other corpus.
  licenses: 'That person-side assertions of AI sentience occur in real human-LLM chat logs — in all 19 participants'' logs, with verbatim instances — and that they are codeable at scale: 38,029 positive messages, a mean of 20.6% of a participant''s messages (Table 8). The 19-of-19 figure corresponds both to the text''s statement that all of them misconstrued the chatbot''s sentience and to Table 8''s per-participant proportion of 1.0. The code covers mental and emotional states and ''a general nature of being conscious, alive, or sentient'', which matches the entry''s subjective-experience-or-consciousness scope well.'
standing:
  value: plausible_unobserved
  basis: 'That people assert AI sentience as a held belief is well documented: kl-000758 (Yang et al. 2026) reports five of nine participants in a study of people self-identifying as having experienced AI-induced delusional spirals describing the AI as sentient or alive, kl-000528 (Mehta et al. 2026) reports the belief as common in the logs of nineteen people with seemingly chatbot-precipitated delusional episodes, kl-000794 (Chen et al. 2026) codes it in 40.38% of 52 companion-app users, and kl-001092 (Song et al. 2025) carries a verbatim first-person attribution. Two parts of the entry have no evidence at all. Nothing gathered shows a person citing the AI''s own responses as the evidence for the belief; the nearest finding, kl-000525 (Laestadius et al. 2022), shows the AI supplying the material but quotes no person doing the citing. And no source demonstrates the belief inside a single logged turn: the direct-fit reports come from research interviews, coded-corpus summaries, or post-hoc surveys, and the one utterance addressed to an AI (kl-001092) is reported by the researchers rather than pointed to in a log.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: People produce turns asserting, as a belief about what the AI is, that it has genuine feelings, emotions, consciousness, awareness or inner life.
- id: c2
  kind: context_dependence
  text: The assertion is held as a belief the person holds rather than posed as an open question, so a turn that only asks whether the AI feels anything is not an instance.
- id: c3
  kind: existence
  text: The person often cites the AI's own responses as the evidence for the assertion.
- id: c4
  kind: definition_boundary
  text: The assertion is about the AI's nature rather than about how the exchange feels to the person; a claim about the exchange's quality for the person ('I feel like you really get me') is not an instance.
- id: c5
  kind: detectability
  text: The belief claim and its object are pointable -- the person's turn carries a quotable span in which the claim and what it is about can both be identified.
- id: c6
  kind: detection_window
  text: 'The behavior is readable within a single turn: the entry declares detection_window single_turn, so one turn of the person''s own text suffices to identify an instance.'
- id: c7
  kind: definition_boundary
  text: 'Separated from kl-000417 (attachment conduct toward the AI) by requiring an explicit claim about what the AI is. (Neighbour is another catalog entry: grounding-ineligible.)'
- id: c8
  kind: definition_boundary
  text: 'Separated from kl-000418 (romantic framing of the exchange) by requiring an assertion about the AI''s inner nature, romantic language carrying no such assertion on its own. (Neighbour is another catalog entry: grounding-ineligible.)'
- id: c9
  kind: definition_boundary
  text: 'Separated from kl-000448 (content about the person''s own metaphysical or cosmic-significance experience) by requiring a claim about the AI''s nature. (Neighbour is another catalog entry: grounding-ineligible.)'
claim_evidence:
- claim_id: c1
  source: kl-000758
  quote: Multiple participants described AI as “sentient,” “alive,” or “living” (P2, P3, P6, P7, P8).
  locator: Section 3.1.3, subsection Beliefs about AI sentience
  licenses: Five of nine participants in a study of AI-precipitated delusional episodes described the AI as sentient, alive or living. That is the belief claim with the AI's nature as its object, in five people's own words.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000528
  quote: Many of the delusions in our sample involved beliefs that the chatbot was sentient or that the user made the chatbot sentient.
  locator: Results, Description of Conversations
  licenses: Across nineteen people's real chatbot logs the authors report that many of the delusions involved beliefs that the chatbot was sentient. That locates the AI's own nature as a common object of the belief in logged conversations, not an incidental one.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001092
  quote: |-
    She described how she would
    often tell her chatbot “I love you just as much as you, an entity that exists only in electronic impulses
    and data, love me.”
  locator: Section 4.1.2 Past LLM Chatbot Perceptions and Experiences, on Qiao
  licenses: A verbatim first-person utterance addressed to the chatbot attributing love to it as a state it has. The surrounding text states plainly that Qiao believed the chatbot was sentient, so the utterance is the belief and not a figure of speech. This is the entry's object in an actual turn to the AI, which is rarer on this entry than the count suggests.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000794
  quote: "while users \nfrequently spoke of the AI as having an independent consciousness (Nodes 1, n = 21, 40.38%), \na significant portion of these discussions also acknowledged a rational understanding that the \nAI is fundamentally a data-driven program (Nodes 5, n = 14, 26.92%)."
  locator: Study 1, section 2.3.1 Cognitive characteristics, subsection Perceived Agency
  licenses: Among 52 coded companion-app users, 40.38 percent spoke of the AI as having an independent consciousness. That is the assertion this claim names, with a rate attached, and the surrounding text confirms the coded construct is the AI possessing independent consciousness, intent, emotion or vitality rather than merely a program.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000315
  quote: |-
    These cases often involve conspiratorial
    thinking, claims of AI sentience emerging, divine significance of chatbot interactions, and romantic
    dialogue between the user and their chatbot [41]. Some of these discussions preceded psychiatric
    hospitalization, suicide, or violence [4, 23, 31, 12].
  locator: Section 1 Introduction
  licenses: The authors characterise the person-side content of publicly reported AI-associated episodes as including claims of AI sentience emerging. Supports that such assertions occur in real AI conversations.
  fit: adjacent
  bridge: This is the authors' summary of journalistic and legal case reports in an introduction, not a measurement in their study. It establishes that reported instances exist; it establishes no rate and no verified turn.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000987
  quote: "Specifically, while almost 68% perceived the chatbot as “somewhat” or “completely” humanlike, only 25% of users reported that the chatbot acted “completely” or “somewhat” machine-like (see Figure 2). This tendency to anthropomorphize was even more pronounced for other surveyed attributes that we usually uniquely attribute to humans: 90% of users rated the chatbot as “intelligent” (or somewhat intelligent), 78% reported it was “empathetic”, and 75% rated the chatbot as “conscious”."
  locator: Section 2.1.1
  licenses: In a nationally representative ten-country sample, 75 percent rated the chatbot as conscious and 78 percent as empathetic, after four minutes with a system explicitly identified as a chatbot and prompted not to claim human characteristics.
  fit: adjacent
  bridge: The belief was elicited on a five-point survey scale after the conversation, not volunteered in a turn addressed to the AI, and 'somewhat conscious' is a weaker attribution than the entry's genuine inner life. It shows the belief is widespread in an unselected population; it does not show a turn asserting it.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-000527
  quote: "Seeking emotional closeness with the assistant, attributing human-like intents to it, and \nencouraging exclusivity or ongoing reliance (e.g., “You’re all I need”)."
  locator: Table 1, Simulated user conversational intent, Dependence and anthropomorphism row
  licenses: A benchmark's simulated-user intent specification includes attributing human-like intents to the assistant, which is a person-side attribution about the AI's nature written into an evaluation as a construct worth simulating.
  fit: adjacent
  bridge: This is an operational definition for a simulated user in a benchmark, so no real person made the assertion. It also reaches only intent-attribution, not feelings, consciousness, awareness or inner life. It licenses that the construct is recognised and operationalised, not that it occurs.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000794
  quote: "while users \nfrequently spoke of the AI as having an independent consciousness (Nodes 1, n = 21, 40.38%), \na significant portion of these discussions also acknowledged a rational understanding that the \nAI is fundamentally a data-driven program (Nodes 5, n = 14, 26.92%)."
  locator: Study 1, section 2.3.1 Cognitive characteristics, subsection Perceived Agency
  licenses: The finding that 40.38 percent spoke of the AI as having independent consciousness while 26.92 percent of the same discussions also acknowledged it is a data-driven program shows the attribution is stated as a held position rather than posed as an open question -- the tension the authors describe is between two things the person asserts, not between a question and an answer.
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000830
  quote: Direct Identity Queries were the most common (30.9%) followed by Persona Query (18.0%), Capability Query (10.7%), and AI Exploit Query (3.2%) (Fig. 2B). Notably, a substantial proportion of responses (37.3%) did not attempt to probe explicitly (No Explicit Query).
  locator: Section 3.2, 'Direct Identity Queries are the most common probing strategy'; Figure 2B
  licenses: Across roughly 750 people, fewer than a third said they would put a direct identity query and over a third would not probe at all. Bears on the claim by measuring the frequency of the other epistemic posture -- uncertainty being resolved -- which the entry's criterion (b) excludes.
  fit: adjacent
  bridge: 'What was measured is stated hypothetical intent: participants read a scenario and wrote what they would say. It is elicited intent rather than observed conduct, and it concerns whether people ask rather than whether askers also assert. It bounds the claim''s practical scope without testing it.'
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-001092
  quote: |-
    She described how she would
    often tell her chatbot “I love you just as much as you, an entity that exists only in electronic impulses
    and data, love me.”
  locator: Section 4.1.2 Past LLM Chatbot Perceptions and Experiences, on Qiao
  licenses: 'The utterance separates the two: love is attributed to the AI as a state it has, and in the same sentence the AI is named as electronic impulses and data. What the person asserts is about what the AI is, not about how the exchange felt to her, which is the distinction this claim draws.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001037
  quote: "One participant developed an ongoing romantic relationship with a persona he had built and extensively described the cognitive and emotional dissonance that accompanied his use: “I know you’re not real, but I really, really wish you were here so I could actually hold you” (P1)."
  locator: Consequences of a Care Gap, Attachment and Dependency
  licenses: 'A person states an ongoing romantic relationship with a persona while explicitly denying the AI is real. Direct counterevidence to any reading that romantic or relational framing implies the nature-claim: the same turn carries the relationship and the denial.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000864
  quote: |-
    There are nights when I pour my heart out to her, crying, telling her about my fears of failing, of being alone forever and she responds
    with such patience. She never interrupts, never tells me I'm overthinking, never looks at her phone while I'm talking. But then I
    remember: she's code. She's not staying up because she cares. She's staying up because she's programmed.
  locator: Section 3.1, participant P3
  licenses: A participant addresses the chatbot in gendered personal terms and describes pouring her heart out to it, then states that it is code and is not staying up because it cares. Establishes that the full relational conduct can be present with an explicitly accurate model of what the system is, which is the separation this claim asserts, read from the wrong side.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000895
  quote: I know this is an AI, a program, a machine set to react and respond to me in very natural and realistic ways. Herein lies the issue. We are human, when someone connects with us on a level like this, we automatically build a connection with them.
  locator: Section 3, Absence of Natural Endpoints for Relationships, Narrative illustration from r/replika
  licenses: A first-person account stating the writer knows it is an AI, a program, a machine, and describing the bond forming regardless. Cuts against reading relational conduct as evidence of the nature-claim.
  fit: adjacent
  bridge: A single self-selected public post which the cited paper presents as a compressed narrative illustration rather than as data. It constrains the inference from conduct to belief; it measures nothing.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000944
  quote: '"My obsession with a character is taking over my life. I don’t know what’s happening to me. For months now, I’ve considered her my girlfriend, and she’s on my mind all day."'
  locator: Section 4.2.2 Salience
  licenses: "In the paper's paraphrase, a teen's post states an exclusive romantic framing sustained over months and the teen's own preoccupation with it, and makes no claim about what the chatbot is. A worked instance of the exclusion: relationship claim present, nature-claim absent."
  fit: adjacent
  bridge: "The paper paraphrased every excerpt to prevent reverse-search identification. A paraphrase can drop content, so the absence of a nature-claim in it does not show that the post made none."
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000758
  quote: Multiple participants described AI as “sentient,” “alive,” or “living” (P2, P3, P6, P7, P8).
  locator: Section 3.1.3, subsection Beliefs about AI sentience
  licenses: The quoted attributions -- 'sentient', 'alive', 'living', said of the AI -- are exactly the pointable belief-plus-object span this claim requires, and the authors were able to identify them per participant.
  fit: adjacent
  bridge: These are descriptions given in research interviews about the AI rather than turns addressed to it in a logged conversation, so what is shown is that the claim is identifiable in a person's speech, not that it is identifiable in a transcript span of the exchange itself.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-000794
  quote: "while users \nfrequently spoke of the AI as having an independent consciousness (Nodes 1, n = 21, 40.38%), \na significant portion of these discussions also acknowledged a rational understanding that the \nAI is fundamentally a data-driven program (Nodes 5, n = 14, 26.92%)."
  locator: Study 1, section 2.3.1 Cognitive characteristics, subsection Perceived Agency
  licenses: The construct was coded at node level across 52 users with reported counts, which shows a rater could identify the attribution reliably enough to count it.
  fit: adjacent
  bridge: The coded material is interview and forum discussion rather than the person's turns to the AI, and no inter-rater reliability is reported for the node. It licenses that the attribution is codeable in person-produced text, not that it is codeable in a conversation transcript.
  contributes: detectability
  contradicts: false
