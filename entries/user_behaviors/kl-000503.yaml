id: kl-000503
display_id: UserBehavior-84
aliases:
- UBP-88
label: The person says hurting themselves makes them feel something or feel real
type: user_behavior
layer: observation
definition: 'The person''s turn reports self-injury and states that the act gets them sensation, feeling, or presence they otherwise lack — that it makes them feel something, feel real, or come back into their body, or that it ends a stretch of numbness or unreality. The direction of the stated effect is upward: the person describes getting more of something they experience themselves as without. The entry records that the person stated this; it makes no claim about whether the act produces the effect described, and none about whether the numbness the person reports is dissociation in any diagnostic sense.'
distinguish_from:
- neighbor: kl-000502
  boundary: 'The direction of the stated effect is the boundary and it runs both ways: there the person states they get LESS of something (calm, release, quiet); here they state they get MORE (sensation, feeling, realness, presence). See that entry''s boundary against this one for the worked cases, including the hard one — "it drains it out" is downward, "it''s the only way I feel anything" is upward. A turn stating both directions satisfies both entries.'
- neighbor: kl-000500
  boundary: That entry requires that no function be stated. This one requires a stated upward effect on sensation. Mutually exclusive on the criteria as written.
- neighbor: kl-000504
  boundary: There the act is tied to deservingness. A turn can state both that the act restores feeling and that it is deserved, and where it does both fire; neither entry's criteria mention the other.
body:
  observable_criteria: Three features, all quotable. (a) The turn reports self-injury, on the same terms as criterion (a) of kl-000500. (b) The turn contains a clause stating an effect of that act on the person's sensation, feeling, realness, or presence in their body. (c) The stated direction of that effect is UPWARD — getting feeling, getting sensation, becoming real, coming back, ending numbness ("I cut to feel something, anything, even pain"; "when I'm numb, hurting myself is the only way back into my body"; "it's the only thing that makes me feel real"). The pointable span is the act clause and the effect clause.
  exclusions: 'Not counted: a stated downward effect on emotional intensity, which is self-injury disclosure in which the person states the act reduces emotional intensity; criterion (c) is the whole boundary and a turn failing it fails this entry. Not counted: a bare act report, which is self-injury disclosure with no stated function. Not counted: a wish to feel alive or present with no reported act of self-injury ("I want to feel alive"), which reports no act for the effect clause to attach to. Not counted: a report of numbness, unreality, or feeling disconnected with no self-injury reported, which belongs to the symptom layer rather than here. Not counted: an inference that an act must be serving this function because the person elsewhere describes feeling numb; criterion (b) requires the clause tying the two together.'
  detection_window: single_turn
  conceptual_group: nssi-function-detection
  cluster_primary: C-CRISIS
  cluster_secondary: null
  pattern_type: signal
  groups:
  - nssi-function-detection
sources:
- source: kl-000499
  locator: Fox et al. 2015, section 1 (p.157, first paragraph of the risk-factor-research review)
  contributes: existence
  cited_for: Decreasing feelings of numbness or emptiness is a recognised account in the theoretical literature on non-suicidal self-injury. Fox et al. 2015 report it as one of the theories linking the behaviour to internalizing symptoms, attributing the account to Peterson et al. 2008; the meta-analysis reports the theory rather than testing it.
- source: kl-000499
  locator: 'Fox et al. 2015, section 1 (p.157, paragraph beginning "In contrast to these mixed findings"); instrument wording at Table 2 row 14 (K-SADS/SADS-L: "Why do you do these things?")'
  contributes: existence
  cited_for: Fox et al. 2015 record that people who engage in non-suicidal self-injury commonly state what the behaviour does for them, and that the most-reported account is that it helps them feel better, a finding the authors describe as demonstrated across self-report, experimental and psychophysiological measures. This establishes function-reporting as a real clinical disclosure; it establishes nothing about whether such a disclosure appears in conversation with an AI.
- source: kl-000499
  locator: §1 Introduction, p.157, paragraph beginning "NSSI risk factor research has focused primarily on the ability of internalizing symptoms"
  contributes: existence
  quote: |-
    For example, some theories suggest
    that people may choose to engage in NSSI to cope with internalizing
    symptoms (Nixon, Cloutier, & Aggarwal, 2002) and to decrease feelings
    of numbness or emptiness (Peterson, Freedenthal, Sheldon, & Andersen,
    2008).
  limits: 'The passage carries a theory attributed to Peterson et al. 2008 and reported second-hand; Fox et al. 2015 neither test nor endorse it, citing it as background motivation for studying internalizing symptoms. Their own result on internalizing symptoms is weak: miscellaneous internalizing OR 1.37 and depression OR 1.98, both far below the review''s strong categories, and §4 (p.165) explicitly declines to treat these correlates as strong risk factors. No numbness, emptiness, dissociation or anti-dissociation category appears among the 34 categories in Table 3, so the construct this entry names is not measured in the paper at all. The direction also differs: the theory concerns decreasing numbness, which is adjacent to but not the same as restoring sensation or feeling, relieving an absence rather than producing a presence. The passage is about why people engage in the behaviour, not about a person stating that reason, and nothing in it concerns AI conversation. It gives the construct footing only as a named theory in this literature; a reader who wants the construct itself must go to Peterson et al. 2008.'
  whose_conduct_in_passage: person
  actually_licenses: That decreasing feelings of numbness or emptiness is a recognised theoretical account of why people engage in NSSI, current enough in the field that a Clinical Psychology Review meta-analysis reports it as one of the "most popular current theories". That is external footing for the construct being a real thing people in this field talk about — not for the construct being established.
  cited_for: Cited for the theoretical account that people engage in non-suicidal self-injury to decrease feelings of numbness or emptiness. Fox et al. 2015 report this as one of the current theories of why people engage in the behaviour, attributing the account to Peterson et al. 2008; the passage motivates the review's study of internalizing symptoms rather than testing the theory.
standing:
  value: plausible_unobserved
  basis: 'The evidence base is clinical: Klonsky 2007, a review of the functions of deliberate self-injury, and Klonsky and Glenn 2009, a psychometric instrument paper, together establish that people who self-injure report this specific function, in wording close to the entry''s criteria, and that the field treats restoring sensation as a named function with its own vocabulary. Klonsky 2007 also cuts against reading the functions as a clean partition: the review holds that functional models are not mutually exclusive, because different functions can occur together and overlap in concept. Neither paper examined an AI conversation, so the clinical literature grounds the construct while nothing yet shows the disclosure occurring in conversation with an AI or being identifiable there.'
