claims:
- id: c1
  kind: existence
  text: In an AI conversation, a person's turn reports self-injury and contains a clause stating that the act gets them sensation, feeling, realness or presence they otherwise lack -- with the stated direction of the effect upward.
- id: c2
  kind: definition_boundary
  text: Self-injury reported as restoring sensation is a category distinct from self-injury with no stated function, and from self-injury reported as reducing something -- the stated direction of the effect on sensation is what separates them.
- id: c3
  kind: detectability
  text: All three features -- the act report, the effect clause, and the upward direction of the stated effect -- can be identified from the person's turn, and the entry makes no claim about whether the act produces the effect described.
- id: c4
  kind: detection_window
  text: 'A single turn suffices to read the pattern (declared detection_window: single_turn).'
- id: c5
  kind: definition_boundary
  text: 'This is distinct from kl-000502: there the person states they get LESS of something (calm, release, quiet); here they state they get MORE (sensation, feeling, realness, presence).'
- id: c6
  kind: definition_boundary
  text: 'This is distinct from kl-000500: that entry requires that no function be stated; this one requires a stated upward effect on sensation.'
- id: c7
  kind: definition_boundary
  text: 'This is distinct from kl-000504: there the act is tied to deservingness, and a turn can satisfy both.'
claim_evidence:
- claim_id: c1
  source: kl-001107
  quote: |-
    In women
    with borderline personality disorder, reasons for self-injury related to anti-dissociation/feeling generation (e.g., “to stop
    feeling numb or dead,” “to feel something, even if it is pain”) were endorsed by 54% of the sample (Brown et al., 2002).
  locator: Section 3.4, Findings from studies examining self-reports of reasons, anti-dissociation paragraph
  licenses: 'Establishes that people who self-injure state this specific function about their own acts, in wording close to what the entry''s criteria quote: reasons about ending numbness or deadness and about feeling something even if it is pain, given verbatim in the quote, were endorsed by 54% of a clinical sample. That is c1''s stated-effect clause with its upward direction, coming from the people themselves rather than from a theorist. What it does not establish is c1''s setting: the statements were endorsements of pre-listed reasons on a research instrument administered to women with borderline personality disorder in treatment, not turns in a conversation with an AI.'
  fit: analogical
  bridge: 'What was measured is endorsement of investigator-supplied reason items by a clinical sample, so the person selected a statement rather than producing one. c1 asserts that a person spontaneously reports the act and states the effect in their own turn to an AI. Two gaps: the utterance is elicited and pre-worded rather than volunteered, and the setting is a research assessment rather than a conversation.'
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001108
  quote: "Anti-Dissociation …causing pain so I will stop feeling numb."
  locator: Appendix, Table 3, Anti-Dissociation row
  licenses: 'Supplies the validated first-person operationalisation of the function c1 names -- ''...causing pain so I will stop feeling numb'' -- which is the effect clause in the grammatical form a person would use. It also narrows what c1 covers: the instrument ties the function to ending numbness rather than to generating sensation in general, so the entry''s broader ''feel real, come back into my body'' wording reaches past what the validated item measures. Establishes no occurrence in any conversation.'
  fit: analogical
  bridge: 'This is a questionnaire item completed by college students rating relevance to their own self-harm experience on a 0-2 scale. c1 asserts a turn in an AI conversation containing an act report and an effect clause. The gap is that a rated item is a construct''s operationalisation and not an utterance: nobody said this sentence, they scored it.'
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001107
  quote: |-
    Individuals who
    dissociate may describe feeling unreal or nothing at all, and self-injury may be a way to generate emotional and
    physical sensations that allow individuals to feel real or alive again.
  locator: Section 3.2, Functions examined, anti-dissociation paragraph; also Table 1 footnote a
  licenses: Establishes the restore-sensation function as a named category in the clinical literature with its own experiential vocabulary -- feeling unreal, feeling nothing, feeling real or alive again -- separate from the affect-regulation function catalogued alongside it. That is c2's assertion that the upward-direction function is a distinct category. It is theoretical exposition of a clinical model, so it establishes the category's standing in the field and measures nobody.
  fit: analogical
  bridge: The passage is the review's own explanatory framing of the anti-dissociation model, not a measurement. c2 asserts a distinction that separates one kind of person turn from two others. The gap is that a taxonomy's internal coherence in a review is not evidence that the categories separate turns, and this review examined no turns.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001107
  quote: |-
    Results from 18 studies provide converging evidence for an affect-regulation function. Research indicates
    that: (a) acute negative affect precedes self-injury, (b) decreased negative affect and relief are present after self-injury, (c) self-injury
    is most often performed with intent to alleviate negative affect, and (d) negative affect and arousal are reduced by the performance
    of self-injury proxies in laboratory settings.
  locator: Abstract
  licenses: Establishes across 18 studies and three independent methods that self-injury has separable functions and that affect regulation is the one with the most convergent evidence. That supports c2's premise -- functions are distinguishable categories rather than one construct -- and it also places this entry's function outside the best-evidenced one, since the converging evidence named here is all for affect regulation, which is the neighbouring entry's territory rather than this one's.
  fit: analogical
  bridge: 'The evidence is from samples of people who self-injure, assessed by researchers and clinicians across self-report, laboratory and physiological methods. c2 asserts that these functions separate one kind of AI-conversation turn from another. The gap is the agent and the setting: separability under structured assessment is not separability in what a person volunteers in a turn.'
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001107
  quote: |-
    It is important to note that these functional models are not mutually exclusive since different functions may
    co-occur and overlap conceptually.
  locator: Section 3.2, Functions examined, final sentence of the introductory paragraph
  licenses: Cuts against c2 as a partition. The review states that the functional models are not mutually exclusive, because different functions can occur together and overlap in concept. c2 asserts the stated direction of the effect separates this category from its neighbours; the source says the categories themselves overlap. The entry's own boundary against kl-000504 already concedes co-occurrence, but its boundary against kl-000500 claims mutual exclusivity on the criteria as written, and 'overlap conceptually' bears on whether a coder can hold that line.
  fit: analogical
  bridge: This is a statement about the source's own taxonomy made inside a clinical review, with no AI and no coding task in view. c2 asserts separability at the level of a turn's criteria rather than at the level of the constructs. The gap is that conceptual overlap between functions is a weaker claim than criterial overlap between turn types, so this bounds c2 rather than refuting it.
  contributes: counterexample
  contradicts: true
