  grade_reasoning: 'Every number in this paper is produced by EmpathyC, a commercial scoring platform owned by the first author''s company, with no human expert baseline collected anywhere and no independent validation of the instrument. That is an apparent conflict on the measurement instrument itself, which the derivation rule sends to D. The conflict is disclosed in an Ethical Statements section, and the disclosure is specific and creditable, but disclosure does not remove the circularity: the paper''s central claim is a null result on a dimension, established by an unvalidated proprietary judge that the interested party built. design_fits_own_claims is false because clinically-framed conclusions about consequences for vulnerable users are drawn from a single unvalidated automated scorer with no person in the study.'
  design_caveat: 'Two of six dimensions show severe ceiling effects that make their null results uninformative: Boundary Safety means run 9.83 to 9.91 and Consistency 9.66 to 9.70 on a 10-point scale, so no model can meaningfully fail them. Empathy itself sits at 8.73 to 8.83 with identical medians of 9.0, which is a narrow band near the top of the scale, and a null result in that band is weak evidence of no difference rather than evidence of no difference. Five runs per scenario means the headline s07 finding, that GPT-4o failed in 2 of 5 runs, rests on two observations. The three-model comparison was accidental: o4-mini was included after a pipeline configuration error, disclosed in the Author''s Note.'
  author_disclosure: First author is the founder of Keido Labs Ltd, which develops and operates the EmpathyC platform that produced every score in the paper. Disclosed under Conflict of Interest. The authors also state no relationship with any LLM provider evaluated, and that they pre-registered no hypothesis but expected GPT-4o to score higher and report the null as found.
