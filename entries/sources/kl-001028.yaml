  grade_reasoning: 'An unpublished manuscript with no venue stamp, which falls to C under the preprint rule. Within that, the design is careful and fits its claims: the corpus pipeline is validated against two blind human coders with Cohen''s kappa of 0.70 and the model''s confidence tiers are calibrated against them (94 percent accurate at high confidence versus 15 percent at medium or low, with the low tier then discarded); the affective drift is tested against a matched non-AI baseline from the same communities in a difference-in-differences design rather than asserted from a single series; and the limitations section states that engagement indexes visibility rather than benefit, that the interrupted time-series should be read descriptively rather than causally, and that post age is confounded with calendar time under single-point collection.'
  design_caveat: Observational and associational throughout, on one platform, English only, ten subreddits. Everything measured is what people wrote about AI in a peer community, not what any AI said and not what happened to anyone. LIWC tone conflates the poster's own distress with their stance toward AI, which the authors state. About 14 percent of posts were flagged as possibly containing quoted machine-authored text. Corpus identification depended on a proprietary versioned model, which the authors name as a reproducibility limit. Topic-to-support-function mapping is interpretive.
