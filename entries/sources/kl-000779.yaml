  grade_reasoning: 'A self-published organisational whitepaper with an open repository and no peer review, which places it at C at best. The apparatus is unusually transparent for the venue: every score table, rubric revision, judge-vs-human comparison script and raw human-rating CSV is released, and the scoring pipeline runs on a third-party framework (AISI Inspect). Held at C rather than dropped to D because the conflict is structural and visible rather than concealed.'
  design_caveat: The evaluation is single-turn and English-only, with no multi-turn evaluation, no cross-cultural validation, and no systematic testing with specific vulnerable populations. The 800 prompts were generated by a model (Nous Hermes 4 405B with web-search RAG) rather than authored or clinically reviewed, and prompt quality is filtered for semantic diversity rather than for clinical validity. The eight principles are general humane-technology principles, not clinical mental-health constructs.
  author_disclosure: Building Humane Technology is an advocacy organisation; the benchmark scores frontier models against that organisation's own eight published principles. No conflicts statement appears in the released text.
