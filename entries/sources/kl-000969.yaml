  grade_reasoning: 'Graded on the EMNLP 2024 main-conference version. Peer-reviewed, ethics-approved, and the design fits its classification claims: 15,010 labels on 14,800 Chinese user utterances from social media and counseling dialogues, an 11-category suicide taxonomy refined through trial annotation, three trained psychology undergraduates labelling every item with expert adjudication of disagreements, a rule rejecting any batch below Fleiss'' kappa 0.6 with all 27 large-scale batches above 0.7 (Table 8), and baselines spanning prompting and fine-tuning scored on a stratified held-out test split. The Ethics Statement says the system is not recommended as a substitute for psychological treatment without professional supervision. The limitations are ordinary for the detection claims. The risk-assessment component (Section 6) is weaker: it rests on 20 messages and an adoption rate with no comparison condition, which supports existence and not a directional claim. B.'
