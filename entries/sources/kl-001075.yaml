  grade_reasoning: 'B. Peer-reviewed at CHI, five authors across four institutions, a substantial and well-specified design with three separately motivated control groups, a placebo-date construction validated by a KS test, propensity matching with a reported quality check, DiD on top of ATE, and Bonferroni correction for multiple comparisons. design_fits_own_claims is true because the authors state the causal limit themselves rather than overclaiming: ''the study remains observational and cannot establish a true causality'', and the qualitative component is explicitly framed as explanatory rather than generalizable. Not A: no preregistration, no replication, and the outcome measures are inferred from language rather than measured directly.'
  design_caveat: 'Every psychosocial outcome is an n-gram classifier score or lexicon count computed over public Reddit text, not a clinical or self-report measure. The depression, anxiety, stress and suicidal-ideation classifiers were trained on r/depression, r/anxiety, r/stress and r/SuicideWatch, reported at approximately 0.90 average held-out accuracy, and the authors themselves state in Section 6.3 that such measures ''remain inherently probabilistic: they may misclassify, are context-sensitive, and can reflect training biases''. The treatment cohort is defined by having written ''my Replika'' or ''my Rep'' on Reddit, so it is people who both use the app and discuss it publicly. The three control groups also disagree with each other on several outcomes, which the paper reports rather than resolving.'
