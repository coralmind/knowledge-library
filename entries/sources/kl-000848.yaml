  grade_reasoning: |
    Peer-reviewed with an adequate N and good scale reliabilities, but graded C because the design does not fit the claims: a single-wave cross-sectional questionnaire is reported throughout in directional language ("attachment anxiety not only directly affects", "leading to PUCAI"), the paper's own limitations section concedes causality cannot be inferred, and the reported numbers do not reconcile. The abstract states "Fifty-four Chinese adults" while the Methods report 504 analysed of 572 recruited, and the stated sex counts (248 male, 261 female) sum to 509 rather than 504. All four constructs are self-report from one instrument battery at one time point, so common-method variance is unaddressed.
