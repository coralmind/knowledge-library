  grade_reasoning: Preregistered at aspredicted.org with the central hypotheses stated in advance, published in a peer-reviewed journal, n = 1,871 with quota-based stratified sampling on age, sex and race, validated screening instruments with reported reliabilities (alpha 0.82 to 0.95), multiple-comparison correction, and data and code deposited on OSF. Every claim it makes is a prevalence or group-difference claim, which a survey of this design licenses. Competing interests are declared in full and are consistent with `declared_managed` rather than a defect.
  design_caveat: |
    The authors state the 24% figure may be an overestimate because Prolific oversamples technology adopters: overall LLM use in this sample was 92% against Pew's 23% address-based 2024 estimate. The population projection of 14 to 18 million corrects for this by applying the sample's conditional probability to Pew's population base. All use, symptom, and perception data are self-report; no chat logs were examined, and the authors say so explicitly.
  author_disclosure: 'Three of five authors declare paid advising or equity relationships with AI mental-health companies: ''ECS reports paid advising work to Sonar Mental Health, Sonia Health, and OpenAI. J.C.E. reports equity and paid advising work from Jimini Health and equity from Sonar Mental Health. ZMT reports previous employment at Jimini Health.'' Declared, and the study''s findings are descriptive rather than evaluative of any product.'
