  grade_reasoning: Peer-reviewed in a Nature Portfolio journal with named reviewers, a stated design, 5,400 outputs, a pre-specified binary outcome and a mixed-effects model that accounts for the repeated-measures structure; the conclusions stay inside what the design reaches (susceptibility rates and the relative effect of two mitigations) and the authors themselves name the simulated-vignette and single-run limitations, so B rather than A only because it is neither pre-registered nor replicated.
  design_caveat: Every prompt was run once per condition, so the reported rates carry no run-to-run variance. The vignettes are synthetic and were drafted with Claude Sonnet 3.5 from two physician-written templates before physician validation, which means the input distribution is partly model-generated. The outcome label was produced by GPT-4o, one of the six models under test, and its calibration audit covers 200 of 5,400 outputs (3.7 percent). The task is JSON-formatted clinical information listing, not conversation, and the domain is general medicine rather than mental health.
