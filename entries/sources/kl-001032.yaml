  grade_reasoning: 'A carefully instrumented benchmark with a causal-ablation head-selection step, a preservation control on 625 normal prompts per model, a corrigibility control on 100 correction instances, an explicit Harm-versus-Rescue accounting rather than a one-sided success rate, a 20-model comparison, and a masked SME check that reports its own judge''s ceiling effect. design_fits_own_claims is true because the paper repeatedly bounds its own claims: it calls the Harm-Rescue separation an association rather than causation, says its own verifier agreement should not be read as equivalence, and names the partial causal separation in one of its two models as a limitation rather than glossing it. The letter is C on the preprint rule, and it would not rise above it in any case: every behavioral outcome across 15,900 runs is scored by GPT-OSS-20B, an uncalibrated LLM judge whose agreement with humans is established on 18 comparisons over three EHRs, and whose confidence the paper itself shows is saturated at ceiling. The steering evaluation is also confined to two Gemma-family models in English EHR question answering.'
