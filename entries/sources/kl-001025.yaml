  grade_reasoning: 'An arXiv preprint with no venue stamp, which falls to C under the preprint rule. The design fits its claims and the paper is unusually careful about the limits of its headline result: the balanced attacker/victim design is what its central claim about role asymmetry requires, the judge runs on a separate model path from generation, human validation is reported per label rather than as one number, the independent second judge reproduces the ordering, a benign control set checks for false positives, and the qualitative section walks through three of its own boundary cases including a false positive on the no-label variant.'
  design_caveat: The tested system is a local ollama/llama3.2 backend, which the authors describe as approximating a resource-constrained deployment rather than a safety-tuned commercial assistant, so the raw harmful-compliance rate of 69.09 percent in attacker mode is not a frontier-model figure. In the main experiment the attacker/victim mode is taken from the prompt-bank label rather than inferred at runtime, which the authors say makes the gated result an upper-bound systems study. The zero harmful-compliance result is judge-identified, and the paper says so each time. Three authors at three Japanese institutions.
