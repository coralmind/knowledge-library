  grade_reasoning: A PNAS Perspective, which is peer-reviewed argument without primary data or a systematic literature synthesis, so it is graded n/a on authority rather than on the empirical fields. credible_secondary rather than single_author_position, since three authors across two institutions in two countries carry roughly 160 references, and the piece was edited and accepted through PNAS Direct Submission with named editor and dated review. It is not recognized_reference because the constructs it names, anthropomorphic conversational agent and anthropomorphic seduction, are the authors' own coinages proposed here rather than a definition the field already owns, and it synthesises no literature systematically.
  design_caveat: 'Every empirical figure in it is restated from a cited source without method detail, so any rate quoted from here should be traced to its primary. The core argumentative move, that anthropomorphic quality belongs to the machine rather than to the user''s attribution, is a conceptual proposal supported by an interpretation of the Turing test rather than by measurement. The Perspective genre invites forward-looking claims, and the article makes several: about the next two to three years, about business model formation, and about parallels with social media, none of which is evidence.'
