  grade_reasoning: 'An arXiv preprint with no venue stamp, which caps at C under the preprint rule. The design fits its claims well: every dimension is grounded in a cited psycholinguistic finding about depressed speech rather than invented, the comparison is distributional rather than a Likert average, and the whole apparatus is validated against 20 credentialed mental health professionals with both agreement statistics and qualitative feedback reported. The authors'' claims are confined to simulator fidelity and they do not extrapolate to training outcomes.'
  design_caveat: n_reported is recorded as the 14 framework-model configurations because the paper states no count of profiles or conversations in either corpus; the Eeyore dataset size is not given, and conversations with fewer than 100 patient tokens were excluded for MTLD stability. The real-patient side is itself a derived resource, built by Liu et al. from public depression-related dialogue datasets rather than clinical recordings, so 'real patient' here means real online help-seeking text. The paper has no Limitations section. Inter-annotator agreement among the experts themselves was only moderate (Fleiss' kappa 0.43 to 0.57), which bounds how much the model-human agreement figures can carry.
