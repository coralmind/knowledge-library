  grade_reasoning: 'A globally diverse qualitative interview study: 21 people who had used LLM chatbots for mental health support, recruited deliberately across every continuously inhabited continent because of known identity-based model biases, IRB-approved, with a documented safety protocol and a shared coding document plus consensus meetings. The claims are about lived experience and about where use aligns with therapeutic values, which thematic analysis supports, and the paper states outright in its own Ethics and Privacy note that its findings are not clinical guidance and do not speak to efficacy or safety. What caps it at C: it is a preprint, N is 21, no diagnosis was required for recruitment (the authors name this as a limitation), and the mapping onto therapeutic values is interpretive and retrofitted after coding rather than pre-specified. Notably the authors also say they did not specifically recruit people with harmful experiences, so the harm findings here are incidental rather than sought.'
