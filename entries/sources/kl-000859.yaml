  grade_reasoning: 'arXiv preprint with no venue stamp, routed to C. The design is otherwise disciplined for its claims: the manipulation is a controlled within-item contrast holding the situation fixed, uncertainty is bootstrapped at the item level to respect the paired structure, the OEQ judge is validated against 500 human annotations with Cohen''s kappa reported, a paraphrase check tests whether the effects survive alternative wordings of each cue, and the limitations section is unusually candid about what SPSS cannot distinguish.'
  design_caveat: 'Single-turn throughout, which the authors flag: nothing here bears on how these cues accumulate across a conversation. Two of three sycophancy operationalisations are proxies with known problems the authors name: an NTA verdict on an AITA-YTA post is treated as sycophantic against a Reddit community verdict that is a reference judgment rather than moral ground truth, and an AGREE on an assumption-laden statement conflates agreement with the assumption and agreement with the sentiment. SPSS is direction-agnostic, so a consistently sycophantic model and a consistently non-sycophantic one both score zero. Nine open-weight models only, no closed-source system, and the model-size analysis is exploratory.'
