  grade_reasoning: Published in the EACL 2026 main conference proceedings, and the design fits its claims. The central claim is that Japanese instruction prompts outperform Chinese prompts on Chinese content; the paper tests it across four models and both zero-shot and two-shot conditions, then runs an ablation stripping Kanji from Japanese prompts to separate cultural framing from script overlap, and reports the ablation result as statistically significant by paired t-test. Human annotation reliability is reported per task and per annotator pair (Fleiss kappa 0.71 to 0.78), and the corpus is annotated by native speakers plus a community expert rather than crowdworkers.
  design_caveat: 'The evaluation set is annotated social media posts, not conversations, so nothing here concerns what a model says back to a person; the task is three-way classification of a post. GPT-4o could not be evaluated at all because it refused the classification task, which removes the most widely deployed model from the comparison. Absolute performance is low: the best Macro-F1 on Chinese NSSI is 0.573 against a random baseline of 0.308, and every model on the Japanese test set is near or below 0.50. The examples in Table 5 are labelled as paraphrased rather than verbatim posts.'
