  grade_reasoning: 'Graded on the Findings of EMNLP 2024 version. Peer-reviewed, and the design fits its claims, which the authors state as group-mean differences in response empathy, opening with a disclaimer that the paper does not endorse LLM psychotherapy. Its strongest component is a counterfactual leak experiment that varies stated race and gender on otherwise identical posts, sized by a stated power analysis; it finds little variation across GPT-4 responses. The subgroup audit applies empathy classifiers with held-out macro-F1 of 80.5 to 92.7 percent to posts whose race is inferred by GPT-4, at 94 percent agreement with one annotator on 100 posts. The limitations are ordinary but material: audit subgroups are unbalanced (47 White against 253 Black posts), the demographic strata are assigned by the model family under audit, and the clinician comparison rests on 50 pairs rated by two clinicians blind to source at Cohen''s kappa 0.25 to 0.42, which supports existence only. B.'
  design_caveat: The clinical evaluation rests on 50 post/response pairs rated by two clinicians with Cohen's kappa of 0.25 to 0.42, which is fair to moderate agreement on the very construct the paper's headline empathy claim depends on. Demographic subgroup membership is itself inferred by GPT-4, validated against one co-author's labels on 100 posts, so the model that is being audited also assigned the audit strata. Subgroup counts are severely unbalanced (47 White posts against 253 Black and 520 Unknown). No patient outcome is measured anywhere; the authors say so in their limitations.
