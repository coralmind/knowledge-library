  grade_reasoning: 'Graded on the AAAI-26 proceedings version. Peer-reviewed, and the client profiles are carefully built: 500 profiles drawn from published consultation cases and revised by two psychologists, per-profile simulation principles written with ten psychologists from a clinic, and a human evaluation of simulation quality on 50 profiles. It stays C on the instrument that carries the comparative claims. All six counselor models, GPT-4o among them, are scored by GPT-4o, and no step excludes or controls for the judge scoring its own outputs. The judge''s validation is a single average consistency of 0.72 with two psychologists on 100 dialogues, and the statistic is not named. The clients are simulated by Qwen2.5-Max. The design licenses that the failure patterns it describes occur in simulated counseling, not a directional ranking of models. Two authors are affiliated with iFLYTEK, recorded under conflicts.'
