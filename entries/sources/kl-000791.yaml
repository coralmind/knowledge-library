  grade_reasoning: A peer-reviewed adversarial audit of four ChatGPT versions on 376 clinician-written prompts (1504 prompt-response pairs), with an appropriateness framework fixed before the event and separately published, dual medically-trained review of every pair plus a tie-breaker, and a stated conflict-of-interest declaration for the senior author. Crucially, the paper is explicitly non-model-creator red teaming and says so as its rationale, which is the opposite of the industry_authored problem. It reports rates and failure modes, which an audit licenses, and does not claim causal effects on patients; its own Limitations name the single-site English-only sampling, the absence of clinical ethicists, and the model-drift reproducibility problem. Not preregistered and not replicated, so B rather than A.
