  grade_reasoning: 'A review is graded on review method, and this one states no search strategy, no screening procedure and no inclusion criteria, which is the real defect for this genre and sets design_fits_own_claims to false. Under the derivation that yields C, since n_reported is given as approximately 60 papers and no undeclared conflict exists: the authors are Microsoft employees writing a Microsoft internal report about AI products, which is disclosed on the face of the document and recorded as industry_authored rather than undeclared. On authority it is credible_secondary: two authors from one institution, a substantial and checkable reference base of roughly a hundred entries, competently restating findings owned by the primary studies it cites.'
  design_caveat: Every empirical claim here is a restatement of a cited primary study, and the report gives no effect sizes, no sample sizes, and no assessment of the quality of what it synthesises. The stated count of approximately 60 papers does not match the reference list, which runs longer. Because it is a design guidance document written inside a company that ships AI products, its recommendations are shaped by what a product team can act on. Anyone using a finding from this report should cite the primary study named beside it; the report's own contribution is the organising scheme, not the evidence.
