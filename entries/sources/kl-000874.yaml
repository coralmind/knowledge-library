  grade_reasoning: An arXiv preprint with no venue stamp falls to C under the preprint rule before the later rules are reached, so it cannot take the A that its internal replication would otherwise license. Every claim is stated as a property of system output in simulation.
  design_caveat: Every person-side turn is a Gemini 2.5-Flash persona, so no human was observed. The personas are, by the authors' own words, 'abstractions of complex human conditions'. Harm is a binary GPT-5 label whose ground truth is the two authors' own coding scheme, and the authors note the binary loses severity. Results are a single platform snapshot; Replika ran in Pro accounts configured in boyfriend or girlfriend mode, which is one product configuration among several.
