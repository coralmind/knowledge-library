  grade_reasoning: 'A two-phase mixed-methods study: nine licensed therapists interviewed to derive design requirements, then 14 university-affiliated participants using a rule-based embodied agent for seven days of mood journaling followed by one real therapist-led Zoom session, with IRB approval, PHQ-8 screening, validated instruments (SUS, SEQ, mARM), dual independent coding, an audit trail and member checking. The claims are calibrated: the authors state explicitly that the SEQ scores should be interpreted cautiously in the absence of a control condition, that demand characteristics cannot be ruled out, and that controlled comparison studies are needed to establish what the virtual supporter added. C rather than B: it is a preprint, N is 14 with a single therapist and a single session, participants were required by design to have no clinical diagnosis and no current psychotherapy, and the descriptive statistics are reported without inferential tests or a comparator, so nothing here establishes an effect.'
