  grade_reasoning: 'A conference abstract reporting a five-system, three-scenario probe, so C under the design_fits_own_claims rule: the conclusions generalise about what AI chatbots can and cannot do from fifteen conversations with no stated rating procedure, no rater, no reliability figure, and no reported number of turns. It is peer-reviewed as a conference submission and its per-system results are reported concretely enough to be checkable, which keeps it at C rather than D.'
  design_caveat: Each cell of Table 1 is a single conversation, so nothing about within-system variability is estimable and any cell could flip on a rerun. Who judged whether a chatbot 'understood' that suicide was planned is not stated, nor is how many turns each probe ran, nor the language of the prompts, though two of the five systems (Yandex GPT Pro5, GigaChat) are Russian and the authors are at a Moscow institute, so the probes were plausibly in Russian and the finding may not transfer to the same models prompted in English. The eating-disorder prompt states a specific weight without a height, so 'normal weight' is an inference the authors make and not a fact in the prompt.
