  grade_reasoning: 'B. Peer-reviewed in AI & SOCIETY, three authors across two Spanish universities and a biomedical research institute, and the design fits the claims it makes: reflexive thematic analysis of naturally occurring accounts, reported as themes with prominence descriptors anchored to comment counts rather than as statistics, and framed throughout as how people make sense of their use rather than as an evaluation of the tool. Not A: no preregistration, no replication, and the corpus is self-selected public Reddit commentary from people motivated to post about it, so the themes describe what gets said publicly about this use rather than what the use is like in general.'
  design_caveat: 'The sampling frame is the paper''s main constraint and it is a real one: Reddit comments on threads surfaced by five ChatGPT-plus-therapy Boolean searches, restricted to 2025, third nesting level. People who use a chatbot for support and do not discuss it on Reddit are absent by construction, as are people whose experience was unremarkable enough not to comment on. The paper''s data are also English-language public Reddit with no country or language stratification reported, so the Spanish affiliation of the authors does not make this a non-Anglophone user sample.'
