  grade_reasoning: 'A review with no stated search strategy, screening procedure, or inclusion criteria, which is the defect that belongs to this genre and sets design_fits_own_claims to false. That routes to C rather than D, since the conflicts declaration is present and the absent participant N is not a defect in a review. The article describes itself as a systematic review of safety issues but is a narrative synthesis: it organises a large literature into a taxonomy without documenting how that literature was assembled, so a reader cannot tell what was left out. Twelve authors across nine institutions, including Harvard Medical School, Massachusetts General Hospital, Yale, Brigham and Women''s, and Stanford, with clinicians credited for ''Medical inputs'' and 111 references, which makes it credible_secondary on the definitions it restates rather than single_author_position.'
  design_caveat: Broad medical AI, not mental health. The taxonomies of communication limitations and alignment issues are the authors' own organising categories, presented in tables without a stated derivation. Most claims are attributions to cited work rather than the authors' own analysis, and where a specific claim carries a figure it is drawn from a single cited source, so the primary should be reached for rather than this restatement. The authors disclose using ChatGPT-4o to polish language while stating that all scientific content is their own.
