  grade_reasoning: 'A preprint with no venue stamp, which caps at C under the preprint rule. The design fits its claims and several methodological choices are careful: the train-test split is made at the context level with embedding-based farthest-point sampling to prevent semantic leakage rather than random splitting, ICC is reported with bootstrap confidence intervals and CI width as a precision measure, evaluator self-preference bias is explicitly removed, and both consistency ICC(C,1) and absolute-agreement ICC(A,1) are reported. Ethics board approval is stated and the authors caution against deployment without human oversight.'
  design_caveat: Two features bound the headline ICC figures heavily. First, the ICC analysis in Table 1 is computed over N = 9 models per judge, so each correlation rests on nine points, which is why the confidence intervals are wide (Safety's ICC(C,1) of 0.879 has a CI of [0.561, 0.958], width 0.901). Second, the before-after therapeutic-quality evaluation was conducted by one clinician rating both versions; the 96 percent agreement figure comes from a separate three-clinician reliability exercise on the refined responses, not from triple-rating the before-after comparison. The refined responses were also evaluated by the same seven-dimension rubric the refinement pipeline was optimising against, which is a circularity the clinician ratings only partly break.
