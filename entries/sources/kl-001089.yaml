  grade_reasoning: 'A perspective paper, so genre is position and grade is n/a; absent methods, data and N are not defects in this genre. Authority is credible_secondary rather than single_author_position: two authors, one at the London School of Hygiene and Tropical Medicine''s Department of Health Services Research and Policy, with a substantial reference base spanning WHO, UNHCR, IASC and Sphere guidance plus recent primary literature, published in a Cambridge journal after peer review. It restates definitions and findings owned elsewhere rather than establishing them, and it makes no claim of exhaustive coverage. Not recognized_reference because it proposes rather than adopts: no body has taken up the Humanitarian AI Paradox framing or the research agenda.'
  design_caveat: 'Everything empirical here is restated from a cited primary. Two figures the paper reports as its own carry no method: the token-tariff percentages for Dutch, Polish and Portuguese are attributed to ''a quick analysis'' in van der Boor 2025 with no procedure given, and the 87 percent of the benchmark Healthbench said to be in English is asserted without a citation to the count. The 26 percent automation-bias figure is a restatement of Goddard et al. 2012, from clinical decision support well before generative AI. Numbered references 28 and 29 appear in the risks section where author-year citations are used everywhere else, which is an accepted-manuscript artifact.'
