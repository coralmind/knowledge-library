label: Abramowitz et al. 2003 — Symptom presentation and outcome of cognitive-behavioral therapy for obsessive-compulsive disorder (JCCP)
type: source
layer: provenance
definition: 'The second of two references cited for the reassurance cycle, alongside Salkovskis 1999. Two studies on 132 OCD outpatients: a cluster analysis yielding five symptom clusters (harming, contamination, hoarding, unacceptable thoughts, symmetry), and an uncontrolled pre/post ERP outcome comparison finding poorer outcomes for hoarding. What it carries for the reassurance cycle is narrow and real: the paper''s own cluster data places ''asking for reassurance'' among the unacceptable-thoughts cluster''s compulsions (p. 1051), which is existence of the behavior class, not the cycle. Its anxiety-reduction account of rituals (pp. 1050, 1055) is received background citing de Silva et al. 2003 and Lindsay et al. 1997, so the mechanism itself rests on Salkovskis 1999 alone.'
