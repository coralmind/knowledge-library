  grade_reasoning: Graded on the RO-MAN 2026 version. Peer-reviewed, IRB-approved, and randomized across two robot self-disclosure conditions, with outcome scales reported at Cronbach's alpha 0.76 to 0.90 and turn-level disclosure analysed with a cumulative link mixed model. It stays C on sample and analysis. N is 50, 25 per condition, mean age 23.7, with the recruitment source not stated, so the sample is small and of convenience. The survey outcomes are modelled with covariates chosen by AIC stepwise selection across several scales with no correction for multiple comparisons, and the central result, more disclosure in the low-disclosure condition, runs opposite to the authors' expectation in a single unreplicated session. The design licenses that the effect can occur in this setting, not its direction in general.
