  grade_reasoning: Accepted to a Springer LNNS conference volume, but the headline accuracy figure rests on 22 test sessions and two techniques, with a 95% confidence interval running from 75.1% to 99.9%, and the ground-truth labels were produced by rule-based pattern matching over transcripts with supplementary training examples generated by another language model rather than by any clinician. The framing claims automated clinical supervision and risk triage; the design supports neither, so design_fits_own_claims is false and the derivation gives C. The paper's own Section 6.3 concedes most of this.
