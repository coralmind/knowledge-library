  grade_reasoning: 'An arXiv preprint with no venue stamp, which caps at C under the preprint rule. The design fits its own claims and several choices are careful: the train-test split is made at the post level to prevent memorisation, the label is a three-stage consensus rather than a single proxy, the LLM-annotator used for support-type categorisation is explicitly disclaimed as not evaluated as a classifier, human annotation is reported with Fleiss''s Kappa and with the agreement broken out by label class rather than aggregated, and the Limitations section names five distinct threats including the label imbalance and the Reddit-voting proxy. The paper does not overclaim: it describes its own framework as strict and states that it underestimates supportiveness to reduce false positives.'
