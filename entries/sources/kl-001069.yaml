  grade_reasoning: |
    Peer-reviewed at AAAI, which would ordinarily reach B, but graded C because the design does not fit its own claims. The headline claim is that the dataset "successfully simulates human-like diagnostic process", evidenced by a blind human evaluation on 1-to-10 scales by five annotators; no inter-rater agreement figure is reported for any of the seven metrics, and the evaluation compares 100 samples per dataset while the released corpus is 5000 conversations generated by a different model (Qwen2-72B) from the 100 evaluated ones (gpt-4o). `conflicts: industry_authored` records that the first, fourth, fifth and eighth authors are affiliated with Theta Health Inc. and the work was resourced by Shanda Group, which is a fact a reader should see rather than a defect.
