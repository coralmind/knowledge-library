  grade_reasoning: 'Graded on the ICTAI 2025 version. Peer-reviewed, and the design fits its claims, which the authors limit to professional acceptance and adoption rather than counselling effectiveness. The behavioural logging is careful: 1,128 panel openings and 741 transitions from 31 of 34 counsellors, with a Benjamini-Hochberg-corrected test of transition independence. It stays C on sample and design. The counsellees are 13 trained students enacting vignettes, each corresponding with two or three counsellors at once; the 58 feedback segments are unprompted notes from a panel that also served as the feedback channel, a self-selected convenience sample with no coding scheme or reliability figure reported; the field period is four weeks; and the authors note that errors in the AI output may have shaped the adoption patterns measured. No outcome for any counsellee is measured.'
  design_caveat: The counsellees are 13 trained students enacting vignettes, not people in distress, and each student corresponded with two or three counsellors at once; the authors name this as a limitation that may have altered communication dynamics. The 58 feedback segments are unprompted notes left in a notepad panel that also served as the study's feedback channel, so they are a self-selected convenience sample of opinion rather than a systematic elicitation, and no coding scheme, coder count or reliability figure is reported for the positive/negative classification in Table I. Three of 34 counsellors declined tracking, so the behavioural and qualitative samples do not align. Usage of one functionality (Generated Subject Line) could not be traced at all and received no feedback. Four weeks on an unfamiliar platform is short for adoption. Most consequentially for reading the usage figures, the authors themselves note that errors in the AI output may have distorted the adoption patterns they measured, so engagement is confounded with error-checking — which their own Social Network Graph result demonstrates.
  unit_of_analysis: between_person
