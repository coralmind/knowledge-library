  grade_reasoning: 'Graded on the ACL 2026 long-paper version. Peer-reviewed and approved by the ethics boards of every participating centre, and the design fits its claims, which are confined to classification accuracy and reasoning structure: 712 de-identified psychiatric records from clinical centres, ICD-11 labels assigned independently by two senior psychiatrists from a team of 12 at Cohen''s kappa above 0.8 with disagreements resolved by consensus, processing kept on premises, and an error taxonomy from 12 psychiatrists'' review of a random 30 cases. The limitations are ordinary and narrow what it licenses: comorbid cases are excluded and the task supplies candidate categories and disorders in the input, so accuracy is an upper bound relative to open diagnosis from unaided text. B.'
  design_caveat: Two constraints narrow what this licenses. Comorbid cases were deliberately excluded to keep labels single-valued, so the benchmark measures diagnosis under an artificially clean presentation, and the task supplies the candidate ICD-11 category and disorder lists in the input, so it is constrained classification rather than open diagnosis. Accuracy figures are therefore an upper bound relative to unaided free-text diagnosis. The authors' own limitations note that real diagnosis is multimodal and that text-only input misses demeanour, prosody, and non-verbal cues.
