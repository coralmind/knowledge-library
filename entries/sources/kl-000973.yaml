  grade_reasoning: 'A position paper arguing a design principle without primary data and without a systematic review protocol, so it is graded n/a on authority rather than on the empirical fields; its null n_reported is a property of the genre and not a defect. authority is credible_secondary: eight authors across three institutions (Penn, Stanford, Illinois) with a reference base of roughly seventy works spanning NLP, clinical psychology, HCI and health law, published in the field''s own clinical-psychology-and-NLP venue after peer review. Not recognized_reference because the framework is newly proposed here and no body has adopted it, and because the cross-cultural constructs it relies on — idioms of distress, the DSM-5 Cultural Formulation — are owned by the sources it cites.'
  design_caveat: Every empirical claim in this paper is carried by a citation to another work, not by evidence collected here. The authors state that they do not quantify the impact of any recommendation on model performance, safety or equity, so the priority levels in Table 1 (Must Do / Good to Have / Best Practice) are the authors' considered judgement rather than a graded finding. Several recommendations cite the authors' own prior work (Rai et al. 2024, 2025a, 2025b; Cho et al. 2023; Havaldar et al. 2023), which is normal for a framework paper but means the evidence base is not independent of the framework's proponents. The treatment of law and regulation is explicitly non-jurisdictional and the authors disclaim it as legal guidance.
