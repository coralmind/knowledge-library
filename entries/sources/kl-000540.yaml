definition: 'A survey of 1,006 student Replika users on loneliness and suicide mitigation, published in npj Mental Health Research. It contains no sycophancy analysis and no delusion content. Message-level sycophancy coding over real delusional chatbot conversations is reported in a different paper, Moore et al. 2026, which finds markers of sycophancy in more than 80% of assistant messages in delusional conversations. No entry in this catalog cites this source as support.'
