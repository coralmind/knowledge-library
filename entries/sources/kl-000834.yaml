  grade_reasoning: An instrument paper introducing a scale and its dimension structure, so grade n/a under the genre routing rule. Two authors at Stanford Psychiatry and Cedars-Sinai, published in World Psychiatry, the journal of the World Psychiatric Association, with a nine-item reference base and a derivation traced explicitly to PsyberGuide. It is cited as the reference for FAITA-MH by at least three other works in this catalog. recognized_reference for the framework it defines, and for nothing beyond that.
  design_caveat: 'The absence of methods, data, and an N is not a defect in this genre, and this letter says so itself: ''Formal research is required to empirically test its strengths, weaknesses, and most pertinent components.'' Two real bounds follow. No psychometrics of any kind are reported, so this is an instrument introduction rather than an instrument validation, and no interrater reliability figure exists for the 0-to-24 scoring. And the full structured form lives in supplementary information at an external URL, not in the letter, so the actual scoring anchors for each subdimension are not in the letter: what the letter presents is the dimension and subdimension structure and the point ceilings.'
