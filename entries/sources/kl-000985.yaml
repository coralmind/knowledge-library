  grade_reasoning: 'Graded on the Findings of ACL 2026 version. Peer-reviewed, reviewed by the authors'' IRB and judged exempt, and the design fits its claims, which the authors confine to redirection behavior on this corpus: 1,103 r/AskDocs question-answer pairs in which a physician redirected a false premise, an annotation pipeline checked by a physician author, an LLM judge checked against two physician authors at 93 percent concordance on both metrics, a second judge model run to test for judge bias, and a control test on 50 questions for over-redirection. The limitations are ordinary and stated by the authors: model rates are reported over a 100-question test set rather than all 1,103 pairs, the posts may sit in the evaluated models'' training data, the reference answers are single top-voted forum responses, and the physician validators are co-authors reporting percent concordance without a chance-corrected statistic. B.'
  design_caveat: 'The authors name the binding threat themselves: the source posts are public Reddit and may already sit in the evaluated models'' training data, so performance may reflect memorisation. The clinician reference answers are single top-voted r/AskDocs responses rather than adjudicated gold standards, and the authors'' Ethical Considerations section acknowledges that physicians are fallible and the original responses may have been imperfect. The r/AskDocs posting style differs from chatbot interaction, which the authors flag. The benchmark reports rates over 100 test questions only, not the full 1,103.'
