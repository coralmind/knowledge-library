  grade_reasoning: 'A peer-reviewed journal review carrying the review-genre apparatus in full: stated per-database search strings, dual independent screening with third-reviewer adjudication, a PRISMA flow diagram, and 11 included frameworks yielding 356 extracted questions refined to 271. `design_fits_own_claims` is false on a defect the authors state themselves: ''We did not perform a formal quality assessment of each included framework beyond ensuring they met the inclusion and exclusion criteria'', so the synthesis weights an ethics commentary and an empirically grounded taxonomy equally. The construct distribution the paper reports as a finding is therefore a count of what the included frameworks happened to emphasise, not a weighted synthesis. Under the derivation that gives C.'
  design_caveat: |
    Numbers differ between the abstract and the results: the abstract reports 356 extracted questions refined to 271, while the Results state 'Initially, 275 questions were extracted from these frameworks'. The Discussion again says 356. The framework itself was never applied to a chatbot; the authors are explicit that it is a scaffold rather than an evaluation and that it assigns no scores. Two constructs (accessibility assurance, accountability assurance) are stated to be placeholders with no questions behind them. ChatGPT-4o was used to rephrase framework questions into binary form, disclosed in the Acknowledgments. The stakeholder input step, described as involving clinicians, patients, developers, epidemiologists and policymakers, has no stated sampling, count, or procedure.
  author_disclosure: |
    Jina Suh, an author of this paper, is affiliated with this project. Per the rubric's authorship rule this is disclosed and changes no grade: external peer-reviewed scholarship is external scholarship whoever wrote it, and no entry in this Library derives from this document. Separately, several authors declare substantial industry ties: JT reports grants from Otsuka and advises Precision Mental Wellness; DB reports equity in ValeraHealth, Clew, MDClone, AESOP, Feelbetter and Guided Clinical Solutions and grants from IBM Watson Health; BWN reports employment and equity in Verily Life Sciences; JS is employed by Microsoft Research. All declared.
