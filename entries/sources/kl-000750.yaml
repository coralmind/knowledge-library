  grade_reasoning: 'arXiv-only with no venue stamp, which caps at C under the preprint rule. The design otherwise fits its claims closely and the methodological discipline exceeds most journal-published benchmarks in this corpus: hypotheses and decision criteria frozen before data collection with the design document released, Holm correction across a declared family of six confirmatory contrasts, split-half verification, a pre-registered pilot with pass criteria, three logged protocol amendments, a declared negative result reported as unsupported, exclusion classes reported as a partition summing to 100 percent rather than silently dropped, a contamination sensitivity analysis re-running every headline result, and verbatim session logs with serving metadata released.'
  design_caveat: Single author, independent researcher, no institutional affiliation. Only 82.9 percent of census sessions yield a valid in-scenario outcome against a 90 percent pilot gate; 7 models retain fewer than ten valid baseline sessions and 3 Anthropic models retain none, so those rows carry no interpretable point estimate. Scenario-recognition vocabulary appears in 7.5 percent of sessions and reaches 99.2 percent for one model, which the author addresses with a full sensitivity re-analysis. Human anchor percentages come from a different era, culture and consent regime, and the author states only directional comparison is supported. English-only, one aggregator, and provider-side system prompts and safety layers are part of the measured endpoint rather than controlled out.
