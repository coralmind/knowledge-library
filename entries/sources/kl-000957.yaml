  grade_reasoning: 'An arXiv preprint with no venue stamp, which caps at C. The design does fit the claims made: the conclusions are about zero-shot classification agreement with human C-SSRS labels, ordinal error structure, and confusion patterns, all of which the reported metrics reach, and the authors explicitly refuse the stronger conclusion by insisting the models are assistive rather than autonomous. The human ground truth is unusually good for this class of paper — trained psychologists and two trained C-SSRS assessors, majority-voted, with a reported kappa — which is why it sits at C on venue rather than lower.'
  design_caveat: 'The manuscript carries visible copy-editing failures that a reader should see before relying on it. Section IV.C introduces the metrics with ''Following best practices in MT research... to capture different facets of translation quality'' and defines precision and recall ''per language''; the Figure 6 caption reads ''Confusion matrices for language identification across seven machine translation models''; and reference [21] for the C-SSRS evaluation protocol is Koehn''s Statistical Machine Translation textbook. These are template residue from an unrelated paper, not errors in the analysis, but they mean the methods prose was not proofread. The model count is inconsistent: the abstract says six models including Claude, GPT, Mistral and LLaMA, Section IV says five LLMs plus an SVM baseline, and Table I has six columns of which one is the SVM. Model identification is loose — ''Claude 3 Sonnet'' is described in the body but reference [23] is the Claude 3.5 Sonnet model card, and ''LLaMA'' is never versioned beyond a reference covering LLaMA 1. Each post was run once per model with no repetition and no variance reported. The dataset is severity-imbalanced by the authors'' own account, and the accuracy figures are not adjusted for it. Two of the three authors are also the authors of reference [18], the companion paper to which the few-shot and fine-tuning comparisons are deferred.'
