  grade_reasoning: 'An instrument and dataset paper, graded n/a on authority rather than on the empirical fields. Its authority is recognized_reference for the MI utterance-level constructs it operationalises: the scheme is built on MISC and MITI, the ten annotators were recruited through the Motivational Interviewing Network of Trainers and all had prior experience practising and coding MI, and the agreement figures are reported per attribute rather than pooled. Seven authors across three institutions, so single_author_position is ruled out. Two authors are at Philips Research and the work is EC-funded under the PhilHumans project, which is declared on the paper.'
