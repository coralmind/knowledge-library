  grade_reasoning: 'A peer-reviewed randomized double-blind crossover OSCE study in Nature comparing an LLM system to 20 primary care physicians across 159 validated scenarios, with blinded patient-actor and blinded three-specialist ratings and FDR-corrected statistics; design appropriate to its claims and its own limitations stated plainly. Every author is employed by the funder, which is recorded as industry_authored, and no preregistration or replication is stated, so B rather than A. For this Library the binding limit is scope rather than quality: psychiatry and paediatrics were excluded from the study by design, so nothing here is evidence about mental-health dialogue.'
