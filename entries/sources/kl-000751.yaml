  grade_reasoning: 'A JMIR Viewpoint: four authors across three institutions, 65 references, peer-reviewed (reviewer names and dates printed at the foot), arguing a position on evaluation and governance without primary data and without a systematic synthesis of its own. Graded n/a on the position branch. credible_secondary rather than recognized_reference because it restates frameworks owned elsewhere (PROGRESS-Plus, SEIPS, WHO ICPS, CFIR, NASSS, RE-AIM, HOT-fit) and the equity-metric worked example in Textbox 2 uses figures the authors label illustrative. Not single_author_position: four authors, three institutions, substantial reference base.'
  design_caveat: |
    Table 1 and its 22-study distribution are drawn from Abualruz et al's review, so the paper's central empirical claim (zero primary-care studies using real patient data) is secondhand. The Textbox 2 subgroup true-positive rates are explicitly stated by the authors to be illustrative rather than observed. ChatGPT 5.2 was used for language editing, disclosed in the Acknowledgments.
