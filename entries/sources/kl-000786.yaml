  grade_reasoning: 'Genre is benchmark; peer_reviewed is preprint, which routes to C. Design fits its own claims because the author explicitly bounds them to instrument behavior (''this is a benchmark paper: the contribution is the instrument and the study of its measurement properties, not a ranking of systems'') and never asserts validity. Conflict is declared_managed: the author is affiliated with MindSurf, six metrics are consolidated from a MindSurf instrument, and one of the two undisclosed clinician-rated systems is the MindSurf origin system, all disclosed with the mitigation that no MindSurf system is among the S2 targets.'
