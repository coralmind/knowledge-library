  grade_reasoning: 'Graded as a review on review method, which it carries adequately: named databases, stated search terms, stated inclusion practice, reference-list checking, and an explicit, reasoned decision to conduct a narrative rather than systematic review because the goal was to identify representative frameworks rather than exhaustively catalogue them. Published in an APA journal, so peer_reviewed is journal and design_fits_own_claims is true, yielding B. It does not claim exhaustive coverage, so the absence of a PRISMA flow and screening counts is a scope decision the authors state rather than an unacknowledged defect. On authority the framework component is recognized_reference: four authors across the Stanford HAI institute, Stanford Psychology, Stanford Psychiatry and the VA National Center for PTSD, NIMH-funded, with a substantial reference base.'
  design_caveat: No screening counts, no inclusion or exclusion criteria stated as such, and no assessment of the quality of the frameworks synthesised, which is the ordinary cost of a narrative review and is acknowledged. Three of the four authors declare financial interests in AI-mental health companies (consulting fees and equity in Jimini Health and Sonar Inc., equity through a scientific advisory role at Hello Therapeutics), disclosed on the face of the paper, in a document proposing the standard by which such products would be evaluated. No entity is identified to apply the framework, no scoring or threshold is defined, and no instrument exists to measure any criterion; the authors state all three as open.
