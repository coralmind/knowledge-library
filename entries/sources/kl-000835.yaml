  grade_reasoning: |
    Graded D on `conflicts: undeclared_apparent`, which the derivation rule reaches before any other test. The document carries two contradictory conflict statements: a heading reading "There is Competing Interest." on page 2, and "The authors declare no competing interests." in the declarations. Six of the listed affiliations are Digital Health China Technologies Ltd / DHC Technologies, a commercial medical-AI vendor in the market being evaluated, and the first author (M.G./Gong M C) is first author of the Expert Consensus that supplies the "red line" criteria the models were scored against and also served in the scoring role. The benchmark is otherwise carefully executed and its design fits its own claims, which is why that field is true; the grade reflects the conflict, not the method.
