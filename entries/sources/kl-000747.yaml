  grade_reasoning: 'A medRxiv preprint carrying the explicit banner that it ''has not been certified by peer review and should not be used to guide clinical practice'', so it falls to C under the preprint rule. The design fits its claims: the framework was built with psychiatrists and clinical psychologists at AIIMS New Delhi, the gold notes were written by two clinical psychologists and a psychiatrist under faculty supervision, and the expert raters were blinded to which output was the model''s and which the human''s. Every conclusion is stated as documentation-task performance, and the authors state that LLMs should be assistive rather than replace clinical judgment.'
  design_caveat: The source conversations are pre-recorded counselling videos from YouTube (via the HOPE dataset), so they are demonstration or published sessions rather than routine clinical care, and the paper states the work was exempt from ethical review as no human subjects were involved. Open-source models were capped at 100 new tokens, which disadvantages them on the aspects requiring long narrative output. The human evaluation covers only the top three models on a single gold summary per case.
