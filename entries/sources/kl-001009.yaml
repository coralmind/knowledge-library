  grade_reasoning: A conference abstract of roughly 250 words, carrying results but no accessible methods detail, so C under the design_fits_own_claims rule. It is peer-reviewed as a conference submission and its conclusions about model suitability for clinical deployment reach considerably further than a rubric score on 147 extracted dialogues can support, with no rater information, no reliability figure, and no per-axis scores reported.
  design_caveat: The document is an abstract in an e-Poster Viewing supplement, not a paper. Almost nothing needed to assess the result is present. Who or what applied the rubric is not stated, so every reported score has unstated provenance; HealthBench is scored by a model grader in its published form, which would make these judge_only figures, but the abstract does not say. The 147 dialogues were extracted from a general-medical benchmark by keyword taxonomy, so the psychiatric subset is defined by lexical match rather than clinical construction, and no per-axis or per-theme score is given. The five behavioral axes and seven themes are named as counts and never listed. Two abstracts by the identical author list appear consecutively in this supplement (EPV1055 and EPV1056, the second on elite cycling), which is a fact about the venue rather than a defect.
