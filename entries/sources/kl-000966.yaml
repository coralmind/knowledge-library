  grade_reasoning: 'Published at AAAI, a competitive peer-reviewed venue, which would ordinarily give B. `design_fits_own_claims` is false because the goal-oriented metrics that carry the paper''s central claims (SSSC, EPSC, EESC) are computed by the same classifier family that the system was trained to maximise as its reward function: the psychotherapeutic, politeness and empathy rewards are defined as the output of strategy classifiers, and the evaluation metrics score strategy consistency. A system optimised against a classifier and then scored by that construct is not independently evaluated on it. The human evaluation is reported without any inter-rater agreement figure, without a stated number of raters, and with the entire evaluation procedure deferred to an appendix not present in this document. Under the derivation that gives C.'
  design_caveat: |
    PSYCON, one of the two evaluation datasets, is itself synthetic: 1K therapist-client interactions generated by few-shot prompting GPT-J with manual quality control. So a language model generates the conversations, a second (GPT-4o-mini) labels them, and a third is trained to produce therapist turns scored against those labels. HOPE is drawn from publicly available counselling videos, so demonstration rather than routine care. No client interacted with MATE at any point and no outcome was measured. The paper's own worked example of a client saying "My family thinks I have a drinking problem" is a baseline comparison, not a deployment.
  author_disclosure: |
    Self-citation of the method (Priya et al. 2025, GENTEEL-NEGOTIATOR, the MoE-RL framework this adapts), of a baseline (Mishra et al. 2023, e-Therapist, on which MATE reports gains), and of the PSYCON dataset. The second author appears on all three.
