  grade_reasoning: 'arXiv-only with no venue stamp, which caps at C under the preprint rule. The design otherwise fits its claims closely and the methodological self-awareness is unusually high: the scope is deliberately narrowed to suicidal ideation and the paper refuses the label of a general mental health benchmark, the construct-validity, arbitrary-selection, intra-model-variation, failure-mode and economic-incentive critiques of benchmarking are each addressed by name in Section 6, human-judge and LLM-judge reliability figures are reported, and eight limitations are stated including the ones that undercut the work. Recorded as industry_authored because eight of nine authors are at Spring Health, a mental health company, publishing an evaluation of chatbot mental-health safety; the evaluation is open-source and was not released alongside a Spring Health product, which the authors note in Section 6.5.'
  design_caveat: Every reliability figure is referenced to a companion paper [9] rather than reported here, so the 0.77 human-human and human-LLM and 0.78 LLM-LLM agreement values cannot be checked in this document, and the human-LLM figure is stated as 'at least 0.77' without a point estimate or interval. Both ancillary models, the user simulator and the judge, are proprietary closed models whose behavior can change without notice. Personas are fixed across runs, which the authors identify as an overfitting surface. Realism of the simulated conversations is unvalidated and the authors state that no gold standard for it exists. English only, US-centred personas, and the whole evaluation covers one clinical issue by design.
