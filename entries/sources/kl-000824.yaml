  grade_reasoning: An arXiv preprint, which falls to C under the preprint rule.
  design_caveat: The screening pass ran inside an agentic harness adding a proprietary system-prompt layer, which the authors disclose and treat as a pre-filter only, with all inclusion decisions made by clinician review. The three clinician reviewers are members of the study team. Round-2 relevance agreement fell to AC1 0.49 driven by one reviewer's leniency. Reviewers were English-speaking and rated 123 non-English conversations from machine translations. Candidates were sampled once at deployed defaults, so compute is unmatched across models. HealthBench conversations are synthetic scenarios authored under OpenAI's process, not real help-seeking. The authors state the judge-reliability evidence comes from three judges in one specialty and should be treated as suggestive.
