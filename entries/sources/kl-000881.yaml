  grade_reasoning: 'A position piece proposing design principles for AI crisis support, with no primary data, so grade n/a under the genre routing rule. Fourteen authors across twelve institutions spanning academic psychology, computer science, industry research, a suicide-prevention training company, and a mental-health advocacy organisation, with a 15-item reference base: this is decisively not single_author_position. credible_secondary rather than recognized_reference, because the community-helper model it builds on is owned by the gatekeeper-training literature (Snyder 1971, Isaac et al. 2009) and no body has adopted these principles.'
  design_caveat: 'The absence of methods, data, and an N is not a defect in this genre. What bounds its use is that both of its empirical anchors are cited rather than collected: the 13-to-17 million usage estimate comes from Stade et al. 2025, the 22.2% adolescent figure from McBain et al. 2025, and the two user-preference surveys from Ajmani et al. 2025 and Siddals et al. 2024. The claim at the centre of the argument, that avoidant responses reduce help-seeking, is asserted rather than measured, and the authors state their scope excludes younger children.'
  author_disclosure: Seven of the fourteen authors are or were employed by Microsoft during manuscript preparation and are connected to organisations developing open-ended GenAI chatbots; two are employed by LivingWorks, a suicide-prevention training company whose community-helper model the paper advances; one declares advisory-board service for Koko and Walden Wise and cofounding Navi. The work was supported by Microsoft Research. All of this is declared in the Acknowledgments. Jina Suh, who leads the project this catalog belongs to, is the corresponding author.
