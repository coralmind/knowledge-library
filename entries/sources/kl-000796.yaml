  grade_reasoning: 'An instrument development and validation paper reporting psychometrics rather than a finding about the world, so grade n/a under the genre routing rule. Two authors at Tsinghua Industrial Engineering, peer-reviewed in Ergonomics, with the scale grounded in Bowlby and Ainsworth''s four attachment functions and benchmarked against six existing measures. credible_secondary rather than recognized_reference: attachment theory is owned elsewhere, the AIAS is new and unreplicated, and no other body has adopted it.'
  design_caveat: Two constraints bound every use of this scale, and both are named by the authors. First, no cut-points, no norms, and no clinical anchoring exist for any subscale, so a score cannot be converted into a threshold without a clinical judgement the paper explicitly declines to make. Second, both samples were recruited on a Chinese survey platform by convenience sampling and were predominantly young, educated Chinese participants; the authors name cultural bias as their primary limitation and call for cross-cultural measurement invariance testing. Study 1 was also heavily weighted toward frequent users, with 48.40% using chatbots more than ten times a week. The three-factor structure is well evidenced; the relative weight of the dimensions and the strength of the framework paths are not established outside this population.
