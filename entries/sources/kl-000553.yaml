  grade_reasoning: 'An unusually well-instrumented qualitative study: 24 people who already used generative AI for emotional support at least weekly, contributing 92 in-the-moment diary entries, 75 uploaded chat transcripts of the actual conversations, and 24 in-depth interviews, with ethics approval, automated plus manual anonymisation, participant review of their own anonymised data, a reflexive journal, team-iterated themes, and data, code and codebooks shared as supplementary material. The claims are calibrated: Section 3.4 states plainly that results cannot generalise beyond the recruited population, do not apply to any specific platform or to purpose-built therapeutic products, and are descriptive rather than normative. C rather than B because it is a preprint with no venue, N is 24 by convenience sampling skewed young and UK-urban, participants on mental health medication were excluded by design, and every count reported is a theme prevalence rather than a measured effect.'
