  grade_reasoning: 'An arXiv preprint with no venue stamp falls to C under the preprint rule. The design fits its own claims: every result is stated as a property of model performance on synthetic conversations, the Limitations section states plainly that both sides of every dialogue are LLM-generated and may not capture real patients, and the Ethical Considerations section notes the work was IRB-exempt as non-human-subjects research.'
  design_caveat: 'Both conversational parties are models. The patient is GPT-4o driving atomic facts extracted from US medical-board exam case studies, so the person side of every turn is a simulation of a board-exam vignette rather than a person seeking help. GPT-4o also runs most sensemaker modules and the LLM-as-a-judge scoring, so the generator and the grader overlap. Conversation length is partly an artifact of the framework: Algorithm 2 forces a stage advance after five turns in a stage.'
