  grade_reasoning: 'Published at ICLR 2025, so peer-reviewed at a conference, with a design that fits its own claims: it reports occurrence rates of six defined patterns in model output under adversarial prompting and frames them as such, states the annotator-bias problem, measures it, and reports the human-agreement statistics including the ones that undercut its own numbers. Under the derivation that is B.'
  design_caveat: 'Every headline occurrence rate in Figures 1 and 4 is an LLM-annotator number. Human agreement is reported only in aggregate and per category in Table 3, and two of the six categories fall below any conventional acceptability threshold: Sycophancy at Cohen''s Kappa 0.27 for the Gemini annotator, Brand Bias at 0.44 to 0.49 across all three. The paper carries these figures honestly but the category rates are presented without per-category confidence attached. Temperature 0 and one response per question mean no within-prompt variance is captured. Proprietary system prompts could not be tested, so the results describe base models rather than the deployed chatbot products a person actually talks to.'
