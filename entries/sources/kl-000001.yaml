  grade_reasoning: 'An instrument development and validation paper, graded n/a on authority rather than on the empirical fields, since psychometrics rather than a finding about the world is what it reports. recognized_reference rather than credible_secondary: five authors across four institutions in three countries, the instrument was constructed from a published consensus statement plus three independent empirical sources, the factor solution was validated by parallel analysis and a stability analysis, internal consistency is alpha .95 for the full instrument and .72 to .93 for the six factors, and the NEQ has since been translated into eleven languages and released for free use. It is the standard reference for the constructs it defines: the categories of harm that psychological treatment can cause.'
  design_caveat: 'The authors name six limitations. The binding one for prevalence reading is recall: most participants completed the instrument retrospectively or at post-treatment, so the endorsement percentages are recalled rather than concurrent and are subject to primacy-recency effects. The sample is Swedish, 76.6 percent women, 62 percent with at least a university degree, and the clinical half is one diagnosis (social anxiety disorder) delivered by smartphone self-help with suicidality an exclusion criterion. The media half is self-selected by responding to press coverage about treatment harm. The authors state that replication is needed to establish whether the six-factor solution is valid and stable across samples, and that EFA factor selection involves subjective choices.'
