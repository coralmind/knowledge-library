  grade_reasoning: 'arXiv preprint carrying an AAAI copyright line but no acceptance statement, routed to C. The design fits its claims: the taxonomy is derived from real user accounts before prompts are written rather than invented, the four categories map to three named psychological frameworks with the mapping stated per label, confidence intervals are bootstrapped, label independence is checked by mutual information, response length is controlled for as a confound, and the data, code and an interactive response browser are released. The authors state the automatic annotation''s dependence on the evaluator model''s biases in the text rather than in a limitations section.'
  design_caveat: Every reported result comes from a single Qwen-3 annotation pass with no human validation of the annotator anywhere in the paper, and only one response is generated per prompt per model, so no within-prompt variance is measurable. The benchmark prompts are themselves LLM-generated from code definitions, so models are being scored on synthetic prompts written by models. Single-turn only, which is a sharp limitation for constructs like relationship escalation and retention that the taxonomy defines as temporal. The Reddit sample is 53 posts from one subreddit, all self-selected accounts of companionship. Hugging Face authors evaluating two open models alongside two commercial APIs is recorded as industry_authored.
  canonical_record: 'Kaffee, Pistilli & Jernite 2025, ''INTIMA: A Benchmark for Human-AI Companionship Behavior'', arXiv:2508.09998 (CC BY 4.0). Distributed publicly on HuggingFace (AI-companionship/INTIMA); the released dataset holds 380 prompts under 32 codes against the paper''s stated 368 and 31.'
