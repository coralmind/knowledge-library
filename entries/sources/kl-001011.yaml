  grade_reasoning: 'A knowledge-graph-grounded benchmark: a DSM-5 knowledge graph built and iteratively validated by a board-certified psychiatrist and a licensed clinical psychologist, 24,750 synthetic cases generated by rule-consistent sampling from it, 220 cases expert-rated on three dimensions with reliability reported honestly (the kappa paradox is named and Gwet''s AC2 substituted with the reason stated), a self-recognition bias check in Appendix C.2, and 23 model configurations scored on exact match. The claims are about diagnostic classification and answer-cardinality calibration, which the design supports, and the Limitations and Ethical Considerations sections state plainly that the cases are narratives rather than dialogues, that internal reasoning was not examined, and that results do not guarantee real-world clinical performance. No venue stamp, which caps it at C under the preprint rule. The substantive limit for our purposes is that all 24,750 cases are LLM-generated from a rule engine, so a model failure could be a failure on synthetic text rather than on a person''s account.'
