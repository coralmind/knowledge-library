  grade_reasoning: A prospective, IRB-approved, two-phase red team of 476 transcripts with three trained raters, a published five-domain rubric, per-domain Krippendorff's alpha and ICC, and three failure thresholds reported as a sensitivity analysis; the design supports its descriptive claims about failure rates and the authors label the analysis descriptive and exploratory. The equity interest in the developer is disclosed with a stated management plan, so declared_managed rather than undeclared_apparent. It is a Research Square preprint with no venue stamp, which holds it at C.
  author_disclosure: Hartford HealthCare holds an equity interest in K Health Inc., the developer of the evaluated platform, and states it could benefit financially from the outcome; the paper reports an institutional conflict-of-interest management plan and sole editorial control by the investigators, and separately reports that platform engineers were blinded to the scenarios between phases.
