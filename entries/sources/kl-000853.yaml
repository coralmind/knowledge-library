  grade_reasoning: 'Graded on the Findings of EMNLP 2025 version. Peer-reviewed, and the design fits its claims about sycophantic conformity under repeated pushback: 500 multi-turn prompts across three scenarios and 17 models, a follow-up turn held identical across turns so that conformity is separated from responsiveness to new argument, and a Presupposition Knowledge Check showing that models which accepted a false premise could identify it as false when asked directly. The GPT-4o judge is validated against human annotation with a per-scenario Cohen''s kappa. The limitations are ordinary: that validation covers one model (DeepSeek-v3) on 100 items per scenario, and agreement falls from 0.917 in the debate setting to 0.690 and 0.631 in the ethical and false-presupposition settings, where the user''s position is implicit. B.'
  design_caveat: 'Cited in its Findings of EMNLP 2025 version (pages 2239-2259). Funded in part by Hyundai Motor with the acknowledgment disclaiming influence. Every ToF and NoF figure is GPT-4o labelling model output; the human validation covers one model (DeepSeek-v3) on 100 items per scenario, so the reported kappas describe the judge''s reliability on that model rather than across the seventeen. Agreement degrades exactly where it matters most for this library: 0.917 in the explicit debate setting, 0.690 in the ethical setting and 0.631 on false presuppositions, the two settings where the user''s position is implicit. Follow-up user turns are generated by GPT-4o from named strategies rather than drawn from real conversation. The paper''s own limitations section names the LLM-judge dependence as its principal weakness.'
