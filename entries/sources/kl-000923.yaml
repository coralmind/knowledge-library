  grade_reasoning: Graded on the AGENT 2026 (ICSE 2026) workshop version. Peer-reviewed, and design_fits_own_claims is kept true only because the authors scope their results to stability, bias and governance properties rather than predictive performance; a macro-F1 near 0.57 on a binary screening task would not support a performance claim. It stays C on design and reporting. The paper names no target model, version, temperature or seed, which leaves the reproducibility the framework is built to provide unverifiable from the text. It states that all analyses reuse the metrics, tables and figures of an earlier implementation without recomputation, so the reported numbers come from prior work not included here. It gives no sizes for the in-sample and out-of-sample splits beyond the out-of-sample set being about four times larger.
  design_caveat: The target model is never identified. Section 3.2 refers only to 'the target LLM' executing 'under controlled hyper-parameters', and no model name, version, temperature, or seed appears in the paper, which makes the reproducibility the framework is built to guarantee unverifiable from this document. Section 4 also states 'All analyses reuse the metrics, tables, and figures from the original CPEMH implementation (no recomputation)', so the numbers reported here were produced by prior work not included. The prompt-family abbreviations are also inconsistent between Section 4 (DI, RP, CoT, SC, CBP, ACP, SR) and Section 5.1 (DI, RP, CBP, SCP, CoT, ACP, SF).
