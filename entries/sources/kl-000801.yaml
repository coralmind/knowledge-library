  grade_reasoning: 'A workshop-track paper posted to arXiv, so preprint under the derivation rule, giving C. The design fits its own claims: the authors call it ''a formative qualitative study'' throughout and state findings as accounts and patterns rather than rates or effects, with dual independent coding and a reconciled codebook.'
  design_caveat: Six older adults and seven younger adults, only two of them matched dyads, all recruited in South Korea, so both the sample size and the cultural setting bound what transfers. No interrater agreement statistic is reported for the thematic coding; the reconciliation is described procedurally. Findings are participant self-report plus observed think-aloud, not measured behavior change.
