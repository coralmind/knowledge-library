  grade_reasoning: 'Peer-reviewed at CIKM, but design_fits_own_claims is false and that sets the C. The title claims Trustworthy AI Psychotherapy and the abstract claims explainable and trustworthy results, and the entire apparatus establishing those claims is one LLM scoring another LLM''s output with no human validation anywhere: no clinician rated a conversation, no agreement statistic exists, and the explainability finding rests on one hand-picked transcript per model. The ground truth is the profile the paper itself assigned to the client agent, so diagnostic accuracy measures whether one model can recover a label another model was told to enact.'
  design_caveat: 'The ground truth is circular by construction: a client agent is instructed to present a disorder and a diagnostician agent is scored on naming that disorder, so the measurement is label recovery between two prompted models rather than diagnostic accuracy. One-shot generation means there is no turn-by-turn adaptation, so the dialogue realism claim rests on text that was never actually interactive. The aggregate F1 figures of 63 to 77 percent conceal per-disorder F1 as low as 0.98 percent. Four models only, constrained by hardware availability, and no clinically fine-tuned model was tested.'
