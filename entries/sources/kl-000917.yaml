  grade_reasoning: An arXiv preprint with no venue stamp, which caps at C under the preprint rule. The design fits its claims and is unusually disciplined about what it does not establish. The authors state explicitly that controlled generation 'does not establish how benevolent bias occurs, how frequently it appears, or how it is experienced in naturally occurring interactions', they position the corpus for evaluation rather than training after auditing it and finding spurious correlations, and they check that the reported detection pattern is stable at evaluation sizes well below the one used. Label validity is checked against a human annotator at Cohen's kappa 0.945 and the generated dialogues are independently checked against nine linguistic markers of patronising communication from prior human-interaction research.
  design_caveat: 'The corpus is entirely LLM-generated with the class label fixed at generation time by instruction, so it measures what detectors do with a constructed stimulus, not what any deployed agent does with a real person. Human validation rests on a single annotator over 300 of 362,880 dialogues; Cohen''s kappa there is agreement between one annotator and the generation condition, not between two independent raters. Every finding is a detection rate, not a prevalence: nothing here says how often benevolent bias occurs in real deployments. The three generators are all open-weight models in the 7 to 12 billion parameter range, so the stimulus set does not represent frontier model behavior.'
