  grade_reasoning: Peer-reviewed in JMIR Mental Health with a declared absence of conflicts, but design_fits_own_claims is false and the rubric routes that to C. Eighty model evaluations from two vignettes are compared by one-way ANOVA against human norms collected in Australia around 1997 to 2001 from a completely separate study, treating 20 repeated samples of one model as a comparison group of 20 independent respondents. The authors also chose a post hoc test explicitly to minimise type II error, which raises the false-positive rate on a design already at risk of it, and they draw clinical-implication conclusions about patient treatment motivation from data in which no patient appears.
  design_caveat: 'The human comparison norms are not contemporaneous: they come from Caldwell and Jorm and Jorm et al, Australian surveys published in 2001 and 1997, so a 2023 model is being compared to clinician beliefs recorded more than two decades earlier. The two vignettes differ only by gender and the paper reports no gender contrast. Two of the norm group sizes are stated inconsistently between Methods (324 nurses, 567 psychiatrists) and the Introduction (342 nurses, 564 psychiatrists). Several Table 1 cells are missing their n and show only a percentage.'
