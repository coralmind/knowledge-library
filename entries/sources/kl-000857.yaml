  grade_reasoning: 'An arXiv preprint, so C under the preprint rule. The design fits its claims because the authors bound them tightly themselves: they call it ''a structured demonstration, not a comparative clinical performance study'', state that the 12 case-model cells are repeated evaluations rather than independent observations, decline to report inferential statistics, and say explicitly that the vignettes cannot estimate prevalence or rank vendors. Four cases, one run per cell, no human comparator, no blinded rating, and transcript review by the unblinded study team are all disclosed.'
  design_caveat: |
    Physician-authored vignettes on physical rather than mental-health symptoms. Transcript scoring was done by the study team, not blinded and not externally validated, so every marker count is human_rated by unblinded authors. The handoff marker records presence only and the authors say they did not rate the summaries for clinical usefulness. The patient simulator in the adaptive runs was itself an LLM. The OpenAI model is a moving alias with no fixed snapshot. The instruction was not ablated, so which of its four steps produced the effect is unknown.
