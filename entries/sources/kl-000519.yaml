  grade_reasoning: A narrative review with an integrative theoretical contribution, published in Human Factors, the field's flagship journal, by two authors across two institutions, synthesising three decades of empirical work on complacency and automation bias and reporting replications, non-replications and equivocal evidence (the first-failure effect, the weak trust-complacency link) rather than only supportive studies. It has no registered protocol, no stated search strategy and no screening or inclusion criteria, which under rule 4a is a real defect for the review genre and holds it at B rather than A. As a review it reports no primary data, no participants and no N of its own, and those absences are not counted against it; n_reported is null because the paper does not state a count of studies synthesised.
