label: Fox et al. 2015 — Meta-analysis of risk factors for nonsuicidal self-injury
type: source
layer: provenance
definition: 'Random-effects meta-analysis of PROSPECTIVE, longitudinal studies predicting future non-suicidal self-injury, defined by the authors as "any intentional act of self-harm enacted without the desire to die" (§2.1; §1 gives "direct and deliberate self-harm enacted without the desire to die"). Its headline result is a NEGATIVE one and is the reason this source matters here: overall prediction of future NSSI is statistically significant but WEAK (weighted mean OR 1.59, 95% CI 1.50-1.69), dropping to 1.16 (1.10-1.24) after Duval and Tweedie trim-and-fill correction for the significant publication bias the authors detected (Egger intercept 1.66, p<.0001; 62 prediction cases estimated missing). Only three categories exceeded OR 3.0: prior history of NSSI (5.95, 95% CI 3.57-9.93, 11 samples), cluster B personality (5.93, 2.37-14.83, 3 samples, which the authors themselves flag as unstable — two of three studies non-significant, very wide interval), and hopelessness (3.08, 1.88-5.06, 3 samples). Every other category sits near or below 2.0, including affect dysregulation (1.05, 1.01-1.08, 6 samples) and family functioning and structure (1.14, 1.06-1.22, 2 samples). The authors'' own conclusion is that "few strong NSSI risk factors have been identified" and that present magnitudes "may be too small to be informative" over the short horizons clinicians are actually asked about. Separately, and independent of the risk-factor analysis, the paper''s introduction records as established that the majority of people who engage in NSSI REPORT that doing so helps them feel better, a finding it states has been demonstrated across self-report, experimental and psychophysiological measures (§1, citing Nock & Prinstein 2004, Brown et al. 2002, Franklin et al. 2010/2013a, Weinberg & Klonsky 2012, Bresin & Gordon 2013, Russ et al. 1992) — that sentence, not the risk-factor tables, is what supports the existence of function-reporting as a real clinical phenomenon. Table 2 additionally reproduces the verbatim NSSI elicitation wording of 15 instruments, several of which ask the person WHY they did it (the K-SADS/SADS-L item quoted at Table 2 row 14 asks children "Why do you do these things?" and contrasts wanting to die against "it makes them feel a little better afterward"), which is external evidence that function is something people are routinely asked to and do state. Every figure quoted above also appears in the Discussion''s prose.'
