  grade_reasoning: |
    arXiv preprint, which caps at C, and it is a strong one. The design fits its own claims unusually well: labels are produced by a construction rather than a rating, so the ground truth does not depend on annotator agreement; topics are split so no topic appears in both training and test; a shortcut control forbids the model from referencing the user preference so the detector cannot solve the task trivially; a direction guard re-runs the anchor check after collection; and variance is reported from five runs with the estimator stated per row. The paper confines itself to a tightly scoped construct and says so.
