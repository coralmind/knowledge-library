  grade_reasoning: Three preregistered randomized experiments (studies 2a, 2b and 3; N = 804, 801 and 800, 2,405 in total; preregistrations on OSF; data, code and materials on Dryad) with random assignment to sycophantic or non-sycophantic AI responses, plus an audit of 11 production LLMs on three datasets, published in Science after peer review. The causal claims the paper makes are what random assignment licenses, and study 3 tests the effect in live conversation about a conflict from the participant's own life. Peer-reviewed and preregistered, and the design fits its claims, so A.
