  grade_reasoning: A three-author taxonomy issued by the Center for Democracy & Technology, a policy and civil-liberties organization with standing to publish design guidance but not a professional body owning the constructs it names. It is graded n/a on authority as guidance. It is credible_secondary rather than recognized_reference because almost every category it lists is an existing dark-pattern term imported from the interface-design literature (Privacy Zuckering, Bait and Switch, Confirm-shaming, Bad Defaults, Address Book Leeching) and reapplied to chatbots; what is original is the mapping, not the definitions. Absent methods, data and N are not recorded as defects, because a taxonomy document is not supposed to carry them, and because the parent report that would carry them is not part of the cited document.
