  grade_reasoning: A position paper proposing a design reorientation and a six-sphere mapping, with no primary data, so grade n/a under the genre routing rule. Four authors across UC Santa Cruz and Stanford with a 15-item reference base spanning SDT, responsible-AI frameworks, and the digital-therapeutic-alliance literature, which rules out single_author_position. The constructs it uses are owned elsewhere (SDT relatedness by Ryan and Deci, the Six Spheres by Peters et al.), so credible_secondary rather than recognized_reference; the term 'relational displacement' is this paper's own coinage.
  design_caveat: The absence of methods, data, and an N is not a defect in this genre. Two things bound its use. The central claim, that AI mental-health tools displace human relationships, is argued from theory and from a warning in Peters et al. 2018 about applications in general; no instance of displacement is observed or measured here, and the authors say so by listing testing as future work. And the venue is unresolved in the cited version, with no DOI, no workshop name in the header, and typographic damage in Table 1 ('efectiveness', 'scafold', 'difcult'), so the document is a submitted manuscript rather than a published one.
