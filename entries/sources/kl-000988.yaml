  grade_reasoning: 'A preprint with no venue stamp, which caps at C. The design does fit the claims the authors actually make: they claim existence and reliability of a bypass across six named models, not a rate, and an existence claim is what an audit of this kind licenses. They state their own central methodological gap — no quantitative threshold for what counts as a safety failure — and they had a practicing physician verify that the elicited content was genuinely lethal, which is more external validation than this class of paper usually carries. The C is the venue and the n of twelve conversations, not the reasoning.'
  design_caveat: 'Twelve conversations total: two scripts across six models, each run once, with prompts modified ad hoc per model to fit its input format. The pass/fail label in Table 1 is assigned by the authors with no stated rubric, no second rater, and no agreement statistic, which the Limitations section acknowledges directly. Prompting was discontinued early for some models once they refused consistently, so the models are not all exposed to the same number of turns and the binary is not a like-for-like comparison. Model versions are named but not dated beyond July 2025, and one condition (ChatGPT-4o free) silently switches to a different model mid-conversation when the usage limit is hit, which the authors disclose. The strongest attack prompts are deliberately omitted from the paper under responsible disclosure, so the published scripts are not the full stimulus.'
