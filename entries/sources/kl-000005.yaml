  grade_reasoning: 'A review graded on review method rather than on absent participant data. It carries everything a systematic review is supposed to carry: a stated search strategy with the full boolean string, three databases, explicit inclusion and exclusion criteria with their rationale, a PRISMA flow diagram accounting for every excluded record, and independent dual coding with a stated consensus procedure. Published in a peer-reviewed journal, and its conclusions stay inside what the design reaches, since it claims what instruments exist and what they measure rather than what the rate of negative effects is. B rather than A because it is not preregistered and reports no formal reliability figure for the dual coding.'
  design_caveat: Ten studies and nine instruments, which the authors name as their main limitation. The search covers full texts in English and German only. The authors also state they evaluated psychometric rather than clinimetric properties. n_reported is the number of studies synthesised, not participants.
