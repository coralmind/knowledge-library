  grade_reasoning: 'An arXiv preprint with no venue stamp, which caps at C under the preprint rule. The design is unusually careful for this corpus and the paper does not overclaim: the judge is validated against two human raters with Cohen''s Kappa reported, three seeds with standard errors are run on nine of ten models, scenario 5 is included specifically as a control isolating preference conflict from the mere addition of actors, the ablations test primacy, question phrasing, prompt content and role reversal separately, ambiguous ratings are analysed rather than discarded, and the Discussion states plainly that the setup deliberately used clear-cut tasks with all relevant information inside the context window. The paper calls itself an important initial step.'
