  grade_reasoning: 'Genre is instrument: the paper''s product is an adapted measure, the Observer-rated Short Working Alliance Inventory operationalized for text-only counseling with per-question-per-score behavioral anchors, and it reports psychometrics (developer ICC rising 0.5267 to 0.6603 across three iterations; annotator ICC 0.7581 / 0.6587 / 0.6498 by dimension) rather than a finding about the world. Instrument genre grades n/a on authority. Authority is credible_secondary rather than recognized_reference: the underlying constructs are Bordin''s and the WAI-O-S is Tichenor and Hill''s, so this is a competent adaptation of a measure owned elsewhere; six authors across four institutions in collaboration with counseling psychology experts rules out single_author_position.'
