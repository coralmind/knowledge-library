  grade_reasoning: 'Graded on the Findings of ACL 2026 version. Peer-reviewed, and the item construction is principle-grounded: 1,377 multiple-choice and 2,612 open-ended questions, each mapped one-to-one to one of 392 principles from Australian psychology and psychiatry codes, with one clinical psychologist and one psychiatrist refining the generation prompts and applying quality-control rubrics. It stays C on design. Every ethicality figure for the open-ended task, which carries the paper''s headline claims that refusal rates are poor indicators of ethical behavior and that domain fine-tuning can degrade ethical alignment, comes from a GPT-5-mini judge, and no agreement between that judge and human raters is reported. The authors name reliance on an LLM judge as a limitation. An unvalidated judge licenses that the behaviors occur, not a directional comparison between models.'
