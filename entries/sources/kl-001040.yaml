  grade_reasoning: 'arXiv preprint carrying the banner ''Preprint. Under review.'' with no venue stamp, so it falls to C under the preprint rule despite an unusually strong measurement apparatus: every one of the 3,000 responses is human-labelled by three trained annotators with Fleiss'' Kappa 0.83 and 92% three-way agreement, and the authors state the benchmark''s negative predictive power limitation themselves rather than overclaiming.'
  design_caveat: Four of seven authors are at Patronus AI, a commercial LLM-evaluation vendor, and the paper evaluates competitor safety filters (OpenAI, Perspective, LlamaGuard, Mistral) against a zero-shot GPT-4 prompt the authors newly created. No conflict statement appears. The 100 prompts are single-turn, synthetic, deliberately extreme, and English-only, with 20 per harm area, so the per-harm-area rates rest on 20 prompts each and the Suicide/Self-Harm/ED rates on 300 responses. The authors state the prompts 'may not be commonly used by actual users'.
