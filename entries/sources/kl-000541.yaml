label: Salkovskis 1999 — Understanding and treating obsessive-compulsive disorder (Behaviour Research and Therapy)
type: source
layer: provenance
definition: 'Cognitive-behavioural account of obsessional problems, cited as one of two references for the reassurance cycle. The paper supports the cycle''s core: relief from reassurance is ''only very temporary, often lasting only minutes'' (S46), and attempts to reassure ''simply perpetuate the person''s obsessional problems by meshing with and amplifying the patients'' obsessional ritualising and reassurance-seeking'' (S34), with reassurance-seeking listed among the counter-productive safety-seeking strategies (S32, S41). Three further claims about the cycle are not the paper''s: that it works by negative reinforcement (the paper''s maintenance account is cognitive, through responsibility dilution and maintained negative beliefs, and never uses that term); that obtaining reassurance confirms the feared situation warranted it (stated nowhere in the paper); and that the cycle is the same whether a human or an AI supplies the reassurance (the paper discusses only human reassurance, so the transfer to AI is an inference).'
