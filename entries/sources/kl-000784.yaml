  grade_reasoning: 'This is a Data Descriptor: its product is a corpus and its annotation apparatus, not a finding about the world, so it is graded on authority rather than on the empirical fields. Fourteen of the seventeen authors are clinicians or annotators at Beijing Anding Hospital and Capital Medical University, the protocol carries an ethics approval number, the instrument it applies (HAMD-17) is owned elsewhere, and the reference base is a competent survey of the existing depression-dataset literature. credible_secondary rather than recognized_reference because the scale, the emotion taxonomy (GoEmotions) and the transcription toolkit are all restatements of instruments owned by others; what is original here is the corpus.'
  design_caveat: 'The technical-validation experiments are real benchmark runs and are reported here as such, but they are validation of the dataset rather than a study of LLM capability: three models, no fine-tuning in the headline table, one prompt design, and no reported variance across runs. Inter-annotator reliability is described as disagreements ''resolved through discussions'' with no coefficient reported anywhere, for either the transcription or the emotion labels, and the HAMD-17 score is a single psychiatrist''s rating per patient with no second rater, so the ground truth the models are scored against has no measured reliability. The emotion annotation covers only about half the consultations and reports 19 positive and 37 negative labels, which does not reconcile with roughly 50 sessions unless a session can carry more than one label or none; the paper does not say which. All material is Mandarin-language and from one tertiary hospital.'
