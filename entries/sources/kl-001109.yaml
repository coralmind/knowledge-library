  grade_reasoning: |
    A position paper carries no design and no data, so it is graded n/a on authority per the rubric's genre routing. Two authors at two institutions with a 46-item reference base rules out single_author_position under rule 4b. It is credible_secondary rather than recognized_reference because the constructs it leans on (experiential avoidance, negative reinforcement, family accommodation, inhibitory learning, ERP) are owned by the primaries it cites (Hayes 1996, Craske 2014, Foa & Kozak 1986, Salkovskis 1985), and the paper's own contribution — that general-purpose chatbots are a novel context in which those established processes run — is explicitly stated as hypothetical: "this framework offers a new mechanistic account". The paper is careful about this itself, calling its clinical suggestions "forward-looking rather than prescriptive". Conflicts are declared_managed rather than none_declared or industry_authored: both authors disclose digital-health equity (E.A. in Big Health, Oasys Health, MediKarma; A.G. employed by Wayhaven and a shareholder in Lark Health, Woebot Health, Storymine), which is disclosed and is not in the general-purpose chatbot vendors the paper critiques.
