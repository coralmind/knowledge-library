  grade_reasoning: 'A perspective piece proposing a construct and a research agenda, with no primary data and no literature synthesis, so grade n/a under the genre routing rule. Two authors and a seven-item reference base, with no venue stamp, no institutional affiliation given, and no adopting body: this is a framework put forward by its authors, which frames and does not define.'
  design_caveat: 'The absence of methods, data, and an N is not a defect in this genre. What bounds its use is that the two claims a reader will most want, that AI sycophancy is systematic and that it displaces social-learning opportunity, are both attributed to other work: the first to three cited sources and the second explicitly hedged as a concern that has been ''raised''. Every illustrative dialogue in the paper is written by the authors to make the argument, not observed. The paper reports no observation of any system or any person.'
