  grade_reasoning: 'Graded on the FAccT ''26 version. Peer-reviewed, and the design fits its own claims, which the authors frame as an existence proof of expert disagreement rather than a population estimate. The reliability apparatus is thorough: 360 responses rated on eight factors by each rater blind to model source, ICC(2,1) and ICC(2,k) with bootstrap intervals, Krippendorff''s alpha as a second metric, a permutation test on the key contrast, and follow-up interviews explaining the pattern. It stays C because the sample that carries every claim is the rater panel, and that panel is three psychiatrists selected for diversity of orientation; the authors state that replication across additional expert panels is needed before broader conclusions. A three-person purposive sample licenses the existence of irreducible expert disagreement, which is what the paper claims, and not a directional claim about experts in general.'
  design_caveat: Three raters, all trained in U.S. institutions, is the binding constraint the authors name themselves. The rated objects are single AI turns to synthetic prompts, not multi-turn conversations, so nothing here speaks to reliability on the trajectory-level constructs much of the Library defines. The rated corpus is model output; no person interacted with any system.
