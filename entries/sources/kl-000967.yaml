  grade_reasoning: 'An arXiv preprint with no venue stamp, which falls to C under the preprint rule. The design fits its claims well: the general-versus-instructional prompt contrast separates capability from selection, the contamination control (retraining KokoroChat-Full and PsyDial-Pi4 after removing every source dialogue containing an evaluation example) removes the most obvious confound, and the human counselor response is carried through as a reference row so the judge''s treatment of it is visible.'
  design_caveat: Single-authored. All response-quality and interruption scores come from two LLM judges with no human rating of the generated responses; the only human validation is 100 sampled instances per category in the dataset-identification stage, reported as exceeding 94 percent agreement with no coefficient. The evaluation contexts are cherry-picked in the sense that all were selected because a human counselor used a minimal response there, so the reported rates answer whether a model matches the human in contexts already known to call for it, not how often it should have. The author's own limitations section states that LLM evaluation is a preliminary proxy rather than a substitute for expert or client judgment, and that no full session was tested.
