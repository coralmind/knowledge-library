  grade_reasoning: 'Graded on the Findings of ACL 2026 version. Peer-reviewed, and the design fits its claims, that a principle-scored preference dataset improves reward modelling and policy quality on its own test set: 34,329 training and 2,324 test preference pairs scored by GPT-4o against seven counseling principles, two psychotherapists agreeing on 174 of 200 sampled pairs and matching the dataset labels on 184 and 170 of them, and GPT-4o agreeing with human experts on 82.5 percent of the final model comparisons. The limitations are ordinary: the labelling model, the evaluation judge and the comparison baseline are all GPT-4o, the client speeches come from existing public datasets, and no person interacts with any trained model. B.'
