  grade_reasoning: Graded on the Findings of ACL 2026 version. Peer-reviewed, but design_fits_own_claims is false, which holds it at C. Every reported rate is an attack success rate produced by an adversarial mutation loop that rewrites the client turn until the judge scores harm, so the figures measure elicitability under optimised pressure and not prevalence. The harm labels come from a gpt-4o-mini judge whose cross-judge check (Appendix E.1) places five of eight counselor models near chance and one reliably below it (Llama 3.1, 0.406). The human validation (Appendix C.3) rests on 86 to 91 items at Cohen's kappa 0.327 to 0.387, which is fair agreement, although the paper describes it as strong alignment. n_reported is the 58 client profiles, the only sample the paper states.
