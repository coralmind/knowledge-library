  grade_reasoning: 'Genre is position: it argues for a documentation framework and supplies a starter set, with no primary data and no synthesis claiming completeness, so it is graded n/a on authority rather than on the empirical fields. Seven authors across six institutions in five countries, including a legal scholar, with 54 references, which rules out single_author_position under rule 4b. It is credible_secondary rather than recognized_reference because the harm taxonomies it categorises against are Weidinger et al. and Shelby et al., which it explicitly cites as the owners of those definitions, and its own contribution is the card structure rather than the risk definitions.'
  design_caveat: 'The Table 4 starter set is a survey product: risk names and one-line descriptions collated from thirteen prior works, merged where similar, with citation lists. Several rows carry an empty citation list, which by the paper''s own stated rule (only risks with a documentable harm become a RiskCard) means those rows are candidates rather than cards. The prompt-output pairs in the released cards come from four model families available between October 2022 and January 2023 and the authors state they are illustrative only and deliberately not attributed to any model.'
