  grade_reasoning: The datasets' labels are assigned by which subreddit a post was collected from, not by any clinical assessment, yet the paper describes them as gold-standard references for detecting disorders and reports F1 up to 99.54%. The human validation confirms that two annotators agree on applying a rubric to posts whose labels were already fixed by source, which measures rubric clarity rather than label validity, and the paper's own divergence analysis shows the classes are lexically separable, which is what a topic classifier would find. That gap between what was measured and what is claimed makes design_fits_own_claims false; the arXiv preprint venue confirms C.
