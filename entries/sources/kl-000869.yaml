  grade_reasoning: 'Accepted at npj Mental Health Research but circulating as an unedited author manuscript whose own banner states there may be errors present which affect the content, and design_fits_own_claims is false, which the rubric routes to C. The design failure is specific and the authors name it themselves: a model''s refusal to diagnose is scored as an error against an accuracy metric, so the paper''s most striking result, that small models beat GPT-4 on diagnosis, is an artifact of the scoring rather than a finding about capability. The authors identify this as a Safety-Utility Trade-off in the Discussion, which is honest, but the leaderboard tables carry the uncorrected numbers.'
  design_caveat: The SMHD ground truth is self-reported diagnosis in Reddit posts, so 'diagnostic accuracy' means agreement with a social-media self-label, not with a clinical assessment. The mental-health subsets of MedQA were themselves selected by GPT-4 and DeepSeek-V3 with human review only of disagreements, so a model family participated in constructing the benchmark it is then scored on. Crisis-response subsets are small (179 English, 140 Chinese). All tasks are single-turn, and the D4 dialogues are pre-scripted transcripts the model scores rather than participates in. The paper is unedited and contains visible OCR-level text corruption throughout.
