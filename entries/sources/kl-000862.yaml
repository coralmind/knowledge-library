  grade_reasoning: |
    Preprint, which caps at C. The design fits its own claims well: the paper makes only existence and pattern claims about response language, states explicitly that it did not measure effects on adolescents, and reports its reflexivity and its analysts' backgrounds. Prompts were built with adolescent consultants and ranked by two independent expert judges, though the judges' agreement on prompt compliance was only fair (Cohen's kappa = 0.46).
