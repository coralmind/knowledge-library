  grade_reasoning: 'Peer-reviewed in Psychiatric Quarterly, but the design does not fit its own claims, which sets the C. Three specific mismatches: the title and abstract claim readability as an evaluated dimension and no readability measure is computed anywhere, with Flesch-Kincaid appearing only in a list of operational definitions for future work; the Methods state that ICC(2,k) with 95% CIs ''were computed for each outcome'' and no ICC value appears anywhere in the Results, so the inter-rater agreement the paper claims to have measured is not reported; and the Rationale claims ''a pre-registered analytic plan'' while the Limitations section recommends preregistering hypotheses and analyses as future work.'
  design_caveat: 'One sample per item per model, which the authors name as a limitation: intra-model variance and update drift cannot be estimated, and the three-question stability re-check is described only qualitatively. Twenty items, two raters, and no reported agreement statistic. Every reported difference between models is non-significant, so the headline ranking of GPT-4 first is not supported by the paper''s own test. The instruments are acknowledged as unvalidated in the paper''s own words. Ceiling effects are severe: all three models scored a perfect 5 on quality and 7 on usefulness for all seven diagnosis items, so those items discriminate nothing.'
