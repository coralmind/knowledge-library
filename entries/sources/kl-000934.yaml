  grade_reasoning: 'A theoretical framework paper, so genre is position and grade is n/a; absent methods, data and N are not defects in this genre. Authority is credible_secondary rather than single_author_position: five authors from one department at the University of Central Florida, with a substantial reference base drawing on established automation research (Parasuraman, Endsley), self-determination theory, cognitive load, and recent empirical work. It restates findings owned by the primaries it cites and proposes a synthesis. Not recognized_reference because the framework is the authors'' own and no body has adopted it; the HIAG framework it builds on is also this group''s prior work.'
  design_caveat: 'Self-referential in construction: the model extends the authors'' own HIAG framework and Transparency Paradox model, and the proposed measurement approach cites the first author''s own dissertation and a paper marked ''in preparation''. No venue, DOI or preprint identifier appears anywhere in the document. The empirical base is entirely restated from cited primaries, and the authors themselves characterise it as convergent rather than conclusive, noting that several findings are preprints or correlational designs where reverse causation cannot be ruled out.'
