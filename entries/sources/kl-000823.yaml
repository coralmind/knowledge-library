  grade_reasoning: A software/infrastructure paper that argues a position about how mental-health human-AI research should be instrumented and reports no primary data, so grade n/a under the genre routing rule. Three authors across Beth Israel Deaconess Digital Psychiatry and UCL, with a 19-item reference base and named grant support, which rules out single_author_position; it restates definitions and figures owned elsewhere rather than establishing them, so credible_secondary.
  design_caveat: 'The absence of methods, data, and an N is not a defect here; the genre carries none. What it does not carry, and what a reader should not take from it, is any evaluation of the platform: the alpha study is described as ongoing, no participant outcomes are reported, the safety classifier is stated as built but unevaluated in this document, and the keyword-based alerting is labelled ''Cloze-Guard v0''. The authors are the platform''s builders, which is disclosed through the grant acknowledgements rather than a conflicts statement.'
  author_disclosure: Torous and Flathers are also authors on Dwyer et al. 2025 MindBench.ai and on Hua et al. 2025, both of which this paper cites in support of its argument.
