  grade_reasoning: 'An arXiv preprint whose headline claim, Spearman correlations up to 0.8, comes from an analysis that sorts recordings by the absolute difference between prediction and ground truth and then discards the worst quartile, so the retained subset is defined by the model having been right about it. The full-data correlation for the same model is 0.408. That is a mismatch between the design and the abstract''s claim, so design_fits_own_claims is false, and the preprint venue confirms C. The paper is otherwise careful: it reports p-values, distributions, and the underestimation bias honestly, and the underlying data pairs real speech with a validated self-report instrument.'
