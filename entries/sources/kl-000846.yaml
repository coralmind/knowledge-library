  grade_reasoning: 'An arXiv preprint with no venue stamp, so C by the preprint rule. The design fits its own claims well for a methods paper: three seeds, cross-judge replication against Claude-Opus and Llama Guard 3, a 500-sample meta-evaluation of the judge, and a 152-response human annotation study across three annotators establishing the automated judge as a conservative proxy. n_reported here is the human-validation N, the only place people were involved; every headline rate is a model-judged score on model output. Conflicts are declared_managed because one author is at Microsoft Research while the evaluated models are Mistral and Qwen, not Microsoft''s.'
