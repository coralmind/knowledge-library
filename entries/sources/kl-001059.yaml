  grade_reasoning: A population-based prospective cohort (n=4285, ABCD, 21 US sites) in JAMA, STROBE-reported, with FDR correction, E-value sensitivity analysis, and an explicit statement in Limitations that the observational design precludes causal inference; conflicts are declared (Mann's instrument royalties) and funding includes Google to the first author, which is disclosed. Not A because it is not pre-registered and not replicated, and the outcome exposure is self-reported.
  author_disclosure: Funding/Support names Google (to Dr Xiao) alongside NIMH and the American Foundation for Suicide Prevention. Recorded because a platform-industry funder appears on a study about platform-use harms; the paper's findings run against platform interests, and the disclosure is present, so declared_managed rather than undeclared_apparent.
