  grade_reasoning: 'The document proposes a framework and reports no primary finding about the world: its eleven interviews are inputs to the artefact, not a study of AI behavior, and the paper says explicitly that content, construct and empirical validation of the ontology all remain to be done. That makes it a position paper, graded n/a on authority. Two authors at one institution with a thirty-five-item reference base and eleven expert interviews rules out single_author_position; it restates definitions owned by the NEQ, UE-ATR and DSM-5 rather than establishing its own, which makes it credible_secondary.'
