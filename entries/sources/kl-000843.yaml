  grade_reasoning: |
    Guidance genre, so graded n/a on authority. Four authors from two universities with 55 references makes it more than a single-author position, but it is a restatement of design principles owned elsewhere rather than the standard reference for any of them, and no professional body has adopted it, so credible_secondary. `design_fits_own_claims` is false because the paper invokes PRISMA and then disclaims it: it states it "cannot claim that our study is a rigorous review", used a single database (Google Scholar), reports no screening procedure, and does not say who did the screening. The checklist is also validated against a single chatbot by the authors themselves with no second rater.
