  grade_reasoning: 'Peer-reviewed in Frontiers in Medicine, IRB-approved, with a design that fits its stated claim, which the authors are careful to keep at proof-of-concept: criterion validity of an AI grader against a three-rater human benchmark on a single global adherence score. The limitations section names every gap a reader would raise, including that only the global score was validated and not the component scores. B rather than A because there is no preregistration, no replication, and no control condition.'
  design_caveat: 'The unit of analysis is a conversation and the population is model_only in the sense that matters here: what was measured is the AI grader''s score against human graders'' scores, not any outcome for a person. Convenience sample of 54 conversations from one webinar, drawn from an audience recruited on a social-media platform about GenAI and mental health, so participants are unusually favourable to the technology and only 13 percent had formal suicide-risk-assessment training. Three raters, one global item, one scenario, one model, one language. The validated quantity is a single 10-point global score; the paper states plainly that component-level scores were not analysed. The qualitative RQ3 claims rest on three hand-picked conversations examined by the same team that built the agent.'
