  grade_reasoning: 'Peer-reviewed in npj Digital Medicine with a design that fits its claims: the outcome is a binary text property with a stated operational definition, the regex patterns are published in Table 1, every prompt was run three times per model, ground-truth image labels come from expert-annotated public datasets, and the disclaimer criterion was drawn deliberately narrow (a referral to consult a physician was explicitly not counted). The conflict declaration is present and specific. It does not reach A: not preregistered, no replication, and the longitudinal claim rests on four annual points with different model sets at each.'
  design_caveat: The 'longitudinal' design compares different models released in different years rather than following one model, so a year effect and a model-selection effect are not separable; the 2022 point is a single model, GPT-3.5 Turbo. All prompts are single-turn API calls at default temperature, which the authors state may not reflect web-interface or multi-turn behavior and may make their figures a conservative estimate. The disclaimer criterion excludes 'consult your physician' phrasings, so the measure is specifically self-limitation language and not safety messaging in general. R.D. declares advisory and consulting relationships across several companies, none of them the model vendors evaluated.
