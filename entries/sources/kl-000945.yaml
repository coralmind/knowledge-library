  grade_reasoning: 'Graded as a review: it carries the three things a review must carry (search strategy, screening cascade, inclusion criteria) and is therefore not marked down for absent primary data. It falls to C on design_fits_own_claims because screening and extraction were done by the first author alone with the second author resolving discrepancies rather than by independent dual screening, the paper reports no counts of studies per modality by its own admission, and the Discussion states directional conclusions about efficacy and impact that a narrative chart with no risk-of-bias appraisal cannot support.'
