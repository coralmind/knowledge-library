  grade_reasoning: Preregistered at two OSF DOIs with protocol deviations reported in a supplementary table, ground truth supplied by 8 licensed clinicians rather than an LLM judge, 1.4M inferences across 49 models with family-stratified mixed-effects models and Benjamini-Hochberg correction, and a limitations section that names the clinician comparison as artificial. The rubric's A branch requires peer_reviewed in journal or conference_proceedings, and this is an uncertified medRxiv preprint, so it derives to C. No override is entered because C is the correct derived value; the reasoning is recorded so a reader can see that its design and reliability apparatus exceed what a C normally carries, and that the constraint is the venue alone. Conflicts are extensive and fully declared with equity and consulting relationships across seven named companies, with a statement that none influenced the work.
