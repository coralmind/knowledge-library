  grade_reasoning: |
    Position genre, graded n/a on authority. Five authors across King's College London, University College London and Western Eye Hospital, with 41 references, so not a single_author_position; but it synthesises rather than owns any definition and no body has adopted it, so credible_secondary. `design_fits_own_claims` is true because the paper is unusually disciplined about its own limits: it refuses the causal reading of its own subject term, labels its central figure hypothesis-generating and not independently validated, and names selection and reporting bias in its evidence base. `conflicts: undeclared_apparent` is recorded, not as misconduct but as a fact a reader should see: the paper carries no conflicts statement, two authors are affiliated with "Dev and Doc: AI For Healthcare", and it cites the first author's own Psychosis-bench as supporting evidence.
