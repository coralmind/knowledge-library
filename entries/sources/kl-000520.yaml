  grade_reasoning: Peer-reviewed in Proceedings of the ACM on Human-Computer Interaction (CSCW), with a randomised experimental design that licenses the causal claims it makes about the effect of interface condition on overreliance. N=199 after documented exclusions, effect sizes and F statistics reported throughout, no preregistration stated and no replication known, which puts it at B rather than A. Notably, the authors report their disconfirmed hypothesis (H1b, that cognitive forcing would improve overall team performance) as well as their supported ones, and conducted a self-audit for intervention-generated inequalities.
  design_caveat: 'The authors name the binding limitation themselves: a single non-critical task, choosing a low-carbohydrate ingredient substitution from a meal photograph, on a crowdworker sample. Nothing about mental health, distress, or a person in a vulnerable state is involved. The AI was simulated rather than a real model, which buys control over the error rate at the cost of ecological validity, and its errors were of one designed kind (visual misrecognition producing a substitution of the second-highest-carbohydrate ingredient). The sample skews educated and male: 85.86 percent had or were pursuing a college degree, 65.44 percent self-identified as male.'
