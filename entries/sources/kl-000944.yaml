  grade_reasoning: Peer-reviewed at CHI, with a stated corpus of 318 posts from 291 unique users, a documented hybrid inductive-deductive codebook thematic analysis, an age classifier reported at Cohen's kappa 0.74 against human annotation and 0.998 self-consistency, per-code prevalence tables, and an IRB determination plus a stated anonymization and paraphrasing protocol. The claims made are descriptive claims about how a self-selected group of teens narrates their own reliance, which is what a qualitative design licenses, and the limitations section names the self-selection, single-platform, English-only and unverified-demographics constraints itself. B rather than A absent preregistration or replication.
