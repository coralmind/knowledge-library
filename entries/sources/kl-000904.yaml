  grade_reasoning: 'A literature synthesis published in JAMIA, an established peer-reviewed informatics journal, with four Stanford authors across the School of Medicine and Biomedical Informatics. Graded as a review on review terms: it states its synthesis scope in the abstract and confines its conclusions to a governance proposal rather than to any empirical claim, so design_fits_own_claims holds and the derivation gives B. Not A because it is not preregistered and no replication exists.'
  design_caveat: 'Graded on review terms, so the absence of methods, data and a participant N is not counted against it. What is a real defect in this genre is that no search strategy, screening procedure, or inclusion criteria are reported anywhere in the paper: the abstract says ''we synthesized recent literature'' and nothing narrows that. It is a structured narrative synthesis rather than a systematic review in the protocol sense, and n_reported (the count of works synthesised) is not stated. It also releases no prompt set, dataset, code, or scored rubric, so every construct it names is a specification rather than an instrument.'
