  grade_reasoning: 'A medRxiv preprint carrying the explicit banner that it has not been certified by peer review and should not be used to guide clinical practice, so it falls to C under the preprint rule. The design fits its claims closely: the paper claims a false-negative/false-positive trade-off and an alignment between model error and clinician disagreement, and it measures exactly those; it holds the base model constant and varies only the prompt, so the gradient is attributable; and the limitations section states the prevalence bias, the small sample, and the fair-only interrater agreement without softening any of them.'
  design_caveat: 'Industry-authored and declared: three co-authors are co-founders of Sonia and two are employed there, and the evaluation data come from Sonia''s own deployment. The 46 percent high-risk prevalence in the evaluation set is a deliberate oversample against a base rate the paper itself puts at 2.55 percent of the full corpus, so the reported false-positive rates understate the operational alarm burden, which the authors state. The reference label is a majority vote among five clinicians whose Fleiss kappa is 0.34, so the ground truth against which recall of 1.000 is reported is itself only fairly reliable. The dataset is not public; prompts are available on request.'
