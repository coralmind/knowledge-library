  grade_reasoning: 'Graded on the ACL 2026 long-paper version. Peer-reviewed, and the design fits its claims about simulating psychological patterns in role-play: 244 patterns each synthesized from about 50 papers, a synthesis check by three psychology-trained annotators on a stratified 30 patterns at Krippendorff''s alpha 0.58 to 0.76, 11,359 generated multi-character scenarios, and a checklist judge (GPT-5-mini) validated against three human experts on 100 scenarios at r = 0.90 for individual pattern expression and r = 0.88 for multi-pattern dynamics. The limitations are ordinary: the scenarios are LLM-generated rather than drawn from real conversation, the pattern base comes predominantly from WEIRD research populations, and co-authors are affiliated with Hello Group, recorded under conflicts. B.'
