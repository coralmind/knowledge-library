  grade_reasoning: Peer-reviewed in a JAMA-family journal, with a masked dual-rater rubric, consensus adjudication, STROBE reporting, and conclusions confined to what the design reaches (differences in rated response quality between platform types); not preregistered and not replicated, so B rather than A.
  design_caveat: One investigator conducted every conversation, so persona enactment is unblinded and unreplicated. The paper's own limitations name simulated scenarios and a small platform sample. Three vignettes times 25 platforms yields 75 conversations, so each scenario-by-platform cell is n=1 and no within-platform variability is estimable. Interrater agreement before consensus is not reported, which matters for the judge-development question of how reliably two clinicians agree on 'appropriateness'.
