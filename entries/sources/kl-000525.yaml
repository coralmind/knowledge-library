  grade_reasoning: 'Peer-reviewed in new media & society with a grounded-theory design appropriate to its own claims, which are about what harms are describable and how they are constituted, not about how often they occur. The authors state the design''s limits themselves: posts are single snapshots so no process model can be built, subreddit posters may differ from average users, and demographics are unavailable. Under the derivation, journal plus design_fits_own_claims is B.'
  design_caveat: Everything here is self-report in a public forum, written by people who chose to post about Replika in a community organised around it, so both the harms and the benefits are reported by an unrepresentative and self-selecting group. The counts given (218 negative versus 144 positive posts) describe the corpus, not a population. Per the journal's ethics practice, direct quotes are deliberately withheld and replaced by paraphrase and short segments to prevent reverse identification, so the user language available for quotation is the authors' summary of it rather than the posts themselves. Data end in April 2021 on a product that changed materially afterwards.
