  grade_reasoning: |
    Peer-reviewed journal article with a sound cross-sectional design for the associational claims it makes, N = 92, an a priori G*Power analysis giving a required N of 89 for 95% power at a medium effect, and validated Turkish-language instruments with reported per-study Cronbach alphas (FAS-PV 0.860, DOCS 0.900, AAQ-II 0.897, BDI 0.906, BAI 0.926). Not preregistered and not replicated, so B rather than A. design_fits_own_claims is true because the authors explicitly refuse the causal read their design cannot support: "the direction of this relationship remains unclear due to the cross-sectional nature of this and previous studies", and they state both directions as live possibilities rather than asserting one. Single-centre recruitment, no assessment of relatives' psychological parameters, no insight measure, and possible selection bias among decliners are all named by the authors themselves.
