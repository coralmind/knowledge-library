  grade_reasoning: 'An arXiv preprint, so C under the preprint rule. The design fits its claims: the task is ordinal classification against expert-verified labels, the paper reports its inter-annotator agreement honestly across three iterations including a failed first one at 0.22, it evaluates a wide model range on nine metrics including an ordinal-appropriate loss, and it explicitly declines to propose a method. The authors also state the study is not patient-facing and make no clinical claim.'
  design_caveat: |
    Internal inconsistency in the reported N. Section 3 states 212 dialogues and 12,912 utterances, while Section 4's split table sums to 167 sessions and 10,172 utterances. The task definition in Section 5.1 states the trust score is in {1,2,3,4,5}, which does not match the seven-level ordinal scheme with half-steps described in Section 3.2. The source corpus is HOPE, built from publicly available counselling videos, so the sessions are demonstration or published material rather than routine care. Trust is annotated from the patient's text by third-party annotators; no patient reported their own trust. Every conversation is initialised at 2.5 by fiat.
  author_disclosure: |
    Heavy self-citation: Malhotra et al. 2022 (the HOPE source dataset) and five Srivastava et al. papers are by overlapping subsets of this author group. The dataset this study annotates is the authors' own prior corpus.
