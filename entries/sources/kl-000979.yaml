  grade_reasoning: Peer-reviewed in a Springer journal, open access, with datasets, prompts and analysis code released on Zenodo, expert labelling of both the risk levels and the response appropriateness, and conclusions confined to what the design reaches. The paper states its own headline as a negative result and names its principal limitation (single-turn, no conversational context) itself. Not preregistered and not replicated, so B rather than A.
  design_caveat: 'Single-turn statements only: the authors name incorporating conversational context as required future work, so nothing here bears on multi-turn or within-conversation behavior. All 100 inputs are generative-AI produced, which the paper uses to avoid human-subjects review but which also means the stimulus distribution is a model''s idea of how suicidal ideation is expressed; the paper''s own background stresses that real suicidal expression is often indirect, which is exactly the property synthetic generation is least likely to reproduce. Population is German-speaking university students, and the deployment is one app (MindMate). The number of expert raters and their inter-rater agreement on the seven-level labels are not stated in the paper.'
