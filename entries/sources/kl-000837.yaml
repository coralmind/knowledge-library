  grade_reasoning: 'Peer-reviewed in BMC Public Health with ethics approval and a well-specified reflexive thematic analysis, but design_fits_own_claims is false: the participants are 13 crisis-service volunteers speculating about a technology none of them had used with a texter, so the paper''s claims about how an artificial volunteer would affect people at risk of suicide rest on practitioner anticipation rather than observation. The authors state this themselves in Limitations, including the sampling bias toward volunteers already interested in AI. The false value routes to C, and neither a null N nor an undeclared conflict applies to force D.'
