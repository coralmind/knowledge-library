  grade_reasoning: 'A randomised three-arm controlled trial with validated instruments, reported internal reliability at both timepoints, attrition analysis showing no baseline differences between completers and dropouts, IRB approval, and a limitations section that states the sample size and duration are inadequate for generalising. design_fits_own_claims is true because the causal language is confined to the randomised comparison and the complementary-effect claim about the emotional-support arm is explicitly framed as complementary rather than as independent efficacy, with the authors saying directly that a head-to-head comparison of the two platforms would have been inappropriate. The letter is C, not B: it is an arXiv preprint with no peer-review stamp; attrition is severe, with 134 of 247 randomised participants (54.2 percent) providing T2 data and the three arms ending at n=38, 31 and 65; the control group has no T3 data at all, so the durability claim rests on a within-intervention comparison with no control; and the sample is 79.85 percent female with a mean age of 31.8. conflicts is undeclared_apparent because three authors are affiliated with Beijing Lingxin Intelligent Technology CO., Ltd., the company behind the evaluated product, and the paper carries a funding statement but no competing-interests declaration.'
