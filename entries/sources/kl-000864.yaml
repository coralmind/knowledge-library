  grade_reasoning: 'A Research Square preprint carrying no peer-review stamp, which falls to C under the preprint rule. The design fits its claims: IPA is the right method for lived experience, the analysis procedure is stated in six steps, trustworthiness strategies are named, and the authors state plainly that IPA does not claim statistical generalizability and that the cross-sectional design cannot examine how the relationship evolves.'
  design_caveat: Recruitment required at least four weeks of chatbot use, which the authors themselves note excludes anyone who tried a chatbot and disengaged, precisely the people for whom cultural mismatch would be sharpest. Sample is three southern Nigerian cities. Everything about AI conduct in this paper is participant recall of a conversation the researchers did not see, so no AI behavior is directly observed; a single participant quote is the only record of what any system said.
