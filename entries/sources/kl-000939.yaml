  grade_reasoning: 'Genre is position: a Personal View in a specialty journal, arguing a case and proposing a framework rather than collecting data or systematically synthesising a literature. Graded n/a on authority accordingly, and the authority value is recognized_reference rather than credible_secondary or single_author_position: twelve authors across the Institute of Psychiatry, Psychology and Neuroscience at King''s College London, South London and the Maudsley NHS Foundation Trust, CUNY, Tufts, Durham, and a Lived Experience Advisory Board, publishing in The Lancet Psychiatry with 50 references. It is the reference that names and defines the construct, and its Panel 1 nomenclature argument is the field-defining move. design_fits_own_claims is true because the paper is unusually disciplined about what it does not know: it rejects the "AI psychosis" label as overclaiming, says causality remains unproven, states that no meaningful prevalence estimate exists and that no increase in incidence has been reported by services, and lists its open questions as a research agenda in Panel 3. conflicts is declared_managed: a full declaration of interests is given, including one author''s co-founder stake and consulting relationship with two AI companies and several authors'' industry research funding. Note also the disclosure that the paper itself was written with extensive use of ChatGPT-4o and Gemini 2.5 in the research process.'
