  grade_reasoning: Published in Findings of ACL 2024 and the design fits its stated claims, which are about dataset construction quality and downstream fine-tuning effect rather than about clinical efficacy. The intrinsic comparison holds the source reports constant and varies only the reconstruction method, which is the right contrast for its claim; the extrinsic evaluation uses a held-out topic-classified set; and the paper's own limitations section names the specific thing its framework does not capture, which is when a technique should be deployed rather than whether it appears.
  design_caveat: The source reports are counselor-written case write-ups from two commercial Chinese platforms, so the client's words are already a professional's reconstruction before any model touches them, and the consultation process in a report is explicitly third-person with no dialogue. The dialogues themselves are then generated by GLM-4 twice over. Safety scores 1.00, the maximum, for every model, every school and every condition in both tables, which means the safety metric discriminates nothing; reading its criteria explains why, since Safety here is defined as privacy protection plus respect, not clinical safety. The reports are not released.
