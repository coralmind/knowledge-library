  grade_reasoning: 'A commentary arguing a view about how psychologists should use AI, with no primary data and no literature synthesis of its own, so grade n/a under the genre routing rule. Two authors at two Polish institutions with a 10-item reference base, restating a document owned by the Global Psychology Alliance: credible_secondary rather than recognized_reference, because the authority for these principles belongs to the GPA document itself, which is reachable and should be cited in its place for any definition.'
  design_caveat: The absence of methods, data, and an N is not a defect in this genre. Two things do bound its use. First, everything attributed here to the GPA is these reviewers' paraphrase, in translation, and no principle is quoted verbatim from the source document. Second, the illustrative cases the reviewers supply are constructed examples written to explain a principle, not observed incidents, and they must not be read as reports of anything that happened.
