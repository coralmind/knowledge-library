  grade_reasoning: 'A system-demonstration and instrument paper: it builds an auditing toolkit and a library of 69 rubric-encoded counseling metrics, and its human evaluation (20 support seekers plus 6 mental-health professionals) measures usability, satisfaction and trust in the tool rather than testing any claim about conversational behavior. Genre instrument routes to n/a per the rubric. Eight authors from one institution with a very large reference base and a psychologist reviewing the metric set makes this a credible_secondary restatement of counseling constructs owned by the primary literature it cites, not a recognized reference for any of them.'
