  grade_reasoning: Peer-reviewed narrative review in Trends in Cognitive Sciences by two authors at separate institutions with a 99-item reference base; each empirical claim is tied to a numbered primary study, and the authors mark their own contribution as a framework proposal rather than a finding. Graded on review terms per rule 4a, with the override above recording why the null n_reported is not a defect.
  design_caveat: 'Narrative rather than systematic: no stated search strategy, screening procedure, or inclusion criteria, and the selection of the three reviewed domains is the authors'' own. The proposed metacognitive framework (Figure 3) is explicitly forward-looking and is not tested here. The self-reinforcing drift prediction is stated as a model prediction, not a demonstrated longitudinal finding, and the authors say so.'
