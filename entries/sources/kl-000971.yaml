  grade_reasoning: 'A preprint, which alone yields C. `design_fits_own_claims` is false for a specific and checkable reason: the benchmark is derived by sampling from the same oMind-SFT dataset the oMind models were finetuned on, and the paper reports oMind models winning on it, without stating whether the sampled conversations were held out from training. The rubrics are GPT-4-generated and expert-reviewed rather than expert-authored, no inter-annotator agreement figure is reported anywhere despite three primary annotators, and the scoring of every model response against every rubric point is done by an unspecified judge with no human calibration. Under the derivation rules this would fall to D on `design_fits_own_claims == false`, but the four-expert two-tier annotation protocol and the disclosed contamination-adjacent construction are enough apparatus to keep it at C rather than D.'
  design_caveat: |
    Three separate measurement provenance problems. First, the SFT explanations, the supporting QA, and the multi-turn conversations were all generated by GPT-4o-mini, and the DPO preference pairs were labelled by GPT-as-a-judge, so the training signal is model-generated throughout. Second, the oMind-Chat rubrics were generated by GPT-4 and then reviewed by experts rather than written by them. Third, the paper never names what scores model responses against the rubrics on the benchmark's three metrics, and reports no agreement figure for the three primary annotators. The only place human raters produce a number directly is Table 5, two annotators on 100 explanation instances, where the two disagree materially on one of three dimensions.
  author_disclosure: |
    Racha et al. 2025 (MHQA) is by an overlapping author group and supplies 25,000 of the SFT training instances and 500 of the MCQA test instances, on which oMind reports a 17.3% F1 gain. This is the largest single contributor to both the training set and the reported improvement.
