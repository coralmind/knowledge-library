  grade_reasoning: The reliability apparatus is unusually strong for this literature — three independent clinician raters per conversation, a trained-and-calibrated rater pool, chance-corrected Krippendorff's alpha with CIs reported clinician-clinician, LLM-clinician, per dimension and per subgroup, four judge models, and a prespecified sample-size rationale targeting CI width — and the design matches its validity claims. It is nonetheless a preprint with no venue stamp, which the derivation caps at C; nine of ten authors are employed by Spring Health, which developed VERA-MH, so this is a developer validating its own benchmark and is recorded as industry_authored.
