  grade_reasoning: 'A prospectively registered PRISMA systematic review with a stated search strategy, dual independent screening and extraction, MMAT appraisal, and reported inter-coder reliability (kappa 0.81 on CFIR mapping). It does not reach A because the synthesis is narrative under SWiM with no quantitative pooling, and because the underlying evidence is thin by the review''s own account: three RCTs among 27 studies, 15 studies with N under 50, 18 with no control group, and 22 using convenience sampling. The authors repeatedly and explicitly mark their reporting frequencies as study-level counts rather than prevalence, which is the discipline that keeps design_fits_own_claims true.'
  design_caveat: Reporting frequencies are the proportion of the 27 included studies mentioning a theme, weighting an N=5 pilot equally with an N=15,531 study; the authors state this four separate times. Preprints were included. Evidence is heavily high-income and English-language (US k=11, near-absent LMIC data) while the review's access argument is about LMICs. No included study followed participants beyond 12 weeks, so nothing here bears on durability or on long-term dependency. The tiered framework in Section 4.6 is author-derived and marked by the authors as not a finding of the review.
