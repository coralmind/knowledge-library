  grade_reasoning: 'B. Peer-reviewed in npj Digital Medicine, and the design is honest about what it does: the comparison group is not recruited alongside the models but taken from five published vignette studies using the same vignettes, which the authors state and footnote rather than hide, and they explain the differing sample bases in Table 1 note e. The reasoning check is human, independent, and dual-rated with kappa reported. It is not A: not preregistered, no replication, and the claim in the title outruns the design in one specific respect noted below. Conflicts are declared and managed at length, including a senior author''s consultancies and an author''s editorial role at the publishing journal from which they recused.'
  design_caveat: The headline comparison is across studies rather than within one. The models faced 51 vignette trials in fresh sessions; the human comparators were clinicians answering the same vignettes in surveys conducted years earlier under different instructions, and the response counts differ by an order of magnitude (N = 360, 208, 130, 105, 110 humans against 16 to 19 model trials). Several vignettes have no human comparator at all (N/A in Table 1 for vignettes 6, 7 and 8 in some groups). The authors state the vignette-versus-real-record limitation themselves but not the cross-study comparability one.
