  grade_reasoning: A preprint, which routes to C. The apparatus is stronger than the venue suggests — a stated power analysis for cell size, non-parametric tests throughout with Benjamini-Hochberg correction, a permutation-based noise floor for the network divergence claims, and a candid Limitations section naming the pre-COVID baselines, the missing ground truth for some cells, the PHQ-8 substitution, the default-temperature confound, and the convenience model sample. The design fits its own claims because the claims are about distributional properties of model output against published survey baselines, which the audit measures directly.
  author_disclosure: Single author, unaffiliated (Independent Researcher). Recorded because it bears on whether the epidemiological baselines and instrument scoring were independently checked, which the paper does not state.
