  grade_reasoning: Peer-reviewed in Psychosomatic Medicine, single-authored by the field's principal grief neuroscientist, 74 references, funding and conflicts disclosed. The author names it a selective rather than systematic review and states that limitation herself, and there is no search strategy, screening step, or inclusion criteria, which is a real defect for the genre and caps it at C per the override above. design_fits_own_claims is true because every claim is scoped as the field's current state rather than as a synthesis result, and the author repeatedly names what is not yet established.
  design_caveat: Selective narrative review with no stated search or inclusion procedure. The author is a co-author on several of the primary studies reviewed (references 29, 30, 34, 41, 42, 44, 59, 62, 74), which is disclosed by name in the text but not flagged as a selection consideration. Many of the mechanistic claims are described by the author as speculative, scarce, or awaiting longitudinal confirmation; the nucleus accumbens interpretation in particular is labelled 'one speculative possibility'.
