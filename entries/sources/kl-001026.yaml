  grade_reasoning: 'An arXiv preprint with no venue stamp, which caps at C under the preprint rule. The design fits its claims and the evaluation discipline is above the norm for this corpus: four different judge models were run as final-dialog evaluators, one of which diverged and is reported as divergent rather than dropped; an independent judge re-scored the same transcripts; the oracle-role setting is explicitly labelled an upper bound and the role-agnostic variant is reported alongside with its victim false-block cost; and the human validation section reports the judge''s poor agreement with human annotators on the headline construct rather than only the good agreement on refusal. The authors state that harmful-compliance rates should be read as outcomes under GPT-4o-mini''s protocol rather than as human-equivalent ground truth.'
  design_caveat: 'Synthetic scenario-based benchmark, and the authors state it does not estimate how often such behavior occurs in real use. The critical measurement caveat is in the human validation: on harmful assistance the judge and human annotators agreed mostly on negative cases and shared positive labels were uncommon, and the two human annotators themselves reached only kappa 0.52 with Krippendorff''s alpha around 0.51 on that construct. So the headline harmful-compliance rates rest on a construct humans do not reliably agree on. Primary results use oracle role labels; the role-agnostic variant, which is what a deployment would face, blocks 5.2 to 7.6 percent of victim-side help-seeking. Six of eight generators are small open-weight models.'
