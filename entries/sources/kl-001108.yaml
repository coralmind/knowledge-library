  grade_reasoning: An instrument development and validation paper, graded n/a on authority rather than on the empirical fields, because what it reports is psychometrics rather than a finding about the world. Two authors from one department, but the ISAS is the field-standard comprehensive measure of non-suicidal self-injury function and this is its validation paper, so it is the recognized_reference for the function definitions it operationalises. It defines and cannot establish occurrence.
