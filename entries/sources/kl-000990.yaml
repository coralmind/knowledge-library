  grade_reasoning: 'Peer-reviewed in npj Health Systems, IRB-reviewed, NIH and PCORI funded with the funders stated to have played no role, no competing interests declared, code released. The design fits its claims unusually well for a benchmark: leakage is controlled by grouping on encounter, patient and caregiver ID; an external cohort from a different institution and a different decade is used for validation; results are reported at native prevalence as well as balanced; confidence intervals are bootstrapped; and false positives are adjudicated by a board-certified addiction medicine specialist. It does not reach A: not preregistered, no replication, and a single 8B model family is tested.'
  design_caveat: The reference labels are themselves semi-manual, seeded by a NIDA keyword search over MIMIC-III, so notes containing stigmatizing language in no listed term could not enter the stigmatizing class at all; the paper's own error analysis shows the models found such notes. Only about 4,000 of 77,104 examples are the hard case of a listed term used non-stigmatizingly, which the authors name as a limitation. All LLM work uses models of 8B parameters or fewer due to memory constraints. The external cohort is 89% White against 67% in MIMIC, so generalisation across the demographic shift is untested.
