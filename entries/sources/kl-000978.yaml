  grade_reasoning: 'A policy brief in a peer-reviewed journal, nine authors across six institutions in Israel with 53 references, issuing recommendations rather than reporting data. Graded n/a on the guidance branch. Authority is credible_secondary rather than recognized_reference: the recommendations are the authors'' own rather than a professional body''s, and the empirical claims it carries are restatements of studies reachable directly. It is not single_author_position: nine authors, several institutions, and a substantial reference base rule that out. Notably the authors themselves flag the heterogeneity of their own evidence base.'
  design_caveat: |
    The authors state their adoption figures come from a mixed base of industry reports, charity-commissioned polls, peer-reviewed studies and preprints with varying definitions of 'mental health use'. The brief is an expanded English translation of a Hebrew article published on hebpsy.net on 4 July 2025, so the authorship predates the 2026 dateline by roughly a year, and several references it carries (Cheng 2026, Moore 2026, Hadar Shoval 2026) postdate that original and were added for this version. A large language model was used for language polishing and reference checks, disclosed by the authors.
  author_disclosure: |
    Multiple self-citations: refs 2, 14, 18, 21, 26, 39, 45, 46, 48, 53 are by overlapping subsets of this author group, including the AI CARE framework, the SAFE AI protocol, and the N = 584 survey whose figures the brief reports. The two boxed frameworks presented as recommendations (SAFE AI, the AI CARE model) are the authors' own prior work.
