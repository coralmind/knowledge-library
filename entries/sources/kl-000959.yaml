  grade_reasoning: Peer-reviewed in Computers in Human Behavior with a sound mixed-method design whose causal language is hedged as 'possibility' and 'mechanism' rather than asserted, so it earns B; it falls short of A because it is not preregistered, is not a replication, and the two survey samples (62 and 123) are small and self-selected from Replika fan communities, as the authors themselves state in Section 5.
  design_caveat: 'Both quantitative studies are cross-sectional and the mediation model (anthropomorphism and authenticity to social interaction to attachment) is estimated from single-wave data, so the directional ordering is imposed by theory rather than measured. The authors say as much: they call for experimental work ''to test the causality between constructs in a controlled environment''.'
