  grade_reasoning: 'A coding manual, graded n/a on authority, and an absent N or methods section is not a defect in this genre. Authority is recognized_reference for the change-talk and counter-change-talk constructs: CLEAR is issued by CASAA at the University of New Mexico, the institutional home of motivational interviewing, and derives directly from Miller''s MISC 1.0 and MISC 2.1, which are the standard instruments in this literature. The second author is Theresa Moyers, an author of the MITI. It carries no psychometric report of its own, which is why it is an instrument specification rather than an instrument validation, and it states its own reliability thresholds by reference to Cicchetti (1994) rather than reporting achieved values.'
