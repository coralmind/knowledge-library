  grade_reasoning: 'An arXiv preprint with no venue stamp, which falls to C under the preprint rule. The design fits its claims unusually well for a fairness audit: the whole point is that a behavioral audit cannot render a verdict without a computable reference, and the synthetic generating process is what makes the reference computable, which the paper argues is a precondition rather than a convenience. Verdict criteria are fixed in advance, evaluation items are shared across conditions and models so comparisons are paired, quantities are recomputed from raw per-call records, and the headline results replicate on two fresh generating-process draws for two models. Exploratory and post-hoc analyses are labelled as such.'
  design_caveat: Two authors at one institution. The population is synthetic and the paper says so, anchoring to seven public clinical datasets on covariance structure only and not on outcome realism. The evidence sweep covers proxies contributing up to one third of outcome variance, so the regime where proxies dominate is untested. GPT-5.6 Terra runs on a non-isomorphic serving channel and is reported separately throughout. Whether importance weighting corrects the distribution-shift term is left unresolved because the residual is too imprecisely estimated. The paper states that its evidence-warranted reference is statistical and task-conditional and does not by itself establish that any level of reliance is legally permissible or morally justified.
