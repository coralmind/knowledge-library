  grade_reasoning: 'Peer-reviewed in JMIR Mental Health and, judged as a review on its own terms, it carries everything a review is supposed to: a reproducible search string, a defined window, dual independent coding at both the taxonomy and tagging stages, third-party adjudication of disagreements, and a public database of the coded results. The claims stay inside what the design supports, and the Limitations section names four real constraints including the one that matters most, that bill and tag counts are activity metrics rather than quality metrics. Not A because there is no preregistered protocol, no reported inter-rater statistic for the coding, and no replication. n_reported is 793, the number of bills screened; 143 entered the final analytic sample.'
  design_caveat: 'A cross-sectional snapshot of proposed and enacted text as it stood on 19 May 2025, mid-legislative-session, so enactment counts are already stale and the authors decline to compare enacted against unenacted bills for that reason. Keyword retrieval from a single aggregator missed at least one substantively relevant bill the authors identify themselves, North Carolina HB 934. The tagging is presence-based and descriptive, recording only that a topic appears, not how strongly or how enforceably. US state law only, so nothing here transfers to other jurisdictions. Conflicts are extensive but fully declared: one author holds investments in AI companies, another has consulting and speaking relationships across many pharmaceutical firms, and the senior author is Editor-in-Chief of the journal that published it.'
