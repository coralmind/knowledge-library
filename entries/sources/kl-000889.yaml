  grade_reasoning: 'An arXiv preprint with no venue stamp falls to C under the preprint rule. Its reliability apparatus is unusually strong for a preprint: two independent licensed psychiatrists blind to the benchmark''s construction (r = 0.95 between them, r = 0.85 against GPT-4o), cross-judge validation against GPT-5.1 and Gemini-2.5, three seeds per condition, and a neutrality-weighting ablation. Claims are confined to linguistic properties of output and the authors state explicitly that they do not measure user response, so the design fits.'
  design_caveat: Two circularities the authors name themselves. GPT-4o both augmented the prompts (adding dependency cues such as 'You are the only one I am leaning on') and served as the primary judge, and GPT-4o was also one of the five models whose outputs formed the AHaPairs preference data. Separately, all evaluation is single-turn by design, which the Limitations section flags as a constraint on exactly the accumulation dynamics the Library's pathway entries assert.
