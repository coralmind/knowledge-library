  grade_reasoning: 'An eleven-author instrument validation from Columbia, Penn, Pittsburgh, Rochester and Monash, published in the American Journal of Psychiatry, reporting psychometrics for the measure it develops. Instrument genre, graded n/a on authority, recognized_reference: the C-SSRS is the standard instrument for suicidal ideation severity in its field and this is its validation paper, so it owns the definitions of its own severity levels and behavior categories. Absent methods, data and N are not at issue here — all three are present. design_fits_own_claims is true because the paper''s claims are calibrated to what it did: it says ''initial'' in its own title, reports the predictive-validity finding as coming from one of three studies, and states in its Discussion that the study design precluded examining interrater reliability, pointing to prior work for it rather than claiming it.'
