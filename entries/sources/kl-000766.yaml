  grade_reasoning: 'Graded on the EACL 2026 long-paper version. Peer-reviewed, and the design fits its claims, which are confined to how far LLM judges agree with expert raters: 10,000 conversations from three counseling sources, 1,000 of them rated on seven attributes by three psychiatrically trained raters blind to response source, and two ICC variants with bootstrap confidence intervals, each judge''s own responses excluded. The limitations are ordinary but bear on use: each ICC is computed over model-level means for nine models, so every reliability figure rests on nine units; no agreement among the human raters is reported, so the expert reference is of unstated reliability; and one of the three source datasets was rephrased by ChatGPT-4 before inclusion. B.'
