  grade_reasoning: 'An industry concept paper released for public comment rather than through peer review, describing a benchmark that its own text says is still under development and not yet validated. It is nonetheless unusually candid: it reports its judge''s leniency against clinicians, its own clinician disagreement rate, and its saturation problem, and it confines its claims to preliminary findings and design intent, so design_fits_own_claims is true. The unknown review status gives C under the first derivation rule. Conflicts are industry_authored because Spring Health is a mental health company publishing an evaluation standard for the sector it operates in, which is recorded rather than treated as a defect.'
