  grade_reasoning: Real longitudinal transcript data at very large message volume (390,447 messages from nineteen people who submitted their chat logs through a community support group or media contacts), latent-influence models fitted by maximum marginal likelihood, and a likelihood-ratio comparison of a bidirectional model against a unidirectional one. design_fits_own_claims is true because the paper frames its result as temporal dependence rather than causation and says so explicitly. The LLM annotations behind every dependent variable are checked against three human raters (precision .75 and recall .82 for chatbot messages, .67 and .80 for user messages, with Fleiss's kappa of .60 and .53 among the raters). It is a preprint with a small self-selected sample, which caps it at C.
