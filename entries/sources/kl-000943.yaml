  grade_reasoning: 'Published at LREC-COLING, a peer-reviewed venue, which would ordinarily give B. `design_fits_own_claims` is false for a defect visible in the paper''s own tables. The automatic metrics score the fine-tuned models against reference answers that are ChatGPT outputs from the same prompt used to build the training set, so the paper measures how closely a fine-tuned model reproduces the generator it was distilled from, not response quality. The paper claims CBT-LLM ''significantly outperforms existing models'' three times, and no row for any non-CBT-LLM system appears anywhere in Table 4 or Table 5: both tables report only CBT-LLM variants by backbone. The human evaluation covers two of the four backbones and reports differences of 0.002 to 0.136 on a 0-2 scale, with no agreement statistic and no significance test.'
  design_caveat: |
    Circular reference standard: gold answers are ChatGPT outputs from the same CBT prompt used to generate training data, so BLEU against them measures distillation fidelity. The claimed outperformance of baselines is not supported by any table in the paper. The cognitive-distortion labels underlying Table 2's counts are themselves model-generated, which the Limitations section concedes. The human evaluation used four senior psychology students and one psychotherapist on 100 samples with no reported agreement. The single case study in Figure 4 is the only response shown.
