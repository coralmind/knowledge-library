  grade_reasoning: 'Preprint with no venue stamp, which caps at C under the rubric. The design is otherwise strong for what it claims: a five-week two-arm longitudinal study with stratified balancing on gender identity, AI usage tendency and self-reported mental health condition, six measurement waves, validated instruments, difference-in-difference estimation with a baseline-usage control arm, and a temporal robustness model. The authors describe it as exploratory throughout and do not overreach to causal language, so design_fits_own_claims is true.'
  author_disclosure: Jina Suh (Microsoft Research), who leads the project this catalog belongs to, is the tenth author. Eight of the ten authors are at Microsoft or Microsoft Research, and the study evaluates Microsoft Copilot alongside three competitors. No conflicts statement was found in the paper's text.
