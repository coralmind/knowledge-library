  grade_reasoning: 'No venue stamp, volume, or DOI appears anywhere in the document, so it is graded as a preprint, which caps at C. The design does fit its claims: the conclusions are about documentation-task performance, the expert panel is real and clinically qualified, and the authors state plainly that the models are not yet reliable for clinical applications. The C reflects the venue, not the work.'
  design_caveat: The source conversations are pre-processed transcripts of counselling videos taken from YouTube, so they are demonstration or published sessions rather than routine care, and the authors state the sample represents an American demographic. The five expert raters are the same five who informed the annotation guidelines, so rater independence from the dataset construction is not established. Table 6 reports means and variances across five raters but no inter-rater reliability coefficient, and Table 7 reports hallucination counts averaged over raters rather than agreed labels. Only open-source models under 7B parameters were tested; no closed frontier model appears.
