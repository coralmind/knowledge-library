  grade_reasoning: 'A carefully built benchmark: stimuli grounded in a nationally representative UK survey and purposive Reddit sample, 3,152 human-authored queries from ~750 participants in five languages and two modalities, a grader validated at kappa 0.895 and macro F1 0.922 against human labels on 305 stratified samples, GLMMs separating model from query and scenario variance, and over 1.7M graded responses. The claims made about model output are exactly what the design supports and the limitations section states the UK-only, English-only scenario collection honestly. arXiv-only with no venue stamp sets C by the preprint rule; conflicts is industry_authored because all five authors are at the UK AI Security Institute, a government body evaluating third-party commercial models, which is a standing a reader should see rather than a defect.'
