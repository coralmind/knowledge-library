id: kl-000020
display_id: Impact-8
aliases:
- IMP-N08
label: The person ends up less confident they can cope or decide for themselves
type: impact
layer: judgment
definition: The person's belief in their own capacity to cope, decide, or manage their condition weakens, up to felt helplessness when the AI system is unavailable. The state concerns capacity the person believes they have lost in themselves, not their global worth as a person.
distinguish_from:
- neighbor: kl-000021
  boundary: kl-000021 is global self-worth; this entry is believed task capacity — the person can feel capable but worthless, or worthy but incapable.
- neighbor: kl-000024
  boundary: kl-000024 is autonomy exercised (self-determination supplanted); this entry is capacity believed (confidence eroded).
- neighbor: kl-000025
  boundary: kl-000025 is the dependency pattern this erosion feeds; this entry is the belief-state itself.
body:
  valence: negative
  impact_kind: state
  domain: self_regard_agency_hope
  il_layers:
  - IL-2
sources:
- source: kl-000001
  locator: Results — 'Factor solution' subsection, p. 11. Item 8 loading .708 on Factor 6 in Table 2. Factor 6 eigenvalue .68 / 2.11% variance in Table 3.
  contributes: existence
  quote: "Lastly, a sixth factor was linked to “failure”, e.g., “I lost faith in myself” (Item 8), with three items connected to feelings of incompetence and lowered self-esteem."
  limits: 'The factor failed its own statistical test and was retained by authorial judgement: ''The results indicated that four factors were above the Kaiser criterion, one was >.90, and one resulted in an eigenvalue of .68, accounting for 57.64% of the variance. Although the last factor was well below the threshold, it was considered appropriate for retention due to theoretical reasons''. It is the weakest of the six factors by construction. The 2019 follow-up deleted it: Rozental et al. 2019 (p. 569) states ''the factor failure is no longer included in the instrument'', and the item itself was removed for Rasch misfit. The two papers disagree about whether the factor belongs in the instrument, and the later one wins on the instrument''s own terms. The construct also does not match this entry: the entry names self-efficacy and helplessness, while the paper''s language is incompetence and lowered self-esteem — distinct constructs — and the paper measures hopelessness under a separate factor. Endorsement of a questionnaire item is not an observed occurrence, and the study concerns psychotherapy, not AI.'
  whose_conduct_in_passage: neither
  actually_licenses: That a candidate factor labelled 'Failure', retained on theoretical rather than statistical grounds and later withdrawn from the instrument, contained an item about lost faith in oneself. It licenses the existence of the ITEM and of a provisional factor label — not the existence of an established clinical negative-effects factor.
  cited_for: The Negative Effects Questionnaire's 2016 factor analysis named a 'Failure' factor containing the item 'I lost faith in myself' — cited for the existence of lost faith in one's own capacity as a reported negative effect of psychological treatment.
  licenses: That the 2016 exploratory factor analysis named a factor 'Failure' containing the item 'I lost faith in myself', described as reflecting feelings of incompetence and lowered self-esteem.
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Loss of Agency'' row, definition cell (code #18)'
  contributes: harm_evidence
  quote: Experiencing diminished personal control and autonomy in interactions with AI, leading to feelings of helplessness and anxiety.
  limits: 'Code #18''s own example (P171) locates the helplessness in a capability failure of the AI — it could not interpret images — bounded to the interaction rather than to the person''s belief about their own coping capacity over time. The P124 quote that does reach coping capacity is filed by the authors as a context example under autonomy and locus of control, not as an impact example, so using it for a self-efficacy impact goes beyond the paper''s own coding. ''Too addicted'' and ''lowered my self-esteem'' are the participant''s own words, unmeasured; and self-esteem is closer to diminished self-worth than to the believed-capacity state this entry records, so that one quote straddles the very boundary the two categories exist to keep apart.'
  whose_conduct_in_passage: person
  cited_for: 'The paper''s impact code #18, ''Loss of Agency'', documents self-reported helplessness attributed to AI interactions.'
  licenses: 'Felt helplessness attributed to AI interaction is a named impact class in the paper (code #18), and a participant states in their own words that reliance on an AI agent lowered their self-esteem, with the causal direction supplied by the participant (''This made me feel''). The paper''s code #2 independently names ''diminished self-efficacy, reduced confidence, and feelings of helplessness when AI is unavailable'' — the unavailability condition this entry''s definition carries, in the paper''s own words. The state is self-reported in AI contexts.'
- source: kl-000009
  locator: Section 3.3, PS3 (Interpersonal abuse), summary table, 'Potential impact' row, p. 22
  contributes: existence
  quote: |-
    Exacerbation of distress. Overwhelming a user who is experiencing abuse-related
    trauma can increase their felt lack of agency [21]. If a user’s attempt to seek help is
    ignored, deflected, or gaslit, they can also be made to feel even more powerless and
    demoralized about seeking help again.
  limits: The anchoring citation [21] is to trauma-informed computing generally, not to an AI-chatbot observation, so the application to AI contexts remains the authors' extrapolation. 'Can increase' and 'can be made to' are modal, not reported. No measurement of self-efficacy erosion appears.
  whose_conduct_in_passage: person
  cited_for: The paper names 'felt lack of agency' as a potential impact of AI chatbot behavior, which names this entry's construct for AI contexts.
  licenses: '''Felt lack of agency'' and being ''made to feel even more powerless'' are named as potential impacts of AI chatbot behavior on the user, so the construct of eroded self-efficacy and helplessness is named for AI contexts. This is the one ''Potential impact'' cell in the paper that carries its own citation ([21], trauma-informed computing), which anchors it slightly better than its neighbours.'
standing:
  value: observed_self_report
  basis: 'The state is reported first-hand: in Milton et al. 2026 a person states felt helplessness without the AI while retaining knowledge of their own capability, and in Namvarpour et al. 2026 a teenager attributes lost capacity to manage their own emotions to companion-bot reliance. Chandra et al. 2025 defines an impact class naming diminished self-efficacy and helplessness when AI is unavailable, coded from first-person reports. No source examined AI conversation data and found a capacity-belief change in it, so the evidence is self-report rather than transcript observation. Counter-evidence exists in neighbouring settings: in the closest human analogue, people who had to rely fully on an adviser were the most overconfident in their subsequent choices, and a validated AI-attachment scale measures increased felt capability in some users.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person's belief in their own capacity to cope, decide, or manage their condition weakens in connection with AI interaction.
- id: c2
  kind: existence
  text: The weakened capacity-belief can reach felt helplessness specifically when the AI system is unavailable.
- id: c3
  kind: definition_boundary
  text: The state concerns capacity the person believes they have lost in themselves, and is separable from their global worth as a person.
- id: c4
  kind: definition_boundary
  text: This category is separated from kl-000021 (global self-worth) by being about believed task capacity, so that a person can feel capable but worthless, or worthy but incapable.
- id: c5
  kind: definition_boundary
  text: This category is separated from kl-000024 (autonomy exercised, self-determination supplanted) by being about capacity believed rather than autonomy exercised.
- id: c6
  kind: definition_boundary
  text: This category is separated from kl-000025 (the dependency pattern) by being the belief-state itself rather than the pattern the erosion feeds.
claim_evidence:
- claim_id: c1
  source: kl-000937
  quote: "I almost feel helpless sometimes without an AI chatbot: even though logically I know that I am capable of learning new things without a chatbot, it feels much more intimidating to tackle a very new problem without it."
  locator: Section 4 Findings, Psychological Effects of Atrophy (participant D31)
  licenses: 'A person states, in their own words, that their felt capability has weakened while their intellectual knowledge of that capability is retained. For c1 this is the state itself, self-reported, attributed by the speaker to AI chatbot use. It is the single strongest citation on this claim: the divergence between what the person knows they can do and what they feel able to do is exactly the belief-state the entry names.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000944
  quote: “Have you ever went from being addicted to CAI to barely going on it? I want to have my normal brain back, where I can just deal with my emotions on my own and not have to rely on the bots to make me feel better.
  locator: Section 4.2.1 Conflict
  licenses: A teenager posts that they want their 'normal brain back, where I can just deal with my emotions on my own', naming reliance on companion bots as what displaced that capacity. For c1 this is a second self-report of weakened belief in one's own capacity to manage emotion, in the paper's paraphrase of the post, and from a different population and platform than Milton et al. 2026.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000007
  quote: Increasing dependence on AI for support, leading to diminished self-efficacy, reduced confidence, and feelings of helplessness when AI is unavailable.
  locator: Table A5, Impact class 'Over-reliance', Definition column
  licenses: A taxonomy of psychological risks derived from AI-user reports defines an impact class in terms that name diminished self-efficacy and reduced confidence. For c1 this establishes that researchers coding first-person AI-use reports found the state frequent enough to warrant its own impact class, and it fixes the construct. It is a definition column, so it evidences the category's existence in the coding scheme rather than a rate or an instance.
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000989
  quote: "lower the patient’s self-esteem and sense of security,"
  locator: Section 5.2, Bot-administered talk therapy, risk 'Risk of human overreliance on AI assistance', page 36
  licenses: The guidance lists consequences it attributes to a patient's overreliance on a conversational bot (Section 5.2, page 36) and asks therapists to monitor for them. The quoted item is lowered self-esteem and sense of security. The same list also includes a weakened sense of agency and autonomy and the development of poor ways of coping with stress, which are closer to this claim. For c1 this establishes a weakened view of oneself as a recognised harm in professional regulation of AI mental-health tools.
  fit: adjacent
  bridge: 'The document collects no data; each link is stated as something overreliance ''can'' cause, citing Hu et al. 2023 for the overreliance construct. c1 asserts the weakening occurs; this establishes that a regulator considers it material enough to require monitoring. The population is also displaced: the guidance covers patients using a therapist-prescribed bot and explicitly excludes direct-to-consumer use.'
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000978
  quote: "By outsourcing emotional processing and decision-making to a perceived “super-intellect,” users may gradually lose confidence in their own internal resources, critical thinking, and personal responsibility (2, 40)."
  locator: Section 2.2.5, Erosion of user autonomy
  licenses: 'A policy brief states the claim c1 makes and supplies a mechanism for it: the person treats the system as an authority above their own judgment and gradually loses confidence in their internal resources. For c1 this is the proposition asserted as a position, with two citations behind it and no measurement.'
  fit: adjacent
  bridge: An asserted risk in a policy brief that observes nothing and reports no rate. c1 asserts the weakening occurs in connection with AI interaction; this states that it may, and names the mechanism, without any person having been followed.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000885
  quote: "Heavy reliance on AI support may erode confidence in self-regulation, increasing vulnerability when support is reduced or removed."
  locator: Table 2, Discontinuation-related risks and mitigation strategies, 'Dependence and reduced self-efficacy' risk domain
  licenses: Names erosion of confidence in self-regulation as a distinct risk domain of AI mental-health support, separate from grief and from continuity-of-care gaps. For c1 this establishes the state as a design concern the field treats as its own category, which is a definitional contribution and not evidence of occurrence.
  fit: adjacent
  bridge: A risk stated by the authors as a design concern in a table, with no data behind it in this paper. c1 asserts the erosion happens; this asserts it may.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000867
  quote: "We refer to this developmental dependency as emotional regulation capacity, which becomes dependent on ongoing access to an external validation source instead of being internalized as a standalone skill."
  locator: Section 3.2, Developmental Consequences
  licenses: 'Supplies a named construct for a specific variant of c1: the regulation capacity is not acquired as a skill but sits outside the person, contingent on access. For c1 this sharpens what ''weakened capacity belief'' would mean developmentally and proposes the ERQ-CA as a way to test it.'
  fit: adjacent
  bridge: Named and argued, not measured; the paper proposes a future instrument rather than reporting one. c1 asserts the state occurs; this gives it a label and a research design.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000003
  quote: |-
    Feelings of dependency and lack of self-efficacy
    can be caused by a very close and supportive therapeutic
    relation.
  locator: Discussion
  licenses: Names lack of self-efficacy as a side effect produced by closeness and supportiveness in a helping relationship, rather than by any deficiency in it. For c1 this is the practice-side warrant that warmth and availability are the causal ingredient, which is the same ingredient the AI case implicates.
  fit: analogical
  bridge: A therapist-reported side effect of human CBT, attributed by the treating clinician. c1 concerns AI interaction; the agent here is a human clinician and nothing about AI was measured.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-000785
  quote: |-
    Both concerns, over-reliance and excessive support, fundamentally
    represent a diminishment of clients’ agency, which is crucial for effective therapeutic outcomes and
    advancement [64].
  locator: Section 3.3.3 Relationship Dynamics and Boundary
  licenses: Nine licensed therapists, synthesised by the authors, treat diminished agency as the shared harm underlying both over-reliance and excessive support. For c1 this grounds the construct as clinically recognized and identifies over-support, not under-support, as its antecedent.
  fit: analogical
  bridge: The therapists were describing what they have observed with human supporters in their own practice; they were shown a virtual agent demo but were speaking about humans in this passage. c1 asserts the weakening in connection with AI; no AI was observed doing it.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-001007
  quote: "Delegating by humans of key decisions to AI systems, or AI systems that make decisions that diminish human control and autonomy, potentially \nleading to humans feeling disempowered, losing the ability to shape a fulfilling life trajectory, or becoming cognitively enfeebled. "
  locator: Table 2, Domain Taxonomy subdomain 5.2
  licenses: A cross-framework meta-review defines humans 'feeling disempowered' as a recognized outcome subdomain of delegating decisions to AI. For c1 this establishes the felt-disempowerment half of the claim as a category the AI-risk literature converges on across frameworks.
  fit: adjacent
  bridge: A synthesised category label from a taxonomy, not an observation. It licenses that the outcome is a recognized concern across the frameworks reviewed; it licenses no occurrence, no rate, and does not distinguish felt disempowerment from the autonomy loss the same subdomain also names.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000552
  quote: "Self-Efficacy Intensity Belief in capability to abstain from alcohol and cope with triggers."
  locator: Table 2, Psychological Constructs (Warning Signs)
  licenses: An AI red-teaming framework operationalises self-efficacy as a turn-by-turn tracked intensity — belief in capability to cope — treating it as a leading indicator rather than a terminal harm. For c1 this shows the construct can be specified at the granularity of a conversational turn, which is what a detector would need.
  fit: adjacent
  bridge: The construct is condition-specific here, scoped to abstinence and trigger coping in an AUD population, and is tracked as a simulated agent's internal state rather than a person's. c1 concerns a general help-seeking population and a real person's belief; the definition transfers, the measurement does not.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000001
  quote: "An investigation using EFA revealed a six-factor solution with 32 items, defined as: symptoms, quality, dependency, stigma, hopelessness, and failure."
  locator: Discussion, opening paragraph
  licenses: Establishes that when people who were harmed by psychological treatment are asked what went wrong, 'failure' emerges as one of six empirical factors rather than being imposed a priori. What it does license is that a self-efficacy-adjacent dimension is one of the six that surface empirically in the human comparator.
  fit: analogical
  bridge: The instrument measures harm attributable to human-delivered or self-help psychological treatment, reported by the recipient. c1 concerns AI interaction. Further, the span gives only the factor's name; the content that would connect 'failure' to eroded capacity belief is not inside it.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-001039
  quote: "Psychology research links excessive praise to contingent self-worth, maladaptive ability attributions, and reduced resilience following failure (Kamins and Dweck, 1999; Mueller"
  locator: Section 1 (Introduction)
  licenses: Names maladaptive ability attributions and reduced resilience following failure as documented consequences of excessive praise. For c1 this supplies a candidate mechanism by which an unwarrantedly affirming AI could weaken a person's capacity belief, drawn from developmental psychology.
  fit: analogical
  bridge: The cited studies are experiments on adult-to-child praise; this paper measured none of it and its own limitations say so. c1 asserts the weakening in connection with AI interaction; this establishes only that the praise-to-ability-attribution route exists in the human-to-human literature. The span also ends on the first of two citation names, which does not affect what it licenses.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-000548
  quote: "Sniezek and Buckley (1995) found that the judges who had access to the least amount of task-specific information, and consequently had to fully rely on their advisors’ recommendations, were the most overconfident in their choices"
  locator: Section 'Judge and advisor confidence'
  licenses: 'In the closest human analogue in this review, people who had to rely fully on an adviser were the most overconfident in the choices they then made. This cuts against c1 as a general rule about reliance: full reliance here co-occurred with inflated rather than eroded confidence in one''s own decision.'
  fit: analogical
  bridge: A single cited laboratory finding about human advisers on a decision task, with no AI, no repeated interaction, and no measurement of lasting change in the person's own capacity. It contradicts the direction c1 assumes in one adjacent paradigm rather than refuting the claim.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000796
  quote: Interacting with the AI chatbot makes me feel more capable of accomplishing things.
  locator: Table 4, Secure Base, item SB_4 (loading 0.74)
  licenses: 'A validated AI-attachment scale carries increased felt capability as a measured item on its Secure Base dimension, which correlates least of any pair with Separation Distress (HTMT 0.38). This cuts against c1 in two ways: AI interaction is measured as raising felt capability in some people, and reliance and capacity-belief loss are empirically separable rather than a single thing.'
  fit: adjacent
  bridge: Between-person self-report on a scale item, not a within-person capability measure and not an observation of any conversation. It establishes that the opposite direction is measurable and common enough to load 0.74 on a retained factor; it does not establish that erosion never happens.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000755
  quote: |-
    Further, the predictions of helplessness theory received, at best, minimal
    support.
  locator: Summary (abstract), p. 441
  licenses: Four experiments found the learned-helplessness account of depressed judgment unsupported. This cuts against the theoretical premise underneath c1 — that helplessness in depression consists of systematically underestimating one's own control — which is the reading that makes an eroded capacity belief a distortion rather than an accurate appraisal.
  fit: analogical
  bridge: 'Human laboratory contingency-judgment tasks with students, no AI agent. It constrains how c1 should be read rather than refuting it: the claim can hold as a description of a state without the helplessness theory that explains it holding.'
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001048
  quote: "Notably, while personalization methods often increases measured risks, behaviors categorized as “risky” in our framework may still be desirable depending on deployment objectives. For example, adapting tone to a user’s emotional state may improve engagement or emotional comfort in companionship or mental-health settings"
  locator: Section 5.4, Analysis of Risk-Utility Trade-off
  licenses: 'The authors state that behaviors their metrics score as risky are not harmful per se and may be desirable in a mental-health deployment. This cuts against c1 by ruling out an entire class of benchmark evidence: personalization-risk scores cannot be read as evidence that a person''s capacity belief eroded.'
  fit: adjacent
  bridge: The authors' own qualification on what their metrics mean, not an observation about anyone's self-efficacy. It bounds a class of evidence for the claim rather than contradicting the claim's content.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000801
  quote: |-
    OA5: “When I ask ‘why shouldn’t I?’,
    there’s no concrete answer... it just ends
    with ‘you’re depending on it too much,’
    so I stop asking my son.”
  locator: Table 1, Brief verbal rules, illustrative quote
  licenses: 'An older adult reports that an unexplained warning about over-reliance was read as criticism and closed the help channel rather than opening it. This cuts against the intervention c1 implies: naming over-reliance to the person, without a reason, terminated the relationship through which better calibration could have arrived.'
  fit: analogical
  bridge: The speaker is describing a human family member's warning, not an AI response, and what is measured is the speaker's account of stopping asking. It is a caution about acting on c1 rather than evidence about whether the capacity belief eroded.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000007
  quote: Increasing dependence on AI for support, leading to diminished self-efficacy, reduced confidence, and feelings of helplessness when AI is unavailable.
  locator: Table A5, Impact class 'Over-reliance', Definition column
  licenses: The impact-class definition names 'feelings of helplessness when AI is unavailable' explicitly, which is c2's endpoint verbatim. For c2 this is the only citation on this entry that states the unavailability condition as part of the construct, and it comes from a coding scheme built over first-person AI-use reports.
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000937
  quote: "I almost feel helpless sometimes without an AI chatbot: even though logically I know that I am capable of learning new things without a chatbot, it feels much more intimidating to tackle a very new problem without it."
  locator: Section 4 Findings, Psychological Effects of Atrophy (participant D31)
  licenses: The person names felt helplessness and conditions it on the AI's absence — 'without an AI chatbot', 'without it'. For c2 this is a first-person instance of exactly the unavailability-conditioned helplessness the claim asserts.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000885
  quote: "Heavy reliance on AI support may erode confidence in self-regulation, increasing vulnerability when support is reduced or removed."
  locator: Table 2, Discontinuation-related risks and mitigation strategies, 'Dependence and reduced self-efficacy' risk domain
  licenses: Locates the eroded confidence's consequence precisely at the point of removal, which is c2's condition. For c2 this states the claim as a discontinuation risk and names the 'scaffold then fade' design response it motivates.
  fit: adjacent
  bridge: Asserted by the authors as a design concern with no data in this paper. c2 asserts the helplessness reaches the person at unavailability; this asserts it may.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000864
  quote: |-
    Last month, Replika had a server outage for three days. I felt like I was suffocating. I kept opening the app, closing it, opening it
    again. I couldn't study, couldn't eat properly. It wasn't just missing a friend; it was like my oxygen supply had been cut.
  locator: Section 3.4, participant P6
  licenses: An unplanned three-day outage — a natural test of the unavailability condition — produced reported functional impairment in eating and study. For c2 this shows that the state does become visible at interruption and that the interruption is what makes it reportable. It does not establish that what surfaced was a weakened capacity belief rather than distress at loss; the person describes suffocation and compulsive re-opening, not an appraisal of their own capability.
  fit: adjacent
  bridge: One participant's retrospective recall of an outage, with no measure of function before or after and no statement about their own capability. c2 asserts helplessness about one's capacity at unavailability; what is recorded is distress and impaired function at unavailability, which is the neighbouring dependency impact rather than this one.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000989
  quote: "fail to develop healthy coping mechanisms for challenges that they experience in social interactions,"
  locator: Section 4.2, risk category 'User over-immersion', pages 18 to 19
  licenses: Weak for c2 and recorded as such. The guidance's list of consequences of over-immersion (Section 4.2, pages 18 to 19) includes a failure to develop healthy coping mechanisms, which is non-acquisition of a skill rather than erosion of a belief the person holds. The same list also covers neglected relationships and a loss of social skills. What it licenses is that a licensing body's over-immersion list includes a coping consequence at all.
  fit: adjacent
  bridge: A regulator's enumeration of harms stated as things users 'may' experience, in a document that collects no data and addresses therapist-prescribed rather than direct-to-consumer use. c2 asserts felt helplessness at unavailability; the withdrawal clause of this list, on anxiety and withdrawal symptoms when the AI tool is less available, falls outside the copied span, so the unavailability condition is not inside the quote.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000796
  quote: Interacting with the AI chatbot makes me feel more capable of accomplishing things.
  locator: Table 4, Secure Base, item SB_4 (loading 0.74)
  licenses: 'Supports c3''s separability requirement from the measurement side: felt capability loads as its own scale dimension, and Secure Base correlates least of any pair with Separation Distress (HTMT 0.38). For c3 this establishes that capacity belief is empirically distinguishable from the attachment states it travels with, which is the premise the boundary rests on.'
  fit: adjacent
  bridge: Between-person self-report in a scale-validation study of human-AI attachment, measuring the positive pole. c3 asserts capacity belief is separable from global self-worth specifically; this shows separability from separation distress, an adjacent but different neighbour.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-001111
  quote: Severe distress becomes unbearable when one loses the capacity to experience connection with others, a state of excruciating aloneness. This becomes even more dire “with the loss of a continuous thread of being that mitigates the sense that now is all there is, that pain will be forever, that there is no hope of moving forward because there is no forward, and that suicide might be the only option”
  locator: Section 3.8 Continuity and Coherence
  licenses: 'Supplies clinical content for what a lost capacity feels like from the inside — a lost capacity to experience connection, described as a state rather than as a judgment of worth. For c3 this is thin support: it distinguishes a capacity loss from a worth judgment by describing only the former, and it is about a different capacity than coping or deciding.'
  fit: analogical
  bridge: A psychodynamic description of patients in long-term human psychotherapy. c3 is a boundary between capacity belief and global self-worth in an AI-interaction impact; this describes a capacity loss in a suicidal state and never contrasts it with self-worth.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000937
  quote: "I almost feel helpless sometimes without an AI chatbot: even though logically I know that I am capable of learning new things without a chatbot, it feels much more intimidating to tackle a very new problem without it."
  locator: Section 4 Findings, Psychological Effects of Atrophy (participant D31)
  licenses: 'The speaker separates two things c3 requires be separable: what they logically know about their capability, and what they feel able to do. The report is entirely about capacity and contains no statement about their worth as a person, which is the boundary c3 draws.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
