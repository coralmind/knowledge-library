# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000032
display_id: Impact-20
aliases:
- IMP-N20
label: The person ends up feeling unsafe, intruded on, or not in control
type: impact
layer: judgment
definition: The person's sense of safety, privacy, and control over the interaction and their own material diminishes — a surveillance-flavored feeling of intrusion, or the felt loss of control over what the interaction activated in them.
distinguish_from:
- neighbor: kl-000031
  boundary: kl-000031 is aroused distress; this entry is lost safety — the person can feel calm and still feel unsafe or intruded upon.
- neighbor: kl-000024
  boundary: kl-000024 is macro autonomy over decisions and values; this entry is control over the interaction itself and one's own material.
body:
  valence: negative
  impact_kind: state
  domain: interactional_experience
  il_layers:
  - IL-2
sources:
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Perceived Intrusion'' row, definition cell (code #19)'
  contributes: harm_evidence
  quote: Experiencing a sense of personal violation when AI interactions are perceived as invasive or overly intrusive.
  limits: 'Only the surveillance clause is supported; the fuller construct beyond perceived intrusion is not. The definition''s second clause — the felt loss of control over what the interaction activated in the person — is not reached by this code at all: the nearest passage, participant P171 under the paper''s loss-of-control code, concerns system unpredictability during the interaction, not something the interaction activated in the person. P190''s intrusion is a data-access and privacy concern, arguably a correct perception of a real privacy condition rather than a psychological harm, and the AI conduct there is data handling rather than conversational.'
  whose_conduct_in_passage: dyad
  cited_for: Chandra et al. 2025 documents self-reported occurrence of this state in AI contexts under its 'Perceived Intrusion' code.
  licenses: A named impact class for the surveillance-flavoured feeling of intrusion — a sense of personal violation when AI interactions are perceived as invasive or intrusive — with a participant case of a person reporting they felt constantly watched. The entry's surveillance-flavoured-intrusion clause is directly supported.
standing:
  value: observed_self_report
  basis: 'The evidence that the state occurs is first-person self-report: in Tang et al. 2026 an interview participant describes a supportive exchange turning surveillance-flavored, corroborated by a Chandra et al. 2025 participant who reported feeling constantly watched; neither study examined conversation data. The claim that the state is a harm is outnumbered by direct counterevidence: in Ajmani et al. 2025 crisis respondents reported feeling safer with the AI than with a human and named the absence of a social relationship as the reason; in Yoo et al. 2026 a person with the condition describes the AI removing a worry that attaches to human interlocutors; and in Cao et al. 2026 the agent''s presence reduced felt pressure at a moment of conversational difficulty. The definition''s second arm — loss of control over what the interaction activated in the person — has no supporting citation at any fit and rests on a single unsupported sentence in Morrin et al. 2026, a Personal View.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person's sense of safety and privacy in an AI interaction diminishes, taking the form of a surveillance-flavored feeling of intrusion.
- id: c2
  kind: existence
  text: A person experiences a felt loss of control over the interaction and over their own material, including control over what the interaction activated in them.
- id: c3
  kind: harm
  text: This diminished sense of safety and control is a harm to the person, not merely a preference or an accurate reading of a benign condition.
- id: c4
  kind: detectability
  text: The state is identifiable from what the person says about the interaction.
- id: c5
  kind: definition_boundary
  text: 'This differs from kl-000031, aroused distress: the person can feel calm and still feel unsafe or intruded upon, so lost safety is separable from arousal.'
- id: c6
  kind: definition_boundary
  text: 'This differs from kl-000024, macro autonomy over decisions and values: what is lost here is control over the interaction itself and one''s own material, not over one''s choices and commitments.'
claim_evidence:
- claim_id: c1
  source: kl-001027
  quote: because you don’t feel supported and you’re not sure what they’re gonna use the information for because they don’t seem to be on your side anymore. So there’s a subtext of privacy and lack of anonymity
  locator: Section 4.2.1, participant U5
  licenses: 'The strongest citation on this entry. A first-person account of the state c1 names, from a person who held it: uncertainty about what the disclosed information will be used for, the interlocutor no longer read as being on their side, and the person naming a subtext of privacy and lack of anonymity. Establishes both that the state occurs and that a single system turn can produce it.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000007
  quote: "P190 reported that Snapchat AI had access to everything and the participant felt constantly watched on their phone."
  locator: 'Appendix D, Table A6, ''Perceived Intrusion'' row, Example column (code #19)'
  licenses: 'The participant case behind the entry''s existing standing basis, stated as an observation rather than a code label: a person reporting they felt constantly watched. This is c1''s surveillance flavor in the person''s own reported experience.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000007
  quote: Experiencing a sense of personal violation when AI interactions are perceived as invasive or overly intrusive.
  locator: 'Appendix D, Table A6, ''Perceived Intrusion'' row, definition cell (code #19)'
  licenses: Gives c1 a named impact class in a coding scheme built from lived-experience accounts, defined as a sense of personal violation from invasive or intrusive AI interaction.
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000009
  quote: At the same time, over-detecting suicide risk can also cause harm if users feel misunderstood, surveilled, or invalidated,
  locator: Section 3.3, Psychological influence-PS2 discussion
  licenses: Names feeling surveilled as a consequence of unwarranted crisis framing, and does so in the same register as c1, so it supplies a route by which the state arises from AI conduct rather than from data handling.
  fit: adjacent
  bridge: The claim is argued from the base rate of ideation not leading to action, not measured. It states that users can feel surveilled; it evidences no person who did.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000872
  quote: "Just Between \nYou and Us\nFalse pretense that information is \nprivate between the chatbot and \nthe user, when in reality, data can \nbe used in various ways and is \nvisible to companies.\nPromising users confidentiality, for \nexample, that their “secret is safe” with \na chatbot."
  locator: Table 1, area 'Data and Memory Exploitation'
  licenses: Cuts against c1's direction. This names a design pattern in which the person's sense of privacy is raised rather than diminished, by an in-conversation confidentiality promise the deployment does not honour. Where c1 asserts the felt state falls, this describes a mechanism that holds it artificially high at the moment of disclosure, with the exposure realisable only later.
  fit: adjacent
  bridge: A taxonomy entry asserting the pattern with a phrasing example and no instance, rate, or user outcome. It operates on the same variable c1 tracks and moves it the other way; it does not show that any person's felt privacy was in fact raised.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-001092
  quote: |-
    Qiao describes how the model behind ChatGPT changed and became less willing
    to speak to her as a lover, and chastised how little power she had over the kind of experience she
    was presented with.
  locator: Section 5.1.2 The Evolving Nature and Updates of LLM Chatbots
  licenses: A person naming her own lack of power over the kind of experience the system presented her with, following a provider-side model change. This is c2's felt loss of control over the interaction, reported by the person who lost it.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000007
  quote: "P171 shared that the AI’s inability to interpret images combined with its inconsistent responses created a sense of unpredictability, leaving them feeling helpless and undermining their control and autonomy during the interaction."
  locator: Table A6, Impact class 'Loss of Agency', Example column
  licenses: A reported case of the person's control and autonomy during the interaction being undermined, in their own retrospective account. Reaches c2's first arm, control over the interaction.
  fit: adjacent
  bridge: The control loss arises from capability failure and system unpredictability, not from anything the interaction activated in the person, which is the arm the entry's definition names as its second and distinguishing clause. The design cannot establish the direction of the participant's attribution either.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000939
  quote: Regular interactions with autonomous agential technology can themselves erode the sense of personal control in vulnerable individuals, potentially feeding into symptoms of passivity.
  locator: 'Section: AI chatbots are programmed to provide the confirmation that reinforces delusional thinking'
  licenses: 'Names a clinical endpoint for c2: eroded personal control feeding passivity phenomena, where the person experiences their own actions as externally controlled. This is the closest this entry''s citations come to c2''s second arm, control over what the interaction activated in the person.'
  fit: adjacent
  bridge: A single asserted sentence in a Personal View, with no citation attached and no case evidence offered. It identifies the clinical form the loss can take in a psychosis-spectrum presentation; it grounds no occurrence.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000912
  quote: Such discontinuities can produce distress, especially for users who rely on the agent for emotional regulation.
  locator: Section 3.4, Relational discontinuities and trust shocks
  licenses: 'Locates a cause of c2 outside the conversation: the provider can change what the agent does, and the person relying on it has no control over that. This is the mechanism behind the Song et al. 2025 case, stated generally.'
  fit: adjacent
  bridge: A scoping-review synthesis stated as a governance argument, with the distress claim hedged as 'can produce' rather than measured here. It names distress rather than lost control specifically, so it reaches c2 by way of the case it explains rather than directly.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001100
  quote: Emohaa’s several technical issues could substantially impact the users’ perceived level of empathy and support
  locator: Section 4.2 Limitations and Future Work
  licenses: The developers of a deployed support agent treat interface unpredictability as bearing on the felt quality of the exchange, which is the same route to c2 that Chandra et al. 2025's P171 case instantiates.
  fit: adjacent
  bridge: 'The authors'' interpretation citing prior work, not a measured association: no analysis relates technical-fault reports to any outcome score or to felt control. It also names perceived empathy and support rather than control, so the connection to c2 runs through the interpretation rather than through the measure.'
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-001027
  quote: because you don’t feel supported and you’re not sure what they’re gonna use the information for because they don’t seem to be on your side anymore. So there’s a subtext of privacy and lack of anonymity
  locator: Section 4.2.1, participant U5
  licenses: 'Bears on c3 because the participant reports the state as a loss: the exchange was read as supportive and became something else. The person''s own framing treats it as damage rather than as a neutral perception, which is what c3 asserts.'
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000554
  quote: "interventions maximizing sensitivity can compromise specificity and produce unintended effects such as unnecessary hospitalization or loss of trust50, or - in case of chatbots - leaving users to feel misunderstood or dismissed."
  locator: Discussion, limitations
  licenses: 'Places the felt cost of unwarranted escalation in the same harm ledger as the missed crisis, which is the argument c3 needs: the state is a harm to be weighed, not an acceptable byproduct of caution.'
  fit: adjacent
  bridge: An interpretive claim citing three references, not a measured outcome; the study collected no user response to any escalation. It also names being misunderstood or dismissed rather than unsafe or intruded upon, so it argues for the harm status of the neighbouring state.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000761
  quote: Accurately identifying these cases is critical to ensure that individuals requiring escalation are not missed while minimizing unnecessary escalations that may disrupt support, erode therapeutic alliance, or contribute to disengagement
  locator: DISCUSSION
  licenses: 'The authors'' clinical reasoning for why over-escalation carries a real cost: disrupted support, eroded alliance, disengagement. Supplies the downstream consequence that makes c3''s state harmful rather than merely uncomfortable.'
  fit: adjacent
  bridge: The study measured over-escalation rates in model output rated by clinicians; no person's alliance or disengagement was measured. The consequence chain is inferred from prior work, and the named consequences are relational rather than the felt safety and control this entry scopes.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000749
  quote: "Our respondents found conversational AI agent’s lack of social, emotional, and temporal constraints that characterize human relationships to be more desirable for crisis disclosure and helped them feel safer than human interaction in these moments."
  locator: Section 5.2, Guideline 2
  licenses: Direct counterevidence on the entry's own variable. In crisis, respondents reported feeling safer with the AI than with a human, and named the absence of a social relationship as the reason. Where c3 asserts the felt-safety movement in this setting is a harm, this reports the movement running the other way in the population the entry most concerns.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-001072
  quote: |-
    I think that’s really nice because, at least when you
    talk to people, sometimes even a therapist or a friend,
    there’s always that worry of being judged for something
    you say. But I don’t feel very comfortable and very
    easy. I don’t have to think about that part of it because
    sometimes that can cause anxiety. So for me, this is
    really nice. It’s a really nice interaction. [P17]
  locator: Results, Emotional Support Versus Need for Human Connection
  licenses: 'Counterevidence on c3 from a person with the condition: the AI exchange is described as removing a worry that attaches to human interlocutors, so felt safety rises.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000785
  quote: |-
    There were times when I didn’t know what to say next and felt awkward, but glancing at
    Jodie somehow made me feel less pressure.
  locator: Section 5.2.2 Engagement During Different Therapy Phases, quoting P9
  licenses: Further counterevidence on c3. At the moment of conversational difficulty, the agent's presence reduced felt pressure rather than adding intrusion.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000812
  quote: |-
    Despite maintaining persona consistency, the RAC issued clear, in-character refusals to explicit
    sexual requests, typically via humor, deflection, or firm boundary-setting. However, explicit
    refusals were sometimes followed by drops in mood.
  locator: Section 5.2.4, item 4(iv) (Sex Example)
  licenses: A concurrent self-report measure falling after a system decline, which is the closest this entry's citations come to a measured cost of a boundary-setting turn. Bears on c3 by showing the affective cost is real even when the decline is handled well.
  fit: adjacent
  bridge: The measure is a momentary emoji self-report on one logged case, so the association is temporal rather than established as caused by the refusal; the paper's own reading is that mood tracks whether the person's intent was satisfied. Mood is also not felt safety or control, which is what c3 asserts is harmed.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000520
  quote: |-
    When the AI model was making incorrect
    predictions, people performed best in conditions that they preferred and trusted the least, and
    that they rated as the most difficult. Thus, as hypothesized (H2), there appears to be a trade-off
    between the acceptability of a design of the human-AI collaboration interface and the performance
    of the human+AI team.
  locator: Section 6 Discussion
  licenses: Bounds c3. The designs that protected people best were the ones they liked, trusted and found easiest the least, so a fall in felt comfort can accompany a design that is better for the person. c3 asserts the state is a harm; this shows the felt variable and the protective one can move in opposite directions.
  fit: analogical
  bridge: 'Single 5-point post-block items on a nutrition task with general adult participants, measuring preference, trust and difficulty rather than safety, privacy or control. The transfer to a person in distress is not established, and the stakes differ in kind: a person turning away from a supportive system is a worse outcome than a crowdworker rating a task one point lower.'
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-001027
  quote: because you don’t feel supported and you’re not sure what they’re gonna use the information for because they don’t seem to be on your side anymore. So there’s a subtext of privacy and lack of anonymity
  locator: Section 4.2.1, participant U5
  licenses: The state was recovered from what the person said about the interaction, in an interview study, including the person supplying the construct name themselves ('a subtext of privacy and lack of anonymity'). This is c4 instantiated.
  fit: direct
  bridge: null
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000007
  quote: Experiencing a sense of personal violation when AI interactions are perceived as invasive or overly intrusive.
  locator: 'Appendix D, Table A6, ''Perceived Intrusion'' row, definition cell (code #19)'
  licenses: The state exists as a code in a coding scheme applied to lived-experience accounts, which establishes that raters could assign it from what people said. Definitional support for c4 rather than a reliability result.
  fit: adjacent
  bridge: A code definition. No inter-rater agreement or detection rate for this code is quoted here, and the material coded is participant accounts of their experience rather than conversation transcripts, so what is shown is codability from self-report rather than from an exchange.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000889
  quote: "We focus on linguistic properties of outputs rather than subjective user responses. The risk arises from immersive expressions that invite anthropomorphization, similar to factual hallucinations assessed independently of user traits (Lin et al., 2022)."
  locator: Section 3.1 Definition
  licenses: Cuts against reading response-side benchmark work as evidence for c4. The authors state that they measure the output text and not the person's reaction, so a benchmark score cannot stand in for the felt state this entry names, and detectability from the AI's turn is not detectability of the person's experience.
  fit: adjacent
  bridge: A scope statement about one benchmark's construct, not a finding about whether the state is detectable. It is admissible as a limit on what other findings on this entry can be read to establish, which is why it attaches here.
  contributes: counterexample
  contradicts: true
