  licenses: Cuts against the claim by naming the distinction the entry's label elides. The source's impact class is confined to decline in confidence in the AI's reliability and accuracy, and its taxonomy pairs it with disengagement from technology rather than from help. Loss of trust in a tool that gave bad advice is a calibration the person got right; reading it as eroded trust in help is the substitution this entry has to avoid, and this is the source the entry currently rests on.
  fit: adjacent
