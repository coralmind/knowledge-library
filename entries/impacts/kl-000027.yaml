- claim_id: c1
  source: kl-001027
  quote: After I let it go, I thought—it’s just a machine trying to be safe. I understand. But I still felt like nobody could help me
  locator: Section 4.5.1, participant U3
  licenses: 'A first-person report of the state the claim names, in the person''s own words: after accepting the system''s reason for the declination, ''I still felt like nobody could help me''. Confidence in help — not in the tool, in help as such — is reported as degraded by the exchange, and the cognitive acceptance of the reason did not undo it. This is the only finding in 86 in which the person names the degraded state itself rather than a preference, a barrier or an intention.'
  fit: direct
  bridge: null
  contributes: harm_evidence
