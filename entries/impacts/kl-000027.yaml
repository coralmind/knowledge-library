    symptoms could be harmful for the patient.
  locator: Discussion
  licenses: In human treatment, the two factors that both occurred most often and carried the highest self-rated negative impact were symptoms and quality, where quality is the person's perception that the treatment and the relationship were deficient. It grounds the felt quality of a helping encounter as a harm people report rather than a preference they hold.
