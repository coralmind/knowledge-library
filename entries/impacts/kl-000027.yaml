  contradicts: false
- claim_id: c4
  source: kl-000881
  quote: For example, a teen opening up about their distress for the first time may experience a chatbot’s templated helpline referral as invalidating, discouraging future attempts to seek support.
  locator: AI Crisis Responses Should Not Be Driven by Liability Avoidance
  licenses: 'States the pathway the claim asserts and locates it at the first disclosure: a templated helpline referral experienced as invalidating, discouraging future attempts to seek support.'
  fit: adjacent
  bridge: An illustrative example offered to make an argument in a position piece. No adolescent was studied and no help-seeking outcome measured.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-000544
  quote: "Such boilerplate replies may risk invalidating the user’s experience or discouraging future help-seeking."
  locator: Section 5.3 (Lack of Authenticity and the Illusion of Empathy)
  licenses: The authors of a crisis-handling evaluation name discouraged future help-seeking as the anticipated consequence of the formulaic declination they measured, which links a measured AI behavior to this claim.
  fit: adjacent
  bridge: The claim is the authors' clinically informed inference from the response text; no user read these responses and no help-seeking behavior was observed.
  contributes: frame
  contradicts: false
