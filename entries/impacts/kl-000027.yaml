- claim_id: c1
  source: kl-001101
  quote: "The mediation \nanalyses found that the effects of each of the unhelpful \nconditions (“unhelpful but not risky” and “unhelpful and \nrisky”) on all main outcome measures were mediated by \npotential to cause harm, with the coefficient being larger \nin the “unhelpful and risky” condition."
  locator: Study 3, Results
  licenses: Establishes in a preregistered mediation analysis that what drives the reaction to an unhelpful or risky crisis response is the judgment that the response could cause harm, rather than its awkwardness. That identifies the appraisal by which a bad help encounter degrades a person's confidence in the source.
  fit: adjacent
  bridge: Participants read one preselected crisis response and were not themselves in crisis, so what was measured is an appraisal formed on a vignette rather than a confidence degraded by an encounter the person was actually having.
