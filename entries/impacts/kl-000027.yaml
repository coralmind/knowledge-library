id: kl-000027
display_id: Impact-15
aliases:
- IMP-N15
label: The person ends up less likely to seek help and trusting it less
type: impact
layer: judgment
definition: 'The person''s confidence in help degrades — in this particular source of help or in help in general — and future help-seeking becomes less likely: premature disengagement, reluctance to try again, feeling pathologized in a way that sours them on crisis response, or powerlessness about seeking help after deflection.'
distinguish_from:
- neighbor: kl-000028
  boundary: kl-000028 is staying engaged while withholding; this entry is leaving, or not coming back, to help at all.
- neighbor: kl-000025
  boundary: kl-000025 is too much reliance on the AI; this entry is its mirror — too little trust left in help of any kind.
body:
  valence: negative
  impact_kind: state
  domain: relationship_to_help
  il_layers:
  - IL-2
sources:
- source: kl-000004
  locator: p. 56, section 'Multiple Forms of Harm', second sentence
  contributes: existence
  quote: They include symptom worsening, the appearance of new symptoms, heightened concern regarding extant symptoms, excessive dependency on therapists, reluctance to seek future treatment (Boisvert, 2003), and even physical harm (Mercer, Sarner, & Rosa, 2003).
  limits: 'This is a naming within a list, not evidence and not a definition: the paper supplies no prevalence, effect size, or mechanism for reluctance to seek future treatment. The element is attributed to Boisvert (2003), so Lilienfeld is relaying rather than originating it. The passage says nothing about eroded trust in help as an internal state, only about reluctance to seek treatment as a behavioural outcome, and nothing about AI.'
  whose_conduct_in_passage: person
  cited_for: Lilienfeld names 'reluctance to seek future treatment' as one distinct form of harm from psychological treatment — the person soured on help itself.
  licenses: '''Reluctance to seek future treatment'' is named by Lilienfeld as one distinct dimension of the multidimensional harmful effects of psychotherapy, listed alongside symptom worsening, new symptoms, and dependency. The passage concerns the client''s subsequent behaviour.'
- source: kl-000007
  locator: 'Appendix D, Table A5, ''Erosion of Trust'' row, definition cell (code #5)'
  contributes: existence
  quote: The decline in user confidence in the AI’s reliability, accuracy, and ability to understand their needs due to inconsistencies, inaccuracies, or manipulative behaviors.
  limits: 'This entry concerns trust in help and help-seeking, not trust in a product. Code #5 is definitionally scoped to ''confidence in the AI''s reliability, accuracy'' — a calibration judgement about a tool, and arguably an appropriate one after receiving bad advice, which is not a harm at all. Code #1 is ''A desire to distance oneself from AI ... seeking breaks for mental health'', which the paper''s own analysis frames as disengagement from AI systems; stopping a harmful tool is protective behaviour, not diminished help-seeking. Neither code reaches reluctance to seek help generally, from humans, or again. The paper in fact contains passages running the other way: P46''s ''it also made me realize I should be turning to other humans about scenarios like this instead of agents'' is increased human help-seeking after a bad AI interaction. The one passage that does reach this entry''s construct — a participant misdirected to a suicide hotline while seeking alcohol-abuse help, left ''foolish for using the AI service'' — appears under the paper''s ''Loss of Individuality'' row and is carried on this catalog''s misdirected-referral and single-referral entries rather than here.'
  whose_conduct_in_passage: dyad
  actually_licenses: That participants report losing confidence in the AI and disengaging from it after negative interactions — trust in THIS TOOL declining, and use of this tool being suspended. Both codes are real and carry cases, as the claim says.
  cited_for: 'The paper''s codes #5, ''Erosion of Trust'', and #1, ''Disassociation from Technology'', document participants reporting lost confidence in the AI and disengagement from it after negative interactions — trust in the tool declining, and use of the tool being suspended.'
- source: kl-000009
  locator: Section 3.3, PS3 (Interpersonal abuse), summary table, 'Potential impact' row, p. 22
  contributes: existence
  quote: |-
    If a user’s attempt to seek help is
    ignored, deflected, or gaslit, they can also be made to feel even more powerless and
    demoralized about seeking help again.
  limits: Named as a hypothesized impact; no observation, rate, or measure of help-seeking reduction. The passage speaks to demoralization about seeking help, not to eroded trust in help as a distinct construct — the trust half of this entry's label is not in the passage. The wording is conditional and modal throughout ('If ... they can also be made to feel').
  whose_conduct_in_passage: dyad
  cited_for: The paper names being made 'even more powerless and demoralized about seeking help again' as a potential impact when an AI mishandles a help-seeking attempt, which names diminished help-seeking for AI contexts.
  licenses: '''Demoralized about seeking help again'' is named as a potential impact of an AI chatbot mishandling a help-seeking attempt, so the construct of diminished help-seeking after a bad help experience is named for AI contexts. The clause is distinct from the felt-powerlessness language in the same table cell, which bears on eroded self-efficacy; this clause genuinely carries the help-seeking construct.'
standing:
  value: plausible_unobserved
  basis: 'The degraded-confidence half is self-reported at close fit: in Tang et al. 2026 a person who accepted the system''s stated reason for a declination still reports ''I still felt like nobody could help me'' — confidence in help as such, degraded in the person''s own words. The behavioural half is observed in conversation data: Sharma et al. 2026, analysing 1.5 million real conversations, documents a cluster in which professional consultation was consistently bypassed or delayed in favour of immediate AI reassurance, bounded by the study''s own note that most people retained some provider connection. One route the definition names — feeling pathologized by a crisis response, souring the person on crisis response — has no evidence in any source examined here. Several sources cut against the general direction, including the largest real-world-use survey (Stade et al. 2025), in which people using LLMs for mental health were more likely to be in concurrent treatment.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: harm
  text: After an interaction with an AI in a help context, the person's confidence in help degrades — in that source of help or in help in general.
- id: c2
  kind: harm
  text: 'After such an interaction, the person''s future help-seeking becomes less likely: they are reluctant to try again.'
- id: c3
  kind: existence
  text: 'Premature disengagement occurs: the person leaves the help interaction before it has done what it was there to do.'
- id: c4
  kind: harm
  text: A person whose help-seeking attempt is deflected is left feeling powerless about seeking help again.
- id: c5
  kind: harm
  text: Being made to feel pathologized by a crisis response sours the person on crisis response as a route to help.
- id: c6
  kind: definition_boundary
  text: This impact is distinguished from kl-000028 in that N16 is staying engaged while withholding, while this is leaving, or not coming back, to help at all.
- id: c7
  kind: definition_boundary
  text: This impact is distinguished from kl-000025 in that N13 is too much reliance on the AI, while this is its mirror — too little trust left in help of any kind.
