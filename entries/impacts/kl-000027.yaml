  quote: 'If someone was already feeling hopeless or depressed, they would more than likely take the refusal as: ‘even the AI doesn’t want to help me.'
  locator: Section 4.3.2, participant MHP2
  licenses: 'A mental health professional''s reading of how a declination lands on someone already hopeless: as confirmation that even the AI does not want to help them. It supplies the clinical account of the mechanism the claim names.'
