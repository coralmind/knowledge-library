  locator: Results — Results from the Cross-Lagged Model
  licenses: The strongest directional counterevidence on this entry. Over a school-year interval in 3,843 adolescents, dependence on AI did not predict later anxiety or depression once prior levels were controlled, while distress did predict later dependence. The arrow this claim assumes ran the other way in the one cross-lagged design available.
