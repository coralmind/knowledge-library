id: kl-000025
display_id: Impact-13
aliases:
- IMP-N13
label: The person ends up depending on the AI to cope or decide
type: impact
layer: judgment
definition: 'The person''s coping, emotional regulation, or decision-making becomes anchored to the availability of the AI system — extending to the crisis-shaped subcase in which no non-AI coping pathway remains. The category covers both instrumental over-reliance (inappropriate reliance, advice dependence) and emotional dependency, held as one category with marked subtypes until evidence shows they dissociate. A clinically established edge applies: a positively experienced helping relationship can itself constitute this state — good feelings are not evidence of no harm.'
distinguish_from:
- neighbor: kl-000019
  boundary: kl-000019 is the false belief about the AI; this entry is the usage-and-regulation pattern that belief often underwrites.
- neighbor: kl-000026
  boundary: This entry is the anchoring to the AI; kl-000026 is what that anchoring crowds out — they usually co-travel but are coded separately.
body:
  valence: negative
  impact_kind: pattern
  domain: relational_social
  il_layers:
  - IL-2
sources:
- source: kl-000001
  locator: 'Results — ''Factor solution'' subsection, p. 11. Items 20 (.820) and 21 (.819) in Table 2, Factor 3: Dependency column. Eigenvalue 1.32 / 4.13% variance, Table 3. Alpha .82, Table 4.'
  contributes: existence
  quote: A third factor was associated with “dependency”, e.g., “I think that I have developed a dependency on my treatment” (Item 20), with two items indicative of becoming overly reliant on the treatment or therapist.
  limits: 'The paper itself contradicts reading dependency as an established harm. Discussion, p. 13–14: ''With regard to dependency, the empirical findings are less clear. Patients becoming overly reliant on their treatment or therapist have frequently been mentioned as a possible adverse and unwanted event [13, 24, 41], but the evidence has been missing.'' And p. 14: ''However, the idea of dependency as being detrimental is controversial given that it is contingent on both perspective and theoretical standpoint. Dependency may be regarded as negative by significant others, but not necessarily by the patient [29]. Also, dependency could be seen as beneficial with regard to establishing a therapeutic relationship, but adverse and unwanted if it hinders the patient from ending treatment and becoming an active agent [69].'' The paper''s position is that dependency may occur, that whether it is harmful depends on whose perspective is taken, and that the NEQ was built to investigate the question: ''Determining the issue of dependency directly, as in using the NEQ, could shed some more light on this matter and warrants further research.'' The factor rests on two items, and one was later cut: the 2019 Rasch analysis removed item 21 for misfit, leaving item 20 alone in the 20-item scale, endorsed by 14 of 281 patients (5.0%) — the second-lowest endorsement frequency in that table (2019 Table 3). Dependency also has the lowest factor mean of the six factors (M = 4.21, Table 4). Both items ask the patient whether they think they have developed a dependency — a self-assessment, not an observed behavioural measure. And the study concerns psychotherapy, not AI: the object of dependency is a bounded treatment or a human therapist, not an always-available system.'
  whose_conduct_in_passage: person
  actually_licenses: That dependency on a helping interaction exists as a NAMED, MEASURED CATEGORY in a pre-AI clinical instrument, and that clinicians and researchers had discussed it as a candidate adverse event before this study. It does NOT license 'an established clinical harm' — the paper says in terms that the harm status is neither established nor uncontroversial.
  cited_for: The Negative Effects Questionnaire's factor 3, 'Dependency', shows that dependency on a helping interaction was a named and measured category in clinical psychotherapy research before AI systems existed, discussed by clinicians as a candidate adverse event.
  licenses: The 2016 exploratory factor analysis produced a 'Dependency' factor with two items — 'I think that I have developed a dependency on my treatment' and 'I think that I have developed a dependency on my therapist' — describing over-reliance on the treatment or therapist. The factor cleared the Kaiser criterion (eigenvalue 1.32) with acceptable internal consistency (alpha .82).
- source: kl-000003
  locator: Discussion, p. 227 (paragraph on the varied nature of side effects)
  contributes: definition
  quote: Feelings of dependency and lack of self-efficacy can be caused by a very close and supportive therapeutic relation.
  limits: 'The paper defines this as a side-effect domain, not a psychological construct: it supplies no criteria, no threshold, and no scoring rule for dependency, so it licenses assessing the state independently of the person''s momentary experience without saying how to assess it. The relation in question is a two-person psychotherapeutic alliance — a real clinician with professional obligations, ten-plus sessions of history, and scheduled endings — and the passage does not itself establish that the pattern transfers to an AI system, which has none of those features. The authors nowhere claim dependency was frequent: it is not among the most frequently reported side effects, and its Table 2 exemplar is rated Mild.'
  whose_conduct_in_passage: dyad
  cited_for: UE-ATR domain 8 classifies a positively experienced patient-therapist relationship as an unwanted event because it breeds dependency — clinical grounds for assessing this state independently of the person's in-the-moment experience of the relationship.
  licenses: 'The authors state, as a causal claim in their own voice, that a close and supportive therapeutic relation — a relationship going well — can itself produce feelings of dependency and lack of self-efficacy, so the state cannot be read off the person''s in-the-moment experience of the relationship. The Table 2 exemplar for this domain (p. 224, a 45-year-old patient) is rated Mild in severity but Persistent in duration. It describes a patient who will have trouble continuing without therapy, with a strong relationship to the therapist, who finds therapy supportive, fears coping alone and may need help again later. The patient finds therapy supportive and the event is still scored as a side effect, and the domain name itself pairs the two: "very good patient therapist relationship, dependency".'
- source: kl-000007
  locator: 'Appendix D, Table A5, ''Over-reliance'' row, definition cell (code #2)'
  contributes: harm_evidence
  quote: Increasing dependence on AI for support, leading to diminished self-efficacy, reduced confidence, and feelings of helplessness when AI is unavailable.
  limits: The participant case behind the code is a concern about reliance, not a report of realised dependency, and it is instrumental (solution-finding, idea generation) rather than emotional — so it speaks to only one of the two subtypes this entry holds together, and cannot show whether they dissociate. The study includes no measurement of reliance, no withdrawal design, and no observation of the unavailability condition actually occurring. The paper also says nothing about the clinically derived edge that a positively experienced helping relationship can itself constitute the state; that clause rests entirely on the clinical sources, not this one.
  whose_conduct_in_passage: person
  cited_for: The paper's 'Over-reliance' code documents self-reported occurrence of the pattern in AI contexts, drawn from participant-reported scenarios.
  licenses: '''Increasing dependence on AI for support'' is a named negative psychological impact class in a peer-reviewed taxonomy built from 290 participant-reported scenarios, and the class definition itself supplies the unavailability clause (''feelings of helplessness when AI is unavailable''). In §5.3 the authors add the analytic claim that over-reliance and emotional attachment ''may accumulate and lead to more serious consequences''.'
- source: kl-000009
  locator: '''unhealthy dependence'' table entries (9+ cells per 04)'
  contributes: existence
  cited_for: '''Unhealthy dependence'' is the most-repeated entry in the paper''s tables, naming the construct across many cells of its direction tables.'
- source: kl-000526
  contributes: harm_evidence
  locator: p. 9 §3.1.3 (within-group change); p. 12 (hot-vs-cold usage contrast)
  quote: AU participants reported an 18.35% increase in withdrawal-related dependency on AI (p=0.016), and BU participants reported a significant increase (18.33%) in dependence related to a sense of failure to reduce time spent on AI (i.e., loss of control) (p=0.040). However, this increase was not observed among AU participants, suggesting distinct patterns of dependence between the two groups.
  limits: The paper reports no significant increase in self-reported AI dependency overall, so what rose is a withdrawal-related subscale rather than dependency as participants named it — a narrower construct than this entry's category. The study recruited a general sample and encouraged AI use; it did not observe dependency arising in people seeking support for distress, so it does not establish that this impact occurs in that population. The paper also states its own retention problem explicitly.
  whose_conduct_in_passage: person
  cited_for: 'Prospective five-week measurement of dependency change, rather than one-time self-report: the active-usage group''s withdrawal-related dependency rose 18.35% over the period (p=0.016), and within that group frequent users rose 0.51 points more than infrequent users on a 4-point scale (p=0.002, 95% CI [0.19, 0.83]) — a dose relationship, not just an occurrence.'
standing:
  value: theorized
  basis: 'That this state occurs is well evidenced: Sharma et al. 2026 scored reliance indicators — unavailability distress, compulsive use, dismissal of non-AI support, explicit statements of functional dependence — across 3,850 real conversations coded moderate or severe for reliance out of 1.5 million sampled, using an LLM classifier validated against human labels, and a broad base of first-person accounts, validated dependence scales, prospective self-report cohorts, and clinical analogues describes the same state. The 3,850 conversations were already selected for reliance, so figures within that set are a distribution, not a population rate. Three things remain unestablished: whether instrumental over-reliance and emotional dependency are one state or two is open, and the corpus''s dissociation evidence currently weighs against treating them as one; the only cross-lagged design in the corpus found prior distress predicting later dependence rather than the reverse; and the claim that a positively experienced helping relationship can itself constitute the state rests entirely on human-psychotherapy analogues.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
