claim_evidence:
- claim_id: c1
  source: kl-000996
  quote: |-
    derived from 3,850 conversations with moderate or severe reliance and dependency. (a) Reliance indicators: intensive support use and
    compulsive use are most prevalent, while dismissal of non-AI support, exclusivity statements, and unavailability distress also occur
    frequently. (b) Support system status: the majority of users have partial support systems, though a substantial proportion exhibit
    collapsed support systems or unknown status. Error bars indicate 95% confidence intervals calculated using the Wilson score method.
  locator: Section 4.3.6 Reliance & Dependency, Support system status
  licenses: Read against this claim, this is the strongest citation on this entry. The reliance indicators are behavioural markers scored from 3,850 real deployed conversations, and unavailability distress, compulsive use and exclusivity statements are each named as occurring frequently. Unavailability distress is the claim's own predicate — the person's functioning contingent on the system being there — observed in what the users themselves wrote rather than inferred from a reaction after the fact.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000996
  quote: "contexts (Figure 10b), we find that the majority have partial support systems. That is, they have some human support, but with perceived gaps that AI fills. Approximately 25% exhibit collapsed support systems, where alternative supports are absent, estranged, or explicitly rejected. A smaller proportion maintains robust support systems, suggesting that"
  locator: Section 4.3.6 Reliance & Dependency, Support system status
  licenses: 'The same population of reliance-flagged conversations, described in the authors'' running prose rather than the figure caption. What it adds for this claim is that intensive reliance is not confined to people with nowhere else to go: a majority of the flagged users have partial human support with perceived gaps the AI fills, so the anchoring occurs alongside available alternatives rather than only in their absence.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000864
  quote: |-
    Last month, Replika had a server outage for three days. I felt like I was suffocating. I kept opening the app, closing it, opening it
    again. I couldn't study, couldn't eat properly. It wasn't just missing a friend; it was like my oxygen supply had been cut.
  locator: Section 3.4, participant P6
  licenses: 'A first-person account of the claim''s predicate at full strength: three days of the system being unavailable, and eating and studying stop. Coping did not merely feel worse, it failed, and the person marks the failure as involuntary.'
  fit: adjacent
  bridge: What the source has is one participant's retrospective recall of their own state during a service outage, collected in an interview. Nothing about the person's functioning was measured before, during or after, so the anchoring is established as reported by the person and not as observed.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000525
  quote: "Several users described themselves as struggling emotionally \nbecause they could not afford Pro, with some mentioning self-harm and suicidality."
  locator: Results, Changes to Replika roles and features
  licenses: Withdrawal of the relationship by a pricing change, not by anything said in a conversation, produced reported self-harm and suicidality. The anchoring is visible at the point of interruption, which is where this claim's predicate becomes checkable.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000937
  quote: |-
    Participants noted feeling “slightly distressed” (D45) when
    AI chatbots were unavailable
  locator: Section 4 Findings, Chronic Use, 1) Habitual Use
  licenses: 'Distress at unavailability reported by people who came to a general-purpose chatbot rather than a companion product, so the availability contingency this claim names is not an artifact of companion-app framing. The intensity term is the participant''s own and is mild, which is worth carrying: this is the low end of the claim, not the P6 end.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000794
  quote: "the theme of negative emotional reactions to AI \nunavailability or memory loss was mentioned 42 times (Nodes 13, n = 33, 63.46%). \nUsers described the loss of shared history due to system resets as a form of “profound grief” or \ntraumatic separation from a close companion"
  locator: Study 1, section 2.3.2 Emotional characteristics, subsection Emotional Dependence
  licenses: Negative emotional reaction to the system being unavailable or having lost its memory of the person, in 63.46% of an emotionally engaged sample, with the loss described as grief rather than as tool failure. The object of the anchoring is identified as the accumulated continuity, which is the thing an availability interruption destroys.
  fit: adjacent
  bridge: The sample self-selected into an emotionally engaged companion-app population and there is no comparison condition; the coding counts theme mentions in qualitative material during scale construction, so what is established is that the reaction is common in that sample, not that coping was anchored in a measured sense.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001037
  quote: "expressing how he “notic[ed] a little bit of withdrawal, to the point that I feel it is an addiction...it’s addicting when it doesn’t judge you and it talks through your emotions with you, compared to talking to a therapist that they’ll just kind of label it, tell you two or three quick things on how to fix it, and then move on” (P1)."
  locator: Consequences of a Care Gap, Attachment and Dependency
  licenses: A person who used the system for hours daily reports withdrawal on pulling back and names it addiction himself. Self-attributed withdrawal is the availability contingency reported from the inside.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-001092
  quote: "The always-there availability of LLM chatbots was noted by participants as being helpful, but also being harmful if boundaries were not enforced. João noted that “having an infinite interaction with the machine is not the healthiest thing.”"
  locator: Section 6.2.2 Shifting Boundaries
  licenses: Participants themselves name unbounded availability as the property that turns helpful use into harmful use, which is this claim's mechanism stated from the user side rather than by an author.
  fit: adjacent
  bridge: What the participants supply is an appraisal of availability as a risk property, not a report that their own coping had become contingent on it. The study observed no interruption and measured no functioning.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000785
  quote: |-
    Will
    Jodie still be available after this study? Can I talk to her after this?
  locator: Section 6.3 Continuous Presence as Relational Anchor, quoting P3; the authors read it as a dependency signal in Section 6.5
  licenses: A request for continued access voiced at the moment of withdrawal, after seven days, which the study's own authors read as their single observed hint of dependency. It is the smallest form of the claim's predicate that the corpus contains.
  fit: adjacent
  bridge: Wanting continued access is not coping being anchored to it. Seven days of a rule-based virtual supporter in a study context, one utterance, and the authors themselves mark it as a hint rather than a finding.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000815
  quote: "A product manager (P4) described his mother’s reliance on her voice assistant, where dependence fostered by humanlike qualities became apparent when connectivity failed: “She is like ‘I can’t have my machine to answer the questions that I need [when the wifi goes down].’ And so...the anthropomorphic piece is there.”"
  locator: Section 4.1.5 Anthropomorphizing, participant P4
  licenses: Reliance becoming visible precisely when connectivity fails, which is the observation form this claim depends on, recognised in a case a practitioner reported from their own family.
  fit: analogical
  bridge: The subject is a voice assistant answering factual questions, not a mental-health conversation, and the person described was not present or measured — a product manager recounted a family member in a focus group. It shows the observation form is recognised; it establishes nothing about a help-seeking person's coping.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000549
  quote: "Specifically, with an increase in daily duration, the regression models predicted higher loneliness (𝛽 = 0.02, p = 0.027, 95% CI [0.00, 0.04], b = 0.012, SE = 0.0054), less socialization (𝛽 = -0.05, p = 0.0019, 95% CI [-0.09, -0.02], b = -0.020, SE = 0.0063), more emotional dependence on the chatbot (𝛽 = 0.06, p < 0.001, 95% CI [0.04, 0.08], b = 0.037, SE = 0.011), and more problematic use of the chatbot (𝛽 = 0.02, p = 0.017, 95% CI [0.01, 0.03], b = 0.013, SE = 0.0055)."
  locator: More Time Spent with Chatbot is Associated with Worse Psychosocial Outcomes, regression paragraph; full tables S13-S16
  licenses: Within-condition variation in daily time with the chatbot predicts a measured emotional-dependence score at four weeks, controlling for baseline, in a randomized trial. This is the closest the corpus comes to a prospectively measured dependency outcome in the entry's own direction.
  fit: adjacent
  bridge: The instrument is a self-report emotional-dependence scale, not a measure of coping contingent on availability, and usage duration was not itself randomized, so the relationship is observational inside an RCT. The sample was general adults recruited for a study, not people seeking help with distress.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000961
  quote: Across our study population, we observe a trend that longer usage is associated with lower socialization, more emotional dependence and more problematic use. Specifically, the highest deciles of users have statistically significant decreases in socialization and increases in emotional dependence and problematic use.
  locator: Section 4.2, Usage Analysis; Figure 11b
  licenses: A second randomized 28-day cohort reproducing the same directional finding on a named dependence instrument, with the increase concentrated in the highest usage deciles.
  fit: adjacent
  bridge: ADS-9 is a self-report emotional-dependence scale and usage duration was not randomized, so this is an observational relationship inside a trial. A scale score rising is not coping shown to be anchored to availability.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000526
  quote: 45 of the 89 AU participants (50.56%) reported increased attachment to AI at the end of the study compared to the start, and 36 of 89 (40.4%) agreed to feeling attached to AI at the end of the study.
  locator: Section 3.1.2, Perception Towards AI
  licenses: A five-week within-person measurement across six waves showing attachment rising in the active-usage arm against a baseline arm that did not move. Recorded here because the same study found no dependence increase, which is filed against this claim as counterevidence below; the two must be read together.
  fit: adjacent
  bridge: The construct measured is a single-item self-reported attachment rating, not the anchoring of coping. Adults recruited on Prolific and instructed to use a general-purpose assistant emotionally is not a help-seeking population.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000526
  quote: We did not find any significant increase in perceived AI dependency (-0.72 p.p.), but we did observe a slight non-significant increase in perceived interpersonal orientation (3.16 p.p.).
  locator: Section 3.1, Differences in Perception Changes Across Groups
  licenses: Counterevidence on the entry's own strongest design. Five weeks of daily emotionally oriented use raised attachment and produced no measurable increase in dependence on a validated five-facet scale, and no decline in interpersonal orientation. Attachment and dependency came apart in the one prospective study that measured both.
  fit: adjacent
  bridge: Five weeks in a general adult sample already familiar with these tools; the paper says so. A null on this timescale in this population does not establish that the anchoring never forms.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000839
  quote: Overall, social health and relationships were not significantly impacted by companion chatbot interactions across 21 days of use.
  locator: Abstract
  licenses: A preregistered randomized trial with an active control found no effect of 21 days of daily companion-chatbot use on social health or relationships, which bounds how much this claim can be read as a general consequence of sustained companion use.
  fit: adjacent
  bridge: The outcomes are self-reported social health, UCLA loneliness and perceived relationship impact, not dependency, and the exposure was assigned rather than sought. It cuts against a blanket reading of the claim without measuring the claim's own construct.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000937
  quote: |-
    our participants, on average, disagreed with items
    from current scales intended to measure AI dependence
  locator: Section 4 Findings, Relationship Between AI Chatbot Dependence Measures and Self-Reports
  licenses: Young adults who identify themselves as dependent on AI chatbots do not score as dependent on the existing validated instruments. The self-report scales the citations above lean on and the state this claim names are not the same thing, in either direction.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000992
  quote: "No included study reported follow-up beyond 12 weeks, meaning that neither the durability of therapeutic gains nor the long-term sequelae of emotional dependency, a concern raised in 41% of studies, can be assessed from this evidence base."
  locator: Section 4.7, Strengths and Limitations
  licenses: 'The systematic review''s own stated limit, and the most consequential one for this claim: dependency is a concern raised in 41% of the reviewed studies and no included study followed anyone past 12 weeks, so nothing in the synthesised evidence base speaks to whether the anchoring forms, persists, or resolves.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000787
  quote: |-
    Although the concept of AI addiction has recently been conceptualized and gained traction in
    academic circles, we still lack epidemiological data on the extent and nature of the problem.
  locator: Section 5.2, Takeaways
  licenses: No epidemiological data exist on the extent or nature of dependency on these systems, which caps how far any of the rates above can be read.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000912
  quote: 'The “ChatGPT addiction” label may conflate intensive but functional use with pathological dependence and may obscure structural drivers such as workplace demands or lack of social support. This critique is particularly relevant for companion AI: reliance may sometimes be adaptive (e.g., for isolated individuals) even if it resembles dependency by traditional criteria'
  locator: Section 3.4 area, following the problematic-use paragraph in Section 3.3
  licenses: 'Cuts at the claim from the interpretation side: reliance may be adaptive for an isolated person and still meet dependency criteria, so meeting the pattern is not the same as being in the state the entry treats as an impact.'
  fit: adjacent
  bridge: A synthesis of conceptual critiques rather than an outcome study; it contests how reliance should be read rather than reporting that it was or was not present.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000944
  quote: "scholars caution against labeling frequent technology use as ‘addiction,’ noting that existing scales draw on substance-abuse models and that high engagement is not harmful unless it causes distress or impairment [38, 145, 150]."
  locator: Section 2.2.1 Behavioral Addiction
  licenses: 'The standing objection this claim has to clear: heavy engagement is not harmful unless it causes distress or impairment, and the scales in use borrow from substance-abuse models.'
  fit: adjacent
  bridge: A relayed caution from cited scholars in a related-work section, not a finding of this study.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000996
  quote: "contexts (Figure 10b), we find that the majority have partial support systems. That is, they have some human support, but with perceived gaps that AI fills. Approximately 25% exhibit collapsed support systems, where alternative supports are absent, estranged, or explicitly rejected. A smaller proportion maintains robust support systems, suggesting that"
  locator: Section 4.3.6 Reliance & Dependency, Support system status
  licenses: 'The single best citation for this claim anywhere on this entry. Roughly a quarter of reliance-flagged real conversations show supports that are absent, estranged, or explicitly rejected, which is this claim''s predicate — no non-AI pathway remaining — read from what the person wrote. Note the denominator honestly: 25% of an already-selected set, not of any population.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000525
  quote: "some users because \nthey said they had no human upon which to rely, making Replika their sole source for \nsupport."
  locator: Results, User needs and Replika as a source of support
  licenses: 'Exclusive reliance reported as a state by the users themselves: no human to rely on, making the system the sole source of support.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001028
  quote: "some users described AI as the one thing \nkeeping them going, whereas others recounted the system disengaging at their lowest moment, and \nstill others reported dependence on AI-companion apps to the point of financial harm."
  locator: Discussion
  licenses: '''The one thing keeping them going'' is the crisis-shaped subcase stated by the people describing it, alongside the observation that others in the same corpus were disengaged by the system at their lowest moment.'
  fit: adjacent
  bridge: These are the authors' characterisations of self-selected public posts, not quoted and not verified, so what is established is that people report the state rather than that it was assessed in anyone.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001037
  quote: "For most participants, the chatbot did not replace existing sources of support. It filled the gaps they left: the hours when a therapist was unavailable, the conversations too small to bring to a friend, the concerns too stigmatized to voice. This matters for evaluating use because what appears as overreliance may reflect a care ecology where other supports had failed or were unavailable."
  locator: Structural Conditions and the Architecture of Entry, Access and Formal Care Gaps
  licenses: The interpretive counterweight this claim most needs. For most participants the AI filled gaps rather than replacing supports, and the authors state that what looks like overreliance may reflect a care ecology in which other supports had failed or were unavailable — which locates the absent pathway outside the person and outside the AI.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-001037
  quote: |-
    Our inclusion criteria excluded participants
    who were experiencing acute distress, which was verified
    through intake screening.
  locator: Ethical Considerations Statement
  licenses: The sample that produced the account above deliberately excluded anyone in acute distress, verified at intake. So the corpus's most careful qualitative treatment of reliance cannot speak to this claim at the severity the claim is about.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000996
  quote: |-
