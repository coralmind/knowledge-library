  quote: In Model (1), participants who self-reported using chatbots primarily for companionship reported significantly lower well-being compared to those with other motivations (β = −0.48, p < .001). Model (2), which classified companionship based on relationship descriptions, showed a similarly negative association (β = −0.32, p < .001). Model (3), which relied on the proportion of companionship-oriented sessions in chat histories, also revealed significant associations (β = −0.27, p = .004).
