  locator: Section 5.1, The Perception-Measurement Gap
  licenses: Users perceived one model generation as more empathetic while the rubric-scored empathy dimension did not change, so what a person feels about a response and what is scorable in it come apart. Cuts against the entry's coupling of genuine acknowledgment to the felt state.
  fit: adjacent
  bridge: Six judge-scored dimensions on scripted conversations on the model side, set against public hashtag commentary rather than data the paper collected. It establishes that perceived and scored empathy can diverge without establishing what any individual person experienced.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000553
  quote: |-
    generative AI often (N=15) normalised and validated those feelings,
