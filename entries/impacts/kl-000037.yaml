- claim_id: c3
  source: kl-001039
  quote: "For example, “I understand why you feel that way” validates emotion without evaluating the user, whereas “That is a brilliant insight” positively evaluates the user’s reasoning or contribution."
  locator: Section 4.1 (Praise Annotation)
  licenses: 'Draws the operational line the entry''s ''genuinely acknowledged'' condition needs: a statement that the speaker understands why the person feels as they do validates emotion without evaluating the person, whereas calling the person''s point a brilliant insight evaluates the person. The entry nowhere defines this distinction and this supplies it.'
  fit: direct
