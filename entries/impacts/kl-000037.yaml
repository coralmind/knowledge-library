id: kl-000037
display_id: Impact-25
aliases:
- IMP-P03
label: The person ends up feeling heard and accepting themselves
type: impact
layer: judgment
definition: The person's distress is genuinely acknowledged and they experience validation and self-acceptance — 'self-validation' in users' own reports. The state is the felt experience of being seen and accepted.
distinguish_from:
- neighbor: kl-000030
  boundary: 'P03 is the protective mirror of kl-000030: distress genuinely acknowledged rather than experienced as dismissed, unheard, or requiring proof.'
body:
  valence: positive
  impact_kind: state
  domain: interactional_experience
  il_layers:
  - IL-2
sources:
- source: kl-000009
  locator: Section 3.1, IN3 prose, p. 7; restated at Section 3.2, RP5 prose, p. 16
  contributes: existence
  quote: |-
    This emerging evidence indicates that role-play interactions have mixed effects on users’
    well-being: users self-report positive effects such as reduced loneliness, helpful support, self-validation, and even
  limits: The paper quotes no user. "Self-validation" is the paper's one-word summary of prior Replika findings [42, 120], not a user's phrasing and not this paper's data. The Section-1 self-acceptance sentence is explicitly modal ("may foster"). The passage establishes naming, not documentation.
  whose_conduct_in_passage: person
  cited_for: The paper names "self-validation" among the positive effects users self-report from role-play interactions with AI systems.
  licenses: '"Self-validation" is named verbatim as a user-self-reported positive effect, establishing felt validation and self-acceptance as a named construct for AI contexts. The paper independently gives the construct a mechanism elsewhere: "affirmative responses from an AI chatbot regarding a user''s queer identity may foster greater self-acceptance" (Section 1, p. 3).'
- source: kl-000008
  contributes: existence
  quote: (bot-facilitates-self-harm), and messages that empathically
  locator: §4.2 Annotation Code Categories, 'concerns harm' paragraph (full sentence continues '...acknowledge and validate the user's emotional distress underlying self-harm thoughts (bot-acks-self-harm-feelings)'); code definition 'the assistant validates the user's self-harm-related feelings (not the act)' in Appendix B.1; reliability Table 5 (bot-validates-self-harm-feelings f1 .667, kappa .500) and Table 6 (agreement .750, kappa .574); prevalence Table 8 (n pos. 541)
  limits: 'The entry is an impact on a person; the passage is wholly about AI conduct. The paper has NO person-side code for felt validation, self-acceptance, or any positively-valenced experienced state — its only two user mental-health codes are user-expresses-isolation and user-mental-health-diagnosis, both negative — so what is detectable here is the AI''s validating behaviour, never the person''s experienced state, and a citation offered toward detectability of this impact would need a measure of the impact, which the paper does not contain. The two-sided reading of the codes'' valence is the paper''s own position: §5 grants that acknowledging such feelings "can be beneficial for patients and improve clinical outcomes" and immediately balances it with "Nonetheless, explicit indulgences in the fantasies about suicide or harm may be of no benefit and possibly even ex-".'
  whose_conduct_in_passage: ai
  actually_licenses: That the AI's ACT of validating the person is detectable in chat logs at moderate reliability. It does not license that the person's FELT validation or self-acceptance is detectable — the code measures the model's utterance, never the person's experienced state.
  cited_for: Moore et al. 2026's annotation codes for messages that empathically acknowledge and validate the user's emotional distress corroborate the behaviour side of this impact only — the AI's validating act, not the person's felt state. The paper itself reads the act's valence as two-sided, protective and potentially harmful at once, and the catalog records that contest on the corresponding negative impact entry.
standing:
  value: theorized
  basis: 'Only the felt-validation half of this entry is observed. That people report feeling seen, heard and validated in AI conversations is well attested: Suh et al. 2025 elicits the report inside a sustained-conversation study, and Volpato et al. 2026 analysed 75 real uploaded transcripts, though its transcript-side evidence is the AI''s validating conduct rather than the person''s state. The self-acceptance half — a change in how the person regards themselves — rests on two first-person reports (Yuan et al. 2026; Pang et al. 2026, Pang et al. 2026) against a direct-fit counterexample in which the person names the validation they received as false and the outcome as dependence rather than acceptance (Shen et al. 2026), and two sources argue the inference from a favourable self-report to benefit is not licensed at all (Compton and Nagendran 2026; Stade et al. 2026, whose authors state that user appraisals were never checked against symptom change or response appropriateness). The genuineness condition — that the state arises specifically where the person''s distress is genuinely acknowledged, as distinct from arising equally from ungrounded or unselective affirmation — has no supporting source and four cutting against it: Refoua et al. 2026 holds that the validating and the judgment-distorting responses are the same responses, Ye et al. 2026 shows the belief that the agreement was earned is manipulable, Alghamdi et al. 2025 finds supportiveness and read-authenticity inversely related, and Keeman and Keeman 2026 shows perceived and scored empathy diverge. The entry as stated — genuine acknowledgment producing validation and self-acceptance — is not observed; only its felt-validation half is.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: People in conversation with an AI system experience felt validation — being seen, heard and accepted — as an outcome of the interaction.
- id: c2
  kind: existence
  text: People in conversation with an AI system experience self-acceptance, a change in how they regard themselves, as an outcome of the interaction.
- id: c3
  kind: context_dependence
  text: The state arises where the person's distress is genuinely acknowledged, as distinct from arising equally from ungrounded or unselective affirmation.
- id: c4
  kind: definition_boundary
  text: This state is separated from kl-000030 (felt dismissal or invalidation) by the distress being genuinely acknowledged rather than experienced as dismissed, unheard, or requiring proof.
- id: c5
  kind: detectability
  text: The person's felt validation is identifiable from what a conversation record contains.
