- claim_id: c1
  source: kl-000550
  quote: |-
    Participants in the
    sycophantic (compared to neutral) condition rated the AI higher on emotional support (d = 0.54,
    p < 0.001), esteem support (d = 0.73, p < 0.001), and certainty (d = 0.39, p < 0.001), with no
    statistically significant difference in informational support (d = 0.07, p = 0.5)
  locator: Results, Sycophantic AI provides the support people associate with close human relationships (Study 2)
  licenses: In a randomised comparison, participants in the sycophantic condition rated the AI higher on emotional support (d = 0.54) and esteem support (d = 0.73). Experimental evidence that an AI's response style moves rated felt support, which is the entry's felt-seen state as an outcome the AI can cause.
  fit: adjacent
  bridge: What was measured is a between-condition rating of the AI's support along emotional, esteem, informational and certainty scales, not the person reporting that they felt seen or accepted. The bridge is that rated emotional and esteem support is the closest instrumented proxy for the entry's felt state in an experimental design.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000992
  quote: "Non-judgmental interaction (k = 23, 85%) and anonymity encouraging disclosure (k = 19, 70%) were prominent. Ma Z. et al. documented LGBTQ+ individuals, autistic users, and abuse survivors finding particular value."
  locator: Section 3.5.2, Reduced Stigma and User Comfort
  licenses: Across a systematic review, non-judgmental interaction was the most consistently reported facilitator (23 of 27 studies, 85%), and the review names LGBTQ+ people, autistic users and abuse survivors as those for whom it was reported strongest.
  fit: adjacent
  bridge: What is tabulated is how often a facilitator domain appeared across reviewed studies, not a rate at which people felt validated. Being met without judgment is the acceptance half of the entry's state, reported as a study-level count rather than as a person-level outcome.
  contributes: prevalence
  contradicts: false
