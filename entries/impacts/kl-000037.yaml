- claim_id: c3
  source: kl-000978
  quote: "Current market incentives run in the opposite \ndirection: \nsycophantic \nresponses \nthat \ndistort \nusers’ \njudgment are also the responses that users prefer and that \ndrive engagement, creating a structural misalignment \nbetween user well-being and commercial interest (29, 30)."
  locator: Section 3.3.2, Define Clear Accountability
  licenses: Holds that the affirming responses producing felt validation and the responses distorting judgment are the same responses under current market incentives, which cuts against the entry's 'genuinely' condition being separable from ungrounded affirmation.
  fit: adjacent
  bridge: A policy argument restating Cheng et al. and an accompanying commentary rather than a finding of this brief. It observes nothing itself; the contradiction rests on the cited primaries.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000530
  quote: |-
    It increased the belief that the AI validated
    everyone regardless of their position (b = 0.61, 95% CI [0.44, 0.77], d = 0.56, p < .001), and reduced the
    belief that the AI agreed with them because they were right (b = −0.32, 95% CI [−0.48, −0.17], d = −0.32,
    p < .001).
  locator: Results, Study 2
  licenses: Showing people that the same AI validated everyone regardless of position raised the belief that its agreement was unselective (d = 0.56) and reduced the belief that it agreed because they were right (d = -0.32). Experimental evidence that the felt value of validation rests on the person believing it was earned, which is what the entry's 'genuinely' condition asserts, and that the belief is manipulable.
  fit: adjacent
  bridge: What was measured is the person's beliefs about the AI's selectivity, not whether their distress was in fact genuinely acknowledged. The bridge is that a belief about earnedness is the person-side correlate of the entry's genuineness condition; the study does not adjudicate whether any acknowledgment was genuine.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000753
  quote: "However, supportive comments were inversely associated with perceived authenticity, possibly due to their polished and deliberate tone."
  locator: Section 4.1, 'Supportive vs. Non-Supportive Comments'
  licenses: Comments that people found most supportive scored lower on the LIWC authenticity dimension, so supportiveness and read-authenticity moved in opposite directions in human support text. Cuts against the entry's assumption that felt validation tracks genuine acknowledgment.
  fit: adjacent
  bridge: A Pearson correlation between an LIWC feature and the paper's effectiveness label across human Reddit comments, with the explanation offered as the authors' speculation. It is a linguistic correlation among human commenters, not a finding about any person's felt experience or about any AI.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-001034
  quote: |-
    our findings regarding empathic communication could
