  locator: Discussion, Conversational performance
  licenses: The authors' own statement that their empathy advantage may be an artifact of response length and structure, which cuts against reading a rated-empathy or rated-acknowledgment advantage as evidence that anything was genuinely acknowledged.
  fit: adjacent
  bridge: The comparison is clinician-rated empathy on general-medicine responses to patient questions, not a person in distress reporting felt validation. The bridge is that the confound named applies to any rating of acknowledgment quality in text.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000883
  quote: |-
    Users perceived GPT-4o as “more empathetic.”
