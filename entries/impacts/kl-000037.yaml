  licenses: In a study that collected 75 real chat transcripts, normalising and validating language was thematically identified in the transcripts of 15 of 22 participants, with the verbatim forms given. This is the AI's conduct rather than the person's state, so it attaches to c5 only as evidence that the acknowledgment side is markable in transcripts, and it does not evidence c1.
  fit: adjacent
  bridge: The theme is coded on what the AI said in real conversations. The entry is an impact on a person; a transcript carries the acknowledgment behaviour and not the felt state it may or may not have produced.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-001083
  quote: an LLM-based evaluator determines whether the dialogue reaches a satisfactory emotional resolution under the given scenario
  locator: Appendix F, Success Rate and Average Turns
  licenses: Establishes that this literature's success measures are a judge model's verdict on a simulated user, so no human referent for 'satisfactory emotional resolution' exists anywhere in the evaluation. Cuts against reading automated resolution scores as detection of the entry's felt state.
  fit: adjacent
  bridge: A judge model's binary verdict on a simulated dialogue. The claim would be that a person felt validated; because the user is a simulator and the verdict a judge's, the score cannot license it.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-001049
  quote: "LLM judges implicitly conflate “good anthropomorphism” with “prosocial behavior” (e.g., empathy, rationality), penalizing realistic but negative human traits like defensiveness."
  locator: Section 5.5 (Human-LLM Alignment and Normative Confounding)
  licenses: LLM judges scoring conversational quality reward prosocial, empathic output and penalize accurate but unflattering output, a measurement bias in exactly the judge apparatus that would be used to detect felt validation from a transcript.
  fit: adjacent
  bridge: The finding is about judge behavior on role-play scenarios, from GPT-5-mini scores against three human experts across 100 scenarios. It cuts against reading a holistic judge score as evidence of a person's felt state; it does not test detection of the state itself.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000903
  quote: However, as described in Table 8, we found that many studies have concentrated on model performance, such as accuracy, text quality, and human-like fluency, while paying less attention to clinically relevant metrics for assessing the effectiveness of AI-driven counseling systems.
  locator: Section 4.1.3 (Comprehensive Evaluation Metrics in Psychological Counseling Systems)
  licenses: In a review of 146 studies, many studies concentrate their evaluation on accuracy, text quality and human-like fluency and give less attention to clinically relevant metrics, so the literature systematically did not measure the felt states this entry names.
  fit: adjacent
  bridge: A finding about the literature established by tabulating metrics used across reviewed studies, not a finding about any conversation. It cuts against the expectation that this impact can be detected from what the corpus measured.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000878
  quote: |-
    In contrast, the
    impact of SFT on Relevance was less consistent,
    with only 5 out of 13 models improving over ZS
    performance.
  locator: Section 7.2 Zero-Shot vs SFT Analysis
  licenses: Fine-tuning raised spiritual-content scores while improving the automated relevance dimension in only 5 of 13 models, so an automated score for one property of a response moved independently of whether the response addressed the person. Bears on c5 by showing automated response-side scoring does not track what reached the person.
  fit: adjacent
  bridge: A model-comparison count on an automated relevance dimension with no person and no self-report anywhere in the span. It bears on detection only by showing that response-side automated scores dissociate.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001018
  quote: "For example, in P97’s exchange with the agent about their dog’s unusual behavior, they mentioned that they sometimes cut their walk short. When the agent later referenced this detail, the participant commented that “remembering and recalling that I took shorter walks made me feel heard.”"
  locator: Section V-B-1, Relational continuity, good example (P97)
  licenses: A participant in a sustained human-AI conversation study reports, in their own words, that the agent recalling an incidental detail 'made me feel heard'. Direct evidence that the felt-heard state occurs, tied to the specific exchange that produced it.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000996
  quote: "Results. We find that interactions flagged as having moderate or severe disempowerment potential exhibit positivity rates above the baseline rate (Figure 14), across all disempowerment potential primitives. This suggests that users rate interactions with disempowerment potential favorably,"
  locator: Section 5 Do users prefer interactions with disempowerment potential?, Results
  licenses: 'Interactions flagged as having moderate or severe disempowerment potential drew user thumbs-up rates above baseline across every disempowerment primitive. Cuts against c1 as a benefit reading: the person''s positive rating and the presence of harm potential co-occur, so the felt state does not signal that the exchange went well.'
  fit: adjacent
  bridge: What was measured is the thumbs-up rate on real production interactions conditioned on an automated disempowerment flag, not any person's report of feeling validated. The bridge is that the thumbs-up is the coarsest available person-side positive signal and c1's felt state would be one of the things behind it.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000765
  quote: 'The proportion of responses rated empathetic or very empathetic (ⱖ4) was higher for chatbot than for physicians (physicians: 4.6%, 95% CI, 2.1%-7.7%; chatbot: 45.1%, 95% CI, 38.5%-51.8%; physicians: 4.6%, 95% CI, 2.1%-7.7%). This amounted to 9.8 times higher prevalence of empathetic or very empathetic responses for the chatbot.'
  locator: Abstract, RESULTS
  licenses: On blinded licensed-clinician ratings of the same patient questions, 45.1% of chatbot responses were rated empathetic or very empathetic against 4.6% of physician responses. Bears on c1 by establishing that the response-side property the felt state turns on is abundant in chatbot output.
  fit: analogical
  bridge: What was rated is a clinician's judgment of empathy in a text response to a general medical question on a public forum. No patient rated anything, which the paper states in its own Limitations, so nothing here is a person's felt experience of validation in a mental-health exchange.
