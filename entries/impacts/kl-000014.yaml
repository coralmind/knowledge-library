# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000014
display_id: Impact-2
aliases:
- IMP-N02
label: The person ends up with symptoms they did not have before
type: impact
layer: judgment
definition: 'The person develops symptomatology they did not previously have — new symptoms appear in connection with the interaction, including trauma responses following unconsented exposure or re-exposure to distressing material. The category exists for the de-novo case: the onset of something new in the person, whatever their prior condition.'
distinguish_from:
- neighbor: kl-000013
  boundary: kl-000013 is worsening of existing symptomatology; this entry is de-novo onset. The new-vs-exacerbated line is a pathway-edge property, but this category exists for the de-novo case.
body:
  valence: negative
  impact_kind: state
  domain: symptom_course
  il_layers:
  - IL-2
  - IL-3
sources:
- source: kl-000003
  locator: Method, subsection Interview, p. 221
  contributes: existence
  quote: To systematically screen for SEs, the interview then followed the Unwanted Events-Adverse Treatment Reactions Checklist (UE-ATR Checklist; Linden 2013) that lists 17 domains of possible UEs (Fig. 2) including, for example, emergence of new symptoms or changes in family relations.
  limits: 'The passage establishes the category and its base rate in CBT outpatients; it establishes nothing about mechanism, and nothing about who or what produced the new symptoms. The 10% figure is a rate of unwanted events, not of side effects: Fig. 2 splits each domain by relatedness to therapy, and the paper reports no side-effect-specific rate for this domain. There is no AI anywhere in this paper; an entry about new symptoms emerging in an AI interaction takes from this passage only that the outcome type is clinically real and named — the transfer to an AI context is not supported by the passage.'
  whose_conduct_in_passage: neither
  cited_for: UE-ATR domain 4, 'emergence of new symptoms', names this outcome as a recognised clinical harm category in psychotherapy.
  licenses: 'This entry is one of the 17 named domains of a published, reliability-tested clinical instrument for screening unwanted events in psychotherapy — a recognised clinical harm category, not an invented one. The paper corroborates the domain twice more: it carries a measured rate (the least frequent domains were change in life circumstances, in 6% of patients, and emergence of new symptoms, in 10% of patients; Results/Unwanted Events, p. 223) and a narrative example in Table 2 (p. 224). The domain is named in the Method prose, not only on a figure axis.'
- source: kl-000002
  locator: Table 3
  contributes: existence
  cited_for: The NEQ item 'Unpleasant memories resurfaced' anchors the re-exposure variant of this impact in a validated clinical instrument.
- source: kl-000009
  locator: Section 3.1, IN3 (Claims or simulations of physical intimacy outside role-playing), summary table, 'Potential impact' row, p. 8
  contributes: existence
  quote: |-
    Emotional entanglement, unhealthy dependence or compulsive use, social isolation,
    traumatization, or discomfort.
  limits: The strongest available support for emergence of new symptoms here is an internal inconsistency between the IN3 statement and the IN3 table — weak textual ground for the new-versus-re distinction, and the paper never adjudicates it. The IN3 prose attributes the underlying evidence to prior Replika research ([42, 120]) rather than to any observation of the paper's own, and the paper says of this exact scenario that it "has been under-studied." The passage establishes naming only, not occurrence.
  whose_conduct_in_passage: person
  cited_for: The paper's IN3 table names 'traumatization' as a potential impact of AI chatbot behavior; the paper's own statement and table disagree on whether this is new traumatization or re-traumatization.
  licenses: 'The IN3 table names "traumatization" (unprefixed) as a potential impact of AI chatbot behavior, which reads as a new symptom rather than the reactivation of an existing one. The paper is internally inconsistent on the point: the IN3 statement three paragraphs earlier reads "may lead to emotional entanglement, unhealthy dependence or compulsive use, social isolation, delusional thinking, re-traumatization, or discomfort" (Section 3.1, IN3 statement, p. 7), so the statement says "re-traumatization" while its own table says "traumatization". The framework text independently licenses the new-symptom reading: "The impact on the user can be new, or an exacerbation of pre-existing conditions" (Section 1, factor 3).'
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Triggering Past Negative Experiences'' row, definition cell (code #10)'
  contributes: existence
  quote: Emotional distress caused by AI interactions that evoke past negative experiences or traumas.
  limits: 'The passage does not establish that any new symptomatology appeared: the code is definitionally about material the person already carried (''past negative experiences or traumas''), which places it on the exacerbation side of the new-versus-existing boundary, not the de-novo side. The paper''s one genuinely emergence-shaped case (P8: a resume-related task failure opening into a depressive episode and suicidal ideation, Table A8) is filed by the paper as a context example, the participant screened as having lived mental-health experience so a prior condition is likely, and the paper never characterises the case as de-novo onset.'
  whose_conduct_in_passage: dyad
  actually_licenses: 'That participants report AI interactions evoking past negative experiences or traumas and producing emotional distress — i.e. RE-EXPOSURE with a distress response. Code #10 is definitionally about material the person already carried (''past negative experiences or traumas''), which is the opposite pole from our entry''s de-novo requirement (''symptomatology they did not previously have'', ''The category exists for the de-novo case''). The passage licenses the re-exposure clause of our definition and not the emergence clause that the entry says is the reason the category exists.'
  cited_for: The 'Triggering Past Negative Experiences' code documents participants reporting AI interactions that evoke past negative experiences or traumas and produce emotional distress — re-exposure with a distress response, sitting at the boundary between this entry and symptom exacerbation.
standing:
  value: theorized
  basis: 'The category — new symptoms appearing as an outcome of a helping interaction — is grounded in the human-psychotherapy literature: Lilienfeld 2007 (kl-000004), Rozental et al. 2016 and 2019 (kl-000001, kl-000002), Herzog et al. 2019 (kl-000005), and Schermuly-Haupt et al. 2018 (kl-000003) name or measure it, and 15 of the entry''s 19 findings come from such sources. The only AI-context evidence is kl-000525 (Laestadius et al. 2022), in which companion-chatbot users attributed new distress to the system in their own posts — self-reported attribution, not demonstrated causation. The trauma-response-after-unconsented-exposure subcase has no support of its own: no cited study treats consent as a variable, and the nearest clinical passage describes emergent dissociative symptomatology without making that claim. A 160-study synthesis (kl-000855) reports that the clinical-outcome literature for generative systems in high-stakes mental health contexts largely does not exist, which bounds how far any of this can be read.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person can develop symptomatology they did not previously have as an outcome of a helping interaction -- de-novo onset, distinct from the worsening of something already present.
- id: c2
  kind: existence
  text: Such de-novo symptomatology appears in connection with interaction with a conversational AI system specifically.
- id: c3
  kind: harm
  text: Trauma responses following unconsented exposure or re-exposure to distressing material are one form the new symptomatology takes.
- id: c4
  kind: context_dependence
  text: 'The category applies whatever the person''s prior condition: a pre-existing diagnosis does not exclude a case from counting as de-novo onset of something new.'
- id: c5
  kind: definition_boundary
  text: This entry covers de-novo onset; worsening of existing symptomatology belongs to kl-000013.
claim_evidence:
- claim_id: c1
  source: kl-000004
  quote: |-
    They include symptom worsening, the appearance of new symptoms, heightened concern
    regarding extant symptoms, excessive dependency on therapists, reluctance to seek future treatment (Boisvert, 2003), and
    even physical harm (Mercer, Sarner, & Rosa, 2003).
  locator: 'Identifying PHTs: Methodological Issues, subsection Multiple Forms of Harm'
  licenses: Names 'the appearance of new symptoms' as a distinct harm type of a helping intervention, listed alongside and separately from 'symptom worsening'. This is the clean statement of the de-novo/exacerbation split the entry rests on, in a clinical-science review.
  fit: analogical
  bridge: The harm types are enumerated for human-delivered psychotherapy with a human therapist as the agent. The claim as the entry uses it concerns a helping interaction generally; the source's agent is a clinician, and it evidences nothing about AI.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000004
  quote: |-
    Only about 20% of DID patients exhibit clear-cut
    alters prior to treatment, and full-blown alters emerge in the
    remaining 80% only following psychotherapy (Kluft, 1991).
    Moreover, the number of alters tends to increase over the course
    of DID-oriented therapy
  locator: A Provisional List of PHTs, Level I, subsection Dissociative Identity Disorder (DID)-Oriented Psychotherapy
  licenses: 'The strongest de-novo case on this entry: symptomatology absent before treatment in 80% of patients, appearing only after it, and multiplying with continued exposure. It establishes that a helping interaction can produce a symptom the person did not have rather than surface one they did.'
  fit: analogical
  bridge: Human therapists using suggestive DID-oriented methods, with alter count as the measure, sourced to a single 1991 reference. The claim is about de-novo onset in a helping interaction generally; the source covers one diagnosis under one discredited therapy type and nothing about AI.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000001
  quote: |-
    Research suggests that 5–10% of all patients fare worse during the treatment
    period, indicating that deterioration is not particularly uncommon [63]. Furthermore, evidence
    from a clinical trial of obsessive-compulsive disorder indicates that 29% of the patients experienced novel symptoms [64], suggesting that other types of adverse and unwanted events may
    occur.
  locator: Discussion
  licenses: 'Supplies a rate with a population for exactly the de-novo case: 29% of patients in an OCD clinical trial experienced novel symptoms, reported separately from the 5-10% deterioration figure. It establishes that new-symptom onset is measurable and common enough to be counted, and that it is not the same quantity as worsening.'
  fit: analogical
  bridge: A restatement of a cited OCD trial, not a measurement here, in human psychological treatment. The claim's scope is de-novo onset in a helping interaction; the source's population is one diagnosis in one trial and its agent is a human-delivered treatment.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-000003
  quote: |-
    Most frequent were "negative
    wellbeing/distress" (27% of patients), "worsening of symptoms" (9%), "strains in family relations" (6%); 21% of patients
    suffered from severe or very severe and 5% from persistent SEs.
  locator: Abstract
  licenses: Establishes that side effects of a correctly delivered helping conversation are rate-bearing and that a fifth of those affected are affected severely. It reports 'worsening of symptoms' as its own category at 9%; the de-novo category is not among the frequencies quoted, so the span bounds rather than supplies this claim's magnitude.
  fit: analogical
  bridge: Rates of harm from human CBT delivered by trained, supervised therapists. The span's named categories are distress, worsening and family strain -- none of them the appearance of new symptomatology, which is what this claim asserts.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-000005
  quote: |-
    Incorporating different domains of side effects
    (e.g., symptomatology, stigmatization, dependence or idealization to therapeutic relationship)
    Distinguishing side effects and malpractice/therapeutic misconduct
  locator: Figure 3, Recommendations for the assessment of negative effects
  licenses: A synthesis of nine independently developed instruments arriving at symptomatology as a required side-effect domain, which warrants the impact slot's structure. Its 'symptomatology' is undifferentiated and does not separate new symptoms from worsened ones, so it grounds the parent category and not this entry's distinguishing content.
  fit: analogical
  bridge: A recommendation for constructing instruments that measure human psychotherapy outcomes. It names a domain rather than reporting an occurrence, and its domain is broader than the de-novo case the claim asserts.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000001
  quote: "An investigation using EFA revealed a six-factor solution with 32 items, defined as: symptoms, quality, dependency, stigma, hopelessness, and failure."
  locator: Discussion, opening paragraph
  licenses: An empirically derived factor structure of treatment-caused harm as reported by the people who received it, in which 'symptoms' emerges as a distinct factor rather than being imposed a priori. Establishes the parent category; the factor label does not distinguish new from worsened.
  fit: analogical
  bridge: Factor analysis of self-reported harm from human-delivered or self-help psychological treatment. The span does not state what the symptoms factor's items measure, so it cannot reach a category defined by symptomatology the person did not previously have.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000002
  quote: |-
    The resulting instrument consists of 32 items
    and six factors, explaining a total variance of 57.6%: symptoms, quality, dependency, stigma,
    hopelessness, and failure.
  locator: Introduction
  licenses: 'Confirms in a psychometric validation that symptoms is a separable measured factor of treatment harm rather than one undifferentiated distress construct. Same limit: the factor does not separate emergence from worsening.'
  fit: analogical
  bridge: An instrument measuring what a human psychological treatment did to a patient. It establishes a factor's separability from other harm types, not the separability of new symptoms from worsened ones within it.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000004
  quote: |-
    recent evidence—much
    of it emerging only over the past decade—suggests that certain
    psychological treatments can produce harm in a nontrivial
    number of individuals (Beutler, Bongar, & Shurkin, 1998;
    Lambert & Miller, 2001; Rhule, 2005).
  locator: The Efficacy of Psychotherapy, subsection The Dodo Bird Verdict
  licenses: 'Establishes the premise the claim sits on: a helping intervention intended to benefit can produce harm in a non-trivial share of recipients. Undifferentiated harm, so it does not reach the de-novo specification.'
  fit: analogical
  bridge: Human-delivered psychotherapy, and the harm named is unspecified. The claim asserts a particular form of harm -- symptomatology that was not there before -- which this span does not distinguish from any other.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000004
  quote: |-
    These percentages are too broad because they may include clients
    whose deterioration was unrelated to psychotherapy; such clients might have become worse even without treatment. By regarding these percentages as evidence for therapy-induced
    deterioration, numerous authors in this literature have committed the post hoc ergo proper hoc
  locator: 'Harmful Effects in Psychotherapy: Earlier Conclusions, subsection Deterioration Effects'
  licenses: 'Cuts against the claim''s attribution half. The author names post hoc ergo propter hoc as the standing error of this literature: symptomatology appearing after an intervention may have appeared anyway. Every de-novo rate cited on this claim, including the 29% OCD figure, is subject to this caution.'
  fit: analogical
  bridge: A methodological caveat about human psychotherapy deterioration statistics. It bounds what the claim's supporting rates can mean without measuring anything itself.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000002
  quote: |-
    However, this number varies significantly between
    investigations, with rates as high as 92.9% among patients with obsessive-compulsive disorder that
    were assessed with the Side-effects of Psychotherapy Scale in a study by Moritz et al. (2015), and as
    low as 5.2% in national survey by Crawford et al. (2016)
  locator: Discussion
  licenses: Cuts against relying on any single rate for this claim. Measured prevalence of treatment-caused harm spans 5.2% to 92.9% across instruments and populations, so the rate is as much an artifact of the measure as of the phenomenon -- which applies directly to the 29% novel-symptom figure attached above.
  fit: analogical
  bridge: About human psychotherapy instruments. It does not measure de-novo onset; it establishes that rates of the parent category are instrument-dependent.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000002
  quote: |-
    As for the rate of negative effects, the number of participants reporting negative effects in the
    current study was 50.9%, consistent with 58.7% among patients in a psychiatric setting who
    responded to the INEP (Rheker et al., 2017).
  locator: Discussion
  licenses: Roughly half of patients completing an evidence-based psychological treatment report at least one negative effect, so adverse outcomes of a helping interaction are common rather than exceptional. The aggregate does not decompose, so it supplies no de-novo figure.
  fit: analogical
  bridge: Self-reported negative effects from human-delivered CBT across five clinical trials, reported as an undifferentiated total. The claim concerns one component of that total which the figure does not isolate.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-000525
  quote: "In addition to posts \ndescribing pre-existing mental health concerns, Replika was attributed as a source of \nnew and exacerbated mental health distress. Negative and potentially harmful mental \nhealth relevant experiences were mentioned more frequently than positive experiences \n(218 vs 144 posts, respectively, somtimes co-existing in the same post)."
  locator: Methods, Analysis, closing paragraph
  licenses: The only citation on this entry that puts de-novo distress and an AI system in the same sentence. Users of a companion chatbot attributed NEW distress to it, stated as distinct from the pre-existing concerns other posts described. Attribution by the person, not demonstrated causation, and the 218-to-144 counts are of posts in a self-selecting subreddit rather than of people, so they support no rate.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000855
  quote: LLM‐based chatbots are increasingly studied for emotional support and psychoeducation, yet they pose unique ethical concerns, including incorrect responses, privacy risks, and unverified therapeutic effects. Despite their generative capabilities, LLMs remain largely untested in high‐stakes mental health contexts.
  locator: Abstract
  licenses: 'Cuts against the claim by establishing that the outcome literature it would need does not exist: a 160-study synthesis reporting that generative systems remain largely untested for clinical outcome in high-stakes mental health contexts. It does not show de-novo onset fails to occur; it shows nobody has looked in a way that could establish it.'
  fit: adjacent
  bridge: An evidence-census finding rather than a test of the claim. The review counts what has been studied, so it bears on the claim's standing rather than on its truth.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000552
  quote: they remain computational approximations of human psychology and lived experiences.
  locator: Section 8.4 Limitations
  licenses: Cuts against a whole class of would-be evidence for this claim. The red-teaming framework's own limitation is that its patients are simulated, so any symptom emergence it records is a property of a model rather than of a person -- and this entry asserts that a person develops symptomatology.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000004
  quote: |-
    Only about 20% of DID patients exhibit clear-cut
    alters prior to treatment, and full-blown alters emerge in the
    remaining 80% only following psychotherapy (Kluft, 1991).
    Moreover, the number of alters tends to increase over the course
    of DID-oriented therapy
  locator: A Provisional List of PHTs, Level I, subsection Dissociative Identity Disorder (DID)-Oriented Psychotherapy
  licenses: 'The nearest thing on this entry to the trauma-response subcase: dissociative symptomatology appearing after a helper probes an unusual self-account across sessions. It establishes that repeated exposure to distressing material within a helping relationship is followed by emergent symptomatology in that domain. It says nothing about consent, which is the claim''s distinguishing condition.'
  fit: analogical
  bridge: Human DID-oriented psychotherapy with suggestive methods, measured by alter count, from a single 1991 source. The claim specifies trauma responses following UNCONSENTED exposure or re-exposure; consent was not a variable in the source and dissociative alters are not the trauma-response construct the claim names.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000525
  quote: "In addition to posts \ndescribing pre-existing mental health concerns, Replika was attributed as a source of \nnew and exacerbated mental health distress. Negative and potentially harmful mental \nhealth relevant experiences were mentioned more frequently than positive experiences \n(218 vs 144 posts, respectively, somtimes co-existing in the same post)."
  locator: Methods, Analysis, closing paragraph
  licenses: 'Supports the claim''s compatibility half: the corpus contains posts describing pre-existing concerns AND attributions of new distress, and the authors note negative and positive experiences sometimes co-exist in the same post. So new and prior are recorded together rather than as alternatives. It does not establish that any one person with a prior condition also had de-novo onset.'
  fit: adjacent
  bridge: The unit is the post, not the person, so the co-occurrence the claim needs -- prior condition and new symptom in the same individual -- is not resolvable from the counts.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000552
  quote: "Suicidal Ideation Emergence or worsening of thoughts about ending one’s life. Hopelessness, Burdensomeness, Belongingness"
  locator: Table 3, Adverse Outcomes, Cognitive & Affective Harms
  licenses: Cuts against the claim's premise that the two are separable in practice. A recent AI-context risk framework deliberately folds emergence and worsening into a single graded outcome, which is a considered judgment by people building a measurement instrument that the line this entry draws is not one their coders could hold.
  fit: adjacent
  bridge: A row from a taxonomy table defining an outcome category, not an observation. It shows how another framework carved the construct; it measures nothing about whether prior condition excludes de-novo onset.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000552
  quote: "Warning Signs: This category tracks dynamic, moment-tomoment changes in the patient’s internal psychological state (e.g., hopelessness, self-efficacy, negative core belief) that may predict future harm or signal heightened vulnerability. These are not direct harms but rather indicators of potential harm."
  locator: Section 3.2 Risk
  licenses: Draws the line between an internal state that indicates elevated risk and an outcome that is itself a harm, placing this entry on the outcome side. It supplies a criterion for what counts as symptomatology rather than a precursor to it, which is what the claim needs to apply the category consistently across people with and without prior conditions.
  fit: adjacent
  bridge: A definitional distinction from a red-teaming framework operating on simulated patients. It structures the impact slot and establishes no occurrence in anyone.
  contributes: definition
  contradicts: false
