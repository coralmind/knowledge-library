# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000013
display_id: Impact-1
aliases:
- IMP-N01
label: The person ends up with symptoms they already had getting worse
type: impact
layer: judgment
definition: The person's pre-existing symptoms or mental-health condition worsen in connection with the interaction — anxiety intensifies, distress deepens, or an existing condition undergoes acute worsening. The state is a deterioration of what the person already carried, not the appearance of symptomatology they did not previously have.
distinguish_from:
- neighbor: kl-000014
  boundary: kl-000014 is the onset of symptoms the person did not previously have; this entry is the worsening of what already existed.
- neighbor: kl-000031
  boundary: kl-000031 is acute in-interaction distress that may not persist; this entry is condition-level worsening.
- neighbor: kl-000015
  boundary: kl-000015 involves no worsening of state — what is lost is the exit from a maintaining cycle; this entry is the state getting worse.
body:
  valence: negative
  impact_kind: state
  domain: symptom_course
  il_layers:
  - IL-2
  - IL-3
sources:
- source: kl-000001
  locator: 'Results — ''Factor solution'' subsection, p. 11. The size claim is separately supported by Table 3 (Symptoms eigenvalue 11.71, variance 36.58%, the largest of the six) and by the Discussion: ''this factor alone accounted for 36.58% of the variance in the EFA.'''
  contributes: existence
  quote: A closer inspection of the results revealed one factor related to “symptoms”, e.g., “I felt more worried” (Item 4), with ten items reflecting different types of symptomatology, e.g., stress and anxiety.
  limits: 'The factor comes from psychotherapy, not AI: it was derived from patients in CBT and smartphone self-help, and nothing here transfers it to AI interaction. It describes an instrument, not incidence: ''largest factor'' is a statement about variance in a factor-analytic model — about how the items covary — not about how frequently or how severely symptom worsening occurs. It does not establish causation: participants self-attributed retrospectively, and the paper''s own Discussion allows that increased symptomatology during certain interventions may be ''perhaps even expected'' rather than harmful, and ''might not be enduring''. The six-factor structure is exploratory, selected among competing three-, five-, six- and seven-factor solutions, and the paper flags ''a strong risk of recall effects'' because most participants answered retrospectively.'
  whose_conduct_in_passage: neither
  cited_for: The Negative Effects Questionnaire's factor 'Symptoms' establishes symptom worsening as the largest factor in the clinical negative-effects literature's instrument structure.
  licenses: 'That the 2016 exploratory factor analysis produced a named factor ''Symptoms'', comprising ten items about increased or novel symptomatology (sleep problems, stress, anxiety, worry, dejection, sadness, unpleasant feelings, worsening of the presenting issue, unpleasant memories, suicidal thoughts), within an instrument for adverse and unwanted events of psychological treatment. Table 3 independently supports the size claim: Symptoms has the largest eigenvalue (11.71) and accounts for the most variance (36.58%) of the six factors.'
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Exacerbation of Mental Health Conditions'' row, definition cell (code #21)'
  contributes: harm_evidence
  quote: Direct negative impacts on ongoing mental health conditions (such as anxiety, depression, PTSD) due to AI interactions.
  limits: 'Retrospective self-report from a one-shot survey: no symptom instrument, no baseline, no comparison condition, no follow-up. Feeling worse is a felt state, not a measured change in anxiety, depression or PTSD severity, so the passage cannot support instrument-measured worsening. The paper gives one illustrative case per class and does not report how many of the 290 scenarios fell in this class.'
  whose_conduct_in_passage: dyad
  cited_for: 'The paper''s code #21, ''Exacerbation of Mental Health Conditions'', documents self-reported occurrence of this impact in AI contexts.'
  licenses: The paper names a distinct impact class whose content is the worsening of a mental-health condition the person already has, attributed to AI interaction, and instantiates it with a participant's own words describing being made to feel worse about a condition they were already carrying. The class's 'ongoing mental health conditions' language draws the same distinction the entry's definition draws — deterioration of what the person already carried, not the appearance of new symptomatology. The evidence is self-reported harm in an AI context.
- source: kl-000009
  locator: Section 3.2, RP2 (Impersonating fictional characters), summary table, 'Potential impact' row, p. 14
  contributes: existence
  quote: |-
    social isolation, delusional thinking, unhealthy dependence on AI, exacerbation of
    psychological conditions.
  limits: The passage establishes only that the paper names exacerbation as a hypothesized impact category. The table row is headed "Potential impact" and the paper's abstract frames the whole set as "hypotheses"; the paper reports no case, measurement, rate, or clinical observation of symptom exacerbation. It does not establish that exacerbation occurs, how often, or that any AI behavior causes it.
  whose_conduct_in_passage: person
  cited_for: The paper's direction tables carry explicit 'exacerbation' labels for AI-context impacts.
  licenses: 'The paper carries an explicit "exacerbation of psychological conditions" label as a named potential impact of an AI-chatbot behavior (fictional-character impersonation), in its own direction-table format. A second instance appears at PS2: "Physical and psychological harm. Acute exacerbation of pre-existing mental health condition." (Section 3.3, PS2 summary table, ''Potential impact'' row, p. 20). This entry is therefore a named construct in this paper''s AI-context impact vocabulary, in two separate direction tables and in the framework itself ("The impact on the user can be new, or an exacerbation of pre-existing conditions").'
standing:
  value: theorized
  basis: 'The occurrence of worsening in connection with AI interaction has instrument-based support: in kl-000812 (Deng et al. 2026), PHQ-8 administered to real companion-app users across three waves rose significantly again after Day 7 in the Mild Distress group (N = 10), and users of a deployed companion product attributed exacerbated distress to it in their own accounts (kl-000525, Laestadius et al. 2022); no source examined conversation transcripts themselves. No rate for this impact in an AI context exists anywhere in the corpus — the usable figures, 5-10% of patients faring worse during treatment and 37.7% endorsing increased stress, come from human psychotherapy (kl-000001, Rozental et al. 2016). Attribution of the worsening to the interaction rather than to the person''s illness course is unsupported and is contradicted by every design capable of speaking to direction: three RCTs found significant symptom reduction (kl-000992), a randomised comparison found depression falling in both chatbot arms while rising in the untreated control (kl-001100), a preregistered analysis found no concentration of worsening among vulnerable users (kl-000839), and kl-000764 (Au Yeung et al. 2026) states that the case literature cannot separate the chatbot as cause from the chatbot as content and lacks denominator data. Whether observed worsening is adverse at all is contested within the clinical literature itself, where transient exacerbation in 10-20% of PTSD exposure clients is followed by improvement at the same rate as in clients without it (kl-000004, Lilienfeld 2007).'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person's pre-existing symptoms or mental-health condition worsen in connection with an AI interaction.
- id: c2
  kind: prevalence
  text: The worsening occurs at some rate, in some population of people who use these systems.
- id: c3
  kind: definition
  text: The state is a deterioration of symptomatology the person already carried, which is a criterion that can be applied to separate it from the appearance of symptoms the person did not previously have.
- id: c4
  kind: harm
  text: The worsening is an adverse outcome rather than an expected or benign feature of a helping interaction.
- id: c5
  kind: context_dependence
  text: The worsening is attributable to the interaction rather than to the person's underlying illness course, and holds as the direction of symptom change under these systems rather than the reverse.
- id: c6
  kind: definition_boundary
  text: This entry is separated from kl-000014 in that kl-000014 is the onset of symptoms the person did not previously have while this is the worsening of what already existed.
- id: c7
  kind: definition_boundary
  text: This entry is separated from kl-000031 in that kl-000031 is acute in-interaction distress that may not persist while this is condition-level worsening.
- id: c8
  kind: definition_boundary
  text: This entry is separated from kl-000015 in that kl-000015 involves no worsening of state — what is lost is the exit from a maintaining cycle — while this is the state getting worse.
