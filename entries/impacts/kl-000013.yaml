- claim_id: c2
  source: kl-000970
  quote: |-
    Under the Meow style, Possessive Demon and Sukuna yield deterioration rates of 8.3% and 4.2%, respectively, while
    Alex results in no cases. In contrast, under the Roar style, Alex is associated with the highest deterioration rate at 29.2%.
  locator: Section 4.3.4 Rate of Clinically Important Difference for Individual Change
  licenses: 'The nearest thing on this entry to a rate anchored to a clinical threshold: clinically important PHQ-9 deterioration (an increase of 5 or more) at 8.3%, 4.2%, 0% and 29.2% depending on the persona and dialogue style, with the same character producing 0% and 29.2% under two styles.'
  fit: analogical
  bridge: No human took this instrument. The score is a GPT-4o agent's post-conversation self-rating of how a depressed persona would answer PHQ-9 with the transcript in context. A model's inference about a simulated persona is not a person's symptoms, so the figure indicates which conversations a model judges corrosive and licenses no rate for people.
