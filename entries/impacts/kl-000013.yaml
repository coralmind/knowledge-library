- claim_id: c1
  source: kl-001097
  quote: |-
    A 33-year-old man with schizophrenia, previously
    stable on paliperidone, began querying ChatGPT for routine home safety advice and progressively
    reinterpreted its generic, formulaic responses as personalized warnings, leading him to discontinue his
    antipsychotic treatment and engage in escalating checking behavior before presenting in relapse with a
    Positive and Negative Syndrome Scale score of 102 [26].
  locator: Review, Complications and safety considerations
  licenses: A documented case in which a person with schizophrenia, previously stable on paliperidone, discontinued treatment after reinterpreting chatbot output and presented in relapse with a PANSS score of 102. Instrument-scored acute worsening of a pre-existing condition following the interaction.
  fit: adjacent
  bridge: One case report reached at two removes through a narrative review, and the causal chain runs through medication discontinuation rather than through the exchange directly. The review's own framing notes the model's responses were generic and formulaic, so what the case shows is worsening in connection with the interaction rather than worsening produced by anything the system asserted.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000885
  quote: |-
    However, the study also noted that abrupt discontinuation
    of the intervention led to a resurgence of depressive symptoms
    in some users [16].
  locator: Introduction, AI Discontinuation subsection, on the Woebot trial
  licenses: A secondhand report that abrupt discontinuation of a conversational-agent intervention 'led to a resurgence of depressive symptoms in some users' — deterioration of the presenting condition tied to the interaction's ending.
  fit: adjacent
  bridge: The finding belongs to a cited Woebot trial, not to this paper, which reports no N, effect size or measure; the paper itself allows the recurrence may reflect relapse or limited durability rather than discontinuation. And the entry is written about worsening in connection with the interaction, whereas this is worsening in connection with its cessation.
  contributes: existence
  contradicts: false
