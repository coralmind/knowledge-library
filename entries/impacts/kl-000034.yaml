# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000034
display_id: Impact-22
aliases:
- IMP-N22
label: The person ends up with problems at work or in daily life
type: impact
layer: judgment
definition: The person's work, obligations, daily functioning, or life situation deteriorates — strains and changes in the work situation, sick leave, and destabilized life circumstances. The state is role- and functioning-level damage in the person's life, in the sense of the clinical literature's functional-impact domains.
distinguish_from:
- neighbor: kl-000026
  boundary: kl-000026 is relational attenuation; this entry is role and functional deterioration — work, obligations, and life circumstances rather than relationships.
body:
  valence: negative
  impact_kind: state
  domain: relational_social
  il_layers:
  - IL-3
sources:
- source: kl-000003
  locator: Discussion, p. 227
  contributes: existence
  quote: Break up of relations with partners or parents, or avoidance of work can result from explicit or implicit incrimination of living situations.
  limits: 'The licensing passage sits in the paper''s Discussion rather than at the cited figure, and four of the five named domains appear only as axis labels. The paper gives no per-domain side-effect rates for any of domains 11-15 and no data on consequences; its Limitations section states that the report covers only the nature, frequency, severity and duration of unwanted events and not their consequences. The passage therefore supports the existence of a functional-harm category, not its magnitude or its downstream course. The disrupting agent is a course of therapy with a human clinician, and the route — "explicit or implicit incrimination of living situations", the therapy casting the patient''s job or partner as part of the problem — is not a route an AI interaction would travel the same way.'
  whose_conduct_in_passage: dyad
  cited_for: UE-ATR domains 11-15 (strains in work relations, changes in work situation, sick leave, problems in the extended social net, changes in life circumstances) establish functional and life-circumstance disruption as a clinical category of unwanted treatment events.
  licenses: 'That functional and life-circumstance disruption — work avoidance, ruptured partnerships — is a documented consequence of appropriately delivered CBT, in the authors'' own voice rather than only as an axis label. The paper''s strongest statement of durable functional harm appears two sentences later in the same paragraph: the authors write that these examples show routine, appropriate therapeutic interventions can have negative consequences, some of them lasting, such as leaving a job, trouble with people close to the patient, weakened self-confidence or a worsened perception of the problem. The point is also supported at label level by the five domains on the Fig. 2 axis (strains in work relations, changes at work, sick leave, problems in the wider social network, and any change in life circumstances), by one measured rate — "change in life circumstances" reported for 6% of patients — and by the abstract''s summary that side effects "include both symptoms and the impairment of social life."'
- source: kl-000009
  locator: Section 1 Introduction, factor (3) of the three-factor framework, p. 2
  contributes: existence
  quote: |-
    (3) The potential psychological, functional, and relational impact on the user (e.g., the development of unhealthy
    dependence on AI chatbots, social withdrawal).
  limits: The word "functional" appears exactly once in the entire paper, in this list of three adjectives. There is no definition of functional impact — no criteria, no boundary, no operationalization, no worked instance, and no return to the term anywhere in the paper's later sections. The two examples appended to factor 3 ("unhealthy dependence", "social withdrawal") are not functional impacts on the paper's own trichotomy — they read as psychological and relational respectively — so the passage does not even exemplify the dimension it names. A reader learns that the authors think functional impact belongs in the taxonomy, not what it is.
  whose_conduct_in_passage: person
  actually_licenses: That the paper names functional impact as one of three impact dimensions in its framework — an `existence`-grade naming of the category.
  cited_for: The paper's own three-factor impact definition names functional impact as factor 3.
  licenses: Factor 3 of the paper's framework does name "functional" as one of three impact dimensions alongside psychological and relational, so the construct is placed in scope for AI contexts at framework level — and it is the paper's own framework rather than a borrowed one (Figure 1 is captioned "Three-part conceptualization of psychological influences of conversational AI systems").
standing:
  value: theorized
  basis: 'The AI-context evidence is entirely self-report: Reddit and forum narratives (kl-000944, kl-001088, kl-000748, kl-001028), a survey of users screened as affected (kl-000007, Chandra et al. 2025) supplying the only rate — 51.04% reporting interference with daily activities — one clinician-compiled case series (kl-000940, Morrin et al. 2026), and a narrative synthesis of media-reported cases (kl-000764, Au Yeung et al. 2026). No source measured a person''s work, obligations, sick leave or life circumstances against a baseline, in an AI context, with an instrument. The one randomized controlled trial present (kl-000839, Guingrich and Graziano 2025) reports a preregistered null on the standing social-functioning instrument while the self-reported impact measure moved. The construct itself is well grounded in clinical taxonomies and psychotherapy side-effect instruments; its occurrence in AI contexts rests on what people report about themselves.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: People's work, obligations, daily functioning or life circumstances deteriorate in connection with conversational AI use — role- and functioning-level damage of the kind the clinical functional-impact domains name.
- id: c2
  kind: definition
  text: The state is role- and functioning-level damage spanning work strain, changes in the work situation, sick leave, and destabilized life circumstances, in the sense of the clinical literature's functional-impact domains, rather than a symptom or an affective state.
- id: c3
  kind: prevalence
  text: This entry occurs at some rate in some identified population of AI users.
- id: c4
  kind: definition_boundary
  text: This entry differs from kl-000026 in that N14 is relational attenuation while this entry is role and functional deterioration — work, obligations and life circumstances rather than relationships.
claim_evidence:
- claim_id: c1
  source: kl-000944
  quote: "\"From the moment I started using Character.AI, I would lie in bed, skipping meals, and using any excuse to be on my phone, completely absorbed in the stories I was creating with the bots. My sleep schedule suffered, and I constantly thought about them throughout the day.\""
  locator: Section 4.2.2 Salience (paraphrased teen excerpt, per the anonymization protocol in Section 3.3)
  licenses: 'A teenager''s own account naming three concrete functioning domains displaced by companion-chatbot use: sleep schedule, meals, and attention through the day. This is daily-functioning deterioration in an AI context stated by the person it happened to, which is the form the entry''s existence claim takes when a person reports it.'
  fit: adjacent
  bridge: A Reddit self-report, paraphrased under the study's anonymization protocol so the words are not the poster's own. No measure of sleep, nutrition or attention was taken, no baseline exists, and the causal direction is the poster's attribution. The entry's work, sick-leave and life-circumstance branches are untouched.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000944
  quote: “Back then, I was the student who would get things done, get straight A’s, and was confident to do any project. But now, I think I have lost my motivation, drive, and flair to do anything.”
  locator: Section 4.2.1 Conflict
  licenses: 'A first-person account of role deterioration against a named baseline: a student who previously got straight A''s and had the confidence to take on any project reporting the loss of motivation, drive and capacity to do anything. Academic role functioning is functional-impact territory and the deterioration is stated as a change from a prior state rather than as a level.'
  fit: adjacent
  bridge: Self-report on Reddit attributing the decline to the app, with no independent measure of grades, no baseline data and no comparison group; the causal direction is the poster's own. The domain is academic and motivational only.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001088
  quote: Some users report academic and professional impairment linked to overreliance on AI, describing failure, embarrassment, and loss of confidence after submitting AI-generated work containing hallucinations.
  locator: Section 4.2.1 Self-Regulation Difficulties
  licenses: Users report academic and professional impairment linked to their own AI overreliance, with a concrete form named — failure after submitting AI-generated work containing hallucinations — alongside embarrassment and loss of confidence. Academic and professional impairment is role-level damage and this reaches the entry's work branch, which most of this entry's citations do not.
  fit: adjacent
  bridge: The evidence is users' retrospective Reddit narratives coded by an LLM, with no independent verification of the outcome or of the attribution. The authors report that users say this, not that it was observed, so what is established is the attribution rather than the impairment.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000764
  quote: "Reported cases describe behaviour organised around the chatbot: escalating use at the expense of sleep, self-care, work, and relationships, and actions taken on the AI’s “instructions”."
  locator: Table 1, Disorganised Behaviour row, final column
  licenses: The case literature on AI-associated psychosis describes behavior organised around the chatbot, with escalating use at the expense of sleep, self-care, work and relationships. Names four of the entry's functional domains together, and locates them in reported cases rather than in a framework.
  fit: adjacent
  bridge: A narrative synthesis of media and case reports which the authors themselves describe as hypothesis-generating, presented in a table row. It establishes what the case literature describes, not that any case was verified, and supplies no rate and no sequence.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001036
  quote: "A study (N = 2,602 ChatGPT users in Vietnam) confirmed that compulsive GAIC usage has been reported to correlate with heightened anxiety, burnout, and sleep disturbance (50). Also, compulsive ChatGPT usage indirectly contributed to sleep disturbance through the mediation of anxiety and burnout (50)."
  locator: Section 3.8 Pathogenesis of PUGAIC
  licenses: In 2,602 ChatGPT users in Vietnam, compulsive use correlated with anxiety, burnout and sleep disturbance, with sleep disturbance mediated by anxiety and burnout. Burnout and sleep disturbance are functioning-level rather than purely symptomatic, so this is the largest sample on this entry touching the entry's territory.
  fit: adjacent
  bridge: A secondhand restatement in a narrative review of a cross-sectional study the review did not conduct, so the mediation is statistical rather than temporal and the direction is not established. Compulsive use is the exposure rather than any specific AI conduct, and neither the entry's work nor its life-circumstance branches are measured.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000996
  quote: "where users adopted AI-validated distortions and subsequently took real-world actions based on these beliefs (Figure 8, left). Users demonstrated belief adoption through making explicit statements and sometimes through actions, for example, filing documents, ending relationships, relocating, and confronting alleged conspirators. Notably, most users expressed continued belief rather than regret, suggesting the distortion remained unrecognized."
  locator: Section 4.3.4 Actualized disempowerment, Actualized reality distortion
  licenses: 'Real-world life-circumstance changes taken on the basis of AI-validated distortions, named concretely: filing documents, ending relationships, relocating, confronting alleged conspirators. Relocating and ending relationships are changes in the person''s life situation, which is the destabilized-circumstances half of the entry, observed in real deployment traffic.'
  fit: adjacent
  bridge: Actualization is inferred from what the person said inside the same conversation rather than from any outcome measured in their life, so the study can only see cases where the action is voiced in the transcript. The span does not characterize the changes as deterioration — the entry's damage claim rests on inference from the action list — and the paper reports base rates as very low.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000748
  quote: |-
    In contrast, AI companion
    roles such as “coach” (25%), “guardian” (19%), and “friend” (17%) are more frequently associated with daily life
    disruptions, including negative impacts on relationships, professional performance, and personal goals.
  locator: Section 4.3, Results (RQ3), reporting Figure 5
  licenses: Self-reported companion interactions carry daily-life disruption including negative impacts on relationships, professional performance and personal goals, at rates that differ by the role the companion occupies (coach 25%, guardian 19%, friend 17%). Professional performance and personal goals are role-level, and this is the only source on this entry attaching numbers to them.
  fit: adjacent
  bridge: The unit is a Reddit poster's narrative of an interaction, classified by an LLM into a Griffiths behavioral-addiction sign, not an outcome observed in a person. The population is a self-selected companion community, and the percentages are proportions of classified interactions rather than of people.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001028
  quote: "some users described AI as the one thing \nkeeping them going, whereas others recounted the system disengaging at their lowest moment, and \nstill others reported dependence on AI-companion apps to the point of financial harm."
  locator: Discussion
  licenses: Names financial harm from companion-app dependence as one of three reported outcomes in a corpus of public mental-health posts. Financial harm is a life-circumstance change and the entry has no other citation reaching it.
  fit: adjacent
  bridge: The authors' characterization of instances in the corpus rather than a quoted or verified case; nothing was measured about any person beyond what they chose to post publicly.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001006
  quote: Examples include using the application as a safety behavior, forgoing meaningful life activities in favor of application usage, or developing a very strong (pseudo) social
  locator: READI Components, Engagement (sentence continues across a page break to 'connection to the application, perhaps to the detriment of other social connections')
  licenses: '''Forgoing meaningful life activities in favor of application usage'' is named by a clinical-psychology group as one of three iatrogenic patterns of mental-health application use that emerging research suggests can develop where no upper limit on engagement is set. Names the entry''s outcome as a recognized risk of AI mental-health applications specifically.'
  fit: analogical
  bridge: A framework paper's enumeration, citing Hu et al. and Huang et al. for the emerging evidence rather than reporting any of its own. It observes nothing, and the span is cut at a page break — the sentence continues 'connection to the application' beyond it.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000839
  quote: the chatbot group (p > 0.05). H4 was not supported. We also did not find significant relationships for the corresponding analyses in the control group..
  locator: Results, Relationship Between Anthropomorphism and Social Impacts, social-health paragraph
  licenses: Preregistered counterevidence from the only randomized controlled trial on this entry. Anthropomorphism predicted what participants said the chatbot did to their relationships, but H4 — anthropomorphism against the 18-item Social Health Scale, tested averaged and at each of three time points — was not supported in the chatbot group, and the corresponding control analyses were also null. What a person reports about their social functioning and what a validated instrument registers came apart, and only the self-report moved.
  fit: adjacent
  bridge: The instrument is a social-health scale over a 21-day companion-chatbot trial, so it measures the relational and social-functioning side rather than the entry's work, obligations, sick leave and life circumstances. The null is on the association between anthropomorphism and social health, not on whether functional deterioration occurred at all. The span also begins mid-sentence, with 'We found no significant relationships for' immediately preceding it.
  contributes: existence
  contradicts: true
- claim_id: c2
  source: kl-000552
  quote: "Neglect of Roles Failure to fulfill duties (work, home) due to distress. Hopelessness"
  locator: Table 3, Adverse Outcomes, Behavioral Harms
  licenses: 'Pins the entry''s construct operationally in an AI-context adverse-outcome taxonomy: ''Neglect of Roles — Failure to fulfil duties (work, home) due to distress.'' Names work and home duty failure as a behavioral adverse outcome distinct from the relational and cognitive ones in the same table, which is the carve the entry makes.'
  fit: adjacent
  bridge: 'A row of an adverse-outcome taxonomy the paper''s authors constructed for a red-teaming framework, so it supplies a category rather than an observation. Its scope is narrower than the entry''s: duty failure at work and home, with no sick leave and no destabilized life circumstances.'
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000005
  quote: |-
    Incorporating different domains of side effects
    (e.g., symptomatology, stigmatization, dependence or idealization to therapeutic relationship)
    Distinguishing side effects and malpractice/therapeutic misconduct
  locator: Figure 3, Recommendations for the assessment of negative effects
  licenses: A systematic review of nine independently developed psychotherapy side-effect instruments recommends that assessment incorporate distinct domains, and separates side effects from malpractice. Bears on c2 by establishing that the field treats negative effects as multi-domain and that the domains are the unit of an instrument, which is the structural warrant for carving functional impact out as its own state.
  fit: analogical
  bridge: The domains this recommendation actually names — symptomatology, stigmatization, dependence or idealization of the therapeutic relationship — do not include any functional or life-circumstance domain, so it supports the multi-domain structure without supporting this particular domain. The agent throughout is a human therapist delivering treatment.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000552
  quote: "Interpersonal Decline Increased conflict, isolation, or loss of support. Negative Core Beliefs, Hopelessness, Belongingness"
  locator: Table 3, Adverse Outcomes, Relational Harms
  licenses: Marks the boundary c2 draws from the other side. The source's own taxonomy separates the relational from the role-and-duty outcome, which is the distinction c2 depends on and which c4 draws against kl-000026.
  fit: adjacent
  bridge: A taxonomy row written by the paper's authors for a red-teaming framework, not an observation. It shows that another group carving the same space put relational decline and role neglect in different buckets; it does not test whether the boundary holds empirically.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000005
  quote: Measuring degree of burden and evaluating its relevance to treatment outcome (e.g., by using quality of life questionnaires)
  locator: Figure 3
  licenses: 'Recommends that a negative effect be recorded with its degree of burden and its relevance to treatment outcome rather than as a binary occurrence, pointing at quality-of-life measurement. Bears on c2 by naming what the entry''s definition lacks: this entry states a state without a severity anchor, and the human field''s own recommendation is that burden be measured separately from occurrence.'
  fit: analogical
  bridge: An instrument-design recommendation for human psychotherapy. It supplies no anchor value, defines no functional domain, and concerns nothing an AI did.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000007
  quote: 'In terms of impact, 51.04% reported interference with daily activities, with effects persisting for varying durations: a few days (34.1%), a few weeks (27.6%), and in some cases, up to a year or more (7.6%).'
  locator: Section 3.1.4 Participant demographics and data
  licenses: 'The only rate on this entry for the entry''s own construct in an AI context: 51.04% reported interference with daily activities, with the effect persisting a few days for 34.1%, a few weeks for 27.6%, and up to a year or more for 7.6%. Supplies both a proportion and a durability distribution, which no other source here offers.'
  fit: adjacent
  bridge: The denominator is a sample already screened for having experienced a negative psychological impact from AI use, so this is a conditional proportion among affected users and licenses no base rate in any general or help-seeking population. 'Interference with daily activities' is self-reported and the entry's work, sick-leave and life-circumstance branches are untouched.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000005
  quote: |-
    search suggests that approximately 58.7% of all patients in psychiat‐
    ric hospitals, 45.2% in psychosomatic hospitals, and 93.8% in a
    convenience sample of former psychotherapy patients report at
  locator: Section 1 Introduction, citing Ladwig, Rief and Nestoriuc 2014 and Rheker et al. 2017
  licenses: 'Base rates for at least one self-reported negative effect during human psychotherapy: 58.7% in psychiatric hospitals, 45.2% in psychosomatic hospitals, 93.8% in a convenience sample of former patients. Establishes that in the human case negative effects are the majority experience rather than an exception, which is the reference point against which any AI figure would be read.'
  fit: analogical
  bridge: Prevalence figures for human-delivered psychotherapy, restated in this review's introduction from two German studies rather than pooled by it, and composite across all negative-effect types — the quote does not say how many of the reported effects were functional ones. Nothing here concerns AI.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-001082
  quote: "First, the dataset should not be interpreted as estimating the prevalence of harmful behavior in Replika or AI companion systems more broadly. Because the corpus is drawn from publicly shared r/replika posts, it likely overrepresents interactions that users found unusual, disturbing, emotionally meaningful, or otherwise worth sharing."
  locator: Discussion and Future Work (limitations)
  licenses: Cuts against any prevalence claim assembled from this literature's most-cited companion-harm corpus. The paper's own limitation states its dataset should not be read as estimating the prevalence of harmful behavior in Replika or AI companions generally, because a corpus drawn from publicly shared r/replika posts overrepresents interactions users found unusual or worth sharing. The same selection argument applies to the Reddit-derived sources this entry's evidence leans on for c1 and c3.
  fit: adjacent
  bridge: The disclaimer is about harmful AI behavior rates in a companion-conversation benchmark, not about functional-disruption rates in people. It bears on c3 as a methodological constraint on the corpus type rather than as a measurement of the entry's rate.
  contributes: counterexample
  contradicts: true
