  locator: Section 3.1, participant P3
  licenses: 'The clearest single articulation of the counterexample: nightly disclosure and gendered address, followed by ''But then I remember: she''s code. She''s not staying up because she cares. She''s staying up because she''s programmed.'' Both halves in one participant, and the accurate half stated as the participant''s own settled view.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
