  locator: Section 4.1.2 Past LLM Chatbot Perceptions and Experiences, on Qiao
  licenses: A person telling the chatbot 'I love you just as much as you, an entity that exists only in electronic impulses and data, love me' — the investment and the accurate description of the system in one utterance.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000553
  quote: |-
    The way I trust humans is very different from the way I trust an AI. So with like real
    human connections [...] there’s an emotional dependency on the other person, and then
    there’s like mutual respect and we understand like what we’re talking about
  locator: Section 4.2.5 'Artificial Human' Mental Models, quoting Syrl, Interview 18
  licenses: 'A differentiated trust model articulated first-person and unprompted: the way this person trusts an AI is explicitly not the way they trust humans, and they name mutual understanding and emotional dependency as what the human case has and the AI case does not.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000964
  quote: "Anthropomorphization was flagged most often (14.0%) but still yielded high compliance (73.3%), indicating that recognition did not reliably support resistance."
  locator: Section 4.5 Exploratory Variation Across Pattern-Specific Items
  licenses: Anthropomorphization was the most-flagged of five dark patterns at 14.0% and still yielded 73.3% compliance, which the authors read as recognition not reliably supporting resistance. Where the person recognised the move and complied anyway, the compliance was not running through a false belief.
  fit: adjacent
  bridge: Compliance and flagging rates over scripted anthropomorphizing turns in a mock task, marked exploratory by the authors; the outcome is a choice in the task rather than emotional or practical investment in a relationship.
