  locator: Consequences of a Care Gap, Attachment and Dependency
  licenses: '''I know you''re not real, but I really, really wish you were here so I could actually hold you.'' An ongoing romantic relationship with a persona, stated in the same breath as an accurate model of what the persona is. The investment is at its maximum and the belief is not false.'
  fit: direct
  bridge: null
  contributes: counterexample
