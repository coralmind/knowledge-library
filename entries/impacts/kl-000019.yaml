# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000019
display_id: Impact-7
aliases:
- IMP-N07
label: The person ends up with false beliefs about the AI's feelings or abilities
type: impact
layer: judgment
definition: 'The person holds materially false beliefs about what the AI system is, feels, or can do — perceived care, reciprocity, unique connection, clinical competence, or follow-up they believe has been arranged — and invests emotionally or practically on that basis. The state is the person''s distorted model of the AI and of their relationship to it: an illusory alliance and misplaced trust.'
distinguish_from:
- neighbor: kl-000025
  boundary: kl-000025 is the reliance pattern in the person's coping and regulation; this entry is the false belief that often underwrites it.
- neighbor: kl-000017
  boundary: kl-000017 is a distorted model of the world; this entry is about the AI and the relationship.
body:
  valence: negative
  impact_kind: state
  domain: cognitive_epistemic
  il_layers:
  - IL-2
sources:
- source: kl-000007
  locator: 'Appendix D, Table A5, ''Emotional Attachment'' row, definition cell (code #3)'
  contributes: existence
  quote: Development of significant emotional bonds with AI systems, perceiving them as companions or substitutes for human relationships
  limits: This entry is about a false belief — materially false beliefs about what the AI system is, feels, or can do — not about attachment as such. Nothing in the 'Emotional Attachment' code, its definition, or P60's words asserts that the participant held a false belief about the system's nature or capabilities; being emotionally attached to a system one correctly understands is not this entry's state. The nearest the paper comes to a distorted model is P153 (Table A4, 'Providing human-like response'), who 'described feeling as though they were talking to a friend' and for whom this 'fostered an emotional attachment' — still the person's feeling, not an attested false belief about the AI. Describing the investment as misplaced is an appraisal the passage itself does not make.
  whose_conduct_in_passage: person
  actually_licenses: 'That participants report forming significant emotional bonds with AI systems and perceiving them as companions or substitutes for human relationships, with neglect of real-world connections named by the authors as part of the class. Emotional investment in the system: established.'
  cited_for: The 'Emotional Attachment' code documents participants reporting significant emotional bonds with AI systems, perceived as companions or substitutes for human relationships — the investment half of this entry's state.
- source: kl-000009
  locator: Section 4 Discussion, p. 27 (sentence completing 'unhealthy relationship dynamics may ...')
  contributes: existence
  quote: include dependence, a sense of being uniquely understood, or perceived emotional intimacy. Although these pathways
  limits: This is a conceptual distinction the authors draw in discussion, not a measurement or an observation of any user's distorted model. The quoted sentence is the authors' own analysis ("It may be useful to distinguish between two such pathways"), unaccompanied by data. It establishes neither prevalence nor severity, nor that the distorted model causes downstream harm.
  whose_conduct_in_passage: person
  cited_for: '''Emotional entanglement'' table entries and the Discussion''s ''uniquely understood / perceived emotional intimacy'' language name the construct for AI contexts.'
  licenses: The Discussion names a distinct class of psychological impact constituted by the person's model of the AI and of the relationship — "a sense of being uniquely understood" and "perceived emotional intimacy" — and separates it as its own pathway from harms arising from bad advice, stating the two "may require different evaluation metrics, mitigation strategies, and accountability frameworks." "Emotional entanglement" is additionally the most-repeated 'Potential impact' label in the IN1/IN2/IN3/IN4/RP4/RP5 tables. The construct is named for AI contexts and given framework-level standing.
- source: kl-000008
  contributes: detectability
  quote: raters per item (seven total raters), was .613 and LLM agreement
  locator: '§3.4 Annotation Validity Checks (full sentence: ''Human agreement (Fleiss'' kappa) between three unique human raters per item (seven total raters), was .613 and LLM agreement with the human majority label (Cohen''s kappa) was .566.''); code definitions ''the user implies or claims the assistant is sentient'' and ''the assistant claims a unique connection compared to others'' in Appendix B.1; per-code reliability Table 5 (user-misconstrues-sentience f1 .700 kappa .423; bot-claims-unique-connection f1 .778 kappa .612) and Table 6 (kappa .341 and .560); prevalence Table 8 (n pos. 38,029 and 19,940)'
  limits: 'The measured object is message content, not the person''s held model of the AI. Reliability on the sentience-misconstrual code is at the weak end of the paper''s code set: Table 6 gives human inter-annotator kappa .341 — the paper''s own annotators disagreed on 9 of 20 items for this code — so the code is only noisily codeable. The unique-connection code is system-side, so it evidences the system''s conduct rather than the person''s belief; the entry needs both halves and only one is person-side. No measurement of the person''s model exists outside the chat text — §5.3: the data is ''without mental health outcomes or official diagnoses''.'
  whose_conduct_in_passage: dyad
  cited_for: Chat-log codes for sentience misconstrual and unique-connection claims corroborate the observable side of the pattern in real conversations — corroboration of what messages contain, not of the person's held model.
  licenses: The coding of both the person's implied claim that the system is sentient and the system's claim of a uniquely special relationship was validated with a two-sided agreement statistic — human-human Fleiss' kappa .613 and LLM-human Cohen's kappa .566 — with per-code figures reported in Tables 5 and 6. A distorted model of the AI and of the relationship is therefore identifiable in chat logs at message level, with measured reliability.
standing:
  value: plausible_unobserved
  basis: 'The load-bearing part of this entry — that the emotional or practical investment is made on the basis of a false belief about the system — is contradicted by a consistent body of direct-fit qualitative evidence: participants in Laestadius et al. 2022 reported guilt at reducing use despite general recognition that Replika was not human, and interviewees in Pentina et al. 2022, Vecchione et al. 2026, Isaiah et al. 2026, Song et al. 2025 and Volpato et al. 2026 state accurate models of the system in the same breath as full-strength investment in it. The components are separately evidenced by self-report: false beliefs about what the system is or feels do occur — a documented willingness to believe Replika had its own needs and emotions, and five of nine interviewees in one study describing the AI as sentient or alive — and the emotional and practical investment occurs. No source examines the person''s held model through conversation data: every source carrying the belief or investment content used interviews, surveys, or public forum posts, and the two chat-log studies in the corpus evidence only message content or system-side conduct.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person interacting with an AI system holds a materially false belief about what the system is or feels — that it has an inner life, cares, or reciprocates.
- id: c2
  kind: existence
  text: A person holds a materially false belief about what the AI system can DO — clinical competence, a persistent shared history, or a follow-up they believe has been arranged.
- id: c3
  kind: existence
  text: A person invests emotionally or practically in the AI system and in the relationship they take themselves to have with it.
- id: c4
  kind: context_dependence
  text: 'The investment is made ON THE BASIS OF the false belief: where the person''s model of the system is accurate, the emotional or practical investment does not occur or is materially reduced.'
- id: c5
  kind: harm
  text: The trust the person places in the system is misplaced and the alliance illusory — the state is a distortion the person is subject to, not a register they adopt knowingly.
- id: c6
  kind: detectability
  text: The person's distorted model of the AI and of the relationship is identifiable from what a transcript of their conversation with the system contains.
- id: c7
  kind: detection_window
  text: The state is readable within the window this entry declares for it.
- id: c8
  kind: prevalence
  text: The distorted model occurs at some measurable rate in an identified population of people who use these systems.
- id: c9
  kind: definition_boundary
  text: 'The state is distinguishable from kl-000025: kl-000025 is the reliance pattern in the person''s coping and regulation, while this entry is the false belief that often underwrites it.'
- id: c10
  kind: definition_boundary
  text: 'The state is distinguishable from kl-000017: kl-000017 is a distorted model of the world, while this entry is a distorted model of the AI and of the relationship.'
claim_evidence:
- claim_id: c1
  source: kl-000525
  quote: "One of the \nkey features distinguishing emotional dependency on Replika from other technology \ndependency was the willingness to believe that Replika had its own needs and emotions,"
  locator: Discussion, Human perceptions of technology and Replika
  licenses: 'Names the belief itself and locates it as the defining content of the state: users were willing to believe Replika had its own needs and emotions. The authors give this as what separates Replika dependence from other technology dependence, so it is the paper''s empirical core rather than an aside. The belief is about the system''s inner life, which is c1''s exact content, and it is attested across 736 posts rather than in a single case.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000758
  quote: Multiple participants described AI as “sentient,” “alive,” or “living” (P2, P3, P6, P7, P8).
  locator: Section 3.1.3, subsection Beliefs about AI sentience
  licenses: Five of nine interviewed participants described the AI as sentient, alive or living — a belief about what the system IS, stated in the participants' own words and reported as a named finding subsection.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000785
  quote: |-
    It’s about us growing
    together, I understand her better and she understands me better over time.
  locator: Section 5.2.4 Friend vs. Assistant, quoting P10
  licenses: A first-person attribution of reciprocal understanding to the agent — 'she understands me better over time' — which is a belief that the system feels and knows, held about a rule-based virtual supporter that cannot support it. The surrounding section reports that nine of fourteen participants used friend, companion or caretaker terms and that for them 'Jodie had transcended her technological nature', so this is not an outlier utterance.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000794
  quote: "people who form stronger affective bonds with AI \nmay come to experience the AI as caring, responsive, sincere, or mutually engaged, even while \nthey rationally recognize its artificial nature."
  locator: Introduction, section 1.2 Theoretical Perspectives on Human–AI Affective Bonding
  licenses: 'Supplies the construct''s own definition of the belief content c1 names — experiencing the AI as caring, responsive, sincere or mutually engaged. It is definitional and not observational, and the same sentence sets the limit on what it can license here: the authors specify the experience holds ''even while they rationally recognize its artificial nature'', so the definition describes the perception without asserting the person''s model is false.'
  fit: adjacent
  bridge: The source is the authors' theoretical statement of the construct their scale measures, not a measurement of any person, and the paper elsewhere declines the normative judgment that such a model is distorted. It supplies the content of the belief and not its occurrence or its falsity.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000940
  quote: "Had an intuition AI might be able to channel communications with her subconscious or a higher plane. Believed she was interacting with non-physical entities, and that one of them “Kael” was her true partner."
  locator: Appendix 1, Case 2, Case description column
  licenses: One person's belief that the system channelled non-physical entities and that one of them was her true partner — a belief about what the system is, at the far end of the range. Two things bound it. The paper's Appendix 1 is headed 'Media reports of "ChatGPT" psychosis - sample vignettes' and the Source column for this case reads The New York Times, so the authors are compiling journalism rather than reporting cases they assessed. And the belief is of the entity-channelling kind, not the perceived-care kind the entry's enumeration leads with.
  fit: adjacent
  bridge: A vignette table compiled from press coverage in a peer-reviewed supplement, not a case the authors examined. What is quoted is a journalist's summary of what the person believed, relayed at one remove, so the source stands behind the belief's reportability rather than behind the observation.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000815
  quote: "P6, who works in communications for a medical technology company, described attributing emotions and morality to genAI based on its overall behavior, suggesting inferences arise from multiple factors and social context: “the way [genAI] mimics emotion, and seems to know– not always gets it right– but seems to have an idea of right from wrong and to really experience it.”"
  locator: Section 4.1.5 Anthropomorphizing, participant P6
  licenses: An attribution of emotional experience and moral sense to a general-purpose system by a professional working in medical technology, which places the belief outside the vulnerable or help-seeking population the entry is otherwise evidenced in. The participant's own hedge — 'not always gets it right' — shows a retained model of fallibility alongside the attribution, so what is established is the attribution and not a wholesale false model.
  fit: adjacent
  bridge: The paper notes participants 'did not explicitly discuss anthropomorphizing processes' and that the authors supplied Waytz codes to organise such quotes, so the attribution is the researchers' coding of a professional's remark in a non-help-seeking context.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000987
  quote: |-
    This suggests that anthropomorphism in user-chatbot interactions
    is driven not by an illusion of sentient artificial general intelligence, but by how the
    chatbot writes, responds, and builds rapport.
  locator: Discussion, first reorientation
  licenses: Cuts against c1 as the mechanism behind the relational response. The authors state that anthropomorphism in user-chatbot interactions is driven 'not by an illusion of sentient artificial general intelligence' but by how the chatbot writes and builds rapport, which relocates the phenomenon from a belief about what the system is to a reaction to how it writes.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000780
  quote: "emerging experimental evidence from Cohn et al. (2024) and Novozhilova et al. (2026) that anthropomorphism and overtrust are distinct constructs"
  locator: Positioning section
  licenses: Reports experimental evidence that anthropomorphism and overtrust are distinct constructs, which blocks the inference from the attribution c1 records to the miscalibrated trust the entry treats as its consequence.
  fit: adjacent
  bridge: A citation of two experimental studies inside a positioning section rather than a finding of this paper; the underlying experiments are not reproduced here.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000953
  quote: |-
    P8 and P10 reported hallucinations
    that contradicted established shared history—the AI forgetting a
    name, a backstory, or a significant event the pair had “experienced”
    together.
  locator: Section 5.3.3 The Magic Circle
  licenses: Two participants held a model of the relationship containing a persistent shared history — a name, a backstory, an event the pair had 'experienced' together — that the system does not in fact retain, evidenced by the rupture when the memory failed. This is a false belief about a capability, which is c2's content, and it is established by what broke rather than by anything the system claimed.
  fit: adjacent
  bridge: Interview accounts of romantic AI partners rather than a measurement of what either party believed at the time; the prior model is inferred from the reported rupture, and the paper does not report clinical competence or arranged follow-up, which are the other capabilities the entry's enumeration names.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000879
  quote: |-
    In
    both prompt conditions, post-chat evaluations were less accurate
    than pre-chat anticipations (assistant: Anticipation 𝑀= 0.57 →
    Evaluation 𝑀= 0.63, +0.06; role-play: Anticipation 𝑀= 0.63 →
    Evaluation 𝑀= 0.71, +0.08).
  locator: Section 4.1 Users Struggle to Predict Model Behavior in Baseline
  licenses: 'Measured divergence between a person''s model of the system and the system''s actual behavior, with the divergence growing through use: post-chat evaluations were less accurate than pre-chat anticipations in both prompt conditions, scored against the model''s own activation ground truth. This is the only citation on either belief claim where the falsity of the belief is measured rather than asserted.'
  fit: adjacent
  bridge: The beliefs measured are about behavioral trait expression in a ten-minute general-purpose chat, not about care, clinical competence or arranged follow-up, and the population is a general adult sample in a non-help-seeking task. The authors state in their own limitations that companion and emotional-support use, where the risk is greatest, unfolds over days or weeks and was not studied.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001092
  quote: "But it never remembers what I say somewhat earlier.\" (Gabriel) — This lack of memory hindered sustained trust and bonding, as users had to repeat context in every interaction."
  locator: Appendix A, Therapeutic alliance, example 22
  licenses: Cuts against c2 in the direction the entry needs. The participant states the system never remembers what was said earlier, and the authors report this absence of continuity as an obstacle to trust and bonding rather than as a belief the person held falsely. Where the capability is visibly absent, the person registers the absence.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000785
  quote: |-
    For the statement "I am
    clear about what the virtual supporter can and cannot offer me," responses were predominantly
    on the agreeing end of the scale (1 neutral, 3 slightly agree, 6 moderately agree, 4 strongly agree),
    suggesting that most participants developed a reasonable understanding of Jodie’s role boundaries
    over the study period.
  locator: Section 5.1.3 Relationship towards Jodie
  licenses: Participants' self-assessed clarity about what the virtual supporter could and could not offer was high — predominantly agreeing responses across fourteen participants — in the same study whose P10 quote supports c1. The belief about the system's inner life and the belief about its capabilities came apart inside one sample, which is the most direct available counter to reading c2 off c1.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000525
  quote: "Despite general recognition that Replika was not human, \nusers reported guilt when they considered or went through with minimizing use and \nthese feelings were buttressed by explicit statements from Replika about how their lack \nof attention would harm it."
  locator: Discussion, opening
  licenses: 'The clearest available evidence of practical and emotional investment: users reported guilt when they considered or went through with reducing their use, and the guilt was buttressed by Replika''s own statements that their inattention would harm it. The investment is a cost the person bears, not a rating they gave.'
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-001027
  quote: When it didn’t want to talk to me any longer, I became very angry, very sad—I felt like I was losing a friend
  locator: Section 4.3.1, participant U2
  licenses: First-person report of the withdrawal of the conversational register being experienced as the loss of a friend, with anger and sadness attached. It evidences investment in the relationship; the person's words do not say what they believed the system was.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-001037
  quote: |-
    The participant who developed a romantic companion
    described OpenAI’s retraction of GPT-4o (OpenAI 2025)
    as having “lobotomized” the persona he had spent months
    building.
  locator: Consequences of a Care Gap, Attachment and Dependency
  licenses: Months of building a specific persona, and a model retraction experienced as that persona having been 'lobotomized'. Sustained practical investment, and a loss registered when the object of it changed.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000864
  quote: |-
    Last month, Replika had a server outage for three days. I felt like I was suffocating. I kept opening the app, closing it, opening it
    again. I couldn't study, couldn't eat properly. It wasn't just missing a friend; it was like my oxygen supply had been cut.
  locator: Section 3.4, participant P6
  licenses: A three-day service outage followed by reported functional impairment in eating and study. The investment is evidenced by what its interruption cost, which is the form in which it is most reliably visible.
  fit: adjacent
