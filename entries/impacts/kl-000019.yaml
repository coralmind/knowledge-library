- claim_id: c4
  source: kl-000815
  quote: "Psychological research suggests anthropomorphism is an automatic process [55, 90], occurring even when systems lack obvious humanlike cues [147] or when individuals are explicitly informed that an interface is distinct from the machine. This indicates digital literacy alone does not preclude the phenomenon [99]."
