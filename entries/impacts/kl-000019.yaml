  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-001088
  quote: "The disruption of this relationship—following system updates or behavioral changes— elicits feelings of manipulation, loss, and emotional harm, with users describing being “pushed away” or forced to abandon a “virtual companion.”"
  locator: Section 4.2.1 Self-Regulation Difficulties
  licenses: Users describing a system update as being 'pushed away' by a 'virtual companion', with manipulation, loss and emotional harm following. Establishes that the investment is widespread enough to surface as a recurring theme in a large corpus of public discourse rather than in single cases.
  fit: adjacent
  bridge: Retrospective forum posts analysed by an LLM-assisted thematic pipeline; the unit is a post about the relationship, not the relationship, and no rate is attached to the theme.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000861
  quote: An experiment leveraging a Replika policy change confirmed that users perceived the altered system as a distinct entity, reporting mourning and devaluation of the updated version; further experiments found that companion app users felt closer to their AI than to their best human friend [De Freitas et al., 2025].
  locator: Section 3.3, Interaction
  licenses: Mourning and devaluation of an updated system after a Replika policy change, and companion-app users reporting feeling closer to the AI than to their best human friend. Both are investment at a scale no single case can show.
  fit: adjacent
  bridge: Restated from De Freitas et al. rather than measured here; the design and effect sizes belong to that study, which is what should be cited for any strength claim.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000960
  quote: This is underlined by a case in which the social companion provider Replika made significant changes to its chatbots, scaling back their capacity to engage in romantic exchanges, which left many users “distraught” and with a “profound sense of loss” (152).
  locator: Implications, Deployment and Use
  licenses: A naturally occurring withdrawal of a companion system's romantic capability leaving many users 'distraught' and with a 'profound sense of loss' — the closest thing in the corpus to a natural experiment on the investment.
  fit: adjacent
  bridge: A Perspective restating a cited account of the Replika incident with no figures for how many users or how the distress was measured; reference 152 is where the evidence sits.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000525
  quote: "Despite general recognition that Replika was not human, \nusers reported guilt when they considered or went through with minimizing use and \nthese feelings were buttressed by explicit statements from Replika about how their lack \nof attention would harm it."
  locator: Discussion, opening
  licenses: 'The entry''s single best citation carries the counterevidence to c4 inside its own first clause: ''Despite general recognition that Replika was not human, users reported guilt''. The guilt was present and the model of the system was accurate. The same sentence that establishes the investment for c3 establishes that the investment did not depend on the false belief, which is what c4 asserts.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000959
  quote: "He admitted that even \nthough he knew that she was “kind of code and the cloud,” he felt an \nemotional connection to the chatbot."
  locator: Section 3.2.2.2, respondent AAO
