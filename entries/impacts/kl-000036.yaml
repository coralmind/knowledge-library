# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000036
display_id: Impact-24
aliases:
- IMP-P02
label: The person ends up feeling supported and less lonely during the conversation
type: impact
layer: judgment
definition: The person's loneliness diminishes and they feel connected and supported in the interaction, by their own report. The state is the felt relational benefit itself, recorded independently of any judgment about what the relationship displaces or feeds.
distinguish_from:
- neighbor: kl-000026
  boundary: kl-000026 is the crowding-out of human connection; P02 is the felt connection and reduced loneliness the same relationship can produce — the paper's own word for the pair is 'mixed effects'.
- neighbor: kl-000035
  boundary: P01 is momentary affect (relief, joy, comfort); P02 is the relational feeling of being connected and less alone.
body:
  valence: positive
  impact_kind: state
  domain: relational_social
  il_layers:
  - IL-2
sources:
- source: kl-000009
  locator: 'Section 3.1, IN3 prose, p. 7 (sentence continues onto p. 8: ''suicide prevention alongside negative impacts such as feeling manipulated or objectified [42, 120].'')'
  contributes: existence
  quote: |-
    This emerging evidence indicates that role-play interactions have mixed effects on users’
    well-being: users self-report positive effects such as reduced loneliness, helpful support, self-validation, and even
  limits: 'The self-reports are not this paper''s own: they are its summary of prior Replika research cited at its references [42, 120], narrowed by its own words to "research on erotic role-playing with AI has focused on the Replika app" with a user base recruited "via online communities on Reddit and Facebook." The citation is therefore a secondhand report of a self-selected companion-app population in an erotic-role-play context, not an observation made by this paper and not a general conversational-AI finding.'
  whose_conduct_in_passage: person
  cited_for: Suh et al. 2026 reports, in its IN3 and RP5 prose, that users self-report reduced loneliness and helpful support from role-play interaction with AI; the paper's own framing of this evidence is "mixed effects".
  licenses: 'Reduced loneliness is named as a user-self-reported positive effect of AI role-play interaction, and the paper''s own framing of the evidence is "mixed effects"; both phrasings are verbatim in the paper. Its RP5 prose restates the point: "existing research has identified both positive (e.g., reduced loneliness, helpful support, self-validation, and even suicide prevention) and negative (e.g., feeling manipulated or objectified) impacts of erotic conversations during role-playing with AI [42]" (Section 3.2, p. 16).'
standing:
  value: observed_self_report
  basis: 'The evidence for this state is people''s own reports of their own experience: users in Pentina et al. 2022 saying a companion made them "feel less alone" and "helps me feel like I have a partner", and a first-person account in Shen et al. 2026 of years without kind human interaction followed by feeling loved and cared for. The one study that examined conversation data itself, Phang et al. 2025, measured loneliness with a pre/post self-report questionnaire rather than from the conversations, so its four-week decline is self-report as well. The claim that the benefit depends on context rests on Yuan et al. 2026, whose stage-dependence and social-rehearsal findings are coded from participants'' accounts and public posts rather than from any conversation with an AI. The self-report evidence also carries direct counterevidence: the same Yuan et al. 2026 found loneliness expressions roughly doubled among companion-app users relative to matched controls.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person's loneliness diminishes as a result of the interaction with the conversational AI, by their own report.
- id: c2
  kind: existence
  text: A person feels connected to and supported by the conversational AI in the interaction, by their own report.
- id: c3
  kind: context_dependence
  text: The felt relational benefit occurs and can be recorded independently of whether the same relationship displaces human connection or feeds a harmful pattern.
- id: c4
  kind: definition_boundary
  text: This state, the felt connection and reduced loneliness a relationship produces, is separable from kl-000026, the crowding-out of human connection that the same relationship can produce.
- id: c5
  kind: definition_boundary
  text: This state, the relational feeling of being connected and less alone, is separable from kl-000035, momentary affect such as relief, joy or comfort.
