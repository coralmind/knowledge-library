  locator: Results — Model with social connection measure
  licenses: In a four-wave panel, increased chatbot use did not predict decreased social connection four months later on a broad connectedness scale. It cuts against a durable reduction, and its interest is that the same sample shows an effect on a narrow isolation item, so the finding is instrument-dependent.
  fit: adjacent
  bridge: A cross-lagged path between self-reported chatbot use and a 20-item social connection scale in general adults over four months. The claim concerns loneliness felt in and around the interaction; this bounds the four-month outcome, not the in-interaction state.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000523
  quote: |-
