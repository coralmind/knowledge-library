- claim_id: c1
  source: kl-000523
  quote: |-
    Research suggests that people feel less
    lonely after texting with a chatbot than they feel, for
    example, after watching YouTube (De Freitas et al.,
    2024). In addition, several experiments have shown that
    chatbots reduce loneliness and increase mood on par
    with brief interactions with humans
  locator: Introduction
  licenses: States that experiments have found people feel less lonely after texting with a chatbot, and that chatbots reduce loneliness on a par with brief human interaction. It establishes the reduction as an experimentally documented result but does so at second hand.
  fit: adjacent
  bridge: The authors restate De Freitas et al. 2024, Drouin et al. 2022, Folk et al. 2024 and Ho et al. 2018 rather than measuring loneliness reduction themselves; their own study is a four-wave cross-lagged panel whose result runs the other way. The population in the restated experiments is general adults in brief chatbot interactions, not people reporting a felt relational benefit.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000895
  quote: One study found that AI companions serving as interaction partners help alleviate loneliness to a similar degree as interacting with another human, and they found that users’ feeling “heard” by AI companions mediated reductions in their loneliness (De Freitas et al., 2024).
  locator: Section 7 Potential Benefits of AI Companions, Improved emotional well-being
  licenses: Reports one cited study in which AI companions alleviated loneliness to a degree similar to human interaction, with feeling heard as the mediator. Supports the reduction occurring; supplies no magnitude of its own.
  fit: adjacent
  bridge: A secondary report of De Freitas et al. 2024 inside a section the paper itself calls a brief exploration of potential positive impacts. No design, N or population is given in the span, so what survives is that the result exists in the literature, not a measurement by this source.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000961
  quote: Overall, participants were both less lonely and socialized less with others at the end of the four-week study period. Moreover, participants who spent more time using the model were statistically significantly lonelier and socialized less.
  locator: Section 4.2, Findings for Pre-Registered Research Questions, item 1
  licenses: A four-week randomized trial of ChatGPT use in which participants were, on average, less lonely at the end of the period on a validated scale — measured rather than reported at second hand. The same sentence records that heavier users were significantly lonelier, so the average decline and the dose relation run opposite ways.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001013
  quote: "Also, as predicted, users of LLMs for mental health also had reliably higher loneliness (5.91 versus 5.10) and lower quality of life (47.68 versus 49.94) scores (both p < 0.001; Fig. 4, bottom)."
  locator: Results, Users of LLMs for Mental Health – Psychopathology and Well-Being
  licenses: 'Cuts against the claim in the direction it asserts: people who use LLMs for mental health score reliably higher on the UCLA 3-item loneliness scale than non-users. Cross-sectional, so it establishes no direction, but nothing here shows loneliness diminishing.'
  fit: adjacent
  bridge: A between-person difference at a single time point between self-identified users and non-users, not a within-person change following an interaction. It cannot distinguish lonelier people seeking LLMs from LLM use deepening loneliness; what it bounds is any claim that this population's loneliness is lower.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000839
  quote: Overall, social health and relationships were not significantly impacted by companion chatbot interactions across 21 days of use.
  locator: Abstract
  licenses: A preregistered randomized trial with an active control found no significant effect of 21 days of companion-chatbot use on social health or relationships, which is a null against the claim at that horizon.
  fit: adjacent
  bridge: Participants were paid general adults assigned to at least ten minutes of daily Replika use rather than help-seekers who chose the product, and the reported outcomes here are social health and relationships rather than loneliness specifically. The claim is about a felt benefit in the person; this design tests for it directly and finds none.
  contributes: counterexample
  contradicts: true
- claim_id: c1
