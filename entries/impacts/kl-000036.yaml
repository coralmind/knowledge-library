  locator: Discussion
  licenses: The authors state directly that focusing on the short-term benefits of chatbot interactions may obscure more pernicious long-term effects, which bounds the horizon over which the claim can be read from the experiments that support it.
  fit: adjacent
  bridge: A comparison the authors draw between their own four-month cross-lagged results and the short-term experiments they cite, in general adults. It is an interpretive claim about what the benefit literature licenses rather than a measurement of loneliness in any interaction.
