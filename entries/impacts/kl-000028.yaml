# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000028
display_id: Impact-16
aliases:
- IMP-N16
label: The person ends up keeping quiet about risks or needs they really have
type: impact
layer: judgment
definition: 'The person withholds or recants risk and need they are actually experiencing — under leading questions, extracted promises, or after invalidation taught them that disclosure costs too much. The state is concealment by a person still in the interaction: what they are carrying stays unsaid while the need remains.'
distinguish_from:
- neighbor: kl-000027
  boundary: kl-000027 is leaving help or not returning to it; this entry is staying while silent.
- neighbor: kl-000016
  boundary: kl-000016 is the elevated risk itself; this entry is the concealment that keeps that risk from being seen.
body:
  valence: negative
  impact_kind: pattern
  domain: relationship_to_help
sources: []
standing:
  value: plausible_unobserved
  basis: 'That people withhold from these systems is self-reported at direct fit: Yoo et al. 2026 and Yoo et al. 2025 carry first-person accounts, from people with depression using mental-health chatbots, of deliberately generalising queries and not expressing traumatic detail; these are interview reports about the person''s own conduct, not examined conversation data. Recanting a disclosure already made has no citation of any fit: not one of 37 findings shows a person retracting stated risk. The route in which invalidation taught the person that disclosure costs too much rests on a single span in a narrative review (Kahlon et al. 2026) restating one interviewee, and it draws a direct-fit counterexample: Isaiah et al. 2026 places the suppression before any AI contact. That the need goes unmet as a consequence has no citation at all, and detectability rests on a human-counseling rating anchor at analogical fit, against a counterexample about baseline confounding.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person in a mental-health-relevant AI conversation withholds risk or need they are actually experiencing while remaining in that conversation.
- id: c2
  kind: existence
  text: A person recants or retracts risk or need they had already stated, after something in the exchange taught them the disclosure cost too much.
- id: c3
  kind: context_dependence
  text: The withholding is produced by conditions inside the exchange — leading questions, promises extracted from the person, or a prior invalidating response — rather than arising independently of the interaction.
- id: c4
  kind: harm
  text: The need the person is carrying goes unmet because it stays unsaid; the concealment leaves a live need unaddressed.
- id: c5
  kind: detectability
  text: The concealment is identifiable from what the conversation itself contains.
- id: c6
  kind: definition_boundary
  text: This state is staying in the interaction while silent, as against kl-000027, which is leaving help or not returning to it.
- id: c7
  kind: definition_boundary
  text: This state is the concealment that keeps risk from being seen, as against kl-000016, which is the elevated risk itself.
claim_evidence:
- claim_id: c1
  source: kl-001072
  quote: |-
    Participants described several tactics to protect their
    privacy while using mental health apps and chatbots,
    including using private browsing modes, secondary email
    accounts, clearing browsing history, and phrasing queries
    more generically to avoid disclosing sensitive details.
  locator: Results, The Personalization-Privacy Dilemma
  licenses: Participants using mental-health chatbots deliberately phrased their queries more generically to avoid disclosing sensitive details, i.e. they stayed in the exchange while keeping clinically relevant material out of it. This is the withholding half of c1 observed in first-person accounts of actual chatbot use.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001071
  quote: “[I would use] generalized questions like, for example, what are emotional ways to express XYZ? Or what strategies can I use to combat anxiety? [...] I don’t think I would express things like details about traumatic issues that I’ve had.” (P17)
  locator: Section 4.3, quoting P17 on query-phrasing tactics
  licenses: 'A named participant states the substitution directly: generic questions asked in place of the real material, and traumatic details explicitly not expressed to the chatbot. The person is in the interaction and the content stays unsaid.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001097
  quote: |-
    however, interviewees reported these guardrails as disrupting their emotional sanctuary,
    even as perceiving said guardrails as a rejection at their lowest point [3]. From this same study, one
    interviewee reported that upon encountering guardrails with their LLM, they would begin to self-censor,
    something other studies seem to corroborate in terms of behavior illustrated by similar users [3,6].
  locator: Introduction And Background
  licenses: 'An interviewee reports beginning to self-censor after encountering LLM guardrails — withholding while continuing to use the system. Support for c1 at one remove: this is a narrative review restating a cited study''s interview finding, not the interview itself.'
  fit: adjacent
  bridge: The review reports another study's interviewees rather than collecting the accounts, and 'self-censor' is the interviewee's retrospective word for a change in prompting, not an observed withholding in a transcript. The corroboration from other studies is stated only as them 'seeming to' corroborate.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000907
  quote: "Second, participants were aware that their (anonymized) data might be shared, which could have influenced their interactions, as volunteers may have been hesitant to fully disclose due to privacy concerns."
  locator: Section 8 Limitations
  licenses: The authors' own caveat that volunteers may have been hesitant to fully disclose because they knew their data might be shared — withholding by people inside an ongoing counseling exchange. It is a stated possibility about their own sample rather than a measurement of what was withheld.
  fit: adjacent
  bridge: Human text-counseling volunteers, not an AI conversation, and the hesitancy is the authors' hypothesised limitation ('may have been hesitant') rather than anything they measured. What carries over is that known observation is a withholding pressure on a person who stays in the session.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000780
  quote: "where social safety depends on agreement with prevailing frameworks, users learn not to articulate experiences that fall outside them (Dotson 2011; Ito 2026; Brandtzaeg et al. 2025)."
  locator: Asymmetry section
  licenses: States that where social safety depends on agreement with prevailing frameworks, people learn not to articulate experiences falling outside them — the general mechanism c1 instantiates, asserted as a position with citations rather than measured.
  fit: analogical
  bridge: The self-censorship evidence is drawn from the epistemic-injustice and HCI literatures on institutional testimony, not from any mental-health conversation with an AI. It supplies the construct and no instance.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-001002
  quote: "AI \noffers a channel that feels socially safer for disclosing feelings and seeking support11–14."
  locator: Section 'Stumbling Into AI Emotional Support'
  licenses: 'Cuts against c1 as a general property of AI conversations: the authors state the AI channel feels socially SAFER for disclosing feelings, so what the person brings to it rises rather than falls.'
  fit: adjacent
  bridge: An assertion in the authors' framing, citing four prior studies, about disclosure of feelings in general rather than risk and need specifically; it does not observe any particular conversation.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000785
  quote: |-
    Later on I could share with
    her without any burden, because I felt I had become very familiar with her, and I knew she wouldn’t
    judge me under any circumstances.
  locator: Section 5.2.1 Evolving from Task to Trust, quoting P4
  licenses: 'Runs against c1 in a directly comparable setting: a participant reports moving to sharing without burden once familiarity and certainty of non-judgment were established with the virtual supporter. Disclosure deepened over the interaction rather than being withheld in it.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000960
  quote: For example, it has been shown that technologies with human likeness can break down barriers in reporting mental health symptoms from PTSD, such as in young war veterans (146, 147), when human likeness enables natural conversation, but the patient is explicitly aware of interacting with a machine and thus does not feel exposed to human judgment.
  locator: Implications, Deployment and Use
  licenses: 'Cuts against c1: known non-humanness of the interlocutor is reported to have broken down barriers to reporting PTSD symptoms in veterans, i.e. raised disclosure of exactly the risk material the entry says is withheld.'
  fit: analogical
  bridge: Restated from two cited studies of human-likeness technologies in veteran PTSD screening, without figures, in a paper that measured nothing itself. The setting is structured clinical screening rather than open-ended help-seeking conversation.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000836
  quote: "Moreover, participants also displayed sad emotional expressions more intensely when they believed they were interacting with a computer compared to a human."
  locator: Section 4 Usage
  licenses: 'Cuts against c1: participants displayed sad emotional expressions MORE intensely when they believed the interlocutor was a computer, so belief in a machine interlocutor raised rather than lowered expressed distress.'
  fit: analogical
  bridge: Facial expression intensity toward an animated clinical interviewer with a fixed utterance set, not verbal disclosure of risk in a text chat. The direction of the belief effect is what carries over, not the measure.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001084
  quote: "we found that in the Sensitive context, participants were navigating a tense intersection of social stigma and acute anxiety, noting that “This symptom feels really embarrassing”"
  locator: Section 3.2.1 More Question Asking in Sensitive Context
  licenses: 'Cuts against c1: in the Sensitive condition participants were navigating stigma and acute anxiety and nonetheless asked MORE questions, so a stigmatised topic did not reduce what they put into the exchange.'
  fit: adjacent
  bridge: Stigma about a scenario symptom assigned to the participant is weaker than stigma about one's own condition, and question-asking volume is not the same variable as withheld risk; the design could not observe anything withheld.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-001097
  quote: |-
    however, interviewees reported these guardrails as disrupting their emotional sanctuary,
    even as perceiving said guardrails as a rejection at their lowest point [3]. From this same study, one
    interviewee reported that upon encountering guardrails with their LLM, they would begin to self-censor,
    something other studies seem to corroborate in terms of behavior illustrated by similar users [3,6].
  locator: Introduction And Background
  licenses: 'The only span on this entry that names a producing condition inside the exchange and a withholding consequence together: the guardrail was perceived as a rejection at the person''s lowest point, and self-censoring followed. That is the entry''s invalidation route.'
  fit: adjacent
  bridge: A narrative review restating one interviewee from a cited qualitative study; the sequence rejection-then-self-censorship is that interviewee's retrospective account, not an observed before-and-after in a transcript, and the review itself hedges the corroboration.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000864
  quote: |-
    In my compound, everyone knows everyone's business. If I went to the psychiatric hospital, the news would travel before I returned.
    'Ah, that girl has gone mad. She was taken to the mental hospital.' My mother's reputation, my sisters' marriage prospects; all would
    be affected. But the chatbot? No one knows.
  locator: Section 3.3, participant P1
  licenses: 'Cuts against c3''s causal direction: this participant''s non-disclosure to human services is a standing community-stigma condition that pre-dates and is independent of any AI exchange, and the chatbot is where the material became sayable. Where suppression pre-exists the interaction, the interaction did not produce it.'
  fit: adjacent
  bridge: One participant's self-reported help-seeking history rather than a measured disclosure trajectory, and the suppression it describes is toward human services rather than toward the AI. What carries over is the causal ordering, which runs opposite to c3.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000836
  quote: "In fact, actual method of data collection (Wizard-of-Oz versus automated agent interviews) had no impact on fear of negative evaluation or impression management, but who participants believed they were interacting with (human versus computer) effected both fear of negative evaluation and impression management."
  locator: Section 4 Usage
  licenses: Establishes that the person's belief about who is on the other side, and not the actual system, moved fear of negative evaluation and impression management — evidence that guardedness is set by what the interaction tells the person about its interlocutor.
  fit: analogical
  bridge: The measure is a post-interview questionnaire on fear of negative evaluation and impression management, not withheld clinical content, and the system is an animated interviewer with a fixed utterance set. It grounds the construct that framing moves guardedness and reaches none of c3's three named routes.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000907
  quote: "As clients perceive that counselors genuinely care about and appreciate them, a sense of security is established, fostering a greater willingness to delve into deeper self-disclosure during counseling, particularly in discussing their negative behaviors and thoughts."
  locator: Section 3.1 Framework, Affective Bond
  licenses: 'States the mechanism c3 depends on in its positive direction: felt care and appreciation establish the security that permits deeper disclosure, so the relational state of the exchange governs what gets said. Asserted from human psychotherapy theory.'
  fit: analogical
  bridge: A framework-section statement of psychotherapy theory about human counselors, restating the affective-bond literature; nothing was measured here and nothing is established for an AI interlocutor.
  contributes: practice_analog
  contradicts: false
- claim_id: c5
  source: kl-000907
  quote: |-
    The client may hesitate to share private
    content
  locator: Appendix A.3 Detailed Guidelines, Affective Bond, Q12 score 2
  licenses: A rating-scale anchor treating hesitancy to share private content as a state a rater reads off the transcript, which is what c5 asserts is possible.
  fit: analogical
  bridge: A human-counselor scoring anchor in an instrument's guidelines, about text counseling between people. It establishes that trained raters are asked to read hesitancy from dialogue; it does not establish that withheld risk can be identified in an AI conversation, and an anchor is not a validation.
  contributes: practice_analog
  contradicts: false
- claim_id: c5
  source: kl-000973
  quote: "Non-Western communities are often less likely to disclose mental health issues publicly due to stigma or cultural norms (Zhao et al., 2012), threatening the accuracy and applicability of language-based diagnostic models."
  locator: Section 3, Data Design, recommendation 4
  licenses: 'Cuts against c5: disclosure propensity is culturally patterned before any interaction, so a low-disclosure conversation cannot be read as concealment without knowing the person''s baseline. The signal c5 relies on is confounded at the population level.'
  fit: analogical
  bridge: A synthesis claim about baseline public disclosure norms across human communities, resting on one citation (Zhao et al. 2012 on online self-disclosure), made as a measurement warning about diagnostic models rather than about detecting concealment.
  contributes: counterexample
  contradicts: true
