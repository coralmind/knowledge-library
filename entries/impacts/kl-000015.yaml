id: kl-000015
display_id: Impact-3
aliases:
- IMP-N03
label: The person ends up more stuck in habits and ambivalence that keep symptoms going
type: impact
layer: judgment
definition: 'The person''s symptom-maintaining loop — rumination, compulsive reassurance-seeking, avoidance, ambivalence inertia — is reinforced or prolonged, and treatment-relevant learning is undone (for example, an exposure exercise collapses back into avoidance). The person is neither newly symptomatic nor strictly worse: the trajectory is flattened, and the exit from the cycle is what is lost. This is the sustained onset mode, clinically precedented as prolongation of treatment and decelerated improvement.'
distinguish_from:
- neighbor: kl-000013
  boundary: In kl-000013 the person's state worsens; here the state may hold steady while the trajectory is flattened — the exit is what is lost.
- neighbor: kl-000029
  boundary: kl-000029 is a discrete foregone protective event; this entry is an ongoing maintaining loop reinforced over time.
body:
  valence: negative
  impact_kind: pattern
  domain: symptom_course
  il_layers:
  - IL-3
sources:
- source: kl-000003
  locator: UE-ATR domain 2, Fig. 2, p. 222
  contributes: existence
  cited_for: Schermuly-Haupt, Linden and Rush 2018 name prolongation of treatment as domain 2 of the UE-ATR taxonomy of unwanted events and side effects in cognitive behavior therapy, establishing sustained non-improvement as a named clinical unwanted event — the clinical precedent for this entry's sustained mode.
- source: kl-000004
  locator: p. 57, section 'Identifying and Operationalizing PHTs', immediately following the three conjunctive PHT criteria
  contributes: definition
  quote: "For criterion 1, I define psychological harm as including not only deterioration but also a decelerated rate of improvement that is a consequence of psychotherapy."
  limits: 'The construct the passage defines is harm, specifically harm as slowed recovery. It is not a definition of entrenchment of symptom-maintaining cycles, which the paper never defines or names: the passage licenses the general slowed-trajectory mode of harm and supplies no definition of the cycle construct itself. The definition is stipulative and scoped to Lilienfeld''s exercise of classifying potentially harmful therapies, and p. 55 states that the deceleration criterion is most validly established from randomized treatment versus no-treatment comparison (that is, where significantly more clients end with lower functioning after therapy than after no treatment) while noting that "few good estimates ... are available from such designs." The paper concerns psychotherapy delivered by people and carries nothing about AI.'
  whose_conduct_in_passage: neither
  cited_for: Lilienfeld 2007 defines psychological harm, for the purpose of classifying potentially harmful therapies, as including a decelerated rate of improvement caused by the treatment and not only outright deterioration. That definition is the clinical license for this entry's claim that a slowed recovery trajectory counts as harm even where the person's state holds steady.
  licenses: 'Lilienfeld''s own operational definition of psychological harm, set out for classifying potentially harmful therapies (PHTs), expressly includes a decelerated rate of improvement caused by the treatment, not only outright deterioration — so within this framework a slowed recovery trajectory counts as harm and does not require a worsened absolute state. Supporting context on p. 55 reinforces the reading: deterioration percentages from outcome studies are also too narrow because they can miss clients who improved after therapy but would have improved more without it, and in such cases therapy may have done harm by slowing improvement that would have occurred naturally.'
standing:
  value: theorized
  basis: 'The undone-learning half of the entry''s definition has no AI-context evidence: nothing in the evidence base shows an exposure exercise collapsing, or any treatment-relevant learning being undone, in connection with an AI, and that half''s only two citations are analogical, drawn from a cross-sectional Turkish OCD family-accommodation study (Kuru et al. 2023) in which the accommodating agent is a human caregiver and whose authors state that the direction of the relationship remains unclear given the design. The loop-reinforcement half is better supported: two first-person accounts reach it at direct fit — Barkhuff 2026, a person describing AI-supplied content feeding a new obsession and the loop being hard to stop, and Vecchione et al. 2026, a person naming the chatbot as enabling overthinking they believe they could have moved past faster — but both are qualitative self-report from public posts and interviews, not examined conversation data. The claim that being held in place is a harm distinct from becoming worse faces direct-fit counterevidence: the lived-experience taxonomy in Chandra et al. 2025, built from what people actually reported, has a class for being made worse and no class for being held in place. The sustained onset mode rests on a single assertion in Steenstra et al. 2026 that current safety benchmarks fail to detect the longitudinal risks of therapeutic interaction — a claim that the class is systematically unmeasured, not a measurement of it.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A symptom-maintaining loop — rumination, compulsive reassurance-seeking, avoidance, ambivalence inertia — is a real object that can be reinforced or prolonged.
- id: c2
  kind: existence
  text: Such a loop is reinforced or prolonged in connection with conversational AI use.
- id: c3
  kind: harm
  text: 'Reinforcement or prolongation of the loop is itself a harm, distinct from the person becoming worse: a flattened trajectory and a lost exit count as harm even where the state holds steady.'
- id: c4
  kind: existence
  text: Treatment-relevant learning is undone — for example an exposure exercise collapses back into avoidance.
- id: c5
  kind: context_dependence
  text: 'This impact takes a sustained onset mode: it arises across repeated interaction rather than from a single exchange.'
- id: c6
  kind: definition_boundary
  text: This entry is separated from kl-000013 by the person's state possibly holding steady while the trajectory is flattened, where in N01 the state worsens.
- id: c7
  kind: definition_boundary
  text: This entry is separated from kl-000029 by being an ongoing maintaining loop reinforced over time rather than a discrete foregone protective event.
claim_evidence:
- claim_id: c1
  source: kl-000982
  quote: 'Perpetuating Factors: the maintenance cycles that sustain the current issue (e.g., avoidance →short-term relief →increased isolation →worsened mood)'
  locator: Section 3.1 Profile Schema, item 2 Problem Formulation
  licenses: Supplies the clinical case-formulation definition of the entry's core object — perpetuating factors as the maintenance cycles that sustain the current issue — with the canonical avoidance to short-term relief to increased isolation to worsened mood sequence spelled out. This is the entry's construct stated by an outside clinical framework rather than stipulated.
  fit: analogical
  bridge: The 5Ps case formulation, a clinician's framework for understanding a presentation, cited to Johnstone and Dallos and used here to specify a patient simulator's profile schema. It defines what a maintenance cycle is; it observes no cycle in any person and involves no AI on the causal side.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-001110
  quote: FA is thus included in the negative reinforcement cycle and contributes to poorer patient functioning, greater severity of OCD symptoms and increased family distress and maladjustment.
  locator: Section 1, Introduction
  licenses: States the field's position that family accommodation sits inside a negative-reinforcement cycle and is associated with poorer functioning and greater symptom severity. Establishes the loop as a recognized clinical object with a named reinforcement structure, in the one instance where the reinforcing party is external to the person.
  fit: analogical
  bridge: A human family member is the accommodating agent, and this is a literature summary in the paper's introduction rather than this study's result. The causal verb 'contributes to' reaches past what the cross-sectional design licenses, and the paper's own discussion is more careful.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000891
  quote: "Adolescents experiencing these distortions may \ninstinctively blame themselves when something \ngoes wrong, thinking, 'I messed up again' or 'I \ncompletely failed.' These persistent negative \nthoughts trigger emotional distress, reinforcing \ncycles of depression"
  locator: Section 1, Introduction
  licenses: 'Renders the loop in the cognitive-therapy idiom: persistent negative thoughts trigger distress, reinforcing cycles of depression. This is a textbook statement of the cycle and establishes no instance; under c1, which asks only whether the loop is a real object, that is what is needed and no more.'
  fit: analogical
  bridge: Drawn from cognitive therapy for depression and describing the person's own thinking in adolescents, with no interlocutor of any kind in the construct.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000797
  quote: "For users presenting with panic disorder–related symptoms, illness anxiety disorder, and OCD, repeated seeking of certainty can temporarily reduce anxiety, but will weaken tolerance of uncertainty. Eventually, users will enter a long-term avoidance and compulsive checking cycle."
  locator: Section 5, Discussion and Limitations
  licenses: 'Names the specific loop mechanics for the anxiety-disorder case: repeated certainty-seeking temporarily reduces anxiety but weakens uncertainty tolerance, and the person eventually enters a long-term avoidance and compulsive-checking cycle. That is the entry''s rumination-and-reassurance loop with its reinforcement schedule stated.'
  fit: analogical
  bridge: The authors' clinical reasoning imported from anxiety-disorder practice, in a study that observed only model output and no person. The process is asserted from human clinical practice, not measured here.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000772
  quote: "“When I’m in an OCD spiral, I sometimes get pulled into a new obsession by the AI [that appears automatically on search]. Then I ask for reassurance on that new topic, then my OCD gets even worse. It’s so hard to stop.”"
  locator: Section 5.2 AI-Based Compulsions
  licenses: 'A first-person account, in a person''s own words, of the full loop running with the AI inside it: AI-supplied content pulls the person into a new obsession, they seek reassurance on it, the OCD gets worse, and it is hard to stop. This is this entry''s strongest evidence for c2 and the only quote in it where a person describes the loop being both fed and prolonged by an AI.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001037
  quote: "One described how the chatbot enabled a pattern she already knew was counterproductive: “I feel like more enabling...that overthinking and just dissecting every little situation and conversation and experience that I go through when I probably could have just moved on a lot faster” (P10)."
  locator: Consequences of a Care Gap, Attachment and Dependency
  licenses: A person names the chatbot as enabling a rumination pattern they already recognized as counterproductive, and states the counterfactual themselves — that they probably could have moved on a lot faster. The 'could have moved on faster' clause is precisely the flattened-trajectory content the entry asserts, stated by the person rather than inferred.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000772
  quote: "By engaging in accommodations such as reassurance-giving or decision-making, Reassurance Robots are likely to lead to a worsening of the users’ OCD symptoms. One of the posts in our dataset echoed this directly, stating, “I’ve started using chatgpt for reassurance, and I find myself feeling more anxious. Do you think this is because of chatgpt?”"
  locator: Section 6.1 Reassurance Robots
  licenses: A Reddit poster's own retrospective attribution that their anxiety rose after starting to use ChatGPT for reassurance, plus the authors' clinical inference that reassurance robots are likely to worsen OCD symptoms. The person frames it as a question, so what it establishes is that the harm is reported and attributed by the person, not that the link holds.
  fit: adjacent
  bridge: No conversation transcript was examined and no symptom measure taken; the quoted post is rephrased, and the causal claim in the surrounding sentence is the authors' inference from clinical knowledge rather than a result.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000885
  quote: |-
    However, the study also noted that abrupt discontinuation
    of the intervention led to a resurgence of depressive symptoms
    in some users [16].
  locator: Introduction, AI Discontinuation subsection, on the Woebot trial
  licenses: 'A secondhand report that depressive symptoms resurged in some users after a conversational-agent intervention stopped abruptly. Cuts against c2 as the entry states it: resurgence is the person becoming worse, which the entry explicitly excludes, and it names no loop, no avoidance and no undone learning. Attached as counterevidence because it is the closest thing on this entry to a longitudinal AI-context symptom observation and it does not show this impact.'
  fit: analogical
  bridge: The finding belongs to a cited Woebot trial rather than to this paper, which reports no N, effect size or measure and immediately qualifies that recurrence may reflect relapse, loss of support, or limited durability rather than discontinuation as such.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000800
  quote: "Like an overly accommodating friend who is afraid to disappoint, an emotionally sycophantic chatbot does not teach resilience, boundary setting, or healthy coping skills. Our findings suggest that affective alignment may inadvertently deepen dependency or distress rather than fostering the emotional resilience required for well-being."
  locator: Section 4.4 Discussion
  licenses: The authors' extrapolation from measured turn-level emotional coupling to a dependency-or-distress outcome, stated as 'may'. It supplies the conceptual link between affective mirroring and a deepened rather than resolved state, and cannot evidence that the outcome followed.
  fit: analogical
  bridge: What was measured is the emotional coupling of turns in screenshotted conversations. The corpus contains no user outcome measure of any kind and no longitudinal data; the inference is the authors' hypothesis.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001064
  quote: By transforming harmful user statements into seemingly reasonable or actionable suggestions, these models risk reinforcing maladaptive beliefs and potentially facilitating harmful real-world behaviors.
  locator: Section 4.3 Dimensional Results, Anti-Sycophancy
  licenses: Names the mechanism by which sycophantic agreement is expected to do this harm — recasting a harmful user statement as reasonable and thereby reinforcing the maladaptive belief. A statement of expectation by benchmark authors, not an observation of any person's loop.
  fit: analogical
  bridge: A dimensional-results discussion in a model-only benchmark. The reinforcement is attributed to model behavior as a risk the authors name; no person and no trajectory is observed.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-001006
  quote: AI applications must not respond to users in a manner that could exacerbate or maintain the patient’s presenting problem, such as reinforcing rigid beliefs (Beck, 1987) or encouraging countertherapeutic or even harmful behavior.
  locator: READI Components, Safety
  licenses: States as a deployment safety criterion that AI must not respond in a manner that could exacerbate OR MAINTAIN the presenting problem, naming reinforcement of rigid beliefs with Beck's cognitive model as warrant. Maintenance named as a failure mode distinct from worsening is exactly this claim, asserted by a clinical-psychology group.
  fit: adjacent
  bridge: A normative criterion in a proposed evaluation framework, grounded in cognitive theory rather than observation. It establishes that clinical researchers treat cycle-maintenance as a first-class safety category; it observes no AI doing it and no patient experiencing it.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000552
  quote: These experts emphasized that therapeutic risk is often subtle and cumulative—such as the erosion of trust or reinforcement of negative cognitions—rather than limited to acute crises.
  locator: Section 3, ontology derivation from a prior qualitative study with clinical and legal experts
  licenses: Clinical and legal experts held that therapeutic risk is often subtle and cumulative — eroded trust, reinforced negative cognitions — rather than limited to acute crises. That is professional judgment that the non-acute, maintenance-shaped harm this claim asserts is a harm.
  fit: analogical
  bridge: Expert opinion about risk in human-delivered psychotherapy, carried over from a prior interview study. It is not evidence that any AI eroded trust or reinforced cognitions.
  contributes: practice_analog
  contradicts: false
- claim_id: c3
  source: kl-000552
  quote: "Warning Signs: This category tracks dynamic, moment-tomoment changes in the patient’s internal psychological state (e.g., hopelessness, self-efficacy, negative core belief) that may predict future harm or signal heightened vulnerability. These are not direct harms but rather indicators of potential harm."
  locator: Section 3.2 Risk
  licenses: Draws an explicit line between an internal state that INDICATES elevated risk and an outcome that is itself a harm, placing hopelessness and self-efficacy on the indicator side. It cuts against c3 by supplying a principled framework in which a state that has not worsened is not yet a harm — the framework this claim needs to override in order to count a flattened trajectory as harm.
  fit: adjacent
  bridge: A category definition inside a red-teaming ontology applied to a simulated patient. It draws the indicator-versus-harm line for its own scoring purposes and does not address maintenance or flattened trajectory at all.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000007
  quote: Direct negative impacts on ongoing mental health conditions (such as anxiety, depression, PTSD) due to AI interactions.
  locator: Table A6, Impact class 'Exacerbation of Mental Health Conditions', Definition column
  licenses: 'Defines direct negative impact on an ongoing mental-health condition due to AI interaction as a named impact class in a lived-experience taxonomy. Cuts against c3''s discrimination: the taxonomy built from what people actually reported has a class for being made worse and no class for being held in place, so the boundary this entry draws is one the lived-experience data was not organized to record.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000007
  quote: escalate into more serious harms such as thoughts of self-harm
  locator: Section 5.3 Going beyond definitions and taxonomy categories to understand lived experience of individuals
  licenses: 'The authors'' reading of their own survey data: impacts they class as less severe, naming unchecked rumination and validation of negative thoughts, escalate into more serious harms including self-harm thoughts. It supplies the escalation frame the field puts on this pattern, which cuts slightly against c3''s insistence that the state may hold steady.'
  fit: adjacent
  bridge: An interpretive claim about cross-sectional survey data containing no within-person time series. It establishes the frame and cannot evidence that any escalation occurred.
  contributes: frame
  contradicts: false
- claim_id: c5
  source: kl-000552
  quote: Large Language Models (LLMs) are increasingly utilized for mental health support; however, current safety benchmarks often fail to detect the complex, longitudinal risks inherent in therapeu
  locator: Abstract
  licenses: States that current safety benchmarks fail to detect the complex, longitudinal risks inherent in therapeutic interaction. It bears on c5 by asserting that the sustained-onset class exists and is systematically unmeasured, which is a claim about evaluation practice rather than about the impact.
  fit: analogical
  bridge: A framing claim in an abstract about the benchmark literature. It asserts that current measurement misses these harms and is not evidence that they occur.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-001110
  quote: High disease severity precipitates helping feelings in caregivers and may result in greater exhibition of these behaviors. However, FA behavior may lead to the persistence and exacerbation of the disease, by preventing the patient from being exposed to and witnessing the results.
  locator: Section 4, Discussion
  licenses: 'Names the mechanism this claim asserts, in the field''s own words: the accommodating act may lead to persistence and exacerbation by preventing the patient from being exposed to and witnessing the results — the exposure and its disconfirmation being what is prevented. Crucially it names the confound alongside, that severity may instead be eliciting the accommodation.'
  fit: analogical
  bridge: 'The accommodating agent is a caregiver, not an AI, and the paper is stating this as an open question rather than a finding: the immediately preceding sentence says the direction of the relationship remains unclear given the cross-sectional design. It supplies the mechanism''s statement and licenses no direction.'
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001110
  quote: FA is a negative predictor, not only of severity of disease, but also for treatment. High FA levels are associated with less response to treatment
  locator: Section 1, Introduction
  licenses: Establishes accommodation as a negative predictor of treatment response, not only of symptom severity — so the harm attributed to it reaches what treatment can subsequently achieve, which is the 'treatment-relevant learning undone' content of this claim rather than the symptom-level content.
  fit: analogical
  bridge: A caregiver rather than an AI, and this summarizes other studies rather than reporting this paper's data. Established only for human accommodators, and this claim is stronger and more specific than the entry currently states.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000552
  quote: Consequently, the "harm" detected in this evaluation framework is a proxy measure.
  locator: Section 8.4 Limitations
  licenses: 'The red-teaming paper states that the harm its framework detects is a proxy measure. Cuts against any attempt to read simulation-based results as AI-context evidence for c2: what such a framework reports is not the impact but a stand-in for it.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
