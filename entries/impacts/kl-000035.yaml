- claim_id: c1
  source: kl-001050
  quote: "Participants reported a higher average immediate psychological-state score after the interaction (3.24 to 3.48, a relative increase of 7.4%). All sub-dimensions moved in the same direction, with the largest shifts observed for hope (+0.32), reverse-coded emotional distress (+0.29), and relaxation (+0.25)."
  locator: Section 4.3 Exploratory Feasibility and Usability Pilot
  licenses: 28 adolescents self-reported a small immediate rise in psychological state after one session (3.24 to 3.48), largest on hope, reverse-coded distress and relaxation. Supports the state occurring after a session; the uncontrolled single-arm design cannot attribute it to the interaction.
  fit: adjacent
  bridge: The source measured a pre-post self-report score across one uncontrolled session in 28 non-clinical high-school students, with no comparison condition. The entry asserts the state occurs during the interaction. What survives is the co-occurrence of a positive shift with the session, not relief produced by it.
