  locator: Section 3.6, Findings from laboratory studies, on Haines et al. (1995)
  licenses: 'Physiological measurement rather than self-report shows arousal dropping substantially when self-injurers imagined self-injuring and the period after. Grounds the entry''s construct: momentary relief of this kind is real and physiologically indexed, not only an artefact of how the episode is narrated.'
  fit: analogical
  bridge: What was measured is finger blood volume, heart rate, respiration, skin resistance and self-rated affect in 15 incarcerated men with a self-injury history while they visualised a self-injury script. No AI conversation is involved anywhere. It establishes the construct and is no evidence that any conversation produced relief in anyone.
