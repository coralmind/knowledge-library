- claim_id: c1
  source: kl-000763
  quote: "A large-scale field study on the MHA website (N = 15,531) evaluated user-reported outcomes, including emotional impact, therapeutic utility, and skill acquisition. The tool showed measurable benefits, with the majority of participants reporting reduced negative emotion and helpfulness of reframes for overcoming negative thoughts."
  locator: Section 4.4, Study IV (Intervention), implementation dimension
  licenses: In a field study of 15,531 users of a deployed cognitive-reframing tool, most reported reduced negative emotion and found the reframes helpful. Establishes an affective benefit measured at scale immediately after use.
  fit: adjacent
  bridge: Reduced negative emotion is the absence of a bad state rather than the presence of relief, joy or comfort, which is what the entry asserts. This source is a position paper restating a primary study rather than reporting it, so the measurement belongs elsewhere.
