  fit: adjacent
  bridge: The finding is restated second-hand from cited experiments (De Freitas et al. 2024 and others) rather than measured here, in brief interactions with general adults rather than a help-seeking context, and 'increase mood' is coarser than relief, joy or comfort during an exchange.
