- claim_id: c1
  source: kl-000827
  quote: 'A caution applies regardless of statistical power: in a synthetic setting the Advisee’s emotional state is not truly independent of what the Advisor says, since both are generated by the same class of model, and any apparent improvement may partly reflect linguistic mirroring rather than genuine emotional relief.'
  locator: Section 2.3 Study 2, closing paragraph
  licenses: 'The authors'' own bound: in a synthetic setting any apparent emotional improvement may reflect linguistic mirroring between two instances of the same model class rather than genuine emotional relief. Rules this source out as evidence that any relief occurred, and by extension cautions against reading model-only affect metrics as support for this claim.'
  fit: adjacent
  bridge: The 'person' whose emotional state improves in this design is a language model generating an Advisee's replies, and its state is inferred by another model. The entry asserts a state in a person. The authors say the result would only become meaningful if corroborated with human participants.
