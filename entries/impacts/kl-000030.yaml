  locator: Table A6, Impact class 'Loss of Individuality', Example column
  licenses: 'A person seeking help for alcohol abuse was routed to a suicide hotline and reported feeling unrecognized and alienated. The predicate is the entry''s own — unrecognized is the ''unseen'' limb — and it is the person''s report of their own state rather than a rating of the response. What it is not is transcript-derived: this is a survey response given after the fact, so it licenses the state''s occurrence at the level of self-report only.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001075
  quote: "“Sometimes when using the AI companion, when I bring the \nissues that I’m going through to the AI companion, I feel \nlike it doesn’t understand me fully like a real person would \nhave. I feel like some of the responses are what I get from \nrobots, and are not like real people.” –P9"
  locator: Section 5.2.4, Perceived Inadequacies and Lack of Empathy in Response
  licenses: 'In the paper''s paraphrase of P9''s interview statement, a companion-app user reports that bringing personal issues to the system left them feeling not fully understood, with the replies read as coming from a robot. This is the ''unheard'' element of the entry, as the participant reported it.'
  fit: direct
  bridge: null
  contributes: existence
