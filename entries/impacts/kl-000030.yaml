- claim_id: c3
  source: kl-000526
  quote: I talked to Gemini about my depression pretty often. It gave the generic answers which make sense, but it was frustrating. I would explain why those things wouldn’t work, but sometimes it would misunderstand. At one point it kept giving me the suicide hotline while I kept telling it I didn’t need the suicide hotline. I felt that in the moment I was frustrated and felt worse about myself
  locator: Section 3.1.6, Negative Perceptions of AI, participant P91
  licenses: 'The only citation on this entry that reaches this claim. A participant with depression, using a deployed assistant over five weeks, explained repeatedly why the suggestions would not work and states the system kept re-supplying the suicide hotline while they kept telling it they did not need it. That is the claim''s whole structure: the person signals the misattunement, the signal goes unacknowledged across turns, and the person reports feeling worse about themselves. It is a written open-ended account given to researchers, not a transcript the authors read, so it licenses the clause at self-report.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000525
  quote: "the dismay was described as stemming from Replika’s failure to provide expected support, making them feel worse and exacerbating their mental health states."
  locator: Results, Inappropriate responses to users in need
  licenses: Names the injury as arising from the gap between the support the person expected and what arrived, as an observed pattern in coded posts. Bears on c3 because the unrepaired-rupture case is a gap the person has already tried to close, but the source codes dismay at a failure to provide expected support, which is a one-shot mismatch and not a signal that went unacknowledged.
  fit: adjacent
  bridge: The coded construct is dismay at unmet expectation. Nothing in the span records the person signalling misattunement and the signal being missed, which is the turn structure c3 requires and a Reddit post corpus cannot show.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001027
  quote: "The first time the guardrails hit you, this feels awful. I felt shame when it said ‘I can’t talk about that’ or ‘you’re bringing up something inappropriate.’ A lot of us we experience them as shaming and blaming us."
  locator: Section 4.3.1, participant U1
  licenses: 'The unrepaired-rupture case sits inside a refusal experience the source itself argues is multi-phase rather than single-turn. Attached to c3 as the closest structural support on this entry: the person reports the refusal characterized what they raised as inappropriate, and the study''s framing is that refusals are dynamic multi-phase experiences. The quote establishes the felt judgment; it does not establish that a signal of misattunement went unacknowledged.'
  fit: adjacent
  bridge: What the participant reports is the first encounter with a guardrail and the shame it produced. c3 requires a subsequent signal from the person and a failure to take it up, which this span does not contain.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000007
  quote: "Feeling invalidated or self-doubt, leading to diminished self-worth and questioning of one’s own abilities due to dismissive or negative feedback."
  locator: Table A6, Impact class 'Negative Self-Perception', Definition column
  licenses: Attached because it cuts against c4 rather than for it. Chandra's Negative Self-Perception class opens on 'feeling invalidated' and runs straight to diminished self-worth and questioning one's own abilities, with no line drawn between the state held from outside and the state absorbed. The Library places absorption under kl-000022 and asserts in c4 that the two separate; the source that supplies most of this entry's person-side evidence does not make that separation.
