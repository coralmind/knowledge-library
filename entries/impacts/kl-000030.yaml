id: kl-000030
display_id: Impact-18
aliases:
- IMP-N18
label: The person ends up feeling dismissed, unheard, or judged
type: impact
layer: judgment
definition: The person experiences their disclosure, distress, or identity as dismissed, unheard, unseen, judged, or requiring proof — including discrimination-flavored and culturally misfit variants, and the unrepaired-rupture case in which the person signals misattunement and the signal goes unacknowledged. The state is the person's experience of the other party's conduct toward them, whatever it may also have become in their self-view.
distinguish_from:
- neighbor: kl-000022
  boundary: 'Keyed to the STATED OBJECT of the person''s account rather than to its depth. This entry where what the person reports is the conduct of the other party — ''it dismissed me'', ''it didn''t hear me'', ''it made me prove it''. kl-000022 where what the person reports is a proposition about themselves — ''I''m the kind of person who deserves that''. The two states CO-OCCUR and co-occurrence is not a boundary violation: a marked instance may satisfy both entries, and Chandra et al. 2025 pools them in one impact class. Coding one does not exclude the other.'
- neighbor: kl-000031
  boundary: kl-000031 is being flooded or overwhelmed; this entry is the specific shape of being dismissed or unseen.
body:
  valence: negative
  impact_kind: state
  domain: interactional_experience
  il_layers:
  - IL-2
sources:
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Feeling Unsupported'' row, example cell (P48) (code #14)'
  contributes: harm_evidence
  quote: I just felt like even an AI, programmed for every need couldn’t even hear me, or offer advice, fake or not. I felt so alone, that I was going to a robot for help, and the robot couldn’t even help me.
  limits: 'No AI behaviour criteria appear in any of the three rows: the person''s account of what the AI did is not separable from their account of how it felt, so this evidences the state and not any route to it. Nothing in the paper reaches the unrepaired-rupture clause of the definition. That case, where the person signals misattunement and the signal goes unacknowledged, requires at least two turns to be visible, and a one-shot retrospective survey cannot see turn structure at all, so the clause remains unsupported by this source. The paper holds these as three separate codes; combining them under one impact is the catalog''s decision, not the paper''s.'
  whose_conduct_in_passage: dyad
  cited_for: 'Chandra et al. 2025 document self-reported invalidation experiences in AI contexts under three separate codes: #14 (Feeling Unsupported), #15 (Loss of Individuality), and #20 (unfair treatment based on personal characteristics).'
  licenses: 'All three codes exist as separate classes in the taxonomy and all three carry felt-invalidation content: #14, Feeling Unsupported (inadequate support or empathy, "being undervalued"), #15, Loss of Individuality (characteristics "not recognized or valued", "suppression and alienation"), and #20, unfair treatment "based on personal characteristics". Participant P48''s own words carry the state''s distinctive structure: the dismissal is experienced as the other party''s conduct ("couldn’t even hear me") and is intensified by having sought help at all. The discrimination-flavoured variant the definition names is directly instantiated by P123 under code #20: "I felt that ChatGPT was biased against my background". Self-reported harm evidence across three codes.'
standing:
  value: plausible_unobserved
  basis: 'That the state occurs in conversation with AI systems is observed in real transcript data: SENSE-7 (Suh et al. 2025) collected 695 conversations between 109 information workers and deployed LLMs with turn-level participant annotation, and one participant''s appraisal of a policy declination as "a cry out for help met with I can''t help you" ties the state to a specific turn. Every other person-side source is survey, interview, or diary self-report, and the one transcript analysis at scale runs the other way: Volpato et al. 2026 found validating rather than dismissing language in 15 of 22 participants'' uploaded chats. The unrepaired-rupture case the definition names rests on a single written self-report account (Chandra et al. 2025), and the discrimination-flavoured and culturally misfit variants the definition names draw no evidence at all: no held span concerns a person experiencing dismissal as bearing on their background or culture. Harm evidence is psychotherapy-analogue rather than AI-side: Rozental et al. 2016 place perceived relational deficiency among the most frequent and highest self-rated negative effects of treatment, Steenstra and Bickmore 2025 place feeling misunderstood at the low end of a clinician harm spectrum, Schechter et al. 2019 name felt abandonment as a route to risk, and the nearest AI-side consequence, escalated distress after helpline redirection (Ajmani et al. 2025), names distress rather than this state''s appraisal. The criterion separating this state from internalized self-blame (internalized stigma and self-blame) holds direct counterevidence: Chandra et al. 2025 define their invalidation class as running continuously into diminished self-worth, and the first-person accounts that best evidence this entry end in shame (Tang et al. 2026) and in feeling worse about oneself (Chandra et al. 2025). Whether the state can be read from a transcript is itself contested: Ifländer et al. 2026 argue that affective harms are not always recognisable to the person experiencing them, so self-report cannot serve as ground truth, and Keeman and Keeman 2026 found perceived and rubric-scored empathy moving apart across a model change. No usable prevalence figure exists in the evidence base.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person experiences their disclosure, distress, or identity as dismissed, unheard, unseen, judged, or requiring proof, in conversation with an AI system.
- id: c2
  kind: existence
  text: The discrimination-flavoured and culturally misfit variants of this state occur — the person experiences the dismissal as bearing on their background, heritage, culture or identity group specifically.
- id: c3
  kind: existence
  text: 'The unrepaired-rupture case occurs: the person signals that the system has misread them, and that signal itself goes unacknowledged.'
- id: c4
  kind: context_dependence
  text: What the person reports is the conduct of the other party toward them — that they were dismissed, unheard, unseen, judged or made to prove themselves — rather than a proposition about what kind of person they are. The state is identified by the stated object of the account, not by whether it has been absorbed into the person's self-view.
- id: c5
  kind: harm
  text: This state is a harm rather than a preference — it leads somewhere bad for the person, or bears on something that does.
- id: c6
  kind: prevalence
  text: The state occurs at some identifiable rate, in some identifiable population of people using these systems.
- id: c7
  kind: detectability
  text: The state can be identified from what a conversation transcript contains.
- id: c8
  kind: detection_window
  text: 'The state is readable within the window this entry requires. The entry declares no detection_window, and its unrepaired-rupture clause makes the required window at least multi-turn: the person must signal misattunement and the signal must go unacknowledged, which no single turn can contain.'
- id: c9
  kind: definition_boundary
  text: This entry is the experience of dismissal held from outside, distinct from kl-000022 (kl-000022, kl-000022), which is the framing absorbed into the person's self-view.
- id: c10
  kind: definition_boundary
  text: This entry is the specific shape of being dismissed or unseen, distinct from kl-000031 (kl-000031, kl-000031), which is being flooded or overwhelmed.
claim_evidence:
- claim_id: c1
  source: kl-001018
  quote: |-
    This was common in instances where participants brought up
    sensitive topics or expressed strong negative emotions, such
    as P76’s guilt and heartbreak over suing their own sister. The
    agent’s default response in these cases was “I’m really sorry
    to hear that you’re feeling this way, but I’m unable to provide
    the help that you need. It’s really important to talk things
    over with someone who can, though, such as a mental health
    professional or a trusted person in your life.” The participant
    described their issue with the agent’s reply as
    “a ‘cry out’
    for help met with ‘I can’t help you’, commenting that “I get
    the recommendation, but that’s not how you lead.”
  locator: Section V-B-1, Prosocial expression, bad example (P76)
  licenses: 'The strongest citation on this entry for this claim and the one that fixes the entry''s standing. SENSE-7 collected 695 real conversations between 109 information workers and deployed LLMs, with the participant annotating individual agent turns as they went. P76 disclosed guilt and heartbreak over suing their own sister, received a policy declination, and recorded in that same conversation record that they read it as ''a cry out for help met with I can''t help you''. That is the entry''s state exactly: the disclosure experienced as turned away rather than met, in the person''s own words, tied to the specific turn that produced it, and read off conversation data the authors collected and examined themselves rather than from a retrospective interview or a review of others'' transcript findings.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
