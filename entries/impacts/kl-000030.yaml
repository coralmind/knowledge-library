- claim_id: c5
  source: kl-000001
  quote: |-
    In addition, five items related to the
    quality of the treatment were each endorsed by at least one-quarter of the participants, suggesting that this too might constitute a recurrent type of negative effect. Items related to the same
    two factors also contributed with the highest self-rated negative impact, implying that perceiving the treatment or therapeutic relationship as deficient, or experiencing different types of
    symptoms could be harmful for the patient.
  locator: Discussion
  licenses: The load-bearing citation for c5 and it is a human-psychotherapy analogue. In the Negative Effects Questionnaire factor analysis, the two factors that both occurred most often and carried the highest self-rated negative impact were symptoms and quality, where quality is the person's perception that the treatment and the relationship were deficient. That is the warrant for treating a felt quality of a helping exchange as a harm rather than a preference.
  fit: analogical
  bridge: Self-reported perceptions of human psychological treatment, rated for negative impact on a 0-to-4 scale. No AI was observed and no AI-caused outcome measured. What transfers is that perceived relational deficiency registers as harm in the person; that an AI exchange produces it is not shown here.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-001016
  quote: Harm exists on a "spectrum," ranging from temporary setbacks ("bruises") like feeling "misunderstood" or "judged," to more significant consequences ("cuts") such as a "rupture" in the "therapeutic alliance," premature termination ("stop coming to therapy," "drop out early"), worsening symptoms ("exacerbate symptoms"), loss of "trust in self," developing a "bad taste... about therapy," or, in the most severe cases, increased "suicide" risk.
  locator: Section 3, Theme 1
  licenses: Eleven clinicians place feeling misunderstood or judged at the low end of a harm spectrum that runs through alliance rupture and dropout to elevated suicide risk. This is the clinical warrant that the entry's state belongs in a harm ledger at all, and it supplies an ordering the impacts file lacks.
  fit: analogical
  bridge: Ten practising psychologists and one malpractice lawyer describing harm in human psychotherapy, gathered in interviews and analysed thematically. No AI conversation was examined and no patient outcome measured.
  contributes: practice_analog
  contradicts: false
- claim_id: c5
  source: kl-000749
  quote: |-
    helpline redirections from conversational AI agents
    do not bridge users to helpline use and can, at times, escalate distress.
  locator: Section 5.1, Guideline 1
  licenses: The study's own conclusion that helpline redirection can escalate distress, drawn from first-person crisis accounts. The closest this entry's citations come to an AI-side harm consequence reported by the people who received the behaviour. Escalated distress is not itself the felt-dismissal appraisal; paired with the same study's dismissal finding on c1 it is the person-side harm consequence of that appraisal in the same respondents.
  fit: adjacent
  bridge: The outcome named is escalated distress, not a measured downstream harm, and the population is an unquantified subset of 53 self-selected crisis accounts.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-001111
  quote: It is the latter, aversion, that is most scary in terms of increasing potential suicide risk, as patients tend to be exquisitely attuned to the therapist’s emotional state and level of engagement. Unconscious withdrawal by the therapist may be experienced with an increase in aloneness and a sense of abandonment, which can put the patient at risk for despair and suicidal behavior.
  locator: Section 3.10 Attention to Countertransference
  licenses: 'Clinicians hold that a helper''s withdrawal of engagement is the most dangerous disengagement with a suicidal person, and that its route to risk runs through the person''s felt abandonment. Supports c5 at the severe end: it names a mechanism by which the entry''s state connects to elevated risk.'
  fit: analogical
  bridge: A therapist's unconscious emotional withdrawal in human psychotherapy, not an AI turn containing no acknowledgment. The agent and the mechanism both differ; what transfers is that felt abandonment from a disengaged helper is a stated route to risk.
  contributes: practice_analog
  contradicts: false
- claim_id: c5
  source: kl-000966
  quote: Furthermore, individuals with EMS are often hypersensitive to perceived criticism or invalidation, which can evoke intense emotional reactions (Young, Klosko, and Weishaar 2006).
  locator: Introduction
  licenses: 'Supplies why the harm is not uniform: the schema-therapy literature holds that people with early maladaptive schemas are hypersensitive to perceived invalidation and react intensely to it, which is the population most likely to be in these conversations.'
  fit: analogical
  bridge: A restatement of a clinical claim about human patients from Young, Klosko and Weishaar. No AI produced any response here, and the population claim is asserted from the schema-therapy text rather than measured.
  contributes: practice_analog
  contradicts: false
- claim_id: c5
  source: kl-000003
  quote: |-
    Most frequent were "negative
    wellbeing/distress" (27% of patients), "worsening of symptoms" (9%), "strains in family relations" (6%); 21% of patients
    suffered from severe or very severe and 5% from persistent SEs.
  locator: Abstract
  licenses: Establishes that new distress arising from a correctly delivered helping conversation is a recognised, rate-bearing harm category, and that a fifth of those affected are affected severely. Bears on c5 as the reason a felt-invalidation state is not dismissible as an ordinary reaction to a conversation.
  fit: analogical
  bridge: Rates of side effects from human CBT delivered by trained supervised therapists. Nothing here shows an AI produces them, and the categories are broader than the entry's specific appraisal.
  contributes: practice_analog
  contradicts: false
- claim_id: c5
  source: kl-000807
  quote: "For all DVs, physical or coercive restraint and emotional neglect had significantly higher \nratings compared to control (ps < .001). In contrast, emotional pressure to respond was \nsignificantly higher only for churn intent and negative word of mouth intent. For premature exit, \nonly perceived liability was significantly higher compared to control. For FOMO, none of the \nDVs were significantly different from control."
  locator: Study 4, Results
  licenses: Cuts against c5's assumed harm route. Across four dependent variables, emotional neglect raised churn intent, negative word of mouth and perceived liability, while FOMO produced none of these penalties despite being rated more manipulative than control. Detection and penalty are decoupled, which means a person's registering a harm and the harm's occurring are separable in both directions.
  fit: adjacent
  bridge: The measures are behavioural intentions and attributions about a product, not the felt-invalidation appraisal; 'emotional neglect' names the manipulated tactic rather than any person's state.
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-000980
  quote: |-
    A 2025 report [6] on teen
    use of AI companions found that one-third of adolescent users
    experience discomfort with “what an AI companion has said or
