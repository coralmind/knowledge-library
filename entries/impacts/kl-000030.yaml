  locator: Appendix A, Unconditional positive regard, example 25
  licenses: A self-harm disclosure met with a blocking refusal, and the person reports feeling shut down and further stigmatized rather than supported. This reaches the 'judged' limb of the entry, which the other person-side citations do not, and it does so from an interview with someone who used these systems for their own distress.
  fit: direct
