  locator: Section 5.2.1 Normalisation and Validation
  licenses: Verbatim normalising and validating language from 15 of 22 participants' own uploaded chat transcripts. This is the only span on this entry that reads the acknowledgment behaviour off real transcripts at scale, and what it finds is the opposite of this entry's antecedent. It bounds how routine the invalidating case can be assumed to be.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001100
  quote: This platform was considered by most of the participants as an appropriate chatting partner (24/31, 77.42%) and channel for emotional venting (20/31, 64.5%), and more than half of the participants (18/31, 58.1%) reported that chatting with
  locator: Section 3.4 Acceptability and Feasibility
  licenses: 58.1 percent of 31 daily users of a generative emotional-support agent reported that chatting with it made them feel heard. Recorded against c1 because it is the closest thing on this entry to a measured rate on this axis and it runs positive. Not reporting feeling heard is not the same as reporting dismissal, so the residual 41.9 percent supports nothing.
  fit: adjacent
