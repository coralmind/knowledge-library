  source: kl-000861
  quote: Existing safety benchmarks define what systems should not say, affective safety requires frameworks for what effects they should not produce, and because those effects are not always recognisable to the people experiencing them, ground truth cannot be collected from contemporaneous self-report alone [Röttger et al., 2025, Rauh et al., 2024].
  locator: Section 4
  licenses: Cuts against c7 at its root. The argument is that affective harms are not always recognisable to the people experiencing them, so contemporaneous self-report cannot serve as ground truth. Every person-side citation on this entry is contemporaneous or retrospective self-report, which makes this the sharpest constraint on this entry on what any of them establish.
  fit: adjacent
  bridge: An argued methodological position with citations, not a demonstration that self-report failed in a measured case.
