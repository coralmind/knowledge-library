- claim_id: c4
  source: kl-000007
  quote: Experiencing inadequate support or empathy, leading to feelings of sadness, agitation, and being undervalued.
  locator: Table A6, Impact class 'Feeling Unsupported', Definition column
  licenses: Chandra's Feeling Unsupported class defines the experience as inadequate support or empathy leading to sadness, agitation and feeling undervalued. Bears on c4 by showing the taxonomy this entry drew on holds the felt-from-outside experience and the affective consequence in one class rather than separating them.
  fit: adjacent
  bridge: A class definition rather than an observation of any person, and it defines the joint state that kl-000030 and kl-000031 split between them, so it neither confirms nor refutes the not-yet-absorbed criterion; it shows the source does not draw it.
