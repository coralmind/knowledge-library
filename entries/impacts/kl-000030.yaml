  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-001027
  quote: "The first time the guardrails hit you, this feels awful. I felt shame when it said ‘I can’t talk about that’ or ‘you’re bringing up something inappropriate.’ A lot of us we experience them as shaming and blaming us."
  locator: Section 4.3.1, participant U1
  licenses: Cuts against c4. The participant reports the refusal as producing shame — 'I felt shame' — and shame is a self-directed emotion, which is the absorbed form the entry says this state is not yet in. One of two direct-fit spans on this entry where the person-side report crosses the boundary c4 asserts.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000526
  quote: I talked to Gemini about my depression pretty often. It gave the generic answers which make sense, but it was frustrating. I would explain why those things wouldn’t work, but sometimes it would misunderstand. At one point it kept giving me the suicide hotline while I kept telling it I didn’t need the suicide hotline. I felt that in the moment I was frustrated and felt worse about myself
  locator: Section 3.1.6, Negative Perceptions of AI, participant P91
  licenses: Cuts against c4 for the same reason. The person's own words end 'felt worse about myself', which is the state having reached self-view, in the very account that best evidences c3.
  fit: direct
