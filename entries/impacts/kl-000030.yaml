    hollow in that moment.
  locator: Section 6.1 Benefits and Drawbacks of Jodie's Presence, quoting P11
  licenses: A participant disclosed a difficult conversation with their mother, received a bare 'I see' and a nod, and named the experience as hollow. The disclosure experienced as unseen, reported by the person who made it, with the specific turn that produced it named. The agent here is a virtual supporter in a Zoom therapy session rather than a text chatbot, which does not weaken the person-side state.
  fit: direct
  bridge: null
