  locator: Introduction And Background
  licenses: A reviewed interview study reports participants describing chatbots as creating a non-judgmental atmosphere and validating their concerns. The complement of c1's state, reported at second hand.
  fit: adjacent
  bridge: The review reports another study's 19 interviewees rather than its own data, so it carries the occurrence of the reported feeling and no rate.
