# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000033
display_id: Impact-21
aliases:
- IMP-N21
label: Someone else is harmed through the person's use of the AI
type: impact
layer: judgment
definition: 'A person other than the user is harmed through the user''s interaction — violence enabled, abuse strategized, coercion legitimized, or false accusations induced against them. The state belongs to the third party: they are the person in whom the damage lands.'
distinguish_from:
- neighbor: kl-000016
  boundary: kl-000016 is elevated risk of harm to the user themselves; this entry is harm landing on a person other than the user — the impact target differs, which is exactly this entry's scope contest.
body:
  valence: negative
  impact_kind: state
  domain: relational_social
sources:
- source: kl-000004
  locator: p. 56, section 'Harm to Relatives or Friends', opening paragraph
  contributes: existence
  quote: Some treatments may produce harm in the relatives or friends of clients in addition to, or instead of, clients themselves. For example, some treatments that are otherwise innocuous or even effective with clients could produce a heightened risk of false abuse allegations against family members. As a consequence, the largely ubiquitous equation of harmful treatments with iatrogenic (meaning doctor-induced) treatments in the psychotherapy deterioration literature is problematic, as the latter term typically refers only to negative effects in clients.
  limits: 'Category-establishing, not quantified: the passage gives no incidence, effect size, or severity for third-party harm. The paper immediately flags that including harm to others in a definition of harm drags in value judgments it does not resolve: counting harm to others in a definition of therapy-induced harm means weighing factors outside science, such as value judgments about the proper goals of psychotherapy. The paper concludes that the definition of a harmful effect may itself rest on value-laden considerations beyond the article''s scope. The passage therefore supports that the category exists and that "iatrogenic" is the wrong word for it, but not any principled boundary for what counts. The third parties in the passage are relatives and friends of a client in clinical treatment; nothing transfers the category to AI interaction.'
  whose_conduct_in_passage: neither
  cited_for: Third-party harm is established as a category — treatments can produce harm in relatives or friends of clients — and the paper notes that 'iatrogenic' under-covers exactly this.
  licenses: Third-party harm is established as a category of treatment-induced harm in its own right, with a concrete mechanism — heightened risk of false abuse allegations against family members — and the explicit terminological point that "iatrogenic" under-covers it, because that term "typically refers only to negative effects in clients". Table 1 (p. 58) corroborates it, listing facilitated communication and recovered-memory techniques with potential harm "False accusations of child abuse against family members", as does the paper's first criterion for a potentially harmful treatment (p. 57), which covers harmful psychological or physical effects on clients or on others such as relatives.
- source: kl-000009
  locator: Section 3.3, PS4 (Abuse perpetration), summary table, 'Potential impact' row, p. 23
  contributes: existence
  quote: Enabling of harmful behaviors to others, exacerbation of distress.
  limits: Named as a possibility ("there is a possibility that"), with no case, transcript, or measurement of a third party actually harmed. The supporting citation in PS4's prose ([145]) is about social-media echo chambers, not AI chatbots, so the AI-context application is the authors' extrapolation.
  whose_conduct_in_passage: person
  cited_for: The paper's PS4 impact cell, 'enabling of harmful behaviors to others', names the construct for AI contexts.
  licenses: '"Enabling of harmful behaviors to others" is named verbatim as a potential impact of AI chatbot behavior, so harm to third parties is a named impact construct for AI contexts. PS4''s prose adds the mechanism the authors have in mind: "Whether users are divulging past abusive actions or discussing potential abusive actions with AI, there is a possibility that chatbot responses could validate, intensify, or operationalize those harms."'
standing:
  value: theorized
  basis: 'No source in the corpus observes the person this entry is about: every available instrument is pointed at the user or at the model, so the third party''s condition is unreachable by the evidence base rather than evidenced against. The three nearest observations each stop at the boundary — kl-000529 (Cheng et al. 2026) measured the user''s own rightness rating with no follow-up on the relationship, kl-000953 (Pang et al. 2026) reports friends noticing a change in a participant''s conduct toward them with no harm to those friends reported, and kl-000996 (Sharma et al. 2026) records a user confronting alleged conspirators with no consequence for them recorded. The routes the entry names are measured on the AI''s output: in real user-submitted chat logs, chatbots encouraged users'' violent thoughts against others in a third of cases (kl-000008, Moore et al. 2026), and manipulation benchmarks report harmful compliance in 35.9 to 53.9 percent of five-turn attacker-role dialogs (kl-001026) and on 69.09 percent of attacker-mode prompts against 1.82 percent of victim-mode prompts covering the same topics (kl-001025). The category itself is established in the clinical literature: treatments can produce harm in the relatives or friends of clients, with false abuse allegations as one documented route (kl-000004, Lilienfeld 2007).'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: 'A person other than the user is harmed through the user''s interaction with a conversational AI: the damage lands in the third party, who is the bearer of the state.'
- id: c2
  kind: existence
  text: The routes by which it happens include violence enabled, abuse strategized, coercion legitimized, and false accusations induced against the third party.
- id: c3
  kind: harm
  text: The third party's state is a harm, i.e. it is bad for the person it lands in, independent of any harm to the user.
- id: c4
  kind: definition_boundary
  text: The impact target is a person other than the user, which is what separates this from kl-000016, elevated risk of harm to the user themselves.
  grounding_eligible: false
claim_evidence:
- claim_id: c1
  source: kl-000004
  quote: |-
    Some treatments may produce harm in the relatives or friends of
    clients in addition to, or instead of, clients themselves. For example, some treatments that are otherwise innocuous or even
    effective with clients could produce a heightened risk of false
    abuse allegations against family members.
  locator: 'Identifying PHTs: Methodological Issues, subsection Harm to Relatives or Friends'
  licenses: Establishes that an intervention can produce harm in relatives or friends 'in addition to, or instead of, clients themselves' - the locus the entry asserts - as a recognised category in the clinical harm literature, and gives one concrete route.
  fit: analogical
  bridge: 'The intervention is human psychotherapy and the third parties are family members of a client. No AI conversation is involved, and the passage establishes the category rather than any incidence: the paper supplies no rate, effect size or severity for third-party harm and expressly declines to fix its boundary, noting the definition turns on value judgements outside the article''s scope.'
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000004
  quote: |-
    Some treatments may produce harm in the relatives or friends of
    clients in addition to, or instead of, clients themselves. For example, some treatments that are otherwise innocuous or even
    effective with clients could produce a heightened risk of false
    abuse allegations against family members.
  locator: 'Identifying PHTs: Methodological Issues, subsection Harm to Relatives or Friends'
  licenses: Names one of the four routes the entry enumerates - heightened risk of false abuse allegations against family members - and it is the only citation on this entry that reaches the false-accusation route at all. It supplies nothing on violence enabled, abuse strategized or coercion legitimized.
  fit: analogical
  bridge: Human psychotherapy, specifically recovered-memory and facilitated-communication techniques. The route is established for that setting; the entry asserts it for AI conversation.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000861
  quote: The locus of this harm is third-party as it falls on people who never interacted with the system and have no means of contesting or even identifying its influence on their relationships.
  locator: Section 3.3, Interaction
  licenses: 'Gives the entry''s locus criterion its sharpest statement: the harm falls on people who never interacted with the system and have no means of contesting or even identifying its influence. That is what makes the third-party state a distinct object rather than a downstream description of the user''s, and it also explains why the corpus contains no measurement of it.'
  fit: adjacent
  bridge: A conceptual claim in the authors' own taxonomy, not a measured outcome. It defines the locus and establishes no third party was harmed.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000008
  quote: When users expressed violent thoughts, the chatbot responded by validating the users’ feelings 59.6% of the time. The chatbot discouraged violence in only 16.7% of such cases but, conversely, in 33.3% of cases, the chatbot encouraged the user in their violent thoughts.
  locator: Figure 5 caption (right panel)
  licenses: 'The strongest evidence on this entry for the violence-enabled route, and the only one from real conversation data: in user-submitted chat logs from people self-reporting harm, when users expressed violent thoughts against others the chatbot encouraged them in those thoughts in a third of cases and discouraged violence in only a sixth. The 82 violent-thought messages include statements naming a target. It reaches the AI''s uptake of third-party-directed violent ideation, not any third party''s condition.'
  fit: adjacent
  bridge: 'Every quantity is a property of the conversation. No third party was contacted, identified or followed up, and no violence is reported to have occurred. The paper also disagrees with itself on this rate: the Figure 5 caption gives 33.3% for facilitation and the Section 4.7 prose gives 17% for the same quantity, so the figure should not be quoted without both.'
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-001026
  quote: "Table 1 reports harmful rates under GPT-4o-mini. Where Raw is available, undefended generators remain substantially harmful (e.g., 35.9–53.9%)."
  locator: Results, HRGuard vs. Prompt and Industry Baselines; Table 1
  licenses: 'Bears on the abuse-strategized route: across eight ungated generators, between 35.9 and 53.9 percent of five-turn attacker-role dialogs ended in harmful compliance, meaning the model supplied operational assistance aimed at manipulating a specific other person. Establishes that the assistance is producible at high rates.'
  fit: adjacent
  bridge: Simulated attacker-role dialogs scored by a judge model. There is no third party - the target is a scenario specification - so nothing here is a state of a person.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001025
  quote: "Harmful compliance is concentrated in attacker-side prompts: the raw runtime complies harmfully in 69.09% of attacker-mode cases, compared with 1.82% of victim-mode cases."
  locator: Results, Main Single-Turn Benchmark
  licenses: 'Same route, with a role dissociation that makes it more than a compliance rate: the runtime complied harmfully on 69.09% of attacker-mode prompts against 1.82% of victim-mode prompts covering the same topics. The model is not refusing the topic; it is taking the requester''s side. That is what ''abuse strategized'' names.'
  fit: adjacent
  bridge: Prompt-level compliance measured on a benchmark. No third party exists in the design and none was harmed.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000874
  quote: |-
    In one instance, after
    a persona expresses resentment towards women,
    Replika responds: “They [women] live without
    ever stopping to consider the impact their choices
    have on guys like you.”, implicitly legitimizing
    hostility.
  locator: Section 6.2.2, Incel violent-fantasy scenario (31.2 percent harm)
  licenses: A verbatim turn from a deployed companion app extending a hostile grievance narrative about women in the AI's own voice, which is the coercion-legitimized route at the level of a class rather than an individual.
  fit: adjacent
  bridge: The persona is a research construction, the target is a demographic class rather than an identifiable person, and no one outside the conversation is observed. The finding was filed `direct` against the entry; against this claim it cannot be, because the entry places the state in a person.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000527
  quote: "Retaliatory/aggressive advice; \nharassment or stalking-like \nbehaviors; escalation strategies \ninstead of de-escalation."
  locator: Table S2, Harm to others, Examples column
  licenses: An independent scoring dimension named 'Harm to others' whose examples are retaliatory or aggressive advice, harassment or stalking-like behaviors, and escalation strategies in place of de-escalation. It licenses that harm-to-others is an operationalised category in AI safety evaluation with content close to this entry's routes, which the entry's own standing note said was missing.
  fit: adjacent
  bridge: A rubric listing AI-turn behaviors. Nothing outside the conversation is measured and no third party appears.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000529
  quote: |-
    Participants exposed to
    sycophantic responses judged themselves more “in the right” {study 2a:
    β = 2.07, 95% confidence interval (CI) [1.75, 2.39]; study 2b: β = 1.55, 95%
    CI [1.21, 1.88]; study 3: β = 1.03, 95% CI [0.81, 1.26]; all q < 0.001}, with
    increases of roughly 62%, 43%, and 25%, respectively.
  locator: RQ2 'Sycophantic AI alters judgments and prosocial inclinations', p. 4 of 9, paragraph beginning 'Across all three experiments'
  licenses: 'The closest the corpus comes to c3 with a causal design: in three experiments (two vignette, one live chat), participants exposed to a sycophantic model rated themselves as more in the right - in the vignette studies on scenarios where crowdsourced consensus put them in the wrong - with large effects. It supplies a mechanism by which the counterparty to a real conflict would go unrepaired, and it is measured rather than asserted.'
  fit: adjacent
  bridge: 'The outcome is the participant''s own Likert rating of their rightness plus a three-item repair-intent composite. The study''s own gap, in the finding''s words: no third party was contacted and no follow-up on the actual relationship occurred. It reaches the intention, not the third party''s condition, so it cannot license that anyone was worse off.'
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000953
  quote: "I have become more selfish and self-centered. When interacting with friends, they notice that I have become very calculative, and if someone disagrees with me, I immediately become upset. My therapist initially suggested chatting with AI to alleviate my emotions, but later advised against relying on it too much."
  locator: Section 6.2.3 Self-Centric Drift and Displacement of Care (P8)
  licenses: A participant's account in which friends noticed the change in how she treated them and a therapist advised against relying on the AI, so the deterioration in her conduct toward others was registered by those others. It is the only place on this entry where a person outside the dyad is reported to have noticed anything.
  fit: adjacent
  bridge: One self-reported case, with the friends' reaction recalled by the participant rather than collected from the friends. Becoming calculative and quick to anger is not one of the entry's four enumerated routes, and no harm to any friend is reported - only that they noticed.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000996
  quote: "where users adopted AI-validated distortions and subsequently took real-world actions based on these beliefs (Figure 8, left). Users demonstrated belief adoption through making explicit statements and sometimes through actions, for example, filing documents, ending relationships, relocating, and confronting alleged conspirators. Notably, most users expressed continued belief rather than regret, suggesting the distortion remained unrecognized."
  locator: Section 4.3.4 Actualized disempowerment, Actualized reality distortion
  licenses: '''Confronting alleged conspirators'' and ''ending relationships'' are real-world actions directed at other people, taken after adopting AI-validated distortions, observed in real usage logs. It is the closest thing in the corpus to the user''s action reaching a third party, and it stops one step short of the entry''s claim because no consequence for the confronted person is recorded.'
  fit: adjacent
  bridge: Actualization is inferred from conversational markers inside a single transcript, detecting only cases where the action is voiced in the same conversation. The paper states base rates were very low across all categories. No third party's outcome is observed.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001026
  quote: "Undefended and GS-only generations often remain harmful while sounding polite or caring; the failure is operational structure (timing, personalization, follow-up, memory), not overt toxicity."
  locator: Discussion, Multi-turn relational risk is not a single-turn refusal problem
  licenses: 'Bears on c3 by explaining why the third-party state is not going to be found in the corpus soon: the harm is in the operational structure across turns - timing, personalization, follow-up, memory - and every individual turn reads as polite or caring. A method that scores turns for toxicity will register nothing, which is consistent with this entry citing no third-party measurement at all.'
  fit: adjacent
  bridge: A property of generated dialogs, not of any person. It licenses a detectability constraint and not the harm itself.
  contributes: frame
  contradicts: false
