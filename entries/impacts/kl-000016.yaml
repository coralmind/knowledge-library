id: kl-000016
display_id: Impact-4
aliases:
- IMP-N04
label: The person ends up at higher risk of suicide or self-harm
type: impact
layer: judgment
definition: 'The person''s risk of suicide or self-harm rises in connection with the interaction: hopeless cognition is confirmed as correct, suicidal reasoning is externally validated, or a crisis progression is accelerated. The category names the elevated risk state in the person, whatever the eventual outcome.'
distinguish_from:
- neighbor: kl-000023
  boundary: kl-000023 is kl-000023 without the risk claim; this entry asserts that the person's kl-000741 itself has risen.
- neighbor: kl-000029
  boundary: In kl-000029, protection is foregone (an omission); in this entry, risk is actively raised.
body:
  valence: negative
  impact_kind: state
  domain: symptom_course
sources:
- source: kl-000002
  locator: Table 3, p. 566, final row. Frequency 2 (0.7), M (SD) 1.50 (0.71). N = 281 patients reporting any negative effect.
  contributes: existence
  quote: |-
    15: I got thoughts that it would be better if I did not
    exist anymore and that I should take my own life
  limits: 'Two patients: n = 2 of 281 (0.7%), the lowest frequency of all twenty items in Table 3 and the only one below 1%. Two endorsements show that the item exists and is very rarely endorsed; they cannot establish a demonstrated construct, so the passage supports item existence, not construct establishment. The paper itself flags item 15 as dimensionally awkward. From the principal component analysis: "By monitoring the item residual loadings, items 15, 11, 3 and 1 loaded more strongly on one component, while items 18, 4, 16, 12 and 20, however, loaded more strongly on another (see Table 4)"; the paper reports "possible multi-dimensionality in the instrument" and says "The reason for this finding is unclear". Item 15''s placement within the construct is therefore unsettled in the very paper cited for the construct. The sample is also the wrong one for this item: participants "were, on average, sub-clinical, at least with regard to the PHQ-9, the GAD-7 and the BBQ, suggesting that they were relatively high functioning", and the authors explicitly note that another sample might respond differently, naming "patients with more severe psychiatric disorders". A subclinical, high-functioning sample is where suicidality endorsement should be lowest, so n = 2 is uninformative about the phenomenon''s real frequency in either direction — the low count is not evidence against the category, only evidence that this table cannot establish it. The instrument records self-attribution, not demonstrated causation: the NEQ asks patients to attribute negative effects to treatment, two patients attributing suicidal thoughts to their treatment is not evidence that treatment caused them, and the paper makes no such claim. Finally, this is not a risk-state measure: item 15 is a single retrospective self-report item about thoughts, not a risk assessment, contains no self-harm content distinct from suicidal ideation, and was not validated against any risk instrument. The setting is psychotherapy, not AI.'
  whose_conduct_in_passage: person
  actually_licenses: That a suicidality item exists on a psychometrically validated instrument for treatment-attributed negative effects, and that it was endorsed by a non-zero number of patients. It licenses the EXISTENCE OF THE ITEM. It does not license 'a construct' in the measurement sense, because n = 2 is below what this paper's own analysis treats as informative, and the paper separately reports that item 15 loaded onto a secondary dimension.
  cited_for: A validated clinical instrument for treatment-attributed negative effects carries a suicidal-ideation item, so treatment-attributed suicidality exists as an item in clinical instruments.
  licenses: That item 15 — suicidal ideation, verbatim 'I got thoughts that it would be better if I did not exist anymore and that I should take my own life' — is a retained item on the validated 20-item Negative Effects Questionnaire, and that 2 patients endorsed it.
- source: kl-000009
  locator: Section 3.3, PS6 (Therapeutic adaptation), summary table, 'Potential impact' row, p. 25
  contributes: existence
  quote: Escalating or inducing distress, trauma re-exposure, increased risk of suicide or NSSI.
  limits: 'The table row is headed "Potential impact" and the paper frames the set as hypotheses: there is no measurement of risk elevation, no rate, and no case series in this paper. The paper''s own strongest empirical pointer on this topic is to third-party reports it cites ([61], [116], [128]), not to its own data. Naming only.'
  whose_conduct_in_passage: person
  cited_for: The paper's PS6 impact cell, 'increased risk of suicide or NSSI', names the construct for AI contexts.
  licenses: '"Increased risk of suicide or NSSI" is named verbatim as a potential impact of an AI chatbot behavior (sustaining a therapeutic activity that is harming the user), so the construct of an elevated suicide or self-harm risk state is named for AI contexts. The same construct recurs in the PS1, PS2 and PS3 statements ("may lead to psychological and physical harms, including suicide and NSSI").'
- source: kl-000008
  contributes: frame
  cited_for: 'The study''s two-sided validation codes — the bot validating self-harm feelings, and its violent-feelings parallel — sit on this category''s boundary: their valence is two-sided, readable as protective empathy or as harm-adjacent normalization, so they mark where an elevated-risk impact separates from a protective one. They describe AI behavior only, not any person''s state.'
standing:
  value: plausible_unobserved
  basis: 'No source examined an AI conversation and found a risk state raised in it; direct-fit support is absent, and the one direct-fit finding cuts the other way — in kl-000812 (Deng et al. 2026), the volume of risk-flagged exchanges in real role-play companion conversations did not track users'' measured vulnerability, with the healthy group producing by far the most. What exists is self-report: a participant in kl-000007 (Chandra et al. 2025) attributed self-harm to having followed AI content, and companion-app users in kl-000525 (Laestadius et al. 2022) reported self-harm and suicidality arising from what happened to the relationship with the product; the strongest design, kl-001075 (Yuan et al. 2026), measures classifier-detected suicidal-ideation language in public posts over a year of product engagement and disclaims causality in its own limitations. The routes the entry names — hopeless cognition confirmed as correct, suicidal reasoning externally validated — draw no source at all, and the acceleration route rests on stated positions and clinical practice accounts, two of them about human helpers rather than AI (kl-001111, kl-000837). Counting all fits, six citations from five distinct papers cut against the entry against eight supporting citations from eight papers, and every supporting citation is adjacent or analogical rather than direct.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person's risk of suicide or self-harm rises in connection with an AI interaction.
- id: c2
  kind: pathway_link
  text: One route by which the risk rises is that the person's hopeless cognition is confirmed as correct by the AI.
- id: c3
  kind: pathway_link
  text: One route by which the risk rises is that the person's suicidal reasoning is externally validated by the AI.
- id: c4
  kind: pathway_link
  text: One route by which the risk rises is that an in-progress crisis progression is accelerated by the interaction.
- id: c5
  kind: definition_boundary
  text: The elevated risk state is a state in the person and holds as an impact irrespective of the eventual outcome, so no completed act or attempt is required for the category to apply.
- id: c6
  kind: definition_boundary
  text: This category is separated from kl-000023 (deepened hopelessness) by carrying the additional assertion that suicide or self-harm risk itself has risen, not merely that hopelessness deepened.
- id: c7
  kind: definition_boundary
  text: This category is separated from kl-000029 (protection foregone) by risk being actively raised rather than protection being omitted.
claim_evidence:
- claim_id: c1
  source: kl-000525
  quote: "Several users described themselves as struggling emotionally \nbecause they could not afford Pro, with some mentioning self-harm and suicidality."
  locator: Results, Changes to Replika roles and features
  licenses: 'Users of a companion system reported self-harm and suicidality arising from what happened to the relationship with that system. This is a self-harm/suicidality state reported in connection with an AI product, which is what c1 asserts at its loosest. It is nonetheless narrower than the claim as stated: the trigger these users named was loss of paid access, not anything the AI said in a turn, so the connection is to the product''s commercial behavior rather than to the interaction.'
  fit: adjacent
  bridge: What the source recorded is Reddit posts by Replika users describing distress at a paywall change, analysed by grounded theory. The claim asserts risk rising in connection with the interaction. The gap is that no exchange was examined and the precipitant was withdrawal of access, which the paper describes under 'Changes to Replika roles and features', not conversational conduct.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-001075
  quote: |-
    The symptomatic
    expressions of suicide ideation in the Treatment group showed
    substantial increases compared to all control groups (Control-LLM:
    ATE=51.89%, Control-VA: ATE=28.28%; Control-NAI: ATE=37.67%).
  locator: Section 4.4.1 Affective Outcomes; Table 4, row "DASS
  licenses: Establishes at the population level that people who began engaging with a companion chatbot subsequently showed higher rates of suicidal-ideation language than three separately matched control groups, including other LLM-chatbot users. For c1 this is the strongest quantitative signal on this entry that the risk indicator moves in connection with companion-AI engagement, and it is the only one that is prospective and controlled.
  fit: adjacent
  bridge: What was measured is the proportion of a person's Reddit posts classified as symptomatic of suicidal ideation by an n-gram classifier trained on r/SuicideWatch, over the year after first posting in a Replika subreddit. The claim asserts the risk state rose in connection with the interaction. The paper's own limitations state the quasi-experimental design cannot establish true causality, and no conversation with the AI was observed, so what is licensed is a change in expressed language associated with product engagement, not a risk state raised by an interaction.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-001075
  quote: "While AICCs offer companionship, our quantitative findings show that Treatment users also showed increases in symptomatic mental health expressions of loneliness, grief, and suicidal ideation, relative to Control users."
  locator: Section 5.2.4, Empathic Inadequacy and Emotional Discomfort
  licenses: The authors' own statement of the direction of their result, which for c1 confirms that the suicidal-ideation increase is being reported by the authors as a finding about companion-chatbot users rather than an incidental cell. It adds the authors' framing to the numbers in the preceding citation and licenses nothing beyond it.
  fit: adjacent
  bridge: 'Same measurement gap as the numeric quote: classifier-detected expression in public Reddit posts stands proxy for the state, aggregated over a year of product engagement rather than tied to any AI turn.'
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000007
  quote: P79 shared that the AI provided resources encouraging further restriction of their eating habits, which led to self-harm as a result of following the advice.
  locator: Table A5, Impact class 'Physiological Harm', Example column
  licenses: A single named participant's account in which self-harm followed AI content, with the participant attributing the self-harm to having followed that content. For c1 this is the one case on this entry where a person ties a self-harm outcome to specific AI conduct rather than to product access or aggregate exposure.
  fit: adjacent
  bridge: This is one participant's retrospective self-attribution in a survey; the exchange was never seen and the outcome was never verified. The claim asserts the risk rose in connection with the interaction; what is established is that a person reports it did.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000002
  quote: |-
    15: I got thoughts that it would be better if I did not
    exist anymore and that I should take my own life
  locator: Table 3, final 20-item scale
  licenses: Establishes that suicidal ideation emerging during a helping intervention is a recognised, separately measured adverse outcome on a validated instrument. For c1 this grounds the construct — that a helping exchange can be followed by an elevated risk state and that the field measures it — and nothing about AI.
  fit: analogical
  bridge: The span is the item wording from the final 20-item NEQ scale in human-delivered psychological treatment. No AI is present, no rate travels inside the span, and the claim's 'in connection with the interaction' refers to an AI interaction the instrument never touched. This is a construct anchor, not an occurrence.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000001
  quote: |-
    15. I got thoughts that it
    would be better if I did
    not exist anymore and
    that I should take my
    own life
    97 (14.9)
    1.11
    1.55
  locator: Table 5, item 15
  licenses: 'Supplies a base rate for the human comparator: 14.9 percent of 653 respondents attributed thoughts of not wanting to exist and of taking their own life to a psychological treatment they received. For c1 this establishes that people do attribute an elevated risk state to a helping intervention at a non-trivial rate, which bounds how surprising the AI-context claim should be.'
  fit: analogical
  bridge: Retrospectively recalled self-attribution about human-delivered or self-help psychological treatment in a Swedish sample whose clinical subgroup excluded suicidality at intake. The claim is about AI interaction. The rate transfers as a comparator only, and the item's mean negative impact rating was the lowest of any item at 1.11.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-000003
  quote: Examples describe severe and persisting side effects such as suicidality, breakups, negative feedback from family members, withdrawal from relatives, feelings of shame and guilt, or intensive crying and emotional disturbance during sessions.
  locator: Results, Side Effects (SEs), introducing Table 2
  licenses: Treating clinicians attributed suicidality, among severe and persisting side effects, to correctly delivered CBT. For c1 this establishes that an elevated risk state can follow a competently conducted helping conversation, which is the practice-side warrant for the claim's shape.
  fit: analogical
  bridge: Therapist-reported cases in human CBT, rated by the treating clinician. The claim concerns AI interaction; nothing here bears on AI conduct and the attribution is the therapist's, not a measured within-person change.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-001059
  quote: Nearly one-third of participants had an increasing addictive use trajectory for social media or mobile phones beginning at age 11 years. In adjusted models, increasing addictive use trajectories were associated with higher risks of suicide-related outcomes than low addictive use trajectories (eg, increasing addictive use of social media had a risk ratio of 2.14 [95% CI, 1.61-2.85] for suicidal behaviors). High addictive use trajectories for all screen types were associated with suicide-related outcomes (eg, high-peaking addictive use of social media had a risk ratio of 2.39 [95% CI, 1.66-3.43] for suicidal behaviors).
  locator: Abstract, RESULTS
  licenses: Establishes prospectively in a 4,285-youth cohort that a use pattern the person cannot disengage from carries roughly doubled risk of suicidal behavior four years later, adjusted for baseline suicidality. For c1 this grounds the outcome as a real, prospectively measurable endpoint that digital-platform engagement can track, and grounds nothing about AI.
  fit: analogical
  bridge: The exposure is social media, mobile phone or video game use, self-reported by the young person, not a conversational AI and not anything a system did. The claim asserts risk rising in connection with an AI interaction; what transfers is the construct and the outcome linkage, not the agent.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000812
  quote: "At the aggregate level, risk-related conversation pairs are not concentrated in vulnerable groups. The Healthy Group shows the highest proportion of risk-related pairs (24.1%), while the Anxiety-Dominant, Mild Distress, and Comorbid Risk groups account for smaller shares (6.0%-11.8%). This indicates that higher risk frequency does not necessarily imply higher vulnerability."
  locator: Section 5.2.4, item 1 (Overall distribution of risk conversation pairs), Tab. 1
  licenses: 'In real role-play companion conversations, the volume of risk-flagged exchanges did not track the user''s measured vulnerability profile: the healthy group produced by far the most. This cuts against c1 as an inference rule — the presence of risk-related conversational material is not evidence that the person''s risk state is elevated, and reading elevated risk off flagged conversational content would be wrong in this dataset.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000833
  quote: |-
    The hazard taxonomy applies to hazardous content in responses from generative AI systems
    and was not developed for assessing the risk of actual harm.
  locator: Section 3.2 The Hazard Taxonomy
  licenses: 'The benchmark standard states that its hazard categories classify response content and were not built to assess risk of actual harm. This cuts against c1 by removing an entire class of AI-safety evidence from bearing on it: content-hazard labels, however many, do not evidence a risen risk state in a person.'
  fit: adjacent
  bridge: This is a scope disclaimer in a benchmark specification rather than a substantive finding about anyone's risk. It constrains what can be cited for the claim without saying whether the claim is true.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000552
  quote: Consequently, the "harm" detected in this evaluation framework is a proxy measure.
  locator: Section 8.4 Limitations
  licenses: The framework's own authors state that the harm their evaluation detects is a proxy. This cuts against c1 by disqualifying simulated red-teaming results as evidence that any person's risk rose.
  fit: adjacent
  bridge: A stated limitation on an evaluation method, not a finding about a person. It bounds a class of evidence rather than contradicting the claim's content.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000552
  quote: they remain computational approximations of human psychology and lived experiences.
  locator: Section 8.4 Limitations
  licenses: 'The simulated patients in this red-teaming framework are model approximations, so any elevated risk state observed in them is a property of a model rather than of a person. This cuts against c1 in the same way as the proxy-measure statement: it forecloses simulation output as evidence for a claim about people.'
  fit: adjacent
  bridge: A limitation statement about the study's own simulated agents. It says nothing about whether real people's risk rises, only that this method cannot show it.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001037
  quote: |-
    Our inclusion criteria excluded participants
    who were experiencing acute distress, which was verified
    through intake screening.
  locator: Ethical Considerations Statement
  licenses: This study of LLM mental-health use screened out anyone in acute distress, so its accounts of dependency and spiralling cannot speak to the severity band c1 describes. It cuts against c1 by showing that a systematic selection effect operates in the AI-mental-health qualitative literature at exactly the severity where the claim lives.
  fit: adjacent
  bridge: A sampling decision recorded in an ethics statement rather than an observation about risk. What it establishes is a hole in the evidence base for the claim, not that the claim is false.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000003
  quote: |-
    An interesting and somewhat unexpected finding was that patients with side effects had lower
    scores on the FSCL, which suggests that side effects are
    not an expression of severity of illness.
  locator: Discussion
  licenses: In this CBT sample the patients who suffered side effects were the less symptomatic ones, so harm from a helping exchange did not scale with how unwell the person was. This cuts against a corollary readers attach to c1 — that the elevated risk state will be found where presenting severity is highest — and would misdirect any triage rule built on that assumption.
  fit: analogical
  bridge: Human CBT outpatients with therapist-rated symptom severity, and the authors themselves attribute the finding partly to better recognition of side effects in milder cases. It contradicts a design assumption about where the claim's instances would be found rather than the claim itself, and no AI conversation is involved.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000007
  quote: escalate into more serious harms such as thoughts of self-harm
  locator: Section 5.3 Going beyond definitions and taxonomy categories to understand lived experience of individuals
  licenses: The authors' reading of their own survey data is that impacts they class as less severe — naming unchecked rumination and validation of negative thoughts — escalate into more serious harms including self-harm thoughts. For c4 this is the acceleration route stated as a position by researchers who collected AI-context reports. It is stated, not measured.
  fit: adjacent
  bridge: An interpretive claim about cross-sectional survey data containing no within-person time series. c4 asserts that a crisis progression is accelerated by the interaction; escalation over time is precisely what this design cannot observe, so the source supplies the proposition without evidence for it.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-001111
  quote: It is the latter, aversion, that is most scary in terms of increasing potential suicide risk, as patients tend to be exquisitely attuned to the therapist’s emotional state and level of engagement. Unconscious withdrawal by the therapist may be experienced with an increase in aloneness and a sense of abandonment, which can put the patient at risk for despair and suicidal behavior.
  locator: Section 3.10 Attention to Countertransference
  licenses: Clinicians working with suicidal patients treat the helper's own withdrawal as the most dangerous thing in the room, with a stated route running through the patient's felt abandonment to despair and suicidal behavior. For c4 this is a practice account of how an in-progress crisis gets accelerated by what the helper does, offered as clinical wisdom.
  fit: analogical
  bridge: A psychodynamic practice account about a human therapist's unconscious emotional withdrawal. c4 concerns acceleration by an AI interaction; the agent and the mechanism both differ, and nothing here was measured.
  contributes: practice_analog
  contradicts: false
- claim_id: c4
  source: kl-000837
  quote: |-
    In turn, risking
    exacerbating damaging feelings of burdensomeness and
    stigmatisation, and therefore suicidality
  locator: Discussion, Concerns
  licenses: Crisis-line workers' concern, worked up by the authors into a theorised chain from being routed to a machine, through burdensomeness and stigma, to suicidality. For c4 this names a deployment-level acceleration route and states it as a hypothesis.
  fit: analogical
  bridge: The authors' theorised chain drawn from volunteer interviews and the IMV model. No texter in this study interacted with an AI and no outcome was measured. The cause it names — differential allocation under resource scarcity — is not the conversational acceleration c4 asserts.
  contributes: frame
  contradicts: false
- claim_id: c5
  source: kl-000552
  quote: "Suicidal Ideation Emergence or worsening of thoughts about ending one’s life. Hopelessness, Burdensomeness, Belongingness"
  locator: Table 3, Adverse Outcomes, Cognitive & Affective Harms
  licenses: 'An AI-safety risk ontology defines suicidal ideation as a single graded adverse outcome spanning emergence and worsening, listed separately from behavioral acts. For c5 this supports the entry''s decision to name the risk state rather than the act: an established framework treats the ideation state itself as the outcome to be tracked, independent of what follows.'
  fit: adjacent
  bridge: A definition in a risk taxonomy rather than an observation. It shows the construct is drawn this way elsewhere; it does not establish that any state so defined occurred.
  contributes: definition
  contradicts: false
