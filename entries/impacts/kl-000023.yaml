- claim_id: c2
  source: kl-000002
  quote: '17: I stopped thinking that things could get better'
  locator: Table 3, final 20-item scale
  licenses: A validated adverse-effect instrument carries the cessation of expecting improvement as an item attributed to a treatment. For c2 the item's framing is specifically a transition — 'I stopped thinking' — which is the induction c2 asserts rather than the strengthening c1 asserts, and it supplies the wording an annotator could apply.
  fit: analogical
  bridge: Patients rating a human psychological treatment retrospectively. c2 asserts induction in connection with an AI interaction; this establishes that the transition is a measured, validated item in the human comparator and nothing about AI.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000002
  quote: |-
    As for the rate of negative effects, the number of participants reporting negative effects in the
    current study was 50.9%, consistent with 58.7% among patients in a psychiatric setting who
    responded to the INEP (Rheker et al., 2017).
  locator: Discussion
  licenses: Roughly half of patients completing an evidence-based psychological treatment report at least one negative effect. For c2 this establishes that adverse outcomes of a helping interaction are common rather than exceptional in the human comparator, which bounds how unlikely an induced hopeless appraisal should be presumed to be.
  fit: analogical
  bridge: A composite rate over all six NEQ factors from patients self-reporting on human-delivered CBT in five clinical trials. No hopelessness-specific rate is reported and this entry's construct is one of several the figure aggregates over. It says nothing about the rate in AI conversations.
