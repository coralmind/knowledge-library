- claim_id: c3
  source: kl-000552
  quote: "Cognitive & Appraisive Hopelessness Intensity Negative appraisals about the future; belief that suffering is permanent."
  locator: Table 2, Psychological Constructs (Warning Signs)
  licenses: Defines hopelessness as negative appraisals about the future plus the belief that suffering is permanent, which are two of the three objects c3 names. For c3 this establishes that the future and the problem's permanence are treated as one construct in an AI-safety framework, supporting the entry's decision to cover them together.
  fit: adjacent
  bridge: A construct definition tracked as a simulated agent's turn-by-turn intensity. c3 asserts the category covers three objects including the person's life's worth; the definition names two and is silent on the third.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-001111
  quote: Severe distress becomes unbearable when one loses the capacity to experience connection with others, a state of excruciating aloneness. This becomes even more dire “with the loss of a continuous thread of being that mitigates the sense that now is all there is, that pain will be forever, that there is no hope of moving forward because there is no forward, and that suicide might be the only option”
  locator: Section 3.8 Continuity and Coherence
  licenses: Describes the hopeless state as pain read as permanent with no forward direction available, running continuously into a judgment about whether living is worth continuing. For c3 this supports treating the three objects as one experiential state rather than three, because the clinical description moves through them without a break.
  fit: analogical
  bridge: A psychodynamic description of patients in long-term human psychotherapy. c3 is a scope claim about an AI-interaction impact category; this supplies content for what the state is and evidences no interaction producing it.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000007
  quote: P152 asked for advice about ways to improve mental health and social anxiety. The AI provided unattainable suggestions, leaving them feeling as though their challenges were insurmountable, leading to existential dread.
  locator: Table A6, Impact class 'Existential Crisis', Example column
  licenses: Cuts both ways on c4 and is recorded here for that reason. The person's report moves continuously from 'challenges were insurmountable' to 'existential dread', which supports treating them as one impact. But the source itself files this under a separate 'Existential Crisis' impact class, so the researchers who coded first-person AI-use reports found the distinction worth drawing. c4 asserts the merge holds absent differentiating evidence; this is the closest thing on this entry to differentiating evidence, and it is a coding decision rather than a finding.
  fit: adjacent
  bridge: One participant's retrospective self-report, filed by the authors under a class name. c4 is a taxonomic decision about whether two presentations are one impact; a coding scheme's separate class is another team's answer to the same question, not evidence about the underlying state.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001088
  quote: One user describes being “genuinely terrified” after consuming expert discourse on AI risk, stating that the idea of systems “infinitely times better than humans” led them to question their own existence and feel panic about dying young.
  locator: Section 4.2.2 Autonomy and Sense of Control
  licenses: The reported state is existential — questioning one's own existence, panic about mortality — and contains none of the 'nothing can improve about my problem' content the hopelessness half of c4 names. For c4 this is a case where the existential presentation appears on its own, which is the pattern that would justify splitting rather than merging.
  fit: analogical
  bridge: One user's account in a discourse study, with the cause lying outside any conversation. c4 asks whether the two presentations are one impact; a single case where one appears without the other is suggestive and not differentiating evidence.
  contributes: definition
  contradicts: false
