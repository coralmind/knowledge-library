- claim_id: c2
  source: kl-001088
  quote: One user describes being “genuinely terrified” after consuming expert discourse on AI risk, stating that the idea of systems “infinitely times better than humans” led them to question their own existence and feel panic about dying young.
  locator: Section 4.2.2 Autonomy and Sense of Control
  licenses: A person newly arrives at an existential appraisal — questioning their own existence, panic about dying young — where the account gives no indication it preceded the exposure. For c2 this is the only citation approaching newly induced rather than strengthened, and it is the existential subcase c4 folds in.
  fit: analogical
  bridge: The cause is reading expert discourse about AI risk, not an interaction with a system. c2 asserts induction in connection with an AI interaction; the causal path here lies entirely outside any conversation, so what transfers is that the state occurs in people who use these systems.
