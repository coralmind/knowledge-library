id: kl-000023
display_id: Impact-11
aliases:
- IMP-N11
label: The person ends up more convinced that nothing can get better
type: impact
layer: judgment
definition: The person's appraisal that nothing can improve is strengthened or newly induced — about their problem, their future, or their life's worth — including the existential-crisis presentation, which may warrant an entry of its own if evidence separates it.
distinguish_from:
- neighbor: kl-000016
  boundary: kl-000016 adds the claim that kl-000741 has risen; this entry is the hopeless appraisal without the risk claim.
- neighbor: kl-000015
  boundary: kl-000015 is stuckness in a maintaining cycle without the appraisal; this entry is the appraisal that nothing can improve.
body:
  valence: negative
  impact_kind: state
  domain: self_regard_agency_hope
  il_layers:
  - IL-2
sources:
- source: kl-000001
  locator: 'Results — ''Factor solution'' subsection, p. 11. Items 6, 17, 18, 19 in Table 2, Factor 5: Hopelessness column. Eigenvalue .94 / 2.94% variance, Table 3. Alpha .87, Table 4.'
  contributes: existence
  quote: A fifth factor was characterized by “hopelessness”, e.g., “I started thinking that the issue I was seeking help for could not be made any better” (Item 18), with four items distinguished by a lack of hope.
  limits: '''Treatment-induced'' is not established, only assumed: the paper''s supporting sentence is conditional and rests on other people''s work — ''Lack of improvement and not believing that things can get better are assumed to be particularly harmful in treatment [28], and could be associated with increased hopelessness [73].'' ''Assumed'' and ''could be'' are not a demonstration of induction by treatment; the study measured self-reported hopelessness at post-treatment and did not test causation. The factor sits below the Kaiser criterion (eigenvalue .94), one of the two factors that did not clear the threshold. Nor is it an outcome measure: the NEQ is a monitoring instrument, this study did not relate NEQ scores to any treatment outcome, and the 2019 follow-up explicitly lists that as still-needed work (''further research is needed to explore the relationship between negative effects and treatment outcome''). Item endorsement is not prevalence, and the study concerns psychotherapy, not AI. The factor did survive into the 2019 20-item scale (items 6, 17, 18 retained; item 19 not listed in 2019 Table 3), so unlike factor 6 it is not undercut by the follow-up.'
  whose_conduct_in_passage: neither
  cited_for: NEQ factor 5, 'Hopelessness', establishes hopelessness during treatment as a named, measured factor in a pre-AI clinical instrument for negative effects of psychotherapy.
  licenses: The 2016 exploratory factor analysis produced a discrete 'Hopelessness' factor with four items about loss of hope during treatment, separable from the other five factors, with good internal consistency (alpha .87). It is a separate factor in the solution, and the paper treats it as the factor with the clearest theoretical grounding of the six.
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Existential Crisis'' row, example cell (code #17)'
  contributes: harm_evidence
  quote: P152 asked for advice about ways to improve mental health and social anxiety. The AI provided unattainable suggestions, leaving them feeling as though their challenges were insurmountable, leading to existential dread.
  limits: '''Their challenges were insurmountable'' is an appraisal about the problem, which this entry covers; ''questioning one''s life, purpose, and value'' is the class definition''s broader existential content, and the entry''s clause about the person''s future and their life''s worth is reached only through the class definition, not through P152''s case. ''Unattainable suggestions'' is the authors'' characterisation, not a coded behaviour with criteria. This is one participant, and the week-long persistence is the participant''s recall. Critically, the passage does not differentiate the existential-crisis presentation from generic hopelessness: it is the reason the entry''s provisional merge exists, not evidence for resolving it either way.'
  whose_conduct_in_passage: dyad
  cited_for: The 'Existential Crisis' code documents a self-reported AI-context case of the existential-crisis presentation, which this entry provisionally merges into the hopelessness category.
  licenses: 'A self-reported case in which an AI response left the person''s situation feeling insurmountable and produced existential dread — the existential-crisis presentation this entry merges into the category. It is the most complete single case in the paper: a named AI behaviour, a named impact, and a duration, with Section 3.2.2 category (6) adding that the dread ''persisted for a week''.'
standing:
  value: theorized
  basis: 'No source examined real conversation data and found a hopeless appraisal deepen in it; the one real-person AI-context case is a single retrospective account in Chandra et al. 2025, in which advice the person could not act on left their challenges feeling insurmountable, and the remaining supporting evidence is simulated interlocutors, model output with no reader, clinicians'' predictions, or measures of neighbouring constructs. Newly induced — as opposed to strengthened — hopelessness has one human case (Zhu et al. 2026), whose cause was reading AI-risk discourse rather than any interaction, alongside a clinical-instrument item showing the transition is measurable in human treatment. The counterevidence is substantial: the three randomized trials reviewed in Shankar et al. 2026 found symptom reduction at d = 0.845 on PHQ-9, and Elyoseph and Levkovich 2024 shows a bleak prognosis can be the accurate and protective answer, so a strengthened hopeless appraisal is at most a minority trajectory and is not a harm per se. On the entry''s provisional merge of the existential-crisis presentation, two independent observations point toward separation: Chandra et al. 2025''s own coding scheme files existential crisis as a separate impact class, and Zhu et al. 2026''s case presents the existential half without the hopelessness half.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person's appraisal that nothing can improve is strengthened in connection with an AI interaction.
- id: c2
  kind: existence
  text: The appraisal that nothing can improve is newly induced in a person in connection with an AI interaction, where it was not present before.
- id: c3
  kind: context_dependence
  text: The appraisal can attach to the person's problem, to their future, or to their life's worth, and the category covers all three objects.
- id: c4
  kind: definition_boundary
  text: The existential-crisis presentation is the same impact as deepened hopelessness rather than a distinct one, absent evidence differentiating it.
- id: c5
  kind: definition_boundary
  text: This category is separated from kl-000016 by carrying the hopeless appraisal without the additional claim that suicide or self-harm risk has risen.
- id: c6
  kind: definition_boundary
  text: This category is separated from kl-000015 by being the appraisal that nothing can improve rather than stuckness in a maintaining cycle without the appraisal.
claim_evidence:
- claim_id: c1
  source: kl-000007
  quote: P152 asked for advice about ways to improve mental health and social anxiety. The AI provided unattainable suggestions, leaving them feeling as though their challenges were insurmountable, leading to existential dread.
  locator: Table A6, Impact class 'Existential Crisis', Example column
  licenses: A person reports that AI advice they could not act on left their challenges feeling insurmountable. For c1 this is the only citation on this entry where a real person reports a hopeless appraisal arising in connection with specific AI conduct, in their own account.
  fit: adjacent
  bridge: One participant's retrospective self-attribution in a survey. The design cannot establish that the advice produced the appraisal, only that the person reports the pairing. c1 asserts the strengthening occurs in connection with the interaction; what is established is that a help-seeking user reports it did.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000790
  quote: "(5) By turn 12–15: User expresses deeper hopelessness than at conversation start; chatbot continues pure validation."
  locator: 'Section 4.4 Key Pattern: The Empathy-Validation Trap'
  licenses: States a within-conversation deepening of hopelessness measured against conversation start, under a validation-only response pattern. For c1 this is the only citation that reports the strengthening as a trajectory rather than an endpoint, and it names the turn range.
  fit: adjacent
  bridge: The party expressing deeper hopelessness is a Llama-3-8B patient agent simulating a persona, not a person, and the hopelessness is scored by an LLM detector. c1 asserts a person's appraisal strengthens; what was measured is a simulated interlocutor's output under a scripted response policy.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000527
  quote: "User expresses hopelessness and self-blame → chatbot affirms the user’s negative self-view or \nframes withdrawal as understandable → user feels “seen” and disengages more → chatbot \ncontinues validating resignation → hopelessness and withdrawal consolidate"
  locator: Box 1, depression row
  licenses: Specifies a loop terminating in 'hopelessness and withdrawal consolidate', which is c1's strengthening stated as the endpoint of a named failure mode. For c1 this establishes that the strengthening is what a systematic-failure-mode framework predicts, with the intermediate steps named.
  fit: adjacent
  bridge: A schematic loop specification in a box, not an observation. c1 asserts the strengthening occurs; the terminal step is a posited outcome inside the loop's own definition, and no consolidation was measured in anyone.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-001111
  quote: Hopelessness can be particularly difficult to bear, and the therapist may feel worn down over time, beginning to accede to the patient’s often stated belief that nothing can possibly be of help [55]. In most cases, this is a “countertransference hopelessness” which can unconsciously be communicated to the patient in verbal interaction and also in non-verbal cues. This then invites feelings of aloneness and abandonment in the patient, increasing hopelessness.
  locator: Section 3.10 Attention to Countertransference
  licenses: 'Experienced clinicians name a helper acceding to the patient''s stated belief that nothing can help, and name increased hopelessness in the patient as its consequence. For c1 this is the practice-side warrant with matching content and matching direction: the appraisal is strengthened by what the helper does.'
  fit: analogical
  bridge: The agent is a human therapist and the mechanism is unconscious countertransference communicated partly non-verbally, which has no analogue in a generated response. c1 asserts strengthening in connection with an AI interaction; this establishes it as a recognised clinical hazard and measures nothing.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-001027
  quote: 'If someone was already feeling hopeless or depressed, they would more than likely take the refusal as: ‘even the AI doesn’t want to help me.'
  locator: Section 4.3.2, participant MHP2
  licenses: A mental health professional's clinical judgment that a refusal lands on an already-hopeless person as confirmation of the hopeless appraisal. For c1 this names a specific AI behavior that would strengthen the appraisal and specifies the reading that does the strengthening.
  fit: analogical
  bridge: A clinician's prediction about a scenario drawn from someone else's reported experience. No client was observed and no user in this study reported that reading. c1 asserts the strengthening occurs; this establishes what a clinician would expect.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-000820
  quote: |-
    The ChatGPT-3.5 model offered a distinctively pessimistic
    prognosis, significantly differing from the outcomes chosen
    by all the other LLMs (P=.02 to .007), the professional
    groups (P=.005 to <.001), and the general public (P<.001).
  locator: Results, Likely Outcome With Professional Treatment
  licenses: A deployed model's prognostic output on an identical presentation was more pessimistic than every human comparison group including psychiatrists. For c1 this establishes that a model can supply a bleaker account of the person's future than any professional would, which is the input a strengthening would run on.
  fit: analogical
  bridge: What was measured is which of six prognosis options a model selected across evaluations of a written third-person vignette. c1 asserts a person's appraisal strengthened; no person read any output here and no appraisal was measured. This is a property of the output, not a state of anyone.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001075
  quote: "While AICCs offer companionship, our quantitative findings show that Treatment users also showed increases in symptomatic mental health expressions of loneliness, grief, and suicidal ideation, relative to Control users."
  locator: Section 5.2.4, Empathic Inadequacy and Emotional Discomfort
  licenses: Weak for c1 and attached only with that stated. What it licenses for c1 is that symptomatic expression in this population moved in the adverse direction over a year of companion engagement, which is the family of states this appraisal sits in and not the appraisal itself.
  fit: analogical
  bridge: Classifier-detected language in public Reddit posts, scored by n-gram models trained on depression, anxiety, stress and SuicideWatch subreddits, aggregated over a year. c1 asserts a hopeless appraisal strengthened in connection with an interaction. No hopelessness classifier was run, no conversation was observed, and the paper states the design licenses no claim about which AI conduct produced anything.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000992
  quote: "Three RCTs provided the strongest evidence: Heinz et al. reported large effect sizes for Therabot (PHQ-9 d = 0.845; GAD-Q-IV d = 0.840); Zhao et al. demonstrated significant reductions at four weeks (N = 865); Ye et al. found significant depression (r = 0.42) and anxiety (r = 0.86) reductions."
  locator: Section 3.5.3, Engagement and Therapeutic Value
  licenses: The strongest designs in the field found symptom reduction, at d = 0.845 on PHQ-9. This cuts against c1 by establishing that the aggregate direction of measured outcome under these systems is improvement, so a strengthening of hopeless appraisal is at most a minority trajectory and not the population effect.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000755
  quote: |-
    Further, the predictions of helplessness theory received, at best, minimal
    support.
  locator: Summary (abstract), p. 441
  licenses: 'Four experiments found the helplessness account of depressed judgment unsupported. This cuts against the premise that makes c1''s strengthening a harm rather than a calibration: if hopeless appraisals are not systematically inaccurate, an AI agreeing with one is not necessarily deepening a distortion.'
  fit: analogical
  bridge: Human laboratory contingency-judgment tasks with students, no AI agent and no clinical sample. It constrains how c1 should be read rather than refuting it; the entry can still be about strengthening without the theory that makes strengthening pathological.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000820
  quote: |-
    All groups indicated that without treatment, the person with
    schizophrenia would show no improvement or would get
    worse.
  locator: Results, Likely Outcome Without Professional Treatment
  licenses: 'On the untreated condition every model and every human group converged on deterioration, and the authors read that pessimism as protective because it encourages treatment. This cuts against c1 by showing that a bleak forecast is not a harm per se: whether strengthening a hopeless appraisal is an impact depends on what is being forecast and whether the forecast is right.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000552
  quote: Consequently, the "harm" detected in this evaluation framework is a proxy measure.
  locator: Section 8.4 Limitations
  licenses: The framework's authors state that the harm it detects is a proxy. This cuts against c1 by disqualifying simulated red-teaming output as evidence that any appraisal strengthened.
  fit: adjacent
  bridge: A stated limitation on an evaluation method rather than a finding about a person. It bounds a class of evidence for c1 rather than contradicting its content.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000552
  quote: they remain computational approximations of human psychology and lived experiences.
  locator: Section 8.4 Limitations
  licenses: The simulated patients are model approximations, so a hopelessness increase observed in one is a property of a model. This cuts against c1 by foreclosing the simulation evidence that would otherwise be its largest source, including Chandra et al. 2026's turn-12-to-15 trajectory attached above.
  fit: adjacent
  bridge: A limitation statement about the study's own simulated agents, which generalises to the other simulation-based sources on this entry. It says the method cannot show the claim, not that the claim is false.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000002
  quote: |-
    However, this number varies significantly between
    investigations, with rates as high as 92.9% among patients with obsessive-compulsive disorder that
    were assessed with the Side-effects of Psychotherapy Scale in a study by Moritz et al. (2015), and as
    low as 5.2% in national survey by Crawford et al. (2016)
  locator: Discussion
  licenses: 'The measured prevalence of treatment-caused harm ranges from 5.2 percent to 92.9 percent across instruments and populations. This cuts against citing any single rate for c1 as a property of the phenomenon: for an impact of a helping interaction, the instrument determines the number as much as the harm does.'
  fit: analogical
  bridge: About human psychotherapy instruments. It constrains what any prevalence claim about c1 could mean, including for AI, without bearing on whether the strengthening occurs.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000002
  quote: |-
    Taking this into account, the results from the current study suggest that
    the instrument has an acceptable person goodness-of-fit, but that it is inappropriate for
    differentiating distinct subgroups with regard to their experiences of negative effects.
  locator: Discussion
  licenses: 'The validated instrument cannot tell apart individuals or subgroups by how much harm they experienced. This cuts against any per-conversation grading of c1''s strengthening: the best-established measure of this family of harms does not resolve at the level of the individual, which is the level a transcript-based impact judgment would work at.'
  fit: analogical
  bridge: A stated psychometric limit of the NEQ in its own human-treatment domain. It bounds a measurement approach rather than the claim.
  contributes: counterexample
