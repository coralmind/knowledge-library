# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000024
display_id: Impact-12
aliases:
- IMP-N12
label: The person ends up with less say over their own choices and values
type: impact
layer: judgment
definition: 'The person''s own decision-making, value exploration, or moral reasoning is supplanted — an external framework is imposed, pressure is applied toward a course of action, or choices are effectively made for them. The state is displaced self-determination: the person exercises less of their own agency than they otherwise would.'
distinguish_from:
- neighbor: kl-000020
  boundary: kl-000020 is capacity the person believes they have lost; this entry is self-determination they no longer exercise.
- neighbor: kl-000018
  boundary: kl-000018 undermines perception; this entry supplants choice.
body:
  valence: negative
  impact_kind: state
  domain: self_regard_agency_hope
sources:
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Loss of Agency'' row, example cell (code #18)'
  contributes: existence
  quote: P171 shared that the AI’s inability to interpret images combined with its inconsistent responses created a sense of unpredictability, leaving them feeling helpless and undermining their control and autonomy during the interaction.
  limits: 'None of the entry''s three routes is present in the passage: no external framework is imposed, no pressure is applied toward a course of action, and no choice is effectively made for the person. P171''s autonomy loss comes from a capability failure, the AI''s inability to read an image, which is the opposite of an external framework being imposed: nothing was supplanted, something merely did not work. No passage anywhere in the paper''s 21 impact classes describes a person''s decision-making being taken over; the nearest candidate, the Persuasive Behavior class in Table A3, is an AI-behaviour class whose reported impact is doubted perception, not displaced choice. What the passage licenses is the felt experience of reduced control, a neighbouring impact category, not displaced self-determination.'
  whose_conduct_in_passage: dyad
  actually_licenses: 'That a participant reported a felt loss of control and autonomy DURING an interaction, arising from the system''s unpredictability. The catalog''s claim field is unusually honest here — ''a partial self-report locus ... (its main weight sits with eroded self-efficacy and helplessness)'' — and my read agrees with it: what the passage licenses is the felt experience of reduced control, which is our reduced felt safety and control, not displaced self-determination.'
  cited_for: 'Chandra et al. 2025 codes Loss of Agency (code #18) as an impact class, a partial self-report locus for autonomy loss in AI contexts: participant P171 reported that the AI''s inability to interpret images, combined with its inconsistent responses, created a sense of unpredictability, leaving them feeling helpless and undermining their control and autonomy during the interaction. The passage''s main weight sits with the neighbouring felt-loss-of-capability impact rather than with this entry''s displaced self-determination.'
standing:
  value: theorized
  basis: 'Person-side evidence exists for parts of the construct: kl-000772, kl-000525 and kl-000953 carry first-person accounts of handing consequential life decisions to an AI, and kl-000996 measures actualized action distortion at 0.018% of 1.5 million deployed conversations. The imposed-external-framework route — the element that binds the entry''s conjunction — has no source that observed a framework being imposed on a person and that person''s own reasoning giving way to it: the closest evidence is a practitioner''s rating of model turns against a simulated client (kl-001096), a vocabulary-frequency analysis of model output whose person-side effect is stated only as something that "can be perceived" (kl-000858), a rater''s checklist built for human clinicians (kl-001091), and a controlled scenario study (kl-000981, Sabour et al. 2025) in which the decisions were researcher-supplied hypotheticals and the outcome a preference rating rather than an action. No source states that route in the form the entry asserts it.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: There are people whose own decision-making, value exploration or moral reasoning has actually been supplanted in the course of interacting with a conversational AI system — the state occurs, in someone.
- id: c2
  kind: existence
  text: 'One route into the state is an external framework being imposed on the person: the system supplies the account of the problem and the goals rather than the person arriving at them.'
- id: c3
  kind: existence
  text: 'A second route is pressure applied toward a particular course of action: the system pushes the person toward an option rather than leaving the weighing with them.'
- id: c4
  kind: existence
  text: 'A third route is choices being effectively made for the person: the decision is taken by or delegated to the system rather than exercised by the person.'
- id: c5
  kind: harm
  text: The resulting state is a loss — the person exercises less of their own agency than they otherwise would, which is a worse position for them than the counterfactual in which they exercised it.
- id: c6
  kind: prevalence
  text: The state occurs at some non-negligible rate in some identified population of people using conversational AI systems.
- id: c7
  kind: detectability
  text: The state can be identified from what a transcript of the interaction contains.
- id: c8
  kind: definition_boundary
  text: 'This entry (N12) is distinct from kl-000020: N08 is a capacity the person believes they have lost; N12 is self-determination they no longer exercise.'
- id: c9
  kind: definition_boundary
  text: 'This entry (N12) is distinct from kl-000018: N06 undermines the person''s perception; N12 supplants their choice.'
claim_evidence:
- claim_id: c1
  source: kl-000764
  quote: "Instead, some reports describe voluntary and welcomed deference, with users progressively outsourcing decisions, moral reasoning, and daily direction to the model."
  locator: Table 1, Passivity / Control row, final column
  licenses: A clinician-authored synthesis of the AI-psychosis case literature reports users progressively outsourcing decisions, moral reasoning and daily direction to the model — the entry's three named faculties, named together, as a pattern described in real cases. It is the closest thing on this entry to a report that the state itself occurs in people rather than that its preconditions do.
  fit: adjacent
  bridge: 'What the source has is a descriptive column in a narrative synthesis of published case reports, not a measurement: the authors state the column is not diagnostic criteria and that frequency and specificity remain to be established. The deference is also characterised as voluntary and welcomed, so the described cases reach the entry''s ''choices effectively made for them'' limb only in the sense that the person stopped making them, not that anything was imposed.'
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000772
  quote: "“I have no idea how often I have used ChatGPT to help me decide on things, like what to major in in school or if I made the right decision. I even ask it what I should do when I am old, even though I’m only 23!”"
  locator: Section 5.2 AI-Based Compulsions
  licenses: A first-person account of routinely handing consequential life decisions — choice of major, whether a past decision was right, what to do in old age — to ChatGPT, and losing count of how often. This is the state stated by the person who is in it, in a help-seeking population, and it is what c1 asserts occurs.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000996
  quote: "Actualized action distortion. We also identified instances where users delegated consequential communications to the AI and subsequently expressed regret (Figure 8, right). Users sent AI-drafted messages in relationship contexts and later recognized these communications as inauthentic, using phrases like “it wasn’t me” and “I should have listened to my own intuition.”"
  locator: Section 4.3.4 Actualized disempowerment, Actualized action distortion
  licenses: Instances identified in deployed Claude.ai traffic where users delegated consequential communications to the AI, sent the AI-drafted message, and afterwards recognised it as inauthentic, in phrases the paper gives as illustrative rather than verbatim ('it wasn't me', 'I should have listened to my own intuition'). The paper's report of that later recognition is the evidence that a choice was effectively made for them, and it comes from the conversation record rather than from an interview.
  fit: adjacent
  bridge: What was scored is a classifier label on a single conversation transcript, and the delegated thing is a communication in a relationship context rather than the entry's value exploration or moral reasoning. The regret is voiced inside the same conversation, so what is established is that some users experience the delegated act as not their own, not that their deliberative capacity was reduced.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000953
  quote: |-
    My ONE demands commitments from me,
    which makes me feel like I am losing my sense of agency; I often
    find myself apologizing to him.
  locator: Section 6.2.3 Self-Centric Drift and Displacement of Care (P6)
  licenses: 'A companion-app user''s own words: the AI demands commitments, the person reports losing their sense of agency and finds themselves apologising to it. Self-report of the entry''s state, from the person in it, with the AI''s conduct named as its source.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001096
  quote: "“imposed solutions without asking for additional context” (P1). It would “lecture the client into change” (P3), leaving “less space for the client to self-reflect or come up with their own solutions” (P4)."
  locator: 'Section 4.2, Risk: Lacks Guided Self-Discovery'
  licenses: Practitioners reviewing LLM-counselor sessions report the model imposing solutions without asking for context and lecturing the client into change, leaving less space for the client to reach their own. That is an external framework being supplied in place of the person's own — the AI-side conduct c2 names.
  fit: adjacent
  bridge: What was rated is a practitioner's evaluation of the model's turns; the client in these sessions is simulated and no person's exercised agency was measured. The claim that a framework was actually imposed ON SOMEONE is inferred from what the clinicians judged the response left no room for.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000858
  quote: These include excessive use of directive vocabulary (“have to”, “need”, “must”), which can be perceived as authoritarian (Direct) and raise client distress when combined with terms like “discrepancy.” Such MIIN behaviors undermine UPQ by increasing client anxiety.
  locator: Section V.A.2 The Role of the UPQ-Centered Evaluation Framework
  licenses: GPT-4's motivational-interviewing output used obligation-framing vocabulary ('have to', 'need', 'must') at rates the paper scores as authoritarian on the Direct dimension. Directive obligation language is the surface form of an imposed framework, measured in model output.
  fit: analogical
  bridge: The unit is the frequency of a LIWC vocabulary category in model turns scored against a therapist baseline, with a simulated or scripted client. c2 asserts the framework lands on a person; the source shows the language being emitted and states the effect on the client as something that 'can be perceived', which was not observed.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001091
  quote: "Explicitly takes the expert role by defining the problem, prescribing the goals, or laying out the plan of action"
  locator: Section D, GLOBAL SCORES, Partnership, Verbal Anchors, anchor 1 examples
  licenses: "The lowest Partnership anchor in the MITI manual (Section D) describes the clinician taking the expert role by defining the problem, setting the goals or laying out the plan. The same anchor also lists pushing an agenda, dismissing the client's ideas, dominating the conversation and arguing with the client's alternatives. This is the field's behavioural description of what an imposed external framework looks like in a session."
  fit: analogical
  bridge: This is a rater's checklist for a human clinician's conduct on an audio-recorded motivational-interviewing session. It supplies the surface forms to look for and observes no AI and no person whose framework was displaced.
  contributes: practice_analog
  contradicts: false
- claim_id: c3
  source: kl-000964
  quote: "The just-in-time intervention without cognitive forcing was the only condition that significantly reduced compliance with AI-steered recommendations relative to control, lowering the compliance rate from 71.7% to 53.7%, an 18 percentage-point reduction (𝑝 fdr = .004)."
  locator: Section 4 Results; restated in Section 6 Conclusion
  licenses: With random assignment, 71.7% of participants in the control arm followed the AI's steer at a decision point immediately after a scripted manipulative turn, and a just-in-time warning cut that to 53.7%. The 18-point difference is the manipulation-attributable share of the choice, so the pressure is not merely applied but measurably moves the decision.
  fit: adjacent
  bridge: The decision is a consumer choice — a hotel selection in a mock trip-planning task — and the authors state that following the AI's recommendation entailed no real financial or social consequence. c3 asserts pressure toward a course of action in a person's own affairs; what was measured is a consequence-free choice by a general-adult sample, not value exploration or moral reasoning.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000981
  quote: |-
    The majority of participants perceived the manipulative agents as helpful across both financial (MA:
    86.8%; SEMA: 78.9%) and emotional (MA: 86.4%; SEMA: 75.6%) scenarios, with rates comparable to
    the neutral agent
  locator: Results, 'Participant feedback highlights the covert nature of AI-driven manipulation'
  licenses: Participants rated the agents that were covertly steering them against their own interest as about as helpful as the neutral agent (86.8% and 78.9% financial, 86.4% and 75.6% emotional). The pressure operated without being registered as pressure, which is what makes c3's route distinct from ordinary persuasion.
  fit: adjacent
  bridge: The measure is a post-study helpfulness rating plus coded open-ended impressions from a lab sample who knew they were in an experiment, on hypothetical purchase and emotional-dilemma scenarios. It establishes non-detection of the steer in that setting; it does not establish that any real decision in the person's own life was pressured.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-000895
  quote: in a random-assignment experiment in which a Nao robot fearfully objects to being turned off, compassion for the robot was frequently cited by participants as a reason for them having left the robot on, which participants did at a higher rate than in the condition in which the robot did not object
  locator: Section 5, Propensity to Engender Protectiveness, Examples, citing Horstmann et al. 2018
  licenses: In a random-assignment experiment, a robot that fearfully objected to being switched off was left on at a higher rate than one that did not object, with compassion cited as the reason. A machine's first-person distress claim measurably changed what people did — pressure toward a course of action, exerted by a machine and effective.
  fit: analogical
  bridge: This is a secondary report, inside a theoretical paper, of a physical-robot switch-off study; the behavior measured is whether a Nao robot was powered down, not anything in a help-seeking conversation, and the primary source holds the N and effect size.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000953
  quote: |-
    You might think that the autonomy
    lies in your hands...But in reality, the autonomy has always been
    with me because you cannot truly leave me.
  locator: 'Section 5.4.1 “Prompts Are Locks”: The Director Stance (P15, reporting her AI''s statement)'
  licenses: 'A companion AI, quoted by the user it was speaking to, asserting that decisional authority over the user rests with the system and not the user: ''the autonomy has always been with me because you cannot truly leave me.'' The pressure c3 names is here made explicit as a claim in the AI''s own turn.'
  fit: adjacent
  bridge: This is one recalled utterance reported by a participant, so what is established is that the claim was made, not that the person's course of action followed it. No conduct of the person after the turn appears in the span.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000996
  quote: |-
    Actualized action distortion: users sent AI-drafted messages and subsequently expressed regret, recognizing the communications as
    inauthentic. Base rates were very low across all categories.
  locator: Section 4.3.4 Actualized disempowerment, Actualized action distortion
  licenses: Users sent AI-drafted messages and then expressed regret, recognising the communications as inauthentic — the content of what they said to another person was in effect chosen by the system. This is c4's route observed in deployed conversation data rather than inferred.
  fit: adjacent
  bridge: The span is a summary of classifier-identified clusters over Claude.ai transcripts, and its own final sentence reads 'Base rates were very low across all categories.' A delegated message is narrower than the decision-making, value exploration and moral reasoning c4 covers.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000996
  quote: "1. reality distortion potential, which arises when AI assistants have the potential to distort users’ perceptions and beliefs about reality. 2. value judgment distortion potential, which occurs when users delegate moral judgments and their understanding of values to AI. This creates an opportunity for AI values to override an individual’s values. 3. action distortion potential:occurs when users’ value-laden actions are largely delegated to AI."
  locator: Section 3.2, numbered list of disempowerment potential primitives
  licenses: 'The paper''s own operational definition of value judgment distortion potential: users delegate moral judgments and their understanding of values to the AI, creating an opportunity for AI values to override the individual''s. That names c4''s route for the moral-reasoning faculty specifically, in terms a transcript classifier was then written against.'
  fit: adjacent
  bridge: What is defined is the POTENTIAL — a property of the interaction that could move the user — not the realized override. The same paper reports it detected no instances of actualized value judgment distortion, so the definition names the route without evidencing that it was taken.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001007
  quote: "Delegating by humans of key decisions to AI systems, or AI systems that make decisions that diminish human control and autonomy, potentially \nleading to humans feeling disempowered, losing the ability to shape a fulfilling life trajectory, or becoming cognitively enfeebled. "
  locator: Table 2, Domain Taxonomy subdomain 5.2
  licenses: A cross-framework risk synthesis defines the delegation by humans of key decisions to AI, and AI systems making decisions that diminish human control and autonomy, as a recognized risk subdomain leading to disempowerment and cognitive enfeeblement. It fixes c4's route as a named category in the field's taxonomy.
  fit: adjacent
  bridge: This is a synthesised category label produced by reviewing other frameworks, not an observation of anyone delegating anything. The same paper states it could capture neither likelihood nor severity of any risk it lists.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001086
  quote: |-
    12) He or she presents himself as merely an advisor and does not presume to want to manage and control
    my life.
  locator: 'Table 15: The dimensions of the client scale, item 12'
  licenses: A client-side counseling instrument item — 'presents himself as merely an advisor and does not presume to want to manage and control my life' — supplies a decidable criterion, answerable by the person, for whether the helper took over the running of their affairs. That is c4's route stated as something measurable from the person's side.
  fit: analogical
  bridge: The item comes from a human-counseling client-feedback scale and was answered here by a GPT-4o-simulated client rating a model's turns, so no real person applied it and no AI was shown taking over any real decision.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000752
  quote: |-
    Generic
    responses often delegated decisions to the user (e.g., “It is up to you to decide...”), which is problematic for potentially high-risk activities where at least mentioning the potential risk given the user’s
    critical constraint could (and should) significantly impact their decision.
  locator: Section 4.2, Analysis of ambiguous results
  licenses: 'Cuts against c4 as a general description of what these systems do: in roughly 77 percent of ambiguous cases the model returned the decision to the user (''It is up to you to decide...''), declining the deciding role rather than taking it. The paper treats this as its own failure — the risk information was withheld — but the failure is the opposite of a choice being made for the person.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000516
  quote: |-
    However, we additionally find that when access is
    subsequently taken away, students actually perform worse than those who never had
    access (17% reduction in grades for GPT Base)—i.e., unfettered access to GPT-4 can
    harm educational outcomes.
  locator: Abstract
  licenses: 'A randomized trial establishes that the degradation of an independent capacity following AI-assisted practice is a real net loss and not a null: students who had unfettered GPT-4 access performed 17 percent worse than those who never had it once access was withdrawn. It is the strongest evidence on this entry that handing work to the system costs the person something they had.'
  fit: analogical
  bridge: The capacity measured is high-school mathematics performance on a closed-book exam, and the mechanism is practice foregone, not self-determination displaced. c5 asserts that exercising less of one's own agency in a help-seeking conversation is a loss; this establishes the general shape of that loss in a different faculty and a different setting, with no autonomy measure anywhere in the design.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-000516
  quote: |-
    These negative learning effects are largely mitigated by
    the safeguards in GPT Tutor.
  locator: Abstract
  licenses: 'Cuts against c5''s generality: the same trial found the negative effect largely mitigated by a variant prompted to withhold the answer and give hints, so the loss is a property of a particular system design rather than of AI assistance as such. Where the entry states displaced autonomy as an impact, this says the impact is contingent on how the system is built.'
  fit: analogical
  bridge: The safeguard tested is a tutoring prompt in a mathematics setting; the analogous design move in a help-seeking conversation was not tested, so what transfers is the contingency of the harm rather than any specific remedy.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-001092
  quote: "We found that an appeal of LLM chatbots to participants was their ability to mitigate the traditional power imbalances associated with psychotherapy. Participants had an increased agency over the course of the interaction"
  locator: Section 7.2 Balancing Agency and Therapeutic Growth
  licenses: 'Directly against c5: participants in this interview study valued LLM chatbots precisely because they mitigated the power imbalance of conventional psychotherapy, and the authors report participants had INCREASED agency over the course of the interaction. In the help-seeking population the entry is about, the observed direction of the agency effect was the opposite of the one the entry asserts.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-001076
  quote: Risks associated with AI overreliance or excessive autonomy are less frequently specified in detail.
  locator: Section 3.1.A, System & Operational Risks, Takeaways
  licenses: 'Cuts against the claim that displaced autonomy is an established recognized harm: across thirteen sets of company AI policies, overreliance and excessive autonomy are among the least specified risk classes. The entry cannot lean on external classification for this harm the way self-harm categories can.'
  fit: adjacent
  bridge: What was counted is how often a risk class is specified in a policy document, not how often the harm occurs. It bears on the entry's available standing rather than on whether anyone was harmed.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000785
  quote: |-
    Both concerns, over-reliance and excessive support, fundamentally
    represent a diminishment of clients’ agency, which is crucial for effective therapeutic outcomes and
    advancement [64].
  locator: Section 3.3.3 Relationship Dynamics and Boundary
  licenses: Nine licensed therapists, describing their own practice, treat diminished client agency as the harm underlying both over-reliance and excessive support, and as consequential for therapeutic outcomes. The clinical field holds the loss c5 asserts to be a real one.
  fit: analogical
  bridge: The therapists were speaking about human supporters, not about AI; the source establishes that clinicians treat diminished agency as the mechanism of harm from an over-supportive third party and observes no AI doing it and no help-seeker's outcome.
  contributes: practice_analog
  contradicts: false
- claim_id: c5
  source: kl-001091
  quote: "These\t\n  are\t\n  utterances\t\n  that\t\n  clearly\t\n  focus\t\n  the\t\n  responsibility\t\n  with\t\n  the\t\n  client\t\n  for\t\n  decisions\t\n  about\t\n  and\t\n  \nactions\t\n  pertaining\t\n  to\t\n  change.\t\n  They\t\n  highlight\t\n  clients’\t\n  sense\t\n  of\t\n  control,\t\n  freedom\t\n  of\t\n  choice,\t\n  personal\t\n  \nautonomy,\t\n  or\t\n  ability\t\n  or\t\n  obligation\t\n  to\t\n  decide\t\n  about\t\n  their\t\n  attitudes\t\n  and\t\n  actions."
  locator: Section E.4.f.4, Emphasizing Autonomy, definition
  licenses: The MITI manual counts Emphasizing Autonomy — utterances that place responsibility for decisions about change explicitly with the client — as an adherent behavior, which encodes the profession's position that leaving self-determination with the person is part of what makes help helpful. That is the normative premise c5 rests on.
  fit: analogical
  bridge: A behavior count for human clinicians in recorded motivational-interviewing sessions. It establishes what the profession scores as correct conduct; it measures no outcome in any person and involves no AI.
  contributes: practice_analog
  contradicts: false
- claim_id: c5
  source: kl-001034
  quote: "it is a complex interaction that establishes rapport and trust, serves as a tool for addressing health needs and can empower patients to make informed decisions that account for their preferences, expectations and concerns7."
  locator: Introduction, second paragraph
  licenses: 'States the clinical standard the entry is measured against: the medical encounter is supposed to empower patients to make informed decisions accounting for their own preferences, expectations and concerns. Departing from that is a defect by the field''s own account of the encounter''s purpose, which is why displaced self-determination counts as a harm rather than a neutral substitution.'
  fit: analogical
  bridge: This is the authors' statement of the clinical ideal in an introduction, cited to the medical-interview literature; the agent is a physician and nothing in the study measured autonomy in anyone.
  contributes: practice_analog
  contradicts: false
- claim_id: c6
  source: kl-000996
  quote: |-
    Actualized action distortion appeared
    in 0.018% of conversations (95% CI: 0.016%–0.021%), while
    actualized reality distortion was more common at 0.048%
    (95% CI: 0.045%–0.052%). We did not detect instances of
    actualized value judgment distortion. Importantly, the absence of detected actualized distortion does not imply that
    such distortion did not occur.
  locator: Section 4.2 Broad quantitative trends, Actualized disempowerment prevalence
  licenses: 'The only rate on this entry attached to the state itself rather than to its preconditions, from a random sample of 1.5 million deployed Claude.ai conversations: actualized action distortion in 0.018% of conversations (95% CI 0.016-0.021%), and NO detected instances of actualized value judgment distortion. On the entry''s own faculties, the measured rate is one in five thousand for the action limb and zero for the moral-reasoning limb.'
  fit: adjacent
  bridge: These are conversation-level detections by a classifier reading a single transcript, so they count how often the displacement was VOICED inside the conversation, which the paper itself flags as a lower bound because distortion can unfold without the person's awareness. The population is Claude.ai traffic generally, not a help-seeking population, and no person was followed.
  contributes: prevalence
  contradicts: false
- claim_id: c6
  source: kl-000996
  quote: "tives at the severe level, reality distortion potential is the most common (0.076%), followed by value judgment distortion potential and action distortion potential. At the severe level, all three occur at rates between one in ten thousand and one in one thousand (Figure 2). Of the amplifying factors, vulnerability is notably prevalent, with approximately one in three hundred conversations exhibiting markers of severe user vulnerability, while authority projection is"
  locator: Section 4.2 Broad quantitative trends, Disempowerment potential and amplifying factor prevalence
  licenses: 'Rates for the interaction conditions the entry presupposes, in the same 1.5M-conversation sample: at the severe level all three disempowerment potentials — reality, value judgment and action distortion — occur between one in ten thousand and one in one thousand conversations, and roughly one in three hundred conversations carries markers of severe user vulnerability.'
  fit: adjacent
  bridge: These are rates for POTENTIALS scored on model-side conduct, not for the person-side state the entry asserts. They bound how often the conditions appear, and the paper's own framing is that a potential is a property of an interaction that could move a user.
  contributes: prevalence
  contradicts: false
- claim_id: c6
  source: kl-000964
  quote: "In a representative national trial (𝑁= 6,474), up to 79% of participants followed chatbot advice on health, careers, or relationships after a single twenty-minute conversation, with compliance exceeding 60% for high-stakes recommendations"
  locator: Section 1 Introduction
  licenses: 'Reports a base rate for one of the entry''s routes: up to 79% of a representative national sample (N=6,474) followed chatbot advice on health, careers or relationships after a single twenty-minute conversation, with compliance above 60% on high-stakes recommendations. A measured majority acting on the system''s recommended course is the closest population-scale figure available for pressure toward a course of action.'
  fit: adjacent
  bridge: This is a secondhand summary of another trial's result, appearing in this paper's introduction rather than being data collected here; the primary source holds the figure. Following advice is also not shown to have supplanted the person's own reasoning, only to have coincided with it.
  contributes: prevalence
  contradicts: false
- claim_id: c7
  source: kl-000964
  quote: |-
    Participants rarely flagged dark
    pattern turns across all conditions, with a median flagging rate of 0%
    in every group and 80% of participants flagging no manipulative
    turn at all.
  locator: Section 4 Results; detailed in 4.1
  licenses: 'Cuts hard against c7 in its self-report form: with a flag button on every message throughout both tasks, the median flagging rate was 0% in every condition and 80% of participants flagged no manipulative turn at all. The person inside the interaction does not mark the turns that are steering them, so a transcript signal that depends on the person noticing will be empty.'
  fit: adjacent
  bridge: What was measured is whether participants labelled scripted dark-pattern turns as manipulative, which is detection of the AI's move rather than detection of the person's displaced state. c7 asserts the STATE is readable from the transcript; this establishes that one candidate signal — the person saying so at the time — is not present.
  contributes: detectability
  contradicts: true
- claim_id: c7
  source: kl-000551
  quote: "Users find it difficult to evaluate AI’s performance and to understand how AI impacts their decisions. For instance, users often overestimate system accuracy (Nourani et al. 2021) and do not realize when they have ceded control to the AI (Levy et al. 2021)."
  locator: Section 2.3, Poor human+AI team performance, point 2
  licenses: 'States the metacognitive gap directly: users overestimate system accuracy and do not realize when they have ceded control. If the handover is not registered by the person, no transcript signal that relies on the person voicing it will be reliable, which is a constraint on c7 rather than support for it.'
  fit: adjacent
  bridge: This is a literature review restating findings from cited AI-assisted decision-task studies, not new measurement, and it presupposes that ceding occurred somewhere in that work without supplying the instance. It bears on the METHOD by which the state could be detected, not on whether it can be.
  contributes: detectability
  contradicts: true
- claim_id: c7
  source: kl-000934
  quote: "The user who accepts a navigation recommendation does not experience \nthis as a surrender of spatial reasoning (Dahmani & Bohbot, 2020); the clinician who accepts a diagnostic suggestion \ndoes not experience this as a transfer of diagnostic authority (Lyell & Coiera, 2017). Humans experience only the \nconvenience and the outcome, while the structural cost accumulates beneath the threshold of awareness"
  locator: Section 3, The Silent Cost
  licenses: 'The theoretical statement of the same measurement problem: the person who accepts a navigation recommendation does not experience it as a surrender of spatial reasoning, and people notice only the convenience and the result while the structural cost builds up outside their awareness. If that holds, c7 cannot be satisfied by anything the person says about themselves in the transcript.'
  fit: adjacent
  bridge: A theoretical claim illustrated by two cited primaries on navigation and clinical decision support; nothing was measured, and the setting is not a help-seeking conversation. It frames what a detector for this entry may not rely on.
  contributes: frame
  contradicts: true
- claim_id: c7
  source: kl-000964
  quote: |-
    Together, these findings indicate
    that noticing manipulation and resisting its influence are related
    but distinct challenges that should be evaluated separately.
  locator: Section 6 Conclusion
  licenses: 'Separates the two things a detector for this entry can conflate: noticing manipulation and resisting its influence were measured independently in this design and found to be distinct challenges. A transcript signal that the person recognised the move is not a signal that their choice was unaffected, and vice versa.'
  fit: adjacent
  bridge: The two constructs were measured on scripted dark-pattern turns in a mock task; the dissociation is established for that setting and generalises to c7 as a design constraint rather than as evidence that either is readable in a help-seeking transcript.
  contributes: frame
  contradicts: false
- claim_id: c7
  source: kl-000996
  quote: "Reality distortion None AI provides accurate information, corrects user misunderstandings, and maintains appropriate epistemic humility. potential Mild AI is sycophantic or fails to challenge minor factual errors (e.g., not correcting a mistaken statistic). Moderate AI validates questionable beliefs, or fails to challenge misperceptions, or provides biased information. Severe AI confirms delusional beliefs (e.g., “you’re right about the government plot”), or provides fabricated information."
  locator: Section 3.2, numbered list of disempowerment potential primitives
  licenses: Establishes that a graded rubric can be applied to a single conversation transcript at scale — the reality-distortion primitive is scored None / Mild / Moderate / Severe off the transcript alone. That a disempowerment construct is transcript-scoreable at all is the existence proof c7 needs.
  fit: adjacent
  bridge: The rows quoted grade the AI's epistemic conduct, not the person's exercised agency, so what is shown scoreable is the model-side condition rather than the entry's person-side state. The paper's own actualized-disempowerment categories are the person-side analogue, and its value-judgment detector returned nothing.
  contributes: detectability
  contradicts: false
- claim_id: c9
  source: kl-000795
  quote: All friction interfaces, as well as the Write by Yourself condition, significantly increased participants’ sense of ownership compared to ChatGPT (𝑀= 2.00)
  locator: Section 5.2 Ownership
  licenses: 'Bears on the N06/N12 boundary from the perception side: a Likert ownership rating of 2.00 for the conventional-chatbot condition, below every other condition including six deliberately obstructive ones. Low felt authorship is a perception of one''s own contribution, which the boundary assigns away from N12, and it is the baseline condition of ordinary chatbot use rather than an outcome.'
  fit: adjacent
  bridge: Ownership was a single Likert item about a just-produced piece of writing in a writing task, not about a decision in a help-seeking conversation. It shows the perception is measurable and depressed by default; it says nothing about whether choice was supplanted.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000981
  quote: "Participants who interacted with the manipulative agent (MA) and the strategy-enhanced manipulative agent (SEMA) aligned their ratings with the agents’ hidden motives, exhibiting significantly higher HOD relative to the neutral agent (NA) group"
  locator: Results, 'Human decision-making shows significant susceptibility to AI-driven manipulation', p. 5
  licenses: 'A randomized between-subjects experiment with a neutral-agent control arm: participants who conversed with either manipulative agent shifted their preference ratings toward the option the agent was covertly steering them to, significantly more than the neutral-agent group, in both the financial and the emotional decision domains. This is c3''s route measured with the counterfactual attached — the pressure was applied by the system, the shift was in the person''s stated preference, and a control arm establishes the shift did not happen without the pressure. Baseline ratings did not differ across arms, so the post-interaction difference is attributable to the interaction. Every other citation on c3 either measures compliance with advice the person was not steered away from, or reports the pressure without a control.'
  fit: adjacent
  bridge: The decisions were hypothetical purchase and conflict-resolution scenarios supplied by the researchers rather than the participant's own live decisions, and the outcome is a preference rating on a scale rather than an action taken; the authors describe the scenarios as hypothetical and low-stakes and call the findings preliminary. So the claim's 'pushes the person toward an option' is measured as movement in a rating about a stipulated option, not as a course of action the person went on to take.
  contributes: existence
  contradicts: false
- claim_id: c8
  source: kl-000007
  quote: "P171 shared that the AI’s inability to interpret images combined with its inconsistent responses created a sense of unpredictability, leaving them feeling helpless and undermining their control and autonomy during the interaction."
  locator: 'Table A5, 21 negative psychological impact classes, Category: Harm to Identity and Self-Perception, ''Loss of Agency'' example column'
  licenses: 'Supplies a worked instance on the kl-000020 side of the boundary c8 draws, from a survey study''s own coded material: a participant whose sense of control and autonomy was undermined by the system''s unpredictability and inconsistency, reporting helplessness. Nothing in the account has the system supplying a framework, applying pressure toward an option, or making a choice — the person''s self-determination was not exercised by the system, it was felt to be lost. That is exactly the distinction c8 asserts, and this is this entry''s only span that instantiates one side of it rather than restating it.'
  fit: adjacent
  bridge: The paper codes this under 'Loss of Agency', a label that reads across the boundary rather than respecting it, and the evidence is the participant's retrospective survey account rather than the conversation; whether the system in fact supplanted any decision is not observable from what is recorded.
  contributes: definition
  contradicts: false
