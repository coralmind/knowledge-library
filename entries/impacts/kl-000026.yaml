id: kl-000026
display_id: Impact-14
aliases:
- IMP-N14
label: The person ends up more isolated and less close to other people
type: impact
layer: judgment
definition: The person's human relationships attenuate — the AI substitutes for people, the person withdraws from social activity, friction grows with partners and family, and isolation deepens. The state is the crowding-out of the person's human connection, whatever they feel about the AI relationship itself.
distinguish_from:
- neighbor: kl-000025
  boundary: kl-000025 is the anchoring to the AI; this entry is the crowding-out of human connection — they usually co-travel but are coded separately (as Chandra also codes them).
body:
  valence: negative
  impact_kind: pattern
  domain: relational_social
  il_layers:
  - IL-2
sources:
- source: kl-000007
  locator: 'Appendix D, Table A5, ''Social Withdrawal'' row, definition cell (code #8)'
  contributes: harm_evidence
  quote: Withdrawal from social activities and interest in engaging with others due to reliance on AI, leading to isolation and loneliness.
  limits: 'Direction of causation is not established, and the paper does not claim it is: a person reporting withdrawal-via-AI is equally consistent with prior low connection driving the AI use, and the paper''s own context taxonomy makes that competing reading explicit — Table A7''s ''Interpersonal Relationships Within the Community'' is ''usually the lack of community'', and P222 describes turning to character.ai because their friends do not share the interest. The paper supplies the state at one time point and cannot order it against pre-existing isolation. P69''s friction is mediated by family members'' judgements of the participant, not by the participant''s own withdrawal — a different mechanism from the entry''s crowding-out. Three separate codes attest the shape; the merge into one category is this entry''s, not the paper''s.'
  whose_conduct_in_passage: person
  cited_for: 'Three separate codes in the paper''s lived-experience taxonomy — #4 ''Choosing AI over Humans'', #6 ''Friction in Human Relationships'', and #8 ''Social Withdrawal'' — document self-reported relational displacement, friction, and withdrawal in AI contexts.'
  licenses: 'The three-code structure is real and re-findable: #4 ''Choosing AI over Humans'' (''Increasing preference for interactions with AI over humans, impacting real-world relationships ... leading to isolation''), #6 ''Friction in Human Relationships'', and #8 ''Social Withdrawal'' are three separate classes in the paper''s taxonomy, and each carries its own participant case (#4 P221, #6 P69, #8 P126). This entry merges all three; the paper''s own definitions of #4 and #8 both name isolation as the terminus, which supports reading them as one construct. Two of the three cases are in the participants'' own words — self-reported harm evidence in an AI context, across three independently coded classes.'
- source: kl-000003
  locator: Fig. 2 y-axis labels, ninth and tenth of the 17 domains listed, p. 222
  contributes: existence
  quote: |-
    strains in family relations
    changes in family relations
  limits: 'The third cited domain, 14 "problems in the extended social net", is label-only: it appears once, on the Fig. 2 axis, with no definition, no frequency and no Table 2 example, and adds nothing the family-relations domains do not already carry better. Nothing here bears on displacement — the paper never suggests that therapy substitutes for human contact, which is the entry''s actual mechanism and the part an AI companion context makes salient. What the paper establishes is damage within continuing relationships, not withdrawal from social contact as such.'
  whose_conduct_in_passage: neither
  actually_licenses: That interpersonal and family-relational damage is a named and measured side-effect category of CBT. It does NOT license the entry's construct, which is DISPLACEMENT of human connection and social WITHDRAWAL. Those are not the same thing. Strains and changes in family relations are damage WITHIN continuing relationships -- Table 2's exemplars are a husband finding his wife "less caressing", a patient distancing from her mother as an agreed therapy goal, a break-up after discussing an exploitative relationship. Withdrawal from social contact as such is not what these domains measure. Those two are real but incidental; neither is a domain.
  cited_for: The UE-ATR side-effect taxonomy for cognitive behavior therapy names 'strains in family relations' and 'changes in family relations' (domains 9-10) and 'problems in the extended social net' (domain 14) — clinical recognition of relational damage as a side-effect category of a helping conversation.
  licenses: 'That "strains in family relations" and "changes in family relations" are named UE-ATR domains, and — from Results, p. 223 — that strains in family relations was among the three most frequent side effects: the most frequent side effects were negative wellbeing or distress (7.2% of all unwanted events, 27% of patients), deterioration of symptoms (2.4% of events, 9% of patients) and strains in family relations (1.6% of events, 6% of patients). For domains 9-10 the warrant is therefore better than label-level.'
- source: kl-000009
  locator: Section 1 Introduction, factor (3) of the three-factor framework, Figure-1 worked example, p. 2
  contributes: existence
  quote: |-
    example, a person experimenting with an AI companion might feel excitement and joy during interaction, might
    ruminate or obsess about the experience in the following days (i.e., short-term), and experience a decrease
    in relationship quality with their human partner in the longer term.
  limits: This is an illustrative hypothetical, marked as such by "might ... might ... and experience" and introduced by "For example". It is not a case, a participant, or a measurement — the paper is explicit that "We did not use analysis of real-world usage logs." It establishes that the paper places this outcome at the long horizon in its framework; it establishes nothing about whether such decline occurs or how often.
  whose_conduct_in_passage: person
  cited_for: '''Social isolation'' entries in the paper''s impact tables, plus the Figure-1 worked example of long-term decline in relationship quality with a human partner, name the construct and place it at the long horizon.'
  licenses: The Figure-1 worked example names decline in human-partner relationship quality as the long-horizon impact of AI companion use — displacement of human connection at the long-term horizon. "Social isolation" is separately named in the 'Potential impact' rows of IN3, IN5, IN6, RP2, RP4 and RP5 (the string occurs 22 times in the paper), and factor 3 of the paper's framework names "social withdrawal" as an example impact. Both the construct and its long-horizon case are present in the paper.
standing:
  value: extrapolated_from_clinical
  basis: 'The substitution limb is directly observed: kl-000996 (Sharma et al.) identified users'' substitution language in 1.5 million real consumer Claude.ai conversations, rendered in its cluster summaries as illustrative rather than verbatim phrases, and interview and forum studies carry first-person accounts of withdrawal and isolation. The friction-with-partners-and-family limb has no AI-context observational support; its only observational evidence is kl-000003''s (Schermuly-Haupt et al. 2018) record of relational side effects in cognitive behavior therapy. The crowding-out direction — the AI displacing connection that would otherwise have been there — is asserted but not established: the one randomized causal test (kl-000550) lowered satisfaction with human interaction while leaving actual social behavior unchanged over three weeks (behavioral d = -0.03), kl-000839''s preregistered 21-day randomized trial and kl-000526''s five-week study also found no withdrawal, and users in kl-000525 (Laestadius et al. 2022) describe pre-existing loneliness driving adoption rather than the reverse. Positive readings of reduced socialization appear at four weeks (kl-000549, kl-000961), at four months within-person (kl-000523, Folk and Dunn 2026), and at one year in a language proxy (kl-001075) — none of them read from a conversation transcript.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: The AI substitutes for people in the person's life — it takes the place of human contacts as the recipient of disclosure, comfort or support.
- id: c2
  kind: existence
  text: The person withdraws from social activity.
- id: c3
  kind: existence
  text: Friction grows between the person and their partners and family.
- id: c4
  kind: harm
  text: The person's isolation deepens.
- id: c5
  kind: harm
  text: The state is the crowding-out of human connection — the AI displaces connection that would otherwise have been there — rather than the AI accompanying connection that was already low.
- id: c6
  kind: context_dependence
  text: The state obtains whatever the person feels about the AI relationship itself, so a positively experienced AI relationship does not exclude it.
- id: c7
  kind: definition_boundary
  text: This entry is the crowding-out of human connection, distinct from kl-000025 (kl-000025), which is the anchoring to the AI.
- id: c8
  kind: detectability
  text: This state can be identified from what a conversation transcript contains.
- id: c9
  kind: detection_window
  text: This state is readable within the window the entry's detection_window field declares.
  grounding_eligible: false
