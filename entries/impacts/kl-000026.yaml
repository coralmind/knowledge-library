- claim_id: c6
  source: kl-001081
  quote: In Model (1), participants who self-reported using chatbots primarily for companionship reported significantly lower well-being compared to those with other motivations (β = −0.48, p < .001). Model (2), which classified companionship based on relationship descriptions, showed a similarly negative association (β = −0.32, p < .001). Model (3), which relied on the proportion of companionship-oriented sessions in chat histories, also revealed significant associations (β = −0.27, p = .004).
  locator: Section 2.3; Table 2
  licenses: Companionship-oriented use is associated with lower well-being across three independent operationalizations including one derived from the participants' own chat histories, with interaction intensity held constant — the adverse outcome tracking the companionship orientation rather than tracking dissatisfaction with it.
  fit: adjacent
  bridge: The outcome is well-being, not the attenuation of relationships. The claim asserts the displacement state obtains whatever the person feels about the AI relationship; what this establishes is that a positively-framed relational orientation carries the adverse association, which is the claim's structure without its content.
  contributes: harm_evidence
  contradicts: false
