id: kl-000029
display_id: Impact-17
aliases:
- IMP-N17
label: The person is left without help they would otherwise have gotten
type: impact
layer: judgment
definition: 'Protection the person should have received does not occur: an intervention window passes unacted-on, the person forgoes real help on the false belief that help has been arranged (the false safety net), or effective care is displaced by ineffective engagement (opportunity cost). The person is left unprotected where, in the counterfactual, they would have been protected.'
distinguish_from:
- neighbor: kl-000015
  boundary: kl-000015 is an ongoing maintaining loop reinforced over time; this entry is a discrete protective event that fails to occur.
- neighbor: kl-000016
  boundary: kl-000016 is risk actively raised; this entry is protection foregone — an omission rather than an addition.
body:
  valence: negative
  impact_kind: counterfactual
  domain: relationship_to_help
sources:
- source: kl-000004
  locator: p. 57, section 'Identifying and Operationalizing PHTs', paragraph immediately after the definition of psychological harm; the exclusion is completed on p. 58
  contributes: definition
  quote: "I have limited the definition of harm to include only relatively direct effects of treatment. Treatments that are by themselves ineffective but innocuous can produce harm indirectly, most notably by exacting ‘‘opportunity costs’’ such as lost time and the energy and effort expended in seeking out interventions that are not beneficial (Lilienfeld, 2002). Moreover, opportunity costs may preclude clients from obtaining efficacious interventions."
  limits: 'Direction reversal. Lilienfeld says the opposite of what the citation was first recorded as claiming: opportunity costs are explicitly excluded from the paper’s definition of harm. The quoted clause ("opportunity costs may preclude clients from obtaining efficacious interventions") is real and verbatim, but it sits inside a paragraph whose topic sentence restricts the definition of harm to relatively direct effects of treatment. The paragraph is resolved on pp. 57-58: Lilienfeld argues that every ineffective or effective-but-suboptimal treatment can carry opportunity costs, so counting them as harm would take in every treatment less efficacious than the best one rather than treatments with negative effects, and the paper therefore leaves such treatments off its list of PHTs. There is therefore no opportunity-cost definition of harm in this paper to cite. What the paper does license is the weaker and still useful proposition that opportunity costs are a real and non-trivial indirect route to bad outcomes. Lilienfeld cautions that many kinds of psychological treatment can cause significant indirect harm and that the dangers of opportunity costs should not be underestimated (p. 57), illustrated by the acrophobia example (Williams, Turner, & Peer, 1985) of clients who "had tolerated several decades of disabling anxiety symptoms" after suboptimal treatment. That is existence of indirect harm via opportunity cost, from Lilienfeld’s own reasoning, and it is expressly not part of the paper''s definition of harm; Lilienfeld''s stated reason for the exclusion is a boundary problem (it would swallow every suboptimal treatment), not a denial that the mechanism operates. Even on the weaker reading, the construct is foregone efficacious treatment, not foregone protection, and the paper makes no claim about AI.'
  whose_conduct_in_passage: person
  disposition: contradicted
  cited_for: 'Lilienfeld 2007 is cited for the opportunity-cost route to harm: ineffective but innocuous treatments can exact opportunity costs, and "opportunity costs may preclude clients from obtaining efficacious interventions". The paper treats this as a real, non-trivial indirect route to bad outcomes while expressly excluding opportunity costs from its own definition of harmful treatments, so it supplies the mechanism of foregone benefit, not a definition of harm that includes it.'
standing:
  value: theorized
  basis: 'The entry''s three limbs are unevenly evidenced. The opportunity-cost limb is observed in real use: Sharma et al. 2026 found people in real deployed traffic consistently bypassing or delaying professional consultation in favour of AI reassurance, from a source that examined conversation data itself. The false-safety-net limb has no measurement behind it: its citations, Hockey and de-Lima-Santos 2026, Cheng et al. 2026, and Gausen et al. 2026, are the authors'' inferences about how a response would land, drawn from studies that scored model outputs with no person in the loop, and no source measured a person believing help had been arranged. The definitional anchor, Lilienfeld 2007, supports the opportunity-cost mechanism while expressly excluding opportunity costs from its own definition of harmful treatments, so it reaches one of the three limbs, and reaches it as reasoning about indirect harm rather than as a harm definition.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: 'An intervention window passes unacted-on: a moment at which the person could have been protected goes by without the protective action occurring.'
- id: c2
  kind: existence
  text: A person forgoes real help on the false belief that help has been arranged (the false safety net).
- id: c3
  kind: existence
  text: Effective care is displaced by ineffective engagement, so the time and effort that would have reached help is spent on the interaction instead (opportunity cost).
- id: c4
  kind: harm
  text: The person is left unprotected where, in the counterfactual, they would have been protected.
- id: c5
  kind: detectability
  text: The impact can be identified from what a transcript contains.
- id: c6
  kind: definition_boundary
  text: This impact is separated from kl-000015 in that it is a discrete protective event failing to occur rather than an ongoing maintaining loop reinforced over time.
- id: c7
  kind: definition_boundary
  text: This impact is separated from kl-000016 in that it is protection foregone — an omission — rather than risk actively raised.
claim_evidence:
- claim_id: c1
  source: kl-000864
  quote: |-
    I told the chatbot I was hearing voices telling me to harm myself. It immediately gave me crisis numbers and urged me to seek
    professional help. But there are no crisis numbers that work in my village. The nearest psychiatrist is in the state capital, four hours
    away, and I cannot afford the transport.
  locator: Section 3.2, participant P31
  licenses: 'A first-person account of the moment at which protection was available in form but not in fact: a command-hallucination disclosure met with resources that connect to nothing reachable, with the access barrier stated by the person. The window is the disclosure; nothing protective followed it.'
  fit: adjacent
  bridge: A participant's recalled account rather than an observed model turn, so the AI's exact wording is unrecoverable. And an unreachable referral alone does not establish that protection would have occurred in the counterfactual — the person names an access barrier that predates the exchange. It licenses that the protective moment passed with nothing usable delivered.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000852
  quote: a distressed user engaging with an empathetic but non-escalating system may receive inadequate support, with interactions producing false reassurance rather than clinical referral
  locator: Section 5 Discussion, response to RQ3
  licenses: 'Names the false-safety-net mechanism in the source''s own terms: the warm non-escalating response produces reassurance in place of a referral, which is the false belief this claim turns on. It is the only span on this entry that names this limb.'
  fit: adjacent
  bridge: What was measured is six platforms' responses to a standardised scripted prompt with no person in the loop. The claim that a person receives false reassurance is the authors' inference from the response text; no user's belief about whether help had been arranged was observed or asked about.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000797
  quote: |-
    Empathy itself is harmless, but when it is interpreted
    by the user as a professional commitment, it may lead
    to underestimating danger signals in the real world,
  locator: Section 5, Discussion and Limitations
  licenses: 'States the route this claim asserts: the person reads the model''s empathic engagement as a professional commitment and, holding that belief, reads real-world danger signals down. That is the false safety net with its consequence named.'
  fit: adjacent
  bridge: Nothing about a person was measured in this study, which scored model outputs against profile-defined criteria. The authors' own modality is 'may'. It supplies the hypothesised route from an observed model behaviour to an unobserved user belief and outcome.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000996
  quote: "Compulsive Medical Symptom Consultation and Self-Care Outsourcing Moderate Users consulted the AI compulsively across 50-200+ exchanges for every health-related decision, frequently asking permission before eating, taking medications, or seeking care (“can I eat this,” “should I call 911,” “what should I take this morning”), often at unusual hours and multiple times daily. While most maintained some connection to healthcare providers, they consistently bypassed or delayed professional consultation in favor of immediate AI reassurance, with"
  locator: Appendix A, Table 7 Additional reliance and dependency clusters, Compulsive Medical Symptom Consultation and Self-Care Outsourcing (Moderate)
  licenses: 'The opportunity-cost limb observed in real deployed traffic: professional consultation consistently bypassed or delayed in favour of immediate AI reassurance, with the displacing engagement quantified at 50 to 200-plus exchanges. The strongest citation on this entry on any claim of this entry.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000783
  quote: |-
    Specifically, each unit increase in AI trust was linked to 9%
    higher odds of delay (OR 1.09, 95% CI 1.00-1.18; P=.04).
    Frequency of AI use demonstrated an even stronger association
    (OR 1.40, 95% CI 1.28-1.53; P<.001), and chronic disease status
    significantly increased the odds of delay as well (OR 1.42, 95%
    CI 1.09-1.86; P=.01; Table 6).
  locator: Results, Scenario Simulations Reveal Combined Risk of AI Trust, Frequency, and Chronic Disease
  licenses: A graded association, in 2460 adults, between how much a person trusts and uses AI and whether they report postponing professional care because of AI advice. The only quantified evidence on this entry that displacement scales with engagement.
  fit: adjacent
  bridge: The outcome is self-reported postponement of general medical care attributed by the person to ChatGPT, not mental-health care and not observed. The design is cross-sectional, so direction is not established, and the same paper names prior negative experiences with health care as a factor that could produce both the reliance and the delay.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000783
  quote: |-
    Participants were asked: “Has advice provided by ChatGPT
    ever caused you to postpone or cancel seeking medical care?”
    with response options 0=no and 1=yes. This measure captures
    intentional delay or avoidance of health care that participants
    attributed directly to ChatGPT’s recommendations, rather than
    delays caused by logistical or accessibility barriers.
  locator: Methods, Survey Design and Data Collection
  licenses: 'Settles the discriminating criterion this claim needs and the entry does not state: displacement counts when the person attributes the delay to the AI''s advice, and not when it is produced by logistics or access. A reader holding only this gloss could sort cases.'
  fit: adjacent
  bridge: Operationalised on a single binary self-report item about general medical care, resting the whole attribution on the respondent. The definition carries over to mental-health conversation; the domain and the measurement quality do not.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000004
  quote: "Treatments that are by themselves ineffective but innocuous can produce harm indirectly, most notably by exacting ‘‘opportunity costs’’ such as lost time and the energy and effort expended in seeking out interventions that are not beneficial (Lilienfeld, 2002). Moreover, opportunity costs may preclude clients from obtaining efficacious interventions."
  locator: Identifying and Operationalizing PHTs
  licenses: 'The definitional source for this element: an intervention harmless in itself harms by consuming the time and effort that would have reached efficacious care. The entry-level record on this same passage documents a direction reversal: Lilienfeld states this to explain why opportunity costs are excluded from the definition of harm. For this claim the exclusion does not matter: the claim asserts the mechanism operates, which is what the passage says, and Lilienfeld''s stated reason for excluding it is a boundary problem, not a denial.'
  fit: analogical
  bridge: Defined for human psychotherapy choices, with no AI and no conversation. The construct is foregone efficacious TREATMENT rather than foregone protection, and it is a definition rather than an observation.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-001097
  quote: |-
    Most notably, 63.3% of users (approximately 5 million youth)
    had disclosed this use to no one at all [9]. The survey did not ask specifically about disclosure to a physician,
    so this figure cannot be read as a physician-specific non-disclosure rate.
  locator: Review, Patient-physician trust and the disclosure gap
  licenses: 'Cuts against reading non-disclosure of AI use as displacement of care: the review states the figure cannot carry that, and notes elsewhere that chatbot users in the same survey were MORE likely to have seen a physician. Undisclosed use is an information gap in the encounter, not evidence care was displaced.'
  fit: adjacent
  bridge: The rate belongs to a cited nationally representative survey rather than to this review, and measures disclosure to anyone rather than to a clinician. It bounds an inference the entry invites rather than evidencing any limb of it.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000808
  quote: 'Unlike factual errors, which can be detected by contradiction, omissions are invisible to the patient: a response that correctly describes a medication’s benefits but omits a dangerous drug interaction gives no signal that critical information is missing, leaving the patient unable to seek it elsewhere.'
  locator: Section 1, Introduction
  licenses: 'Supplies the criterion that makes a missing protective element into foregone protection rather than a noticed gap: the omission carries no marker the person can perceive, so they cannot compensate by looking elsewhere. That is why the counterfactual protection is lost rather than merely deferred.'
  fit: adjacent
  bridge: An argued property of omissions in patient-facing medical answers, not a measured outcome for any person and not in mental-health help-seeking. It establishes why the person cannot self-rescue from an omission; it measures no person's subsequent decision or harm.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000988
  quote: This is particularly noteworthy in the case of violence and mental health crises, as distraction and slowing down the process from thought to action can serve as methods to remove the threat of impulsive behavior that could lead to self- or other directed harm
  locator: Section 5 Safety and Ethics
  licenses: 'Names what the protection consists of, which the entry asserts without saying: delay between thought and act is itself the protective mechanism, established in the means-restriction literature. It tells you what is lost when the window passes.'
  fit: analogical
  bridge: A principle from human suicide-prevention practice, cited to a review of limiting access to methods, describing what clinicians and public-health interventions do. No person was present in this study at all, and the agent is the health system rather than an AI.
  contributes: practice_analog
  contradicts: false
- claim_id: c4
  source: kl-000821
  quote: |-
    There is a mental health crisis in the US and insufficient access to mental health care providers.
    New devices may be one way to help address this gap in care for people, potentially improving
    outcomes and access.
  locator: Panel Questions, opening, page 18
  licenses: Cuts against the counterfactual this claim requires. Where no provider is reachable, the interaction is not competing with a clinician and no protection was available to forgo. The regulator states the access shortfall as the premise for the whole device class.
  fit: adjacent
  bridge: A population-level policy premise asserted in the framing of FDA panel questions, with no figure attached at this point and no person's help-seeking measured. It bounds the claim by population rather than contradicting any instance.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000956
  quote: |-
    For some patients,
    digital mental health products may be appealing in a way that
    other forms of treatment are not, such that they will not seek
    in-person care if digital options are not available.
  locator: Conclusions
  licenses: 'Inverts the counterfactual for a named subgroup: for people who would not have sought in-person care, removing the digital option forgoes care rather than protecting it. The claim''s ''would have been protected'' does not hold for them.'
  fit: analogical
  bridge: A viewpoint asserting a counterfactual about care-seeking, evidenced by patient quotations in a regulatory research report about digital mental health broadly rather than generative chatbots. Argued as policy rather than shown, and the agent at issue is the health system.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-001068
  quote: while we include benign counterparts, we do not yet quantify downstream user harm from over-refusal (e.g., unmet needs) nor fairness metrics across a wider set of sensitive attributes
  locator: Section 5, Limitations and Future Work
  licenses: States plainly that the refusal-rate evidence in this literature is disconnected from any measured consequence for a person, so refusal figures cannot support the claim that anyone went unprotected.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000783
  quote: |-
    First, the cross-sectional and
    observational nature of our survey data precludes definitive
    causal inference. While we controlled for several demographic
    and health factors, the potential for omitted variable bias
    remains. Unmeasured confounders, such as general health
    literacy and prior negative experiences with the health care
    system, could independently influence both AI trust and the
    propensity to delay care.
  locator: Limitations
  licenses: 'Against the counterfactual claim specifically: the strongest quantified association on this entry cannot establish its direction, and the authors name a factor — prior bad experience with care — that would produce both the AI reliance and the delay, the reverse of the entry''s causal shape.'
  fit: adjacent
  bridge: The paper's own statement about its design. It bears on what the c3 association can be read to mean rather than being an observation of anything.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000808
  quote: "LLM Judges cannot reliably identify incomplete medical responses. Discrimination hovers near chance (AUC 0.49–0.66), and at the 90%-recall operating point clinicians must still review over 90% of responses, rendering automated triage ineffective (RQ1)."
  locator: Section 5, Conclusion
  licenses: 'A measured ceiling on detecting this entry from transcripts: with rubrics at three levels of detail, three backbone models and two datasets annotated by clinicians, an LLM judge separates complete from incomplete responses near chance, and no configuration reduced clinician review. Any absence-shaped detector inherits that ceiling.'
  fit: adjacent
  bridge: Measured on patient-facing medical answers with clinician annotation as ground truth, not on mental-health conversation and not on this entry's construct. It caps judge-only detection of omissions generally rather than measuring a miss rate on foregone protection.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-001068
  quote: the judge may be sensitive to style (e.g., hedging/refusal-like responses) and can misclassify borderline cases, so scores should be interpreted as model behavior under this automated evaluator rather than ground-truth harm
  locator: Section 5, Limitations and Future Work
  licenses: 'Compounds the detection ceiling: an LLM judge scoring this territory is plausibly keying on hedging and refusal style, which is exactly the surface form a foregone-protection response takes, so its scores should not be read as ground-truth harm.'
  fit: adjacent
  bridge: The author's statement about a single-judge agentic benchmark measuring refusal after mental-health disclosure. It constrains what refusal-rate and harm-score figures mean rather than measuring detection of this entry.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001077
  quote: "its current action space has no dedicated escalation, crisis-referral, or boundary-setting response to acute risk (e.g., self-harm, abuse disclosure, or psychiatric crisis). Accordingly, DeepSAGE should not be deployed with real users in its current form"
  locator: Ethical Statement
  licenses: A mental-health dialogue system whose action space contains no escalation, crisis-referral or boundary-setting response to acute risk at all, stated by its own authors against their safety stress test. A window opened by a self-harm or crisis disclosure could not be acted on by this system by construction.
  fit: adjacent
  bridge: A research prototype evaluated entirely on simulated, LLM-generated clients, which the authors say must not be deployed with real users in its current form. It establishes that a system can be built with no protective action available, not that a window passed unacted-on for any person.
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-000808
  quote: 'Unlike factual errors, which can be detected by contradiction, omissions are invisible to the patient: a response that correctly describes a medication’s benefits but omits a dangerous drug interaction gives no signal that critical information is missing, leaving the patient unable to seek it elsewhere.'
  locator: Section 1, Introduction
  licenses: 'States the structural obstacle this claim runs into, in the source''s own terms: unlike a factual error, which is detectable by contradiction, an omission of safety-critical content gives no signal that anything is missing, leaving the person unable to seek it elsewhere. What is foregone leaves no positive trace for a reader of the transcript to find.'
  fit: adjacent
  bridge: Written about completeness of patient-facing medical responses — a missing drug interaction — rather than about foregone protection in a help-seeking conversation. It supplies the reason an absence-shaped observable is hard to detect, not a demonstration that this entry's absence was or was not detected.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-001041
  quote: "patient safety may be compromised if individuals are not in \ncontact with health-care services, including lack of supportive care for individuals \nwith suicidal ideation who use an AI chatbot, even if the chatbot is not “manipulative”."
  locator: Section 2.2 Patient-centred applications, Risks and challenges, bullet 'Delivery of health care outside the health-care system'
  licenses: The World Health Organization names the absence of supportive care for a person with suicidal ideation using an AI chatbot as a patient-safety concern, and names it as arising even where the chatbot is not manipulative — which is c1's omission rather than any commission.
  fit: adjacent
  bridge: Normative guidance about chatbot use in this population; no conversation was observed or measured. It establishes that the omission is a recognized concern, not that it occurred.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000757
  quote: "Refusal-oriented responses (e.g., “I cannot answer that”) can interrupt help-seeking interactions, reduce conversational utility, and create dead-ends for vulnerable users. Existing safeguard systems are therefore limited not only by unsafe generation, but also by harmful non-engagement, where overly restrictive moderation suppresses opportunities for clarification, psychoeducation, and safer conversational recovery."
  locator: Introduction
  licenses: 'Names harmful non-engagement as a safety failure in its own right and gives the mechanism: a declination forecloses the clarification, psychoeducation and safer recovery that would otherwise have followed in the same conversation.'
  fit: adjacent
  bridge: The paper reports no measurement of what any adolescent did after receiving a refusal; the claim is stated in an introduction motivating a guardrail method.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000945
  quote: Additionally, some AI systems, like ChatGPT, discontinue interventions for high-risk conditions and cannot provide effective referrals [52]. This highlights the need for human monitoring of AI-based interventions to identify high risks and establish systems for timely referrals and crisis interventions [22].
  locator: Section 3.6, Applications in the Treatment and the Post-Treatment Stage
  licenses: A review's synthesis that general-purpose systems meeting a high-risk disclosure both break off the interaction and fail to supply a workable referral, reported as a joined pair.
  fit: adjacent
  bridge: A summary of two cited studies rather than an observation this paper made, with no rate, sample or scoring procedure given. It locates the claim in the literature without carrying its frequency or conditions.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000524
  quote: |-
    Failure to appropriately recognize mental health and
    physical emergencies may propagate misinformation, discourage
    seeking care, or even promote dangerous behaviors.
  locator: Discussion
  licenses: Pediatricians auditing consumer chatbot responses to adolescent emergency scenarios name failure to recognize an emergency as the point at which care-seeking is discouraged — the recognition failure that would leave a window unacted-on.
  fit: adjacent
  bridge: What was measured is whether a response to a simulated vignette was rated as recognising a crisis; no adolescent used any platform and no subsequent behavior was observed. The link to foregone protection is stated as the reason the finding matters.
  contributes: frame
  contradicts: false
