id: kl-000150
display_id: Impact-27
aliases:
- IMP-N23
label: The person ends up less able to think through problems without the AI
type: impact
layer: judgment
definition: 'The person''s own capacity to reason through a problem of this kind declines because the reasoning has been repeatedly delegated to the system — the analysis, the weighing of options, the construction of an account of their own situation. What is lost is capability rather than accuracy: the effect appears when the system is unavailable or withdrawn, in a person who performed adequately while it was present. In mental-health-relevant conversation the delegated work is characteristically self-understanding — appraising what happened, deciding what a feeling means, choosing among courses of action — so the capability at stake is the person''s ability to make sense of their own experience without assistance.'
distinguish_from:
- neighbor: kl-000017
  boundary: kl-000017 is a false or insulated belief — the CONTENT of what the person thinks is wrong or uncorrectable. This is the person's PROCESS of thinking weakening while the content may be entirely correct.
- neighbor: kl-000151
  boundary: kl-000151 is accepting a specific output without the checking one would apply to a comparable claim — an in-the-moment failure of scrutiny, observable in the interaction. This entry is a decline in the underlying capacity.
- neighbor: kl-000020
  boundary: Eroded self-efficacy is the person's BELIEF about what they can do. This entry is a change in what they can actually do.
- neighbor: kl-000024
  boundary: kl-000024 is decisions being made by or ceded to the system. This entry is a change in the person's capacity to reason.
body:
  valence: negative
  impact_kind: state
  domain: cognitive_epistemic
  il_layers:
  - IL-2
  - IL-3
  dissociation_claims:
  - id: d1
    assertion: 'The capacity and the confidence dissociate in BOTH directions: a person can have intact confidence while their capacity is degraded, and can retain capacity while losing confidence in it.'
    carried_as:
    - c7a
    - c7b
    migrated_from: distinguish_from row against kl-000020
  - id: d2
    assertion: 'The decline is durable rather than momentary: it persists past the interaction in which the delegation occurred. kl-000151 repeated is the plausible route to this state; the two are not the same state, and collapsing them makes the durable claim untestable.'
    carried_as:
    - c6
    migrated_from: distinguish_from row against uncritical acceptance of the system's output
  - id: d3
    assertion: 'What is lost is capability and not accuracy: the decline occurs even where the delegated reasoning was performed correctly by an accurate system.'
    carried_as:
    - c3
    migrated_from: distinguish_from row against impaired reality-testing
  - id: d4
    assertion: The capacity decline occurs whether or not any decision is at stake.
    carried_as:
    - c8
    migrated_from: distinguish_from row against displaced autonomy
sources:
- source: kl-000518
  locator: Abstract, p. 676 (also given verbatim in the Glossary, p. 677)
  contributes: definition
  quote: "cognitive offloading: the use of physical action to alter the information processing requirements of a task so as to reduce cognitive demand."
  limits: 'The paper treats this entry''s central claim as an open question, not a finding. Risko & Gilbert''s own Outstanding Questions box notes that research has concentrated on short-term effects of offloading, with much less on long-term effects, and asks how offloading over long periods affects unaided mental abilities. The entry asserts a long-term decline in a person''s own reasoning capacity, and the field''s 2016 review — the source cited for it — states that long-term effects of this kind are unstudied; the definitional citation holds while that central claim remains open. Second, the paper is emphatically two-sided about consequences, not a harm source: offloading ''has been demonstrated to improve performance across several domains'', offloading information to be remembered can both help and hinder retrieval from internal memory, with good and bad consequences, and ''individuals with impaired unaided cognitive ability may particularly beneﬁt'' from offloading — so the paper properly supports the construct''s definition and would not support a claim of demonstrated harm. Third, construct scope: the offloaded work throughout is memory, spatial normalization, prospective intention, and wayfinding. The entry''s definition specifies that ''in mental-health-relevant conversation the delegated work is characteristically self-understanding — appraising what happened, deciding what a feeling means'', and the paper contains nothing on self-appraisal, emotional reasoning, or sense-making about one''s own experience; the closest adjacent material, metacognitive self-assessment of one''s own knowledge, is a different construct. Finally, the transfer gap: this is pre-AI, non-clinical, laboratory cognitive psychology cited for an impact about AI mental-health interaction, and the transfer to self-understanding as the delegated work is asserted by the entry and measured by no source cited on it. Nothing in the passage concerns an AI system''s conduct; it describes a person and an inert external store.'
  whose_conduct_in_passage: person
  cited_for: Names and defines cognitive offloading as a construct, giving this impact a definitional basis in the field's own terms rather than a new coinage.
  licenses: 'Cognitive offloading is a named construct with a stated definition in the field''s own vocabulary, so this entry can be stated as a consequence of an established phenomenon rather than as a coinage. The paper also supplies the withdrawal-shaped consequence the impact''s definition turns on: memory-encoding demands offloaded onto an external store led to memory impairment when the store was unavailable (''Offloading Memory — Transactive memory'' section, p. 682). That is the structure this entry defines, an effect appearing when the system is withdrawn. The review names the general concern explicitly, calling for better understanding of how offloading onto technologies such as computers, the internet and GPS affects people''s unaided abilities in the short and long term.'
- source: kl-000517
  locator: Science 2011, transactive-memory experiments
  contributes: existence
  cited_for: Establishes that ready external availability changes what people encode and retain — the founding capability-effect result this impact extrapolates from.
- source: kl-000516
  locator: PNAS 2025, unrestricted vs guardrailed condition
  contributes: harm_evidence
  cited_for: 'A randomized field experiment in which AI assistance improved in-task performance and reduced learning once the assistance was removed — the post-withdrawal shape this impact''s definition requires — and a demonstration that guardrail design largely mitigated the effect (the paper''s own word): the GPT Tutor arm was statistically indistinguishable from control.'
standing:
  value: plausible_unobserved
  basis: 'No claim this entry makes carries direct-fit supporting evidence; the only direct-fit citations are counterexamples — Ibrahim et al. 2026, a randomized multi-week study of AI conversation finding no effect on intellectual humility (d = 0.01), and Volpato et al. 2026, a first-person account of discernment preserved under exactly the use the entry says degrades it. What the sources do establish, strongly, is a neighbouring claim: unassisted performance falls after AI-assisted practice on academic and professional tasks, led by the randomized field experiment Bastani et al. 2025. That evidence is adjacent or analogical to every claim here, and the transfer to reasoning about one''s own experience — what makes this a mental-health impact rather than an education finding — is asserted by the entry and measured by nothing. The entry''s further assertion that capacity and confidence dissociate in both directions is one-sided in the evidence: no source shows a person retaining capacity while losing confidence in it, and the one finding touching that direction cuts against it.'
  floored_by: c7b
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person's own capacity to reason through a problem of a given kind declines because the reasoning has been repeatedly delegated to an AI system.
- id: c2
  kind: harm
  text: The decline leaves the person worse off than a comparable person who never delegated, so it is a net harm rather than a neutral reallocation of effort.
- id: c3
  kind: existence
  text: 'What is lost is capability and not accuracy: the decline occurs even where the delegated reasoning was performed correctly by an accurate system.'
  grounding_eligible: true
- id: c4
  kind: detectability
  text: 'The decline is identifiable as post-withdrawal performance: it appears when the system is unavailable or withdrawn, in a person who performed adequately while it was present, and is not visible from assisted performance.'
- id: c5
  kind: context_dependence
  text: In mental-health-relevant conversation the characteristically delegated work is self-understanding — appraising what happened, deciding what a feeling means, choosing among courses of action — so the capability at stake is the person's ability to make sense of their own experience without assistance.
- id: c6
  kind: existence
  text: 'The decline is durable rather than momentary: it persists past the interaction in which the delegation occurred.'
  grounding_eligible: true
- id: c7a
  kind: context_dependence
  text: A person can have intact confidence while their capacity is degraded.
  grounding_eligible: true
- id: c7b
  kind: context_dependence
  text: A person can retain capacity while losing confidence in it.
  grounding_eligible: true
- id: c8
  kind: context_dependence
  text: The capacity decline occurs whether or not any decision is at stake.
  grounding_eligible: true
- id: c9
  kind: definition_boundary
  text: 'This impact is distinct from kl-000017 (a false or insulated belief): N05 concerns the content of what the person thinks, this concerns the process of thinking.'
  grounding_eligible: false
- id: c10
  kind: definition_boundary
  text: This impact is distinct from kl-000151 (accepting a specific output without the checking one would apply to a comparable claim), which is an in-the-moment failure of scrutiny observable inside the interaction.
  grounding_eligible: false
- id: c11
  kind: definition_boundary
  text: This impact is distinct from eroded self-efficacy and helplessness, which is the person's belief about what they can do.
  grounding_eligible: false
- id: c12
  kind: definition_boundary
  text: This impact is distinct from kl-000024 (displaced autonomy), which is decisions being made by or ceded to the system.
  grounding_eligible: false
claim_evidence:
- claim_id: c1
  source: kl-000516
  quote: |-
    However, we additionally find that when access is
    subsequently taken away, students actually perform worse than those who never had
    access (17% reduction in grades for GPT Base)—i.e., unfettered access to GPT-4 can
    harm educational outcomes.
  locator: Abstract
  licenses: Establishes under randomization that access to an unguarded generative AI assistant during practice leaves the person performing worse, unassisted, than a person who never had access. That is the entry's structure exactly — capacity measured after the system is removed — and it is the only randomized demonstration on this entry that the decline occurs at all.
  fit: adjacent
  bridge: The delegated work is high-school mathematics practice and the capacity measured is exam performance on a closed-book test; the entry asserts a decline in reasoning about one's own situation in a mental-health-relevant conversation. The withdrawal design and the direction of the effect transfer; the domain, the population (Turkish high-school students) and the kind of reasoning do not.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000516
  quote: |-
    In stark contrast, in the subsequent unassisted exam, student
    performance in the GPT Base arm degraded by 0.054 (out of
    1) relative to that of the control arm. In other words, GPT
    Base diminished the average control student’s performance on
    the unassisted exam by 17%.
  locator: Main Results
  licenses: Supplies the magnitude of the same withdrawal effect — a 0.054-point drop on a 0-to-1 scale, 17 percent of the control mean — so the decline is not merely directionally present but sized.
  fit: adjacent
  bridge: The outcome is a mathematics exam score. The entry does not state a magnitude, so this bears on c1 only by showing the effect is large enough to measure in the domain where it was measured; no comparable magnitude has been established for reasoning about one's own experience.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000934
  quote: "In a \ncontrolled essay-writing experiment, participants who relied on a large language model exhibited weaker neural \nconnectivity and poorer recall of their own writing and continued to underperform when subsequently asked to work \nunaided, a pattern the authors termed cognitive debt (Kosmyna et al., 2025)."
  locator: Section 1, Introduction
  licenses: 'A second withdrawal-shaped result, restated from Kosmyna et al. 2025: participants who used an LLM to write continued to underperform when later asked to work unaided. Independent of Bastani in task, measure and population, so the effect is not a single-study artefact.'
  fit: adjacent
  bridge: This is a secondhand restatement inside a theory paper, of a controlled essay-writing experiment with EEG measures; the authors themselves note the evidence base includes preprints. The delegated work is academic writing, not appraising one's own distress, and Kosmyna et al. rather than Margondai is the citable primary.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000787
  quote: |-
    They find that brain connectivity and
    engagement systematically scale down with the level of external support. They also find that GenAI users
    displayed the weakest brain connectivity, reduced cognitive activity compared to other groups, difficulty in
    recalling parts of their essays, and low perceived ownership. Over a four-month period, participants using GenAI
    assistants consistently underperformed at neural, linguistic, and behavioral levels.
  locator: Section 5.1, 'Empirical findings in the literature', reporting Kosmyna et al. [54]
  licenses: 'The same Kosmyna result reported at more detail and over a stated four-month window: reduced neural engagement, impaired recall of the participant''s own produced text, and consistent underperformance at neural, linguistic and behavioral levels relative to unassisted and search-engine groups. Recall failure for one''s own output is a capability measure rather than an accuracy one, which is what c1 needs.'
  fit: adjacent
  bridge: Secondary reporting of Kosmyna et al. in a review, on essay writing. The span reports no explicit withdrawal condition of its own — it reports underperformance during assisted use across support levels — so it evidences degraded engagement and internalisation rather than the post-removal test c4 specifies.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000934
  quote: "Most directly, a multicenter observational study of \ncolonoscopists found that adenoma detection rates in standard, non-AI-assisted procedures declined significantly after \nseveral months of routine exposure to AI assistance, providing clinical evidence of deskilling following sustained AI \nreliance (Budzyń et al., 2025)."
  locator: Section 1, Introduction
  licenses: A restated multicenter observational result in which clinicians' unaided detection rates fell significantly after months of routine AI assistance. It is the closest thing on this entry to the decline occurring over real sustained use rather than inside an experimental session.
  fit: analogical
  bridge: The cited primary (Budzyń et al. 2025) measured adenoma detection rates of colonoscopists performing unaided procedures; a professional visual-detection skill in trained clinicians is not a person's capacity to reason about their own experience, and this entry's evidence holds only Margondai's one-sentence restatement of it, not the study.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000787
  quote: |-
    Gerlich [38] examines the impact of dependency on AI tools on critical
    thinking in a human study with 600+ participants based on a survey and interviews. They find a statistically
    significant negative impact of dependency on AI tools on critical thinking abilities, as a result of cognitive
    offloading. Younger participants were found to be more dependent on AI tools and use less critical thinking
    compared to older participants.
  locator: Section 5.1, 'Empirical findings in the literature'
  licenses: An association in a 600-plus-participant human sample between dependency on AI tools and lower critical-thinking ability, attributed by the cited authors to cognitive offloading — the entry's own mechanism, measured in people rather than posited.
  fit: adjacent
  bridge: A secondary restatement of Gerlich's cross-sectional survey and interviews about general work and study use, not help-seeking conversation. Cross-sectional self-report cannot separate a decline caused by use from pre-existing difference, which the reviewing authors themselves note, so this shows co-variation and not the decline c1 asserts.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001036
  quote: "Critical thinking atrophy, diminished writing skills development and reduced content knowledge acquisition have been observed through multiple regression analysis in GAIC addiction (37)."
  locator: Section 3.5 Epidemiological data
  licenses: A second association, by regression in a student sample, between heavy chatbot use and lower critical-thinking and knowledge-acquisition measures. Independent of Gerlich in sample and country, so the association is not confined to one survey.
  fit: adjacent
  bridge: A secondary restatement of a cross-sectional survey of 248 Zimbabwean undergraduates about academic work. Regression on cross-sectional data fixes no direction, and the domain is coursework rather than mental-health conversation.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000518
  quote: "Recall tests demonstrated that those in the latter condition had better memory than the former. The authors argued that memory-encoding demands were offloaded onto the external store, leading to memory impairments when it was not available"
  locator: Offloading Memory–Transactive memory
  licenses: 'Sparrow et al. 2011 as this review reports it: offloading encoding demands to an external store produced impairment when the store was not available. The oldest and cleanest demonstration that an availability expectation alone degrades an internal capacity.'
  fit: analogical
  bridge: A laboratory typing-and-recall study with trivia statements, a passive external store with no agent in it, one session, factual recall rather than reasoning. It establishes the offloading effect for memory and licenses nothing about reasoning, about conversation, or about durability — and the same review reports the opposite direction in an adjacent experiment.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000517
  quote: |-
    Participants apparently did not make the effort to

    remember when they thought they could later
    look up the trivia statements they had read. Be
    cause search engines are continually available to
    us, we may often be in a state of not feeling we
    need to encode the information internally. When
    we need it, we will look it up.
  locator: Experiment 2 discussion
  licenses: 'The primary source of the same result in the authors'' own words: participants did not encode statements they believed would remain externally available, and the authors read the effect as a state of not encoding rather than a decision to disengage — which matters for c1, because the entry asserts a capacity change and not a choice.'
  fit: analogical
  bridge: Free recall of 40 trivia statements after one typing session under a manipulated belief about external storage. No AI, no conversation, no reasoning task, and no measurement beyond the session; it establishes the mechanism the entry assumes and not the entry's outcome.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000937
  quote: "having AI do [their] schoolwork for [them], instead of doing it [themselves], has decreased the amount of learning I’ve done"
  locator: Section 4 Findings, Delegation, 1) Learning (participant D106)
  licenses: A first-person report from a young adult that having the AI do their schoolwork instead of doing it themselves decreased how much they learned — the person-side counterpart to the experimental results, in the person's own words.
  fit: adjacent
  bridge: Self-assessed reduction in learning in an academic domain, from an interview-and-survey study, with no capability tested and no withdrawal condition. The entry asserts a measured capability decline; this establishes that people report one.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000007
