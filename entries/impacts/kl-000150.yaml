  licenses: 'Cuts against c1 in the closest available setting: three weeks of randomized exposure to a sycophantic AI produced no measurable change in intellectual humility (d = 0.01). Where a reasoning-adjacent disposition was actually measured under randomization in a sustained AI-conversation design, the effect the entry asserts did not appear.'
