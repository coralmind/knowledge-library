  licenses: 'Bears on the c12 boundary: the three-axis definition of situational disempowerment separates inaccurate beliefs, inauthentic value judgments and misaligned actions, which maps the neighbour space this entry''s boundaries carve up — and contains no axis for a degraded capacity, which is what this entry claims.'
  fit: adjacent
  bridge: A construct definition, not an observation of any outcome in a person. Grounding-ineligible claim.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000828
  quote: The cognitive capacity of the judge plays an important role in processing choices, with heuristic rather than substantive processing more likely when processing capacity is in some way impaired.
  locator: Section on processing choices, subsection 'Cognitive Capacity', p. 50
  licenses: 'Supplies the general psychological principle the entry''s mechanism presupposes, from the affect infusion model: where a judge''s processing capacity is impaired by any cause, they shift from substantive to heuristic processing — relying on stereotypical rather than individuating information. The entry asserts that repeated delegation degrades the capacity to reason through a problem; this establishes what a degraded capacity looks like when it is exercised, which is the form c1''s decline would have to take. It licenses nothing about the cause. The named impairments in the span''s own vicinity are information overload, attention to multiple inputs and time pressure, none of which is delegation to a system.'
  fit: analogical
  bridge: 'A 1995 theoretical review of laboratory social-judgment experiments with no AI, no delegation and no withdrawal design. The direction of the arrow is also the reverse of the entry''s: this states that impairment produces heuristic processing, not that offloading produces impairment. The capacity in question is momentary processing resource under load, whereas c1 asserts a durable decline in a capability.'
  contributes: frame
  contradicts: false
- claim_id: c11
  source: kl-000007
  quote: Increasing dependence on AI for support, leading to diminished self-efficacy, reduced confidence, and feelings of helplessness when AI is unavailable.
  locator: 'Table A5, 21 negative psychological impact classes, Category: Impact on Human-AI Interaction, ''Over-reliance'' definition column'
  licenses: 'Bears on the c11 boundary and shows the field collapsing it. This is the definition the study''s own annotators coded participant reports against, and it fuses in a single impact class the two things c11 says must be separated: dependence on AI is defined as leading to ''diminished self-efficacy, reduced confidence'' — which is kl-000021, a belief about what one can do — and, in the same clause, ''feelings of helplessness when AI is unavailable'', which imports the entry''s own withdrawal condition. So the corpus''s coding instrument cannot distinguish a person who has lost capacity from one who has lost confidence in it, and any prevalence figure drawn from this class mixes both. A second and independent instance of the fusion kl-000978 already documents at the level of prose.'
  fit: adjacent
  bridge: A category definition from a survey study's codebook rather than a measurement, and every element in it is the participant's self-report about their own beliefs and feelings; nothing here measures a capability under withdrawal. It establishes how the field labels the pair, not that the two states dissociate.
  contributes: frame
  contradicts: false
