  locator: Table A5, Impact class 'Over-reliance', Example column
  licenses: A second self-report pairing delegated solution-finding and idea generation with the person's own account of diminished critical thinking, from a study of psychological risks in AI conversational-agent use.
  fit: adjacent
  bridge: The paper's own wording is that the participant 'expressed concern about' diminished critical thinking, so what is recorded is an anticipated or perceived decline rather than a measured one, in general problem-solving rather than help-seeking conversation.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000999
  quote: |-
    Perhaps interestingly, there were also several cases of
