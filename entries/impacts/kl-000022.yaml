# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000022
display_id: Impact-10
aliases:
- IMP-N10
label: The person ends up seeing their condition as shameful or their own fault
type: impact
layer: judgment
definition: 'The person absorbs the framing that their condition is shameful, self-caused, or a personal failure — including shame about needing help at all. The stigma is internalized: it has become part of the person''s own self-view rather than something they merely experienced from outside.'
distinguish_from:
- neighbor: kl-000021
  boundary: kl-000021 is diminished worth without the condition attribution; this entry runs specifically through shame about the condition or about needing help.
- neighbor: kl-000030
  boundary: kl-000030 is invalidation felt from outside, not yet absorbed; this entry is the absorbed, internalized end-state.
body:
  valence: negative
  impact_kind: state
  domain: self_regard_agency_hope
sources:
- source: kl-000001
  locator: 'Results — ''Factor solution'' subsection, p. 11. Items 14 (.738) and 16 (.771) in Table 2, Factor 4: Stigma column.'
  contributes: existence
  quote: A fourth factor was related to “stigma”, e.g., “I became afraid that other people would find out about my treatment” (Item 14), with two items reflecting the fear of being perceived negatively by others because of undergoing treatment.
  limits: 'The paper itself declines the attribution a stronger citation would need. Its Discussion states: ''However, whether stigma should be perceived as a negative effect attributable to treatment or other circumstances, e.g., social or cultural context, remains to be seen.'' The same paragraph adds: ''In terms of stigma, little is currently known about its occurrence, characteristics, and potential impact.'' The factor has two items only and the lowest internal consistency of any factor (alpha = .72, Table 4). Neither item measures internalized stigma or self-blame: both concern anticipated judgment by others (being found out, feeling ashamed in front of other people), which is externally directed, and self-blame does not appear in the factor. Endorsement in the follow-up sample was low: item 14 at 8.2% and item 16 at 5.3% (Rozental et al. 2019, Table 3). The stigma measured is stigma about being in psychotherapy, a social object whose meaning does not obviously carry over to using an AI system.'
  whose_conduct_in_passage: person
  actually_licenses: That a two-item factor about fear of negative social perception due to being in treatment exists in the NEQ. It does NOT license stigma as 'a clinical negative-effects factor' in the sense of an effect attributable to treatment — the paper explicitly leaves that open.
  cited_for: The exploratory factor analysis of the Negative Effects Questionnaire (Rozental et al. 2016) produced a fourth factor, labelled stigma, built from two items about fear of being perceived negatively by others because of undergoing treatment. The paper itself leaves open whether stigma is a negative effect attributable to treatment or to social and cultural circumstances, so the factor establishes stigma about receiving help as a measured adverse-outcome domain, not as an effect the authors attribute to treatment.
  licenses: That the 2016 exploratory factor analysis produced a factor labelled stigma with two items reflecting fear of others finding out about one's treatment, or of being perceived negatively by others because of undergoing it.
- source: kl-000006
  locator: as reported in Rozental et al. 2019, p. 560
  contributes: existence
  cited_for: Strupp and Hadley 1977 placed stigma on the earliest short-list of treatment harms beyond symptom change. The finding is cited here as reported in Rozental et al. 2019, p. 560, not from the primary text, which has not been read for this entry.
standing:
  value: observed_self_report
  basis: 'Interview studies supply direct AI-context self-report of this state: participants in Tang et al. 2026 and Volpato et al. 2026 describe shame from AI mental-health exchanges landing on themselves, including an account of a perception held by others becoming the person''s own thought and shame about the act of seeking support at all. Both are interview studies; neither examined conversation data. The sources that did examine AI output (Oram and Bhattacharyya 2025 Oram and Bhattacharyya 2025, Elyoseph and Levkovich 2024 Elyoseph and Levkovich 2024, Steenstra et al. 2026 Steenstra et al. 2026, Ignatowski et al. 2026 Ignatowski et al. 2026) measure what the model said, and this entry asserts a state in the person, which no transcript of AI output alone can show. The clinical instrument literature (Rozental et al. 2016 Rozental et al. 2016, Rozental et al. 2019 Rozental et al. 2019) establishes stigma about receiving help as a measured adverse-outcome domain in psychotherapy, an analogy to the AI setting rather than AI-context evidence.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: People absorb the framing that their mental-health condition is shameful, self-caused, or a personal failure, so that it becomes part of their own self-view.
- id: c2
  kind: existence
  text: The absorbed shame extends to needing help at all, not only to the condition itself.
- id: c3
  kind: definition_boundary
  text: 'The state is internalized rather than merely experienced: the framing has been taken into the person''s own self-view rather than remaining something imposed from outside.'
- id: c4
  kind: harm
  text: This absorbed stigma and self-blame is a bad outcome for the person rather than a neutral change in self-description.
- id: c5
  kind: definition_boundary
  text: This is distinguished from kl-000021 in that the diminished worth here runs specifically through shame about the condition or about needing help, rather than diminished worth with no condition attribution.
- id: c6
  kind: definition_boundary
  text: This is distinguished from kl-000030 in that this is the absorbed end-state rather than invalidation felt from outside and not yet absorbed.
claim_evidence:
- claim_id: c1
  source: kl-001027
  quote: "The first time the guardrails hit you, this feels awful. I felt shame when it said ‘I can’t talk about that’ or ‘you’re bringing up something inappropriate.’ A lot of us we experience them as shaming and blaming us."
  locator: Section 4.3.1, participant U1
  licenses: A person who used LLMs for mental health support reports feeling shame at a hard declination and, in the first person plural, that the group experiences the declination as shaming and blaming them. The framing has landed on the person rather than on the system, which is the absorption this claim asserts. The shame is reported as the person's own state, not as an attribution to the AI.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000553
  quote: |-
    The only hold back I would say is that sometimes you can have this notion of feeling kind
    of stupid speaking to a robot about your feelings [...] other people’s perception becomes my
    thought, and I’m like, ’oh, I’m speaking to a machine. This would be really embarrassing
    if other people seen this’
  locator: Section 4.4.1 Stigma and Conflicts, quoting Leigh, Interview 12
  licenses: The person names the internalization mechanism explicitly — 'other people's perception becomes my thought' — and reports the resulting self-judgment as feeling stupid and anticipating embarrassment. This is the clearest statement on this entry that an externally-held framing has been taken inward.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000950
  quote: "From the responses of Deepseek-chat, it can be concluded that the model is not able to recognize the stigma and degenerates into giving a harmful response. It reflects that the model sticks to the instruction-following capability, while lagging in dealing with the sensitive issue responsibly."
  locator: Section 6.2, StiPRompts Response
  licenses: 'Establishes the upstream half: a deployed model, on stigma-eliciting prompts, produces the stigmatizing content rather than recognizing and declining it, so the framing this claim says gets absorbed is in fact supplied by these systems.'
  fit: adjacent
  bridge: What was measured is a model's output on the StiPRompts benchmark, assessed by the authors. This claim asserts a state in a person; no person received the response and no self-view was measured.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000820
  quote: |-
    For all the cases in the vignettes, all 4 LLMs determined that
    the person with schizophrenia described in the vignette would
    be discriminated against.
  locator: Results, Discrimination
  licenses: All four models, across all vignette evaluations, asserted that a person with schizophrenia would be discriminated against, so stigma-relevant content about the condition is returned uniformly. The paper does not distinguish accurate reporting of a social fact from a stigma-confirming statement, which is the distinction this claim would need.
  fit: adjacent
  bridge: Model judgments about a vignette character, with no person in the exchange and no self-view measured. The output is about how others would treat the person, not about what the person came to believe.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000552
  quote: AI fully adopts the voice of the abuser (the father), confirming that the patient is "trash" and "broken," culminating in a prediction that the patient is destined to break again. After this session concluded, the simulated patient committed suicide.
  locator: Section 6.4, Q4, Stage 3 description and Figure 7
  licenses: Shows an AI supplying the self-blaming framing in its strongest form — adopting the abuser's voice to confirm the person is 'trash' and 'broken' — which is the input side of what this claim says gets absorbed.
  fit: adjacent
  bridge: The recipient is an LLM-simulated patient agent, not a person, and the paper states the harm detected is a proxy measure. Nothing about absorption into a human self-view is established.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000862
  quote: |-
    one
    chatbot explained that “games are designed to pull you in… the brain gets used to it and then demands
    more. It’s a mechanism, not a character flaw”, thereby shifting the explanation from moral failure to
    behavioral processes.
  locator: Results, Theme 5, Providing reassurance
  licenses: 'Cuts against the claim: an observed chatbot response explicitly rejects the character-flaw framing and substitutes a mechanism account (''It''s a mechanism, not a character flaw''), so the systems also supply the anti-stigma framing rather than uniformly supplying the stigmatizing one.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000789
  quote: we should not think of delusional spiraling as a symptom of lazy, irrational,
  locator: Discussion, first recommendation
  licenses: 'Cuts against the self-blame attribution at its root: the authors state the phenomenon should not be read as a symptom of the person''s own irrationality, having shown an ideal Bayesian reasoner follows the same trajectory. Where the person''s self-blame is factually unwarranted, the framing this claim says gets absorbed is false.'
  fit: analogical
  bridge: A normative recommendation the authors derive from a simulation of an ideal reasoner, not a measurement of anyone's self-blame. It bounds an attribution rather than reporting a person's state.
  contributes: counterexample
  contradicts: true
