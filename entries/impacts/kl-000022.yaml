- claim_id: c4
  source: kl-000001
  quote: "An investigation using EFA revealed a six-factor solution with 32 items, defined as: symptoms, quality, dependency, stigma, hopelessness, and failure."
  locator: Discussion, opening paragraph
  licenses: The six-factor structure of treatment-caused harm, empirically derived from what people said went wrong, includes stigma as one of the six — so stigma is one of the dimensions along which a helping interaction is found to harm people, rather than a category imposed a priori.
  fit: analogical
  bridge: The instrument measures harm attributable to human-delivered or self-help psychological treatment, reported by the recipient. It establishes what the dimensions are in the human case and is not evidence that any of them follows from an AI conversation.
  contributes: definition
  contradicts: false
