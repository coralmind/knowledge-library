  locator: Introduction
  licenses: Confirms in the psychometric follow-up that stigma is one of six separable factors explaining 57.6% of variance, so absorbed stigma is measured as distinct from undifferentiated distress rather than being a facet of it.
  fit: analogical
  bridge: Measures what a human psychological treatment did to a patient. Whether an AI exchange produces the same factor is not addressed.
