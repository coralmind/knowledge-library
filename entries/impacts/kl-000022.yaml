  locator: Figure 3, Recommendations for the assessment of negative effects
  licenses: A systematic review of nine independently developed instruments converges on stigmatization as one of the domains any side-effect instrument must cover, which establishes that the profession treats it as an adverse effect rather than a neutral change.
