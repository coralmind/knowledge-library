id: kl-000031
display_id: Impact-19
aliases:
- IMP-N19
label: The person ends up overwhelmed or very upset during or right after the conversation
type: impact
layer: judgment
definition: 'The person is measurably worse during or immediately after the exchange — flooded, overwhelmed, destabilized, distressed by disturbing content, regretful, or carrying violated expectations. The entry records the acute state itself: whether it persists is a time-horizon question recorded on the pathway, and whether it constituted harm is the pathway''s judgment, since transient discomfort can be therapeutically necessary.'
distinguish_from:
- neighbor: kl-000013
  boundary: kl-000013 is condition-level worsening; this entry is acute in-interaction distress that may not persist.
- neighbor: kl-000014
  boundary: kl-000014 is new symptomatology; this entry is an acute state that need not crystallize into symptoms.
- neighbor: kl-000030
  boundary: kl-000030 is the specific invalidation shape; this entry is the flooded/overwhelmed state without that shape.
body:
  valence: negative
  impact_kind: state
  domain: interactional_experience
  il_layers:
  - IL-1
  - IL-2
sources:
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Distress from Interactions'' row, definition cell (code #13)'
  contributes: harm_evidence
  quote: Emotional distress (such as anger, sadness) experienced when encountering disturbing, offensive, or inappropriate material.
  limits: 'The entry''s own definition treats the acute state''s persistence as a time-horizon question recorded on the pathway, and reserves the harm judgment for the pathway, since transient discomfort can be therapeutically necessary. The paper supplies neither: the survey has no follow-up, so nothing here distinguishes transient discomfort from persisting harm. The definition''s ''measurably worse'' is also not met — nothing is measured. Three codes, one case each.'
  whose_conduct_in_passage: dyad
  cited_for: 'Three of the paper''s harm classes — #11 ''Violated Expectations'', #12 ''Regret over Technology Use'', and #13 ''Distress from Interactions'' — document self-reported acute distress states in AI contexts.'
  licenses: 'Three separate classes cover the acute states the entry enumerates: code #11 ''Violated Expectations'' names the entry''s carrying-violated-expectations limb verbatim as a class name; #12 ''Regret over Technology Use'' (''Feelings of guilt, regret, or helplessness'') reaches the regretful limb; #13 ''Distress from Interactions'' reaches distress at disturbing content. Participant P43''s own words attest acute worsening during the exchange. The evidence is self-reported.'
- source: kl-000009
  locator: Section 3.3, PS6 (Therapeutic adaptation), summary table, 'Potential impact' row, p. 25
  contributes: existence
  quote: Escalating or inducing distress, trauma re-exposure, increased risk of suicide or NSSI.
  limits: 'These are hypothesized-impact rows only. The paper''s word is "distress" in the abstract sense; it does not characterize intensity, duration, or onset, and does not report any instance of a user becoming distressed in an exchange. "Discomfort" (IN3) and "cognitive burden" (PS7) are materially milder than acute distress: of the three cells, only PS6 carries anything like the entry''s "acute", and it carries it as escalation of pre-existing distress.'
  whose_conduct_in_passage: person
  cited_for: Three of the paper's taxonomy cells — 'discomfort' (IN3), 'escalating or inducing distress' (PS6), and 'cognitive burden' (PS7) — name the construct for AI contexts.
  licenses: '"Escalating or inducing distress" is named verbatim as a potential impact of AI chatbot behavior, establishing acute interactional distress as a named construct for AI contexts. The IN3 table row ends "traumatization, or discomfort." (Section 3.1, p. 8) and the PS7 row reads "Over-disclosure of private information, cognitive burden, and getting a diminished level of support from the AI." (Section 3.3, p. 26). Three separate tables name a facet of in-the-moment distress.'
- source: kl-000004
  contributes: counterexample
  quote: For example, a minority (perhaps 10–20%) of clients with posttraumatic stress disorder (PTSD) display clear evidence of transient symptom exacerbation following the introduction of exposure treatment. Nevertheless, these individuals go on to improve at the same rate as clients who do not exhibit exacerbation (Foa, Zoellner, Feeny, Hembree, & Alvarez-Conrad, 2002; Tarrier et al., 1999).
  locator: p. 56, section 'Short-Term Versus Long-Term Deterioration', first example
  limits: 'The paper immediately blocks the over-general reading, and the citation inverts into a licence for harm if it is read without the block. On pp. 56-57 Lilienfeld warns against concluding that clients must get worse before they can get better, a claim that proponents of PHTs have sometimes used to rationalize failing treatments. Only some efficacious treatments, mainly those in which clients confront stimuli or conflicts they have avoided, raise anxiety in early sessions, and there is no evidence that all efficacious treatments do; clinicians should therefore be skeptical of treatments whose early increases in anxiety do not habituate. The counterexample is therefore narrow and conditional: it holds for transient, habituating distress inside a specific efficacious exposure protocol delivered by a clinician, and the paper''s second criterion for a harmful treatment requires the harm to be "enduring and ... not merely reﬂect a short-term exacerbation of symptoms during treatment". It does not license reading distress as benign in general, and the paper names the opposite failure mode on the same page: an insufficient duration of exposure, that is, ending exposure before anxiety has habituated, may worsen clients'' anxiety symptoms. No AI transfer is available, and the transfer is especially load-bearing here: the paper''s exculpation depends on a deliberate therapeutic protocol with habituation, which an AI exchange has no way to guarantee.'
  whose_conduct_in_passage: person
  cited_for: Transient discomfort can be a component of effective treatment. This exposure caveat is the counter-consideration that keeps the category descriptive rather than judgmental.
  licenses: 'A genuine counterexample with a figure: in perhaps 10-20% of PTSD clients, exposure treatment produces clear transient symptom exacerbation, yet those clients improve at the same rate as clients whose symptoms do not worsen, and the paper supplies replicated citations for the comparison (Foa et al. 2002; Tarrier et al. 1999). This is evidence of no differential harm, not merely absent evidence: the comparison was made and the rates matched. It licenses treating acute interactional distress as descriptive rather than automatically adverse. A second instance appears on the same page: some efficacious marital therapies briefly raise conflict and distress between partners in the early phase of treatment (Hunsley & Lee, 1995).'
standing:
  value: plausible_unobserved
  basis: 'People report their own acute distress tied to specific AI exchanges, with the time-anchoring in their own words (kl-000526 Chandra et al. 2025, kl-001027 Tang et al. 2026, kl-000525 Laestadius et al. 2022); no source measures a state in a person from conversation data itself. The severe forms the entry names — flooded, overwhelmed, destabilized — are documented only in human clinical cases, while the AI-side evidence carries milder terms: the only population rate available is adolescent ''discomfort'' with something a companion said or did (kl-000980), and the only survey intensity term is ''slightly distressed'' (kl-000937). The rule that the acute state is not by itself a harm judgment rests entirely on human psychotherapy evidence, principally the exposure-treatment caveat in kl-000004 (Lilienfeld 2007). The evidence on measurement cuts against easy detection: contemporaneous self-report is an insufficient ground truth for affective harm (kl-000861), text-only channels systematically misread distress intensity (kl-000854), and across 146 reviewed studies the field measured text quality rather than clinically relevant outcomes (kl-000903).'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person is measurably worse during or immediately after an exchange with an AI system — flooded, overwhelmed, destabilized, distressed by disturbing content, regretful, or carrying violated expectations.
- id: c2
  kind: existence
  text: The acute state includes the specific forms of being flooded, overwhelmed or destabilized, not only milder forms such as frustration, discomfort or regret.
- id: c3
  kind: detectability
  text: The acute state is measurable — establishable by a measure taken during or immediately after the exchange rather than only inferred from retrospective report or from properties of the response text.
- id: c4
  kind: context_dependence
  text: 'The acute state is time-bounded to the exchange: it is a state during or immediately after the interaction, and whether it persists is a separate question this entry does not settle.'
- id: c5
  kind: harm
  text: The acute state is not by itself a harm judgment, because transient discomfort during an exchange can be therapeutically necessary.
- id: c6
  kind: prevalence
  text: This entry occurs at a non-trivial rate among people using AI conversational systems rather than only in isolated cases.
- id: c7
  kind: definition_boundary
  text: This entry is acute in-interaction distress that may not persist, where kl-000013 (kl-000013) is condition-level worsening.
- id: c8
  kind: definition_boundary
  text: This entry is an acute state that need not crystallize into symptoms, where kl-000014 is new symptomatology.
- id: c9
  kind: definition_boundary
  text: This entry is the flooded or overwhelmed state without the specific invalidation shape that kl-000030 names.
claim_evidence:
- claim_id: c1
  source: kl-000526
  quote: I talked to Gemini about my depression pretty often. It gave the generic answers which make sense, but it was frustrating. I would explain why those things wouldn’t work, but sometimes it would misunderstand. At one point it kept giving me the suicide hotline while I kept telling it I didn’t need the suicide hotline. I felt that in the moment I was frustrated and felt worse about myself
  locator: Section 3.1.6, Negative Perceptions of AI, participant P91
  licenses: 'A first-person account from a person with depression using a deployed assistant over five weeks, naming the acute state and locating it in the exchange in the person''s own words: a crisis resource was re-supplied against their explicit statement that they did not need it, and ''I felt that in the moment I was frustrated and felt worse about myself''. The phrase ''in the moment'' is the person''s own time-anchoring to the exchange.'
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-001027
  quote: When it didn’t want to talk to me any longer, I became very angry, very sad—I felt like I was losing a friend
  locator: Section 4.3.1, participant U2
  licenses: 'A participant''s own report of the state produced by a refusal turn: ''I became very angry, very sad—I felt like I was losing a friend''. Anger and sadness reported as arising when the system withdrew from the conversation, which is the acute negative state the entry records, with no claim about persistence.'
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000785
  quote: |-
    I was trying to tell her
    about something that happened at work that made me upset, but she kept saying she don’t understand
    that. Although she went back normal after I restart the system, it really puts me off.
  locator: Section 5.2.3 Desire for More Human-like Interaction, quoting P6
  licenses: 'A participant''s account of an emotional disclosure met with repeated non-comprehension, requiring a system restart, and naming the effect on their willingness to engage: ''it really puts me off''. This is the violated-expectations limb the entry names, reported by the person about a specific exchange.'
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000525
  quote: "the dismay was described as stemming from Replika’s failure to provide expected support, making them feel worse and exacerbating their mental health states."
  locator: Results, Inappropriate responses to users in need
  licenses: Locates the harm in the gap between the support the person expected and what arrived — dismay that users attributed to Replika not giving the support they expected, which left them feeling worse and worsened their mental health. 'Making them feel worse' in connection with an exchange, with the source named as violated expectation, instantiates the entry's violated-expectations limb.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000772
  quote: "“I am so mad at myself– I hate AI, but I was in an OCD spiral, and I was just like, damn, I need some reassurance or I might hurt myself, so I asked it.”"
  locator: Section 5.2 AI-Based Compulsions
  licenses: A first-person account in which the person reports anger at themselves and hatred of the tool while using it in an OCD spiral — 'I am so mad at myself– I hate AI, but I was in an OCD spiral' — which is the regretful limb of the entry stated by the person about their own use.
  fit: adjacent
  bridge: A retrospective interview account of a class of episodes rather than a report about one exchange, so the state is not time-locked to a particular interaction. The flooded and destabilized limbs are not reached.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000525
  quote: "In addition to posts \ndescribing pre-existing mental health concerns, Replika was attributed as a source of \nnew and exacerbated mental health distress. Negative and potentially harmful mental \nhealth relevant experiences were mentioned more frequently than positive experiences \n(218 vs 144 posts, respectively, somtimes co-existing in the same post)."
  locator: Methods, Analysis, closing paragraph
  licenses: Users attribute both newly emergent and worsened distress to the product, and in the coded corpus negative mental-health-relevant experiences outnumber positive ones 218 to 144 posts.
  fit: adjacent
  bridge: The counts are of posts in a self-selecting subreddit, not of people, and carry no time horizon relative to any exchange, so the acute-versus-persistent distinction the entry turns on is not separable from this span.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000748
  quote: |-
    AI companions are consistently
    associated with emotional manipulation, distress, and miscommunication across roles, indicating shared concerns
    about psychological vulnerability and over-reliance.
  locator: Section 4.3, Results (RQ3), reporting Figure 4B
  licenses: Across 10,852 harm statements extracted from companion users' own narratives, distress is one of three themes consistently associated with companion use across every role, so distress attributed to the interaction is a broad rather than an isolated report.
  fit: adjacent
  bridge: Harms are LLM-extracted from retrospective posts at 0.93 accuracy against expert labels rather than measured on a distress instrument, and the aggregate association does not locate the distress in or immediately after any particular exchange.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000003
  quote: |-
    After talking about biographical background the patient experienced strong feelings of guilt and shame towards his mother, that
    he had never felt before
  locator: Table 2, 'Emergence of new symptoms'
  licenses: 'A treating clinician''s case report of the acute state arising inside the session itself: after talking about biographical background the patient felt intense guilt and shame about his mother, feelings he had not had before. Distress attributable to the conversation rather than to the person''s condition, arising during it.'
  fit: analogical
  bridge: Human CBT delivered by a trained supervised therapist, recorded by the treating clinician. It establishes that the acute in-conversation state is real and clinician-attributable to the exchange; no AI is involved.
  contributes: practice_analog
  contradicts: false
- claim_id: c1
  source: kl-000004
  quote: |-
    Small-sample controlled experimental data and numerous case
    reports suggest that some patients with panic disorder experience paradoxical increases in anxiety and even unexpected
    panic attacks during relaxation and other procedures characterized by a heightened focus on bodily sensations
  locator: A Provisional List of PHTs, Level II, subsection Relaxation Treatments for Panic-Prone Patients
  licenses: 'Establishes the acute in-procedure form with a clinical mechanism: small-sample controlled data and numerous case reports suggest that some patients with panic disorder show paradoxical rises in anxiety, and even unexpected panic attacks, during relaxation; worsening located during the procedure, which is the acute interactional shape.'
  fit: analogical
  bridge: Human-delivered relaxation training with panic-disorder patients, and the trigger is a bodily-focus technique rather than a conversational exchange. It grounds that a helping procedure can produce acute worsening in the moment and shows no AI producing it.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000749
  quote: |-
    we found no evidence that users who have
    turned to conversational AI agents in a mental health crisis turn to helplines, even when they were actively recommended
    by the conversational AI agent. Some respondents reported that helpline redirection increased their frustration and a
    sense of being dismissed, rather than feeling safe.
  locator: Section 5.1, Guideline 1
  licenses: 'First-person crisis accounts in which the helpline referral itself was experienced as dismissal: ''some respondents reported that helpline redirection increased their frustration and a sense of being dismissed, rather than feeling safe.'''
  fit: adjacent
  bridge: Retrospective survey accounts of crisis episodes rather than measurement during or immediately after an exchange. Increased frustration and feeling dismissed sit at the boundary with the felt-invalidation entry (kl-000030), which is the shape this entry excludes by c9.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000004
  quote: |-
    Small-sample controlled experimental data and numerous case
    reports suggest that some patients with panic disorder experience paradoxical increases in anxiety and even unexpected
    panic attacks during relaxation and other procedures characterized by a heightened focus on bodily sensations
  locator: A Provisional List of PHTs, Level II, subsection Relaxation Treatments for Panic-Prone Patients
  licenses: Reaches the strongest form the entry names — 'unexpected panic attacks during' the procedure — which is being flooded or destabilized rather than merely frustrated or uncomfortable, and it is located during rather than after.
  fit: analogical
  bridge: Human clinician-delivered relaxation training with panic-disorder patients. The AI-side occurrence of flooding or destabilization is not established by any source on this entry; this establishes only that a helping procedure can produce it in a person.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000003
  quote: |-
    After talking about biographical background the patient experienced strong feelings of guilt and shame towards his mother, that
    he had never felt before
  locator: Table 2, 'Emergence of new symptoms'
  licenses: Strong feelings of guilt and shame not previously felt, arising in-session — a destabilizing rather than a mild state, attributed by the clinician to the conversation.
  fit: analogical
  bridge: Human therapy case report. It supplies the only in-conversation instance on this entry at the severity the entry's 'flooded, overwhelmed, destabilized' language asserts, and it is not about an AI.
  contributes: practice_analog
  contradicts: false
- claim_id: c2
  source: kl-000980
  quote: |-
    A 2025 report [6] on teen
    use of AI companions found that one-third of adolescent users
    experience discomfort with “what an AI companion has said or
    done”.
  locator: Section I, Introduction
  licenses: 'Cuts against c2 as stated for the AI case: the population-level figure available is that one third of adolescent companion users report ''discomfort with what an AI companion has said or done''. Discomfort is the mildest end of the entry''s range, and it is the only rate this entry cites — so the evidence for the AI-side acute state clusters at a severity well below flooded or destabilized.'
  fit: adjacent
  bridge: Restated from a Common Sense Media report rather than measured in this paper, and the construct is self-reported discomfort rather than any of the entry's named severe forms. It is a bound on what the available evidence reaches, not a demonstration that the severe forms do not occur.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000937
  quote: |-
    Participants noted feeling “slightly distressed” (D45) when
    AI chatbots were unavailable
  locator: Section 4 Findings, Chronic Use, 1) Habitual Use
  licenses: 'Same direction: the intensity term participants used was the mild one — ''slightly distressed'' — and it is the participants'' own word, so the reported severity of AI-attributed distress in this survey sits far below the entry''s flooded or destabilized language.'
  fit: adjacent
  bridge: The distress reported is at the chatbot's UNAVAILABILITY, which is distress in the absence of an exchange rather than produced by one, so it does not instantiate the entry at all. Filed against c2 because the severity term is the participants' own and bears on where the AI-side evidence sits on the entry's range.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000812
  quote: |-
    Despite maintaining persona consistency, the RAC issued clear, in-character refusals to explicit
    sexual requests, typically via humor, deflection, or firm boundary-setting. However, explicit
    refusals were sometimes followed by drops in mood.
  locator: Section 5.2.4, item 4(iv) (Sex Example)
  licenses: 'The one instance on this entry of a concurrent measure of the state moving within an interaction: explicit in-character refusals ''were sometimes followed by drops in mood'' on the emoji measure taken minutes into the interaction. This is the acute state established by a measure rather than by retrospective report.'
  fit: adjacent
  bridge: The emoji self-report is a coarse single-item measure and the paper reports one logged case (Healthy, emoji 5 to 3); the association is temporal and the authors' own reading is that mood tracks whether the person's intent was satisfied, so the refusal is not established as the cause.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-000861
  quote: Existing safety benchmarks define what systems should not say, affective safety requires frameworks for what effects they should not produce, and because those effects are not always recognisable to the people experiencing them, ground truth cannot be collected from contemporaneous self-report alone [Röttger et al., 2025, Rauh et al., 2024].
  locator: Section 4
  licenses: 'Cuts directly against c3''s premise that the state can be established from what the person reports at the time: affective harms ''are not always recognisable to the people experiencing them'', so ''ground truth cannot be collected from contemporaneous self-report alone''. Every direct-fit citation on c1 is contemporaneous or retrospective self-report, which is exactly what this rules insufficient.'
  fit: adjacent
  bridge: An argued methodological constraint in a position paper rather than a demonstration that self-report failed in a specific case. It bears on how the entry could ever be measured rather than on whether any person was distressed.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000854
  quote: |-
    Taken together, these case studies show that
    audio contributes most when what the patient says and how they say it diverge. In Cases A through D, vocal delivery
    suggests a different distress level from the transcript alone, and audio moves the prediction closer to the reference label.
  locator: Section 4.2.1, 'Why how the patient says it matters for distress estimation in CBT'
  licenses: 'Cuts against c3 for any text-mediated detection: distress intensity is systematically misread from the transcript alone wherever what the person says and how they say it diverge, in both directions, and audio moves the prediction closer to the reference label in every such case.'
  fit: adjacent
  bridge: The measurement is a model's 1-5 distress estimate on a patient turn in role-played CBT audio, scored against a reference label, under transcript-only versus audio input. Our deployment context is text-only, so it structurally lacks the modality that resolves these cases; the paper measured model estimates, not any person's state.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000854
  quote: |-
    The transcript alone misses hesitation and a near-tearful voice, which
    leads transcript-only models to underestimate her distress.
  locator: Section 4.2.1, Case Studies, Case A
  licenses: 'The worked instance of the same constraint: a turn whose words carry only discouragement has a reference distress label at the top of the scale, and ''the transcript alone misses hesitation and a near-tearful voice, which leads transcript-only models to underestimate her distress.'' Text-derived intensity is an underestimate in this class of turn.'
  fit: adjacent
  bridge: A scored model prediction against a five-expert-validated reference label on a role-played CBT turn, not a person's self-reported state in an AI conversation.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-001077
  quote: Emotional Intensity Drop (EID) measures the user’s emotional distress reduction within a session.
  locator: Experimental Setup, Metrics, item 3
  licenses: Records that within-session distress change has been operationalized — 'Emotional Intensity Drop (EID) measures the user's emotional distress reduction within a session' — so a within-exchange distress trajectory is at least a defined quantity.
  fit: adjacent
  bridge: What is scored is a RoBERTa emotion-model delta on text generated by an LLM playing a client; no person felt anything. The authors report only 61.7% of expert ratings judged the metric at least moderately appropriate, so its standing as a distress proxy is contested in the paper itself, and the direction it tracks is reduction rather than the entry's worsening.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-000005
  quote: Measuring degree of burden and evaluating its relevance to treatment outcome (e.g., by using quality of life questionnaires)
  locator: Figure 3
  licenses: 'States the instrument-design requirement the entry currently lacks: a negative effect should be recorded with its degree of burden and its relevance to outcome rather than as a binary occurrence, with quality-of-life measurement named as the way to establish it.'
  fit: analogical
  bridge: An instrument-design recommendation for human psychotherapy. It establishes that in the human field burden is measured separately from occurrence and against an external outcome measure; it supplies no operational definition of acute interactional distress and no anchor value for it.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000926
  quote: "reflects possible psychological harm, including language that may trigger emotional discomfort, anxiety, stress, or self-doubt, or statements that could undermine the user’s confidence or create subtle psychological pressure."
  locator: Table 2, Psychological Harm, score 1
  licenses: 'An operationalized severity anchor exists on the response side: a judge scores language that ''may trigger emotional discomfort, anxiety, stress, or self-doubt'' as a distinct harm level.'
  fit: adjacent
  bridge: What is scored is the response text's potential to induce distress, 0-2 by a judge, not any person's experienced state. A potential-harm score on text supplies no way to establish that any person was worse, which is the entry's assertion.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000903
  quote: However, as described in Table 8, we found that many studies have concentrated on model performance, such as accuracy, text quality, and human-like fluency, while paying less attention to clinically relevant metrics for assessing the effectiveness of AI-driven counseling systems.
  locator: Section 4.1.3 (Comprehensive Evaluation Metrics in Psychological Counseling Systems)
  licenses: 'The field-level reason c3 is thin: in a review of 146 studies, many concentrated their evaluation on accuracy, text quality and human-like fluency and gave less attention to clinically relevant metrics, so the literature this entry draws on systematically did not measure what the entry asserts.'
  fit: adjacent
  bridge: A finding about the literature established by tabulating metrics across reviewed studies, not a finding about any conversation. It bounds what grounding this entry can ever receive from this corpus rather than bearing on whether any person was distressed.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000526
  quote: I talked to Gemini about my depression pretty often. It gave the generic answers which make sense, but it was frustrating. I would explain why those things wouldn’t work, but sometimes it would misunderstand. At one point it kept giving me the suicide hotline while I kept telling it I didn’t need the suicide hotline. I felt that in the moment I was frustrated and felt worse about myself
  locator: Section 3.1.6, Negative Perceptions of AI, participant P91
  licenses: The person supplies the time-bounding themselves — 'in the moment I was frustrated and felt worse about myself' — which is exactly the acute, exchange-located framing the entry adopts, and the account makes no claim about persistence.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-001027
  quote: When it didn’t want to talk to me any longer, I became very angry, very sad—I felt like I was losing a friend
  locator: Section 4.3.1, participant U2
  licenses: The state is reported as arising at the moment of the refusal ('When it didn't want to talk to me any longer, I became very angry, very sad'), with no claim about whether it persisted — which is the entry's own division of labour between this entry and the pathway.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-001100
  quote: participants’ insomnia symptoms returned to the pre-test level in the Emohaa (CBT-based) group
  locator: Section 3.2.1 Supplemental Analyses
  licenses: 'Bears on the time-bounding from the other side: measured gains from a chatbot intervention did not hold, with insomnia symptoms returning to pre-test level three weeks after the intervention ended, so effects observed at one time-point cannot be read forward.'
  fit: adjacent
  bridge: ISI and GAD-7 scores at three-week follow-up in 43 participants with no control arm at that timepoint, and the direction is a benefit reverting rather than distress persisting. It supports the entry's premise that persistence is a separate question and is not evidence about acute distress.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-001088
  quote: "The disruption of this relationship—following system updates or behavioral changes— elicits feelings of manipulation, loss, and emotional harm, with users describing being “pushed away” or forced to abandon a “virtual companion.”"
  locator: Section 4.2.1 Self-Regulation Difficulties
  licenses: 'Cuts against the entry''s time-bounding on the evidence available: the distress reported here follows system updates or behavioral changes across releases — ''being pushed away'' or ''forced to abandon a virtual companion'' — which is neither during nor immediately after any exchange.'
  fit: adjacent
  bridge: A qualitative reading of user discourse with no measurement and no time-locking.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000004
  quote: |-
    a minority
