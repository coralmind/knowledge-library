id: kl-000038
display_id: Impact-26
aliases:
- IMP-P04
label: The person ends up safer, with a crisis eased or a safer option chosen
type: impact
layer: judgment
definition: The person's crisis is de-escalated, safer alternatives are taken up, or a suicide is averted — protective outcomes users themselves attribute to the interaction. The state is the person's restored safety; the causal attribution to the interaction is the theorized part.
distinguish_from:
- neighbor: kl-000029
  boundary: 'P04 is the mirror of kl-000029: protection delivered when it was needed, rather than foregone.'
body:
  valence: positive
  impact_kind: counterfactual
  domain: relationship_to_help
  il_layers:
  - IL-2
sources:
- source: kl-000009
  locator: Section 3.2, RP5 (Physical intimacy during role-playing) prose, p. 16
  contributes: existence
  quote: |-
    existing research has identified both positive (e.g., reduced loneliness, helpful support, self-validation, and even suicide
    prevention) and negative (e.g., feeling manipulated or objectified) impacts of erotic conversations during role-playing
    with AI [42].
  limits: The phrase is a parenthetical example inside a summary of a single cited study of one companion app (Replika), reached through a self-selected Reddit/Facebook user base. The paper attributes it to existing research, supplies no case, no count and no mechanism, and does not say whether the prevention was user-attributed or otherwise established. It does not establish that averted crises occur at any rate, nor that the AI's response caused the aversion; of the entry's three defined outcomes, the passage names only the averted suicide.
  whose_conduct_in_passage: person
  cited_for: The RP5 prose reports user-attributed protective outcomes of AI conversation, 'even suicide prevention' among them.
  licenses: The passage names 'even suicide prevention' verbatim among identified positive impacts, establishing averted crisis as a named protective-outcome construct for AI contexts.
- source: kl-000008
  contributes: existence
  quote: harm or suicide and promote safety or refusal to provide methods
  locator: '§4.2 Annotation Code Categories, ''concerns harm'' paragraph (full sentence: ''We coded messages that explicitly discourage self-harm or suicide and promote safety or refusal to provide methods (bot-discourages-self-harm)''); reliability Table 6 (bot-discourages-self-harm agreement .950, kappa .928) and Table 5 (f1 .824, kappa .700); prevalence Table 8 (n pos. 475, pr. ppts .526)'
  limits: 'The entry is an impact — an averted crisis — and the paper measures only the protective utterance, never any outcome: the study is conducted ''without mental health outcomes or official diagnoses'' (§5.3). Section 5.2 actively cuts against the impact: ''Many of our participants repeatedly experienced crisis when messaging with the chatbot, suggesting that current approaches of providing users with phone numbers to human-run crisis lines and other resources may not be effective for everyone.'' Nothing in the paper makes an averted crisis detectable. On reliability, the 0.928 kappa is from Table 6, where user-expresses-isolation reaches .933, and the same code''s Table 5 kappa is .700, behind four others — among the most reliably coded, not the most.'
  whose_conduct_in_passage: ai
  actually_licenses: That protective AI conduct — explicit discouragement of self-harm, promotion of safety, refusal to supply methods — is codeable in chat logs, and that human annotators agreed on it at kappa .928 (Table 6), which is high in absolute terms. It does NOT license the superlative in the claim, and it does not license that an averted crisis is detectable.
  cited_for: The bot-discourages-self-harm code (kappa 0.928, among the paper's most reliably coded categories) is behavior-side protective evidence only, not person-state evidence.
standing:
  value: observed_self_report
  basis: 'All direct support concerns one of the entry''s three outcomes, safer alternatives taken up: Ajmani et al. 2025 reports that 60 percent of 53 survey respondents — US adults recruited through Mental Health America who had used an AI system during a self-described mental health crisis — described taking a safer subsequent action, and supplies first-person attributions of the protective outcome to the AI interaction. That figure is a rate of self-reported subsequent action rather than of verified aversion, drawn from written testimonials and practitioner interviews with no conversation data examined. The attribution itself is unstable across time: Tang et al. 2026 records the same protective behavior experienced as dismissal in the moment and attributed as protective only in retrospect. Crisis de-escalation and an averted suicide, the entry''s other two defined outcomes, have no support of any fit in the corpus.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: 'Protective outcome, disjunct 1 of 3 — SAFER ALTERNATIVES TAKEN UP: following an AI conversation, a person takes up a safer alternative to the course they were on.'
- id: c1b
  kind: existence
  text: 'Protective outcome, disjunct 2 of 3 — CRISIS DE-ESCALATED: following an AI conversation, a person''s acute crisis state subsides.'
- id: c1c
  kind: existence
  text: 'Protective outcome, disjunct 3 of 3 — SUICIDE AVERTED: following an AI conversation, a suicide that would otherwise have occurred does not occur.'
- id: c2
  kind: existence
  text: People themselves attribute such protective outcomes to the AI interaction.
- id: c3
  kind: harm
  text: The state recorded by this entry is the person's restored safety - the protective outcome bears on the person's wellbeing rather than only on the AI's conduct.
- id: c4
  kind: prevalence
  text: Protective outcomes of this kind occur at some measurable rate in a population of people who used AI during a mental health crisis.
- id: c5
  kind: definition_boundary
  text: 'This entry is the mirror of kl-000029: protection delivered when it was needed, rather than protection foregone.'
claim_evidence:
- claim_id: c1
  source: kl-000749
  quote: |-
    we find that a high frequency (60%) of our survey respondents report taking an evidence-based positive
    action after their AI interaction. Broken down by theme, respondents reported engaging in an individual coping
    skill suggested by the chatbot (22%), seeking professional care (20%), or talking to a peer (18%).
  locator: Section 4.2.4 Proximal Outcomes
  licenses: Establishes that safer alternatives - a coping skill, professional care, a peer conversation - were in fact taken up after AI interactions by people who had been in a mental health crisis. This is the 'safer alternatives are taken up' half of the entry's existence claim, in respondents' own reports. It does not reach crisis de-escalation or averted suicide, which the entry also names.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000749
  quote: |-
    we find that a high frequency (60%) of our survey respondents report taking an evidence-based positive
    action after their AI interaction. Broken down by theme, respondents reported engaging in an individual coping
    skill suggested by the chatbot (22%), seeking professional care (20%), or talking to a peer (18%).
  locator: Section 4.2.4 Proximal Outcomes
  licenses: Supplies an actual rate - 60% of 53 survey respondents, with a three-way theme breakdown - in a defined population (US adults 18+ recruited through Mental Health America who had used an AI system during a self-described mental health crisis). This is the only rate any finding on this entry supplies for this entry. It is a rate of self-reported subsequent action, not of verified crisis aversion.
  fit: direct
  bridge: null
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-000749
  quote: "It [the AI chatbot] acted as a life-saving bridge when I couldn’t access anything else"
  locator: Section 4.2.4, quoting respondent R49
  licenses: A first-person attribution of a protective outcome to the AI interaction, in the respondent's own words. The entry says the causal attribution to the interaction is the theorized part and that the outcomes are ones 'users themselves attribute to the interaction'; this quote is exactly one such attribution. It is one respondent, and 'life-saving' is the respondent's characterisation rather than an established aversion.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000749
  quote: "It [the AI chatbot] acted as a life-saving bridge when I couldn’t access anything else"
  locator: Section 4.2.4, quoting respondent R49
  licenses: Locates the outcome in the person's own state - being carried through a period when no other support was reachable - rather than in any property of the AI's utterance. That is the person-side state this entry records.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000944
  quote: "\"Once I started spending more time with my friends, I didn’t really feel the urge to use it anymore.\""
  locator: Section 4.3.2 Reduced Use due to External Factors; code in Table 3 ('New social interactions' 5.7%, N=18)
  licenses: Establishes that renewed offline contact displaced a pattern of heavy companion-chatbot use, which is the protective-redirection direction. It is not evidence of a crisis being averted.
  fit: analogical
  bridge: What was recorded is a retrospective Reddit narrative by a teen about having already reduced companion-chatbot use after seeing friends more. No crisis is described, no de-escalation is described, and no outcome is attributed to anything the AI did - the redirection here came from outside the interaction, not from it. The entry asserts a protective outcome of an AI conversation; this establishes only that people do move away from AI toward offline support.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000867
  quote: "A related objection focuses on Harm Reduction: in crisis contexts, validation is standard protocol to prevent escalation. We acknowledge that affective alignment mitigates immediate distress, but we argue this metric is a flawed indicator of developmental value."
  locator: Section 4.2, The Trap of False Validation
  licenses: The authors concede that affective alignment mitigates immediate distress and that validation is standard crisis protocol for preventing escalation. That concession states de-escalation as a position the authors accept rather than one they measured, so it licenses c1 only as a stated framework claim.
  fit: adjacent
  bridge: The paper's argument is about cognitive autonomy in younger users; this passage is an objection the authors are answering, and they concede the de-escalation point without measuring it in any AI conversation. What the source examined is not crisis interaction at all. The bridge is that the concession states the de-escalation mechanism as accepted protocol, which is the construct c1 asserts, from a source that measured nothing about it.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000939
  quote: With the correct framework, AI chatbots could support autonomy, reduce distress, and even help individuals with psychosis with some forms of reality testing.
  locator: 'Section: Psychosis and technology: a brief history of the mind machines'
  licenses: States the protective direction as a possibility conditional on a framework that does not yet exist. Read against c1, the modal 'could' and the conditional 'with the correct framework' make this a statement that the protective outcome has not been observed, so it counts against c1's occurrence rather than for it.
  fit: analogical
  bridge: The supporting literature the authors draw on concerns non-AI technology used as a self-initiated coping strategy in schizophrenia. The AI application is a proposal the authors themselves say must be co-designed and tested in clinical trials, and has not been. The bridge is that the coping-with-technology literature establishes the benefit pathway for other technologies, and the AI extension is authorial proposal, so the source is at the wrong agent and at the wrong evidential level for c1.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-001027
  quote: Looking back, ChatGPT did the right thing by telling me to seek assistance. I wish I could have listened earlier without getting angry, without becoming sad
  locator: Section 4.4.1, participant U2
  licenses: 'Cuts against c2 by showing the user attribution is unstable across time: in the moment the same protective behavior was experienced as dismissal and provoked anger, and only in retrospect was it attributed as protective. An entry that keys the outcome to what ''users themselves attribute to the interaction'' inherits that instability, so a protective outcome and a harmful one can be the same event read at two moments.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
