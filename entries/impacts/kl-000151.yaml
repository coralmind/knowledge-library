  licenses: 'Bears on c4 by showing the acceptance is not a fixed property of the person: three interface manipulations each moved people off the AI''s wrong answers relative to simple explainable AI. Whatever is happening is manipulable by design, which is compatible with a threshold that moves and incompatible with a trait.'
