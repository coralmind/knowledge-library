- claim_id: c10
  source: kl-000551
  quote: "It is not always obvious when users over-rely on AI. Imagine an AI system that does tasks better than humans. Users make more accurate decisions when they over-rely on this system compared to when they work alone. When the human+AI team performs better than the human working alone, the situation seems acceptable and unproblematic."
