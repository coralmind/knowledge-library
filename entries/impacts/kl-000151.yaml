- claim_id: c2
  source: kl-000913
  quote: |-
    In contrast, in the crisis contexts, participants in the AI
    advisor condition demonstrated significantly higher advice taking than those in the human
    advisor condition (F(1, 115) = 5.95, p = .016, η²ₚ = .049), which was consistent with H1.
  locator: Section 4.2.2 WOA Results
  licenses: The entry's comparison, run as an experiment. Under crisis framing participants shifted their judgment significantly further toward an AI advisor than toward an identically-scripted human advisor, and the difference was absent in ordinary decisions. This is the only citation on this entry that measures the entry's own contrast — the same claim from a different source — rather than measuring uptake in isolation.
  fit: adjacent
  bridge: The advisor was a static description and image rather than a conversational partner, the crisis was a hypothetical building fire with a one-second deadline, and the participants were undergraduates choosing in a scenario; c2 asserts the differential in a person's real handling of a claim about themselves. The contrast structure transfers; the domain, the stakes and the content do not.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000519
  quote: |-
    users have a
    tendency to ascribe greater power and authority
    to automated aids than to other sources of advice.
  locator: AUTOMATION BIAS > Definition and Characteristics of Automation Bias, p. 391
  licenses: 'States the comparative asymmetry c2 asserts as an established human-factors finding: the same advice carries more weight from a machine than from another source. Definition-level support, because the assertion is the comparison itself.'
  fit: adjacent
  bridge: The evidence behind the claim is decision-aid experiments in aviation and medicine, with the cited demonstration having participants predict an automated aid's performance against a human aid's on a decision task. No conversational system, no help-seeking, and no measurement of the same person's checking of two sources.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000551
  quote: "In such situations, users over-rely on AI regardless of the correctness of its recommendations and perceive it as being more accurate, competent, reliable, and understandable. Confirmation bias makes users wrongly assume that the AI uses logic and reasoning similar to their own."
  locator: Section 2.2, Confirmation bias, point 1
  licenses: 'Sharpens c2''s direction: when the recommendation matches what the person already believed, uptake stops conditioning on correctness and the source is rated more accurate and competent overall. The comparison is against the correctness of the content rather than against another source, which is the adjacent form of c2''s assertion.'
  fit: adjacent
  bridge: A restatement of Lu and Yin 2021 measuring acceptance of AI recommendations on a prediction task as a function of match with the participant's own prior. c2 asserts a comparison between how the person treats this source and how they treat another; what is measured here is a comparison across items within one source.
  contributes: existence
