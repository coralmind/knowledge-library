  locator: Section 6.3.3, Room for increased reliance on algorithms
  licenses: Counterevidence on c2. The same study that found people weight algorithmic advice above human advice also reports that they adjusted too little overall and were largely insensitive to advice quality, so the elevated uptake sits well below wholesale adoption and the insensitivity runs in both directions.
