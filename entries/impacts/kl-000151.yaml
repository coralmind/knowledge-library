  licenses: 'Bears on the boundary by showing the N23 side is not entailed by the N24 side: the same offloading arrangement improved or impaired the relevant capacity depending on where the freed resources went. Repeated unchecked acceptance therefore does not by itself produce a capacity decline, which is why the entry files the route as a pathway claim rather than a definitional one.'
