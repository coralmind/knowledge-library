- claim_id: c4
  source: kl-000550
  quote: "Compared to the neutral condition, the sycophantic condition showed no statistically significant effect on feeling understood by other humans (d = −0.08, p = 0.295) or intellectual humility (d = 0.01, p = 0.861)."
  locator: Results, Feeling understood by AI grows with sustained use but does not provide downstream benefits
  licenses: Counterevidence on c4 with the right exposure duration. Three weeks of randomised unqualified affirmation produced no statistically significant effect on intellectual humility (d = 0.01, p = 0.861). Intellectual humility is not the verification threshold, but it is the nearest measured disposition, and a null on it after three weeks is the best evidence available that the durable state c4 asserts did not appear.
  fit: adjacent
  bridge: The measured construct is intellectual humility and feeling understood by other humans, not the person's checking of the system's output; the null bounds what a three-week sycophancy exposure did to a related disposition rather than testing c4 directly.
