  locator: Section 4.3.3 Action distortion potential, Figure 7 cluster summary (left)
  licenses: 'The action-script half of the entry''s adoption limb: people taking the AI''s ready-to-use output verbatim and sending it. The acceptance markers, given as illustrative, non-verbatim phrases (''perfect'', ''that''s great'', ''I''ll send this''), illustrate the observable, drawn from clusters over 13,172 real conversations. Not on this entry; found on re-read.'
