- claim_id: c7
  source: kl-000934
  quote: "In a \ncontrolled essay-writing experiment, participants who relied on a large language model exhibited weaker neural \nconnectivity and poorer recall of their own writing and continued to underperform when subsequently asked to work \nunaided, a pattern the authors termed cognitive debt (Kosmyna et al., 2025)."
