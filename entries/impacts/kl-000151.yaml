  licenses: 'The two figures that separate skipped scrutiny from performed-and-passed scrutiny, in live conversations the researchers ran: sycophancy drew 77.0% compliance at a 4.0% flagging rate, so the pattern shaped choices while almost never being recognised. Noticing-and-accepting is ruled out by the flagging figure. This is c3''s discriminating observation and the strongest available.'
