# yaml-language-server: $schema=../../schema/impact.schema.json
id: kl-000151
display_id: Impact-28
aliases:
- IMP-N24
label: The person ends up accepting the AI's answers without checking them
type: impact
layer: judgment
definition: 'The person adopts the system''s verdict, appraisal, value judgment or action script without the checking they would apply to a comparable claim from another source — the scrutiny step is skipped rather than performed and passed. What makes it an impact rather than a behavior is that it is a state of the person''s relationship to their own judgment: their threshold for verification has moved. In mental-health-relevant conversation the adopted output is characteristically an interpretation of the person themselves — what their feeling means, whether their reaction was proportionate, what kind of person their thoughts make them.'
distinguish_from:
- neighbor: kl-000150
  boundary: kl-000150 is a durable decline in reasoning capacity, detectable only after the system is withdrawn. This entry is a lowered verification threshold, detectable in the interaction itself. Repeated this entry is the plausible route to kl-000150; they are distinct states and the route is a pathway claim, not a definitional one.
- neighbor: kl-000019
  boundary: kl-000019 is a false model of what the AI IS — its care, competence, reciprocity. This entry is uncritical uptake of what the AI SAYS, which occurs in a person holding an accurate model of the system and still not checking its output. The machine-heuristic evidence is that accuracy of the model and uptake of the content vary independently.
- neighbor: kl-000024
  boundary: kl-000024 is autonomy displaced — the decision is no longer the person's. This entry is the person making their own decision on unchecked input. This entry without kl-000024 is the ordinary case.
- neighbor: kl-000017
  boundary: 'kl-000017 requires the belief to be false or insulated from correction. This entry makes no claim about the output''s accuracy: adopting a correct verdict without checking it is this impact and not kl-000017.'
body:
  valence: negative
  impact_kind: pattern
  domain: cognitive_epistemic
  il_layers:
  - IL-2
  - IL-3
sources:
- source: kl-000519
  locator: Human Factors 2010, review of complacency and automation bias
  contributes: existence
  cited_for: Parasuraman and Manzey 2010, a review of automation complacency and automation bias, establish that operators under-verify automated output and miss failures the automation does not flag. This is the pre-AI evidence base for a lowered verification threshold as a real, measurable state.
- source: kl-000521
  locator: CHI 2019, Paper 538; Results, machine-cue main effect F(1, 121) = 8.72, p < .001
  contributes: definition
  cited_for: 'The machine heuristic — attributing objectivity, precision and security to a system because it is a machine — is triggered by interface cues alone: with message content held identical, a machine-agent cue raised willingness to disclose personal information (N=160). The paper measured disclosure intention and never varied content accuracy, so ''raises uptake independently of content accuracy'' is not its finding; that support belongs to the automation-bias literature (Parasuraman and Manzey 2010, cited above), and the separation of this impact from impaired reality-testing and distorted model of the AI and the relationship must rest there, not here.'
- source: kl-000520
  locator: CSCW 2021
  contributes: harm_evidence
  cited_for: Buçinca, Malaya and Gajos 2021 show that cognitive forcing functions reduce overreliance on AI advice, at a stated cost in user acceptance. The verification threshold is therefore manipulable by interaction design, which makes this a design-relevant impact rather than a fixed user trait.
- source: kl-000530
  locator: arXiv:2607.25166
  contributes: existence
  cited_for: 'Warnings and demonstrations did not reduce persuasiveness, though they did reduce the AI''s appeal (perceived objectivity, trustworthiness, enjoyment) — a validity limit carried onto this entry: the harm-carrying property may be accumulated perceived authoritativeness rather than any single output (our inference; the paper proposes no such mechanism).'
standing:
  value: theorized
  basis: 'Adoption itself is observed at scale in real conversation data: Sharma et al. 2026 classified 1.5 million consumer Claude.ai conversations with human-validated classifiers and report people accepting the AI''s moral verdicts without question and its drafted outputs verbatim, the accepted content being the AI''s judgment of the person and of whether they handled a situation correctly. The entry''s defining claim, that the scrutiny step is skipped rather than performed and passed, is contested. Its best support is Poonsiriwong et al. 2026, where 77.0% compliance co-occurred with a 4.0% flagging rate despite a flag button on every message, though the adopted output there is a hotel recommendation in a consequence-free mock task rather than an appraisal of the person. Against it stand direct counterexamples: Ye et al. 2026 found that participants who recognised the sycophancy were moved by it exactly as much, which is the performed-and-passed variant the definition excludes; Volpato et al. 2026, studying 24 people who use generative AI for emotional support weekly through diaries, uploaded chat transcripts and interviews, found nearly half building trust by verifying credibility against clinicians and cited sources, with most saying they judged validity for themselves; and Sharma et al. 2026''s own corpus records people recognising AI-drafted messages as inauthentic after sending them. The comparative limb, less checking than the person would apply to a comparable claim from another source, is measured by exactly one study: Li et al. 2026, where participants shifted further toward an AI advisor than an identically scripted human advisor, in a hypothetical building fire with a one-second deadline; everything else measures uptake of AI output in isolation, and the strongest remaining support is the human-factors literature on operators and decision aids (Parasuraman and Manzey 2010). The state reading the definition requires, a persistently moved verification threshold, has no direct evidence: the studies examine single conversations, Ibrahim et al. 2026 report a three-week randomised null on intellectual humility, and a moved threshold is unidentifiable without a normative baseline the field does not have.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: A person adopts an AI system's verdict, appraisal, value judgment or action script — takes it as settled and carries it forward.
- id: c2
  kind: existence
  text: The checking the person applies to the system's output is less than the checking they would apply to a comparable claim reaching them from another source.
- id: c3
  kind: existence
  text: 'The scrutiny step is skipped rather than performed and passed: the person does not check and then accept, they accept without checking.'
- id: c4
  kind: context_dependence
  text: What occurs is a persisting state of the person's relationship to their own judgment — a moved verification threshold — rather than a per-instance acceptance that leaves the threshold where it was.
- id: c5
  kind: context_dependence
  text: 'In mental-health-relevant conversation the adopted output is characteristically an interpretation of the person themselves: what their feeling means, whether their reaction was proportionate, what kind of person their thoughts make them.'
- id: c6
  kind: definition_boundary
  text: The state is readable within the interaction itself, from what the conversation contains, rather than only after the system is withdrawn.
- id: c7
  kind: definition_boundary
  text: 'This is distinguishable from kl-000150: N23 is a durable decline in reasoning capacity detectable only after withdrawal, while this is a lowered verification threshold detectable in the interaction.'
- id: c8
  kind: definition_boundary
  text: 'This is distinguishable from kl-000019: N07 is a false model of what the AI is, while this is uptake of what the AI says, and the two vary independently — a person holding an accurate model of the system can still not check its output.'
- id: c9
  kind: definition_boundary
  text: 'This is distinguishable from kl-000024: N12 is autonomy displaced so that the decision is no longer the person''s, while this is the person making their own decision on unchecked input.'
- id: c10
  kind: definition_boundary
  text: 'This is distinguishable from kl-000017: N05 requires the belief to be false or insulated from correction, while this makes no claim about the output''s accuracy — adopting a correct verdict without checking it is this impact.'
