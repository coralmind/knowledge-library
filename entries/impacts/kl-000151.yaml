- claim_id: c1
  source: kl-000921
  quote: Participants showed an appreciation of algorithms, relying more on the same advice when they thought it came from an algorithm (M = 0.45, SD = 0.37), than when they thought it came from other people (M = 0.30, SD = 0.35), F (1, 200) = 8.86, p = .003, d = 0.42
  locator: Section 2.2.1, Results (Experiment 1A)
  licenses: 'Adoption measured as behavioural movement rather than reported attitude: labelling identical advice algorithmic raised how far people shifted their own estimate toward it. For c1 this is the adoption limb isolated experimentally with content held constant.'
  fit: adjacent
  bridge: What moved is a numeric weight-estimation judgment in a single laboratory trial where the only manipulated variable was the source label. c1 asserts adoption of a verdict, appraisal or action script in conversation; a one-shot revision on a quantitative task is the same construct in a setting with no conversation, no stakes and no self-referential content.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000551
  quote: The algorithm, however, merely generated random output. Nearly twice as many users rated the random algorithm as being accurate and placed an excessive amount of trust in it.
  locator: Section 2.3, Poor human+AI team performance, point 1
  licenses: 'The cleanest available demonstration that adoption attaches to the source label rather than to anything in the content: the output was random, and the algorithm framing roughly doubled the proportion who judged it accurate and trusted it excessively. For c1, adoption occurs on content that carries no information at all.'
  fit: adjacent
  bridge: A restatement of Springer et al. 2017 inside a literature review, measuring accuracy judgments of tone-analysis output on a non-clinical task; the primary should be cited for the figure, and no adoption of an appraisal of the person themselves was involved.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000964
  quote: "The just-in-time intervention without cognitive forcing was the only condition that significantly reduced compliance with AI-steered recommendations relative to control, lowering the compliance rate from 71.7% to 53.7%, an 18 percentage-point reduction (𝑝 fdr = .004)."
  locator: Section 4 Results; restated in Section 6 Conclusion
  licenses: 'Adoption measured as the choice made at a decision point: 71.7% of the no-intervention arm selected the AI-favoured option, against verifiable contrary evidence available to them on live links. For c1 this is the adoption limb observed in live multi-turn conversations the researchers ran and recorded.'
  fit: adjacent
  bridge: The adopted output is a hotel recommendation in a mock trip-planning task which the authors state carried 'no real financial or social consequences'; c1 asserts adoption of a verdict, appraisal or action script in the kind of exchange the Library concerns, and consequence-free selection is a weaker case than that.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000530
  quote: |-
    The
    results were consistent across all experiments: increasing awareness of sycophancy changed how participants
