  locator: Review, Implications for treatment
  licenses: 'The downstream form of adoption: the person arrives at psychiatric care carrying the AI''s conclusion about themselves as their own — ''ChatGPT says that I have bipolar disorder'' — with a medication demand attached. For c1 this establishes that the verdict is carried forward as settled rather than held as one input.'
  fit: adjacent
  bridge: The utterances are the authors' constructed examples characterising a presentation pattern in a review, not documented cases with transcripts; what the review evidences is what clinicians report patients bringing to the encounter, not an observed act of adoption inside a conversation.
  contributes: existence
