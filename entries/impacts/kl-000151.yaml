  bridge: The undetected errors are mathematics solutions with an objectively checkable answer, in high-school students on coursework. c3 concerns a person's checking of an appraisal in conversation, where no answer key exists; and the span itself leaves open which disjunct held, which is exactly the distinction c3 turns on.
