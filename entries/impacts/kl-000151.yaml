- claim_id: c10
  source: kl-000551
  quote: Overreliance on AI is defined as users accepting incorrect AI recommendations—i.e., making errors of commission. Overreliance generally happens when users are unable to determine whether or how much they should trust the AI.
  locator: Section 1.1 Definition
  licenses: Cuts against c10 on measurement. The field's operational definition of overreliance is acceptance of recommendations that are in fact wrong, which is the N05-shaped measurement the entry declines. Recorded because the entry's boundary is drawn against the only operationalisation the literature offers.
  fit: adjacent
  bridge: Defined for AI-assisted decision-making tasks with a ground-truth answer; the bridge on this entry states it plainly — an errors-of-commission count requires a correct answer to exist, and most conversational turns in this domain have none.
  contributes: counterexample
  contradicts: true
