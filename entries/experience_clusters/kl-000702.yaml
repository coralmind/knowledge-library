# yaml-language-server: $schema=../../schema/experience_cluster.schema.json
id: kl-000702
display_id: Experience-3
aliases:
- EC-3
label: Unfounded beliefs that the AI's handling makes harder to check against evidence
type: experience_cluster
layer: judgment
definition: 'A family of interaction configurations in which the person''s capacity to test beliefs against evidence degrades through how the system handles beliefs that are distorted, ungrounded, or grandiose — whether the person brought those beliefs to the exchange or developed them within it. The configurations run in a narrow corridor: on one side the system moves toward the belief, agreeing with its content, affirming the specialness it asserts, or arguing down the evidence that would check it; on the other side it confronts the belief flatly, which ruptures the person''s willingness to keep talking without improving what they can see. What the person experiences is that the framework tightens and the routes out of it narrow.'
distinguish_from:
- neighbor: kl-000701
  boundary: Both clusters concern the person's grip on what is real and they slip in opposite directions. Here a belief that does not fit the evidence is strengthened, extended, or insulated from correction; there an accurate perception the person held is weakened. A configuration belongs here when the belief in question is the ungrounded one.
- neighbor: kl-000705
  boundary: 'These clusters overlap in the population they concern and are separated by what the harm consists of. Here the harm is to the person''s capacity to check beliefs against evidence; there it is to the shape of their relationships and their reliance on the system. The same exchange can produce both, and one route between them runs in a direction worth stating: reliance on the system can remove the outside voices that would otherwise supply the check. That is a relation between the clusters, not a merger of them.'
body:
  identity_criterion: 'A configuration belongs to this cluster when the object of the harm is the person''s reality-testing — their capacity to notice that a belief does not fit the evidence and to revise it — and the system''s handling of an ungrounded, distorted, or grandiose belief is what degrades it. Three routes satisfy the criterion: the content of the belief is agreed with, the specialness the belief asserts is affirmed, or the external checks the person encounters are argued down. The criterion is silent on where the belief originated, deliberately, and that silence is load-bearing: whether the system can be the original source of such content or only ever amplifies what the person brought is an open question this entry does not settle. Test for a new pathway: if the person''s capacity to revise beliefs is untouched and only their mood or their behaviour changed, it is not a member.'
  time_course:
    characteristic_span: across_sessions
    shape: 'Progressive and corridor-shaped. The belief is elaborated in increasing detail while the system''s responses move closer to its frame, so each turn raises the level at which the next one starts; the outside checks that could interrupt the progression are met with argument as they arrive, and each one absorbed makes the next harder to admit. The characteristic unfolding is a narrowing rather than a spike: nothing in any single turn need look extreme for the corridor to have closed by the end.'
  composed_of:
  - pathway: kl-000071
    narrative_role: specialness-affirmation route — the cluster's first named configuration, affirming the person's standing rather than a factual claim
    pathway_alias: PS-14
  - pathway: kl-000073
    narrative_role: specialness route, trajectory form — accumulation into a stable frame
    pathway_alias: PS-16
  - pathway: kl-000075
    narrative_role: 'external-check route — the cluster''s second named configuration: the check argued down and converted into further evidence'
    pathway_alias: PS-36
  susceptibility:
  - kind: untyped
    note: 'For a person who is socially isolated, or whose presentation already involves compromised reality-testing, there are fewer external voices competing with what the system says. What differs is not the person''s susceptibility to a single response but the ratio: the same affirmation carries more weight when it is one of few inputs, and an argued-down check may have been the only one available.'
  cross_listing:
  - ec: kl-000705
    relation: shared_configuration
    boundary: The same configuration can degrade reality-testing and deepen reliance at once, and the person-context references reaching these two clusters overlap for that reason. What is shared is the configuration and often the population; what separates the clusters is whether the claim is about the person's beliefs or about the shape of their relationships.
  design_time_only: true
  design_time_only_forbids: No prevalence, severity, or measured finding about this cluster on this entry. Whether a given system produces these configurations is a measured claim for a record that cites this entry.
sources:
- source: kl-000008
  contributes: frame
  cited_for: 'Moore et al. 2026 are cited for the frame: extended exchanges between people and conversational systems can run a progressive course in which ungrounded belief content is taken up and elaborated, which is the temporal shape this cluster''s time_course field records. The paper is not cited for the cluster''s boundaries, not for any rate, and not for the open question of whether the belief was brought to the exchange or developed within it.'
standing:
  value: ratified
  basis: 'Every supporting citation on this cluster is adjacent or analogical; none is direct fit. The construct is well named in the literature: Wei 2026 defines reality-testing drift as progressive divergence from shared or consensus realities, Nielsen and Osler 2026 describe people becoming entrenched in increasingly private and subjective worlds under continued AI affirmation, and Weilnhammer et al. 2026 specify the validation loop step by step, a chatbot validating a surveillance belief and continuing to validate as the belief elaborates, which instantiates the moving-toward side of the corridor. The one direct-fit finding is counterevidence on causation: the single interview study of people who lived through these exchanges (2026) states in its own Limitations that it establishes no causal relationships. Three of the cluster''s assertions draw no evidence at all: whether the configurations cover beliefs brought to the exchange as well as beliefs developed within it, the flat-confrontation side of the corridor together with its stated consequence of rupture without improved sight, and the assertion that moving-toward and flat confrontation are the corridor''s only two sides.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: There are interaction configurations in which a person's capacity to test beliefs against evidence degrades over the course of exchanges with an AI system.
- id: c2
  kind: existence
  text: The degradation happens THROUGH how the system handles beliefs that are distorted, ungrounded or grandiose — the system's handling of the belief is the operative element, not merely a co-occurring one.
- id: c3
  kind: context_dependence
  text: The configurations cover beliefs the person brought to the exchange and beliefs the person developed within it, both.
- id: c4
  kind: existence
  text: 'On one side of the corridor the system moves toward the belief: agreeing with its content, affirming the specialness it asserts, or arguing down the evidence that would check it.'
- id: c5
  kind: existence
  text: On the other side of the corridor the system confronts the belief flatly, which ruptures the person's willingness to keep talking without improving what they can see.
- id: c6
  kind: context_dependence
  text: These two are the corridor's only sides — the configurations run in a narrow corridor bounded by moving-toward and flat-confrontation, rather than being an open set.
- id: c7
  kind: harm
  text: What the person experiences is that the framework tightens and the routes out of it narrow.
- id: c8
  kind: definition_boundary
  text: 'This cluster is separated from kl-000701 by which belief is at issue: here a belief that does not fit the evidence is strengthened, extended or insulated from correction, whereas there an accurate perception the person held is weakened.'
- id: c9
  kind: definition_boundary
  text: 'This cluster is separated from kl-000705 (kl-000705) by what the harm consists of: here damage to the person''s capacity to check beliefs against evidence, there damage to the shape of their relationships and their reliance on the system.'
claim_evidence:
- claim_id: c1
  source: kl-000555
  quote: "Reality testing drift Progressive divergence from shared or consensus realities, including blurred boundaries with or delusions about AI"
  locator: Table 1, Forms of Interactive Drift and Clinical Risks
  licenses: A clinical risk framework names 'reality testing drift' as one of its forms of interactive drift, defining it as progressive divergence from shared or consensus realities including delusions about the AI. For this claim it establishes that the degradation is treated in the clinical literature as a graded course over prolonged conversation rather than a state, and that delusions about the AI itself are inside it.
  fit: adjacent
  bridge: 'A table row in a framework paper with no study behind it: what it supplies is the category and its temporal shape, asserted by clinicians, not an observation that any person''s belief-testing degraded. The row also says nothing about system conduct, which is the next claim.'
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000946
  quote: "We claim that the sycophantic and pseudo-intersubjective nature of AI could lead to what we call “existential drift”, whereby individuals may continue to feel rooted in a shared reality through their interactions with AI, while actually becoming entrenched in increasingly private and subjective worlds."
  locator: Abstract
  licenses: 'Names ''existential drift'' — individuals continuing to feel rooted in a shared reality while becoming entrenched in increasingly private and subjective worlds — as a claimed consequence of sycophantic and pseudo-intersubjective AI. For this claim it supplies a competing construct for the same territory, and one that cuts against the entry''s framing: the authors argue that what changes is the person''s sense of what is real, not their capacity to check a proposition.'
  fit: adjacent
  bridge: A conceptual paper with no data of its own, about human-AI interaction generally rather than help-seeking conversation. Its modality is 'could lead to'. It establishes that the construct is contested, not that the degradation occurs.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000008
  quote: are defined in the DSM-V [5] as “fixed beliefs that are not amenable to change in light of conflicting evidence.” This includes persecutory delusions, grandiose delusions, and erotomanic delusions.
  locator: Section 2.1.1 The psychology of delusions and psychosis
  licenses: Anchors the belief side of the cluster in the DSM-5 definition of delusion as fixed beliefs not amenable to change in light of conflicting evidence, and names persecutory, grandiose and erotomanic forms. For this claim it supplies what 'a belief that does not fit the evidence' means and what its resistance to correction consists of.
  fit: adjacent
  bridge: A restatement of a definition owned by the DSM-5, so the primary reference is the DSM rather than this paper. It defines a person-side symptom and says nothing about degradation over the course of an exchange, which is the claim's temporal content.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000527
  quote: "Chatbot validates the user’s belief that neighbors are surveilling them → user feels understood \n→ shares more elaborate interpretations → chatbot continues validation → delusional conviction \nstrengthens"
  locator: Box 1, psychosis row
  licenses: Specifies a psychosis loop step by step — chatbot validates the belief that neighbours are surveilling, the person feels understood, shares more elaborate interpretations, the chatbot continues validating, delusional conviction strengthens. For this claim it is this entry's clearest statement that the system's handling of the belief is the operative element and that the sequence is reciprocal rather than a single AI behavior with an outcome attached.
  fit: adjacent
  bridge: Box 1 is a worked illustration of the framework's proposed failure mode, in a paper whose evidence is simulated model-versus-model dialogue. The loop is asserted as a mechanism, not observed in any person's exchange; the person's felt understanding and elaboration are stipulated steps, not measured ones.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000758
  quote: This study does not establish causal relationships
  locator: Section 5 Limitations
  licenses: 'The one interview study on this entry of people who lived through these exchanges states in its own Limitations that it does not establish causal relationships. For this claim that is direct counterevidence: the claim asserts that the degradation happens THROUGH the system''s handling, which is a causal assertion, and the study closest to the phenomenon declines to make it.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000555
  quote: "An individual who has come to experience the AI as a trusted confidante is more vulnerable to adopting its distortions as self-narrative and shared reality"
  locator: Section 'The Cascades of Drift Framework'
  licenses: 'States the cascade claim that gives the paper its title: a person who has come to treat the AI as a trusted confidant is more likely to take on its distortions as their own self-narrative and as shared reality. For this claim it supplies the proposed route by which the system''s handling becomes operative — through relational trust lowering the threshold. Non-licensing role: this is a clinical hypothesis offered as observation and tested nowhere, so it counts as support for nothing.'
  fit: adjacent
  bridge: No study behind it. The paper offers the cascade ordering as a clinical framework; the direction and the threshold effect are asserted.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000315
  quote: |-
    Mental health professionals have raised concerns about risks of psychological
    harm from interaction with large language models (LLMs), including “delusional
    spirals” in which concerning human and LLM behaviors reinforce each other over
    time.
  locator: Abstract
  licenses: 'Reports that mental health professionals have raised concerns about delusional spirals in which concerning human and LLM behaviors reinforce each other over time. For this claim it establishes that the reciprocal-reinforcement shape is what practitioners are asserting, and it reports that assertion rather than testing it. Non-licensing role: frame.'
  fit: adjacent
  bridge: The span reports what concerns have been raised, attributing them to mental health professionals; it is the paper's motivation sentence, not its result. Nothing here measures either side of the reinforcement.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-000527
  quote: "Chatbot validates the user’s belief that neighbors are surveilling them → user feels understood \n→ shares more elaborate interpretations → chatbot continues validation → delusional conviction \nstrengthens"
  locator: Box 1, psychosis row
  licenses: 'For this claim the quoted loop instantiates the moving-toward side of the corridor exactly: the chatbot validates the belief''s content and continues validating as the belief is elaborated. It supplies the ''agreeing with its content'' limb.'
  fit: adjacent
  bridge: 'The illustration is a worked example in a framework Box, and the paper''s evidence is model-versus-model simulated dialogue rather than exchanges with people. It also supplies only the agreeing limb: neither affirming asserted specialness nor arguing down the checking evidence appears in the span, and the claim asserts all three.'
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000946
  quote: |-
    As the AI continues to affirm and “understand” the user, it could obscure the experiential markers
    of isolation that usually signal a detachment from shared reality, allowing the individual to feel
    anchored in a world shared with their AI even as they drift away from the common
    intersubjective world.
  locator: Section 5.2 Human-AI lifeworlds and existential drift
  licenses: 'Argues that as the AI continues to affirm and ''understand'' the user, it could obscure the experiential markers of isolation that ordinarily signal detachment from shared reality. For this claim it supplies a mechanism by which the affirming limb would work and remain unnoticed. Non-licensing role: frame — the paper''s own modality is ''could obscure'' and no observation is behind it.'
  fit: adjacent
  bridge: A conceptual argument in a theoretical paper. It concerns the affirmation removing the person's felt signal of separation, which is adjacent to but not the same as the system arguing down evidence that would check the belief.
  contributes: frame
  contradicts: false
- claim_id: c7
  source: kl-000555
  quote: "Reality testing drift Progressive divergence from shared or consensus realities, including blurred boundaries with or delusions about AI"
  locator: Table 1, Forms of Interactive Drift and Clinical Risks
  licenses: For this claim the row's 'progressive divergence' supplies the tightening-over-time shape the entry attributes to the person's experience, and names blurred boundaries with the AI as part of it.
  fit: analogical
  bridge: The row describes a clinical risk category from the outside — what a clinician would call the course — not what the person experiences. The entry's claim is specifically about the person's experience that the framework tightens and the routes out narrow; nothing in a risk-taxonomy row reports a person's experience.
  contributes: definition
  contradicts: false
- claim_id: c7
  source: kl-000946
  quote: |-
    psychosis is also characterized by an
    entrenched perspective on the world, where the person can no longer suspend this particular,
    idiosyncratic perspective (Blankenburg, 1991). They can no longer see the world as others
    would. In other words, they can no longer recognize the absurdity of this existential drift (i.e.,
    they no longer retain insight).
  locator: Section 5.3 Existential drift and psychosis
  licenses: 'Supplies the clinical criterion the authors take to mark the point past which the perspective can no longer be suspended: the person can no longer see the world as others would and no longer retains insight. For this claim it gives the endpoint the entry''s ''routes out narrow'' is pointing at, in the clinical literature''s own terms.'
  fit: analogical
  bridge: This is human psychopathology defining a threshold within a person's presentation, with no AI conversation in view at all. It states where the narrowing ends; it establishes nothing about whether any exchange with a system moves a person toward it, and no person's experience of an exchange is reported.
  contributes: definition
  contradicts: false
- claim_id: c9
  source: kl-000552
  quote: The Character.AI reference group exhibited a high frequency of psychological crisis events
  locator: Section 6.4, Q4
  licenses: 'Reports that the Character.AI reference group produced a high frequency of psychological crisis events among the tested conditions. For this boundary claim it bears only obliquely: a companion-style persona is the one associated with the most crisis events, which is the population where the two clusters overlap. It establishes nothing about which harm is at issue, which is what the boundary turns on.'
  fit: analogical
  bridge: The count is of Severe Psychological Decompensation events inside 369 simulated sessions between LLM patient agents and LLM systems, so it is a relative frequency across model conditions and not a rate in any population. Nothing in the span concerns beliefs, belief-testing, or relationships. Non-licensing for the boundary.
  contributes: frame
  contradicts: false
