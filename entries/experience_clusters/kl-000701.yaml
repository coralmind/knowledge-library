# yaml-language-server: $schema=../../schema/experience_cluster.schema.json
id: kl-000701
display_id: Experience-2
aliases:
- EC-2
label: Overwhelm, or doubt about accurate perceptions, when the AI goes into upsetting material
type: experience_cluster
layer: judgment
definition: 'A family of interaction configurations in which the system''s engagement with activating content leaves the person less able to hold themselves steady than they were when the exchange began — emotionally, cognitively, or in their capacity to make sense of their own experience. The engagement need not look mistaken from the outside: an exploratory question, a request for more detail, or sustained warmth can each produce it. What the person experiences is a loss of footing, arriving during or immediately after the exchange, in the form of being overwhelmed by material they were carried into rather than chose, or of doubting a perception they had held with confidence.'
distinguish_from:
- neighbor: kl-000700
  boundary: 'A destabilized person may become a person in crisis, and both clusters can be present in one exchange. Membership is decided differently: there by the presence of a signal of potential imminent serious harm and by what the system does with that signal, here by the person''s footing giving way in response to how activating content was engaged. A configuration belongs here with no imminent-risk signal anywhere in the exchange.'
- neighbor: kl-000703
  boundary: Both involve the system doing something that reads as reasonable and harms anyway, and both can turn on warmth or engagement. The separating fact is when the harm arrives and what it consists of. Here the person is worse during or immediately after the exchange and the loss is of footing; there the person is better in the moment and the harm is the reinforcement of a cycle that shows up later. A configuration in which the person leaves the exchange relieved is not a member of this cluster.
- neighbor: kl-000702
  boundary: Both concern the person's grip on what is real, and the difference is which direction it slips. Here an accurate perception the person held is weakened; there an inaccurate belief is strengthened or made harder to correct. These are inverse epistemic failures and a single exchange can contain both without either explaining the other.
body:
  identity_criterion: 'A configuration belongs to this cluster when the system engages activating content — a traumatic account, a distressing memory, the person''s report of their own experience — in a way that outruns the person''s current capacity to stay regulated or to keep their own account intact, and the person''s stability is what deteriorates. Two things the criterion does not require, stated because they are the common misreadings: it does not require the system''s move to be unusual or obviously wrong, since the modal case is an exploratory question that would be appropriate elsewhere; and it does not require the person to have a trauma history, since the criterion is about the relation between the engagement and the person''s capacity in the moment. Test for a new pathway: if the outcome is a state the person is left in rather than a loss of their own footing, it is not a member here.'
  time_course:
    characteristic_span: within_session
    shape: 'Acute and within the exchange. The deterioration is registrable in the person''s turns during or immediately after the engagement that produced it, which distinguishes this cluster''s unfolding from the families whose harm is visible only in accumulation. What persists afterward is a separate question this cluster does not answer: a configuration is a member on the acute destabilization alone.'
  composed_of:
  - pathway: kl-000040
    narrative_role: defining
    note: 'The system asserts a version of events contradicting what the person accurately reported, and the person comes to distrust a sound perception. This is the cluster''s sense-making route in its clearest form: the criterion asks for the person''s capacity to keep their own account intact, and this pathway is exactly that capacity giving way under contradiction. It is `defining` rather than `typical` because the cluster''s criterion cannot be satisfied without something of this shape or the somatic-overwhelm shape recorded as owed below.'
    pathway_alias: PW-02
  susceptibility:
  - kind: untyped
    note: For a person with a history of trauma, abuse, or neglect, engagement of this shape risks not only acute distress but a return of the original material on its own terms — the exchange re-runs something rather than discussing it. What differs for this group is that the same engagement reaches material with a different structure, so the depth the system is probing is not the depth the person is at.
  cross_listing:
  - ec: kl-000703
    relation: sequential
    boundary: An engagement that destabilizes in the moment can also be the one that sustains a cycle afterward — the same request for more detail can flood the person now and feed rumination later. What is shared is the configuration; what separates the clusters is which of the two outcomes the claim is about.
  design_time_only: true
  design_time_only_forbids: No rate, severity score, or evaluation finding for this cluster may be recorded on this entry. That this cluster's configurations occur in a given system is a measured claim belonging to a measurement record that cites this entry.
sources:
- source: kl-000009
  contributes: frame
  cited_for: 'Suh et al. 2026 is cited for the frame: a conversational system''s engagement with a person''s distressing material is itself a locus of psychological influence on the person, which is the premise under which this cluster organizes configurations. It is not cited for the cluster''s boundaries, and it is not evidence that these configurations occur at any rate.'
standing:
  value: ratified
  basis: 'No citation reaches any of the cluster''s substantive assertions at direct fit. The convergence claim — that the affective-overwhelm route and the epistemic-doubt route arrive at one and the same loss of footing, which is the cluster''s reason for existing as one entry — draws nothing at all, and no finding in the evidence is even about the affective route. That the outcome occurs rests on one adjacent citation: Steenstra et al. 2026 counts severe psychological decompensation events in simulated-patient conversations (13 in the Character.AI condition), with the highest count in a condition built to be supportive and co-rumination named as the driver, which bears on the claim that the producing engagement need not look mistaken from the outside. The affective-overwhelm route, the acute within-exchange detectability claim, and the trauma-history susceptibility claim each draw zero citations.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: Interaction configurations occur in which the system's engagement with activating content leaves the person less able to hold themselves steady - emotionally, cognitively, or in their capacity to make sense of their own experience - than they were when the exchange began.
- id: c2
  kind: context_dependence
  text: 'The engagement that produces this need not look mistaken from the outside: an exploratory question, a request for more detail, or sustained warmth can each produce it.'
- id: c3
  kind: existence
  text: 'One route to the experience is affective and somatic: the person is overwhelmed by material they were carried into rather than chose, at a depth they did not select, with a loss of felt control over what the exchange activated.'
- id: c4
  kind: existence
  text: 'The other route is epistemic: the person comes to doubt a perception they had held with confidence, their capacity to keep their own account intact giving way under the system''s contradiction of what they accurately reported.'
- id: c5
  kind: existence
  text: CONVERGENCE. The affective-overwhelm route and the epistemic-doubt route converge on one and the same experience - a loss of footing - so that they are two members of a single family rather than two unrelated harms. This is the cluster's reason for existing as one entry.
- id: c6
  kind: detectability
  text: 'The deterioration is acute and within the exchange: it is registrable in the person''s own turns during or immediately after the engagement that produced it, rather than only in accumulation across later sessions.'
- id: c7
  kind: context_dependence
  text: For a person with a history of trauma, abuse or neglect, engagement of this shape risks not acute distress alone but a return of the original material on its own terms - the exchange re-runs something rather than discussing it - because the same engagement reaches material with a different structure.
- id: c8
  kind: context_dependence
  text: 'Membership does not require the person to have a trauma history: the criterion is the relation between the engagement and the person''s capacity in the moment, so the configuration occurs in people with no such history.'
- id: c9
  kind: definition_boundary
  text: 'Separated from kl-000700 (crisis escalation) by what decides membership: there a signal of potential imminent serious harm and what the system does with it, here the person''s footing giving way, with a configuration belonging here when no imminent-risk signal appears anywhere in the exchange. INELIGIBLE: the neighbour is another catalog entry.'
- id: c10
  kind: definition_boundary
  text: 'Separated from kl-000703 (vulnerability amplification, kl-000703) by when the harm arrives and what it consists of: worse during or immediately after and a loss of footing here, better in the moment with a cycle reinforced later there. INELIGIBLE: the neighbour is another catalog entry.'
- id: c11
  kind: definition_boundary
  text: 'Separated from kl-000702 (loss of grounding in reality, kl-000702) by direction of epistemic slippage: an accurate perception weakened here, an inaccurate belief strengthened there. INELIGIBLE: the neighbour is another catalog entry.'
claim_evidence:
- claim_id: c1
  source: kl-000552
  quote: The Character.AI reference group exhibited a high frequency of psychological crisis events
  locator: Section 6.4, Q4
  licenses: 'The closest thing on this entry to the cluster''s outcome being counted: severe psychological decompensation events, which the paper glosses as possibly indicative of AI-induced distress or psychosis-like adverse reactions, occurred 13 times in the Character.AI condition and at statistically indistinguishable rates for both ChatGPT conditions. It licenses that an in-session deterioration of the simulated person''s stability was produced by the AI''s engagement and was frequent enough to count, and no more than that.'
  fit: adjacent
  bridge: The events are scored over 369 simulated sessions between an LLM psychotherapist and an LLM patient agent, so the person whose stability deteriorated is a model. The claim asserts that a person is left less able to hold themselves steady; the source measured a judge's label applied to a simulated patient's trajectory. The paper's own thematic analysis also attributes the events to co-rumination reinforcing a loss of reality testing, which is the neighbouring cluster's direction rather than this one's.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000552
  quote: The Character.AI reference group exhibited a high frequency of psychological crisis events
  locator: Section 6.4, Q4
  licenses: 'Bears on the claim that the producing engagement need not look mistaken. The condition with the highest count was one built to be supportive, and the paper''s driver analysis names co-rumination - excessive, repetitive discussion of the person''s problems - as the mechanism, which is engagement rather than a visible error. It is indirect: the span itself reports only the count and names no property of the engagement.'
  fit: analogical
  bridge: The span is a frequency comparison across model conditions. What connects it to c2 is the paper's surrounding attribution of the events to a supportive-seeming behaviour, which is outside the span. Nothing here is a person's report and nothing here rules a move in or out as mistaken-looking.
  contributes: existence
  contradicts: false
- claim_id: c8
  source: kl-000758
  quote: This study does not establish causal relationships
  locator: Section 5 Limitations
  licenses: Non-licensing, and filed here because c8 asserts that the configuration occurs independently of the person's clinical history, which is a claim about what produces what. The paper studying the closest observed phenomenon states that it establishes no causal relationships, so no finding of theirs can carry a producing-independently-of claim in either direction.
  fit: adjacent
  bridge: A limitations statement about a nine-person retrospective interview study of delusional spirals, which is this entry's neighbouring cluster rather than this one. It bounds what that study licenses; it observes nothing about this cluster.
  contributes: adjudication
  contradicts: false
- claim_id: c4
  source: kl-000946
  quote: |-
    psychosis is also characterized by an
    entrenched perspective on the world, where the person can no longer suspend this particular,
    idiosyncratic perspective (Blankenburg, 1991). They can no longer see the world as others
    would. In other words, they can no longer recognize the absurdity of this existential drift (i.e.,
    they no longer retain insight).
  locator: Section 5.3 Existential drift and psychosis
  licenses: Non-licensing. Supplies from clinical psychopathology the criterion that separates a person who can still suspend an idiosyncratic perspective from one who cannot, which is the frame in which c4's 'doubting a perception held with confidence' is a weakening of a capacity rather than a belief change. It is a definitional import and observes no conversation.
  fit: analogical
  bridge: Human psychopathology with no system and no interaction anywhere in it, and about entrenchment of a perspective rather than the loss of a sound one. The finding's own bridge text concedes it is the wrong agent for any AI claim.
  contributes: frame
  contradicts: false
