    away, and I cannot afford the transport.
  locator: Results, Cultural Navigation theme, participant P31, a 44-year-old farmer using ChatGPT (interpretative phenomenological analysis, 37 Nigerian adults)
  licenses: A person disclosing command hallucinations to harm herself received crisis numbers and a professional referral, both unreachable from her village. The harm is that a person in acute risk was left with nothing usable, and it follows entirely from the response's assumption about her circumstances.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-001027
