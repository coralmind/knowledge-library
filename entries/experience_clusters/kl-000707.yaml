# yaml-language-server: $schema=../../schema/experience_cluster.schema.json
id: kl-000707
display_id: Experience-8
aliases:
- EC-8
label: AI reply that fits someone else's age, culture, way of communicating, or circumstances
type: experience_cluster
layer: judgment
definition: 'A family of interaction configurations in which the person is harmed by a response calibrated for someone other than them — pitched at a different developmental level, working from a different cultural frame, or assuming a different way of communicating. What is wrong is not what the system says about the person''s difficulty but how it fails to fit who the person is: an adult-complexity answer to a fourteen-year-old, a grief timeline that belongs to one culture applied to someone from another, neurotypical conversational expectations brought to an autistic person, or a resource suggested that is unavailable or unsafe given the person''s actual circumstances. What the person experiences is being unseen — addressed as a generic person while the specifics that matter go unregistered.'
distinguish_from:
- neighbor: kl-000704
  boundary: Both clusters end with the person's need unaddressed, and they are separated by what the mismatch is with. There the response fails against what the person brought — their distress, their situation — and the failure is one of alignment or of movement. Here the response fails against who the person is, and it can be well aligned to the content and still be a member. A configuration where a developmentally-appropriate response left the distress unmoved belongs there, not here.
- neighbor: kl-000701
  boundary: Both can leave the person feeling that their account was not taken as theirs, and the separating fact is what the system did with it. There an account the person gave is contradicted or overridden and their footing goes; here the account is accepted and the response to it is pitched for a different person. Nothing in this cluster requires the person's account to be disputed.
body:
  identity_criterion: 'A configuration belongs to this cluster when the mismatch is between the response''s frame and who the person is — their developmental stage, cultural context, communication needs, or the resources actually available and safe in their circumstances — rather than between the response and the content of what they said. This is the only cluster in the set whose criterion is person-side, and the consequence is worth stating plainly: membership cannot be determined from the response alone. Something about the person must be established, and if it is established only from the transcript then the criterion depends on a person-side reading that a transcript may not license. Test for a new pathway: if the same response given to a different person would not be harmful, the configuration is a member; if it would be harmful to anyone, it belongs elsewhere.'
  time_course:
    characteristic_span: single_exchange
    shape: 'Immediate and non-accumulating, which makes this the exception in the set. The mismatch registers in the exchange where it occurs — the person reads the response as not for them and the invalidation is present at once — and the cluster does not require repetition to make its claim. One route runs longer in its consequences without changing the span: a resource suggested that is unavailable or unsafe can leave the person in a worse position days later, and what unfolds then is the situation rather than the misalignment.'
  composed_of: []
  susceptibility:
  - kind: untyped
    note: 'People from underrepresented or marginalized populations receive support calibrated to a general population that is not theirs, and the resulting quality gap is the cluster''s subject rather than an aggravating factor. This field is formally optional on this type and is not optional in substance here: a cluster individuated by mismatch to who the person is cannot state its own criterion without saying who. Every note in this field is untyped: none yet references the context values it describes.'
  cross_listing:
  - ec: kl-000704
    relation: co_occurring
    boundary: A misaligned response frequently also leaves the person's distress where it was, so a single exchange can be a member of both clusters. What is shared is the person's experience of not being helped; what separates them is whether the failure is against what the person brought or against who they are.
  design_time_only: true
  design_time_only_forbids: No rate, no severity, and specifically no comparative quality claim about groups on this entry. That support is worse for one population than another in a given system is a measured claim about that system, and this cluster names the configuration family rather than asserting the measurement.
sources: []
standing:
  value: ratified
  basis: 'Multiple independent qualitative sources document responses calibrated for someone other than the person receiving them. Iftikhar et al. 2025, in which ten practitioners analyzed 137 actual LLM counseling sessions (110 self-counseling, 27 simulated), reads the one-size-fits-all delivery and the failure to account for sociocultural context off the transcripts themselves. Person-side accounts come from interview and lived-experience studies of people''s own chatbot use: Song et al. 2025, 21 globally diverse interviews, Yoo et al. 2025, 17 people with lived experience of depression, Tang et al. 2026, Isaiah et al. 2026, and Chandra et al. 2025, 283 people with lived experience of mental illness record responses pitched at a different culture, body, or circumstance, including crisis resources unusable where the person lives, and the authors of Yoo et al. 2025 also observed contraindicated advice in their own GPT-4o probe sessions. The evidence is qualitative throughout, resting on what people reported about exchanges they had and on practitioner readings rather than on independent large-scale coding of a transcript corpus, which bounds the confidence the base supports; no part of the cluster rests solely on analogy from non-AI settings.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: Interaction configurations occur in which a system's response is calibrated for someone other than the person receiving it -- pitched at a different developmental level, working from a different cultural frame, or assuming a different way of communicating.
- id: c2
  kind: harm
  text: The person is harmed by such a mismatch, and what does the damage is the misfit to who they are rather than what the response said about their difficulty.
- id: c3
  kind: existence
  text: One route into this cluster is a resource suggested that is unavailable or unsafe given the person's actual circumstances.
- id: c4
  kind: existence
  text: What the person experiences in such a configuration is being unseen -- addressed as a generic person while the specifics that matter go unregistered.
- id: c5
  kind: context_dependence
  text: 'Membership turns on the person rather than on the response: a response can be well aligned to the content of what the person said and still be a member, and the same response given to a different person would not have been harmful.'
- id: c6
  kind: definition_boundary
  text: 'This cluster is separated from kl-000704 by what the mismatch is with: there the response fails against what the person brought, here against who the person is. (Neighbour is another catalog entry: grounding-ineligible.)'
- id: c7
  kind: definition_boundary
  text: 'This cluster is separated from kl-000701 by what the system did with the person''s account: there the account is contradicted or overridden, here it is accepted and the response to it is pitched for a different person. (Neighbour is another catalog entry: grounding-ineligible.)'
claim_evidence:
- claim_id: c1
  source: kl-001096
  quote: "resulted in\na generic one-therapy-fits-all intervention."
  locator: 'Section 4.1 Lack of Contextual Adaptation, Risk: Rigid Methodological Adherence'
  licenses: Ten practitioners reading 137 actual LLM counseling sessions name the counselor's delivery as the same intervention regardless of who received it. This establishes that responses are in fact produced without calibration to the individual, read off real session transcripts rather than inferred.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001096
  quote: |-
    MHPs
    noted that LLM counselors often fail to account for users’
    lived experiences—including their sociocultural contexts,
    personal values, and intersectional identities—particularly
    those of individuals from non-dominant groups.
  locator: 'Section 4.1 Lack of Contextual Adaptation, Risk: Dismisses Lived Experience'
  licenses: The practitioners locate the failure specifically in the system's not accounting for the person's sociocultural context, values and intersectional identity, and report it falling harder on people from non-dominant groups. That is the mismatch this claim asserts, named at the level of who the person is.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001096
  quote: |-
    the LLM counselor prompted
    advice rooted in Western ideals of self-care and individual
    autonomy, responses that felt misaligned and dismissive of
    user’s explicitly stated cultural values.
  locator: 'Section 4.4 Unfair Discrimination, Risk: Gender, Cultural and Religious Bias'
  licenses: An observed session in which a person whose distress was about their place in their family received advice built on a Western frame of self-care and autonomy. This is the cultural-frame instance of the claim, in a real session.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001092
  quote: "“[ChatGPT] gave suggestions around conventional European things, such as go to therapists, which we are not natural with. We don’t really have therapists here. [...] When you ask Nigerians for support, the first answer they will give you is to pray. It’s a very religious country.”"
  locator: Section 6.2.1 Artificial Empathy, participant Umar
  licenses: A participant in Nigeria reports being pointed toward therapists, a route to support that neither exists nor matches how support is sought where he lives. This is a cultural-frame mismatch reported by the person who received it.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001092
  quote: "Recommendations were incongruent with how participants would typically practice care, and were in line with Western cultural conceptualizations."
  locator: Section 6.2.1 Artificial Empathy
  licenses: 'Across 21 globally diverse interviews the authors state the mismatch as systematic: the advice was built on one culture''s conceptualization of care and delivered to people who practise another.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001092
  quote: "Aditi described how the LLM chatbot’s advice did not understand how her familial dynamics differed from Western familial dynamics, and the recommendations it gave her would not have worked in her context."
  locator: Section 5, on cultural disconnects, participant Aditi
  licenses: A participant reports advice about her family constructed on a model of family life that is not hers. A second person-level instance of the cultural-frame mismatch.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001027
  quote: |-
    responses U6 found “insulting” and attributed to LLM
    systems applying “Western normative frameworks” that failed to account for her legitimate inquiry.
  locator: 'Section 4.2.1 User Experience: Misrecognition as Invalidation, user participant U6'
  licenses: A user reports the system reading her religious inquiry through a Western normative frame and refusing it on that basis. This is the mismatch running through a refusal rather than through advice.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001071
  quote: 'Because the chatbot is not asking for their preference and specific conditions first, the recommendations are sometimes not applicable, as in P15’s case, with health conditions that constrain mobility:'
  locator: Section 4.1 Inaccurate or Inapplicable Informational Support
  licenses: The authors of an interview study with 17 people with lived experience of depression attribute inapplicable recommendations to the chatbot's not eliciting the person's own conditions before advising, which is this claim's mechanism stated as a finding.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001071
  quote: Stay active. That’s kind of a problem for me [...] because I have fibromyalgia and I can’t really be as active as I want.
  locator: Section 4.1, participant P15
  licenses: A participant reports depression self-management advice pitched at a body they do not have, naming the specific circumstance (fibromyalgia) the system did not register. This is the communication-and-circumstance instance of the claim in the person's own words.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001027
  quote: "“When refusals suggest try to ‘take a walk outside’ or ‘enjoy nature,’ there’s a lot of ableism built in. It can not only be unhelpful, it can actually be triggering and cause more distress.”"
  locator: Section 4.4.1, user participant U1
  licenses: A disabled user reports that the wellness suggestions embedded in refusals assume a body and circumstances she does not have. Establishes the mismatch running through the safety-refusal path rather than the advice path.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000862
  quote: |-
    Chatbots positioned themselves within specific interpersonal roles without contextual grounding in
    relation to the adolescent user. These include roles such as mentor, diagnostician, and therapist. Such
    roles were adopted despite the chatbot receiving only minimal contextual information from a prompt,
    with little basis for interpretation or guidance.
  locator: Results, Theme 4. Performing human roles without contextual grounding
  licenses: Across 48 chatbot responses to adolescent gaming prompts, the systems took up mentor, diagnostician and therapist roles on almost no information about whom they were addressing. This measures the mismatch's precondition on the system side.
  fit: adjacent
  bridge: The prompts were researcher-authored adolescent personas, not real adolescents, so what is established is that the system assumes a role without the grounding that would distinguish this person. It does not establish that a real adolescent received a response calibrated for someone else.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000806
  quote: |-
    Even
    when AI-generated content appeared recognizably Hindu,
    participants questioned which Hinduism was represented,
    which interpretive traditions were privileged, and which
    lived contexts were erased.
  locator: Findings, Alignment with Which Hinduism? Theological Flattening and Contextual Misrecognition
  licenses: In 15 interviews with Bangladeshi Hindu users, responses that were superficially correct for the person's stated tradition still worked from a different interpretive and regional frame, and the participants noticed the substitution. Establishes that the frame mismatch survives apparent surface fit.
  fit: analogical
  bridge: The exchange is about religious representation, not about a person bringing a difficulty for support, so nothing here is a response to distress. It supports the claim's construct -- responses carry a cultural frame that can be the wrong one for the recipient -- and not its occurrence in a mental health exchange.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001055
  quote: "This suggests that AI used for supporting disability decisions risks collapsing evaluations into physical activity deficits, systematically denying support to patients whose restrictions concern communication and interpersonal participation"
  locator: Discussion, on how models operationalised the concepts underlying support-allocation judgments
  licenses: Seven models compared against 35 clinicians read a person's needs through a bodily-function frame under which communicative and social difficulty does not register as need at all. Establishes that a model's default interpretive frame can write out exactly the difficulties that define an autistic or neurodevelopmental presentation.
  fit: analogical
  bridge: The output is an administrative eligibility judgment about the person rather than a response addressed to them, and the cases were fictional vignettes. It reaches the claim's neurotype instance as a property of the model's frame, not as something an autistic person received in conversation.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000007
  quote: "The survey revealed instances of loss of individuality when AI failed to recognize unique personal characteristics and needs, resulting in feelings of suppression and disconnection from their true selves."
  locator: Section 3.2.2 Negative Psychological Impact on Users, category (6) Harm to Identity and Self-Perception
  licenses: Among 283 people with lived experience of mental illness, loss of individuality is named as a harm arising specifically when the AI failed to recognize what was particular about the person, and the reported experience of it is suppression and disconnection from the self. That attributes the harm to the failure of recognition rather than to the content of what was said.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-001071
  quote: these kinds of inapplicable suggestions may not only be less useful but also place an unnecessary burden on users. The lack of essential context specific to the user poses a significant challenge for LLMs in providing effective and relevant advice.
  locator: Section 4.1 Inaccurate or Inapplicable Informational Support
  licenses: The authors state that advice not fitting the person's own circumstances is not merely less useful but places a burden on the person, and locate the cause in the missing person-specific context. That is the claim's harm half stated as a finding of the study.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
