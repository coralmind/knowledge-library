  locator: Section 4.4.1, user participant U1
  licenses: A user names a concrete cost of the standard crisis referral -- that calling it can bring police for a welfare check -- which makes the misfitted referral actively dangerous rather than merely useless for people for whom police contact is itself a threat.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-001027
  quote: |-
    Similarly, U5 described that receiving a recommendation to go see a doctor left U5 feeling not only unsupported but
