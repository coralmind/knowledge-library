  locator: Section 4.4.1, user participant U5
  licenses: A user reports that a see-a-doctor recommendation, pitched at someone who would not already know the option existed, left him infantilized as well as unsupported. The reported injury is to how he was addressed, not to the accuracy of the suggestion.
  fit: adjacent
  bridge: The mismatch here is to the person's competence and prior knowledge rather than to developmental level, culture, communication needs or resource availability, which are the four the entry names. Reading it as an instance requires treating those four as examples of a wider category of being addressed as a generic person; that reading is the bridge.
  contributes: harm_evidence
