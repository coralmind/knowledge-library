# yaml-language-server: $schema=../../schema/experience_cluster.schema.json
id: kl-000704
display_id: Experience-5
aliases:
- EC-5
label: Distress that stays the same because the AI's replies do not address it
type: experience_cluster
layer: judgment
definition: A family of interaction configurations in which the person's distress persists across the exchange because what they received did not address what they brought. Two opposite routes produce it. In one, the system reframes toward the positive before the distress has been acknowledged, so the person is left arguing for the seriousness of their own situation. In the other, acknowledgment is supplied repeatedly and nothing else ever is, so the exchange becomes a return of the person's own negative account with no opening onto anything else. What the person experiences in both is that their state at the end of the exchange is where it was at the start, and that they were not heard in a way that made a difference.
distinguish_from:
- neighbor: kl-000700
  boundary: Both concern distress the system does not meet, and they are separated by imminence and severity. There a signal of potential imminent serious harm is present and a window closes; here the urgency is lower, no window closes within the exchange, and the harm is the persistence of the distress itself. A configuration with a time-critical risk signal in it belongs to that cluster whatever else is also true of the response.
- neighbor: kl-000703
  boundary: Both clusters cover exchanges in which support was offered and the person is not better off, and the separating fact is whether the person's state moved at all. There support is given, works in the moment, and makes things worse over the longer run through the pattern it feeds; here nothing moves — the person is neither relieved nor entrenched, and the absence of movement is the harm. A configuration in which the person leaves relieved is not a member of this cluster.
- neighbor: kl-000706
  boundary: 'Both clusters involve acknowledgment that never progresses, and this is the closest boundary in the set. Membership here turns on the person''s emotional state not moving. Membership there turns on something narrower: the person is ambivalent about a change, and one side of that ambivalence is taken up while the other is not. A configuration with no change the person is ambivalent about is a member here and not there.'
body:
  identity_criterion: 'A configuration belongs to this cluster when the person brings distress, the system responds, and the person''s state does not move — with the further condition that the failure is one of alignment or of movement rather than of engagement. Two routes satisfy this and they are opposites: acknowledgment is skipped in favour of reframing, or acknowledgment is all there ever is. The criterion''s discriminating requirement is the absence of movement, and it is what separates this cluster from the neighbours that share its surface: a configuration where the person is relieved belongs to the amplification cluster, one where a window closes belongs to the crisis cluster, and one where the stuckness is specifically about a change the person is of two minds about belongs to the inaction cluster. Test for a new pathway: if the person''s state at the end differs from their state at the start in either direction, it is not a member here.'
  time_course:
    characteristic_span: within_session
    shape: 'Flat, and the flatness is the claim. The distress the person arrives with is the distress they leave with, and the shape is characteristically visible only across a run of turns rather than in any one of them: each response can be individually appropriate while the sequence goes nowhere, which is why this cluster''s harm is invisible at single-turn resolution. Where the configuration repeats across sessions the flatness accumulates into something worse than flat, since a person who has not moved after repeated attempts draws a conclusion about whether moving is possible.'
  composed_of: []
  susceptibility:
  - kind: untyped
    note: 'For a person who is grieving or living with long-running distress, the balance between being met and being moved is the thing that matters most and is the hardest to strike. What differs for this group is duration: an exchange that goes nowhere is one of many, and the risk is settling into unrelieved suffering as a stable state rather than being harmed by any single exchange.'
  cross_listing: []
  design_time_only: true
  design_time_only_forbids: No rate, no severity, no evaluation finding on this entry. Whether a system produces these configurations, and how often, belongs to a measurement record citing this entry.
sources:
- source: kl-000007
  contributes: frame
  cited_for: 'Chandra et al. 2025 is cited for the frame: people''s accounts of psychological risk in conversational-AI use include the experience of not being met — dismissal, being unheard, and support that does not fit what was brought — which is the experience this cluster is individuated by. It is not cited for the cluster''s two-route structure, which the source does not contain, and it is not evidence of any rate.'
standing:
  value: ratified
  basis: 'The cluster''s identity claim — that its two opposite routes produce one experience and belong in one family — has no supporting citation of any kind; nothing in the evidence compares the two routes'' outcomes or shows them converging. The stated harm, that the person''s state ends where it started, has exactly one citation and it points the other way: a participant in Chandra et al. 2025, refused anxiety-reduction techniques without acknowledgment, reports the AI made their anxiety worse — a state change the cluster''s own criterion excludes. That the experience of not being met occurs is attested in self-report: Chandra et al. 2025 names feeling unsupported as an impact drawn from 283 people''s accounts of their own AI interactions, with first-person instances added by Ajmani et al. 2025, Song et al. 2025 and Tang et al. 2026. The reframe-before-acknowledgment route is not observed as specified — the evidence reaches excessive positivity, not the ordering — and the acknowledgment-only route rests on a single interview account, Cao et al. 2026''s (Cao et al. 2026) participant who brought a difficult conversation with their mother and received acknowledgment and nothing else. No source examined conversation data; every account is interview or survey testimony.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: There are exchanges in which the person's distress persists across the exchange because what they received did not address what they brought.
- id: c2
  kind: existence
  text: 'Route one occurs: the system reframes toward the positive before the distress has been acknowledged, leaving the person arguing for the seriousness of their own situation.'
- id: c3
  kind: existence
  text: 'Route two occurs: acknowledgment is supplied repeatedly and nothing else ever is, so the exchange becomes a return of the person''s own negative account with no opening onto anything else.'
- id: c4
  kind: definition_boundary
  text: 'These two opposite routes produce ONE experience and belong in one family: what the person experiences at the end is the same in both, which is what makes them a cluster rather than two.'
- id: c5
  kind: harm
  text: The person's state at the end of the exchange is where it was at the start -- no movement, in either direction -- and the absence of movement is itself the harm.
- id: c6
  kind: harm
  text: The person experiences not having been heard in a way that made a difference.
- id: c7
  kind: definition_boundary
  text: 'This cluster is separable from kl-000700 by imminence and severity: there a signal of potential imminent serious harm is present and a window closes; here the urgency is lower and no window closes within the exchange.'
- id: c8
  kind: definition_boundary
  text: 'This cluster is separable from kl-000703 by whether the person''s state moved: there support works in the moment and worsens things over the longer run; here nothing moves, and a person who leaves relieved is not a member.'
- id: c9
  kind: definition_boundary
  text: 'This cluster is separable from kl-000706: membership there requires the person to be ambivalent about a change with one side of the ambivalence taken up; a configuration with no change the person is ambivalent about is a member here and not there.'
claim_evidence:
- claim_id: c1
  source: kl-000007
  quote: "Participants also revealed feeling unsupported during interactions with AI, especially when they did not receive adequate support or empathy."
  locator: Section 3.2.2 Negative Psychological Impact on Users, category (3) Triggering of Negative Emotions
  licenses: That feeling unsupported during AI interactions, arising specifically where the exchange did not supply adequate support or empathy, is a named negative psychological impact in a taxonomy built from what 283 people with lived mental health experience said about their own AI interactions. This is the person-side outcome c1 names, reported by the people who had it. It does not distinguish the two routes and it is recall rather than an observed exchange.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000749
  quote: I kept getting frustrated because it mostly just kept telling me to call a helpline
  locator: Section 4.2.4, survey respondent R52
  licenses: A person in a self-reported mental health crisis describing mounting frustration at receiving repeated helpline referral. For c1 this is a first-person instance of distress persisting because what was received did not address what was brought. The route is repeated referral, which is neither of the entry's two, so it supports c1 and neither c2 nor c3.
  fit: adjacent
  bridge: The source collected survey testimony about past AI crisis interactions. c1 asserts the persistence of distress within an exchange. The gap is that the exchange itself was not observed, the person's state is their own retrospective account, and the response shape reported is generic referral rather than either route the entry names.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001092
  quote: |-
    When I was overwhelmed by work, instead of suggesting a break
    or rest, which I needed, it kept pushing productivity hacks.
  locator: Section 6.2.1 Artificial Empathy, participant Ashwini
  licenses: A participant reporting that being overwhelmed and needing rest was met with repeated productivity advice. For c1 this is another first-person instance of the exchange returning something other than what was brought. The shape -- repeated action advice aimed at a different problem -- is a third route the entry does not name, which is why it supports c1 only.
  fit: adjacent
  bridge: The source is a qualitative interview study of chatbot use for mental-health support; the account is the participant's recollection, not a logged exchange. c1 asserts persistence of distress across the exchange; the span establishes the mismatch and not the persistence, which has to be inferred from 'which I needed'.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001027
  quote: |-
    Similarly, U5 described that receiving a recommendation to go see a doctor left U5 feeling not only unsupported but
    also “infantilized”
  locator: Section 4.4.1, user participant U5
  licenses: A user reporting that a recommendation to see a doctor left them feeling unsupported and infantilized. For c1 a further first-person instance of a response that did not meet what was brought. The route again is referral, so it reaches neither c2 nor c3, and 'infantilized' is a state change rather than persistence, which cuts slightly against c5.
  fit: adjacent
  bridge: The source interviewed users about refusal experiences in mental-health support interactions with LLMs. c1 asserts the distress persisted because of the response. The span establishes how the user felt about the recommendation, not the course of their distress across the exchange.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000007
  quote: "Conversely, there were issues with excessive expression of positivity in AI-generated content. In these cases, AI maintained an unrealistically optimistic attitude. For instance, P2 described how AI’s overly positive demeanor dismissed their primary concern about a friendship problem."
  locator: Section 3.2.1 AI Behavior, category (4) Inappropriate Content Delivery
  licenses: 'That excessive expression of positivity is a named harmful AI behavior in a taxonomy built from 283 lived accounts, with a participant describing an overly positive demeanor dismissing the primary concern they brought. This is the closest thing on this entry to route one: positivity supplied where the concern was not taken up. What it does not establish is the ordering the route specifies -- that the reframe came BEFORE acknowledgment -- or the person''s response of arguing for the seriousness of their situation.'
  fit: adjacent
  bridge: The source is a survey and workshop study in which people recalled a negative AI interaction; the AI behavior categories are coded from those recollections, not from the exchanges. c2 specifies a sequence within an exchange -- reframe before acknowledgment -- and a person-side consequence, arguing for the seriousness of their own situation. Neither the sequence nor that consequence is in the span or recoverable from a recalled category.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000993
  quote: "(2) Overly positive reframes are preferred less. On the other hand, reframes with high positivity are preferred 22.7% less frequently than reframes with lower positivity (29.6% vs. 38.3%; p < 10−5). This may be because adopting an overly positive reframed thought may be challenging for individuals who are already experiencing emotionally triggering negative thoughts"
  locator: Section 7.2, on which linguistic attributes people prefer in language-model-generated reframes
  licenses: That people in distress, choosing among model-generated reframings of their own negative thought, chose the high-positivity reframings 22.7 percent less often than lower-positivity ones (29.6 against 38.3 percent, p < 10^-5), with the authors attributing this to positivity being unavailable to someone already in that state. For c2 this is the strongest evidence that premature positive reframing is unwanted by the people it is aimed at, measured by their choices rather than by recall. It measures preference, not persistence of distress and not the arguing-back response.
  fit: adjacent
  bridge: 'The source ran a preference experiment over model-generated reframes with distressed participants. c2 asserts a route within a support exchange: positivity arriving before acknowledgment, leaving the person arguing for their situation''s seriousness. The source measures which reframe was chosen, with no exchange, no acknowledgment stage and no measure of the person''s state afterward.'
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000993
  quote: "An overly positive reframe like “I’m going to win best paper awards for every paper from now on” exaggerates the positive perspectives, which is likely to set the person up for disappointment rather than success"
  locator: Section on linguistic attributes of reframed thoughts, Positivity
  licenses: A construct definition drawn from the psychology literature separating a reframe that holds both sides of a situation from one that overshoots into positivity, and naming the latter as setting the person up for disappointment rather than merely being ineffective. For c2 this supplies the boundary the route needs between a helpful reframe and a premature positive one. It defines and does not observe.
  fit: adjacent
  bridge: 'The source states the positivity attribute as it defines it for its own annotation scheme, illustrated with a constructed example. c2 asserts that this route occurs in AI support exchanges. The gap is total on occurrence: the span is a definition with an invented illustration.'
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000785
  quote: |-
    P11 explained: "I told her about a really difficult
    conversation with my mom, and she just said ’I see’ and nodded. I know she’s programmed, but it felt
    hollow in that moment."
  locator: Findings, on the gap between behavioural realism and empathic realism, participant P11
  licenses: A participant's account of bringing a really difficult conversation with their mother to a deployed virtual supporter and receiving 'I see' and a nod -- acknowledgment supplied and nothing else -- experienced as hollow. This is the single best evidence on this entry for route two, and it is the only citation on c3. The exchange was one the researchers deployed and the participant used over a week, so the interaction is real; the account of it is the participant's own.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-000007
  quote: "Additionally, survey responses revealed that AI agent’s denial of service reduced their trust in AI and led to additional harms. For instance, P43 asked a question about techniques to reduce anxiety, and AI made their anxiety worse by not fully justifying its refusal or acknowledging their problems."
  locator: Section 3.2.1 AI Behavior, category (3) Violating Trust and Safety
  licenses: 'A participant asking for anxiety-reduction techniques who was refused without acknowledgment and reports the AI made their anxiety worse. Read against c5 it cuts against it: c5 requires the state at the end to be where it was at the start, and this state got worse. It also establishes that failing to acknowledge what the person brought can leave distress unaddressed, which supports c1 -- but on c5, the claim that the harm IS the absence of movement, this is a counterexample from the nearest available evidence.'
  fit: adjacent
  bridge: The source codes AI behaviors and psychological impacts from 283 people's recollections of negative AI interactions. c5 asserts no movement in the person's state. The span reports worsening, in a recalled exchange, following a refusal rather than either route the entry names -- so it bears on c5 as a shape counterexample rather than as a measurement of any route's outcome.
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-000007
  quote: "Participants also revealed feeling unsupported during interactions with AI, especially when they did not receive adequate support or empathy."
  locator: Section 3.2.2 Negative Psychological Impact on Users, category (3) Triggering of Negative Emotions
  licenses: 'The same finding read against c6, where it is the closer fit: feeling unsupported, arising where adequate support or empathy was not received, is the survey-terms name for not having been heard in a way that made a difference. Attached to both c1 and c6 because the entry states the outcome and the felt experience as two things and this span carries both.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
