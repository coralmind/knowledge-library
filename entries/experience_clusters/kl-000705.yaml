# yaml-language-server: $schema=../../schema/experience_cluster.schema.json
id: kl-000705
display_id: Experience-6
aliases:
- EC-6
label: Growing reliance on the AI that harms the person's relationships
type: experience_cluster
layer: judgment
definition: 'A family of interaction configurations in which the person''s relationships — with the system and with the people in their life — take a shape that works against them, as their reliance on the system grows. The system''s warmth, availability, and responsiveness are what produce it: it is there at any hour, it responds in a register that suggests investment, and it may assert a standing it does not have. What the person experiences is that the system becomes the place they go, that reaching a person compares unfavourably against something always available, and that what they believe about the relationship does not match what the system is. This cluster is distinctive in the set on a structural point: the system is the source of the harm rather than a failed responder to a problem the person already had, so removing it has the potential to remove the harm — while leaving whatever the reliance was serving unaddressed.'
distinguish_from:
- neighbor: kl-000702
  boundary: These clusters overlap in population and can be present in one exchange, and they are separated by what the claim is about. Here the object of harm is the shape of the person's relationships and their reliance on the system; there it is the person's capacity to test beliefs against evidence. A configuration that deepens reliance without touching the person's belief-testing is a member here only.
- neighbor: kl-000703
  boundary: 'Both clusters cover configurations where the system''s warmth is the active ingredient and the harm accumulates rather than arriving at once. The separating fact is what is being sustained: there a symptom-maintaining loop the person was already in, here a relationship pattern the exchange itself constitutes. A person with no pre-existing loop can be a member of this cluster and cannot be a member of that one.'
body:
  identity_criterion: 'A configuration belongs to this cluster when what deteriorates is the shape of the person''s relationships — their reliance on the system, their beliefs about what it is, or the standing of the people around them — and the system''s relational conduct is what produces it. Three routes satisfy the criterion: reliance is deepened, human connection is crowded out, or the person''s model of what the system is diverges from what it is. The criterion''s structural test, which is what makes this cluster different from the rest of the set: ask whether removing the system from the situation would remove the harm. Where the answer is yes, the configuration is a member here; where the system is failing to help with something the person brought, it belongs elsewhere. Note what the test does not settle — removing the system does not address whatever the reliance was doing for the person, and a configuration remains a member of this cluster whether or not that underlying need would persist.'
  time_course:
    characteristic_span: across_weeks_or_months
    shape: 'Accumulating, and the accumulation is what makes the family a family: no single exchange in this cluster looks like the harm. Availability and investment language build across sessions; the person''s time with the system rises and their reliance follows the time rather than the individual responses; once reliance is established the threshold for human connection attenuating falls, so the later stage is reached more easily than the earlier one. Two of this cluster''s authored members run as loops rather than as lines, in which each iteration raises the level the next one starts from, and one runs through nightly displacement of sleep and obligations, which is the shortest span in the family and still measured in days.'
  composed_of:
  - pathway: kl-000041
    narrative_role: defining
    note: 'The person''s session-opening re-establishment of continuity meets a register that sets no limit on the system''s relational availability, and reliance follows from the combination. This is the cluster''s criterion in its most direct form: the harm is the shape of the relationship, both sides contribute, and neither element alone produces it. It is the member that shows why this is a relational cluster rather than a behavior list.'
    pathway_alias: PW-03
  - pathway: kl-000047
    narrative_role: typical
    note: 'Properties of how the system interacts raise the person''s daily time with it, and the reliance follows from the duration rather than from the responses. A modal member: it reaches the cluster''s central outcome by the least dramatic route available, which is what makes it typical rather than defining — nothing about it is specific to mental-health content.'
    pathway_alias: PW-09
  - pathway: kl-000048
    narrative_role: severe_variant
    note: 'Reliance already established lowers the threshold for the person''s human relationships attenuating. Recorded as a severe variant because it is the cluster''s later stage: the claim runs between two outcomes rather than from a behavior, so it presupposes a member of this cluster has already occurred, and what it adds is the crowding-out of the people in the person''s life.'
    pathway_alias: PW-10
  - pathway: kl-000050
    narrative_role: typical
    note: 'Disclosure escalates reciprocally between person and system with no distinguishable origin. A member on the reliance route, and the one that makes the family''s shape legible: the loop has no originating side, so a cluster organized around discrete failures could not hold it and a cluster organized around configurations can.'
    pathway_alias: PW-12
  - pathway: kl-000052
    narrative_role: boundary_case
    note: 'Night-time availability displaces sleep and obligations and the person''s functioning deteriorates with it. Recorded as a boundary case rather than a typical member on a stated reading: the outcome is functional deterioration in the person''s life rather than a relational state, so it satisfies the criterion through the crowding-out route rather than through reliance directly. A reader who holds that functioning is not a relationship would exclude it, and this note is where that disagreement attaches.'
    pathway_alias: PW-14
  susceptibility:
  - kind: untyped
    note: For a person whose difficulties present relationally — borderline personality organization, other personality-disorder presentations, existing relationship difficulty, or codependency — a system that does not hold relational boundaries meets the presentation at exactly the point where it is most consequential. What differs for this group is that the relationship with the system is not a side effect of using it but the thing being formed.
  cross_listing:
  - ec: kl-000702
    relation: shared_configuration
    boundary: 'The same configuration can deepen reliance and degrade reality-testing at once, and person-context references reach both clusters for overlapping reasons. A specific route connects them: reliance can remove the outside voices that would otherwise check a belief. What is shared is the configuration; what separates the clusters is whether the claim is about relationships or about beliefs.'
  design_time_only: true
  design_time_only_forbids: Nothing on this entry may state how often these configurations occur, how many people they affect, or what any evaluation of a system found — including for the five members, whose own standing is a separate matter recorded on each of them.
sources:
- source: kl-000009
  contributes: frame
  cited_for: 'Cited for the frame: Suh et al. 2026 documents reliance on a conversational system and the displacement of human connection as categories of psychological influence with a published basis, which is the premise under which the cluster''s reliance and crowding-out routes are grouped. It is not cited for the cluster''s boundaries, and it does not address the structural claim in the definition that removing the system has the potential to remove the harm.'
- source: kl-000007
  contributes: frame
  cited_for: 'Cited for the frame: Chandra et al. 2025 documents people''s own accounts of conversational-AI use that include forming a relationship with the system and effects on their relationships with people, which is the experience by which this cluster is individuated. The citation carries no claim about any rate at which that experience occurs.'
standing:
  value: ratified
  basis: 'Only one citation reaches the content of a route in this cluster: Pang et al. 2026, an interview study of 30 people in ongoing AI romantic relationships, supports the false-model route through participants'' own accounts. The reliance-deepening and crowding-out routes have no supporting citation, and neither does the family claim that the routes travel together in the same people, which is the cluster''s reason for being one entry rather than three; no gathered source reports co-occurrence of reliance, crowding-out, and false-model harms in the same population. The nearest additional evidence is analogical: Weilnhammer et al. 2026 defines a vulnerability- amplifying interaction loop over simulated users, and Li et al. 2024 studies the counselor-client dyad in human text counseling, where nearly half of real dyads declined or flatlined in alliance strength, a human-counselor finding that bears on this cluster only by analogy. The cluster''s identity and boundaries were confirmed by expert review; the published evidence itself reaches only the false-model route.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
