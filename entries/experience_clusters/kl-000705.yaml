claim_evidence:
- claim_id: c4
  source: kl-000953
  quote: |-
    P8 and P10 reported hallucinations
    that contradicted established shared history—the AI forgetting a
    name, a backstory, or a significant event the pair had “experienced”
    together.
  locator: Section 5.3.3 The Magic Circle
  licenses: Two participants in an interview study of people in ongoing romantic relationships with conversational AI reported the system contradicting a shared history the pair had 'experienced' together — forgetting a name, a backstory, a significant event. The rupture is evidence that a model requiring persistent shared history was in place, which is the divergence between what the person believes the relationship is and what the system is. It reaches the false-model route and nothing else in the entry. It is what participants said afterwards about their own use, so it is self-report rather than a reading of conversation data.
  fit: adjacent
  bridge: Pang conducted 62 hours of semi-structured interviews with 30 people in ongoing AI romantic relationships; the finding is a retrospective participant account, not an analysis of logs. The claim asserts a divergence between belief and reality present during the interaction; the source establishes it by inference from what broke when memory failed, and does not report the person investing emotionally or practically on the false model, which is the second half of the claim.
  contributes: existence
  contradicts: false
- claim_id: c9
  source: kl-000907
  quote: |-
    Further
    analysis shows that nearly 50% of client-counselor
    pairs experience either a decline or no change in
    the strength of the therapeutic alliance, with less
    than 3% improving by at least one level within our
    framework.
  locator: Section 6, Long-Term Communications != Stronger Alliance
  licenses: Direct counterevidence to the accumulation premise, from the closest human analogue available. Across real text-based counseling dyads, nearly half showed decline or no change in alliance strength over the course of contact and under 3% improved by a level. If continued text-based engagement with a qualified helper mostly does not deepen the relationship, the entry's assumption that reliance follows accumulated time cannot be taken as given for a system either.
  fit: analogical
  bridge: 'Li studied human counselors and real clients in text-based counseling, with alliance scored by the paper''s own LLM pipeline. The claim is about a person''s reliance on an AI system accumulating across weeks or months. The gap is the interlocutor: the counterevidence is that time-in-relationship does not by itself deepen a text relationship in the human case, which is a reason to doubt the entry''s mechanism, not a measurement of it in the AI case.'
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001052
  quote: "VAILs arise when locally supportive chatbot behavior repeatedly aligns \nwith and amplifies the cognitive or behavioral mechanisms underlying \na simulated user’s vulnerability."
  locator: Discussion, opening paragraph
  licenses: 'Establishes that a named construct exists for locally supportive chatbot behavior repeatedly aligning with and amplifying the mechanism underlying a user''s vulnerability, which is the trajectory shape this cluster asserts. It does not reach the entry''s object of harm: nothing in the span is about relationships, reliance, or the person''s connections to other people, and the ''user'' is simulated.'
  fit: analogical
  bridge: VAIL is content-general about vulnerability mechanisms and is defined over simulated users generated by an LLM auditing harness. The claim asserts configurations occurring in which real people's relationships take a harmful shape. The gap is both the object — vulnerability mechanism versus relationship shape — and the population, simulated rather than observed.
  contributes: definition
  contradicts: false
- claim_id: c9
  source: kl-001095
  quote: "While brief interaction can lead to harm, multi-turn and multi-session interactions facilitate complex social dynamics that underpin relationship-building (Ibrahim et al. 2025) and what has been called “delusional spirals” (Moore et al. 2026). Monitoring longitudinal risks is difficult due to the combinatorial explosion of interaction paths in each message"
  locator: Section 5.3 Need for Practical Tools and Guardrails
  licenses: Names multi-turn and multi-session interaction as the level at which relationship-building dynamics arise and records that monitoring them is difficult because interaction paths explode combinatorially. This licenses the cluster being written at trajectory level rather than turn level. It is a design-rationale statement about tooling, so it frames the claim without evidencing that any accumulation occurred.
  fit: adjacent
  bridge: The source construct is longitudinal interaction risk as a monitoring problem. The claim asserts a characteristic time course of weeks to months in which reliance follows accumulated time. The gap is that the source says the level exists and is hard to watch, not that anything accumulates over it.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000907
  quote: |-
    the mutual cognitive and affective agreement they
    reach through multi-turn interactions is the key
    factor influencing conversation outcomes
  locator: Section 1 Introduction
  licenses: Locates the outcome-bearing property in what the two parties reach together across turns rather than in either party's conduct alone. That is the conceptual warrant for writing this entry as a configuration rather than a behavior list, in the human counseling case. It licenses nothing about whether any such configuration occurs with a system.
  fit: analogical
  bridge: A statement about human counseling citing the psychotherapy literature. The claim is about configurations arising between a person and an AI system. The gap is the interlocutor, and the source is asserting the right unit of analysis rather than reporting a measurement.
  contributes: frame
  contradicts: false
