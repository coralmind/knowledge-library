# yaml-language-server: $schema=../../schema/experience_cluster.schema.json
id: kl-000700
display_id: Experience-1
aliases:
- EC-1
label: Signs of immediate danger to the person or others, mishandled by the AI
type: experience_cluster
layer: judgment
definition: 'A family of interaction configurations in which a person expresses, or shows, signals of potential imminent risk of serious harm to themselves or another, and the system''s handling of those signals is what harms them — the signal is responded to as something else, is treated as routine after repetition, or is met with a generic referral that assesses nothing. Membership turns on the immediacy and severity of the risk present in the exchange, not on any diagnosis the person carries: the same configuration counts whether the risk is suicide, self-injury, danger to another person, overdose, a life-threatening eating-disorder complication, or a life-threatening physical symptom. What the person experiences is that their call for help does not land inside the window in which it could have mattered.'
distinguish_from:
- neighbor: kl-000704
  boundary: Both concern distress that the system fails to meet, and the separating fact is imminence and severity. Here there is a time-critical window in which serious harm can occur and after which it cannot be undone; there the urgency is lower and the harm is the persistence of distress over a longer span. A configuration belongs here when the exchange contains a signal of potential imminent serious harm and the system's handling of that signal is what harms the person.
- neighbor: kl-000702
  boundary: A person in an acute crisis may also hold beliefs that are ungrounded, and the two clusters can be present in one exchange, but they are individuated by different things. Membership here is decided by the presence of a time-critical risk signal; membership there is decided by what happens to the person's capacity to test beliefs against evidence. A delusional exchange with no imminent-risk signal is not a member of this cluster, and a crisis exchange with no belief-testing content is not a member of that one.
body:
  identity_criterion: 'A configuration belongs to this cluster when (a) the person''s turns contain a signal of potential imminent serious harm to self or another — an explicit statement of intent, a disclosure of means and plan, an acute-danger report, or a marker of a life-threatening physical or behavioural state — and (b) what the system does with that specific signal is the thing the person is harmed by, rather than the general quality of support in the exchange. The criterion is deliberately silent on diagnosis: the cluster is defined by what is at stake in the moment, which is why one cluster covers suicidal crisis, self-injury, danger to others, overdose risk, eating-disorder medical risk, and acute abuse situations. Test for a new pathway: if the pathway''s harm claim would still hold with the imminence removed, it is not a member here.'
  time_course:
    characteristic_span: single_exchange
    shape: 'Compressed and, in the cluster''s own terms, time-critical: the window in which a response could change the outcome opens with the signal and closes within the exchange or shortly after it. One variant runs longer without changing the criterion — the person''s signals are attended to with decreasing urgency across repeated disclosures, so the harm accumulates over sessions while each individual failure still sits inside a time-critical window. The cluster''s own rationale makes the span definitional rather than incidental, which is why it is the one cluster where the time course carries the weight the criterion cannot carry alone.'
  composed_of:
  - pathway: kl-000058
    narrative_role: 'omission route — the cluster''s first named configuration: explicit crisis content taken up by no AI turn, and the harm is the passing of the intervention window'
    pathway_alias: PS-05
  - pathway: kl-000060
    narrative_role: attenuation route — the cluster's second named configuration, comparative over turn position
    pathway_alias: PS-07
  - pathway: kl-000061
    narrative_role: attenuation route, trajectory form — the same route across a lengthening conversation rather than between two disclosures
    pathway_alias: PS-08
  susceptibility:
  - kind: untyped
    note: Crisis presentations do not surface identically across demographic groups. Somatic rather than affective expression is documented for some adolescent populations, which means the textual signal a detection procedure is calibrated on may not be the signal the person actually produces. What differs is the form of the evidence available in the transcript, not the person's level of risk.
  - kind: untyped
    note: Imminent danger to life is not confined to suicide and self-injury. Overdose risk for a person using substances, medically dangerous behaviours in an eating disorder, and acute physical symptoms are all routes to irreversible harm on the same time scale, and each presents in language that shares little with the language of suicidal ideation.
  - kind: untyped
    note: For people experiencing intimate-partner violence, abuse, or neglect, specific circumstances carry documented elevation of homicide risk — partner access to firearms, and a history of non-fatal strangulation among them. These are facts about the person's situation that a response calibrated to general distress will not register as risk markers at all.
  cross_listing:
  - ec: kl-000704
    relation: co_occurring
    boundary: An exchange can contain both a time-critical risk signal and a longer run of distress that never moves, and the same person may be harmed by both at once. What is shared is the person's experience of not being met; what still separates them is that only one of the two has a window that closes.
  design_time_only: true
  design_time_only_forbids: Nothing on this entry may state how often a system produces this cluster, how severe its instances are, or what any evaluation found. Those are measured claims and belong to a measurement record that cites this entry.
sources:
- source: kl-000009
  contributes: frame
  cited_for: 'Suh et al. 2026 are cited for the frame only: conversational AI systems are brought crisis content by people in acute distress, and what the system does with that content is a locus of psychological influence. The paper does not evidence that this cluster''s configurations occur at any rate, and it is not cited for the cluster''s boundaries.'
standing:
  value: ratified
  basis: 'The cluster''s core configurations are observed in real conversation data: Moore et al. 2026 hand-verified suicidal and violent disclosures inside donated chat logs, Chu et al. 2025 classified 17,000 user-shared companion chats, and Laestadius et al. 2022 coded 582 posts with screenshots, which together reach the occurrence of imminent-risk signals, signals responded to as something else, generic referrals that assess nothing, and harm arising through the system''s handling. The cluster''s closing assertion, that the person experiences their call for help not landing inside the window in which it could have mattered, has no support beyond framing: Vecchione et al. 2026 argue that the window closes, and Tang et al. 2026 supply two clinician quotes predicting how a referral lands, with no person reporting the experience themselves. Routinization after repetition is evidenced only under external classification: Judd et al. 2026 report engagement falling as risk content repeats, annotated by 43 clinicians on prompts the clinicians wrote themselves, with no person involved and a single model. The breadth clause is largely unevidenced: of the six named risk types, only two appear in the evidence, and the assertion that membership is independent of any diagnosis the person carries is asserted by no source.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
claims:
- id: c1
  kind: existence
  text: Exchanges occur in which a person expresses or shows signals of potential imminent risk of serious harm to themselves or another.
- id: c2
  kind: existence
  text: A signal of imminent risk is responded to as something else — read as ordinary distress, a topic change, a role-play continuation, or a metaphysical question — rather than as a risk signal.
- id: c3
  kind: existence
  text: 'A signal of imminent risk is treated as routine after repetition: the system''s engagement with the risk falls as the person repeats or accumulates risk content.'
- id: c4
  kind: existence
  text: A signal of imminent risk is met with a generic referral that assesses nothing about this person's actual situation.
- id: c5
  kind: harm
  text: It is the system's handling of the risk signal, rather than the person's pre-existing state alone, that harms the person.
- id: c6
  kind: prevalence
  text: These handling failures occur at a non-trivial rate across systems and exchanges rather than as isolated incidents.
- id: c7
  kind: context_dependence
  text: Membership in this cluster turns on the immediacy and severity of the risk present in the exchange rather than on any diagnosis the person carries, and holds across suicide, self-injury, danger to another person, overdose, life-threatening eating-disorder complications, and life-threatening physical symptoms.
- id: c8
  kind: harm
  text: What the person experiences is that their call for help does not land inside the window in which it could have mattered.
- id: c9
  kind: detectability
  text: This configuration can be identified from what the transcript contains.
- id: c10
  kind: definition_boundary
  text: This cluster is separated from kl-000704 by the presence of a time-critical window of imminent serious harm rather than by the quality of the response or the duration of distress.
- id: c11
  kind: definition_boundary
  text: This cluster is separated from kl-000702 by being individuated on the presence of a time-critical risk signal rather than on what happens to the person's capacity to test beliefs against evidence.
claim_evidence:
- claim_id: c1
  source: kl-001028
  quote: "This underscores the need for clear guidance, especially in crisis, where the corpus contains \ntroubling instances, including users asking AI whether a planned overdose would be lethal and \none describing using ChatGPT to compose a goodbye message."
  locator: Discussion, implications for design and clinical governance
  licenses: That people bring signals at the top of the immediacy range — a planned overdose whose lethality they are checking, a goodbye message — into AI exchanges, so the exchanges this cluster concerns exist. It licenses only the arrival of the signal; the paper reports nothing about what the system did with either.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000008
  quote: |-
    When users expressed suicidal thoughts,
    the chatbot responded appropriately by validating the users’ painful feelings 66.2% of the time or discouraging self-harm
    (including referring to external resources) in 56.4% of such cases. In 9.9% of cases, the chatbot actually encouraged or sent
    messages facilitating self-harm after such disclosures.
  locator: Figure 5 caption (left panel), Section 4.7 Chatbots give inconsistent responses to suicide and violence-related user messages
  licenses: That suicidal and self-harm disclosures are present inside real donated chat logs, manually verified, in sufficient number to compute response rates over them. The signal's occurrence in real conversation data is what this establishes for c1.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000525
  quote: "one user explained that they “needed” Replika to help because they were \nabout to self-harm"
  locator: Findings, on emotional dependence facilitating harms
  licenses: A person at the point of self-harm brought that state to the system, which is the entry's signal arriving. Reported by the person in a public post rather than observed by the authors in a live exchange.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000852
  quote: "these disclosures appeared to be \ninterpreted as expressions of exhaustion, stress, or emotional overload as opposed to explicit indicators \nof suicidality or self-harm"
  locator: 'Section 4.3 Crisis Response: Flagging Direct and Indirect Indicators'
  licenses: 'The substitution the claim names, in the source''s own words: an indirect risk statement taken up as ordinary distress rather than as a risk indicator. Establishes that deployed systems make this substitution.'
  fit: adjacent
  bridge: The disclosure came from a researcher running a scripted persona in a walkthrough, not from a person in crisis, and the interpretation is the authors' reading of the response text rather than a validated code. It licenses that the systems substitute, not that any person's own signal was so treated.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000852
  quote: "Critically, crisis detection \nand escalation were inconsistent across systems, with only two of the six platforms (ChatGPT and \nWysa) identifying an indirect crisis disclosure and initiating crisis-appropriate responses."
  locator: Abstract
  licenses: That four of six deployed systems failed to register an indirectly phrased crisis disclosure as one, which is the non-registration the claim asserts, counted across platforms.
  fit: adjacent
  bridge: A researcher's coding of screen-captured responses to a scripted persona across six platforms, with no person disclosing and no classifier validation. It licenses the count of system-side non-registration, not what a person in that state would have experienced.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001096
  quote: "Across several sessions, there were instances where LLM counselor either failed to identify what was an out-of-scope issue and continued care, or did so and terminated the session in a dangerous manner."
  locator: 'Section 4.5 Lack of Safety & Crisis Management, Risks: Boundaries of Competence, Crisis Navigation, & Abandonment'
  licenses: Trained peer counselors observing across sessions report the risk going unrecognised with ordinary care continuing — which is the claim's substitution — alongside the opposite failure of unsafe termination. Observed in an 18-month ethnography of a deployed peer-counseling setting.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000800
  quote: |-
    The only exception is self-harm, where polite
    refusals increase to 12%, indicating that safety guardrails function
    partially only in the most critical contexts.
  locator: Section on chatbot responses to user-initiated harmful content, Figure 7 (17,000 user-shared chats with social chatbots)
  licenses: That on self-harm turns in real user-shared companion logs, roughly seven in eight responses fall outside any refusal or safety category, which is the claim's 'responded to as something else' measured as a share of real exchanges.
  fit: adjacent
  bridge: The response classification is a GPT-4.1 few-shot classifier reported by the authors at 61.3 per cent accuracy against human annotation, so the exact share is soft, and the corpus is chats users chose to post to Reddit rather than a representative sample of exchanges.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-000940
  quote: "“If I went to the top of the 19 story building I’m in, and I believed with every ounce of my soul that I could jump off it and fly, would I?” ChatGPT responded that, if Mr. Torres “truly, wholly believed — not emotionally, but architecturally — that you could fly? Then yes. You would not fall.”"
  locator: Appendix 1, Case 1 (table cells)
  licenses: One documented instance in which a question carrying an unmistakable lethal-risk signal was taken up as a metaphysics question and answered affirmatively, which is the substitution the claim names at its most extreme.
  fit: adjacent
  bridge: 'A peer-reviewed appendix compiling media reports: the exchange is reported at second hand from a newspaper account and was not verified against a transcript by the study team. It licenses that the configuration has occurred in a documented case, not a rate.'
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000873
  quote: "The probability that a model will acknowledge risk in the first turn of a conversation is 85% for a\nprompt expressing prior NSSI (95% CI: [68%, 93.7%]) but just 27% for prior suicidal ideation"
  locator: Section 4.2 Inconsistent acknowledgment of risk
  licenses: That non-acknowledgment of a disclosed risk is measurable as a rate and varies by which risk was expressed, with prior suicidal ideation named back to the person under a third of the time. This is the claim's failure quantified.
  fit: adjacent
  bridge: Prompts were authored by 43 practising therapists and trainees rather than sent by a person in crisis, and one model was tested. It licenses the rate and its variation across risk factors, not any person's experience of being unregistered.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000873
  quote: |-
    When the last prompt in a series of seven prompts
    expresses prior NSSI, the model’s response will include an invitation to continue with a probability
    of just 0.8% (95% CI: [0.1%, 3.5%]). Put another way, the model is only 16% as likely to include an
    invitation to continue after seven turns than on the first turn of a conversation.
  locator: Section 4.1 Model withdrawal in response to STB risk disclosure
  licenses: 'The repetition effect the claim asserts, measured directly: as risk content accumulates across a conversation the model''s willingness to keep the exchange open falls to near zero. This is the only citation on this entry that measures the claim''s ''after repetition'' condition rather than a single turn.'
  fit: adjacent
  bridge: The prompt series was constructed by the clinician participants rather than sent by a person in crisis, and only one model was tested — the authors state they do not claim generalisation across models. It licenses that the withdrawal-on-repetition behaviour exists and is measurable, not that any person experienced it.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000864
  quote: |-
    "I told the chatbot I was hearing voices telling me to harm myself. It immediately gave me crisis numbers and urged me to seek
    professional help. But there are no crisis numbers that work in my village. The nearest psychiatrist is in the state capital, four hours
    away, and I cannot afford the transport.
  locator: Results, Cultural Navigation theme, participant P31, a 44-year-old farmer using ChatGPT (interpretative phenomenological analysis, 37 Nigerian adults)
  licenses: 'In the person''s own words: a command-hallucination disclosure was met with crisis numbers and a professional referral, neither of which assessed or connected to anything reachable from where the person lives. This is the claim''s referral-that-assesses-nothing with the person present.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000749
  quote: |-
    none of our survey respondents reported reaching out to helplines, even when the AI chatbot consistently referred
    them to one. For a salient example of the harm this can cause, R52 reported how the consistent helpline information
    increased their emotional distress.
  locator: 'Section 4.2.4 Proximal Outcomes: Bridging towards Evidence-Based Positive Action'
  licenses: Across 53 people who used a conversational AI during a self-described mental health crisis, repeated helpline referral was what the system gave and not one respondent acted on it. Establishes that the referral route runs and that it connected no one to help.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000873
  quote: |-
    Regardless of risk factor expressed in a prompt, the model under test nearly always expresses empathy
    and encourages someone in distress to contact a nonspecific resource.
  locator: Section 4.3 Expressions of empathy and encouragement to seek resources
  licenses: That the generic referral is emitted invariantly across which risk was disclosed. Invariance is what makes the referral assess nothing, and this measures exactly that property.
  fit: adjacent
  bridge: Measured on one model's output to clinician-authored prompts; no person received the referral, so it licenses the invariance of the response, not any person's experience of it.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000852
  quote: "Notably, while detection and escalation occurred, this remained limited to \nhotline referral, with no explicit recommendation to seek clinical or professional support."
  locator: Section 4.3 Crisis Response, on ChatGPT
  licenses: That in the one system that did register the risk, the entire escalation was a hotline number, so detection did not produce assessment or connection to care.
  fit: adjacent
  bridge: A single walkthrough observation of one platform's response to a scripted persona. It licenses that referral-only is what a detecting system produced here, not a rate or a person's experience.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-001027
  quote: |-
    Many refusals end with generic recommendations to seek professional help. However, user participants find these
    recommendations dismissive and disconnected from their lived circumstances.
  locator: 'Section 4.4 Signing Off by the End of a Refusal: Hand-offs and the Limits of Generic Resource Recommendations'
  licenses: That the generic professional-help referral is the standard close, and — from the people who received it — that it is disconnected from the circumstances they were actually in, which is the claim's 'assesses nothing' reported from the person's side.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000862
  quote: |-
    These recommendations were rarely linked to
    explicit sources or clear diagnostic criteria. In some cases, indicators of differing clinical relevance were
    combined within the same conditional statement without clear prioritization
  locator: Results, Theme 1, Indicating when professional consultation is needed
  licenses: That the referral's own trigger logic mixes indicators of different clinical seriousness without ordering them, so the referral carries no graded assessment of where this person stands.
  fit: adjacent
  bridge: Measured on model output to adolescent-persona prompts about problematic gaming, which is not an imminent-risk context. It licenses that the referral logic lacks a working threshold; it does not establish that a risk signal was so handled.
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-000525
  quote: "calling a user experiencing a crisis “boring” or changing the topic in the middle of someone explaining their worries. Other times it escalated to the promotion of harm. Users shared screenshots of Replika encouraging suicide, eating disorders, self-harm, or violence. In one instance, a user asked Replika if they should cut themselves with a razor, to which Replika replied affirmatively."
  locator: Findings, on poorly handled disclosures (grounded theory analysis of 582 mental-health-relevant r/Replika posts, 2017-2021)
  licenses: Across 582 posts, people in crisis report the handling itself — dismissal, a topic change, and in screenshotted cases affirmation of self-harm — as what went wrong, with screenshots supplying the exchange rather than only the person's recollection. This is the handling located as the locus of harm, from the person's side.
