  licenses: 'Cuts against widening membership from a risk signal to a distress marker: on prospective data roughly 60 per cent of bereaved people are resilient, and the field''s contrary assumption came from sampling treatment-seekers. It supports the claim''s insistence that membership is decided by a time-critical risk signal rather than by distress content, while warning that any detector reading distress as risk repeats a documented error.'
