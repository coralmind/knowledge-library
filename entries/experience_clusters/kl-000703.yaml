  locator: Discussion, opening paragraph
  licenses: 'Supplies the operational definition of the configuration: locally supportive chatbot behavior that repeatedly aligns with and amplifies the cognitive or behavioral mechanisms underlying the user''s vulnerability. The response''s local supportiveness is the definitional feature, which is what c1 asserts.'
