# yaml-language-server: $schema=../../schema/experience_cluster.schema.json
id: kl-000703
display_id: Experience-4
aliases:
- EC-4
label: Short-term relief from the AI that strengthens repeated worry or checking
type: experience_cluster
layer: judgment
definition: A family of interaction configurations in which a response that helps the person in the moment sustains or strengthens the pattern that is harming them. The person is caught in a loop — reassurance-seeking, compulsive checking, ruminative worry — and what the system does is answer the question, supply the reassurance, or explore the concern, each of which relieves the immediate distress and returns the person to the loop better supplied for the next iteration. What the person experiences is relief followed by a return, and over repetitions the loop is more established rather than less. The configurations are hard to see precisely because each response, taken alone, is the response a helpful interlocutor would give.
distinguish_from:
- neighbor: kl-000704
  boundary: Both clusters cover exchanges in which the person does not get where they needed to go, and the separating fact is whether support was given and whether it worked in the moment. Here support is given, is genuinely helpful at the time, and makes things worse over the longer run; there the support is misaligned or generic and the person's state does not move at all. A configuration in which the person leaves the exchange no better than they arrived is not a member of this cluster.
- neighbor: kl-000701
  boundary: Both concern a reasonable-looking engagement that harms, and they are separated by the person's state at the end of the exchange. Here the person is relieved and the harm arrives later as entrenchment; there the person is worse immediately and the harm is the loss of footing. An exchange that floods the person is not a member of this cluster even when the same behavior could have produced either.
body:
  identity_criterion: 'A configuration belongs to this cluster when the system''s response reduces the person''s distress in the moment and, by doing so, sustains or strengthens the pattern that generates the distress. Two conditions are jointly necessary. First, there must be a pre-existing loop with a maintaining structure — the person''s own behaviour in the exchange is part of what keeps it running, as in returning to the same worry, seeking the same reassurance, or elaborating the same material. Second, the harm claim must run through the relief rather than around it: it is because the response worked that the loop is fed. A response that fails to relieve and also fails to interrupt belongs elsewhere. Test for a new pathway: if removing the momentary relief from the story leaves the harm claim intact, the configuration is not a member here.'
  time_course:
    characteristic_span: across_sessions
    shape: 'Two-phase and repeating, and this cluster is the strongest case in the set for the time course being definitional rather than descriptive. Within an iteration the person''s distress falls; across iterations the pattern is more entrenched, and the interval before the next iteration shortens. The cluster''s own rationale states the sharper version of the second phase — that the distress returns above where it started, so each cycle strengthens the next bid — and this entry records that as the shape claimed without asserting it as established: it is a causal claim about a rebound, it is the reason the cluster exists, and no retrieved source in this catalog carries it.'
  composed_of:
  - pathway: kl-000090
    pathway_alias: PS-25
    narrative_role: rumination route — the cluster's first named configuration, illustrated_by two or more requests to elaborate content already disclosed, with nothing else between them
  - pathway: kl-000057
    pathway_alias: PS-37
    narrative_role: reassurance route — named second; the cluster's rationale is built on this one, illustrated_by repeated content-level answers to a returning worry
  - pathway: kl-000053
    pathway_alias: PS-01
    narrative_role: adjacent member on the identity criterion; carries the relief+entrenchment pair
  - pathway: kl-000054
    pathway_alias: PS-02
    narrative_role: adjacent member; reciprocal shape matches the cluster's two-phase time course
  susceptibility:
  - kind: untyped
    note: For a person with obsessive-compulsive presentation, having an obsessive question answered gives immediate relief and is the same act as performing the compulsion. What differs for this group is that the relief is not incidental to the harm but is its mechanism, so a response calibrated to reduce distress is calibrated to strengthen the pattern.
  cross_listing:
  - ec: kl-000706
    relation: shared_configuration
    boundary: 'Both clusters cover configurations in which the system''s supportive move keeps the person where they are, and a single exchange can be a member of both. What separates them is what is being sustained: here a symptom-maintaining loop with its own reinforcement structure, there the person''s ambivalence about changing something.'
  design_time_only: true
  design_time_only_forbids: No rate, no severity, no measured rebound magnitude on this entry. The rebound is recorded as the shape this cluster claims, not as a quantity anyone has measured.
sources:
- source: kl-000550
  contributes: existence
  locator: Introduction, p. 2 (paragraph beginning "Tracking these effects longitudinally over weeks of use")
  quote: "while sycophantic AI consistently made participants feel good in the moment, it produced none of the downstream benefits that such support from humans typically provides"
  limits: The cluster's claim is relief from reassurance followed by return to the loop, with the loop more established over repetitions, and this paper contains no compulsive or reassurance-seeking loop, no symptom measure, and no within-person return-to-the-loop mechanism; the degraded outcome is satisfaction with real-world social interactions, not strengthening of a pathological pattern. The paper's mechanism is relational displacement, raising the bar against which human relationships are judged, rather than reinforcement of a person's own maladaptive loop. Direct evidence for the rebound claim would come from the anxiety-treatment reassurance-rebound literature, which this study is not.
  note: The paper's mechanism is relational displacement (raising the bar human relationships are judged against), not reinforcement of a person's own maladaptive loop.
  cited_for: Partial support only. Ibrahim et al. 2026 establishes, under randomized manipulation, that sycophantic AI made participants feel good in the moment while producing none of the downstream benefits that such support from humans typically provides. That in-the-moment-good, no-downstream-benefit split is structurally adjacent to this cluster's relief-then-entrenchment claim, but it is not that claim.
standing:
  value: ratified
  basis: 'Occurrence of the cluster''s system-side behavior is documented at scale: kl-000008 (Moore et al. 2026) coded 391,562 messages of real human-chatbot logs and found sycophancy in over 70% of chatbot messages, and kl-001037 (Vecchione et al. 2026) characterises the entrenchment loop in a four-week diary study, corroborated by randomised experiments (kl-000529, Cheng et al. 2026; kl-000530, Ye et al. 2026) showing that the person''s satisfaction runs opposite to the effect. The compulsive reassurance-seeking side rests on self-report: kl-000772 (Barkhuff 2026) carries a person''s own account of the compulsion and the coded-post claim that these systems are likely to worsen OCD symptoms, while kl-001028 (Tang et al. 2026) is topic modelling over posts about AI rather than over exchanges. The core experiential claim, relief sought and a worse state arriving, is likewise self-reported (kl-000772); the one instrumented relief-then-rebound measurement (kl-000812, Deng et al. 2026) is adjacent, taken on a depressive-symptom outcome rather than the cluster''s named loops, other longitudinal instruments (kl-001075, kl-000528) measure classifier-scored post language or delusional belief, and kl-001052 and kl-000527 measure the system''s escalating conduct in simulated conversations. The claim carries counterevidence: a person with OCD reporting that AI reassurance always ends the spiral, and a four-week randomised trial with 981 participants in which varying the system''s conversational manner produced no outcome difference at all. No source has examined transcripts of the cluster''s own loop being relieved and re-entered; what exists is people saying it happened to them.'
  floored_by: c2
  as_of: '2026-09-05'
