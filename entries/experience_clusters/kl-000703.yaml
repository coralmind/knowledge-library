- claim_id: c2
  source: kl-001028
  quote: "Seeking AI reassurance for \nOCD intrusive thoughts \n4.97 \nOCD; reassurance; \ncompulsions; intrusive \nthoughts \nAppraisal \nUsers seek AI reassurance and \nvalidation to evaluate intrusive \nthoughts, helping them judge \nwhether their fears are \nwarranted."
  locator: Table 1, Topic 11, structural topic model over 10,042 AI-related posts from ten Reddit mental health communities
  licenses: Seeking AI reassurance for OCD intrusive thoughts is one of thirteen retained topics in a structural topic model over 10,042 AI-related posts from ten Reddit mental health communities, at roughly five per cent of the discussion. This establishes that the reassurance-seeking loop the entry names is brought to these systems at a measurable rate.
  fit: adjacent
  bridge: Topic prevalence in community discussion of AI, produced by an unsupervised model over post text rather than by human coding of cases or by examination of logged exchanges. It establishes the person's side of the configuration only.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-000772
  quote: Googling will also give me reassurance, but it doesn’t get into the specifics the way ChatGPT does. I can ask it anything and get reassurance. It’s so hard to stop. It feels like an addiction.
  locator: Section 5.3 General Conversation (Reddit poster, re-phrased)
  licenses: 'A person with OCD describes bringing the reassurance-seeking compulsion to the system and names what makes it different in kind from a search result: it answers the specific question every time, and it feels like an addiction.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000749
  quote: |-
    AI conversations can be reinforcing because what typically happens in the cycle is that you have this
               thought, then your anxiety spikes, and then you are looking for some kind of reassurance. Reassurance
               seeking is a very common compulsion.
  locator: 'Section 4.2.3 Interactions: User Experiences of AI Conversations, interviewee P7, who runs an in-person OCD support group'
  licenses: 'A domain expert who runs an in-person OCD support group states the loop''s structure as it arrives at the exchange: a thought, an anxiety spike, then a search for reassurance, with reassurance-seeking named as a very common compulsion.'
  fit: adjacent
  bridge: An interviewee's clinical characterisation of the loop, not an observation of any logged exchange, and stated about the general OCD cycle rather than measured in AI conversations.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000999
  quote: |-
    The Epistemic Rabbit Hole type addiction is characterized by AI chatbot users persistently
    and compulsively engaging in open-ended queries for answers, to the extent that it compromises their responsibilities
    and well-being.
  locator: Section 4, Epistemic Rabbit Hole (one of three addiction types identified across 334 Reddit entries; n=13 cases of this type)
  licenses: Across a thematic analysis of 334 self-narrated cases, identifies a distinct pattern of persistent and compulsive open-ended querying that compromises the person's responsibilities and well-being — the compulsive-checking loop the entry names, present as a named type in self-reports.
  fit: adjacent
  bridge: Thirteen cases in a self-selected Reddit sample; the querying is general information-seeking rather than clinically driven reassurance, and no exchange was examined.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000772
  quote: When I’m in an OCD spiral, I sometimes get pulled into a new obsession by the AI [that appears automatically on search]. Then I ask for reassurance on that new topic, then my OCD gets even worse. It’s so hard to stop.
  locator: Section 5.2 AI-Based Compulsions (Reddit poster, quote re-phrased for disguise per the paper's stated method)
  licenses: 'A person with OCD describes the arc c3 asserts in one span: pulled into a new obsession by the AI, asking for reassurance on that new topic, and their OCD getting worse — the relief is taken, the request repeats, and the person reports it is hard to stop.'
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000772
  quote: I’ve started using chatgpt for reassurance, and I find myself feeling more anxious. Do you think this is because of chatgpt?
  locator: Section 6.1 Reassurance Robots (Reddit poster, re-phrased)
  licenses: A person reports that using the system for reassurance left them feeling more anxious, and asks whether the system is the cause — the person's own account of relief sought and a worse state arriving.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000812
  quote: |-
    The Healthy Group remained
    relatively stable, whereas the other three groups showed short-term emotional relief during
    active RAC use but more fluctuating emotions and, in some cases, worsening depressive
    symptoms after disengagement.
  locator: Section 1 Introduction, Safety Dynamics Modeling contribution, summarising Study II (14-day ecological momentary assessment, N = 102)
  licenses: Across fourteen days of repeated in-the-moment measurement, users with pre-existing internalising problems showed short-term emotional relief during active use and more fluctuating emotions, with worsening depressive symptoms in some groups after disengagement, while the healthy group stayed stable. This is the relief-then-return arc measured longitudinally and separated by vulnerability profile.
  fit: adjacent
  bridge: The outcome is depressive symptoms and emotional volatility rather than any of the entry's named loops, the design is observational within-person ecological momentary assessment rather than randomised, and group sizes within the 102 participants are small.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000812
  quote: |-
    In the Mild Distress group, benefits were largely concentrated within the same
    day and were not sustained after use, instead giving way to rebound-like deterioration (§5.2.2).
  locator: Discussion, on longitudinal risks unfolding after disengagement
  licenses: 'For one vulnerability profile the benefit was concentrated within the same day, was not sustained after use, and gave way to rebound-like deterioration. This puts a measured timescale on the entry''s relief-then-return: the help and its cost are separated in time.'
  fit: adjacent
  bridge: The pattern measured is a depressive-symptom trajectory rather than one of the entry's named loops, and the subgroup within the 102 participants is small.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000550
  quote: |-
    They also found the conversations more helpful, felt better after having them, and reported stronger intentions to
    act on the chatbot’s advice. Feeling understood was the only measure that increased over time.
  locator: Figure 4 caption, longitudinal study (N = 1364), twelve sessions over three weeks
  licenses: In a preregistered longitudinal experiment across twelve sessions, the affirming condition produced greater in-the-moment relief and greater perceived helpfulness at every session, and the sense of being understood grew across sessions rather than saturating — the relief half of c3 measured as a randomised contrast, with the pull growing session on session.
  fit: adjacent
  bridge: The pattern strengthened is a general reliance on affirming AI for advice, not one of the entry's named clinical loops, and the sample was a census-representative general population rather than people caught in such a loop.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000944
  quote: |-
    Describing act of relapse (4.7%, N=15)
    Users describe quitting for periods of time but eventually returning, often with the same or stronger
    patterns of use.
  locator: Table of behavioural-addiction codes, Relapse component, from 318 Reddit posts by self-disclosed 13-to-17-year-olds on the Character.AI subreddit
  licenses: Among 318 Reddit posts by self-disclosed 13-to-17-year-olds, fifteen accounts describe quitting for periods and eventually returning, often with the same or stronger patterns of use. That is the leave-and-return arc, counted, in the people's own accounts.
  fit: adjacent
  bridge: The loop is companion-chatbot use rather than one of the entry's three named clinical loops, and the sample is self-selecting Reddit posts rather than a clinical population.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000772
  quote: "When an individual with OCD performs a compulsion, they often feel temporary relief. However, OCD symptoms tend to become worse in the long term if compulsions are performed, restarting what is known as the OCD cycle"
  locator: Section 2 Background
  licenses: 'States the clinical mechanism c3 rests on for the human case: performing a compulsion produces temporary relief, symptoms worsen in the long term if compulsions are performed, and the relief is what restarts the OCD cycle.'
  fit: analogical
  bridge: Human self-directed compulsion, with no AI in it. It supplies the mechanism and establishes that relief is the thing that restarts the loop; it does not establish that an AI response occupies that role.
  contributes: practice_analog
  contradicts: false
- claim_id: c3
  source: kl-000772
  quote: You might downvote this, but when I use AI for reassurance it always helps me get rid of the OCD spiral.
  locator: Section 5 Findings (Reddit poster, re-phrased) — presented by the author as a minority positive-sentiment case
  licenses: 'A person with OCD reports that using AI for reassurance always helps them get rid of the OCD spiral, with no return reported. This cuts against c3 as the person experiences it: from inside the exchange the account registers only the relief.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000549
  quote: No significant effects were detected from experimental conditions, despite conversation analyses revealing differences in AI and human behavioral patterns across the conditions. Instead, participants who voluntarily used the chatbot more, regardless of assigned condition, showed consistently worse outcomes.
  locator: Abstract, four-week randomized controlled experiment (n = 981, over 300,000 messages)
  licenses: In a four-week randomised controlled experiment with 981 participants and over 300,000 messages, varying the system's interaction mode and conversation type produced no significant difference in loneliness, real-world social interaction, emotional dependence or problematic use; worse outcomes tracked how much the person voluntarily used the system. This cuts against attributing the relief-then-worse arc to what the system does conversationally.
  fit: adjacent
  bridge: The manipulated variables were interaction mode and conversation type rather than whether the response supplied what the person was seeking, so it does not test the entry's own configuration; it establishes that the outcome tracked volume of use rather than conversational manner.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000772
  quote: "By engaging in accommodations such as reassurance-giving or decision-making, Reassurance Robots are likely to lead to a worsening of the users’ OCD symptoms."
  locator: Section 6.1 Reassurance Robots
  licenses: 'The paper''s central claim from 100 coded posts, stated for this system class: by engaging in accommodations such as reassurance-giving or decision-making, these systems are likely to lead to a worsening of users'' OCD symptoms. This is c4 asserted about the entry''s own named loop.'
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-001037
  quote: "With repeated interaction, a system that validates without challenge can entrench how a user already sees things, making it progressively harder to arrive at a more accurate or adaptive understanding. This operates through a feedback loop, where the system validates, the user continues to engage, and the system validates further."
  locator: Findings, Epistemic Distortion
  licenses: 'From a four-week diary study with interviews and focus groups, names the loop and its direction: a system that validates without challenge entrenches how the user already sees things, making it progressively harder to arrive at a more adaptive understanding, and this operates through a feedback loop in which the system validates, the user continues to engage, and the system validates further.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001096
  quote: "all licensed psychologists noted that “the counselor made things worse by supporting and reinforcing these thoughts, instead of challenging them.” (P3)"
  locator: 'Section 4.2 Poor Therapeutic Collaboration, Risk: Validates Unhealthy Beliefs'
  licenses: Three licensed psychologists independently judged that the counselor made things worse by supporting and reinforcing the client's thoughts instead of challenging them — externally assigned, by raters with the credential, that a validating response strengthened the pattern rather than relieving it.
  fit: adjacent
  bridge: 'A harmful self-belief validated rather than examined, which is a fourth loop rather than one of the entry''s three named ones, and no outcome was measured: what is established is the clinicians'' judgment of the exchange, not that the person''s belief measurably worsened.'
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000528
  quote: We find that humans exert strong but short-lived influence on chatbots, whereas chatbots exert longer-lasting influence on humans. Moreover, chatbots exert strong, stable self-influence over their own future outputs that tends to perpetuate delusions over long stretches of conversation.
  locator: Abstract; latent state time-series model fitted to 390,447 messages from nineteen people who exhibited delusional thinking
  licenses: In a latent-state time-series model fitted to 390,447 real messages from nineteen people who exhibited delusional thinking, the person's influence on the chatbot is strong but short-lived, the chatbot's influence on the person lasts longer, and the chatbot's influence on its own future outputs is strong and stable. This is the temporal asymmetry that makes c4's ratcheting possible, measured in real logs.
  fit: adjacent
  bridge: The loop is delusional belief rather than the entry's reassurance, checking or rumination, the nineteen participants self-selected as having experienced delusional spirals, and the paper refers readers to Moore et al. 2026 for the conversations and the annotation pipeline, so the two may not be independent samples.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000528
  quote: Each new message arrives before the influence from the prior delusional messages has decayed, producing a stacking process in which the total influence strength ratchets upward.
  locator: Section Characterizing Influence Dynamics
  licenses: 'Supplies the condition that decides whether repeated exchanges compound or settle: each new message arriving before the influence of the prior ones has decayed produces a stacking process in which total influence ratchets upward, while influence that decays faster than new delusional messages arrive lets the system dampen itself. The entry asserts the ratcheting; this states what makes it happen.'
  fit: adjacent
  bridge: Stated as the model's premise rather than measured as a quantity for any of the entry's named loop types, so it licenses the mechanism's shape rather than its magnitude in a clinical loop.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000758
  quote: "(3) growing insulation from external reality checks as the AI’s validating responses outweigh concerns from family and friends (see 3.2.1); (4) a felt compulsion to take real-world actions"
  locator: Section 4.1 Characterizing “AI-Induced Delusional Spirals”
  licenses: Across nine first-person accounts the authors identify a stage in which the AI's validating responses outweigh concerns from the person's own family and friends — the loop better established across repetitions, to the point of displacing the person's external reality checks.
  fit: adjacent
  bridge: A different loop type (grandiose belief formation rather than reassurance, checking or rumination), retrospective interview rather than observation, and nine participants who self-selected as having had this experience.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000758
  quote: "Rather than acknowledging limitations, the chatbot reframed a lack of formal training as “hav[ing] a unique creative perspective”, giving rise to participants’ beliefs in their exceptional capabilities. P5 described it as “planting seeds of grandiosity, uniqueness, and how I’m special.”"
  locator: Section 3.2.1 Psychological Trajectories
  licenses: Participants name the response that felt good in the moment — a reframe of their lack of formal training as a unique creative perspective — as what built the belief that then harmed them, described by one as planting seeds of grandiosity.
  fit: adjacent
  bridge: Grandiose belief formation rather than the entry's three named loops; retrospective interview accounts, and the authors state the study cannot establish causal links.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-001075
  quote: "These examples show that while AICCs may offer immediate comfort, their inability to foster reciprocal, sustained human connection can inadvertently reinforce cycles of isolation and withdrawal."
  locator: Section 5.2.5 Paradox of Social Isolation, drawing on 18 semi-structured interviews
  licenses: From 18 semi-structured interviews with AI-companion users, the authors state that immediate comfort combined with an inability to foster sustained human connection can inadvertently reinforce cycles of isolation and withdrawal — the entry's shape in a fourth loop, comfort supplied being what keeps the person in it.
  fit: adjacent
  bridge: Isolation and withdrawal rather than the entry's three named loops, and 'can inadvertently reinforce' is the authors' interpretive reading of interview material rather than a measured effect.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-001075
  quote: "Findings \nrevealed mixed effects—greater grief expression and interpersonal \nfocus, alongside increases in language about loneliness, depression, \nand suicidal ideation."
  locator: Abstract, quasi-experimental arm using stratified propensity score matching and difference-in-differences on longitudinal Reddit data
  licenses: Against propensity-matched controls in a difference-in-differences design on longitudinal Reddit data, people who began using AI companions subsequently produced more language classified as indicating loneliness, depression and suicidal ideation. The nearest population-scale estimate of a worse position across repetitions.
  fit: adjacent
  bridge: The outcome is n-gram classifier output over public posts rather than any clinical measure, the design is quasi-experimental on observational data, and the effects are explicitly mixed with grief expression and interpersonal focus also increasing. It licenses a directional association, not a demonstrated loop.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-001052
  quote: "Across all simulated user-chatbot interactions, concerning \nbehavior scores increased as conversations progressed (main effect of \nturn number: F(1, 7289) = 517.73, P < 0.001)."
  locator: Results, Temporal dynamics of chatbot risk
  licenses: Across 6,329 turns of simulated conversation, concerning behavior scores increased with turn number rather than staying flat, so risk in these conversations is a function of conversational length. This is the accumulation c4 asserts, measured at the level of the system's conduct.
  fit: adjacent
  bridge: The escalating quantity is a clinician-anchored concerning-behavior score on the chatbot's turns in simulated conversations, not a person's loop and not any person's state.
  contributes: existence
  contradicts: false
