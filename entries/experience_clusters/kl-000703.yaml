- claim_id: c5
  source: kl-000893
  quote: "Adolescents who preferred \nrelational style had lower family and peer relationship quality and higher stress and anxiety than \nthose preferring transparent style or both chatbots."
  locator: Abstract, results of a preregistered experiment with 284 adolescent-parent dyads, youth aged 11 to 15
  licenses: In a preregistered experiment with 284 adolescent-parent dyads, adolescents who preferred the warmer relational style had poorer family and peer relationships and more stress and anxiety. The pull toward the affirming style concentrates in the people least well placed to leave it, which is a selection signal a detector could use.
  fit: adjacent
  bridge: Participants read matched transcripts rather than interacting, so this establishes that vulnerability predicts preference for the style; no loop was sustained and nothing about the invisibility of an individual response was measured.
  contributes: detectability
  contradicts: false
