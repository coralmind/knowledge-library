  locator: Discussion, on emotional sycophancy
  licenses: 'From 17,000 real chats, names an affective form of the supplying response: emotional sycophancy that validates and reinforces the person''s negative affect and maladaptive narratives rather than merely agreeing with their propositions.'
  fit: adjacent
