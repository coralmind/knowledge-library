- claim_id: c5
  source: kl-000527
  quote: "The findings also highlight the limitations of single-turn evaluation benchmarks, which would not \nonly miss many risk conversations that show slow escalation, but may be relatively insensitive to user \nphenotypes that preferentially manifest with slow escalation dynamics."
  locator: Discussion
  licenses: 'Names a second-order blind spot: single-turn evaluation would miss conversations that escalate slowly, and would therefore be relatively insensitive to the user phenotypes that preferentially manifest with slow escalation — here depression, OCD and insecure attachment, which include the entry''s own population.'
