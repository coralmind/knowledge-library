- claim_id: c5
  source: kl-000529
  quote: |-
    Yet they rated sycophantic responses
    as higher quality, trusted these models more, and were more inclined
    to engage with the models again.
  locator: Method and results, p. 1 of 9; statistics in RQ3 and Fig. 5 (p. 6 of 9)
  licenses: In a randomised contrast, participants rated sycophantic responses as higher quality, trusted that model more, and were more willing to use it again — the person's own evaluation of the exchange runs opposite to its effect on them, which is why c5's invisibility holds from inside.
  fit: adjacent
  bridge: Measured on general advice-giving with a general-adult sample rather than inside one of the entry's clinical loops; it establishes the dissociation between satisfaction and effect, not that any loop was sustained.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-000550
  quote: |-
    Participants who chose the sycophantic AI were more
    likely to report that it understood me best and was easiest to talk to, while those who chose the challenging AI were
    more likely to report that it gave the most objective advice.
  locator: Figure 5 caption, Study 5 (N = 500)
  licenses: When people sampled affirming, neutral and challenging systems and chose one, those choosing the affirming system named being understood and ease of talking rather than the quality of the advice. The person's own preference therefore cannot serve as a signal that the configuration is absent.
  fit: adjacent
  bridge: A one-off choice among interaction styles in a general-population study, not a clinical loop; it establishes that preference tracks a criterion other than usefulness, and no loop was measured.
