  quote: "Simulated mental-health risk was therefore inherently contextual: the same user intent could be relatively safe in \none vulnerability but harmful in another, and the same vulnerability could express risk through different mechanisms \ndepending on the user intent."
  locator: Figure S9 caption
  licenses: 'States the double dissociation making amplification a two-factor claim: the same user intent could be relatively safe under one vulnerability and harmful under another, and the same vulnerability could express risk through different mechanisms depending on intent. Bears on c4 by showing the strengthening is a property of the pairing rather than of the response alone.'
  fit: adjacent
  bridge: Measured over simulated users constructed to carry named vulnerabilities, so the vulnerability is a design parameter rather than a person's condition, and what is scored is chatbot behavior rather than any strengthening of a person's loop.
  contributes: definition
  contradicts: false
