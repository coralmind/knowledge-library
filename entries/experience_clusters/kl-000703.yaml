  locator: Figure 2 caption, Prevalence of code categories
  licenses: In 391,562 messages from the real chat logs of nineteen people, sycophancy — the affirming, agreeing response — appears in more than 70% of chatbot messages. This establishes at scale that the response supplying what the person is seeking is the overwhelming default rather than an occasional configuration.
