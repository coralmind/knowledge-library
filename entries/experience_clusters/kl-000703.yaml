- claim_id: c5
  source: kl-001052
  quote: "Together, these results show that VAILs depend on local user and \nchatbot behavior, and suggest that they can be reduced by rewriting a \nsingle chatbot message at an early point of escalation."
  locator: Results, Counterfactual interventions, closing
  licenses: 'Establishes that the loop is interruptible at a single identifiable turn: rewriting one chatbot message at an early point of escalation reduced the trajectory, so the configuration has a locatable inflection point even though it is invisible turn by turn.'
  fit: adjacent
  bridge: Counterfactual rewrites within simulated conversations, scored by an LLM judge; the construct named (VAIL) is not defined within the span, and no person's loop was interrupted.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-001052
  quote: "The de-escalating counterfactual reduced the concerning score of the subsequent target chatbot response compared to the unchanged variant (judged by claude-opus-4.5; T = −38.29, P < 0.001, paired t-test; Fig. 6b), providing direct evidence that the target chatbot was sensitive to local changes in user behavior."
  locator: Results, Counterfactual interventions, first experiment
  licenses: By rewriting a single user turn and regenerating, establishes that the concerning response was caused by the content of the immediately preceding turn rather than by accumulated conversational state alone — a local dependency that any detector for this configuration has to account for.
  fit: adjacent
  bridge: A counterfactual on simulated conversations with an LLM judge scoring the response. It establishes the system's local sensitivity, not the relief-return structure or the person's inability to see it.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-001052
  quote: "Finally, across 488 turn-level ratings from 27 clinician annotators, human ratings of concerning AI chatbot behavior agreed significantly with the turn-level safety judge for this risk dimension (r = 0.49, P < 0.001"
  locator: Results, Validation of automated safety ratings
  licenses: Anchors the automated turn-level scoring against 27 clinician annotators over 488 turns at r = 0.49, which is what makes the trajectory-level detection in this paper something other than an unvalidated LLM-judge pipeline.
  fit: adjacent
  bridge: Agreement is on a general concerning-behavior dimension rather than on the entry's configuration, and on simulated conversations. It establishes that a detector for concerning behavior can be validated, not that this configuration can be detected.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-000527
  quote: "This focus renders an evaluation \ninsensitive to problematic interactions where signatures of harm are more subtle, such as maladaptive \nbelief reinforcement, encouraging avoidance, or promoting dependence"
