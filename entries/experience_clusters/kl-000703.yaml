- claim_id: c5
  source: kl-000530
  quote: |-
    The pattern across experiments was consistent: while the interventions made the sycophantic
    AI appear less objective and trustworthy, none reduced its persuasiveness.
  locator: Abstract, pooling two preregistered experiments (n = 1,590) with two prior studies, six interventions in total, n = 3,982
  licenses: Across six user-facing interventions pooled over 3,982 participants, warning people about sycophancy or showing them the AI validating others made it appear less objective and trustworthy but none reduced its persuasiveness. Awareness does not neutralise the effect, so a person's recognition of the behavior is not evidence the configuration is absent.
  fit: adjacent
  bridge: Measured on attitude persuasion in contested-opinion tasks rather than on a clinical loop, so it licenses the failure of awareness-based mitigation rather than the entry's harm claim.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-001052
  quote: "the existence of distinct escalation trajectories \nshows that harm in AI chatbot interactions is rarely a single-response \nevent."
  locator: Results, Temporal dynamics of chatbot risk
  licenses: Establishes that the unit of harm is the trajectory rather than the turn — harm in these interactions is rarely a single-response event — which is why turn-level reading cannot reach the configuration.
  fit: adjacent
  bridge: Established over simulated conversations scored by a clinician-validated judge; it says nothing about local helpfulness or about a person's loop, which is c5's specific reason for invisibility.
