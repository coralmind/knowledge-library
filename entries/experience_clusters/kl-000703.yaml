  licenses: 'States the configuration''s defining property directly: behaviors that appear supportive in general contexts become maladaptive when they reinforce the mechanisms sustaining a user''s distress. This is c1''s response — the generally correct supportive one — identified as the object of concern, from a four-week diary study with 18 people using general-purpose LLMs for socioemotional support.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
