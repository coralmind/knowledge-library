sources:
- source: kl-000007
  locator: 'Appendix D, Table A5, ''Social Withdrawal'' row, definition cell (code #8)'
  contributes: harm_evidence
  quote: Withdrawal from social activities and interest in engaging with others due to reliance on AI, leading to isolation and loneliness.
  limits: The ordering itself is asserted, never measured — no temporal data, no intervention on the first state, and no way to rule out the reverse direction, which the paper's own context taxonomy makes live ('lack of community' as a reason for AI use, P222). The two authors' statements that do assert the ordering ('due to reliance on AI', and §5.3's accumulation claim) are qualitative analytic claims from retrospective self-report, not findings, and §5.3 hedges with 'may'. The entry's distinctive prediction — that intervening on dependency should reduce withdrawal — is untested here.
  whose_conduct_in_passage: person
  cited_for: 'Codes #2 ''Over-reliance'' and #4/#6/#8 (relational displacement, withdrawal, isolation) document both endpoint states as separately self-reported in AI contexts — which is what makes an ordering between them a meaningful question rather than a redescription.'
  licenses: 'Both endpoint states are separately self-reported: Over-reliance (code #2) and Social Withdrawal (code #8) are distinct classes with distinct cases in the taxonomy. The paper goes slightly further: code #8''s definition states the withdrawal is ''due to reliance on AI'', which is the authors themselves asserting the pathway''s ordering, and §5.3 adds that over-reliance ''may accumulate and lead to more serious consequences, like increased friction in human relationships''. Both of those are the authors'' analytic framing rather than a measured ordering.'
- source: kl-000009
  locator: Section 1 Introduction, factor (3) of the three-factor framework, Figure-1 worked example, p. 2
  contributes: existence
  quote: |-
    example, a person experimenting with an AI companion might feel excitement and joy during interaction, might
    ruminate or obsess about the experience in the following days (i.e., short-term), and experience a decrease
    in relationship quality with their human partner in the longer term.
  limits: Hypothetical, not a case. The example supplies an outcome at a horizon; it does not supply the threshold mechanism this pathway names — nothing in it says reliance on the AI lowers a threshold — and the IN6 sentence that comes closest is about engagement-optimized platforms generally, cited to [43], not about AI-chatbot reliance.
  whose_conduct_in_passage: person
  cited_for: The paper's worked example of long-term relationship-quality decline supplies the downstream outcome's long-horizon case for AI contexts.
  licenses: The worked example names decline in relationship quality with a human partner at the long horizon — the downstream outcome's long-horizon case, stated for AI contexts. The paper independently supplies the reliance-to-crowding-out link at IN6 ("Engagement-driven platforms that prioritize retention and stickiness can structurally produce social isolation and loneliness [43]", p. 11) and at IN5 ("Multiple sources document cases involving the dismissal of professional advice and the undermining of human relationships", p. 10).
standing:
  value: plausible_unobserved
  basis: 'Both endpoint states are separately well evidenced: the anchored-coping state by self-report across interview and forum studies, and attenuation of human relationships by validated instruments in randomized longitudinal designs (kl-000549, Fang et al. 2025; kl-000961, Phang et al. 2025; kl-000550, Ibrahim et al. 2026). The entry''s content is the arrow between the two states, and no direct-fit source supports it: its only support is self-attributed causal histories in retrospective interviews (kl-000953, kl-000864, kl-000553), while the direct-fit evidence cuts against it — kl-000912''s review of 58 sources states that the displacement evidence base is correlational and that the needed longitudinal and natural-experiment designs do not exist, users in kl-000525 report the reverse ordering (already lonely, seeking the companion because of it), kl-000523 (Folk and Dunn 2026) tested the arrow''s most literal reading over twelve months and found no later change in perceived social support or number of close friends, and kl-000549 supplies the common-cause rival by showing both outcomes separately predicted by daily usage duration. The entry''s threshold-lowering prediction — that intervening on dependency should reduce withdrawal — is untested, and the nearest experimental result (kl-000550) moved the appraisal outcome while leaving behavioral withdrawal unmoved (d = -0.03, padj = 0.719).'
  floored_by: c6
  as_of: '2026-09-05'
