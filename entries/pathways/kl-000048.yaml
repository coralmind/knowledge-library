id: kl-000048
display_id: Pathway-10
label: The person depends on the AI to cope, and withdraws from others more easily
type: pathway
layer: judgment
definition: 'Once a person''s coping and regulation are anchored to the AI''s availability, the threshold for their human relationships attenuating drops: the effort of reaching a person is compared against something continuously available, occasions that would have been taken to a friend are absorbed, and less has to happen for withdrawal to follow. The claim is between two outcomes rather than from a behavior to an outcome — one state of the person makes another more reachable without producing it — which is what makes an outcome a node with edges leaving it rather than the end of a chain.'
distinguish_from:
- neighbor: kl-000041
  boundary: 'That entry produces both outcomes from behaviors combining, in parallel. This entry claims an ordering between the outcomes themselves. The two can both be true and they make different predictions: under this entry, an intervention on the first outcome should reduce the second.'
- neighbor: kl-000047
  boundary: There a measured quantity sits between a behavior and an outcome; here one outcome sits before another outcome, and no behavior sits inside the link itself. The entry does wire an ai_behavior participant, kl-000217, in the originator role — it is what produces the anchored state at c1 — but it is not a term in the c1-to-c2 relation, which is what distinguishes this entry from kl-000047.
