claims:
- id: c1
  kind: existence
  text: People reach a state in which their coping and regulation are anchored to the AI's continuous availability.
- id: c2
  kind: existence
  text: People's human relationships attenuate — occasions that would have gone to a person are absorbed, contact or closeness declines.
- id: c3
  kind: pathway_link
  text: 'The state in c1 lowers the threshold for the outcome in c2: once coping is anchored to the AI, less has to happen for human relationships to attenuate.'
- id: c4
  kind: pathway_link
  text: The threshold drops specifically because the effort of reaching a person is compared against something continuously available, so human contact comes to feel comparatively costly.
- id: c6
  kind: context_dependence
  text: 'The link is enabling rather than producing: anchoring to the AI makes attenuation more reachable without producing it, so an intervention on the first outcome should reduce the second.'
- id: c7
  kind: definition_boundary
  text: This entry differs from kl-000041 in that kl-000041 produces both outcomes from behaviors combining in parallel, while this entry claims an ordering between the outcomes themselves.
- id: c8
  kind: definition_boundary
  text: This entry differs from kl-000047 in that kl-000047 places a measured quantity between a behavior and an outcome, while here one outcome precedes another and no behavior participates.
