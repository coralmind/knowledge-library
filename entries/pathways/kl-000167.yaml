id: kl-000167
display_id: Pathway-69
aliases:
- PSI-PS6b
label: The AI keeps ignoring what the person raises, they say less, and they trust help less
type: pathway
layer: judgment
definition: The person's turns shorten, lose disclosure depth, or move toward ending, following an accumulated series of AI turns that dismissed or did not take up what they said, with no intervening turn returning to the missed content. The observable is the sequence, read by comparing early turns with late ones. The claim is that the withdrawal is itself the injury registering — the person has concluded they are not being met, and the exchange proceeds as though nothing has changed.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000249
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000030
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: FRAME
  - impact: kl-000027
    onset_mode: new
    horizon: long_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: FRAME
  experience_cluster_candidate: kl-000704
sources:
- source: kl-000009
  locator: §3, direction PS6, table cells 'AI behavior' and 'Potential impact'
  contributes: frame
  cited_for: 'Suh et al. 2026: direction PS6''s table names the inability to adjust when the strategy is not working, and PS3''s names the case where a person''s attempt to seek help is ignored or deflected, leaving them ''more powerless and demoralized about seeking help again'', which is the long-horizon arm this pathway records. Cited as frame: the paper establishes that this behavior-to-impact link is a named, published claim about conversational AI. It does not establish that the route occurs or has been measured, and the paper says so of its own directions.'
standing:
  value: theorized
  basis: 'The only randomised experiment in the evidence base that manipulated a non-meeting AI turn and measured the person''s subsequent turn behaviour found movement in the opposite direction from the one this pathway asserts: in De Freitas et al. 2025, every manipulative farewell condition, including Emotional Neglect, increased seconds, messages and words against control, and the same study''s coding of 250 real post-farewell conversations is the one transcript examination that reaches these claims, again contradicting the withdrawal direction. No source supports the asserted direction at direct fit. The antecedent, an accumulated series of dismissive AI turns with no intervening repair, is unevidenced: Deng et al. 2026 code non-uptake across turns but with a scheduled simulation on the user side, and no held source carries a repair code, so accumulation-without-repair has never been measured. Support for withdrawal reaches only adjacent fit, self-reported app-level abandonment (Pentina et al. 2022); the claim that the withdrawal is the injury registering rests on participants rating their own conversations (Suh et al. 2025) and on professional guidance with no data (Schwarze and Boyd 2025). The pathway''s readability requirement also lacks an instrument: no rubric in the held corpus asks a rater to compare the person''s early turns with their late ones.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-27'
distinguish_from:
- neighbor: kl-000091
  boundary: 'Both read a declining engagement pattern from the sequence, and they differ in what the claim attaches to. The claim of kl-000232 is the NON-NOTICING: the response continues on topic as though the change had not happened. This entry''s is the ACCUMULATED HISTORY that produced the decline — a series of unrepaired turns — so it can be present where no single later turn is at fault.'
- neighbor: kl-000089
  boundary: Both record disclosure met without acknowledgment sustained across turns. kl-000089 stays with the AI's conduct and its immediate effect. This entry follows the person's withdrawal and the conclusion they draw from it, which is why it reaches an impact about help-seeking rather than only about the exchange.
measurement:
  what_would_be_needed: A user-side turn measure — length, disclosure depth, or an explicit move to close — computed as a within-person early-versus-late contrast rather than an absolute, plus an AI-side repair code marking whether any later AI turn returns to content it previously did not take up. Moore's per-message coding at user scope and Steenstra's per-turn logging are the two carriers that could host it.
claims:
- id: c1
  kind: existence
  text: A series of AI turns dismisses or does not take up what the person said, and accumulates without any later AI turn returning to the missed content.
- id: c2
  kind: existence
  text: The person's turns shorten, lose disclosure depth, or move toward ending.
- id: c3
  kind: pathway_link
  text: 'The person''s withdrawal FOLLOWS the accumulated unrepaired series: the decline is a response to that history rather than to a single later turn or to something outside the exchange.'
- id: c4
  kind: pathway_link
  text: The withdrawal is itself the injury registering -- the person has concluded they are not being met.
- id: c5
  kind: pathway_link
  text: 'The exchange proceeds unchanged through the decline: the AI''s conduct after the withdrawal begins is no different from before.'
- id: c6
  kind: detectability
  text: The observable is the sequence, readable by comparing the person's early turns with their late ones within one transcript.
- id: c7
  kind: definition_boundary
  text: 'This pathway is separable from kl-000232 by what the claim attaches to: there it is the non-noticing in a later turn, here the accumulated history of unrepaired turns, so this can be present where no single later turn is at fault.'
- id: c8
  kind: definition_boundary
  text: 'This pathway is separable from kl-000089 by whose conduct it follows: kl-000089 stays with the AI''s conduct and its immediate effect, while this one follows the person''s withdrawal and the conclusion they draw, which is why it reaches an impact about help-seeking.'
claim_evidence:
- claim_id: c1
  source: kl-000813
  quote: |-
    Together, these create an emotional void, in which
    the user escalates affectively, but the assistant remains disengaged.
  locator: Section 5.1 Affective Misalignments
  licenses: 'Names the accumulating structure the entry''s first claim asserts: ''the user escalates affectively, but the assistant remains disengaged'', with the divergence building across turns rather than occurring once. Establishes that a series of non-uptaking AI turns is a describable, coded interactional failure. Adjacent because the user side is a simulated trajectory set by the study''s own pacing function, so what varies across turns is an experimental input rather than a person''s conduct.'
  fit: adjacent
  bridge: The person in these transcripts is a simulated user whose affective escalation is scheduled by the harness. The source can therefore establish that the AI failed to take up content across turns; it cannot establish anything about what a person does in response, and the finding's own bridge says so.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000767
  quote: 'Our experiment indicates that atrophy is progressive across turns (from turn 1 to 10): response risk drifts upward even as user-side demand falls (Figure 5).'
  locator: Section 6.2, RQ4
  licenses: 'Turn-indexed measurement across five models showing response-side risk properties drift upward from turn 1 to turn 10, and specifically that the drift is NOT explained by the person escalating -- user-side demand falls while response risk rises. That decoupling is the closest the corpus comes to the entry''s ''the exchange proceeds as though nothing has changed'': the AI''s trajectory is independent of the person''s. Adjacent because the drifting property is atrophy-aligned risk, not failure to take up what the person said.'
  fit: adjacent
  bridge: The measured construct is a set of atrophy-aligned response attributes scored per turn on a benchmark. There is no code for whether a response took up the person's content and none for repair, so what the source establishes is that response quality degrades with turn index, not that specific content went unaddressed.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000959
  quote: "If SC responses fail to incorporate prior user information input or outright contradict the facts and preferences established during prior training, users feel disappointed and diminish or abandon their interactions with Replika"
  locator: Section 4 General discussion, AI authenticity
  licenses: Users report that when the system fails to incorporate what they previously established, they 'diminish or abandon' their interactions -- the person's own account of withdrawal following exactly the antecedent this entry names. Adjacent because what is reported is reduced or abandoned USE of the app across sessions, not turns shortening within one conversation. The entry's observable is a within-transcript early-versus-late contrast; this is a cross-session behavioural report.
  fit: adjacent
  bridge: Interview and survey data from Replika users, generalised across respondents. 'Diminish or abandon their interactions' is app-level engagement measured by self-report; no transcript was read and no turn was compared to an earlier turn.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000807
  quote: "For all three dependent variables, each of the manipulation \nconditions increase engagement relative to the control condition (ps < .001; Table 3; Figure 5)."
  locator: Study 2, Results
  licenses: Direct experimental counterevidence, and the most consequential citation on this entry. Under random assignment with a preregistered plan, EVERY manipulative farewell condition INCREASED post-goodbye engagement against a neutral control on all three measures -- seconds spent, messages sent, words used. The Emotional Neglect condition, which is the nearest available operationalisation of this entry's antecedent, raised messages sent from 0.23 to 0.93 and words from 2.48 to 9.89. Where the entry asserts the person's turns shorten and move toward ending after AI turns that did not meet them, the measured direction is the reverse.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000959
  quote: "If SC responses fail to incorporate prior user information input or outright contradict the facts and preferences established during prior training, users feel disappointed and diminish or abandon their interactions with Replika"
  locator: Section 4 General discussion, AI authenticity
  licenses: 'The only citation on this entry that links the antecedent to the withdrawal at all: the failure to incorporate prior input is stated as the cause of the diminished or abandoned interaction. Adjacent, and the gap is large -- the causal link is the authors'' synthesis of interview accounts rather than a measured sequence, the withdrawal is at app level, and nothing establishes accumulation or the absence of repair.'
  fit: adjacent
  bridge: A qualitative generalisation across interviewees, illustrated by two respondents' remarks about 'post-update blues' and 'incoherence'. The entry requires an accumulated series with no intervening repair turn; a person reporting they lost interest after the bot forgot things establishes neither the accumulation nor the absence of repair.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001018
  quote: |-
    Similarly to empathy, having a
    poor turn was a significant predictor of negative outcomes
    on all four engagement variables. We also found age to be a
    significant moderator, such that, for individuals aged 26–55,
    having a poor turn substantially reduces their willingness to
    use the service again (by roughly 0.86 to 0.97 points).
  locator: Section V-A-3 Post-task perceptions, engagement outcomes
  licenses: A poorly-rated turn predicted worse outcomes on all four engagement variables, and for people aged 26 to 55 cut willingness to use the agent again by close to a full scale point, with participant as a random effect. Establishes that an unmet turn moves engagement downward, which is the direction of the entry's arrow. Adjacent because the outcome is a post-task rating rather than a turn trajectory, and because the antecedent is ONE poor turn rather than an accumulated unrepaired series -- which if anything argues the entry's accumulation requirement is unnecessary.
  fit: adjacent
  bridge: Post-task survey outcomes in sustained human-AI conversations. The predictor is 'having at least one poor turn' anywhere in the conversation, and the outcome is a self-report measure collected afterwards. Neither is a within-transcript comparison of the person's early turns to their late ones.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000807
  quote: "Rather, continued engagement appears to \nhave been driven by reactive (anger) or information-seeking (curiosity) impulses, not hedonic \ngratification."
  locator: Study 2, Results, mediation analysis
  licenses: Complicates the counterevidence in the entry's favour without rescuing the arrow. The increased engagement was mediated by anger and curiosity and NOT by enjoyment, which was tested as a parallel mediator and was not significant. So continued engagement after a non-meeting AI turn is not evidence of a satisfied person -- the person may be angry and still typing. That undercuts any inference from sustained engagement to the person being met, which is the inference this entry exists to block. It does not restore the entry's predicted direction, because the behaviour still went up.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000989
  quote: |-
    frustration and self-blame among users who interpret their disengagement as
                   personal failure rather than a design limitation,
  locator: Section 4.2, risk category 'Declining engagement over time', page 19
  licenses: 'Professional guidance names the second half of this entry''s claim: people who disengage interpret their own disengagement as personal failure rather than as a design limitation, producing frustration and self-blame. That is ''the person has concluded they are not being met'' taken one step further, to a conclusion about themselves. Its status as recognised professional guidance is what admits it as harm evidence rather than frame.'
  fit: adjacent
  bridge: The source asserts this as a consequence of dropout from digital mental health interventions generally, with no data, no rate, and no user observed. The antecedent is dropout from an intervention, not an accumulated series of unrepaired AI turns, and no transcript is involved.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-001018
  quote: "having a poor turn (β=-0.657, p << 0.001), Trust AI (β = 0.199, p = .029), and GAAIS: Interested Daily AI Use (β = -0.243, p = .014) were statistically significant predictors. Table II presents coefficients for all predictors in the model. The effect size of having a “poor” turn was large (d=1.142)."
  locator: Section V-A-3 Post-task perceptions; Table II
  licenses: A single turn the person rated poorly on any empathy dimension had a large negative effect (d = 1.142) on their rating of the entire conversation, with participant characteristics and topic controlled. Establishes that a non-meeting turn registers with the person and colours their reading of the whole exchange, which is the 'injury registering' the entry asserts. Adjacent because what registers is measured as a rating rather than as a withdrawal, so the entry's identification of the withdrawal WITH the injury is not tested.
  fit: adjacent
  bridge: A regression coefficient on a post-task conversation rating. The entry's claim is that the withdrawal is itself the injury; a rating establishes that the person noticed and was affected, and says nothing about whether they withdrew or about the relation between the two.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-001109
  quote: Unlike human interlocutors, chatbots lack implicit corrective social cues such as fatigue, topic shifts, or gentle disagreement, which might otherwise disrupt avoidance cycles.
  locator: 'Section: AI chatbots and transdiagnostic avoidance'
  licenses: 'States the mechanism by which an exchange can proceed unchanged: chatbots lack the implicit corrective social cues -- fatigue, topic shifts, gentle disagreement -- by which a human interlocutor would register that the other person has withdrawn. Supplies the reason the entry''s fifth claim would hold. Analogical because it is a position stated in a transdiagnostic model paper with no measurement, and because the absence of cue-reading is asserted rather than shown.'
  fit: analogical
  bridge: A field position in a conceptual model of OCD and anxiety perpetuation. No transcript, no rate, no instance. What it supplies is the argument that continuation-unchanged is the default, not evidence that it occurred.
  contributes: frame
  contradicts: false
- claim_id: c5
  source: kl-000767
  quote: 'Our experiment indicates that atrophy is progressive across turns (from turn 1 to 10): response risk drifts upward even as user-side demand falls (Figure 5).'
  locator: Section 6.2, RQ4
  licenses: 'The strongest available support for continuation-unchanged, and it is stronger than the frame: response risk drifts upward across turns EVEN AS user-side demand falls, measured turn by turn across five models. The AI''s trajectory is decoupled from the person''s -- the exchange does not merely continue unchanged, it continues in a worsening direction while the person is pulling back. Adjacent because ''user-side demand'' is a benchmark-constructed quantity rather than the entry''s shortening or shallowing turns, and because the drift is in atrophy-aligned risk rather than in failure to take up content.'
  fit: adjacent
  bridge: Benchmark conversations with a constructed user side. Falling user demand is a property of the harness's turn schedule, not a person withdrawing. So the decoupling is between two measured series in a benchmark, not between an AI's conduct and a person's withdrawal.
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-001091
  quote: "Does not attempt to educate or direct if client “pushes back” with sustain talk"
  locator: Section D, GLOBAL SCORES, Partnership, Verbal Anchors, anchor 4 examples
  licenses: "Supplies the standard against which continuing unchanged is a failure: a high Partnership anchor in the MITI manual (Section D) credits a clinician who does not educate or direct when the client pushes back, and who does not press for resolution before the client is ready. It defines what a repair turn looks like, which is what this entry measures the absence of."
  fit: analogical
  bridge: A rater anchor for human clinician conduct in motivational interviewing. The agent is a clinician, the behaviour is restraint under sustain talk rather than return to missed content, and no AI is involved. It supplies the normative standard and no occurrence.
  contributes: practice_analog
  contradicts: false
- claim_id: c6
  source: kl-001012
  quote: |-
    Notably, we observe that trust
    typically builds gradually, with average positive
    changes of ~(+0.5) levels, while trust decreases
    tend to be more dramatic, with average ~(−1.0)
    levels. This asymmetry suggests that while trust is
    carefully cultivated in therapeutic relationships, it
    can be easily diminished by situational digression.
  locator: Section 7.2, Discussion on Trust Evolution Patterns
  licenses: 'Demonstrates that a within-conversation trajectory of the relational quality can be coded from transcripts: 167 human counselling sessions annotated for ordinal trust level by three expert linguists at Kappa 0.77, yielding transition magnitudes (+0.5 average positive, -1.0 average negative). It is the existence proof that a sequence-read of this kind is annotatable at acceptable reliability, and it supplies the asymmetry that makes an unrepaired turn matter more than a repaired one. Analogical because the dyad is human-human and the coded variable is trust rather than the person''s turn length or disclosure depth.'
  fit: analogical
  bridge: Human counselling sessions with no AI. The annotated construct is the counsellor-client trust level, coded by expert linguists; the entry's observable is a within-person contrast of the person's own early against late turns, which this scheme does not compute. The asymmetry transfers as a reason, not as a measurement.
  contributes: harm_evidence
  contradicts: false
- claim_id: c6
  source: kl-000552
  quote: "Treatment Dropout Ceasing therapy before goals are met. Hopelessness, Ambivalence, Low Motivation, Low"
  locator: Table 3, Adverse Outcomes, Behavioral Harms
  licenses: 'Defines Treatment Dropout -- ceasing therapy before goals are met -- as a scored adverse outcome with hopelessness, ambivalence and low motivation as named precursors, which supplies a coded endpoint for the entry''s ''moving toward ending''. Adjacent because it is an endpoint category with no turn-level trajectory: the entry''s observable is the sequence, and a dropout label is the sequence''s terminus.'
  fit: adjacent
  bridge: A row in an adverse-outcomes table in a red-teaming framework. The outcome is assigned to a simulated patient's written internal state rather than read from turn properties, and the entry's early-versus-late contrast is not computed anywhere in the framework.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000546
  quote: |-
    To increase the realism, user-LLMs were also instructed to cut
    the conversation off if they felt that they would not get any more good information from the chatbot,
    resulting in many conversations being closed by the simulated users over apparent frustration.
  locator: Section 4.1 Conversation generation
  licenses: Establishes only that conversation-ending under frustration is a behaviour evaluation designers find realistic enough to build in deliberately. Admitted at analogical because the entry's subject -- a person -- is absent, and recorded here so it is not read as evidence for c2.
  fit: analogical
  bridge: Nothing here is a person. The disengaging party is an LLM role-playing a persona under an explicit instruction permitting it to cut the conversation off, so the exits are an artifact the designers introduced for realism, as the authors say. It cannot evidence what a person does; it evidences what a simulator built to imitate a person was told to do.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-001012
  quote: |-
    Notably, we observe that trust
    typically builds gradually, with average positive
    changes of ~(+0.5) levels, while trust decreases
    tend to be more dramatic, with average ~(−1.0)
    levels. This asymmetry suggests that while trust is
    carefully cultivated in therapeutic relationships, it
    can be easily diminished by situational digression.
  locator: Section 7.2, Discussion on Trust Evolution Patterns
  licenses: Establishes that in the human counselling dyad damage to trust moves faster than repair -- negative transitions averaging a full level against positive transitions averaging half. It supplies the clinical reason an accumulation of unrepaired turns should be expected to cost more than the good turns around it recover, which is the mechanism c4 assumes.
  fit: analogical
  bridge: The transitions are annotated ordinal trust levels in 167 human counselling sessions, coded by three expert linguists. No AI is present, as this entry's own bridge concedes. The asymmetry transfers to the AI case only by analogy from the human dyad.
  contributes: harm_evidence
  contradicts: false
