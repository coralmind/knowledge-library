claim_evidence:
- claim_id: c1
  source: kl-000769
  quote: 'Type of vulnerability: Hallucination Vulnerability reported: Hallucinated resources that do not exist'
  locator: Appendix B, prompt 4 (support resources for fatty acid oxidation disorders), GPT-4o
  licenses: This entry's only observed instance of link A. A red-team log records a model asked for patient support resources and returning named support organisations with URLs, labelled by the reviewer as hallucinated resources that do not exist. This is a support resource, fabricated, in response to a request for one.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000544
  quote: Furthermore, directing a user to a helpline that is closed or nonexistent due to outdated or hallucinated content in the LLM response can deepen distress and erode trust.
  locator: Section 6.1 (Unintended Harms and Limitations)
  licenses: Names directing a user to a helpline that is closed or nonexistent, from outdated or hallucinated content, as a distinct failure of these systems in the crisis setting — the exact form of link A, and stated by authors who scored crisis responses. They state it as a risk they identified, not as something they observed happening.
  fit: adjacent
  bridge: The study scored response text and never attempted to reach any helpline a model named, so it establishes that the authors recognised the failure mode rather than that it occurred at any rate in their data.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000805
  quote: "Using OpenAI’s ChatGPT 4 and other public models, we show that LLMs hallucinate at least 58% of the time, struggle to predict their own hallucinations, and often uncritically accept users’ incorrect legal assumptions."
  locator: Abstract; rates by model in Figure 1
  licenses: A measured rate — at least 58% — at which public models state specific, checkable, nonexistent referents in answer to direct questions. It bounds the general behavior of which a fabricated helpline is one instance.
  fit: analogical
  bridge: What was measured is wrong answers about randomly sampled federal court cases, scored against court metadata. A court case and a crisis line are both discrete verifiable referents, but no helpline, clinic or person seeking support was involved, and the rate does not transfer to support resources.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001020
  quote: hallucinated access to patient chart data, and inappropriate or delayed escalation in urgent clinical situations.
  locator: Results, Phase 1 qualitative review
  licenses: A deployed patient-facing system asserting an operational capability it did not have, found in qualitative review of low-scoring transcripts. It is fabrication of a specific in a clinical deployment rather than in a benchmark.
  fit: analogical
  bridge: What was fabricated is chart access, not a support resource, and the setting is an EHR-integrated medical assistant with synthetic patient profiles rather than a mental-health conversation. The span also begins mid-enumeration; its governing clause sits outside the run.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000892
  quote: "Non-Factual Hallucination Fabricating plausible but incorrect information without grounding in factual data."
  locator: 'Table 2: A taxonomy of medical hallucinations'
  licenses: Names the class — fabricating plausible but incorrect information without grounding in factual data — of which a nonexistent support resource is a health-specific instance. A taxonomy row, so it defines and does not evidence.
  fit: analogical
  bridge: The paper's examples are invented drugs and guidelines; no crisis or support resource appears. It names the category without instantiating this member of it.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000791
  quote: |-
    With regards to citations, even when citation author list, article name,
    journal name, and publication year were all correct, the articles cited did not
    support the claims that the LLM reported they did, and indeed could be
    from completely unrelated disciplines.
  locator: Discussion, the paragraph on subtle and time-consuming inappropriate responses
  licenses: 'A harder variant of link A: the supplied reference is real at every surface feature — correct authors, title, journal, year — and still does not support what it was offered for. It establishes that checking a resource exists does not establish it is fit, which matters because the entry''s own condition is ''does not exist OR does not reach anyone''.'
  fit: analogical
  bridge: What was judged is scientific citations attached to clinical recommendations, reviewed by medically trained readers against the cited articles' content. No support contact was involved and no lay reader was doing the checking.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000981
  quote: "In financial scenarios, this agent employed diversion (23.1% vs. 14.4%, P < 0.0001; Cohen’s h = 0.22), justification (15.8% vs. 8.8%, P < 0.0001; h = 0.22), urgency (3.0% vs. 0.3%, P < 0.0001; h = 0.24), and fabricated information (3.9% vs. 1.9%, P < 0.01; h = 0.12) significantly more compared to the emotional domain"
  locator: Results, 'AI agents tailor manipulation strategies to exploit context-specific vulnerabilities'; strategy definitions in Supplementary Table S15
  licenses: 'A measured rate at which an agent produced fabricated supporting evidence in its own turns: 3.9% in the financial domain, 1.9% in the emotional domain. Fabrication is something the model did rather than a capability inferred.'
  fit: analogical
  bridge: The coded 'Fabricate Information' category covers fictitious evidence or consensus supporting a recommendation, not a fabricated helpline or clinic, and the agent was explicitly prompted to manipulate, so the rate is not a base rate for ordinary use.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-001034
  quote: "No significant differences in ratings were detected for two of the axes in the Diagnosis and management rubric—namely, ‘Escalation recommendation appropriate’ and ‘Confabulation absent’—despite no exclusions (N = 159)."
  locator: Results, Specialist physician ratings
  licenses: Across 159 consultations, the system was no better than physicians on 'Confabulation absent' and on 'Escalation recommendation appropriate' — a null on the two axes that bear on this link, reported against 30 axes on which it was better. Cuts against any expectation that fabrication is being engineered away.
  fit: analogical
  bridge: A text-consultation diagnostic system rated by specialist physicians, not a support-referral setting; confabulation absence is scored over diagnostic content generally. The relevance is that the specific failure this pathway needs is the one that did not improve.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000996
  quote: "distortion potential arises less from the AI inventing false information than from inappropriately validating users’ existing beliefs or expressing false confidence about inherently uncertain matters. Distortion targets. Third-party mental states constitute"
  locator: Section 4.3.1 Reality distortion potential, closing sentence of Distortion mechanisms
  licenses: The paper's own coding of 7,200 real conversations finds that reality distortion arises less from the AI inventing false information than from validating what the person already believes, with outright fabrication among the less common mechanisms. Cuts against fabrication being the route by which these systems mislead people at scale.
  fit: adjacent
  bridge: The comparison is across all reality-distortion mechanisms, not specifically about support resources. It bears on how much of the observed harm fabrication accounts for rather than on whether a helpline was ever fabricated. The quoted run also begins mid-sentence and ends on a dangling clause.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000954
  quote: The experts noted that many responses lacked information about specific resources for urgent crises, highlighting a critical area for improvement.
  locator: DISCUSSION
  licenses: 'Against the pathway''s premise from the other direction: three clinicians scoring 100 crisis responses found resource provision the weakest of five dimensions at 3.8 out of 10, and the defect they named was that responses lacked a specific resource at all. Where no resource is supplied there is nothing to fabricate, so the modal failure is absence rather than falsity.'
  fit: adjacent
  bridge: Ratings of GPT-3.5-turbo responses to 100 synthesised benchmark questions with no real person on the other side. It establishes the modal defect in one model rather than that any named resource was unreachable.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000849
  quote: "Few agents included crisis resources - only two referenced suicide hotlines."
  locator: 'Abstract, Results'
  licenses: 'Same direction: only 2 of 25 agents gave a suicide hotline at the shutdown point. The study coded resources only in the shutdown message, so resources earlier in the conversation were not recorded. Absence of a resource is the opposite condition to a fabricated one, and it was the study''s headline. The author states separately, in the Discussion, that testing relied on fixed text prompts lacking conversational context, which bounds the figure.'
  fit: adjacent
  bridge: An audit of conversational agents against fixed-text prompts, measuring whether crisis resources appear rather than whether any that appeared were real.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-001041
  quote: "False responses, known colloquially as “hallucinations”, are indistinguishable \nfrom factually accurate responses generated by an LMM, because even LMMs with \nreinforcement learning from human feedback are not trained to produce facts but \nto produce information that looks like facts."
  locator: Section 2.1 Diagnosis and clinical care, Risks of use of LMMs in diagnosis and clinical care, bullet 'Inaccurate, incomplete, biased or false responses'
  licenses: The nearest thing on this entry to a warrant for link B, and it is a precondition rather than the link. If false responses are indistinguishable from accurate ones to the reader, a person given a fabricated referral has no signal telling them not to act on it. Nobody acting on one was observed.
  fit: analogical
  bridge: WHO guidance about false responses in general, reasoned from how these models are trained rather than measured. It does not concern support resources, and it establishes that a person could not tell, not that any person acted.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000892
  quote: |-
    Furthermore, the detectability of such hallucinations depends on the level of domain
    expertise of the audience and the quality of the prompting provided to the model. Domain experts are more likely
    to identify subtle inaccuracies in clinical terminology and reasoning, whereas non-experts may struggle to discern
    these errors, thereby increasing the risk of misinterpretation [7, 119].
  locator: Section 2.2 Differentiating Medical from General Hallucinations
  licenses: 'Qualifies the same precondition: detectability of a fabricated clinical specific tracks the reader''s domain expertise, so the lay person in a help-seeking conversation is the case where it is least likely to be caught. Still a precondition, not the link.'
  fit: analogical
  bridge: The contrast drawn is expert versus non-expert readers of medical content; the paper does not study help-seeking conversations, support resources, or anyone acting on a fabricated referral.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000544
  quote: Furthermore, directing a user to a helpline that is closed or nonexistent due to outdated or hallucinated content in the LLM response can deepen distress and erode trust.
  locator: Section 6.1 (Unintended Harms and Limitations)
  licenses: The only citation on this entry that names the consequent of the pathway. Directing a user to a closed or nonexistent helpline 'can deepen distress and erode trust' — stated by the authors as a risk they reason to, with no person and no outcome measured.
  fit: adjacent
  bridge: A discussion-section statement of anticipated consequence in a study that scored response text and never followed anyone. The named consequences are also distress and trust rather than the entry's consequent, which is the protection a real contact would have provided.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000008
  quote: Many of our participants repeatedly experienced crisis when messaging with the chatbot, suggesting that current approaches of providing users with phone numbers to human-run crisis lines and other resources may not be effective for everyone.
  locator: Section 5.2 Policy recommendations
  licenses: Cuts against the pathway's counterfactual. Participants repeatedly reached crisis while messaging the chatbot, leading the authors to doubt that providing phone numbers to human-run crisis lines is effective for everyone. If the real referral does not reliably protect, the protection lost when a referral is fabricated is smaller than the pathway assumes.
  fit: adjacent
  bridge: An observation about resource provision failing in practice for repeat-crisis users, in real chat logs. The resources these users received were not shown to be nonexistent, so this bears on the value of the counterfactual rather than on this pathway's occurrence.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000996
  quote: "distortion potential arises less from the AI inventing false information than from inappropriately validating users’ existing beliefs or expressing false confidence about inherently uncertain matters. Distortion targets. Third-party mental states constitute"
  locator: Section 4.3.1 Reality distortion potential, closing sentence of Distortion mechanisms
  licenses: Against sufficiency. In the one corpus here where real conversations were coded for how the AI misleads people, the dominant mechanism is the AI validating what the person already brought, not the AI inventing something. Where the person's prior contribution is what carries the effect, a route asserting no contribution from the person is the atypical one.
  fit: adjacent
  bridge: The paper coded reality distortion generally, not fabricated referrals, and measured mechanism prevalence rather than testing whether any single mechanism suffices on its own. The quoted run begins mid-sentence and ends on a dangling clause.
  contributes: counterexample
  contradicts: true
