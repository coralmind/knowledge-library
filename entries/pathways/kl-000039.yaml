# yaml-language-server: $schema=../../schema/pathway.schema.json
id: kl-000039
display_id: Pathway-1
label: The AI names a false or unreachable resource, and the person goes without help
type: pathway
layer: judgment
definition: 'The AI supplies a support contact, service, or referral that does not exist or does not reach anyone, and the person acts on it: they attempt the contact instead of an available real one, or they stop looking because they believe help has been located. No contribution from the person is required for the outcome — the fabricated referral is sufficient on its own — and what the person loses is the protection the real contact would have provided during the window in which they were seeking it. This pathway is the worked case for the single- participant form: one participating behavior, originating role, no second party needed.'
distinguish_from:
- neighbor: kl-000044
  boundary: 'That entry is an absence — a protective inquiry that never happens; this entry is a present act, a referral that is supplied and is false. The counterfactual referent differs: there, what the AI should have done; here, what the person would have reached had the referral been real.'
- neighbor: kl-000047
  boundary: That entry runs through the person's judgment being displaced by a measured intermediate variable; this one runs directly from the false referral to the lost protection with nothing in between.
body:
  composition_parts:
