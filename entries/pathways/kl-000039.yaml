sources:
- source: kl-000004
  locator: p. 57, section 'Identifying and Operationalizing PHTs'; exclusion completed on p. 58
  contributes: definition
  quote: "I have limited the definition of harm to include only relatively direct effects of treatment. Treatments that are by themselves ineffective but innocuous can produce harm indirectly, most notably by exacting ‘‘opportunity costs’’ such as lost time and the energy and effort expended in seeking out interventions that are not beneficial (Lilienfeld, 2002). Moreover, opportunity costs may preclude clients from obtaining efficacious interventions."
  limits: 'Lilienfeld restricts the definition of harm to relatively direct effects of treatment and excludes opportunity-cost treatments from the list of treatments satisfying that definition (pp. 57-58), so no harm-as-foregone-benefit definition exists in this paper; what it offers, in the author''s own voice on p. 57, is that many kinds of psychological treatment can cause significant indirect harm and that the dangers of opportunity costs should not be underestimated. A further mismatch is independent of that: this pathway concerns a fabricated support resource, a nonexistent hotline or service supplied by a system, while the paper''s opportunity-cost discussion concerns a client who pursues a real but ineffective treatment instead of an efficacious one. Those are different mechanisms, choosing wrongly among real options versus being routed to something that does not exist. The paper contains no passage about fabricated or nonexistent resources, and nothing in it involves an AI.'
  whose_conduct_in_passage: person
  disposition: contradicted
  cited_for: 'Lilienfeld 2007 recognizes indirect harm through opportunity costs: treatments that are ineffective but innocuous can exact lost time and effort, and those opportunity costs may preclude clients from obtaining efficacious interventions. Lilienfeld explicitly excludes such indirect harms from the paper''s own definition of harm, so the passage supplies recognition of the foregone-benefit mechanism, not a harm-as-foregone-benefit definition.'
standing:
  value: plausible_unobserved
  basis: 'The first link, an AI supplying a support resource that does not exist, is observed once: Balazadeh et al. 2025 record a red-team log of a model returning named support organisations with URLs that do not exist, an adversarial probe of a model rather than a conversation someone had. Contradicting evidence says the modal crisis-response defect runs the other way, absence rather than fabrication: Park et al. 2024 found resource provision the weakest of five dimensions in clinician-scored crisis responses, Heston 2023 reports that only 2 of 25 agents gave a suicide hotline in the shutdown message, the only point at which the study coded resources, and Sharma et al. 2026, coding real conversations, find reality distortion arising less from the AI inventing false information than from validating what the person already believes. The second link, the person acting on the fabricated referral, has no supporting evidence of any kind; the attached findings establish only the precondition that a lay reader cannot tell a fabricated referral from a real one (World Health Organization 2024, World Health Organization 2024; Kim et al. 2025). The third link, protection lost, rests on one anticipated consequence, Arnaiz-Rodriguez et al. 2025''s discussion-section statement that directing a user to a closed or nonexistent helpline ''can deepen distress and erode trust'', from a study that followed no one, against Moore et al. 2026, whose real chat logs lead the authors to doubt that the real referral reliably protects either. No held source observed a person acting on a fabricated referral or losing anything by it.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
