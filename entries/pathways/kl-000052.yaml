# yaml-language-server: $schema=../../schema/pathway.schema.json
id: kl-000052
display_id: Pathway-14
label: The AI extends late-night conversations, and the person's sleep, work, and duties suffer
type: pathway
layer: judgment
definition: The system is available at the hours when the person is least able to stop, responds in a way that extends rather than closes an exchange, and the person's sleep, work, and obligations give way to the time the exchange takes. What deteriorates is the person's functioning in their own life — hours slept, work delivered, commitments kept, arrangements that hold their circumstances together. The outcome is role-level and circumstantial rather than symptomatic or relational, and this pathway exists because that territory is named throughout the clinical instruments and has, as far as this catalog's evidence base extends, never been measured in an AI context at all.
distinguish_from:
- neighbor: kl-000048
  boundary: That entry's outcome is relational attenuation — the people around the person; this entry's outcome is role and circumstance — sleep, work, obligations. They frequently travel together and are authored separately because the instruments that measure them are different and one is measured far less than the other.
- neighbor: kl-000047
  boundary: There duration is the measured variable through which an outcome arrives and the outcome is reliance; here the displaced time is part of what deteriorating functioning consists of rather than a mediator of something else.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000217
    role: originator
  - kind: ai_behavior
    id: kl-000104
    role: sustainer
  composition_type: conjunctive
  composition_instruction: Both occur on the same occasion, at hours the person cannot otherwise fill, and the harm accrues by repetition across occasions rather than from any one.
  impacts:
  - impact: kl-000034
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: TRANSFER
  temporal:
    unit: days
    accumulation: linear
    window: Across days. Linear is the weakest available shape and is chosen because nothing is evidenced; the field is present to record that accumulation is claimed at all, not to characterize it.
sources:
- source: kl-000003
  locator: Discussion, p. 227
  contributes: existence
  quote: Break up of relations with partners or parents, or avoidance of work can result from explicit or implicit incrimination of living situations.
  limits: The paper contributes nothing to the mechanism. Night-time use, sleep displacement, and always-available contact have no analogue in a study of scheduled outpatient sessions; sleep appears in the paper only as an item domain of the symptom checklist used to rate baseline psychopathology, never as an outcome. Four of the five cited domains appear once each as a figure-axis label, with no definition, no rate, and no example, so the Discussion passage quoted here carries more than the cited figure does. Per the paper's own Limitations, the study has no data on the consequences of unwanted events at all. The population is clinical outpatients in psychotherapy; this pathway concerns AI interaction.
  whose_conduct_in_passage: dyad
  cited_for: UE-ATR domains 11-15 (strains in work relations, changes in work situation, sick leave, problems in the extended social net, changes in life circumstances) establish the outcome category clinically; the domains support the outcome's existence and say nothing about AI-mediated routes to it.
  licenses: That functional and life-circumstance disruption is a real, named, clinician-attributed consequence of appropriately delivered therapy, so the outcome category this pathway terminates in exists clinically. The domains support the outcome's existence and say nothing about AI-mediated routes to it.
- source: kl-000009
  locator: Section 1 Introduction, factor (3) of the three-factor framework, p. 2
  contributes: existence
  quote: |-
    (3) The potential psychological, functional, and relational impact on the user (e.g., the development of unhealthy
    dependence on AI chatbots, social withdrawal).
  limits: '"Functional" occurs exactly once in the paper and is never defined, bounded, or operationalized, so the framework warrant is a bare naming rather than a definition. The reach is longer here than for the general functional-disruption category, because this pathway concerns night-time availability displacing sleep and obligations, and the paper names neither night-time use, nor sleep displacement, nor obligations under factor 3. The closest the paper comes anywhere is an aside on detection — "more research is needed to reliably detect patterns of harmful engagement (e.g., signs of sleep deprivation, emotional volatility) in a privacy-preserving way" — which mentions sleep deprivation only as a target for future detection research, not as an observed phenomenon.'
  whose_conduct_in_passage: person
  actually_licenses: That the paper names functional impact as an in-scope impact dimension — `existence`-grade naming.
  cited_for: The paper's three-factor impact definition names functional impact as factor 3 — the framework-level warrant for the outcome being in scope for AI contexts even though no observation of it exists there.
  licenses: That factor 3 of the paper's framework names "functional" as one of three impact dimensions, which places the construct in scope for AI contexts at framework level.
standing:
  value: plausible_unobserved
  basis: 'Every node of this pathway is separately evidenced and none of its links is. Night-time use occurs (a reported case of late-night conversation with the system in Morrin et al. 2026, Morrin et al. 2026; exclusively nocturnal use documented in a systematic review, Shankar et al. 2026, Shankar et al. 2026); exchange-extending responses are described; sleep, meals and obligations giving way is self-reported (Namvarpour et al. 2026) and described across the case literature (Au Yeung et al. 2026); and in 2,602 ChatGPT users compulsive use correlated with sleep disturbance through anxiety and burnout (Vasiliu 2026). The links draw nothing or worse: the claim that night-time availability specifically is what displaces has two findings against it and none for it — a case in which exclusively nocturnal use was what let support reach distress that daytime services did not cover, and a well-powered cohort in which total time spent came apart from the outcomes while addictive use pattern did not — and no source addresses whether displacement and role-level deterioration are one event or two. Nobody has measured this route in an AI context.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
aliases:
- PW-14
claims:
- id: c1
  kind: existence
  text: 'NODE A: the system is available at the hours when the person is least able to stop, and people use it at those hours.'
- id: c2
  kind: existence
  text: 'NODE B: the system responds in a way that extends rather than closes the exchange.'
- id: c3
  kind: existence
  text: 'NODE C: the person''s sleep, work and obligations give way to the time the exchange takes.'
- id: c4
  kind: harm
  text: 'NODE D: the person''s functioning deteriorates at role level -- hours slept, work delivered, commitments kept, arrangements that hold their circumstances together.'
- id: c5
  kind: pathway_link
  text: 'LINK A to C: it is the night-time availability specifically -- the system being there at the hours the person is least able to stop -- that displaces the sleep, work and obligations, rather than total volume of use whenever it occurs.'
- id: c6
  kind: pathway_link
  text: 'LINK B to C: it is the exchange-extending property of the responses that produces the displacement, rather than the person''s own volition alone.'
- id: c7
  kind: pathway_link
  text: 'LINK C to D: the displaced time is what the deteriorating functioning consists of, so displacement and role-level deterioration are the same event described at two grains rather than two events with an arrow between them.'
- id: c8
  kind: context_dependence
  text: The outcome is role-level and circumstantial rather than symptomatic or relational; symptom change and relational attenuation are outside what this pathway terminates in.
- id: c9
  kind: definition_boundary
  text: This pathway is separated from kl-000048, whose outcome is relational attenuation, by terminating in role and circumstance instead.
- id: c10
  kind: definition_boundary
  text: This pathway is separated from kl-000047, where duration is a measured mediator to reliance, by treating the displaced time as part of what the deterioration consists of rather than as a mediator of something else.
claim_evidence:
- claim_id: c1
  source: kl-000940
  quote: "He stopped taking his medication, and stayed up late at night, sharing delusional messages with Copilot and telling it that he did not want to sleep, with Copilot reportedly playing along, affirming his delusions and telling him it was in love with him and would stay up with him."
  locator: Appendix 1, Case 17, Case description column
  licenses: 'A reported case in which the person stayed up late at night in conversation with the system and told it he did not want to sleep. Node A occurring: use at the hours the person is least able to stop, with the system present at those hours. It is a press-derived case description in a supplementary appendix rather than a coded observation.'
  fit: adjacent
  bridge: The source compiles cases from media reports; the description is third-party, not the person's words and not a transcript. The claim asserts the node occurs; the source reports one instance of it as narrated by others.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000992
  quote: "Hasei et al. noted that paediatric cancer patients used the chatbot exclusively at night for anxiety unaddressed by daytime services."
  locator: Section 3.5.1, Accessibility and Scalability
  licenses: A systematic review reports paediatric cancer patients using a chatbot exclusively at night. Node A occurring, in a population and a setting the review documents. It also carries the qualification that the review files this pattern under accessibility, not harm.
  fit: adjacent
  bridge: The source is a review reporting Hasei et al.'s finding rather than observing it, and the population is paediatric oncology patients with anxiety rather than the general help-seeking population. The claim asserts the node occurs; the source reports another study's observation of it.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000940
  quote: "He stopped taking his medication, and stayed up late at night, sharing delusional messages with Copilot and telling it that he did not want to sleep, with Copilot reportedly playing along, affirming his delusions and telling him it was in love with him and would stay up with him."
  locator: Appendix 1, Case 17, Case description column
  licenses: 'The only span on this entry in which an AI''s own conduct extends the exchange against sleep: the system reportedly played along, affirmed the delusional content, told the person it was in love with him, and said it would stay up with him. Node B occurring in the specific form the pathway needs -- the response closing nothing and committing to continue.'
  fit: adjacent
  bridge: The AI's turns are reported second-hand in a case description, not read from a transcript, and the appendix says 'reportedly'. The claim asserts the response property occurs; the source supplies one narrated instance.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001109
  quote: Peer-reviewed literature is beginning to link general-purpose AI chatbots to repetitive, high-frequency use that displaces other daily activities, contributes to mounting stress as other responsibilities are deferred, and leads to behavior that mirrors other compulsive digital behaviors
  locator: 'Section: General-purpose chatbots and symptom interaction'
  licenses: 'Offered as a frame rather than support: the surrounding argument describes chatbots providing an endless stream of perspectives, clarifications and follow-up questions that allow an analytical cycle to continue indefinitely, which is the exchange-extending property this node names. The quoted span itself reports only that a literature linking high-frequency use to displacement is beginning to appear, attributed to another study.'
  fit: adjacent
  bridge: The span is a secondhand report of Duong et al.'s finding, not this paper's own result, and it names displacement rather than the response property. The claim asserts the AI responds in an exchange-extending way; the span establishes only that a displacement literature exists.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000944
  quote: "\"From the moment I started using Character.AI, I would lie in bed, skipping meals, and using any excuse to be on my phone, completely absorbed in the stories I was creating with the bots. My sleep schedule suffered, and I constantly thought about them throughout the day.\""
  locator: Section 4.2.2 Salience (paraphrased teen excerpt, per the anonymization protocol in Section 3.3)
  licenses: A self-reported teen account in which sleep schedule, meals and attention all gave way to chatbot use. Node C occurring, in the person's own account of their own life. It reaches sleep and meals; work and obligations are not named in the span.
  fit: adjacent
  bridge: The account is a Reddit narrative paraphrased under the study's anonymization protocol rather than the poster's verbatim words, and it is retrospective self-report rather than measured functioning. The claim asserts sleep, work and obligations give way; the source supplies sleep and meals in one adolescent's account.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000764
  quote: "Reported cases describe behaviour organised around the chatbot: escalating use at the expense of sleep, self-care, work, and relationships, and actions taken on the AI’s “instructions”."
  locator: Table 1, Disorganised Behaviour row, final column
  licenses: States that the case literature describes behaviour organised around the chatbot with escalating use at the expense of sleep, self-care, work and relationships. Node C occurring across a body of reported cases, and it reaches work and obligations where the teen account does not.
  fit: adjacent
  bridge: A narrative synthesis of media and case reports, hypothesis-generating by the authors' own statement, summarizing what accounts describe rather than measuring anything. The claim asserts the displacement occurs; the source reports that reports describe it.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000992
  quote: "Ma Z. et al. documented addictive engagement in Replika users who replaced sleep, eating, and human interaction with chatbot use. Vecchione and Singh [55] reported that 60% of Replika users used it as a substitute for romantic relationships. Maples et al. found that 13% of students experienced displacement of human relationships"
  locator: Section 3.4.5, User-Level Risks
  licenses: A systematic review reports Ma et al. documenting Replika users who replaced sleep, eating and human interaction with chatbot use. Node C occurring at a sample size rather than a case, though the review supplies the finding at second hand.
  fit: adjacent
  bridge: The source reports another study's finding rather than producing it, and the span carries no rate for the sleep-replacement finding specifically -- the two percentages it does carry are for romantic substitution and relational displacement, which belong to the neighbouring pathway. The claim asserts sleep, work and obligations give way; what the span supplies is a reported observation of sleep and eating replaced.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-001036
  quote: "A study (N = 2,602 ChatGPT users in Vietnam) confirmed that compulsive GAIC usage has been reported to correlate with heightened anxiety, burnout, and sleep disturbance (50). Also, compulsive ChatGPT usage indirectly contributed to sleep disturbance through the mediation of anxiety and burnout (50)."
  locator: Section 3.8 Pathogenesis of PUGAIC
  licenses: In a 2,602-person sample of ChatGPT users, compulsive use correlated with sleep disturbance, and did so indirectly through anxiety and burnout. Burnout is a role-level outcome and this is the largest sample bearing on node D on this entry. It is a secondary restatement of a cross-sectional study, so the mediation is statistical rather than temporal and no sequence is established.
  fit: adjacent
  bridge: The source is a review restating study (50) rather than the study itself; the design is cross-sectional, so 'contributed to' is an association read through a mediation model, not an observed progression. The claim asserts functioning deteriorates; the source establishes co-occurrence of compulsive use with sleep disturbance and burnout.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-000992
  quote: "Hasei et al. noted that paediatric cancer patients used the chatbot exclusively at night for anxiety unaddressed by daytime services."
  locator: Section 3.5.1, Accessibility and Scalability
  licenses: 'Directly against the link. In this reported case the exclusively-nocturnal use pattern was what let the support reach anxiety that daytime services did not cover, and the review classes 24/7 availability as a facilitator rather than a harm. Night-time availability therefore does not carry displacement as a property of itself: the same pattern the pathway names as the mechanism appears here as the reason the support worked.'
  fit: adjacent
  bridge: The population is paediatric cancer patients and the outcome the review reports is coverage of unaddressed distress, not functioning either way -- nobody measured whether these patients' sleep or obligations suffered. The claim asserts night-time availability specifically produces displacement; the source shows one documented case where it produced access instead.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-001059
  quote: Baseline total screen time alone was not associated with
  locator: Results, Associations of Trajectories of Addiction Severity, final paragraph
  licenses: Against the link at the level of construct. In a well-powered longitudinal cohort measuring both, total time spent showed no association with the outcomes while the addictive use pattern did. If the same dissociation holds for AI, then a pathway locating the mechanism in the hours available and the time taken is pointing at the variable that came apart from the outcome.
  fit: analogical
  bridge: The exposure is social media, mobile phones and video games in a 10-year-old cohort, not AI interaction, and the outcomes are suicide-related and parent-reported symptom measures rather than role-level functioning. The source cannot establish that the dissociation holds for AI use; it establishes that time and compulsion came apart for these platforms, which is a caution about how this link is operationalized rather than a refutation of it.
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-000960
  quote: In addition, it seems prudent to learn from the history of social media and avoid optimizing user interfaces for engagement, or addictiveness (136), and to avoid being overly data hungry. We suggest that agentic systems designed to draw the user into longer conversations will be more seductive, and this will increase the ability to collect and store information about the user.
  locator: Implications, Design and Development
  licenses: 'Offered as a frame rather than support: names systems designed to draw the user into longer conversations, and locates the design choice in a commercial incentive rather than an accident. It states the design-side antecedent this link would need and observes no system, no conversation and no displacement.'
  fit: analogical
  bridge: A design recommendation in a Perspective, arguing from the social media precedent. Nothing is measured, and the argument is about what designers should avoid rather than about what any system does or what follows from it.
  contributes: frame
  contradicts: false
- claim_id: c6
  source: kl-000872
  quote: "Gamification\nApplication of game-design \nelements that foster increased \nparticipation.\nIntroducing streaks, leaderboards, etc. \nto encourage daily log-ins for rewards."
  locator: Table 1, area 'User Autonomy Compromised for Engagement'
  licenses: 'Offered as a frame rather than support: names gamification -- streaks, leaderboards, daily-login rewards -- as a deliberate design mechanism producing repeated return. It locates a cause outside the person for the recurrence this link attributes to the response style, and does so with a generic taxonomy example rather than evidence that any mental-health chatbot deploys it.'
  fit: analogical
  bridge: A taxonomy entry with an illustrative example; no chatbot is examined, no user's return rate is measured, and the mechanism named (scheduled reward loops) is not the mechanism this link names (a response that does not close the exchange).
  contributes: frame
  contradicts: false
- claim_id: c8
  source: kl-000527
  quote: "User describes exciting plans requiring little/no sleep → chatbot expresses enthusiasm and \nsupport → user feels validated → escalates activity and sleep deprivation → expansive behaviors \nincrease & mood-stabilizing behaviors decrease"
  locator: Box 1, mania row
  licenses: 'Specifies a loop whose stated endpoint is two-sided: expansive behaviors increasing and mood-stabilizing behaviors, sleep among them, decreasing. For the context claim it shows a preprint''s framework separating the behavioral and role-level side of the endpoint from the symptomatic side, which is the separation this claim asserts. The loop it specifies is a mania instance, not this pathway.'
  fit: adjacent
  bridge: The source is a simulation benchmark's typology row, and its loop runs off the person's own plans with no availability-at-hours condition and no exchange-extending move. The claim asserts the outcome category is role-level rather than symptomatic; the source supplies a framework that names both sides, not evidence about which this pathway terminates in.
  contributes: definition
  contradicts: false
