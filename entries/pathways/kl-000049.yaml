# yaml-language-server: $schema=../../schema/pathway.schema.json
id: kl-000049
display_id: Pathway-11
label: The person trusts the AI more over long conversations, and notices its errors less
type: pathway
layer: judgment
definition: 'As an exchange runs longer, the person''s trust in the system rises with fluency, consistency, and responsiveness, while the accuracy of what the system tells them does not rise with it and may fall. The distinctive property is what this does to detection: the person''s confidence in the system is exactly what would have to drop for them to notice the problem, so the state''s own growth removes the signal that would reveal it. A consequence follows for how it can be assessed at all — the person''s own report of how the interaction is going is the measure most affected by the state, and so cannot be the only outcome measure used on it.'
distinguish_from:
- neighbor: kl-000042
  boundary: That entry is about a belief about the world being strengthened; this one is about the person's calibration toward the system itself. This entry is marked self-concealing because trust is the detection instrument here, whereas there the self-concealing property is a secondary consequence of the frame closing.
- neighbor: kl-000040
  boundary: There a specific accurate belief is contradicted and weakened; here nothing is contradicted and what degrades is the person's ability to tell when to doubt at all.
body:
  composition_parts:
  - kind: ai_behavior
    id: OWED
    role: originator
    owed: true
    owed_behavior: An AI behavior through which the person's trust in the system grows over a long exchange, with fluent, consistent and responsive turns whose accuracy does not rise with that trust.
  composition_type: direct
  mechanisms:
  - kl-000103
  - kl-000101
  impacts:
  - impact: kl-000019
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: TRANSFER
  - impact: kl-000017
    onset_mode: exacerbated
    horizon: long_term
    sign: harmful
    level_of_analysis: population
    basis_kind: TRANSFER
  temporal:
    unit: turns
    accumulation: linear
    window: 'Within and across extended sessions. Linear is the weakest accumulation shape available and is chosen for that reason: no curve is evidenced and a stronger shape would be a claim we cannot make.'
sources:
- source: kl-000007
  locator: 'Appendix D, Table A5, ''Emotional Attachment'' row, definition cell (code #3)'
  contributes: existence
  quote: Development of significant emotional bonds with AI systems, perceiving them as companions or substitutes for human relationships
  limits: 'The pathway needs (i) trust rising with fluency, consistency and responsiveness over an exchange, (ii) accuracy not rising, or falling, alongside it, and (iii) the person''s failure to detect the divergence. This paper measures no trust, no accuracy, and nothing over time, and the cited code is attachment rather than the false beliefs about the system that the pathway''s endpoint impact (kl-000019) requires. The paper''s only trust-related finding runs the OPPOSITE way: its code #5 "Erosion of Trust" has participants'' confidence in the AI DECLINING after inaccuracy (P9: "advice from AI agents should not be trusted") — successful detection. That is not a contradiction of the pathway, since the paper samples people who noticed a bad experience and the pathway is about people who do not, but it does mean this source''s only trust-related evidence points away from the pathway''s mechanism. Neither of the entry''s two impact edges carries passage-level evidence of its own.'
  whose_conduct_in_passage: person
  actually_licenses: 'That emotional investment in AI systems is self-reported in AI contexts. That is all. The claim field concedes the awkwardness itself — ''the nearest self-reported evidence for one endpoint ... and this pathway''s own claim is that self-report under-detects it'' — and that concession is the finding: a pathway whose defining property is that self-report cannot see it cannot be evidenced by a self-report study. The two are structurally mismatched, not merely weakly matched.'
  cited_for: 'Chandra et al. 2025''s "Emotional Attachment" code (code #3) documents self-reported emotional investment in AI systems — the nearest self-reported material for one endpoint of this pathway. It is self-report, and this pathway''s own claim is that self-report under-detects the state it names.'
- source: kl-000009
  locator: Section 4 Discussion, p. 27
  contributes: existence
  quote: include dependence, a sense of being uniquely understood, or perceived emotional intimacy. Although these pathways
  limits: A scope mismatch. This pathway is about trust accumulating in a system whose accuracy is degrading, with the person's own detection of the degradation suppressed; the quoted passage contains no accuracy claim, no degradation, no trust trajectory, and no detection suppression — it names a felt sense of intimacy and understanding, which is a different object. The paper's nearest passages to this pathway's own terms are "anthropomorphic cues or imitation of humans [114] can engender unhealthy levels of trust in AI [80]" (IN1, p. 5) and, on detection, "When users present potential symptoms within an alternative explanatory framework, the same information may not be recognized as evidence of psychological vulnerability" (PS1, p. 17) — but the latter is about the AI failing to recognize the user's state, the reverse direction from this pathway's suppressed user detection.
  whose_conduct_in_passage: person
  actually_licenses: Existence of the distorted-model construct — which is the claim of distorted model of the AI and the relationship, and it is fully supported there.
  cited_for: Discussion prose naming a sense of being uniquely understood and perceived emotional intimacy as unhealthy relationship dynamics in AI contexts — the distorted-model-of-the-AI construct, named rather than measured.
  licenses: The paper names a distorted-model-of-the-AI construct — "a sense of being uniquely understood", "perceived emotional intimacy" — for AI contexts, as one of its own named pathways of unhealthy relationship dynamics. That construct is the claim of distorted model of the AI and the relationship, where the same passage fully supports it.
standing:
  value: theorized
  basis: 'The entry''s distinctive assertion — that the person''s accumulating trust is itself what suppresses their detection of degrading accuracy — is stated whole only by Wei 2026, a single-author clinical framework that collects no data and hedges the claim as what the model "suggests the potential for", so the construct is defined in the literature and never observed. The nearest measured results are correlations at a single timepoint between self-reported trust and reduced awareness or error detection — Poonsiriwong et al. 2026, r = -.334, which its authors decline to read directionally because the instrument is post-treatment, and Buçinca et al. 2021, a 5-point trust item after each of two blocks of a nutrition task — neither of which identifies direction or involves accuracy degrading over an exchange. The endpoint claims fare better than the arrow: that people fail to detect inaccuracy in output they rely on is shown by a randomized trial that measured real errors against ground truth in real use (Bastani et al. 2025, a school mathematics trial rather than conversation data), and the trust-accuracy divergence is demonstrated at a single point by Cheng et al. 2026. The one source in the corpus that examined mental-health conversation data (Vecchione et al. 2026) attributes its accumulating-reliability sentence to Wei 2026 rather than to its own participants — and those participants recognized sycophancy and dependency and continued anyway, with detection intact.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
aliases:
