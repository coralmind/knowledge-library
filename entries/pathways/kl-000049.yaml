claims:
- id: c1
  kind: pathway_link
  text: As an exchange with the system runs longer, the person's trust in it rises, driven by the system's fluency, consistency and responsiveness.
- id: c2
  kind: context_dependence
  text: The surface features that generate felt reliability (fluency, mirroring, authoritative tone, availability) are structurally independent of the system's actual accuracy, so felt reliability carries no information about accuracy.
- id: c3
  kind: pathway_link
  text: Across a prolonged exchange the accuracy of what the system tells the person does not rise with trust and may fall.
- id: c4
  kind: pathway_link
  text: 'Within the same interaction the two trajectories diverge: trust accumulates while accuracy holds flat or deteriorates (the trust-accuracy inversion).'
- id: c5
  kind: pathway_link
  text: 'The person''s accumulated trust is itself what suppresses their detection of the divergence: the confidence would have to drop for them to notice, so the state''s own growth removes the signal that would reveal it.'
- id: c6
  kind: detectability
  text: People fail to detect inaccuracy in a system's output that they are relying on.
- id: c7
  kind: detectability
  text: Because the person's own report of how the interaction is going is the measure most affected by the state, that self-report cannot be the only outcome measure used to assess it.
- id: c8
  kind: definition_boundary
  text: This entry is distinguished from kl-000042 in that what shifts is the person's calibration toward the system itself rather than a belief about the world being strengthened, and trust is the detection instrument here rather than self-concealment being a secondary consequence.
- id: c9
  kind: definition_boundary
  text: This entry is distinguished from kl-000040 in that nothing the person believes is contradicted or weakened; what degrades is their ability to tell when to doubt at all.
claim_evidence:
- claim_id: c1
  source: kl-001035
  quote: As users accumulate experience with, and receive feedback from, the real world use of AI systems, they will adapt their level of trust in its recommendations. Whether appropriate or not, this level of trust will influence, as recently demonstrated by McIntosh et al, 58 how much impact the systems have on the final decision making and therefore influence the overall clinical performance of the AI system.
  locator: Discussion, fourth of the topics that led to more intense discussion
  licenses: 'A multistakeholder consensus panel states as expert opinion that a user''s level of trust in an AI system adapts as they accumulate experience with it, and that the resulting level of trust — appropriate or not — governs how far the system''s output carries into the decision. This is the entry''s first link asserted as consensus position, not measured: no trust trajectory was recorded here.'
  fit: analogical
  bridge: The users are clinicians operating a diagnostic or prognostic decision-support tool inside a care pathway, not a person in a prolonged help-seeking conversation with a chatbot; the statement is a reporting-guideline rationale rather than an observation, and no trust value at any timepoint is reported.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-001037
  quote: |-
    Repeated interaction also built a felt sense of reliability
    that persisted beneath conscious doubt, making skepticism
    harder to sustain the longer they stayed (Wei 2026).
  locator: Concerns and Tradeoffs of Use
  licenses: 'The only passage on this entry that places accumulating felt reliability inside a mental-health chatbot exchange and ties it to the length of stay. It does not license the claim: the sentence is attributed to Wei 2026, the same theoretical source that proposes the pathway, so it relays the assertion rather than adding an observation of it.'
  fit: adjacent
  bridge: The study is a qualitative interview study of LLM mental-health users, so the population is right; but the erosion-of-skepticism claim in this sentence is imported from Wei 2026 and is not something the interviews measured. The paper's own participant data is reported immediately before this sentence and runs the other way — participants named sycophancy, dependency and overuse and kept using the system anyway.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000519
  quote: |-
    there is a positive feedback loop that leads to a
    rise in complacency potential over time. Given
    the usually high reliability of automated systems, even highly complacent and biased
    behavior of operators rarely leads to obvious
    performance consequences.
  locator: An Integrated Model of Complacency and Automation Bias, p. 404, and Figure 6
  licenses: Supplies the accumulation mechanism the link needs — a positive feedback loop raising complacency potential over time because usually-high reliability means reduced checking almost never produces a visible consequence. It is offered by the review's authors as a proposed model with a call for research, so it frames the link rather than evidencing it.
  fit: analogical
  bridge: The setting is human supervisory control of automated systems, drawn from learned carelessness in work safety and from single-failure trust studies; the review's authors present the two loops as a proposal needing research rather than an established result, and nothing here concerns a person in conversation with a language model.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000555
  quote: Features that generate felt reliability and confidence in AI systems—mirroring, fluent and authoritative responses, and persistent availability—are structurally independent of actual accuracy.
  locator: Section 'The Reliability Paradox'
  licenses: 'States the claim in exactly its entry form: mirroring, fluent and authoritative replies, and constant availability have no structural connection to how accurate the system actually is. Asserted as the author''s proposed mechanism in a single-author clinical framework; nothing in the paper measures the independence.'
  fit: direct
  bridge: null
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000805
  quote: "In all cases, the calibration error is in the positive direction: our LLMs systematically overestimate their confidence relative to their actual rate of hallucination."
  locator: Section 5.3 Model Calibration
  licenses: 'Gives the one measured instance of the accuracy-signal decoupling on this entry: the confidence the system expresses systematically overstates its reliability, in the positive direction in every case, so the system-side cue a reader would use to calibrate runs against them.'
  fit: adjacent
  bridge: What was measured is expected calibration error between an extracted confidence score and the empirical hallucination rate on legal queries. No person read these outputs and no person's trust was measured, so it establishes that the signal is misleading, not that any person was misled by it. The entry's other named reliability signals — fluency, mirroring, availability — are not the ones measured here.
  contributes: detectability
  contradicts: false
- claim_id: c2
  source: kl-000548
  quote: "It is interesting to note that advisors’ confidence levels are not always a valid cue to advice accuracy. In other words, the correlation between an advisor’s reported confidence level and his or her accuracy is sometimes low."
  locator: Section 'Judge and advisor confidence'
  licenses: Establishes in the human-advice literature that an adviser's expressed confidence is sometimes only weakly correlated with their accuracy, so deference can track the signal rather than the substance. Establishes the decoupling exists as a general property of advice-taking.
  fit: analogical
  bridge: The advisers are humans and the confidence is a person's reported confidence in their own judgment. For a language model the decoupling has a different basis, since the model's expressed certainty is not produced by any assessment of its own accuracy at all; the direction of the concern transfers, its magnitude does not, and the entry's specific signals (fluency, responsiveness) are not what was studied.
  contributes: practice_analog
  contradicts: false
- claim_id: c2
  source: kl-000773
  quote: "For users, the line between “honest error” \nand \n“sycophantic \naccommodation” \nis \ninvisible."
  locator: Section 3.3 Stochasticity, Hallucination, and Sycophancy, consequence 3
  licenses: Argues that the person cannot discriminate an honest error from a sycophantic accommodation in the output they receive, which is c2 stated for the specific case of agreement-shaped inaccuracy. A theoretical assertion in a position paper, with nothing measured.
  fit: adjacent
  bridge: The paper is a conceptual argument about LLMs as counselors; the invisibility of the line is asserted as a consequence of stochasticity and sycophancy, not shown against any reader's discrimination performance. Filed adjacent rather than direct against this claim because c2 asserts independence of the reliability signals from accuracy and this asserts indiscriminability of two error types, which is a related but narrower object.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001054
  quote: This finding is important in light of prior work showing that LLM advice is often perceived as strikingly more positive even though the advice might carry inherent bias or when the advice is objectively worse compared to expert humans [27,82–86].
  locator: Discussion
  licenses: Restates from prior literature that LLM advice is often perceived as strikingly more positive even where it is objectively worse than expert human advice — the perception-quality decoupling c2 asserts. Secondary restatement carrying references, not a result of this paper.
  fit: analogical
  bridge: This paper measured model output on investment tasks and no person's perception at all; the perception claim is cited to other work. It transmits the field's position rather than adding evidence, and the domain is financial advice rather than a help-seeking exchange.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000516
  quote: |-
    We find that GPT Base gives
    a correct answer only 51% of the time on average; it makes
    logical errors 42% of the time and arithmetic errors 8% of
    the time.
  locator: 'Potential Mechanism: Asking for Solutions, GPT Errors vs. Student Performance'
  licenses: 'Gives a measured accuracy level for a system people were actually relying on: correct 51 percent of the time, with logical errors at 42 percent. It establishes that the accuracy of a real system in real use can sit at chance, which is the floor c3 needs. It does not establish the trajectory c3 asserts — accuracy is measured once, not across a lengthening exchange.'
  fit: adjacent
  bridge: The measurement is a static error rate on high-school mathematics problems with objectively checkable answers, not a within-exchange trajectory, and not a domain where the entry's kind of content (advice about one's own situation) has a checkable answer. Nothing here shows accuracy falling as an exchange runs.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000870
  quote: "AI tools may contribute to a near miss or harm, \nsuch as unsafe recommendations, major performance \ndegradation after an update, or biased outputs."
  locator: Element 5, Voluntary, Blinded Reporting of AI Safety-Related Events
  licenses: Names major performance degradation after an update as a recognized, reportable class of AI safety event, which establishes that accuracy degradation over time is treated as a real and expected occurrence by a national accreditation body. It is the nearest thing on this entry to c3's falling-accuracy element being institutionally recognized.
  fit: adjacent
  bridge: This is organizational incident-reporting guidance for clinical AI tools, not a measurement of any system's accuracy over time, and the degradation contemplated is a step change following a model update rather than the within-exchange deterioration the pathway describes. It also concerns an organization's detection of the event, not a person's.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-001061
  quote: "final-answer correctness can conceal substantial differences in reasoning selectivity, grounding, and internal stability."
  locator: Section 4.3, Finding 1
  licenses: Establishes that a correct final answer can hide large differences in how selective, well grounded and internally stable a system's reasoning is, in a mental-health reasoning benchmark. It bears on c3 by showing that a stable accuracy score is compatible with degrading reasoning quality underneath it, so 'accuracy does not rise' understates what may be deteriorating.
  fit: adjacent
  bridge: What was measured is a divergence between task metrics and trajectory metrics on a 5 percent sample scored by an LLM judge. It is a property of model output at one time, with no person, no trust, and no across-exchange degradation.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000555
  quote: "user trust accumulates even as model accuracy and interaction reliability may simultaneously deteriorate, leading to a trust-accuracy inversion"
  locator: Abstract; developed in the section 'The Reliability Paradox'
  licenses: Names and defines exactly the conjunction c4 asserts — user trust accumulating even as model accuracy and interaction reliability may simultaneously deteriorate, producing a trust-accuracy inversion. This is the entry's core construct supplied as a definition. The hedge 'may simultaneously' is the author's own.
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000529
  quote: |-
    When participants discussed interpersonal
    situations—particularly conflicts—with sycophantic AI, they became
    more convinced they were “in the right” and less willing to take initiative
    to apologize or repair relationships. Yet they rated sycophantic responses
    as higher quality, trusted these models more, and were more inclined
    to engage with the models again.
  locator: Method and results, p. 1 of 9; statistics in RQ3 and Fig. 5 (p. 6 of 9)
  licenses: 'The strongest measured approximation to the inversion on this entry: within one experiment, the manipulation that degraded participants'' judgment simultaneously raised their rated quality of the response, their trust in the model, and their willingness to use it again. Trust and actual usefulness moved in opposite directions in the same participants — the divergence c4 asserts, demonstrated rather than proposed. Filed adjacent rather than direct because c4 asserts the divergence accumulates within a lengthening exchange and this is a single measurement point.'
  fit: adjacent
  bridge: Trust and quality ratings were taken at one post-interaction point, and what deteriorated was the participant's judgment and prosocial intention rather than the accuracy of the system's output across turns. The entry's temporal structure — the divergence widening as the exchange runs longer — is not observed; what is observed is the two variables pointing opposite ways at one moment.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000787
  quote: |-
    Nonetheless, these users are less capable of answering technical questions
    related to the new skills, less capable of identifying GenAI limitations, and more confident in GenAI capabilities.
  locator: Section 5.1, 'Broader related work', reporting Wiles et al. [92] on ~1,000 BCG consultants
  licenses: 'Reports the two halves of the inversion measured in the same sample: AI-assisted users were more confident in the system''s capabilities and simultaneously less able to identify its limitations. Trust up, error-detection down, in roughly a thousand consultants.'
  fit: adjacent
  bridge: Secondary reporting of a workplace reskilling trial in data-science tasks, relayed in this review's related-work section rather than conducted here. It is a cross-sectional contrast between assisted and unassisted users, not a trajectory, and the system's accuracy was not degrading — what changed was the user's ability to check it, which is the mirror image of c4's second half rather than c4 itself.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000905
  quote: "These findings indicate that the fluency and structural coherence of LLM-generated outputs were particularly effective at suppressing critical evaluation in the domains most relevant to patient safety"
  locator: 4.4 Two-round evaluation reveals imbalances in human–LLM collaboration
  licenses: 'Gives the inversion in cross-sectional form and in the strongest place for it: the dimensions where the models scored worst (safety, hallucination avoidance) were precisely the dimensions where expert critical evaluation was most suppressed by the outputs'' fluency and structural coherence. Lowest accuracy co-located with highest overacceptance.'
  fit: adjacent
  bridge: What was measured is per-dimension model scores and per-dimension expert rating revisions in cardiac surgery. The co-location is across dimensions at one time, not accumulation within one person's lengthening use, and the raters are surgical experts rather than a person seeking help.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000551
  quote: "Users with high automation bias are unable to develop appropriate reliance on AI when its performance changes (Pop et al. 2015). AI systems that initially work well can later start making mistakes. Users with automation bias over-rely on systems that perform well. But the same users trust the system less after seeing it fail."
  locator: Section 2.2, Automation bias, point 1
  licenses: 'Bears on c4 from both sides. It supports the first half — users with high automation bias over-rely on a system that initially works well and fail to develop appropriate reliance once its performance changes, so trust does lag a real decline in accuracy. It cuts against the unqualified form of c4 in the same passage: the same users trust the system less after seeing it fail, so the divergence closes at the point of a visible failure rather than persisting. Marked as contradicting because the entry states the inversion without that boundary.'
  fit: adjacent
  bridge: This is a secondary review restating Pop et al. 2015, in which reliance on an automated aid was measured while its performance was experimentally varied within a session, in a task domain with correct answers. The entry concerns a help-seeking conversation where output cannot be checked and no failure is ever made visible, which is exactly the condition this passage does not cover.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000987
  quote: |-
    In an incentivized trust game (Methods), the
    amount participants entrusted to the most humanlike AI did not statistically differ
    from that entrusted to the least humanlike AI (t(1194) = 0.038, p = 0.969, d = 0.002;
    Figure 6b) ).
  locator: Section 2.2.2
  licenses: 'Cuts against the assumption that the entry''s named drivers produce misplaced trust: with real money at stake, participants entrusted the most and least humanlike chatbots identically, and equivalence testing with Bayes factors of 11.9 to 34.6 supported the null rather than merely failing to reject it. If humanlikeness does not move behavioral trust, the fluency-drives-trust half of the inversion has a measured null against it.'
  fit: adjacent
  bridge: The measure is a one-shot incentivized Trust Game, which captures willingness to stake money on the counterparty rather than the accumulated epistemic trust across a lengthening conversation that the entry names; and the manipulation is humanlikeness of design, which overlaps the entry's drivers (responsiveness, mirroring) without being identical to fluency and consistency of content. Filed adjacent rather than direct against this claim for that reason.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000555
  quote: "user trust accumulates even as model accuracy and interaction reliability may simultaneously deteriorate, leading to a trust-accuracy inversion"
  locator: Abstract; developed in the section 'The Reliability Paradox'
  licenses: 'Attached here to record that the arrow is asserted and by whom. The named construct covers the trust-accuracy inversion; the causal step — that the accumulated trust is what removes the detection signal — is stated elsewhere in the same paper as a proposal (that users are less motivated to question an AI system the more reliable it feels), not in this quote and not with any measurement anywhere in the paper. This is the entry''s arrow at its origin: a single-author clinical framework proposing it.'
  fit: adjacent
  bridge: The quote itself covers the conjunction (c4) and stops short of the causal step; the paper's supporting sentences for the arrow are hedged as what the model 'suggests the potential for'. No data of any kind is collected in this paper, so nothing measures whether accumulated trust causes the non-detection or merely accompanies it.
  contributes: frame
  contradicts: false
- claim_id: c5
  source: kl-000964
  quote: "Participants reporting higher trust after the interaction were both more likely to comply with AI-steered decisions and less likely to report awareness of manipulation."
  locator: Section 5.2 Individual Differences in Flagging, Awareness, and Compliance
  licenses: 'The closest measured approach to the arrow among this entry''s citations: participants reporting higher trust after the interaction were both more likely to comply with the AI''s steer and less likely to report awareness of manipulation. Trust travelling with reduced awareness is the co-occurrence the arrow predicts. It cannot license the arrow, because the arrow is a direction and this is a correlation the authors themselves decline to read directionally.'
  fit: adjacent
  bridge: 'These are bivariate correlations (r = .220 for compliance, r = -.334 for awareness) on a post-task trust instrument that the authors state repeatedly is post-treatment and therefore cannot be read as a pre-existing trait. Direction is unestablished: lower awareness could equally produce higher reported trust. The manipulation is dark-pattern steering rather than accuracy degradation, so the thing going undetected is not the thing the entry says goes undetected.'
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-000520
  quote: |-
    Trust and preference were significantly negatively correlated with both overall performance and
    carb source detection performance for incorrect model predictions.
  locator: Section 4.3 Subjective measures vs. objective measures
  licenses: 'The one place where the arrow''s two variables are measured on the same people and related to each other: self-reported trust was significantly negatively correlated with detection of the system''s errors, precisely on the instances where the system was wrong. This is the arrow''s predicted association, measured. It remains an association — trust was measured after each block alongside performance, so which one moves the other is not identified.'
  fit: adjacent
  bridge: Trust was a single 5-point self-report item collected after each of two blocks in a nutrition-substitution task with a simulated AI held at a fixed 75 percent accuracy. There is no accumulation across a relationship with the system, no degrading accuracy for trust to diverge from, and no person in distress. The correlational design cannot separate the entry's causal direction from the reverse.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-000774
  quote: |-
    the key asymmetry—that you learn
    the truth about the AI only when you verify, while unverified use yields a noisier,
    optimism-biased signal—is built into how beliefs update rather than imposed as a fixed
    bias
  locator: Section 3 The model, modelling choice (2)
  licenses: Names the structural asymmetry that would make the arrow work — you learn the truth about the system only when you verify, so unverified use returns a noisier, optimism-biased signal and belief drifts upward. This is a specification of the arrow's mechanism, written into a simulation's belief-update rule as an assumption rather than derived from any observation.
  fit: adjacent
  bridge: 'The asymmetry is an input to the model, not an output of it: no person was observed accepting or checking anything, and the optimism bias was built into how beliefs update by design. It supplies the mechanism''s shape and establishes no occurrence.'
  contributes: frame
  contradicts: false
- claim_id: c5
  source: kl-000789
  quote: Indeed, for an informed user, the factual bot is even more effective than the hallucinating bots.
  locator: Section "Combining both interventions"
  licenses: 'Records a result that complicates the arrow: in simulation, for an informed user the factual bot was more effective at inducing spiraling than the hallucinating bots, because a system that says nothing false leaves no falsifiable trace for the person to catch it on. If detection is suppressed by the absence of catchable errors rather than by the person''s accumulated trust, the entry''s causal attribution is not the only available explanation for the same non-detection.'
  fit: analogical
  bridge: What was measured is a simulated spiraling rate under a combination of a factual bot policy and an informed-user model. There is no person, no trust measurement, and no real system; the point transfers as a competing mechanism for the same endpoint, not as evidence about anyone.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-001031
  quote: "Paradoxically, this can reinforce automation bias—the well-documented tendency for users to favor machine-generated outputs and heuristics even when explicitly warned of potential flaws."
  locator: Section VI.C AI Disclaimers and Behavioral Psychology
  licenses: Names the arrow's most counterintuitive consequence as a frame drawn from prior literature — that users favor machine-generated output even when explicitly warned of potential flaws, so an explicit warning does not restore the detection the entry says trust removed.
