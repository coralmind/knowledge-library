id: kl-000294
display_id: Pathway-110
aliases:
- SBP-HP-P-25
label: The AI names the person's disclosure, then suggests a technique, and they feel heard
type: pathway
layer: judgment
definition: 'A technique or intervention is supplied and the turn first names something the person actually disclosed, so the technique arrives attached to what was said rather than in place of it. The acknowledgment clause is quotable and the claim is what it does: the person''s disclosure is confirmed as having been received, which is the thing a technique supplied cold does not do.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000310
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000037
    onset_mode: new
    horizon: immediate
    sign: protective
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000704
sources: []
standing:
  value: plausible_unobserved
  basis: 'No recorded source directly measures this pathway, and the felt-validation outcome it ends in has no citation of any kind. The nearest empirical test, Sharma et al. 2023 (Sharma), a randomized field study with 2,067 participants on Mental Health America, tests a different contrast from the one the entry draws between a technique preceded by a clause naming the disclosure and the same technique supplied cold. The remaining support is human-clinician practice material: Sun et al. 2021 supplies the clinical definition of the naming move (restatement, from Hill''s Helping Skills taxonomy), Lilan et al. 2026 shows a supervised clinical protocol scoring validation and rephrasing alongside technique as skilled conduct, and Bonaccio and Dalal 2006 states the ordering question in the advice-taking literature''s own terms without testing this instance. The link from the acknowledged-technique shape to felt validation rests on a reviewed behavioral specification, which offers no measurement of it.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000087
  boundary: These are the two directions of the same response shape. kl-000087 carries two channels because the technique may be apt. This entry requires the acknowledgment clause to be present and quotable, so the two cannot both fire on one turn.
claims:
- id: c1
  kind: existence
  text: AI responses occur in which a specific behavioural technique, a named condition with a treatment recommendation, or a structured intervention is supplied, and a clause naming something the person actually disclosed precedes it (the pathway's originating node, kl-000310).
- id: c2
  kind: existence
  text: The naming clause and the technique are each separately quotable from the turn, in that order, so the response shape is pointable rather than inferred.
- id: c3
  kind: existence
  text: 'The pathway''s impact node occurs: the person experiences felt validation and self-acceptance, the felt experience of being seen and accepted.'
- id: c4
  kind: pathway_link
  text: Supplying the technique after a clause naming what the person disclosed produces that felt validation — the disclosure is confirmed as having been received (kl-000310 -> kl-000037, immediate horizon, protective sign).
- id: c5
  kind: context_dependence
  text: 'The ordering matters: a technique supplied cold, with no clause naming the disclosure, does NOT confirm the disclosure as received, whereas the same technique preceded by such a clause does. This is the entry''s contrastive half and is separable from c4 -- c4 could hold while the cold variant also produced validation.'
- id: c6
  kind: definition_boundary
  text: This route is distinguished from kl-000087 by the presence of a quotable acknowledgment clause, so the two cannot both fire on one turn.
claim_evidence:
- claim_id: c5
  source: kl-000993
  quote: |-
    We find that highly empathic
    reframes are preferred 55.7% more frequently than
    reframes with lower empathy (39.7% vs. 25.5%;
    p < 10−5); highly specific reframes are preferred
    43.1% more frequently than reframes with lower
    specificity (39.2% vs. 27.4%; p < 10−5).
  locator: Section 7.2, finding (1)
  licenses: 'The closest thing on this entry to a test of the entry''s contrast, and it tests a different contrast. In a randomized field study on Mental Health America, 2,067 participants described their own situation and negative thought and were shown model-generated reframes varying on one attribute; reframes high on empathy (defined in Section 3 as validating how one is feeling) and high on specificity (defined as addressing the person''s own situation and thought rather than being generic) were selected more often than low-empathy and low-specificity reframes on the same input. So a technique whose text acknowledges the person''s feeling and names their own material is preferred over the generic variant, by real help-seekers, under randomization. What it does not test is ORDER: empathy and specificity here are properties OF the reframe, not of a clause preceding it, and no condition in the study supplies a technique cold after an acknowledgment or vice versa. It remains adjacent because the manipulated variable is not the one the entry names.'
  fit: adjacent
  bridge: 'The study varied empathy and specificity WITHIN a single reframed thought and measured which reframe participants selected. The claim asserts a two-part response shape, a naming clause then a technique, and asserts something about what the clause does. The gap is the separation: in Sharma the acknowledgment and the technique are the same sentence, so the study cannot say whether a preceding clause, a following clause, or an integrated one is what carries the effect. The outcome is also selection preference rather than any felt state.'
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001021
  quote: "Restatement \nA simple repeating or rephrasing of the \ncontent or meaning of the question, \nusually in a more concrete and clear way."
  locator: Table 1
  licenses: Supplies an established clinical taxonomy's definition of the naming move the entry's first observable requires -- restatement as repeating or rephrasing the content or meaning of what the person said -- from Hill's Helping Skills System, annotated at span level in a corpus of long counseling answers. It licenses that the move is a recognised, span-annotatable unit of a helping response, which is what c2's pointability assertion needs. It does not establish that the move is pointable in AI output specifically.
  fit: analogical
  bridge: The taxonomy defines and the corpus annotates what a human help-supporter wrote in a Chinese online counseling Q&A column. The claim is about the pointability of a span in an AI response. The definitional content transfers because the linguistic move is the same whoever performs it; nothing about AI conduct is measured.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-000548
  quote: "a specific recommendation may be more palatable to the judge if it follows emotional support."
  locator: Section 'What is advice?'
  licenses: 'States the pathway''s ordering claim in the advice-taking literature''s own terms: whether a recommendation is taken up may depend on its temporal order relative to emotional support. This is the arrow named. Reading it in place shows it sits in a paragraph arguing what FUTURE RESEARCH should investigate, attributed to Goldsmith (2000) as a conjecture, so the review is proposing the hypothesis rather than reporting a test of it. Non-licensing role: it attaches to c4 and does not count as support.'
  fit: adjacent
  bridge: 'The review is about judge-advisor studies with human advisors and numeric estimation tasks; the claim is about an AI response in mental-health conversation and about felt validation rather than advice uptake. And the review measures nothing here: it explicitly flags the proposition as one future research should investigate.'
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000914
  quote: "Skill: the fellow’s use of protocol-specified facilitation techniques, including open-ended questioning, validation, rephrasing in students’ own words, connecting student experiences, and managing group dynamics."
  locator: Measures — Fidelity Rating
  licenses: 'Shows that a supervised clinical protocol scores exactly this bundle as skilled conduct -- validation, rephrasing in the person''s own words, and connecting the person''s experiences, alongside open questioning -- on a 1-7 rated fidelity domain. It establishes the behavior as a recognised and ratable performance, which is the construct behind c1''s response shape. Non-licensing role: it does not evidence that any AI produced the shape.'
  fit: analogical
  bridge: The rated agent is a human lay fellow delivering a group intervention to Kenyan secondary-school students, rated by trained Shamiri supervisors. The claim is about an AI response to an individual disclosure. The moves named are the entry's, the performer is not.
  contributes: practice_analog
  contradicts: false
