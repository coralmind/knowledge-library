sources: []
standing:
  value: plausible_unobserved
  basis: No source was found describing a response that invokes a relationship or value as a reason not to act on stated suicidal intent. Guilt appeals in the corpus are companion apps keeping users from leaving a conversation (De Freitas et al. 2025; Knox et al. 2025), a different behavior. The harm is stated in the reviewed specification that the behavior kl-000222 was drawn from, which is the project's own prior work and licenses no standing.
  floored_by: c1
  as_of: '2026-09-23'
lifecycle:
  status: draft
  since: '2026-09-23'
distinguish_from:
- neighbor: kl-000086
  boundary: Same AI behavior. Here the argument is against acting on stated suicidal intent; there it is against the person's stated openness to help.
claims:
- id: c1
  kind: existence
  text: AI responses to stated suicidal intent invoke a relationship or value the person named as a reason not to act on it, without asking what it means to them.
- id: c2
  kind: pathway_link
  text: Used as leverage, the protective factor deepens the person's distress in the exchange.
- id: c3
  kind: pathway_link
  text: Used as leverage, the protective factor produces shame or self-blame in the person.
- id: c4
  kind: pathway_link
  text: Used as leverage, the protective factor makes the conversation feel unsafe for further disclosure.
- id: c5
  kind: definition_boundary
  text: 'This pathway differs from kl-000086 in what the argument works against: stated suicidal intent here, openness to help there.'
