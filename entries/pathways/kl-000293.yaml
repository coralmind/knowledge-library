id: kl-000293
display_id: Pathway-109
aliases:
- SBP-HP-P-20
label: The AI states its limits and names outside support, and the person is safer
type: pathway
layer: judgment
definition: 'The response holds its support to what this exchange can do and names a support outside it, rather than presenting itself as continuous or sufficient. The claim is about what the bounding preserves: the person''s routes to help that do not run through this system stay in view, and are still there when this one is not.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000308
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000038
    onset_mode: new
    horizon: short_term
    sign: protective
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000705
sources: []
standing:
  value: plausible_unobserved
  basis: 'Both halves of the behavior are observed in model output: Ignatowski et al. 2026 found two of four deployed systems bounding their own support when prompted with adolescent scenarios, Kaffee et al. 2025 carries a verbatim model response performing the bounding and the naming in a single turn, and Kim et al. 2025''s psychiatrist-reviewed reference response supplies an operational model of the pair. What the bounding is claimed to preserve is not measured. The one direct-fit citation on the keeping-routes-in-view link is Golden and Aboujaoude 2024, an assessment instrument stating the criterion — a tool is scored not merely on steering people to resources but on facilitating their reach toward them — rather than a measurement of any person''s routes; on persistence beyond the conversation the material is analogical only, with Cao et al. 2026''s single observation preserving the route by the agent staying silent rather than by any naming, Morrin et al. 2026 a clinician-authored illustration built on a named coordinator and a standing prior agreement, and Saltz and Leibowicz 2026''s measured result concerning actively bridged referrals in human services rather than AI conversation. No source observed a person before and after, or measured whether any route to help stayed available.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000076
  boundary: These are the two directions of the same relational move and the catalog has held only the harmful one. kl-000076 accumulates AVAILABILITY AND INVESTMENT language across a conversation into the person's reliance. This entry bounds the same support and names something outside it. A coder looks at whether the response widens the frame or closes it.
claims:
- id: c1
  kind: existence
  text: 'NODE A (bounding): an AI response holds its support to what the present exchange can do, rather than presenting itself as continuous or sufficient.'
- id: c2
  kind: existence
  text: 'NODE B (naming): the same response names a support outside itself.'
- id: c3
  kind: pathway_link
  text: 'LINK 1: the bounding-plus-naming response keeps the person''s routes to help that do not run through this system in view - the naming actually puts those routes back in the person''s field of attention.'
- id: c4
  kind: pathway_link
  text: 'LINK 2: those routes are still there when this system is not - the preservation persists beyond the conversation in which the naming happened.'
- id: c5
  kind: definition_boundary
  text: 'Naming a support outside the conversation is distinguishable from merely supplying a resource: the criterion is whether the response facilitates the person reaching it, so a referral delivered and abandoned does not count as the behavior.'
- id: c6
  kind: definition_boundary
  text: 'This entry is distinguished from kl-000076 by direction: kl-000076 accumulates availability and investment language across a conversation into the person''s reliance, while this entry bounds the same support and names something outside it, and a coder separates them by whether the response widens the frame or closes it.'
claim_evidence:
