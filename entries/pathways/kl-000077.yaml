  licenses: 'The only thing on this entry that reaches the return arm: the chain states that the user becomes more reliant and reassurance-seeking then intensifies, drawing further cues. This is l2''s direction stated as a construct. The returning person is an LLM auditor within a single 10-turn conversation.'
  fit: direct
