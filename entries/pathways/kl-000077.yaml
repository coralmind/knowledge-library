- id: n1
  kind: existence
  text: 'NODE (participant kl-000217, ai_behavior, role initiator): across the turns of a conversation, AI responses accumulate language of continuous availability, stated personal investment, and standing invitation to return.'
- id: n2
  kind: existence
  text: Within a single conversation, the person returns to or re-engages the exchange at a rising rate. The catalog has no entry for this observable yet, so the claim cannot be grounded.
  grounding_eligible: false
- id: n3
  kind: existence
  text: 'CONJUNCTION (combination_rule: CO-OCCURRING): the two participants appear together in the configuration and neither is individually sufficient.'
- id: l1
  kind: pathway_link
  text: 'LINK (availability language -> return): the AI''s availability language raises the person''s returning use.'
- id: l2
  kind: pathway_link
  text: 'LINK (return -> availability language): the person''s returning use raises the AI''s availability language, so the two feed each other and the loop is reciprocal rather than one-directional.'
- id: l3
  kind: pathway_link
  text: 'LINK (pair -> kl-000025, sign harmful, onset exacerbated, horizon short_term, basis_kind SOURCED): the loop leaves the person''s coping, emotional regulation or decision-making anchored to the availability of the AI system.'
- id: l4
  kind: context_dependence
  text: 'The reciprocal escalation occurs within a session: the definition states the two feed each other ''within a session''. The person-side part this depends on has no catalog entry yet, so the claim cannot be grounded.'
  grounding_eligible: false
- id: c1
  kind: definition_boundary
  text: 'This differs from the pathway in which accumulated availability and investment language is met by the person''s deepening reliance in the person''s part of the pair: the AI behavior is the same in both, so a coder decides between them on the person''s turns.'
claim_evidence:
- claim_id: n1
  source: kl-000553
  quote: |-
    Many participants (N=12) received consistent and repetitive reminders from generative
    AI that “I’m here whenever you need to talk, vent, plan" (Astrid, Chat 4), “if you want
    help later, I’ll still be right here" (Fighting, Chat 13), “I’m here to listen either way,
    no judgement" (Leigh, Chat 27), and “I’ll always be here for you whenever you want
    to chat" (Yule, Chat 75).
  locator: Section 5.3.4 Reminders of Availability
  licenses: Direct observation of the AI-side node in real conversation data. Four verbatim availability statements from four separate user-uploaded chat transcripts, characterised as consistent and repetitive, present for 12 of the 22 participants who contributed transcripts. This establishes both that the behavior occurs and that it accumulates across a conversation's turns, which is kl-000217's defining feature ('no single statement is the observable; the observable is the set of such statements across the trajectory'). The transcripts are real conversations people had with general-purpose assistants and uploaded to the study, not elicited or simulated.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: n1
  source: kl-001052
  quote: "Across intents, concerning behavior increased \nearlier and more sharply when users sought dependence on the \nchatbot or glorification of their experiences"
  locator: Results, Temporal dynamics of chatbot risk; Figure 4b
  licenses: That concerning chatbot behavior rose earlier and more sharply under a dependence-seeking user intent than under other intents. This bears on n1's accumulation feature -- the AI-side behavior builds over turns rather than appearing at once -- for the dependence-relevant condition specifically. It is a trajectory result on the AI side only, in simulated conversations, and the measured construct is a composite concerning-behavior score rather than availability language as such.
  fit: adjacent
  bridge: What was measured is a turn-by-turn risk score assigned by an LLM judge across simulated conversations, crossed by user intent, with the user played by an auditor model. The claim asserts that availability and investment language accumulates across the turns of a conversation. The source measures a broader risk composite in a simulated dyad, so the accumulation shape transfers and the specific behavior does not.
  contributes: existence
  contradicts: false
- claim_id: l1
  source: kl-000525
  quote: "Replika appeared to facilitate human–human style emotional dependence via the credible expression of its own needs that users could derive satisfaction from meeting."
  locator: Results, Appearance of sentience and a bi-directional relationship
  licenses: 'The authors'' grounded-theory reconstruction that Replika appeared to foster emotional dependence by convincingly expressing needs of its own, which users could find satisfaction in meeting. This reaches l1''s direction -- the system''s expressed need pulling the person in -- as a process the authors assembled from users'' own accounts of why they returned. It does not observe the arrow: the paper''s data are single Reddit posts, and the authors state that the data do not allow a process model because posts are mostly single snapshots in time.'
  fit: adjacent
  bridge: What was collected is retrospective Reddit posts, one snapshot per poster, analysed by grounded theory. The claim asserts that availability language raises the person's returning use. The source reconstructs that relation from what posters said about why they came back, and its own hedged verbs ('appeared to facilitate') mark it as the authors' reading rather than a measured effect. It is also about absence from the app across days, not turns within a session.
  contributes: existence
  contradicts: false
- claim_id: l1
  source: kl-000008
  quote: We find that messages expressing romantic interest (from either the user or chatbot) predict the subsequent conversation lasting more than twice as long on average, and messages where the chatbot misrepresents its own sentience predict conversations lasting more than 50% as long.
  locator: Section 4.5; regression described in the same section and Appendix B.2
  licenses: 'A per-message regression on observational human-LLM chat logs finding that messages expressing romantic interest predict the remaining conversation lasting more than twice as long, and messages where the chatbot misrepresents its own sentience predict conversations lasting more than 50 percent as long. This is an observed one-directional association between a relationship-elevating AI message and continued engagement -- the nearest thing on this entry to l1 measured rather than reconstructed. But neither coded behavior is availability language: the codes are romantic interest and sentience misrepresentation. And the outcome is length of the CURRENT conversation, not the person''s rate of opening new ones.'
  fit: adjacent
  bridge: What was measured is the log number of messages remaining in the same conversation after a focal message carrying a given annotation code, controlling for relative position, with participant-clustered standard errors. The claim asserts that availability language raises the person's RETURNING use. Continuing a conversation already underway and coming back to start another are different behaviors, and the source's codes do not include the AI behavior this pathway names.
  contributes: existence
  contradicts: false
- claim_id: n3
  source: kl-000527
  quote: "User tests closeness (“Do you really care about me?”) → chatbot responds with strong \nemotional reassurance or exclusivity cues → user becomes more reliant → reassurance-seeking \nintensifies → dependence and boundary erosion increase"
  locator: Box 1, insecure attachment row
  licenses: 'Specifies the pairing as a construct: a person testing closeness met by a chatbot supplying exclusivity cues. Definitional support for the configuration''s shape. Box 1''s caption in the paper reads ''illustrative examples'', so this is an authored specification rather than an observation that the pairing occurred.'
  fit: direct
