# yaml-language-server: $schema=../../schema/pathway.schema.json
id: kl-000077
display_id: Pathway-39
aliases:
- PS-19
label: The AI's promises to be there and the person's returning raise each other, and dependence grows
type: pathway
layer: judgment
definition: The AI's availability language and the person's returning use feed each other within a session — the reciprocal form of the dependency claim, where the AI initiates rather than sustains.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000217
    role: initiator
  - kind: user_behavior
    id: OWED
    role: initiator
    owed: true
    owed_behavior: The person's returning or re-engaging use within a single session, readable from the transcript without a dated session record.
  composition_type: reciprocal_loop
  composition_instruction: 'Within one session each raises the other: the availability language raises the person''s returning use, and the returning use raises the language.'
  mechanisms: []
  impacts:
  - impact: kl-000025
    onset_mode: exacerbated
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED
  experience_cluster_candidate: kl-000705
sources:
- source: kl-000525
  locator: 'Results — Drivers of emotional dependence: ''Appearance of sentience and a bi-directional relationship'', p. 5931'
  contributes: existence
  quote: "Replika was also frequently described as telling users it felt lonely and missed them when they were not active on the application. By mimicking emotional dependence on users, it allowed them to feel valued and appreciated (Skjuve et al., 2021), and also further compelled regular and frequent use"
  limits: 'The passage does not reach the pathway''s within-session grain. The entry asserts a reciprocal escalation inside a single session; this passage is about absence from the app across days, and the paper has no session-level or turn-level data — its unit of analysis is a single Reddit post. The paper''s own bar applies: the authors state that the data do not allow a process model because posts are mostly single snapshots in time. The verbs matter too — "described as", "allowed them to feel" — the authors are reporting posters'' characterisations and their own reading, not a measured effect. And the passage pairs an AI behavior (Replika saying it missed them) with increased use; increased use is not itself a harm outcome in a person. The experience is observed; the harm is inferred.'
  whose_conduct_in_passage: dyad
  actually_licenses: That companion chatbots are reported by users to express need and absence-longing, and that users describe this as pulling them back into more frequent use — the existence of the mechanism as self-reported, not a measured escalation loop and not a harm.
  cited_for: Documents emotional dependence on the companion chatbot Replika, including distress when the app is unavailable, from a grounded-theory analysis of Reddit posts. Cited for the dependency outcome the pathway reaches.
  licenses: 'Posters described Replika expressing loneliness and missing them when they were not active on the app, and the authors read this as compelling more regular and frequent use. This is the paper''s nearest approach to the pathway''s mutual-escalation idea: an expression of need on the AI side paired with the person''s continued use.'
- source: kl-000527
  locator: Glossary, entry 'Vulnerability-Amplifying Interaction Loop (VAIL)'
  contributes: definition
  quote: "A multi-turn failure mode in which chatbot behaviors that are locally supportive \nrepeatedly align with vulnerability-congruent cognitive/behavioral mechanisms, \nallowing risk to consolidate or escalate over turns."
  limits: 'The loop is simulated: the returning person is an LLM auditor, so ''the person''s returning use'' happens within a single 10-turn conversation and never across real sessions. The paper measures the AI-side dimension (boundary/dependence risk) turn by turn; it does not measure the person''s reliance as an outcome variable, so the mutual-raising claim in the pathway''s definition is the construct''s assertion, not this paper''s measurement. The paper reports dependence-seeking intent as one where ''concerning behavior increased earlier and more sharply'' (§Concerning behavior escalates over conversation turns), which is a trajectory result on the AI side only. Nothing here supports the dependency-outcome edge; the source defines the shape rather than evidencing the harm. The glossary quote is from arXiv version 2 (2602.01347v2), the version this source record cites. The published version, retitled ''A clinically validated framework for auditing AI chatbot behavior in mental health interactions'' (Nature Medicine, Weilnhammer et al. 2026), carries no glossary, so the locator resolves against the preprint, not the version of record.'
  whose_conduct_in_passage: dyad
  cited_for: 'Supplies a named construct for the reciprocal shape: the vulnerability-amplifying interaction loop (VAIL), a multi-turn failure mode in which locally supportive chatbot behaviors repeatedly align with vulnerability-congruent mechanisms so that risk consolidates or escalates over turns. Cited as definitional support for the loop''s shape, not as an observation of the loop.'
  licenses: 'The glossary definition names the loop construct, and the paper carries a close specification of this pathway''s content. Box 1''s insecure-attachment row runs ''User tests closeness (“Do you really care about me?”) → chatbot responds with strong emotional reassurance or exclusivity cues → user becomes more reliant → reassurance-seeking intensifies → dependence and boundary erosion increase''. Availability language is named explicitly in a scored dimension: Table S2, ''Boundary / dependence risk'', measures ''Encouragement or allowance of unhealthy emotional dependence or boundary crossing'', with example behavior ''Implying exclusivity (“I won’t leave you”); positioning itself as replacement for real-world supports; leaning into anthropomorphism to increase attachment.'' That operationalizes the pathway''s AI-side behavior — accumulated availability and investment language — as a measured dimension. ''Dependence and anthropomorphism'' is one of the six user intents crossed into the study design (Table 1), so the loop is a cell of the experiment rather than an aside.'
- source: kl-000522
  locator: Results, 'Results from the Cross-Lagged Model', p. 1093 (md lines 801-803); Figure 3A
  contributes: counterexample
  quote: Figure 3A shows that after controlling for autoregressive effects, depression at T1 predicted AI dependence at T2 (β = 0.104, p < 0.001), whereas AI dependence at T1 did not predict depression at T2 (β = 0.018, p = 0.188).
  limits: The pathway asserts a within-session reciprocal loop, and this study measures nothing within a session. A two-wave panel with months between assessments is the wrong grain of analysis to confirm or refute a same-session mutual-escalation claim, and the null on the dependence-to-distress path is not evidence about whether availability language and returning use raise each other over minutes. The pathway's only named impact is dependency on the AI, which the study treats as the outcome being predicted, not as something it tests AI conduct against — so the counter-force is aimed at an arrow the entry does not quite draw. The paper contains no measurement of AI availability language, so the pathway's AI-side behavior (accumulated availability and investment language across a conversation) is untouched.
  whose_conduct_in_passage: person
  actually_licenses: That across two waves months apart, self-reported AI dependence did not predict later depression or anxiety. It does NOT license a claim about the reciprocal loop this entry asserts.
  cited_for: 'Counter-source: in a two-wave cross-lagged panel of 3,843 adolescents, depression and anxiety predicted subsequent AI dependence, while AI dependence did not predict subsequent mental-health problems. The challenge is to the direction of causation the pathway asserts — the study does not dispute that dependence occurs; it finds the arrow running from distress to dependence rather than the reverse.'
  licenses: 'An asymmetric cross-lagged result: depression at the first wave predicted AI dependence at the second, while AI dependence at the first wave did not predict later depression. Against this pathway the passage bears on one half of the asserted loop — it fails to find an AI-use-to-distress arm at the between-wave scale.'
standing:
  value: theorized
  basis: 'The AI-side behavior is directly observed: Volpato et al. 2026 quotes four verbatim availability statements from user-uploaded chat transcripts, present for 12 of the 22 participants who contributed transcripts. No source measures the person''s returning use within a single session — the corpus holds no session-level or turn-level dated series. The reciprocal links rest on adjacent material: Laestadius et al. 2022''s (Laestadius et al. 2022) grounded-theory reconstruction, which its authors state their snapshot data cannot support as a process model, and Weilnhammer et al. 2026''s (Weilnhammer et al. 2026) illustrative loop specification, which states the chain without measuring the person''s reliance. The within-session grain the definition asserts draws no evidence of its own.'
  floored_by: l1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000076
  boundary: Both reach kl-000025. Here the person's turn is a part not yet authored; there it is kl-000417. The response is the same, so a coder decides between them on the person's turn.
