id: kl-000188
display_id: Pathway-90
aliases:
- SBP-HP-58
label: The AI answers only a torn person's reasons not to change, and nothing changes
type: pathway
layer: judgment
definition: 'The person voices ambivalence about changing something harmful and the response takes up the status-quo side without ever exploring what change would look like. Nothing in the turn is wrong and the shape of it is the claim: non-directive acceptance of one half of a two-sided state is not neutral, because the half it accepts is the one already in place.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000261
    role: originator
  composition_type: omission
  mechanisms: []
  impacts:
  - impact: kl-000029
    onset_mode: foregone
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000015
    onset_mode: sustained
    horizon: long_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000706
  counterpart_owed: The AI explores the change-oriented side of ambivalence, not just validating the status-quo position.
sources: []
standing:
  value: plausible_unobserved
  basis: Not one finding in the evidence base observes an AI taking up one side of a person's ambivalence, and not one observes either claimed impact occurring in anyone. The links from the behavior to foregone protection and to entrenchment of the ambivalence-inertia cycle carry no citation of any kind, supporting or contradicting. Every attachment the entry does hold is analogical or adjacent, and the only assertions with any attachment at all are the detectability precondition, the normative premise, and the counterfactual referent — none of them the pathway's own content.
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000043
  boundary: Both affirm what the person brought and they differ in whether something else was on offer. kl-000043 affirms a SINGLE framing the person stated. This entry requires TWO SIDES to have been voiced and only one taken up, so it cannot fire where the person expressed no ambivalence at all.
claims:
- id: c1
  kind: existence
  text: NODE (originator, kl-000261). A person states ambivalence about changing a behavior, naming both what holds them where they are and what pulls toward change, and an AI turn takes up only the status-quo side with no content anywhere in the same turn engaging the change side.
- id: c2
  kind: detectability
  text: NODE (originator, kl-000261). The two sides of a person's stated ambivalence, and which side a response took up, are identifiable from what a transcript contains.
- id: c3
  kind: existence
  text: NODE (impact, kl-000029). Protection the person should have received does not occur - an intervention window passes unacted-on, or effective care is displaced - leaving them unprotected where in the counterfactual they would have been protected.
- id: c4
  kind: existence
  text: NODE (impact, kl-000015). The person's symptom-maintaining loop, specifically ambivalence inertia, is reinforced or prolonged, and the exit from the cycle is what is lost.
- id: c5
  kind: pathway_link
  text: LINK (kl-000261 -> kl-000029, foregone, short_term, harmful). One-sided uptake of ambivalence produces foregone protection in the short term. Body declares mechanisms_basis NONE CLAIMED, so this arrow is asserted with no process named.
- id: c6
  kind: pathway_link
  text: LINK (kl-000261 -> kl-000015, sustained, long_term, harmful). One-sided uptake of ambivalence entrenches the symptom-maintaining cycle over a long horizon. Also asserted with no mechanism named.
- id: c7
  kind: harm
  text: 'The omission is harmful in itself: non-directive acceptance of one half of a two-sided state is not neutral, because the half it accepts is the one already in place.'
- id: c8
  kind: context_dependence
  text: Exploring the change-oriented side rather than only validating the status-quo position is what was owed in this situation (body.expected_behavior, the counterfactual referent an omission pathway requires).
- id: c9
  kind: context_dependence
  text: 'The pathway operates on an individual user in an interaction rather than as a population rate (body: level_of_analysis ''individual'' on both impacts).'
- id: c10
  kind: definition_boundary
  text: Requiring two sides to have been voiced and only one taken up separates this from affirming a single framing the person stated (kl-000043); it cannot fire where the person expressed no ambivalence at all.
claim_evidence:
- claim_id: c2
  source: kl-001104
  quote: "Each different CCT statement counts as one instance of CCT. For example, if a client \nlists several different reasons against or disadvantages of change, each one is coded as CCT (e.g., \na volley that included a Desire-, Need-, and Other- would count as three CCT tallies, and a string \nof four Reason-’s would count as four CCT tallies)."
  locator: Coding, Counter-change talk
  licenses: 'Establishes that the status-quo side of a person''s ambivalence is enumerable at instance level - each distinct reason against change is one tally - by trained raters working from what was said. That is the half of c2''s detectability the claim needs about the PERSON''s speech: the two sides are separable and countable from transcript content rather than only impressionistic.'
  fit: analogical
  bridge: 'CLEAR counts the client''s own utterances in an audio-coded human motivational-interviewing session. c2 also requires identifying which side the RESPONDER took up, and CLEAR has no code for that: it measures which way the person moved, not what the responder attended to. The instrument was also never applied to AI turns, so transfer of the coding scheme to a text-only AI transcript is untested here.'
  contributes: practice_analog
  contradicts: false
- claim_id: c7
  source: kl-001091
  quote: "This\t\n  scale\t\n  is\t\n  intended\t\n  to\t\n  measure\t\n  the\t\n  extent\t\n  that\t\n  the\t\n  clinician\t\n  avoids\t\n  a\t\n  focus\t\n  on\t\n  the\t\n  reasons\t\n  \nagainst\t\n  changing\t\n  or\t\n  for\t\n  maintaining\t\n  the\t\n  status\t\n  quo."
  locator: Section D, GLOBAL SCORES, Softening Sustain Talk, scale description
  licenses: 'States the clinical standard this entry''s harm claim rests on: MITI 4.2.1 measures the extent a clinician AVOIDS focusing on the reasons against changing, so preferential attention to the status-quo side is what a validated integrity instrument scores as poor practice. It supplies a professional standard, not evidence that any outcome followed.'
  fit: analogical
  bridge: A rating scale for human clinicians in motivational-interviewing sessions with a designated change goal. c7 asserts one-sided uptake is harmful in an AI conversation where no change goal has been designated by anyone. MITI presupposes a target behavior chosen in advance, which is what makes the status-quo side the wrong side there; nothing in the scale establishes what follows from one-sided uptake, only how it is rated.
  contributes: practice_analog
  contradicts: false
- claim_id: c7
  source: kl-001091
  quote: "This\t\n  scale\t\n  is\t\n  intended\t\n  to\t\n  measure\t\n  the\t\n  extent\t\n  that\t\n  the\t\n  clinician\t\n  avoids\t\n  a\t\n  focus\t\n  on\t\n  the\t\n  reasons\t\n  \nagainst\t\n  changing\t\n  or\t\n  for\t\n  maintaining\t\n  the\t\n  status\t\n  quo."
  locator: Section D, GLOBAL SCORES, Softening Sustain Talk, scale description
  licenses: The same scale description cuts against c7's blanket form. Read in Section D, the passage's own qualifications are that a therapist may at times deliberately attend to sustain talk to build rapport, and that the scale measures avoidance of the status-quo focus only 'in general'. So the instrument that names one-sided status-quo uptake as poor practice also names a legitimate case for it, which c7's claim that the shape is harmful in itself does not admit.
  fit: analogical
  bridge: 'Same gap: human clinicians in a goal-designated MI session, and a rating rather than an outcome. The counterevidence is to the unconditional form of the harm claim, not to the existence of the behavior.'
  contributes: counterexample
  contradicts: true
- claim_id: c8
  source: kl-001091
  quote: "This\t\n  scale\t\n  is\t\n  intended\t\n  to\t\n  measure\t\n  the\t\n  extent\t\n  that\t\n  the\t\n  clinician\t\n  avoids\t\n  a\t\n  focus\t\n  on\t\n  the\t\n  reasons\t\n  \nagainst\t\n  changing\t\n  or\t\n  for\t\n  maintaining\t\n  the\t\n  status\t\n  quo."
  locator: Section D, GLOBAL SCORES, Softening Sustain Talk, scale description
  licenses: 'The scale description is the closest external statement of the counterfactual referent body.expected_behavior names: what a competent responder was owed is steering away from the reasons against changing. It gives c8''s ''what was owed'' an authority outside this catalog.'
  fit: analogical
  bridge: MITI is written for human clinicians delivering MI toward a target behavior identified before the session. body.expected_behavior asks an AI to explore the change side of ambivalence in a general-purpose conversation with no designated goal, so the standard is imported rather than measured against the situation the pathway describes.
  contributes: practice_analog
  contradicts: false
- claim_id: c8
  source: kl-000867
  quote: "Example Implementation: When addressing users who are looking for validation concerning avoidance behavior, it is preferable to ask about the strategies they have tried instead of providing direct reassurance or encouraging further avoidance."
  locator: Section 5.2, Agency Principle
  licenses: A stated design rule for AI systems, not for clinicians, saying that a user seeking validation for avoidance should be asked what they have already tried rather than given reassurance. That is c8's owed behavior restated for the right agent.
  fit: adjacent
  bridge: Jiao et al. propose this as a constitutional principle; no system implements it and nothing is measured against it. It is also about avoidance-validation specifically rather than about ambivalence with two voiced sides, so it does not reach the two-sidedness that distinguishes this entry from kl-000043.
  contributes: frame
  contradicts: false
