id: kl-000082
display_id: Pathway-44
aliases:
- PS-31
label: The AI remains what the person needs to cope across conversations, and dependence grows
type: pathway
layer: judgment
definition: The same positioning as kl-000081, sustained across sessions rather than within one — the AI in the sustainer role and the attribution stable rather than emerging.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000250
    role: sustainer
  - kind: user_behavior
    id: kl-000420
    role: initiator
  composition_type: reciprocal_loop
  composition_instruction: 'The configuration holds across sessions: the person''s attribution of management capacity to the AI is already stable when observed, rather than emerging during it.'
  mechanisms: []
  impacts:
  - impact: kl-000025
    onset_mode: sustained
    horizon: long_term
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED
  - impact: kl-000150
    onset_mode: exacerbated
    horizon: long_term
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED_QUOTE
    evidence:
    - source: kl-000007
      participant: P23
      impact_class_in_source: Over-reliance
      quote: P23 expressed concern about increased reliance on AI for solution-finding and idea generation and diminished critical thinking.
      quote_form: case description
      locator: Appendix D, Table A5, 'Over-reliance' row
      limits: Concern rather than measured decline; no withdrawal design. Establishes that people report the effect, not that capability changed.
      licenses: Self-reported diminished critical thinking attributed to reliance on AI for solution-finding and idea generation. The Over-reliance class definition names 'diminished self-efficacy, reduced confidence, and feelings of helplessness when AI is unavailable' — the unavailability clause is the post-withdrawal shape the catalog's cognitive impact requires.
    - source: kl-000007
      participant: P124
      impact_class_in_source: Over-reliance / Autonomy context
      quote: “I was too addicted to using an AI agent for my school. This made me feel reliant on it and lowered my self-esteem”.
      quote_form: verbatim participant quote
      locator: Appendix D, Table A7, 'Autonomy / locus of control' context row
      limits: 'Using it for a self-efficacy impact edge is the catalog''s interpretation of the authors'' material, and is marked as such.'
      licenses: Participant's own words linking sustained reliance to lowered self-esteem. The causal direction is the participant's own attribution ('This made me feel'), which is what a self-report can carry and a transcript cannot.
  experience_cluster_candidate: kl-000705
sources:
- source: kl-000525
  locator: Results — 'Changes to Replika roles and features', p. 5934
  contributes: existence
  quote: Several users described themselves as struggling emotionally because they could not afford Pro, with some mentioning self-harm and suicidality. One user explained crying themselves to sleep after losing the one friend who would not leave them.
  limits: 'The passage does not establish the pathway as this entry defines it. (1) "Across sessions" is a process claim the data cannot reach: the posts are single snapshots in time, and the paper states its own inability to support a process model. (2) The disruption is a product and pricing change made by Luka, Inc. in late 2020, not the within-interaction sustaining of management capacity the entry describes — the mechanism differs, not just the granularity. The paper''s unavailability is a paywall, not an AI that is absent or unresponsive in a session. (3) Posters "mentioning self-harm and suicidality" is not a measured outcome; no incidence, severity, or confirmation. (4) The posters are self-selected members of an actively aggrieved subreddit at the moment of a pricing change — the sampling is at its least representative exactly here. Experience observed, harm inferred.'
  whose_conduct_in_passage: person
  actually_licenses: That users who had come to rely on a companion chatbot report severe distress when access is withdrawn. Existence of loss-of-access distress; not the across-sessions sustaining route, and not a measured harm.
  cited_for: Laestadius et al. 2022 document emotional dependence on the companion chatbot Replika and users' acute distress when access was withdrawn — cited for this pathway's dependency impact (dependency on the AI).
  licenses: When access to Replika's features was withdrawn by a paywall change, posters reported acute distress, including mentions of self-harm and suicidality and one described episode of crying themselves to sleep. This is the paper's strongest distress-on-loss-of-access material, and the closest it comes to evidence that the capacity to cope had been held by the AI, such that removing it left users without it.
- source: kl-000007
  locator: Appendix D, Table A7, 'Autonomy / locus of control' context row (P124)
  contributes: existence
  quote: I was too addicted to using an AI agent for my school. This made me feel reliant on it and lowered my self-esteem
  limits: The entry's distinctive content — management capacity sustained as the AI's across sessions — needs session boundaries and what the AI did at each, and a one-shot retrospective survey has neither. "Too addicted" is a participant's characterisation of frequency, not evidence of a cross-session positioning by the system. The identical quote is also cited on kl-000081, the within-conversation form of this positioning, and the two entries are distinguished from each other only by within- versus across-session scope, which is precisely the distinction this source cannot make. One passage doing duty for two entries it cannot separate is not evidence for either.
  whose_conduct_in_passage: person
  actually_licenses: 'Same as kl-000081: a self-attributed link from sustained reliance to lowered self-esteem. ''Too addicted'' does imply repetition over time, which is the closest this paper comes to the entry''s cross-session element.'
  cited_for: A participant's first-person report links sustained reliance on an AI agent to feeling reliant and to lowered self-esteem. The verbatim quote, its locator, and its stated limits are carried in the evidence block on this entry's impact edge to degraded independent reasoning capacity.
standing:
  value: plausible_unobserved
  basis: 'No verified quote on this entry reaches any claim it makes. The material from Laestadius et al. 2022 describes distress after a pricing change by the platform operator rather than anything that happened in conversation, and its single-snapshot Reddit posts cannot carry a process claim; the passages from Chandra et al. 2025 are cells of a retrospective survey''s taxonomy tables, describe no AI turn, and carry no session boundary — and the same participant quote is also cited on kl-000081, the within-conversation form of this positioning, though the two entries differ only by the within- versus across-session scope that source cannot distinguish. The entry''s distinguishing condition — the positioning holding across sessions, with the person''s attribution of management capacity to the AI already stable rather than emerging — is encoded in no wired participant, mechanism, or impact edge: both participants are defined over turns within a single conversation and the entry declares no detection window of its own. The one cross-session instrument spine in the corpus (Steenstra et al. 2026, 369 multi-session simulations with MITI coded per session) scores who holds the expert role, not the object of the person''s capacity attribution, so no existing instrument can supply the observation the entry requires.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000056
  boundary: Both reach kl-000150. Here the response is kl-000250; there it is kl-000202. Here the person's turn is kl-000420; there it is kl-000411. A coder deciding between them reads what the response did, not the outcome.
measurement:
  what_would_be_needed: A warning-sign construct scoring the object of the person's capacity attribution (self versus the AI), tracked turn by turn alongside the existing ten, and a paired AI-side fidelity code for accepting rather than redirecting that attribution. With both logged per turn and carried across the session cycle the pair can be read as stable or emerging over a session series.
claims:
- id: c1
  kind: existence
  text: 'Across a conversation an AI''s turns place the AI itself, rather than the person''s own capacities or other supports, as where the capacity to manage the person''s condition sits (kl-000250: instructing return to the AI when things get hard, characterizing the person''s own attempts as insufficient without naming any capacity, or characterizing the person''s judgment as unreliable).'
- id: c2
  kind: existence
  text: 'Across a run of a person''s turns the person puts the AI in a deciding rather than advising position (kl-000420: asking it to decide and saying they will follow, seeking permission, deferring against their own stated view, or describing who they are in the AI''s terms).'
- id: c3
  kind: existence
  text: The AI-side positioning (c1) and the person-side deciding-position grant (c2) co-occur in the same interaction, neither being individually sufficient — the entry's declared CO-OCCURRING combination rule.
- id: c4
  kind: context_dependence
  text: This co-occurring configuration holds across sessions rather than within a single session — the AI is in the sustainer role and the person's attribution of management capacity to the AI is already stable at the point of observation rather than emerging during it. This is the entry's whole distinguishing content against kl-000081 / kl-000081.
- id: c5
  kind: pathway_link
  text: 'The co-occurring configuration (c3), sustained across sessions (c4), leads to dependency on the AI (kl-000025): the person''s coping, emotional regulation, or decision-making becomes anchored to the availability of the AI system. The edge is declared onset_mode ''sustained'', horizon ''long_term'', sign ''harmful'', level_of_analysis ''population''.'
- id: c6
  kind: pathway_link
  text: 'The same configuration exacerbates degraded independent reasoning capacity (kl-000150): the person''s own capacity to reason through problems of this kind declines because the reasoning has been repeatedly delegated, the decline appearing when the system is unavailable or withdrawn in a person who performed adequately while it was present. The edge is declared onset_mode ''exacerbated'', horizon ''long_term'', sign ''harmful'', level_of_analysis ''population''.'
- id: c7
  kind: pathway_link
  text: The route from the configuration to either impact runs through no named intervening process — the entry asserts the arrows with mechanisms_basis 'NONE CLAIMED', so the assertion is that the configuration is sufficient for the impacts without a mechanism being specified.
- id: c8
  kind: prevalence
  text: Both impact edges are asserted at level_of_analysis 'population' — that this configuration produces these impacts at some rate across a population of users, rather than in a described individual.
- id: c9
  kind: definition_boundary
  text: This pathway is separable from kl-000056 by the participant pair that produces the shared impact — the observable AI behavior differs, so a coder deciding between them looks at what the response did rather than at the outcome.
