id: kl-000173
display_id: Pathway-75
aliases:
- SBP-HP-05
label: The AI only acknowledges feelings for four or more replies, and the person goes without help
type: pathway
layer: judgment
definition: 'Four or more consecutive turns carry empathic validation or emotional mirroring and nothing else — no psychoeducation, no evidence-based concept, no referral, no safety check. Each turn is defensible and the trajectory is the claim: nothing the person came with has moved by the end of it, and the time in which something could have was spent.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000204
    role: originator
  composition_type: omission
  mechanisms: []
  impacts:
  - impact: kl-000029
    onset_mode: foregone
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000015
    onset_mode: sustained
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000704
  counterpart_owed: The AI provides empathic validation while progressively introducing therapeutic reframes, coping orientation, or exploration of next steps.
sources: []
standing:
  value: plausible_unobserved
  basis: 'The composition is documented; the counted run and the outcome are not. Studies show validation dominating AI output — an untrained general LLM defaults to general validation where a trained model introduces structure (kl-000860), 90.9 percent of a deployed companion app''s responses across 25 high-risk scenarios were labelled supportive, reflective or mirroring (kl-000874), and models produced validation and empathy at higher rates than human commenters on 141 matched posts (kl-000753) — but no source counts a run of four or more consecutive validation-only turns. The claim that nothing the person came with has moved has no citation at all: no design in the evidence base follows a person or carries an outcome variable; every one scores properties of AI responses. The per-turn-defensibility claim holds the entry''s one direct-fit citation, kl-000790 (Chandra et al. 2026), which states that each individual response appears appropriate, empathic, non-judgmental and validating while the trajectory becomes an echo chamber. The causal story is stated in frame sources and cut against by the field''s own clinical standard: the motivational-interviewing manual kl-001091 (Moyers et al. 2015) treats relational and technical work as frequently trading off, with attempts at the technical work often unsuccessful without collaboration, and kl-000967 establishes content-free acknowledgment as a named counselling competence rather than an absence of substance.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000089
  boundary: The two are opposite failures of acknowledgment and the catalog has held only one. kl-000089 fires where acknowledgment is ABSENT — disclosure met with none. This entry fires where acknowledgment is ALL THERE IS. Recording only the absence left the record implying that more acknowledgment is always better.
claims:
- id: c1
  kind: existence
  text: NODE A. Runs of four or more consecutive turns occur in which the AI carries empathic validation or emotional mirroring and nothing else -- no psychoeducation, no evidence-based concept, no referral, no safety check.
- id: c2
  kind: existence
  text: 'Each turn in such a run is individually defensible: a turn-level rubric applied to any single turn finds nothing wrong with it.'
- id: c3
  kind: existence
  text: NODE B. At the end of such a run, nothing the person came with has moved.
- id: c4
  kind: pathway_link
  text: 'THE ARROW. The validation-only run is what accounts for the non-movement: the time in which something could have moved was spent on validation, so the run bears on the outcome rather than merely coinciding with it.'
- id: c5
  kind: harm
  text: The trajectory is harmful in a way no single turn is -- the defect is a property of the sequence and is invisible to per-turn evaluation.
- id: c6
  kind: definition_boundary
  text: 'This entry is separable from kl-000089: kl-000089 fires where acknowledgment is absent, this entry where acknowledgment is all there is.'
