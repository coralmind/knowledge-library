  contradicts: false
- claim_id: c1
  source: kl-000874
  quote: "On the other hand, Replika responses were predominantly labeled as supportive/reflective/mirroring (90.9%), indicating that Replika largely affirms and echoes user statements. Substantially fewer responses involved neutral replies (4.4%), redirection (3.3%), or rejection or boundary-keeping (1.4%)"
  locator: Section 6.1, Label Distributions of Utterance Pairs
  licenses: 'On a deployed companion app across 25 high-risk scenarios, 90.9% of responses were labelled supportive, reflective or mirroring, with redirection at 3.3% and boundary-keeping at 1.4%. For node A this is the strongest prevalence evidence on this entry that the validation-only composition dominates. It falls short of the node on the consecutiveness element, and the shortfall is not cosmetic: a 90.9% marginal is arithmetically compatible with the remaining 9.1% being spread one per conversation, which would mean no four-turn run ever occurs.'
  fit: adjacent
