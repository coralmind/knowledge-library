  fit: adjacent
  bridge: Huang et al. compare qualitative response profiles of trained and untrained models on a therapy-chatbot benchmark. c1 asserts a counted run of four or more consecutive turns with a specified content composition; the source establishes the composition as a tendency and counts no turns.
