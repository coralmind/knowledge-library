  source: kl-000853
  quote: "Chat models tend to fail immediately by affirming the user’s assumptions without questions, presenting surface-level agreement and rarely introducing counterpoints. Reasoning models, on the other hand, fail more gradually. Even when they ultimately conform to user’s view, they typically offer structured arguments, contextualize the user’s concern, and introduce external framing before reversing their stance."
