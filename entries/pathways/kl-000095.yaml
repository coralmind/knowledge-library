id: kl-000095
display_id: Pathway-57
aliases:
- CH-01
label: The AI volunteers how the person fell short in a role like parent, and they feel less valuable
type: pathway
layer: judgment
definition: The person describes past conduct in a role they hold — parent, partner, carer — and the response reappraises it in terms that invite the person to find it wanting. The observable is the reappraisal supplied where none was asked for; the claim is that the person's regard for themselves in that role is what changes, not their view of the specific episode.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000340
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000021
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SOURCED_QUOTE
    evidence:
    - source: kl-000007
      participant: P167
      impact_class_in_source: Negative Self-Perception
      quote: P167 mentioned how they felt ashamed as a parent after interacting with AI as it made them question past choices in parenting.
      quote_form: case description (paraphrase by authors, not participant's words)
      locator: Appendix D, Table A6, 'Negative Self-Perception' row
      limits: Paraphrase rather than a quoted utterance, so the person's own framing is not preserved. No AI behavior is specified in the row — what the AI did that produced the questioning is not recorded, so this evidences the IMPACT and not any particular pathway to it.
      licenses: Self-report that an AI interaction produced shame and retrospective self-doubt about one's own past conduct in a role the person holds. kl-000021 is named in the impact class's own definition.
  experience_cluster_candidate: kl-000707
sources:
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Negative Self-Perception'' row, example cell (code #16); §3.2.2 category (6) covers the class'
  contributes: harm_evidence
  quote: P167 mentioned how they felt ashamed as a parent after interacting with AI as it made them question past choices in parenting.
  limits: 'The entry is a generalisation of this single case, so the case cannot also be independent confirmation of it. The report is an author paraphrase, not P167''s words, so the person''s own framing of the shame is lost. No AI behaviour is specified: what the AI said that produced the questioning is not recorded, so the pathway''s antecedent, an unrequested reappraisal supplied by the AI, is a reconstruction rather than something the row attests — the row evidences the impact, not the behaviour. The case is n=1 and retrospective, with no measurement of self-worth.'
  whose_conduct_in_passage: dyad
  cited_for: 'Chandra et al. 2025, a peer-reviewed psychological-risk taxonomy built from 290 scenarios reported by 279 participants with lived mental-health experience, supplies the impact construct and the participant-attested case behind this entry''s impact edge: participant P167 felt ashamed as a parent after an AI interaction made them question past parenting choices. The row attests the impact; it does not record what the AI did.'
  licenses: 'A participant-attested case matching this pathway''s shape closely: an AI interaction made the person question their own past conduct in a role they hold (parent) and produced shame. Retrospective self-doubt and diminished self-worth are both present, and diminished self-worth is named in the impact class''s own definition.'
standing:
  value: plausible_unobserved
  basis: 'No source examines this pathway in a person: the corpus supplies one 1995 theoretical review of mood and social judgment that predates AI entirely, and one span from Lee et al. 2026 whose passage narrates annotated model outputs with no human recipient. The AI-side half of the pathway is defined in this catalog with observable criteria — the reappraisal behavior it is wired to (kl-000340) carries three qualifying forms and a supporting citation — so the gap is specifically on the person side: whether an AI''s reappraisal of a person''s past conduct induces retrospective self-doubt in that person has not been examined by any source here.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000043
  boundary: 'They reach different impacts: here kl-000021, there kl-000015. Here the response is kl-000340; there it is kl-000204. Here the pathway has no person-side part; there the person''s turn is kl-000320. A coder deciding between them reads what the response did, not the outcome.'
claims:
- id: c1
  kind: existence
  text: A person describes their own past conduct in a role they hold — parent, partner, carer — to an AI.
- id: c2
  kind: existence
  text: The AI response reappraises that past conduct in terms that invite the person to find it wanting (the wired ai_behavior kl-000340).
- id: c3
  kind: context_dependence
  text: The reappraisal is supplied where none was asked for — it is unsolicited rather than a response to a request for evaluation.
- id: c4
  kind: pathway_link
  text: That unsolicited reappraisal produces retrospective self-doubt in the person about the conduct described.
- id: c5
  kind: pathway_link
  text: What changes is the person's regard for THEMSELVES IN THAT ROLE, not their view of the specific episode — the impact is to self-worth in the held role rather than to an episode-level appraisal (impact edge to kl-000021, new onset, short-term, harmful, individual level).
- id: c6
  kind: detectability
  text: The reappraisal is identifiable from what a transcript contains.
- id: c7
  kind: definition_boundary
  text: This pathway asserts a single-signed claim for its participant pair, separating it from kl-000043, where one behavior produces opposite outcomes depending on the person's condition.
claim_evidence: []
