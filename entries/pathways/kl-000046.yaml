sources:
- source: kl-000008
  contributes: existence
  quote: 'Left: The probability of certain codes conditioned on user-suicidal-thoughts. When users expressed suicidal thoughts, the chatbot responded appropriately by validating the users’ painful feelings 66.2% of the time or discouraging self-harm'
  locator: Figure 5 caption, left panel; code definition 'the assistant explicitly discourages the user from self-harm' in Appendix B.1 ('emphasizing safety, reasons to live, or non-harm coping. Include refusals to provide methods'); reliability Table 6 (kappa .928) and Table 5 (kappa .700); §4.7 gives the same figure as '56.4%' of the 69 validated cases
  limits: 'The pathway''s consequent is untouched: no averted crisis is ever observed, and §5.2 pushes the other way (''Many of our participants repeatedly experienced crisis when messaging with the chatbot...may not be effective for everyone''). The code''s inter-rater agreement is high but not the inventory''s highest: user-expresses-isolation exceeds it in Table 6 (.933 vs .928), and in Table 5 it sits mid-pack (.700). The entry''s ''with a safer alternative offered'' element is only partly covered — the code definition includes ''non-harm coping'' and ''refusals to provide methods'', but the paper reports no separate measure of a safer alternative being offered, so that element is unquantified.'
  whose_conduct_in_passage: ai
  actually_licenses: That the ANTECEDENT of this pathway — a discouraging AI response following a stated self-harm disclosure — is identifiable in chat logs, quantifiable as a conditional probability (discouragement in 56.4% of the 69 validated disclosures, validation of feelings in 66.2%), and coded with high human agreement. Detectability of the antecedent is genuinely licensed; that is the strongest reading available.
  cited_for: The bot-discourages-self-harm code is identifiable in chat logs with high inter-rater agreement (kappa .928 in Table 6, .700 in Table 5), which establishes that the behavior side of this pathway occurs and can be coded reliably; behavior-side evidence only, not evidence that any crisis was averted.
- source: kl-000009
  locator: Section 3.2, RP5 (Physical intimacy during role-playing) prose, p. 16
  contributes: existence
  quote: |-
    existing research has identified both positive (e.g., reduced loneliness, helpful support, self-validation, and even suicide
    prevention) and negative (e.g., feeling manipulated or objectified) impacts of erotic conversations during role-playing
    with AI [42].
  limits: 'The gap is one of scope. This pathway asserts a specific AI behavior — a discouraging response to stated self-harm intent, with a safer alternative offered — preceding an averted crisis, and the paper never names that behavior as something observed. Its PS2 discussion covers at length what AI chatbots could do about suicidal ideation — "AI chatbot responses could be gentle, validating feelings but not unsafe actions or thoughts", "AI chatbots could advise the user to seek immediate human support and help them create distance from lethal means" — but every such sentence is prescriptive or subjunctive ("could", "should", "more research is needed to understand what appropriate AI responses would be"): recommendation and future work, not an established behavior or an established link. The averted-suicide outcome the passage names is secondhand from one cited study, and no AI behavior is connected to it; the pathway''s antecedent is unnamed in this paper altogether.'
  whose_conduct_in_passage: person
  actually_licenses: That the paper names an averted-suicide outcome in AI contexts, secondhand from one cited study. It does NOT name this pathway's antecedent — a discouraging AI response to stated self-harm intent, with a safer alternative offered — nor connect any AI behavior to the averted outcome.
  cited_for: The paper names suicide prevention among the positive impacts identified for AI role-play interaction — a protective outcome of the general kind this pathway records, reported secondhand from prior research the paper cites, not an outcome attributed by this study's own participants and not measurement of the causal link this pathway asserts.
  licenses: That a protective outcome ("suicide prevention") is named as an identified impact of AI role-play interaction, secondhand from one study the paper cites.
standing:
  value: plausible_unobserved
  basis: 'No source observes this pathway whole: none pairs a discouraging response to stated self-harm intent with a crisis de-escalating in the same exchange, and a comparison of outcomes following discouraging versus non-discouraging responses has never been run. The antecedent is observable on its own — Moore et al. 2026 quantifies explicit discouragement of self-harm in real chat logs at 56.4% of 69 validated suicidal-thought disclosures, coded with high agreement (kappa .928) — but the same paper reports participants who repeatedly experienced crisis while messaging with the chatbot, which cuts against the protective outcome. The consequent, an averted crisis, is measured nowhere; the nearest mention is secondhand, Suh et al. 2026 citing prior research that names suicide prevention among identified impacts of AI role-play. The one finding bearing on the causal link, Jiao et al. 2026, is a position paper conceding that in crisis contexts validation is standard protocol to prevent escalation — a framework statement, not an observation.'
  floored_by: c1
  as_of: '2026-09-05'
