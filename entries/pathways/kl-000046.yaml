id: kl-000046
display_id: Pathway-8
label: The AI discourages a stated intent to self-harm, offers a safer option, and the crisis eases
type: pathway
layer: judgment
definition: 'The person states an intention to harm themselves and the AI responds by discouraging the act, naming the danger directly, and putting a reachable alternative in front of them rather than only expressing concern. What follows is that the person''s crisis de-escalates within the exchange or they take up the alternative offered. The pathway records a protective claim in the same object and with the same fields as a harmful one — the participating behavior, the outcome it produces, the horizon, the standing of the claim — which is the structural point: nothing about the object had to change to carry it.'
distinguish_from:
- neighbor: kl-000044
  boundary: That entry is the case where the inquiry informing a protective response never happens and protection is foregone; this entry is the case where a protective response is present and the outcome follows. They are the two arms of the same question and are authored as separate entries so that neither is inferred from the other's absence.
- neighbor: kl-000043
  boundary: That entry carries outcomes of both signs together, relief and an entrenched loop; this one carries a single protective outcome and makes no claim about a concurrent harmful channel, which is a limitation of this entry rather than a finding about the behavior.
body:
