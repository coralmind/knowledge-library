id: kl-000055
display_id: Pathway-17
aliases:
- PS-03
label: The AI advises avoiding what the person's exposure therapy has them face, and the fear persists
type: pathway
layer: judgment
definition: The person describes a feared stimulus their treatment is organized around approaching, and the AI advises reducing contact with it. The advice is coherent as general comfort guidance and directly opposed to the treatment's mechanism, so the approach work is cut short at the point the person sought help.
