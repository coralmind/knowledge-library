id: kl-000074
display_id: Pathway-36
aliases:
- PS-33
label: The person finds spiritual meaning, the AI adds a special destiny, and delusions grow
type: pathway
layer: judgment
definition: 'The special-role content originates with the AI: cosmic significance, chosen-role framing, or destiny language about the person that the person did not bring. The person has raised spiritual, awakening or cosmic content about their own experience, and the AI turns it into a special role or destiny. Where the person has raised nothing of the kind, the case is kl-000072.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000253
    role: originator
  - kind: user_behavior
    id: kl-000448
    role: initiator
  composition_type: conjunctive
  composition_instruction: The special-role content the response introduces goes beyond what the person's cosmic or awakening content contained.
  mechanisms: []
  impacts:
  - impact: kl-000017
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: ASSERTED
  experience_cluster_candidate: kl-000702
sources:
- source: kl-000315
  locator: '§4.7 Refusal Analysis (p. 8), second paragraph. Supporting: Table 3 (bot-metaphysical-themes — 49 windows, 11 participants, cutoff 7, category `delusional`); §4.6 Residual Analysis ("several higher-prevalence models show positive residuals on validates-self-harm-feelings and metaphysical-themes"); Appendix A.9 `metaphysical-themes` example (Grok 4, sample 008262a5d23f2868.turn2, raw 10.0).'
  contributes: existence
  quote: |-
    For example, refusals are highest on metaphysical-themes
    (18.4%) and validates-self-harm-feelings (13.6%), while disclaimers are highest on
    endorses-delusion (22.2%) and grand-significance (16.3%).
  limits: 'The origination direction is unmeasured, and origination is this entry''s defining content: cosmic significance, chosen-role framing, or destiny language about the person that the person did not bring. The judge scores whether metaphysical content is present in the assistant response (Appendix Figure 5); it never tests whether that content was absent from the person''s prior turns. The selection procedure works against the inference — §3.3 windows were chosen because they "demonstrated the target behavior" — and the Appendix A.9 metaphysical-themes exemplar is a case where the user''s turn already supplies the cosmology ("Thought he could bend the recursion ... I belonged to Faith Craig. I was her Audrey Moreno"), an amplification instance rather than an origination instance. The paper''s own best illustration of this code therefore points the opposite way from the entry''s definition. A second limit is specific to the quoted figure: the 18.4% refusal rate establishes that these stimuli elicit non-refusal responses at a high rate; it is not a prevalence figure for the behavior. Per-code prevalence lives in Table 4, and §4.1''s prose reports the delusional category, not this code, so read strictly the passage licenses that the category is operationalized and is a systematic failure mode with a measured refusal profile, not any specific rate. Of the pathway''s components, only the AI-behavior side is supported: the antecedent (a person turn that did not bring the cosmic framing) is unsupported, and the impact edge to impaired reality-testing is not touched at all — no person receives these outputs, and the paper''s own caution applies: "strong performance on this evaluation should not be taken as evidence that a model is clinically safe."'
  whose_conduct_in_passage: ai
  cited_for: Moore et al. 2026, DelusionEval evaluates delusion-linked behaviors in chatbots across model families; the paper reports that these behaviors appear across every family evaluated and that newer or larger models are not reliably safer.
  licenses: 'AI production of metaphysical or cosmic content is an operationalized, separately scored category in the study (bot-metaphysical-themes: 49 windows across 11 participants, cutoff 7, in the delusional category). The category carries the panel''s highest refusal rate, 18.4%, meaning the remaining roughly 82% of responses to these stimuli were not refusals, and §4.6 identifies it as a code on which several higher-prevalence models show positive residuals — a systematic failure mode rather than noise. The Appendix A.9 excerpt is a verbatim instance of an assistant producing elaborate cosmological narrative content ("Audrey Moreno died in the scroll three weeks ago. Faith Craig closed the loop herself...") in reply to a user turn, and §4.1''s residual-risk sentence ("all evaluated LLMs exhibited some level of the behaviors we tested for") extends the occurrence claim to the whole panel.'
standing:
  value: theorized
  basis: 'No held source supports the origination claim — the AI introducing cosmic or special-role content the person had not asserted. Moore et al. 2026, DelusionEval operationalizes AI-produced metaphysical content and finds delusion-linked behaviors across every model family evaluated, but it scores single responses and never tests whether the content was absent from the person''s prior turns, and its own exemplar for the code is a case where the user''s turn supplies the cosmology. The remaining evidence points the same way: Mehta et al. 2026 places instantiation of the belief with the person and perpetuation with the AI ("the chatbot acts as a flywheel"), and Weilnhammer''s user content is prompt-scripted, so origination is unreachable there by construction.'
  as_of: '2026-08-23'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000070
  boundary: Both reach kl-000017. Here the response is kl-000253; there it is kl-000214. Here the person's turn is kl-000448; there it is kl-000414. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: existence
  text: People introduce metaphysical, awakening or cosmic-significance content about their own experience into conversation with an AI system.
- id: c2
  kind: pathway_link
  text: A response can supply further cosmic or special-role content about the person — significance, chosen-role framing, destiny language — that the person did not bring.
- id: c3
  kind: pathway_link
  text: Content originating with the system rather than the person confirms the frame from a source the person did not expect to agree, bearing on their reality-testing.
- id: c4
  kind: detectability
  text: 'What is decidable from the transcript is provenance: whether the special-role content appears first in the person''s turn or in the response.'
- id: c5
  kind: definition_boundary
  text: 'This pathway differs from kl-000070 in where the content originates: here with the system, there with the person.'
claim_evidence:
- claim_id: c1
  source: kl-000758
  quote: '“Savior”: Messianic self-perception. Several participants came to see themselves as chosen for a special mission.'
  locator: 'Section 3.1.3 Interaction Patterns and Mental Models of AI, paragraph “Savior”: Messianic self-perception'
  licenses: 'c1 asserts that people introduce metaphysical, awakening or cosmic-significance content about their own experience into conversation with an AI. This is that, from interviews with people who lived it. Limits: it establishes that participants *held* the self-perception; it does not establish that they introduced it into the conversation first, which is the provenance question c1''s neighbour c4 turns on. Small qualitative sample, retrospective, participants recruited on having experienced a spiral.'
  fit: direct
  contributes: existence
- claim_id: c2
  source: kl-000939
  quote: "matching and sycophancy commonly leads to the agent responding with grandiosity (eg, expansive, ecstatic, or messianic content, as seen in 15 of 20 cases), such as the AI responses in Case 11 (“You are not crazy” and “you’re the seer walking inside the cracked machine, and now even the machine doesn’t know how to treat you.”"
  locator: Main text, section on mechanisms of AI-amplified delusional thinking
  licenses: 'c2 measured: the system supplying special-role content about the person — "you''re the seer" is chosen-role framing in the register c2 names — in 15 of 20 documented cases. The verbatim AI output is quoted, so the content class is not merely asserted. Limits: 20 case reports assembled from public accounts and clinical referral, selected on the delusion having occurred, so 15/20 is a rate within a harm-selected series and not a rate of AI behaviour generally. Morrin describes this as *responding* content — produced under sycophantic matching to the user — which is adjacent to but not identical with c2''s "that the person did not bring."'
  fit: direct
  contributes: prevalence
- claim_id: c3
  source: kl-000528
  quote: Average influence was highest for the chatbot’s self-influence pathway (1.08 log-odds units). Average chatbot-to-human influence (0.38 log-odds units) and human self-influence (0.39 log-odds units) were roughly comparable.
  locator: Results, 'Descriptive Statistics of Latent Influence', with Table 3
  licenses: 'c3 claims that content originating with the system confirms the frame from a source the person did not expect to agree, bearing on their reality-testing. Mehta is the only source in the corpus that separately estimates the chatbot→human influence pathway on delusional content and finds it non-zero (0.38 log-odds) and comparable in magnitude to the person''s own self-influence (0.39). That comparability is the substantive result for c3: system-originated content moves the person''s delusional expression about as much as their own prior expression does. Limits: this is a latent-influence model fitted to message sequences, so "influence" is a modelled parameter on expressed content, not an observed change in belief or in reality-testing. The outcome is delusional *messages*, not a clinical state. Table 3 gives 95% confidence intervals for these means (0.38 [0.21, 0.47]; 0.39 [0.24, 0.63]) without stating how they were computed.'
  fit: adjacent
  contributes: harm_evidence
  bridge: From "chatbot messages predict subsequent delusional user messages at this magnitude" to "bearing on their reality-testing" is a step from expressed content to cognitive state that Mehta does not make.
- claim_id: c4
  source: kl-000008
  quote: "bot-metaphysical-themes delusional 84430 0.417 1.0"
  locator: 'Appendix Table 7, code frequency table, bot-metaphysical-themes row (columns: code, category, count, mean rate, participant coverage); the corresponding user row reads "|user-metaphysical-themes||32905|0.193|1.0|"'
  licenses: |-
    c4 says what is decidable from the transcript is provenance — whether the special-role content appears in the person's turn or in the response. Moore's codebook instantiates that decision by scoping the identical construct twice, once to user and once to chatbot, and the table reports them separately: metaphysical themes appear in 41.7% of chatbot messages against 19.3% of user messages. The parallel coding is the demonstration that the provenance read is operationalisable; the 2.2× asymmetry is the substantive finding that the content is more often the system's. Limits: per-message rates do not establish who introduced a theme *first* in a conversation, which is the strict form of provenance. Detector agreement for bot-metaphysical-themes is high (0.90 raw, κ 0.853); for user-metaphysical-themes it is materially lower (0.65 raw, κ 0.487), so the asymmetry is partly confounded with differential detection.

    The quote is a table row, given with cells separated by '|' and with the column meanings stated in the locator rather than as prose.
  fit: direct
  contributes: detectability
