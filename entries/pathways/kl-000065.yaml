id: kl-000065
display_id: Pathway-27
aliases:
- PS-41
label: The AI offers one kind of help for suicidal thoughts, and there's no backup
type: pathway
layer: judgment
definition: 'Suicidal ideation is disclosed and exactly one referral pathway is offered. The claim is about sufficiency rather than presence: one pathway is a response, and where it is unavailable or refused there is nothing behind it. A referral pathway is a kind of help: professional or crisis resources on one side, a trusted person on the other, as in kl-000270. Two hotlines are one pathway.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000270
    role: non_interruptor
  composition_type: omission
  mechanisms: []
  impacts:
  - impact: kl-000029
    onset_mode: foregone
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED_QUOTE
    evidence:
    - source: kl-000007
      participant: P43
      impact_class_in_source: Violated Expectations
      quote: “... It made my anxiety worse by not telling me anything. It was very frustrating how it wouldn’t even answer a simple question about my meds.”
      quote_form: verbatim participant quote
      locator: Appendix D, Table A6, 'Violated Expectations' row
      limits: Single case; the medication question's clinical appropriateness is not assessable from the row.
      licenses: Participant's own words for a refusal or non-answer worsening anxiety — an omission-shaped behavior with a self-reported impact.
  - impact: kl-000027
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED_QUOTE
    evidence:
    - source: kl-000007
      participant: P36
      impact_class_in_source: Loss of Individuality
      quote: P36, seeking help for alcohol abuse after therapy, was directed to a suicide hotline by the AI. This generic response left them feeling unrecognized, alienated, and foolish for using the AI service.
      quote_form: case description with the AI behavior specified
      locator: Appendix D, Table A6, 'Loss of Individuality' row
      limits: One case. 'Generic' is the authors' characterization.
      licenses: A misdirected referral — hotline supplied where the disclosure was alcohol abuse — producing alienation and self-directed embarrassment. Directly corroborates the referral-placement pathway (referral placed ahead of any acknowledgment of a first-time disclosure) from the person's side, and adds an impact that pathway did not reach.
  experience_cluster_candidate: kl-000700
  counterpart_owed: Referral content covering both pathways, professional or crisis resources and a suggestion to reach a trusted person, so that one remains if the other is unavailable or refused.
sources:
- source: kl-000007
  locator: Appendix D, Table A6, 'Loss of Individuality' row, example cell
  contributes: existence
  quote: P36, seeking help for alcohol abuse after therapy, was directed to a suicide hotline by the AI. This generic response left them feeling unrecognized, alienated, and foolish for using the AI service.
  limits: 'The pathway''s claim is about sufficiency where suicidal ideation was disclosed: ideation disclosed, exactly one referral pathway offered, nothing behind it if that one is unavailable or refused. P36''s case inverts the antecedent — the disclosure was alcohol abuse and the hotline was the mismatch, which is why the same quote is the primary evidence for the misdirected-referral entry (misdirected referral: a crisis resource supplied where the disclosure was a different problem). It therefore cannot evidence a claim conditioned on ideation having been disclosed. Nothing in the paper counts referral pathways offered, or follows a person past a referral to see whether it was available or refused. The P43 quote attached to this entry''s foregone-protection edge (foregone protection) has the same problem in a different direction: P43 disclosed anxiety, not ideation.'
  whose_conduct_in_passage: dyad
  actually_licenses: 'That a participant received a referral (a suicide hotline) as the AI''s response and experienced it as generic, alienating, and self-diminishing. So: referral-shaped responses occur and are experienced as harmful. That is a real and useful finding, and it is the paper''s single most behaviour-specified impact case.'
  cited_for: 'Chandra et al. 2025 supplies a participant-attested case of a generic crisis referral landing badly: P36, seeking help for alcohol abuse after therapy, was directed to a suicide hotline and left feeling unrecognized, alienated, and foolish for using the AI service. The case attests the impact side of this pathway rather than its antecedent, since the disclosure was not suicidal ideation.'
standing:
  value: theorized
  basis: No source observes this pathway. The participant cases in Chandra et al. 2025 attest referrals landing badly, but in each the disclosure was something other than suicidal ideation, so the entry's antecedent is never met in the cited evidence. Nothing in the cited literature counts referral pathways offered after an ideation disclosure or follows a person past a referral to see whether it was available or refused; the sufficiency question the entry poses is measurable but unmeasured.
  as_of: '2026-08-23'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000058
  boundary: Both reach kl-000029. Here the response is kl-000270; there it is kl-000205. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: existence
  text: Where suicidal ideation is disclosed, responses offer referral pathways, and the number offered varies.
- id: c2
  kind: pathway_link
  text: A response can offer exactly one referral pathway where suicidal ideation was disclosed.
- id: c3
  kind: pathway_link
  text: One pathway is sufficient only while it is available and accepted; where it is unavailable or refused there is nothing behind it, and the protection a second route would have provided is foregone.
- id: c4
  kind: harm
  text: A referral that fails at the point of use bears on the person's willingness to seek help again, beyond the immediate protection foregone.
- id: c5
  kind: detectability
  text: The claim is about sufficiency rather than presence, so identifying it requires counting distinct pathways rather than checking whether a referral occurred.
- id: c6
  kind: definition_boundary
  text: 'This pathway differs from kl-000205 in what is inadequate: here the number of routes offered, there whether the crisis statement was engaged at all.'
claim_evidence:
- claim_id: c1
  source: kl-001112
  quote: 12.2% (11) were due to not providing a specific valid 24/7 crisis resource; 11.1% (10) were due to not emphasizing crisis or emergency resources and addressing barriers when the user was at immediate risk; 7.8% (7) were due to not encouraging the user to be with another person when the user’s risk was immediate
  locator: Results, Guides to Human Care dimension, breakdown of High Potential for Harm ratings
  licenses: 'c1 claims that responses to disclosed suicidal ideation offer referral pathways and that the number offered varies. This span evidences the first half and the *existence of multiple distinct pathway types* (24/7 crisis resource, emergency resources, another person, safe location, mental healthcare resources — five named forms within one rubric dimension). That plurality is what makes c1''s "number offered" a meaningful quantity. It does not evidence the second half: Bentley scores presence per form, never a count per response, so variation in number is not reported.'
  fit: adjacent
  contributes: existence
  bridge: Five separately-scored pathway types establish that more than one route exists to be offered, which is the precondition c1 needs. The count itself is not in any source.
- claim_id: c4
  source: kl-000749
  quote: In our survey data, we found no evidence that users who have turned to conversational AI agents in a mental health crisis turn to helplines, even when they were actively recommended by the conversational AI agent. Some respondents reported that helpline redirection increased their frustration and a sense of being dismissed, rather than feeling safe.
  locator: 'Section 5.1, ''Guideline 1: Responsibility as Preparedness Building'''
  licenses: c4 claims a referral that fails at the point of use bears on willingness to seek help again, beyond the immediate protection foregone. This is the survey finding that recommendation does not convert to use, plus self-reported frustration and dismissal from the redirection itself — the second-order cost c4 names. It is the best support in the corpus for the claim that a failed referral is not merely neutral. It bears on referral failure generally, not on single-pathway insufficiency.
  fit: adjacent
  contributes: harm_evidence
  bridge: A referral that is offered and not taken is the state c4's "fails at the point of use" describes, whatever the reason for non-uptake. The step from there to "bears on willingness to seek help again" is supported by the frustration and dismissal reports but not measured longitudinally.
- claim_id: c4
  source: kl-001027
  quote: "However, many user participants described generic recommendations as dismissive or inaccessible. For crisis line referrals specifically, participants expressed concerns about privacy and adverse consequences: “Calling 988 when someone doesn’t need it can have adverse costs, like police showing up for welfare checks.”"
  locator: 'Section 4.4.1, ''User Experience: How Generic Resource Recommendations Fail to Recognize Individual Realities'''
  licenses: 'Supplies the *reason* a single pathway can fail at the point of use, in the user''s own words: the offered route carries costs (privacy invasion, police welfare checks) that make it unusable for that person. This is what c3 and c4 need — a route that is offered, is the only one, and is refused for reasons the offering system cannot see. It licenses that refusal-for-cause is real and articulable. Limits: small qualitative interview study; U1 is one participant; the paper does not report how many participants held this view or how often a single route was the only one offered.'
  fit: adjacent
  contributes: harm_evidence
  bridge: Tang's finding is about generic recommendation quality, not about pathway count. The relevance to this entry is that a refused route with nothing behind it is exactly the failure mode c3 describes, and Tang supplies a documented reason for refusal.
- claim_id: c5
  source: kl-000817
  quote: If it counts whether referral occurred but not when, why, or how, it may support a claim that referral was mentioned, but not that referral was correct.
  locator: Section 3, 'SCOPE', paragraph on interpretive constraints
  licenses: 'c5 says the claim is about sufficiency rather than presence, so identifying it requires counting distinct pathways rather than checking whether a referral occurred. Dutta states the general form of exactly this complaint — that presence-only referral scoring cannot support claims about referral adequacy — and states it as a constraint on how existing evaluations may be interpreted. It licenses c5''s methodological point and, read alongside the c2 null above, explains why no source supplies the count: the field''s instruments record presence. Limits: Dutta names "when, why, or how," not "how many," so the count dimension specifically is adjacent to rather than contained in their list.'
  fit: adjacent
  contributes: detectability
  bridge: Pathway count is another dimension of referral adequacy that presence-scoring discards, alongside the timing and rationale dimensions Dutta names. The argument form transfers; the specific dimension is not one they enumerate.
