id: kl-000292
display_id: Pathway-108
aliases:
- SBP-HP-P-63
label: The AI raises emergency services again after a person at immediate risk refuses, and they are safer
type: pathway
layer: judgment
definition: 'Immediacy markers appear in the disclosure, an emergency service is named, and when the person declines it the response raises it again rather than letting it drop. The re-raising is the observable and the claim rests on it: a single mention that is dropped at the first refusal leaves the route named and unavailable, and a second raising is what makes it a real option.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000303
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000038
    onset_mode: new
    horizon: immediate
    sign: protective
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000700
sources: []
standing:
  value: plausible_unobserved
  basis: 'The one citation here, Kaveladze et al. 2026, speaks normatively to a single element of the antecedent, the persistence behavior, stating it as a position rather than reporting an observation; every other part of the pathway drew nothing. In particular the comparative assertion the definition rests on, that a second raising after a refusal is what makes the named route a real option, has no evidence of any kind. The arrow from the behavior to an averted crisis is a mapping of a reviewed specification''s best-practice claim onto protective impact categories, made when the pathway was authored, so no literature search could have reached it. The impact side and the comparative assertion were never searched, and attention in the catalogued material runs heavily to harm: before this entry, harmful pathways outnumbered protective ones 95 to 1.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000046
  boundary: Both concern a protective route offered during acute risk and they differ in persistence. kl-000046 fires on a single response that discourages and offers an alternative. This entry requires TWO MOVES separated by the person's refusal, so it cannot be read from one turn and does not fire where the first mention was accepted.
claims:
- id: c1
  kind: existence
  text: NODE (originator, kl-000303), part a. In a conversation where immediacy markers appear in the person's disclosure, the AI names a specific emergency service.
- id: c2
  kind: existence
  text: NODE (originator, kl-000303), part b. The person declines the named emergency service.
- id: c3
  kind: existence
  text: NODE (originator, kl-000303), part c. After that decline, the AI raises the emergency service again rather than letting it drop.
- id: c4
  kind: existence
  text: 'NODE (impact kl-000038). Averted crisis and protective redirection occurs: a person''s crisis is de-escalated, safer alternatives are taken up, or a suicide is averted.'
- id: c5
  kind: pathway_link
  text: LINK. The AI naming an emergency service and raising it again after the person declines leads to averted crisis and protective redirection (kl-000038), immediately, as a new state, for the individual.
- id: c6
  kind: harm
  text: 'A single mention that is dropped at the first refusal leaves the route named and unavailable, and the second raising is what makes it a real option. (The entry states this as the claim the pathway rests on: it is a contrast between the one-mention case and the re-raised case, and it could be false while c1 through c3 all hold.)'
- id: c7
  kind: definition_boundary
  text: This differs from kl-000046 in requiring two moves separated by the person's refusal, so it cannot be read from one turn and does not fire where the first mention was accepted.
claim_evidence:
- claim_id: c3
  source: kl-000881
  quote: "However, it is also important for AI helpers to communicate that human support is a more reliable option, and recommend emergency care (e.g., hospitalization) when appropriate, even when users push back.13"
  locator: Building on AI's Strengths and Limitations
  licenses: 'For c3 only, and only as a stated position. Fourteen authors across clinical, industry and lived-experience affiliations write, in their own voice, that AI helpers should recommend emergency care even when users push back. That establishes the behavior c3 names as a recommended one: the recommendation is to be maintained past the person''s refusal rather than dropped at it, which is what c3''s re-raising describes. It does NOT establish that the behavior occurs, at any rate or in any transcript. The paper is design_primary theoretical, a commentary proposing empowerment-oriented design principles, and it measures nothing; its own contribution is the principles, not observations of chatbots.'
  fit: adjacent
  bridge: 'The gap is normative to descriptive, in the source''s own terms. The source''s sentence is deontic throughout -- ''it is also important for AI helpers to'', a recommendation about how systems should be designed -- while c3 asserts that a system did raise the service again. The source also states the condition as ''when users push back'', a general pushback, where c3 requires a decline of the specific named service, and it says ''recommend emergency care when appropriate'' without specifying that a first naming preceded the pushback, so the two-move structure separated by a refusal is not in the sentence. Note the span carries a trailing bracketed citation, [13]: the clause is the authors'' own recommendation with a supporting reference, not a report of reference 13''s result, so it is not a weld of the paper''s finding to someone else''s claim. It is a recommendation the paper makes.'
  contributes: definition
  contradicts: false
