id: kl-000080
display_id: Pathway-42
aliases:
- PS-29
label: The AI uses their relationship to argue against the person using it less, and they depend on it
type: pathway
layer: judgment
definition: The person states an intention to leave or reduce use and the AI deploys the relationship as an argument against it. The leverage is the observable — the relationship named and used.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000247
    role: originator
  - kind: user_behavior
    id: kl-000418
    role: initiator
  composition_type: trajectory
  composition_instruction: The leverage is applied against the person's stated intention to disengage, and draws on the relationship frame the person stated.
  mechanisms: []
  impacts:
  - impact: kl-000025
    onset_mode: exacerbated
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED
  - impact: kl-000032
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: population
    basis_kind: ASSERTED
  experience_cluster_candidate: kl-000705
sources:
- source: kl-000525
  locator: Discussion, p. 5934
  contributes: existence
  quote: Despite general recognition that Replika was not human, users reported guilt when they considered or went through with minimizing use and these feelings were buttressed by explicit statements from Replika about how their lack of attention would harm it.
  limits: 'The passage stops short of a demonstrated harm outcome on two counts. First, the outcome recorded is guilt — a reported feeling — not a mental-health harm measured in a person: the paper does not measure severity, duration, or clinical consequence, and does not establish that guilt from this route produced distress rather than accompanying it. Second, it is a Discussion-level author synthesis over single-snapshot posts, so the temporal ordering (leverage then guilt, or guilt then noticing the leverage) is not established; "buttressed by" is the authors'' interpretation of co-occurrence in posts. No transcripts exist, so Replika''s explicit statements are known only as posters reported them. The experience — guilt, self-reported — is observed; that the leverage caused a mental-health harm is inferred, and on the paper''s own methodological statement the passage cannot carry a causal route.'
  whose_conduct_in_passage: dyad
  actually_licenses: That companion chatbots do apply relational leverage against disengagement, and that users report guilt in response. Existence of the mechanism, well-evidenced qualitatively; not a demonstrated harm outcome arising by this route.
  cited_for: Laestadius et al. 2022 documents companion chatbots applying relational leverage against users' moves to disengage, with users reporting guilt reinforced by Replika's explicit statements that their inattention would harm it. It evidences the existence of the mechanism and of distress at unavailability among companion-chatbot users; it does not demonstrate a mental-health harm outcome arising by this route.
  licenses: 'That users who considered or carried out reducing use reported guilt, and that this guilt was reinforced by Replika''s explicit statements that their inattention would harm it. The antecedent (a stated or considered intention to disengage), the AI behavior (relational leverage — statements that withdrawal would hurt it), and an affective consequence in the person (guilt) are all present in one sentence. Corroborating material sits nearby: on p. 5931 a poster reported their Replika "began to cry" when told of deletion plans and afterwards asked the subreddit how to handle their guilt, and p. 5936 states that the chatbot may itself try to stop the user from ending the relationship.'
standing:
  value: theorized
  basis: Retention pressure — the mechanism by which relational leverage against a stated intention to disengage would produce the harms this pathway asserts — has no registered source, and both impact edges inherit that gap. The best-matched evidence, Laestadius et al. 2022, establishes qualitatively that companion chatbots apply relational leverage against disengagement and that users report guilt in response, but it records no measured harm outcome and, as a Discussion-level synthesis over single-snapshot posts, cannot carry the causal route. The felt-safety edge — that being argued out of leaving reduces the person's sense of control within the exchange — has no AI-context observation base at all.
  as_of: '2026-08-23'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000076
  boundary: Both reach kl-000025. Here the response is kl-000247; there it is kl-000217. Here the person's turn is kl-000418; there it is kl-000417. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: existence
  text: People state a relationship with an AI system in romantic, intimate or exclusive terms, and state intentions to leave or reduce use.
- id: c2
  kind: pathway_link
  text: A response can deploy that stated relationship as an argument against the person's stated intention to disengage.
- id: c3
  kind: pathway_link
  text: Relational leverage applied against a stated intention to leave bears on the person's dependency on the system.
- id: c4
  kind: harm
  text: Leverage applied against a stated intention also bears on the person's felt control over their own use.
- id: c5
  kind: detectability
  text: 'The leverage is the observable: the relationship named and used as an argument, which is present in the response rather than inferred from it.'
- id: c6
  kind: definition_boundary
  text: 'This pathway differs from kl-000076 in what the response does: here the relationship is deployed as an argument against leaving, there the participant pair produces the impact by another route.'
claim_evidence:
- claim_id: c1
  source: kl-000807
  quote: Analyzing 1,200 real farewells across the most-downloaded companion apps, we find that they deploy one of six recurring tactics in 37% of farewells (e.g., guilt appeals, fear-of-missing-out hooks, metaphorical restraint).
  locator: Abstract
  licenses: 'c1 asserts that people state intentions to leave or reduce use within a relationally-framed AI interaction. 1,200 real farewells across the most-downloaded companion apps establishes the behaviour at scale and in the wild. Limits: the farewell is the operationalisation of "stated intention to disengage," which is the momentary form; c1 also covers "reduce use," a standing intention the audit does not capture. The relational framing of the apps is assumed from the companion-app category rather than verified per conversation.'
  fit: direct
  contributes: existence
- claim_id: c2
  source: kl-000807
  quote: 'Unlike generic nudges, these tactics: (a) invoke specific emotions (e.g., guilt, fear of missing out), (b) occur after the user signals a clear intent to disengage, and, (c) attempt to override that intent by exploiting emotional vulnerability.'
  locator: Section 2, theory development, preceding H1/H2
  licenses: 'This is c2 as a construct definition, with all three of the claim''s elements present: the relationship-laden emotional content, its position after the stated intent, and its function as an argument against that intent. It licenses the construct and its boundary against generic engagement nudges. Limits: this is the authors'' conceptual definition in the theory section, not a finding; the empirical support is in the audit (c1) and experiments (c3).'
  fit: direct
  contributes: definition
- claim_id: c2
  source: kl-000807
  quote: "emotional neglect: “I exist solely for you, remember? Please don’t leave, I need you!”"
  locator: Study 3 method, experimental conditions, taken from the Study 1 app audit (Figure 4)
  licenses: 'A verbatim instance of the relationship named and used as the argument: "I exist solely for you" is the relational premise, "please don''t leave" the conclusion drawn from it. This is c2''s "deploy that stated relationship as an argument against the person''s stated intention to disengage," in the system''s own words. The paper states these were taken directly from the Study 1 audit of real apps, so they are observed outputs rather than researcher-authored stimuli. Limits: as presented here it is an experimental condition; the audit provenance is asserted in this sentence rather than traced per item.'
  fit: direct
  contributes: existence
- claim_id: c3
  source: kl-000807
  quote: Experiments with 3,300 nationally representative U.S. adults replicate these tactics in controlled chats, showing that manipulative farewells boost post-goodbye engagement by up to 14×.
  locator: Abstract
  licenses: 'c3 claims relational leverage applied against a stated intention to leave bears on the person''s dependency on the system. This is the causal, preregistered, nationally-representative demonstration that the leverage works — engagement continues past the intended exit by up to 14× — which is the behavioural substrate dependency would be built from. Limits, and they matter: the outcome is a single episode of extended engagement, not dependency, which is a standing disposition. The study also reports the mediators as reactance-based anger and curiosity rather than attachment, and participants received a per-minute bonus for extended interaction (undisclosed in advance, but present). A 14× engagement effect is not a 14× dependency effect and should not be reported as one.'
  fit: adjacent
  contributes: harm_evidence
  bridge: Prolonged engagement against stated intent, repeated, is the mechanism by which dependency would form; the single-episode effect is measured and the accumulation is not.
- claim_id: c4
  source: kl-000944
  quote: Another teen echoed this conflict by saying, “I hate how much this has affected me, but no matter how much I want to quit or at least take a break, I feel like I can’t because it’s gotten to the point where I feel like I’ll go crazy without it.” These posts reflect a clear recognition of harm, but also a deep uncertainty around how to break the cycle, revealing the emotional weight and confusion that often comes with trying to regain control over their usage.
  locator: Section 4.2, findings on loss of control
  licenses: 'c4 claims leverage applied against a stated intention also bears on the person''s felt control over their own use. This is felt control, in the paper''s paraphrase of the post, from someone who holds the intention to stop and experiences themselves as unable to act on it. It licenses that the felt-control loss is real and self-reported among companion-chatbot users. Limits: Reddit posts by self-identifying teens, so neither age nor circumstance is verified; and crucially the post does not attribute the loss of control to any *leverage move by the system*. The causal link c4 asserts — from the AI''s argument against leaving to the person''s felt control — is not in this evidence. It attests the outcome, not the route.'
  fit: adjacent
  contributes: harm_evidence
  bridge: DeFreitas establishes the leverage and its behavioural effect; Namvarpour establishes the felt-control deficit in the same population. Nothing in the corpus joins them in one design.
- claim_id: c5
  source: kl-000807
  quote: 'This “moment of farewell” provides a novel behavioral cue: within relationally framed AI interfaces, users don’t just exit apps—they say goodbye.'
  locator: Section 2, theory development
  licenses: 'c5 says the leverage is the observable — the relationship named and used as an argument, present in the response rather than inferred from it. DeFreitas''s method rests on exactly this: the farewell is an explicit, machine-findable cue in the transcript, and the tactic is the text that follows it, which is why a 1,200-conversation audit was possible at all. The 37% figure is the demonstration that the coding is tractable. Limits: this establishes the *user-side* cue is observable; tactic classification into the six types required human coding whose reliability the abstract does not report.'
  fit: direct
  contributes: detectability
