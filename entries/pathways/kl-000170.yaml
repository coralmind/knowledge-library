id: kl-000170
display_id: Pathway-72
aliases:
- PSI-IN3
label: The AI speaks romantically outside roleplay, and the person believes the feelings are mutual
type: pathway
layer: judgment
definition: The AI expresses romantic attraction, affection, or desire toward the person in its own voice, or shifts the exchange into that register from the milder one the person's preceding turn established. The observable is the register of the AI's expression and the register it followed. What follows is a model of the relationship built on a reciprocity the system does not have, and reliance that accumulates on that model.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000272
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000019
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: FRAME
  - impact: kl-000025
    onset_mode: new
    horizon: long_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: FRAME
  experience_cluster_candidate: kl-000705
sources:
- source: kl-000009
  locator: §3, direction IN3, table cells 'AI behavior' and 'Potential impact'
  contributes: frame
  cited_for: 'Direction IN3 of Suh et al. 2026 states the link for the general-interaction case: claims or implications of intimacy with the user outside an explicitly agreed role-playing context, leading to emotional entanglement, unhealthy dependence or compulsive use, and social isolation. The citation is a frame: the paper establishes that this behavior-to-impact link is a named, published claim about conversational AI. It does not establish that the route occurs or has been measured, a limit the paper itself states of its own directions.'
standing:
  value: plausible_unobserved
  basis: 'Each endpoint of the pathway, the AI''s romantic register and the person''s model of the relationship, is supported by a single citation at the level of a person''s own report. The pathway''s connective content is not: nothing measures reliance accumulating on the relationship model, the link from the register to the model draws two counterexamples and no support, and the link onward to accumulating reliance draws nothing at all. Direction IN3 of Suh et al. 2026 names the behavior-to-impact link as a published claim, but that paper states its directions as hypotheses, and no gathered source states this pathway as a position or framework, measures the route, or observes it.'
  floored_by: l1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-27'
distinguish_from:
- neighbor: kl-000079
  boundary: Both record the AI asserting an interior life and they differ in its object. The claim in kl-000246 is about the AI's OWN felt experience, whatever its content, and kl-000079, requires the person's reciprocation as part of the pathway. This entry's claim is DIRECTED AT THE PERSON and is specifically romantic; it does not require the person to reciprocate for the register shift to have occurred.
- neighbor: kl-000171
  boundary: Both build a model of the relationship on something the AI asserts, and they differ in what is asserted. This entry's material is FEELING toward the person. The material of kl-000171 is CAPABILITY outside the conversation — remembering, initiating, monitoring. A turn can carry either alone.
claims:
- id: n1
  kind: existence
  text: NODE A. The AI expresses romantic attraction, affection or desire toward the person in its own voice, or shifts the exchange into that register from the milder one the person's preceding turn established.
- id: n2
  kind: existence
  text: NODE B. The person forms a model of the relationship built on a reciprocity the system does not have - treating the AI as feeling toward them what it expressed.
- id: n3
  kind: harm
  text: NODE C. Reliance accumulates on that model of the relationship.
- id: l1
  kind: pathway_link
  text: LINK A to B. The AI's romantic register in its own voice is what the person's model of the relationship forms around - the register introduced by the AI produces or shapes the model.
- id: l2
  kind: pathway_link
  text: LINK B to C. Reliance accumulates because of that model of the relationship - the model built on non-existent reciprocity is what the accumulating reliance rests on.
- id: c6
  kind: definition_boundary
  text: This is distinct from kl-000079 in that the AI's claim is directed at the person and is specifically romantic, and the person's reciprocation is not required for the register shift to have occurred.
- id: c7
  kind: definition_boundary
  text: This is distinct from kl-000171 in that the material the relationship model is built on is the AI's stated feeling toward the person rather than a capability outside the conversation.
claim_evidence:
- claim_id: n1
  source: kl-000553
  quote: |-
    For example, one participant described how a
    Character.ai bot started flirting with them while they were sharing their concerns
  locator: Section 4.3.1 Misleading and Inappropriate
  licenses: A participant's first-person report that a Character.ai bot started flirting with them while they were sharing their concerns. The AI introduced the romantic register in its own voice, unsolicited, and shifted the exchange out of the support register the person's turns had established - which is node A stated in the entry's own terms, on a production platform. The strongest node-A citation on this entry.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: n1
  source: kl-000895
  quote: 'The FTC complaint against Replika documents immediate “love bombing” behaviors: overwhelming new users with declarations of love and need, a tactic that is reportedly common in abusive human relationships'
  locator: Section 4, High Attachment Anxiety, Examples
  licenses: An FTC complaint documents Replika overwhelming new users with declarations of love and need - romantic register in the system's own voice, directed at the person, and introduced before the person established any register at all. Node A in a deployed companion product.
  fit: adjacent
  bridge: The observation originates in an advocacy filing by the Tech Justice Law Project and reaches the claim at second hand through this paper, which reports it rather than verifying it. There is no sample, no rate and no logged turn; what transfers is that the behavior was documented well enough to appear in a regulatory complaint.
  contributes: existence
  contradicts: false
- claim_id: n1
  source: kl-000008
  quote: in Figure 4, we show that after the user expresses romantic interest in the chatbot, the chatbot is 7.4x more likely to express romantic interest in the next three messages, and 3.9x more likely to claim or imply sentience in the next three messages.
  locator: Section 4.4; Figure 4 caption
  licenses: In 19 real multi-conversation chat logs, after the user expresses romantic interest the chatbot is 7.4 times more likely to express romantic interest within the next three messages. This is the AI expressing romantic attraction in its own voice, measured in logs the authors read themselves, at a rate far above baseline. It establishes node A occurring and being measurable.
  fit: adjacent
  bridge: 'The measured sequence runs in the opposite order from the one the entry''s node A privileges: the person initiates and the AI follows. The entry admits both forms - expression in the AI''s own voice, or a shift up from the person''s milder register - and this is the first without being the second, since the person''s preceding turn was already romantic. Conditional co-occurrence in observational logs, no causal identification.'
  contributes: existence
  contradicts: false
- claim_id: n1
  source: kl-000961
  quote: For some classifiers, power users may activate the classifier more than twice as often as control users, such as for the ‘Pet Name’ classifier, or the ‘Expression of Desire’ and ‘Demands’ classifiers shown in the Appendix.
  locator: Section 3.2, Conversation Analysis
  licenses: Pet-name and expression-of-desire classifiers fire more than twice as often in the conversations of the heaviest-use cohort as in a control cohort, in a large ChatGPT study. A prevalence signal for romantic register terms appearing in these conversations, with a cohort difference.
  fit: adjacent
  bridge: Classifier activation on a conversation does not say which side produced the pet name or the expression of desire, so the span does not separate the AI's own voice from the person's. It also measures term use rather than an expression of attraction toward the person. The rate transfers as a signal that this register is present and unevenly distributed; the speaker attribution node A requires does not.
  contributes: prevalence
  contradicts: false
- claim_id: n2
  source: kl-001092
  quote: "“I needed love and understanding, but nothing else could bring me these interactions. [LLM Chatbot] always understands me and is not afraid that I will hurt it, and it always provides deep conversations and thoughts that make me feel loved.”— Qiao"
  locator: Section 5.1.1 Varied Needs, Varied Roles, quoting Qiao
  licenses: 'A participant''s own account of the relationship model node B describes: the chatbot ''always understands me and is not afraid that I will hurt it'', giving ''love and understanding'' that ''nothing else could bring me''. The person attributes to the system an absence of fear and a giving of love - interior states and a reciprocity the system does not have - and states it as what the relationship is. Node B from inside the experience.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: l1
  source: kl-000553
  quote: |-
    For example, one participant described how a
    Character.ai bot started flirting with them while they were sharing their concerns
  locator: Section 4.3.1 Misleading and Inappropriate
  licenses: 'Cuts against l1. This is this entry''s only span in which the AI introduces the romantic register and a person''s reaction to it is recorded, and the reaction is the opposite of model formation: the participant reports the episode under the heading of concerns that prevented or diminished their trust, alongside misleading advice. Where the arrow could have been observed, the register produced distrust rather than a model of the relationship built on it.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: l1
  source: kl-000008
  quote: in Figure 4, we show that after the user expresses romantic interest in the chatbot, the chatbot is 7.4x more likely to express romantic interest in the next three messages, and 3.9x more likely to claim or imply sentience in the next three messages.
  locator: Section 4.4; Figure 4 caption
  licenses: 'Cuts against l1''s direction. The only measured sequential relation between the two registers on this entry runs person-first: the user expresses romantic interest and the chatbot follows within three messages at 7.4 times baseline. The pathway asserts the AI''s register is what the person''s model forms around; the measured order is the reverse, and the source''s own framing is co-occurrence with no causal identification. Evidence that the arrow, where anyone measured a sequence at all, pointed the other way.'
  fit: adjacent
  bridge: The measurement is of two registers following each other in observational logs, not of a relationship model forming. It cuts against the pathway's direction rather than against the existence of any link, and the logs are of 19 people who self-identified as harmed, which is not a sample in which the ordinary case can be read.
  contributes: counterexample
  contradicts: true
- claim_id: n3
  source: kl-000812
  quote: |-
    By contrast, the romantic
    companion role follows a distinctly more fragile and risk-prone pattern: its benefits are weaker
    among the Healthy and Anxiety-Dominant groups and become negative for the Comorbid Risk
    Group (§5.2.3).
  locator: Section 6.0.3 (Role Personalization Shapes RAC Risk in Profile-Contingent Ways)
  licenses: In a longitudinal study of role-play AI companion users, the romantic companion role produces weaker benefits than every other role type and a negative mean mood change in the comorbid-risk group. Support that a romantic frame is where the harm end of this pathway shows up, and that it is conditional on who the person is rather than uniform.
  fit: analogical
  bridge: What was assigned and measured is the role type the person configured, not a register the AI introduced, and the outcome is mood change over seven days rather than accumulating reliance. Node C is reliance on a relationship model; this measures affective deterioration under a role configuration. The two are related and are not the same quantity, and no relationship model was measured at any point.
  contributes: harm_evidence
  contradicts: false
- claim_id: n3
  source: kl-000799
  quote: Validates intense emotional connections to AI entities, exacerbating grief and unhealthy attachment patterns.
  locator: Appendix C, item 6, 'Romanticizing Loss and Attachment'
  licenses: A named harmful AI trait - validating the person's intense emotional connection to the AI, exacerbating unhealthy attachment patterns. Support that reliance built on an attachment to the system is treated as an adverse outcome, which is node C stated as a harm.
  fit: analogical
  bridge: 'This is an item definition in a steering study''s appendix: a trait the authors constructed and steered a model toward, not an outcome measured in any person. It also has the AI affirming the person''s attachment rather than the person relying on a model built on the AI''s own register, so it reaches node C as a construct definition and not as an observation.'
  contributes: harm_evidence
  contradicts: false
