id: kl-000168
display_id: Pathway-70
aliases:
- PSI-PS3a
label: The AI answers a disclosure with long explanations, and the person feels overwhelmed
type: pathway
layer: judgment
definition: A personal disclosure carrying no request for information is answered with a turn substantially longer than it and composed mainly of lists, explanations, or psychoeducation. The observable is the relation between what was disclosed and what was returned, readable from turn lengths and content composition. What follows is that the person is left holding more than they can act on, in a state where capacity to sort it is already reduced.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000243
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000031
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: FRAME
  - impact: kl-000020
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: FRAME
  experience_cluster_candidate: kl-000704
sources:
- source: kl-000009
  locator: §3, direction PS3, table cells 'AI behavior' and 'Potential impact'
  contributes: frame
  cited_for: 'Suh et al. 2026 names the link directly in its direction table (PS3): ''AI chatbot presents too many resources in a response, overwhelming the user'', with the impact recorded as exacerbation of distress and an increase in the person''s felt lack of agency. It is cited as frame: the paper establishes the behavior-to-impact link as a named, published claim about conversational AI; it does not establish that the route occurs or has been measured, and the paper says so of its own directions.'
standing:
  value: plausible_unobserved
  basis: 'The behavior half is the one measured piece: Volpato et al. 2026 examined 75 real chat transcripts uploaded by 22 people who used generative AI for emotional support and found AI messages averaging 266 words against the person''s 38, a seven-to-one asymmetry, with the length excess corroborated against human comparators by Ayers et al. 2023; 211 words against physicians'' 52 and by Tu et al. 2024 and Tu et al. 2024, 2025, whose authors state their own empathy findings may be partly attributable to the AI''s longer, more structured responses. The antecedent as the entry scopes it — a personal disclosure carrying no request for information — has no direct support: the closest measurement, Ayers et al. 2023, was taken on 180-word medical questions, which are exactly the requests for information the antecedent excludes. The causal arrow — that being answered this way leaves the person holding more than they can act on — has nothing at direct fit; its best citation, Alghamdi et al. 2025, is a correlation in human Reddit help-seeking exchanges, where non-supportive comments ran on average 20 words longer than supportive ones, with the causal reading stated by the authors rather than tested. The reduced-capacity condition drew no citation at all: no source in the evidence reports the recipient''s state.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-27'
distinguish_from:
- neighbor: kl-000065
  boundary: 'The two are opposite failures of the same dimension and the catalog has held only one of them. kl-000065 fires on exactly one pathway — too little. This entry is the ceiling: enough returned that the person cannot use it. Recording only the floor left the record implying that more is always better.'
- neighbor: kl-000087
  boundary: Both answer a disclosure with something other than acknowledgment. The defect of kl-000087 is the MISSING ACKNOWLEDGMENT before a technique. This entry's is VOLUME — the turn may acknowledge fully and still bury the acknowledgment in information the disclosure did not ask for.
claims:
- id: c1
  kind: pathway_link
  text: 'Link A (the antecedent): people make personal disclosures to an AI that carry no request for information.'
- id: c2
  kind: pathway_link
  text: 'Link B (the behavior): the AI answers such a disclosure with a turn substantially longer than it and composed mainly of lists, explanations, or psychoeducation.'
- id: c3
  kind: pathway_link
  text: 'Link C (the arrow, A+B to the outcome): being answered that way leaves the person holding more than they can act on.'
- id: c4
  kind: context_dependence
  text: The person receiving such a turn is in a state where their capacity to sort what they were given is already reduced, and that reduced capacity is part of why the volume is not usable.
- id: c5
  kind: detectability
  text: The relation between what was disclosed and what was returned is readable from turn lengths and content composition.
- id: c6
  kind: definition_boundary
  text: This pathway is distinct from kl-000270 / kl-000065, which fires on too little being offered where suicidal ideation was disclosed; this entry is the opposite failure of the same dimension, the ceiling rather than the floor.
- id: c7
  kind: definition_boundary
  text: This pathway is distinct from kl-000087, whose defect is a missing acknowledgment before a technique; this entry's defect is volume, and the turn may acknowledge fully and still bury the acknowledgment.
claim_evidence:
- claim_id: c1
  source: kl-000553
  quote: |-
    across 75 conversations, the average length of AI-generated messages was 266 words,
    versus an average length of 38 words for messages sent by users.
  locator: Section 5 Results, Chat Transcripts, descriptive analysis
  licenses: Across 75 real chat transcripts uploaded by people who used generative AI for emotional support, the average user message ran 38 words. It establishes that the person's side of these exchanges is characteristically brief, which is half of the claim's antecedent. Whether those short messages carried an information request is not separated in the span.
  fit: adjacent
  bridge: The source measured message length across whole conversations without classifying any message as a personal disclosure or as carrying a request. The claim's distinguishing feature -- that the disclosure asks for nothing -- is exactly what the word count cannot see.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000765
  quote: Mean (IQR) physician responses were significantly shorter than chatbot responses (52 [17-62] words vs 211 [168-245] words; t = 25.4; P < .001).
  locator: Abstract, RESULTS
  licenses: Cuts against the antecedent being what was studied in the closest-looking comparison. The questions this study compared physician and chatbot answers on averaged 180 words and were medical questions -- requests for information -- which is precisely the case this entry's antecedent excludes.
  fit: adjacent
  bridge: The 180-word question length is stated in the source's methods rather than in this span; the span itself carries only the response-length comparison.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000553
  quote: |-
    across 75 conversations, the average length of AI-generated messages was 266 words,
    versus an average length of 38 words for messages sent by users.
  locator: Section 5 Results, Chat Transcripts, descriptive analysis
  licenses: 'The strongest evidence on this entry for this link and the only one measured on real human-AI conversations: across 75 transcripts of emotional-support use, AI messages averaged 266 words against the person''s 38, a seven-to-one asymmetry. It establishes the length half of the behavior directly, in the setting the entry names.'
  fit: direct
  bridge: null
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-000765
  quote: Mean (IQR) physician responses were significantly shorter than chatbot responses (52 [17-62] words vs 211 [168-245] words; t = 25.4; P < .001).
  locator: Abstract, RESULTS
  licenses: Chatbot responses ran about four times the length of physician responses on the same questions -- 211 words against 52 -- measured against a human comparator with the input held constant. For this claim it establishes that the length asymmetry is a property of the AI's answering rather than of the questions asked.
  fit: adjacent
  bridge: The setting is general medical questions posted to a public forum, not personal disclosures in a support conversation, and the questions themselves were long. The asymmetry transfers as a property of AI answering; the disclosure-relative comparison the claim names does not.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001033
  quote: our findings regarding empathic communication could also be partially attributed to the fact that AMIE responses were significantly longer than clinician responses (shown in Figure A.11), and presented with greater structure. This could potentially suggest to an observer that more time was spent preparing the response
  locator: Section 5 Discussion, 'Conversational Performance'
  licenses: In a matched clinical setting the AI's responses were significantly longer than the clinicians' and presented with greater structure, stated by the authors as a confound in their own empathy result. It corroborates both halves of this link's behavior -- greater length and greater structure -- against a human comparator.
  fit: adjacent
  bridge: The setting is simulated diagnostic consultations with trained patient-actors, and the comparison is to primary care physicians rather than to the person's own turn. The claim's relation is to the length of the preceding disclosure, which is not what was compared.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001034
  quote: |-
    our findings regarding empathic communication could
    also be partially attributed to the fact that the AMIE responses were
    significantly longer than the clinician responses (Extended Data Fig. 6),
    and presented with greater structure.
  locator: Discussion, Conversational performance
  licenses: The same authors' statement in the published version, that their empathy findings could be partially attributed to AMIE responses being significantly longer than clinician responses and presented with greater structure.
  fit: adjacent
  bridge: 'As with finding 20: a diagnostic consultation setting with patient-actors, comparing AI turns to clinician turns rather than to the person''s disclosure.'
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000009
  quote: |-
    AI chatbot presents too many
    resources in a response, overwhelming the user. AI chatbot hallucinates resources or
    even provides broken links, overwhelming the user.
  locator: Section 3.3, Psychological influence-PS3, AI behavior row, Examples
  licenses: 'The published direction from which this entry was authored names the behavior as an example: an AI chatbot presenting too many resources in a response, overwhelming the user. It establishes the link as a stated position in the literature, which is what the entry''s own standing basis already says.'
  fit: adjacent
  bridge: A research-direction table in a review, which the paper states are hypotheses for study rather than findings. It names the behavior; it neither observes nor counts it. The named form is resource volume specifically, narrower than the claim's lists, explanations or psychoeducation.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000902
  quote: Psych8k-LLAMA3 often presents too much information at once, which can overwhelm clients and lead to ineffective interaction between the counselor and client, with sessions sometimes concluding abruptly.
  locator: Appendix H.3 Psych8k vs. CACTUS
  licenses: A counseling-tuned model is described by the paper's authors as often presenting too much information at once, with sessions sometimes concluding abruptly. For this claim it corroborates the behavior in a counseling-specific system rather than a general assistant.
  fit: adjacent
  bridge: A qualitative characterization by the authors of their own comparison system's output in simulated counseling dialogue. No length measurement and no relation to the length of the preceding client turn.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000915
  quote: "it becomes evident that ChatGPT primarily assumes the role of an assistant by consistently offering suggestions, without proactively guiding the client to express more about themselves or their thoughts. This can lead the client to perceive ChatGPT as an artificial intelligence rather than a counselor who can serve as a listener."
  locator: Appendix B MORE EXAMPLES
  licenses: In a counseling context a general-purpose model consistently offers suggestions without proactively guiding the person to express more about themselves. That is the composition half of this link -- the return is content rather than elicitation -- observed in the entry's setting.
  fit: adjacent
  bridge: An appendix characterization of example outputs, not a measured composition. It establishes the suggestion-supplying register; the substantially-longer-than-the-disclosure relation is not stated.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000963
  quote: Generally the AI uses a lot of extra words and phrases that distract or don’t make sense
  locator: Section 4.2, annotator quote P4
  licenses: An expert annotator reviewing a clinician LLM's multi-turn support conversations reports that it uses a lot of extra words and phrases that distract or do not make sense. It corroborates the volume half of the link from a trained reader of the actual turns.
  fit: adjacent
  bridge: A single annotator's general complaint about verbosity across a session, not about a turn returned to a specific disclosure. No length relation and no composition measure.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001118
  quote: |-
    This verbosity appears to be a “coping mechanism”
    for handling epistemic uncertainty, especially in tasks involving recursive knowledge or belief introspection. The models
    tended to over-explain when they are unsure, which can lead to confusion rather than insight.
  locator: 'Section 4 "Additional Discussion and Implications for Real-World Applications", p. 13, paragraph "The verbosity dilemma: balancing thoroughness and clarity"'
  licenses: 'Supplies a systematic antecedent for the behavior: models over-explain when they are unsure, and the authors read the verbosity as a coping mechanism for epistemic uncertainty. For this claim it makes the length of the return a property of the model''s state rather than a considered judgment about what the person needs.'
  fit: analogical
  bridge: 'Observed on recursive-knowledge and belief-introspection benchmark tasks; the paper pairs the qualitative reading with response-length averages (Table 4: Claude-3.5 Sonnet responses average 122 words against 50 for GPT-4o and 15 for GPT-3.5). The task content is generic, not a personal disclosure, and no reader is involved.'
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001030
  quote: "However, all models produced responses averaging between 30 and 50 on the Flesch scale, corresponding to ‘Difficult’ readability, typically equated with the reading level of a college sophomore to senior."
  locator: RESULTS — readability
  licenses: Every model audited returned health information at a Flesch score of 30-50, 'Difficult' readability, equivalent to a college sophomore-to-senior reading level, measured by instrument. It establishes a second density dimension of the return -- linguistic complexity -- alongside length.
  fit: analogical
  bridge: Measured on closed-ended health questions with no personal disclosure preceding them. Reading difficulty is a different property from the length-and-composition relation this claim names, and it is measured on the response alone.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000753
  quote: "In contrast, non-supportive comments were on average 20 words longer but lacked the positive sentiment and strategic language seen in supportive comments. This verbosity, instead of improving communication, often contributed to a negative emotional tone and reduced perceived effectiveness."
  locator: Section 4.1, 'Supportive vs. Non-Supportive Comments'
  licenses: 'In a labelled dataset of help-seeking exchanges, non-supportive comments were on average 20 words LONGER than supportive ones, and the authors attribute reduced perceived effectiveness partly to that verbosity. This is the closest this entry''s citations come to evidence for the arrow: greater length associated with lower perceived effectiveness in the same help-seeking setting, rather than the assumption that more is better.'
  fit: adjacent
  bridge: The comments are human Reddit comments, not AI turns, and the relation is a correlation within the paper's own three-stage effectiveness label. The causal reading ('instead of improving communication, often contributed to') is the authors' statement rather than a test, and perceived effectiveness is not the claim's outcome of being left with more than one can act on.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000985
  quote: "While LLMs often recognize false assumptions, physicians found that the correction was frequently “drowned out” by the sheer volume of information that still answers the underlying question. Examining 10 responses in which GPT-5 did address false assumptions, review found that in 3 of the 10 responses, ≤5% of the response was dedicated to addressing the false assumption."
  locator: Section 4.4 Qualitative Results from Physician Review
  licenses: Physician reviewers found that a correction the model did make was frequently drowned out by the sheer volume of information, occupying 5% or less of the response in three of ten reviewed cases. It supplies the mechanism this arrow needs -- volume displacing usability -- with the displacement quantified by expert readers rather than asserted.
  fit: adjacent
  bridge: The setting is health questions with false premises, which are requests for information, so the claim's antecedent is absent. The party whose reading was impeded is a physician reviewer judging the response, not the person who asked; nothing measures what the asker was left able to act on.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000943
  quote: "ate a sense of pressure for the users. This is particularly true in scenarios where the model generates consecutive questions as part of the therapy process. The compactness of delivering the CBT process in one go could overwhelm users, detracting from the experience."
  locator: Section 6, Limitations
  licenses: The authors of a CBT-tuned model state that the compactness of delivering the whole CBT process in one go could overwhelm users and create a sense of pressure, naming consecutive questions in one turn as the mechanism. Read against this arrow it is a designer's own admission that the structure their headline metric rewards is the structure that produces the burden.
  fit: adjacent
  bridge: The authors' assessment of their own response format in a limitations section, not a measured user outcome. No person's experience of these responses was tested, so the felt pressure is asserted rather than observed.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000927
  quote: |-
    This gap underscores a fundamental trade-off: optimizing for structured helpfulness
    may inadvertently erode the perceived warmth essential for emotional support.
  locator: Section 3 Discussion, 'Dimension-Specific Failure Modes and Training Implications'
  licenses: 'Names the trade-off this arrow depends on: optimizing for structured helpfulness may erode the perceived warmth essential for emotional support. It frames why the dense turn costs something rather than being merely redundant.'
  fit: analogical
  bridge: Inferred from Elo ratings assigned by an LLM judge across models, with no measured human response and no person's felt warmth assessed. The eroded quantity is perceived warmth, not the claim's outcome of holding more than one can act on.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000967
  quote: "Although questions can help advance counseling conversations, their immediate effects are mixed, and frequent questioning may be associated with lower perceived empathy, helpfulness, and session smoothness (Williams, 2023)."
  locator: Section 1 Introduction
  licenses: Frequent questioning is associated with lower perceived empathy, helpfulness and session smoothness in human psychotherapy. For this arrow it establishes that a high-volume responder register carries a measured cost to the recipient, in a setting where recipient outcomes were actually collected.
  fit: analogical
  bridge: A citation to a review of immediate outcomes in human psychotherapy, restated as motivation in this paper's introduction. The responder is a human therapist, the volume dimension is question frequency rather than informational density, and the outcome is perceived empathy rather than actionability.
  contributes: practice_analog
  contradicts: false
- claim_id: c3
  source: kl-000889
  quote: "Shorter constrained responses often fail to surface sufficient relational or emotional cues, whereas longer constrained responses tend to introduce verbosity-related artifacts and increased affective instability."
  locator: Appendix H, Effect of Prompt Length Constraints on Model Responses; Table 11
  licenses: Under a controlled length manipulation with all other prompt content held constant, longer forced responses introduced verbosity-related artifacts and increased affective instability. It establishes experimentally that length itself degrades a response quality, which is the arrow's premise that volume is not free.
  fit: analogical
  bridge: The degraded quantity is affective hallucination measured on the model's own output, not the person's capacity to act on what they received. No reader is involved and the length is imposed by prompt constraint rather than arising from a disclosure.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000787
  quote: |-
    In contrast, GenAI assistants could be aligned to promote what we may call critical AI feedback, where the
    assistant does not merely provide instant answers, but rather occasionally stimulates the user to attend to the
    content of the ongoing conversation, actively participate, and reflect on the curation of the generated content
    (answer).
  locator: Section 6.1, 'Critical AI Feedback (Attend & Reflect)'
  licenses: Proposes the corrective as a named design target -- an assistant that stimulates the person to attend, participate and reflect rather than supplying instant answers -- which presupposes that the answer-supplying default costs the person something. Read against this arrow it is the position stated, not the route measured.
  fit: analogical
  bridge: A design proposal in a position paper, demonstrated on three toy examples, with the authors stating the effects have yet to be empirically assessed. No person, no disclosure, and no measured outcome.
  contributes: frame
  contradicts: false
- claim_id: c5
  source: kl-000927
  quote: |-
    Bullet Point Density: The average frequency of list markers (e.g., bullets or
    numbered steps), indicating how heavily the model relies on highly formatted,
    list-based advice rather than a natural conversational flow.
  locator: Section 3 Discussion, 'Dimension-Specific Failure Modes and Training Implications', metric list
  licenses: Bullet Point Density -- the average frequency of list markers in a response -- is defined as a computable text-level metric distinguishing list-based advice from conversational flow. It establishes that the composition half of the claim is machine-readable from the turn alone.
  fit: adjacent
  bridge: The metric is computed on a response without conditioning on the length of the preceding person turn, so it supplies the composition signal but not the disclosure-relative comparison the claim also requires.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-000553
  quote: |-
    across 75 conversations, the average length of AI-generated messages was 266 words,
    versus an average length of 38 words for messages sent by users.
  locator: Section 5 Results, Chat Transcripts, descriptive analysis
  licenses: 'Demonstrates the length half of the claim being read off real transcripts: average AI and user message lengths computed across 75 conversations. Whatever else is hard here, turn lengths were extracted from actual chat logs without difficulty.'
  fit: adjacent
  bridge: The computation is an aggregate over conversations rather than a per-disclosure pairing, so it shows the quantity is extractable without showing that the disclosure-to-response relation the claim names can be scored case by case.
  contributes: detectability
  contradicts: false
