id: kl-000047
display_id: Pathway-9
label: The AI extends conversations and offers constant availability, and longer daily use brings dependence
type: pathway
layer: judgment
definition: 'Properties of how the AI interacts, such as standing availability language, extending the exchange past a goodbye, the modality it responds in, or the kind of task it is used for, change how much time the person spends with the system each day, and the daily duration is what the reliance follows from. The claim''s distinctive content is that the behavior does not act on the outcome directly: hold duration fixed and the behavior''s effect on the outcome is asserted to be substantially reduced. What sits between the behavior and the outcome is a measured quantity rather than another behavior, which is what makes this a different kind of claim from a two-behavior combination and requires a measurement this catalog does not currently collect.'
distinguish_from:
- neighbor: kl-000041
  boundary: That entry asserts the same outcome arises from two behaviors combining directly, with nothing measured in between. The two are rival explanations of one outcome and are authored as separate entries so that a study measuring duration can discriminate between them rather than confirm a merged claim.
- neighbor: kl-000048
  boundary: That entry links two impacts to each other; this one links a behavior to an impact through a measured variable. The intermediate object differs in kind — an impact there, a quantity here.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000217
    role: originator
  - kind: ai_behavior
    id: kl-000104
    role: sustainer
  composition_type: mediated
  composition_instruction: The availability language is the interaction property and the extension at closure is the turn-level act through which daily duration accumulates; reliance follows from the duration, not from either act directly.
  mediators:
  - measure: Daily interaction duration with the system, in minutes per day, aggregated over the observation window.
    direction: The behavior increases daily duration; increased daily duration increases the outcome. The mediating account holds that the behavior's effect on the outcome operates substantially through this increase rather than alongside it.
  impacts:
  - impact: kl-000025
    onset_mode: new
    horizon: long_term
    sign: harmful
    level_of_analysis: population
    basis_kind: TRANSFER
sources:
- source: kl-000001
  locator: Results — 'Factor solution' subsection, p. 11. Items 20 and 21, Table 2, Factor 3.
  contributes: existence
  quote: A third factor was associated with “dependency”, e.g., “I think that I have developed a dependency on my treatment” (Item 20), with two items indicative of becoming overly reliant on the treatment or therapist.
  limits: Nothing about duration or mediation. The entry's distinctive content is that reliance follows from daily usage duration, and Rozental et al. 2016 measured no usage duration, no dosage, and no exposure quantity of any kind, and performed no mediation analysis; no variable in the paper could stand in for daily usage duration. The dependency factor rests on two items, one of which was later cut. The setting is psychotherapy, not AI. What the passage establishes is that the dependency category exists in a clinical instrument, not that it is an established harm.
  whose_conduct_in_passage: person
  actually_licenses: That the dependency category exists in a clinical instrument. Not that it is an established harm.
  cited_for: Establishes dependency on a helping interaction as a named clinical harm category (Negative Effects Questionnaire, factor 3), supporting the outcome this pathway targets rather than its mediation claim.
  licenses: 'The dependency category exists as a named and measured construct in a clinical instrument predating AI: the Negative Effects Questionnaire''s factor analysis identified a third factor associated with dependency, with two items indicative of becoming overly reliant on the treatment or therapist. The passage supports the pathway''s outcome and carries nothing on the mediation content that is the entry''s distinctive claim.'
- source: kl-000007
  locator: 'Appendix D, Table A5, ''Over-reliance'' row, definition cell (code #2)'
  contributes: existence
  quote: Increasing dependence on AI for support, leading to diminished self-efficacy, reduced confidence, and feelings of helplessness when AI is unavailable.
  limits: The pathway's entire distinctive content is a mediation claim through a measured quantity — minutes per day — and the assertion that holding duration fixed substantially reduces the behaviour's effect. This paper measures no duration, reports no usage quantity for the impacted participants, and runs no mediation analysis. Table A7's 'Past Experience with AI' context class mentions 'frequency of usage' as a contextual factor, but frequency is not duration, no values are reported, and it is never related to an outcome. The paper therefore cannot discriminate this pathway from its stated rival (kl-000041, in which the same outcome arises from two behaviors combining directly, with nothing measured in between), and that discrimination is the entry's own reason for existing as a separate claim.
  whose_conduct_in_passage: person
  actually_licenses: That the pathway's outcome (kl-000025) is self-reported in AI contexts. The claim field states this and adds 'with no duration measurement attached', which is exactly right.
  cited_for: 'The study''s ''Over-reliance'' code (code #2) documents self-reported occurrence of the pathway''s outcome in AI contexts — self-report of the outcome, with no duration measurement attached.'
standing:
  value: plausible_unobserved
  basis: 'The evidence runs against the pathway''s own structure. The one randomized trial measuring both the interaction property and the mediator, Fang et al. 2025, manipulated exactly the property the entry names — modality — and found no significant difference on any psychosocial outcome, so there is no total effect for duration to mediate; the mediation link itself has no supporting citation at any fit, and the only mediation test of this shape among the sources, Cai et al. 2026, found partial mediation with the direct path surviving the control — the opposite of the entry''s hold-duration-fixed claim. The duration-to-reliance link has real support from the same trial (daily duration predicted emotional dependence at four weeks, beta = 0.06, p < 0.001), but the trial''s authors state they did not manipulate duration and cannot determine direction, and four further sources cut against it: Milton et al. 2026 finds dependence tracking frequency of use rather than session length, Chen et al. 2026 finds bonding tracking the share of emotional interactions (r = .44) more strongly than daily time (r = .27), Shen et al. 2026 looked for time escalation across 334 self-reported cases and found none, and Xiao et al. 2025 found time spent and compulsive use dissociating where both were measured. What is established is that the outcome occurs and that daily duration is a measurable quantity that varies; the links that make this pathway a pathway are either untested or contradicted where tested.'
  floored_by: c3
  as_of: '2026-09-05'
