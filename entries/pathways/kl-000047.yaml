  fit: analogical
  bridge: A writing task, with prompt-sending behavior rather than usage duration as the outcome, and the sentence is the authors' interpretation of a null rather than a measurement. It supplies the conceptual frame for a property changing usage and establishes nothing about duration.
  contributes: frame
  contradicts: false
