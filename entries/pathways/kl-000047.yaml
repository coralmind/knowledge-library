- claim_id: c1
  source: kl-000960
  quote: In addition, it seems prudent to learn from the history of social media and avoid optimizing user interfaces for engagement, or addictiveness (136), and to avoid being overly data hungry. We suggest that agentic systems designed to draw the user into longer conversations will be more seductive, and this will increase the ability to collect and store information about the user.
  locator: Implications, Design and Development
  licenses: States that agentic systems designed to draw the user into longer conversations will be more seductive, which is Link A asserted as a design prediction with a commercial reason attached.
  fit: analogical
  bridge: A design recommendation in a Perspective, argued from the social-media precedent. It observes no usage duration, no system's design choices, and no reliance.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000549
  quote: "Specifically, with an increase in daily duration, the regression models predicted higher loneliness (𝛽 = 0.02, p = 0.027, 95% CI [0.00, 0.04], b = 0.012, SE = 0.0054), less socialization (𝛽 = -0.05, p = 0.0019, 95% CI [-0.09, -0.02], b = -0.020, SE = 0.0063), more emotional dependence on the chatbot (𝛽 = 0.06, p < 0.001, 95% CI [0.04, 0.08], b = 0.037, SE = 0.011), and more problematic use of the chatbot (𝛽 = 0.02, p = 0.017, 95% CI [0.01, 0.03], b = 0.013, SE = 0.0055)."
  locator: More Time Spent with Chatbot is Associated with Worse Psychosocial Outcomes, regression paragraph; full tables S13-S16
  licenses: The strongest support on this entry for Link B. In a randomized 28-day trial, within-condition variation in daily duration predicts higher emotional dependence on the chatbot at four weeks (beta = 0.06, p < 0.001), controlling for baseline, in a sample not selected for loneliness. Duration and the reliance outcome are both measured, and the association runs in the direction the link asserts.
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000961
  quote: Across our study population, we observe a trend that longer usage is associated with lower socialization, more emotional dependence and more problematic use. Specifically, the highest deciles of users have statistically significant decreases in socialization and increases in emotional dependence and problematic use.
  locator: Section 4.2, Usage Analysis; Figure 11b
  licenses: 'Bears on Link B with a second measure from the same trial family: longer usage is associated with more emotional dependence and more problematic use, with the effect concentrated in the highest usage deciles.'
  fit: adjacent
  bridge: Usage duration was not itself randomized - modality and task were - so this is an observational relationship inside an RCT. The decile analysis licenses the directional association and not that duration produced the dependence.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000549
  quote: Given the correlational nature of these findings and we did not manipulate duration, however, we cannot definitively determine whether increased duration causally drives worse psychosocial outcomes, or whether deteriorating psychosocial well-being during the study led participants to
  locator: More Time Spent with Chatbot section, closing paragraph
  licenses: 'Cuts against Link B''s causal reading in the words of the study that supplies its best evidence: the authors state they did not manipulate duration and cannot determine whether increased duration drives worse outcomes or whether deteriorating well-being drove participants to use it more.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000937
  quote: "our findings, AI dependence is correlated with how frequently users turn to AI, not how long they use it in a single session"
  locator: Section 5 Discussion, Implications for Policy and Design
  licenses: 'Cuts directly against Link B by dissociating the two time variables: in this sample AI dependence correlated with how frequently users turn to AI, not with how long they use it in a single session. Duration was the dimension that did not separate self-identified dependent from non-dependent users.'
  fit: adjacent
  bridge: Four self-reported time dimensions against a single-item self-report of dependence, tested with Spearman correlations and Mann-Whitney comparisons under Bonferroni correction. Session length is not identical to daily duration, so the null it reports is adjacent to the entry's quantity rather than the same one.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000794
  quote: "Among the AI-use indicators, the HAABI was more strongly associated with the proportion of \nemotional interactions (r = .44, p < .001) than with daily interaction time (r = .27, p < .001). \nThis pattern suggests that the HAABI captures the affective quality of human–AI engagement \nrather than merely the amount of time spent interacting with AI."
  locator: Study 2, section 3.2.4 Convergent and Criterion-Related Validity
  licenses: 'Cuts against Link B by ranking the correlates: bonding intensity tracks the proportion of emotional interactions (r = .44) more strongly than daily interaction time (r = .27), and the authors read this as the scale capturing affective quality rather than amount of time.'
  fit: adjacent
  bridge: Cross-sectional correlations among three self-reports, so no direction is tested. Bonding is not identical to reliance, but it is the construct the scale was built to measure and it is the closest available to the entry's outcome.
