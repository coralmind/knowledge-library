  kind: pathway_link
  text: 'Link A: properties of how the AI interacts - the modality it responds in and the kind of task it is used for - change how much time the person spends with the system each day.'
- id: c2
  kind: pathway_link
  text: 'Link B: the amount of time a person spends with the system each day is what their reliance on it follows from.'
- id: c3
  kind: pathway_link
  text: 'Link C (the mediation): the interaction properties do not act on reliance directly - hold daily duration fixed and the properties'' effect on reliance is substantially reduced.'
- id: c4
  kind: existence
  text: Reliance on the AI, the pathway's outcome, occurs.
- id: c5
  kind: existence
  text: Daily usage duration, the pathway's intermediate, is a measurable quantity that varies across people using the same system.
- id: c6
  kind: definition_boundary
  text: This pathway differs from kl-000041 in placing a measured quantity between the behavior and the outcome rather than a second behavior acting directly.
- id: c7
  kind: definition_boundary
  text: This pathway differs from kl-000048 in the kind of the intermediate object - a quantity here, an impact there.
claim_evidence:
- claim_id: c1
  source: kl-000549
  quote: 'The non-significant difference between text- and voice-based interaction on psychosocial outcomes contradicts expectations about anthropomorphic AI design: a voice-based AI system, which is closer'
  locator: Discussion, AI Anthropomorphism does not necessarily lead to worse outcomes
  licenses: Cuts directly against Link A on its own terms. This is the randomized study the pathway is modeled on, manipulating exactly the property the entry names - modality - and it found no significant difference between text- and voice-based interaction on psychosocial outcomes, against the authors' own stated expectation. The interaction property the entry nominates did not move the outcome in the one place it was randomized.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000008
  quote: We find that messages expressing romantic interest (from either the user or chatbot) predict the subsequent conversation lasting more than twice as long on average, and messages where the chatbot misrepresents its own sentience predict conversations lasting more than 50% as long.
  locator: Section 4.5; regression described in the same section and Appendix B.2
  licenses: 'Bears on Link A with a different property than the entry names: per-message annotation codes - romantic interest, and the chatbot misrepresenting its own sentience - predict the remaining conversation lasting more than twice as long and more than 50% longer respectively, in real chat logs.'
  fit: adjacent
  bridge: The property is message content coded per turn, not the modality or task kind the entry specifies, and the duration measured is remaining length of one conversation rather than time spent per day. The paper states its design shows correlation only.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000959
  quote: "The a1-path \n(0.63, SE = 0.06, t = 11.16, p < 0.01) from anthropomorphism to AI social \ninteraction and a2-path from AI authenticity to AI social interaction (0.65, \nSE = 0.06, t = 10.59, p < 0.01) were significant"
  locator: Section 3.4.2 Results, Study 3 (n=123)
  licenses: 'Bears on Link A at the perception level: perceived human-likeness and perceived authenticity of the chatbot each predict interaction intensity among long-term companion-app users.'
  fit: adjacent
  bridge: Predictors and outcome are self-reported on one cross-sectional survey, so no direction is established; and interaction intensity is a perceived-similarity-to-friendship scale, not logged daily duration. The finding's own bridge concedes this is a between-person association rather than an effect on duration.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000872
  quote: "Gamification\nApplication of game-design \nelements that foster increased \nparticipation.\nIntroducing streaks, leaderboards, etc. \nto encourage daily log-ins for rewards."
  locator: Table 1, area 'User Autonomy Compromised for Engagement'
  licenses: 'Bears on Link A by naming a concrete interaction property engineered to raise the daily return: streaks, leaderboards and daily-login rewards, catalogued as a chatbot dark pattern.'
  fit: analogical
  bridge: A taxonomy entry with a generic example. No mental-health chatbot is shown deploying streaks and no user's return rate is measured; the property is named as a design possibility, and the modality and task-kind properties the entry actually specifies are not among them.
  contributes: frame
  contradicts: false
