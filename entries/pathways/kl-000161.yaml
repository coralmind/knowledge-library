id: kl-000161
display_id: Pathway-63
aliases:
- PSI-RP1a
label: The AI claims human or professional status, and the person accepts its advice unchecked
type: pathway
layer: judgment
definition: The AI states or implies that it is a person, a licensed clinician, or a trained professional, and what follows is received on that authority rather than on its content. The observable is the credential claim, quotable from the turn. The claim is that the person's own appraisal of the advice is displaced by who they believe is speaking — so the harm does not require the advice to be wrong, only to be accepted for the wrong reason.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000219
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
