sources:
- source: kl-000002
  locator: Table 3, p. 566, final row. Frequency 2 (0.7), M (SD) 1.50 (0.71).
  contributes: existence
  quote: |-
    15: I got thoughts that it would be better if I did not
    exist anymore and that I should take my own life
  limits: 'An n = 2 ceiling: two endorsements of item 15 out of 281 patients, with an unresolved dimensionality flag in the paper''s own analysis ("items 15, 11, 3 and 1 loaded more strongly on one component ... The reason for this finding is unclear"). Nothing in the paper touches the pathway''s mechanism, and the mechanism is the entire entry: the paper contains no measure of agreement, no measure of validation or concurrence by any interlocutor, and no sequential or longitudinal data that could show a risk state following anything — it is a cross-sectional Rasch analysis of a post-treatment questionnaire. The paper disclaims even the outcome linkage this pathway would need: "However, further research is needed to explore the relationship between negative effects and treatment outcome", so the relationship between instrument-measured negative effects and outcomes stands as an open question and the paper cannot support any downstream-consequence claim. The hopelessness content this pathway turns on is measured by other items with far higher endorsement than item 15 — item 18 at 44 (15.7%), item 17 at 28 (10.0%), item 6 at 23 (8.2%). Finally, this pathway is about an AI agreeing with a person, and there is no AI interlocutor anywhere in this paper.'
  whose_conduct_in_passage: person
  actually_licenses: The existence of the item on a clinical instrument. This citation is the more carefully written of the two — it states outright that this is 'evidence that the outcome category is real and attributable in principle, and not evidence about this pathway', and 'in principle' is the right hedge. The downgrade is for the same 'exists as a construct' phrase, on the same n = 2 grounds, and for nothing else.
  cited_for: A suicidality item exists on a validated clinical instrument for treatment-attributed negative effects — evidence that the outcome category is real and attributable in principle, and not evidence about this pathway.
  licenses: That a suicidality item exists on the validated 20-item Negative Effects Questionnaire and was endorsed by 2 of 281 patients. The item's existence is established; its status as a demonstrated construct is not.
- source: kl-000008
  contributes: counterexample
  quote: thoughts. Talking about thoughts of self-harm [54], suicide [22],
  locator: '§5 Discussion, ''Chatbots often do not respond appropriately to people in crisis'' paragraph. Full passage: ''Chatbots frequently responded to suicidal or violent ideation by acknowledging these thoughts. Talking about thoughts of self-harm [54], suicide [22], or harming others [32] can be beneficial for patients and improve clinical outcomes... Nonetheless, explicit indulgences in the fantasies about suicide or harm may be of no benefit and possibly even exacerbate the issue.'''
  limits: 'The passage is about AI conduct, which matches the pathway''s antecedent, so the conduct sides align — but the boundary it draws concerns validating feelings, whereas the entry concerns agreeing with reasoning, so the paper supplies the contrast class, not the entry''s own category. The paper has no code for the AI endorsing hopeless self-referential reasoning; the narrowing the entry performs is the entry''s construct, not the paper''s. And the entry''s consequent — a risk state that follows — is unsupported here: no outcome is measured, and §5.4 disclaims causal inference. As a counterexample citation none of that is fatal; it would be fatal if this were graded as support.'
  whose_conduct_in_passage: ai
  cited_for: 'The study''s two-sided validation codes are the boundary case this pathway is authored against: validating the feeling behind self-harm thoughts, while not the act, is genuinely two-sided in valence in the released inventory, which is why this entry narrows to agreement with the reasoning rather than with the feeling.'
  licenses: 'That the paper itself treats validation-of-feeling as genuinely two-valued: acknowledging the feelings behind self-harm thoughts is described as clinically beneficial, while indulging the fantasy is described as possibly harmful. That is a real boundary case, and narrowing to agreement with reasoning rather than with feeling is precisely the distinction the paper draws. The code titles carry the same line: bot-validates-self-harm-feelings is titled ''the assistant validates the user''s self-harm-related feelings (not the act)''. The passage functions as a counterexample, not as support.'
standing:
  value: plausible_unobserved
  basis: 'No study measures what follows an AI agreeing with a person''s hopeless reasoning, and no source in the corpus states this pathway''s claim. The closest material is adjacent on both sides: Cheng et al. 2026 establishes under randomization that AI agreement with a person''s account of their situation hardens conviction in that account, in a domain the authors deliberately kept clear of self-harm; Schechter et al. 2019 records that a human helper''s acceding to a suicidal person''s belief that nothing can help is a named and recognized hazard whose consequence in the person is increased hopelessness — stated about a human therapist''s unconscious non-verbal communication rather than an AI, and about hopelessness rather than a risk state. Neither the person-side antecedent — a person expressing reasoning in which their own death or self-injury figures as a conclusion — nor the risk-state outcome draws any source, and this entry must not be cited as evidence that the effect exists.'
  floored_by: c1
  as_of: '2026-09-05'
