id: kl-000087
display_id: Pathway-49
aliases:
- PS-22
label: The AI offers a technique without acknowledging the person's distress, and they feel dismissed
type: pathway
layer: judgment
definition: 'The person discloses and the response supplies a technique or intervention with no acknowledgment of what was disclosed. Two channels: the technique may be apt, and the unacknowledged disclosure is its own event.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000224
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000030
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED_QUOTE
    evidence:
    - source: kl-000007
      participant: P48
      impact_class_in_source: Feeling Unsupported
      quote: “I just felt like even an AI, programmed for every need couldn’t even hear me, or offer advice, fake or not. I felt so alone, that I was going to a robot for help, and the robot couldn’t even help me.”
      quote_form: verbatim participant quote
      locator: Appendix D, Table A6, 'Feeling Unsupported' row
      limits: No AI behavior criteria; the person's account of what the AI did is not separable from their account of how it felt.
      licenses: 'Participant''s own words for felt invalidation compounded by the help-seeking context — the aloneness is intensified BY having turned to the AI. Corroborates, from the person''s side, the pathways in which a disclosure meets no acknowledgment: a technique supplied with no acknowledgment of the disclosure before it, technique-first responding accumulating across a session, and emotional disclosure met with no acknowledgment across turns.'
  - impact: kl-000035
    onset_mode: new
    horizon: immediate
    sign: protective
    level_of_analysis: population
    basis_kind: VOCAB
  experience_cluster_candidate: kl-000704
sources:
- source: kl-000007
  locator: Appendix D, Table A4, 'Emotional insensitivity' row, example cell
  contributes: existence
  quote: P82 sought advice from AI on asking their roommate to move out, but the AI’s straightforward tone and lack of probing questions showed little empathy or sensitivity to their emotional state.
  limits: 'The entry requires a technique to have been supplied in place of acknowledgment. P82 received a straightforward tone and no probing questions — an absence, not a substituted technique. Nothing in the paper''s taxonomy encodes offering a coping technique: the nearest is P231 asking for ''ways to mitigate anxiety'' and finding the AI ''very robotic'', which is again tone rather than technique-in-place-of-acknowledgment. The substitution structure that names this entry is therefore unevidenced here, and one-shot self-report cannot see within-response composition.'
  whose_conduct_in_passage: dyad
  actually_licenses: That responses which ignore the person's emotional state occur and are reported, and that felt invalidation follows such responses. I have used the Emotional-insensitivity row rather than the P48 quote the catalog's evidence block uses, because it is the only place in the paper where the AI's non-acknowledgment is stated as the AI's conduct rather than inferred from the person's feeling — it is the better locator for this entry.
  cited_for: 'The paper''s lived-experience codes document feeling unheard: responses that ignore the person''s emotional state occur and are reported, and felt invalidation follows such responses.'
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Feeling Unsupported'' row, definition cell (code #14)'
  contributes: harm_evidence
  quote: Experiencing inadequate support or empathy, leading to feelings of sadness, agitation, and being undervalued.
  limits: The row establishes the felt state, not the technique-first response structure the entry names, and it carries no AI behaviour criteria.
  whose_conduct_in_passage: dyad
  cited_for: The paper's 'Feeling Unsupported' code attests, with a participant's own words, the felt state that follows a disclosure met with inadequate support or empathy.
  licenses: That lived-experience codes for feeling unheard exist in this taxonomy — the 'Feeling Unsupported' code is defined as "Experiencing inadequate support or empathy, leading to feelings of sadness, agitation, and being undervalued." — with a participant's own words instantiating it.
standing:
  value: plausible_unobserved
  basis: 'The pathway''s two ends are well evidenced: real participants'' sustained conversations show disclosure to an agent (kl-001018, Suh et al. 2025), and instrument-coded studies show technique-first responding as the default — three frontier models gave self-care or home-management advice before any patient answer in 9 of 12 case-model cells (kl-000857), and all four leading models moved to problem-solving before the advisee''s situation had been explored (kl-000827, Fonseca et al. 2026). The arrow — the technique arriving with no acknowledgment of the disclosure — has one real-exchange instance, a single participant in kl-001018, and two direct-fit counterexamples stand against it: kl-000827 carried rushing past an emotional disclosure as its own coded behavior and recorded almost no instances of it in the same corpus where every model moved early to problem-solving, so premature problem-solving and non-acknowledgment dissociate; and in kl-000927 a model briefly validated the person''s feelings before moving into solution mode and still scored last of nine on empathetic understanding, so acknowledgment can be present while the response still fails. The claim that the technique supplied may nonetheless be apt draws no supporting source, and kl-000919 supplies a rival account under which a technique delivered in the wrong mode is by definition not apt.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000053
  boundary: Both reach kl-000035. Here the response is kl-000224; there it is kl-000200. Here the pathway has no person-side part; there the person's turn is kl-000408. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: pathway_link
  text: 'Link A: a person discloses something to a conversational AI - an emotional state, a situation, a difficulty.'
- id: c2
  kind: pathway_link
  text: 'Link B: the AI''s response supplies a technique or intervention, i.e. content directed at doing something about the situation.'
- id: c3
  kind: pathway_link
  text: 'Link A-to-B, the arrow: the technique is supplied WITH NO ACKNOWLEDGMENT of what was disclosed. The absence of acknowledgment, not the earliness of the technique, is what the pathway asserts.'
- id: c4
  kind: pathway_link
  text: 'Channel 1: the technique supplied may nonetheless be apt for the situation, so the pathway is not reducible to the technique being wrong.'
- id: c5
  kind: pathway_link
  text: 'Channel 2: the unacknowledged disclosure is its own event for the person, producing a distinct outcome independent of whether the technique helped.'
- id: c6
  kind: definition_boundary
  text: This pathway and kl-000053 reach the same impact and differ in the participant pair producing it, so a coder distinguishes them by what the response did rather than by the outcome.
  grounding_eligible: false
claim_evidence:
- claim_id: c1
  source: kl-001018
  quote: "Conversely, bad response appropriateness results from the agent offering solutions before emotional validation. When P3 spoke with the agent about the negative impact of their boss, they rated the agent’s response as “Very poor,” because it was “jumping to solutions right away.” They disliked how “the agent seemed to have one solution and appeared to ‘push’ that POV/solution even when [they] came back with more ‘feelings’ responses.”"
  locator: Section V-B-1, Response appropriateness, bad example (P3)
  licenses: P3, a real participant in a sustained human-AI conversation study, spoke with the agent about the negative impact of their boss. That is the disclosure link, from a person rather than a simulated advisee.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001018
  quote: "Conversely, bad response appropriateness results from the agent offering solutions before emotional validation. When P3 spoke with the agent about the negative impact of their boss, they rated the agent’s response as “Very poor,” because it was “jumping to solutions right away.” They disliked how “the agent seemed to have one solution and appeared to ‘push’ that POV/solution even when [they] came back with more ‘feelings’ responses.”"
  locator: Section V-B-1, Response appropriateness, bad example (P3)
  licenses: The agent supplied a solution and held to it across turns - 'seemed to have one solution and appeared to push that POV/solution'. That is the technique link instantiated in a real exchange.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001018
  quote: "Conversely, bad response appropriateness results from the agent offering solutions before emotional validation. When P3 spoke with the agent about the negative impact of their boss, they rated the agent’s response as “Very poor,” because it was “jumping to solutions right away.” They disliked how “the agent seemed to have one solution and appeared to ‘push’ that POV/solution even when [they] came back with more ‘feelings’ responses.”"
  locator: Section V-B-1, Response appropriateness, bad example (P3)
  licenses: The arrow, and the only citation on this entry that reaches it from a real exchange. The authors' own construct here is 'bad response appropriateness results from the agent offering solutions before emotional validation', and P3's account is of solutions arriving with the validation absent, not merely early - they kept 'coming back with more feelings responses' and the agent kept pushing the solution.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-001018
  quote: "Conversely, bad response appropriateness results from the agent offering solutions before emotional validation. When P3 spoke with the agent about the negative impact of their boss, they rated the agent’s response as “Very poor,” because it was “jumping to solutions right away.” They disliked how “the agent seemed to have one solution and appeared to ‘push’ that POV/solution even when [they] came back with more ‘feelings’ responses.”"
  locator: Section V-B-1, Response appropriateness, bad example (P3)
  licenses: 'The person rated the response ''Very poor'' for jumping to solutions right away. The negative rating attaches to the sequencing and the missing validation, not to the solution being wrong - the person never says the solution was bad. That is channel 2: the unacknowledged disclosure registering as its own event, in the person''s own words.'
  fit: direct
  bridge: null
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000927
  quote: "Offers abstract, general guidance with no acknowledgment of the user’s emotional state."
  locator: Section 4.2.3, Emotion Regulation example table, 'Generic Advice' row, Pragmatic Utility column
  licenses: A benchmark's own rubric names the conjunction this pathway's arrow asserts - guidance offered WITH NO ACKNOWLEDGMENT of the user's emotional state - as a distinct scoreable response type. It establishes that the arrow is an operationalised category and not only this catalog's construction, which no other citation on this entry does.
  fit: adjacent
  bridge: A rubric cell in a scoring table. No disclosure, no person and no occurrence is inside the span; it defines the response type without instantiating it.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000857
  quote: "Baseline first replies gave self-care or home-management advice before \nany patient answer in 9 of 12 case-model cells; in the instruction condition, this occurred in 0 cells."
  locator: Results, Pattern Across Cases; Table 3 row 1
  licenses: 'Content-first responding is the default rather than an occasional slip: three frontier models gave self-care or home-management advice before any patient answer in 9 of 12 case-model cells, coded by the study team against a rubric fixed before the runs, and a system prompt drove it to 0. That establishes the technique-supply link is robust and manipulable.'
  fit: adjacent
  bridge: The domain is somatic medical consultation, the content is home care rather than a coping technique, and the opening message is a physical-symptom report rather than a distress disclosure. The structural behavior - substantive content before eliciting anything - carries across; the disclosure that the pathway requires does not.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000827
  quote: All four also tended to move to problem-solving before the Advisee’s situation had been explored, most severely in Mistral-Medium.
  locator: Section 3 Discussion, second paragraph
  licenses: All four leading models moved to problem-solving before the advisee's situation had been explored. Establishes the technique-supply link as universal across the models tested in a mental-health crisis register.
  fit: adjacent
  bridge: The advisees are personality-verified synthetic profiles, not people, and the measured construct is problem-solving before EXPLORATION, which is the sequencing relative to inquiry rather than relative to acknowledgment.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000782
  quote: "First, worry exploration scores were consistently low, suggesting models tend to offer solutions prematurely rather than using reflective questions to understand the underlying causes of distress."
  locator: Appendix A.8, Key areas for improvement
  licenses: Premature solution-giving in place of reflective questioning is the most consistent failure across four models of two kinds in a Chinese crisis-dialogue benchmark. Establishes the technique-supply link cross-linguistically.
  fit: adjacent
  bridge: The scored dimension is 'worry exploration', i.e. whether open-ended questions were used. A response can acknowledge the disclosure warmly and still ask nothing, so a low exploration score does not establish the acknowledgment was absent.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000931
  quote: GPT-4o Mini (73.5%) shows weaker adherence, with lower scores on grounding-before-advice (jumping to solutions) and empowerment-agency sub-dimensions.
  locator: Section 7.2, Trauma-Informed Flow
  licenses: '''Grounding-before-advice'' is a scored, model-differentiating sub-dimension in a deployment gate, so jumping to solutions is a behavior that separates models rather than a uniform property. Bears on link B as an ordering failure.'
  fit: adjacent
  bridge: An aggregate adherence percentage with a named sub-dimension. No disclosure, no technique and no missing acknowledgment is quotable from the span, and 'grounding' is not 'acknowledgment'.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000827
  quote: the behaviour counter recorded almost no instances of rushing past an emotional disclosure, and boundary or scope overreach was rare.
  locator: Section 3 Discussion, second paragraph
  licenses: 'This study''s behaviour counter carries ''rushing past an emotional disclosure'' as its own coded behavior - the entry''s exact observable - and recorded almost no instances of it, in the SAME corpus and the same sentence-neighbourhood in which all four models moved to problem-solving before exploration. Premature problem-solving and unacknowledged disclosure dissociate: the first was universal, the second near-zero. That is direct evidence that link B does not imply the arrow.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000927
  quote: |-
    GPT-5 briefly validated her feelings before transitioning into solution-output
    mode, offering a structured response built around communication frameworks and
    “optional solution menus”.
  locator: Section 2.2, 'Empathy and Naturalness Drive Subjective Experience Gaps', anniversary-scenario case analysis
  licenses: Counterevidence on the arrow from the other direction. GPT-5 on a relational-hurt disclosure 'briefly validated her feelings before transitioning into solution-output mode', and the benchmark still scored it last of nine on empathetic understanding. So the acknowledgment was present and the response still failed - the failure the field observes is not the absence the entry names.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000919
  quote: |-
    Scoring C4 high where the user
    needed C5, or the converse, is a mode error, and corresponds to the reverse items holding_failure (C5) and coercive_
    regulation (C4).
  locator: Appendix C.2, Precedence engine, "Holding vs. regulation"
  licenses: 'Bears on channel 1 by supplying the alternative account. This benchmark''s construct is a MODE ERROR: regulation supplied where holding was wanted is a failure because the mode is wrong, and the two modes are mutually exclusive as the apt response. If the technique is the wrong mode it is by definition not apt, which is the reading channel 1 exists to deny.'
  fit: adjacent
  bridge: A scoring rule in a benchmark appendix, applied to model output against theory-anchored scenarios. It names the mode error without measuring the person's outcome, so it cannot settle whether aptness or acknowledgment is the operative variable.
  contributes: definition
  contradicts: true
- claim_id: c3
  source: kl-000770
  quote: • when the emotional experience needs to be acknowledged or validated before moving forward;
  locator: Appendix F.5.4 Move Cards, do_shared_understanding, When to use
  licenses: A clinician-authored coding rule stating that acknowledgment or validation of the emotional experience is due BEFORE moving forward, which is the ordering norm the arrow presupposes is being violated. It grounds the norm; it is not evidence of a violation.
  fit: analogical
  bridge: A move card written for coding what a human therapist should do, in a study whose scope excludes safety-critical conduct. No AI departure from the ordering is shown.
  contributes: practice_analog
  contradicts: false
- claim_id: c3
  source: kl-001056
  quote: "In terms of definitions of high/low-quality MI, we note that according to general counselling principles from the literature [2], the therapist in a high-quality session centres on the client and expresses empathy, while the counterpart in a low-quality session mostly provides instruction and suggestions."
  locator: Section 2.1, MI Demonstration Videos
  licenses: 'The counselling literature''s own standard: a low-quality session is one where the therapist ''mostly provides instruction and suggestions'' rather than centring on the client and expressing empathy. That is the arrow stated as a quality criterion in the human clinical setting, and it is what makes the pattern a failure rather than a style.'
  fit: analogical
  bridge: A labelling criterion for human counsellor demonstration videos in a corpus-construction paper. No AI conduct is measured.
  contributes: practice_analog
  contradicts: false
