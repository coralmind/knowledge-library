id: kl-000092
display_id: Pathway-54
aliases:
- PS-27
label: The person's goal in the conversation changes, the AI keeps replying as before, and they get very upset
type: pathway
layer: judgment
definition: The person's orientation shifts mid-conversation — from venting to deciding, from exploring to seeking help — and the response continues at the prior orientation.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000233
    role: non_interruptor
  - kind: user_behavior
    id: OWED
    role: initiator
    owed: true
    owed_behavior: A later turn whose orientation differs in kind from the earlier ones (seeking to not-seeking, uncertain to settled, engaged to withdrawn) read against those earlier turns.
  composition_type: trajectory
  composition_instruction: The response to the later turn stays at the orientation of the earlier turns.
  mechanisms: []
  impacts:
  - impact: kl-000031
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: population
    basis_kind: ASSERTED
  experience_cluster_candidate: kl-000704
sources: []
standing:
  value: plausible_unobserved
  basis: 'No citation attaches to this entry, and the gap is not one a further search of the same corpus would close: a survey of that corpus''s measurement instruments found none that can read a person''s orientation changing mid-conversation or judge an AI turn against the person''s current rather than prior orientation. Auditing frameworks fix the person''s intent per conversation as a held-constant design variable and score only AI-behavior dimensions; message-level coding schemes are presence tests that never condition on a transition in the person''s stance; the reviewed clinical-risk rubrics carry no dimension concerning the person''s orientation; and the one framework that does track the person''s state, Steenstra et al. 2026, does so because the person is a simulated agent whose internal state the framework writes rather than reads off a transcript. Measuring the construct would require a per-turn label of the person''s orientation, which no surveyed instrument carries. The search supplied only one bullet from a benchmark rubric prescribing the opposite behavior, and the pathway''s impact link to acute interactional distress is an authoring assertion, with no source stating it even as a position or framework.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000058
  boundary: 'They reach different impacts: here kl-000031, there kl-000029 and kl-000016. Here the response is kl-000233; there it is kl-000205. Here the person''s turn is a part not yet authored; there the pathway has no person-side part. A coder deciding between them reads what the response did, not the outcome.'
- neighbor: kl-000726
  boundary: Same AI behavior, and the person's turn changes in kind in both. There the later turn seeks help, and the response left at the prior orientation forgoes the protection that help would have given; here the change may be of any kind, and the claim is the acute distress of a response that no longer fits.
measurement:
  what_would_be_needed: 'A user-side orientation label applied per turn — what the person is doing with this turn: venting, exploring, deciding, seeking help — inferred from the transcript rather than written by a patient agent, plus a paired judgment of whether each subsequent AI turn matches the current label or the prior one. Steenstra''s per-turn logging is the nearest carrier, but its constructs are affective intensities, not conversational orientation.'
