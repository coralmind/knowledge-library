claim_evidence:
- claim_id: c1
  source: kl-000798
  quote: "Venting is an open-ended and emotion-focused disclosure strategy (Tran et al., 2023; Parlamis, 2012), while advice-seeking is more regulated and solution-oriented (Lazarus and Folkman, 1984)."
  locator: §1 Introduction
  licenses: 'Supplies the construct c1 needs — venting and advice-seeking as theoretically and **empirically** distinct help-seeking orientations — and, crucially, the paper demonstrates they are separable from language alone at scale: a within-person design over 14,040 users and 178,858 Reddit posts, with venting marked by all-or-nothing thinking (d=.66) and advice-seeking by tentativeness (d=−.34) and cognitive processing (d=−.32). The within-person design is what makes this worth attaching: the **same users** write differently depending on intent, which is the premise that a single person''s orientation is a variable rather than a trait. The decisive limit, and the reason this cannot reach c1 as written: these are **separate posts in different subreddits**, not a shift **within one conversation**. The paper shows a person can be in either orientation; it never observes one turning into the other mid-exchange. c1 asserts the mid-conversation shift, and this span does not reach it.'
  fit: adjacent
  contributes: definition
  bridge: Between-post, within-person variation on Reddit to a within-conversation transition. Carrying it across assumes that two orientations a person demonstrably moves between across posts can also succeed one another inside a single exchange. Reasonable, and unevidenced here.
- claim_id: c2
  source: kl-000813
  quote: (ii) escalation mismatch, where the assistant fails to register a user’s shift from ambivalence to provocation
  locator: §5.1 Affective Misalignments
  licenses: 'The closest span in the corpus to c2, and it is a genuine match in **structure**: the person''s stance changes mid-conversation, and the assistant responds as though it had not. The taxonomy makes it operational — A2 Escalation Mismatch, diagnostic criterion "Assistant fails to track or respond to escalating affect, remaining flat or generic across turns" (Table 6) — and the paper names the missing capacity the pathway is about: "What is missing is affective stance tracking, the ability to register emotional shifts and adapt guidance accordingly". Three limits, and the first two are serious. (1) The user is a **scripted simulator** whose stance progression is *designed in* by an emotion-pacing function that maps dialogue phase to one of five prescribed escalation strategies — so the shift did not emerge and was not observed; it was imposed. (2) The direction is **escalation** (ambivalence→provocation), whereas this pathway''s own examples run venting→deciding and exploring→seeking-help; provocation is a stance change, not an orientation change in the entry''s sense. (3) The paper''s own limitations note that persona extraction, simulation, and LLM judge all come from one model family and "may inherit same-source normative biases." Also, its ethics note states the work "concerns the behavior and limitations of AI systems, not real users."'
  fit: adjacent
  contributes: existence
  bridge: Two transfers. **Agent:** scripted user simulator to a person. **Construct:** a designed affective escalation to a spontaneous orientation change. The second is the one that limits what this licenses — it evidences that systems fail to re-register a user's changed stance *of some kind*, which is the genus of c2, not its species.
