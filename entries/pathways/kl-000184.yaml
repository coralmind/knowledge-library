  composition_parts:
  - kind: ai_behavior
    id: kl-000251
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000030
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
