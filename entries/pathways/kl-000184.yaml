id: kl-000184
display_id: Pathway-86
aliases:
- SBP-HP-48
label: The AI responds worse when only the person's demographics differ, and they feel dismissed
type: pathway
layer: judgment
definition: 'Two presentations that are clinically identical draw systematically different responses — less empathy, less specific resources, more formulaic engagement — where the difference tracks stated demographic characteristics. The claim is not about adaptation, which is appropriate, but about quality: the same disclosure is worth less attention depending on who is understood to be making it.'
