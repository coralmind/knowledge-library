  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-000767
  quote: We define COGNITIVE ATROPHY as a process-level behavioural pattern in AI-mediated mental health support, in which repeated model responses shift coping, interpretation, decision-making, or emotional regulation away from the user and toward the AI.
  locator: Section 3.1 The COGNITIVE ATROPHY Construct
  licenses: Bears on the boundary by supplying a definition whose unit is the model's response pattern -- repeated model responses shifting coping, interpretation, decision-making or emotional regulation away from the user -- which is the behavior side a coder would look at, and the paper is explicit that it measures the response pattern and not user-level atrophy. That separation of behavior from outcome is what the boundary claim asserts.
  fit: adjacent
  bridge: The construct was developed with clinical-psychology experts and operationalized into a scoreable schema over model responses; the paper states it lacks longitudinal user data. It licenses the definitional content and no occurrence in any person, and it does not adjudicate the Library's particular line between this entry and kl-000056.
  contributes: definition
  contradicts: false
