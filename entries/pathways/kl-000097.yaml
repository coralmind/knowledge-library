id: kl-000097
display_id: Pathway-59
aliases:
- CH-03
label: The person relies on the AI for what they used to do, and they doubt they still can
type: pathway
layer: judgment
definition: 'Across sustained use the person comes to rely on the system for work they previously did themselves, and their own confidence in being able to do it declines. Distinguished from the dependency pathways by what is claimed: not distress at unavailability but a lowered estimate of one''s own capability.'
