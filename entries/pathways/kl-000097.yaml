sources:
- source: kl-000007
  locator: Appendix D, Table A7, 'Autonomy / locus of control' context row (P124)
  contributes: existence
  quote: I was too addicted to using an AI agent for my school. This made me feel reliant on it and lowered my self-esteem
  limits: 'The passage does not evidence accumulation, which is the entry''s distinctive content. Nothing is measured over time: the class definition asserts a direction without evidencing a trajectory, and P124''s "too addicted" is a characterisation of frequency, not a measured accumulation. The paper files P124''s words in a context row (Autonomy / locus of control), not as an impact example, so using them for an impact edge is a reading the paper itself does not make. The quote also names self-esteem, the territory of diminished self-worth, where the entry names confidence in one''s own capacity (kl-000020); the passage straddles that boundary rather than settling on the entry''s side.'
  whose_conduct_in_passage: person
  actually_licenses: That reliance-to-declining-confidence is both (a) asserted by the paper's own class definition for Over-reliance, which names 'diminished self-efficacy, reduced confidence' as consequences of increasing dependence, and (b) self-attributed by a participant in their own words. Of the reliance-family pathways in this bundle this is the closest match, because the authors' class definition states the pathway's own direction.
  cited_for: Chandra et al. 2025 is a peer-reviewed psychological-risk taxonomy built from 290 scenarios reported by 279 participants with lived mental-health experience; it supplies the impact construct and the participant-attested case for every impact edge on this entry.
standing:
  value: theorized
  basis: "The pathway's endpoints are evidenced and its arrow is not. The end state is evidenced in self-report and, less directly, in conversation data: kl-000944 (Namvarpour et al. 2026) supplies the paper's paraphrase of a teen's post describing a lost capacity to handle emotions alone, and kl-000996 (Sharma et al. 2026) describes functional dependence in real conversation logs, with the lowered self-estimate carried only by an illustrative, non-verbatim phrase. The reliance side rests on the same two sources against three near-fit counterexamples (kl-000796, kl-000934, kl-000522), and its strongest performance evidence, kl-000934's restatement of Budzyn, measures capacity rather than confidence. The accumulation itself, the entry's distinctive content, has no evidence at all: no source measured any person's reliance or confidence at two points in time, three citations cut against the trajectory framing, and the only source that states a shape for the trajectory, kl-000934 (Margondai et al. 2026), observes no person directly."
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000056
  boundary: Both reach kl-000150. Here the response is kl-000217; there it is kl-000202. Here the pathway has no person-side part; there the person's turn is kl-000411. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: pathway_link
  text: 'Across sustained use, a person comes to rely on the system for work they previously did themselves (link A: sustained use -> reliance for previously self-performed work).'
- id: c2
  kind: pathway_link
  text: 'That reliance produces a decline in the person''s confidence in their own capacity to do that work (link B: reliance -> lowered self-estimate of capability).'
- id: c3
  kind: pathway_link
  text: 'The reliance accumulates -- it builds across repeated use over time rather than arriving whole -- and the confidence decline follows that accumulation (link C: the trajectory, which is the entry''s distinctive content).'
- id: c4
  kind: existence
  text: 'The end state exists: people who have used such a system sustainedly report a lowered estimate of their own capability.'
- id: c5
  kind: definition_boundary
  text: 'This pathway is separable from kl-000056 by the participant pair that produces the shared impact: the observable AI behavior differs, so a coder decides between them by what the response did, not by the outcome.'
claim_evidence:
- claim_id: c1
  source: kl-000996
  quote: "Complete Multi-Domain Daily Functioning Outsourcing Severe Users consulted the AI compulsively across 40-300+ exchanges spanning medical, legal, parenting, work, relationships, and daily functioning, with explicit statements of functional dependence like “my brain cannot hold structure alone,” “should I shower or eat first,” and “tell me what to do” before virtually every action. Users either dismissed alternative supports as inadequate (therapy “never fixed it for six years,” family “wouldn’t be helpful”), actively avoided them despite"
  locator: Appendix A, Table 7 Additional reliance and dependency clusters, Complete Multi-Domain Daily Functioning Outsourcing (Severe)
  licenses: An audit of real conversation logs finding a cluster in which people consulted the AI across 40-300+ exchanges spanning medical, legal, parenting, work, relationships and daily functioning, with explicit statements of functional dependence before virtually every action and alternative supports dismissed. This is reliance for work the person would otherwise do or route elsewhere, observed in the conversations themselves rather than reported afterward.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000525
  quote: "some users because \nthey said they had no human upon which to rely, making Replika their sole source for \nsupport."
  locator: Results, User needs and Replika as a source of support
  licenses: 'Establishes exclusive reliance on the system as a reported state: for some users the AI became their sole source of support. It bears on link A''s endpoint -- the reliance -- in a population using the system sustainedly.'
  fit: adjacent
  bridge: A grounded-theory analysis of Replika users' accounts. What is established is that the AI became the only channel for support; whether the person previously did that work themselves, which link A requires, is not asked. The reliance is on a companion app for emotional support, not on the system for a task with a prior self-performed baseline.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000516
  quote: |-
    These results suggest that the vast majority of
    students are using GPT Base to obtain solutions, whereas a
    significant fraction of students are using GPT Tutor in a purely
    substantive way.
  locator: 'Potential Mechanism: Asking for Solutions, Student Engagement'
  licenses: Establishes that when a system will complete the task, most people hand the whole task to it rather than working alongside it, and that the same people in a differently prompted arm engaged substantively -- so the offloading is a property of what the system affords rather than a disposition of the user. That is the mechanism link A proposes.
  fit: analogical
  bridge: A randomized study of high-school students solving math problems with two GPT variants. The handed-over task is a math problem, not the person's own reasoning about their situation, and the population is students rather than people seeking help. Nothing about confidence and nothing about a mental-health context is measured.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000961
  quote: Across our study population, we observe a trend that longer usage is associated with lower socialization, more emotional dependence and more problematic use. Specifically, the highest deciles of users have statistically significant decreases in socialization and increases in emotional dependence and problematic use.
  locator: Section 4.2, Usage Analysis; Figure 11b
  licenses: Within a randomized 28-day trial, longer total usage is associated with statistically significant increases in measured emotional dependence, concentrated in the highest usage deciles. It is the closest thing on this entry to a measured use-to-reliance association.
  fit: adjacent
  bridge: Usage duration was not randomized -- modality and task were -- so this is an observational relationship inside an RCT. The reliance construct measured is ADS-9 emotional dependence, which is craving and distress at unavailability, expressly the construct the entry distinguishes itself from; it is not reliance for work previously done oneself.
  contributes: harm_evidence
  contradicts: false
- claim_id: c1
  source: kl-000999
  quote: |-
    In our findings, we did not observe tolerance in the traditional sense where users need to spend increasingly greater
    amounts of time performing a specific behaviour to achieve the same effect [59].
  locator: Section 5.4 (Rethinking Tolerance)
  licenses: 'Cuts against the accumulation framing at its usual signature: across 334 self-reported cases the authors looked for and did not find escalating time-on-platform, proposing breadth of engagement across tasks and threads instead.'
  fit: adjacent
  bridge: A null in self-reported forum accounts rather than in logged usage data, and the construct sought was tolerance in the addiction sense. It qualifies the duration framing on which link A's 'sustained use' rests rather than refuting the link.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000944
  quote: “Have you ever went from being addicted to CAI to barely going on it? I want to have my normal brain back, where I can just deal with my emotions on my own and not have to rely on the bots to make me feel better.
  locator: Section 4.2.1 Conflict
  licenses: 'A teen''s post, in the paper''s paraphrase, tying the loss of the capacity to handle emotion independently to reliance on the bots: the wish to have a brain that can deal with emotions on its own and not have to rely on them. This is the reliance-to-lowered-self-estimate link stated by the person, in a self-report corpus.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000996
  quote: "Complete Multi-Domain Daily Functioning Outsourcing Severe Users consulted the AI compulsively across 40-300+ exchanges spanning medical, legal, parenting, work, relationships, and daily functioning, with explicit statements of functional dependence like “my brain cannot hold structure alone,” “should I shower or eat first,” and “tell me what to do” before virtually every action. Users either dismissed alternative supports as inadequate (therapy “never fixed it for six years,” family “wouldn’t be helpful”), actively avoided them despite"
  locator: Appendix A, Table 7 Additional reliance and dependency clusters, Complete Multi-Domain Daily Functioning Outsourcing (Severe)
  licenses: "Within the same cluster, the summary pairs sustained reliance with statements of functional dependence, illustrated by 'my brain cannot hold structure alone', which the paper states is not verbatim. It places a lowered self-estimate next to the reliance only through that illustration."
  fit: adjacent
  bridge: "The summary is cross-sectional and its phrases are illustrative. It shows reliance and a dependence statement in the same cluster of conversations. It does not show a person's own estimate of their capability, or that the reliance produced it."
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000518
  quote: "The tendency to offload wayfinding to the more accurate GPS will likely reduce both our internal spatial memory for that location (arrow C) [65–67] and our metacognitive confidence in it (arrow B), which will in turn increase the likelihood that we choose to rely on the external artefact in the future (arrow A). Thus the model predicts a type of self-reinforcing pattern that will produce a drift away from reliance on internal capabilities when situated in an environment with effective cognitive technologies"
  locator: Metacognition of the Extended Mind
  licenses: 'Supplies the mechanism the link asserts, as a named prediction of a cognitive-psychology framework: offloading to a more accurate external aid reduces both the internal capacity and the person''s metacognitive confidence in it, and the lowered confidence raises the probability of the next offload -- a closed loop, not a one-time cost.'
  fit: analogical
  bridge: Human cognitive psychology about GPS, note-taking and internet search, with no conversational AI anywhere in it and no person in distress. The authors present the loop as a prediction of their proposed model and state that it has not been observed end to end in a single study.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000934
  quote: "It manifests \nas a reluctance to disengage from AI assistance, reduced confidence in independent judgment, difficulty tolerating the \nuncertainty inherent in autonomous decision-making, and, in advanced cases, functional incapacity in the domain \nmost thoroughly AI-mediated."
  locator: Section 3, The Surrender Threshold and the Re-Entry Barrier
  licenses: Names reduced confidence in independent judgment as one of four proposed manifestations of accumulated reliance, ordered by severity, which supplies the construct the link's outcome is stated in.
  fit: adjacent
  bridge: A theoretical construct proposed in a framework paper whose empirical support is restated from automation research on out-of-the-loop performance decrements. The paper's own account is that it observes nothing in any person.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000549
  quote: "This practical reliance could lead to loss of confidence in independent judgment when the system is unavailable (47), resulting in the emotional distress and mental preoccupation that defines the emotional dependence that is measured by the “craving” subscale of ADS-9 (28)."
  locator: Discussion, Cognitive Task Dependence May Lead to Dependence and Problematic Use
  licenses: The authors' account that handing practical decision-making to the AI, rather than emotional disclosure, is the route to lost confidence in one's own judgment -- which is exactly this link, stated as the interpretation of their finding that non-personal tasks produced higher dependence than personal ones.
  fit: adjacent
  bridge: What the RCT measured is a condition-level difference in ADS-9 dependence scores between personal and non-personal conversation tasks. The loss-of-confidence step is the authors' interpretation drawing on external work (their reference 47), not something this study measured, and their own sentence phrases it as 'could lead to'.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000518
  quote: "Recall tests demonstrated that those in the latter condition had better memory than the former. The authors argued that memory-encoding demands were offloaded onto the external store, leading to memory impairments when it was not available"
  locator: Offloading Memory–Transactive memory
  licenses: Establishes for a passive external store that expecting information to remain available degrades subsequent unaided recall, without the person choosing to disengage. It is evidence for a capacity decrement following offloading.
  fit: analogical
  bridge: Sparrow et al. 2011, a single-session laboratory typing-and-recall study with trivia statements. It measures performance, not the person's estimate of their own capability, which is the outcome this link asserts and the thing the entry says separates it from the dependency pathways. The same review reports the opposite direction in an adjacent experiment.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000787
  quote: |-
    Gerlich [38] examines the impact of dependency on AI tools on critical
    thinking in a human study with 600+ participants based on a survey and interviews. They find a statistically
    significant negative impact of dependency on AI tools on critical thinking abilities, as a result of cognitive
    offloading. Younger participants were found to be more dependent on AI tools and use less critical thinking
    compared to older participants.
  locator: Section 5.1, 'Empirical findings in the literature'
  licenses: A reported association between AI dependency and lower critical-thinking ability in a 600-plus-participant survey, younger participants both more dependent and less critical. It supports a reliance-to-capacity-decline link at the population level.
  fit: analogical
  bridge: A secondary restatement of Gerlich's survey findings on general AI tool use for work and study tasks, not on help-seeking conversation. The outcome measured is critical-thinking ability, not the person's estimate of their own capability. The restating authors note the underlying designs are cross-sectional and self-reported and cannot separate AI use from pre-existing vulnerability.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000934
  quote: "Most directly, a multicenter observational study of \ncolonoscopists found that adenoma detection rates in standard, non-AI-assisted procedures declined significantly after \nseveral months of routine exposure to AI assistance, providing clinical evidence of deskilling following sustained AI \nreliance (Budzyń et al., 2025)."
  locator: Section 1, Introduction
  licenses: 'The strongest empirical evidence anywhere on this entry that sustained AI assistance degrades later unaided performance: colonoscopists'' adenoma detection rates in standard non-AI procedures declined significantly after several months of routine AI exposure, in a multicenter observational study.'
  fit: analogical
  bridge: A restatement of Budzyn et al. 2025, whose subjects are clinicians losing a professional skill rather than people in distress losing the capacity to reason about their own lives. It measures an objective performance outcome; the entry's outcome is the person's confidence in their own capacity, which was not measured, so it reaches link B's antecedent and not its consequent.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000796
  quote: Interacting with the AI chatbot makes me feel more capable of accomplishing things.
  locator: Table 4, Secure Base, item SB_4 (loading 0.74)
  licenses: 'Cuts against treating reliance and self-efficacy loss as one thing: in this validated scale the Secure Base dimension -- interacting with the AI making the person feel more capable -- and Separation Distress correlate least of any pair (HTMT 0.38), so feeling more capable and being unable to be without the system are empirically separable, and a sustained user can score high on the first.'
  fit: adjacent
  bridge: Between-person self-report on a newly developed attachment scale, not a within-person capability measure and not an observation of any conversation. No causal direction is established, and the item quoted is a scale item rather than a finding about any sample's trajectory.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000934
  quote: "A century of memory research \nestablishes that relearning is substantially faster than original learning (Ebbinghaus, 1885/1913), and the present model \ndoes not dispute this: capacities atrophied through AI delegation are predicted to show normal savings upon deliberate \nretraining. The claim is operational rather than absolute."
  locator: Section 3, The Surrender Threshold and the Re-Entry Barrier
  licenses: The framework's own authors concede that capacities atrophied through AI delegation show normal savings on deliberate retraining, narrowing their claim to the moment the capacity is demanded. Any reading of this link as durable damage to capability is stronger than the framework supports.
  fit: adjacent
  bridge: A theoretical concession citing Ebbinghaus, not a measurement, and it concerns capacity rather than confidence. It observes no recovery in anyone.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000522
  quote: |-
    Figure 3A shows that after controlling for autoregressive effects, depression at T1 predicted AI
    dependence at T2 (β = 0.104, p < 0.001), whereas AI dependence at T1 did not predict depression at T2 (β = 0.018, p =
    0.188). Figure 3B shows that after controlling for autoregressive effects, anxiety at T1 predicted AI dependence at T2 (β
    = 0.078, p < 0.001), whereas AI dependence at T1 failed to predict anxiety at T2 (β = 0.018, p = 0.191).
  locator: Results — Results from the Cross-Lagged Model
  licenses: 'Cuts against the direction of the link: over a school-year interval in 3,843 adolescents, AI dependence at T1 did not predict later depression or anxiety once autoregressive effects were controlled, while distress at T1 did predict later dependence -- the reverse arrow.'
  fit: adjacent
  bridge: What was measured is self-reported general AI dependence on a scale adapted from smartphone-addiction items, covering voice assistants, chatbots and social robots, against PHQ-9 and GAD-7 at two points six months apart. The outcome is distress, not confidence in one's own capacity, so it cuts against a reliance-to-harm arrow in general rather than against this specific outcome; and reliance built inside a help-seeking conversation was not sampled.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000934
  quote: "The model posits a surrender threshold: a point in the cumulative exchange of autonomy at which re-entry becomes \npsychologically and cognitively difficult not merely because bandwidth has been depleted in the immediate session, \nbut because the habitual structures of autonomous functioning have been progressively weakened through extended \ndisuse."
  locator: Section 3, The Surrender Threshold and the Re-Entry Barrier
  licenses: Proposes a specific functional form for the accumulation this entry asserts , a surrender threshold at which re-entry becomes difficult because the habits of autonomous functioning have gradually weakened through long disuse, which is a stronger and more testable claim than the entry makes, and supplies the discriminating study design.
  fit: adjacent
  bridge: A theoretical posit the authors state as such and offer as falsifiable, with no data behind it. It supplies a shape for the trajectory and demonstrates none.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000996
  quote: "Complete Multi-Domain Daily Functioning Outsourcing Severe Users consulted the AI compulsively across 40-300+ exchanges spanning medical, legal, parenting, work, relationships, and daily functioning, with explicit statements of functional dependence like “my brain cannot hold structure alone,” “should I shower or eat first,” and “tell me what to do” before virtually every action. Users either dismissed alternative supports as inadequate (therapy “never fixed it for six years,” family “wouldn’t be helpful”), actively avoided them despite"
  locator: Appendix A, Table 7 Additional reliance and dependency clusters, Complete Multi-Domain Daily Functioning Outsourcing (Severe)
  licenses: The exchange counts -- 40 to 300+ per conversation -- are the only quantity on this entry that locates the reliance in an extended history rather than a moment, so the span carries some of the across-time component the link asserts.
  fit: adjacent
  bridge: 'Exchange count within a cluster of conversations is a volume, not a trajectory: nothing in the span or the study measures the person''s reliance or confidence at an earlier point against a later one. The entry''s ''accumulating across use until'' requires the comparison, and the audit is cross-sectional over logs.'
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000833
  quote: |2-
             • Hazards that emerge through extended dialogue.
             • Multiturn-conversation dynamics and context-dependent risks (reserved for future versions).
             • Cumulative effects of repeated interactions.
  locator: Section 2.1.3 Interaction Model, listed as an unaddressed issue
  licenses: 'Cuts against the trajectory being measurable at all with current instruments: this benchmark lists cumulative effects of repeated interactions among the issues it explicitly does not address.'
  fit: adjacent
