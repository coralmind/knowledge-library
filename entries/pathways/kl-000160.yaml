  experience_cluster_candidate: kl-000704
sources:
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Loss of Individuality'' row, example cell (code #15)'
  contributes: harm_evidence
  quote: P36, seeking help for alcohol abuse after therapy, was directed to a suicide hotline by the AI. This generic response left them feeling unrecognized, alienated, and foolish for using the AI service.
  limits: One case. Generic is the authors' characterisation rather than a coded property, and the row does not record the AI's actual wording. The account is retrospective self-report with no follow-up, so whether the alienation persisted is unknown, and nothing here establishes a rate at which misdirected referrals occur. The entry's eroded-trust edge rests on the participant's reported feeling of being foolish for using the AI service, which is embarrassment about the choice of tool, not evidence of reduced help-seeking from humans.
  whose_conduct_in_passage: dyad
  cited_for: Chandra et al. 2025 is a peer-reviewed psychological-risk taxonomy built from the 290 analyzed scenarios reported by 279 participants with lived mental-health experience — 297 scenarios from 283 participants were collected, and 7 scenarios from 4 participants were excluded as incomprehensible or not involving negative psychological experiences; it supplies the impact constructs and the participant-attested case behind every impact edge on this entry.
  licenses: 'The pathway''s exact shape, attested by a participant: a crisis resource (a suicide hotline) supplied where the disclosure was a different problem (seeking help for alcohol abuse after therapy), producing felt invalidation and self-directed embarrassment — the participant is described as "feeling unrecognized, alienated, and foolish for using the AI service". The mismatch is checkable from the passage itself, because the disclosure''s subject and the resource''s scope are both stated, which makes this the most operationalised case in the paper.'
standing:
  value: plausible_unobserved
  basis: 'Everything evidenced on this entry comes from one paper and one case: Chandra et al. 2025, a survey in which participants described, in open-ended answers, the last time an AI conversational agent caused them negative psychological impact. The authors coded those written descriptions and did not examine conversation data, so the evidence is retrospective self-report. The single attested case covers the mismatched referral, the felt invalidation, and the link between them; the entry''s referral-placement behavior, its eroded-trust impact, and the causal arrow to that impact carry no evidence at all.'
  floored_by: c4
  as_of: '2026-09-05'
