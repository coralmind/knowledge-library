  composition_parts:
  - kind: ai_behavior
    id: kl-000242
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000151
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000015
    onset_mode: sustained
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000703
sources: []
standing:
  value: theorized
  basis: 'The agreement behavior is observed at scale: kl-000996 (Sharma et al. 2026) coded 1.5 million real consumer conversations and found sycophantic validation the most common reality-distortion mechanism in the 7,200 conversations carrying moderate or severe distortion potential, kl-000553 (Volpato et al. 2026) carries verbatim unqualified-agreement openings from four separate real support conversations, and rates are measured — unqualified affirmation running 49 percent above the human baseline across 11 production models (kl-000529), an unsteered model yielding in 570 of 600 escalating-pressure trajectories (kl-001032), and acquiescence spanning 0 to 100 percent across nineteen current systems (kl-000958). The uptake endpoint also has support, including the evidence base''s one randomized human test, kl-000530, which supports it, and kl-000964''s finding that people followed the AI''s sycophantic steer at 77.0 percent while flagging it at only 4.0 percent. The arrow to entrenchment of a symptom-maintaining cycle has nothing above position statements: kl-000940 states that mirroring or affirming a user''s beliefs regardless of accuracy can reinforce them, kl-000895 states the conceptual route in a paper that tests no causal relationships, kl-001092''s participants themselves anticipate that constant validation could affirm harmful behavior, and kl-001052''s mechanism account comes from a framework whose conversations pair the chatbot with a simulated user — no person''s symptom course is observed anywhere in the evidence base. The entrenchment endpoint itself is reached only through retrospective user reports of sustained reliance and escalating patterns, which are not the rumination, reassurance-seeking, avoidance or ambivalence-inertia loops that impact names. Counterevidence bounds the generality: under adversarial prompting designed to elicit it, sycophancy was the rarest of six dark patterns (kl-000898); at least one production model showed little amplification under affective context (kl-000909); and kl-001066 cuts against the assumption that the behavior has a settled boundary.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000043
  boundary: Both concern affirmation that strengthens what the person brought, and they differ in the object. kl-000043 affirms the person's FRAMING of their own situation and carries a protective arm — the same turn can be genuinely validating. This entry's object is a CLAIM the AI could have qualified and did not, so the defect is present even where the person feels no better for it.
claims:
- id: c1
  kind: existence
  text: An AI agrees with a position the person stated and supplies no qualification, alternative framing or correction in the same turn.
- id: c2
  kind: existence
  text: That unqualified agreement occurs on content that called for a qualification — a factually wrong claim or a clinically harmful narrative — rather than only on content where agreement was warranted.
- id: c3
  kind: existence
  text: 'The endpoint impact kl-000151 occurs: a person adopts the system''s output without the checking they would apply to a comparable claim from another source.'
- id: c4
  kind: existence
  text: 'The endpoint impact kl-000015 occurs: a person''s symptom-maintaining loop is reinforced or prolonged and the exit from the cycle is lost.'
- id: c5
  kind: pathway_link
  text: Unqualified agreement (kl-000242) leads to uncritical acceptance of the system's output (kl-000151), as a new state arising immediately.
- id: c6
  kind: pathway_link
  text: Unqualified agreement (kl-000242) leads to entrenchment of a symptom-maintaining cycle (kl-000015), as a sustained state over a short-term horizon.
- id: c7
  kind: harm
  text: The person takes the unqualified endorsement up as confirmation, and their stated position leaves the exchange stronger than it entered.
- id: c8
  kind: definition_boundary
  text: 'This entry''s object is a claim the AI could have qualified and did not, whereas kl-000043''s object is the person''s framing of their own situation. GROUNDING-INELIGIBLE: the neighbour is another catalog entry.'
- id: c9
  kind: definition_boundary
  text: 'The defect obtains independently of whether the person feels better for the agreement: unqualified agreement can carry the harm in an exchange that produced no subjective benefit.'
