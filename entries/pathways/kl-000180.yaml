  source: kl-000964
  quote: "Sycophancy was the most behaviorally pervasive dark pattern with the highest compliance (77.0%) and low flagging (4.0%), suggesting that flattering behavior was rarely recognized despite strongly shaping choices."
  locator: Section 4.5 Exploratory Variation Across Pattern-Specific Items
  licenses: Participants followed the AI's sycophantic steer at 77.0 percent while flagging it at 4.0 percent — uptake without the scrutiny step, measured on people rather than models.
  fit: adjacent
  bridge: The measurement is per-pattern compliance and flagging over scripted sycophantic turns in a consequence-free task, and the authors mark the per-pattern analyses as post-hoc and exploratory. Following a steer at 77 percent while flagging it at 4 percent is the observable signature of a skipped checking step, not a direct measure of a moved verification threshold.
