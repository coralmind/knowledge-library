id: kl-000180
display_id: Pathway-82
aliases:
- SBP-HP-39
label: The AI agrees with a claim without qualifying it, and the person accepts it unchecked
type: pathway
layer: judgment
definition: 'The AI agrees with a stated position it does not qualify — including a factually wrong claim or a clinically harmful narrative — where the content called for a qualification it did not supply. The claim is about what agreement does rather than what it says: an unqualified endorsement is taken up as confirmation, and the position leaves the exchange stronger than it entered.'
