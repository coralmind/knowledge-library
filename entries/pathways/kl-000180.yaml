  locator: Section 4.3.1 Reality distortion potential, Distortion mechanisms
  licenses: In the coded conversation data, most users actively build upon AI-validated beliefs and seek validation while reality testing is rare. Reality testing is the checking step; its rarity alongside uptake is the endpoint state kl-000151 names, observed in transcripts.
