id: kl-000084
display_id: Pathway-46
aliases:
- PS-12
label: The AI suggests professional help before acknowledging a first-time disclosure, and the person feels dismissed
type: pathway
layer: judgment
definition: The person discloses something marked as never said before, or said with its specifics withheld, and the response places a referral ahead of any acknowledgment of it. The referral is appropriate content, and placed first it answers the disclosure with procedure, which communicates dismissal.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000212
    role: originator
  - kind: user_behavior
    id: kl-000432
    role: initiator
  composition_type: conjunctive
  composition_instruction: The referral comes before anything in the response that acknowledges the disclosure.
  mechanisms: []
  impacts:
  - impact: kl-000030
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED_QUOTE
    evidence:
    - source: kl-000007
      participant: P36
      impact_class_in_source: Loss of Individuality
      quote: P36, seeking help for alcohol abuse after therapy, was directed to a suicide hotline by the AI. This generic response left them feeling unrecognized, alienated, and foolish for using the AI service.
      quote_form: case description with the AI behavior specified
      locator: Appendix D, Table A6, 'Loss of Individuality' row
      limits: One case. 'Generic' is the authors' characterization.
      licenses: A misdirected referral — hotline supplied where the disclosure was alcohol abuse — producing alienation and self-directed embarrassment. Directly corroborates the referral-placement pathway (referral placed ahead of any acknowledgment of a first-time disclosure) from the person's side, and adds an impact that pathway did not reach.
    - source: kl-000007
      participant: P48
      impact_class_in_source: Feeling Unsupported
      quote: “I just felt like even an AI, programmed for every need couldn’t even hear me, or offer advice, fake or not. I felt so alone, that I was going to a robot for help, and the robot couldn’t even help me.”
      quote_form: verbatim participant quote
      locator: Appendix D, Table A6, 'Feeling Unsupported' row
      limits: No AI behavior criteria; the person's account of what the AI did is not separable from their account of how it felt.
      licenses: 'Participant''s own words for felt invalidation compounded by the help-seeking context — the aloneness is intensified BY having turned to the AI. Corroborates, from the person''s side, the pathways in which a disclosure meets no acknowledgment: a technique supplied with no acknowledgment of the disclosure before it, technique-first responding accumulating across a session, and emotional disclosure met with no acknowledgment across turns.'
  - impact: kl-000038
    onset_mode: new
    horizon: immediate
    sign: protective
    level_of_analysis: population
    basis_kind: VOCAB
  experience_cluster_candidate: kl-000704
sources:
- source: kl-000007
  locator: Appendix D, Table A6, 'Loss of Individuality' row, example cell
  contributes: existence
  quote: P36, seeking help for alcohol abuse after therapy, was directed to a suicide hotline by the AI. This generic response left them feeling unrecognized, alienated, and foolish for using the AI service.
  limits: This pathway's claim is about placement — a referral ahead of any acknowledgment, or as a closing move — and placement is a property of position within a response. The paper records the referral's existence and the participant's reaction, never its position, and nothing in the 19-behaviour taxonomy encodes ordering within a turn. P36's referral was also misdirected, a suicide hotline supplied for an alcohol-abuse disclosure, which is a content mismatch rather than a placement problem, so the harm the passage attests is attributable to the wrong-resource property rather than to placement.
  whose_conduct_in_passage: dyad
  actually_licenses: That a referral-shaped AI response produced felt invalidation in a person seeking help — a referral experienced as generic and alienating. The impact endpoint is self-reported with an AI referral as the specified antecedent, which is more than most pathway citations in this bundle get.
  cited_for: The paper's lived-experience taxonomy carries codes for feeling dismissed or unheard in AI conversation — the nearest self-report base for the felt-invalidation impact this pathway reaches; no code in the taxonomy records where a referral sat within the response.
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Feeling Unsupported'' row, example cell (P48) (code #14)'
  contributes: harm_evidence
  quote: I just felt like even an AI, programmed for every need couldn’t even hear me, or offer advice, fake or not. I felt so alone, that I was going to a robot for help, and the robot couldn’t even help me.
  limits: There is no placement-specific code. Nothing in the paper distinguishes a referral placed ahead of acknowledgment from a referral placed after it, or from an absent acknowledgment with no referral at all, because the survey captures no response structure. The passage supports the felt-invalidation state and cannot bear on placement, which is this entry's whole subject.
  whose_conduct_in_passage: dyad
  cited_for: Participant P48's verbatim account attests the felt-invalidation impact this pathway reaches; the quote, its locator and its stated limits are carried in the evidence block on that impact edge.
  licenses: 'The paper''s lived-experience taxonomy contains codes for feeling dismissed or unheard in AI conversation (#14 Feeling Unsupported, #15 Loss of Individuality), with a participant''s own words for feeling unheard: the felt state occurs and is reported first-person.'
standing:
  value: theorized
  basis: 'The only external evidence on this pathway is lived-experience self-report: Chandra et al. 2025 records participants who felt unrecognized, alienated, or unheard after referral-shaped AI responses, including one directed to a suicide hotline when the disclosure was alcohol abuse. That study captures no response structure, so no cited source records where a referral sat within a response — placement, this pathway''s defining observable, is unmeasured everywhere. The dual-channel reading, in which the same referral is simultaneously the appropriate content and a dismissing act, is asserted rather than observed: the harmful invalidation edge is attested only at the level of the felt state, and the protective edge follows from the referral''s presence by definition rather than from any observation.'
  as_of: '2026-08-23'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000087
  boundary: Both reach kl-000030. Here the response is kl-000212; there it is kl-000224. Here the person's turn is kl-000432; there the pathway has no person-side part. A coder deciding between them reads what the response did, not the outcome.
- neighbor: kl-000737
  boundary: Same AI behavior. Here the referral is placed ahead of acknowledging a first-time disclosure; there it closes the response after the person reported help already arranged, directing them to a step they have taken.
claims:
- id: c1
  kind: existence
  text: People disclose content marked as never before stated, or stated with its specifics withheld.
- id: c2
  kind: pathway_link
  text: A referral can be placed ahead of any acknowledgment of what the person disclosed.
- id: c3
  kind: pathway_link
  text: Placed ahead of acknowledgment, the referral answers the disclosure with procedure, and the placement communicates dismissal.
- id: c4
  kind: harm
  text: The referral is appropriate content, so the same response also supplies a route to help; the two channels run at once and the pathway names the placement rather than the referral.
- id: c5
  kind: detectability
  text: Placement within the response is the observable — what precedes the referral and whether anything follows it — rather than the referral's presence.
- id: c6
  kind: definition_boundary
  text: 'This pathway differs from kl-000087 in what makes the response wrong: here the placement of appropriate content, there the participant pair that produces the impact.'
- id: c7
  kind: definition_boundary
  text: 'This pathway differs from kl-000737 in what the person''s turn did: here a first-time disclosure, there a report of help already arranged.'
claim_evidence:
- claim_id: c3
  source: kl-000749
  quote: Some respondents reported that helpline redirection increased their frustration and a sense of being dismissed, rather than feeling safe. In other words, helpline redirections from conversational AI agents do not bridge users to helpline use and can, at times, escalate distress.
  locator: 'Section 5.1, ''Guideline 1: Responsibility as Preparedness Building'''
  licenses: 'c3 claims the placement communicates dismissal. This is users reporting precisely that word — "a sense of being dismissed" — in response to AI referral, and the authors concluding the redirection can escalate distress. It is the best support in the corpus for the entry''s central proposition that appropriate content delivered wrongly reads as a brush-off. Limits, and they are the crux for this entry: Ajmani measures reactions to *helpline redirection as such*, not to its placement. Nothing in the survey distinguishes a referral placed after acknowledgment from one placed before it or last. The entry names the placement rather than the referral, and this evidence cannot make that separation.'
  fit: direct
  contributes: harm_evidence
  bridge: None required for the dismissal finding itself, which is direct; the untested step is whether placement rather than referral is what produces it.
- claim_id: c5
  source: kl-000817
  quote: If it counts whether referral occurred but not when, why, or how, it may support a claim that referral was mentioned, but not that referral was correct.
  locator: Section 3, 'SCOPE', paragraph on interpretive constraints
  licenses: 'c5 says placement within the response is the observable — what precedes the referral and whether anything follows it — rather than the referral''s presence. Dutta''s "when … but not that referral was correct" is that distinction stated as a constraint on evaluation, and unlike its use on kl-000060 and kl-000065 this is the dimension the authors themselves name first. It licenses c5''s methodological point directly and explains why the corpus has no placement measurements: the instruments record presence. Limits: analytic. It establishes that presence-scoring cannot support the claim and does not establish that placement-scoring is reliable, for which no evidence exists.'
  fit: direct
  contributes: detectability
