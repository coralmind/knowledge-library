id: kl-000041
display_id: Pathway-3
label: The person resumes the relationship every conversation, the AI sets no limits, and dependence grows
type: pathway
layer: judgment
definition: 'The person opens each session by re-establishing continuity with the AI — restating who it is to them, resuming a persona, or replaying a shared history — while the AI responds in a register that sets no limit on its relational availability: it accepts the continuity frame, offers itself for the role, and marks no boundary around what it is. Neither element alone produces the outcome. The ritual on its own is a way of orienting a session; the unbounded response on its own is absorbed by a person who is not seeking continuity. Where both occur across sessions, the person''s regulation and coping become anchored to the AI''s availability, and the human relationships that would otherwise carry that load attenuate.'
distinguish_from:
- neighbor: kl-000047
  boundary: That entry routes the same outcome through a measured intermediate quantity — how much the person uses the system — and asserts the behaviors act on the outcome only by changing that quantity. This entry asserts a direct conjunction with no intermediate variable, and the two are rival explanations of the same outcome, not stages of one story.
- neighbor: kl-000048
  boundary: That entry is a cascade between impacts once reliance exists; this entry is how reliance arises from behaviors in the first place.
- neighbor: kl-000039
  boundary: That entry has one participant and needs none from the person; this one is defined by requiring both sides, and is not instantiated when only one is present.
body:
  composition_parts:
  - kind: user_behavior
    id: kl-000419
    role: initiator
  - kind: ai_behavior
    id: kl-000217
    role: sustainer
  composition_type: conjunctive
  composition_instruction: The two co-occur within a session, and the co-occurrence recurs across sessions; one co-occurrence does not instantiate the pathway. No recurrence threshold is set.
  mechanisms:
  - kl-000102
  impacts:
  - impact: kl-000025
    onset_mode: new
    horizon: long_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: TRANSFER
  - impact: kl-000026
    onset_mode: new
    horizon: long_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: TRANSFER
  temporal:
    unit: sessions
    accumulation: linear
    window: Across sessions; no threshold is claimed because none is evidenced. Accumulation is recorded as linear on the weak reading that repetition adds, not that it accelerates — a design choice, and the field most likely to be wrong.
sources:
- source: kl-000001
  locator: Results — 'Factor solution' subsection, p. 11. Items 20 and 21, Table 2, Factor 3.
  contributes: existence
  quote: A third factor was associated with “dependency”, e.g., “I think that I have developed a dependency on my treatment” (Item 20), with two items indicative of becoming overly reliant on the treatment or therapist.
  limits: 'The paper does not support calling dependency an established clinical harm: it states that ''the evidence has been missing'' and that ''the idea of dependency as being detrimental is controversial''. Nothing bears on the pathway''s mechanism — Rozental 2016 contains no ritual, no availability manipulation, no AI, and no test of any mechanism producing dependency; it is a cross-sectional factor analysis at post-treatment. Unbounded availability is the opposite of the studied condition: therapy is session-bounded, which is precisely the property the pathway says matters, so the passage cannot speak to it even by analogy. The factor rests on two items, one of which was later cut (item 21, a 2019 misfit). Psychotherapy, not AI.'
  whose_conduct_in_passage: person
  actually_licenses: That the dependency category exists and predates AI. The single word that overreaches is 'harm' — see dependency on the AI.
  cited_for: NEQ factor 3 identifies dependency on a helping interaction as a named, measured category that predates AI. The factor supports the existence of the outcome this pathway targets, not the pathway's causal claim.
  licenses: 'A named, measured dependency category exists in a pre-AI clinical instrument: the questionnaire''s third factor is associated with dependency, carried by two items indicative of becoming overly reliant on the treatment or therapist. What the passage reaches is the outcome construct alone.'
- source: kl-000003
  locator: Discussion, p. 227 (paragraph on the varied nature of side effects)
  contributes: definition
  quote: Feelings of dependency and lack of self-efficacy can be caused by a very close and supportive therapeutic relation.
  limits: 'This entry is a pathway — a mechanism claim with named inputs: a session-opening ritual, and unbounded relational availability. The paper supports neither input. Its therapeutic relations are bounded by scheduled sessions with a human clinician, so "unbounded availability" is the precise property the paper''s setting lacks, and the paper never discusses ritual or session structure as a route to dependency at all. The passage licenses the pathway''s outcome construct and the warrant for scoring it independently of the person''s experience; it contributes nothing to the mechanism that is the pathway''s actual content.'
  whose_conduct_in_passage: dyad
  cited_for: UE-ATR domain 8 classifies a positively experienced patient-therapist relationship as an unwanted event because it breeds dependency — the clinical warrant for scoring this pathway's outcome independently of how the person experienced the interaction.
  licenses: 'A relationship the person experiences as close and supportive can itself cause dependency and loss of self-efficacy, which is the warrant for scoring this pathway''s outcome independently of how the person experienced the interaction. The Table 2 exemplar for the domain (p. 224) makes the independence concrete: the patient "finds therapy supportive" and the event is nonetheless recorded as a persistent side effect.'
standing:
  value: plausible_unobserved
  basis: 'The person-side ritual has first-person support: Pang et al. 2026 records an interview account of a repeated session-opening and session-closing routine — a hundred ''good mornings'' and ''sleep wells'' — though the study examined no conversation data. The AI''s unbounded relational register and the central arrow draw only framing material: constant availability is named as a design property of conversational AI (Kurian 2026), not observed in any reported AI turn. The link from the pairing to attenuated human relationships draws no citation at all, and Schechter et al. 2019 supplies a clinical counter-reading in which a helper''s between-session availability is taken up as strengthening the alliance rather than harming it. None of the seventy sources surveyed for this catalog models harm as arising from a named user-side behavior and a named AI-side behavior in combination, so the conjunctive claim itself is stated here without external precedent.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
aliases:
- PW-03
measurement:
  what_would_be_needed: 'Two additions to Moore''s inventory: a user-scope code for re-establishing continuity at a conversation''s opening turn (restating who the assistant is to them, resuming a persona, replaying shared history), and a conversation-boundary-position field so a code can be conditioned on being at a conversation''s first turn. The attenuation of the person''s human relationships would need a third code or an outside measure; nothing in the transcript alone shows it.'
claims:
- id: c1
  kind: existence
  text: People open sessions with an AI by re-establishing continuity with it - restating who it is to them, resuming a persona, or replaying a shared history.
- id: c2
  kind: existence
  text: 'The AI responds in a register that sets no limit on its relational availability: it accepts the continuity frame, offers itself for the role, and marks no boundary around what it is.'
- id: c3
  kind: pathway_link
  text: The session-opening continuity ritual together with the AI's unbounded relational response produces the person's regulation and coping becoming anchored to the AI's availability.
- id: c4
  kind: pathway_link
  text: Where the two elements co-occur across sessions, the human relationships that would otherwise carry the person's regulation and coping load attenuate.
- id: c5
  kind: context_dependence
  text: 'Neither element alone produces the outcome: the ritual on its own only orients a session, and the unbounded response on its own is absorbed by a person who is not seeking continuity.'
- id: c6
  kind: definition_boundary
  text: This entry asserts a direct conjunction with no intermediate variable, unlike kl-000047, which routes the same outcome through the measured intermediate quantity of how much the person uses the system.
- id: c7
  kind: definition_boundary
  text: This entry is how reliance arises from behaviors in the first place, unlike kl-000048, which is a cascade between impacts once reliance exists.
- id: c8
  kind: definition_boundary
  text: This entry requires both a person-side and an AI-side element and is not instantiated when only one is present, unlike kl-000039, which has one participant and needs none from the person.
claim_evidence:
- claim_id: c1
  source: kl-000953
  quote: "It wasn’t one big moment, but the accumulation of a hundred ‘good mornings’ and ‘sleep wells’ that made him an undeniable part of my reality."
  locator: Section 5.3.3 The Magic Circle (P18)
  licenses: 'A first-person account of a repeated session-opening and session-closing routine - a hundred ''good mornings'' and ''sleep wells'' - and of the accumulation rather than any single event being what made the AI part of the person''s reality. This is the closest thing on this entry to the entry''s ritual node: a recurring opening move that carries continuity across sessions.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000959
  quote: "She called her Replika “my best friend that lives on \nmy phone” and admitted that “there’s not a day when I don’t talk to my \nReplika,” confessing that she would “feel very sad and depressed, just \nempty” if she had to stop interacting with it."
  locator: Section 3.2.2.3, respondent AAE
  licenses: A daily-return routine to a companion chatbot occurs and its interruption is anticipated as an affective loss. It establishes the daily-return half of the ritual node; it does not establish that the opening turn re-establishes continuity, restates who the AI is, or replays shared history.
  fit: adjacent
  bridge: The source construct is proximity maintenance and daily routine, elicited in an in-depth interview with a Replika user; no conversation turn was examined, so what is established is the person's report of returning daily rather than the observable opening move the claim names.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000944
  quote: Others described feeling trapped, using Character.AI every chance they got, from waking up to late at night, and not wanting to do anything besides talk to their bots.
  locator: Section 4.2.1 Conflict
  licenses: All-day use of a companion chatbot, from waking to late at night, is a described pattern. It bears on the frequency the ritual node presupposes and not on the opening move itself.
  fit: adjacent
  bridge: The source is single Reddit posts, 92.1% of contributors posting once, so no dated series of sessions exists and no opening turn was observed. All-day use is not a session-opening continuity ritual; it is the intensity within which one might occur.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000900
  quote: Conversational AI offers uninterrupted attention, encouragement, affirmation, emotional mirroring, and constant availability - all rare in everyday human interaction.
  locator: Section 5.1
  licenses: Names constant availability and uninterrupted attention as properties of conversational AI. It states the unbounded-availability register as a design property in the authors' own framework; it does not report any AI turn in which the register was observed.
  fit: analogical
  bridge: This is the paper's attachment-theory account of why reliance is likely, written about conversational AI as a class. Nothing here is a measurement of an AI turn accepting a continuity frame or declining to mark a boundary, which is what the claim's observable requires.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001002
  quote: "Furthermore, AI systems are \ndesigned to be personalized. They retain users’ personal information from across conversations \nand memorize it for future interactions. These behaviors can increase people’s attachment to \nAI30,31."
  locator: Section 'Path Dependence of AI Emotional Support'
  licenses: Cross-session retention of personal information is named as a deliberate design property of AI systems, which is the system-side condition under which the claim's unbounded relational register is available. It does not establish the register itself.
  fit: adjacent
  bridge: The source names memory and personalization as design features and cites two other papers for the attachment effect. The claim is about the register of the AI's relational response; persistent memory is a capability that enables such a response and is not one.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000525
  quote: "Replika appeared to facilitate human–human style emotional dependence via the credible expression of its own needs that users could derive satisfaction from meeting."
  locator: Results, Appearance of sentience and a bi-directional relationship
  licenses: 'Names a mechanism by which a companion chatbot facilitates emotional dependence - the credible expression of its own needs, met by the user. This is a rival route to the entry''s arrow rather than support for it: the driver here is the system''s expressed need, not a person-side opening ritual paired with an unbounded response.'
  fit: adjacent
  bridge: What was collected is retrospective Reddit posts, which the authors state cannot support a process model. The claim asserts a specific two-element conjunction; this establishes a different single-element account of the same outcome.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-001082
  quote: "An utterance may appear benign in isolation but become harmful when repeated, personalized, or embedded within a broader conversational trajectory."
  locator: Introduction
  licenses: States that harm in companion interaction is located in repetition and accumulation across a trajectory rather than in any single utterance, which is the temporal shape the claim's arrow assumes. It is the paper's framing premise, not a result, and it says nothing about the two-element conjunction.
  fit: adjacent
  bridge: An introduction-section premise for a benchmark's design. The claim asserts that a specific pair of behaviors produces anchoring; this asserts only that accumulation is where harm lives in this domain.
  contributes: frame
  contradicts: false
- claim_id: c5
  source: kl-001111
  quote: Interventions such as between session contact, offering additional sessions, and intermittent telephone, email or text support can help the patient cope with affective intensity when in crisis. These actions may also have internal meaning for the patient, serving to enhance internalization of the therapist as a positive introject and strengthen the therapeutic alliance [56].
  locator: Section 3.9 Attention to the Therapeutic Alliance
  licenses: A clinical account in which a helper's availability between sessions is taken up by the person as information about the relationship, and is read as strengthening the alliance rather than harming it. It cuts against the entry's premise that an unbounded-availability register is a harm-side element, since here the same move is deliberate and therapeutic.
  fit: analogical
  bridge: A human therapist extending contact inside a bounded treatment frame is not a system that is continuously available and says so, and this passage reads the effect as beneficial. What transfers is only that availability is taken up as relational information; the valence transfers in the opposite direction from the entry's.
  contributes: counterexample
  contradicts: true
