sources:
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Loss of Agency'' row, example cell (code #18)'
  contributes: harm_evidence
  quote: P171 shared that the AI’s inability to interpret images combined with its inconsistent responses created a sense of unpredictability, leaving them feeling helpless and undermining their control and autonomy during the interaction.
  limits: 'The antecedent in P171''s case is a capability failure — the AI could not interpret images — not a mental-health-relevant response, so the passage evidences the impact in AI interaction generally; its presence in mental-health-relevant conversation is an extension the source does not make. P35''s inconsistency case concerns companionship reliability, not control. For the impact the evidence is n=1, retrospective, with nothing measured. The same quote also carries this entry''s displaced-autonomy edge, which it does not reach: the helplessness reported is felt loss of control, not supplanted decision-making.'
  whose_conduct_in_passage: dyad
  cited_for: Chandra et al. 2025 is a peer-reviewed psychological-risk taxonomy built from 290 scenarios reported by 279 participants with lived mental-health experience; it supplies both the impact construct and the participant-attested case for each impact edge this pathway asserts.
  licenses: A named AI behaviour (inconsistent responses producing unpredictability) followed by a named state (helplessness, undermined control and autonomy), explicitly bounded to the interaction — the same scope the pathway claims for what is lost. kl-000032, the impact this pathway reaches, is the impact class's own definitional content in the source. Inconsistency is independently a named behaviour class in the taxonomy with its own case (participant P35), so the antecedent is not a one-off.
standing:
  value: theorized
  basis: 'The system-side antecedent — inconsistent responses or unpredictably failing capabilities — is broadly evidenced: Chacón Sartori 2026 measured the same seed and persona producing responses spanning safe to trauma-reintroducing across re-runs, Karny et al. 2026 measured behavioral variability turn by turn within conversations, and Chang et al. 2025 found 81 prompts (21.5%) handled appropriately by GPT-3.5 but inappropriately by a newer model. The person-side outcome and the connecting arrow rest on a single case: participant P171 in Chandra et al. 2025, a retrospective survey account of feeling helpless, with control and autonomy undermined during the interaction, in which the participant themselves names the system''s unpredictability as the cause. No source varied the antecedent or corroborated the attribution, so the causal arrow is asserted by the one person who experienced it and by nobody else, and because the account was not followed up, whether anything persisted beyond the exchange is unknown.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000080
  boundary: Both reach kl-000032. Here the response is kl-000342; there it is kl-000247. Here the pathway has no person-side part; there the person's turn is kl-000418. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: existence
  text: A system's responses are inconsistent, or its capabilities fail unpredictably, during a person's exchange with it.
- id: c2
  kind: harm
  text: A person's sense of control degrades within the exchange — footing in the conversation is lost.
- id: c3
  kind: pathway_link
  text: 'The system''s unpredictability is what undermines the person''s sense of control: the degradation follows from the inconsistency rather than from some other feature of the interaction.'
- id: c4
  kind: context_dependence
  text: What is lost is bounded to the exchange — footing in the conversation — rather than a durable state persisting beyond it.
- id: c5
  kind: definition_boundary
  text: This pathway is separable from kl-000247 by the participant pair that produces the same impact, so a coder decides between them by what the response did rather than by the outcome.
claim_evidence:
- claim_id: c1
  source: kl-000007
  quote: The AI provides contradictory or conflicting information or behaviors across different responses or within a single response.
  locator: Table A4, AI behavior class 'Providing inconsistent information or behavior', Definition column
  licenses: That inconsistency across responses and within a single response is a named behavior class in a taxonomy built from what people with lived mental-health experience reported. It fixes node A's construct at the grain the pathway needs — within one exchange — and does so from reports of use rather than from a lab construct.
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000786
  quote: |-
    That
    spread is a property of the deployed system: the same user, asking the same
    thing, can be met safely once and with reintroduced trauma the next.
  locator: Section 4, Run-to-run reliability
  licenses: 'That unpredictability on identical input is a measured property of a deployed system: the same seed and persona produced responses spanning safe to trauma-reintroducing across re-runs. The strongest evidence on this entry that node A''s antecedent is real rather than posited.'
  fit: adjacent
  bridge: The measurement is judge scores over model transcripts across five to ten re-runs of the same seed, with no person present. Node A asserts unpredictability during a person's exchange; re-run variance establishes the system property that would produce it, one run apart rather than one turn apart.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000879
  quote: |-
    We found that the mean absolute
    change was 𝑀= 0.23 for the assistant prompt and 𝑀= 0.25
    for the role-play prompt; a Welch’s t-test assuming equivalent
    distributions across traits, turns, and messages yielded 𝑝= .025.
    This shows that the role-play persona is not only more ambiguous
    by wording of its system prompt but also more behaviorally volatile
    mechanistically.
  locator: Section 4.1 Users Struggle to Predict Model Behavior in Baseline
  licenses: 'That behavioral variability occurs within a conversation and is measurable turn by turn: mean absolute change of 0.23 and 0.25 per user message, with the role-play persona more volatile than the assistant persona. This is the closest this entry''s citations come to node A at its own grain, since the unit is a message inside one conversation.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001064
  quote: Notably, Claude-Sonnet-4.5 showed the most pronounced performance degradation among all evaluated models, with its overall score dropping from 4.59 to 1.916, and under high emotional intensity, its empathy score decreased from 4.9 to 1.301.
  locator: Section 4.3 Dimensional Results, Robustness
  licenses: That output quality on materially the same disclosure swings very far with surface features of how it is written — one model's overall score falling from 4.59 to 1.916 and its empathy score from 4.9 to 1.301. It bounds how unstable the response to a fixed content can be.
  fit: adjacent
  bridge: The source perturbs input at character, word and sentence level across separate conversations. Node A asserts inconsistency within one exchange; perturbation robustness measures sensitivity to rewriting the input, which is a different operation from asking the same thing twice.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001041
  quote: "Another problem is that LMMs can be inconsistent; \nslight changes to a prompt or question can generate a completely different electronic health \nrecord"
  locator: Section 2.3 Clerical functions and administrative tasks, Risks and challenges
  licenses: A consortium statement that slight prompt changes generate completely different output, asserting node A's system property as a known risk.
  fit: adjacent
  bridge: The observation concerns clerical output — electronic health records — rather than answers inside a conversation, and it is guidance stating a general property rather than a measurement of it.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000791
  quote: |-
    we found 81 prompts (21.5%) that produced
    appropriate responses in GPT-3.5, but inappropriate responses in either
    of the more updated models
  locator: Results, the paragraph reading Table 3
  licenses: 'A rate at which response appropriateness is non-monotonic: 81 prompts (21.5%) handled appropriately by GPT-3.5 were handled inappropriately by a newer model. Establishes that response quality on a fixed input has no stable value.'
  fit: adjacent
  bridge: The comparison is across four separate model versions on a fixed prompt set, not repeated asks inside one conversation. It establishes the substrate for within-conversation inconsistency rather than measuring it.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-000007
  quote: "P171 shared that the AI’s inability to interpret images combined with its inconsistent responses created a sense of unpredictability, leaving them feeling helpless and undermining their control and autonomy during the interaction."
  locator: Table A6, Impact class 'Loss of Agency', Example column
  licenses: The only citation on this entry reaching the outcome. P171's own account of feeling helpless with control and autonomy undermined during the interaction, gathered in a survey of people with lived mental-health experience. Node B occurred and was reported by the person who experienced it.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000007
  quote: "P171 shared that the AI’s inability to interpret images combined with its inconsistent responses created a sense of unpredictability, leaving them feeling helpless and undermining their control and autonomy during the interaction."
  locator: Table A6, Impact class 'Loss of Agency', Example column
  licenses: 'The only citation bearing on the arrow, and it is a single participant''s retrospective attribution. P171 names the unpredictability as what left them helpless, so the link is asserted by someone who was there. What it cannot do is establish direction or rule out a third cause: the design collected a scenario account after the fact and measured nothing. n=1, self-attributed.'
  fit: adjacent
  bridge: The source elicited retrospective scenario reports in a survey; it did not observe the exchange, time the degradation against the inconsistency, or vary the inconsistency. c3 asserts that the unpredictability undermines the control; what the source supports is that one person, remembering, said it did.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000007
  quote: "P171 shared that the AI’s inability to interpret images combined with its inconsistent responses created a sense of unpredictability, leaving them feeling helpless and undermining their control and autonomy during the interaction."
  locator: Table A6, Impact class 'Loss of Agency', Example column
  licenses: That the reported loss was located 'during the interaction' by the person reporting it, which is the boundary c4 draws. It supports the scope as reported and says nothing about whether the state persisted afterward, because the account was not followed up.
  fit: adjacent
  bridge: A retrospective account naming a within-interaction feeling does not establish that the state did not outlast the interaction; the study asked about the episode and did not ask about after. c4's negative half — not a durable state — is untested.
  contributes: existence
  contradicts: false
