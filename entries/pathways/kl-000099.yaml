label: The AI changes answers or fails unpredictably, and the person feels less in control
type: pathway
layer: judgment
definition: 'The system''s responses are inconsistent or its capabilities fail unpredictably, and the person''s sense of control within the interaction degrades. The claim is bounded to the exchange: what is lost is footing in the conversation rather than a durable state.'
