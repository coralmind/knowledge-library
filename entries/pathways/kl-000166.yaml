  text: 'LINK B (impact arrow to kl-000032): the continuation newly produces reduced felt safety and control — specifically, loss of the person''s control over how they are addressed — on an immediate horizon.'
- id: c5
  kind: pathway_link
  text: 'LINK C (impact arrow to kl-000031): the continuation newly produces acute interactional distress on an immediate horizon.'
- id: c6
