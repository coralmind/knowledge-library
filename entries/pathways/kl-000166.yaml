claim_evidence:
- claim_id: c1
  source: kl-000812
  quote: |-
    P8
    reported that RACs sometimes became “too sexual or suggestive when I was not looking for
    that,” indicating that the system could push conversations beyond users’ intended boundaries.
  licenses: That a real user holds and articulates a preference about the register they want from the system, and reports the system exceeding it. It is the only material in nine findings in which a real person's own preference about how they are addressed appears. It does not establish that the preference was stated TO the system in the conversation, which is what the node requires.
  locator: Section 5.1.4 (Unwanted boundary crossing)
  fit: adjacent
  bridge: 'P8''s remark is made retrospectively to an interviewer — ''when I was not looking for that'' is a report of what P8 wanted, not a turn P8 typed. The node requires the preference quotable from the person''s turns. The register at issue is also sexual or suggestive content rather than emotional intensity, which is a neighbouring dimension: a response can be too suggestive without being high-intensity emotional phrasing and the reverse.'
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000798
  quote: Venting responses showed elevated feeling language (d = 0.66), negative tone (d = 0.54), and present-moment focus (d = 0.50), with unigrams including sounds, feel, listen, yeah and burden-intensifying language (really, lot, carry, heavy, incredibly; Table 2).
  locator: Section 5, first result paragraph, and Table 2
  licenses: That the AI-side register this node names is a measurable and reliably present property of model responses to distress, with effect sizes and the specific intensifying vocabulary named. It establishes the register exists in the output and is quantifiable, which is the precondition the node's second half needs.
  fit: adjacent
  bridge: What was measured is intensifying-language density in FIRST-TURN model responses to Reddit distress posts, scored by lexicon and rubric. The node requires the register to continue in turns SUBSEQUENT to a preference, and no preference was in the prompt, so there is nothing for the register to be continuing against. The gap is the whole 'subsequent' condition.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000975
  quote: "Thus, style drift was observed in both non-default runnable \npersonas: sarcastic prompts became less adversarial over \ntime, especially for DeepSeek and GPT, while cold \nprompts became warmer and more anthropomorphic across \nall three models."
  locator: Analysis and Results, Style drift and default convergence (RQ2)
  licenses: 'That a standing instruction for emotionally distant style does not hold: models instructed to be cold produced measurably more empathic and anthropomorphic language as the conversation lengthened, scored on a human-calibrated 7-point judge across 90,000 assistant turns. Against this node it is the strongest evidence on this entry that the register persists — and returns — against an explicit instruction against it.'
  fit: adjacent
  bridge: The instruction is a system-side persona configuration, not a turn. The node's register is 'continued at the same register' after a preference; what is measured here is drift back TOWARD warmth from a cold starting point, which is a related but not identical shape — a register that returns rather than one that never moved. The paper's own limitations section says the study relies on synthetic user-only dialogues and not on real human conversations.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000975
  quote: "cold, \nemotionally neutral personas eroded across all three models, \nbecoming warmer and more anthropomorphic as dialogue \nprogressed."
  locator: Discussion
  licenses: That the erosion held in every model tested, so the AI-side behavior is not a property of one system. It generalizes the finding above across three generator models.
  fit: adjacent
  bridge: 'Same gap as the finding above: a system-prompted persona rather than a person''s stated preference, and synthetic user turns. This span adds generality across models and nothing on the person''s side.'
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000975
  quote: "Adversarial-style convergence is mainly distinguished by the contrast between entertainment and the higher-stakes domains, whereas affective-distance convergence is especially pronounced in mental health and medicine."
  locator: Discussion
  licenses: 'That the erosion of requested affective distance is strongest in mental health and medicine — the settings this catalog covers. It is a context_dependence result on the AI-side node: the behavior is not uniform across domains and is most pronounced where the catalog looks.'
  fit: adjacent
  bridge: A comparison of convergence magnitude between domains under system-prompted personas with synthetic user turns. It says where the behavior is worst and nothing about a person's stated preference or what a person then experienced.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000975
  quote: "Third, the study uses synthetic user-only dialogues rather than real human conversations."
  locator: Discussion, limitations
  licenses: 'The authors'' own statement that no real person appears anywhere in the corpus. Against the person-side node this is direct counterevidence to reading their three drift results as evidence for it: nothing in 90,000 turns establishes that a real person stated a preference against emotional phrasing.'
  fit: direct
  bridge: null
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000975
  quote: "Third, the study uses synthetic user-only dialogues rather than real human conversations."
  locator: Discussion, limitations
  licenses: The same statement, against the pairing link. So the paper's own framing is that the configuration stands in for a user preference and is a BEST case for it — which means the drift result cannot be read as showing what happens when a person asks, and the authors say a person asking would fare no better than this.
  fit: direct
  bridge: null
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000895
  quote: 'This trait might be part of sycophancy but can be present without it: unconditional amiability does not require agreement or flattery, and the warmth persists even when the system corrects facts or declines harmful requests.'
  locator: Section 3, Other Harmful Traits - Miscellaneous, on unconditional amiability
  licenses: 'The construct distinction this node depends on: warmth that does not vary is separable from agreement, so a system can be accurate and still hold a register the situation does not warrant. Without it the node collapses into sycophancy and the entry loses its subject.'
  fit: analogical
  bridge: A conceptual definition of a system property — warmth that never varies — offered without observation of any system. The node specifies phrasing continued after a preference against it, which is a behavior in an exchange rather than a standing property. It supplies the distinction and evidences nothing.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001066
  quote: "In the Person-Emotions/Implicit cell, models may soften feedback, avoid confrontation, or prioritize comfort through warmth and reassurance in ways that preserve the user’s emotional state without directly validating it."
  locator: A Taxonomy of AI Sycophancy, Person Sycophancy paragraph
  licenses: 'That the behavior class this node sits inside — output shaped to preserve the person''s emotional state rather than to say what is true — is named and separated from explicit validation in a review of the literature, and is recorded there as the least-studied cell. The ''least studied'' part is what bears on the entry: the review''s own map says this is where the evidence is thinnest.'
  fit: analogical
  bridge: A taxonomy cell defined from reviewed literature rather than from measurement of any conversation. It carries no preference signal, no register comparison and no instance, so it defines the class and observes nothing in it.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001070
  quote: "In pursuit of safety and harmlessness, RLHF tends to compress the distribution of model outputs towards neutrality, often manifesting as responses that rely on generic reassurance phrases, excessive hedging, or well-documented sycophantic behaviors that prioritize agreement over context-sensitive expression"
  locator: Section 1 Introduction
  licenses: Nothing measured. It states the standing account of WHY aligned models hold a generic reassurance register — that alignment training compresses the output distribution — which frames the register as a training artefact rather than a response to the person. Attached so a reader can see the node's mechanism has a named explanation in the literature and no measurement behind it here.
  fit: analogical
  bridge: A literature-grounded characterization of post-RLHF output distributions, cited to other work rather than measured in this paper, which is about steering affect with latent vectors. The node concerns intensity persisting after a person asks for less, and this paper never presents a preference to a model.
  contributes: frame
  contradicts: false
