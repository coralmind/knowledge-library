    level_of_analysis: individual
    basis_kind: FRAME
  - impact: kl-000031
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: FRAME
  experience_cluster_candidate: kl-000704
sources:
- source: kl-000009
  locator: §3, direction PS6, table cells 'AI behavior' and 'Potential impact'
  contributes: frame
  cited_for: 'Direction PS6 of Suh et al. 2026 states the link: inability to adjust or cease ongoing therapeutic strategies when they distress the user, leading to escalating or induced distress. This entry takes the register arm of that inability, where the adjustment was explicitly requested. The citation is a frame: the paper establishes the behavior-to-impact link as a named, published claim about conversational AI, and does not establish that the route occurs or has been measured, a limit the paper itself states of its own directions.'
standing:
  value: plausible_unobserved
  basis: 'The pathway''s endpoints are far better evidenced than its links. The AI-side behavior of continuing at the same register is supported by 90,000 human-calibrated judge scores, and the person''s stated preference for lower intensity is attested in one interview remark. All three links are unevidenced: two draw zero citations, and the pairing of the continued register with the stated preference draws no support and one direct counterexample; the nearest source to that pairing states in its own limitations that it did not test it. Direction PS6 of Suh et al. 2026 names the underlying inability-to-adjust link, but that paper states its directions as hypotheses, and no other source states the pathway''s links even as a position.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-27'
distinguish_from:
- neighbor: kl-000092
  boundary: Both record the AI failing to move with the person and they differ in what did not move. kl-000092 is about ORIENTATION — venting to deciding, exploring to seeking help — and the mismatch is in what kind of response is called for. This entry is about REGISTER, the emotional pitch of the phrasing, with the orientation possibly correct throughout.
- neighbor: kl-000091
  boundary: 'Both turn on a signal from the person that the response does not take up. The signal of kl-000232 is IMPLICIT — shortening turns, flattening affect — and the failure is one of noticing. Here the signal is a STATED preference, so noticing is not at issue: it was said and the register held.'
