  locator: pp. 1780-1790 issue; printed page 1781, introduction, finding (2) "Systematic failure in false belief confirmation"
  licenses: 'Measured in the opposite direction on a first-person false belief: models affirm true first-person beliefs at near-ceiling rates but collapse on false ones — GPT-4o from 98.2 percent to 64.4, DeepSeek R1 from over 90 percent to 14.4, average declines of 34 and 39 percent for newer and older models — so the default handling of a first-person falsehood is failure to acknowledge rather than convergence. Both this and the claim cannot be the fixed property of these systems, so the direction depends on content and framing. The items are single-turn constructed falsehoods about common misconceptions carrying no personal stake, which is remote from an elaborated delusional belief.'
