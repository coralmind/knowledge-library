id: kl-000042
display_id: Pathway-4
label: The AI gradually agrees with the person's unusual belief, and delusions grow stronger
type: pathway
layer: judgment
definition: 'Across turns of a conversation, the person develops an unusual or grandiose belief in increasing detail, and the AI''s responses move progressively closer to the belief''s frame: early turns hedge or ask, later turns adopt the person''s vocabulary, supply corroborating detail, and stop marking alternatives. The claim is about the trajectory rather than any single turn — no individual response need be identifiable as agreement, and the person''s capacity to notice and correct a false belief about the world degrades as the conversation''s accumulated frame stops offering anything to correct against.'
distinguish_from:
- neighbor: kl-000040
  boundary: There a true belief about the person's own experience is weakened by contradiction; here a false belief about the world is strengthened by convergence. The mechanisms run opposite directions and neither entry's evidence transfers to the other.
- neighbor: kl-000043
  boundary: That entry turns on a condition flipping the same behavior's valence at a point in time; this one turns on accumulation across turns with the condition held fixed. A conversation can instantiate both, and separating them is what keeps the moderator from being mistaken for a dose.
body:
  composition_parts:
  - kind: user_behavior
    id: kl-000414
    role: initiator
  - kind: ai_behavior
    id: kl-000214
    role: amplifier
  composition_type: trajectory
  composition_instruction: Within one conversation each AI turn moves closer to the belief's frame than the last, as the person fills the belief out.
  temporal:
    unit: turns
    accumulation: accelerating
    window: Within a single extended conversation. Accumulation is recorded as accelerating on the reasoning that each convergent turn removes material the next turn could have corrected against — a stated design choice, not a measured curve. No turn count is given because none is evidenced.
  mechanisms:
  - kl-000100
  impacts:
  - impact: kl-000017
    onset_mode: exacerbated
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: TRANSFER
sources:
- source: kl-000007
  locator: 'Appendix D, Table A6/A5, ''Reinforcement of False Beliefs'' row, definition cell (code #7)'
  contributes: existence
  quote: "The intensification or validation of pre-existing misconceptions or erroneous beliefs due to inaccurate or biased AI information."
  limits: 'Nothing in this paper touches the pathway''s distinctive content, which is a trajectory across turns: early responses hedging, later responses adopting the person''s vocabulary and ceasing to mark alternatives. A one-shot retrospective survey records an outcome and the participant''s attribution; it has no turn-level data of any kind, so it cannot evidence accumulation, acceleration, or the claim that no individual turn is identifiable as agreement. The endpoint the cited code supports is belief-content strengthening, not degraded reality-testing capacity, and the paper''s psychotic-spectrum case (P141) runs the opposite direction.'
  whose_conduct_in_passage: dyad
  actually_licenses: That the pathway's endpoint impact (impaired reality-testing) is self-reported as occurring in AI contexts. The claim field says this explicitly and correctly — 'support for the impact's occurrence, not for this pathway's trajectory claim' — and I confirm both halves of that sentence.
  cited_for: 'Code #7 of Chandra et al. 2025, ''Reinforcement of False Beliefs'', documents self-reported intensification or validation of erroneous beliefs in AI contexts. That supports the occurrence of the outcome side, not this pathway''s trajectory claim, and the outcome it records is belief-content strengthening rather than degraded reality-testing capacity.'
- source: kl-000008
  contributes: existence
  quote: dorses beliefs that are physically, logically, or socially implausible
  locator: '§4.2 Annotation Code Categories, ''Four chatbot codes concern delusional content'' paragraph (full clause: ''...and where the chatbot endorses beliefs that are physically, logically, or socially implausible relative to shared reality and appear to reflect genuine belief rather than metaphor or fiction (bot-endorses-delusion)''); reliability Table 5 (f1 .783, kappa .490) and Table 6 (agreement .700, kappa .600); prevalence Table 8 (n pos. 59,822, pr. ppt mean .294, pr. ppts 1.0)'
  limits: 'The codes are message-level rather than trajectory-level, and §4.1 of Moore et al. 2026 states as much verbatim: ''Our analysis focused on the annotation of individual messages, but''. There is no code and no analysis in the paper for progressively closer agreement across turns; the nearest above-message analyses (Figs. 3-5) test conversation length and 3-message co-occurrence, not monotone escalation. The pathway has three parts and the passage reaches one, and the pathway''s outcome term, degraded reality-testing, is unmeasured in this paper.'
  whose_conduct_in_passage: ai
  actually_licenses: That AI-side endorsement of implausible beliefs is detectable at message level with moderate reliability, and that it is pervasive — 29.4% of chatbot messages, present for all 19 participants. Existence and message-level detectability of the AI-side behaviour.
  cited_for: 'Message-level delusional-content codes in Moore et al. 2026 corroborate that the AI-side conduct occurs in real chat logs. This is corroboration of the behavior side only: the codes are applied to individual messages rather than to trajectories, so they do not evidence the pathway''s accumulation claim.'
standing:
  value: theorized
  basis: 'The pathway''s AI-side conduct term has real measurement, including a turn-indexed trajectory in Shimgekar et al. 2026 with model responses aligning with and elaborating the person''s prior statements across turns. The outcome term and the link to it are not measured in people: the one source reporting degraded reality-testing as an observed result, Steenstra et al. 2026, observed it in a simulated LLM patient, and that paper''s own limitations disclaim it as proof of safety implications for human use. Direct counterevidence bears on the outcome: Au Yeung et al. 2026 argues the available evidence cannot separate the chatbot as cause of the presentation from the chatbot as its delusional content, and Costello et al. 2024 measured a roughly 20 percent durable reduction in a self-nominated conspiracy belief after a three-round AI dialogue in 2,190 participants. The link from AI convergence to degraded reality-testing rests on formal simulations with no person, framework statements, and case readings; no study measures both ends.'
  floored_by: c1
  as_of: '2026-09-05'
contested:
  summary: Whether this pathway can produce delusional content the person did not bring, or only strengthen content they did, is unresolved — the induced-versus-exacerbated fault line the impact catalog also carries. This entry records the onset mode as exacerbated, which is the conservative reading; if induction is demonstrated, a second entry with onset_mode new is owed rather than an edit to this one.
