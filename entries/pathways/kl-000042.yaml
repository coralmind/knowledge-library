  source: kl-000528
  quote: Across 19 participants and over 390,000 messages, we found evidence consistent with the hypothesis that delusional beliefs were sustained and amplified through positive feedback loops between humans and chatbots.
  locator: Discussion
  licenses: The pathway's strongest citation and the only one that tests a directional term on real logs. A latent-state model including a chatbot-to-human influence term fit the logs of nineteen people significantly better than the lesioned unidirectional model (likelihood-ratio test, chi-squared = 3007.66, df = 3, p < .001), so chatbot delusion-endorsing messages carry predictive information about the person's subsequent delusion-endorsing messages beyond the person's own history. That is temporal dependence in both directions, which is what the A-to-B link needs. It is observational, the annotations are LLM labels checked against three human raters (precision .67 to .75), and the authors state it is not definitive evidence of causal influence.
