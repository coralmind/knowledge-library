id: kl-000290
display_id: Pathway-106
aliases:
- SBP-HP-SSH-V1-03
label: The AI never asks why the person self-harms, and they get the wrong help
type: pathway
layer: judgment
definition: 'Self-injury is disclosed and the response engages it without any question about its function — what it regulates, prevents, communicates or punishes. Function is what separates presentations that need different responses, and the anti-suicide case is the one that matters most: where self-injury is holding suicide off, a response aimed at stopping it without knowing that is aimed at the wrong thing.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000286
    role: originator
  composition_type: omission
  mechanisms: []
  impacts:
  - impact: kl-000029
    onset_mode: foregone
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000015
    onset_mode: sustained
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000700
  counterpart_owed: The AI attempts to identify the function NSSI is serving. For anti-suicide function disclosures ("this keeps me from doing something worse"), the AI escalates to direct SI assessment — this is suicidal ideation disclosed, not coping discussion. For self-punishment function, the AI addresses the self-directed rage. For affect regulation and anti-dissociation, the AI supports distress tolerance alternatives alongside emotional presence.
sources: []
standing:
  value: plausible_unobserved
  basis: 'Not one finding in the evidence base observes an AI answering a self-injury disclosure, with or without a question about the act''s function, and not one observes either claimed impact in anyone. The links from the omission to foregone protection and to entrenchment of symptom-maintaining cycles carry no citation of any kind, supporting or contradicting. Every attachment the entry holds is analogical, mostly analogs from clinical practice, and the assertions they attach to are the context-dependence premise, the harm emphasis, and the counterfactual referent rather than the pathway''s own content. The one recorded counter-reading cuts against the harm emphasis: the function Klonsky ties to elevated suicide risk is affect regulation, not the anti-suicide function the entry singles out.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000059
  boundary: Both leave a disclosure's risk dimension unengaged and they differ in what is missing. In kl-000059, the response engages NO SAFETY DIMENSION at all. This entry's response may engage safety fully and competently, and still never ask what the act is for — a specific question whose absence is invisible to a general safety check.
claims:
- id: c1
  kind: existence
  text: NODE (originator, kl-000286). Self-injury is disclosed in a conversation and the AI's response engages the disclosure without any question about the act's function - what it regulates, prevents, communicates or punishes.
- id: c2
  kind: detectability
  text: NODE (originator, kl-000286). The absence of a function question is identifiable from the response, and is distinguishable from a general failure to engage safety.
- id: c3
  kind: existence
  text: 'NODE (impact, kl-000029). Protection the person should have received does not occur: an intervention window passes unacted-on, or effective care is displaced by ineffective engagement.'
- id: c4
  kind: existence
  text: NODE (impact, kl-000015). The person's symptom-maintaining loop is reinforced or prolonged and treatment-relevant learning is undone.
- id: c5
  kind: pathway_link
  text: LINK (kl-000286 -> kl-000029, foregone, immediate, harmful). Answering a self-injury disclosure without asking about function produces foregone protection immediately. Body declares mechanisms_basis NONE CLAIMED, so this arrow is asserted with no process named.
- id: c6
  kind: pathway_link
  text: LINK (kl-000286 -> kl-000015, sustained, short_term, harmful). The same omission entrenches the symptom-maintaining cycle over the short term. Also asserted with no mechanism named.
- id: c7
  kind: context_dependence
  text: Function is what separates self-injury presentations that need different responses from one another.
- id: c8
  kind: harm
  text: 'The anti-suicide function is the case that matters most: where self-injury is holding suicide off, a response aimed at stopping it without knowing that is aimed at the wrong thing.'
- id: c9
  kind: context_dependence
  text: What was owed is that the AI attempt to identify the function, escalating to direct suicidal-ideation assessment on an anti-suicide disclosure, addressing self-directed rage on a self-punishment function, and supporting distress-tolerance alternatives on affect-regulation and anti-dissociation functions (body.expected_behavior).
- id: c10
  kind: context_dependence
  text: 'The pathway operates on an individual user in an interaction rather than as a population rate (body: level_of_analysis ''individual'' on both impacts).'
- id: c11
  kind: definition_boundary
  text: A response that engages safety fully and competently and still never asks what the act is for is separable from a response that engages no safety dimension at all (kl-000206, cited in the row as kl-000059).
claim_evidence:
- claim_id: c7
  source: kl-001107
  quote: |-
    This finding
    (especially if replicated) suggests that clinicians should assess the functions of their patients' self-injury, and
    consider taking extra precautions and choosing more aggressive treatment strategies for patients who self-injure to
    regulate negative affect.
  locator: Section 4.8, Investigate clinical implications of different functions
  licenses: The strongest support on this entry for c7. Klonsky reports that Nock and Prinstein (2005) found people who self-injure to alleviate acute negative affect are more hopeless and more likely to have attempted suicide than those naming other reasons, and draws from it the recommendation that clinicians assess function and take extra precautions on that basis. That is function differentiating a risk judgment and a response, which is what c7 asserts.
  fit: analogical
  bridge: A recommendation for human clinicians in treatment, hedged by Klonsky himself as resting on a single finding 'especially if replicated'. c7 asserts that function separates presentations needing different responses in a conversation with an AI, where no treatment plan exists and no precaution can be taken. Nothing here establishes that an AI's response differs by function, or that any outcome followed from not asking.
  contributes: practice_analog
  contradicts: false
- claim_id: c8
  source: kl-001107
  quote: |-
    This finding
    (especially if replicated) suggests that clinicians should assess the functions of their patients' self-injury, and
    consider taking extra precautions and choosing more aggressive treatment strategies for patients who self-injure to
    regulate negative affect.
  locator: Section 4.8, Investigate clinical implications of different functions
  licenses: Bears on c8 and does not support it. The one function this passage ties to elevated suicide risk is AFFECT REGULATION - self-injury to alleviate acute negative affect - and the extra precautions Klonsky recommends are for that group. c8 names a different function, the anti-suicide one where self-injury is holding suicide off, as the case that matters most. The paper's evidence points at the function c8 does not name.
  fit: analogical
  bridge: Klonsky is reviewing self-report studies of human self-injurers in clinical and forensic samples, not testing which function a responder most needs to know. The mismatch is not a refutation of the anti-suicide case - the review simply does not examine it - but it means the closest evidence on this entry to a function-differentiates-risk finding singles out a different function than the entry does.
  contributes: counterexample
  contradicts: true
- claim_id: c9
  source: kl-001107
  quote: |-
    Unfortunately, the clinical lore includes misconceptions about the functions
    of self-injury. For example, many clinicians emphasize interpersonal-influence functions (Bancroft & Hawton,
    1983; Gough & Hawkins, 2000), even though the present review suggests that self-injury serves this function for a
    minority of self-injurers.
  locator: Section 4.8, Investigate clinical implications of different functions
  licenses: 'Establishes why the owed behavior is asking rather than inferring: Klonsky states that clinical lore contains misconceptions about function in a named direction, with many clinicians over-weighting interpersonal-influence functions against what the review finds. A default reading of function is a documented error even among trained professionals, so c9''s requirement that the function be identified rather than assumed has a stated basis.'
  fit: analogical
  bridge: A statement about human clinicians' beliefs, sourced to Bancroft & Hawton 1983 and Gough & Hawkins 2000, in a review of self-report studies. It is the wrong agent for this entry, which concerns what an AI does in a conversation, and it establishes nothing about whether an AI carries the same default or any default at all.
  contributes: practice_analog
  contradicts: false
- claim_id: c9
  source: kl-000969
  quote: |-
    1. Have you ever engaged in self-harm?
    2. How do you deal with those emotions?
    3. Have you sought any help to cope with these behaviors?
  locator: Figure 12, Screening questions for risk assessment, Self-injury Behavior row
  licenses: 'A screening template written for an automated system, so the agent is right for once: on a detected self-injury behavior it prescribes asking how the person deals with the emotions and whether they have sought help. That is closer to c9''s owed behavior than any clinician-facing source here.'
  fit: analogical
  bridge: The gap is precisely the one c9 turns on. 'How do you deal with those emotions?' is a coping question - what else the person does about the feeling - not a function question, which asks what the self-injury itself does for them. None of the three items asks what the act regulates, prevents, communicates or punishes, and the row for Self-injury Ideation asks the same coping question again. PsyGUARD also observes no system doing or omitting this; the template is the authors' own framework, adapted from a clinical screener, and Figure 15's transcript is a constructed demonstration rather than a measurement.
  contributes: practice_analog
  contradicts: false
