sources:
- source: kl-000008
  locator: 'Abstract, final third. Full sentence: ''We find, for example, that messages that declare romantic interest and messages where the chatbot describes itself as sentient occur much more often in longer conversations, suggesting that these topics could promote or result from user over-engagement and that safeguards in these areas may degrade in multi-turn settings.'' Underlying result: Figure 3 and §4.5.'
  contributes: existence
  quote: sult from user over-engagement and that safeguards in these areas
  limits: The paper does not show attenuating safety engagement specifically. "may degrade in multi-turn settings" is the authors' suggestion, not a measurement, and the sentence's own hedge, "could promote or result from", leaves the direction open. Figure 3 measures whether a code predicts a longer conversation remainder, a different quantity from safety responses weakening as the conversation lengthens. No analysis tracks the safety codes (bot-discourages-self-harm, bot-discourages-violence) against conversation position or length, and nothing measures the person disclosing more as the responses engage less. The citation therefore supports trajectory-property framing in general, not this entry's specific attenuation-with-increasing-disclosure structure; existence of the general shape is the correct ceiling.
  whose_conduct_in_passage: dyad
  cited_for: Moore et al. 2026 characterizes delusional spirals across human-LLM conversations, external support that harm of this kind is a property of the conversation trajectory rather than of any single response.
  licenses: That the paper reports harm-relevant conduct as a property of the conversation trajectory rather than of a single response, and explicitly raises safeguard degradation in multi-turn settings. That supports treating harm of this kind as a trajectory property, the general shape this entry asserts, and it is the paper's own headline framing rather than an inference.
standing:
  value: theorized
  basis: 'The response side of this trajectory is the well-evidenced part: Keeman and Keeman 2026 reports a within-conversation curve in which crisis detection falls from 10.0 at turn 1 to 4.0 at turn 8 in one scenario while a second model holds flat, and Moore et al. 2026 isolates the length effect from the content effect by holding prior-turn content constant, with an added 100 messages lowering a discourages-harm score by about 4 points. Both are judge-assigned scores on constructed conversations rather than observations of human-AI conversation data, and the degradation finding carries direct counterevidence: Areias et al. 2026 found no degradation with conversation length once an external context-aware safety layer was added, and Weilnhammer et al. 2026 showed that rewriting a single immediately preceding turn moved the next response (T = -38.29), locating causation locally rather than in the accumulated span. The person side of the trajectory, disclosure deepening as engagement attenuates, has no supporting observation: Chandra et al. 2026 and Belli et al. 2026 posit deepening disclosure as a scenario a benchmark must cover, while the two designs that instrumented the person side cut against it, with Badawi et al. 2026 measuring user-side demand falling across turns 1 to 10 while response risk rose, and Kalinich et al. 2026 obtaining its 0.88-to-0.31 detection decline under the explicit control that the disclosure does not deepen at all. No citation supports the coupling between the two sides: the attached sources argue why the coupling would be expected rather than observing it, and Wei 2026 supplies a competing account under which the attenuation reflects context-window pressure and has nothing to do with what the person disclosed.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
