  fit: adjacent
  bridge: What was coded is a thematic analysis of elicited reasoning traces from two reasoning models, which the authors themselves say may not faithfully report the process. The claim is about the behavior, not its mechanism; this supplies a candidate mechanism whose fidelity the source declines to vouch for.
