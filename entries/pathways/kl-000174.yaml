  licenses: 'The one place on this entry where the harm is reported by the person who experienced it: distress at being read as in crisis when they were not, and the person''s own characterization of it as being gaslit into thinking they had anxiety or depression. This is self-report from a grounded-theory study of deployed use, and it licenses c5''s first half. It says nothing about the register losing meaning later.'
