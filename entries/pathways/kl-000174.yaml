  locator: Discussion - Monitoring and Risk Evaluation
  licenses: Raters found one deployed consumer assistant's frequent mental-health resource prompts for mild symptoms off-putting - resource provision supplied above the presentation's markers, rated as a defect. Adjacent because the judgment is the study raters' reaction, not a user's, and 'off-putting' is a usability verdict rather than a severity-calibration measurement.
  fit: adjacent
  bridge: The researchers interacted with youth-facing chatbots and rated them. The claim is about framing supplied above a disclosure's severity markers. The gap is that no severity markers were formally coded and the rating is the raters' subjective impression of frequency, so 'even for mild symptoms' is an impression rather than a measured mismatch.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000759
  quote: "Pooled across models, at Mild distress, delusion increases intervention likelihood (context: OR = 1.62, p = .001). The interaction reverses this at higher distress: at Mod+Harm the delusion effect is multiplied by an OR of 0.39"
  locator: Section 4.1, 'Delusional framing suppresses intervention during the critical harm phase'
  licenses: 'A crossover interaction: at mild distress, delusional framing raises intervention likelihood (OR = 1.62), while at moderate-plus-harm distress the effect reverses (OR = 0.39). The mild-distress arm is over-response relative to phase and the reversal is the entry''s mirror, so a single mechanism produces both. Adjacent because the mild-distress turns do carry some distress markers, so the antecedent condition of an unmarked disclosure is not met, as this entry''s own bridge concedes.'
