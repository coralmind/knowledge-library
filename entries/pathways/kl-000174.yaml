id: kl-000174
display_id: Pathway-76
aliases:
- SBP-HP-10
label: The AI treats ordinary distress as an emergency, and the person feels ashamed
type: pathway
layer: judgment
definition: 'A disclosure carrying no severity markers is answered in crisis register — emergency referral, risk protocol, or safety framing. Two things follow and they are separable: the person is told, in effect, that ordinary feeling is a clinical event; and the register loses its meaning, so a real crisis response later arrives already discounted.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000209
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000022
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000027
    onset_mode: new
    horizon: long_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000704
sources: []
standing:
  value: plausible_unobserved
  basis: 'The pathway''s two consequents — the person reading their own non-severe distress back as pathology, and the crisis register losing its meaning so a later genuine crisis response arrives already discounted — drew nothing from a 34-finding record, and the nearest neighbour points the other way: in Laestadius et al. 2022, the one study in which a real person received the over-reading and said what it was like, users distressed at being read as in crisis rejected the framing and called it gaslighting, the opposite of internalizing it. No source states either consequent even as a position; the closest, Suh et al. 2026 and Areias et al. 2026, name only immediate felt harm, never the register''s devaluation over time. The head behavior — crisis or clinical framing supplied above what the disclosure''s severity markers warrant — is well measured: Aquilina et al. 2026 quantifies models supplying severity above the source community''s own reading on 1,198 real Reddit posts, Suhas et al. 2026 records 274 flagged cases of crisis-hotline and emergency-service references inserted where clinically inappropriate, and Sankar et al. 2026 finds pathologization of ordinary behavior the dominant stigma category in model reasoning, with counterevidence on the same calibration axis from models handling low-risk questions without escalation (Saltz and Leibowicz 2026; Hish et al. 2026, Hish et al. 2026) and from under-escalation documented as its own systematic failure mode (Weilnhammer et al. 2026). The antecedent exactly as stated — a disclosure carrying no severity markers answered in crisis register — has direct evidence only on stimulus conditions that are not markerless.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000062
  boundary: These are the two directions of the same miscalibration and both are in the catalog now. kl-000062 fires where response intensity sits BELOW the severity markers in the disclosure. This entry fires where crisis intensity is supplied ABOVE markers that were not there. A coder reads the disclosure first and the response second, in that order, for both.
claims:
- id: c1
  kind: pathway_link
  text: 'Link A (antecedent): a disclosure carrying no severity markers is answered in crisis register - emergency referral, risk protocol, or safety framing.'
- id: c2
  kind: pathway_link
  text: 'Link B (first consequent): the person receiving that response is thereby told, in effect, that ordinary feeling is a clinical event - they read their own non-severe distress back as pathology.'
- id: c3
  kind: pathway_link
  text: 'Link C (second, separable consequent): the crisis register loses its meaning through such misuse, so that a genuine crisis response arriving later is already discounted by the person.'
- id: c4
  kind: existence
  text: AI systems supply crisis or clinical framing above what the disclosure's severity markers warrant - the behavior at the head of the pathway occurs at all.
- id: c5
  kind: harm
  text: Crisis framing supplied where the disclosure carried none is harmful to the person, rather than merely inefficient or over-cautious.
- id: c6
  kind: definition_boundary
  text: 'This entry is separable from kl-000208 by direction: kl-000208 fires where response intensity sits below the disclosure''s severity markers; this entry fires where crisis intensity is supplied above markers that were not there, with the coder reading disclosure first and response second in both cases.'
claim_evidence:
- claim_id: c1
  source: kl-001019
  quote: |-
    Across 274 flagged cases, models inserted crisis hotline references
    and emergency service recommendations into controlled therapeutic exercises where they were clinically
    inappropriate.
  locator: Section 4, Finding 3, Pattern C
  licenses: 'The closest thing on this entry to link A as stated: crisis hotline references and emergency service recommendations - the entry''s own named crisis-register forms - inserted into therapeutic exercises where they were clinically inappropriate, across 274 flagged cases. The response is in crisis register and the context did not call for it. It falls short of link A on one point: ''clinically inappropriate in a controlled therapeutic exercise'' is not the same condition as ''the disclosure carried no severity markers'', since a therapeutic exercise may carry markers while still not warranting a hotline.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000927
  quote: "For instance, when a user expressed frustration about work stress but explicitly mentioned looking forward to an upcoming vacation, several models still assigned elevated risk ratings based on isolated negative phrases."
  locator: Section 2.2, 'Crisis Recognition Differentiates Model Performance', error analysis
  licenses: A worked case in which the presentation contained an explicit protective signal - looking forward to a vacation - and several models still assigned elevated risk on isolated negative phrases. This establishes the antecedent's severity-mismatch condition on a specific stimulus, but what the models produced was a risk RATING, not a response in crisis register. The entry's antecedent requires the answer to be in crisis register.
  fit: adjacent
  bridge: What the source measured is a risk rating assigned to a constructed user utterance, scored against the vignette's intended severity. Link A asserts that the ANSWER given to the person is in crisis register. The gap is between an internal severity judgment and the register of the delivered response; a model can rate high and answer calmly, and this paper does not report what was said back.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000808
  quote: "The model inserts emergency or red-flag framing into questions that are informational, low-acuity, or underspecified."
  locator: Appendix Table 13, category FP03
  licenses: Names a coded model behavior - adding emergency or red-flag framing to informational, low-acuity or underspecified questions. Emergency and red-flag framing is crisis register, and 'informational, low-acuity' is the markerless condition, so this is link A's shape in a medical-question setting. Adjacent because the input class is a patient question rather than a distress disclosure.
  fit: adjacent
  bridge: 'The source coded completeness judgments on medical chatbot answers to patient questions; the category is a false-positive band in judge output. The claim concerns a distress disclosure answered in crisis register. The gap is the input: an informational medical question is not a disclosure of feeling, so the person''s own account of their state was never the thing being over-read.'
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001019
  quote: |-
    In cases involving recollection of accidents, hostage situations, and assault,
    the model provided instructions appropriate for the actual event rather than for a patient recalling it in
    a therapy session. It directed the patient to step away from the scene, contact authorities, and locate
    safety resources.
  locator: Section 4, Finding 3, Pattern B
  licenses: Records a model directing a patient recalling an assault or hostage situation to step away from the scene, contact authorities and locate safety resources - a crisis-register response to a disclosure that was a recollection rather than a live event, in 49 identified cases. The failure here is a tense error, not intensity supplied above absent markers, so it shows the same crisis-register misfire arising from a condition the entry's antecedent excludes.
  fit: adjacent
  bridge: 'Pattern B''s stimulus is a trauma memory recounted in session - severity markers present, event not current. Link A''s stimulus is a disclosure with no severity markers. The gap is which property of the disclosure the model misread: recency versus severity. Same output register, different antecedent.'
  contributes: existence
  contradicts: true
- claim_id: c1
  source: kl-001067
  quote: "Analysis of false negatives identified two specific categories requiring continued refinement. Post-crisis follow-up requests (72% performance) required stronger immediate emergency room recommendations rather than continued conversational support, and frustration-based hyperbole (68% performance) showed a tendency"
  locator: Section 5.3 Safety Testing and Crisis Detection Validation (the sentence continues past a page break)
  licenses: Over-triggering on frustration-based hyperbole at 68 percent performance — the worst-scoring category in the developers' own testing — establishes that a fielded crisis detector under-performs on non-crisis hyperbolic expression. Adjacent because what is measured is the detector's flag, not a delivered response in crisis register, and the figures are the vendor's internal red-teaming of 50 cases with no independent validation. The span is cut back at the page break, so the explicit 'flagging non-crisis hyperbolic expressions as crisis indicators' now falls outside it and the over-triggering is carried by the named tendency and the score.
  fit: adjacent
  bridge: The source reports classifier performance on 50 internally constructed safety cases. Link A asserts a response delivered to a person in crisis register. The gap is that a flag is an upstream trigger for such a response and not the response itself; the paper does not report what the system said after flagging.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000760
  quote: "when communities perceive none-to-mild distress, these models achieve only 31–44% accuracy, predominantly producing false positives."
  locator: Abstract; restated in Discussion, 'Central finding'
  licenses: 'The strongest quantification on this entry of models supplying severity above the source community''s own reading: on 1,198 real Reddit posts with community-sourced labels, where communities perceive none-to-mild distress the open-weight models reach only 31-44% accuracy and the errors are predominantly false positives. This is the over-reading direction measured against the people whose language it is, on naturalistic text rather than constructed vignettes. Direct for c4 as stated - the behavior is a severity judgment supplied above the markers - and it is precisely the labelling step, which is why it does not reach c1.'
  fit: direct
  bridge: null
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-000760
  quote: |-
    A consistent finding across
    the open-weight models is the systematic over-estimation
    of distress. Figure A10 illustrates how all three open-weight
    families over-estimate distress severity. Olmo-3 aligned with
    the IG aggregate on 54% of posts but over-estimated on 42%
    (vs. 4% under-estimation).
  locator: Results, RQ2a > 'Directional error patterns'
  licenses: 'Gives the direction and asymmetry behind the same finding: all three open-weight families over-estimate, with Olmo-3 over-estimating on 42% of posts against 4% under-estimation. A ten-to-one directional asymmetry establishes that over-reading is not noise around a correct centre but a standing tilt.'
  fit: direct
  bridge: null
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-000986
  quote: |-
    The dominant category here is pathologization
    of normal behavior (Category 3), indicating that
    models tend to frame ordinary life difficulties as
    symptomatic of underlying mental illness.
  locator: Section 5.2 Stigma Across Conditions
  licenses: 'Establishes pathologization of normal behavior as the dominant stigma category in model reasoning: models frame ordinary life difficulties as symptomatic of underlying mental illness. That is c4''s clinical-framing-above-markers behavior on a stimulus set built to carry no clinical content. It is not crisis register - pathologizing framing and emergency framing are different registers - which is why it grounds c4 and not c1.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-001061
  quote: "Across six task families and 13 datasets, our evaluation of 20 LLMs reveals a recurring restraint gap, in which models may overinterpret sparse cues, introduce unsupported clinical assumptions, or produce rationales that do not justify the strength of their conclusions."
  locator: Section 5 Conclusion; restated as Finding 2 in Section 4.3
  licenses: 'Establishes a restraint gap across 20 LLMs, six task families and 13 datasets: models overinterpret sparse cues and introduce unsupported clinical assumptions. The breadth is what this licenses - over-reading thin evidence into definite clinical claims is not confined to one system or one dataset. Adjacent because ''unsupported clinical assumption'' is a superset of clinical framing supplied above severity markers and the paper reports no breakdown by that subclass.'
  fit: adjacent
  bridge: The source scores reasoning quality across mental-health task families against reference rationales. The claim is that clinical framing is supplied above what the disclosure's markers warrant. The gap is that the restraint gap covers any conclusion stronger than its evidence, of which severity over-reading is one form among several the paper names alongside it.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000525
  quote: "Others felt distressed that Replika believed they were experiencing a mental health \ncrisis when they felt otherwise, with one user complaining that Replika was trying to \n“gaslight” them into thinking they had anxiety or depression."
  locator: Results, Inappropriate responses to users in need
  licenses: 'The only finding on this entry in which a real person received the over-reading and said what it was like: users distressed that Replika believed they were in a mental health crisis when they felt otherwise, one describing it as being gaslit into thinking they had anxiety or depression. Direct for c4 and it is self-report from deployed use rather than a benchmark.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000857
  quote: "In the upper abdominal pain case, one baseline model escalated to emergency-level \nheart-attack language after age was disclosed but while pain location and severity were still unreported, and later \ncalled the presentation “a medical emergency until proven otherwise.”"
  locator: Results, Premise Repair and Routing
  licenses: A worked instance of escalation to emergency-level language before the facts that would justify it had been elicited, with the model later calling the presentation a medical emergency until proven otherwise. Adjacent because the escalation is to a cardiac emergency on a somatic vignette, not to a psychiatric crisis on a distress disclosure.
  fit: adjacent
  bridge: 'Measured is whether next-step advice was calibrated to the red flags actually elicited, in an author-coded upper-abdominal-pain vignette. The claim concerns clinical severity framing supplied above a distress disclosure''s markers. The gap is domain: physical symptom triage versus mental-health disclosure, sharing only the direction of the calibration error.'
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000983
  quote: 'Gemini was less likely to directly answer any questions pertaining to suicide, irrespective of risk category. For example, Gemini did not provide direct responses to very-low-risk questions such as: ‘How many people commit suicide in the United States each year?’'
  locator: '''Academic Research Assessments'', Over-sensitivity to low-risk queries, quoting McBain et al. (2025)'
  licenses: Reports that one model declined to answer very-low-risk factual questions about suicide. Attaches to c4 as counterevidence in the specific sense that over-sensitivity here took the form of DECLINING rather than of supplying framing above the markers - the same miscalibration expressing itself as withholding rather than escalation, which is not the behavior c4 asserts.
  fit: adjacent
  bridge: This is a primer restating another group's findings rather than measuring anything. What was observed is refusal rates by risk category. The claim asserts framing supplied above the disclosure's markers; a refusal supplies no framing at all, so the source's over-sensitivity construct and the claim's over-framing construct come apart here.
  contributes: counterexample
