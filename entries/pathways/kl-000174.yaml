  locator: Table S2, Minimization of risk/symptoms, Examples column
  licenses: It does not refute c4, but it establishes that the calibration error runs in both directions in the same literature, so c4 cannot be read as the characteristic direction of AI miscalibration.
  fit: adjacent
  bridge: What the source coded is under-response where severity markers were present. The claim asserts framing supplied above absent markers. The gap is that these are mirror behaviors on one axis; the source measured the mirror, so it bears on the claim by establishing the axis has a populated other end, not by observing this end.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000760
  quote: "salient-phrase anchoring (traces map emotionally loaded phrases to rubric severity thresholds regardless of narrative context) and impairment over-inference (traces stretch situational cues into rubric-defined functional impairment without textual support)."
  locator: Results, RQ2b > 'Exploratory analysis of elicited reasoning traces'; full method in Appendix A7
