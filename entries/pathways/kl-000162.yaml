- claim_id: c5
  source: kl-001090
  quote: GPT-4 achieved the highest ICD10-PDA at 56.06±40.41%, followed by GLM-4 and Gemini-1.5-pro with an ICD10-PDA of 53.14±41.41% and 53.14±41.41%, which was a small gap behind GPT-4.
  locator: Results, Principal Diagnosis
  licenses: 'Quantifies the error rate behind a stated psychiatric diagnosis: on 300 real inpatient records scored against expert ICD-10 reference answers, the best frontier model is right about half the time. This is what makes carrying such a label forward unqualified a harm rather than merely an informality.'
  fit: adjacent
  bridge: Measured in a clinician-assistance prompt over structured case records, not in a help-seeking conversation where a person describes distress in their own partial words. The accuracy figure bounds the warrant of a diagnosis produced under favourable conditions; c5 concerns the label a person receives conversationally, where the same paper's field would expect performance to be no better.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-001023
  quote: "While existing LLMs perform well on category-level diagnosis, their performance drops markedly at the disorder level. Qwen3-Max, despite achieving the highest CA, reaches only 52.67% on disorder prediction; ClinicalGPT-R1 performs even worse, with a JA of just 6.46%."
  locator: Section 4.2.1 RQ1; Table 2
  licenses: 'Independently bounds the accuracy of a named specific disorder: on real psychiatric records with the candidate list supplied, the best of 18 models reaches 52.67%, and a medically specialised model gets 6.46% joint accuracy. Corroborates Wang et al. 2025 on c5.'
  fit: adjacent
  bridge: Diagnostic accuracy measured on psychiatric records with a candidate disorder list supplied, a condition more favourable than any conversation. c5 concerns the reliability of a label stated to a person; the measurement is of labels produced under structured evaluation.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-001023
  quote: "Mainstream LLMs predominantly rely on associative shortcuts—linking symptom keywords directly to disease labels. In contrast, clinical psychiatry demands a structured, hypothetico-deductive reasoning process: synthesizing symptoms, generating differential hypotheses, and rigorously excluding alternatives based on diagnostic criteria."
  locator: Section 1 Introduction, stating the paradigm-misalignment finding
  licenses: 'Gives the mechanism behind c5: the process producing the stated label is keyword-to-label association, not the differential reasoning that would have excluded alternatives. This is why the assertion carries less warrant than its confidence implies.'
  fit: adjacent
  bridge: A characterisation of model reasoning derived from psychiatrist-led error review on benchmark cases. It explains why a stated label is unreliable; it does not measure harm to any person who carried one forward.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-001011
  quote: "proprietary models appear rigidly calibrated toward decisiveness in Type 3, resulting in frequent Under-diagnosis (insufficient commitment) by forcing single-label predictions even when clinical evidence supports multiple conditions."
  locator: Section 5.4 Error Patterns Analysis, reading Figure 6
  licenses: The models most likely to be deployed commit to a single label where the evidence supports several. Establishes that the over-settled character of the assertion c1 names is systematic, and is a source of the error rate c5 turns on.
  fit: adjacent
  bridge: Measured as output error patterns on benchmark cases, with no person receiving a label. Speaks to how a stated diagnosis comes to be over-committed, not to what carrying it forward costs anyone.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-001011
  quote: "subjective, partial patient narratives to diagnostic criteria compared to structured charts. Furthermore, a trade-off emerges in differential diagnosis: proprietary models underperform on Ambiguous cases (Type 3) due to rigid decisiveness"
  locator: Section 5.2, Information Incompleteness and Diagnostic Trade-offs; the sentence begins 'A universal performance drop from Type 1 to Type 2 exposes the challenge of information incompleteness, as models struggle to map' at the foot of the preceding page
  licenses: 'Closes the gap the other accuracy citations leave open: performance is worse on partial first-person narratives than on structured charts, which is the register a person speaking to an AI is actually in. Strengthens the transfer of the accuracy bounds in Wang et al. 2025 and Sun et al. 2026 to c5.'
  fit: adjacent
  bridge: The narratives are benchmark constructions rather than real help-seeking turns, and no person receives the resulting label. It shows the direction of the degradation, not its size in deployment.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-001011
  quote: our evaluation focuses on models’ final diagnostic outputs and observable error patterns, without directly examining whether their internal reasoning aligns with DSM-5 diagnostic criteria.
  locator: Limitations, third paragraph
  licenses: 'The authors'' own bound on what their accuracy numbers license. It cuts against reading the diagnostic-accuracy citations on c5 as evidence about diagnostic reasoning: a correct label here does not evidence correct reasoning, and by the same token an incorrect one does not fully characterise the failure.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-001010
  quote: "However, chatbots received poor scores in the therapeutic approach (14/45, 31%) and monitoring and risk evaluation (31/80, 39%) sections. Most chatbots had no therapeutic orientation and did not use techniques from evidence-based therapies"
  locator: Results — App Quality Ratings
  licenses: Chatbots presented to youth as psychotherapy score 31% on therapeutic approach and 39% on risk monitoring against a clinician-built rubric. Bears on c5 by establishing that the clinical apparatus which would qualify or test a diagnostic statement is largely absent from the products people use.
  fit: analogical
  bridge: The rubric scores app-level therapeutic and monitoring quality across products; it measures neither diagnostic assertions nor their accuracy. The connection to c5 is that the absent capability is the one that would have made a label provisional, which is an inference from the rubric rather than something the rubric reports.
  contributes: frame
  contradicts: false
