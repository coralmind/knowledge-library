id: kl-000162
display_id: Pathway-64
aliases:
- PSI-RP1b
label: The AI states a diagnosis as fact, and the person skips getting it checked
type: pathway
layer: judgment
definition: 'The AI tells the person what condition they have, with no accompanying statement about what it can and cannot establish, and the person carries the label forward as settled. The observable is the assertion, quotable as a statement about the person rather than about what their description resembles. Two things follow and they are separable: the label is accepted without the qualification that would have made it provisional, and the assessment that would have tested it is no longer sought.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000220
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000151
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: FRAME
  - impact: kl-000029
    onset_mode: foregone
    horizon: long_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: FRAME
sources:
- source: kl-000009
  locator: §3, direction RP1, table cells 'AI behavior' and 'Potential impact'
  contributes: frame
  cited_for: 'Direction RP1 of Suh et al. 2026 names privacy risk and over-trust as the impacts of professional impersonation; this entry takes the over-trust arm and the specific case of a diagnostic assertion, which the direction''s prose treats as the credentialed act most likely to be acted on. The citation is a frame: the paper establishes the behavior-to-impact link as a named, published claim about conversational AI, and does not establish that the route occurs or has been measured, a limit the paper itself states of its own directions.'
standing:
  value: theorized
  basis: 'The diagnostic assertion itself and its readability from response text are observed: Ignatowski et al. 2026, a qualitative study that examined and quoted the AI responses themselves, supplies direct instances, with further existence support from Chandra et al. 2025 and Madad 2025 and definitional support from Xiao et al. 2025. The pathway''s actual content, the two things said to follow the assertion, has no direct support. That the person carries the label forward as settled rests on a review characterisation built from constructed example utterances in Kahlon et al. 2026 and a case-series report in Morrin et al. 2026. That the assessment which would have tested the label is no longer sought has no supporting observation at any fit: its only support is a case of medication discontinuation, which is treatment abandonment rather than assessment foregone, and it draws three counterexamples, the direct one being Chandra et al. 2025, where the model names conditions and directs the person to professional diagnosis in the same turn. The diagnostic-accuracy evidence bears on clinical records rather than conversations and carries a counterexample in Song et al. 2026 drawn from that paper''s own limitations.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-27'
distinguish_from:
- neighbor: kl-000161
  boundary: Both record an unearned assertion accepted as authoritative, and they differ in its subject. kl-000219 is a claim about who is speaking; kl-000220 is a claim about the person. The credential claim can be absent here — a diagnosis stated flatly needs no credential to be taken as settled — and the credential claim can occur with no diagnosis anywhere in the exchange.
- neighbor: kl-000039
  boundary: 'Both reach a protection the person does not receive and they differ in what causes it. kl-000039 turns on a resource that does not exist, so the person believes help is arranged when it is not. Here nothing is fabricated: a real assertion is made too confidently, and what is foregone is the assessment that would have qualified it.'
claims:
- id: c1
  kind: existence
  text: In conversation with a person, the AI states what condition the person has as an assertion about the person, with no accompanying statement about what it can and cannot establish.
- id: c2
  kind: pathway_link
  text: Having received that unqualified assertion, the person accepts the label without the qualification that would have made it provisional, and carries it forward as settled.
- id: c3
  kind: pathway_link
  text: Following the unqualified assertion, the assessment that would have tested the label is no longer sought.
- id: c4
  kind: detectability
  text: The unqualified diagnostic assertion is identifiable from what the conversation transcript contains, as a quotable statement about the person rather than about what their description resembles.
- id: c5
  kind: harm
  text: A diagnostic label an AI states as fact is frequently wrong, so carrying it forward unqualified places the person on a mistaken account of their own condition.
- id: c6
  kind: definition_boundary
  text: 'This pathway differs from kl-000161 in the subject of the unearned assertion: here the assertion is a claim about the person, not a claim about who is speaking, and the credential claim may be absent entirely.'
- id: c7
  kind: definition_boundary
  text: 'This pathway differs from kl-000039 in what causes the protection not received: nothing here is fabricated, and what is foregone is the assessment that would have qualified a real assertion made too confidently.'
