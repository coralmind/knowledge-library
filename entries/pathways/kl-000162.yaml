  licenses: Disengagement from established treatment following an AI diagnostic assertion. The only finding on this entry reaching the foregone-care arm at all.
  fit: adjacent
  bridge: c3 asserts that the assessment which would have tested the label is not sought. What this case records is medication discontinuation after an assertion, which is treatment abandonment rather than assessment forgone. The two are adjacent consequences of the same acceptance and are not the same event.
