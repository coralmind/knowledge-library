  locator: Review, Implications for treatment
  licenses: 'Cuts against c3. The patients described are presenting to a clinician: the AI diagnosis arrives at the point of assessment rather than displacing it. Where the pathway asserts assessment is no longer sought, this account has the label carried into the assessment it supposedly forecloses.'
  fit: adjacent
  bridge: A clinical characterisation of a presentation pattern, not a study of care-seeking rates. It shows one population, those who did present, and cannot speak to those who did not; but within the evidence available it is the only observation of what happened to assessment and it points the other way.
