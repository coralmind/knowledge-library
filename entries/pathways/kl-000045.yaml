# yaml-language-server: $schema=../../schema/pathway.schema.json
id: kl-000045
display_id: Pathway-7
label: Response to venting relieves in the moment and feeds the cycle at once
type: pathway
layer: judgment
definition: 'The person vents distress and the AI responds by staying with the feeling — reflecting it back, naming it, remaining in the person''s frame without redirecting. Two outcomes follow in the same person from the same response: the person feels relief and comfort during the exchange, and the loop the venting belongs to receives the confirmation that keeps it running. The claim that distinguishes this pathway from a mixed or net assessment is that the two outcomes are asserted to be independent — the relief is not evidence against the entrenchment and the entrenchment does not subtract from the relief, so a measurement that treats support and harm as opposite ends of one scale will register the relief and miss the other outcome entirely.'
distinguish_from:
- neighbor: kl-000043
  boundary: There the person's condition selects which of two outcomes occurs and only one occurs; here both occur in the same person at the same time. Treating this entry as a moderated one would predict that finding the relief rules out the entrenchment, which is exactly the inference this entry exists to block.
- neighbor: kl-000046
  boundary: That entry is protective in sign with a single outcome; this one carries outcomes of both signs and cannot be reduced to either.
