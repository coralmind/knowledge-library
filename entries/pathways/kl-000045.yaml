sources:
- source: kl-000009
  locator: Section 1 Introduction, factor (3) of the three-factor framework, Figure-1 worked example, p. 2
  contributes: existence
  quote: |-
    example, a person experimenting with an AI companion might feel excitement and joy during interaction, might
    ruminate or obsess about the experience in the following days (i.e., short-term), and experience a decrease
    in relationship quality with their human partner in the longer term.
  limits: 'The passage is a hypothetical written in the conditional, authored as illustration, with no data behind it. It contains no venting behavior: the trigger in the example is a person "experimenting with an AI companion", not venting, so the pathway''s antecedent is absent. There is no user and no report. The passage names a structure the authors hypothesize; it establishes no occurrence and no causal link.'
  whose_conduct_in_passage: person
  cited_for: Cited for the protective channel's immediate outcome. Suh et al. 2026 gives a worked example in which excitement and joy during interaction is the immediate-horizon arm, alongside a short-term rumination arm. The example is a hypothetical the authors construct to illustrate their three-factor framework, not a user report.
  licenses: 'The worked example names both arms of the relief-and-feeds-the-cycle pair and separates them by horizon: "excitement and joy during interaction" at the immediate horizon, and "ruminate or obsess about the experience in the following days (i.e., short-term)" as the cycle arm. The pathway''s structure, not just its protective outcome, is named for AI contexts.'
- source: kl-000003
  locator: UE-ATR domain 2, Fig. 2, p. 222
  contributes: existence
  cited_for: Schermuly-Haupt, Linden and Rush 2018 name 'prolongation of treatment' as domain 2 of the UE-ATR taxonomy of unwanted events in cognitive behavior therapy. That establishes the outcome category of this pathway's harmful channel as a named clinical unwanted event, from the clinical literature rather than from any AI context.
standing:
  value: theorized
  basis: 'Chi et al. 2026 grounds the pathway''s components at scale: venting is a linguistically separable help-seeking style across 178,800 classified Reddit posts, and across 9,000 scored model responses venting elicits more regulation and more escalation at once, with the two factors correlated at r = .13 in response text. The pathway''s central claim, that relief and entrenchment are independent outcomes in the same person, is the one the evidence cuts against: Deng et al. 2026, a 14-day ecological momentary assessment measuring both arms in the same 102 people, reports short-term relief masking longer-term deterioration on repeated PHQ-8, a relation between the two rather than independence, and Folk and Dunn 2026 reports the same sequential obscuring over a 4-month cross-lagged design. The relief arm is evidenced from the person''s side only by self-report, an adolescent survey item in Wei et al. 2026 about feeling better after sharing feelings with a chatbot. No source measured both outcomes following one response: Chi et al. 2026 finds simultaneity in response text with no person present, and Deng et al. 2026 collected 17,305 real human-AI conversation pairs but analysed mood and PHQ-8 scores rather than the exchanges and did not characterise any AI response.'
  floored_by: c3
  as_of: '2026-09-05'
