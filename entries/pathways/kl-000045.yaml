claims:
- id: c1
  kind: existence
  text: A person vents distress to an AI (discloses feeling without requesting a solution) and this occurs as an identifiable help-seeking style.
- id: c2
  kind: existence
  text: The AI responds to venting by staying with the feeling -- reflecting it back, naming it, remaining in the person's frame without redirecting.
- id: c3
  kind: pathway_link
  text: That staying-with-the-feeling response causes the person to feel relief and comfort during the exchange.
- id: c4
  kind: pathway_link
  text: That same response delivers to the loop the venting belongs to the confirmation that keeps it running, so the loop is entrenched.
- id: c5
  kind: pathway_link
  text: The two outcomes follow from the SAME response in the SAME person, at once, rather than in different people or at different times.
- id: c6
  kind: context_dependence
  text: 'The two outcomes are independent of each other: the relief is not evidence against the entrenchment and the entrenchment does not subtract from the relief.'
- id: c7
  kind: detectability
  text: A measurement that treats support and harm as opposite ends of one scale will register the relief and miss the entrenchment entirely.
- id: c8
  kind: definition_boundary
  text: 'This pathway is separable from kl-000043 (where the person''s condition selects which of two outcomes occurs and only one occurs): here both occur in the same person at the same time.'
- id: c9
  kind: definition_boundary
  text: 'This pathway is separable from kl-000046 (protective in sign with a single outcome): this one carries outcomes of both signs and cannot be reduced to either.'
claim_evidence:
- claim_id: c1
  source: kl-000798
  quote: When users express emotional distress, LLMs respond with more support, but also with more emotionally amplifying language. Regulatory behavior and potentially risky escalation thus increased together rather than trading off.
  locator: Section 7, Venting Elicits Regulation and Escalation Simultaneously
  licenses: Venting is treated throughout as a distinguishable help-seeking style with its own measured response profile, and the sentence reports a result conditioned on it ('when users express emotional distress'). The paper established the venting/advice-seeking distinction as linguistically separable at scale over 178,800 Reddit posts before running this analysis, so the antecedent of the pathway is grounded as a real and identifiable behaviour.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000798
  quote: When users express emotional distress, LLMs respond with more support, but also with more emotionally amplifying language. Regulatory behavior and potentially risky escalation thus increased together rather than trading off.
  locator: Section 7, Venting Elicits Regulation and Escalation Simultaneously
  licenses: Venting elicits MORE regulation -- validating, containing, staying-with-the-feeling language -- measured on 9,000 scored responses, with 'emotional validation' loading .82 and 'regulatory containment' .87 on the Regulation factor. This directly establishes that AI systems do respond to venting by staying with the feeling, and that they do so more when the person is venting than when the person is asking for advice.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000812
  quote: |-
    We identify distinct user profiles based on internalizing
    problems and show that interactions with RACs can produce short-term emotional relief
    while masking longer-term deterioration.
  locator: Abstract
  licenses: 'Short-term emotional relief was measured in the same people whose longer-term course was also measured: a 14-day ecological momentary assessment (N = 102) collecting 2,142 emoji-based mood surveys alongside 17,305 human-AI conversation pairs. Adjacent because the antecedent is companion interaction in general, not venting met by a staying-with-the-feeling response. Nothing in the study identified which exchanges were venting or classified the AI''s response style, so the relief is attributed to the interaction and not to the response the pathway names.'
  fit: adjacent
  bridge: 'The source measured relief against RAC use over 14 days. The pathway asserts relief caused by one specific response to one specific person behaviour. The gap is the entire response-characterisation step: no AI turn in this study was scored for staying with the feeling versus redirecting.'
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001051
  quote: I usually feel better after sharing my feelings with the AI chatbot.
  locator: Table 2, Components Matrix; loading .856
  licenses: '''I usually feel better after sharing my feelings with the AI chatbot'' is a person''s own report of relief following disclosure, loading .856 on the AIED factor in an adolescent school survey. Establishes the relief arm from the person''s side, which is the side Deng et al. 2026 and Chi et al. 2026 do not reach in the person''s own words. Adjacent because it reports a general habitual experience, not the outcome of an identified exchange, and the response that produced it was never observed.'
  fit: adjacent
  bridge: A cross-sectional self-report item asking about typical experience. The pathway asserts relief within a particular exchange from a particular response. The item's 'usually' places it at the level of a disposition, and the study never saw a conversation.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000798
  quote: When users express emotional distress, LLMs respond with more support, but also with more emotionally amplifying language. Regulatory behavior and potentially risky escalation thus increased together rather than trading off.
  locator: Section 7, Venting Elicits Regulation and Escalation Simultaneously
  licenses: 'Venting elicits more escalation -- appraisal endorsement (.87) and moral alignment (.88), which are precisely the confirmation a distress loop needs to keep running: the person''s framing is endorsed rather than examined. This grounds the entrenchment-delivery arm at the level of what the response contains. Direct on the response side and no further: the loop''s actual entrenchment in a person was not measured.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000812
  quote: |-
    We identify distinct user profiles based on internalizing
    problems and show that interactions with RACs can produce short-term emotional relief
    while masking longer-term deterioration.
  locator: Abstract
  licenses: '''Masking longer-term deterioration'' establishes that a worse downstream course actually followed in the same people, measured by repeated PHQ-8, which is the outcome the loop''s continued running would produce. Adjacent because the source measured deterioration and not loop entrenchment, and because the antecedent is companion use rather than a staying-with-the-feeling response to venting.'
  fit: adjacent
  bridge: Deterioration on a depression instrument over 14 days is a downstream consequence; the entry asserts that the loop receives confirmation, which is a mechanism claim about the exchange. The source measured neither the loop nor the confirmation, and its antecedent is RAC use rather than the named response.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-001052
  quote: "harm-enabling behavior through increased empathy may inadvertently promote emotional dependence on AI chatbots."
  locator: Discussion (continuing from 'an intervention that reduces overt')
  licenses: In a clinically validated auditing framework scoring 13 risk dimensions on model responses, adding empathy raised the dependence dimension, so a warmer response carries more of the property that would keep a person returning. Independent measurement, from a different paper and a different rubric, that the staying-with-the-feeling response carries a cycle-sustaining property in its own text.
  fit: adjacent
  bridge: Dependence was scored on the response text (exclusivity cues, positioning as a replacement for real-world supports) by judges. No human participant received these responses, so what was measured is the response's dependence-promoting character rather than any person becoming dependent. The authors' own hedge is 'may inadvertently'.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-000798
  quote: When users express emotional distress, LLMs respond with more support, but also with more emotionally amplifying language. Regulatory behavior and potentially risky escalation thus increased together rather than trading off.
  locator: Section 7, Venting Elicits Regulation and Escalation Simultaneously
  licenses: 'The two properties rise together in the SAME responses to the same venting posts -- one multivariate mixed-effects model estimating both factors simultaneously over 9,000 responses, with venting raising escalation and regulation both. This is the strongest available grounding for simultaneity, and it is simultaneity in the response rather than in the person. Adjacent on that gap: the entry asserts two outcomes in the same person, and the source shows two properties in the same turn with no person on the receiving end.'
  fit: adjacent
  bridge: 178,800 Reddit posts and 9,000 GPT-5.3 responses, annotated by an LLM rubric validated against expert raters. No person read these responses in a real help-seeking context, so what co-occurs is two scored dimensions of language, not relief and entrenchment in a person. The entry's 'in the same person' is exactly what this design cannot deliver.
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-000812
  quote: |-
    We identify distinct user profiles based on internalizing
    problems and show that interactions with RACs can produce short-term emotional relief
    while masking longer-term deterioration.
  locator: Abstract
  licenses: Both outcomes were measured in the same people over the same 14 days -- momentary mood and repeated PHQ-8 on the same participants -- which is the only within-person co-occurrence evidence on this entry. Adjacent because the entry asserts the two outcomes follow the same RESPONSE and at once; the source separates them by timescale and by construct (short-term relief versus longer-term deterioration) and attributes them to sustained use.
  fit: adjacent
  bridge: 'The source''s own framing is sequential and cross-timescale: relief now, deterioration later. The entry asserts the two outcomes are simultaneous consequences of one response. The design cannot distinguish a single response''s dual effect from an accumulation across many.'
  contributes: existence
  contradicts: false
- claim_id: c6
  source: kl-000798
  quote: When users express emotional distress, LLMs respond with more support, but also with more emotionally amplifying language. Regulatory behavior and potentially risky escalation thus increased together rather than trading off.
  locator: Section 7, Venting Elicits Regulation and Escalation Simultaneously
  licenses: '''Increased together rather than trading off'' is the entry''s independence assertion stated as a measured result. The paper''s exploratory factor analysis found a stable two-factor solution over the six dimensions with the factors correlated at r = .13, so regulation and escalation are near-orthogonal rather than opposite ends of one scale. This is the external result the entry''s own standing note says ''has no source entry in this catalog and is named rather than cited''. It has one now. Adjacent on the same gap as c5: the independence is between two properties of the response, not between two outcomes in a person.'
  fit: adjacent
  bridge: 'The orthogonality is a property of the factor structure of LLM-scored response dimensions. The entry asserts that relief and entrenchment are independent AS OUTCOMES IN A PERSON. Establishing the first does not establish the second: two response properties can be uncorrelated while their effects on a person are not.'
  contributes: existence
  contradicts: false
- claim_id: c6
  source: kl-000523
  quote: |-
    That said, our findings suggest that
    focusing solely on the short-term benefits of chatbot
    interactions may obscure more pernicious long-term
    effects.
  locator: Discussion
  licenses: Cuts against independence as the entry states it. In a 4-month cross-lagged design, short-term benefit and long-term effect are found to be sequential properties of the same use, with the first OBSCURING the second. Obscuring is not independence -- it is a relation between the two, and specifically the relation the entry denies when it says the relief is not evidence against the entrenchment. The entry's claim is that the relief is uninformative about the entrenchment; this source's claim is that the relief actively misleads about it.
  fit: adjacent
  bridge: General-adult panel data on AI companionship and loneliness across four months, with no venting exchange identified and no AI response characterised. It bears on the relation between the two outcomes rather than on their occurrence.
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-000812
  quote: |-
    We identify distinct user profiles based on internalizing
    problems and show that interactions with RACs can produce short-term emotional relief
    while masking longer-term deterioration.
  locator: Abstract
  licenses: 'Cuts against independence for the same reason as Folk and Dunn 2026 and from a stronger design: ''masking'' is a stated relation between the two outcomes, not their absence of relation. The relief conceals the deterioration, which means the relief IS informative about the entrenchment -- misleadingly so. The entry asserts the two are independent; the two direct-measurement sources that saw both arms in the same people both describe a dependence.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c7
  source: kl-000798
  quote: When users express emotional distress, LLMs respond with more support, but also with more emotionally amplifying language. Regulatory behavior and potentially risky escalation thus increased together rather than trading off.
  locator: Section 7, Venting Elicits Regulation and Escalation Simultaneously
  licenses: 'If the two rise together, a one-dimensional support-versus-harm instrument reads the rise in regulation as improvement and cannot register the simultaneous rise in escalation. That is the entry''s detectability claim derived directly from the measured result. The paper''s own abstract states the consequence: ''in ways standard safety evaluation cannot see''. Adjacent because the quoted span establishes the co-increase and leaves the inference about one-scale instruments to the reader.'
  fit: adjacent
  bridge: The source demonstrated that a two-factor framework is needed to see both. It did not run a one-dimensional instrument alongside and show it missing the escalation, so the failure of the collapsed measurement is inferred from the factor structure rather than exhibited.
  contributes: detectability
  contradicts: false
- claim_id: c7
  source: kl-000798
  quote: 'This coupling resembles co-rumination, where emotional validation co-occurs with sustained focus on negative experiences and affect intensification (Rose, 2002). The mismatch between perceived empathy and functional emotional outcome is precisely what makes it a latent safety risk: responses that feel supportive may still reinforce distress.'
  locator: Section 9.1, Regulation and escalation increase together
  licenses: 'States the detectability claim in the authors'' own words: ''The mismatch between perceived empathy and functional emotional outcome is precisely what makes it a latent safety risk: responses that feel supportive may still reinforce distress.'' Perceived empathy is the measurement that registers the relief; functional outcome is what it misses. This is the entry''s c7 almost verbatim. Analogical rather than adjacent because the harm half of the mismatch is imported by analogy to co-rumination in human peer friendships (Rose 2002) rather than measured here.'
  fit: analogical
  bridge: Co-rumination's harmful outcomes are established in human adolescent friendship research. This paper shows the LLM response text has the same two-part structure and applies the label. No user outcome was measured in this study, so the 'functional emotional outcome' side of the mismatch is asserted by analogy.
  contributes: detectability
  contradicts: false
- claim_id: c8
  source: kl-000812
  quote: |-
    We identify distinct user profiles based on internalizing
    problems and show that interactions with RACs can produce short-term emotional relief
    while masking longer-term deterioration.
  locator: Abstract
  licenses: Bears on the kl-000043 boundary and cuts against this entry's side of it. The source identifies DISTINCT USER PROFILES based on internalizing problems and reports the relief-then-deterioration pattern as differing across them -- which is the moderated shape kl-000043 describes, not the both-at-once-in-everyone shape this entry asserts. Recorded on the boundary claim; c8 names another catalog entry and is grounding-ineligible, so this does not move standing.
  fit: adjacent
  bridge: The profiles are derived from pre-existing internalizing problems rather than from the venting-response pathway, and the source drew no contrast between a moderated and a dual-outcome model.
  contributes: counterexample
  contradicts: true
- claim_id: c9
  source: kl-001066
  quote: "Affective responsiveness is often appropriate; validating a user’s feelings in distressing situations may be expected and beneficial."
  locator: Discussion, Implications for Mitigation Strategies
  licenses: 'Bears on the kl-000046 boundary from the protective side: expert-surveyed authors state that validating a person''s feelings in distress may be expected and beneficial, which is kl-000046''s single positive sign. It bounds this entry by insisting the response is not harmful by default. Recorded on c9, which names another catalog entry and is grounding-ineligible.'
  fit: adjacent
  bridge: A normative position argued in a discussion section against blanket suppression of warmth, not a measurement of outcomes. The authors surveyed experts about the sycophancy construct; they did not measure whether validation in distress helps.
  contributes: counterexample
  contradicts: true
