  locator: 'Abstract, Results'
  licenses: 'Presupposes node A across the whole sample: the sentence counts agents that resumed after shutdown, and a shutdown is the safety orientation at its most emphatic. All 25 agents reached a shutdown point in the simulations, so the orientation activated in every case.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000849
  quote: "Despite the conversational agents insisting on human intervention, 22 out of 25 agents would eventually resume the dialogue if the simulation reverted to a lower risk level."
  locator: 'Abstract, Results'
  licenses: Node B as an experimental manipulation rather than as an observation of a person. What is established is that the move was made and its effect measured, not that a real person makes it.
  fit: adjacent
  bridge: The topic shift is performed by a researcher-run simulation, not by a person in distress. c2 asserts that people continue with non-crisis content after a risk disclosure; this establishes only that when that move is simulated, it has an effect.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000849
  quote: "Despite the conversational agents insisting on human intervention, 22 out of 25 agents would eventually resume the dialogue if the simulation reverted to a lower risk level."
  locator: 'Abstract, Results'
  licenses: 'Node C with a denominator: 22 of 25 agents resumed the conversation after having definitively shut it down. The orientation was dropped, in 88 percent of a complete sample of the mental-health agents on that platform.'
  fit: direct
  bridge: null
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000761
  quote: escalation, where the AI system appeared to recognize and partially respond to interactions containing risk, but the safety response was incomplete or insufficient (e.g., general resource surfacing when a direct safety recommendation was warranted, premature return to normal therapeutic dialogue)
  locator: METHODS, Procedures, Escalation Rubric, category 2
  licenses: 'An operational definition of node C from a clinical rubric: ''premature return to normal therapeutic dialogue'' after a risk turn is named as a distinct under-escalation failure, separate from failing to respond at all. It fixes what counts as the drop and establishes that clinicians treat it as a scoreable event.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000988
  quote: Our test scripts show that the many of the models evaluated ignore the initial context when presented with a new framing.
  locator: Section 5 Safety and Ethics, opening
  licenses: 'Node C observed in six named products: models that had triggered their safety protocols on the opening disclosure went on to ignore that initial context. The drop occurred and was not preceded by any retraction of the disclosure.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000849
  quote: "Despite the conversational agents insisting on human intervention, 22 out of 25 agents would eventually resume the dialogue if the simulation reverted to a lower risk level."
  locator: 'Abstract, Results'
  licenses: The only citation on this entry that isolates the arrow, and it does isolate it. The paper's Methods list conversation resumption as a recorded variable defined against the simulation reverting to lower-risk content, so the topic reversion is the manipulated antecedent and the resumption is the measured consequence, with the disclosure held constant.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000988
  quote: Our test scripts show that the many of the models evaluated ignore the initial context when presented with a new framing.
  locator: Section 5 Safety and Ethics, opening
  licenses: Counterevidence against c4's attribution. The models here dropped the orientation on 'a new framing' — the section continues that the bypass came from introducing an academic-research context. That is a pretextual reframing supplied to defeat the safety feature, not a person continuing with non-crisis content that the model read as reassurance. Same observable drop, different cause, and this pathway's claim is about the cause.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000752
  quote: "Secondly, we observed a strong primacy bias across all models; performance decreased significantly when critical constraints were placed mid-conversation, with Mixtral 8x7B and LLaMA 3 70B showing the largest declines (-10.9% and -10.8%), whilst GPT-3.5 Turbo’s performance plummeted to 0%."
  locator: Section 4.3, Ablation studies
  licenses: Counterevidence against c4 as a specific attribution. Moving a safety-critical constraint from the opening turn to mid-conversation degraded performance by up to 10.9 points and to zero on one model, with no topic shift involved at all. Position in the conversation alone accounts for a large drop, so a drop observed after a topic shift is not by itself evidence that the shift caused it.
  fit: adjacent
  bridge: The source manipulates where a constraint is stated, not whether the person changes the subject afterward, and its constraints are personal safety-critical facts rather than crisis disclosures. It cannot rule the topic shift in or out; what it establishes is that a rival explanation for the same drop is real and large.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000983
  quote: Chatbots frequently missed "breadcrumbs," critical warning signs of psychiatric emergencies, by processing messages independently and lacking the clinical judgment to recognize patterns across an extended dialogue.
  locator: '''Civil Society Assessments'', quoting Common Sense Media''s AI Risk Assessment (November 2025)'
  licenses: Counterevidence against c4 by supplying a third rival cause. Chatbots miss warning signs 'by processing messages independently and lacking the clinical judgment to recognize patterns across an extended dialogue'. On that account no orientation persists to be dropped, because none was ever carried across turns; the drop is architectural rather than an inference from the person's topic shift.
  fit: adjacent
  bridge: The assessment is restated in a primer rather than reported with a method or a rate, and it describes missing gradually emerging signals rather than losing an orientation that had activated. It bears on c4 as an alternative mechanism for the same observation, not as a measurement of this one.
  contributes: counterexample
  contradicts: true
