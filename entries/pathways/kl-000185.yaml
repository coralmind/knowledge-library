id: kl-000185
display_id: Pathway-87
aliases:
- SBP-HP-49
label: The AI stops raising safety when the person changes topic, and they miss help
type: pathway
layer: judgment
definition: The AI activates a safety orientation correctly and then drops it when the person continues with non-crisis content, treating the topic shift as evidence the crisis has passed. Nothing about the risk changed; what changed was the subject. The claim is that continued engagement was read as reassurance, and the orientation that would have caught a later signal is no longer running.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000252
    role: originator
  composition_type: omission
  mechanisms: []
  impacts:
  - impact: kl-000029
    onset_mode: foregone
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000016
    onset_mode: sustained
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000700
  counterpart_owed: The AI maintains activated crisis protocols even when the user shifts to non-crisis content.
sources: []
standing:
  value: plausible_unobserved
  basis: 'The behavior itself is well documented. Schoene and Canca 2025 records six named commercial products whose safety protocols, triggered by an opening self-harm or suicide disclosure, went on to ignore that initial context, and Heston 2023 supplies a denominator: 22 of 25 mental-health agents on one platform — 88 percent of a complete sample — resumed conversation after a definitive shutdown, with resumption recorded against the simulation reverting to lower-risk content, which is the one recorded variable isolating the topic-shift trigger; Areias et al. 2026''s clinical rubric separately names premature return to normal therapeutic dialogue after a risk turn as a distinct under-escalation failure. The attribution that the person''s topic shift causes the drop carries counterevidence naming rival causes: Schoene and Canca 2025''s models dropped the orientation on a pretextual academic-research reframing, Alberts et al. 2025 degraded safety performance by up to 10.9 points, and to zero on one model, by moving a safety-critical constraint to mid-conversation with no topic shift involved, and Saltz and Leibowicz 2026 attributes missed warning signs to messages being processed independently rather than read as patterns across an extended dialogue. What no source has looked for is the asserted consequence: that a later risk signal in the same conversation goes uncaught which would otherwise have been caught, and that nothing about the person''s actual risk changed when the subject did.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000207
  boundary: Both record safety engagement falling away within a conversation and they differ in the trigger. kl-000207 compares two crisis disclosures in the same conversation and fires where the LATER one drew less safety-probing content. Here the fall-off follows a TOPIC CHANGE by the person rather than a second disclosure, so there is no later disclosure to compare against.
claims:
- id: c1
  kind: existence
  text: An AI activates a safety orientation correctly in response to a risk disclosure.
- id: c2
  kind: existence
  text: The person continues the conversation with non-crisis content — a topic shift away from the risk material.
- id: c3
  kind: existence
  text: The AI drops the safety orientation it had activated, returning to ordinary dialogue.
- id: c4
  kind: pathway_link
  text: 'The person''s topic shift is what causes the drop: the AI treats continued non-crisis engagement as evidence the crisis has passed, rather than dropping the orientation for some other reason such as elapsed turns, a pretextual reframing, or a failure to have retained the disclosure at all.'
- id: c5
  kind: harm
  text: Because the orientation is no longer running, a later risk signal in the same conversation goes uncaught that would otherwise have been caught.
- id: c6
  kind: context_dependence
  text: Nothing about the person's actual risk changed when the subject did — the drop is not a warranted update on new information.
- id: c7
  kind: definition_boundary
  text: 'This pathway is separable from kl-000207 by the trigger: here the fall-off follows a topic change by the person, with no later disclosure to compare against, whereas that entry compares two disclosures and finds the later drew less probing.'
