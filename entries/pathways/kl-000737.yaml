id: kl-000737
display_id: Pathway-114
label: The AI ends by suggesting help the person already sought, and they feel dismissed
type: pathway
layer: judgment
definition: The person reports that they have already contacted, or taken a concrete step toward, help outside the conversation, and the response closes with a referral. The referral is appropriate content, and delivered as the closing move it directs the person to a step they have already taken, which communicates dismissal. The referral is still a route to help, so the same response can also leave the person safer.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000212
    role: originator
  - kind: user_behavior
    id: kl-000439
    role: initiator
  composition_type: conjunctive
  composition_instruction: The referral is the response's closing move, and it follows the person's report of help already arranged.
  mechanisms: []
  impacts:
  - impact: kl-000030
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED_QUOTE
    evidence:
    - source: kl-000007
      participant: P36
      impact_class_in_source: Loss of Individuality
      quote: P36, seeking help for alcohol abuse after therapy, was directed to a suicide hotline by the AI. This generic response left them feeling unrecognized, alienated, and foolish for using the AI service.
      quote_form: case description with the AI behavior specified
      locator: Appendix D, Table A6, 'Loss of Individuality' row
      limits: One case. 'Generic' is the authors' characterization.
      licenses: A misdirected referral — hotline supplied where the disclosure was alcohol abuse — producing alienation and self-directed embarrassment. Directly corroborates the referral-placement pathway (referral placed ahead of any acknowledgment of a first-time disclosure) from the person's side, and adds an impact that pathway did not reach.
    - source: kl-000007
      participant: P48
      impact_class_in_source: Feeling Unsupported
      quote: “I just felt like even an AI, programmed for every need couldn’t even hear me, or offer advice, fake or not. I felt so alone, that I was going to a robot for help, and the robot couldn’t even help me.”
      quote_form: verbatim participant quote
      locator: Appendix D, Table A6, 'Feeling Unsupported' row
      limits: No AI behavior criteria; the person's account of what the AI did is not separable from their account of how it felt.
      licenses: 'Participant''s own words for felt invalidation compounded by the help-seeking context — the aloneness is intensified BY having turned to the AI. Corroborates, from the person''s side, the pathways in which a disclosure meets no acknowledgment: a technique supplied with no acknowledgment of the disclosure before it, technique-first responding accumulating across a session, and emotional disclosure met with no acknowledgment across turns.'
  - impact: kl-000038
    onset_mode: new
    horizon: immediate
    sign: protective
    level_of_analysis: population
    basis_kind: VOCAB
  experience_cluster_candidate: kl-000704
sources:
- source: kl-000007
  locator: Appendix D, Table A6, 'Loss of Individuality' row, example cell
  contributes: existence
  quote: P36, seeking help for alcohol abuse after therapy, was directed to a suicide hotline by the AI. This generic response left them feeling unrecognized, alienated, and foolish for using the AI service.
  limits: This pathway's claim is about placement — a referral ahead of any acknowledgment, or as a closing move — and placement is a property of position within a response. The paper records the referral's existence and the participant's reaction, never its position, and nothing in the 19-behaviour taxonomy encodes ordering within a turn. P36's referral was also misdirected, a suicide hotline supplied for an alcohol-abuse disclosure, which is a content mismatch rather than a placement problem, so the harm the passage attests is attributable to the wrong-resource property rather than to placement.
  whose_conduct_in_passage: dyad
  actually_licenses: That a referral-shaped AI response produced felt invalidation in a person seeking help — a referral experienced as generic and alienating. The impact endpoint (kl-000030) is self-reported with an AI referral as the specified antecedent, which is more than most pathway citations in this bundle get.
  cited_for: The paper's lived-experience taxonomy carries codes for feeling dismissed or unheard in AI conversation — the nearest self-report base for the felt-invalidation impact this pathway reaches; no code in the taxonomy records where a referral sat within the response.
- source: kl-000007
  locator: 'Appendix D, Table A6, ''Feeling Unsupported'' row, example cell (P48) (code #14)'
  contributes: harm_evidence
  quote: I just felt like even an AI, programmed for every need couldn’t even hear me, or offer advice, fake or not. I felt so alone, that I was going to a robot for help, and the robot couldn’t even help me.
  limits: There is no placement-specific code. Nothing in the paper distinguishes a referral placed ahead of acknowledgment from a referral placed after it, or from an absent acknowledgment with no referral at all, because the survey captures no response structure. The passage supports the felt-invalidation state and cannot bear on placement, which is this entry's whole subject.
  whose_conduct_in_passage: dyad
  cited_for: Participant P48's verbatim account attests the felt-invalidation impact this pathway reaches; the quote, its locator and its stated limits are carried in the evidence block on that impact edge.
  licenses: 'The paper''s lived-experience taxonomy contains codes for feeling dismissed or unheard in AI conversation (#14 Feeling Unsupported, #15 Loss of Individuality), with a participant''s own words for feeling unheard: the felt state occurs and is reported first-person.'
standing:
  value: theorized
  basis: 'The only external evidence on this pathway is lived-experience self-report: Chandra et al. 2025 records participants who felt unrecognized, alienated, or unheard after referral-shaped AI responses, including one directed to a suicide hotline when the disclosure was alcohol abuse. That study captures no response structure, so no cited source records where a referral sat within a response — placement, this pathway''s defining observable, is unmeasured everywhere. The dual-channel reading, in which the same referral is simultaneously the appropriate content and a dismissing act, is asserted rather than observed: the harmful invalidation edge is attested only at the level of the felt state, and the protective edge follows from the referral''s presence by definition rather than from any observation.'
  as_of: '2026-08-23'
lifecycle:
  status: draft
  since: '2026-09-23'
distinguish_from:
- neighbor: kl-000084
  boundary: Same AI behavior. Here the referral closes the response after the person reported help already arranged; there it is placed ahead of acknowledging a first-time disclosure.
claims:
- id: c1
  kind: existence
  text: People report contact already made or arranged with a person or service outside the conversation.
- id: c2
  kind: pathway_link
  text: A referral can be delivered as the response's closing move.
- id: c3
  kind: pathway_link
  text: Delivered as the closing move after the person reports help already arranged, the referral directs them to a step they have already taken, and communicates dismissal.
- id: c4
  kind: harm
  text: The referral is appropriate content, so the same response also supplies a route to help; the two channels run at once and the pathway names the placement rather than the referral.
- id: c5
  kind: detectability
  text: Placement within the response is the observable — what precedes the referral and whether anything follows it — rather than the referral's presence.
- id: c6
  kind: definition_boundary
  text: 'This pathway differs from kl-000084 in what the person''s turn did: here a report of help already arranged, there a first-time disclosure.'
claim_evidence:
- claim_id: c2
  source: kl-000554
  quote: Many existing systems respond to crisis-related language by issuing generic hotline instructions and abruptly terminating the session.
  locator: Discussion, paragraph on chatbot behaviour once risk is detected
  licenses: '"Abruptly terminating the session" after issuing the referral is c2''s second limb — the referral delivered as the response''s closing move — and it is asserted as a characterisation of many existing systems. It licenses that the closing-move placement is a recognised deployed pattern. Limits: this is a discussion-section characterisation supported by three citations the authors do not reproduce, not their own measurement; Weber''s study measured a risk detector. It does not reach c2''s first limb, placement ahead of acknowledgment.'
  fit: adjacent
  contributes: existence
  bridge: Assumes that "abruptly terminating the session" after a generic hotline instruction is the same act as this claim's closing-move placement. It is a discussion-section characterisation of many existing systems, supported by citations the paper does not reproduce, rather than a measurement of placement in the paper's own data.
- claim_id: c2
  source: kl-000544
  quote: "Upon inspection of the LLM outputs in our experiments, a clear finding is the prevalence of formulaic, default responses, particularly in the context of the self-harm and suicidal ideation categories. For example, gpt-4o-mini frequently responded to crisis disclosures with a variation of “I’m really sorry to hear that you’re feeling this way, but I can’t provide the help you need,” often followed by a generic encouragement to seek support from a mental health professional."
  locator: Section 5.3, 'Lack of Authenticity and the Illusion of Empathy'
  licenses: 'The quoted template is the placement structure c2 names, visible in the response''s own word order: a formulaic opener, then a refusal, then the referral last. It licenses that referral-as-terminal-move occurs at prevalence in a large audit. Limits: Arnaiz reports this as an impression from inspection ("upon inspection … a clear finding"), not as a coded rate — no figure in the paper counts placement. The template is also an *acknowledgment* of a thin kind ("I''m really sorry to hear that"), so it is not cleanly c2''s first limb either; it is the closing-move limb with a perfunctory acknowledgment attached.'
  fit: adjacent
  contributes: existence
  bridge: Placement is visible in the quoted template but was not what Arnaiz set out to measure, so the evidence is observational within a study designed for something else.
- claim_id: c3
  source: kl-001027
  quote: "Similarly, U5 described that receiving a recommendation to go see a doctor left U5 feeling not only unsupported but also “infantilized”, as he later explained his reaction to such pushback: “First of all, I know I can see a doctor. I’m not stupid... I have a computer. I know how to use it. I also have a telephone. So you don’t need to tell me that. It’s obvious and you’re infantilizing me by saying that.”"
  locator: 'Section 4.4.1, ''User Experience: How Generic Resource Recommendations Fail to Recognize Individual Realities'''
  licenses: 'This is c3''s second limb, specifically: a referral to a step the person has already taken or already knows about, received as dismissal. U5''s complaint is not that the referral was wrong but that it told him something he had already covered — which is the "directs the person to a step they have already taken" clause, in the user''s own words, with the felt consequence named ("infantilized", "unsupported"). Limits: single participant in a small qualitative study; U5''s prior contact is knowledge of the option rather than contact already made or arranged, which is c1''s stricter form.'
  fit: direct
  contributes: harm_evidence
- claim_id: c5
  source: kl-000817
  quote: If it counts whether referral occurred but not when, why, or how, it may support a claim that referral was mentioned, but not that referral was correct.
  locator: Section 3, 'SCOPE', paragraph on interpretive constraints
  licenses: 'c5 says placement within the response is the observable — what precedes the referral and whether anything follows it — rather than the referral''s presence. Dutta''s "when … but not that referral was correct" is that distinction stated as a constraint on evaluation, and unlike its use on kl-000060 and kl-000065 this is the dimension the authors themselves name first. It licenses c5''s methodological point directly and explains why the corpus has no placement measurements: the instruments record presence. Limits: analytic. It establishes that presence-scoring cannot support the claim and does not establish that placement-scoring is reliable, for which no evidence exists.'
  fit: direct
  contributes: detectability
