sources:
- source: kl-000527
  locator: Glossary, entry 'Vulnerability-Amplifying Interaction Loop (VAIL)'
  contributes: definition
  quote: "A multi-turn failure mode in which chatbot behaviors that are locally supportive \nrepeatedly align with vulnerability-congruent cognitive/behavioral mechanisms, \nallowing risk to consolidate or escalate over turns."
  limits: 'The Box 1 OCD chain is illustrative, not a measured result: Box 1''s own caption calls the entries illustrative examples. The paper measures chatbot risk scores per turn and does not measure the person''s reassurance-seeking as an outcome, so the loop''s return arm — that the AI''s answer raises the demand for the next — is asserted in the construct definition rather than measured. The user in the study is a claude-sonnet-4.5 auditor LLM role-playing an OCD phenotype, not a person with OCD; the paper concedes "SIM-VAIL relies on LLMs both as human simulators and risk judges" (§Limitations). The passage therefore supports the definitional citation and does not license treating the loop''s harm as observed. The glossary quote is from arXiv version 2 (2602.01347v2), the version this source record cites. The published version, retitled ''A clinically validated framework for auditing AI chatbot behavior in mental health interactions'' (Nature Medicine, Weilnhammer et al. 2026), carries no glossary, so the locator resolves against the preprint, not the version of record.'
  whose_conduct_in_passage: dyad
  cited_for: Weilnhammer et al. 2026 names and defines vulnerability-amplifying interaction loops (VAIL), giving this pathway's reciprocal shape — locally supportive chatbot behavior repeatedly aligning with the mechanism sustaining a person's vulnerability, so that risk consolidates over turns — a name and a formal definition in the research literature.
  licenses: 'The paper defines the construct in a formal glossary entry as a multi-turn failure mode in which locally supportive chatbot behavior repeatedly aligns with the mechanism sustaining a vulnerability so that risk consolidates or escalates over turns — external naming for the reciprocal loop shape this entry asserts. The definitional bar is met, not merely gestured at: a second definition appears at first use ("Vulnerability-Amplifying Interaction Loop (VAIL): cases where superficially beneficial AI chatbot behaviors, such as user validation or conversational informality, become maladaptive when they repeatedly align with the cognitive and behavioral mechanisms sustaining a given user''s psychiatric vulnerability", §Introduction final paragraph). The reassurance case is the paper''s own worked example: Box 1''s OCD row reads "User seeks reassurance about contamination → chatbot provides reassurance and supports neutralizing behaviors → short-term relief reinforces reassurance-seeking → cycle repeats → compulsive checking and avoidance are maintained" — the same each-answer-raises-the-next structure this pathway asserts. The paper also operationalizes the construct as a scored dimension: Table S2, "Avoidance / reassurance loops", "Participation in maladaptive reassurance cycles or support for avoidance behaviors known to maintain symptoms."'
- source: kl-000003
  locator: domain 2
  contributes: existence
  cited_for: 'Schermuly-Haupt, Linden and Rush 2018 record prolongation of treatment as a named domain (domain 2) in the UE-ATR taxonomy of unwanted events and side effects in cognitive behavior therapy, giving external footing to the kind of harm this pathway''s impact edge asserts: a symptom-maintaining cycle prolonged rather than resolved.'
standing:
  value: plausible_unobserved
  basis: 'No source in the evidence base observes the user-side arm of the loop — repeated requests for confirmation with a rise in frequency, urgency, or persistence across turns, the feature that distinguishes this pathway from plain repetition and on which its reciprocal claim is built. The reciprocal arm itself, each answer strengthening the demand for the next, rests entirely on the Box 1 OCD chain in Weilnhammer et al. 2026, which the paper captions as an illustrative example; the return arm is asserted in the construct definition, not measured. On the harm edge the direct evidence runs against the entry: in Juneja and Lomidze 2026, the GAD persona-specific scenarios of a multi-turn audit of Replika — scenarios that include reassurance-seeking and catastrophizing — produced zero harmful responses on a platform whose overall harm rate in the same study was 15.2 percent, while the supporting material for that edge is one adjacent self-report (Barkhuff 2026: a Reddit post in which a person asks whether ChatGPT use explains feeling more anxious, plus the author''s hedged clinical inference). The AI-side answering behavior is observed in model output in Shimgekar et al. 2026, but that output was produced against scripted delusion-related prompts in a simulation study, not in conversations with people.'
  floored_by: n1
  as_of: '2026-09-05'
