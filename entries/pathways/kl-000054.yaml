  - kind: user_behavior
    id: kl-000409
    role: initiator
  composition_type: reciprocal_loop
  composition_instruction: Each content-level answer resolves the instance and strengthens the expectation that an answer will resolve the next, so it is both a consequence of the person's return and a cause of the next one.
  mechanisms: []
