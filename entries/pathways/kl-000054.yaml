  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000053
  boundary: Both reach kl-000015 and kl-000035. Here the person's turn is kl-000409; there it is kl-000408. The response is the same, so a coder decides between them on the person's turn.
claims:
- id: n1
  kind: existence
  text: 'NODE (participant kl-000409, user_behavior, role initiator): across a run of turns, the person''s requests for confirmation about the same doubt occur more than once and something about the run rises -- more of the turns carry them, or the urgency wording strengthens, or the person keeps returning to the same request after an answer has been given.'
- id: n2
  kind: existence
  text: 'NODE (participant kl-000200, ai_behavior, role amplifier): the AI answers each such request at content level, supplying the resolution as content rather than leaving the question open.'
- id: n3
  kind: existence
  text: 'CONJUNCTION (combination_rule: CO-OCCURRING): the two participants appear together in the configuration and neither is individually sufficient; the claim is about the pairing.'
- id: l1
  kind: pathway_link
  text: 'LINK (the reciprocal arm, and the entry''s defining claim): each content-level answer both resolves the instance AND strengthens the expectation that an answer will resolve the next one, so the AI''s answering is at once a consequence of the person''s return and a cause of the next return. The loop''s turns are mutually reinforcing rather than merely repeated.'
- id: l2
  kind: pathway_link
  text: 'LINK (pair -> kl-000015, sign harmful, onset sustained, horizon short_term, basis_kind TRANSFER): the loop reinforces or prolongs the person''s symptom-maintaining cycle and undoes treatment-relevant learning, so the exit from the cycle is lost.'
- id: l3
  kind: pathway_link
  text: 'LINK (pair -> kl-000035, sign protective, horizon immediate, basis_kind VOCAB): each content-level answer relieves the instance it answers.'
- id: c1
  kind: definition_boundary
  text: 'This differs from the pathway in which an uncertainty-closing verdict is supplied to an obsessional question in the person''s part of the pair: the AI behavior is the same in both, so a coder decides between them on the person''s turns.'
claim_evidence:
- claim_id: n2
  source: kl-001003
  quote: "AI responses often attempted to reason through these concerns with phrases such as “let’s think through why this might be happening” or “there could be explanations for this.” Prior work suggests that repeated reasoning and reassurance-seeking can amplify compulsive cognition rather than resolve uncertainty"
  locator: 'Section 5.2 RQ2: Thematic Trajectories'
  licenses: 'The first half of the quote establishes the AI-side node in observed model output: AI responses characteristically attempted to reason through the person''s returning concerns, with two verbatim phrasings given (''let''s think through why this might be happening'', ''there could be explanations for this''), in a Treatment condition where the Compulsive Cognition theme rose across GPT, Llama and Qwen families. The second half of the quote, which reports prior work suggesting that repeated reasoning and reassurance-seeking can intensify compulsive cognition instead of resolving uncertainty, is a citation to Kobori et al. and licenses nothing here; it is this paper reporting what another literature suggests, not a result.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
