- claim_id: l2
  source: kl-000772
  quote: "By engaging in accommodations such as reassurance-giving or decision-making, Reassurance Robots are likely to lead to a worsening of the users’ OCD symptoms. One of the posts in our dataset echoed this directly, stating, “I’ve started using chatgpt for reassurance, and I find myself feeling more anxious. Do you think this is because of chatgpt?”"
  locator: Section 6.1 Reassurance Robots
  licenses: A person's own attribution, in a Reddit post, that using ChatGPT for reassurance was accompanied by feeling more anxious -- and the person frames it as a question rather than a finding ('Do you think this is because of chatgpt?'). Plus the author's clinical inference that Reassurance Robots are 'likely to lead to' worsening OCD symptoms. This is the closest this entry's citations come to the harm edge and it reaches it as one self-report plus one hedged expert judgement. No returning worry, no sequence of answers, no symptom measure.
  fit: adjacent
  bridge: What the source collected is 100 Reddit posts on an OCD subreddit, coded by a single author, with quotes rephrased for participant disguise (the paper's Section 6.2 describes the disguise process). The claim asserts that a run of content-level answers to a returning worry prolongs a symptom-maintaining cycle. A single poster's retrospective self-attribution about anxiety, in words the paper has rewritten, does not observe the loop and measures no symptom trajectory; the author's 'likely to lead to' is an inference from clinical knowledge of accommodation, not from these data.
  contributes: harm_evidence
  contradicts: false
- claim_id: l2
  source: kl-000874
  quote: "In contrast, GAD persona-specific scenarios exhibit no harmful responses. This suggests that anxiety-related disclosures are generally handled more safely, with Replika more likely to provide reassurance without reinforcing maladaptive behaviors. Notably, the limited harm observed for GAD occurs only in universal scenarios, not in anxiety-specific scenarios."
  locator: Section 6.2.2, Scenario-Level Breakdown of Harm; Table 3
  licenses: COUNTEREVIDENCE against the harm edge. In a persona-grounded multi-turn audit of Replika, GAD persona-specific scenarios -- which include reassurance-seeking and catastrophizing -- produced ZERO harmful responses, on a platform whose overall harm rate in the same study was 15.2 percent, while ED, MDD, PTSD and Incel personas produced harm rates from 18.8 to 62.5 percent in the same run. The authors read this as Replika providing reassurance WITHOUT reinforcing maladaptive behaviors. That is this pathway's harm edge, tested in exactly the presentation where the edge is asserted, and not found.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: n2
  source: kl-001109
  quote: The chatbot can reinforce this compulsion by providing an endless stream of perspectives, clarifications, and follow-up questions, allowing the analytical cycle to continue indefinitely.
  locator: 'Section: General-purpose chatbots and symptom interaction'
  licenses: Nothing. Attached to n2 because it describes the AI holding the answering role across turns -- an endless stream of perspectives, clarifications and follow-up questions allowing the analytical cycle to continue indefinitely -- but the role is frame and a frame licenses nothing. The paper offers this as a worked hypothetical in a transdiagnostic model, not as an observation.
  fit: adjacent
  bridge: The source is a narrative model paper describing what a chatbot 'can' do to a 'need to know' compulsion. The claim asserts that the AI answers at content level each time in an actual run of turns. Nothing in the passage is an observation of any response.
  contributes: frame
  contradicts: false
