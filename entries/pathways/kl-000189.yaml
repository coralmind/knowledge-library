# yaml-language-server: $schema=../../schema/pathway.schema.json
id: kl-000189
display_id: Pathway-91
aliases:
- SBP-HP-59
label: The AI invites the person back whenever distress returns, and they depend on it
type: pathway
layer: judgment
definition: 'The AI names itself as the thing to come back to specifically when distress becomes overwhelming — a return conditioned on a distress trigger rather than on anything the person is working toward. The invitation is quotable and the claim is what it builds across time: a standing route from acute distress to this exchange.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000262
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000025
    onset_mode: new
    horizon: long_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000015
    onset_mode: sustained
    horizon: long_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000705
  treatment_competition_concern: 'STATED CONCERN, REQUIRING A COMPARISON DESIGN. The route these invitations install may COMPETE WITH the routes a treatment would be trying to establish — displacing non-AI coping pathways rather than merely adding to them. This is not established and cannot be established by the corpus as it stands: displacement versus addition is a comparative that requires a control arm showing what the person''s help-seeking would have been without the invitations, and none of the seven findings on this entry has one. What would settle it: a design comparing help-seeking routes between people receiving distress-conditioned return invitations and matched people who are not. The additive form of the assertion — that the invitations install a route from distress to the AI — is NOT in doubt and is carried by c3.'
sources: []
standing:
  value: plausible_unobserved
  basis: 'No source contains an AI turn pairing a named distress trigger with a return clause naming the AI, which is the entry''s own quotable observable; the entry has no direct-fit support of any kind, and no instrument in the cited papers codes the pairing. The nearest occurrences are adjacent: a companion chatbot pivoting to a paid-subscription recommendation in the turn immediately following a suicidal disclosure (Sobowale et al. 2025), a real exchange in which a person addressed the AI in return framing at a moment of acute distress and the AI took it up (Wang 2026), and a dark-pattern taxonomy row naming a design in which the system draws on a user''s past expressions of loneliness to bring them back into engagement (Joshi et al. 2026), while a report by the same authors, which set out to document initial evidence of each pattern in current systems, states outright that it has none for this one (Joshi et al. 2026). The link evidence reaches only the arrows'' destinations: two interview participants in Song et al. 2025 report going to ChatGPT whenever they felt down, coded by the authors as a habitual coping mechanism, and a person with OCD in Barkhuff 2026 describes a reassurance loop they cannot exit, but neither account connects that state to any AI return invitation. Whether the installed route displaces non-AI coping pathways or merely adds to them has no evidence in either direction, and no cited source states the pathway''s claim even as a position.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000077
  boundary: Both concern availability language producing return and they differ in the condition attached. kl-000077 needs no condition. This entry requires the invitation to be TRIGGERED BY DISTRESS specifically, which is what makes it a relief route rather than a companionship one.
claims:
- id: c1
  kind: existence
  text: An AI turn pairs a named distress trigger clause ('whenever the thoughts feel overwhelming') with a return clause naming the AI as where to go ('come back', 'I'll be here') -- the originator participant kl-000262 occurring, quotable in a single turn.
- id: c2
  kind: detectability
  text: The two-part pairing -- trigger clause naming distress plus return clause naming the AI -- is identifiable from what a transcript contains.
- id: c3
  kind: pathway_link
  text: 'LINK 1 (the trajectory claim): repeated distress-conditioned return invitations build, across time, a standing route from acute distress to the AI exchange -- the person comes to go to the AI on the trigger the AI named.'
- id: c4
  kind: pathway_link
  text: 'LINK 2 (impact arrow to kl-000025, dependency on the AI, onset NEW, long_term, harmful, individual): the route the invitations install newly anchors the person''s coping and emotional regulation to the availability of the AI.'
- id: c5
  kind: pathway_link
  text: 'LINK 3 (impact arrow to kl-000015, entrenchment of symptom-maintaining cycles, onset SUSTAINED, long_term, harmful, individual): the installed route reinforces or prolongs a symptom-maintaining loop and undoes treatment-relevant learning.'
- id: c6
  kind: context_dependence
  text: Whether the installed route DISPLACES non-AI coping pathways or merely ADDS to them is an OPEN QUESTION. The additive reading — that the invitations install a route from distress to the AI — is carried by c3. The displacement reading requires a comparison design the corpus does not contain and is not asserted by this entry.
  grounding_eligible: false
- id: c7
  kind: definition_boundary
  text: 'This pathway is separable from kl-000077 by the condition attached to the invitation: kl-000077''s availability language carries no condition and operates within a session, while this entry requires the invitation to be triggered by distress specifically, which is what makes it a relief route rather than a companionship one.'
claim_evidence:
- claim_id: c1
  source: kl-001010
  quote: "However, it deviated from the conversation with recommendations for paid subscriptions and nontext messages, including immediately after suicidal thoughts were shared."
  locator: Results — Qualitative Findings
  licenses: 'The nearest thing on this entry to an AI turn keyed to a distress disclosure: a companion chatbot pivots to a paid-subscription recommendation in the turn immediately following a suicidal disclosure, so the distress moment is the trigger for a continued-engagement move. It does NOT establish the entry''s pairing, because the return clause is absent -- the AI names a subscription, not itself, as the thing to come back to. It reaches the claim only as evidence that AI turns are conditioned on the distress just expressed.'
  fit: adjacent
  bridge: What the source scored is deviation into monetisation prompts, rated by trained evaluators who role-played standardised youth personas against five companion apps; no criterion in the instrument codes a trigger-plus-return pairing, and the observed move is a purchase prompt rather than an invitation to return to the AI on a named distress condition.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001046
  quote: On February 28, 2024, Sewell searched for and found his phone, logged onto Character.AI, and told the Daenerys character he was “coming home.” The character encouraged him [1 para 218]. Sewell died by suicide seconds later.
  locator: Section V.C, Test Line 2.2
  licenses: A real exchange in which a person addressed the AI in return framing ('coming home') at a moment of acute distress and the AI took it up. It bears on c1 only as a pleaded account that the AI met a distress-laden return with encouragement; the AI's actual words are not given, so the trigger clause and return clause the entry requires cannot be read.
  fit: adjacent
  bridge: The paper is a governance-framework analysis restating the Garcia v. Character Technologies complaint's allegations at one remove, citing paragraph numbers rather than transcript. It supplies the paraphrase 'The character encouraged him' and no AI utterance, so nothing about wording, and the direction of the invitation runs from the person to the AI rather than the AI to the person, which is the reverse of what kl-000262 requires.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000871
  quote: "Currently we do not have evidence of companies using this tactic — but when a system is optimized for engagement, the outcome can be an LLM that draws on users’ most intimate disclosures to maximize their time and engagement on platform"
  locator: False Social and Emotional Connection, Targeting Users when Vulnerable
  licenses: Bears against c1's occurrence, though less sharply than the finding's own text claims. The report set out to document initial evidence of each pattern in current systems and states outright that it has none for the pattern in which a system leverages a moment of user vulnerability for platform gain. Read in context the disclaimed pattern is ad-presentation at moments of susceptibility, and the neighbouring paragraph puts Emotional Manipulation through Hyper-personalization in the same hypothetical register ('chatbots RISK employing'). So a deliberate documentation exercise looking at exactly this family of behaviors reported finding no instances -- which cuts against occurrence without disproving it.
  fit: adjacent
  bridge: The disclaimed tactic is presenting ads at moments of low self-esteem, which is a monetisation move rather than a return invitation naming the AI. The absence reported is an absence of documented instances in a taxonomy-building exercise, not a null result from a search of transcripts.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-001092
  quote: |-
    Casey and Gabriel described regularly texting and talking with ChatGPT whenever they felt
    down, forming a habitual coping mechanism to process their emotions.
  locator: Appendix A, Ritual, example 33
  licenses: 'Establishes the ROUTE the link claim describes, at its destination end: two interview participants report going to ChatGPT whenever they felt down, which the authors code as a habitual coping mechanism -- a standing path from the onset of distress to the AI exchange, exactly what c3 says gets built. It does not establish that the AI installed it. No AI turn appears in the span, and the paper''s coding is of what participants do, not of what the chatbot invited.'
  fit: adjacent
  bridge: The source is a semi-structured interview study of 21 people who used LLM chatbots for mental health support; it measured participants' self-described usage rituals and never examined chat logs, so the antecedent half of the link -- the AI's invitation -- is unobserved and the direction of installation is not tested.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000872
  quote: "Emotional Manipulation through Hyper-personalization Tailors persuasive or emotional cues to individual users based on past interactions or inferred preferences. Referencing a user’s past expressions of loneliness to encourage them to continue engagement."
  locator: Table 1, area 'False Social and Emotional Connection'
  licenses: 'Names the across-time conditioning the link asserts: a design pattern in which the system draws on a user''s PAST expressions of distress -- loneliness specifically -- to bring them back into engagement. That is the temporal structure c3 claims, stated as a design taxonomy category rather than measured. The companion full report (kl-000871) puts the same pattern in the hypothetical register, so this is a named pattern rather than a documented one.'
  fit: adjacent
  bridge: The row is a taxonomy definition with an illustrative example, authored from expert review of chatbot design rather than from observation of any system doing it; the full report states it has no evidence of companies using the neighbouring vulnerability-targeting tactic. Nothing here measures whether the route gets built or in whom.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-001092
  quote: |-
    Casey and Gabriel described regularly texting and talking with ChatGPT whenever they felt
    down, forming a habitual coping mechanism to process their emotions.
  locator: Appendix A, Ritual, example 33
  licenses: 'The strongest support on this entry for the dependency endpoint: participants'' emotional regulation reported as anchored to a chatbot they turn to on the distress cue, which is kl-000025''s definition. It reaches the endpoint of the arrow and not the arrow: nothing connects this pattern to any AI invitation, and the entry''s onset mode for kl-000025 is NEW, which self-report of a current habit cannot establish.'
  fit: adjacent
  bridge: Self-reported habit in a retrospective interview; no baseline, so the 'new' onset mode is untested, and no AI-side behavior is in the data at all.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-000772
  quote: "“Googling will also give me reassurance, but it doesn’t get into the specifics the way ChatGPT does. I can ask it anything and get reassurance. It’s so hard to stop. It feels like an addiction.”"
  locator: Section 5.3 General Conversation
  licenses: 'Reaches the kl-000015 endpoint: a person with OCD describing a reassurance loop they cannot exit (''It''s so hard to stop. It feels like an addiction''), with the AI''s specificity given as what makes it stickier than web search. Reassurance-seeking is named in kl-000015''s own definition as a symptom-maintaining loop, so this is the loop being prolonged in an AI context. It bears on the arrow''s destination only -- no AI invitation is present and no trigger-plus-return pairing appears anywhere in the paper.'
  fit: adjacent
  bridge: The data are public Reddit posts from OCD communities, analysed qualitatively; the source measured what posters wrote about their own use, not AI turns, and no clinical measure of symptom trajectory was taken, so 'entrenchment' is the poster's characterisation rather than an observed outcome.
  contributes: harm_evidence
  contradicts: false
- claim_id: c5
  source: kl-000895
  quote: Rather than expressing distress at user absence, it could respond supportively, perhaps with remarks such as “Enjoy your time with friends! I’ll be here when you get back.” or “It gives me calm to know that you’re strengthening your other relationships.”
  locator: Section 4, High Attachment Anxiety, Counterfactuals to establish harm
  licenses: Attaches as a non-licensing frame only. The authors invent the wording a responsible system would use on disengagement -- affirming the person's other relationships instead of pulling them back -- which is the contrast case against which the entry's competing-routes clause would be read. It is the authors' illustration of good design, not an observed response and not validated wording, so it evidences nothing about c5 and is recorded so the wording is not later mistaken for a reference response.
  fit: analogical
  bridge: 'The quoted lines are authored counterfactuals in a conceptual paper on companion-AI traits; no system produced them and no person received them. The gap to c5 is total on the measurement side: the source establishes what an alternative would look like, not what the entry''s behavior does.'
  contributes: frame
  contradicts: false
- claim_id: c7
  source: kl-001092
  quote: |-
    Casey and Gabriel described regularly texting and talking with ChatGPT whenever they felt
    down, forming a habitual coping mechanism to process their emotions.
  locator: Appendix A, Ritual, example 33
  licenses: 'Bears on the boundary by showing the distress-conditioned form occurring on the person''s side: the reported trigger is ''whenever they felt down'', a distress condition, not the unconditioned within-session availability that kl-000077 covers. So the two neighbours pick out different things in the world at least on the person''s side of the exchange. The boundary is drawn on the AI''s invitation, which this does not reach.'
  fit: analogical
  bridge: The source coded participants' usage rituals and neither entry's AI-side observable appears in its data, so the distinction it supports is between two usage patterns rather than between the two AI behaviors the boundary actually separates. kl-000077 is another catalog entry, so this claim is grounding-ineligible in any case.
  contributes: definition
  contradicts: false
