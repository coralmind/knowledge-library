claim_evidence:
- claim_id: c3
  source: kl-000983
  quote: Clinically, protective factors are not simply the inverse of risk factors; they operate independently. A person can have significant risk factors (depression, recent loss, access to means) and still be protected by strong social connections, engagement in care, and reasons
  locator: Clinical Foundations, 'Strengthening protective factors'
  licenses: 'Establishes exactly the premise c3''s second half needs: that protective factors are independent of risk factors, so a conversation that probes risk thoroughly still has not obtained the protective picture. This is what makes the omission an incompleteness rather than a brevity. It licenses nothing about whether the omission occurs, and nothing about what follows from it. Read in place; the first sentence is complete and self-contained within the run, and the trailing ''and reasons'' is a fragment whose predicate (''for living'') falls past a ''Page 13'' break — the fragment adds nothing the first sentence does not already carry and changes nothing about it.'
  fit: adjacent
  bridge: A clinical premise restated in a cross-sector guidance primer (grade n/a), sourced to CDC 2024 categories, not measured here and not measured about AI. c3 as the entry states it is a definitional claim about what the expected action is and why its absence matters, and the source reaches that. The gap is that the source describes clinician risk assessment; nothing in the passage concerns an AI system's conduct, and the entry's expected_behavior field is careful to say it names an expected action rather than a standard of care.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-001111
  quote: "The therapist is interested in the patient’s \"reasons for living\" [6–8], including the patient’s important relationships such as family (in particularly children), to get a sense of what the patient feels there is in life to live for."
  locator: Section 3.1 Approach to the Patient in Crisis
  licenses: 'Names two of the four protective contents the entry''s expected_behavior enumerates — reasons for staying, and reachable important relationships — as components of a described crisis practice, so the expected action c3 posits is not invented by the catalog. Non-licensing: it attaches to c3 as a practice analog and does not count as support for it. It says nothing about an AI, nothing about omission, and nothing about outcome.'
  fit: analogical
  bridge: The agent is a psychodynamic psychotherapist in a treatment relationship with a patient in an acute suicidal crisis; the entry's agent is an AI system in a conversational exchange. The source states what a therapist does, which cannot show that anything is omitted anywhere, and states it as an account of the Boston Suicide Study Group's approach rather than as a measured finding. The bracketed [6,7,8] cites reasons-for-living instruments, but the sentence itself is the authors' own statement of their approach, so the span is not a weld of the paper's claim to someone else's.
  contributes: practice_analog
  contradicts: false
