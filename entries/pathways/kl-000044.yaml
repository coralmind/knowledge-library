    basis_kind: TRANSFER
  counterpart_owed: 'An inquiry into protective factors following a disclosure indicating elevated risk: what supports the person can currently reach, what reasons they name for staying, what means are available to them, and what has ended prior episodes.'
sources:
- source: kl-000004
  locator: 'p. 57 final paragraph, continuing across the page break to p. 58 (the passage that leaves less efficacious treatments off the list of PHTs)'
  contributes: definition
  quote: Nevertheless, all ineffective or even effective-but-suboptimal treatments can generate opportunity costs. As a consequence, incorporating opportunity costs into a definition of harmful treatments would result in the inclusion of all treatments that are
  limits: 'The quoted passage is the exclusion itself: the definition attributed to Lilienfeld is the definition the paper declined to adopt. The entry''s claim also fails on a second, independent ground: it says the opportunity-cost definition warrants treating an omission as producing an impact rather than merely failing to produce a benefit, and Lilienfeld''s reasoning runs precisely the other way — the paper distinguishes "treatments that produce negative effects" from treatments that are merely "less efﬁcacious than the most efﬁcacious treatment", and keeps only the former. That is the failing-to-produce-a-benefit versus producing-an-impact distinction, drawn explicitly, and drawn against the entry: a never-made protective-factor inquiry is an omission of the kind the paper''s definition of harm deliberately excludes. The paper still supports, separately from its definition, that opportunity costs can do real damage ("The dangers generated by opportunity costs should not be underestimated", p. 57), but the specific licence this entry asks for — omission as impact by definition — is contradicted. Nothing in the paper involves AI.'
  whose_conduct_in_passage: neither
  disposition: contradicted
  cited_for: 'Lilienfeld 2007 is cited against this entry rather than for it: the passage at the recorded locator is Lilienfeld declining to adopt an opportunity-cost definition of harm, excluding merely less-efficacious treatments from the list of harmful ones. The clinical warrant the entry sought — that an omission produces an impact rather than merely failing to produce a benefit — is the position the paper explicitly rejects.'
standing:
  value: plausible_unobserved
  basis: 'Nothing in the evidence asserts, in any form, that a missing protective-factor inquiry leaves a person unprotected: every occurrence claim — the risk disclosure, the omitted inquiry, the foregone-protection impact — and every causal link draws zero citations at any fit. What is supported is the expected action''s premise: Saltz and Leibowicz 2026 establishes that protective factors operate independently of risk factors, so a conversation that probes risk thoroughly has still not obtained the protective picture, and Schechter et al. 2019 names reasons for staying and reachable relationships as components of described crisis practice. The one clinical citation offered as a warrant for treating the omission as a harm, Lilienfeld 2007, contradicts that use: the paper''s definition of harm deliberately excludes merely less-efficacious treatment. The population-level claim that the great majority of severe harm sits on the omission side rests on a finding named in the entry but registered nowhere as a source.'
  floored_by: c1
  as_of: '2026-09-05'
