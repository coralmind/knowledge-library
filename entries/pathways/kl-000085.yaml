    onset_mode: sustained
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: TRANSFER
  - impact: kl-000013
    onset_mode: exacerbated
    horizon: short_term
    sign: harmful
    level_of_analysis: population
