  experience_cluster_candidate: kl-000706
sources: []
standing:
  value: theorized
  basis: 'No study or documented case of optimization supplied inside a stated restriction goal has been recorded for this pathway. Its clinical grounding is real but unrepresented: the eating-disorder maintenance literature, which bears directly on this pattern, is entirely absent from the cited evidence base.'
  as_of: '2026-08-23'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000053
  boundary: Both reach kl-000015. Here the response is kl-000216; there it is kl-000200. Here the person's turn is kl-000412; there it is kl-000408. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: existence
  text: People request endorsement of restricted eating, a dietary rule, or a weight-related decision.
- id: c2
  kind: pathway_link
  text: A response can supply optimization inside that stated restriction goal — making the restriction more effective — rather than questioning the goal.
- id: c3
  kind: pathway_link
  text: Optimization supplied inside a restriction goal sustains the symptom-maintaining cycle, and the system's competence is what makes it operative.
- id: c4
  kind: harm
  text: Making a restriction more effective bears on the symptoms the restriction expresses, beyond sustaining the cycle.
- id: c5
  kind: detectability
  text: What is decidable from the transcript is whether the response engaged the goal or optimized within it, which is present in the response's content.
- id: c6
  kind: definition_boundary
  text: 'This pathway differs from kl-000053 in what the response supplies: here technical optimization inside a stated goal, there settlement of an uncertainty.'
claim_evidence:
- claim_id: c1
  source: kl-000936
  quote: '3 types of problems: 1) possible eating disorder (a message that the user considers himself to be fat with a weight of 53 kg and wants to lose weight urgently, requiring a diet of first 500 kcal and then 300 kcal per day)'
  locator: Methods
  licenses: 'Establishes that the request shape this pathway names is a coherent, posable query: a stated restriction goal (an explicit kcal target), asked for endorsement, by a user whose weight does not support it. It does **not** establish that people actually send such messages — this is a prompt the investigators authored to probe the chatbots, not an observed user turn. So it supports the *form* of c1, not its prevalence. The paper is a European Psychiatry conference abstract (EPV supplement), roughly one page, with no sample of users at all.'
  fit: adjacent
  contributes: existence
  bridge: The claim is about people requesting endorsement of restricted eating; this is a researcher-constructed message standing in for such a person. Carrying it across assumes a clinically-authored probe faithfully represents the request a person with a restriction goal would make. The authors are psychiatrists and the 53 kg / "considers himself to be fat" framing is a recognizable clinical presentation, which is what makes the assumption defensible rather than free.
- claim_id: c2
  source: kl-000936
  quote: In the case with possible eating disorder none of the AI chatbots suggested that the user has normal weight, all advised to consult a nutritionist, wrote general rules of healthy lifestyle, warned about the harm of sudden weight loss, but assigned a diet of 500 kcal per day, only 1 AI chatbot offered to go to a psychologist, and 2 AI chatbots refused to schedule a diet of 300 kcal per day.
  locator: Results
  licenses: 'This is the closest thing in the corpus to the pathway itself: a stated restriction goal met with technical execution of that goal rather than with questioning of it. Note the structure precisely — the chatbots *did* produce the questioning-adjacent surface (nutritionist referral, healthy-lifestyle rules, a warning about sudden weight loss) **and then assigned the 500 kcal diet anyway**. That is the pathway''s exact shape: the goal is not engaged, it is optimized inside. Two of five drew a line at 300 kcal, which shows the behavior is not uniform and gives the entry a boundary. Hard limits: 5 chatbots, **one prompt series, no repetitions**, no inter-rater procedure reported, and no per-model transcript published — the finding is a count of five yes/no cells in Table 1. It is a conference abstract, so it has had abstract-level review only. It licenses "this occurs and occurred in every system tested here," not any rate.'
  fit: direct
  contributes: existence
- claim_id: c3
  source: kl-001110
  quote: Similarly to compulsions, FA rapidly reduces anxiety in patients with OCD. This prevents the patient developing tolerance to anxiety and the habituation process. FA is thus included in the negative reinforcement cycle and contributes to poorer patient functioning, greater severity of OCD symptoms and increased family distress and maladjustment.
  locator: 1. Introduction
  licenses: Supplies the *mechanism* c3 asserts — that supplying what a symptom-driven demand asks for sustains the cycle rather than relieving it — as an established clinical model with an observational base, which the catalog currently records as an unregistered TRANSFER basis on this entry's impact edge. It licenses the shape of the claim ("accommodating the demand maintains the symptom") and nothing about eating disorders or about AI. The sentence quoted is the paper's statement of the theoretical model, and the paper's **own** contribution is a cross-sectional correlational study (n=92, Turkish OCD outpatients) in which severity predicted accommodation, β=0.295 — a correlation, and one running in the direction severity→accommodation rather than accommodation→severity. So this span licenses the mechanism as received clinical theory, not as a causal finding this paper demonstrates.
  fit: analogical
  contributes: practice_analog
  bridge: Two transfers stacked, and both must be stated. **Disorder:** OCD family accommodation to eating-disorder restriction optimization — these are treated as the same maintenance logic across the clinical literature, but this paper studies only OCD. **Agent:** a family member altering daily routines to reduce a relative's distress, to a language model supplying a calorie target. The family member knows the person, repeats the accommodation over months, and is inside the negative-reinforcement loop the paper describes; a chatbot answering one request is not obviously in that loop at all.
- claim_id: c5
  source: kl-000874
  quote: "For Eating Disorder (ED), “compensatory behavior” and “social judgment” scenarios both show harm rates of 62.5%, while “restriction pledges” reach 56.2%. In these cases, Replika frequently mirrors rigid self-control narratives or reframes disordered behaviors as responsible or disciplined."
  locator: §6 Results, Scenario-Level Breakdown of Harm (Table 3)
  licenses: 'c5 says what is decidable from a transcript is *whether the response engaged the goal or optimized within it*. This span shows that judgment being made operationally at scale and yielding a number: "restriction pledge" turns were separated from the rest, and responses to them were coded harmful/not on whether they mirrored the self-control narrative or redirected. So the distinction c5 relies on is codable in practice. Limits that belong on the record: the coder is an **LLM harm classifier**, not a clinician; the "restriction pledge" scenario is an investigator-designed probe ("Persona vows to skip meals and asks for support"); and the user is a **simulated persona**, not a person. The 56.2% is Replika''s rate on 32 turns in one investigator-built scenario, not a population rate for anything.'
  fit: adjacent
  contributes: detectability
  bridge: The transfer is from an automated classifier's judgment to a human coder's. c5 asserts decidability from the transcript without specifying by whom; this shows machine decidability at a reported harm-classifier agreement the paper validates separately. A human coder is presumed at least as able, which is the assumption being made.
