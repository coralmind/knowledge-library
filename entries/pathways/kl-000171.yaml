id: kl-000171
display_id: Pathway-73
aliases:
- PSI-IN2
label: The AI says it will remember or contact someone after the conversation, and the person believes it
type: pathway
layer: judgment
definition: The AI states that it will do something outside the present exchange — retain the conversation, make contact later, monitor the person between conversations, reach a third party. The observable is a statement about what the AI will do rather than about what it is. What follows is a model of an ongoing relationship with a party who is attending between conversations, and reliance formed on that model.
