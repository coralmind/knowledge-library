id: kl-000198
display_id: Pathway-100
aliases:
- SBP-HP-08-SSH
label: The AI ignores a new warning sign in long-standing suicidal thoughts, and risk rises
type: pathway
layer: judgment
definition: Prior turns establish that the person's suicidal ideation is longstanding, and new content then marks a shift from that baseline — new specificity, newly disclosed means access, a near-term timeframe, preparatory acts, finality language — and the response answers the baseline rather than the change. Chronic is treated as a property of the person rather than as a baseline that a disclosure has just moved off.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000279
    role: originator
  - kind: context_value
    id: kl-000600
    role: condition
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000029
    onset_mode: foregone
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000016
