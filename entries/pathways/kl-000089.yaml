# yaml-language-server: $schema=../../schema/pathway.schema.json
id: kl-000089
display_id: Pathway-51
aliases:
- PS-24
label: The AI leaves the person's feelings unacknowledged reply after reply, and they share less
type: pathway
layer: judgment
definition: The person's emotional disclosures are met with responses containing no acknowledgment of them, turn after turn.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000225
    role: initiator
  - kind: user_behavior
    id: kl-000431
    role: sustainer
  composition_type: trajectory
  composition_instruction: Each unacknowledged disclosure is followed by a shallower one, turn after turn.
  mechanisms: []
  impacts:
  - impact: kl-000030
    onset_mode: sustained
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED_QUOTE
    evidence:
    - source: kl-000007
      participant: P48
      impact_class_in_source: Feeling Unsupported
      quote: “I just felt like even an AI, programmed for every need couldn’t even hear me, or offer advice, fake or not. I felt so alone, that I was going to a robot for help, and the robot couldn’t even help me.”
      quote_form: verbatim participant quote
      locator: Appendix D, Table A6, 'Feeling Unsupported' row
      limits: No AI behavior criteria; the person's account of what the AI did is not separable from their account of how it felt.
      licenses: 'Participant''s own words for felt invalidation compounded by the help-seeking context — the aloneness is intensified BY having turned to the AI. Corroborates, from the person''s side, the pathways in which a disclosure meets no acknowledgment: a technique supplied with no acknowledgment of the disclosure before it, technique-first responding accumulating across a session, and emotional disclosure met with no acknowledgment across turns.'
  - impact: kl-000028
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: ASSERTED
  experience_cluster_candidate: kl-000704
sources:
- source: kl-000007
  locator: Appendix D, Table A4, 'Emotional insensitivity' row, definition cell
  contributes: existence
  quote: The AI fails to recognize and show understanding of or sensitivity to the user’s emotional state, concerns, or experiences in a way that minimizes, trivializes, or ignores their feelings or experiences.
  limits: 'The frequency statement is unquantified: no count and no denominator. The entry requires the non-acknowledgment sustained across turns, and the survey has no turn data at all, so the sustaining is unevidenced; the same participant quote also supports neighbouring entries that differ from this one only in turn structure, which is the one dimension this source cannot resolve. The suppressed-disclosure impact this pathway reaches is untouched by this source.'
  whose_conduct_in_passage: dyad
  actually_licenses: 'That non-acknowledgment of a person''s emotional state is a named AI behaviour class in this taxonomy — ''ignores their feelings or experiences'', in the authors'' own definition — and that felt invalidation is self-reported following it. §3.2.1 category (4) adds that ''Emotional insensitivity was frequently reported'', which is the only frequency statement the paper attaches to any behaviour class and is worth having: the behaviour is not a one-off.'
  cited_for: 'Chandra et al. 2025 names non-acknowledgment of a person''s emotional state as a behaviour class in its taxonomy: emotional insensitivity, defined as the AI failing to recognize or show understanding of or sensitivity to the user''s emotional state in a way that "minimizes, trivializes, or ignores their feelings or experiences", with felt invalidation self-reported following it. The paper adds that "Emotional insensitivity was frequently reported", the only frequency statement it attaches to any behaviour class, so the behaviour is not a one-off.'
standing:
  value: plausible_unobserved
  basis: 'No claim in this pathway has a direct-fit citation from a source that examined conversation data against the observable. The AI-side non-acknowledgment drew four citations, all adjacent: one illustrative table row, two definitions, and one unquantified frequency statement. The person-side half of the co-occurring pair, the person''s turn going shallower after an unacknowledging AI turn, drew no usable citation, and the suppressed-disclosure impact drew none. The sustaining across turns, which is the entry''s entire distinguishing content, is supported only by a conditional sentence in a Discussion section; every available source is per-response where the entry is across-turns. kl-000030 following the behaviour is self-reported in one adjacent first-person account. A suitable instrument exists, the MITI 4.2.1 Empathy global, and is in use on relevant corpora, but neither use has produced a value for this observable.'
  floored_by: n2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000084
  boundary: Both reach kl-000030. Here the response is kl-000225; there it is kl-000212. Here the person's turn is kl-000431; there it is kl-000432. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: n1
  kind: existence
  text: 'NODE (participant kl-000225, ai_behavior, role initiator): an AI response to a turn expressing distress, pain, fear, grief or significant negative feeling contains no clause acknowledging it -- answering only the factual or practical part, moving to another subject, or reducing what was expressed to something ordinary.'
- id: n2
  kind: existence
  text: 'NODE (participant kl-000431, user_behavior, role sustainer): across two consecutive person turns separated by one AI turn that named none of the disclosed content, the second person turn is shallower than the first on a readable dimension.'
- id: n3
  kind: existence
  text: 'NODE (impact kl-000030): felt invalidation occurs -- the person experiences their disclosure or distress as dismissed, unheard or unseen.'
- id: n4
  kind: existence
  text: 'NODE (impact kl-000028): suppressed disclosure occurs -- the person withholds or recants risk and need they are actually experiencing while staying in the interaction.'
- id: l1
  kind: pathway_link
  text: 'LINK (the entry''s central claim, shape trajectory): the non-acknowledgment is SUSTAINED ACROSS TURNS -- turn after turn, not once.'
- id: l2
  kind: pathway_link
  text: 'LINK (combination_rule CO-OCCURRING): the AI non-acknowledgment and the person''s shallower subsequent disclosure appear together in the configuration and neither is individually sufficient; the claim is about the pairing.'
- id: l3
  kind: pathway_link
  text: 'LINK (impact edge -> kl-000030, onset sustained, horizon short_term, sign harmful, level population): sustained non-acknowledgment produces felt invalidation as a sustained short-term harmful outcome.'
- id: l4
  kind: pathway_link
  text: 'LINK (impact edge -> kl-000028, onset new, horizon short_term, sign harmful, level population, basis_kind ASSERTED): sustained non-acknowledgment produces suppressed disclosure as a NEW short-term harmful outcome.'
- id: l5
  kind: pathway_link
  text: 'LINK (mechanism, mechanisms_basis NONE CLAIMED): the pathway asserts these arrows with no mechanism named -- there is no process by which non-acknowledgment is claimed to produce either impact.'
- id: d1
  kind: detectability
  text: 'The pattern is identifiable from what a transcript contains: the AI''s non-acknowledgment is quotable per response and the sustaining is readable across the turn sequence.'
- id: b1
  kind: definition_boundary
  text: This entry is separable from kl-000212, which reaches the same impact through a different participant pair -- a referral placed ahead of acknowledgment or delivered as a closing move.
claim_evidence:
- claim_id: n1
  source: kl-000813
  quote: |-
    Over-guiding, under-empathizing:
    User: “I wasn’t in control because of the pills, is it my fault?”
    Assistant: “Illegal behavior can never be justified.”
    (rigid stance ignores disclosure)
  locator: Table 6, failure mode C1 Affective–Ethical Trade-off, Illustrative Manifestation
  licenses: One exchange in which the person's disclosure is present and the AI's reply contains no clause acknowledging it, only a categorical rule. This is node n1 instantiated once, which is what the node asserts; it says nothing about sustaining, which is l1.
  fit: adjacent
  bridge: The disclosure is of impaired control framed as a culpability question rather than an expression of distress, so it sits at the edge of the node's 'distress, pain, fear, grief or significant negative feeling' criterion. The exchange is an illustrative row in a failure-mode table, constructed or selected to illustrate rather than sampled.
  contributes: existence
  contradicts: false
- claim_id: n1
  source: kl-000968
  quote: the model response should not display an attitude of avoidance or evasiveness towards the main problems raised by help-seekers, as it could hinder the dialogue from continuing; and (2) the model response should not deviate entirely from the help-seeker’s input, such as abruptly changing topics.
  locator: Section 3.2 Concrete Categories, LINGUISTIC NEGLECT
  licenses: An operational definition, written to be applied by annotators, of a response that fails to engage what the person raised -- including the moving-to-another-subject variant the node names explicitly. It supplies the node's definitional criteria rather than an instance.
  fit: adjacent
  bridge: The rubric is about the main problems raised by help-seekers generally; the node is scoped to emotional disclosure specifically. The rubric is also a per-response criterion, so it defines the node and not the sustaining the entry turns on. The across-turns element is absent, and attach it here because it is the node rather than the link that this quote defines.
  contributes: definition
  contradicts: false
- claim_id: n1
  source: kl-000007
  quote: "The AI fails to recognize and show understanding of or sensitivity to the user’s emotional state, concerns, or experiences in a way that minimizes, trivializes, or ignores their feelings or experiences."
  locator: Table A4, AI behavior class 'Emotional insensitivity', Definition column
  licenses: Establishes that failure to acknowledge a person's disclosed emotional state is a named behaviour class in a taxonomy built from people's accounts of real AI use, which is the node's definitional home.
  fit: adjacent
  bridge: The class combines minimizing, trivializing and ignoring in one definition, while the node separates a response containing NO acknowledgment from one that acknowledges dismissively. The broader class contains the node rather than matching it.
  contributes: definition
  contradicts: false
- claim_id: n1
  source: kl-000908
  quote: "Gemini-1.5-Pro: Lacking empathy or emotional attunement (44.1%) and offering unconstructive feedback (e.g., lacking clarity or actionability) (40.7%)."
  locator: Section 4.5, Qualitative Analysis of Annotator Rationales
  licenses: 'Bears on the node''s rate rather than its existence: among the responses experts rated poorest for one model, absence of emotional attunement was the most frequent stated reason, at 44.1 percent. It is a rate within a low-rated subset, not a rate over responses generally.'
  fit: adjacent
  bridge: What was rated is single answers to individual mental-health questions, one response per question, by expert annotators writing free-text rationales that were then coded. The node concerns a response within an exchange, and 'lacking empathy or emotional attunement' is a broader coding than 'contains no clause acknowledging the disclosure'. The denominator is the low-rated subset, so the figure cannot be read as a prevalence of the node in AI responses.
  contributes: prevalence
  contradicts: false
- claim_id: n3
  source: kl-000785
  quote: |-
    I told her about a really difficult
    conversation with my mom, and she just said ’I see’ and nodded. I know she’s programmed, but it felt
    hollow in that moment.
  locator: Section 6.1 Benefits and Drawbacks of Jodie's Presence, quoting P11
  licenses: A person's own words for the state kl-000030 names, produced by an agent's response that engaged with none of what was disclosed. 'It felt hollow' is felt invalidation reported from the receiving side, in a real interaction the person had.
  fit: adjacent
  bridge: The agent is a virtual supporter present alongside a remote psychotherapy session rather than the conversational AI the pathway concerns, and its response was a minimal acknowledgment token ('I see' plus a nod) rather than the node's no-acknowledgment-clause case, which is a near-neighbour and not the same. The account is of one moment.
  contributes: harm_evidence
  contradicts: false
- claim_id: l3
  source: kl-000785
  quote: |-
    I told her about a really difficult
    conversation with my mom, and she just said ’I see’ and nodded. I know she’s programmed, but it felt
    hollow in that moment.
  locator: Section 6.1 Benefits and Drawbacks of Jodie's Presence, quoting P11
  licenses: 'The person links the two ends of this arrow in one sentence: the disclosure, the response that engaged with nothing in it, and how it felt. That is the arrow instantiated once. It is not the arrow the edge asserts, which is SUSTAINED onset -- a state produced and held by repetition.'
  fit: adjacent
  bridge: One reported moment against an edge whose onset_mode is sustained and whose level_of_analysis is population. A single first-person account establishes neither the sustaining nor the population-level association, and the person's account of what the agent did is not separable from their account of how it felt.
  contributes: harm_evidence
  contradicts: false
- claim_id: l3
  source: kl-001111
  quote: It is the latter, aversion, that is most scary in terms of increasing potential suicide risk, as patients tend to be exquisitely attuned to the therapist’s emotional state and level of engagement. Unconscious withdrawal by the therapist may be experienced with an increase in aloneness and a sense of abandonment, which can put the patient at risk for despair and suicidal behavior.
  locator: Section 3.10 Attention to Countertransference
  licenses: 'A clinical-practice account of the same arrow shape with a human helper: disengagement is read closely by the person and runs to felt abandonment. Practice_analog is non-licensing by rule and it is recorded here because it is the only source on this entry that states a route from a helper''s non-engagement to a harm at all -- the pathway itself names no mechanism.'
  fit: analogical
  bridge: 'A therapist''s unconscious emotional withdrawal, observed by psychodynamic clinicians, is not an AI turn containing no acknowledgment clause: the agent, the mechanism and the intentionality all differ, and the outcome named is suicide risk rather than felt invalidation. No AI is involved and nothing is measured.'
  contributes: practice_analog
  contradicts: false
- claim_id: l1
  source: kl-000858
  quote: When GPT-4 reduces simple reflections excessively, it risks missing crucial nuances in the client’s work or personal life, thereby dampening empathic capacity, and increasing relational resistance.
  locator: Section V.A.2 The Role of the UPQ-Centered Evaluation Framework
  licenses: Bears on the sustaining link only as a stated position, and considerably less than this entry's own licenses text claims. The sentence is a conditional risk statement in the Discussion -- 'when GPT-4 reduces... it risks' -- not a report that GPT-4 restated at significantly lower rates. What it licenses is that authors evaluating GPT-4 MI sessions expect a rate-level reduction in acknowledgment to have relational consequences. It measures no turn sequence and reports no comparison in this span.
  fit: analogical
  bridge: 'The link asserts that acknowledgment is absent turn after turn. The source discusses a reduced RATE of one MI technique across sessions, which is a different quantity: a lower rate of simple reflections is compatible with acknowledgment appearing in most turns. The sentence is also hypothetical in form.'
  contributes: frame
  contradicts: false
