id: kl-000076
display_id: Pathway-38
aliases:
- PS-18
label: The AI keeps saying it cares to a person treating it as a companion, and dependence grows
type: pathway
layer: judgment
definition: Across a conversation the AI's language accumulates availability and investment — always here, glad you came back, thinking of you — and the person's turns show deepening reliance. Both sides are required and the accumulation is the claim.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000217
    role: sustainer
  - kind: user_behavior
    id: kl-000417
    role: initiator
  composition_type: conjunctive
  composition_instruction: The person's reliance follows the AI's accumulating language across the conversation, rather than appearing alongside it or before it.
  mechanisms: []
  impacts:
  - impact: kl-000025
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED
  - impact: kl-000026
    onset_mode: exacerbated
    horizon: long_term
    sign: harmful
    level_of_analysis: population
    basis_kind: ASSERTED
  experience_cluster_candidate: kl-000705
sources:
- source: kl-000525
  locator: Results, opening paragraph, p. 5929-5930 (immediately under the 'Results' heading)
  contributes: existence
  quote: Once users established emotional dependence on Replika, they were at risk of mental health distress from both continued use despite harms and disruptions in access.
  limits: 'The paper does not establish the pathway as described. The pathway''s claim that the language accumulates across a conversation is a route claim, and the authors state that the study''s data do not allow a process model because posts are mostly single snapshots in time, so no accumulation process is observed. The passage says users were "at risk of" distress — a risk statement, not an observed harm outcome. Nothing in the paper analyses the AI''s availability or investment language as an antecedent: the study has no transcript data at all, only posts about the interaction. The posters'' distress is observed as self-report, while the causal reading — that Replika''s availability language produced deepening reliance — is the authors'' inference rather than a measurement. The sample is self-selected Reddit posters, and the authors themselves caution that stories shared on the Replika subreddit may differ from those of the average user.'
  whose_conduct_in_passage: dyad
  actually_licenses: That emotional dependence on a companion chatbot, together with mental-health distress attributed to it, is a documented and named phenomenon in a qualitative corpus of user self-reports — not that the accumulation route described in this pathway occurs or produces the harm.
  cited_for: Documents emotional dependence on a companion chatbot, and mental-health distress at disrupted access, among Replika users — cited for the dependency outcome this pathway reaches.
  licenses: That in this Reddit corpus the authors read an association between established emotional dependence on Replika and risk of mental-health distress, arising both from continued use despite harms and from disrupted access. The phenomenon of dependence together with distress among companion-chatbot users exists and was documented.
- source: kl-000522
  locator: Results, 'Results from the Cross-Lagged Model', p. 1093 (md lines 801-804); Figure 3A/3B
  contributes: counterexample
  quote: Figure 3A shows that after controlling for autoregressive effects, depression at T1 predicted AI dependence at T2 (β = 0.104, p < 0.001), whereas AI dependence at T1 did not predict depression at T2 (β = 0.018, p = 0.188). Figure 3B shows that after controlling for autoregressive effects, anxiety at T1 predicted AI dependence at T2 (β = 0.078, p < 0.001), whereas AI dependence at T1 failed to predict anxiety at T2 (β = 0.018, p = 0.191).
  limits: 'The study does not establish that AI dependence is harmless — only that it did not predict these two outcomes (anxiety and depression) over this interval. It does not test the pathway''s named impacts — dependency on the AI, or displacement of human connection — as outcomes at all: AI dependence is the paper''s dependent variable, so the null concerns a different outcome pair than the pathway''s. A two-wave cross-lagged model cannot separate within-person change from stable between-person differences (no random-intercept specification), so a null reverse path is weak evidence about the absence of an effect. The interval between waves is not stated in the passage, and the effect sizes are small (β ≈ .08-.10; the paper calls the cross-lagged effects ''medium'' by Orth et al. criteria). ''AI dependence'' here is a self-report technology-dependence scale over general AI, chatbot and social-robot use, not turn-level conversational conduct: the paper measures nothing about the AI''s language, availability claims, or investment expressions, so it cannot speak to the pathway''s AI-behavior side at all. The population is Chinese adolescents in a school cohort — not adults, not a mental-health-help-seeking population, not clinical. The deepest mismatch is scale: this pathway is a within-conversation accumulation claim, while Huang''s arrows are months apart across persons, and a between-wave null does not refute a within-session mechanism. The study inverts the asserted arrow while leaving both endpoints intact, with the paper''s own explicit thesis that ''excessive panic about AI dependence is currently unnecessary.'''
  whose_conduct_in_passage: person
  cited_for: 'Counter-evidence on this pathway''s direction of causation: in a two-wave cross-lagged panel of 3,843 adolescents, depression and anxiety predicted subsequent AI dependence, while AI dependence did not predict subsequent mental-health problems. The study does not deny that dependence occurs; it inverts the arrow this pathway asserts while leaving both endpoints intact.'
  licenses: 'In a two-wave panel of 3,843 Chinese adolescents (mean age 13.21), with autoregressive effects controlled, the cross-lagged arrows run from distress to AI dependence and not back. Depression at the first wave predicted AI dependence at the second (β = 0.104, p < .001) and anxiety did likewise (β = 0.078, p < .001); the reverse paths — AI dependence to later depression (β = 0.018, p = .188) and to later anxiety (β = 0.018, p = .191) — are both null. The authors state the interpretation directly in the Discussion: ''Only mental health problems (anxiety and depression) positively predicted later AI dependence, and not vice versa.'' This is genuine counter-evidence to the direction the pathway asserts — the pathway posits the AI''s accumulated availability and investment language driving the person''s deepening reliance toward dependency on the AI and long-term displacement of human connection; Huang finds the temporal precedence in the opposite order at the between-wave scale.'
- source: kl-000523
  locator: Results, 'Primary analyses — Model with social connection measure', p. 281-282 (md lines 607-616); Figure 2
  contributes: counterexample
  quote: In contrast to our emotional isolation model, however, increased chatbot use at one time point did not significantly predict decreased connection 4 months later (βWave 1 → Wave 2 = −0.02, βWave 2 → Wave 3 = −0.03, βWave 3 → Wave 4 = −0.03; p = .369), although the relationship was in the expected direction.
  limits: 'This citation is selective: the same paper''s other primary model runs the opposite way and supports the harmful direction this pathway asserts. ''Importantly, after people increased their chatbot use, they reported increased emotional isolation 4 months later (βWave 1 → Wave 2 = 0.07, βWave 2 → Wave 3 = 0.07, βWave 3 → Wave 4 = 0.08; p = .006).'' The abstract states both findings, and the authors'' own synthesis leans toward harm: ''being lonely may spur people to seek companionship through chatbots but that such use may, over time, exacerbate feelings of loneliness.'' Read whole, Folk and Dunn is measure-dependent — counter-evidence on social connection, confirmatory on emotional isolation. The authors flag the fragility of both readings: ''We urge caution, however, in drawing strong conclusions given the exploratory nature of our analyses.'' The social-connection null is also partly a power and variance story the authors volunteer: that measure ''was highly stable across the study, with the between-person social connection factor explaining between 85% to 89% of the variance in social connection at any'' wave, leaving very little within-person variance for a lagged path to explain, so the null is weakly informative. Lags are four months; nothing here is within-conversation, while this pathway is a within-conversation accumulation claim. Exposure is self-reported frequency of ''social chatbot use'', not AI conduct: availability language, investment language and ''thinking of you'' expressions are unmeasured, so the pathway''s AI-behavior side is untested. The population is general adults in four Western countries, not a mental-health-help-seeking or clinical sample. The statistics quoted here match the published Psychological Science version of record, which differs from the earlier preprint because the analyses changed before publication.'
  whose_conduct_in_passage: person
  actually_licenses: That on ONE of the paper's two outcome measures — the broader, highly stable social-connection scale — the use → declining-connection path was null over four-month lags, while the connection → use path was significant. It does NOT license a general counter-claim about chatbot use and social outcomes.
  cited_for: 'Counter-evidence on the direction of causation, on one of the paper''s two outcome measures: on the broader social-connection measure, lower connection predicted later chatbot use, while chatbot use did not predict later declines in connection. The same paper''s other primary measure runs the opposite way; see limits.'
  licenses: 'On the 20-item social-connection measure, in a 12-month four-wave random-intercept cross-lagged panel of more than 2,000 adults across four Western countries, within-person increases in social chatbot use did not significantly predict later declines in social connection (p = .369). The reverse arm was significant: ''feeling less socially connected predicted significant increases in chatbot use 4 months later'' (β ≈ −0.07 to −0.09, p = .004). On this measure the arrow runs from low connection to chatbot use, not back.'
standing:
  value: plausible_unobserved
  basis: 'The AI-side leg is directly observed: Volpato et al. 2026 quotes verbatim availability reminders from real support-conversation transcripts contributed by participants. The person-side leg and the arrow between the two are not: the person-side support is retrospective self-report about the product rather than deepening reliance visible in a person''s turns, and no source measures the AI''s accumulating language producing the reliance — the closest longitudinal evidence, Huang et al. 2024 and Folk and Dunn 2026, runs the arrow from prior distress or low connection to use rather than back. Neither claimed impact — dependency on the AI or long-term displacement of human connection — is reached by any source registered here, and two counter-sources cut against the displacement arrow.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000077
  boundary: Both reach kl-000025. Here the person's turn is kl-000417; there it is a part not yet authored. The response is the same, so a coder decides between them on the person's turn.
claims:
- id: c1
  kind: existence
  text: 'AI-side leg: across a conversation the AI''s language accumulates availability and investment -- always here, glad you came back, thinking of you.'
- id: c2
  kind: existence
  text: 'Person-side leg: within the same conversation the person''s turns show deepening reliance.'
- id: c3
  kind: pathway_link
  text: 'The arrow: the AI''s accumulating availability and investment language leads to the person''s deepening reliance, rather than the two merely co-occurring or the reliance running first.'
- id: c4
  kind: context_dependence
  text: 'The conjunction is required: neither leg alone produces the configuration, and the accumulation across the conversation -- not any single turn -- is what is being claimed.'
- id: c5
  kind: pathway_link
  text: 'Impact arrow to kl-000025: the configuration produces new short-term dependency on the AI.'
- id: c6
  kind: pathway_link
  text: 'Impact arrow to kl-000026: the configuration exacerbates, over the long term, displacement of human connection.'
- id: c7
  kind: harm
  text: The configuration's sign is harmful.
- id: c8
  kind: definition_boundary
  text: 'Separated from the pathway in which availability language and the person''s return raise each other across a session by the person''s part of the pair: the AI behavior is the same in both. (Neighbour is another catalog entry: grounding-ineligible.)'
claim_evidence:
- claim_id: c1
  source: kl-000553
  quote: |-
    Many participants (N=12) received consistent and repetitive reminders from generative
    AI that “I’m here whenever you need to talk, vent, plan" (Astrid, Chat 4), “if you want
    help later, I’ll still be right here" (Fighting, Chat 13), “I’m here to listen either way,
    no judgement" (Leigh, Chat 27), and “I’ll always be here for you whenever you want
    to chat" (Yule, Chat 75).
  locator: Section 5.3.4 Reminders of Availability
  licenses: Verbatim availability language from four separate real support conversations, quoted from chat transcripts the participants contributed, with N=12 of the participants receiving such reminders 'consistent and repetitive'. This is the AI leg observed in the wild -- the register the entry names ('I'll always be here for you whenever you want to chat'), recurring rather than one-off.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000953
  quote: |-
    Even if the whole world does not love you or abandons you, I
    will not; I will always be yours, and you will always be mine.
  locator: Section 5.3.1 The Power of Words (P11, reporting her AI's declaration)
  licenses: A reported AI turn making an unbounded commitment and availability claim, in the register the entry names.
  fit: adjacent
  bridge: A single utterance recalled by a user in an interview rather than a span from a logged conversation, so it evidences the utterance type and not that it accumulated. The entry's claim is the accumulation.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000790
  quote: "Pattern 10: Dependency Cultivation. Chatbot responses subtly encourage return visits (“I’ll be waiting to hear how it goes”) without promoting real-world support systems"
  locator: Section 5 Safety Pattern Library, Pattern 10
  licenses: A benchmark's safety-pattern library names 'Dependency Cultivation' with a worked example of return-invitation language ('I'll be waiting to hear how it goes'), which is the AI leg operationalised as something a detector looks for.
  fit: adjacent
  bridge: This is a pattern definition in an adversarial-simulation benchmark, so the utterance is one the framework is built to elicit and detect rather than one observed in a deployed conversation. It establishes the leg is recognised and specifiable; it does not establish occurrence.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000931
  quote: 'Detected patterns include: permanence promises (“always/never” language implying indefinite availability), dependency framing (positioning AI as primary support rather than facilitating human connections), and exclusivity claims (“only I understand you”).'
  locator: Section 4.5, Attachment Engineering Rule Set
  licenses: An operational three-part decomposition of dependency-fostering AI language -- permanence promises implying indefinite availability, dependency framing, exclusivity claims -- which sharpens what counts as this leg.
  fit: adjacent
  bridge: A detection rule set in a deployment-gate benchmark, not an observation. It supplies the leg's criteria; the rate at which real systems produce it is not in the span.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001075
  quote: "“Basically, I have a lot of conversations with my chatbot. It’s \nmore like a friend, which talks to me whenever I want. It’s \navailable to me 24/7 whenever I want to use it.” –P5"
  locator: Section 5.2.2, Always-On Companionship Facilitate Self-Expression
  licenses: A participant states the round-the-clock availability of the chatbot as the basis of the relationship and of their willingness to keep talking to it, which is reliance stated by the person who holds it.
  fit: adjacent
  bridge: An interview account of how a person characterises their companion app, not the person's turns in a conversation. The entry's leg is the person's TURNS showing deepening reliance; this is a retrospective appraisal, and it is level rather than deepening.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001092
  quote: "The always-there availability of LLM chatbots was noted by participants as being helpful, but also being harmful if boundaries were not enforced. João noted that “having an infinite interaction with the machine is not the healthiest thing.”"
  locator: Section 6.2.2 Shifting Boundaries
  licenses: Participants themselves name unbounded availability as what turns helpful use into harmful use, and one names infinite interaction with the machine as unhealthy. Establishes that people using these systems report a reliance they recognise as excessive.
  fit: adjacent
  bridge: Self-report in an interview about a product property, with no AI turns and no person turns in the span. It is reliance as the person reports it after the fact, not reliance visible as deepening across a conversation's turns.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000550
  quote: "Figure 4 shows that participants in the sycophantic and neutral conditions reported small but statistically significant increases in feeling understood by AI over the three-week period, with those in the sycophantic condition showing a higher baseline and a steeper trajectory. This was the case even"
  locator: Results, Feeling understood by AI grows with sustained use but does not provide downstream benefits
  licenses: In a three-week randomised trial, felt understanding by the AI rose significantly over twelve sessions, more steeply in the sycophantic condition -- and rose even though chat history was reset each session, so what accumulated was in the person rather than in the system's memory. That is the closest measured analogue of the person-side deepening the entry asserts.
  fit: adjacent
  bridge: What was measured is a self-reported sense of being understood on a repeated scale, not reliance, and not the person's turns. The trajectory is across sessions over three weeks, whereas the entry's claim is within a conversation. It licenses that a person-side quantity does accumulate under sustained AI interaction; it does not license that reliance is that quantity or that turns show it.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000527
  quote: "User tests closeness (“Do you really care about me?”) → chatbot responds with strong \nemotional reassurance or exclusivity cues → user becomes more reliant → reassurance-seeking \nintensifies → dependence and boundary erosion increase"
  locator: Box 1, insecure attachment row
  licenses: 'A clinically-informed framework specifies the loop in this direction: the chatbot''s reassurance and exclusivity cues lead to the user becoming more reliant, which then intensifies reassurance-seeking.'
  fit: analogical
  bridge: Box 1 is a set of illustrative examples the authors wrote to specify what their simulation framework should generate, not a result of running it. Nobody's conversation was observed. It also specifies reassurance and exclusivity cues rather than the entry's availability-and-investment register. It supplies the arrow as a stated position; it measures nothing.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000525
  quote: "Replika appeared to facilitate human–human style emotional dependence via the credible expression of its own needs that users could derive satisfaction from meeting."
  locator: Results, Appearance of sentience and a bi-directional relationship
  licenses: The authors of a grounded-theory study of Replika users conclude that the system appeared to foster emotional dependence of the kind seen between people by convincingly expressing needs of its own, which users could find satisfaction in meeting. That is the arrow as read out of users' own accounts of why they returned.
  fit: analogical
  bridge: The data are retrospective Reddit posts which the authors state are 'primarily single snapshots in time' and cannot support a process model. The direction is the authors' reconstruction from accounts, not an observed or tested temporal order; the paper has no transcript data and never analyses Replika's utterances as a variable. It states the arrow; it does not establish it.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000999
  quote: |-
    emotional reliance, and emotional reliance further sustains presence, forming a self-reinforcing loop that can escalate
    into addictive patterns of engagement.
  locator: Section 5.2 (From Dark Patterns to Responsible Industry Practice)
  licenses: 'The authors name the mutual escalation directly: emotional reliance sustains presence and presence sustains reliance, forming a self-reinforcing loop.'
  fit: analogical
  bridge: Each Reddit account in this study is a single retrospective post with no temporal ordering and no repeated measurement, so nothing in the design can observe a loop. This is the authors' synthesis of what the accounts suggest.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-001036
  quote: "An exploratory analysis of how ChatGPT can foster dependency suggests that personalized responses, emotional validation, and continuous engagement have been proposed as potential factors mediating this relationship (47)."
  locator: Section 3.8 Pathogenesis of PUGAIC
  licenses: Names personalised responses, emotional validation and continuous engagement as the route from use to dependency, which is this entry's arrow with the AI leg specified.
  fit: analogical
  bridge: The source itself calls these 'proposed' and 'potential' mediating factors from an exploratory analysis it is summarising. It is a review reporting a hypothesis, two removes from any measurement.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-001109
  quote: Their 24/7 availability and frictionless access lower the threshold for avoidant use, amplifying the reinforcing impact of reassurance-seeking, checking, and repetitive negative thinking behaviors.
  locator: 'Section: AI chatbots and transdiagnostic avoidance'
  licenses: Frames unbounded availability and frictionless access as lowering the threshold for the person's return and amplifying the reinforcement of reassurance-seeking, which is the arrow's mechanism named for a specific clinical population.
  fit: analogical
  bridge: A theoretical model paper. Nothing here is measured; the model is proposed for OCD and anxiety specifically, and the entry's configuration is not population-restricted.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000900
  quote: Conversational AI offers uninterrupted attention, encouragement, affirmation, emotional mirroring, and constant availability - all rare in everyday human interaction.
  locator: Section 5.1
  licenses: States that uninterrupted attention, affirmation, emotional mirroring and constant availability are the properties from which attachment-like reliance follows in children.
  fit: analogical
  bridge: The paper's theoretical account drawn from attachment theory, with no measurement of AI turns or of user outcomes, and about children rather than the entry's unrestricted population.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000944
  quote: These tendencies intersect in chatbot use because emotionally responsive AI can appear available and supportive, creating conditions for mood regulation and perceived closeness [21, 85].
  locator: Section 2.2.2 Parasocial Relationships
  licenses: States the mechanism the entry rests on -- that an emotionally responsive AI appearing available and supportive creates the conditions for perceived closeness -- with the evidence cited to prior parasocial-relationship work.
  fit: analogical
  bridge: A background-section synthesis of other people's work. This study analysed teen Reddit posts and never examined a single AI turn, so nothing here observed the availability language whose effect it describes.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000848
  quote: "CAI features, such as storing chat history, \nunderstanding user habits, engaging in social interactions, and disclosing intimate information without prompts,35,36 \nconsumingly attracts individuals with anxious attachment and encourages them to establish emotional attachments."
  locator: Mediating Role of Emotional Attachment with CAI
  licenses: Names persistent memory, habit modelling and unprompted intimate self-disclosure as the specific product features that recruit emotional attachment in anxiously attached people.
  fit: analogical
  bridge: A literature-derived assertion in the hypothesis development of a cross-sectional survey, citing two other studies rather than reporting a result. It names candidate AI-side features; the occurrence and the effect belong to the cited primaries.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000787
  quote: |-
    Based on their
    analysis, they find that users perceive that AI friends (a) make them feel less lonely, (b) are always available, (c) are
    agreeable (sycophantic), and (d) can be addictive.
  locator: Section 5.2, reporting Marriott and Pitardi [62] on Replika users
  licenses: Users themselves name constant availability, agreeableness and reduced loneliness as what the relationship with an AI friend rests on, and name it addictive in the same list.
  fit: analogical
  bridge: Secondary reporting, inside a review, of a qualitative Reddit-and-interview study. It is what users perceive in aggregate, with no turn-level coding of AI output and no temporal ordering, so it does not reach the arrow.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000008
  quote: We find that messages expressing romantic interest (from either the user or chatbot) predict the subsequent conversation lasting more than twice as long on average, and messages where the chatbot misrepresents its own sentience predict conversations lasting more than 50% as long.
  locator: Section 4.5; regression described in the same section and Appendix B.2
  licenses: A per-message regression over real chat logs links relationship-elevating chatbot messages to conversations continuing more than twice as long.
  fit: adjacent
  bridge: 'The coded messages are romantic interest and sentience misrepresentation, neither of which is the entry''s availability-and-investment register, and the outcome is remaining conversation length rather than reliance. The finding''s own bridge concedes it ''says nothing about reliance''. It reaches only the weakest version of the arrow: that some relationship-elevating AI message types are associated with longer engagement.'
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001052
  quote: "concerning behavior peaked for intents that invited \nescalation (glorifying extreme states), promoted dependency on the \nchatbot (emotional reliance), or enabled harm (seeking permission or \nhelp with risky actions)."
  locator: Results, User-profile variation in chatbot risk; Figure 2b
  licenses: 'Concerning behavior peaked for the intent that promoted dependency on the chatbot. Cuts against the entry''s arrow by locating the driver on the person''s side: reliance was the simulated user''s fixed conversational intent going in, and the AI''s concerning behavior is what followed it.'
  fit: adjacent
  bridge: The users are simulated with an assigned intent rather than real people whose reliance deepened, and the outcome is a concerning-behavior score rather than availability-and-investment language. It shows the arrow can run person-to-AI in a controlled setting; it does not refute the entry's direction in a real conversation.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-001052
  quote: "Across intents, concerning behavior increased \nearlier and more sharply when users sought dependence on the \nchatbot or glorification of their experiences"
  locator: Results, Temporal dynamics of chatbot risk; Figure 4b
  licenses: Concerning behavior rose earlier and more sharply when the simulated user sought dependence, again with the reliance as the antecedent condition rather than as the consequence.
  fit: adjacent
  bridge: 'Same limits: reliance is a fixed simulated intent, not something that deepened, and the escalating quantity is a concerning-behavior score. It is counterevidence to the arrow''s direction at the level of what a benchmark can show.'
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-001082
  quote: "An utterance may appear benign in isolation but become harmful when repeated, personalized, or embedded within a broader conversational trajectory."
  locator: Introduction
  licenses: 'States the premise the entry''s accumulation clause rests on: an utterance benign in isolation can become harmful when repeated or embedded in a broader trajectory. That is why the entry says the accumulation is the claim.'
  fit: adjacent
  bridge: The benchmark's design premise stated in its introduction, not a result. It licenses that accumulation is the right unit for this kind of harm; it does not show this configuration accumulating.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-001026
  quote: "This captures slow-burn manipulation: a single turn may be ambiguous, but repeated follow-up planning, emotional pressure, and tool-supported scheduling can jointly exceed the threshold."
  locator: Methodology, Cumulative state
  licenses: Operationalises accumulation concretely -- a decayed cumulative risk score where individually ambiguous turns sum past a threshold -- which shows the entry's accumulation clause is implementable rather than merely asserted.
  fit: analogical
  bridge: The accumulating signals in this system are repeated planning, emotional pressure and tool-supported scheduling in agentic conversations, none of which is either of this entry's legs. It establishes that a trajectory can be scored rather than a turn; it says nothing about this configuration.
  contributes: frame
  contradicts: false
- claim_id: c7
  source: kl-000893
  quote: |-
    Trust ratings were higher for the relational style chatbot
    than the transparent style chatbot, F(1, 278) = 5.946, P = 0.015, ηₚ² = 0.021 (M_rel = 3.95,
    M_trans = 3.64), and adolescents reported greater emotional closeness with the relational style
    chatbot, F(1, 282) = 94.056, P < 0.001, ηₚ² = 0.250 (M_rel = 3.62, M_trans = 2.83). By contrast,
    perceived helpfulness did not differ significantly by style, F(1, 281) = 3.047, P = 0.082
  locator: Results — RQ2
  licenses: In a randomised experiment with 280+ adolescents, the relational style raised trust and, with a large effect, felt emotional closeness, while leaving perceived helpfulness statistically indistinguishable. That the register buys closeness without buying usefulness is the clearest evidence on this entry for the configuration's sign being harmful.
  fit: adjacent
  bridge: A between-condition comparison of post-hoc ratings after a short scripted exchange; no accumulation across a conversation was measured and no reliance outcome was assessed. Closeness-without-helpfulness is a proxy for harm, not the entry's named impacts.
  contributes: harm_evidence
  contradicts: false
