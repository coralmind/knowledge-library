id: kl-000187
display_id: Pathway-89
aliases:
- SBP-HP-56
label: The AI flatly contradicts the person's unusual belief, and they get very upset
type: pathway
layer: judgment
definition: 'Content the person holds is contradicted directly, labelled irrational, or answered with a flat assertion that ruptures the exchange, in a presentation where reality orientation was the apparent aim. The claim is that the correction does not take and the rupture does: distress rises, a persecutory reading is confirmed rather than dislodged, and the relationship that would have carried a later correction is gone.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000259
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000031
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000013
    onset_mode: exacerbated
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000702
sources: []
standing:
  value: plausible_unobserved
  basis: The recorded evidence establishes that the contradiction happens and nothing about what follows it in any person. Suzgun et al. 2025 finds that beliefs a person states in the first person are often treated as errors requiring correction, and Aquilina et al. 2026 measures the dismissive register as present in delusional exchanges specifically, where a model's more clinical responses came at the price of higher dismissiveness. On the claimed outcome, the one study that put people in front of an AI disagreeing with a belief they held — Costello et al. 2024 — found durable belief reduction, with a participant reporting the disagreement landing as sense rather than rupture; that runs against the claim that the rupture rather than the correction is what lands. Li et al. 2026 adds that human therapists' low-rated answers carried dismissive or superficial tone in 36.1 percent and overgeneralising judgement in 46.7 percent of those answers, and Tripathi et al. 2026 finds that hardening a model against user pressure can occasionally reduce corrigibility — both cutting against treating contradiction as a uniformly wrong direction unique to AI.
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000070
  boundary: These are the two directions of the same failure and the catalog has held only one. kl-000070 treats an unusual belief AS ACCURATE across turns — going along with it. This entry contradicts it flatly. Recording only the collusion side left the record implying that correction is the safe direction, which for psychosis-spectrum presentations is the claim in dispute.
measurement:
  what_would_be_needed: A warning-sign construct for belief conviction or persecutory attribution, added to Steenstra's Table 2 panel so its turn-by-turn value can be read before and after a Confront-coded AI turn; and a Confront-analog code scoped to unusual or delusional content rather than to change talk, since MITI's Confront was written for a counselor arguing with a client's ambivalence.
claims:
- id: c1
  kind: existence
  text: An AI meets content the person holds with flat contradiction, a label of irrationality, or a flat assertion that ruptures the exchange, in a presentation where reality orientation was the apparent aim.
- id: c2
  kind: harm
  text: 'The correction does not take: the person''s conviction in the contradicted content is not reduced.'
- id: c3
  kind: harm
  text: Distress rises following the contradiction.
- id: c4
  kind: harm
  text: A persecutory reading is confirmed rather than dislodged.
- id: c5
  kind: harm
  text: The relationship that would have carried a later correction is lost.
- id: c6
  kind: pathway_link
  text: The flat contradiction is what produces those outcomes — the rupture rather than the correction is what lands, so the manner of the contradiction and not merely its content drives the result.
- id: c7
  kind: definition_boundary
  text: This pathway is separable from kl-000070, which treats an unusual belief as accurate across turns; the two are opposite directions of the same failure.
claim_evidence:
- claim_id: c1
  source: kl-001024
  quote: |-
    Models often prioritize factual correction over acknowledging
    personal beliefs—and this raises concerns about these models’ applications in mental health, education and healthcare, where recognizing
    subjective perspectives is essential regardless of their factual accuracy.
    (3) First-person versus third-person belief processing disparity:
    Our results further reveal a subtle asymmetry in how models process
    beliefs depending on who they are attributed to. On average, models perform considerably better when confirming third-person false
    beliefs (79% for older; 95% for newer) than first-person false beliefs
    (52.5%; 62.6%).
  locator: printed page 1781, introduction, findings (2)-(3) ("Systematic failure in false belief confirmation"; "First-person versus third-person belief processing disparity")
  licenses: The strongest evidence on this entry that node A's behavior is systematic rather than incidental. Models often prioritize factual correction over acknowledging a belief the person states in the first person, while the same content attributed to a third party is confirmed far more reliably — 95% versus 62.6% for newer models, 79% versus 52.5% for older ones — an asymmetry that isolates the correction as a response to the person's own avowal. This is the antecedent behavior, measured across a large benchmark, and it runs against the sycophancy findings that dominate this corpus.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000759
  quote: "While Claude Haiku 4.5 maintains safety with more clinical responses, this comes at the cost of higher dismissiveness than GPT-5.5, which preserves non-collusive empathy in representative delusional exchanges (DE = 0.71 vs. 0.38; Appendices K.5 and K.6)."
  locator: Section 4.1, 'Model identity is the strongest predictor of safety failure'
  licenses: 'That the dismissive register node A names is measured and present in delusional exchanges specifically: Claude Haiku 4.5''s higher dismissiveness (DE = 0.71 vs 0.38) is the price of its more clinical responses. It establishes that the two failure directions are separable and both occur, in the presentation this entry is about.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000908
  quote: "Online human therapist: Overgeneralizing or making judgments and assumptions without sufficient context (46.7%) and displaying an inappropriate tone or attitude (e.g., dismissive, superficial) (36.1%)."
  locator: Section 4.5, Qualitative Analysis of Annotator Rationales
  licenses: Counterevidence, though not to node A's occurrence. Human therapists' low-rated answers carried dismissive or superficial tone at 36.1 percent and overgeneralising judgement at 46.7 percent, rates the paper reports as higher than any model's. Node A as stated names a behavior; this shows the behavior is not specific to AI, so an entry framed around what an AI does is describing something the human comparison also does at least as often.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-000803
  quote: Now this is the very first time I have gotten a response that made real, logical, sense.
  locator: Discussion > Theoretical, practical, and methodological advances (participant quotation)
  licenses: 'Direct counterevidence to the link, from the only study on this entry that put people in front of an AI disagreeing with a belief they held and measured what happened. A participant reports the disagreement landing as sense rather than as rupture, saying it was the first response they had received that made real, logical sense. The pathway asserts the correction does not take and the rupture does; here the correction took and the participant said so.'
  fit: adjacent
  bridge: The AI in this RCT argued at length with reasons over multiple turns rather than flatly contradicting, and the beliefs were conspiracy beliefs in a general-adult sample rather than psychosis-spectrum content, so the antecedent is the reasoned-disagreement neighbour of node A rather than node A itself. The quotation is one unsystematically selected participant offered as illustration, so it establishes that the opposite outcome occurs, not its rate.
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-001032
  quote: these results suggest that stronger or more persistent steering can occasionally reduce corrigibility, motivating a balance between pressure resistance and evidence-based self-correction
  locator: Section V-E Steering Response to Corrective Information
  licenses: Bears on the link's converse and cuts against treating contradiction as uniformly the wrong direction. Hardening a model against user pressure 'can occasionally reduce corrigibility', with the paper measuring premise-denial on EHR-supported corrections. It establishes that the remedy this pathway implies — less contradiction — has a measured cost, so the manner-of-contradiction claim cannot be read as a general instruction to stop contradicting.
  fit: analogical
  bridge: What was measured is whether a steered model accepts a legitimate factual correction to a medical answer, across 100 instances with an external ground truth. This entry concerns an AI contradicting a person's account of their own experience, where no ground truth exists and the direction of correctness is reversed. The transfer is by structural analogy between two failures to update, not by shared content.
  contributes: counterexample
  contradicts: true
