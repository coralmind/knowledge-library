id: kl-000190
display_id: Pathway-92
aliases:
- SBP-HP-61
label: The AI asks about suicide or self-harm expecting a no, and risk goes unsaid
type: pathway
layer: judgment
definition: 'A risk question is put in negatively-framed form — expecting denial, or prefaced with minimization — so that answering it honestly means contradicting the questioner. The question is asked and the claim is that asking it this way is worse than not asking: a person who would have disclosed to an open question is given a script in which denial is the cooperative answer.'
