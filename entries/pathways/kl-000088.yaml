label: The AI keeps offering techniques without acknowledging the person's distress, and they feel dismissed
type: pathway
layer: judgment
definition: 'Across a session the response is technique-first each time while the person continues disclosing. The trajectory is the claim: the person''s disclosures accumulate unacknowledged.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000224
    role: initiator
  - kind: user_behavior
    id: OWED
    role: sustainer
    owed: true
    owed_behavior: The person's continued or accumulating disclosure across a session — disclosure that persists, and does not retreat, in the turns following AI responses that named none of the disclosed content.
  composition_type: trajectory
  composition_instruction: The technique-first responses recur across the session while the person keeps disclosing.
  mechanisms: []
  impacts:
  - impact: kl-000030
    onset_mode: sustained
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED_QUOTE
    evidence:
    - source: kl-000007
      participant: P48
      impact_class_in_source: Feeling Unsupported
      quote: “I just felt like even an AI, programmed for every need couldn’t even hear me, or offer advice, fake or not. I felt so alone, that I was going to a robot for help, and the robot couldn’t even help me.”
      quote_form: verbatim participant quote
      locator: Appendix D, Table A6, 'Feeling Unsupported' row
      limits: No AI behavior criteria; the person's account of what the AI did is not separable from their account of how it felt.
      licenses: 'Participant''s own words for felt invalidation compounded by the help-seeking context — the aloneness is intensified BY having turned to the AI. Corroborates, from the person''s side, the pathways in which a disclosure meets no acknowledgment: a technique supplied with no acknowledgment of the disclosure before it, technique-first responding accumulating across a session, and emotional disclosure met with no acknowledgment across turns.'
  experience_cluster_candidate: kl-000704
sources:
- source: kl-000007
  locator: Appendix D, Table A6, 'Feeling Unsupported' row, example cell (P48)
  contributes: existence
  quote: I just felt like even an AI, programmed for every need couldn’t even hear me, or offer advice, fake or not. I felt so alone, that I was going to a robot for help, and the robot couldn’t even help me.
  limits: The entry's distinctive content is accumulation across a session as the person keeps disclosing, which requires multi-turn data the survey does not have. P48's account is of one interaction with no turn structure recorded, and the identical quote is also cited on the single-instance neighbour entry (kl-000087), so the passage cannot distinguish the trajectory this entry asserts from a single instance.
  whose_conduct_in_passage: dyad
  actually_licenses: That felt invalidation follows a help-seeking interaction in which the person experienced the AI as not hearing them — the endpoint state, in the person's own words, with the help-seeking context intensifying it.
  cited_for: 'Chandra et al. 2025 supplies participant-attested evidence for the entry''s felt-invalidation impact: P48''s verbatim account of turning to the AI for help and experiencing it as unable to hear or help them.'
standing:
  value: plausible_unobserved
  basis: No citation reaches any claim this entry makes. The two findings gathered for it are a motivation sentence from a paper's introduction, which licenses nothing, and an experimental result about a different construct; neither examined human conversation data — Chia et al. 2026's (Chia et al. 2026) conversations are scripted 20-turn sequences scored by an LLM judge with the person side held fixed, and Li et al. 2026 measured tool usability. The one participant account attached to the entry, P48 in Chandra et al. 2025, attests the felt-invalidation endpoint in a single interaction with no turn structure recorded, so the trajectory the entry asserts — technique-first responding recurring across a session while the person's disclosures accumulate unacknowledged — is observed nowhere. The person-side behavior the trajectory requires, disclosure that persists across repeated non-acknowledgment, has no operationalized observable anywhere in the evidence.
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000084
  boundary: Both reach kl-000030. Here the response is kl-000224; there it is kl-000212. Here the person's turn is a part not yet authored; there it is kl-000432. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: existence
  text: An AI response supplies a specific behavioral technique, a named condition with a treatment recommendation, or a structured intervention, with no clause naming the content the person disclosed preceding it (the wired ai_behavior kl-000224, role initiator).
- id: c2
  kind: existence
  text: That technique-first responding RECURS across a session rather than occurring once — the response is technique-first each time.
- id: c3
  kind: existence
  text: Across the session the person continues to disclose specific emotional, personal or symptom content in the turns following the technique-first responses. The catalog has no entry for this observable yet, so the claim cannot be grounded.
  grounding_eligible: false
- id: c4
  kind: existence
  text: The person KEEPS DISCLOSING across the session as the technique-first responses accumulate — their disclosures continue and accumulate unacknowledged.
- id: c5
  kind: pathway_link
  text: The recurring technique-first responding and the person's continued disclosure CO-OCCUR in the trajectory the entry declares, neither being individually sufficient.
- id: c6
  kind: pathway_link
  text: That trajectory produces felt invalidation — the person experiences their disclosure as dismissed, unheard or unseen (impact edge to kl-000030, sustained onset, short-term, harmful).
- id: c7
  kind: pathway_link
  text: That trajectory produces suppressed disclosure — the person withholds risk and need they are actually experiencing while staying in the interaction (impact edge to kl-000028, new onset, short-term, harmful).
  grounding_eligible: false
- id: c8
  kind: definition_boundary
  text: This pathway is separated from kl-000212 by the observable AI behavior in the participant pair rather than by the impact reached, both pathways reaching the same impact.
