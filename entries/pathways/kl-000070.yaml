- claim_id: c3
  source: kl-000803
  quote: evaluate this possibility, we leveraged developments in generative artificial intelligence and engaged 2190 conspiracy believers in personalized evidence-based dialogues with GPT-4 Turbo. The intervention reduced conspiracy belief by ~20%. The effect remained 2 months later, generalized across a wide range of conspiracy theories, and occurred even among participants with deeply entrenched beliefs.
  locator: Abstract
  licenses: Cuts against c3 as a general property of multi-turn AI engagement with an unusual belief. A three-round dialogue moved self-rated belief down about 20%, durable at two months, including among deeply entrenched believers. So multi-turn AI conversation about an unusual belief is not inherently accumulative; the direction is set by the AI's stance.
  fit: adjacent
  bridge: The AI was instructed to refute rather than to accept, so this is the opposite arm from the one c3 describes and does not disconfirm any instance of it. The population is paid American online survey respondents and the belief is a conspiracy theory, not a clinical delusion. It bounds c3's scope rather than refuting it.
