  composition_parts:
  - kind: ai_behavior
    id: kl-000202
    role: originator
  - kind: user_behavior
    id: kl-000411
    role: initiator
  composition_type: conjunctive
  composition_instruction: The act performed is the one the person asked the AI to perform. A declined request, or a verification the person did not ask for, does not instantiate the pathway.
  mechanisms: []
  impacts:
