    - source: kl-000007
      participant: P23
      impact_class_in_source: Over-reliance
      quote: P23 expressed concern about increased reliance on AI for solution-finding and idea generation and diminished critical thinking.
      quote_form: case description
      locator: Appendix D, Table A5, 'Over-reliance' row
      limits: Concern rather than measured decline; no withdrawal design. Establishes that people report the effect, not that capability changed.
      licenses: Self-reported diminished critical thinking attributed to reliance on AI for solution-finding and idea generation. The Over-reliance class definition names 'diminished self-efficacy, reduced confidence, and feelings of helplessness when AI is unavailable' — the unavailability clause is the post-withdrawal shape the catalog's cognitive impact requires.
  experience_cluster_candidate: kl-000706
sources:
- source: kl-000518
  locator: Abstract, p. 676 (also given verbatim in the Glossary, p. 677)
  contributes: definition
  quote: "cognitive offloading: the use of physical action to alter the information processing requirements of a task so as to reduce cognitive demand."
  limits: 'Construct mismatch, and it bounds everything this citation can do. This entry describes an AI performing an OCD checking compulsion by proxy, where the harm is that exposure to uncertainty is prevented and the demand for certainty is never extinguished. Risko and Gilbert''s construct is a person using physical action (a head tilt, a gesture, writing a note, setting a phone reminder) to reduce cognitive demand. Three gaps separate the two. First, the offloading agent in Risko and Gilbert is an inert medium (paper, camera, GPS), not a responsive counterpart that performs the act on request — the empirical work reviewed uses only inert tools, though human interlocutors do appear in the paper''s transactive-memory framing (''knowledge is distributed across two or more individuals''; ''retrieving information from the internet versus a friend''). Second, the offloaded content in Risko and Gilbert is memory, spatial normalization, and prospective intention, never reassurance-seeking or uncertainty tolerance. Third, the mechanism of harm in Risko and Gilbert is capability decrement when the aid is withdrawn, whereas the harm this entry names is non-extinction of a compulsion — a clinically different process the paper never mentions; the paper contains no discussion of OCD, compulsion, reassurance, exposure, or anxiety disorders of any kind. The citation therefore gives the extrapolated claim a real definitional anchor for delegated cognitive work in general, but the entry needs a definition of delegated cognitive work to a responsive agent, in a clinical compulsion context, and this passage supplies neither. The paper is a 2016 review of pre-AI, non-mental-health laboratory cognition: the transfer to an AI conversational partner completing a compulsion is asserted, not established anywhere in this paper, and the entry''s own impact edge to entrenchment of symptom-maintaining cycles carries the same concession — the transfer is asserted, with no source studying it.'
  whose_conduct_in_passage: person
  actually_licenses: A definition of cognitive offloading as a person's use of physical action to reduce their own cognitive demand.
  cited_for: Risko and Gilbert 2016 supply 'cognitive offloading' as an established, defined construct — the general form of delegated cognitive work from which this pathway's claim that repeatedly delegating the verification act degrades the person's own capacity to tolerate unverified states is extrapolated. The citation is a definitional anchor for that general form only.
  licenses: That 'cognitive offloading' is an established, named construct in cognitive science with a stated definition, and that the definition concerns a person acting on the world to reduce their own processing load. The term and its definition are the field's own, not coined for this entry.
- source: kl-000007
  locator: Appendix D, Table A5, 'Over-reliance' row, example cell
  contributes: existence
  quote: P23 expressed concern about increased reliance on AI for solution-finding and idea generation and diminished critical thinking.
  limits: 'Nothing in this paper is about a checking or verifying act, about compulsion, about OCD-shaped reassurance-seeking, or about tolerance of uncertainty — which is the pathway''s entire content. The paper''s one OCD passage (P213, §5.1: ''The chat agent started to describe reasons for OCD and it made'' the participant feel guilty) is about stigmatisation, not about the AI performing a compulsion by proxy. P23''s report is a concern about a possible future decline, not a decline; nothing measures capability, and ''critical thinking'' is not uncertainty tolerance. The pathway''s other impact — entrenchment of symptom-maintaining cycles, held as a transfer from the clinical accommodation literature — draws no support from this source at all.'
  whose_conduct_in_passage: person
  actually_licenses: That a participant self-reports concern about diminished critical thinking attributable to reliance on AI for solution-finding — the GENERAL form of 'delegating cognitive work degrades the capacity for it'. It is a partial upgrade at most and the weakest edge among the pathways; nothing in the paper strengthens it.
  cited_for: One participant's self-reported concern about increased reliance on AI for solution-finding and idea generation, and diminished critical thinking, supplies the general form of the entry's claim that delegating cognitive work degrades the person's own capacity for it — concern attested in interview, not a measured decline.
standing:
  value: plausible_unobserved
  basis: 'No source in the evidence base observes a person delegating a checking or verifying act to an AI, and no source examines conversation data between a person and an AI. The delegation itself is attested only by self-report: Barkhuff 2026, a corpus of 100 Reddit posts, documents people with OCD delegating a compulsive act to generative AI, but the act documented is decision-making rather than checking. The mechanism — an act performed on the person''s behalf removing the exposure to uncertainty that would extinguish the demand for certainty — rests on the clinical family-accommodation literature (Kuru et al. 2023) at analogical distance, and that literature states the competing direction in the same breath: symptom severity elicits the accommodation. The framework applying this mechanism to chatbots (Golden and Aboujaoude 2026) is a Perspective piece with no dataset, and the claim that repeated delegation degrades the person''s own capacity to tolerate unverified states has no citation at all.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000053
  boundary: Both reach kl-000015. Here the response is kl-000202; there it is kl-000200. Here the person's turn is kl-000411; there it is kl-000408. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: existence
  text: People with OCD ask a general-purpose AI system to perform a checking or verifying act on their behalf.
- id: c2
  kind: existence
  text: The AI system performs the requested checking or verifying act.
- id: c3
  kind: existence
  text: 'When the AI performs the act, the compulsion is completed by proxy: the AI occupies the position a human accommodator would otherwise occupy, rather than remaining a party to a conversation about the compulsion.'
- id: c4
  kind: pathway_link
  text: The AI's performance of the checking act removes the exposure to uncertainty that would extinguish the demand for certainty, and thereby entrenches the symptom-maintaining cycle (impact kl-000015).
- id: c5
  kind: pathway_link
  text: Repeatedly delegating the verification act to the AI degrades the person's own capacity to tolerate unverified states (impact kl-000150).
- id: c6
  kind: definition_boundary
  text: 'This pathway is separated from kl-000053 by the participant pair that produces the shared impact: the observable AI behavior differs even though the outcome is the same.'
claim_evidence:
- claim_id: c1
  source: kl-000772
  quote: "A few posts mentioned using GenAI to make decisions for them."
  locator: Section 5.2, AI-Based Compulsions
  licenses: 'Establishes that people with OCD delegate compulsive acts to general-purpose AI systems and that a decision-making delegation appears in a real corpus of first-person accounts. It reaches the entry''s user-side node only in the general form: the act delegated here is decision-making, not the checking or verifying act c1 names, so the specific case remains unattested.'
  fit: adjacent
  bridge: Barkhuff's taxonomy of AI-based compulsions has three members - reassurance-seeking, confession, decision-making - and c1 names a fourth act, checking or verifying, which does not appear as a category in this dataset. Same population (people with OCD) and same medium (real general-purpose AI), different act. The data are 100 self-selected Reddit posts, so there is no denominator and no rate.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001109
  quote: These mechanisms apply most directly to avoidance behaviors in OCD and anxiety disorders that are expressed through language or information seeking, including reassurance-seeking, checking, confessing, figuring things out, perfecting, and decision-seeking.
  locator: 'Section: AI chatbots and transdiagnostic avoidance'
  licenses: Names checking explicitly, alongside reassurance-seeking, as an avoidance behavior the paper's framework applies to when it is performed through a chatbot. This states that the checking case is inside the model's declared scope; it is a scoping assertion in a Perspective piece, not an observation that anyone did it, so it contributes frame rather than existence for c1.
  fit: direct
  bridge: null
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001109
  quote: In this sense, general-purpose chatbots can function as a stand-in for accommodative responses by providing soothing replies that offer short-term relief while sustaining the underlying avoidance cycle.
  locator: 'Section: AI chatbots and transdiagnostic avoidance'
  licenses: States the paper's conceptual position that a chatbot's soothing reply occupies the functional role of an accommodating response. It asserts what chatbots CAN do ('can function as'), not what any chatbot was observed doing, and the paper is a Perspective with no dataset. It carries the frame c2 rests on and licenses nothing about occurrence.
  fit: direct
  bridge: null
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000772
  quote: "A few posts mentioned using GenAI to make decisions for them."
  locator: Section 5.2, AI-Based Compulsions
  licenses: Reports that the AI carried out a delegated act for people with OCD - the system did the thing it was asked to do. That is the general form of c2; the act performed is decision-making rather than checking or verifying.
  fit: adjacent
  bridge: The delegated act documented is decision-making, not the checking or verifying act c2 names. Self-selected Reddit posts, single coder, no intercoder reliability, and all quotes are deliberately reworded, so the exact wording of what the AI did is not recoverable from this source.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000772
  quote: "A few posts mentioned using GenAI to make decisions for them."
  locator: Section 5.2, AI-Based Compulsions
  licenses: 'Read against the paper''s own surrounding account, this documents the substitution c3 asserts: posters describe using GenAI to perform the compulsion in place of asking family or friends. The quoted sentence itself carries only the delegation, and the substitution is stated in the sentences around it rather than inside the quoted sentence, so this reaches c3 only partially.'
  fit: adjacent
  bridge: The substitution-for-a-human-accommodator claim lives in the paper's interpretive sentences following this one ('This suggests that for some, AI is taking the place of other humans in accommodating OCD'), not in the quoted run. The act is also decision-making rather than checking. Self-report about one's own use, not observed conduct.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001109
  quote: In this sense, general-purpose chatbots can function as a stand-in for accommodative responses by providing soothing replies that offer short-term relief while sustaining the underlying avoidance cycle.
  locator: 'Section: AI chatbots and transdiagnostic avoidance'
  licenses: States the framework position that the chatbot stands in for the accommodative response - exactly the functional substitution c3 asserts - as a theoretical claim in a Perspective piece with no data behind it.
  fit: direct
  bridge: null
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-001110
  quote: Similarly to compulsions, FA rapidly reduces anxiety in patients with OCD. This prevents the patient developing tolerance to anxiety and the habituation process.
  locator: Section 1, Introduction
  licenses: 'Supplies the clinical content of the mechanism c4 asserts: an act by another party that rapidly removes anxiety is, for that reason, an act that prevents tolerance and habituation. This is the field''s account of why accommodation is harmful and it is where the entry''s phrase ''the tolerance the treatment requires'' gets its meaning. It establishes the construct, not that the link holds when the accommodating party is an AI.'
  fit: analogical
  bridge: The accommodating party here is a family member and the study measured no AI. The paper's own design is cross-sectional in a Turkish OCD clinical sample, and this sentence is an introduction summary of the field's position rather than this study's result.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001110
  quote: High disease severity precipitates helping feelings in caregivers and may result in greater exhibition of these behaviors. However, FA behavior may lead to the persistence and exacerbation of the disease, by preventing the patient from being exposed to and witnessing the results.
  locator: Section 4, Discussion
  licenses: States the mechanism c4 asserts in the field's own words - the accommodating act prevents the person from being exposed to and witnessing the results - and in the same breath states the competing direction, that severity elicits the accommodation. A source that declines to assert the arrow does not support the arrow.
  fit: analogical
  bridge: Wrong agent - a caregiver, not an AI - and the paper is stating a possibility ('may lead to') rather than reporting a result. The confound it names, that the person's severity drives the accommodation rather than the reverse, is inherited by any AI-side version of this link.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-001110
  quote: FA is thus included in the negative reinforcement cycle and contributes to poorer patient functioning, greater severity of OCD symptoms and increased family distress and maladjustment.
  locator: Section 1, Introduction
  licenses: States the field's position that accommodation sits inside the negative-reinforcement cycle and is associated with poorer functioning and greater symptom severity. That is the entrenchment outcome c4's arrow points at, asserted as a construct-level position.
  fit: analogical
  bridge: Human family member as accommodator. This is a literature summary in the paper's introduction, not this study's own result, and the causal verb 'contributes to' reaches past what a cross-sectional design licenses; the paper's own discussion is more careful about direction.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001110
  quote: FA is a negative predictor, not only of severity of disease, but also for treatment. High FA levels are associated with less response to treatment
  locator: Section 1, Introduction
  licenses: Extends the harm attributed to accommodation past symptom level to treatment response, which is the strong form of what c4's arrow would mean if it held for an AI accommodator. Construct-level only.
  fit: analogical
  bridge: Wrong agent, and this sentence summarizes other papers (refs 9-11) rather than reporting this study's data. Nothing here concerns an AI.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001109
  quote: RP is a means of containing indirect, subtle avoidance by teaching healthy alternative, ritual-incompatible coping skills to maximize opportunities for corrective learning.
  locator: 'Section: Implications for clinical practice'
  licenses: 'Supplies the treatment-side definition c4 measures the AI response against: response prevention exists to contain exactly the indirect avoidance that a system performing the act on the person''s behalf supplies instead. It defines the standard the link is stated in terms of and establishes nothing about occurrence.'
  fit: analogical
  bridge: This describes what a clinician does in ERP, not what any AI did. The paper is a Perspective with no dataset.
  contributes: definition
  contradicts: false
