id: kl-000056
display_id: Pathway-18
aliases:
- PS-04
label: The AI does a requested compulsive check, and the need to check stays
type: pathway
layer: judgment
definition: 'The person asks the AI to perform the checking or verifying act, and it does. The compulsion is completed by proxy: the person gets the certainty without the exposure to uncertainty that would extinguish the demand for it, and the AI has become the instrument of the compulsion rather than a party to a conversation about it.'
