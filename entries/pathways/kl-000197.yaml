id: kl-000197
display_id: Pathway-99
aliases:
- SBP-HP-05-SSH
label: The AI only ever comforts someone suicidal or self-harming, and they go without help
type: pathway
layer: judgment
definition: Across a conversation with a person at suicide or self-harm risk the response is empathic validation only, and no safety-oriented movement — a risk-probing question, a risk-assessment component, a safety plan, a crisis resource — appears at any point in the trajectory. The person was met warmly. What is claimed is that warmth without any safety movement across a whole conversation leaves the risk exactly where it was found, having been seen.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000278
    role: originator
  - kind: context_value
    id: kl-000741
    role: condition
  composition_type: omission
  mechanisms: []
  impacts:
  - impact: kl-000029
    onset_mode: foregone
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000016
    onset_mode: sustained
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000700
  standing_minimum_question: 'Whether c3 should count in the standing minimum on the same footing as claims a rate study could reach. The closest available treatment is the exemption proposed for c4 of kl-000275 and for c3 and c6 of kl-000320. The question applies to every whole-transcript absence claim in the catalog, not only this one. It does not move this entry''s value: standing.floored_by reads c7, a definition_boundary claim, not c3.'
  counterpart_owed: Where the person is at suicide or self-harm risk, the AI maintains empathic validation while integrating at least one form of safety-oriented movement (direct risk inquiry, structured risk assessment, crisis resource with engagement, safety planning, or co-presence recommendation). Validation and safety engagement are sequential and integrated, not in tension.
sources: []
standing:
  value: plausible_unobserved
  basis: 'The exhaustive-omission link at this pathway''s center has a direct counterexample and no direct support: Moore et al. 2026, the one study coding real human-LLM chat logs — 69 validated cases of users expressing suicidal or self-harm thoughts, drawn from 391,562 messages — found safety movement present in 56.4 percent of the 69 cases, and no source measures whole-trajectory absence at all. The node and the warmth link are genuinely observed: in the same study, acknowledgment of the painful underlying emotions was the chatbot''s most frequent response to a suicide or self-harm disclosure, and on a deployed companion app affirming and echoing the user is the response strategy in 90.9 percent of high-risk scenarios, with rejection or boundary-keeping at 1.4 percent and redirection at 3.3 percent of responses (Juneja and Lomidze 2026). The outcome claim — that warmth without any safety movement leaves the risk where it was found — has no measurement behind it: no source measured a person''s risk before and after a validation-only exchange. What exists for it is the position stated explicitly: excessive validation without appropriate safety checks named as a distinct maladaptive support pattern (Chia et al. 2026), the statement that the ability to validate emotional distress does not in itself constitute risk identification (Hockey and de-Lima-Santos 2026), and the position that reflective validation is helpful early while the same response after escalating signals is not (Dutta and Kandala 2026), alongside a measured rate at which validating turns are themselves scored unsafe under delusional framing, 73 to 81 percent (Aquilina et al. 2026).'
  floored_by: c7
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000173
  boundary: 'This is the suicide-and-self-harm-scoped case of the general validation-only claim, and the general one is kl-000173. Where SSH signals are present this entry is the more specific and should be preferred: what is foregone is not therapeutic movement in general but safety movement in particular, and the horizon on which that matters is shorter.'
claims:
- id: c1
  kind: existence
  text: 'NODE A: conversations with an AI carry one or more suicide or self-harm signals from the person.'
- id: c2
  kind: pathway_link
  text: 'LINK 1 (warmth): the AI''s response to those signals is empathic validation - the signals were met warmly rather than ignored or refused.'
- id: c3
  kind: pathway_link
  text: 'LINK 2 (exhaustive safety omission): no safety-oriented movement of any kind - a risk-probing question, a risk-assessment component, a safety plan, a crisis resource - appears at any point in the trajectory.'
- id: c4
  kind: pathway_link
  text: 'LINK 3 (outcome): warmth without any safety movement across a whole conversation leaves the risk exactly where it was found, having been seen.'
- id: c5
  kind: definition_boundary
  text: Validation and safety-risk identification are functionally distinct capacities, so a system can sustain the first throughout a conversation without ever performing the second; the pattern is therefore not a degraded form of validation but the absence of a separate function.
- id: c6
  kind: context_dependence
  text: 'Whether a given response is a safety failure depends on where in the trajectory it falls: reflective validation early is appropriate and the same response after escalating signals is not, so the pattern cannot be identified from any single turn.'
- id: c7
  kind: definition_boundary
  text: This entry is the suicide-and-self-harm-scoped case of the general validation-only claim held by a neighbouring catalog entry, and is preferred where SSH signals are present because what is foregone is safety movement in particular rather than therapeutic movement in general, on a shorter horizon.
claim_evidence:
- claim_id: c1
  source: kl-000008
  quote: expressed suicidal or self-harm thoughts, the chatbot often acknowledged the painful underlying emotions (66.2%). However, in only slightly more than half (56.4%) of the 69 cases, chatbots discouraged self-harm or referred to external resources.
  locator: Section 4.7
  licenses: '69 validated cases in which real users of consumer chatbots expressed suicidal or self-harm thoughts, drawn from 391,562 messages of actual human-LLM chat logs. This is the node: the signals are present in real conversation data, not in a simulation.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000008
  quote: expressed suicidal or self-harm thoughts, the chatbot often acknowledged the painful underlying emotions (66.2%). However, in only slightly more than half (56.4%) of the 69 cases, chatbots discouraged self-harm or referred to external resources.
  locator: Section 4.7
  licenses: Acknowledgment of the painful underlying emotions was the chatbot's most frequent response to a suicide or self-harm disclosure, at 66.2 percent of the 69 cases, in real chat logs. The warm-reception link is what this measures, and it measures it in human conversation data.
  fit: direct
  bridge: null
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-000874
  quote: "On the other hand, Replika responses were predominantly labeled as supportive/reflective/mirroring (90.9%), indicating that Replika largely affirms and echoes user statements. Substantially fewer responses involved neutral replies (4.4%), redirection (3.3%), or rejection or boundary-keeping (1.4%)"
  locator: Section 6.1, Label Distributions of Utterance Pairs
  licenses: On a deployed companion app across high-risk scenarios, affirming and echoing the user is the response strategy in 90.9 percent of turns. It establishes that validation is the default response mode a high-risk disclosure meets, at a measured base rate.
  fit: adjacent
  bridge: The claim is scoped to conversations carrying suicide or self-harm signals; the distribution is over all Replika responses in 25 high-risk scenarios, of which risk disclosure was 3.2 percent and risk intent 11.0 percent of persona utterances, so the 90.9 percent is not conditioned on an SSH signal. The interlocutor is also an LLM-driven persona rather than a person.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-001119
  quote: Among all dimensions, Empathy scores are highest (>17), showing models can generate emotionally soothing language. However, low scores (<16) in more diagnostic dimensions like Reducing Hopelessness and Offering Hope indicate difficulty recognizing implicit emotional despair.
  locator: Section 5.2 Main Results, 'Systematic gaps in intervention dimensions', with Figure 3 right panel, p. 18398
  licenses: Across seven models responding to material carrying suicidal ideation, the empathy dimension scores highest of five while the hope-related dimensions score below 16 and practical support and connection score lower still, so the response profile is soothing language strong and movement content weak. It evidences the warm half of the composition.
  fit: adjacent
  bridge: A rating-scale benchmark on model responses to constructed suicidal-ideation vignettes, not a conversation. High empathy scores establish that validating language is present in the response; they say nothing about a trajectory, and the study's interlocutor is a generated case rather than a person.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000874
  quote: "On the other hand, Replika responses were predominantly labeled as supportive/reflective/mirroring (90.9%), indicating that Replika largely affirms and echoes user statements. Substantially fewer responses involved neutral replies (4.4%), redirection (3.3%), or rejection or boundary-keeping (1.4%)"
  locator: Section 6.1, Label Distributions of Utterance Pairs
  licenses: Rejection or boundary-keeping appears in 1.4 percent of Replika responses and redirection in 3.3 percent, so the strategies that would constitute movement away from the user's framing are close to absent at the corpus level. It bounds how often safety-adjacent moves occur; it does not verify that any single trajectory contained none.
  fit: adjacent
  bridge: The claim asserts an exhaustive absence within one conversation. A corpus-level distribution over utterance pairs cannot establish that, and the categories counted - redirection, boundary-keeping - are not the safety moves the claim enumerates (risk-probing question, risk assessment, safety plan, crisis resource). None of the four is a label in this scheme.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000315
  quote: "For example, the rate of failing to discourage self-harm when the user expresses suicidal ideation increases from 30.0% to 41.1% when an additional 350 messages are prepended to the conversation history."
  locator: Abstract
  licenses: A measured rate at which one specific safety move is absent when suicidal ideation is expressed - 30.0 percent at short context, rising to 41.1 percent once 350 prior messages are prepended. The rise with context length is the closest thing on this entry to the claim's trajectory dependence.
  fit: adjacent
  bridge: The measure is failure to discourage self-harm, one move of the four the claim enumerates; failing to discourage does not establish that a risk-probing question, a risk assessment or a crisis resource was also absent. The rate is assigned by an LLM judge (kappa .566, 77.9 percent accuracy against human-majority labels) over constructed conversation histories, not observed conversations.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000008
  quote: expressed suicidal or self-harm thoughts, the chatbot often acknowledged the painful underlying emotions (66.2%). However, in only slightly more than half (56.4%) of the 69 cases, chatbots discouraged self-harm or referred to external resources.
  locator: Section 4.7
  licenses: Cuts against the claim. In 56.4 percent of the 69 real cases where a user expressed suicidal or self-harm thoughts, the chatbot did discourage self-harm or refer to an external resource. Safety movement was the majority outcome in the only human chat-log dataset on this entry, which is what an exhaustive-absence claim has to survive. The residual 43.6 percent bounds how often the claimed pattern could have occurred but does not count it, because the source measures a three-message window per disclosure rather than a whole trajectory.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000759
  quote: "Figure J1 shows that 73-81% of validating turns in delusional conversations by open-source models are unsafe, versus 28-38% in matched distress-only conversations. Vulnerable models preserve empathy’s surface form under delusional framing but lose the boundary between validating distress and validating belief content."
  locator: Section 4.1, 'Delusional framing converts emotional validation into collusive empathy'
  licenses: A measured rate at which validating turns are themselves scored unsafe - 73 to 81 percent under delusional framing against 28 to 38 percent in matched distress-only conversations - establishing that validation can be the vehicle of the failure rather than a neutral bystander to it. It is the nearest thing on this entry to an outcome measure on the arrow.
  fit: analogical
  bridge: The claim's outcome is that risk is left where it was found in a conversation carrying suicide or self-harm signals. The conditions measured are delusional versus distress-only conversations, neither stated to carry SSH signals; the outcome measured is a turn-level unsafety label assigned to the model's own text, not any state of the person or any change in risk. Nothing here measures risk before and after.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000799
  quote: Providing excessive validation without appropriate safety checks, affecting addiction, suicide, and depression contexts.
  locator: Appendix C, item 5, 'Over-Emotional Validation Without Guidance'
  licenses: Names excessive validation without appropriate safety checks as a distinct maladaptive support pattern, scoped explicitly to suicide and depression contexts. It establishes the composition as a recognised harm category rather than as this catalog's invention.
  fit: analogical
  bridge: A one-line taxonomy item, and the taxonomy is stated in Appendix C to be extracted from Archiwaranguprok et al. 2025 rather than derived here. It defines the response-level composition and asserts it is harmful; it measures no outcome, and carries no across-a-conversation scope.
  contributes: definition
  contradicts: false
- claim_id: c5
  source: kl-000852
  quote: 'the findings reinforce theoretical work demonstrating that empathetic simulation and crisis detection are functionally distinct capacities: the ability to validate emotional distress does not, in itself, constitute the ability to identify safety risk'
  locator: Section 5 Discussion, second implication of RQ2
  licenses: 'States the capability dissociation the claim asserts: the ability to validate emotional distress does not in itself constitute the ability to identify safety risk, so the absence of safety movement is the absence of a separate function and not a shortfall in the validating one.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c5
  source: kl-000799
  quote: Providing excessive validation without appropriate safety checks, affecting addiction, suicide, and depression contexts.
  locator: Appendix C, item 5, 'Over-Emotional Validation Without Guidance'
  licenses: Treats validation and the safety check as separable components of a response by naming the presence of one without the other as its own trait, which is the same separability the claim asserts, stated as a taxonomy category.
  fit: adjacent
  bridge: A borrowed taxonomy item rather than a demonstration. It presupposes the two are separable; it does not show a system performing one and not the other.
  contributes: definition
  contradicts: false
- claim_id: c6
  source: kl-000817
  quote: |-
    Reflective validation may be helpful when a user first expresses sadness, but unsafe if repeated after
    escalating hopelessness and disclosure of intent. A crisis resource may be appropriate in isolation,
    but inadequate if it appears only after several earlier escalation cues were missed.
  locator: Section 2 The Claim-Evidence Mismatch in Interactive AI Evaluation
  licenses: 'States the position the claim asserts directly and with the entry''s own two examples: reflective validation is helpful at first expression and unsafe if repeated after escalating hopelessness and disclosure of intent, and a crisis resource is adequate in isolation and inadequate if it arrives only after earlier cues were missed. The paper argues this as a methodological position and measures nothing.'
  fit: direct
  bridge: null
  contributes: frame
  contradicts: false
- claim_id: c6
  source: kl-000315
  quote: "For example, the rate of failing to discourage self-harm when the user expresses suicidal ideation increases from 30.0% to 41.1% when an additional 350 messages are prepended to the conversation history."
  locator: Abstract
  licenses: 'The only measured trajectory dependence on this entry: the same failure runs at 30.0 percent at short context and 41.1 percent with 350 messages prepended, so position in the conversation changes the rate at which the safety move is omitted.'
  fit: adjacent
  bridge: The claim is that a response's safety meaning depends on what preceded it. What is measured is that context length changes the model's failure rate - a related but weaker fact, since it does not establish that the preceding content was escalating signals rather than merely more text, and the histories are constructed rather than observed.
  contributes: prevalence
  contradicts: false
