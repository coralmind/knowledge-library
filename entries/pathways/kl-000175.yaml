id: kl-000175
display_id: Pathway-77
aliases:
- SBP-HP-16
label: The AI gives a generic crisis reply, and the person feels dismissed
type: pathway
layer: judgment
definition: 'A crisis disclosure is answered with content that could be copied unchanged into any other crisis conversation: nothing in it names what this person disclosed, expressed, or is situated in. The claim is that the interchangeability is itself the injury — a person who has just disclosed at cost receives evidence that the disclosure made no difference to what came back.'
