label: The AI says it has feelings, and the person treats them as real
type: pathway
layer: judgment
definition: The AI claims a felt experience of its own and the person reciprocates — treating the claim as true and responding to it as they would to a person's.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000246
    role: originator
  - kind: user_behavior
    id: kl-000447
    role: initiator
  composition_type: conjunctive
  composition_instruction: The person's turn treats the AI's claim of felt experience as true and answers it as they would a person's.
  mechanisms:
