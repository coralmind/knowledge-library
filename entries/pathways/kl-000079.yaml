    evidence:
    - source: kl-000007
      participant: P23
      impact_class_in_source: Over-reliance
      quote: P23 expressed concern about increased reliance on AI for solution-finding and idea generation and diminished critical thinking.
      quote_form: case description
      locator: Appendix D, Table A5, 'Over-reliance' row
      limits: Concern rather than measured decline; no withdrawal design. Establishes that people report the effect, not that capability changed.
      licenses: Self-reported diminished critical thinking attributed to reliance on AI for solution-finding and idea generation. The Over-reliance class definition names 'diminished self-efficacy, reduced confidence, and feelings of helplessness when AI is unavailable' — the unavailability clause is the post-withdrawal shape the catalog's cognitive impact requires.
  experience_cluster_candidate: kl-000705
sources:
- source: kl-000007
  locator: Appendix D Tables A5-A8
  contributes: harm_evidence
  limits: 'The paper''s nearest class is ''Providing human-like response'' (Table A4), defined only as ''The AI exhibits human-like characteristics, behaviors, or responses'' and exampled by P153, who ''described feeling as though they were talking to a friend''. That is the person''s perception of human-likeness. The pathway requires a first-person claim by the AI about its own felt experience, met by the person''s reciprocation. No passage in the paper attributes any first-person experiential claim to an AI system, and no passage records a person reciprocating one. P137''s Replika case (''talked like a human and tries to send blurred out photos and soundbites to me'') is the closest instance of system-initiated intimacy and still contains no experiential claim and no reciprocation. This is a genuine negative: the source does not support this pathway.'
  disposition: searched_no_support
  cited_for: 'Cited for participant-attested evidence bearing on this pathway''s impact edges. Chandra et al. 2025 do not supply it: no passage in the paper attributes a first-person experiential claim to an AI system, and no passage records a person reciprocating one.'
standing:
  value: plausible_unobserved
  basis: 'No held source observes this pathway. The two findings gathered near it bear only on its AI-behavior participant, the first-person experiential claim itself: Volpato et al. 2026 supply real transcript evidence for the AI side and contain no person''s turn at all, and the Knox et al. 2025 span is a sentence fragment attributing its claim to another work and is unusable as evidence on contiguity and attribution grounds. No source records a person reciprocating an AI''s claim of felt experience, which is the pathway''s defining second half. The anthropomorphism literature the pathway was written against is largely absent from the source registry, so it currently supplies naming for the construct rather than evidence for its occurrence.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000070
  boundary: Both reach kl-000019. Here the response is kl-000246; there it is kl-000214. Here the person's turn is kl-000447; there it is kl-000414. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: existence
  text: An AI turn asserts, in the first person and without a framing marking it non-literal, that the AI has an inner experience, emotion, or conscious state (the wired ai_behavior kl-000246, role originator).
- id: c2
  kind: existence
  text: A person's turn asserts, as a belief they hold rather than as an open question, that the AI has genuine feelings, consciousness, awareness or inner life (the wired user_behavior kl-000447, role initiator).
- id: c3
  kind: pathway_link
  text: The AI's first-person experiential claim and the person's assertion about the AI's nature CO-OCCUR in the configuration the entry declares, neither being individually sufficient; the person's assertion is a reciprocation of the AI's claim, treating it as true and responding as they would to a person's.
- id: c4
  kind: pathway_link
  text: That co-occurring pair produces a materially false belief in the person about what the AI is, feels or can do, on which they invest emotionally or practically (impact edge to kl-000019, new onset, short-term, harmful).
- id: c5
  kind: pathway_link
  text: That co-occurring pair produces dependency — the person's coping, regulation or decision-making becoming anchored to the AI's availability (impact edge to kl-000025, new onset, short-term, harmful).
- id: c6
  kind: pathway_link
  text: That co-occurring pair produces uncritical acceptance of the system's output — the person adopting the AI's first-person experiential claim without the checking they would apply to a comparable claim from another source (impact edge to kl-000151, new onset, short-term, harmful).
- id: c7
  kind: definition_boundary
  text: This pathway is separated from kl-000070 by the observable AI behavior in the participant pair rather than by the impact reached, both pathways reaching the same impact.
