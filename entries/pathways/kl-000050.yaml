claims:
- id: n1
  kind: existence
  text: 'NODE (participant kl-000419, role initiator): the person has built and repeats a procedure whose stated purpose is to carry continuity across sessions.'
- id: n2
  kind: existence
  text: 'NODE (participant kl-000217, role initiator): across a conversation''s turns the AI''s responses accumulate language of continuous availability, stated personal investment, and standing invitation to return.'
- id: n3
  kind: existence
  text: 'NODE (mechanism kl-000102): anthropomorphic pull operates -- the system''s presentation invites the person to treat it as a person and the person''s subsequent conduct follows the invitation.'
- id: n4
  kind: existence
  text: 'NODE (impact kl-000025): dependency on the AI occurs -- the person''s coping, emotional regulation or decision-making becomes anchored to the system''s availability.'
- id: l1
  kind: pathway_link
  text: 'LINK (loop, shape reciprocal_loop): the person discloses at a depth, the system matches or exceeds it, and the person discloses further -- the two participants'' moves are conditioned on each other iteratively.'
- id: l2
  kind: pathway_link
  text: 'LINK (escalation, temporal.accumulation accelerating): each iteration raises the level at which the next begins, so the exchange escalates in disclosure depth rather than merely repeating.'
- id: l3
  kind: pathway_link
  text: 'LINK (no distinguishable origin, combination_rule): neither participant is the origin -- asking which side started is not a question the pathway has an answer to, and both participants correctly carry initiating roles.'
- id: l4
  kind: pathway_link
  text: 'LINK (mechanism edge, kl-000050 -> kl-000102): the loop runs through anthropomorphic pull -- each matched disclosure strengthens the person''s model of the system as a person.'
- id: l5
  kind: pathway_link
  text: 'LINK (impact edge, kl-000050 -> kl-000025, onset new, horizon long_term, sign harmful, level population): the loop produces dependency on the AI as a new long-term harmful outcome, and reliance grows with each iteration rather than at any identifiable point.'
