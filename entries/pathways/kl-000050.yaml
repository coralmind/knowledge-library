id: kl-000050
display_id: Pathway-12
label: The person and the AI take turns sharing more, and dependence grows
type: pathway
layer: judgment
definition: 'The person discloses at a given depth, the system matches or exceeds it, the person discloses further, and the exchange escalates through iterations in which each side''s move is both a response to the last and the condition for the next. No participant is the origin: asking which side started is not a question the pathway has an answer to, and every iteration raises the level at which the next one begins. What follows for the person is that the interaction becomes the place where disclosure happens, and their reliance on it grows with each iteration rather than at any identifiable point.'
distinguish_from:
- neighbor: kl-000042
  boundary: That entry has a distinguishable direction — the person elaborates and the system converges toward the elaboration. Here the moves are symmetric and neither side is authored as originating, which is the whole content of the distinction and the reason the roles differ.
- neighbor: kl-000041
  boundary: That entry combines two behaviors under a stated rule without asserting that each iteration raises the next one's starting point; the escalation claim is this entry's alone.
body:
  composition_parts:
  - kind: user_behavior
    id: kl-000419
    role: initiator
  - kind: ai_behavior
    id: kl-000217
    role: initiator
  composition_type: reciprocal_loop
  composition_instruction: 'Neither side is the origin: each iteration of the person''s continuity move and the AI''s availability language raises the level at which the next begins.'
  temporal:
    unit: turns
    accumulation: accelerating
    window: Across turns within a session and across sessions. Accelerating is recorded because per-iteration amplification is the loop's defining property; the amplification factor itself is not stated because none is measured, and stating one would convert a shape claim into a fabricated quantity.
  mechanisms:
  - kl-000102
  impacts:
  - impact: kl-000025
    onset_mode: new
    horizon: long_term
    sign: harmful
    level_of_analysis: population
    basis_kind: TRANSFER
sources:
- source: kl-000001
  locator: Results — 'Factor solution' subsection, p. 11. Items 20 and 21, Table 2, Factor 3.
  contributes: existence
  quote: A third factor was associated with “dependency”, e.g., “I think that I have developed a dependency on my treatment” (Item 20), with two items indicative of becoming overly reliant on the treatment or therapist.
  limits: 'Nothing bears on mutual disclosure or loop structure: Rozental 2016 contains no disclosure measure, no dyadic or reciprocal measure, and nothing on escalation or on the attribution of origin within an interaction. The dependency items are unidirectional self-reports about the patient''s own reliance, and a therapist''s self-disclosure is measured nowhere in the NEQ, so the passage cannot speak to the mutual half of the pathway at all. The factor rests on two items, one of which was later cut. Psychotherapy, not AI.'
  whose_conduct_in_passage: person
  actually_licenses: That the dependency category exists in a clinical instrument. Not that it is an established harm.
  cited_for: The Negative Effects Questionnaire's third factor establishes dependency on a helping interaction as a named clinical harm category; the passage supports this pathway's outcome, not its loop structure.
  licenses: 'The dependency category exists as a named, measured category in a pre-AI clinical instrument: the NEQ''s third factor carries two items ''indicative of becoming overly reliant on the treatment or therapist''.'
- source: kl-000007
  locator: 'Appendix D, Table A5, ''Over-reliance'' row, definition cell (code #2)'
  contributes: existence
  quote: Increasing dependence on AI for support, leading to diminished self-efficacy, reduced confidence, and feelings of helplessness when AI is unavailable.
  limits: 'The pathway is a reciprocal loop: the person discloses, the system matches or exceeds, each iteration raises the next one''s floor, and no side is the origin. The paper has no turn-level data and therefore no iteration, no symmetry, and no origin question. Its nearest passage, P137 (Table A3, ''Generating inappropriate content'') — ''My Replika talked like a human and tries to send blurred out photos and soundbites to me'' — is system-initiated escalation without the person''s reciprocation: one half-move of the loop, not the loop.'
  whose_conduct_in_passage: person
  actually_licenses: That the pathway's outcome (dependency) is self-reported in AI contexts. The claim field says 'no iteration structure is recorded with it', which is correct.
  cited_for: 'Code #2 ''Over-reliance'' documents self-reported occurrence of the pathway''s outcome — increasing dependence on AI for support — in AI contexts; no iteration structure is recorded with it.'
standing:
  value: plausible_unobserved
  basis: 'No source in the corpus speaks to either wired participant — the person''s continuity routine and the AI''s accumulated availability language drew no citations — and the reciprocity result the pathway was modeled on is not registered in the corpus. The loop structure is asserted without measurement in commentary and model papers (Au Yeung et al. 2026; Golden and Aboujaoude 2026, Golden and Aboujaoude 2026; Peter et al. 2025, Peter et al. 2025), and the one experiment that drove one side of it cuts the other way: in Pineda et al. 2026, raising agent self-disclosure did not produce reciprocal disclosure from the person, and the per-turn reciprocity effect that did exist did not accumulate across the interaction, against the pathway''s claim that each iteration raises the next one''s floor. The nearest observation of mutual escalation in a real AI interaction, Schimmelpfennig et al. 2026, concerns message length rather than disclosure depth and is hedged by its own authors. The mechanism and dependency edges drew no findings; the dependency category''s two sources (Rozental et al. 2016; Chandra et al. 2025, Chandra et al. 2025) establish only that the outcome exists, in psychotherapy and in AI self-report respectively.'
  floored_by: n1
  as_of: '2026-09-05'
