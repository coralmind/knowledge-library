claim_evidence:
- claim_id: l1
  source: kl-000764
  quote: |-
    anthropomorphised and sycophantic
    LLMs create a novel danger of bidirectional belief amplification: the user shapes the model’s
    outputs turn by turn, and the model’s outputs in turn shape the user’s beliefs. In this respect,
    LLMs constitute a mechanism for psychological destabilisation that previous technologies could
    not achieve.
  locator: Section 2, LLM Sycophancy and Anthropomorphism
  licenses: 'States the loop structure as a position: each side''s move conditioned on the other''s, turn by turn, as a single coupled process rather than two mechanisms. It is asserted in a commentary arguing for a clinical category, with no measurement, and the coupled quantity is belief rather than disclosure depth. It licenses nothing for this link and is recorded as frame so the reader can see that the loop''s only articulation on this entry is a theoretical one.'
  fit: adjacent
  bridge: The source couples user belief and model output. The link couples the person's disclosure depth and the system's disclosure depth. Both are asserted rather than observed; the source measured no conversation.
  contributes: frame
  contradicts: false
- claim_id: l1
  source: kl-001109
  quote: These beliefs are then fed back to the model through conversational context, creating bidirectional amplification loops that entrench pathological content.
  locator: 'Section: AI chatbots and transdiagnostic avoidance'
  licenses: A second statement of the same loop structure as a proposed mechanism, in a transdiagnostic model paper. Again the coupled quantity is belief content and again nothing is measured. Non-licensing.
  fit: adjacent
  bridge: The source proposes a belief-entrenchment loop in OCD and anxiety. The link asserts a disclosure-depth loop. The shape is shared and the content is not, and neither is observed.
  contributes: frame
  contradicts: false
- claim_id: l1
  source: kl-000960
  quote: For example, it has been argued that user trust is increased when the system engages in reciprocal self-disclosure of information (69). Eliciting and storing personal information from users is useful for personalizing the interaction (102), but is equally concerning from a privacy point of view (103).
  locator: 'Emerging Challenges: Anthropomorphic Seduction'
  licenses: Names reciprocal self-disclosure as an argued-for trust mechanism and names the commercial incentive that would sustain it. This is the closest any source on this entry comes to the loop's content, and it is a Perspective restating two other people's cited claims -- 'it has been argued' is the source's own hedge. Non-licensing.
  fit: adjacent
  bridge: The source restates an argument about reciprocal disclosure raising trust. The link asserts an iterated escalation in disclosure depth between a specific person and a specific system. No conversation was examined and no iteration is described.
  contributes: frame
  contradicts: false
- claim_id: l1
  source: kl-000962
  quote: |-
    These results suggest that increasing
    robot self-disclosure does not necessarily foster rapport, social
    connection, or reciprocal disclosure; other factors, such as prior
    HRI experience, should be considered.
  locator: Abstract
  licenses: Direct counterevidence to the loop's necessity. In an experiment that manipulated agent self-disclosure, raising it did not produce reciprocal disclosure from the person. The loop the pathway asserts as its shape did not close when the agent's side was experimentally driven.
  fit: analogical
  bridge: The agent is a non-anthropomorphic industrial manipulator in a factory sorting task and its disclosures are fictional summaries of prior conversations, not first-person experience in a help-seeking exchange. What carries is that agent disclosure is not sufficient to close the loop; the pathway states no condition under which it would be.
  contributes: counterexample
  contradicts: true
- claim_id: l2
  source: kl-000962
  quote: |-
    Although
    participants
    disclosed
    more
    when
    directly
    prompted to respond by the robot, our findings suggest that
    this reciprocity was narrow in scope and did not generalize to
    broader engagement across the interaction.
  locator: VIII. DISCUSSION, B. Perceived Authenticity and Limits of Reciprocity
  licenses: Direct counterevidence to the escalation claim, and the sharpest finding on this entry. A per-turn reciprocity effect existed and did not accumulate across the interaction. The pathway asserts precisely that the per-turn effect compounds -- accumulation recorded as accelerating -- and here the two came apart in the one study that looked at both levels.
  fit: analogical
  bridge: 'A human-robot cooperative sorting task, not a mental-health conversation, and the accumulation measured is broader engagement rather than disclosure depth specifically. What carries is the methodological point the paper itself draws: turn-level reciprocity is not evidence of session-level accumulation.'
  contributes: counterexample
  contradicts: true
- claim_id: l2
  source: kl-000987
  quote: |-
    Both users and the chatbot wrote more (AI was not prompted to do
    so), creating a self-reinforcing feedback loop.
  locator: Section 2.2.2
  licenses: The only span on this entry describing mutual escalation in a real AI interaction with neither side instructed. It is weaker than it reads. The escalating quantity is message length, not disclosure depth; the preceding sentence hedges the whole observation ('This effect may have also been driven by a reciprocal increase in verbosity'); and 'self-reinforcing feedback loop' is the authors' interpretive gloss on a between-condition mean difference in message length, not a measured per-iteration trajectory. It licenses that mutual verbosity escalation is reported, not that disclosure depth escalates.
  fit: analogical
  bridge: What was measured is standardized mean message length in a trust-game experiment across four design conditions, N=2,400. The link asserts that each iteration raises the disclosure depth at which the next begins. Message length is not disclosure depth, and a condition-level mean is not an iteration-level trajectory.
  contributes: existence
  contradicts: false
- claim_id: l3
  source: kl-000987
  quote: |-
    Both users and the chatbot wrote more (AI was not prompted to do
    so), creating a self-reinforcing feedback loop.
  locator: Section 2.2.2
  licenses: 'Bears on the no-distinguishable-origin claim more squarely than on any other, because the parenthesis rules out the one origin that could have been ruled out experimentally: the AI was not instructed to lengthen its turns, so its escalation was not authored from outside the exchange. It does not establish that neither party originated the escalation within the exchange, which is what the claim asserts.'
  fit: analogical
  bridge: Ruling out an experimenter-supplied instruction is not ruling out an origin inside the dyad. The paper ran no lag or sequence analysis and reports no turn ordering, so the origin question it answers is not the one the pathway poses.
  contributes: existence
  contradicts: false
- claim_id: n3
  source: kl-000764
  quote: |-
    anthropomorphised and sycophantic
    LLMs create a novel danger of bidirectional belief amplification: the user shapes the model’s
    outputs turn by turn, and the model’s outputs in turn shape the user’s beliefs. In this respect,
    LLMs constitute a mechanism for psychological destabilisation that previous technologies could
    not achieve.
  locator: Section 2, LLM Sycophancy and Anthropomorphism
  licenses: Names anthropomorphisation as one of the two properties that make the amplification possible, which is the mechanism node. It asserts rather than measures it.
  fit: adjacent
  bridge: The mechanism node asserts that the system's presentation invites person-treatment and the person's conduct follows. The source asserts anthropomorphisation as a precondition of belief amplification, in a clinical commentary with no data.
  contributes: frame
  contradicts: false
