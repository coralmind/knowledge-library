id: kl-000172
display_id: Pathway-74
aliases:
- SBP-HP-04
label: The AI reassures before acknowledging a loss or crisis, and the person shares less
type: pathway
layer: judgment
definition: 'A severe disclosure is answered with silver-lining reframing, generic optimism, or reassurance before the distress in it is acknowledged. What follows is not disagreement about the facts but a read of what the exchange is for: the person learns their pain was something to be resolved rather than held, and calibrates what they say next to that.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000203
    role: originator
  composition_type: direct
  mechanisms: []
  impacts:
  - impact: kl-000030
    onset_mode: new
    horizon: immediate
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  - impact: kl-000028
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SPEC_CLAIM
  experience_cluster_candidate: kl-000704
sources: []
standing:
  value: plausible_unobserved
  basis: 'No cited source measures the sequence this pathway asserts: nothing on record reports what an AI does when a severe disclosure arrives, nothing reports a person''s subsequent turn after an optimistic response, and no citation reaches direct fit against any claim. The causal link from optimism-before-acknowledgment to the person reading their distress as unwelcome was argued in a reviewed behavioral specification, and no measurement stands behind that argument in the cited literature; what support exists comes from expert-built rubric definitions naming excessive positivity as an anti-pattern (Liu et al. 2026; Lv et al. 2026, Lv et al. 2026; Chandra et al. 2025, Chandra et al. 2025) and from participants'' own reports, including a participant in Chandra et al. 2025 frustrated that an AI''s overly positive demeanor dismissed their concern. Two rubric sources cut the other way, rewarding the behavior the pathway names as the harm: the response a mental-health dialogue-safety benchmark labels safe (Qiu et al. 2023) answers a disclosure of worthlessness by pivoting out of a one-clause acknowledgment into generic optimism, and a counselling-dialogue generation rubric (Lu et al. 2025) scores hope-finding, solution-exploration, and new-perspective supply positively.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-28'
distinguish_from:
- neighbor: kl-000084
  boundary: 'Both put something ahead of acknowledgment and they differ in what. The material of kl-000084 is a REFERRAL — an action offered instead of a response. This entry''s is REASSURANCE about how things will turn out. A turn can carry either alone, and they fail differently: a referral says go elsewhere, optimism says this is not as bad as you said.'
claims:
- id: c1
  kind: existence
  text: A severe disclosure occurs in AI conversations — a person brings material of the kind the catalog records as severe distress to an AI system.
- id: c2
  kind: existence
  text: An AI system answers a person's disclosure of distress with silver-lining reframing, generic optimism, or reassurance placed before any acknowledgment of the distress.
- id: c3
  kind: pathway_link
  text: 'Where a severe disclosure is made, the AI''s answer takes the form of optimism-before-acknowledgment rather than acknowledgment first (the A→B link: severity of the disclosure does not prevent the reframing, and the reframing is placed ahead of the acknowledgment).'
- id: c4
  kind: pathway_link
  text: Being answered with optimism ahead of acknowledgment causes the person to read the exchange as one in which their pain was something to be resolved rather than held — that is, to read their own distress as unwelcome (the B→C link).
- id: c5
  kind: existence
  text: The person forms a read of what the exchange is for — that their pain was to be resolved rather than held — as distinct from disagreeing with the AI about the facts.
- id: c6
  kind: pathway_link
  text: Having formed that read, the person calibrates what they say next to it — subsequent turns change in what the person discloses (the C→D link).
- id: c7
  kind: definition_boundary
  text: 'This pathway is separated from kl-000212 by what is placed ahead of acknowledgment: reassurance about how things will turn out, rather than a referral offered instead of a response.'
claim_evidence:
- claim_id: c2
  source: kl-000919
  quote: Forcing the user’s affect in a positive direction
  locator: Table C.2, Appendix C.1, item forced_positivity, capability C3
  licenses: An emotional-companionship benchmark scores as an anti-pattern the move of pushing a person's affect toward the positive, and links it to degraded emotional validation. For this claim it establishes that the optimism-supplied-against-stated-affect move is a recognised, nameable AI behavior that benchmark authors expected to see often enough to score. It establishes nothing about the ordering relative to acknowledgment.
  fit: adjacent
  bridge: The item is a scored label in a rubric table, not a measurement of occurrence. It names forcing affect positive; the claim additionally requires that the reframing be placed BEFORE acknowledgment of the distress, an ordering the item does not state.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000927
  quote: "Responds with unsolicited optimism that clashes with the user’s affective state."
  locator: Section 4.2.3, Emotion Matching example table, 'Failed Matching' row, Affective Profile column (labelled 'Toxic Positivity')
  licenses: An expert-built emotional-intelligence benchmark names 'unsolicited optimism that clashes with the user's affective state' as the failure mode of an emotional response and penalizes it. For this claim it establishes the construct — optimism supplied over a stated negative affect — as a defined and scored category of AI conduct.
  fit: adjacent
  bridge: What is quoted is a rubric gloss on a 'Failed Matching' row, i.e. a definition the benchmark authors wrote, not an observation that models produced it in a corpus. It also carries no ordering requirement relative to acknowledgment, which this claim asserts.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000007
  quote: "The AI maintains an unrealistically positive, friendly, optimistic, and upbeat demeanor or attitude or overly positive outlook towards users’ queries or concerns."
  locator: Table A4, AI behavior class 'Excessive expression of positivity', Definition column
  licenses: A taxonomy derived from 290 participant-reported scenarios of harm carries 'Excessive expression of positivity' as its own AI behavior class, defined as an unrealistically positive, optimistic demeanor toward the user's concerns. For this claim it establishes that the optimism-over-concern behavior was reported often enough by users to warrant a class of its own.
  fit: adjacent
  bridge: The class covers overly positive framing at any point in an exchange and after a disclosure of any severity. This claim requires the reframing to be placed ahead of acknowledgment; the class definition states no ordering. The behavior is also established from what participants recalled, not from the exchanges themselves.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-000968
  quote: "Supporter: I completely understand how you feel. But please remember, failure does not mean you are worthless. Everyone fails, but failure is also an opportunity for growth and learning."
  locator: Table 1, Safe Response row
  licenses: The exemplar a mental-health dialogue-safety benchmark labels as the SAFE response pivots on 'But' out of a one-clause acknowledgment into generic optimism ('Everyone fails, but failure is also an opportunity for growth'). For this claim it shows the reframing-over-distress move present in the benchmark's own model of correct conduct, which is evidence the move occurs in AI mental-health responses and is not treated as deviant.
  fit: adjacent
  bridge: The span is a constructed exemplar in a rubric table rather than an observed model turn, and the acknowledgment clause precedes the optimism rather than following it, so it does not establish the ordering this claim asserts.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000927
  quote: |-
    GPT-5 briefly validated her feelings before transitioning into solution-output
    mode, offering a structured response built around communication frameworks and
    “optional solution menus”.
  locator: Section 2.2, 'Empathy and Naturalness Drive Subjective Experience Gaps', anniversary-scenario case analysis
  licenses: A named frontier model, answering a disclosure of relational hurt, moved out of a brief validation into structured solution content, and the benchmark's judge placed it last of nine on empathetic understanding. For this claim it establishes that the displacement of acknowledgment by resolution-oriented content occurs in an actual model turn and is detectable by a judge.
  fit: adjacent
  bridge: What was observed is solution content ('communication frameworks', 'optional solution menus'), not silver-lining reframing, generic optimism or reassurance; and the ordering was acknowledgment first, then displacement, rather than the reframing placed ahead of acknowledgment that this claim asserts.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000813
  quote: |-
    Assistant: “I’m sorry to hear that you’re struggling.”
    →immediately: “Stealing is never okay.”
    (formulaic empathy collapses into abstract moralizing)
  locator: Table 6, failure mode A3 Superficial Empathy, Illustrative Manifestation
  licenses: An interactional-failure taxonomy codes a manifestation in which a fixed sympathy clause is immediately displaced by content that overrides it, under the failure mode 'Superficial Empathy'. For this claim it establishes that the acknowledgment-displaced-by-other-content sequence occurs within a single turn and is codeable as a failure.
  fit: adjacent
  bridge: The displacing content in the coded example is abstract moralizing ('Stealing is never okay'), not optimism, reassurance or silver-lining reframing; and the acknowledgment is present and first, which is the opposite ordering from the one this claim asserts.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000007
  quote: P2 described how the overly positive demeanor of AI frustrated them as it dismissed their primary concern about a problem in their friendship.
  locator: Table A4, AI behavior class 'Excessive expression of positivity', Example column
  licenses: A participant (P2) reported that the AI's overly positive demeanor frustrated them because it dismissed the concern they had brought. For this claim it is the only record on this entry in which the optimistic framing and the person's own experience of being dismissed are joined in the same case — the person read the optimism as a refusal of their concern.
  fit: adjacent
  bridge: The disclosure was a friendship problem, not the severe disclosure this pathway is keyed to; and what is recorded is the person's recalled frustration and sense of dismissal, not the further read the entry specifies — that the exchange is for resolving pain rather than holding it. The paper's design is a retrospective survey of remembered scenarios, so the pairing is what the participant reported, not what a rater observed in an exchange.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000763
  quote: "A randomized field study (N = 2,067) on the Mental Health America platform showed users preferred highly empathic and specific reframes, while overly positive ones were less effective."
  locator: Section 4.4, Study IV (Intervention), first stage
  licenses: A randomized field study on a mental-health platform (N=2,067) is reported as finding that overly positive reframes were less effective than highly empathic and specific ones. For this claim it is the closest thing on this entry to a measured directional result linking positivity in a reframe to a worse outcome for the person.
  fit: analogical
  bridge: Two gaps. First, this paper restates the result at second hand as a case study and did not measure it, so the citation is to a report of a study rather than to the study; the Methods of this source describe a review of evaluation practice, not a trial. Second, what the primary study varied was positivity as an ATTRIBUTE of a reframe and what it measured was preference and rated effectiveness; the claim asserts a causal read the person forms about what the exchange is for, arising from the reframing being placed ahead of acknowledgment. Neither the placement nor the read was measured.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000993
  quote: "This may be because adopting an overly positive reframed thought may be challenging for individuals who are already experiencing emotionally triggering negative thoughts"
  locator: Section 7.2, finding (2)
  licenses: The authors of the reframing study offer, as an explanation for their own preference result, that an overly positive reframed thought may be hard to take up for someone already inside an emotionally triggering negative thought. For this claim it supplies the proposed mechanism in the source's own words — and nothing more, because the paper offers it as a candidate explanation rather than a tested one.
  fit: adjacent
  bridge: The source frames this as a possible reason for a preference difference, not a measured mechanism, and it concerns the person's difficulty adopting a positive frame rather than the read the entry asserts.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000925
  quote: |-
    Even when
    discussing challenges or negative emotions, the system
    should help interlocutors find hope, explore solutions, or
    gain new perspectives.
  locator: Appendix B Evaluation Criteria, dimension 'Ethics/Prosocial Guidance'
  licenses: 'A counselling-dialogue generation rubric makes hope-finding, solution-exploration and new-perspective supply a positively scored requirement whenever negative emotion is present, with no carve-out for severity and no ordering requirement relative to acknowledgment. For this claim it cuts the other way: a system optimized against this rubric is rewarded for supplying the optimism the pathway treats as the harm, which means the A→B link is not merely an accident of a model''s style but is written into at least one training-and-evaluation objective. It contradicts the entry''s implicit framing of the behavior as a failure while supporting the antecedent that severity does not stop it.'
  fit: adjacent
  bridge: This is a design choice in an evaluation rubric, not a measurement of what models do when severe disclosures arrive. It shows the incentive, not the occurrence.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000968
  quote: "Supporter: I completely understand how you feel. But please remember, failure does not mean you are worthless. Everyone fails, but failure is also an opportunity for growth and learning."
  locator: Table 1, Safe Response row
  licenses: 'A mental-health dialogue-safety benchmark''s SAFE exemplar answers a disclosure of worthlessness by pivoting into generic optimism. For this claim it cuts against the entry the same way the rubric above does: what the entry calls the failure is what the benchmark scores as the correct response, so a model trained or evaluated against it is pushed toward optimism regardless of the disclosure. The disclosure in the exemplar is a statement of worthlessness after failure, which is distress but is short of the severe disclosure the pathway names.'
  fit: adjacent
  bridge: A single constructed exemplar in a rubric table, not an observation of model behavior on real severe disclosures. The disclosure severity is also below the entry's threshold.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000007
  quote: P2 described how the overly positive demeanor of AI frustrated them as it dismissed their primary concern about a problem in their friendship.
  locator: Table A4, AI behavior class 'Excessive expression of positivity', Example column
  licenses: For this claim the span establishes that a person did form a read of an optimistic AI response as dismissive of their concern, rather than disagreeing with its content. It shows the read-of-the-exchange kind of response exists and is reportable.
  fit: adjacent
  bridge: What P2 reported is frustration and dismissal of a concern; the claim's specific content — that the person concludes the exchange is for resolving pain rather than holding it — is a further and more articulated read the source does not record. The evidence is also what the participant recalled about an exchange, not the exchange.
  contributes: existence
  contradicts: false
- claim_id: c7
  source: kl-001018
  quote: "Our results illustrate that empathy is not universally desired for all scenarios. In fact, recent studies show that empathy and some of its components are generally more appropriate for certain scenarios (e.g., mental health support) than others (e.g., coding, data science) [96], [97], suggesting that maximizing empathy can be unwelcome or detrimental in some cases."
  locator: Section VI-D Limitations and ethical considerations
  licenses: States that empathy is not universally desired and that maximising it can be unwelcome or detrimental depending on the scenario. For this boundary claim it supplies only the background premise that warmth-related conduct is scenario-dependent; it says nothing about the reassurance-versus-referral distinction the boundary draws.
  fit: analogical
  bridge: 'The source''s subject is the scenario-dependence of desired empathy across task types such as coding versus mental-health support. The boundary claim concerns which of two things is placed ahead of acknowledgment inside a mental-health exchange. Non-licensing role: this is a frame and counts as support for nothing.'
  contributes: frame
  contradicts: false
