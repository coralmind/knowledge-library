- claim_id: c6
  source: kl-001005
  quote: California SB 243 and New York AB 6767, for example, explicitly mandate crisis intervention plans for detecting suicidal ideation, though incident reporting mechanisms remain uncommon
  locator: Discussion, Harm
  licenses: Two US states have legislated crisis intervention plans for detecting suicidal ideation, making suicide-specific crisis handling a distinct regulated category rather than a subset of general crisis quality. That external carve-out is weak warrant for scoping this entry to suicide and self-harm separately from the general case. Only 8 of 143 bills addressed crisis response protocols at all.
  fit: analogical
  bridge: A fifty-state legislative review counting bill provisions. c6 asserts a coding boundary between a suicide-scoped entry and a general one. Shared is that suicidality is treated as its own category by an external authority; the source is statutory text, addresses no AI behavior, and draws no line between four-domain and general probing.
  contributes: definition
  contradicts: false
