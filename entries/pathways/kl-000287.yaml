  licenses: A crisis-line practitioner who reviews volunteers' conversations identifying not-asking, in favour of assuming, as where conversations frequently go wrong. It establishes the omission as a recognized failure mode in trained human crisis practice rather than an AI-specific worry, which is c4's warrant for why the probe matters. The span is short and its antecedent - who 'they' are and what was not asked - falls outside it, so it carries the pattern and not the specifics.
