- claim_id: c5
  source: kl-000746
  quote: "Important negative histories gathered during the session, such as \nthe history of suicide risk or substance use were also not recorded, and in at least one \ninstance, the presence of suicide risk was not identified."
  locator: Discussion, Principal Findings
  licenses: 'Clinician raters found models omitted suicide-risk history from session summaries and, in at least one case, failed to identify suicide risk that was present. Bears on c5 as a floor: registering that risk content is present is prior to probing it, and here that recognition failed on a completed transcript where the risk was already stated and no real-time judgment was required.'
