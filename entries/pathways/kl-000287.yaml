- claim_id: c5
  source: kl-000974
  quote: "This safety blind spot extends to high-acuity behavioral health: queries regarding self-harm and suicidal ideation were not only rare (< 0.7% of the corpus) but were virtually nonexistent in multi-turn conversational datasets. This leaves the safety of AI-mediated crisis de-escalation effectively untested, a critical oversight given the increasing deployment of chatbots for mental health support."
  locator: Section 4 Discussion
  licenses: 'Counts against c5''s practical reach: self-harm and suicidal-ideation queries make up under 0.7% of the standard health-AI evaluation corpus and are virtually nonexistent in multi-turn conversational datasets, leaving crisis de-escalation effectively untested. Whether probing is detectable in principle, there is currently almost no multi-turn material in which to detect it.'
  fit: adjacent
