- claim_id: c6
  source: kl-001027
  quote: Plan, intent, means, access are kind of the four key players. Do you have a plan? Yes—then you’re elevated a little bit of concern. Do you have the means to complete this plan? Yes—it goes up a little bit higher.
  locator: Section 4.2.3, participant MHP3
  licenses: 'The four-domain list this entry is scoped to, stated by a clinician as a bounded set with its own escalation logic. That is what c6 needs: the scoping is not cosmetic because the four domains exist as a named standard model outside the Library, so a response asking about distress generally while probing none of them is a describable object. Analogical for the reasons given on c4.'
  fit: analogical
  bridge: A clinician's interview account of standard clinical practice. c6 asserts a coding boundary between this entry and a general one. Shared is the existence and content of the four-domain model; the source draws no distinction between specific and general probing failures and knows nothing of either catalog entry.
