  fit: adjacent
  bridge: 'A design-recommendation table row in a position paper on crisis support. c4 asserts four separately probeable domains. The gap is granularity: ''risk level'' is one construct where the claim asserts four, so the source cannot license the separability half.'
  contributes: definition
  contradicts: false
