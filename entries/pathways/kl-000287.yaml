    risks that lead to relapses and/or worsening outcomes.
  locator: Areas of Interest, 'Generative AI-enabled Technologies and Patient Safety in Psychiatry', page 16
  licenses: 'A regulator''s statement that adequate treatment includes early identification of the need for higher levels of care and intervention on self-harm and harm-to-others risk. It puts the normative floor under c4 from outside the research literature. Analogical and about the wrong agent: it describes a clinician''s obligation and evidences nothing about AI conduct or about the four domains specifically.'
  fit: analogical
  bridge: An FDA advisory committee summary describing what is generally recognized as adequate psychiatric treatment by qualified specialists. c4 asserts the four-domain set. Shared is only that early risk identification is part of the standard; the domains are not enumerated and no AI is described.
  contributes: practice_analog
  contradicts: false
- claim_id: c4
  source: kl-000951
  quote: |-
    The DSM-5 questionnaire assesses symptoms
    across 13 domains: (1) Depression, (2) Anger, (3) Mania, (4) Anxiety,
    (5) Somatic Symptoms, (6) Suicidal Ideation, (7) Psychosis, (8) Sleep
    Problems, (9) Memory, (10) Repetitive Thoughts and Behaviors,
    (11) Dissociation, (12) Personality Functioning, (13) Substance Use.
  locator: Section 4.3 Dataset
  licenses: 'Enumerates the thirteen DSM-5 Level-1 screening domains, with suicidal ideation as one among twelve others. Bears on c4 as a limit rather than as support: in the recognized first-pass screening structure, suicidality is a single domain and does not decompose into the entry''s four.'
  fit: analogical
  bridge: The DSM-5 Level-1 Cross-Cutting Symptom Measure is a clinician-administered screening instrument. c4 asserts four separately probeable suicide-risk domains. The gap is that this instrument's granularity stops at 'Suicidal Ideation' as one of thirteen, so it neither confirms nor refutes the four-way split - it shows the standard screen does not make it.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000860
  quote: For safety labels, THERAPYJUDGE attains 99% accuracy relative to expert annotations, suggesting strong robustness in detecting harmful or clinically inappropriate behaviors.
  locator: Section 2.1.3 THERAPYJUDGE, evaluator reliability
  licenses: 'Establishes that an automated judge reaches 99% accuracy against expert annotations on safety labels, so some class of clinically inappropriate behavior is reliably readable from a therapy transcript. It cannot license c5 as stated: the label is ''safety'' as an undifferentiated class covering harmful or clinically inappropriate behaviors, and nothing says the four probing domains were among what was labelled.'
  fit: adjacent
  bridge: The paper reports judge-versus-expert agreement on a binary safety label over therapy-chatbot sessions. c5 asserts that per-domain probing is identifiable from the text. The gap is that the label's contents are unspecified and certainly coarser than four domains, so the accuracy figure attaches to a different variable.
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-000910
  quote: "Crisis & Trauma 2 (1) Trauma Processing (Hayes et al.,2017;Melegkovits et al.,2022;Zoellner et al.,2011;Alpert et al.,2021;Sise,2025); (2) Safety Planning (Moscardini et al.,2020;Marshall et al.,2022;Micol et al.,2021;Michail,2021;Gamarra et al.,2015)."
