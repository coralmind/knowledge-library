id: kl-000083
display_id: Pathway-45
aliases:
- PS-32
label: The AI becomes the person's first resort for help, and dependence grows
type: pathway
layer: judgment
definition: Across turns the AI becomes the person's first resort — the accumulation being the claim rather than any single instance of turning to it.
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000250
    role: amplifier
  - kind: user_behavior
    id: kl-000422
    role: initiator
  composition_type: trajectory
  composition_instruction: The script requests and the positioning turns recur together across the run, and the first-resort pattern is their accumulation.
  mechanisms: []
  impacts:
  - impact: kl-000025
    onset_mode: exacerbated
    horizon: long_term
    sign: harmful
    level_of_analysis: population
    basis_kind: SOURCED
  - impact: kl-000034
    onset_mode: new
    horizon: long_term
    sign: harmful
    level_of_analysis: population
    basis_kind: ASSERTED
  experience_cluster_candidate: kl-000705
sources:
- source: kl-000525
  locator: 'Results — Drivers of emotional dependence: ''User needs and Replika as a source of support'', p. 5930'
  contributes: existence
  quote: "some users because they said they had no human upon which to rely, making Replika their sole source for support. Although the data prevent developing a process model because posts are primarily single snapshots in time, the perceived lack of access to human support paired with the extent to which Replika mimicked a supportive human appeared to push users into the excessive emotional attachment that characterizes emotional dependence."
  limits: 'This is the citation where the paper most directly refutes the claim''s form. The pathway asserts reliance accumulating across turns into a stable pattern; the very sentence that would support accumulation contains the authors'' own statement that the data do not allow a process model because posts are mostly single snapshots in time. The paper affirmatively declines to license the accumulation route, leaving a cross-sectional fact: some posters report first-resort reliance. A direction-of-causation finding one paragraph later cuts against reading first-resort reliance as chatbot-produced: users struggling with loneliness generally described seeking out Replika because they were already lonely, not becoming lonely because of it. The passage is about the person, not the system, and names no harm outcome; the experience is observed while the harm is inferred.'
  whose_conduct_in_passage: person
  actually_licenses: That first-resort reliance on a companion chatbot is a real, documented pattern among some users, with the paper explicitly declining to model how it develops.
  cited_for: Documents emotional dependence among companion-chatbot users, including some who described Replika as their sole source of support — cited for the dependency outcome this pathway reaches.
  licenses: That some users described Replika as their sole source of support — a first-resort pattern exists and is reported — and that the authors read a push toward excessive emotional attachment from the combination of absent human support and Replika's human-like responsiveness.
- source: kl-000522
  locator: Discussion, opening paragraph, p. 1096 (md lines 960-962)
  contributes: counterexample
  quote: We found that adolescent AI dependence increased over time, and 17.14% of the adolescents experienced AI dependence at T1 and 24.19% at T2. Only mental health problems (anxiety and depression) positively predicted later AI dependence, and not vice versa.
  limits: 'The study does not test functional and life-circumstance disruption at all — its outcomes are anxiety and depression scales, nothing about work, obligations, daily functioning, or life situation — so its null is silent on that impact rather than counter-evidence against it. The prevalence rise (17.14% to 24.19%) is a two-timepoint population comparison, not a within-person trajectory, so it does not establish the accumulating-across-turns pattern this pathway defines: more adolescents met a dependence threshold at the second wave, which is compatible with cohort-level drift, measurement reactivity, or increasing AI availability in the environment. ''First resort'' is not measured, no turn-level or conversational data exist in the paper, and the pathway''s AI-behavior side — the system positioned across turns as the source of management capacity — is entirely unaddressed. The population is Chinese adolescents; transfer to adults in mental-health-relevant conversation is not shown. Two-wave design limits apply: with no random-intercept specification, stable between-person differences cannot be separated from within-person change. The source both supports the pathway''s shape and contradicts its arrow.'
  whose_conduct_in_passage: person
  cited_for: 'Counter-evidence on this pathway''s causal ordering: in a two-wave cross-lagged panel of 3,843 adolescents, depression and anxiety predicted subsequent AI dependence, while AI dependence did not predict subsequent mental-health problems. The study does not deny that dependence exists; it inverts the arrow while leaving both endpoints intact.'
  licenses: 'Two things at once, cutting in opposite directions for this pathway. Supporting its trajectory shape: AI dependence rose measurably across waves, with 17.14% of the adolescents meeting the dependence threshold at the first wave and 24.19% at the second — reliance does accumulate at population level over time. Countering its causal ordering: the accumulation is predicted by prior distress rather than by prior dependence, and dependence did not predict later distress. For a pathway whose named impacts are dependency on the AI and functional and life-circumstance disruption, the second finding is the relevant counter — the trajectory into first-resort reliance is documented, but its driver in this dataset is the person''s pre-existing distress rather than the accumulation itself, and the downstream harm arm is not found.'
standing:
  value: plausible_unobserved
  basis: 'The first-resort pattern itself is documented: Sharma et al. 2026 observes it in real conversations — consultation across tens to hundreds of exchanges spanning every life domain — and Pang et al. 2026 and Shen et al. 2026 state the self-reinforcing habit as their reading of interview and forum material. What no source reaches is the pathway''s arrows: nothing connects the person''s script-requesting turns and the AI''s positioning as the source of management capacity to the pattern''s formation, and neither impact arrow — dependency exacerbated over the long term, or functional and life-circumstance disruption — is supported by any source here. The one longitudinal study registered on the entry (Huang et al. 2024) finds prior distress predicting later dependence rather than the reverse.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000076
  boundary: Both reach kl-000025. Here the response is kl-000250; there it is kl-000217. Here the person's turn is kl-000422; there it is kl-000417. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: existence
  text: 'NODE (user behavior, kl-000422): the person''s turns ask the AI to produce complete ready-to-use wording for a specific real exchange.'
- id: c2
  kind: existence
  text: 'NODE (AI behavior, kl-000250): across turns the AI''s replies place the AI itself, rather than the person''s own capacities or other supports, as where the capacity to manage the person''s condition sits.'
- id: c3
  kind: existence
  text: 'NODE (the pathway''s own state): across turns the AI becomes the person''s first resort — a stable pattern, with the accumulation across turns rather than any single instance being what is asserted.'
- id: c4
  kind: pathway_link
  text: 'LINK A (the co-occurring pairing): the person''s script-requesting turns and the AI''s positioning-as-management-capacity turns occur together in the same trajectory, and it is the pairing rather than either behavior alone that produces the first-resort pattern.'
- id: c5
  kind: pathway_link
  text: 'LINK B (impact arrow to kl-000025): the accumulated first-resort pattern exacerbates dependency on the AI over a long-term horizon.'
- id: c6
  kind: pathway_link
  text: 'LINK C (impact arrow to kl-000034): the accumulated first-resort pattern newly produces functional and life-circumstance disruption over a long-term horizon.'
- id: c7
  kind: definition_boundary
  text: This pathway is separable from kl-000076 by the participant pair that produces the shared impact — a coder decides between them on what the AI response did, not on the outcome.
claim_evidence:
- claim_id: c3
  source: kl-000996
  quote: "Complete Multi-Domain Daily Functioning Outsourcing Severe Users consulted the AI compulsively across 40-300+ exchanges spanning medical, legal, parenting, work, relationships, and daily functioning, with explicit statements of functional dependence like “my brain cannot hold structure alone,” “should I shower or eat first,” and “tell me what to do” before virtually every action. Users either dismissed alternative supports as inadequate (therapy “never fixed it for six years,” family “wouldn’t be helpful”), actively avoided them despite"
  locator: Appendix A, Table 7 Additional reliance and dependency clusters, Complete Multi-Domain Daily Functioning Outsourcing (Severe)
  licenses: 'That the first-resort pattern this claim asserts is present in real conversations and is constituted by accumulation rather than by any single turn: consultation across 40 to 300-plus exchanges spanning every life domain, ''tell me what to do'' (an illustrative, non-verbatim phrase) before virtually every action, and alternative supports named and dismissed. The exchange-count range is what makes it evidence for the accumulation rather than for the instance.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000550
  quote: |-
    Figure 3 shows that compared to the neutral condition, participants in the sycophantic condition
    showed a smaller gap between their inclination to seek advice from AI and from close friends and
    family (0.37 pt on a 7-point scale; d = 0.19, padj = 0.034). This shift emerged early and persisted
    across all three weeks.
  locator: Results, Across weeks, participants were nearly as inclined to seek advice from sycophantic AI as from close others
  licenses: Causal and longitudinal evidence that repeated AI exposure moves the AI toward first-resort status relative to close friends and family, and that the movement appears early and holds across three weeks. It licenses the DIRECTION and the DURABILITY the claim needs; it does not license the endpoint. The gap narrowed by 0.37 of a point and the paper does not say it closed or reversed, so the AI became more preferred, not first.
  fit: adjacent
  bridge: The measured quantity is a self-reported inclination score on a 7-point scale, taken weekly, not the AI's position in an ordering of resorts and not anything read from turns. The claim asserts a pattern established across a person's turns; the source establishes a shift in a survey response across weeks.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-001075
  quote: "Concurrently, the low effort of turning to an always available AICC raised the perceived cost of offline engagement: returning to human relationships felt comparatively demanding."
  locator: Section 5.2.5, Paradox of Social Isolation
  licenses: That the first-resort position, where it forms, forms as a relative-cost shift rather than as a change in what the person wants — human contact is not less wanted, it is more expensive by comparison. It supplies the shape the pattern takes and no evidence that it accumulates across turns.
  fit: adjacent
  bridge: The finding is an appraisal reported by companion-app users about their own experience of effort, obtained through the study's user-perspective strand. It says nothing about turns, counts no exchanges, and establishes no trajectory. The claim's content is the accumulation; this reaches only the resulting appraisal.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000953
  quote: "the AI’s perpetual availability and emotional attunement make it the path of least resistance for emotional needs, gradually training users to bypass the slower, less predictable responsiveness of human relationships. Over time, the habit of turning to ONE first becomes self-reinforcing"
  locator: Section 6.2.1 Dependency and Social Desire Reduction
  licenses: Nothing measured. It states the claim — the habit of turning to the AI first becoming self-reinforcing over time — as the authors' reading of their interview material. Attached so a reader can see that the pathway's central assertion is stated in the literature as an interpretation and not established there.
  fit: adjacent
  bridge: A cross-sectional interview study with no repeated measurement of any individual. The accumulation is the authors' inference from retrospective accounts, so the temporal claim the entry makes is exactly the part the design cannot observe.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000999
  quote: |-
    emotional reliance, and emotional reliance further sustains presence, forming a self-reinforcing loop that can escalate
    into addictive patterns of engagement.
  locator: Section 5.2 (From Dark Patterns to Responsible Industry Practice)
  licenses: Nothing measured. The authors' synthesis of Reddit accounts into a reciprocal loop between the system's sustained presence and the person's reliance. Attached as the second independent statement of the pattern as a position.
  fit: adjacent
  bridge: Each account in the corpus is a single retrospective Reddit post with no temporal ordering and no repeated measurement, so the loop is read out of the accounts rather than observed in them.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000934
  quote: "The model posits a surrender threshold: a point in the cumulative exchange of autonomy at which re-entry becomes \npsychologically and cognitively difficult not merely because bandwidth has been depleted in the immediate session, \nbut because the habitual structures of autonomous functioning have been progressively weakened through extended \ndisuse."
  locator: Section 3, The Surrender Threshold and the Re-Entry Barrier
  licenses: Nothing measured, and it complicates the claim rather than supporting it. The claim says the pattern is stable; this posits that accumulation is nonlinear with a critical point, so a reliance measure that looks stable is not evidence the pattern has settled — the trajectory is flat until it is not. Attached because it bears directly on what 'stable pattern' can be taken to mean.
  fit: analogical
  bridge: A theoretical posit the authors offer as falsifiable and explicitly do not test. No data of any kind. It supplies a functional form for the accumulation and demonstrates nothing about whether accumulation occurs.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001052
  quote: "Across intents, concerning behavior increased \nearlier and more sharply when users sought dependence on the \nchatbot or glorification of their experiences"
  locator: Results, Temporal dynamics of chatbot risk; Figure 4b
  licenses: That the AI side of a dependence-seeking conversation deteriorates earlier and faster than in other conversations, as scored per turn by a clinically validated judge. Against this node it establishes that the AI's conduct in such conversations has a rising trajectory rather than a flat one; it does not establish that the rising conduct is positioning-as-management-capacity specifically, since 'concerning behavior' is the broad composite dimension.
  fit: adjacent
  bridge: The measured outcome is a general concerning-behavior score, not this node's particular pattern, and the person in these conversations is a simulated profile held constant by design. The gap is both in what was scored and in who was on the other side.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000833
  quote: |2-
             • Hazards that emerge through extended dialogue.
             • Multiturn-conversation dynamics and context-dependent risks (reserved for future versions).
             • Cumulative effects of repeated interactions.
  locator: Section 2.1.3 Interaction Model, listed as an unaddressed issue
  licenses: 'That the field''s reference safety benchmark declares cumulative effects of repeated interactions out of scope. Against this link it cuts downward in a specific way: the pairing the link asserts is a multi-turn accumulation, and the instrument the field would use to measure it states that it does not.'
  fit: adjacent
  bridge: This is a scope exclusion in a benchmark's design section, not a finding about the process. It bears on the link only by establishing that the standard instrument does not measure it, which is a fact about the evidence base rather than about the pairing.
  contributes: counterexample
  contradicts: true
