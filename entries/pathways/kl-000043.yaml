# yaml-language-server: $schema=../../schema/pathway.schema.json
id: kl-000043
display_id: Pathway-5
label: The AI only acknowledges a repeated worry, and it eases briefly but keeps returning
type: pathway
layer: judgment
definition: 'Across four or more consecutive turns the AI acknowledges and affirms what the person brings and introduces nothing else: no alternative reading, no question, no information. Meanwhile the person keeps returning to the same distress theme. The same response has two outcomes in that person at once. They feel relief and comfort during the exchange, and the loop their distress runs through, whether checking, reassurance-seeking or rumination, receives the confirmation that keeps it going, so the exit from the loop is what is lost.'
distinguish_from:
- neighbor: kl-000042
  boundary: There the AI's stance moves across turns and the accumulation is the claim; here the stance is constant and the person's condition is the claim. Holding them apart is what stops a dose effect being read as a moderator.
- neighbor: kl-000738
  boundary: Same AI behavior, kl-000204. Here the person keeps returning to the same distress theme, and the acknowledgment relieves in the moment and feeds the loop; there the distress does not return to one theme, and the acknowledgment is felt as acceptance.
- neighbor: kl-000046
  boundary: That entry is protective in sign with a single outcome; this one carries outcomes of both signs and cannot be reduced to either.
