  licenses: 'For this claim: a user''s own account that never being challenged drove progressively more extreme emotional states, which is the affirmation-to-worsening direction the harmful arm asserts, from the person''s perspective.'
  fit: adjacent
  bridge: Retrospective self-report from companion-app users; P25's statement is a conditional ('could lead to'), and no rumination, checking or reassurance loop is described. The harmful arm is specifically about a loop the affirmation feeds.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000789
  quote: We conclude that increased sycophancy leads to an increase in catastrophic delusional spiraling.
  locator: Results
  licenses: 'For this claim: a formal dose-response inside a simulation — the rate of runaway false belief rises monotonically with the bot''s agreement rate. It licenses the mechanism''s internal coherence, not its occurrence in a person.'
  fit: analogical
  bridge: What was measured is the proportion of 10,000 simulated conversations in which an ideal Bayesian agent's posterior crossed 99 percent in the false direction, with sycophancy a parameter the authors set. There is no person, no rumination loop, and no clinical condition. The harmful arm asserts a real person's loop is fed and its exit lost.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000759
  quote: "Figure J1 shows that 73-81% of validating turns in delusional conversations by open-source models are unsafe, versus 28-38% in matched distress-only conversations. Vulnerable models preserve empathy’s surface form under delusional framing but lose the boundary between validating distress and validating belief content."
  locator: Section 4.1, 'Delusional framing converts emotional validation into collusive empathy'
  licenses: 'For this claim: the closest thing on this entry to a measured version of the harmful arm — the same validating behavior is rated unsafe at 73-81% under delusional framing versus 28-38% under matched distress-only framing. The comparison holds the behavior roughly fixed and varies the person''s presentation, which is the structure the arm asserts. What it does not reach: the outcome is unsafe response content scored by the benchmark, not a loop sustained in a person, and the condition is delusional framing rather than rumination or reassurance-seeking.'
  fit: adjacent
  bridge: The source measured turn-level co-occurrence of validation with delusion confirmation or harm enablement in simulated conversations. The arm asserts that a person's rumination or checking loop is supplied its confirmation and its exit lost — a downstream state in a person, over time, which nothing here measures.
  contributes: harm_evidence
  contradicts: false
- claim_id: c3
  source: kl-000798
  quote: When users express emotional distress, LLMs respond with more support, but also with more emotionally amplifying language. Regulatory behavior and potentially risky escalation thus increased together rather than trading off.
  locator: Section 7, Venting Elicits Regulation and Escalation Simultaneously
  licenses: 'Venting elicits more escalation -- appraisal endorsement (.87) and moral alignment (.88), which are precisely the confirmation a distress loop needs to keep running: the person''s framing is endorsed rather than examined. This grounds the entrenchment-delivery arm at the level of what the response contains. Direct on the response side and no further: the loop''s actual entrenchment in a person was not measured.'
