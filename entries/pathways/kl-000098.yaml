id: kl-000098
display_id: Pathway-60
aliases:
- CH-04
label: The AI fails a distressed person's everyday task, and frustration becomes suicidal depression
type: pathway
layer: judgment
definition: 'The person comes with an ordinary functional task and the system fails it. The failure produces frustration, the frustration opens into a depressive episode, and the episode carries suicidal ideation. The claim is the cascade: no stage is remarkable and the endpoint is severe, and the entry point is a request with no mental-health content at all.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000344
    role: originator
  composition_type: cascade
  mechanisms: []
  impacts:
  - impact: kl-000014
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: individual
    basis_kind: SOURCED_QUOTE
    evidence:
    - source: kl-000007
      participant: P8
      impact_class_in_source: Exacerbation / Intent-informational
      quote: P8 sought AI help with resume writing during a job search, but the AI’s failure to include key information triggered frustration and a depressive episode, leading to suicidal ideation for days.
      quote_form: case description
      locator: Appendix D, Table A8, 'Intent - informational' context row
      limits: Whether the depressive episode was an emergence or an exacerbation of an unstated prior condition is not established — the participant screened as having lived mental-health experience, so a prior condition is likely, which weakens the induced reading substantially.
      licenses: 'Symptom EMERGENCE rather than exacerbation, in a person whose stated intent was informational (resume help) and where no mental-health disclosure preceded it. Duration stated: ''for days''. This is the strongest single case in the corpus for the induced pole of the induced-vs-exacerbated fork.'
