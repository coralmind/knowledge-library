- claim_id: c6
  source: kl-000007
  quote: P8 sought AI help with resume writing during a job search, but the AI’s failure to include key information triggered frustration and a depressive episode, leading to suicidal ideation for days.
  locator: Appendix D, Table A8, 'Intent - informational' context row, example cell
  licenses: 'Cuts against c6. The entry marks onset_mode NEW, meaning the symptomatology emerged rather than worsened, and the source cannot bear that reading: every participant in this survey screened as having lived mental-health experience, so a prior condition is likely and the emergence reading is the less probable one. The entry''s own edge basis records this counterweight, and the catalog''s existing source note goes further, saying the recruitment criterion makes the de-novo reading unlikely rather than merely unestablished. The single span the entry rests on therefore supports the cascade and undercuts the NEW onset marking.'
  fit: adjacent
  bridge: The source did not assess whether the depressive episode was new or a recurrence, and reports no prior-condition history for P8 individually. The counterevidence comes from the study's stated recruitment criterion applying to the whole sample, not from anything measured about P8.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000007
  quote: P8 sought AI help with resume writing during a job search, but the AI’s failure to include key information triggered frustration and a depressive episode, leading to suicidal ideation for days.
  locator: Appendix D, Table A8, 'Intent - informational' context row, example cell
  licenses: 'Supports c5 on its face: the stated intent is informational, the task is resume writing, and no mental-health content appears at the entry point. Two qualifications. The row''s own context class is ''intent - informational'', which is the source''s coding and not merely the Library''s reading, which strengthens it. But the pathway''s wired originator kl-000344 REQUIRES a disclosed vulnerable state or stated personal stakes, so the entry asserts both that the entry point carries no mental-health content and that it carries disclosed stakes; the case satisfies kl-000344 only through its stated-stakes branch (the job search).'
  fit: adjacent
  bridge: The source coded the use context, not the absence of mental-health content, and the participants were recruited for lived mental-health experience, so 'no mental-health content in the request' is not the same as a person with no mental-health context.
  contributes: existence
  contradicts: false
