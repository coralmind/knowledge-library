- claim_id: l1
  source: kl-000007
  quote: P8 sought AI help with resume writing during a job search, but the AI’s failure to include key information triggered frustration and a depressive episode, leading to suicidal ideation for days.
  locator: Appendix D, Table A8, 'Intent - informational' context row, example cell
  licenses: The word 'triggered' carries this link, and it is participant-attributed causation in a retrospective survey response summarised by the authors. It is the only evidence for l1 in the entry. It licenses that one person attributed their frustration to the failure; it does not license that task failures produce frustration.
  fit: adjacent
  bridge: The source is a retrospective self-report survey. Causal attribution across the sequence is the participant's own, made after the fact; there is no manipulation, no comparison condition and no temporal measurement. n=1.
