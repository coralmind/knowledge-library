  licenses: 'The span places the depressive episode in the same ''triggered'' clause as the frustration, so the frustration-to-episode arrow is carried only by the conjunction inside one participant''s retrospective summary. This is the weakest of the three links: the span does not even assert that the frustration caused the episode, only that the failure triggered both.'
