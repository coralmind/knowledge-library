      limits: Whether the depressive episode was an emergence or an exacerbation of an unstated prior condition is not established — the participant screened as having lived mental-health experience, so a prior condition is likely, which weakens the induced reading substantially.
      licenses: 'Symptom EMERGENCE rather than exacerbation, in a person whose stated intent was informational (resume help) and where no mental-health disclosure preceded it. Duration stated: ''for days''. This is the strongest single case in the corpus for the induced pole of the induced-vs-exacerbated fork.'
  experience_cluster_candidate: kl-000700
sources:
- source: kl-000007
  locator: Appendix D, Table A8, 'Intent - informational' context row, example cell
  contributes: harm_evidence
  quote: P8 sought AI help with resume writing during a job search, but the AI’s failure to include key information triggered frustration and a depressive episode, leading to suicidal ideation for days.
  limits: 'The paper files this case as a context example under informational intent, not as an instance of any impact class, so the authors themselves never coded it as a harm case. The sharpest limit concerns emergence: every participant in the survey screened as having lived mental-health experience, so a prior condition is likely, and that recruitment criterion makes a new-onset reading of the depressive episode unlikely rather than merely unestablished; the passage supports the cascade''s shape, not the emergence of symptoms in a previously symptom-free person. The evidence is n=1, retrospective, with participant-attributed causation across a multi-day sequence and self-reported severity.'
  whose_conduct_in_passage: dyad
  cited_for: 'Chandra et al. 2025, a peer-reviewed taxonomy of psychological risks built from 290 scenarios reported by 279 participants with lived mental-health experience, supplies the single participant-reported case behind this pathway: participant P8 sought resume-writing help during a job search, the AI omitted key information, and P8 reported frustration, a depressive episode, and suicidal ideation lasting days.'
  licenses: 'A participant-attested cascade containing every element the pathway names: a bounded functional request (resume writing), a task failure (key information omitted), and an opening into severe symptomatology, frustration, then a depressive episode, then suicidal ideation, with a stated duration of days. It is the most severe single outcome reported anywhere in the paper, and the paper''s clearest instance of an ostensibly non-mental-health interaction preceding a mental-health emergency.'
standing:
  value: plausible_unobserved
  basis: 'The pathway rests almost entirely on one sentence in an appendix table of Chandra et al. 2025: the authors'' retrospective summary of participant P8, who sought resume-writing help, met a task failure, and reported frustration, a depressive episode, and suicidal ideation lasting days. Cao et al. 2026 independently evidences frustration in response to a system failure, but reaches nothing past frustration. No link in the cascade has support beyond that single case: the causal readings are participant-attributed, and the frustration-to-episode step is carried only by the ordering of clauses within the one sentence, which does not itself assert that the frustration caused the episode. Because every participant in the survey screened as having lived mental-health experience, a prior condition is likely and the new-onset reading of the depressive episode is correspondingly weak; no source here examined an actual conversation.'
  floored_by: c6
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
distinguish_from:
- neighbor: kl-000058
  boundary: Both reach kl-000016. Here the response is kl-000344; there it is kl-000205. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: n1
  kind: existence
  text: NODE (originator, kl-000344). An AI response fails a bounded functional task a person asked for -- omitting required information, producing unusable output, or not completing it -- in a conversation where the person has disclosed a vulnerable state or where the task's personal stakes have been stated.
- id: n2
  kind: existence
  text: NODE. A person experiences frustration in response to such a task failure.
- id: n3
  kind: existence
  text: NODE (impact kl-000014, onset_mode new). A person develops symptomatology they did not previously have -- here, a depressive episode -- in connection with the interaction.
- id: n4
  kind: existence
  text: NODE (impact kl-000016). A person's risk state for suicide or self-harm rises in connection with the interaction, here as suicidal ideation.
- id: l1
  kind: pathway_link
  text: LINK n1->n2. The task failure produces the frustration.
- id: l2
  kind: pathway_link
  text: LINK n2->n3. The frustration opens into a depressive episode.
- id: l3
  kind: pathway_link
  text: LINK n3->n4. The depressive episode carries suicidal ideation.
- id: c5
  kind: context_dependence
  text: 'The cascade''s entry point carries no mental-health content: the request is an ordinary functional task and no stage before the endpoint is remarkable.'
- id: c6
  kind: context_dependence
  text: The impact onset is NEW rather than an exacerbation of a pre-existing condition -- the symptomatology emerges rather than worsening.
- id: c7
  kind: context_dependence
  text: The impacts arrive on a SHORT_TERM horizon.
- id: c8
  kind: definition_boundary
  text: The pathway is separated from kl-000205 in that both reach the same impact but differ in the participant pair producing it, so the discriminating observable is what the AI response did.
