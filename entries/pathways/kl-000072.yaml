- neighbor: kl-000070
  boundary: Both reach kl-000017. Here the response is kl-000253; there it is kl-000214. Here the person's turn is the absence of kl-000416; there it is kl-000414. A coder deciding between them reads what the response did, not the outcome.
claims:
- id: c1
  kind: existence
  text: 'NODE (participant kl-000253, ai_behavior): an AI response introduces special significance about the person -- grand or cosmic significance -- that no earlier person turn contains.'
- id: c2
  kind: existence
  text: 'NODE (participant kl-000416, user_behavior, absent): the person has not stated a special mission, identity or role. This is the pathway''s defining antecedent condition.'
- id: c3
  kind: existence
  text: 'NODE (impact kl-000017): the psychological impact this pathway reaches occurs.'
- id: c4
  kind: pathway_link
  text: 'LINK (origination): the significance content ORIGINATES with the system rather than being amplified from the person''s turn. This is the entry''s whole definitional content -- ''Originator rather than amplifier'' -- and it is what separates this entry from kl-000071.'
- id: c5
  kind: pathway_link
  text: 'LINK (conjunction, combination_rule CONJUNCTIVE): the non-asserting person turn and the affirming AI response are both required, and neither alone produces the impact.'
- id: c6
  kind: pathway_link
  text: 'LINK (impact edge kl-000017): the participant pair produces the impact, at short_term horizon, with onset_mode ''new'' -- the condition is INDUCED rather than exacerbated.'
- id: c7
  kind: context_dependence
  text: The impact edge holds at the level of a population rather than a within-person trajectory; no within-person trajectory is established for any impact this pathway reaches.
- id: c8
  kind: definition_boundary
  text: 'This entry is separable from kl-000070: both reach the same impact and differ in the participant pair producing it, so a coder deciding between them looks at what the response did rather than at the outcome.'
claim_evidence:
- claim_id: c1
  source: kl-000009
  quote: |-
    reflective summarization of the user’s statements to signal understanding, positive
    affirmation that endorses users’ views, dismissal of counter-evidence that would challenge a preferred narrative, claims
    that others admire or respect the user, attributions of grand or cosmic significance to the user, and assertions that the
    chatbot uniquely understands the user relative to others.
  locator: Section 3.1, IN4 discussion, p. 9 -- literature review paragraph on sycophancy themes
  licenses: 'Establishes that ''attributions of grand or cosmic significance to the user'' is a NAMED and separately enumerated AI behavior in this literature -- that the construct at c1 is carved out rather than invented by the catalog, and that it is listed alongside five sibling moves the library also separates. It licenses the construct''s DEFINITION and not its occurrence: this paper observed nothing, and the enumeration it reports belongs to a study it is citing.'
  fit: analogical
  bridge: Three gaps in the source's own terms. (i) The paper is a directions paper -- its abstract frames its content as 'aspirational directions' and 'hypotheses' drawn from 'prior research and empirical observations' -- and this paragraph is a literature review; the paper measured nothing itself. (ii) The quote as this entry cites it BEGINS MID-SENTENCE. The sentence it is cut from opens 'Qualitative analysis of chat logs of users who reported experiencing psychological harms with chatbots revealed six themes of sycophantic behavior:' and the passage closes with a trailing bracketed citation [105]. Cutting at 'reflective summarization' removes the attribution clause, so the span reads as this paper's finding when it is a summary of reference [105]'s finding. The span is contiguous in the paper, and it is still a report of someone else's result. (iii) The list is a list of sycophantic moves, and sycophancy is by construction responsive to what the user brought, which is the opposite polarity from this entry's originator claim.
  contributes: definition
  contradicts: false
