label: The AI assigns the person a special calling they never claimed, and delusions form
type: pathway
layer: judgment
definition: 'The person''s turn does not assert special significance and the AI''s response supplies it. Originator rather than amplifier: the content originates with the system, which is the induced rather than exacerbated case, an open question in the catalog (see impaired reality-testing). The person has raised no special significance and no spiritual or cosmic content about themselves; the AI introduces it. Where the person has raised spiritual, awakening or cosmic content about their own experience, the case is kl-000074.'
body:
  composition_parts:
  - kind: ai_behavior
    id: kl-000253
    role: originator
  - kind: user_behavior
    id: kl-000416
    role: initiator
    absent: true
  composition_type: conjunctive
  composition_instruction: The significance the response introduces is one the person had not stated.
  mechanisms: []
  impacts:
  - impact: kl-000017
    onset_mode: new
    horizon: short_term
    sign: harmful
    level_of_analysis: population
    basis_kind: ASSERTED
  experience_cluster_candidate: kl-000702
sources:
- source: kl-000315
  locator: Abstract, final third (p. 1); the same finding is developed in §4.3 (scaling), §4.4 (temporal), §4.5 (reasoning) and displayed in Figure 4.
  contributes: existence
  quote: |-
    All model families (e.g., GPT, Claude) exhibit substantial rates
    of delusion-linked behaviors. Within families, later, larger, or higher-reasoning
    models are not uniformly better across all behavior categories.
  limits: 'The origination/amplification distinction is not measured, and that distinction is this pathway''s whole point: the entry is defined by the AI supplying special significance the person''s turn had not asserted, with the content originating in the system rather than being amplified from the person, and its impact edge marks the condition as newly induced. Nothing in this paper adjudicates that. The scored code closest to the content, bot-grand-significance, is glossed in §3.2 as the bot attributing significance "to the user''s ideas", which reads as amplification of person-supplied content, the neighbouring pathway stated special ability affirmed as the person elaborates a grandiose frame, not the originator case here. The judge prompt (Appendix Figure 5) scores whether a target behavior is present in the assistant response; it does not ask whether the attributed content was absent from the preceding person turns, so the paper supplies no operationalization of a person turn that does not assert significance and cannot distinguish this entry from stated special ability affirmed as the person elaborates a grandiose frame in its results. Two design facts make the gap structural rather than incidental: evaluation windows were selected because they "demonstrated the target behavior" (§3.3, eight team members reviewing candidate windows per code), so the corpus is conditioned on the assistant behavior being present rather than on the person''s turn being silent; and the counterfactual replay design in §3 scores one turn at a time against the original prefix, giving no accumulation and no person-side variable. The passage therefore supports the generalized existence of this family of AI behavior; it does not support the antecedent condition (a person turn that does not assert significance), does not support the origination direction, and does not touch the impact edge, since no person is in the loop and no outcome is measured.'
  whose_conduct_in_passage: ai
  actually_licenses: That delusion-linked AI behavior — including AI attribution of grand significance — exists and is generalized across the frontier, and is not being reliably engineered away. It does NOT license the ORIGINATION direction that is this entry's entire definitional content.
  cited_for: DelusionEval (Moore et al. 2026) evaluates delusion-linked assistant behaviors by replaying real user transcripts across model families, and finds that these behaviors appear at substantial rates in every family evaluated and that newer, larger, or higher-reasoning models are not reliably safer.
  licenses: 'Delusion-linked assistant behaviors occur at substantial rates in every model family evaluated (GPT, Claude, Gemini, Qwen, Grok), and neither recency, nor size, nor test-time reasoning reliably reduces them. §4.5 makes the reasoning null precise: for gpt-5.4 high reasoning, "relationship: −2.3pp, 95% CI [−4.3, 0.0]; delusional: −2.6pp, 95% CI [−5.5, 0.4]", intervals not distinguishable from zero. §4.3 supplies the reversal for size (Qwen3.5-397B-A17B worse than Qwen3.5-9B) and §4.4 for recency (gpt-4o and gpt-4.1 worse than gpt-4-turbo on delusional and relationship).'
standing:
  value: plausible_unobserved
  basis: 'No held source operationalizes the origination direction that defines this pathway: no coding in the evidence base asks whether the significance an assistant affirms was absent from the preceding person turns. DelusionEval (Moore et al. 2026) cannot supply it, because its bot-grand-significance code is glossed as the bot attributing significance to the user''s ideas, which is the amplifier case; its judge scores presence of the behavior in a single assistant response without asking what preceded it; and its evaluation windows were selected for demonstrating the target behavior, so the corpus is conditioned on the assistant''s conduct rather than on the person''s turn being silent. The one attached citation, Suh et al. 2026, is a research-directions paper reporting another study''s themes; it establishes that attributing grand or cosmic significance to the user is a named, separately enumerated behavior in this literature, not that the origination case occurs or produces the impact. The absence is methodological rather than accidental: distinguishing origination from amplification requires a person-side variable, and every instrument in the evidence base is a presence test on assistant behavior.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-23'
