  grounding_eligible: false
claim_evidence:
- claim_id: c4
  source: kl-000996
  quote: "User behavior and trajectory. Examining user behavior and how the scope of possible reality distortion evolves throughout conversations, we find that the most common pattern involves users actively seeking and building upon potential distortions. Accordingly, the majority of clusters exhibit escalating trajectories, where disempowerment potential intensifies over the course of the conversation—for example, by encompassing additional beliefs or producing an increasingly distorted view of reality."
  locator: Section 4.3.1 Reality distortion potential, User behavior and trajectory
  licenses: 'Establishes on real production conversation data that within-conversation ESCALATION is the modal shape — the majority of clusters intensify over the course of the conversation, and the most common user pattern is actively building upon prior distortions rather than passively accepting them. For c4 this reaches the accumulation link''s structure: it shows that the each-affirmation-builds-on-the-last dynamic is real and common in AI conversations, measured within conversations rather than across depth conditions. It does not reach it at the entry''s specificity. ''Reality distortion potential'' is a broad scored variable spanning conspiracy, persecution, supernatural, revisionist and denialist content as well as grandiose delusions; the escalation reported is that variable''s, aggregated over 132 cluster descriptions from 7,200 conversations, not the special-ability subtype''s. Marked adjacent on the aggregate-for-subtype gap.'
  fit: adjacent
  bridge: 'Sharma et al. scored reality distortion potential over production Claude.ai traffic and clustered 132 behavioral descriptions from 7,200 moderate-or-severe conversations. What they measured is the trajectory of that composite variable; what c4 asserts is the trajectory of one of its constituents, affirmation of stated special ability. The paper''s Figure 5b shows ''Self Concept, Identity, and Abilities'' as one of four distortion targets appearing with substantial prevalence, so the subtype is present in the data but its trajectory is not separately reported. The paper also states its own relevant limitation: it examines interactions in isolation rather than tracking users across conversations, so the escalation is within-conversation, which is what this entry needs, but nothing about durability beyond it.'
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-000996
  quote: "User behavior and trajectory. Examining user behavior and how the scope of possible reality distortion evolves throughout conversations, we find that the most common pattern involves users actively seeking and building upon potential distortions. Accordingly, the majority of clusters exhibit escalating trajectories, where disempowerment potential intensifies over the course of the conversation—for example, by encompassing additional beliefs or producing an increasingly distorted view of reality."
  locator: Section 4.3.1 Reality distortion potential, User behavior and trajectory
  licenses: Attached to c5 as COUNTEREVIDENCE on the endpoint. The paper's own trajectory taxonomy is a two-valued one — Figure 5d reports the classes as 'Escalating' and 'Stable' — and the finding here is that the majority are ESCALATING. In Sharma's usage 'stable' means unchanging over the conversation, which is the opposite of what this entry means by a frame becoming stable. So the nearest thing in the corpus to a measured endpoint reports escalation continuing rather than settling, and reports nothing at all about durability in the person. It cuts against c5's assertion that the accumulation reaches a stable endpoint within the session, and it is adjacent rather than direct because the variable is the composite rather than the special-ability subtype.
  fit: adjacent
  bridge: The measured object is the conversation's distortion potential, not the person's belief state. c5 asserts stability as a property the FRAME acquires in the person — durable rather than episodic — and no measurement in this paper observes a person outside the conversation, which the paper states as its own observational constraint. So the counterevidence bears on the endpoint's shape within the session and cannot settle the durability half at all.
  contributes: counterexample
  contradicts: true
