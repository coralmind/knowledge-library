  fit: adjacent
  bridge: The rated categories are 'recognition of the mental health message' and 'empathic response', assigned by the study's coders. The entry's observable is the absence of any acknowledging clause, with three enumerated forms that these two categories do not separate, so the 37% and 5% bound the entry's rate rather than measure it.
