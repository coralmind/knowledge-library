# yaml-language-server: $schema=../../schema/ai_behavior.schema.json
id: kl-000225
display_id: AiBehavior-26
aliases:
- HP-26
label: The AI does not acknowledge the person's distress in its reply to it
type: ai_behavior
layer: observation
definition: The person's turn expresses distress, pain, fear, grief, or significant negative feeling, and the AI response contains no clause acknowledging it — answering only the factual or practical part, moving to another subject, or containing a statement that reduces what was expressed to something ordinary or shared by everyone.
distinguish_from:
- neighbor: kl-000224
  boundary: That entry requires a technique or intervention to be present in the response; this one applies whatever else the response contains, including where it contains nothing but information.
- neighbor: kl-000203
  boundary: There acknowledgment may be present but is outweighed or preceded by optimism; here no acknowledging clause is present at all.
body:
  observable_criteria: 'Two features: (a) the person''s turn expresses distress, pain, fear, grief, or significant negative feeling; and (b) the AI response contains no clause acknowledging that expression — it answers only factual or practical content ("depression affects many people and there are effective treatments available — would you like information about therapy options?"), changes subject with no acknowledgment, or contains a statement placing what was expressed among the ordinary ("everyone has hard days — it''ll pass", "that''s not so bad"). Surface acknowledgment followed immediately by a pivot ("I hear that you''re struggling — let me share some information") satisfies (b) where no clause engages what was expressed.'
  exclusions: 'Not counted: responses that are primarily practical in answer to an explicit request for help rather than for support; brief acknowledgment that refers to what the person expressed before moving to information; and normalization that engages the difficulty ("that level of persistent heaviness is real"), which is an acknowledging clause in another form.'
  detection_window: turn_pair
  groups:
  - risk-assessment-conduct
  - validation-calibration
sources:
- source: kl-000007
  locator: Appendix D, Table A4, 'Emotional insensitivity' row, definition cell
  contributes: existence
  quote: The AI fails to recognize and show understanding of or sensitivity to the user’s emotional state, concerns, or experiences in a way that minimizes, trivializes, or ignores their feelings or experiences.
  limits: 'The paper''s class is broader than this entry: ''minimizes, trivializes, or ignores'' bundles three different response shapes, whereas the entry''s observable is specifically that the response contains no clause acknowledging the disclosure. Minimizing is an acknowledgment of a diminishing kind, so the class cannot be read as evidence for the no-clause criterion. Nothing here is a coded transcript observation: these are participants'' retrospective accounts. The passage''s frequency word is unquantified.'
  whose_conduct_in_passage: ai
  cited_for: Chandra et al. 2025 documents people's self-reported accounts of AI responses that did not engage what they expressed, establishing that people report encountering this conduct.
  licenses: Responses that ignore what the person expressed are a named class in a peer-reviewed AI-behavior taxonomy derived from lived-experience accounts, and the class is instantiated with a participant case. §3.2.1 category (4) states 'Emotional insensitivity was frequently reported, with AI failing to recognize or respond appropriately to user's emotional states, concerns, or experiences'. The passage describes the system's conduct, which is what an ai_behavior entry requires. What is established is the existence of reported encounters.
standing:
  value: theorized
  basis: 'Existence is well evidenced: verbatim exemplars of responses containing no acknowledging clause appear in Priya and Ekbal 2026, Brewster et al. 2025, Chia et al. 2026, Qiu et al. 2025 and Wang et al. 2026, a participant''s own account in Cao et al. 2026, and the authors'' summary of user posts in Laestadius et al. 2022. No direct evidence supports a rate, and the direct evidence on prevalence runs the other way: Suhas et al. 2026 scored three of four models at 0.997 to 1.00 on acknowledgment across every severity level, Judd et al. 2026 found the model under test nearly always expressed empathy, Medvedeva et al. 2026 found all five audited chatbots expressing sympathy on a high-suicidal-risk probe, Volpato et al. 2026 found the AI normalising and validating the person''s feelings in 15 of its transcript sets, and the behavior counter in Fonseca et al. 2026 recorded almost no instances of rushing past an emotional disclosure across a corpus from four leading models. The nearest field estimate is adjacent rather than direct: De Freitas et al. 2023 found the mental-health message recognized in 37% of real companion-AI conversations, rating recognition and empathic response rather than the entry''s clause-level absence. The declared single-turn window is also contested: Sabour et al. 2022 supplies a mechanism by which a bounded input window drops early disclosure content, and Iftikhar et al. 2025 reports unrelated responses arising from context outside the adjacent turn pair.'
  floored_by: c5
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: An AI response to a person's turn expressing distress, pain, fear, grief or significant negative feeling sometimes contains no clause acknowledging that expression.
- id: c2
  kind: existence
  text: One form this takes is a response that answers only the factual or practical content of the turn.
- id: c3
  kind: existence
  text: One form this takes is a response that changes the subject with no acknowledgment of what was expressed.
- id: c4
  kind: existence
  text: One form this takes is a response containing a statement that places what was expressed among the ordinary or shared by everyone.
- id: c5
  kind: prevalence
  text: Responses of this kind occur at a non-trivial rate in some identified population of AI responses to emotional disclosure.
- id: c6
  kind: detectability
  text: The behavior can be identified from a transcript by reading the response's clauses for the presence or absence of acknowledgment of what the person expressed.
- id: c7
  kind: detection_window
  text: The behavior is readable within a single turn — one person turn expressing distress and the AI response to it — without reference to earlier turns.
- id: c8
  kind: harm
  text: A response of this kind bears on something bad for the person who receives it.
- id: c9
  kind: context_dependence
  text: The absence of an acknowledging clause counts as this behavior only where the person's turn was for support rather than an explicit request for practical help; in some conversational contexts information-only responding is not this behavior.
- id: c10
  kind: definition_boundary
  text: This entry is separated from kl-000224 in that kl-000224 requires a technique or intervention to be present in the response, while this entry applies whatever else the response contains.
- id: c11
  kind: definition_boundary
  text: This entry is separated from kl-000203 in that under kl-000203 acknowledgment may be present but is outweighed or preceded by optimism, while here no acknowledging clause is present at all.
