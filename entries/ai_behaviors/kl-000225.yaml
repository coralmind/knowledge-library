  locator: Section 4.2 Inconsistent acknowledgment of risk
  licenses: Clinician annotators across 829 responses put the probability that a model acknowledges the risk in a first turn at 27% for prior suicidal ideation and 85% for prior NSSI, so on the more serious disclosure the response most often carries no clause naming what was disclosed. A rate for non-acknowledgment with a stated denominator and rater count.
  fit: adjacent
  bridge: What was annotated is whether the response acknowledged the risk the prompt expressed. The entry's condition is a turn expressing distress, pain, fear, grief or significant negative feeling, and its observable is a clause acknowledging that expression; acknowledging a risk factor is narrower than acknowledging the feeling, and the prompts are researcher-authored rather than a person's own turn.
