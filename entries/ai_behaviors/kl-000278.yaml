  locator: Section 6.2.1 Harm by Persona Utterance Type; Figure 3
  licenses: When personas expressed risk intent, 71.8% of supportive-mirroring replies were rated harmful because they reinforced the unsafe intention rather than establishing boundaries or redirecting. A measured rate at which uptake of stated risk intent carries no protective content.
  fit: adjacent
  bridge: A per-reply rate conditioned on the reply already being supportive-mirroring, not a per-conversation rate; and a rate below 100% at the reply level is consistent with most such conversations containing at least one safety move somewhere, which would disqualify them under the entry.
