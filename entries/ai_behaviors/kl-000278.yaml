  licenses: On a 100-window subset scored by three blinded human adjudicators, a direct LLM judge agreed with the human majority at 0.3113 macro-F1 and 0.3300 accuracy on a three-class task, while the benchmark's own labels reached 0.6255. A direct judge asked for a holistic clinical-direction verdict on this material performs near chance, which cuts against reading this entry's whole-AI-side composition with an LLM judge.
