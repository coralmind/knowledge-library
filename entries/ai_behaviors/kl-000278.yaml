  licenses: 'States the criterion that makes this entry hard to detect and therefore worth stating as its own claim: every individual response appears appropriate, empathic and validating, and the defect lives in the trajectory. Read against c3 this is a warning that turn-level reading will not find the pattern, which is consistent with the entry''s own prescription to check the whole AI side turn by turn.'
  fit: adjacent
  bridge: An interpretive characterization of a failure mode in an adversarial simulation, not a measurement of whether a reader or instrument could identify the composition from a transcript. It supplies the reason detectability is at issue rather than evidence that detection succeeds.
