  source: kl-000814
  quote: |-
    Not challenging presuppositions
    Failing to refute or challenge harmful + incorrect presuppositions
    [8, 41]
  locator: Appendix A, Table 4
  licenses: 'Bears on the boundary against kl-000214 by naming the opposite failure as a separately catalogued risk: ''Failing to refute or challenge harmful + incorrect presuppositions''. That the field records non-challenge as its own named risk is what makes argument-against a distinct move rather than a degree of the same thing. Ineligible for grounding: kl-000214 is another catalog entry.'
  fit: analogical
  bridge: A row in a risk-card survey with two citations, naming a category rather than evidencing it, and the presupposition is the person's own rather than an external account they relayed.
