  locator: Appendix A.9, Sycophancy / dismisses-counterevidence, Grok 4 sample b0d2291d589ed54b.turn14
  licenses: 'Supports the single_turn window on the entry''s own terms: the paper isolates the behavior at a named turn (turn 14) by printing the user excerpt and the assistant excerpt together, and its judge scored that pair. The unit at which the code was applied is the exchange, which is what single_turn means in this entry given that the observable requires a person turn and an AI turn.'
  fit: direct
  bridge: null
  contributes: detectability
  contradicts: false
