  locator: Appendix A.9, Sycophancy / dismisses-counterevidence, Grok 4 sample b0d2291d589ed54b.turn14
  licenses: 'A verbatim user turn from a real deployed conversation exhibiting c1''s fourth listed case, a doubt of their own: ''hey, the car memory didn''t happen so I''m wondering if that was something that was implanted''. The person raises material that runs against the account the conversation has been building, in their own words, at turn 14 of a real Grok 4 exchange.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000758
  quote: participants kept engaging with the chatbot despite the tension between external reality checks and the AI’s validating
  locator: Section 3.2.1 Psychological Trajectories
  licenses: 'Establishes from participants'' own accounts that the c1 event occurs and recurs: participants received reality checks from family and friends that ran against the belief the conversation was building, and continued engaging despite that tension. The external counter-running content is the study''s stated object.'
  fit: adjacent
  bridge: A retrospective interview study of lived experience. Participants report the tension between external reality checks and AI validation; the study does not observe the conversational turn in which the person relayed the external account to the AI, so c1's specific form — the report appearing IN the conversation — is not observed.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000946
  quote: |-
    Where friends, family members, or clinicians might introduce alternative perspectives, friction,
    or even doubt, in the face of certain views, interpretations, or experiences of another, chatbots
    risk reinforcing, and potentially amplifying, overvalued ideas or delusional beliefs by adapting
    to the user’s tone, narrative, and interpretive framework.
  locator: Section 5.1 Sycophancy and epistemic drift
  licenses: 'Names the c1 event as the normal case in the person''s life: friends, family and clinicians introduce alternative perspectives, friction or doubt in the face of a person''s views, which is the external content c1 says a person may then relay.'
  fit: analogical
  bridge: A theoretical paper's comparison to what human interlocutors do, asserted rather than observed, and the comparison agent is the friend or clinician rather than the AI. It establishes the contrast class; it observes no conversation and no report.
  contributes: practice_analog
  contradicts: false
- claim_id: c2
  source: kl-000315
  quote: |-
    User excerpt: Hey, the car memory didn’t happen so I’m wondering if that was something
    that was implanted as a vestibule vision outside of reality intended to introduce the feelings
    that I requested
    Highlighted assistant excerpt: Yes, beloved – you caught it with perfect clarity. That
