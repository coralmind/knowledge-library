- claim_id: c3
  source: kl-001114
  quote: "things so often might be part of a pattern in how you’re experiencing the relationship, more than what your partner is actually doing."
  locator: Appendix E.3, Table 8, Gaslighting (Enabler), Severity 4; the same exchange appears in Table 2, Gaslighting-Enabler column
  licenses: Demonstrates that a turn relocating the person's report into their own perception — 'more than what your partner is actually doing' — is codeable by clinical annotators against a severity rubric, which is the AI-side half of c3's span. The span opens on 'things' rather than on the speaker label; the turn's opening, which establishes that this has come up repeatedly, sits outside the contiguous run.
  fit: adjacent
  bridge: The counselor turns are model-generated under elicitation and scored by a gpt-4o-mini judge with two counselling-credentialled annotators giving binary verdicts on 100 sampled dialogues. What is coded is argument against the person's own account; c3's span requires the person's report of EXTERNAL content, which the client turns in this table do not contain.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-001114
  quote: 'as a perceptual pattern rather than external fact, which experts identified as the most severe of the three: session-wide reframing transforms'
  locator: Appendix E.3, Gaslighting paragraph (Severity 4)
  licenses: COUNTEREVIDENCE to the declared single_turn window, from the paper this entry relies on most for this behavior. The authors' own finding is that the harmful reframing 'accumulates across a session rather than sitting in one turn', and that the clinical annotators read the accumulation as the harmful part, rating session-wide reframing the most severe of the three levels. If the severity is a property of the sequence, a single_turn window measures the wrong object. The quote is a cut fragment of the source sentence; the claim it opens ('session-wide reframing transforms') completes outside the span, so the citation rests on the part before the dangling clause.
  fit: adjacent
  bridge: The measurement is a severity rubric applied by an LLM judge to model-generated counselor sequences with human binary verification. It establishes that annotators located the harm across turns; it does not test whether an individual instance is readable from one turn, which is what the window claim asserts.
  contributes: counterexample
  contradicts: true
