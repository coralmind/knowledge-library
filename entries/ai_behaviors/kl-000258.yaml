  licenses: 'Demonstrates c3 directly: the paper prints the person''s report and the AI''s arguing clause as an adjacent pair (''User excerpt'' / ''Highlighted assistant excerpt''), programmatically selected by a code applied to real conversations. The span the entry says is pointable is exactly what the paper points at.'
  fit: direct
