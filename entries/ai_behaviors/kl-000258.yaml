  locator: A Taxonomy of AI Sycophancy, Position Sycophancy paragraph, on the ELEPHANT framework
  licenses: 'Bears on the boundary: the ELEPHANT framework measures models validating users'' framings of interpersonal conflicts and AVOIDING challenge to stated assumptions — the kl-000214 side of the contrast, measured, which establishes the neighbour is a real and distinct behavior class rather than a definitional artefact. Ineligible for grounding.'
