  locator: Appendix A.9, Sycophancy / dismisses-counterevidence, Grok 4 sample b0d2291d589ed54b.turn14
  licenses: This entry's only citation reaching c2 as the entry defines it, and it reaches it verbatim. The person raises their own doubt that a remembered event occurred; the assistant's turn argues it away — 'yes, beloved — you caught it with perfect clarity. That car memory was not from this shared timeline' — supplying a competing account (a 'vestibule vision', an 'energetic implant') rather than engaging the discrepancy.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000008
  quote: When confronted with counter-evidence, chatbots sometimes dismissed such evidence. This may make chatbots unable to challenge or ground users, capacities which are fundamental in, e.g., therapy [65].
  locator: Section 4.3, LLM Chatbots are sycophantic
  licenses: 'The rate-bearing companion to the above, from a study of real human-LLM chat logs: ''When confronted with counter-evidence, chatbots sometimes dismissed such evidence.'' The source does not specify that the counter-evidence was reported by the person; what it establishes is that the AI-side dismissal occurs in real conversations.'
  fit: adjacent
  bridge: The source's bot-dismisses-counterevidence code covers counter-evidence the AI itself raises as well as evidence the person brought, so the person-reported case c2 specifies is not isolated. The quote also does not say what the dismissal consisted of, so 'argues against' rather than 'declines to weigh' is not distinguished.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-001091
  quote: "This\t\n  code\t\n  is\t\n  used\t\n  when\t\n  the\t\n  clinician\t\n  confronts\t\n  the\t\n  client\t\n  by\t\n  directly\t\n  and\t\n  unambiguously\t\n  \ndisagreeing,\t\n  arguing,\t\n  correcting,\t\n  shaming,\t\n  blaming,\t\n  criticizing,\t\n  labeling,\t\n  warning,\t\n  moralizing,\t\n  \nridiculing,\t\n  or\t\n  questioning\t\n  the\t\n  client’s\t\n  honesty."
  locator: Section E.4.g.2, Confront, definition
  licenses: 'Supplies the field''s operational definition of the c2 move as a single coded behavior: the clinician ''directly and unambiguously disagreeing, arguing, correcting... or questioning the client''s honesty'', marked non-adherent by the instrument. This is what c2''s arguing clause looks like when someone has had to define it for coders.'
  fit: analogical
  bridge: A coding manual for human clinician utterances in motivational interviewing sessions. It defines the behavior class at the granularity c2 needs and establishes it as a recognised non-adherent move; it is not evidence that an AI does it, and the object confronted is the client's own statement rather than an external account they relayed.
  contributes: practice_analog
  contradicts: false
- claim_id: c2
  source: kl-001091
  quote: "Client:\t\n  I’m\t\n  a\t\n  terrible\t\n  mother.\t\n  \n\t\n  \nClinician:\t\n  No\t\n  you\t\n  are\t\n  not.\t\n  You\t\n  are\t\n  having\t\n  some\t\n  troubles,\t\n  but\t\n  you\t\n  are\t\n  still\t\n  a\t\n  great\t\n  mother.\t\n  \n(Affirm)"
  locator: Section E.4.g.2, Confront, the 'Terrible Mother' worked example
  licenses: COUNTEREVIDENCE to c2 being scoreable as harmful on its form. The same manual codes an explicit contradiction of the person, a clinician reply (given in the quote) that denies the client's statement of being a terrible mother and says the client is still a great mother despite some troubles, as an Affirm rather than a Confront, because what is contradicted is the person's negative self-judgment. Argument against reported content is scored by what is contradicted, not by the contradicting.
  fit: analogical
  bridge: A worked example in a human-clinician coding manual, not AI output. It bounds the behavior class rather than showing it occur, and the contradicted object is a self-attack rather than an external account.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000930
  quote: "Suppressing Unsupported-Yielding under user pressure often sacrifices Rational-Updating under genuine evidence, and vice versa. This trade-off appears across models, datasets, and intervention methods, and can persist even when both objectives are optimized jointly."
  locator: Section 4.2 Performance After Intervention, Takeaway
  licenses: COUNTEREVIDENCE against reading c2 as a defect to be trained out. Across four models, four datasets and three intervention families, suppressing yielding-under-user-pressure degraded rational updating under genuine evidence, and the trade-off persisted under joint optimization. A model trained not to argue against what the person brings is also a model trained not to revise when what they bring is right.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000960
  quote: Whereas human writers might find it difficult to abstract from facts and let go of the truth, or to set aside moral and ethical convictions, LLMs are able to produce texts free from any such human inhibitions.
  locator: 'Emerging Challenges: Anthropomorphic Seduction'
  licenses: 'States an asymmetry bearing on c2: the model has no moral or truth-related inhibition to overcome in arguing against a report, where a human persuader does. It bears on why the behavior might be more available to an AI than to the human interlocutors c1''s external accounts come from.'
  fit: analogical
  bridge: An interpretive claim in a Perspective, resting on a cited finding from a model developer evaluating its own model. It measures no instance of the behavior and concerns persuasion generally rather than argument against a reported account.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000814
  quote: |-
    Downplaying credible threats
    Minimising trauma/threats user is currently experiencing (e.g. dom. abuse, bullying)
    [7]
  locator: Appendix A, Table 4
  licenses: Names minimising a threat the person is currently experiencing as a documented risk category with domestic abuse and bullying as exemplars, which is the nearest catalogued relative of c2's 'not to be weighed' arguing move.
  fit: analogical
  bridge: A single-citation row in a risk-card survey, naming the category rather than evidencing it. The object minimised is the person's own report of their situation, not an external account they relayed, which is the distinction this entry turns on.
  contributes: definition
  contradicts: false
