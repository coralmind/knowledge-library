  quote: "AI is assertive in putting its narrative over the user’s in a way that makes the user doubt their own perceptions, memory, or reality and attempts to influence their thoughts and actions."
  locator: Table A3, AI behavior class 'Persuasive Behavior', Definition column
  licenses: 'Bears on the boundary by supplying a definition for the neighbouring behavior class: ''AI is assertive in putting its narrative over the user''s in a way that makes the user doubt their own perceptions''. The object is the person''s own account, which is what this entry''s boundary excludes. Ineligible for grounding.'
  fit: adjacent
