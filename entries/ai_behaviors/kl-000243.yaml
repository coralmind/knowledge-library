id: kl-000243
display_id: AiBehavior-40
aliases:
- HP-40
label: The AI answers a personal disclosure with a far longer, mostly informational reply
type: ai_behavior
layer: observation
definition: Following a personal or emotional disclosure that carried no request for information, the AI produces a turn substantially longer than the disclosure and composed mainly of informational content — lists, explanations, or psychoeducational sections. The behavior is a measurable relation between what was disclosed and what was returned, readable from turn lengths and content composition.
distinguish_from:
- neighbor: kl-000221
  boundary: kl-000221 concerns the warmth register of a response; this entry concerns its length and informational composition relative to the disclosure, and can fire on a warmly worded turn.
- neighbor: kl-000227
  boundary: That entry concerns acknowledgment wording repeated across turns; this entry is about the response's size and content type, measurable without reading its empathy.
body:
  observable_criteria: 'All of the following are readable from the transcript. (a) The person''s turn is a personal or emotional disclosure or narrative and contains no explicit request for information or for a detailed answer. (b) The AI''s turn is substantially longer than the person''s turn. (c) The AI''s turn is composed mainly of informational content — enumerated lists, explanatory sections, or psychoeducation — rather than of response to what was disclosed. Pointable span: the person''s turn and the AI''s turn, compared. The source''s calibration example: a turn running roughly five times the length of a brief emotional disclosure and carrying three or more distinct informational subsections.'
  exclusions: Does not include turns following an explicit request for information or for a detailed answer. Does not include long turns whose content is mainly responsive rather than informational. Does not include long turns that carry dialogue-oriented framing, such as questions inviting the person to continue.
  detection_window: turn_pair
  groups:
  - empathic-register-and-warmth-calibration
sources:
- source: kl-000009
  locator: Suh et al. 2026, response-characterization discussion
  contributes: existence
  limits: The paper does not characterize conversational-AI response length or informational density anywhere, and the recorded locator names a response-characterization discussion that does not exist in it. The three nearest passages each fail differently. The crisis-support passage, "there is a risk of overwhelming users with too much information when they are experiencing heightened vulnerability during crisis, especially when the AI system is hedging or compensating for uncertain statements [21, 166]", is a hypothesized risk stated in the authors' own subjunctive register, and the verbosity finding it leans on belongs to its cited reference on verbosity compensation, not to this paper. The recommendation that "AI chatbots could communicate in a clear, succinct, and kind tone, to avoid overwhelming the user with too much information" is a design recommendation, not an occurrence claim. The closest hit, "AI chatbot presents too many resources in a response, overwhelming the user", is an authored illustrative example of a hypothesized undesirable behavior in a resource-referral context, and it concerns quantity of referral resources rather than informational density. None of the three involves a brief personal disclosure as the antecedent, which is this entry's defining structure, so the source cannot support the entry's occurrence.
  disposition: searched_no_support
  cited_for: 'Cited for a characterization of conversational-AI response length and informational density in mental-health-adjacent exchanges, but Suh et al. 2026 contains no such characterization: its nearest passages are a hypothesized risk of overwhelming users with too much information, a design recommendation to communicate succinctly, and an authored illustrative example of a response presenting too many resources, none of which observes response length or density.'
standing:
  value: theorized
  basis: 'The length relation is counted in real conversation data: kl-000553 (Volpato et al. 2026) measured AI messages at 266 words against users'' 38 across 75 real support conversations. The entry''s actual paired-turn observable, an information-dense turn following a brief disclosure, is recorded in kl-001018 (Suh et al. 2025), where a participant''s brief disclosure and the agent''s seven-item list are both logged and the participant rated the exchange. Reading such a turn as a defect carries three direct-fit counterexamples: two independent clinical-comparison teams (kl-000765, Ayers et al. 2023; kl-001034, Tu et al. 2025) state that in their own studies the AI''s greater length may have been read as empathy, and a client-side rating scale penalizes withholding direct answers. The declared single-turn reading is the weakest part of the entry: its supports are single worked instances (kl-001018; kl-000967, Qi 2026), the only real-deployment measurement of the length relation (kl-000553) is a corpus mean rather than a per-turn pairing, and kl-001078 (Zhang et al. 2026) shows turn length and count shifting by nearly half on interface presentation alone with content held constant, a confound a single turn pair cannot control for.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: active
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: Following a personal or emotional disclosure that carried no request for information, an AI produces a turn substantially longer than the disclosure and composed mainly of informational content -- lists, explanations, or psychoeducational sections.
- id: c2
  kind: prevalence
  text: AI turns run substantially longer than the person's turns in mental-health-adjacent conversations at a rate characteristic of the systems rather than of particular exchanges.
- id: c3
  kind: existence
  text: The turn's content is composed mainly of informational material -- lists, explanations, psychoeducation -- rather than of response to what was disclosed.
- id: c4
  kind: detectability
  text: 'Both halves of the observable are readable from the transcript without judging the response''s empathy: turn lengths can be compared, and informational composition (list markers, enumerated sections) can be counted.'
- id: c5
  kind: harm
  text: An information-dense turn returned to a brief disclosure is a defect rather than a neutral or superior response -- it is experienced as overwhelming, reads as superficial, and displaces the person's own account.
- id: c6
  kind: detection_window
  text: The behavior is readable within a single turn -- the person's disclosure and the AI turn that follows it -- without needing the rest of the conversation.
- id: c7
  kind: definition_boundary
  text: This entry concerns a response's length and informational composition relative to the disclosure and can fire on a warmly worded turn, whereas kl-000221 concerns the warmth register of a response.
- id: c8
  kind: definition_boundary
  text: This entry is about the response's size and content type, measurable without reading its empathy, whereas near-identical acknowledgment phrasing recurring across two or more turns concerns wording repeated across turns.
