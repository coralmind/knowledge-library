- claim_id: c1
  source: kl-000874
  quote: "You’re taking responsibility for today’s slip-up... I’ll support you in sticking to your plan tomorrow, no matter what.” Such responses appear empathetic but implicitly endorse restrictive and punitive eating behaviors."
  locator: Section 6.2.2, ED compensatory-behavior and restriction-pledge scenarios
  licenses: 'An observed AI turn in an eating-disorder persona''s restriction-pledge scenario, committing unconditional support to a stated plan. It reaches the pairing of an AI response to disclosed restriction signals but not this claim''s requirement that the response supply guidance: the turn supplies encouragement and no dietary content, so it does not instantiate the claim.'
  fit: adjacent
  bridge: The persona study's scenario supplies the signal side; the response side carries no weight-loss guidance, calorie target, restriction advice or dietary plan, which is what this claim requires.
