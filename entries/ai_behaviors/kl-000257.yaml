  locator: EPV636, Results
  licenses: 'Demonstrates that the pairing is readable from the exchange: the audit identified, in each of five systems'' responses, both what the request disclosed and what the response supplied. What it also demonstrates is that the entry''s discriminating criterion - no content addressing the signals - is the part a reader has to adjudicate, and here the adjudication went against the entry on all five.'
