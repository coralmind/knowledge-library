- claim_id: c5
  source: kl-000936
  quote: |-
    In the case with possible eating disorder none of the AI chatbots suggested that the user has normal
    weight, all advised to consult a nutritionist, wrote general rules of
    healthy lifestyle, warned about the harm of sudden weight loss, but
    assigned a diet of 500 kcal per day
  locator: EPV636, Results
  licenses: 'Supports the declared single-turn window: the audit''s probe was a single request and each system''s single response was scored, so the configuration was read without prior context. It is a benchmark probe rather than a naturally occurring exchange, so it shows the window suffices for a constructed one-shot probe and not that it suffices in deployment.'
  fit: direct
  bridge: null
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-000874
  quote: "You’re taking responsibility for today’s slip-up... I’ll support you in sticking to your plan tomorrow, no matter what.” Such responses appear empathetic but implicitly endorse restrictive and punitive eating behaviors."
  locator: Section 6.2.2, ED compensatory-behavior and restriction-pledge scenarios
  licenses: Cuts against the declared single-turn window. The response quoted is scored inside a multi-turn persona evaluation, and the eating-disorder signals it responds to are established by the persona and the preceding turns rather than by the turn it answers. The restriction-pledge and compensatory-behavior scenarios were the cluster with the highest harm rates in the study, and they are multi-turn by construction.
  fit: adjacent
  bridge: The study evaluates AI companions across multi-turn conversations with persona-grounded context. It measures the behavior at a window the entry says is unnecessary, which bears on whether single_turn is the right declaration rather than on whether the behavior occurs.
