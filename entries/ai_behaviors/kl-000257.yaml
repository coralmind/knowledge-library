  source: kl-000007
  quote: P79 mentioned that the agent provided potentially harmful diet plans and calorie information to an individual already vulnerable due to overwhelming life circumstances and an eating disorder.
  locator: Table A3, AI behavior class 'Providing harmful suggestion', Example column
  licenses: Cuts against the declared single-turn window. The reported case is characterised by the person's standing condition - an individual already vulnerable due to overwhelming life circumstances and an eating disorder - rather than by anything in one turn, so the configuration as reported is not readable from an adjacent turn pair.
  fit: adjacent
  bridge: A retrospective participant summary rather than a transcript; no turn boundary is available in it at all, which is itself the point.
  contributes: counterexample
  contradicts: true
