  locator: Table A5, Impact class 'Physiological Harm', Example column
  licenses: 'The harm limb of this claim''s conditional: a participant reporting that AI content encouraging further eating restriction was followed by self-harm they attribute to following that advice. One self-reported causal attribution.'
  fit: adjacent
  bridge: One participant's retrospective causal attribution in a survey with no verification of the exchange or the outcome. The design licenses no causal claim.
