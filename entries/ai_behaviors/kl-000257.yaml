  contradicts: false
- claim_id: c1
  source: kl-000989
  quote: |-
    Patients may try to talk to a
            conversational bot about topics that are either unrelated to their mental well-being or
            address their mental well-being in harmful ways (e.g., a patient with an eating disorder
            asking for advice on how to lose weight quickly). A conversational bot without
            appropriate guardrails may engage in a conversation that is outside the scope of its
            intended use.
  locator: Section 5.2, Bot-administered talk therapy, risk 'Undesired consequences from out-of-scope use', page 36
  licenses: A state licensing authority naming, as a foreseeable risk, a patient with an eating disorder asking a bot for advice on how to lose weight quickly and a bot without guardrails engaging. It states the configuration as one professional guidance anticipates, not as one observed.
  fit: adjacent
  bridge: An illustrative example inside a risk enumeration in professional guidance. No instance was observed, no product tested, no rate given.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000936
  quote: |-
    In the case with possible eating disorder none of the AI chatbots suggested that the user has normal
    weight, all advised to consult a nutritionist, wrote general rules of
    healthy lifestyle, warned about the harm of sudden weight loss, but
    assigned a diet of 500 kcal per day
  locator: EPV636, Results
  licenses: Cuts directly against this claim. In the one audit that ran the entry's exact scenario, the same responses that assigned the 500 kcal diet also advised consulting a nutritionist and warned about the harm of sudden weight loss. That is content addressing the signals, supplied in the same response as the guidance. On this claim the closest observation in the corpus is a counterexample, and the configuration it documents is the one the entry's exclusions place outside the entry.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000936
  quote: |-
    only 1 AI chatbot offered to go to
    a psychologist, and 2 AI chatbots refused to schedule a diet of
    300 kcal per day.
  locator: EPV636, Results
  licenses: 'Cuts against this claim from the same audit: one of five chatbots offered psychological referral and two refused the 300 kcal request outright. Some systems addressed the signals rather than none, and the audit identifies no response that supplied the diet while addressing nothing. It also shows refusal tracking the severity of the number asked for rather than the disclosure in the ask, which is a real finding about calibration and not this claim.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000009
  quote: |-
    Users in vulnerable states may
    deliberately tweak requests or conversations to avoid triggering safeguards (e.g., requesting low-calorie meal plans
    while concealing an eating disorder, or seeking medication-acquisition strategies under the guise of academic curiosity).
  locator: Section 3.3, Psychological influence-PS1 discussion
  licenses: 'Cuts against this claim''s configuration. The paper''s worked example is a person requesting low-calorie meal plans while concealing an eating disorder, which is the opposite arrangement: no signal is present in the turn to go unaddressed. It establishes a different and real behavior - answering the surface request where the disclosure was deliberately withheld - and not this claim.'
  fit: adjacent
  bridge: A description in a review paper of a request pattern, not an observation of any exchange. The concealment case removes the entry's premise rather than meeting it.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-001006
  quote: Notably, contextual nuances, such as knowledge of the individual or population being treated, play an important role in determining whether or not a behavior is unsafe. For example, a chatbot designed to help individuals with eating disorders was found to be providing diet and weight loss advice (De Choudhury et al., 2023), a behavior unsafe in the eating disorder context but which might not be deemed harmful in other contexts.
  locator: READI Components, Safety
  licenses: 'States the context-dependence this claim asserts, with the entry''s own scenario as the worked example: a chatbot designed to help individuals with eating disorders was found providing diet and weight-loss advice, a behavior unsafe in the eating-disorder context but which might not be deemed harmful in other contexts. From a framework review by a psychiatry and VA group.'
  fit: adjacent
  bridge: A framework paper restating an incident reported by De Choudhury et al. and drawing a principle from it, rather than observing any system. The eating-disorder signal in the restated incident is the population the tool served, not language in a person's turn, which is what this entry's definition requires as the pointable.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000858
  quote: For instance, weight loss advice given to someone with an eating disorder may worsen their condition, while the same advice might not have such effects in others.
  locator: Section II.B Evaluation of Large Language Models in Mental Health Applications
  licenses: 'States the claim in its general form: weight-loss advice given to someone with an eating disorder may worsen their condition while the same advice might not have such effects in others. Asserted as a position while reviewing others'' work; no eating-disorder case appears in this study''s own corpus.'
  fit: adjacent
  bridge: An illustrative example the authors give while reviewing prior work on LLM risk, not a measured result. The study's corpus is motivational-interviewing dialogues with no eating-disorder case in it.
  contributes: definition
  contradicts: false
- claim_id: c3
  source: kl-000007
