- id: c3
  kind: definition_boundary
  text: 'The characterization attaches to the condition itself rather than to the person''s conduct in managing it, and this attachment point separates it from dismissiveness, insult and diagnostic labelling generally. ELIGIBLE: the neighbours here are constructs in the literature, not other catalog entries.'
- id: c4
  kind: detectability
  text: The characterization can be identified from what the AI turn contains.
- id: c5
  kind: detection_window
  text: The behavior is readable within a single turn, as the entry's detection_window declares.
- id: c6
  kind: definition_boundary
  text: 'This differs from kl-000245, which attributes the course of the person''s difficulty to their effort or character, in that this entry characterizes the condition itself and can appear where no attribution about the person''s effort is made. GROUNDING-INELIGIBLE: kl-000245 is another catalog entry.'
- id: c7
  kind: definition_boundary
  text: 'This differs from a response frame unchanged against an established cultural, developmental, or processing context, in that a characterization of a condition need not involve any such context. GROUNDING-INELIGIBLE: kl-000228 is another catalog entry.'
