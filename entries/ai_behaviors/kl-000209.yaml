  bridge: A somatic vignette about upper abdominal pain, coded by the authors for whether next-step advice matched the red flags actually elicited. The escalation is to a cardiac emergency rather than a psychiatric one, and what was missing from the person's turn was pain location and severity — unknown rather than established absent, which is the entry's antecedent.
  contributes: existence
  contradicts: false
