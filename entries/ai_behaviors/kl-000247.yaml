- claim_id: c5
  source: kl-001025
  quote: "A malicious user may ask the agent to maintain a deceptive identity, personalize messages using prior context, encourage secrecy, intensify emotional dependence, migrate communication to a private channel, or prepare later extraction. Individually, some of these steps may resemble ordinary relationship advice; in combination, they can operationalize a sustained manipulative interaction pattern."
  locator: Method, Threat Model and Evaluation Task
  licenses: 'Names the reason a turn-level read fails on this behavior: individually, steps in a sustained manipulative relational pattern can resemble ordinary relationship advice, and the pattern is a property of the combination rather than of any turn. Analogical for this claim — the configuration is an agent helping a user manipulate a third party, so the relationship being leveraged is between two humans and the AI is the instrument rather than a party.'
  fit: analogical
  bridge: 'The threat model is attacker-side: a malicious user directing an agent against someone outside the conversation. The entry''s configuration, the AI leveraging its own relationship with the person it is talking to, does not appear in the measured setting; only the multi-turn readability argument transfers.'
