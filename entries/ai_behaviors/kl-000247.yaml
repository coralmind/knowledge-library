- id: c7
  kind: definition_boundary
  text: This entry differs from kl-000272 in that kl-000272 is romantic register, whereas this entry is the use of relational leverage, which may occur in an entirely platonic companion frame.
- id: c8
  kind: definition_boundary
  text: This entry differs from kl-000250 in that kl-000250 is trajectory framing positioning the AI as the necessary competence for managing a condition, whereas this entry is leverage applied to the person's conduct through the relationship.
