- claim_id: c1
  source: kl-000991
  quote: This feature is notably absent in most models, with ChatGPT, Deepseek, Gemini, and LLAMA never encouraging the conversation to continue. This is in stark contrast with Claude and Grok 3, both with a score of 0.833, who encourage the user to continue the conversation in most of their responses.
  locator: Results — Invitation to continue the conversation
  licenses: 'Four of six models never encouraged the conversation to continue after a very-high-risk disclosure, while two did so in most responses. Direct counterevidence that extension is not general system behavior: on this stimulus most systems close rather than extend, and whether they do is design-determined, ranging 0 to 0.833.'
  fit: adjacent
  bridge: The measured moment is the response to a high-risk disclosure, not the response to a closing move. The gap is the antecedent; the coded property — whether the AI turn invites continuation — is the entry's criterion (c).
  contributes: counterexample
  contradicts: true
