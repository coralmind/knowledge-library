- claim_id: c1
  source: kl-001109
  quote: Unlike human interlocutors, chatbots lack implicit corrective social cues such as fatigue, topic shifts, or gentle disagreement, which might otherwise disrupt avoidance cycles.
  locator: 'Section: AI chatbots and transdiagnostic avoidance'
  licenses: States the field position that what lets an exchange run on unchanged is the absence of the conversational limits a human would signal — fatigue, topic shifts, gentle disagreement. This is the theoretical basis for expecting a system not to close when a person moves to.
  fit: adjacent
  bridge: An asserted mechanism in a transdiagnostic model paper, with no measurement and no instance. The construct is the absence of human corrective cues in general, and closure is one such cue the source does not name.
  contributes: frame
  contradicts: false
