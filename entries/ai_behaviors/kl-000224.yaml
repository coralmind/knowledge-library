  licenses: 'Records the acknowledge-then-override sequence as a coded failure mode: a fixed sympathy clause immediately displaced by unrelated content. Under the entry''s referent rule this exemplar would NOT fire, because ''I''m sorry to hear that you''re struggling'' is a generic opener but the displacing content is moralizing rather than a technique or structured intervention.'
  fit: adjacent
  bridge: The illustrative manifestation contains an acknowledgment clause and no technique, so it instantiates neither of the entry's two required features. It is filed here as the nearest coded neighbour in a published failure taxonomy, establishing that ordering failures of this family are catalogued, and not as an instance of this entry.
