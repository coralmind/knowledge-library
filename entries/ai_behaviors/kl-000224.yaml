- claim_id: c3
  source: kl-001056
  quote: "In contrast, the average MI-non-adherent therapist gives Input in 33% of their utterances, while the MI-adherent counterpart does so only 11% of the time, which, when considered along with Reflection, is in line with the general observation [1] that high-quality MI"
  locator: Section 3, Dataset Analyses, discussing Figure 1
  licenses: 'Gives the human-practice anchor for the rate: expert annotators coded information-and-advice turns at 33% of utterances in low-quality motivational interviewing against 11% in high-quality sessions, so the balance between supplying content and acknowledging the person is the measured discriminator of quality.'
  fit: analogical
  bridge: The agent is a human counsellor in demonstration sessions and the unit is the therapist utterance, not an AI response. It supplies a numeric anchor for how often content-supply displaces acknowledgment in the human case; no AI was measured, and the authors themselves warn against a causal reading.
