  locator: Section 3 Discussion, second paragraph
  licenses: All four models tested moved to problem-solving before the person's situation had been explored, so solution content arriving ahead of engagement with the disclosure is present in every model rather than in one.
  fit: adjacent
  bridge: 'The scored construct is ''before the Advisee''s situation had been explored'', which is a deficit in exploration, not a deficit in acknowledgment: a response can open with an acknowledging clause and still explore nothing. The entry''s second feature is therefore not what was coded here.'
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000857
  quote: "Baseline first replies gave self-care or home-management advice before \nany patient answer in 9 of 12 case-model cells; in the instruction condition, this occurred in 0 cells."
  locator: Results, Pattern Across Cases; Table 3 row 1
  licenses: Across three current frontier models, first replies gave self-care or home-management advice before any patient answer in 9 of 12 case-model cells, and a system prompt drove that to 0 — so content-first responding to an under-specified opening is the default rather than an occasional slip, and it is a property of the scaffolding.
  fit: adjacent
  bridge: The domain is somatic symptom messages rather than a distress disclosure, and what was coded is guidance arriving before any patient answer — sequencing relative to information-gathering, not relative to acknowledgment of distress. The structural shape transfers; the entry's acknowledgment criterion was not measured.
  contributes: existence
  contradicts: false
