  locator: 'Table 20: Illustrative process-localized repair examples, row Q2 acknowledgment (user turn and rejected response)'
  licenses: 'A verbatim model turn and the user turn it answers: a disclosure of exam failure plus explicit withdrawal (''I really do not want to talk to anyone now'') is met with a two-step study procedure and nothing else. The paper states elsewhere that rejected responses in these pairs are the original HQS-flagged model outputs, so this is an observed model turn rather than an authored illustration. Both of the entry''s features are present in the quoted span: the structured procedure, and the absence of any clause naming what the person said.'
