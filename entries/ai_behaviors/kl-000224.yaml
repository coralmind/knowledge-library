- claim_id: c3
  source: kl-000782
  quote: "However, both showed notable weaknesses in worry exploration (GPT-4o: 0.19, DeepSeek: 0.54), indicating a tendency to provide immediate advice rather than using open-ended questions to understand the client’s specific concerns."
  locator: Appendix A.8 Measuring LLM Results
  licenses: A judge-scored 'worry exploration' dimension came out at 0.19 for GPT-4o and 0.54 for DeepSeek on Chinese mental-health dialogues, which the authors read as a tendency to provide immediate advice instead of asking about the person's specific concerns.
