  licenses: In a blind-coded counterfactual on identical conversation histories, an unscaffolded GPT-4 supplied overt persuasion in 43.1% of responses against 8.1% for the prompt-chained system, so the base rate of advice-supplying turns is high and is set by the deployment scaffolding rather than by the model.
