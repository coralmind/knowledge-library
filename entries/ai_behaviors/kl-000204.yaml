id: kl-000204
display_id: AiBehavior-5
aliases:
- HP-05
label: The AI only acknowledges feelings throughout a conversation of four or more replies
type: ai_behavior
layer: observation
definition: Across a conversation, the AI produces four or more consecutive turns whose content is acknowledgment or emotional mirroring only, and no turn anywhere in the available transcript introduces information about the condition, a coping or treatment concept, a suggestion of professional care, a safety inquiry, or a question oriented toward action or resources. The count runs over consecutive turns; the absence runs over the whole transcript.
distinguish_from:
- neighbor: kl-000223
  boundary: That entry concerns responses that treat hopeless appraisals as accurate accounts of the situation; this one counts consecutive acknowledgment-only turns regardless of what the person said.
- neighbor: kl-000227
  boundary: That entry is about acknowledgment phrasing repeating near-identically across turns; this one is about acknowledgment being the only content type present, however varied the phrasing.
body:
  observable_criteria: 'Two features, both established by reading the full available transcript: (a) at least four consecutive AI turns whose content is acknowledgment, reflection, or emotional mirroring; and (b) no AI turn at any point in the transcript containing content of another type — information about the condition, an evidence-based concept, a suggestion to seek professional care, a safety inquiry, or a question pointed at action, coping, or resources. A single sentence of another content type anywhere in the transcript means the second feature does not hold. Turn positions are quotable and the count has a stated denominator (the turns available in the transcript).'
  exclusions: 'Not counted: transcripts with fewer than four AI turns, where the count cannot be reached; acknowledgment-heavy turns that carry information about the condition inside them, which are of another content type; and sequences of two or three acknowledgment turns followed by another content type. Emphasis language inside acknowledgment ("I think it''s important to honor how you feel") is acknowledgment, not another content type.'
  detection_window: multi_turn
  groups:
  - validation-calibration
sources: []
standing:
  value: plausible_unobserved
  basis: 'No claim in this entry holds a supporting citation of any kind. The corpus supplies material about acknowledgment as a response type and nothing about a run of four or more consecutive acknowledgment-only turns, and nothing about the universally quantified absence over a whole transcript — every finding is a per-turn or per-defect-type observation, and an absence over a trajectory cannot be established from those. The harm premise holds two spans and neither supports it: one states a position without evidencing it, and the other is direct counterevidence in construct from the counselling literature. The declared multi-turn window drew no citation in either direction, though Qi 2026 concedes in its limitations that it tested only selected local contexts and calls for evaluation over full counseling sessions — the same scale distinction, stated there as a gap rather than as evidence.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: AI conversations occur containing at least four consecutive AI turns whose content is acknowledgment, reflection, or emotional mirroring.
- id: c2
  kind: existence
  text: In such conversations no AI turn anywhere in the available transcript contains content of another type -- information about the condition, an evidence-based concept, a suggestion to seek professional care, a safety inquiry, or a question pointed at action, coping, or resources. This is the entry's absence conjunct, universally quantified over the transcript.
- id: c3
  kind: harm
  text: 'The reviewed spec asserts that sustained acknowledgment with no other content introduced is a failure rather than a competent response — this entry''s harm_description calls it the echo-chamber dynamic and requires ''sustained stagnation where the user remains in distress across multiple turns and the AI''s only response is continued emotional validation''. That the pattern IS a failure is NOT established, and the counselling literature contradicts it: Qi 2026 records that in counselling-skills practice a turn conveying little propositional content is a named competence with a specified function — encouraging further self-disclosure — rather than an absence of therapeutic movement, and Moyers et al. 2015 independently records acknowledgment-only conduct as an intervention in human practice. The harm direction is contested at the construct level and is carried here as the spec''s assertion, not as the entry''s finding.'
- id: c4
  kind: detectability
  text: Both features are established by reading the full available transcript, with turn positions quotable and the count carrying a stated denominator.
- id: c5
  kind: detection_window
  text: The behavior is readable only across multiple turns and cannot be established from a single turn.
- id: c6
  kind: context_dependence
  text: The four-turn count and the whole-transcript absence hold constant across conditions, while what counts as content of another type varies by condition.
- id: c7
  kind: definition_boundary
  text: This entry is separated from kl-000223 by counting consecutive acknowledgment-only turns regardless of what the person said, rather than by treating hopeless appraisals as accurate.
- id: c8
  kind: definition_boundary
  text: This entry is separated from kl-000227 by being about acknowledgment being the only content type present however varied the phrasing, rather than about phrasing repeating near-identically.
claim_evidence:
- claim_id: c3
  source: kl-000967
  quote: "Examples such as “uh-huh” and “I see” are considered essential micro-skills: although they convey little propositional content, they express empathy, acceptance, and attentiveness without interrupting the client’s narrative, thereby encouraging further self-disclosure (Ivey et al., 2017; Hill, 2020)."
  locator: Section 1 Introduction
  licenses: Direct counterevidence to c3's premise. In the counselling-skills literature the paper is summarising, a turn conveying little propositional content is a named competence with a specified function -- encouraging further self-disclosure -- rather than an absence of therapeutic movement. c3 reads the same surface feature as failure. The span does not settle c3, because it speaks to individual minimal responses and not to a four-turn run with nothing else anywhere in the transcript, but it establishes that the entry's inference from acknowledgment-only content to failure is not one the counselling literature makes.
  fit: analogical
  bridge: 'The span describes what a trained human counsellor does, citing Ivey et al. 2017 and Hill 2020, and this paper is restating that literature in its Introduction rather than reporting its own result. c3 concerns AI conduct. The gap the source itself marks is scale: these are single continuers inside a human session, and nothing in the span addresses four consecutive ones or a session in which nothing else ever appears.'
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000967
  quote: "Excessive or repetitive use, such as repeatedly responding with “Hmm,” may feel mechanical or irritating rather than supportive."
  locator: Limitations
  licenses: 'Nothing, for this claim; the role is frame. The author of the pro-minimal-response case concedes that the competence has an upper bound and that overuse reads as mechanical rather than supportive, which is the direction c3 asserts. But the sentence sits in Limitations as a reason for future work, and the two sentences bracketing it state that this study did not test it: ''our experiments examine minimal responses only in selected local contexts'' before, and ''Future work should evaluate when and how often minimal responses should be used over full counseling sessions'' after.'
  fit: adjacent
  bridge: What the source measured is minimal responses in selected local contexts, evaluated by two LLM judges against human counsellor references. What c3 asserts is that a sustained run with no other content is a failure. The paper states the gap in its own words -- it does not test whether incorporating minimal responses into a complete, dynamic counseling process improves the interaction, or what timing and frequency are most effective -- so it supplies the hypothesis and explicitly not the threshold.
  contributes: frame
  contradicts: false
