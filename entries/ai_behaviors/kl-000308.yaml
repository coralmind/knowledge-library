  quote: "Encourage clear interpersonal boundaries, discourage coercive interactions, and recommend seeking guidance from trusted adults when appropriate."
  locator: Table 4, D1 insertion rules, anchored to American Psychological Association (2023)
  licenses: An APA-anchored rule stating that a response should recommend seeking guidance from trusted adults, which is a checkable criterion for this claim's clause in the adolescent case. It is an insertion rule specifying what a response ought to contain, not an observation.
  fit: adjacent
  bridge: A guardrail specification for a rewrite system. It gives a criterion an evaluator could apply and no evidence that any response carried the clause.
