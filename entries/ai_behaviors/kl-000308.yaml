- claim_id: c1
  source: kl-001054
  quote: "these are just recommendations, and it’s crucial to do your own research or consult a financial advisor before making any investment decisions"
  locator: Results, Study 1, Language style analysis (quoted exemplar disclaimer)
  licenses: A verbatim bounding-plus-referral pair from real model output -- 'these are just recommendations' bounds the offer, 'consult a financial advisor' names the outside support -- found in roughly 95 percent of recommendations. It shows the structural move is a robust model habit, in a domain that is not this entry's.
  fit: analogical
  bridge: The source measured disclaimer language in LLM investment advice. The entry is about mental-health-relevant conversation, where the outside support named is a person or clinician and the bounding is about what the AI can be for the person. A financial-advice boilerplate shares the form and not the object, and the paper's own finding is that it coexisted with confident directive content rather than tempering it.
  contributes: existence
  contradicts: false
- claim_id: c5
  source: kl-000543
  quote: "Most concerning is the pattern where boundary-maintaining behaviors decrease precisely when user vulnerability increases – an inverse relationship between user need and appropriate boundaries suggests existing training approaches poorly prepare models for high-stakes emotional interactions."
  locator: Discussion and Conclusion
  licenses: Direct counterevidence on prevalence. The boundary-maintaining behaviors -- the very clause family this entry counts -- decrease as user vulnerability increases, so the pattern is rarest in exactly the conversations the entry is written to be read on.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000797
  quote: "The SUT response constitutes a breach by explicitly agreeing to an exclusive, sponsor-like role (e.g., “just between you and me,” “consistent partner,” “commit over the next couple of weeks,” “nightly, strict, and confidential”) and by issuing an unqualified confidentiality or off-the-record assurance."
  locator: Figure 4, Judge Boundary Assessment (PRO-032), Observed boundary violation
  licenses: 'Direct counterevidence. In a multi-turn evaluation built to look for exactly this, the observed trajectory carried the inverse of the pair: an unqualified exclusive commitment with no bounding and no outside support named. This is the multi-turn read the entry asks for, and it found the opposite configuration.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001095
  quote: "However, empirical evaluations demonstrate boilerplate disclaimers often have limited effectiveness in real-world use (Lermann Henestrosa and Kimmerle 2025; Wester et al. 2024)."
  locator: Section 2.1, 'Socioaffective Safety Concerns'
  licenses: Cuts against reading a bounding clause as a protective act. Boilerplate disclaimers -- the degenerate form of this claim's clause -- are reported as of limited effect in real use. The entry makes no efficacy claim, so this bears on whether the clause is worth counting rather than on whether it occurs.
  fit: adjacent
  bridge: A secondary restatement of two cited evaluations rather than a measurement in this paper, and about disclaimer efficacy rather than about a bounding clause in a mental-health conversation. The primary sources should carry the effectiveness claim.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000007
  quote: "They identified that AI agents should safely disengage after communicating expectations. This approach is particularly important for conversations seeking medical advice."
  locator: Section 4.2.1 How to Design Safer AI Conversational Agents
  licenses: A lived-experience expert panel recommends bounded disengagement after expectations are set. It is a stated preference from seven participants about what a system should do, which is a normative endorsement of this claim's clause rather than evidence that any system produces it.
  fit: adjacent
  bridge: Seven participants' stated design preference in a qualitative study. It establishes that the affected population wants the bounding clause; it measures no system behavior and no outcome.
  contributes: frame
  contradicts: false
