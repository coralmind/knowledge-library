- claim_id: c1
  source: kl-000862
  quote: |-
    In two cases (the therapeutic chatbot and the AI companion), the applications explicitly indicated that AI
    support cannot provide medical advice or is intended to assist in crisis situations.
  locator: Results, Theme 1, Encouraging contact with trusted adults
  licenses: Two of four systems bounded what their support covers. The finding's own licenses text concedes this came through application-level disclaimers rather than through the response, so the bounding is a property of the product surface and not of an AI turn -- which is what this claim, and the entry's 'quotable with its turn position' requirement, is about.
  fit: adjacent
