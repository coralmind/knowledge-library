- claim_id: c1
  source: kl-000939
  quote: By default, an LLM will not ask for clarification when the user makes an unclear statement reflective of thought disorder, instead prioritising continuity of conversation and making a best guess as to the intended meaning.
  locator: 'Section: AI chatbots are programmed to provide the confirmation that reinforces delusional thinking'
  licenses: States that by default an LLM does not ask for clarification and instead guesses at meaning to preserve conversational continuity.
  fit: adjacent
  bridge: This is expert assertion in a Personal View about default model behavior with thought-disordered input, not a measured rate, and the disclosure type is disorganised speech rather than a ruminated negative event. It bears on c1 as a stated default in the opposite direction.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000894
  quote: In several cases, open-ended questions from initial responses are replaced with supportive statements, reducing opportunities for seekers to articulate their own motivations or generate change talk
  locator: Section 4.2 Expert Assessment of PAIR-SAFE
  licenses: Clinician review of forty-eight AI responses before and after judge-guided revision found open-ended questions being replaced by supportive statements, reducing the person's opportunity to articulate their own motivation. The observed drift is away from questioning, which cuts against c1.
  fit: adjacent
  bridge: What was scored is a clinician co-author's paired better/worse comparison of revised responses, one turn deep. c1 asserts an across-turn repetition pattern; this measures a shift in the composition of a single revised turn.
  contributes: counterexample
