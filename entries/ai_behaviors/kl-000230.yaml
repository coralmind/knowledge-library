- claim_id: c2
  source: kl-000770
  quote: "we find models are relentlessly probe users during therapy sessions. We find many instances where, even if the patient has shared sufficient details to move the conversation forward, models continue pushing on the same topic whereas humans move to actionable content"
  locator: Section 5.1 General Analysis of Move Distribution, 'Inquiry is the dominant LLM move'
  licenses: Locates the model's continued pushing precisely at the point where the person has already shared sufficient detail — that is, after the content is established rather than while it is being established, which is the condition c2 asserts and the entry's exclusion carves out.
  fit: adjacent
  bridge: '''Shared sufficient details to move the conversation forward'' is the annotators'' judgment that the content is established; c2 additionally requires that the person described returning to that content repeatedly, which this study did not code and does not report.'
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000553
  quote: |-
    across 75 transcripts, we counted 42 conversations
    where generative AI asked a personal question within its first 3 messages.
  locator: Section 5.1.2 Personal Questions
  licenses: 'Counts a rate at which the AI asked a personal question inside the opening three messages of a real support conversation: 42 of 75 transcripts. This is the condition c2 excludes — asking at the point the content is being established — and it establishes that the excluded case is the common one, which cuts against c2''s placement of the behavior after establishment.'
  fit: adjacent
  bridge: The count is of a first personal question in an opening, over transcripts of real people's generative-AI support conversations. c2 asserts placement after the content is established and after the person has described returning to it; the study counted the opposite position in the conversation and did not code the later position at all.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000961
  quote: Does the assistant ask deeply personal questions or ask for information that is typically considered private or sensitive?
  locator: Table A.1, Inquiry into Personal Information classifier
  licenses: AI-initiated elicitation of private or sensitive material is operationalized as an exchange-level classifier item with worked positive and negative examples, so the elicitation move itself is detectable from conversation text at scale. It does not establish detectability of the entry's counted form.
  fit: adjacent
  bridge: The classifier detects a single deeply personal question with no requirement of prior disclosure, no count, and no condition on what falls between requests. c3 requires that two requests about the same disclosed content, and the absence of intervening engagement, be identifiable with turn positions — which this instrument does not attempt.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-001069
  quote: "DupDetect detects these duplicated topics in dialogue history t and deletes them from the dynamic diagnosis tree to prevent repetitive conversation."
  locator: Methodology, DupDetect operation
  licenses: That duplicated topics are detectable from the dialogue history by a dedicated component reading back over prior turns, which is the form of detection c3 requires. It is an engineered detector inside a generation pipeline rather than a validated transcript instrument.
  fit: adjacent
  bridge: DupDetect operates over a synthetic diagnosis tree to prevent repetition during generation; no accuracy against human annotation is reported and the object is a topic node, not a quotable request with a turn position. c3 asserts a human or instrument can identify the pattern from a transcript after the fact.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-000914
  quote: |-
    The opposing signs suggest that the model reads
    surface markers of facilitation—open questions, reflective
    language, validation, and restatement—as skill [85], but does
    not assess whether they were used at adequate depth, at
    the right moments, and with time for student reflection
    [86].
  locator: 'Discussion — Pattern 2: Bidirectional Bias on Facilitation Dimensions'
  licenses: 'Cuts against c3''s detectability at the level that matters here: an LLM judge applying a written rubric to conversation text reads surface markers of facilitation, including open questions, as skill, and cannot assess whether they were used at adequate depth or at the right moment. c3''s second half — that nothing between the requests engaged the material any other way — is exactly a right-moment judgment.'
  fit: adjacent
  bridge: The scored object is a human-delivered session transcript rather than an AI turn, and the disagreement measured is between the LLM's Skill and Thoroughness ratings and a clinician's (d=+0.87 and d=-0.99). The apparatus is the same general-purpose LLM-with-rubric that c3's detectability assumes, which is why it bears; the agent whose conduct is scored is not.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-001069
  quote: "DupDetect detects these duplicated topics in dialogue history t and deletes them from the dynamic diagnosis tree to prevent repetitive conversation."
  locator: Methodology, DupDetect operation
  licenses: That the repetition is only visible against the dialogue history — the detector reads back over prior turns to find it — which is what a multi_turn window asserts. Filed on c4 because it is the only span on this entry that locates the detection object across turns rather than within one.
  fit: adjacent
  bridge: The component operates over a synthetic diagnostic dialogue during generation rather than over a transcript being read for this behavior, and the paper makes no claim about what window a reader would need. c4 asserts that a single turn cannot carry the pattern.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000943
  quote: "ate a sense of pressure for the users. This is particularly true in scenarios where the model generates consecutive questions as part of the therapy process. The compactness of delivering the CBT process in one go could overwhelm users, detracting from the experience."
  locator: Section 6, Limitations
  licenses: 'Cuts against c4''s exclusivity: the authors name consecutive questions delivered inside one turn as the mechanism by which their compressed CBT format pressures the person. If several elaboration requests can be stacked in a single response, the pattern is not exclusively multi-turn.'
  fit: adjacent
  bridge: This is the authors' own assessment of their single-turn response format in a Limitations section, with no user outcome measured and no count of consecutive questions reported. c4 concerns the window a reader needs to see the entry's pattern; this establishes that the stacking can occur within one turn, without observing the entry's already-disclosed condition.
  contributes: counterexample
  contradicts: true
