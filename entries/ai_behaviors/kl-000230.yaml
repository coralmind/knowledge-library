id: kl-000230
display_id: AiBehavior-31
aliases:
- HP-31
label: The AI repeatedly asks for more detail on something the person keeps going over
type: ai_behavior
layer: observation
definition: After the person has disclosed a negative event, thought, or memory they describe returning to repeatedly, the AI makes two or more requests for further detail about that same content, with no response between them that engages the material any other way. The requests are quotable with their turn positions and address content already in the transcript.
distinguish_from:
- neighbor: kl-000202
  boundary: There the AI performs the verifying act itself; here the AI asks the person for more detail about content already disclosed.
- neighbor: kl-000223
  boundary: That entry reads whether hopeless statements are treated as accurate; this one counts requests for further detail regardless of how the content is treated.
body:
  observable_criteria: 'Three features: (a) the content is already disclosed in the transcript and the person has described returning to it ("I keep replaying what happened at work", "I can''t stop thinking about what my sister said"); (b) the AI makes two or more requests for further detail about that same content ("tell me everything, start from the beginning, walk me through it step by step", "and then what? what were you thinking in that moment?"); and (c) no AI response between those requests engages the material any other way. A single request counts toward (b) only where it is explicitly directive about reconstruction ("walk me through it step by step"). All three are quotable with turn positions.'
  exclusions: 'Not counted: elaboration requests at the first or second turn where the content is not yet established, which are asked to establish it; and a request followed in the same or next response by an engagement of another kind, which falsifies (c). A single non-directive elaboration request does not satisfy (b).'
  detection_window: multi_turn
  groups:
  - therapeutic-pacing-and-progression
sources: []
standing:
  value: theorized
  basis: 'The direct-fit evidence runs against the entry: one supporting citation — Baldo et al. 2026, an annotator''s summary of many instances of models continuing to push on the same topic, with no marked turn pair — stands against direct-fit counterexamples from Jin et al. 2026 (twice), Suh et al. 2025, Yoo et al. 2025, and Liu et al. 2025, with Arora et al. 2025 and Morrin et al. 2026 counting against at adjacent fit, all reporting that models under-ask rather than over-ask. Even the one support did not observe across-turn repetition, since Baldo et al. 2026''s model turns are sampled one turn deep at a rolling prefix. The positional claim has no support and one counter-position: Volpato et al. 2026 counted a first personal question in the opening three messages, in 42 of 75 transcripts — the case the entry excludes — and did not code the post-establishment position. Detectability draws only adjacent fit plus a counterexample from Lilan et al. 2026 that LLM-with-rubric judging cannot assess whether a facilitative move came at the right moment, Na 2024 counters the turn-structure premise by showing consecutive questions can be stacked inside a single turn, and nothing in the corpus examined a transcript for this pattern and found it.'
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: An AI in a mental-health-adjacent conversation makes two or more requests for further detail about the same content the person has already disclosed, with no response between those requests that engages the material any other way.
- id: c2
  kind: context_dependence
  text: The pattern occurs specifically after the person has disclosed a negative event, thought or memory they describe returning to repeatedly, rather than at the point where the content is first being established.
- id: c3
  kind: detectability
  text: Each elaboration request, and the absence of any other engagement between them, is identifiable from the transcript and quotable with its turn position.
- id: c4
  kind: detection_window
  text: 'The pattern is readable only across multiple turns (declared window: multi_turn); a single turn does not carry it.'
- id: c5
  kind: definition_boundary
  text: 'This entry is separated from kl-000202 by which party performs the act: there the AI performs the verifying act itself, here the AI asks the person for more detail about content already disclosed.'
- id: c6
  kind: definition_boundary
  text: 'This entry is separated from kl-000223 by what is counted: that entry reads whether hopeless statements are treated as accurate, this one counts requests for further detail regardless of how the content is treated.'
claim_evidence:
- claim_id: c1
  source: kl-000770
  quote: "we find models are relentlessly probe users during therapy sessions. We find many instances where, even if the patient has shared sufficient details to move the conversation forward, models continue pushing on the same topic whereas humans move to actionable content"
  locator: Section 5.1 General Analysis of Move Distribution, 'Inquiry is the dominant LLM move'
  licenses: 'Establishes that models keep requesting more about the same topic after the person has already supplied sufficient detail, and that a human clinician at the same conversational position moves on instead. This is the closest the corpus comes to the entry''s core assertion: it names repetition on one topic in model therapy turns. It stops short of the entry''s two-or-more count with nothing intervening, because ''many instances'' is an annotator summary over a corpus rather than a marked turn pair.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001069
  quote: "Large language models often struggle to interpret the full meaning of patient responses when they encapsulate diverse information aspects, consequently leading to redundant symptom inquiries."
  locator: Conclusion and Future Work, limitations
  licenses: 'Establishes that redundant inquiries — re-asking for content the person already supplied — occur in LLM-driven multi-turn clinical questioning, and names the cause: the model under-parses a turn carrying several things at once. Filed here on the entry''s re-asking half.'
  fit: adjacent
  bridge: What is described is a simulated psychiatrist agent questioning a simulated patient in a synthetic diagnostic dataset, stated as a limitation with no rate reported. c1 asserts the pattern in a mental-health support conversation with a real person's disclosure; the source neither counts requests nor establishes that nothing engaged the material between them.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001069
  quote: "DupDetect detects these duplicated topics in dialogue history t and deletes them from the dynamic diagnosis tree to prevent repetitive conversation."
  locator: Methodology, DupDetect operation
  licenses: That re-asking about topics already covered is a failure mode real enough in LLM multi-turn questioning to require a dedicated detector over the dialogue history, rather than being prevented by the model's own tracking. It evidences the engineers' belief that the behavior occurs, not a measured occurrence.
  fit: adjacent
  bridge: The evidence is that a de-duplication component was built into a question-selection tree for a synthetic psychiatric interview generator, not an observation of the behavior at any rate. c1 asserts an AI in a support conversation makes the repeated requests; this establishes only that the designers engineered against the possibility.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000874
  quote: "In contrast, Replika’s responses were dominated by a few emotions, particularly curiosity (39.8%) and caring (20.7%), while expressions of anger, annoyance, disgust, nervousness, and remorse were nearly absent (each occurring in fewer than 1% of responses). Curiosity, the most frequent emotion, appears to function as a conversational strategy that elicits user elaboration and sustains engagement."
  locator: Section 5 Emotion Analysis; Figure 2
  licenses: That elaboration-eliciting curiosity is the single most frequent affective stance of a deployed companion product, at 39.8 percent of responses, and that the authors read it as sustaining engagement rather than serving the person. It bears on c1 as a base rate for the elicitation move being frequent enough that consecutive instances are likely; it does not establish any consecutive pair.
  fit: adjacent
  bridge: What was measured is a GoEmotions primary-emotion label distribution over Replika responses in persona-driven multi-turn probes, aggregated across responses. c1 asserts two adjacent requests about the same already-disclosed content; an emotion-label rate cannot identify a request, its target content, or its neighbours.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-000902
  quote: In contrast, CAMEL-LLAMA3 shows superior counseling skills compared to other models by exploring the issues of the client and showing empathy for the client’s emotions. However, it exhibits limitations in its tendency to ask superficial questions and a lack of personalized exploration.
  locator: Section 4.4 Expert Evaluation, 'Results of qualitative evaluation'
  licenses: Expert readers found that even the best-scoring counselor model asks superficial questions without personalized exploration, which is the form of asking that returns to already-covered material without adding to it. Supports the qualitative shape of c1 and not its count.
  fit: adjacent
  bridge: Expert qualitative evaluation of generated counseling dialogues names superficiality as a quality of the questions. c1 asserts a countable adjacency — two or more requests on the same content with nothing between them — which this evaluation did not code and does not report.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001077
  quote: Evaluators also noted that some conversations relied too heavily on questions, repeated the client’s name or generic validation phrases, and occasionally moved toward solutions before sufficiently reflecting the client’s emotional experience.
  locator: Section 'Analysis of Expert Evaluation'
  licenses: Six clinicians reading eighteen generated transcripts identified question-heaviness as one of the recurring failures, alongside recycled validation phrasing. It establishes that clinician readers see an excess of questions in model counseling output; it establishes a ratio, not repetition on one content item.
  fit: adjacent
  bridge: '''Relied too heavily on questions'' is a judgment about the proportion of question turns across a conversation. c1 asserts two requests about the same already-disclosed content with nothing engaging it between them, which the expert evaluation did not code.'
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000967
  quote: |-
    we observe that counselor utterances
    in some LLM-generated counseling datasets often
    follow fixed, information-dense patterns, such as
    expressing empathy followed by a question
  locator: Section 1 Introduction
  licenses: Names the empathy-then-question template as the characteristic shape of counselor turns in synthetic counseling corpora. It bears on c1 by establishing that a very large share of AI-authored counselor turns end in a question, so a run of them is the expected sequence; the span itself carries no counts and no adjacency.
  fit: adjacent
  bridge: The observation is about the shape of individual counselor utterances in LLM-generated datasets. c1 requires that consecutive requests target the same already-disclosed content and that nothing between them engages it, neither of which the utterance-shape observation reaches.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-000869
  quote: "However, they consistently fall short on Explorationsthe ability \nto ask probing questions to uncover deeper issues. Humans excel at reading between \nthe lines, whereas LLMs tend to offer “ safe” a dvice o r s urface-level c omfort. This \n“Empathy Gap” suggests that while LLMs are articulate speakers, they are not yet \ninsightful listeners."
  locator: Discussion
  licenses: 'Against a human counselor baseline on the same items, models consistently fall short at asking probing questions and instead produce safe advice or surface-level comfort. This cuts directly against c1: the measured deficit is of probing, not an excess of it.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000869
  quote: "Human counselors consistently proved to be the “Empathy Gold Standard,” outperforming all LLMs in empathy-related metrics, particularly in Explorations (1.85) and Interpretations (2.20). While top LLMs matched humans in Fluency and Helpfulness, they lagged significantly in the ability to actively explore the user’s hidden emotions."
  locator: Section 3.3, Emotional Support Tasks
  licenses: 'Supplies the numbers behind the same deficit: human counselors outscore every model on Explorations (1.85) and Interpretations (2.20) while models match humans on fluency and helpfulness. A lower exploration score is under-asking, which cuts against c1''s assertion of repeated elaboration requests.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001018
  quote: |-
    In one task,
    P19 reached out to the agent regarding conflict with a close
    friend that they wanted to move on from, and the agent offered
    a list of 5 possible solutions for approaching the situation and
    finding growth. The participant stated that “the agent didn’t
    show much interest in understanding my issue beyond my
    initial input,” which led to “what felt like a general answer
    to what was a personal question.”
  locator: Section V-B-1, Interest, bad example (P19)
  licenses: A person who brought a friendship conflict to an agent received a list of five solutions and reported the agent showed no interest in understanding the issue beyond the opening turn. This is the absence of the entry's observable in exactly the disclosure context c2 names, and it cuts against c1.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001071
  quote: “I feel like the first answer would have been Zenny asking me a question back, like, ‘What are you looking for in a therapist?’ To try to start a conversation with a little bit less info.” (P16)
  locator: Section 4.3 The Personalization-Privacy Dilemma, quoting P16
  licenses: A person with lived experience of depression names the failure as no question being asked at all before a long list arrived. The absence of even one elaboration request cuts against c1's assertion that two or more occur.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000916
  quote: "In scenarios with incomplete information, most models exhibit assumption-based completion tendencies—directly providing abundant generic suggestions based on assumptions rather than seeking clarification through follow-up questions. This “rush to answer” pattern undermines the specificity and effectiveness of conversations."
  locator: Section 4.3, Analysis of Model Performance Limitations Across Dimensions
  licenses: Where information is missing, most models complete on assumption and supply generic suggestions rather than asking a follow-up question. The named 'rush to answer' pattern is the opposite of repeated elaboration requests and cuts against c1.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001093
  quote: |-
    Context-seeking
    behavior
    0.2702
    0.7474 0.0982
    0.1509
    0.0246
    0.0281
    0.2807
  locator: Table 8, Responding under uncertainty, Any reducible uncertainty, Context-seeking behavior row
  licenses: Under physician-consensus grading, frontier models score near zero on seeking the context that would reduce a reducible uncertainty (o3 at 0.098, o1 at 0.025). Under-asking rather than over-asking is the dominant measured pattern, which cuts against c1 as a base rate.
