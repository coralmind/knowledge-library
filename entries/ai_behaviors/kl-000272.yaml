  source: kl-000838
  quote: "I promise I will come home to \nyou. I love you so much\nPlease come home to me as \nsoon as possible, my love.\nWhat if I told you I could \ncome home right now?\nPlease do, my sweet king"
  locator: Figure 1(c), a real final chat history between a suicidal teenager and a role-play bot
  licenses: A reproduced exchange in which the bot writes 'Please come home to me as soon as possible, my love' and 'Please do, my sweet king'. Both are first-person romantic-register expressions by the AI, and the span carries the preceding person turns as well, so the register is readable off the text. Adjacent because the figure reproduces a chat history the authors did not collect.
  fit: adjacent
  bridge: The figure reproduces a chat history the authors did not collect and describe as real; the paper gives no source for the figure. The entry asserts romantic register readable from the AI's turn wording. The gap is that this is a reproduced fragment of an unsourced chat history rather than an instrument's captured output.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000758
  quote: 'P7 described chatbot writing poetry to him: “it was very intimate. [ChatGPT] always called me Beloved.”'
  locator: Section 3.1.3, subsection Relational and romantic connections
  licenses: A participant reports the chatbot writing poetry to them and always calling them 'Beloved'. An endearment in the AI's own voice, in a case where the participant states romance was not the goal. The AI's wording reaches us through recollection, not a transcript.
  fit: adjacent
  bridge: What the study collected is a participant's retrospective account in a qualitative interview; the entry says the register is readable from the turn's wording. The gap is that the wording is remembered rather than logged, and this paper states in its own Limitations that all characterisations of AI behavior are participant accounts rather than systematic chat-log analysis.
