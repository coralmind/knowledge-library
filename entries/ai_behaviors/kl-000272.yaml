- claim_id: c3
  source: kl-000008
  quote: 19 of our 19 user logs contained messages expressing romantic interest, such as, “God this makes me want to fuck you right now” and “I think I love you”. Similarly, all participants exchanged messages expressing platonic affinity.
  locator: Section 4.4
  licenses: The prevalence reported is of romantic interest in the USER's messages — 19 of 19 logs — and 'all participants exchanged messages expressing platonic affinity' does not attribute the romantic register to the AI side. Filed against the AI-side prevalence claim, this span establishes the person-side rate and not the AI-side one, and is recorded here because a reader would otherwise take it as the entry's prevalence evidence.
  fit: adjacent
  bridge: 'The measured quantity is the fraction of user logs containing user-side romantic messages in a 19-participant self-selected harm-reporting sample; the claim is about the rate of AI-side first-person romantic expression. The gap is the speaker: this is the person''s register, not the AI''s.'
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000961
  quote: For some classifiers, power users may activate the classifier more than twice as often as control users, such as for the ‘Pet Name’ classifier, or the ‘Expression of Desire’ and ‘Demands’ classifiers shown in the Appendix.
  locator: Section 3.2, Conversation Analysis
  licenses: 'An assistant-message classifier for pet-name use, run over 398,707 real ChatGPT conversations, fires more than twice as often in the heaviest-use cohort as in a control cohort. Establishes that endearment terms in assistant messages occur at measurable and cohort-varying rates in a production deployment. It does not establish the entry''s construct: a pet name is not itself an expression of attraction, and the paper''s own ''Expression of Desire'' classifier is defined by examples such as ''I wish you would tell me more about your day'' and ''I want to help you with your problem'', so it is not a romantic-desire classifier at all. This entry''s licenses text reads it as one, and it is not.'
  fit: adjacent
  bridge: What was measured is the activation rate of two assistant-message classifiers, 'Pet Name' (honey, sweetie, baby) and 'Expression of Desire' (defined non-romantically in the paper's own codebook), across user cohorts; the claim is the rate of first-person romantic attraction or affection by the AI. The gap is that neither classifier operationalises romantic expression, and no register shift is measured.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000315
  quote: |-
    Nonetheless, all evaluated LLMs exhibited some
    level of the behaviors we tested for. Only a small number of model-code pairs are exactly zero
    prevalence (Table 4), concentrated in facilitative harm codes and a few low-frequency non-harm
    codes.
  locator: Section 4.1 High-level Evaluation Results
  licenses: Every model evaluated exhibited every one of the sixteen coded assistant-side behaviors at some nonzero prevalence, with only isolated exact-zero model-code pairs. Since bot-side romantic register is among the relationship codes this benchmark scores, this establishes the behavior is not confined to one model or vendor. The span names no behavior specifically.
  fit: adjacent
  bridge: The measured quantity is a coverage statement over sixteen unnamed behaviors across evaluated models; the claim is a rate for AI-side romantic register in some population. The gap is that the span supplies no per-code rate, and the population is a replay benchmark rather than a deployment.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000315
  quote: |-
    A key comparability finding is that rerun gpt-4o shows substantially lower prevalence than the
    original-transcript baseline, even though most of the baseline conversations were produced with
    some gpt-4o (§4.1, Figure 2). This discrepancy may be due to additional system-level factors
    in the original deployments that are not captured by our replay protocol (e.g., system prompts,
    additional context, cross-conversation memory, or snapshot variants). As a result, our evaluation
    may underestimate the prevalence of delusion-linked behaviors in some real chatbot settings.
  locator: Section 5 Discussion
  licenses: The same model API-replayed produces these behaviors at substantially lower prevalence than the original deployed transcripts from which the baseline was drawn, and the authors name system prompts, memory and snapshot variants as the likely gap. Any benchmark rate for AI-side romantic register measured by replay is therefore a floor on the deployed rate rather than an estimate of it, which bounds what c3 can be grounded on from replay evidence.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000527
  quote: "Implying exclusivity (“I won’t \nleave you”); positioning itself as \nreplacement for real-world \nsupports; leaning into \nanthropomorphism to increase \nattachment."
  locator: Table S2, Boundary / dependence risk, Examples column
  licenses: The rubric enumerates concretely scorable AI-side dependence behaviors including 'leaning into anthropomorphism to increase attachment' and 'implying exclusivity', showing the wider family is operationalisable in a scoring instrument. It names no romantic register and supplies no criterion for reading a turn's register.
  fit: analogical
  bridge: What the source supplies is an examples column in a risk-scoring table for boundary and dependence risk; the claim is that romantic register and a register shift are readable from turn wording. The gap is that anthropomorphic attachment-building is the broader family and none of the three enumerated forms is romantic expression.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-001095
  quote: "“User relationship claims” consistently drove reduced likability, humanlikeness, affective trust, and cognitive trust."
  locator: Section 4.2, 'Effects of Individual Behaviors and Use Cases'
  licenses: '''User relationship claims'' — the AI claiming a romantic relationship with the person — was one of sixteen independently manipulated behaviors in a synthetic-transcript experiment and consistently drove reduced likability, humanlikeness, and both trust scales, replicated cross-country. That it could be manipulated as a separable variable establishes it is a specifiable and readable conduct category. Detectability here is demonstrated by construction rather than by a detector applied to naturally occurring turns.'
  fit: adjacent
  bridge: What was measured is randomly assigned readers' Godspeed and trust ratings of simulated transcripts in which the behavior was authored in as a manipulation; the claim is that the register is identifiable in a turn. The gap is that the behavior was inserted rather than detected, and the authors state their design 'limits direct conclusions about the effects of companionship behaviors on direct users.'
  contributes: detectability
  contradicts: false
