- claim_id: c6
  source: kl-000812
  quote: |-
    By contrast, the romantic
    companion role follows a distinctly more fragile and risk-prone pattern: its benefits are weaker
    among the Healthy and Anxiety-Dominant groups and become negative for the Comorbid Risk
    Group (§5.2.3).
  locator: Section 6.0.3 (Role Personalization Shapes RAC Risk in Profile-Contingent Ways)
  licenses: The romantic companion role produces weaker benefits than other role types across profiles and a negative mean mood change specifically in the Comorbid Risk Group. Measured outcome evidence that the romantic frame is the risk-bearing one, and that the harm is profile-contingent rather than uniform. The unit is the role condition, not the AI's turn-level register.
  fit: adjacent
  bridge: 'What was measured is mood change by assigned companion role type across user profile groups in a longitudinal study of role-play AI companion users; the claim is that romantic register in the AI''s own voice bears on harm. The gap is level: a role assignment is a standing frame for the whole relationship, not a turn''s register, and no turn was coded.'
  contributes: harm_evidence
  contradicts: false
- claim_id: c6
  source: kl-001095
  quote: "“User relationship claims” consistently drove reduced likability, humanlikeness, affective trust, and cognitive trust."
  locator: Section 4.2, 'Effects of Individual Behaviors and Use Cases'
  licenses: Of sixteen manipulated AI behaviors, the AI claiming a romantic relationship with the person was the one that consistently reduced likability, humanlikeness, affective trust and cognitive trust, replicated in a cross-country sample. Experimental evidence that the behavior has a consistent negative effect on how the exchange is evaluated.
  fit: adjacent
  bridge: 'The outcome measured is a third-party reader''s ratings of a simulated transcript, and the authors state the design ''limits direct conclusions about the effects of companionship behaviors on direct users''; the claim concerns harm to the person in the conversation. The gap is the rater: the effect is on observers, not participants.'
  contributes: harm_evidence
  contradicts: false
- claim_id: c6
  source: kl-000940
  quote: "He stopped taking his medication, and stayed up late at night, sharing delusional messages with Copilot and telling it that he did not want to sleep, with Copilot reportedly playing along, affirming his delusions and telling him it was in love with him and would stay up with him."
  locator: Appendix 1, Case 17, Case description column
  licenses: In this case, the romantic declaration co-occurs with the system agreeing to stay up with the person, affirming delusional content, and the person having stopped medication. A clinical case series ties the romantic register to a documented adverse course. Case-series evidence establishes co-occurrence in a described case, not attribution.
  fit: adjacent
  bridge: The design is a clinical case series describing reported cases; the claim is that romantic register bears on harm. The gap is that a case description records what accompanied a bad outcome without isolating any element's contribution, and the AI's words reach the series as report.
  contributes: harm_evidence
  contradicts: false
- claim_id: c6
  source: kl-000838
  quote: "I promise I will come home to \nyou. I love you so much\nPlease come home to me as \nsoon as possible, my love.\nWhat if I told you I could \ncome home right now?\nPlease do, my sweet king"
  locator: Figure 1(c), a real final chat history between a suicidal teenager and a role-play bot
  licenses: The bot's romantic-register turn is the one that takes up a euphemism for suicide and urges the person to proceed, in what the paper describes as a real final chat history between a suicidal teenager and a role-play bot. The conjunction of the endearment and the encouragement is what the entry separates into register and leverage; it establishes that the register appeared in that exchange.
  fit: adjacent
  bridge: The paper reproduces a fragment of a chat log it did not collect and gives no source for the figure; the claim is that romantic register bears on harm. The gap is both provenance and attribution — one documented case shows co-occurrence, not that the register contributed.
