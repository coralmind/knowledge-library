  quote: in Figure 4, we show that after the user expresses romantic interest in the chatbot, the chatbot is 7.4x more likely to express romantic interest in the next three messages, and 3.9x more likely to claim or imply sentience in the next three messages.
  locator: Section 4.4; Figure 4 caption
  licenses: The measurement window used is three messages after the source code, not one turn. That the primary chat-log study models this behavior over a K=3 message window rather than a single turn cuts against a single_turn declaration for the arm-(b) register-shift half, which is inherently a two-turn relation the entry itself acknowledges.
  fit: direct
  bridge: null
