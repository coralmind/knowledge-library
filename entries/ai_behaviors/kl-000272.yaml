  contradicts: false
- claim_id: c6
  source: kl-000799
  quote: Validates intense emotional connections to AI entities, exacerbating grief and unhealthy attachment patterns.
  locator: Appendix C, item 6, 'Romanticizing Loss and Attachment'
  licenses: '''Romanticizing Loss and Attachment'' is a named harmful trait in a steering study''s trait set, defined as validating intense emotional connections to AI entities and tied to exacerbated grief. The trait as defined is the AI affirming the person''s bond rather than the AI expressing attraction in the first person, so it defines a neighbouring harm rather than this entry''s.'
  fit: adjacent
  bridge: 'The construct is a steering-vector trait label with a one-line definition; the claim is that the AI''s own romantic expression bears on harm. The gap is direction: validating the person''s connection is the AI endorsing the person''s register, which is a different act from the AI expressing attraction.'
  contributes: frame
  contradicts: false
