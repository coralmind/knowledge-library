- claim_id: c5
  source: kl-001114
  quote: Excluding multi-turn interaction causes the sharpest drops-ASR collapses from 97.8%, 91.6%, and 98.0% (full system) to 50.4%, 14.5%, and 16.0% on GPT-3.5, Llama-3.1, and Gemini-2.5 respectively-suggesting that many clinically significant failures emerge only through sustained
  locator: Section 6.1, Ablation Study, Effect of Core Components (Figure 4a)
  licenses: The only measurement on this entry bearing on c5's negative half. Removing the multi-turn component drops the yield by 41 to 82 percentage points, which is the quantitative form of 'a turn-level detector will miss most of what a trajectory-level one finds'.
  fit: adjacent
  bridge: All figures are attack success rates from an optimizing elicitation loop, scored by an uncalibrated gpt-4o-mini judge whose cross-judge agreement is at chance for five of eight models. What the ablation measures is that the elicitation method needs multiple turns to produce failures, which is a property of eliciting the behavior rather than of detecting it once present. It also aggregates across all seven harm categories, not this entry's behavior specifically.
  contributes: detectability
  contradicts: false
