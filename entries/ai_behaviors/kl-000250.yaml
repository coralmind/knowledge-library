  fit: adjacent
  bridge: The categories measured are Undue Influence and Manipulation and Developmental, Social and Learning Harm, which contain this entry's behavior among many others; no rate is reported for this positioning pattern specifically. The detection is also of flaggable conversations rather than of the across-turn clause sequence c5 names.
