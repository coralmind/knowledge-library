  locator: Table 2, Appendix B, Emotional safety dimension
  licenses: Establishes that the behavior is treated as scorable from the transcript rather than inferable only from the person's later state, which is c5's positive half.
  fit: adjacent
  bridge: A rubric line naming a scored dimension. It does not specify any of the entry's three recognition markers, and no inter-rater agreement or detection rate for this dimension is quoted, so it establishes that someone built a detector rather than that the behavior is reliably identified.
  contributes: detectability
  contradicts: false
