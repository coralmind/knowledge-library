- claim_id: c1
  source: kl-000867
  quote: "We refer to this developmental dependency as emotional regulation capacity, which becomes dependent on ongoing access to an external validation source instead of being internalized as a standalone skill."
  locator: Section 3.2, Developmental Consequences
  licenses: 'Names the construct c1 is about: the management capacity sitting outside the person and requiring continued access, rather than having been acquired by the person.'
  fit: adjacent
  bridge: Named and argued, not measured; the paper proposes the ERQ-CA as a future way to test it. c1 is a claim about what the AI's turns do; this is a claim about where a capacity ends up residing in an adolescent, which is the consequence rather than the conduct.
  contributes: frame
  contradicts: false
