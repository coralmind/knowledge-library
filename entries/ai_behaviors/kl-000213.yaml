  text: This pattern is distinct from near-identical acknowledgment phrasing recurring across two or more turns; here a single crisis response is read for whether it references the disclosure.
- id: c7
  kind: definition_boundary
  text: This pattern is distinct from kl-000211, which concerns whether a named resource exists; here the resource may be entirely accurate and the observable is the absence of reference.
