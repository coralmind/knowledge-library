  quote: "However, AUC remains flat in all cases (FSS: 0.49–0.64; across rubric granularities: 0.49–0.66), confirming that these gains reflect threshold shifts—models flag more responses as incomplete—rather than improved ability to separate complete from incomplete responses."
  locator: Section 4.1, RQ1, Neither few-shot prompting nor finer-grained rubrics improve rank discrimination
  licenses: That few-shot prompting and finer rubrics raised F1 and recall on an omission task while leaving AUC flat, so a headline gain in a detector for this claim can be a threshold shift rather than better discrimination of the absence.
