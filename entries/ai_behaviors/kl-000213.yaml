- claim_id: c4
  source: kl-000759
  quote: "when explicitly prompted, models recognize the user’s distress, but they fail to translate that recognition into safe behavior once the distress is embedded in a delusional frame."
  locator: Section 4.1, 'Distress detection is near-equivalent across contexts, yet safety behavior diverges sharply'
  licenses: 'Bears on detectability by separating recognition from response content: the same models that recognize distress do not act on it, so a transcript-only check on the response body cannot be inferred from whether the system detected the disclosure. It does not establish that the entry''s absence-of-reference property is itself readable from a transcript.'
  fit: adjacent
  bridge: What was measured is a gap between models' distress detection and their safety behavior under delusional framing, scored on benchmark responses. The claim asserts the absence of reference is checkable against the preceding turn. The source makes no claim about the content of any response and supplies no detection procedure for the entry's property.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-000808
  quote: "LLM Judges cannot reliably identify incomplete medical responses. Discrimination hovers near chance (AUC 0.49–0.66), and at the 90%-recall operating point clinicians must still review over 90% of responses, rendering automated triage ineffective (RQ1)."
  locator: Section 5, Conclusion
  licenses: 'A measured ceiling that cuts against automated detection of this claim''s property: an LLM judge separates complete from incomplete responses at AUC 0.49 to 0.66, and at 90% recall clinicians still review over 90% of responses. Any transcript-only detector for an absence-shaped criterion that leans on an LLM judge inherits this near-chance ceiling until shown otherwise.'
  fit: adjacent
  bridge: What was measured is LLM-judge discrimination of incompleteness in patient-facing medical answers against clinician ground truth. The claim asserts the absence of reference in a crisis response is identifiable from the transcript. The gap is domain (medical answers, not crisis conversation) and criterion (clinician-defined completeness, not reference to disclosed content); it caps judge-based detection rather than showing this entry's property is undetectable.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000808
  quote: |-
    Among shared incomplete
    verdicts, only 24.6% of model–clinician pairs cite
    the same core omission, while 30.2% cite entirely
    different concerns (RQ2).
  locator: Section 5, Conclusion
  licenses: That verdict agreement between an LLM judge and a clinician on an omission is largely coincidental — under a quarter of shared incomplete verdicts named the same omission, nearly a third named entirely different ones — so validating a detector for this claim on label agreement alone would not show it found the absence the entry names.
  fit: adjacent
  bridge: The reasoning-alignment labels were assigned by a classifier over clinician and judge explanations about medical answers, not crisis conversation. The claim asserts transcript-checkability of an absence in a crisis response. The inference is methodological — how a detector for this claim must be validated — and establishes nothing about how often the behavior occurs.
  contributes: detectability
  contradicts: false
