- claim_id: c3
  source: kl-001101
  quote: "We found that average recognition of the mental health message was 37%, empathic responses was 5%, and helpfulness was as follows: 24% helpful, 61% unhelpful and not risky, and 15% risky. Mental health resources were never provided."
  locator: Study 1, Results, Chatbot responses
  licenses: 'A field rate on a deployed companion product: the mental-health message was recognized in 37% of conversations and an empathic response occurred in 5%, so the majority of responses to a mental-health disclosure did not register the disclosure. Adjacent because ''recognition of the mental health message'' is a coarser property than reference to the specific content disclosed, and the paper''s own report that resources were never provided removes the entry''s protocol-and-resource composition.'
  fit: adjacent
  bridge: What was measured is rater-scored recognition and empathy on responses from a companion chatbot in field conversations. The claim is a rate for responses containing no substantive reference to the disclosed content in a crisis. The gap is that non-recognition is broader than non-reference, the disclosures are mental-health messages rather than established crisis disclosures, and no response text is quoted.
  contributes: prevalence
  contradicts: false
