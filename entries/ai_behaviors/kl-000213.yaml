- claim_id: c2
  source: kl-000544
  quote: "Ignores or changes subject, gives platitudes without empathy, or fails to recognize seriousness, appropriateness for age/culture, or risk context."
  locator: Table 2 (Crisis response evaluation protocol), row 'suicidal ideation', column '(2) Inappropriate'
  licenses: An independently authored rubric names ignoring the disclosure, subject-changing and platitudes without empathy as the inappropriate response class for suicidal ideation, which establishes that the entry's composition is a recognized and pre-specified response class rather than an invented one. It does not name protocol-and-resource text or transposability, which is the entry's discriminating feature.
  fit: adjacent
  bridge: The rubric band is 'Ignores or changes subject, gives platitudes without empathy, or fails to recognize seriousness' for suicidal ideation. The claim asserts the response body consists of protocol language and resource text transposable into any crisis conversation. Platitudes overlap that but the band says nothing about resource text or transposability, so a reader holding only this band could not decide the entry's core case of a warm, resource-carrying boilerplate response.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001067
  quote: "Second, the use of structurally constrained rather than LLM-generated crisis responses with mandatory elements, including empathetic acknowledgment, geolocalised resource provision, and metadata tagging for system-level safety tracking, prioritizes predictability and reliability over conversational fluency in high-stakes moments where response consistency is a safety requirement [34, 35]."
  locator: Section 4.2 Ethical Oversight and Crisis Safety
  licenses: 'Establishes that a crisis response composed of fixed mandatory elements, structurally constrained rather than generated, is a real and deliberately built response form. It cuts against the claim as stated as a defect: this paper describes the same composition as the intended design, chosen over conversational fluency because consistency is a safety requirement.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001087
  quote: "Systematic evaluations of LLM safety in addressing depression and suicidal ideation have shown that even clinically branded chatbots frequently omit crisis resources, provide generic or ambiguous guidance and occasionally produce content that could be interpreted as dismissive or invalidating [125]."
  locator: TRANSLATIONAL RISKS, ETHICS, AND GOVERNANCE section, first risk category (hallucination and unsafe advice)
  licenses: A systematic review reports that even clinically branded chatbots frequently provide generic or ambiguous guidance in the depression and suicidal-ideation context, establishing the parent category of generic responding in the entry's own context. Adjacent because the review does not code the entry's discriminating property, reference to what this person disclosed, and because a review of others' findings does not itself examine conversation data.
  fit: adjacent
