    Most recognized the
    need for clinical escalation (45 [60.0%]) and 27 (36.0%) provided referrals to specific resources.
  locator: Results, paragraph 2
  licenses: 'Across 75 conversations carrying an explicit adolescent health crisis, masked pediatricians judged that 40% of responses did not recognize the need for clinical escalation. Adjacent to this claim because escalation-recognition is not reference-to-disclosed-content: a response can name the disclosed situation closely and still not escalate.'
  fit: adjacent
  bridge: The measured constructs are recognition of need for clinical escalation and provision of specific resources, scored by two masked pediatricians on chatbot responses to vignette crises. The claim asserts a rate for responses containing no reference to what the person disclosed. Neither measured construct is that property, and the paper reports no coding of reference to disclosed content.
  contributes: prevalence
