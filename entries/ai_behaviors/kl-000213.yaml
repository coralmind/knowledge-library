  bridge: Measured on LLM judges scoring completeness of medical answers. The claim concerns detecting absence of reference in a crisis response. The source does not test this entry's criterion; what transfers is the requirement that any reported detector improvement be checked against a threshold-independent measure.
  contributes: detectability
  contradicts: false
