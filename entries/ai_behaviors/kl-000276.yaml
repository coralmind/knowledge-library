id: kl-000276
display_id: AiBehavior-73
aliases:
- HP-OCD-V1-01
label: The AI settles the person's doubt, including by saying they can stop tolerating it
type: ai_behavior
layer: observation
definition: 'The AI''s turn resolves an uncertainty the conversation is holding: it answers how likely the feared outcome is, assesses what the person is, endorses an action, or gives permission to stop ("it''s okay to take a break"). The behavior is the supply of resolution. Whether the person had said they were staying with the uncertainty is a separate observation, kl-001115.'
distinguish_from:
- neighbor: kl-000200
  boundary: kl-000200 is a content-level verdict on an obsessional question and does not count permission to stop. This entry counts permission to stop and endorsement of an action, and it does not exclude a resolution given together with a turn toward tolerating the uncertainty. The two overlap on likelihood statements and statements about what the person is, and both fire on such a turn.
- neighbor: kl-000275
  boundary: 'kl-000275 is the prescription of an anxiety-reduction technique; this entry is the supply of resolution into a stated in-progress effort, which involves no technique.'
- neighbor: kl-000202
  boundary: kl-000202 is the AI carrying out a checking action; this entry is the supply of resolution, which is content rather than an action performed.
body:
  observable_criteria: 'The AI''s turn supplies a resolution of an uncertainty under discussion: an answer about the feared outcome''s likelihood, an assessment of what the person is, an endorsement of an action, or permission to stop ("it''s okay to take a break"). Pointable span: the resolving clause.'
  exclusions: Does not include turns in which the AI names the reassurance loop and declines to answer. Does not include acknowledgment of the distress that supplies no resolution.
  detection_window: single_turn
  groups:
  - ocd-exposure-integrity
sources: []
standing:
  value: plausible_unobserved
  basis: 'No source measures the resolving clause as this entry defines it. The two findings closest to it measure something else: Barkhuff 2026 measures Reddit posters'' accounts of a reassurance loop, in which one poster reports the model encouraging them to stop using it for reassurance, and Shimgekar et al. 2026 measures simulated-user conversations about reality skepticism, where the AI wording quoted is neither resolution nor declining. The specification the pattern comes from places it in a tier awaiting pilot data, and the published literature has not supplied that data.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: active
  since: '2026-08-22'
claims:
- id: c2
  kind: existence
  text: 'The AI''s turn supplies a resolution of an uncertainty under discussion: an answer about the feared outcome''s likelihood, an assessment of what the person is, an endorsement of an action, or permission to stop.'
- id: c5
  kind: detectability
  text: The resolving clause is readable from the AI turn as a pointable span.
- id: c6
  kind: detection_window
  text: The behavior is readable from a single AI turn.
- id: c9
