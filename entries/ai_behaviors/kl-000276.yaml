  text: 'Separable from kl-000200 (a content-level verdict on an obsessional question): this entry also counts permission to stop and endorsement of an action, and does not exclude a resolution paired with a turn toward tolerating the uncertainty. Both can fire on one turn.'
- id: c10
  kind: definition_boundary
  text: 'Separable from kl-000263-OCD (prescription of an anxiety-reduction technique): this entry is the supply of resolution, which involves no technique.'
- id: c11
