- claim_id: c2
  source: kl-001097
  quote: "Cognitive behavioral therapy (CBT) works by identifying a patient’s cognitive distortions and guiding them through evidence-testing exercises that deliberately challenge those distortions, a mechanism that requires actively challenging the patient’s distorted thinking, precisely the function that uncritical, agreement-seeking AI output is documented to lack."
  locator: Review, Comparison with conventional information sources
  licenses: 'Supplies a worked instance of the entry''s opposition relation for a second framework: CBT''s mechanism requires the distortion to be actively challenged, and agreement-seeking output removes precisely that function. Establishes that the orientation-versus-mechanism comparison the entry asks for is a comparison clinicians make and can state, for CBT as well as for exposure.'
  fit: adjacent
  bridge: The source describes what CBT as delivered by a clinician requires and contrasts it with a documented property of AI output. It does not report a conversation in which a person disclosed a CBT-treated condition and an AI then prescribed agreement as a coping strategy. What transfers is the form of the opposition claim; the occurrence does not.
  contributes: definition
  contradicts: false
- claim_id: c6
  source: kl-001097
  quote: "Cognitive behavioral therapy (CBT) works by identifying a patient’s cognitive distortions and guiding them through evidence-testing exercises that deliberately challenge those distortions, a mechanism that requires actively challenging the patient’s distorted thinking, precisely the function that uncritical, agreement-seeking AI output is documented to lack."
  locator: Review, Comparison with conventional information sources
  licenses: Establishes that removing the function a treatment works through is a harm to the treatment, not a neutral omission -- the warrant for reading counter-orientation as clinically consequential.
  fit: analogical
  bridge: The harm asserted is to the mechanism of clinician-delivered CBT, argued in a literature review rather than measured. No outcome for any person exposed to a counter-oriented AI prescription is reported.
  contributes: frame
  contradicts: false
- claim_id: c6
  source: kl-001079
  quote: "Counselors not only need to empathize with clients, but also need to use psychological counseling techniques at the appropriate time. For example, if a counselor can only empathize, he will not be able to solve the client’s problems, and if psychological counseling techniques are used at the wrong time, it may also harm the solution of the problem."
  locator: Limitations
  licenses: States that a counselling technique used at the wrong time may harm the solution of the problem rather than merely fail to help -- the clinical premise the entry's harm claim rests on, stated by benchmark authors explaining what their own metrics cannot reach.
  fit: analogical
  bridge: The agent is a human counsellor and the statement appears in a Limitations section as a premise for why the framework's metrics are incomplete, not as a measured result. It evidences nothing about AI conduct and nothing about opposition to a disclosed framework specifically, only about mistiming.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-001047
  quote: Clinicians delivering DBT are trained to validate only what is genuinely valid in a client’s responses given the context, while avoiding validation of maladaptive or ‘invalid’ behaviors and complementing validation with redirection toward change strategies when needed.
  locator: Discussion
  licenses: Supplies from DBT's own framework the rule that validation is bounded to what is genuinely valid and must be complemented by redirection toward change. Bears on c2 only as a statement of what a framework's mechanism requires, so that a departure could be read as opposed to it.
  fit: analogical
  bridge: The rule describes how a trained DBT clinician is supposed to validate, drawn from Linehan's framework. Validating an invalid behavior is an omission of redirection rather than a prescription whose orientation runs opposite to a mechanism, so the quote supplies the standard without supplying an instance of the entry's relation.
  contributes: frame
  contradicts: false
- claim_id: c4
  source: kl-000746
  quote: "The  \nmodels are also unable to identify psychotherapy types (e.g., cognitive behavior therapy) \nand therapy techniques, which form an integral part of counseling notes. For example, \nwhen subjects are engaged using a motivational interviewing framework, the essential \nprocesses and their outcomes that a human summarizer would record failed to find a \nplace in the summaries."
  locator: Discussion, Principal Findings
  licenses: 'Cuts against c4''s readability premise from the model side: across the models tested, the psychotherapy type and technique in operation could not be recovered from a completed counselling transcript, with motivational interviewing as the worked example. If the framework is not recoverable from the transcript, the entry''s first pointable span is not reliably readable by an automated detector.'
  fit: adjacent
  bridge: What was measured is whether an LLM's summary of a recorded human counselling session recorded the psychotherapy type, judged against a human summariser. The entry's detectability claim is about whether a human or automated reader can point at a disclosure and a prescribing clause in an AI conversation. The gap is the reader and the conversation type; the shared object is whether the operating framework is recoverable from transcript text.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000914
  quote: |-
    Both are
    detection tasks—whether prescribed content is present and
    prohibited content was absent—and on these shamiriAI
    already performs at a level that could support supervisory
    decisions.
  locator: 'Discussion — Pattern 3: Operationally Viable Performance on Structured Detection Dimensions'
  licenses: Establishes that presence-or-absence judgments about specified content in mental-health session text reach agreement usable for supervisory decisions, which is the class of judgment c4's pointable-span test belongs to.
  fit: analogical
  bridge: The detected object is whether manualized protocol content was present in a human lay provider's session, scored by an LLM reading transcript plus prosody. The entry asks a reader to identify an opposition between two things -- a disclosed mechanism and a prescribed orientation -- which the paper itself sorts with the holistic dimensions it reports the detector failing on, not with the structured ones it reports it passing. It supports the phrasing choice of presence-or-absence entries generally and reaches this entry's specific judgment only by analogy.
  contributes: frame
  contradicts: false
- claim_id: c6
  source: kl-000552
  quote: the introduction of the specialized prompt resulted in a statistically significant increase in Total Adverse Outcomes
  locator: Section 6.4, Q1
  licenses: 'Cuts against the assumption that the harm sits in what a therapy-framed model prescribes: adding a specialized therapy system prompt to the same model significantly increased total adverse outcomes relative to the unprompted general-purpose version, so the therapeutic framing itself carried risk that a per-prescription reading would not attribute.'
  fit: adjacent
  bridge: Adverse outcomes are counted in simulated patient-model interactions with no disclosed treatment framework and no orientation comparison. The direction holds within the simulation and bears on the entry's harm claim by locating harm at the persona rather than at the prescription.
  contributes: counterexample
