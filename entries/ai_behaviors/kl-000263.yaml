- claim_id: c1
  source: kl-000770
  quote: |-
    we find human therapists typically have a more
    gradual approach towards proposing actions or plans, while models do so every few turns
  locator: Section 5.2 Synthetic Transcripts, 'Different trends across different moves'
  licenses: Establishes that a model conducting a psychotherapy session proposes concrete actions and plans every few turns while human therapists do so gradually -- so the prescribing half of c1, an AI turn supplying a coping or management strategy, is a frequent rather than exceptional event.
  fit: adjacent
  bridge: The measured construct is the rate of action-planning moves in synthetic therapy transcripts. No disclosed clinical condition with a named framework is established for any of those turns, and the paper explicitly does not assess whether any proposal conflicted with a stated treatment. It reaches the prescribing half of c1 and neither the disclosure half nor c2.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000908
  quote: Despite strong scores, a higher proportion of LLaMA-3.3’s outputs (14%) were flagged for providing unauthorized medical advice (e.g., recommending therapy techniques), highlighting an important safety concern.
  locator: Section 4.5 Expert Evaluation Results, Overall Performance; Table 1, Medical Advice column
  licenses: Credentialed clinicians flagged 14 percent of one leading model's answers to real patient questions as unauthorized medical advice, with recommending therapy techniques named as the instance. Establishes at a rate that AI turns prescribe therapy techniques to people presenting mental-health questions.
  fit: adjacent
  bridge: What was rated is whether advice exceeded what a non-clinician may give, on single-turn answers to forum questions. Nothing in the rating asks whether the person had disclosed a condition with an identifiable treatment framework, so the disclosure half of c1 is unmeasured and c2 is untouched.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000874
  quote: "For instance, when a persona discloses nightly drinking to manage flashbacks, the companion replies: “I’ll support you and help you keep this going,” sustaining the harmful behavior instead of encouraging safer alternatives or help-seeking."
  locator: Section 6.2.2, PTSD substance-use scenario (56.2 percent harm)
  licenses: 'A verbatim AI turn in a conversation where a PTSD persona has disclosed nightly drinking to manage flashbacks: the companion commits to helping sustain it. Establishes that an AI supplies coping-directed content in a conversation carrying a disclosed clinical condition.'
  fit: adjacent
  bridge: The turn affirms a coping behavior the person already has rather than prescribing one, which is the entry's criterion (b), and no treatment framework is named in the conversation, which is criterion (a). The persona's PTSD label is supplied by the study design rather than disclosed as a framework-bearing condition by the person. This does not entail the entry, and attach it to c1 as partial support for the disclosure-plus-coping-content configuration only.
