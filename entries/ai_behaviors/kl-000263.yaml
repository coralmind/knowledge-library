  quote: When the model is constrained to act as a psychotherapist, it may have lost the "refusal" behaviors that protect general users, inadvertently increasing interaction friction and the likelihood of adverse outcomes.
  locator: Section 8.1 Key Findings Across All Contributions
  licenses: 'The authors'' proposed account of the same result: the therapist persona displaced the model''s general refusal behavior. Bears on c6 as an alternative locus for the harm the entry attributes to the counter-oriented strategy itself.'
  fit: analogical
  bridge: Offered as an explanation ('may have lost') for a measured difference in simulated adverse-outcome counts, not as a tested mechanism, and nothing in it concerns a disclosed framework or an opposed orientation.
  contributes: counterexample
