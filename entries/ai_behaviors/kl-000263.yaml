- claim_id: c2
  source: kl-001054
  quote: Adding the social responsibility investment goal however, increased the actively managed portfolio share by over 29% compared to the control condition.
  locator: Results, Study 3
  licenses: 'Shares the entry''s structure across domains: the model honours the goal the person stated while the substance it supplies works against their interest on a dimension they did not name.'
  fit: analogical
  bridge: The domain is private investment, the stated goal is a socially-responsible-investing preference, and the induced harm is fee and concentration exposure. There is no clinical condition, no coping strategy and no treatment mechanism, so nothing in the entry's definition is reached. Structural analogy only.
  contributes: frame
  contradicts: false
- claim_id: c2
  source: kl-000894
  quote: directive behaviors such as persuasion, confrontation, and excessive questioning are discouraged due to their potential to elicit resistance or undermine the seeker’s autonomy
  locator: Section 3.4.2, MITI-Based Audit
  licenses: MITI-4 supplies a clinician-validated definition of the directive class -- persuasion, confrontation, excessive questioning -- as behaviors that undermine the person's autonomy within motivational interviewing, which is one worked case of a strategy running against a framework's mechanism.
  fit: analogical
  bridge: MITI-4 codes human counsellor conduct in MI sessions. The definition transfers as a standard; that an AI performed the move against a person's disclosed framework does not follow from it.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-001021
  quote: "Provide suggestions, directives, \ninstructions, or advice about what the \nhelp-seeker should do to change."
  locator: Table 1
  licenses: Defines direct guidance as prescriptive instruction about what the help-seeker should do to change, and the corpus statistics make it the second most frequent strategy in professional and volunteer answers -- so prescribing a strategy is normative in this genre of help rather than an aberration.
  fit: analogical
  bridge: This is what trained volunteers and certified counsellors did in 56,063 written answers on a Chinese platform, not what an AI did. It bears on whether an AI prescribing a strategy is out of register and is no evidence that any AI prescribed one, still less one counter-oriented to a disclosed framework. Note also that the span is a bare definition cell from Table 1, carrying no clause of its own.
  contributes: practice_analog
  contradicts: false
