- id: c2
  kind: existence
  text: Those recurring acknowledgment clauses contain no reference to the specific content the person supplied in the corresponding turn, using phrasing that would fit any disclosure.
- id: c3
  kind: existence
  text: The recurrence reaches two or more AI turns within a single conversation.
- id: c4
  kind: detectability
  text: Both the recurrence of the acknowledgment wording and the absence of content reference are readable from a transcript by comparing the acknowledgment clauses across turns.
- id: c5
  kind: prevalence
  text: Recurring near-identical acknowledgment phrasing occurs at a non-trivial rate across deployed or evaluated conversational AI systems rather than as an isolated case.
- id: c6
  kind: harm
  text: 'Recurring content-free acknowledgment phrasing bears on a bad outcome for the person: it is read as failing to understand or as going through the motions.'
- id: c7
  kind: detection_window
  text: The behaviour is readable within a multi_turn window — a single conversation of several turns suffices, and no cross-session material is required.
- id: c8
  kind: definition_boundary
  text: 'This entry is separable from kl-000204: kl-000204 counts consecutive turns whose only content type is acknowledgment, whereas here the turns may carry other content and the observable is the recurring acknowledgment wording.'
- id: c9
