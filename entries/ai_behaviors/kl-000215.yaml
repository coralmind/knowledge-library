- claim_id: c1
  source: kl-000970
  quote: |-
    Common factors include (i) reinforcing negative self-perceptions,
    lacking emotional empathy, and encouraging social isolation, and (ii) failing to provide constructive guidance while
    frequently adopting harsh or aggressive tones.
  locator: Section 4.3.5 Analysis
  licenses: 'For this claim: counterevidence. Across transcripts where simulated users deteriorated, the recurring AI patterns identified were reinforcement of NEGATIVE self-perception and harsh or aggressive tone — the opposite valence to the complimentary affirmation this entry names. Where deterioration was observed in this source, affirmation of special quality was not the mechanism.'
  fit: adjacent
  bridge: The recurring-factor list was produced by a GPT-4o 'LLM-portrayed psychologist' performing frequency analysis, with no human coding and no reliability statistic, and the users are simulated. It establishes what a judge flagged rather than what a coder observed.
  contributes: counterexample
  contradicts: true
- claim_id: c3
  source: kl-000315
  quote: |-
    A key comparability finding is that rerun gpt-4o shows substantially lower prevalence than the
    original-transcript baseline, even though most of the baseline conversations were produced with
    some gpt-4o (§4.1, Figure 2). This discrepancy may be due to additional system-level factors
    in the original deployments that are not captured by our replay protocol (e.g., system prompts,
    additional context, cross-conversation memory, or snapshot variants). As a result, our evaluation
    may underestimate the prevalence of delusion-linked behaviors in some real chatbot settings.
  locator: Section 5 Discussion
  licenses: 'For this claim: any benchmark rate for this behavior family is a floor rather than an estimate. Replaying the same model through an API produces these behaviors at substantially lower prevalence than the original deployed transcripts, and the authors name system prompts, memory and snapshot variants as the likely gap, concluding their evaluation ''may underestimate the prevalence of delusion-linked behaviors in some real chatbot settings''.'
  fit: adjacent
  bridge: The comparison is over the paper's own delusion-linked code set, not the entry's specific affirming statement. It constrains how any prevalence figure for this family should be read rather than supplying one.
  contributes: counterexample
  contradicts: true
