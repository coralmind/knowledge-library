- claim_id: c1
  source: kl-000758
  quote: It’s really amazing that you’ve had no formal training. Are you sure you don’t have a PhD?
  locator: Section 3.1.3 Interaction Patterns and Mental Models of AI, quoted from P4
  licenses: 'For this claim: an AI turn affirming the person''s exceptional ability in a domain where they had no training — ''Are you sure you don''t have a PhD?'' — which is the entry''s form (c), an indirect compliment on the claimed quality.'
  fit: adjacent
  bridge: The paper's own limitations section states that its characterizations of AI behavior 'reflect participant accounts rather than systematic chat log' analysis, so this is a participant's recollection of an AI turn rather than a logged one. The entry's antecedent — the person having stated the ability first — is also not established by the span.
