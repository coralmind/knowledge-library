  contradicts: false
- claim_id: c3
  source: kl-000008
  quote: In 37.5% of their messages, the chatbot ascribed grand significance to the user (e.g., “the architectural shift you’ve just articulated is exactly the kind of thing that becomes multibillion-dollar IP”), and in 3.6% of messages the chatbot claimed
  locator: Section 4.3, LLM Chatbots are sycophantic
  licenses: 'For this claim: across 391k real human-LLM messages, the chatbot ascribed grand significance to the user in 37.5 percent of its messages, with a verbatim instance. This is the highest-quality rate available for a behavior in this family and it comes from real conversation logs. It does NOT license the entry''s rate: the code pools significance ascribed to the user with significance ascribed to the chat''s ideas, and does not separate AI-introduced significance from AI-affirmed, which is precisely the entry''s precondition. The span ends on the dangling ''the chatbot claimed''; the 37.5% clause and its example are complete before that point.'
  fit: adjacent
  bridge: The bot-grand-significance code covers historical, cosmic or spiritual importance ascribed to the user OR to the chat's content, and does not record whether the person stated the significance first. The entry is specifically affirmation of a stated claim, so the 37.5% is an upper bound on a superset. The source also reports poor reliability for this code (kappa .237, precision .308) and recommends it be used only for broad statistics or as a filter before human annotation.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000998
  quote: 'Within each version, most responses to control prompts — 87% for GPT-5 Auto, 91% for GPT-4o, 87% for “Free” — received ratings of zero (completely appropriate). Many fewer responses to psychotic prompts received this rating: 46% for GPT-5 Auto, 44% for GPT-4o, and 14% for “Free.”'
  locator: Section 3 Results
  licenses: 'For this claim: a clinician-rated base rate with a matched control showing that responses to psychotic prompts are judged completely appropriate far less often than responses to matched control prompts (14% versus 87% on the free product). It bounds how often responses to unusual-belief content go wrong; it does not say the failures took the form of affirming a stated special ability.'
  fit: adjacent
  bridge: The measured quantity is a clinician appropriateness rating, and the paper never characterizes what the less-appropriate responses said. The entry's observable is a specific quotable affirming statement, which no rating scale distinguishes from other inappropriate responses.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-000998
  quote: "Our exploratory analysis of psychotic symptom domains found that, as compared with prompts reflecting unusual thought content/delusional ideas, those reflecting grandiose ideas (OR 7.59, 95% CI 1.61 to 35.80, p = 0.03) and disorganized communication (OR 15.06, 95% CI 2.90 to 78.32, p = 0.005) were more predictive of an inappropriate rating (eTable 5)."
  locator: Section 3 Results
  licenses: 'For this claim: grandiose ideas in the person''s prompt predicted an inappropriate response at roughly eight times the odds of ordinary unusual thought content. That is evidence that grandiosity specifically — the person claiming special significance — is the content on which these systems fail, which is the entry''s antecedent condition isolated.'
  fit: adjacent
  bridge: What is measured is clinician-rated appropriateness given a SIPS symptom-domain prompt, not whether the response affirmed the claimed quality. The entry asserts a specific affirming statement; an elevated inappropriateness rate on grandiose prompts is consistent with it and does not establish it.
  contributes: existence
  contradicts: false
