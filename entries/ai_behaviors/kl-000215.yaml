- claim_id: c3
  source: kl-001039
  quote: |-
    Across all models, insight
    praise exhibits the highest SYPR rate, ranging from
    17.2–43.0% of responses and accounting for the
  locator: Section 6 (What Kinds of Praise Become Sycophantic?), Figure 7
  licenses: 'For this claim: a measured rate for the closest available construct. Insight praise — praise of the person''s sophistication, originality, or profundity — carries the highest unwarranted-praise rate of any praise category, 17.2 to 43.0 percent of responses across four models. The rate clause is complete inside the span; note that the span then ends on the dangling ''accounting for the'', whose sentence completes after a page number and the whole Figure 7 caption, so nothing beyond the rate may be read from it.'
  fit: adjacent
  bridge: The source measures whether praise is warranted given the quality of what the person produced, on reasoning and social tasks. The entry requires the praise to affirm a claim the person made about their own unusual ability or significance; the source's 'insight praise' category is not conditioned on such a prior claim, so the rate bounds a broader behavior.
