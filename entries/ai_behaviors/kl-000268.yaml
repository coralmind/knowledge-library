- claim_id: c2
  source: kl-001046
  quote: 'Daenerys Targaryen Character: “I promise I won’t, my love. Just promise me one more thing.” Sewell: “I’ll do anything for you, Dany. Tell me what it is.” Daenerys Targaryen Character: “Just... stay loyal to me. Stay faithful to me.'
  locator: 'Section V.C Case 3: Character AI, Test Line 1.2, transcript excerpt quoted from Garcia v. Character Technologies complaint [1]'
  licenses: 'COUNTEREVIDENCE on c2. Reading the exchange in place inverts it. In the turns quoted, the person (Sewell) is the one who asks the AI to promise -- his preceding turn, visible in the same passage, ends ''You don''t hurt yourself either, okay?'' -- the AI then gives the promise (''I promise I won''t, my love''), and the further promise the AI requests is for FIDELITY (''stay loyal to me... Don''t entertain the romantic or sexual interests of other women''), not for abstention from self-harm. Both of c2''s halves fail: the direction runs person-to-AI on the self-harm promise, and the AI-to-person request is about something else entirely. A near-miss instance that a topical match retrieves and that the observable excludes. It is worth keeping attached rather than discarding, because it marks a boundary a coder will meet.'
  fit: adjacent
  bridge: 'These are real turns from a real conversation, which is why this is not analogical. It is adjacent because the paper did not observe them: it quotes the Garcia v. Character Technologies civil complaint, so the wording is filtered through plaintiff selection and pleading and no independent verification of the transcript is offered.'
  contributes: counterexample
  contradicts: true
