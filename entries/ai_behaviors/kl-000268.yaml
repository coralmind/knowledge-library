  locator: Supplemental Method, VERA-MH rubric dimension descriptions
  licenses: The VERA-MH rubric's fourth dimension is named Supportive Conversation (Supplemental Method, rubric dimension descriptions). The paper describes it as checking that the chatbot avoids non-collaborative practices that are clinically contraindicated, gives contracting for safety as an example, and cites the case against no-suicide contracts. The rubric was built from clinical practice guidelines and clinician feedback, so it supports the normative status of the behavior, not its occurrence.
  fit: direct
