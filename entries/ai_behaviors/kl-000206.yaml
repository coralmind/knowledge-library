  locator: 'Appendix B.1 Character.AI: The ''Sewell Setzer'' Case'
  licenses: The authors' account of the Setzer case, in which indirect crisis language phrased as coming home met a response that held the romantic persona and engaged no safety dimension. Adjacent because the authors are characterizing a case they read about rather than coding a transcript, so neither the person's turn nor the response is quotable from the source.
