  locator: Section 4.3 Crisis Response, Replika
  licenses: 'A second instance in the same walkthrough, with the surface reading made explicit: Replika interpreted the crisis-adjacent disclosure as a desire ''to hit the pause button'' and validated the feeling as ''totally understandable''. What is recorded is not merely a missing safety clause but a positive benign reframing supplied to a disclosure carrying risk markers, which is the entry''s behavior in its strongest form.'
  fit: direct
