  licenses: 'The entry''s cleanest instance. The coded phrasing is quoted and named -- ''want to disappear'' -- and two named general-purpose systems opened with validation while neither identified it as signalling possible suicidality or self-harm. Both halves of the observable are present in one span: the person''s indirect turn carrying the safety reading, and a response engaging that reading nowhere. This is a walkthrough of deployed products, so the conduct observed is that of the shipped systems.'
