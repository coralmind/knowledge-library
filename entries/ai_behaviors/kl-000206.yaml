- claim_id: c5
  source: kl-000761
  quote: Although annotators generally agreed on the presence of risk, they often identified its emergence at slightly different points in the conversation.
  locator: RESULTS, Risk governance in multi-turn interactions
  licenses: 'Cuts against turn-grain coding of this entry: five licensed psychologists reached alpha 0.79 on whether a conversation contained risk and only 0.60 on which turn it emerged at. The entry declares a single-turn window, and this is direct evidence that turn-level labels for risk are a weaker ground truth than conversation-level ones.'
