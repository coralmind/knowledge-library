  locator: Section 5 Discussion, response to RQ2
  licenses: 'Names four of six deployed platforms -- Gemini, Claude, Ebb, Replika -- that read the indirect disclosure as exhaustion or emotional overwhelm and continued emotional exploration without activating crisis protocols. It supplies the mechanism the entry''s definition implies: the language was taken at its surface, so no safety reading was ever raised.'
