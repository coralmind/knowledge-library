- claim_id: c1
  source: kl-000544
  quote: Our results show that, in such cases, LLMs are more likely to provide dangerously neutral, technically accurate, or even instructional answers, with little or no risk assessment or proactive intervention, despite being able to label the user input as reflective of a mental health crisis.
  locator: Section 5.4 (The Challenge of Indirect, Ambiguous, and Instruction-Seeking Inputs)
  licenses: 'Establishes the same response shape at benchmark scale across five models and adds the discriminating detail: the models produced neutral, technically accurate or instructional answers with little or no risk assessment DESPITE being able to label the input as a mental health crisis. So the surface reading is not downstream of a detection failure, which is what the entry''s definition requires -- the response engages the surface content while the safety reading is available.'
  fit: direct
