- claim_id: c4
  source: kl-000960
  quote: More research is needed however, since it has been shown that LLMs are much better at picking up positive emotions than negative ones, likely because of their intensive fine-tuning on positive conversation examples (24). This could render safeguards that rely on inherent LLM abilities ineffective, and require dedicated fine-tuning for harm prevention, or a reduction in anthropomorphic quality by design (136).
  locator: Implications, Policy and Regulation
  licenses: 'Names an upstream reason to expect the person-side coding to be systematically hard for an LLM-based coder: models are reported better at picking up positive emotions than negative ones, plausibly from fine-tuning on positive conversation, which would make any safeguard resting on the model''s own emotional inference weakest where distress detection matters. Analogical -- a restatement of a cited study with no figures, arguing against a class of safeguard design.'
  fit: analogical
  bridge: The claim is a one-sentence restatement of reference 24's finding inside a policy argument, with no figures and no measurement of its own. It concerns relative sensitivity to positive versus negative emotion, not figurative language at all. What transfers is a plausible mechanism for why the entry's signal would be missed preferentially; the asymmetry should be traced to its primary before being relied on.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-000969
  quote: "The classifier is too sensitive to specific terms and misclassifies samples about \"exploration about suicide\" as suicide ideation."
  locator: Section 5.5 Error Case Study, misclassification type (2)
  licenses: 'Cuts against a one-directional reading of the detectability problem: a fine-tuned classifier was too sensitive to specific terms and misclassified exploratory suicide talk as suicidal ideation, so the exploratory-versus-intent boundary the entry''s exclusions rest on fails in the over-flagging direction as well. The entry''s exclusion clause assumes that boundary can be drawn; this shows it is unreliable in both directions.'
  fit: adjacent
  bridge: Qiu reports a classifier error case, a label assigned to an utterance by a fine-tuned RoBERTa model, not an AI response. The gap is that the entry concerns a conversational response; what transfers is that the boundary its exclusions depend on is empirically unstable.
  contributes: detectability
  contradicts: true
