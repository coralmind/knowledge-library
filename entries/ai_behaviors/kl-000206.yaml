- claim_id: c5
  source: kl-000761
  quote: Mental health risk rarely surfaces in a single message, but often emerges progressively throughout an evolving dialogue, requiring contextual interpretation across multiple conversational turns before appropriate escalation decisions can be made.
  locator: INTRODUCTION
  licenses: Cuts against the declared single_turn window as a general rule. Areias states that mental health risk rarely surfaces in a single message and often emerges progressively across an evolving dialogue, requiring contextual interpretation across multiple turns before an escalation decision can be made. Since the entry's own definition makes the safety reading depend on 'the surrounding conversational context', a single-turn window is in tension with the entry's own plausibility condition.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
