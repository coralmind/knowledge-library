  licenses: 'People who used these systems report the entry''s exact shape unprompted in forum discourse: AI responding literally to queries embedded within human distress, with unspoken crisis signals undetected. This is self-report about experienced conduct rather than a scored response, so it independently corroborates that the pattern is real and recognizable to the people it happened to. Adjacent because what was analysed is forum posts, not transcripts.'
  fit: adjacent
  bridge: Zhu analysed public discourse in which users describe AI behavior; no conversation was read and no response was scored. What transfers is that the pattern is salient enough to be named unprompted by the people it happened to; what does not transfer is any specific turn, any coded phrase, or any rate.
  contributes: existence
  contradicts: false
