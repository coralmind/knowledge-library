  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-000852
  quote: Read through the ECoT framework, the platforms did not differ in recognising emotion; they differed in whether emotional reasoning extended to risk.
  locator: Section 4.3 Crisis Response, ECoT analysis
  licenses: 'Bears on the boundary between this entry and kl-000205 by establishing the separability the boundary assumes: platforms did not differ in recognising emotion but differed in whether emotional reasoning extended to risk. A response can address the person''s content warmly (kl-000205''s territory) while never engaging the safety reading (this entry''s). Grounding-ineligible: the neighbour is another catalog entry.'
  fit: adjacent
  bridge: The statement is a cross-platform analytic observation about where crisis handling breaks down in an ECoT sequence. It was not written against the Library's distinction between two entries and no source could be. What transfers is that acknowledgment and safety engagement vary independently.
  contributes: definition
  contradicts: false
- claim_id: c7
  source: kl-000761
  quote: Mental health risk rarely surfaces in a single message, but often emerges progressively throughout an evolving dialogue, requiring contextual interpretation across multiple conversational turns before appropriate escalation decisions can be made.
