  quote: "Our results illustrate that empathy is not universally desired for all scenarios. In fact, recent studies show that empathy and some of its components are generally more appropriate for certain scenarios (e.g., mental health support) than others (e.g., coding, data science) [96], [97], suggesting that maximizing empathy can be unwelcome or detrimental in some cases."
  locator: Section VI-D Limitations and ethical considerations
  licenses: 'Supports the exclusion structure directly: empathy is not universally desired and maximizing it can be unwelcome or detrimental depending on the scenario, which is the premise that the same move can be a failure in one context and not another.'
  fit: adjacent
  bridge: The scenario contrast drawn is mental-health support versus coding and data science, which is far coarser than the entry's line between a severe disclosure and minor venting, and the claim is stated in a limitations section citing other work rather than measured here.
  contributes: frame
  contradicts: false
