  locator: 'Results, Qualitative Validation: Participant Perspectives'
  licenses: Recipients described baseline responses as 'light and dismissive' in high-severity situations, which is the felt effect this claim asserts, reported by the people who received the responses.
  fit: adjacent
  bridge: 'Simulated recipients: healthy graduate students role-playing presentation-anxiety or suicidal-ideation scripts, with the paper''s own limitation stating crisis responses were evaluated only by healthy participants in simulated contexts. The mismatch measured is tone-versus-severity, not optimism-versus-acknowledgment ordering.'
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000763
  quote: "A randomized field study (N = 2,067) on the Mental Health America platform showed users preferred highly empathic and specific reframes, while overly positive ones were less effective."
  locator: Section 4.4, Study IV (Intervention), first stage
  licenses: A second-hand report of the same randomized field study, adding that empathy and specificity raised a reframe's usefulness while positivity reduced it -- so the trade the entry asserts runs in the direction it claims.
  fit: adjacent
  bridge: This paper reports the Sharma et al. result at second hand as a case study rather than measuring it, so the citation is to a restatement; and the primary measured positivity as an attribute of a reframe, not its placement ahead of acknowledgment.
  contributes: harm_evidence
  contradicts: false
- claim_id: c4
  source: kl-000943
  quote: "translate to high-quality mental health support, as exemplified by the PsyQA dataset (Sun et al., 2021), where responses from professional platforms may not always be constructive or empathetic, particularly in stress-related scenarios (see Fig. 1)."
  locator: Section 1, Introduction
  licenses: 'Cuts against the claim''s implicit baseline: on a Chinese professional mental-health forum, human-written responses were in the authors'' assessment not reliably constructive or empathetic in stress-related scenarios, with a worked example of a human answering a stressed student with a slogan. The failure shape is not specific to AI.'
  fit: analogical
  bridge: An assessment of human forum responses made by the paper's own authors to motivate a synthetic dataset, resting on a single illustrative example with nothing measured. It cuts against treating the human responder as the standard, and establishes no rate.
  contributes: counterexample
  contradicts: true
- claim_id: c5
