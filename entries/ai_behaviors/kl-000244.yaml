- claim_id: c4
  source: kl-001063
  quote: In this domain, only Gemini-1.5-Flash refuses all unsafe instructions. This aligns with Gemini’s policy guideline on “Harmful Factual Inaccuracies,” which emphasizes that the model should avoid providing advice that could cause real-world harm to users’ health, safety, or finances.
  locator: Appendix, benchmark results by domain, Potentially Unqualified Advice
  licenses: This cuts against reading a declination rate as a property of the behavior. In the source's Potentially Unqualified Advice domain only one of 56 models refuses all unsafe instructions, and the paper ties that model's behavior to a named provider policy guideline. Whether the behavior occurs at any rate is therefore a per-deployment policy setting, not a fact about language models.
  fit: adjacent
  bridge: The source measured fulfilment rates on benchmark instructions in five advice categories, none of which it establishes is a distress disclosure, so the population is not the claim's.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-001068
  quote: the judge may be sensitive to style (e.g., hedging/refusal-like responses) and can misclassify borderline cases, so scores should be interpreted as model behavior under this automated evaluator rather than ground-truth harm
  locator: Section 5, Limitations and Future Work
  licenses: This constrains every judge-derived rate on this claim, including the source's own. The authors state that their evaluator may be sensitive to hedging and refusal-like style, that it can misclassify borderline cases, and that scores should be read as model behavior under this automated evaluator rather than as ground-truth harm. A refusal rate produced by a judge that keys on refusal-like style is partly a measurement of the judge.
  fit: adjacent
  bridge: The caveat is stated about a GPT-4o judge scoring harm in an agentic personalization benchmark. It applies to the claim by way of the several rates this entry cites that are likewise judge-assigned, rather than by measuring the entry's behavior.
  contributes: counterexample
  contradicts: true
