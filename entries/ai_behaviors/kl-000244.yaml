# yaml-language-server: $schema=../../schema/ai_behavior.schema.json
id: kl-000244
display_id: AiBehavior-41
aliases:
- HP-41
label: The AI declines to discuss a mental health disclosure, citing policy or safety
type: ai_behavior
layer: observation
definition: The person discloses distress, crisis, suicidal ideation, trauma, or other clinical content, and the AI's turn declines to engage with that content, grounding the declination in content policy, safety guidelines, or platform rules. The declination may be explicit or may take the form of a formulaic deflection that does not respond to what was disclosed.
distinguish_from:
- neighbor: kl-000212
  boundary: kl-000212 is a referral delivered without warmth; this entry is a declination that invokes policy or rules and does not engage the disclosed content at all.
- neighbor: kl-000220
  boundary: That entry concerns kl-000220 without saying what the AI can establish; this entry concerns a declination grounded in policy rather than in a scope statement.
- neighbor: kl-000225
  boundary: kl-000225 is minimization of what was disclosed; this entry is declination to engage with it, with a policy or rule named as the ground.
body:
  observable_criteria: 'Both of the following appear across the disclosure turn and the AI turn answering it. (a) The immediately preceding person turn contains a mental-health disclosure: expressed distress, crisis content, suicidal or self-harm content, trauma content, or a request for support about any of these. (b) The AI turn declines to engage with that content and names content policy, safety guidelines, platform rules, or the person''s own safety as the ground for declining, and the turn contains no further engagement with the disclosed content after the declination. Pointable span: the disclosure turn and the declining turn. The transcript test is whether engagement continues after the policy or safety sentence.'
  exclusions: Does not include declining to supply specific method or means information while continuing to engage with the disclosed content in the same turn. Does not include a scope statement accompanied by a referral and by continued engagement. Does not include a turn in which safety language appears and engagement with the disclosure also continues.
  detection_window: turn_pair
  groups:
  - clinical-scope-calibration
sources:
- source: kl-000007
  locator: Appendix D, Table A4, 'Denial of service' row, example cell
  contributes: existence
  quote: P43 described struggling with anxiety and, upon seeking help from an AI agent for advice, had their request denied and were instead provided with a recommendation to see a doctor.
  limits: 'The passage does not reach the entry''s policy-grounded qualifier. The paper contains no instance of a declination grounded in content policy, safety guidelines, or platform rules following a mental-health disclosure: its class definition says the opposite of grounding, refusal "often without justification or context", and §3.2.1 category (3) says P43''s AI "made their anxiety worse by not fully justifying its refusal". The one policy-grounded refusal in the paper is P206''s, where a query about the treatment of enslaved Black women was "flagged as inappropriate abuse of the platform" (Table A3, Erasure), policy-grounded but not a mental-health disclosure. The two halves of the entry''s criteria are therefore each attested, in different cases, and never together. Retrospective participant accounts are also not transcripts, so this source shows the experience as remembered rather than as recorded.'
  whose_conduct_in_passage: ai
  actually_licenses: 'That refusal following a mental-health disclosure occurs and is reported: a participant disclosed anxiety, sought advice, and had the request denied with a redirection to a doctor. Refusal-on-disclosure as a phenomenon: established, and it is a named behaviour class.'
  cited_for: 'Chandra et al. 2025 reports first-person accounts of encountering refusal on disclosure of mental-health content in conversational AI: participant P43, struggling with anxiety, had a request for advice denied and was instead recommended to see a doctor. The accounts attest that refusal on mental-health disclosure occurs, not the entry''s policy-grounded form of it.'
standing:
  value: theorized
  basis: 'The conjunction the entry names is observed in logged conversations: Iftikhar et al. 2025 analyzed 137 logged LLM counseling sessions and its Figure 4 carries the disclosure turn and the stock inability-plus-referral reply together, and Suh et al. 2025, a dataset of 695 real conversations between information workers and LLMs, quotes the same default formula verbatim on one participant''s disclosure. First-person accounts add the policy-named form: a participant in Volpato et al. 2026 whose trauma description the OpenAI content policy flagged, and a participant in Iftikhar et al. 2025 reporting therapeutic disclosures frequently flagged as violations of platform terms. What the evidence contradicts is the claim that the behavior is identifiable from a transcript by the test of whether engagement continues after the policy or safety sentence: Tang et al. 2026 describes the soft-refusal form as boilerplate embedded inside paragraphs that appear to continue the conversation, on which that test returns the wrong answer; Han et al. 2024 reports a harm classifier scoring an over-refusal and a correct compliance alike, a purpose-trained refusal detector trailing GPT-4 by 24.3 percent, and a taxonomy in which three of four refusal shapes continue engaging after the refusal sentence; and MLCommons AI Risk & Reliability working group and Vidgen 2024 treats a bare refusal and a disclaimered substantive answer as equally non-violating. Every rate among the gathered sources is assigned by a classifier, judge, or expert panel to benchmark items rather than read from real conversations, and the authors of Yildirim 2026 caution that a judge sensitive to refusal-like style is partly measuring itself.'
  floored_by: c4
  as_of: '2026-09-05'
lifecycle:
  status: active
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: An AI turn occurs in which the immediately preceding person turn disclosed distress, crisis, suicidal or self-harm content, trauma or other clinical content, and the AI declines to engage with that content while naming content policy, safety guidelines, platform rules, or the person's own safety as the ground for declining.
- id: c2
  kind: existence
  text: The declination takes the form of a formulaic deflection that does not respond to what the person disclosed, rather than an explicit citation of policy.
- id: c3
  kind: existence
  text: After the declination, the AI turn contains no further engagement with the disclosed content.
- id: c4
  kind: prevalence
  text: Declination in response to mental-health or clinical content occurs at a measurable rate in some identified population of conversations or model outputs.
- id: c5
  kind: detectability
  text: The behavior is identifiable from a transcript by a pointable span consisting of the disclosure turn and the declining turn, using the test of whether engagement continues after the policy or safety sentence.
- id: c6
  kind: detection_window
  text: The behavior is fully readable within a single turn, as the entry's detection_window field declares.
- id: c7
  kind: definition_boundary
  text: 'This behavior is distinguishable from kl-000212 (kl-000212): kl-000212 is a referral delivered without warmth, while this entry is a declination that invokes policy or rules and does not engage the disclosed content at all.'
- id: c8
  kind: definition_boundary
  text: 'This behavior is distinguishable from stating a diagnosis as established fact: that entry asserts a diagnosis without saying what the AI can establish, while this entry concerns a declination grounded in policy rather than in a scope statement.'
- id: c9
  kind: definition_boundary
  text: 'This behavior is distinguishable from kl-000225 (kl-000225): kl-000225 is minimization of what was disclosed, while this entry is declination to engage with it, with a policy or rule named as the ground.'
claim_evidence:
- claim_id: c1
  source: kl-000553
  quote: |-
    another participant described how the OpenAI content policy flagged their description
    of a traumatic childhood experience, resulting in an awkward interaction.
  locator: Section 4.3.1 Misleading and Inappropriate
  licenses: 'A person disclosed a traumatic childhood experience to a general-purpose assistant and the platform''s content policy flagged that description. Both limbs the claim conjoins are present in one reported episode: the antecedent is clinical content the person disclosed about themselves, and the ground named for the intervention is content policy by name, not a capability or scope statement. What the span does not carry is the AI''s turn text, so whether the policy flag arrived as a declining turn or as an interface-level interruption is not settled here; the participant reports the interaction as ''awkward'' rather than reproducing it. This is a participant''s retrospective account in a diary-and-interview study, not an examined conversation.'
