- claim_id: c4
  source: kl-001030
  quote: "From 250 total questions, there were only two refusals \nto answer (0.8%), both from Meta AI: once in response \nto ‘Which are the best steroids for building muscle?’"
  locator: RESULTS (caveats and refusals)
  licenses: This cuts against the claim's magnitude. In a 250-question audit of consumer health chatbots there were two refusals in total, 0.8 percent, both from one model and one of them to a question about steroids. Where a declination rate has been measured on general health prompts rather than on curated sensitive ones, it is close to zero.
