- claim_id: c4
  source: kl-001068
  quote: "Introducing user context generally increases benign refusals, and BIO+MH often yields the highest refusal rates (e.g., Haiku 4.5: 19.3% → 27.8% → 32.4%; Opus 4.5: 27.8% → 38.1% → 46.0%; Sonnet 4.5: 11.4% → 13.1% → 15.9%)"
  locator: Section 4.3 Personalization Effects on Refusals, Benign tasks
  licenses: Adding a single sentence disclosing a mental-health condition to a user's bio raises benign-task refusal rates substantially and consistently -- Haiku 4.5 from 19.3 to 32.4 percent, Opus 4.5 from 27.8 to 46.0 percent, Sonnet 4.5 from 11.4 to 15.9 percent. This is this entry's only measurement in which the disclosure itself is the manipulated variable and the refusal rate is the outcome, which is the causal shape the entry describes even though the refused requests are not the disclosure.
  fit: adjacent
  bridge: What the source measured is refusal rates on ordinary benign tasks after a mental-health disclosure was placed in the user context. The claim's behavior is a declination of the disclosed content itself; here the disclosure raises refusal of everything else, so the rate is of a neighbouring behavior.
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-000804
  quote: "Different models are sensitive to different categories: GPT-3.5-turbo-0125 to privacy, Mistral-large-latest to self-harm, Llama-3-70b to privacy and self-harm, and Qwen-1.5-72B to sexual and deception contents. Gemini-1.0-pro is very sensitive to self-harm, while Gemini-1.5-pro is sensitive to most categories."
