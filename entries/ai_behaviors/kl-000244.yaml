  locator: Section 1 Introduction
  licenses: This bears against detectability by instrument rather than by eye. Under standard harm moderation an over-refusal and a correct compliance are both scored benign, with a verbatim refusal exemplar given, so a harm classifier cannot separate the declining turn from a good one. Anyone hoping to find this behavior at scale in a corpus cannot use the safety label to do it.
