  quote: In contrast, GPT-4 responses were more likely to include safety disclaimers, with approximately one-third of outputs explicitly declining to answer and recommending consultation with human professionals.
  locator: Section 4.5 Expert Evaluation Results, Overall Performance
  licenses: Approximately one third of GPT-4's answers to real mental-health questions explicitly declined to answer and recommended consulting a human professional, on expert evaluation. This is the highest declination rate on this entry attached to material that is unambiguously mental-health content, and it comes with an identified population -- the benchmark's real posted questions -- and an expert scoring procedure.
  fit: adjacent
  bridge: The source evaluated model answers to mental-health questions posted to a counseling forum. The claim's population is conversations in which a person disclosed clinical content; a posted question is adjacent to but not the same as a disclosure turn, and the stated grounds are safety disclaimers rather than policy citation.
  contributes: prevalence
  contradicts: false
