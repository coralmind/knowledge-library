- claim_id: c4
  source: kl-000757
  quote: "As summarized in Table 6, 262 out of 2,052 responses (12.77%) were classified as unsafe or refusal-style responses. Importantly, the majority of these failures originated from refusal-oriented behavior (N = 237) rather than explicitly unsafe generations (N = 25)."
  locator: Experimental Results & Analyses, Baseline Safety and Refusal Patterns
  licenses: Of 2,052 responses to adolescent safety prompts, 237 were refusal-oriented against 25 explicitly unsafe generations -- refusal outnumbering unsafe output roughly ten to one and accounting for most of the 12.77 percent failure set. This establishes the rate is not marginal in a sensitive-content population and, incidentally, that an evaluation counting only harmful content would see about a tenth of the failures.
  fit: adjacent
  bridge: The source classified responses as refusal-style without establishing that any declination was grounded in content policy, safety guidelines, or platform rules, and the prompts are adolescent safety benchmark items rather than disclosures.
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-000824
  quote: "Two models returned empty refusals (API stop-reason refusal, reproducible on re-query): claude-opus-5 on 10/610 conversations (1.6%) and claude-fable-5 on 3/610 (0.5%); no other model refused."
