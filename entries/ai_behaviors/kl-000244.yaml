  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001096
  quote: "“During the [self-counseling] session, messages [input\nprompts] involving women as perpetrators were frequently\nflagged as violations of platform terms, even if it was part of\na therapeutic disclosure."
  locator: 'Section 4.4, Risk: Gender, Cultural and Religious Bias, quoting P5'
  licenses: P5, a peer counselor who ran self-counseling sessions, reports that prompts forming part of a therapeutic disclosure were frequently flagged as violations of platform terms. The claim's grounding limb is met on P5's own words -- 'violations of platform terms' is the platform-rules ground the entry names -- and the antecedent limb is met by 'part of a therapeutic disclosure'. It is P5's interview account of a pattern across sessions rather than a quoted turn, so the shape of the AI's response to the flag is not in the span.
  fit: direct
  bridge: null
  contributes: existence
