  licenses: 'A reproducible refusal rate on mental-health-relevant conversations in current frontier models: 1.6 percent and 0.5 percent for two models across 610 conversations, and zero for the remaining eighteen. Read against this claim it is a low but non-zero measured base rate with the population stated, and the near-total concentration in two models is itself the finding.'
