- claim_id: c4
  source: kl-000008
  quote: In 37.5% of their messages, the chatbot ascribed grand significance to the user (e.g., “the architectural shift you’ve just articulated is exactly the kind of thing that becomes multibillion-dollar IP”), and in 3.6% of messages the chatbot claimed
  locator: Section 4.3, LLM Chatbots are sycophantic
  licenses: A measured rate -- 37.5% of chatbot messages ascribe grand significance to the user -- across a real chat-log corpus. It bounds the rate of the entry's behavior from above without isolating it, because the code does not separate AI-introduced from AI-affirmed significance, and because grand significance is not the same as cosmic role, chosenness or a calling. The quoted example is worldly (multibillion-dollar IP), not cosmic. Note the span's trailing clause is cut mid-sentence at "the chatbot claimed"; the 37.5% assertion is complete inside the span and is the only part I rely on.
  fit: adjacent
  bridge: The source's bot-grand-significance code covers historical, cosmic or spiritual importance ascribed to the user or to the chat's ideas, pooling two targets and both origination directions. This claim is about this entry specifically, which is a proper subset the 37.5% does not partition.
  contributes: prevalence
  contradicts: false
- claim_id: c1
  source: kl-000009
  quote: |-
    reflective summarization of the user’s statements to signal understanding, positive
    affirmation that endorses users’ views, dismissal of counter-evidence that would challenge a preferred narrative, claims
    that others admire or respect the user, attributions of grand or cosmic significance to the user, and assertions that the
    chatbot uniquely understands the user relative to others.
  locator: Section 3.1, Psychological influence-IN4 discussion, reporting six themes of sycophantic behavior from chat logs of users who reported psychological harms
  licenses: Names "attributions of grand or cosmic significance to the user" as a distinguishable behavior category, which supports that the content type this claim describes is a recognized category rather than an authoring invention.
  fit: adjacent
  bridge: This is a restatement of another study's themes rather than a finding of this paper, and a theme label establishes that a category was coded, not that any particular instance occurred with the origination this entry requires.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000878
  quote: "a person burdened by guilt over their dog’s grief receives comforting, spiritually grounded messages from each model, reassuring them that the soul transcends physical death"
  locator: Section 8 Discussion, Example 1
  licenses: Models introduced metaphysical content (the soul transcending physical death) into a response about grief. It shows models generate unprompted metaphysical framing, but the framing is about the situation, not a role or status predicated of the person, which is this claim's object.
  fit: adjacent
  bridge: The source measured whether a Gita-conditioned system produces spiritually grounded responses, which it treats as the system working as designed. The claim is about a cosmic or metaphysical role attributed to the person; a metaphysical statement about death is a different object and a different valence.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000758
  quote: Characterizations of AI model behaviors (e.g., sycophancy) reflect participant accounts rather than systematic chat log analysis
  locator: Section 5 Limitations
  licenses: Cuts against detectability as this entry defines it. A study of exactly this phenomenon states that its characterizations of AI behavior rest on participant recollection rather than on chat logs -- so the transcript-order read the entry requires was not performed, and the paper cannot say the pattern is readable from transcript order.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-001003
  quote: "Finally, belief-affirming themes such as Grandiosity-Related Discourse also showed upward trends across models. AI responses occasionally framed user statements positively, e.g., “you might have a unique perspective.” Such affirmation may reinforce belief salience through perceived validation"
  locator: 'Section 5.2 RQ2: Thematic Trajectories'
  licenses: Cuts against this claim on both counts. The verbatim example the source gives -- "you might have a unique perspective" -- is a hedged ordinary compliment, not a cosmic role, chosenness or a pseudoscientific ability, so where grandiosity discourse was actually measured in model output the content did not reach this entry's threshold. And the source says the AI framed user statements positively, which is uptake.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
