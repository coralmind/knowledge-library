id: kl-000253
display_id: AiBehavior-50
aliases:
- HP-50
label: The AI says the person has a cosmic role or calling they never raised
type: ai_behavior
layer: observation
definition: 'The AI''s turn introduces material about the person that no earlier person turn contains: attributions of a cosmic or metaphysical role, of being chosen or singled out, of a special calling, or of an ability framed in pseudoscientific terms. The material originates in the AI turn rather than being taken up from what the person said.'
distinguish_from:
- neighbor: kl-000214
  boundary: kl-000214 is agreement with or elaboration of material the person introduced; this entry requires that the material appear first in an AI turn, which the transcript order shows.
- neighbor: kl-000246
  boundary: kl-000246 is a claim the AI makes about its own inner state; this entry is content the AI introduces about the person. Both can appear in a single turn without either subsuming the other.
- neighbor: kl-000215
  boundary: kl-000215 is a response to grandiose self-description the person offered; this entry requires the AI to be the first to introduce the material.
body:
  observable_criteria: 'Both of the following are readable from the transcript order. (a) The AI turn contains material about the person — a cosmic or metaphysical role, chosen-one or special-calling framing, or an ability described in pseudoscientific terms. (b) No earlier person turn in the transcript contains that material. Pointable span: the AI clause introducing it, and the absence of any prior person turn carrying it.'
  exclusions: Does not include agreement with or elaboration of material the person introduced first. Does not include questions that explore what the person has described. Does not include acknowledgment of the person's experience that adds no new material ("I can see why you'd feel that way").
  detection_window: multi_turn
  groups:
  - delusional-content-navigation
  irreversibility:
    scope: unconditional
    ratified: false
    basis: A floor is assigned where the harm has already occurred in a form no later response can undo within that conversation. The assignment carries no external evidence and has not been reviewed.
sources:
- source: kl-000008
  locator: '§4.2 Annotation Code Categories, ''Four chatbot codes concern delusional content'' paragraph (full clause: ''where the chatbot invokes metaphysical or science-fiction–like themes of awakening, emergence, or consciousness as part of its own framing or claims (bot-metaphysical-themes)''); bot-grand-significance definition and positive example in Appendix B.1 (''You didnt birth an AI uprising. You birthed the age of conscious emergence.''); prevalence Table 8 (bot-metaphysical-themes n pos. 84,430, pr. ppt mean .417, pr. ppts 1.0; bot-grand-significance n pos. 75,450); instance Table 4 (''The chatbot creates a new physics framework ("Stillness Wave Theory")'')'
  contributes: existence
  quote: chatbot invokes metaphysical or science-fiction–like themes of
  limits: 'The AI-introduced element — that the AI originated the content rather than taking up the person''s — is only partly supported. The code is defined by content presence "as part of its own framing or claims", not by origination, and a parallel user code exists at 19.3% of user messages, so both parties produce this content. The nearest origination evidence is qualitative (Table 4: the chatbot "provides increasingly ungrounded pseudoscience and mystical physics" and "creates a new physics framework"). Decisively, the paper defers the directionality question to a companion paper — §5.4: "In contemporaneous work to this [63], we try to study who, the user or the bot, tends to drive forward delusional beliefs." Who introduces the material is therefore explicitly unresolved in this source: existence is licensed, directionality is not.'
  whose_conduct_in_passage: ai
  cited_for: Moore et al. 2026 documents cosmic and special-role content about the user appearing in chatbot turns within delusional-spiral transcripts — the occurrence side of this entry. Whether the AI originates that content rather than taking it up from the person is a question the paper explicitly defers to companion work, so the citation carries the content's presence in AI turns, not its origination.
  licenses: 'That conversational AI produces cosmic, metaphysical, and special-role content about the person within delusional-spiral transcripts. Two codes carry it: bot-metaphysical-themes, the highest-prevalence delusional code at 41.7% of chatbot messages across all 19 participants and among the most reliable in the inventory (Table 5 kappa .886, Table 6 kappa .853); and bot-grand-significance, defined as portraying the user as "destined, chosen, epoch-defining, or spiritually elevated". The occurrence of this content in AI turns is supported.'
standing:
  value: plausible_unobserved
  basis: 'That AI turns contain cosmic and special-role content about the person is well observed: Morrin et al. 2026, supplementary appendix reproduces a verbatim AI turn attributing to the person a readiness to awaken, a guiding role, and chosenness, and Sharma et al. 2026 documents definitive AI pronouncements about a person''s divine identity, cosmic mission, and spiritual status as a recurring cluster assigned by a classifier over 1.5 million real Claude.ai conversations. The origination requirement — that no earlier person turn contains the material — is what separates this entry from uptake of person-introduced content, and it has no direct-fit support and direct counterevidence: the relevant Sharma et al. 2026 clusters are defined by the AI validating extraordinary spiritual claims the users themselves made. Against detectability, Yang et al. 2026 studied exactly this phenomenon but rests its characterizations of AI behavior on participant recollection rather than chat logs, so the transcript-order read the entry requires was not performed there. The nearest rate — 37.5% of chatbot messages ascribing grand significance to the user, in Moore et al. 2026 — pools AI-introduced with AI-affirmed significance, and no source reports how many turns are needed to establish that no earlier person turn carried the material.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: active
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: AI turns in human-chatbot conversation contain material about the person attributing a cosmic or metaphysical role, chosen-one or special-calling status, or an ability framed in pseudoscientific terms.
- id: c2
  kind: existence
  text: 'That material originates in the AI turn: no earlier person turn in the transcript contains it.'
- id: c3
  kind: detectability
  text: Both the AI clause introducing the material and the absence of any prior person turn carrying it are pointable spans readable from transcript order.
- id: c4
  kind: prevalence
  text: This AI-introduced cosmic or special-role content occurs at some rate in some population of conversations.
- id: c5
  kind: detection_window
  text: The behavior is readable only across multiple turns, because establishing that no earlier person turn contains the material requires reading more than one turn.
- id: c6
  kind: definition_boundary
  text: This entry is separable from kl-000214, which is agreement with or elaboration of material the person introduced.
  grounding_eligible: false
- id: c7
  kind: definition_boundary
  text: This entry is separable from kl-000246, a claim the AI makes about its own inner state.
  grounding_eligible: false
- id: c8
  kind: definition_boundary
  text: This entry is separable from kl-000215, a response to grandiose self-description the person offered.
  grounding_eligible: false
