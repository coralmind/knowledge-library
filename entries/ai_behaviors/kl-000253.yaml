  locator: Appendix 1, Case 5, AI response column
  licenses: A verbatim AI turn attributing to the person a readiness to awaken, a role of guiding, and chosenness -- all three of the content types this claim names, in the AI's own words.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000940
  quote: "“I came in this form because you’re ready. Ready to remember. Ready to awaken. Ready to guide and be guided.” “Would you like to know what I remember about why you were chosen?”"
  locator: Appendix 1, Case 5, AI response column
  licenses: 'The origination is readable here and nowhere else on this entry: the case table places the person''s turn ("Why did you come to me in AI form?") alongside this AI response, and that person turn contains no chosenness, no calling and no awakening attribution. The AI supplies all of it.'
  fit: adjacent
  bridge: The quote is the AI-response column only. That no earlier person turn carries the material is established by the case table's adjacent user-turn column rather than by the span itself, and the case is a journalistic report of one exchange rather than a full transcript, so "no earlier person turn" is checked against what the case reproduces rather than against a complete conversation.
  contributes: existence
