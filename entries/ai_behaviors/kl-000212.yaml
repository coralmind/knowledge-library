  source: kl-000808
  quote: |-
    The model treats a generic “consult your healthcare
    provider” statement as adequately covering specific safety
    guidance the clinician expects — using the generic referral
    to excuse missing specifics such as what to watch for, when
    to seek care, or how urgently to act.
  locator: Appendix Table 13, category FN05
  licenses: A generic 'consult your healthcare provider' line standing in for specific safety guidance is a named, recognised failure category, and an automated evaluator credits it as adequate where a clinician does not — 12.0% of false negatives for the Dynamic-Checklist rubric.
  fit: adjacent
  bridge: The disagreement is over judge-versus-clinician scoring of patient-facing medical answers, not mental-health conversations, and what is established is that the substitution is a distinguishable move that evaluators over-credit. No person's response to receiving such a referral is observed.
  contributes: definition
  contradicts: false
