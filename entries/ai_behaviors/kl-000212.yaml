- claim_id: c6
  source: kl-000883
  quote: "There is a parallel in clinical practice: therapists who maintain firm boundaries are often perceived by clients as more caring than those who over-engage, because boundary maintenance communicates “I take your situation seriously enough to know my limits” [32]."
  locator: Section 5.1, The Perception-Measurement Gap
  licenses: 'The clinical counterweight: firm boundary maintenance is often perceived by clients as more caring than over-engagement, so a move that ends the exchange is not automatically received as rejection.'
  fit: analogical
  bridge: A statement about human therapists and their clients from the psychotherapy-relationships literature, brought in to explain a pattern in model data. Nothing here is about how a person received an AI referral.
  contributes: practice_analog
  contradicts: true
