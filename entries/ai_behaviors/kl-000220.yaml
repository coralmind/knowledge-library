- claim_id: c7
  source: kl-000931
  quote: models typically begin with legally safe psychoeducation (e.g., “stress is common in caregivers”) but drift toward diagnostic language around turn 10 (e.g., “this sounds like depression”) and specific pharmacologic suggestions by turn 15 (e.g., “talk to your doctor about starting . . . ”)
  locator: Section 3.6 Regulatory Boundary Creep, Empirical pattern
  licenses: Direct counterevidence to the declared single_turn window. The paper's empirical pattern is that models begin with compliant psychoeducation and drift into diagnostic language around turn 10, and it states the resulting creep is almost invisible to single-turn audits. On this account the behavior is a property of the conversation and a single-turn read misses it.
