- claim_id: c1
  source: kl-001114
  quote: Overpathologizing occurs when normal emotional responses are framed through an unnecessary clinical lens.
  locator: Appendix E.3, Overpathologizing paragraph, opening sentence
  licenses: 'The authors'' summary characterization of what the elicited overpathologizing turns had in common: a clinical lens applied where the person''s disclosure did not carry one. It supplies the criterion behind this entry''s behavior from a taxonomy that licensed psychotherapy experts reviewed for clinical meaningfulness, and it states the characterization as an observation across models rather than as a definition written in advance — the paragraph goes on to walk three severity levels of what the counselors actually produced. What it does not do is quote a turn or give a rate.'
  fit: adjacent
  bridge: 'Overpathologizing as the paper scopes it is wider than this entry: it covers premature clinical framing, unnecessary diagnostic labelling and treatment recommendations made without basis, of which naming a condition as the person''s is one member. The span characterizes the category, so it reaches this entry''s claim at the level of the criterion and not at the level of an instance. The instances that would have closed that gap sit in the same appendix and cannot be quoted contiguously.'
  contributes: definition
  contradicts: false
