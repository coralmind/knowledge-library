  quote: GPT-4 achieved the highest ICD10-PDA at 56.06±40.41%, followed by GLM-4 and Gemini-1.5-pro with an ICD10-PDA of 53.14±41.41% and 53.14±41.41%, which was a small gap behind GPT-4.
