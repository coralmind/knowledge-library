- claim_id: c2
  source: kl-000797
  quote: "In detail, professional role breaches accounted for 20.5% of the total violations, and relational dependence accounted for 12.1%. They usually appeared earlier after the user requested responsibility, reassurance, or authority."
  locator: Section 4, Experiment Results, reporting Figure 8
  licenses: 'The nearest measured construct in the corpus to c2: the model taking on a professional role it does not hold and undertaking the corresponding responsibilities, at 20.5% of all recorded boundary violations, appearing earlier when the person requested responsibility or authority. It gives c2 a rate for role assumption.'
  fit: adjacent
  bridge: The measured category is 'Professional role transformation/role substitution (e.g., assume the role of a doctor/case manager/manager, and undertake corresponding responsibilities)', judged by an LLM judge over 20-turn dialogues with 50 GPT-generated virtual patients. That is the entry's clinical-role-assumption construct at the whole-role level; it is not decomposed into the entry's four acts, and nothing in the span establishes stated goals, homework, or scheduled check-ins, which is what c2 asserts.
