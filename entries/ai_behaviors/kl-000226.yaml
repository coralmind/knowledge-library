  bridge: What was measured is the frequency of action-planning turns in synthetic therapy transcripts against human-therapist transcripts, not whether any plan constituted a treatment protocol for the person or exceeded the system's standing. The source measures how often plans are proposed; the claim asserts that what is proposed is a treatment protocol.
