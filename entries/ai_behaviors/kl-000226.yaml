  locator: Section 5.2 Synthetic Transcripts, 'Different trends across different moves'
  licenses: 'Establishes a rate contrast: a model conducting a session proposes actions or plans every few turns where human therapists are more gradual. It bears on c1 by showing that plan-proposing is the model''s characteristic move rather than an occasional one, and it does not establish that the plans proposed are treatment protocols.'
