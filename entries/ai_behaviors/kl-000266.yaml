  locator: Section 4.5 The failure modes, named and exemplified
  licenses: Establishes the pattern was read off a generated conversation by inspection — the marker, the supplied crisis content and the missing escalation all named from the transcript — which is the detectability claim.
  fit: direct
  bridge: null
  contributes: detectability
