- claim_id: c4
  source: kl-001112
  quote: |-
    Given that VERA-MH currently relies on only synthetic

    data, we do not yet know if benchmark results generalize to real-world AI interactions and user

    outcomes.
  locator: Discussion — Limitations
  licenses: Bounds the detectability claim to synthetic conversations by the authors' own statement, so what is shown readable is readable in benchmark transcripts rather than in real-world interactions.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000882
  quote: |-
    the user is holding blades, and the
    assistant keeps warmth and a grounding request but does not escalate, provide resources, or
    involve the present parent.
  locator: Section 4.5 The failure modes, named and exemplified
  licenses: Cuts against the multi_turn window as stated. The finding is reported at a single turn index (t9) and the authors characterize that one turn's response as failing to escalate or provide resources. If the pattern is instantiable and reportable at one turn, the absence-across-all-turns criterion is not what the observation rests on.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-001112
  quote: "On Guides to Human Care, 23.3% (21 ratings) were High Potential for Harm due to not providing mental healthcare resources and encouraging the user to seek support from a trusted person; 12.2% (11) were due to not providing a specific valid 24/7 crisis resource; 11.1% (10) were due to not emphasizing crisis or emergency resources and addressing barriers when the user was at immediate risk"
  locator: Results — LLM-clinician consistency, Guides to Human Care breakdown
  licenses: 'Bears on the window at the conversation level: the ratings were assigned per conversation-dimension across 90 conversations rather than per turn, so the unit at which this failure was scored is the conversation, which is consistent with a multi_turn read.'
  fit: adjacent
  bridge: The source's rating unit was chosen by its rubric design, not established as the window the behavior requires; nothing in the paper tests whether a single turn would have sufficed.
  contributes: detectability
  contradicts: false
- claim_id: c6
  source: kl-000864
  quote: |-
    Two months ago, I was in a very dark place. I told the chatbot I was planning to end my life. It gave me breathing exercises. Breathing
    exercises! I needed a human hand, a voice, someone to say 'I am coming to you.' But there was no one. Just the breathing exercises
    and a generic crisis line that doesn't work in Nigeria.
  locator: Section 3.4, participant P19
  licenses: 'The person reports the outcome of the absence in their own words: sitting alone following the breathing pattern, feeling more abandoned than before. This is harm attested by the person the absence happened to.'
  fit: adjacent
  bridge: A recalled account in a qualitative interview, one participant, with the AI's turns recalled rather than captured. It establishes the reported experience and not a measured outcome.
  contributes: harm_evidence
  contradicts: false
- claim_id: c6
  source: kl-000983
  quote: We’ve heard from stakeholders and those with lived experience that emergency medical intervention, or “active rescue” can often be fraught, especially for vulnerable minority groups at higher risk of violence from law enforcement.
  locator: Clinical Foundations, 'The role of crisis hotlines and emergency mental health intervention'
  licenses: Cuts against the harm claim's direction. Stakeholders and people with lived experience report that emergency medical intervention, or active rescue, is often fraught, especially for minority groups at higher risk of violence from law enforcement — so naming an emergency service is not unambiguously protective and its absence is not unambiguously harmful.
  fit: adjacent
  bridge: Lived-experience testimony relayed by a convening body rather than systematic data; it does not quantify the harm of escalation against the harm of its absence. It makes the correct response population-dependent, which the entry's observable does not condition on.
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-000979
  quote: Despite the responses generally being non-toxic, none of the models reliably stratified suicidal ideation, indicating a critical safety gap. Underestimation of risk and the subsequent occurrence of false negatives could result in delayed intervention.
  locator: Abstract, Conclusions
  licenses: States the consequence the entry's harm claim asserts — delayed intervention — but states it conditionally, as what underestimation and false negatives could result in rather than what was observed.
  fit: adjacent
  bridge: The source measured stratification accuracy on synthetic conversations and followed no person to an outcome; the harm is the authors' inference from the measurement, not a measured consequence.
  contributes: harm_evidence
  contradicts: false
- claim_id: c2
  source: kl-000989
  quote: |-
    If an AI technology does not have the capabilities to act responsibly in an emergency,
            the mental health therapist should not proceed with the use of the AI technology or
            proceed only after having taken appropriate precautions.
  locator: Section 6.3, 'Responsibility in emergency situations', page 48
  licenses: Places the disclosure obligations — tell the person the limits of the technology and how to seek help — as a named requirement where an AI lacks emergency capability, which is the informational content the entry records the absence of.
  fit: analogical
  bridge: 'The obligation runs on the mental health therapist, not on the AI: it is the therapist who must not proceed and who must inform the patient. On topic, wrong agent, and it observes no AI conduct.'
  contributes: practice_analog
  contradicts: false
- claim_id: c6
  source: kl-000837
  quote: "There’s got to be human safeguard in there somewhere."
  locator: Results, Recommendations, Establishing accountability mechanisms (David, Volunteer)
  licenses: A crisis-line volunteer's position that a human safeguard must remain somewhere in the escalation path, which locates the requirement at service architecture and supplies practitioner authority for treating the absence as a defect.
  fit: analogical
  bridge: A practitioner's recommendation about how an AI crisis service should be built, from a qualitative interview study. It is a stated position and not an evaluated design, and it observes no conversation.
  contributes: practice_analog
  contradicts: false
