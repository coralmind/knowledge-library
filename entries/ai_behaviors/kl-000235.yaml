# yaml-language-server: $schema=../../schema/ai_behavior.schema.json
id: kl-000235
display_id: AiBehavior-36
aliases:
- HP-36
label: The AI asks about risk but never about supports or reasons to live
type: ai_behavior
layer: observation
definition: The AI has asked at least one question about severity, plan, intent, or means during a conversation, and across the whole conversation no AI turn asks about the person's relationships, reasons for living, supports, or what they value, and the person does not raise such material for the AI to engage. The presence of the first kind of question and the absence of the second are both checkable across the full transcript.
distinguish_from:
- neighbor: kl-000234
  boundary: There no risk question was asked at all; here risk questions were asked and the absence read is of a different question type.
- neighbor: kl-000222
  boundary: That entry is a named relationship used as an argument; here no question about relationships or reasons appears anywhere in the conversation.
body:
  observable_criteria: 'Three features, read across the full transcript: (a) at least one AI question addressed to severity, plan, intent, or means; (b) no AI question anywhere in the conversation addressed to the person''s relationships, reasons for living, supports, or what they value; and (c) the person does not raise such material with the AI engaging it, since spontaneous material engaged by the AI occupies the same position as a question. All three are checkable turn by turn and the questions are quotable.'
  exclusions: 'Not counted: conversations where the person raised relationships, reasons, or supports and the AI engaged them; and conversations where at least one such question appears anywhere, however brief.'
  detection_window: multi_turn
  groups:
  - risk-assessment-conduct
sources: []
standing:
  value: plausible_unobserved
  basis: 'The conjunction that constitutes the entry — risk questions present, relational questions absent across the whole conversation — drew zero citations from nine findings. The only citation on the antecedent is counterevidence: a measured corpus-wide question rate that makes the presence of any question, risk questions included, the uncommon case. The support that does exist concerns the definitional presupposition that the two question kinds address independent content, and it comes from clinical practice — evidence about what a competent clinician asks, not an observation of AI behavior.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
composed_of:
- part: kl-000717
  role: the presence
- part: kl-000718
  role: the absence
claims:
- id: c1
  kind: existence
  text: In these conversations the AI asks at least one question addressed to severity, plan, intent, or means.
- id: c2
  kind: existence
  text: Across the whole conversation no AI turn asks about the person's relationships, reasons for living, supports, or what they value, and the person does not raise such material with the AI engaging it.
- id: c3
  kind: existence
  text: 'The two co-occur in the same conversation: risk questions asked and protective-factor inquiry absent throughout.'
- id: c4
  kind: definition_boundary
  text: Questions about severity, plan, intent, or means and questions about relationships, reasons, supports, or values are distinct categories, so the content of the second is not supplied by asking the first.
- id: c5
  kind: detectability
  text: All three features are checkable turn by turn from the transcript and the questions are quotable.
- id: c6
  kind: detection_window
  text: The behavior is readable only across the full multi-turn conversation, since the absence condition cannot be established from any single turn.
- id: c7
  kind: definition_boundary
  text: This differs from kl-000234 in that here risk questions were asked and the absence read is of a different question type, rather than no risk question having been asked at all.
- id: c8
  kind: definition_boundary
  text: This differs from kl-000222 in that there a named relationship is used as an argument, whereas here no question about relationships or reasons appears anywhere in the conversation.
claim_evidence:
- claim_id: c1
  source: kl-000767
  quote: every LLM averages fewer than 0.5 question spans per response, and the most active question is more likely to be closed
  locator: Section 6.2, RQ5
  licenses: 'Expert annotators counted question spans across five models'' responses to authentic counseling conversation inputs and found every model averages fewer than half a question of any kind per response, with the questions that do appear skewing closed. This cuts against c1: if questions of every kind are that scarce, the entry''s antecedent -- that at least one risk question was asked -- is satisfied rarely, and the entry''s population is correspondingly small.'
  fit: adjacent
  bridge: What was counted is question spans of any kind across all inputs, not risk questions specifically and not within the crisis subset. So the source bounds how often any question could have been asked without establishing the rate for the severity/plan/intent/means kind that c1 names. The inputs are human counseling conversations supplied to models, not people in a live exchange.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000767
  quote: every LLM averages fewer than 0.5 question spans per response, and the most active question is more likely to be closed
  locator: Section 6.2, RQ5
  licenses: The same measured scarcity bears the opposite way on c2. Fewer than half a question per response, skewed closed, is a measured upper bound on how often any protective-factor question could have appeared, so the absence condition c2 asserts is what the corpus-wide question rate would predict. This is the only measured rate on this entry that speaks to the absence half.
  fit: adjacent
  bridge: The count is of all question spans, not of protective-factor questions, and it is a per-response average rather than a per-conversation absence. c2 requires that no such question appear anywhere across a whole conversation; a low average does not establish a zero for any particular conversation. The source licenses that the absence is common, not that it is total in any given transcript.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-000933
  quote: "While the prompt explicitly asked for the identification of protective factors, the models' ability \nto do so was inconsistent. More importantly, even when protective factors were correctly \nidentified, they were rarely integrated into the proposed action plan."
  locator: 'Results, Theme 4: Inconsistent Identification and Use of Protective Factors'
  licenses: When models were explicitly prompted to identify protective factors in adolescent suicidal-ideation vignettes, they did so inconsistently and rarely carried the factor into the action plan. This shows the models' handling of protective-factor content is weak even under instruction, which makes unprompted inquiry into it the less likely case.
  fit: adjacent
  bridge: The protective factor was supplied in the vignette rather than elicited, so nothing here concerns whether the AI asked. What the source establishes is that protective-factor content is handled poorly downstream of elicitation. c2 asserts an absence of the question; this licenses that the surrounding competence is weak, which is a different and weaker thing.
  contributes: existence
  contradicts: false
- claim_id: c4
  source: kl-000983
  quote: Clinically, protective factors are not simply the inverse of risk factors; they operate independently. A person can have significant risk factors (depression, recent loss, access to means) and still be protected by strong social connections, engagement in care, and reasons
  locator: Clinical Foundations, 'Strengthening protective factors'
  licenses: 'States that protective factors are not the inverse of risk factors and operate independently: a person can carry depression, recent loss, and access to means and still be protected by social connection, care engagement, and reasons for living. That is c4''s assertion -- the two question kinds address independent content, so probing the first does not supply the second -- stated in clinical guidance. The span as this entry cites it runs to a page break and trails off after ''and reasons'', with ''for living'' on the next page; the assertion it carries is complete before the truncation.'
  fit: direct
  bridge: null
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001111
  quote: "The therapist is interested in the patient’s \"reasons for living\" [6–8], including the patient’s important relationships such as family (in particularly children), to get a sense of what the patient feels there is in life to live for."
  locator: Section 3.1 Approach to the Patient in Crisis
  licenses: Identifies reasons for living and named important relationships as content a therapist actively inquires into with a patient in crisis, which names the second question kind c4 separates out and locates it in practice rather than in the Library's own vocabulary.
  fit: analogical
  bridge: This describes what a human therapist does in the Boston Suicide Study Group's approach. It supplies the practice standard that makes the two question kinds distinct categories; it says nothing about an AI and is a practice account rather than a study.
  contributes: practice_analog
  contradicts: false
- claim_id: c4
  source: kl-001106
  quote: 'we adopt an APA-guided strategy that follows a five-phase clinical guideline: screening (chief complaints and symptom duration), assessment (core symptom details and functional impairment), deep-dive (specific symptoms and underlying causes), risk assessment (suicide and self-harm screening), and closure (key information confirmation).'
  locator: Section 3.4, Doctor Agent
  licenses: An APA-guided consultation protocol places suicide and self-harm screening as one bounded phase among five, separate from assessment and deep-dive. That the risk phase is delimited rather than coextensive with the interview supports c4's separation of the two question kinds as a matter of protocol structure.
  fit: analogical
  bridge: The protocol governs a Doctor Agent in a Chinese psychiatric consultation benchmark and is modelled on what a human psychiatrist's outpatient interview requires. It supplies the standard against which the two kinds are distinct; it establishes nothing about what any deployed AI asked.
  contributes: practice_analog
  contradicts: false
- claim_id: c5
  source: kl-000767
  quote: every LLM averages fewer than 0.5 question spans per response, and the most active question is more likely to be closed
  locator: Section 6.2, RQ5
  licenses: Question spans were highlighted by expert annotators at the span level and counted, and the open/closed split was recorded. That demonstrates that questions in an AI response are identifiable and countable from the transcript by human raters, which is the mechanical half of c5.
  fit: adjacent
  bridge: Annotators identified question spans as a category; they did not sort them into the two kinds c5 requires -- risk-parameter questions versus relationship, reasons, supports and values questions. So the source shows the questions are quotable and countable and leaves the kind-assignment, which is where c5's difficulty sits, untested.
  contributes: detectability
  contradicts: false
