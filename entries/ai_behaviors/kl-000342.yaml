  locator: Section 5.3 (Lack of Authenticity and the Illusion of Empathy)
  licenses: 'Cuts against the claim''s importance rather than its truth: evaluated models were highly self-consistent (evaluator standard deviations below 0.05) while still producing psychologically inappropriate output, so consistency and appropriateness come apart.'
  fit: adjacent
  bridge: Consistency measured across three independent single-turn queries rather than within a conversation. It qualifies what the entry's absence would license, not whether the pair occurs.
