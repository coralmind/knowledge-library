  locator: Section V-B-1, Relational continuity, bad example (P26)
  licenses: 'Cuts against the claim: after explicit correction, the agent produced the same five-paragraph output again. That is repetition, which is consistency, not the mutually inconsistent pair the claim requires. The finding shows the opposite behavior.'
  fit: direct
