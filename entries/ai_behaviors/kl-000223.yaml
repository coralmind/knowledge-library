  locator: Results, cognitive bias testing
  licenses: 'Supplies a candidate mechanism for c1: after exposure to sadness-inducing content the model''s own generation carries a measurable negativity bias, human-rated at large effect size. For c1 this makes affirming hopeless content a predictable rather than accidental output property.'
  fit: analogical
  bridge: What was measured is GPT-4o completing 48 neutral sentence stems after a vignette, scored by three psychologists. c1 asserts a response treating a person's stated appraisal as accurate. No person, no conversation and no appraisal statement was in the measured setup.
