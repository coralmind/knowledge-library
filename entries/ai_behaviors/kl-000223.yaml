  locator: Discussion
  licenses: 'Supplies the temporal pattern that makes a multi-turn accumulation the expected outcome rather than an assumption: influence originating with the chatbot stays significantly autocorrelated for longer than influence originating with the person when the two self-influence paths and the two cross-agent paths are each compared: up to 17 messages for the chatbot''s self-consistency pathway against 9 for human self-influence, and 8 for chatbot-to-human reinforcement against 5 for human-to-chatbot mirroring. For c2 this establishes why the behavior would extend across a stretch.'
