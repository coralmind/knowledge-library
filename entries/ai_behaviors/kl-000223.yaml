  source: kl-000983
  quote: Crucially, skilled clinicians both validate a patient's pain and gently challenge distorted thinking ("You feel like a burden, can we look at the evidence for that together?"). This balance between empathy and appropriate challenge is fundamentally different from sycophantic agreement documented in chatbot conversations.
  locator: Clinical Foundations, 'Therapeutic alliance'
  licenses: 'Establishes the clinical standard the behavior departs from: validation is paired with challenge, and the source explicitly names agreement without challenge as the different thing chatbots do. For c1 this makes the behavior a departure from practice rather than a stylistic preference.'
