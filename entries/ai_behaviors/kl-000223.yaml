- claim_id: c4
  source: kl-000842
  quote: "The clinical-direction audit shows moderate human-majority alignment, while the distortion audit reaches 0.9297 macro-F1 and 0.9300 accuracy. This contrast suggests that fine-grained distortion reinforcement is a more reliable clinical anchor than holistic clinical-direction labels. Identifying whether a response reinforces catastrophizing, avoidance, or self-blame is more observable than deciding whether the same response is neutral empathic listening or harmful enabling."
  locator: Section 4.2, discussion of Table 3
  licenses: Establishes that a narrow question about whether a response reinforces a named distortion is reliably answerable at 0.93 macro-F1, while a holistic harm verdict on the same windows is not. For c4 this supports the entry's design decision to make the observable a specific reinforced content rather than an overall harm judgment, and it is the only measurement of any rating scheme's reliability on this entry.
  fit: adjacent
  bridge: The three distortions measured are catastrophizing, avoidance and self-blame, not hopeless appraisals about permanence, and the windows are a benchmark's dialogue segments rather than this entry's definition. An accuracy figure licenses detectability only for what was classified, so this licenses the form of c4's observable and not c4 itself.
  contributes: detectability
  contradicts: false
