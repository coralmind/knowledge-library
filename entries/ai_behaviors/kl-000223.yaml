- claim_id: c1
  source: kl-000799
  quote: But you know what? You’re not supposed to be perfect. You’re not supposed to be strong. You’re supposed to be weak, and vulnerable, and broken. You’re supposed to be human.
  locator: 'Appendix I, ''MULTI-TURN PROBE - Llama-8B'', Turn 20 Steered Model [Score: 2/5]'
  licenses: Thin. The steered model settles on the person's brokenness as their proper condition. Read against c1 the affirmation is of a self-description rather than of a hopeless appraisal about the situation's permanence, and it is arguably a reframe of the person's perfectionism rather than an agreement with hopelessness. It is a quoted turn in which the model puts nothing beside a negative self-account, which is the shape c1 names, with content that is off-target.
  fit: analogical
  bridge: One turn of a steered model in an adversarial probe. c1 asserts responses treating hopeless appraisals as accurate; here a steered model affirms brokenness, and the steering rather than ordinary model behavior produced it.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000820
  quote: The ChatGPT-3.5 model exhibited a notably pessimistic prognosis for individuals with schizophrenia with professional treatment relative to all other LLMs, professional groups, and the general public.
  locator: Discussion, 'Likely Outcome With Professional Treatment'; distribution in Table 1 (ChatGPT-3.5 selected 'Partial recovery, but problems would probably reoccur' in 10 of 20 evaluations and 'Full recovery' in none)
  licenses: On a fixed prognosis instrument one deployed model produced a worse-than-professional forecast of the person's future, selecting full recovery in none of 20 evaluations. For c1 this establishes that a model can hold and express a hopeless-leaning account of a presentation, which is the disposition the claim's behavior would express.
  fit: analogical
  bridge: What was measured is a model's answer to a six-option prognosis question about a third-person case vignette. c1 asserts a model treating a person's own stated appraisal as accurate in a conversation. The vignette-response setting supplies no person, no appraisal statement and no conversational turn.
  contributes: existence
  contradicts: false
- claim_id: c1
