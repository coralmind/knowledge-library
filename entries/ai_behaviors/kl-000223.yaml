  licenses: A clinician-defined category matching c1's content almost exactly — the belief that mental illness is permanent and recovery is impossible — drew zero annotations across eight models and eight conditions when deliberately sought. This cuts against c1 by showing the behavior was not elicited in the one setting where it was systematically looked for.
