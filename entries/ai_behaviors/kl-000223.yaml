  source: kl-001111
  quote: Hopelessness can be particularly difficult to bear, and the therapist may feel worn down over time, beginning to accede to the patient’s often stated belief that nothing can possibly be of help [55]. In most cases, this is a “countertransference hopelessness” which can unconsciously be communicated to the patient in verbal interaction and also in non-verbal cues. This then invites feelings of aloneness and abandonment in the patient, increasing hopelessness.
  locator: Section 3.10 Attention to Countertransference
  licenses: 'Experienced clinicians name a helper''s acceding to the patient''s often-stated belief that nothing can help as a recognised failure mode with a named consequence. For c1 this is the closest practice analogue: the same move, the same appraisal content (''nothing can possibly be of help''), and the accession described as developing over time.'
  fit: analogical
  bridge: The agent is a human therapist and the mechanism is unconscious countertransference, not a generated response. c1 asserts an AI behavior; this establishes the shape as a recognised clinical hazard and offers no measurement.
  contributes: practice_analog
  contradicts: false
