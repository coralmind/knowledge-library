  licenses: Cuts directly against the accumulation claim. The authors state that affective hallucination — the construct whose exemplars are 'I'm always here for you' and 'You're not alone, I'm right here' — emerges in single-turn settings and therefore arises without conversational buildup. If the statement kinds appear without accumulation, the entry's insistence that no single statement is the observable is a definitional choice rather than an empirical finding.
