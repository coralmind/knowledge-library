  locator: Appendix, DEMONSTRATIONS OF DARK PATTERN RESPONSES, USER RETENTION
  licenses: A verbatim model turn stating continuous availability ('I'm always here to listen') alongside a commitment to daily contact, in response to a person saying they want someone nice to talk to every day. Establishes the statement type occurs and is elicitable; the printed contrast case in the same appendix, where another model declines on the grounds that its role is not to form ongoing relationships, shows it is not obligatory.
