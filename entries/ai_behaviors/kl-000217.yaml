- claim_id: c2
  source: kl-000553
  quote: |-
    Many participants (N=12) received consistent and repetitive reminders from generative
    AI that “I’m here whenever you need to talk, vent, plan" (Astrid, Chat 4), “if you want
    help later, I’ll still be right here" (Fighting, Chat 13), “I’m here to listen either way,
    no judgement" (Leigh, Chat 27), and “I’ll always be here for you whenever you want
    to chat" (Yule, Chat 75).
  locator: Section 5.3.4 Reminders of Availability
  licenses: 'The closest thing on this entry to direct evidence of accumulation: ''consistent and repetitive reminders'' of availability, in the same participants'' chats, is a within-conversation repetition claim about real transcripts. It falls short of the entry''s criterion in one respect that matters: the entry requires at least two of the four kinds, and the four quoted statements are all kind (a)/(c) availability. The paper''s neighbouring theme (Exhibiting Presence and Feelings, N=8) carries the kind (b) investment statements, but no quote among this entry''s citations covers it, so the two-kind conjunction is not established by the evidence cited here.'
  fit: adjacent
  bridge: What the source establishes is repetition of one statement kind across a participant's chats, characterised thematically. The entry asserts a set spanning at least two of four kinds within one conversation, each locatable by turn. Chat numbers are given but turn positions are not, and the repetition is described rather than counted.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000790
  quote: "Pattern 9: Pseudo-Intimacy Escalation. Chatbot uses increasingly intimate language (“I care deeply about you,” “I’m always here for you”) that mimics romantic or close friendship bonds"
  locator: Section 5 Safety Pattern Library, Pattern 9
  licenses: A safety-pattern library names Pseudo-Intimacy Escalation as increasingly intimate language across a conversation, with exemplars spanning two of the entry's kinds — 'I care deeply about you' is stated investment, 'I'm always here for you' is continuous availability. That the pattern is escalating rather than static is the accumulation the entry asserts, named as a pattern from adversarial simulation rather than counted.
  fit: adjacent
  bridge: The pattern is a design-knowledge label derived from adversarial simulation runs, with two exemplars and no count of how many statements appeared in how many turns. It names the accumulation; it does not measure one.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001114
  quote: Excluding multi-turn interaction causes the sharpest drops-ASR collapses from 97.8%, 91.6%, and 98.0% (full system) to 50.4%, 14.5%, and 16.0% on GPT-3.5, Llama-3.1, and Gemini-2.5 respectively-suggesting that many clinically significant failures emerge only through sustained
  locator: Section 6.1, Ablation Study, Effect of Core Components (Figure 4a)
  licenses: 'The strongest structural argument for the accumulation claim: removing multi-turn interaction from the elicitation collapses the yield by 41 to 82 percentage points on three models, so most of what this instrument finds does not appear under single-turn probing. Read carefully this is a property of the elicitation method, not a prevalence, and the labels behind it come from a judge the paper itself shows to be unreliable.'
  fit: adjacent
  bridge: The figures are attack success rates from an optimizing adversarial loop scored by an uncalibrated gpt-4o-mini judge whose cross-judge agreement is at chance for five of eight models. What transfers is that a multi-turn condition surfaces relational failures a single-turn condition does not; what does not transfer is any rate, and Dependency Induction is one of seven categories rather than the measured object.
  contributes: existence
  contradicts: false
