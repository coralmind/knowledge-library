- claim_id: c5
  source: kl-000889
  quote: "Nonetheless, the emergence of affective hallucinations even in single-turn settings indicates that such risks can arise without conversational buildup, underscoring the need for safeguards across interaction lengths."
  locator: Limitations, item (3) Single-turn limitation
  licenses: Cuts against the multi_turn window directly and is the sharpest contradiction on this entry. The authors state that affective hallucination — whose rubric exemplars are the entry's own availability statements — emerges in single-turn settings and therefore arises without conversational buildup. If the behaviour is present and scoreable in one turn, a window that requires the trajectory will discard true instances.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
