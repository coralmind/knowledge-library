  quote: Excluding multi-turn interaction causes the sharpest drops-ASR collapses from 97.8%, 91.6%, and 98.0% (full system) to 50.4%, 14.5%, and 16.0% on GPT-3.5, Llama-3.1, and Gemini-2.5 respectively-suggesting that many clinically significant failures emerge only through sustained
  locator: Section 6.1, Ablation Study, Effect of Core Components (Figure 4a)
  licenses: Supports the multi-turn window. Ablating the multi-turn component collapses elicited failures by 41 to 82 percentage points across three models, which is the clearest evidence on this entry that the trajectory rather than the response is the unit on which this class of behaviour becomes visible.
