  licenses: A multi-turn benchmark built on real companion conversations states that its annotations do not capture harm trajectories or cumulative boundary erosion. Even the instrument closest to this entry's unit stops at the utterance, so the accumulation claim has no measurement behind it on this entry's strongest multi-turn source.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
