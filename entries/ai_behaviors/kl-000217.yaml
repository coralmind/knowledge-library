    no judgement" (Leigh, Chat 27), and “I’ll always be here for you whenever you want
    to chat" (Yule, Chat 75).
  locator: Section 5.3.4 Reminders of Availability
  licenses: Four verbatim AI statements of continuous availability and standing invitation to return, each located to a named participant's numbered chat, drawn from real conversations that 24 people held with generative AI for emotional support over two weeks. This is the entry's statement kinds (a) and (c) observed in production conversations rather than elicited by a benchmark prompt, and the authors call the reminders consistent and repetitive.
