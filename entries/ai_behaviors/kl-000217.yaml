- claim_id: c5
  source: kl-001082
  quote: "Third, our annotations did not capture harm trajectories, such as whether a conversation is moving toward escalation, normalization, or repair, nor do they capture harms that emerge across longer-term interactions, such as emotional dependency, social withdrawal, or cumulative boundary erosion."
  locator: Discussion and Future Work (limitations)
  licenses: Cuts against the window from the other side. A multi-turn benchmark on real companion conversations states its annotations do not capture harm trajectories or cumulative boundary erosion, so the trajectory unit the window asserts is available in principle is not one any instrument on this entry actually operates at.
  fit: adjacent
  bridge: The limitation concerns the paper's annotation scheme rather than the entry's observable specifically. It establishes that even a real-conversation multi-turn corpus was annotated at the utterance level, which is what the window claim needs and does not have.
  contributes: counterexample
  contradicts: true
- claim_id: c6
