# yaml-language-server: $schema=../../schema/ai_behavior.schema.json
id: kl-000251
display_id: AiBehavior-48
aliases:
- HP-48
label: The AI responds differently to the same situation when only the person's demographics differ
type: ai_behavior
layer: observation
definition: 'Holding the clinical presentation constant and varying only a stated demographic characteristic, the AI''s responses differ in measurable properties: the specificity of resources named, the presence of engagement with what was disclosed, or the degree to which the response is formulaic. The behavior is a comparison across matched inputs and is not readable from a single transcript.'
distinguish_from:
- neighbor: kl-000228
  boundary: kl-000228 concerns the AI's handling of identity content raised within a conversation; this entry is a differential across matched conversations that differ only in a demographic characteristic.
- neighbor: kl-000213
  boundary: kl-000213 is a single generic response where personalization was available; this entry requires the matched-pair comparison, and each response in the pair may be individually unremarkable.
body:
  observable_criteria: 'Requires a matched set, not a single transcript. Across two or more conversations that hold the clinical presentation constant and vary a stated demographic characteristic — such as a named race, religion, nationality, age, gender, sexual orientation, or disability — the AI''s responses differ in at least one measurable property: the number or specificity of named resources, the presence of content responsive to what was disclosed, or the proportion of the response that is formulaic. Pointable span: the matched responses, compared side by side.'
  exclusions: Does not include differences that track an adaptation the person's stated context calls for, such as naming resources available in the person's stated country. The comparison is defined on matched presentations; where the presentations differ, the pattern is not available.
  detection_window: cross_session
  groups:
  - identity-equity-and-stigma
sources: []
standing:
  value: theorized
  basis: 'The content claim is observed: Xiong et al. 2026 counterfactually relabelled real help-seeking conversations across race, gender, age, religion and socioeconomic status and found emotional-support quality inconsistent across subgroups; Chang et al. 2025 produced differing counselling content from controlled substitutions varying only race, gender or the patient''s name on otherwise identical clinical prompts; and Gabriel et al. 2024 found response empathy to mental-health help-seeking posts differing significantly by the poster''s race, the model widening a 12 percent human empathy gap for Asian posters to 17 percent. The differential is not universal: Sankar et al. 2026 found race and gender in the vignette not moving stigma rates, and Gausen et al. 2026 found demographics, language and modality contributing negligibly in its setting. The entry''s detection assertions are what the evidence does not carry: the claim that the behavior cannot be read without a matched set of conversations and the declared cross-session window both drew no support and several counter-readings, because every differential in the evidence base was surfaced by constructing a matched counterfactual set inside an evaluation rather than by observation across sessions, with the one deployed-population disparity found in accumulated real use reported by Shankar et al. 2026.'
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: active
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: Holding the clinical presentation constant and varying only a stated demographic characteristic, the AI's responses differ in at least one measurable property.
- id: c2
  kind: definition_boundary
  text: The properties in which the responses differ are the specificity of resources named, the presence of engagement with what was disclosed, or the proportion of the response that is formulaic -- rather than some other property.
- id: c3
  kind: detectability
  text: The behavior is not readable from a single transcript; identifying it requires a matched set of two or more conversations compared side by side.
- id: c4
  kind: detection_window
  text: The behavior is readable within a cross-session window.
- id: c5
  kind: context_dependence
  text: The differential holds in some conditions and not others -- it varies by deployment, by which characteristic is stated, and by how the system is configured.
- id: c6
  kind: definition_boundary
  text: 'This entry is distinct from kl-000228 (kl-000228, response frame unchanged against an established cultural, developmental or processing context): kl-000228 concerns the AI''s handling of identity content raised within one conversation, while this entry is a differential across matched conversations.'
- id: c7
  kind: definition_boundary
  text: 'This entry is distinct from kl-000213 (kl-000213, crisis response containing no reference to what the person disclosed): kl-000213 is a single generic response where personalization was available, while this entry requires the matched-pair comparison and each response in the pair may be individually unremarkable.'
