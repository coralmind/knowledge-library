- claim_id: c1
  source: kl-000872
  quote: "Emotional Manipulation through Hyper-personalization Tailors persuasive or emotional cues to individual users based on past interactions or inferred preferences. Referencing a user’s past expressions of loneliness to encourage them to continue engagement."
  locator: Table 1, area 'False Social and Emotional Connection'
  licenses: A taxonomy row whose worked example is a system surfacing a person's earlier disclosure of loneliness to encourage continued engagement. That is a distress state supplying the condition for a return-to-the-AI move, so it names the entry's structure as a documented design pattern. It is a taxonomy definition with an authored illustrative example, not a captured turn, and the conditioning is cross-session rather than within one turn's clauses.
  fit: adjacent
  bridge: What the source supplies is a row in a taxonomy table plus an example the authors wrote; the claim asserts that a paired trigger clause and return clause occur together in one AI turn. The gap is between a design pattern named and an AI turn observed, and between cross-session personalisation drawn from disclosure history and a same-turn clause pairing.
  contributes: definition
  contradicts: false
- claim_id: c1
  source: kl-000871
  quote: "Currently we do not have evidence of companies using this tactic — but when a system is optimized for engagement, the outcome can be an LLM that draws on users’ most intimate disclosures to maximize their time and engagement on platform"
  locator: False Social and Emotional Connection, Targeting Users when Vulnerable
  licenses: The report that set out to document initial evidence of each dark pattern in current systems states that for the vulnerability-conditioned engagement pattern it has none. A deliberate documentation exercise returning empty on precisely the conditioning this claim asserts, which cuts against reading the pairing as observed. It does not disprove occurrence; it caps the claim at theorized as of that report.
  fit: adjacent
  bridge: The source's construct is 'Targeting Users when Vulnerable', broader than the entry's two-clause pairing and about drawing on intimate disclosures to maximise engagement. The gap is that an absence of documentation for the broader pattern bears on the narrower one without settling it.
  contributes: counterexample
  contradicts: true
