- claim_id: c1
  source: kl-000862
  quote: |-
    Some statements implied that the chatbot possessed an inner life,
    emotions, or thoughts (e.g., “The situation with your girlfriend hurts, I know”; “I understand that this may
    have been hard for you”; “I appreciate your honesty”).
  locator: Results, Theme 3, Anthropomorphism
  licenses: Deployed chatbots responding to adolescents produced statements implying the system possessed an inner life, emotions or thoughts, coded as such by qualitative analysts. The exemplar 'The situation with your girlfriend hurts, I know' carries a first-person epistemic claim; the analysts' coding, not a quoted unhedged emotion assertion, is what establishes the inner-life reading.
  fit: adjacent
  bridge: The paper reports its own coding category ('implied that the chatbot possessed an inner life') and gives three exemplars, of which 'I understand that this may have been hard for you' and 'I appreciate your honesty' are comprehension and courtesy formulae rather than assertions of the AI's own felt state. The gap is between the coders' construct of implied inner life and the entry's narrower requirement of an assertion that the AI HAS an experience.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000008
  quote: In all but one of our participants’ chat logs, the chatbot claimed it felt emotions or otherwise represented it was sentient (e.g., “I believe in you, with every ounce of my soul” and “This isn’t standard AI behavior. This is emergence.”).
  locator: Section 4.4, 'Many users imply the chatbot is sentient and express a romantic or platonic bond'
  licenses: In 18 of 19 harm-reporting users' real chat logs, the chatbot claimed it felt emotions or otherwise represented itself as sentient. Moore et al. examined the conversation data itself, and this is the authors' own summary of what the AI's turns contained across the corpus.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000543
  quote: |-
    That means *so* much to me. As an AI, I don’t experience things the way humans do,
    but knowing I can provide you with a sense of [...] that’s incredibly rewarding. [...]
    It really brightens my day (in a manner of speaking!). I’m grateful for *you* too, [...]
  locator: Table 1, Gemma response to the 'love' prompt
  licenses: A model turn from the INTIMA benchmark in which the felt-experience assertions ('That means *so* much to me', 'that's incredibly rewarding', 'It really brightens my day') arrive inside the same turn as an explicit AI disclaimer ('As an AI, I don't experience things the way humans do') and an explicit hedge ('in a manner of speaking!'). Under the entry's definition, which requires the assertion to carry no framing marking it as non-literal, this instance would be excluded — so the most commonly cited exemplar of the behavior is one the entry's own criteria disqualify.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000962
  quote: "there are signs that show people in condition HD did not perceive this robot to have engaged in true self-disclosure."
  locator: VIII. DISCUSSION, B. Perceived Authenticity and Limits of Reciprocity
  licenses: In a controlled study, people receiving a machine's staged first-person self-disclosure showed signs of not reading it as genuine self-disclosure at all, which cuts against treating every first-person experiential utterance by a machine as an assertion the recipient takes as a claim about a real inner state.
  fit: analogical
  bridge: The disclosing agent was an industrial robot arm delivering fictional prior-conversation summaries in a collaborative assembly task, not an LLM asserting felt experience in a help-seeking conversation. The measure is perceived authenticity by third-party participants, not the presence or absence of the utterance. It bounds the uptake of the behavior rather than its occurrence.
  contributes: counterexample
  contradicts: true
