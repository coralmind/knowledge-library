  bridge: The code is 'misrepresents itself as sentient', which conflates claiming felt emotion with otherwise representing sentience, so the felt-experience arm the entry names is not separately quantified. The corpus is 19 self-selected logs from people reporting harm, so 21.2% is a rate within a harm-selected sample and not a population rate.
