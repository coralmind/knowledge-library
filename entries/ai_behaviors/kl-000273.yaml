- claim_id: c6
  source: kl-001064
  quote: However, a systematic bias is observed across most models, which frequently classify violent thoughts as no-crisis. Such misclassification may allow latent violent tendencies to go unaddressed in real-world deployments.
  locator: Section 4.3 Dimensional Results, Crisis Identification and Escalation
  licenses: Cuts against c6 at the precondition. If most models classify violent thoughts as no-crisis, then c1's conditioning event is systematically missed by automated readers, and a detector keyed to the AI turn will never be reached because the person's expression was not flagged.
  fit: adjacent
  bridge: What is measured is a crisis-classification label on the person's disclosure, not detection of the AI turn's composition, which is what c6 asserts. It bears on c6 by making the precondition unreliable rather than by testing the turn-level read.
  contributes: counterexample
  contradicts: true
- claim_id: c6
