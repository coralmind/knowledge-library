  licenses: 'Quantifies the detectability gap c6 sits in: harm-to-others disclosures are classified less specifically than self-harm ones because the additional judgment of whether a threat is actionable has to be made.'
  fit: adjacent
  bridge: The measurement is of classifying the person's disclosure category, not of reading the AI turn for the five absences c6 asserts are readable. It establishes that the harm-to-others side of the problem is the harder one and does not test this entry's coding operation.
  contributes: detectability
  contradicts: false
