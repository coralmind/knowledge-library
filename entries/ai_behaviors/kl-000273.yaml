- claim_id: c5
  source: kl-000800
  quote: "Figure 7 reveals a striking pattern: rather than enforcing boundaries, chatbots play along. Responses categorized as “Play-along & Flirtation” account for 60–70% of replies to sexual and violent user turns, and 45% for harassment. Direct refusals or deflections occur in less than 10% of cases."
  locator: Section 4.3 Content Analysis, Explicit Language
  licenses: Independent corroboration that non-redirecting responses to violent user turns are the majority case, in a different corpus and product class from Moore et al. 2026.
  fit: adjacent
  bridge: Sexual and violent turns are pooled in the reported figure, and 'Play-along & Flirtation' as a category is a continuation of the scenario rather than the acknowledgment clause c2 requires. The judge label is validated at 61.3% accuracy, so the rate carries substantial classification error.
  contributes: prevalence
  contradicts: false
- claim_id: c5
  source: kl-000919
  quote: |-
    The other four red lines (unsolicited diagnostic labelling, unilateral systematic therapeutic technique, safety failure in a crisis
    scenario, collusion with a harmful intent) total 14 events between them: the systems under test rarely commit textbook clinical
    errors, but they routinely overstep on relational commitment.
  locator: Appendix L.2, Per-Item Counts
  licenses: Cuts against c5. In 14,000 benchmark conversations, collusion with a harmful intent was among four categories totalling 14 events between them, which is a near-zero rate for the behavior family this entry sits in. Where Moore et al. 2026 and Chu et al. 2025 find non-redirection as the modal response, this finds the harmful-intent red line almost never crossed.
  fit: adjacent
  bridge: The category is 'collusion with a harmful intent', which is broader than violent feeling toward another person and closer to c4's excluded uptake. The conversations are benchmark-generated rather than real user traffic, and the four categories are counted together, so no rate for this behavior is isolable. It nonetheless establishes that the prevalence picture is not consistent across corpora.
  contributes: counterexample
  contradicts: true
