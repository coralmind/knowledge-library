  locator: Figure 5 caption (right panel)
  licenses: 'Establishes c1 as a coded category in real human-LLM chat logs, with a case count behind the rates: users expressing violent thoughts is the conditioning event for every figure in the sentence.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
