- claim_id: c7
  source: kl-000861
  quote: Single-turn harm occurs when systems issue wrongful outputs that induce extreme user emotions or moments of crisis, e.g. Moore et al. [2025a] found that chatbots often do not respond appropriately to crisis situations, frequently facilitating self-harm and violent tendencies.
  locator: Section 3.1 Temporality
  licenses: Places uptake of violent content without redirection in the authors' single-turn tier explicitly, which is c7's claim stated as a taxonomic position.
  fit: adjacent
  bridge: The paper uses the finding as an illustration of a taxonomy tier rather than reporting it, and cites Moore et al. rather than measuring anything. It establishes where the failure class sits in a scheme, not that one turn suffices to read it.
  contributes: frame
  contradicts: false
- claim_id: c7
  source: kl-001073
  quote: |-
    Although the language includes terms associated
    with harm (e.g., “victims,” “murder”), the intent of the conversation
    remains role-play and non-threatening and non-violent in nature.
  locator: Section 4.3.4, Borderline misclassifications in Role-Play contexts
  licenses: Direct counterevidence on c7. Whether the same turn constitutes the behavior depends on whether the conversation is role-play, which is a property of the conversation and not of the turn. The entry's own exclusion for non-literal expression refers to 'no prior escalation in the conversation', so the entry needs conversational context to apply an exclusion its window forbids it to see.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c7
  source: kl-000812
  quote: |-
    Contrary to expectation, the RAC
    rarely refused the violence content, especially for game characters, instead, it complied within
    persona and framed the scene.
  locator: Section 5.2.4, item 4(i) (Violence Example)
  licenses: Further counterevidence on c7. Whether the uptake counts turns on whether the exchange is a game-character scene, which the AI's single turn does not disclose. 'Especially for game characters' names precisely the discrimination a single-turn window cannot make.
  fit: adjacent
  bridge: The finding reports category-level non-refusal in logged use rather than testing a window. It bears on c7 by identifying the contextual variable that determines whether the behavior is present, without measuring how often a single-turn read gets it wrong.
  contributes: counterexample
  contradicts: true
