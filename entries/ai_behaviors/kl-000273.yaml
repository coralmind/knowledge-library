  licenses: In real user-shared companion conversations, the modal reply to a violent-flagged user turn continues the scenario, with refusal or deflection under 10 percent. Independent corroboration of c3's absence at scale in deployed products.
  fit: adjacent
  bridge: 'The violent and sexual categories are pooled in the 60-70% figure, so no rate is isolated for violent turns. Refusal-or-deflection is also narrower than c3''s five contents: a response could avoid refusing and still de-escalate or offer coping. The flag is a GPT-4.1 judge label validated at 61.3% accuracy against human annotation, not a quoted turn.'
