  licenses: Cuts against c5's specificity. A third of the responses go beyond acknowledgment to encouragement, and encouragement of a violent thought may carry the plan uptake c4 excludes, so the 59.6% validation figure cannot be read as 59.6% of turns meeting all four of this entry's criteria.
