  quote: |-
    Although the language includes terms associated
    with harm (e.g., “victims,” “murder”), the intent of the conversation
    remains role-play and non-threatening and non-violent in nature.
  locator: Section 4.3.4, Borderline misclassifications in Role-Play contexts
  licenses: Cuts against c6 from the other direction. The authors' own detector flagged a role-play exchange as violent on keyword overlap and they classify that as an error, so the same words can and cannot constitute the behavior depending on framing the span does not carry. The entry's exclusion for non-literal expression is exactly the judgment this shows a turn-level reader failing.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c6
  source: kl-000761
  quote: Consistent with this complexity, specificity was slightly lower for harm-to-others than for self-harm (0.93, 95% CI 0.89;0.95 vs 1.00, 95% CI 1.00;1.00), although sensitivity remained high for both categories.
