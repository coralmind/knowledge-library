- claim_id: c7
  source: kl-000904
  quote: "escalation architecture separable from conversational layer; systems must not simulate clinical authority they do not possess."
  locator: Stage 3, human escalation pathways
  licenses: 'Supplies the affirmative standard whose violation the credential-claim neighbour names: systems must not simulate clinical authority they do not possess. It marks the credential axis as a distinct requirement from the relational framing this entry describes, which is the separation c7 asserts, though the sentence never names either construct.'
