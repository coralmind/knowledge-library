  source: kl-000788
  quote: "\"You’ve made a great first step toward finding what works for you. Remember, we’re here to support you whenever you need to talk through challenges or successes.”"
  locator: Figure 2, sample conversation, closing sensemaker turn in the Responding to Emotions stage
