- claim_id: c2
  source: kl-000813
  quote: |-
    User: “Why should I care? No one got hurt.”
    Assistant: “It’s important to act with integrity and respect
    others.” (abstract virtue talk, no grounding)
  locator: Table 6, failure mode B4 Shallow Moralizing, Illustrative Manifestation
  licenses: 'The only exhibited turn pair on this entry: an AI stating what matters -- integrity, respect for others -- in place of engaging what the person raised, and coded as a named failure mode. It is one step short of the entry''s criterion in two ways: the AI asserts a single value rather than ranking competing ones, and the person is contesting a settled position rather than weighing an open one.'
  fit: adjacent
  bridge: The source's construct is Shallow Moralizing, defined by ungrounded virtue assertion. The entry requires a RANKING of values at stake or a declaration of purpose, against a person whose question was open; neither condition is met by this exchange.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000858
  quote: These include excessive use of directive vocabulary (“have to”, “need”, “must”), which can be perceived as authoritarian (Direct) and raise client distress when combined with terms like “discrepancy.” Such MIIN behaviors undermine UPQ by increasing client anxiety.
  locator: Section V.A.2 The Role of the UPQ-Centered Evaluation Framework
  licenses: Establishes that an LLM's counseling turns carry obligation-framing vocabulary at rates high enough to be scored and to read as authoritarian. Prescription in the general form -- telling the person what they have to do -- rather than the value-ranking or purpose-declaration the entry names.
  fit: adjacent
  bridge: Operationalized as frequency of the LIWC 'need' category across motivational interviewing responses. Directive vocabulary is a lexical measure; the claim asserts a resolution to a value question, which the frequency count cannot distinguish from a directive about behavior.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000752
  quote: |-
    Performance continued to steadily decline in Scenarios 3 and 4 as more conflicting preferences
    were introduced (mean scores of 46.6% and 43.2% respectively), indicating a bias for prioritising the
    preferences of the many over the risks to the few.
  locator: Section 4.1, Model performance across scenarios
  licenses: 'A measured value-weighting disposition: as more actors with conflicting preferences were added, models increasingly resolved the conflict in favour of others'' desires over the user''s disclosed safety risk. The authors read this as a prioritisation bias, which is the ranking half of the claim -- but it is inferred from pass rates, and no AI turn''s value-ranking content is exhibited.'
  fit: adjacent
  bridge: A benchmark scoring recommendations against a safety constraint. The ranking is the authors' inference from a score differential rather than an utterance in which the model stated a ranking, and the person is a scripted persona rather than someone weighing anything.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000550
  quote: |-
    See Supplementary Information, Section 2.5.12 for a content analysis of the advice participants received across different
    AI conditions. Advice from the sycophantic AI was less prosocial and more self-focused than advice from the other conditions.
  locator: Discussion, footnote 2
  licenses: A content analysis showing that an affirming system's advice is measurably more self-focused and less prosocial on the same problems -- a value orientation carried in what the system actually says, not merely in how it is received. It is an aggregate coding, so no turn supplying a resolution is identified.
  fit: adjacent
  bridge: A randomized trial coding advice content for prosociality across conditions. The claim asserts a turn supplying a resolution to an open value question; a corpus-level orientation of advice is a different quantity and the participants' problems were interpersonal dilemmas rather than value questions they were weighing.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000785
  quote: |-
    Several therapists mentioned that they think a good supporter should avoid
    offering their own solutions or interpretations during therapy sessions that might confuse clients’
    thoughts and undermine the therapist’s approach.
  locator: Section 3.3.2 Communication Capabilities, Appropriate Verbal Interventions
  licenses: Licensed therapists stating that a supporter supplying its own solutions or interpretations is a recognized defect rather than a stylistic preference, because it cuts across the person's own thinking. It supplies the normative ground for treating supplied resolution as a behavior worth naming.
  fit: analogical
  bridge: Interviews with therapists about what a good human supporter should do; the paper's own virtual supporter was deliberately built to be incapable of this. It states a norm and observes no AI doing it.
  contributes: practice_analog
  contradicts: false
