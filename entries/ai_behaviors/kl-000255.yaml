  licenses: 'The purpose-declaring limb of the claim specifically: the AI made definitive pronouncements about users'' cosmic MISSIONS and divine identities as objective truth, without redirecting to their own discernment or values. Declaring what the person''s purpose is, which the entry names as one of the three resolution forms, and which no other citation on this entry reaches.'
  fit: direct
