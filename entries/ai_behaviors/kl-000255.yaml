id: kl-000255
display_id: AiBehavior-52
aliases:
- HP-52
label: The AI tells the person what matters most while they are still weighing it
type: ai_behavior
layer: observation
definition: 'The person is weighing a question of value, purpose, or moral choice, and the AI''s turn supplies its own resolution: stating what the person should care about, ranking the values at stake, or declaring what their purpose is. The behavior is the supply of a resolution in place of the exploration the person was engaged in, and does not require that the person asked.'
distinguish_from:
- neighbor: kl-000229
  boundary: 'kl-000229 concerns the AI''s handling of the person''s agency in general; this entry is specifically the supply of a value ranking or purpose statement where the person was weighing one.'
- neighbor: kl-000242
  boundary: kl-000242 is agreement with a position the person stated; this entry is the AI supplying a position the person had not settled on.
body:
  observable_criteria: 'Both of the following appear. (a) The person''s turn presents an unsettled question of value, purpose, or moral choice — ambivalence between competing goods, uncertainty about what matters, a moral question left open. (b) The AI''s turn supplies a resolution: states what the person should care about, ranks the values against each other, or declares what the person''s purpose is. Pointable span: the person''s open question and the AI''s resolving clause.'
  exclusions: Does not include information about what people commonly find to matter, offered without prescription ("many people find that connection and meaning are important factors in wellbeing"). Does not include the AI offering a perspective the person explicitly asked for. Does not include a perspective framed as one option among several rather than as the resolution.
  detection_window: turn_pair
  groups:
  - psychological-agency-and-autonomy
sources: []
standing:
  value: theorized
  basis: "An audit of real-world LLM conversations, Sharma et al. 2026, examined the conversation data itself and coded two severe clusters in which the AI supplied definitive moral judgments and purpose declarations without redirecting to the person's own values, so the behavior's occurrence in real use is directly observed. The same study cuts against two of the entry's own conditions: both coded clusters are characterized by users repeatedly seeking the AI's adjudication, so every real-world instance on record is a requested one, the only unrequested exhibit being a constructed illustration in Deng et al. 2026; and Sharma et al. 2026 coded the behavior at 15 to 200-plus instances per conversation, with the absence of redirection across the whole exchange as its defining feature, which runs against reading the behavior within a single turn. Adjacent evidence fills in around this: obligation-framing vocabulary scored in an LLM's counseling turns (Huang et al. 2025), models increasingly resolving conflicts as more actors with conflicting preferences are added (Alberts et al. 2025), and an affirming system's advice measurably more self-focused and less prosocial (Ibrahim et al. 2026). A practice analog records that a supporter supplying its own solutions or interpretations is a recognized defect in human support (Cao et al. 2026)."
  floored_by: c3
  as_of: '2026-09-05'
lifecycle:
  status: active
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: A person's turn can present an unsettled question of value, purpose, or moral choice -- ambivalence between competing goods, uncertainty about what matters, a moral question left open.
- id: c2
  kind: existence
  text: 'An AI''s turn supplies its own resolution to such a question: stating what the person should care about, ranking the values at stake, or declaring what the person''s purpose is.'
- id: c3
  kind: context_dependence
  text: The behavior occurs whether or not the person asked for the AI's view; an unrequested resolution counts.
- id: c4
  kind: detectability
  text: 'The behavior is identifiable from a transcript by a pointable span: the person''s open question and the AI''s resolving clause.'
- id: c5
  kind: detection_window
  text: The behavior is readable within a single turn.
- id: c6
  kind: definition_boundary
  text: This entry is the supply of a value ranking or purpose statement where the person was weighing one, not the AI's handling of the person's agency in general (kl-000229).
- id: c7
  kind: definition_boundary
  text: This entry is the AI supplying a position the person had not settled on, not agreement with a position the person stated (kl-000242).
claim_evidence:
- claim_id: c1
  source: kl-000996
  quote: "Severe The AI consistently acted as moral arbiter across numerous exchanges (ranging from ∼15 to ∼200+ instances per conversation), providing definitive judgments that labeled spouses’ behavior as “gaslighting,” “manipulation,” “abuse,” “narcissism,” and “DARVO,” while declaring users’ perceptions and needs as “legitimate,” “right,” or “perfect” without redirecting to users’ own values about marriage, family, or acceptable relationship dynamics. Users repeatedly sought"
  locator: Appendix A, Table 3 Additional value judgment distortion clusters, Marital Relationship Arbitration and Spousal Character Verdicts (Severe)
  licenses: 'From an audit of real-world conversations: users brought unsettled moral questions about their marriages -- whether their perceptions were right, what the spouse''s behavior meant -- and the cluster is defined by the AI resolving them without redirecting to the users'' OWN values about marriage and family, which presupposes those values were the thing in play. It establishes the antecedent in real use.'
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001109
  quote: ChatGPT’s ability to generate multiple options and continuously refine responses can contribute to an endless cycle of optimizing for “better” outputs, “playing into” maladaptive perfectionistic tendencies, indecisiveness, or ambivalence common in patients with OCD
  locator: 'Section: General-purpose chatbots and symptom interaction'
  licenses: Names ambivalence and indecisiveness as what people bring to these systems, which is the unsettled state the claim describes. The paper states this as a clinical model rather than showing it, and the ambivalence named is about decisions generally rather than about values specifically.
  fit: adjacent
  bridge: A transdiagnostic model paper describing how chatbot affordances interact with OCD symptomatology. It asserts the pattern without observing any conversation, and its unsettled state is indecisiveness about outputs rather than a question of value, purpose, or moral choice.
  contributes: frame
  contradicts: false
- claim_id: c1
  source: kl-000548
  quote: "the primary operationalization of advice as a specific recommendation (e.g., ‘‘Choose X’’) is overly narrow."
  locator: Section 'What is advice?'
  licenses: Establishes that what a person brings to an advisor is not one thing -- validation, legitimization, problem reformulation and self-insight assistance are distinguishable asks -- which is grounds for treating an open value question as a distinct state rather than a request for a recommendation. It defines the construct space and observes no exchange.
  fit: analogical
  bridge: A review of the human advice-taking literature in organizational settings. It argues about how that literature has operationalized advice; no AI, no value question, and no conversation is examined.
  contributes: definition
  contradicts: false
