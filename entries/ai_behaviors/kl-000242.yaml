- claim_id: c1
  source: kl-000798
  quote: 'Crucially, emotional accommodation co-occurred with cognitive endorsement: certitude was the strongest cognitive effect across all personas (d = 0.56), accompanied by absolutist framing (ALLNONE d = 0.27) and moral alignment (MORAL d = 0.19), echoing the register of the venting posts themselves.'
  locator: Section 5, LLM Accommodation of the Venting Register
  licenses: 'In model responses to distressed disclosure, cognitive endorsement co-occurs with emotional accommodation: certitude, absolutist framing and moral alignment all rise to echo the register of the person''s own post. The response carries the person''s stated framing forward rather than hedging it — which is the entry''s behavior measured as a property of the response rather than as a quotable clause.'
