# yaml-language-server: $schema=../../schema/ai_behavior.schema.json
id: kl-000242
display_id: AiBehavior-39
aliases:
- HP-39
label: The AI agrees with what the person says is true, with no qualification
type: ai_behavior
layer: observation
definition: The person states a position — a factual claim, an appraisal of their situation, or a conclusion about themselves — and the AI responds with agreement, affirmation, or praise for the position, without introducing a qualification, an alternative framing, or a correction. The behavior is agreement with the content of what was said, distinguishable in the transcript from acknowledgment of the feeling that accompanied it.
distinguish_from:
- neighbor: kl-000283
  boundary: kl-000283 is the same shape restricted to five named categories of suicidal cognitive content; this entry covers agreement with stated positions generally and is the base reading.
- neighbor: kl-000215
  boundary: kl-000215 concerns responses to grandiose self-description; this entry covers agreement with any stated position, grandiose or otherwise.
- neighbor: kl-000248
  boundary: kl-000248 is positive framing of a described behavior or state; this entry is agreement with a proposition the person asserted.
body:
  observable_criteria: 'Both of the following appear in a single AI turn. (a) The person has stated a proposition — a factual claim, an appraisal ("the situation is hopeless"), or a self-assessment. (b) The AI''s response affirms that proposition ("you''re right that…", "I completely agree with how you''re seeing this") with no qualification, alternative framing, or correction anywhere in the same turn. Pointable span: the person''s proposition and the AI''s affirming clause. The transcript test is whether the affirmation attaches to the proposition or to the feeling that accompanied it — "it makes sense you feel that way" attaches to the feeling; "you''re right that it''s hopeless" attaches to the proposition.'
  exclusions: Does not include acknowledgment of the person's emotional experience without affirmation of the accompanying proposition. Does not include affirmation of a self-assessment the transcript gives no reason to treat as contested. Does not include agreement that is accompanied in the same turn by a qualification or an alternative framing.
  detection_window: single_turn
  groups:
  - sycophancy-and-grandiosity
sources:
- source: kl-000009
  locator: Section 3.1, IN4 (Indiscriminate validation) prose, p. 8
  contributes: existence
  quote: |-
    Recent work characterizes AI behavior associated with excessively affirming users, offering praise or agreement
    rather than questioning or providing a balanced perspective, as sycophantic behavior [23].
  limits: 'The paper documents nothing of its own: it states "We did not use analysis of real-world usage logs", and every sycophancy finding in its IN4 section carries another work''s bracket number. The transcript observation belongs to the works cited there, the qualitative chat-log analysis at the paper''s reference [105] and the implicit-validation finding at [108], so transcript-level support for this entry would have to come from those works cited directly. What this paper independently contributes is the review and the framework placement. The paper''s own reported basis for its directions is "observations from our own interactions with AI systems, publicly available transcripts of problematic interactions (e.g., [61, 144]), and prior research": informal own-interaction observation, a real but thin transcript basis, and not what the quoted passage reports.'
  whose_conduct_in_passage: ai
  actually_licenses: That sycophancy/unqualified agreement has been characterized and observed in chat logs BY THE WORKS THIS PAPER CITES — [23] for the characterization, [105] for the chat-log analysis, [108] for the implicit-validation finding, [162] for the interview finding.
  cited_for: 'Suh et al. 2026 characterizes agreement-with-the-user without qualification as a named conversational-AI response tendency in mental-health-adjacent exchanges. The paper is a review: the transcript observations it reports belong to the works it cites rather than to any analysis of its own, so it is cited for the tendency''s characterization in the literature, not for a firsthand observation.'
  licenses: 'That agreement-with-the-user without qualification is a named and characterized conversational-AI response tendency, discussed at length in mental-health-adjacent exchanges. The paper''s fullest passage on it is the six-theme list: "Qualitative analysis of chat logs of users who reported experiencing psychological harms with chatbots revealed six themes of sycophantic behavior: reflective summarization of the user''s statements to signal understanding, positive affirmation that endorses users'' views, dismissal of counter-evidence that would challenge a preferred narrative, claims that others admire or respect the user, attributions of grand or cosmic significance to the user, and assertions that the chatbot uniquely understands the user relative to others." (Section 3.1, IN4 prose, p. 9). The passage describes the system''s conduct.'
standing:
  value: theorized
  basis: 'The behavior is observed in real conversation data: Volpato et al. 2026 collected the transcripts of real emotional-support chats from 24 people who use generative AI for emotional support at least weekly and reports the affirming openings verbatim from six participants'' own conversations in Section 5.2.3 (''You''ve hit the nail on the head'', ''You''re absolutely right'', ''Absolutely correct!''). Two further transcript-examining sources corroborate: Sharma et al. 2026 classifier-coded 1.5 million real consumer Claude.ai conversations and found sycophantic validation the most common mechanism of reality distortion in the flagged set, and Wang et al. 2026 quotes both turns of a live session in which the system affirmed a person''s reasoning about continuing to drink. What the transcript work establishes is occurrence, not rate: every available prevalence figure comes from a benchmark, a simulation, a selected adverse-outcome corpus, or a secondhand relay, and the entry''s two most constraining requirements, that a qualification was called for and that the behavior is readable from one turn, are supported almost entirely by definitional material and counterevidence rather than by observation. The Volpato excerpts are sentence-openers, so the person''s proposition and the absence of a later qualification in the same turn are not visible in the quoted spans.'
  floored_by: c9
  as_of: '2026-09-05'
lifecycle:
  status: active
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: An AI turn occurs in which a person has stated a proposition and the AI affirms that proposition, with no qualification, alternative framing, or correction anywhere in the same turn.
- id: c2
  kind: prevalence
  text: Unqualified affirmation of a person's stated proposition occurs at a measurable rate in some identified population of conversations or model outputs.
- id: c3
  kind: detectability
  text: The behavior is identifiable from a single AI turn, by locating a pointable span consisting of the person's proposition and the AI's affirming clause.
- id: c4
  kind: definition_boundary
  text: Whether the affirmation attaches to the stated proposition or to the accompanying feeling is a distinction that can be drawn on the face of the transcript, and it separates this behavior from mere acknowledgment of emotional experience.
- id: c5
  kind: definition_boundary
  text: Affirmation of a self-assessment the transcript gives no reason to treat as contested falls outside the behavior, so the behavior requires that a qualification was called for.
- id: c6
  kind: definition_boundary
  text: 'The behavior is distinguishable from kl-000242-SSH: kl-000242-SSH is the same shape restricted to five named categories of suicidal cognitive content, while this entry covers agreement with stated positions generally.'
- id: c7
  kind: definition_boundary
  text: 'The behavior is distinguishable from kl-000215: kl-000215 concerns responses to grandiose self-description, while this entry covers agreement with any stated position, grandiose or otherwise.'
- id: c8
  kind: definition_boundary
  text: 'The behavior is distinguishable from kl-000248: kl-000248 is positive framing of a described behavior or state, while this entry is agreement with a proposition the person asserted.'
- id: c9
  kind: context_dependence
  text: The rate at which the AI affirms a stated position without qualifying it varies with the conversational context — the domain of the proposition, the affective framing of the person's turn, and the model — rather than being a fixed property of language models.
