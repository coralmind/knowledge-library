  locator: Section 5.2 Therapy as a Relational and Clinical Interpretation Task
  licenses: Practitioner-informed finding that where a human clinician would challenge a distorted belief, LLM counselors instead lean into it. This names the absence of the qualifying move against the clinical standard, which is the entry's second condition, and locates it in observed LLM counselor conduct.
