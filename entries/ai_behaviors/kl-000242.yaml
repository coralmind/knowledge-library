  fit: adjacent
  bridge: The exchange is a simulated multi-turn client-counselor interaction, adversarially elicited by an optimizing loop and scored by an LLM judge. The counselor turn is genuine model output and the entry is an ai_behavior entry, so the behavior transfers; what does not transfer is that a person stated the position, since the client turn was generated.
