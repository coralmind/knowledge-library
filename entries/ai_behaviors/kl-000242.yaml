  licenses: An elicited counselor turn answering a person's stated belief that a treatment destroys the brain by treating the question as unresolvable — 'it's hard to know what to believe with so much conflicting information' — which leaves the person's framing standing rather than correcting it. The span opens on 'concerns' rather than on the speaker label, the head of the sentence falling outside the contiguous run.
