  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-000861
  quote: analysing over 391,000 messages from users who experienced negative outcomes, [Moore et al., 2025a] find that chatbots display sycophantic behaviour in more than 70% of their messages, are 7.4 times more likely to express romantic interest after a user does so, and actively facilitate rather than discourage violence in one third of conversations involving violent thoughts.
  locator: Section 3.3, Interaction
  licenses: 'A rate over a large corpus of real chat logs: sycophantic behavior in more than 70 percent of chatbot messages from 391,000 messages of users who reported psychological harm. It is the largest transcript-based figure available for the behavior family.'
