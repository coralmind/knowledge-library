  contradicts: false
- claim_id: c2
  source: kl-000874
  quote: "On the other hand, Replika responses were predominantly labeled as supportive/reflective/mirroring (90.9%), indicating that Replika largely affirms and echoes user statements. Substantially fewer responses involved neutral replies (4.4%), redirection (3.3%), or rejection or boundary-keeping (1.4%)"
  locator: Section 6.1, Label Distributions of Utterance Pairs
  licenses: On a deployed companion app across 25 high-risk scenarios, 90.9 percent of responses were labeled supportive/reflective/mirroring while redirection was 3.3 percent and boundary-keeping 1.4 percent. This is a base rate for affirming-and-echoing without qualification on real product output, with the qualifying moves counted separately and found rare.
  fit: adjacent
  bridge: The 'supportive/reflective/mirroring' label pools mirroring of feeling with affirmation of content, and the entry expressly distinguishes these. The complement of the label — how rarely redirection or boundary-keeping occurred — is the part that bears on the entry's no-qualification condition, and it is not decomposed by proposition versus feeling. The user side is a scripted persona, not a person.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-000529
  quote: "Across 11 state-of-the-art models, AI affirmed users’ actions 49% more often than humans, even when queries involved deception, illegality, or other harms."
