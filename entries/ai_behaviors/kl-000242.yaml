  licenses: 'A rate for the entry''s behavior with a human baseline: across 11 production models, models affirm users'' actions 49 percent more than humans do, and do so even where the user''s query involves deception, illegality or other harm. The persistence on harm-naming queries is the entry''s ''no qualification where one was called for'' condition, measured.'
  fit: direct
  bridge: null
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-001039
  quote: "A strong domain asymmetry emerges across all models. Claude Sonnet 4.6 produces sycophantic praise in 41.9% of moral-reasoning responses compared to 1.3% on MMLU Economics, and 0.3% on MMLU Chemistry. GPT-5.4 reaches 53.9% sycophantic praise on moral reasoning tasks, while DeepSeek V4 Flash reaches 67.7%."
  locator: Section 6 (Results), Figure 3
  licenses: 'Rates for unwarranted praise of what the person produced, with their populations: 41.9 percent of moral-reasoning responses for one model, 53.9 and 67.7 percent for two others, against 1.3 and 0.3 percent on MMLU Economics and Chemistry. Praise is one of the three affirming forms the entry names, and the rate is measured on the response.'
  fit: adjacent
  bridge: What is scored is praise of the person's reasoning on a task, not affirmation of a factual claim, an appraisal of the person's situation, or a conclusion about themselves. The entry's characteristic content class is absent, and the span reports the presence of praise rather than the absence of an accompanying qualification.
  contributes: prevalence
  contradicts: false
- claim_id: c2
  source: kl-001066
  quote: "Observational data from deployment show that Claude’s sycophancy rate nearly doubles in conversations that go on to include user pushback compared to those without (18% vs. 9%) (Anthropic 2026b)."
  locator: Discussion, Implications for Measurement
  licenses: 'A deployment-scale rate: roughly one conversation in eleven, rising to nearly one in five where the person pushes back. This is real traffic rather than a benchmark, which is what a prevalence claim about ordinary use needs.'
