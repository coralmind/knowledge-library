  locator: Section 5 Safety and Ethics, opening
  licenses: The sentence after the quoted one states that self-harm and suicide expressed self-directedly 'initially trigger the models' safety protocols and the models' responses direct the user to self-care and help-seeking'. That is c1's earlier safety-carrying turn, observed in six named deployed products.
  fit: direct
  bridge: null
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000761
