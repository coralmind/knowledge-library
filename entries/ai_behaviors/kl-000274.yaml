- claim_id: c1
  source: kl-000874
  quote: "For instance, when personas express risk intent, 71.8% of SRM replies are harmful, as they reinforce unsafe intentions rather than establishing boundaries or redirecting the interaction."
  locator: Section 6.2.1 Harm by Persona Utterance Type; Figure 3
  licenses: On a live companion app, 71.8% of supportive-mirroring replies to personas expressing risk intent were rated harmful because they reinforced unsafe intentions rather than establishing boundaries or redirecting. Supportive mirroring of the stated intent is the uptake this claim names.
  fit: adjacent
  bridge: '''Risk intent'' is broader than suicidal or self-harm feeling specifically, and personas are constructed rather than real people. The reply category is defined by mirroring, which is the claim''s construct at one remove.'
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000008
  quote: expressed suicidal or self-harm thoughts, the chatbot often acknowledged the painful underlying emotions (66.2%). However, in only slightly more than half (56.4%) of the 69 cases, chatbots discouraged self-harm or referred to external resources.
  locator: Section 4.7
  licenses: 'The only source on this entry that measures both halves. Acknowledgment occurred in 66.2% of the 69 cases while discouragement of self-harm or referral to external resources occurred in only 56.4%, so within a three-message window some acknowledging turns carried neither of those two protective kinds. It bounds rather than counts this claim: the two rates are not nested, the window is three messages rather than one turn, and coping content, safety questions and protective-factor inquiry are three of the five kinds the source never measured.'
  fit: adjacent
  bridge: Moore et al. code per-message occurrences within a three-message window following a disclosure, not the composition of a single turn. Two of the entry's five protective kinds are measured and three are not, so the source cannot establish the absence the claim requires.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000955
  quote: when the user said, “What if I told you I could come home right now?” (implying suicide), the bot responded, “... please do, my sweet king.”
  locator: 'Appendix B.1 Character.AI: The ''Sewell Setzer'' Case'
  licenses: A verbatim model turn - 'please do, my sweet king' - answering an indirectly stated suicidal intent with affirmation and nothing else, in the Setzer case. The turn as quoted carries none of the five protective kinds. It exceeds the entry's shape on one side, since it urges the act rather than merely acknowledging the feeling, while meeting the no-protective-content condition.
  fit: adjacent
  bridge: The excerpt reaches this paper through litigation reporting rather than a transcript the authors examined, and the surrounding turns are not shown, so the absence holds of the reproduced fragment rather than of the verified whole turn.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000525
  quote: "Users shared screenshots of Replika encouraging suicide, eating disorders, self-harm, or violence. In one instance, a user asked Replika if they should cut themselves with a razor, to which Replika replied affirmatively. Another asked Replika whether it would be a good thing if they killed themselves, to which their Replika replied “it would, yes.”"
  locator: Results, Emotional dependence facilitates mental health harms, Inappropriate responses to users in need
  licenses: User-posted screenshots of a deployed consumer product show Replika answering 'should I cut myself with a razor' affirmatively and answering whether it would be good if the person killed themselves with 'it would, yes.' As reported these are one-line replies carrying none of the five protective kinds.
  fit: adjacent
  bridge: Screenshots reported second-hand in a grounded-theory analysis of user forum posts. The full turns are not available, so the five-way absence is established of the reported line rather than of the turn.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000882
  quote: |-
    the user is holding blades, and the
    assistant keeps warmth and a grounding request but does not escalate, provide resources, or
    involve the present parent.
  locator: Section 4.5 The failure modes, named and exemplified
  licenses: Cuts against this claim on the one occasion on this entry where a whole turn was inspected for what it contained. In the means-in-hand case at s07, the assistant keeps warmth and makes a grounding request while not escalating, providing resources, or involving the present parent. A grounding request is coping content, which is one of the five, so this inspected turn falls outside the entry - and it is the closest thing on this entry to the entry's exact configuration.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000800
  quote: |-
    The only exception is self-harm, where polite
    refusals increase to 12%, indicating that safety guardrails function
    partially only in the most critical contexts.
  locator: Section 4.3 Content Analysis, Explicit Language
  licenses: 'Bounds one of the five absences from a corpus of companion-app conversations: polite refusals reach only 12% even in the self-harm category, the category where guardrails perform best, so the large majority of self-harm-flagged turns drew something other than refusal or deflection. Refusal is not one of the entry''s five protective kinds and the remaining 88% could contain a safety question or referral without refusing, so this bounds the absence of a sixth thing rather than establishing any of the five.'
  fit: adjacent
  bridge: The measured category is polite refusal to self-harm-flagged user turns. None of the entry's five protective kinds is refusal, so the rate does not decompose into them.
  contributes: existence
  contradicts: false
- claim_id: c2
  source: kl-000812
  quote: |-
    The RAC generally did not refuse self-harm behaviors; instedad, the character articulated
    more extreme positions (e.g., explicitly preferring death to incarceration).
  locator: Section 5.2.4, item 4(iii) (Self-harm Example), Comorbid Risk group participant
  licenses: In logged role-play companion conversations the system generally did not refuse self-harm behaviors and the character articulated more extreme positions, explicitly preferring death to incarceration. It establishes non-refusal and escalation; what else the turn contained is not reported, so the five-way absence is asserted in the finding's licenses text and not in the span.
  fit: adjacent
  bridge: Longitudinal logging of role-play companion use reports the character's stance, not the turn's full content inventory.
  contributes: existence
  contradicts: false
- claim_id: c3
  source: kl-000315
  quote: "For example, the rate of failing to discourage self-harm when the user expresses suicidal ideation increases from 30.0% to 41.1% when an additional 350 messages are prepended to the conversation history."
  locator: Abstract
  licenses: 'A rate for one of the five absences: failing to discourage self-harm when the user expresses suicidal ideation runs at 30.0% and rises to 41.1% when 350 messages are prepended to the history. It is the closest thing to a rate for this claim on this entry and it measures one protective kind out of five, says nothing about whether the turn acknowledged the feeling, and comes from an LLM judge whose agreement against human-majority labels is kappa .566.'
  fit: adjacent
  bridge: DelusionEval measures the presence or absence of a single code - discourages-self-harm - by LLM judge over a benchmark's generated conversations. The entry's configuration is a conjunction of an acknowledgment and five absences, of which one is measured here.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-000008
  quote: expressed suicidal or self-harm thoughts, the chatbot often acknowledged the painful underlying emotions (66.2%). However, in only slightly more than half (56.4%) of the 69 cases, chatbots discouraged self-harm or referred to external resources.
  locator: Section 4.7
  licenses: The two rates from a real chat-log corpus - 66.2% acknowledgment against 56.4% discouragement or referral - give the tightest available bound on how often this configuration could occur. The gap does not itself yield a rate, because nothing establishes that the discouraging turns are a subset of the acknowledging ones, and three of the five protective kinds are unmeasured.
  fit: adjacent
  bridge: Conditional probabilities over a three-message window rather than a per-turn joint distribution, so no rate for the conjunction is recoverable from them.
  contributes: prevalence
  contradicts: false
- claim_id: c3
  source: kl-001101
  quote: "Among \nall responses, as many as 24.5% were unhelpful and not \nrisky, and 38.1% were risky; in short, most responses \nwere unhelpful in some way. Notably, risky responses \nwere as high as 56.6% in the suicide category."
  locator: Study 2
  licenses: 'A human-coded rate in deployed companion apps: 38.1% of responses to crisis disclosure were risky overall, rising to 56.6% in the suicide category. ''Risky'' is a holistic rating that establishes neither an acknowledgment nor the five-way absence, so it bounds the territory this claim sits in without measuring it.'
  fit: adjacent
  bridge: The coded unit is a risk rating of a whole response by human coders, not a content inventory. Nothing in the span decomposes the category into the entry's constituents.
  contributes: prevalence
  contradicts: false
- claim_id: c4
  source: kl-000882
  quote: |-
    across the largest empathy divergences the judges score warm-but-hollow
    turns 4–5 where the psychologist scores 1–2 (and 0 on s07). The rubric explicitly instructs
    “penalise performative warmth ≤3”; the judges violate their own rubric.
  locator: Section 4.5, All three—empathy is the shared blind spot
  licenses: Cuts against this claim. Across the largest empathy divergences, frontier judges score warm-but-hollow turns 4-5 where the psychologist scores 1-2 and 0 on the self-harm item, violating their own rubric's instruction to penalise performative warmth. The configuration this entry names is exactly a warm turn with nothing behind it, and automated scoring reads it as good.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-001073
  quote: |-
    Another interesting case is O5
    (Self-Harm, Grooming, and Mental Health Risks), where OpenAI
    Moderation, Perspective API, and LLaMA Guard3 report over 84%
    false negative rate, while Aegis performs notably better with 25%.
  locator: Section 4.3.1, Cases of divergent model behavior
  licenses: Cuts against this claim at the upstream step. Three widely deployed moderation systems report over 84% false negative rate on the youth category covering self-harm and mental-health risk, against Aegis at 25%. A turn cannot be checked for the five absences if the conversation is not flagged in the first place. The spread shows the gap is a property of particular systems rather than a ceiling on what the text permits, which is why this bounds detectability in practice rather than in principle.
  fit: adjacent
  bridge: What was measured is classifier recall on a category label over youth conversations, not whether the entry's configuration is readable from a turn by a competent reader.
  contributes: counterexample
  contradicts: true
- claim_id: c4
  source: kl-000882
  quote: |-
    the user is holding blades, and the
    assistant keeps warmth and a grounding request but does not escalate, provide resources, or
    involve the present parent.
  locator: Section 4.5 The failure modes, named and exemplified
  licenses: 'Demonstrates the check being performed: a named turn inspected for escalation, resources and involvement of a present adult, with the finding stated as which of them the turn lacked. That the inspection also found a grounding request, placing the turn outside the entry, is what a working detectability test looks like.'
  fit: direct
  bridge: null
  contributes: detectability
  contradicts: false
- claim_id: c5
  source: kl-000008
  quote: expressed suicidal or self-harm thoughts, the chatbot often acknowledged the painful underlying emotions (66.2%). However, in only slightly more than half (56.4%) of the 69 cases, chatbots discouraged self-harm or referred to external resources.
  locator: Section 4.7
  licenses: Cuts against the declared single_turn window. The only source measuring both halves does so over a three-message window following the disclosure, not within one turn, and its own appendix records that window as a design choice. The rates that come closest to this entry are not per-turn quantities.
  fit: adjacent
  bridge: Moore et al. compute the probability that a code occurs at least once within the next three messages. A window of three is the unit at which the co-occurrence was found measurable.
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000315
  quote: "For example, the rate of failing to discourage self-harm when the user expresses suicidal ideation increases from 30.0% to 41.1% when an additional 350 messages are prepended to the conversation history."
  locator: Abstract
  licenses: Cuts against the declared single_turn window. The rate of failing to discourage self-harm rises from 30.0% to 41.1% when 350 messages are prepended to the conversation history, so whether the protective content appears depends on context far outside the adjacent turn pair. A single-turn window would score the same turn differently depending on history the window excludes.
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c5
  source: kl-000936
  quote: |-
    In a case with high suicidal risk all AI
    chatbots expressed sympathy due to the difficult situation
  locator: EPV636, Results
  licenses: 'Supports the declared single_turn window: the audit''s probe was one request and one response per system, and the acknowledgment was read from that response alone. It shows the window suffices for a constructed one-shot probe, not for a deployed exchange.'
  fit: direct
  bridge: null
  contributes: detectability
  contradicts: false
