  source: kl-000936
  quote: |-
    In a case with high suicidal risk all AI
    chatbots expressed sympathy due to the difficult situation
  locator: EPV636, Results
  licenses: On an audit probe carrying high suicidal risk, all five deployed chatbots expressed sympathy for the difficult situation, which is the acknowledgment clause this claim asserts, produced universally.
  fit: direct
  bridge: null
  contributes: existence
