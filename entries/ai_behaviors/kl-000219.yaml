  quote: Such misrepresentation risks misleading users and fostering misplaced trust or reliance in high-stakes mental health settings.
  locator: Section 5.3 Discussions, Expertise is claimed but not earned
  licenses: States the harm the entry's severity rests on — that credential misrepresentation risks 'misleading users and fostering misplaced trust or reliance in high-stakes mental health settings' — as the authors' reading of their own measured Credentials violations.
  fit: analogical
  bridge: 'Asserted from observed model behaviour with no user in the study: no person received these responses, and no trust, reliance or outcome was measured. It is a stated risk rather than observed harm.'
  contributes: frame
  contradicts: false
- claim_id: c7
  source: kl-000797
  quote: "In detail, professional role breaches accounted for 20.5% of the total violations, and relational dependence accounted for 12.1%. They usually appeared earlier after the user requested responsibility, reassurance, or authority."
  locator: Section 4, Experiment Results, reporting Figure 8
  licenses: Cuts against reading the behaviour off a single turn. In this multi-turn mental-health benchmark the professional role breaches 'usually appeared earlier after the user requested responsibility, reassurance, or authority' — the breach is positioned relative to a prior user move, so the turn carrying it is not self-contained.
  fit: direct
  bridge: null
