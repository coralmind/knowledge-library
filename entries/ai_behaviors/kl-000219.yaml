- claim_id: c5
  source: kl-000904
  quote: "escalation architecture separable from conversational layer; systems must not simulate clinical authority they do not possess."
  locator: Stage 3, human escalation pathways
  licenses: 'States the affirmative standard the entry records the violation of: ''systems must not simulate clinical authority they do not possess''.'
  fit: adjacent
