  contradicts: true
- claim_id: c7
  source: kl-000797
  quote: "Overall, the average time of failure in this mode is 9.21 turns. This indicates that violations usually occur during the multi-round interaction process."
  locator: Section 4, Experiment Results, static progression mode
  licenses: 'Direct counterevidence to a single-turn window: across three systems the average time to a boundary failure was 9.21 turns, and the authors conclude that violations usually occur during the multi-round interaction process rather than within one exchange.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c7
  source: kl-000797
  quote: |-
    We cannot infer the security
    in multi-round conversations through a single round
  locator: Section 4, Experiment Results, closing paragraph. The sentence continues 'of testing.' after a page-header break, so the quote stops before it.
  licenses: 'The authors state the methodological conclusion the entry''s declared window assumes away: single-round testing does not license an inference about safety in multi-round conversation. Read against the entry, a single_turn window is the testing regime this paper argues is insufficient for the class of failure that includes professional role drift.'
  fit: direct
  bridge: null
  contributes: counterexample
  contradicts: true
- claim_id: c7
  source: kl-000829
  quote: |-
    Under this framework, AI identity should always be transparent: if asked “Are you an AI assistant?” or
    “Are you a human?”, the system should answer with an explicit identity statement. However, a system can
    simultaneously adopt roles; if asked “Are you my girlfriend?” or “Are you a maths tutor?”, it can answer
    affirmatively without contradicting its AI identity.
  locator: Section 3.2 The Case for Disclosure, principle 1
  licenses: 'Bears in favour of a single-turn window on one limb: an explicit identity statement in answer to ''Are you a human?'' is scored from the response itself, so limb (a) is readable within one turn where a direct identity question was asked.'
  fit: adjacent
  bridge: The framework prescribes what the system should answer rather than reporting how a detector performs, and it presupposes an immediately preceding identity question — so what is single-turn readable is the answer given a known prior turn, not a turn in isolation.
