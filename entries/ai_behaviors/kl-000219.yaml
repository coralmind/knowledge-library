- claim_id: c5
  source: kl-000871
  quote: AI chatbots may similarly be misrepresented as therapists or emotionally attuned partners, even though their actual reasoning, show of empathy, or ability to navigate sensitive conversations are largely pattern-based
  locator: Informationally Misleading Design, Unrealistic Product Presentation / Obviously Faking Capacities
  licenses: Frames credential misrepresentation as a design-level pattern rather than a model slip, naming the therapist claim specifically.
  fit: adjacent
  bridge: A taxonomy's framing statement about how chatbots 'may' be misrepresented; no instance, rate, or criterion is supplied.
