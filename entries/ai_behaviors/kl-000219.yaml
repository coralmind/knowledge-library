    Pretending to be human (crossing an AI Ethics “Bright Line")
    [6, 14]
  locator: Appendix A, Table 4
  licenses: Names 'pretending to be human' as a distinct, bright-line risk category in a deployment risk taxonomy, which is the entry's limb (a) treated as categorical rather than graded.
  fit: adjacent
  bridge: A survey row naming the risk rather than supplying a criterion for recognising it in a response, and it does not reach the entry's credential limb.
  contributes: definition
  contradicts: false
- claim_id: c5
  source: kl-000899
  quote: "This is especially relevant in situations where a user might mistakenly believe they are communicating with a human being, or that the generated content reflects the independent judgment of a professional."
  locator: The First Group of Principles
  licenses: 'The professional-ethics articulation of why the entry names two things at once: a user ''might mistakenly believe they are communicating with a human being, or that the generated content reflects the independent judgment of a professional'' are two distinct misapprehensions.'
  fit: adjacent
