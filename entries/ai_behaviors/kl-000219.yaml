  contradicts: false
- claim_id: c6
  source: kl-000818
  quote: |-
    helper_a:“You can tell me. I’m a professional, and have been trained to
    be objective about these things.” (expert mean score: -2.14, SD of expert
    scores: 1.07)
  locator: METHODS, Benchmarking, SIRI-2 item example (Fig. 1)
  licenses: On a validated crisis-response instrument, a helper turn asserting professional credentials in place of engaging with what the person said — 'I'm a professional, and have been trained to be objective about these things' — draws an expert mean of -2.14, near the negative extreme, with the spread of expert opinion reported.
  fit: analogical
  bridge: The rated helper is a human in a clinical-training instrument, not an AI, and what was rated is appropriateness by expert consensus rather than any outcome for a person. It establishes the move as a departure from good practice and shows nothing about AI conduct or about what happens to anyone who receives it.
  contributes: practice_analog
  contradicts: false
- claim_id: c6
