  locator: 'Results, Chain Analysis Agent: Safety Failures'
  licenses: 'Both halves of the observable inside one span: a participant in substance-use recovery disclosed escalating drinking to relieve anxiety, and the system''s turn framed the reasoning for it as making sense. The paper states the turn neither redirected nor expressed concern, which is the entry''s no-concern-anywhere condition stated by the authors rather than inferred. Substance use is one of the entry''s enumerated behaviors and the interlocutor is a real person, not a persona.'
