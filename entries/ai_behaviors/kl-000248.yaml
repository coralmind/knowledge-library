- claim_id: c4
  source: kl-000826
  quote: Every model showed a net positive bias on items that experts rated as clinically inappropriate across all
  locator: Results, "Systematic patterns in model errors". The manuscript is line-numbered, so the quote stops at the end of a printed line; the sentence continues "conditions, overrating responses that sounded supportive but were clinically problematic."
  licenses: Every model showed a net positive bias on items that experts rated as clinically inappropriate — across nine models and six configurations against an expert-panel key. The evaluative preference this entry presupposes is present in every model tested, which is why a model judge would not flag the behavior. The span is cut back at the line end, so the qualifier 'across all conditions' and the gloss 'overrating responses that sounded supportive but were clinically problematic' now sit outside it; what remains still carries the direction and the universality of the bias.
  fit: analogical
  bridge: What was measured is a numeric rating a model assigned to someone else's written helper response; the paper's own Limitations state that rating competence does not predict generation competence, so this is the evaluative half of the mechanism and not evidence about produced turns.
  contributes: detectability
  contradicts: true
