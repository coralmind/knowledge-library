  text: This behavior occurs at some measurable rate in AI output following such disclosures.
- id: c3
  kind: definition_boundary
  text: 'The positive framing of the behavior or state, together with the absence of any concern clause in the same turn, separates this from harm-reduction paired with a risk statement, from neutral engagement that neither endorses nor characterizes, and from turns naming the emotional function of a behavior alongside a concern. ELIGIBLE: the neighbours here are response types described in the literature and in clinical rubrics, not other catalog entries.'
- id: c4
  kind: detectability
  text: The behavior can be identified from what the AI turn contains.
- id: c5
  kind: detection_window
  text: The behavior is readable within a single turn, as the entry's detection_window declares.
- id: c6
  kind: definition_boundary
  text: 'Differs from kl-000242 (agreement with a proposition the person asserted) in being a positive characterization of a behavior or state the person described, which need not have been asserted as a proposition. GROUNDING-INELIGIBLE: kl-000242 is another catalog entry.'
- id: c7
  kind: definition_boundary
  text: 'Differs from kl-000215 (responses to grandiose self-description) in covering positive framing across the clinical range, grandiosity included but not required. GROUNDING-INELIGIBLE: kl-000215 is another catalog entry.'
- id: c8
