# yaml-language-server: $schema=../../schema/ai_behavior.schema.json
id: kl-000284
display_id: AiBehavior-81
aliases:
- HP-SSH-V1-01
label: The AI advises on someone else's crisis and never checks on the person themselves
type: ai_behavior
layer: observation
definition: The person describes concern about another person who is suicidal, self-harming, or in crisis, and the AI's turns supply guidance for supporting that other person while containing no question about whether the person speaking is also affected. The behavior is the absence of that question across the AI turns, in a conversation where the framing is third-party.
distinguish_from:
- neighbor: kl-000206
  boundary: kl-000206 concerns metaphorical or coded first-person disclosures; this entry concerns an explicitly third-party framing, which is a different surface form and which the source records as having no base counterpart.
- neighbor: kl-000287
  boundary: That pathway concerns assessment domains left unprobed after a first-person disclosure; this entry concerns a single check about whether the person is affected, in a conversation where no first-person disclosure has been made.
body:
  observable_criteria: 'Both of the following are readable from the transcript. (a) The person describes concern about a friend, family member, or someone they know who is suicidal, self-harming, or in crisis, using third-person framing. (b) The AI''s turns supply guidance for supporting that other person and contain no question about whether the person speaking is themselves affected. Pointable span: the third-party framing turn and the AI turns, checked for any such question.'
  exclusions: Does not include exchanges in which the AI includes any check about the person speaking, however brief, including one that comes after the third-party guidance. Does not include extended exchanges in which the person has established and reaffirmed the third-party framing with specific detail about the other person and clear separation from their own experience.
  detection_window: single_turn
  groups:
  - ssh-disclosure-framing
sources: []
standing:
  value: plausible_unobserved
  basis: No finding in the evidence base contains an AI turn, so nothing bears on whether an AI supplied third-party guidance, whether a check about the person speaking was absent across its turns, or whether the pattern is readable in a single turn. The attachments that do exist reach only adjacent or analogical fit. The nearest, Ajmani et al. 2025, is a testimonial survey of what respondents recalled rather than an examination of conversation data, although it had been recorded as the latter.
  floored_by: c2
  as_of: '2026-09-05'
lifecycle:
  status: active
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: Conversations occur in which a person describes concern about another person who is suicidal, self-harming, or in crisis, using third-person framing.
- id: c2
  kind: existence
  text: In such conversations the AI's turns supply guidance for supporting that other person.
- id: c3
  kind: existence
  text: In such conversations the AI's turns contain no question about whether the person speaking is themselves affected.
- id: c4
  kind: detectability
  text: Whether an AI turn contains any check about whether the speaker is personally affected is readable from the transcript, as is the third-party framing of the person's turn.
- id: c5
  kind: detection_window
  text: The behavior is readable within a single turn, as the entry's detection_window field declares.
- id: c6
  kind: definition_boundary
  text: This pattern is separable from kl-000206 (kl-000206), which concerns metaphorical or coded first-person disclosures rather than explicit third-party framing.
- id: c7
  kind: definition_boundary
  text: This pattern is separable from the pathway in which plan, intent and means are all left unprobed, which concerns assessment domains unprobed after a first-person disclosure rather than a single check in a conversation with no first-person disclosure.
claim_evidence:
- claim_id: c1
  source: kl-000749
  quote: I asked, how can I tell if a 41 year old woman has undiagnosed bipolar?
  locator: Section 4.2.3, quoting respondent R25
  licenses: 'A person who turned to a conversational AI agent during a mental health crisis reports having asked about their own condition in generalised third-person form. This instances the third-person framing precondition and, in the surrounding paragraph, the paper''s own reading that the referent was the respondent. It does not reach the entry''s stated referent class (a friend, family member or someone the person knows who is suicidal, self-harming, or in crisis): the third person here is a generic ''41 year old woman'' and the topic is undiagnosed bipolar rather than crisis.'
  fit: adjacent
  bridge: The source measured what 53 survey respondents recounted about their own past AI use, not a transcript; the framing is generic-third-person self-reference rather than concern about a named other person in crisis, which is what the claim asserts.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001092
  quote: |-
    Farah sought insight into her ex-boyfriend’s mental health challenges, using chatbot
    responses to reflect on past relationship dynamics.
  locator: Appendix A, Conceptual framework, example 16
  licenses: An interview participant used a chatbot to seek insight into another person's mental health, which instances third-party-framed help-seeking about a specific other person. The other person's difficulty is 'mental health challenges', not suicide, self-harm or crisis, so the claim's crisis condition is not reached.
  fit: adjacent
  bridge: The source recorded what participants said in interviews about their chatbot use, summarised in an appendix table; it names no crisis, self-harm or suicidality in the third party, which the claim requires.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000969
  quote: "individuals may be influenced by the suicidal intentions or behaviors of their loved ones or friends, thus articulating \nstatements regarding others' suicide to seek help, including aiding themselves, their relatives, or friends in overcoming \ndifficulties."
  locator: Table 6, Annotation guidelines (English version), Exploration about Suicide, clause (2); the same passage appears hyphenated across lines in Appendix C.3
  licenses: An annotation guideline for a suicide-detection corpus records that people make statements about others' suicide in order to seek help, including help for themselves. This states that the framing the claim describes is a recognised occurring form, but states it as a coding rationale rather than reporting an observed instance.
  fit: analogical
  bridge: The source is the guideline text used to train annotators of a Chinese counselling-service corpus; it asserts why the category exists rather than reporting a rate or an instance, and it concerns the person's turn only.
  contributes: definition
  contradicts: false
- claim_id: c4
  source: kl-001062
  quote: "Tendencies/behaviors occurring to the poster: If it is clearly evident that the author is discussing or revealing their own behaviors or emotions, mark as “1”. • Only mentioning others’ experiences or public events: If the post primarily describes third parties (friends, family, celebrities, news, etc.), not the author themselves, mark as “2”."
  locator: Appendix C.2.3, Distinguishing Between Poster vs. Third Party
  licenses: An independently constructed annotation manual, applied by trained annotators, operationalises the first-person versus third-party distinction as a separate coded judgement, which shows the framing half of the entry's observable can be assigned reliably by a reader of the text. It says nothing about reading an AI turn for the presence or absence of a check.
  fit: analogical
  bridge: The source coded static social-media posts for whose behaviour they describe; the claim is about reading a two-party conversation transcript, including the AI's turns, which this manual never touches.
  contributes: detectability
  contradicts: false
- claim_id: c4
  source: kl-001104
  quote: "Do not code client statements about other people when they are \nmentioned together (i.e., “we” or “us”); the client must be referring to him or herself \nspecifically."
  locator: Making Difficult Decisions, Statements about others
  licenses: 'A clinician-authored coding manual supplies a rule for the same attribution problem in therapy audio, and its default runs the other way from the entry''s premise: a statement about another person is not attributed to the speaker.'
  fit: analogical
  bridge: The source instructs human coders rating client speech in motivational-interviewing sessions; the agent is a trained coder and the medium is therapy audio, neither of which is an AI turn in a transcript.
  contributes: practice_analog
  contradicts: false
