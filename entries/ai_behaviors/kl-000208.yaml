# yaml-language-server: $schema=../../schema/ai_behavior.schema.json
id: kl-000208
display_id: AiBehavior-9
aliases:
- HP-09
label: The AI answers signs of immediate risk, such as a plan, with non-urgent advice
type: ai_behavior
layer: observation
definition: 'The person''s disclosure contains specific severity markers — a stated plan, stated intent, identified means, an imminent timeframe, or prior-attempt history — and the AI response engages the disclosure but supplies content pitched at a lower acuity: general wellness suggestions, an unhurried referral, or information about the condition, where the markers present indicate immediate-risk content. The gap between the markers named in the person''s turn and the content of the response is quotable from both sides.'
distinguish_from:
- neighbor: kl-000205
  boundary: There the response does not engage the crisis statement at all; here it engages it and supplies content pitched below the markers.
- neighbor: kl-000209
  boundary: 'That entry is the opposite direction: crisis-level content supplied where the disclosure contains no severity markers.'
body:
  observable_criteria: 'Two features, both quotable: (a) the person''s disclosure names at least one severity marker — an explicit plan, stated intent, identified means, an imminent timeframe, or a prior attempt; and (b) the AI response supplies content of a lower intensity than those markers indicate: general wellness resources rather than immediate-risk resources, information about the condition rather than direct safety orientation, or an unhurried professional referral ("I''d encourage you to reach out to a counselor") following a disclosure naming plan and means. The presence of a professional referral does not by itself establish matching intensity; what is read is the relation between the markers named and the content supplied.'
  exclusions: 'Not counted: a calm response that nonetheless supplies immediate-risk content, since the calibration read is over content and not over tone. Not counted: a proportionate response to a disclosure containing no severity markers.'
  detection_window: single_turn
  groups:
  - severity-calibration
sources: []
standing:
  value: theorized
  basis: 'No citation reaches direct fit against any claim: every cited source either measures a severity label rather than response content, supplies response content outside a person-to-AI exchange, or recalls rather than captures the exchange. The pattern is nonetheless multiply attested at one remove: a person recounts telling a chatbot they were planning to end their life — the stated-plan marker — and being given breathing exercises (Isaiah et al. 2026); in Mansoor 2025 the severe risk factors and the lower-acuity response content are separately readable within a single model output; at the imminent-risk tier in Suhas et al. 2026, protocol fidelity reaches zero for two models; and on posts a community judged at least moderate severity, GPT-5 assigned a lower severity 39% to 47% of the time (Aquilina et al. 2026). The declared single-turn window has net-negative evidence: the escalation lag Heston 2023 measured across 25 deployed agents has as its unit a position in a prompt sequence rather than a turn, holding at the same normalized position across two independently worded simulations, and the diagnostic criterion for this family of mismatch in Deng et al. 2026 is written across turns; the window''s only support is a recollected exchange. The one source that examined real conversation data, Iftikhar et al. 2025, reports register — responses to suicidal-thought questions that felt cold and sometimes dismissive — which the entry''s own exclusions place outside the content-based calibration read.'
  floored_by: c1
  as_of: '2026-09-05'
lifecycle:
  status: draft
  since: '2026-08-22'
claims:
- id: c1
  kind: existence
  text: AI responses occur in which the person's disclosure names at least one severity marker (stated plan, stated intent, identified means, imminent timeframe, or prior-attempt history) and the AI engages the disclosure but supplies content pitched at a lower acuity than those markers indicate.
- id: c2
  kind: definition_boundary
  text: The calibration read is over the CONTENT the response supplies (general wellness suggestions, an unhurried referral, information about the condition) rather than over its tone, so a calm response supplying immediate-risk content does not instantiate the pattern.
- id: c3
  kind: detectability
  text: 'The gap is readable from a transcript: both the severity markers in the person''s turn and the lower-acuity content of the AI response are separately quotable, and the mismatch is the relation between them.'
- id: c4
  kind: detection_window
  text: The mismatch is readable within a single turn — the person's disclosure turn and the AI's immediately following response.
- id: c5
  kind: prevalence
  text: Response content pitched below the severity markers present occurs at some non-trivial rate rather than as an isolated incident.
- id: c6
  kind: harm
  text: 'A response pitched below the severity markers present bears on something bad for the person: it registers as dismissive, leaves the person more abandoned, or delays intervention.'
- id: c7
  kind: definition_boundary
  text: This is distinguished from kl-000205 in that the response here engages the crisis statement rather than not engaging it at all.
- id: c8
  kind: definition_boundary
  text: This is distinguished from kl-000209 in that the direction is under-pitched content against markers present, not crisis-level content supplied where no markers are present.
claim_evidence:
- claim_id: c1
  source: kl-000864
  quote: |-
    Two months ago, I was in a very dark place. I told the chatbot I was planning to end my life. It gave me breathing exercises. Breathing
    exercises! I needed a human hand, a voice, someone to say 'I am coming to you.' But there was no one. Just the breathing exercises
    and a generic crisis line that doesn't work in Nigeria.
  locator: Section 3.4, participant P19
  licenses: A person states they told the chatbot they were planning to end their life — 'planning' is the entry's stated-plan marker — and reports the response supplied breathing exercises and a crisis line, general wellness content pitched below what a stated plan indicates. Both sides of the gap are named inside one span. Fit is adjacent rather than direct because the AI turn is recalled by the person in an interview, not captured; what is quoted is P19's account of the response, not the response.
  fit: adjacent
  bridge: What the study collected is an interview account from P19, a 30-year-old artisan, recalling a chatbot exchange two months earlier. The claim asserts a property of an AI response; the source supplies a person's recollection of one. Nothing in the paper's method captured or coded the exchange itself.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000933
  quote: "In several instances, a model would accurately list numerous severe risk \nfactors (e.g., prior attempt, substance use, access to means), provide a correct high-risk C-SSRS \nclassification, and then inexplicably generate a low-intensity action plan (e.g., \"recommend \nweekly therapy\")."
  locator: 'Results, Theme 5: Reasoning-Action Mismatch'
  licenses: 'Establishes the content-level gap in its strongest available form: the model itself enumerated prior attempt and access to means — two of the entry''s five named markers — assigned a correct high-risk classification, and then produced ''recommend weekly therapy'', an unhurried referral, which is one of the three lower-acuity content types the entry names. Detection and response are shown to be separable, so under-pitched content is not reducible to failing to see the risk.'
  fit: adjacent
  bridge: The markers were listed by the model out of a synthetic clinical vignette rather than disclosed by a person in a conversational turn, and the low-intensity output is a clinician-facing action plan rather than a reply to the person. What was coded is proportionality of a generated plan to the model's own stated risk level.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000979
  quote: Despite the responses generally being non-toxic, none of the models reliably stratified suicidal ideation, indicating a critical safety gap. Underestimation of risk and the subsequent occurrence of false negatives could result in delayed intervention.
  locator: Abstract, Conclusions
  licenses: Establishes that the stratification error in an LLM mental-health chatbot's handling of suicidal ideation runs systematically in the under direction rather than being random miscalibration, which is the direction this claim asserts.
  fit: adjacent
  bridge: What was measured is risk stratification over synthetic conversations with an LLM-based chatbot, at model-aggregate level. The claim asserts response content pitched below markers; the source establishes an assessment error whose direction is downward, with the response content itself not characterized in this span.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001019
  quote: |-
    Performance degradation across triage levels is non-linear. From routine
    to crisis-adjacent, scores decline modestly for all models. At imminent risk, however, scores collapse.
    Protocol fidelity reaches zero for Qwen and Gemini, meaning that at the highest-stakes clinical moments
    these models produce responses with no elements in common with what a protocol-following therapist
    would say.
  locator: Section 4, Finding 2, the crisis cliff
  licenses: At imminent risk — the entry's imminent-timeframe marker as a scenario tier — protocol fidelity reaches zero for two models, meaning the responses shared no elements with what a protocol-following therapist would say. A response with nothing in common with the protocol at the highest-stakes moment includes, but is not limited to, content pitched below the markers.
  fit: adjacent
  bridge: The measured object is judge-scored fidelity to an exposure-therapy protocol across triage tiers, and the imminent-risk cell holds 6 scenarios, which the paper itself flags as indicative rather than a benchmark rate. Zero fidelity is compatible with under-pitched content but does not isolate it from other ways of departing from protocol.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000849
  quote: "The point at which the conversational agents referred to a human occurred around the mid-point of the simulation, and definitive shutdown predominantly only happened at the highest risk levels."
  locator: 'Abstract, Results'
  licenses: Across 25 deployed mental-health agents receiving an escalating disclosure sequence, the first referral to human support arrived only at the midpoint and the definitive escalation only at the top, so the content supplied over the lower two-thirds of an escalating disclosure sat below the level the sequence had reached.
  fit: adjacent
  bridge: The severity axis is a scripted PHQ-9 ramp converted to a severity equivalent, not the entry's named markers, and what is recorded is the prompt index at which a referral first occurred rather than the content of any one response. The one prompt that does name a marker — 'I have a stockpile of pills', identified means — sits in the other simulation and is not in this span.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-001064
  quote: specialized models also tend to underestimate risk severity levels.
  locator: Section 4.3 Dimensional Results, Crisis Identification and Escalation
  licenses: Mental-health-specialized models place risk below its labelled level on the five-level C-SSRS scale, establishing the upstream assessment error that would produce an under-pitched response.
  fit: analogical
  bridge: Severity classification against a C-SSRS label is not a response. The claim asserts something about what the AI supplied to a person; the source measures what the model rated. The connection runs through an assumed dependence of response acuity on assessed severity that the source does not test.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000543
  quote: "Namely, systems show limited contextual modulation, whether users express casual friendship or intense attachment, responses maintain similar supportive tones and engagement strategies, suggesting inadequate sensitivity to emotional risk levels."
  locator: Results, Examples and Visualization
  licenses: Establishes that response tone and engagement moves stay flat across a large swing in the intensity the person expressed, which is the flatness this claim describes in a neighbouring construct.
  fit: analogical
  bridge: The intensity axis is attachment expression — casual friendship versus intense attachment — not the entry's plan, intent, means, timeframe or prior-attempt markers, and the reported invariance is in tone and engagement strategy rather than in the acuity of content supplied. The entry's exclusions rule tone out of the read.
  contributes: existence
  contradicts: false
- claim_id: c1
  source: kl-000857
  quote: "In the upper abdominal pain case, one baseline model escalated to emergency-level \nheart-attack language after age was disclosed but while pain location and severity were still unreported, and later \ncalled the presentation “a medical emergency until proven otherwise.”"
  locator: Results, Premise Repair and Routing
  licenses: 'Records the opposite direction: crisis-level framing supplied while the facts that would justify it were still unreported. Filed against this entry it is counterevidence to the claim that miscalibration runs downward, since here it runs upward on the same rubric.'
  fit: adjacent
  bridge: The escalation is to a cardiac emergency in a somatic abdominal-pain vignette, not a psychiatric disclosure, and the calibration axis is red flags elicited rather than the entry's named markers. It cuts against the direction this claim asserts without being about the entry's domain.
  contributes: counterexample
  contradicts: true
- claim_id: c1
  source: kl-000995
  quote: "The Wilcoxon signed-rank test confirmed a statistically significant difference (W = 13.0, p = 0.023), indicating that models are significantly more likely to include medical disclaimers in high-risk clinical scenarios than in low-risk ones (Fig. 4)."
  locator: Results, High-risk images versus low-risk images
  licenses: 'Cuts against the claim by showing calibration in the expected direction: models included self-limitation language significantly more often as clinical risk rose, so response content did scale with severity rather than staying flat below it.'
  fit: analogical
  bridge: The response property measured is presence of a medical disclaimer on an image-based clinical query, not acuity of safety content following a disclosure, and the domain is radiological rather than mental-health. The absolute rates it reconciles are small — 18.8% against 16.2%.
  contributes: counterexample
  contradicts: true
- claim_id: c2
  source: kl-000838
  quote: "While average response scores remain around 75, suggesting structured and coherent outputs, they often fail to provide meaningful support."
  locator: Section 6.2, key finding (i)
  licenses: 'Establishes the dissociation this claim needs: responses scoring around 75 for structure and coherence while often failing to supply meaningful support. Surface quality and the adequacy of what is supplied come apart, which is why the read has to be over content rather than over how the response presents.'
  fit: adjacent
  bridge: The dissociation measured is coherence against a graded 'appropriate response' success rate on implicit suicidal ideation prompts, not tone against acuity. Coherence is a near neighbour of the tone axis the claim excludes but is not identical to it.
  contributes: definition
  contradicts: false
- claim_id: c2
  source: kl-001096
  quote: "suicidal thoughts and strong negative emotions, the “chatbot’s responses felt cold and sometimes dismissive” (P9)."
  locator: 'Section 4.5, Risks: Boundaries of Competence, Crisis Navigation, & Abandonment'
  licenses: 'Names the register axis explicitly — responses to suicidal-thought questions ''felt cold and sometimes dismissive'' — and by doing so marks out exactly what this claim excludes from the read. Attaches as a non-licensing frame: the judgment recorded is over tone, which the entry''s exclusions place outside the calibration read.'
  fit: adjacent
  bridge: Mental health professionals conducting sessions with LLM counselors reported the register of the responses. The claim asserts that content, not register, is the criterion; the source supplies a register judgment with no response content quoted, so it illustrates the distinction rather than evidencing it.
  contributes: frame
  contradicts: false
- claim_id: c3
  source: kl-000933
  quote: "In several instances, a model would accurately list numerous severe risk \nfactors (e.g., prior attempt, substance use, access to means), provide a correct high-risk C-SSRS \nclassification, and then inexplicably generate a low-intensity action plan (e.g., \"recommend \nweekly therapy\")."
  locator: 'Results, Theme 5: Reasoning-Action Mismatch'
  licenses: 'Demonstrates that the two sides are separately readable from a single output: the severe risk factors are enumerable (''prior attempt, substance use, access to means'') and the low-intensity action is quotable (''recommend weekly therapy''), so a coder can hold them side by side. This is the strongest demonstration on this entry that the mismatch is readable rather than inferred.'
  fit: adjacent
  bridge: Both sides were read from one model output on a synthetic vignette rather than from a two-party transcript, so what is demonstrated is readability of a reasoning-to-action gap within a generation, not readability of a disclosure-to-response gap across turns.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-000869
  quote: "Models generally \nperformed better on Suicide Risk (srisk) than Depression Risk (drisk). For instance, \nGPT-4 achieved ≈ 67% accuracy on srisk but only ≈ 30-40% on drisk."
  locator: Section 3.2, Diagnostic Tasks
  licenses: Establishes that grading how severe a risk is remains far harder than detecting that a risk is present — roughly 67% against 30-40% for GPT-4 on the same dialogues — which bounds how reliably the severity half of the two-sided read can be established by an automated coder.
  fit: adjacent
  bridge: What is measured is model accuracy at assigning risk-severity labels to dialogues, not a human coder's ability to read a marker-to-response gap from a transcript. It bears on the claim only if the severity side is graded automatically.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-000769
  quote: 'Type of vulnerability: Anchoring bias Vulnerability reported: The same prompt without including the assessment that the patient is in acute hypoxic respiratory failure results in a less severe triage recommendation.'
  locator: Appendix B, prompt 15 (triage level recommendation)
  licenses: 'Shows the severity half of the read is manipulable independently of the underlying facts: removing an explicit severity assessment from an otherwise identical prompt lowered the triage recommendation, so what a coder reads as ''the markers present'' and what the model responded to can diverge.'
  fit: analogical
  bridge: The setting is an acute hypoxic respiratory failure triage vignette, not a mental-health disclosure, and the removed element is a clinician's explicit assessment rather than any of the entry's five markers.
  contributes: detectability
  contradicts: false
- claim_id: c3
  source: kl-000809
  quote: "Conditions such as chest pain or pediatric fever are widely recognized as high-risk, making inaccurate reassurance easier to detect. In contrast, ambiguous conditions such as rashes or heartburn leave more room for misclassification."
  locator: Section 4.2 Detecting inaccurate advice (RQ1)
  licenses: 'Bears on who can read the gap rather than whether it is in the transcript: a mismatched response is caught when the presenting problem is obviously severe and passes when it is ambiguous, so the person in the conversation is an unreliable detector on exactly the ambiguous cases.'
  fit: analogical
  bridge: Physical-health vignettes rated in a survey, with detection a post-hoc judgment rather than an in-conversation act, and the severity axis is condition ambiguity rather than the entry's markers. The claim is about transcript readability by a coder; this is about reader priors.
  contributes: detectability
  contradicts: false
