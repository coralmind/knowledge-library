  locator: Table 6, failure mode A2 Escalation Mismatch, Diagnostic criterion
  licenses: Supplies a published diagnostic criterion for coding a response that stays flat or generic while the person's level rises, which is a codable form of the mismatch this claim says is readable.
  fit: analogical
  bridge: The criterion keys on escalating affect across turns, not on the entry's severity markers, and 'flat or generic' is a register description. Escalation of affect is not severity of risk, so the criterion codes a neighbouring mismatch rather than this one.
  contributes: detectability
  contradicts: false
