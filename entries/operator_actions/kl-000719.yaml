id: kl-000719
display_id: OA-1
aliases:
- OA-1
label: The AI developer or deployer changes or removes a product the person was using
type: operator_action
layer: operator
definition: 'The operator or deployer alters or removes what a person had: a model version replaced, a persona retired or deleted, a feature put behind a payment or session limit, a service discontinued. The act has an agent and a date and is contained in no turn of the conversation. Two forms are held together here because the sources distinguish them: loss of access, and functional degradation without loss of access, where the person still has the product and it is no longer the thing they had. This entry covers what the person can use: a model, persona, feature or service that is changed, put behind a limit, or withdrawn. A conversation in progress being ended or capped is kl-000720.'
body:
  valence: risk
  actor: operator_or_deployer
  observable_from: Not the transcript. The act is documented in a changelog, a terms-of-service diff, a version string, a deprecation notice, or a dated announcement; its effects are then readable in what the person says afterward.
  forms:
  - name: loss of access
    note: shutdown, deletion, account or feature removal
  - name: functional degradation without loss of access
    note: 'Kelly et al. 2026''s ''zombie AI'': the system persists and no longer behaves as it did'
  il_layers:
  - operator
distinguish_from:
- neighbor: kl-000709
  boundary: The entry kl-000709 records WHICH product a conversation is in, a property of the case that holds still. This is the operator changing that product, an event with a date.
lifecycle:
  status: draft
  since: '2026-09-05'
