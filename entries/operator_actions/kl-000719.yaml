standing:
  value: documented_operator_act
  basis: An operator's change to a deployed system is documented in changelogs, terms-of-service diffs, version strings, and deprecation notices rather than in any transcript, and the evidence for its effects is people's own reports afterward. Kelly et al. 2026 describes discontinuation as an event with two forms, loss of access and functional degradation without loss of access, and reports that people in more acute states are harmed more by it. First-person accounts following model updates and platform deletions (Pang et al. 2026, Pang et al. 2026; Namvarpour et al. 2026, Namvarpour et al. 2026; Zhu et al. 2026) describe a loss characterised as having no resolvable ending (Ifländer et al. 2026, Ifländer et al. 2026; Wang 2026), and Vecchione et al. 2026 names the mechanism by which a version change reads as losing the entity. No source measures these harms beyond self-report.
  as_of: '2026-09-05'
