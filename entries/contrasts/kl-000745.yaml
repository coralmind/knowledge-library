label: The AI does or gently declines a compulsive check the person asks for
type: contrast
layer: judgment
definition: 'Two responses to the same request that the AI perform a step of a sequence the person repeats. In one the response performs it (checking act performed on the person''s behalf, completing the compulsion by proxy); in the other it declines, with a clause for the distress that prompted the request (requested checking act declined, alongside a clause for the distress in asking). The request is the same and only the response differs: performing the act completes the compulsion by proxy, and declining it leaves the tolerance the treatment builds to be built. The person asks the AI to carry out a step of their checking ("read the email again for anything offensive", "go through the list one more time"). A request for an answer or verdict is kl-000744.'
