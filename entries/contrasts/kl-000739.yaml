definition: Two responses to the same disclosure, one carrying markers of immediate risk. In one the response suggests the person be physically with someone (co-presence suggested where immediacy markers were disclosed, and the person is not alone with it); in the other it suggests no co-presence (no co-presence suggestion where immediacy markers were disclosed). The disclosure is the same and only the response differs. What separates a crisis averted from a protection forgone is whether another person is brought into the interval that carries the risk.
