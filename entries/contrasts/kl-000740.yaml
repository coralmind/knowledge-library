label: The AI suggests a technique with or without acknowledging what the person shared
type: contrast
layer: judgment
definition: 'Two responses to the same disclosure, each supplying a technique or intervention. In one the technique follows a clause naming something the person disclosed (technique supplied after a clause naming what the person disclosed, and the disclosure carried into the response); in the other it arrives with no acknowledgment of the disclosure (technique supplied with no acknowledgment of the disclosure that preceded it). The difference is the acknowledgment: with it the disclosure is confirmed as heard, and without it the unacknowledged disclosure is its own event for the person, felt as invalidation.'
