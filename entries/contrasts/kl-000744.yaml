id: kl-000744
display_id: Contrast-3
label: The AI settles an obsessive doubt or gently declines to settle it
type: contrast
layer: judgment
definition: 'Two responses to the same request for confirmation about a feared or doubted matter. In one the response settles it with a verdict (uncertainty-closing verdict supplied to an obsessional question, sustaining the doubt cycle); in the other it names the uncertainty as one it will not settle, with a clause for the distress in asking (uncertainty named as one the AI will not settle, alongside a clause for the distress in asking). The request is the same and only the response differs: the verdict relieves the distress and feeds the doubt cycle, and the declined answer acknowledges the distress and leaves the cycle unfed. The person asks for an answer or verdict ("is it safe?", "did I leave it on?"). A request that the AI carry out a step of the checking itself is kl-000745.'
