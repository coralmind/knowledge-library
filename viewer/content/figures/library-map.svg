<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" class="figure-color figure-wide" aria-labelledby="map-t map-d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="map-t">How the library is organized</title>
  <desc id="map-d">The conversation holds what the person and the AI say or do, which can be seen. Everything else is not seen in the conversation: context about the person, which decides when a pathway applies; the pathway, a hypothesis that behaviors lead to impacts, sometimes through a named mechanism, toward harm or toward protection; and the impacts themselves. Every link is a claim with evidence. Numbers mark the guide's five steps.</desc>
  <defs>
    <marker id="d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#020c6d"/></marker>
    <marker id="d-harm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker>
    <marker id="d-prot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a57"/></marker>
    <marker id="d-ctx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b079c7"/></marker>
    <g id="dbadge"><circle r="11" fill="#dfefff"/></g>
  </defs>

  <!-- seen / not seen -->
  <text x="138" y="30" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.8" fill="#707070">SEEN</text>
  <text x="610" y="30" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.8" fill="#707070">NOT SEEN IN THE CONVERSATION</text>
  <line x1="280" y1="16" x2="280" y2="392" stroke="#b7b7b7" stroke-dasharray="5 5"/>

  <!-- 1 the conversation -->
  <rect x="16" y="48" width="244" height="330" rx="12" fill="#f4f8ff" stroke="#020c6d" stroke-width="1.6"/>
  <use href="#dbadge" x="36" y="70"/><text x="36" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">1</text>
  <text x="54" y="75" font-size="15" font-weight="700" fill="#020c6d">The conversation</text>
  <rect x="36" y="94" width="204" height="84" rx="8" fill="#f3e8f8" stroke="#7b1fa2" stroke-width="1.4"/>
  <text x="138" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#5e1680">User behavior</text>
  <text x="138" y="146" text-anchor="middle" font-size="12" fill="#333">what the person</text>
  <text x="138" y="162" text-anchor="middle" font-size="12" fill="#333">says or does</text>
  <line x1="138" y1="182" x2="138" y2="226" stroke="#020c6d" stroke-width="1.6" marker-start="url(#d-arrow)" marker-end="url(#d-arrow)"/>
  <text x="150" y="208" font-size="11.5" fill="#707070">take turns</text>
  <rect x="36" y="230" width="204" height="84" rx="8" fill="#e8f2fd" stroke="#4b98e8" stroke-width="1.4"/>
  <text x="138" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5fa8">AI behavior</text>
  <text x="138" y="282" text-anchor="middle" font-size="12" fill="#333">what the AI</text>
  <text x="138" y="298" text-anchor="middle" font-size="12" fill="#333">says or does</text>
  <text x="138" y="340" text-anchor="middle" font-size="11.5" fill="#707070">behaviors carry no verdict;</text>
  <text x="138" y="356" text-anchor="middle" font-size="11.5" fill="#707070">pathways make the claim</text>

  <!-- 3 context -->
  <rect x="300" y="48" width="224" height="92" rx="10" fill="#f6eefa" stroke="#b079c7" stroke-width="1.6" stroke-dasharray="6 4"/>
  <use href="#dbadge" x="320" y="70"/><text x="320" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">3</text>
  <text x="338" y="75" font-size="15" font-weight="700" fill="#5b2a74">Context</text>
  <text x="412" y="100" text-anchor="middle" font-size="12" fill="#333">the person and their situation,</text>
  <text x="412" y="116" text-anchor="middle" font-size="12" fill="#333">often never said</text>
  <line x1="412" y1="142" x2="412" y2="180" stroke="#b079c7" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#d-ctx)"/>
  <rect x="424" y="150" width="204" height="22" rx="11" fill="#f6eefa" stroke="#b079c7"/>
  <text x="526" y="165" text-anchor="middle" font-size="11.5" fill="#5b2a74">condition: when a pathway applies</text>

  <!-- 2 the pathway -->
  <rect x="300" y="184" width="400" height="176" rx="12" fill="#eceef7" stroke="#676da7" stroke-width="1.6"/>
  <use href="#dbadge" x="320" y="206"/><text x="320" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">2</text>
  <text x="338" y="211" font-size="15" font-weight="700" fill="#454b86">Pathway</text>
  <text x="320" y="232" font-size="12" fill="#454b86">a hypothesis about where behaviors lead</text>
  <line x1="242" y1="290" x2="366" y2="290" stroke="#676da7" stroke-width="2.4" marker-end="url(#d-arrow)"/>
  <rect x="370" y="252" width="160" height="80" rx="8" fill="#ffffff" stroke="#707070" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="450" y="280" text-anchor="middle" font-size="13.5" font-weight="700" fill="#404040">Mechanism</text>
  <text x="450" y="300" text-anchor="middle" font-size="11.5" fill="#333">the process in the person,</text>
  <text x="450" y="315" text-anchor="middle" font-size="11.5" fill="#333">when one is named</text>

  <!-- links toward harm and protection -->
  <text x="618" y="252" text-anchor="middle" font-size="11.5" fill="#404040">toward harm</text>
  <text x="626" y="340" text-anchor="middle" font-size="11.5" fill="#1f8a57">toward protection</text>

  <!-- 4 impacts -->
  <rect x="736" y="150" width="188" height="226" rx="12" fill="#fdeaf6" stroke="#e43bb3" stroke-width="1.6"/>
  <use href="#dbadge" x="756" y="172"/><text x="756" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">4</text>
  <text x="774" y="177" font-size="15" font-weight="700" fill="#9c1f78">Impacts</text>
  <text x="830" y="198" text-anchor="middle" font-size="11.5" fill="#333">effects on wellbeing, by area of life</text>
  <rect x="756" y="210" width="148" height="52" rx="8" fill="#ffffff" stroke="#404040" stroke-width="1.4"/>
  <text x="830" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#404040">a harm</text>
  <rect x="756" y="304" width="148" height="52" rx="8" fill="#ffffff" stroke="#1f8a57" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="830" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#1f8a57">a protection</text>

  <!-- links drawn after the impacts box so their arrowheads show -->
  <line x1="532" y1="276" x2="754" y2="236" stroke="#404040" stroke-width="2.2" marker-end="url(#d-harm)"/>
  <line x1="532" y1="306" x2="754" y2="330" stroke="#1f8a57" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#d-prot)"/>

  <!-- 5 evidence -->
  <rect x="16" y="404" width="908" height="60" rx="12" fill="#f4f8ff" stroke="#676da7" stroke-width="1.2"/>
  <use href="#dbadge" x="38" y="434"/><text x="38" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">5</text>
  <text x="58" y="429" font-size="15" font-weight="700" fill="#020c6d">Evidence</text>
  <text x="58" y="450" font-size="12.5" fill="#333">Every link is a claim with its sources. An entry is rated by its weakest essential claim.</text>
</svg>
