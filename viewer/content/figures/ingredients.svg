<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 470" width="470" height="470" role="img" aria-labelledby="in-t in-d" class="figure-color" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="in-t">Actors, interaction, impact</title>
  <desc id="in-d">Two actors, the person and the AI system, take turns in a conversation: user behavior and AI behavior. The conversation may lead to an impact on the person's wellbeing, and that impact lands back on the person. Numbers mark the guide's steps.</desc>
  <defs>
    <marker id="in-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#020c6d"/></marker>
    <marker id="in-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#676da7"/></marker>
    <marker id="in-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e43bb3"/></marker>
    <g id="in-badge"><circle r="11" fill="#dfefff"/></g>
  </defs>
  <g transform="translate(30 0)">

  <!-- actors -->
  <text x="16" y="20" font-size="11" font-weight="700" letter-spacing="0.8" fill="#707070">ACTORS</text>
  <rect x="16" y="30" width="196" height="78" rx="10" fill="#f6eefa" stroke="#b079c7" stroke-width="1.6" stroke-dasharray="6 4"/>
  <use href="#in-badge" x="36" y="52"/><text x="36" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">3</text>
  <text x="54" y="57" font-size="15" font-weight="700" fill="#5b2a74">The person</text>
  <text x="114" y="80" text-anchor="middle" font-size="12" fill="#333">who they are and</text>
  <text x="114" y="95" text-anchor="middle" font-size="12" fill="#333">their situation</text>
  <rect x="228" y="30" width="196" height="78" rx="10" fill="#f2f3f5" stroke="#404040" stroke-width="1.6"/>
  <use href="#in-badge" x="248" y="52"/><text x="248" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">3</text>
  <text x="336" y="57" text-anchor="middle" font-size="15" font-weight="700" fill="#101010">The AI system</text>
  <text x="326" y="80" text-anchor="middle" font-size="12" fill="#333">how it is built and</text>
  <text x="326" y="95" text-anchor="middle" font-size="12" fill="#333">what it is for</text>
  <line x1="114" y1="110" x2="150" y2="150" stroke="#020c6d" stroke-width="1.6" marker-end="url(#in-arrow)"/>
  <line x1="326" y1="110" x2="290" y2="150" stroke="#020c6d" stroke-width="1.6" marker-end="url(#in-arrow)"/>

  <!-- interaction -->
  <text x="16" y="146" font-size="11" font-weight="700" letter-spacing="0.8" fill="#707070">INTERACTION</text>
  <rect x="16" y="156" width="408" height="134" rx="12" fill="#f4f8ff" stroke="#020c6d" stroke-width="1.6"/>
  <use href="#in-badge" x="36" y="178"/><text x="36" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">1</text>
  <text x="54" y="183" font-size="15" font-weight="700" fill="#020c6d">The conversation</text>
  <rect x="30" y="198" width="164" height="76" rx="8" fill="#f3e8f8" stroke="#7b1fa2" stroke-width="1.4"/>
  <text x="112" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#5e1680">User behavior</text>
  <text x="112" y="244" text-anchor="middle" font-size="12" fill="#333">what the person</text>
  <text x="112" y="259" text-anchor="middle" font-size="12" fill="#333">says or does</text>
  <line x1="198" y1="236" x2="242" y2="236" stroke="#020c6d" stroke-width="1.6" marker-start="url(#in-arrow)" marker-end="url(#in-arrow)"/>
  <text x="220" y="226" text-anchor="middle" font-size="10.5" fill="#707070">turns</text>
  <rect x="246" y="198" width="164" height="76" rx="8" fill="#e8f2fd" stroke="#4b98e8" stroke-width="1.4"/>
  <text x="328" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5fa8">AI behavior</text>
  <text x="328" y="244" text-anchor="middle" font-size="12" fill="#333">what the AI</text>
  <text x="328" y="259" text-anchor="middle" font-size="12" fill="#333">says or does</text>

  <!-- leads to -->
  <line x1="260" y1="292" x2="260" y2="372" stroke="#676da7" stroke-width="3" marker-end="url(#in-path)"/>
  <use href="#in-badge" x="286" y="326"/><text x="286" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">2</text>
  <text x="304" y="325" font-size="14" font-weight="700" fill="#454b86">Pathway</text>
  <text x="304" y="342" font-size="12" fill="#333">may lead to</text>

  <!-- impact -->
  <text x="16" y="370" font-size="11" font-weight="700" letter-spacing="0.8" fill="#707070">IMPACT</text>
  <rect x="96" y="378" width="328" height="76" rx="10" fill="#fdeaf6" stroke="#e43bb3" stroke-width="1.6"/>
  <use href="#in-badge" x="116" y="400"/><text x="116" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">4</text>
  <text x="134" y="405" font-size="15" font-weight="700" fill="#9c1f78">Impact</text>
  <text x="260" y="430" text-anchor="middle" font-size="12.5" fill="#333">on the person's wellbeing,</text>
  <text x="260" y="446" text-anchor="middle" font-size="12.5" fill="#333">carried out of the conversation</text>

  </g>

  <!-- lands back on the person, routed outside the conversation -->
  <path d="M124,430 L28,430 Q18,430 18,420 L18,80 Q18,70 28,70 L42,70" fill="none" stroke="#e43bb3" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#in-back)"/>
  <text x="12" y="250" text-anchor="middle" font-size="11" fill="#9c1f78" transform="rotate(-90 12 250)">lands on the person</text>
</svg>
