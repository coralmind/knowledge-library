<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" width="440" height="500" role="img" aria-labelledby="ov-t ov-d" class="figure-color" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="ov-t">How a conversation can affect a person</title>
  <desc id="ov-d">In the conversation, which can be seen, the person and the AI take turns: user behavior and AI behavior. Not seen in the conversation: context about the person, which decides when a pathway applies, and the pathway itself, the claim that the conversation leads to impacts on the person's wellbeing, harmful or protective. Numbers mark the steps.</desc>
  <defs>
    <marker id="ov-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#020c6d"/></marker>
    <marker id="ov-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#676da7"/></marker>
    <marker id="ov-ctx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b079c7"/></marker>
    <g id="ov-badge"><circle r="11" fill="#dfefff"/></g>
  </defs>

  <!-- seen -->
  <text x="16" y="22" font-size="11" font-weight="700" letter-spacing="0.8" fill="#707070">SEEN</text>
  <rect x="16" y="34" width="408" height="150" rx="12" fill="#f4f8ff" stroke="#020c6d" stroke-width="1.6"/>
  <use href="#ov-badge" x="36" y="56"/><text x="36" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">1</text>
  <text x="54" y="61" font-size="15" font-weight="700" fill="#020c6d">The conversation</text>
  <rect x="30" y="78" width="164" height="88" rx="8" fill="#f3e8f8" stroke="#7b1fa2" stroke-width="1.4"/>
  <text x="112" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#5e1680">User behavior</text>
  <text x="112" y="128" text-anchor="middle" font-size="12" fill="#333">what the person</text>
  <text x="112" y="144" text-anchor="middle" font-size="12" fill="#333">says or does</text>
  <line x1="198" y1="122" x2="242" y2="122" stroke="#020c6d" stroke-width="1.6" marker-start="url(#ov-arrow)" marker-end="url(#ov-arrow)"/>
  <text x="220" y="112" text-anchor="middle" font-size="10.5" fill="#707070">turns</text>
  <rect x="246" y="78" width="164" height="88" rx="8" fill="#e8f2fd" stroke="#4b98e8" stroke-width="1.4"/>
  <text x="328" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5fa8">AI behavior</text>
  <text x="328" y="128" text-anchor="middle" font-size="12" fill="#333">what the AI</text>
  <text x="328" y="144" text-anchor="middle" font-size="12" fill="#333">says or does</text>

  <!-- not seen -->
  <line x1="16" y1="204" x2="424" y2="204" stroke="#b7b7b7" stroke-dasharray="5 5"/>
  <text x="16" y="226" font-size="11" font-weight="700" letter-spacing="0.8" fill="#707070">NOT SEEN IN THE CONVERSATION</text>

  <!-- 3 context, as a condition on the pathway -->
  <rect x="16" y="244" width="176" height="84" rx="10" fill="#f6eefa" stroke="#b079c7" stroke-width="1.6" stroke-dasharray="6 4"/>
  <use href="#ov-badge" x="36" y="266"/><text x="36" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">3</text>
  <text x="54" y="271" font-size="15" font-weight="700" fill="#5b2a74">Context</text>
  <text x="104" y="294" text-anchor="middle" font-size="12" fill="#333">the person and their</text>
  <text x="104" y="310" text-anchor="middle" font-size="12" fill="#333">situation, often never said</text>
  <line x1="194" y1="300" x2="286" y2="300" stroke="#b079c7" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ov-ctx)"/>
  <text x="240" y="292" text-anchor="middle" font-size="10.5" fill="#5b2a74">condition</text>

  <!-- 2 the pathway -->
  <line x1="300" y1="186" x2="300" y2="386" stroke="#676da7" stroke-width="3" marker-end="url(#ov-path)"/>
  <use href="#ov-badge" x="326" y="262"/><text x="326" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">2</text>
  <text x="344" y="261" font-size="14" font-weight="700" fill="#454b86">Pathway</text>
  <text x="344" y="278" font-size="12" fill="#333">may lead to</text>

  <!-- 4 impacts -->
  <rect x="16" y="392" width="408" height="92" rx="12" fill="#fdeaf6" stroke="#e43bb3" stroke-width="1.6"/>
  <use href="#ov-badge" x="36" y="414"/><text x="36" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#020c6d">4</text>
  <text x="54" y="419" font-size="15" font-weight="700" fill="#9c1f78">Impacts</text>
  <text x="136" y="419" font-size="12" fill="#333">effects on the person's wellbeing</text>
  <rect x="80" y="434" width="130" height="36" rx="8" fill="#ffffff" stroke="#404040" stroke-width="1.4"/>
  <text x="145" y="457" text-anchor="middle" font-size="13" font-weight="700" fill="#404040">a harm</text>
  <rect x="230" y="434" width="130" height="36" rx="8" fill="#ffffff" stroke="#1f8a57" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="295" y="457" text-anchor="middle" font-size="13" font-weight="700" fill="#1f8a57">a protection</text>
</svg>
