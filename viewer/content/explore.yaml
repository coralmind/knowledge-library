# The words on the Explore page. Each starter opens Explore from an entry
# (`root`, by permanent id) or from every pathway (`all: true`); `sign` limits
# it to harmful or protective links. A starter whose view would be empty is
# not shown. Entry labels and counts are filled in from the catalog.

title: Follow behavior to harm
intro: >-
  Pick a starting point and see what flows into and out of it: the behaviors,
  the pathways they form, and the impacts those pathways lead to. Every view
  has its own URL.

starters_heading: Start from a question
starters:
  - question: What can go wrong when someone discloses a crisis?
    root: kl-000016
    sign: harmful
  - question: Which AI behaviors build reliance on the AI?
    root: kl-000025
  - question: How can an AI make unusual beliefs harder to test?
    root: kl-000017
  - question: What does a well-handled response protect?
    all: true
    sign: protective
    note: Every pathway with a protective impact
  - question: What changes for younger users?
    root: kl-000630
  - question: How does harm build over time?
    root: kl-000700

map_heading: Or from the map
map_intro: >-
  Pathways counted by the AI behavior group they involve and the area of life
  they reach. Click a cell to open those pathways.
