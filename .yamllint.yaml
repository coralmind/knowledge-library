# Indentation only, so quoting and block scalars in entries stay as authored.
yaml-files:
  - "*.yaml"
  - "*.yml"

rules:
  indentation:
    spaces: 2
    # Dashes stay at the parent key's indent, which is how entries/ is written:
    # `sources:` then `- source:` at that same column, not an extra two spaces.
    indent-sequences: false
    check-multi-line-strings: false
